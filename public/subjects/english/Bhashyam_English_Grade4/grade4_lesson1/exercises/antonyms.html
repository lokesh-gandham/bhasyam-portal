<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antonym</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @font-face {
            font-family: 'CCSyntroman';
            src: url('../assets/CCSYNTRO.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "CCSyntroman";
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .stage {
            width: 100%;
            max-width: 1400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pageHeading {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 10px;
            text-align: center;
            font-size: 23px;
            font-weight: 400;
            line-height: 1.3;
            color:#5D4037;
        }

        /* GAME CONTAINER */
        .game-container {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 150px;
            margin: 40px 0;
        }

        /* SVG CANVAS FOR DRAWING LINES */
        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* ROWS */
        .row {
            display: flex;
            justify-content: center;
            gap: 50px;
            z-index: 2;
            width: 100%;
        }

        /* ITEMS */
        .item {
            width: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 10px 8px;
            background: transparent;
            border: none;
            border-radius: 0;
            cursor: pointer;
            transition: .3s;
        }

        .item img {
            width: 120px;
            height: 100px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .item span {
            width: 100%;
            text-align: center;
            padding: 6px 12px;
            font-size: 24px;
            font-weight: 400;
            color: #333;
            background: #E3F2FD;
            border-radius: 6px;
        }

        .item:hover:not(.matched) {
            transform: translateY(-2px);
        }
   .item.active {
    transform: scale(1.06) translateY(-4px);
    opacity: 1;
}

.item.active span {
    background: #EDE7F6;
    color: #5E4B8B;
    border: 3px solid #B39DDB;
    box-shadow:
        0 0 0 5px rgba(179, 157, 219, 0.18),
        0 6px 14px rgba(126, 87, 194, 0.18);
}

.item.active img {
    transform: scale(1.05);
    filter: drop-shadow(0 5px 8px rgba(126, 87, 194, 0.18));
}

        .item.matched {
            opacity: 1;
        }

        .item.matched span {
            background: #C8E6C9;
            color: #2E7D32;
        }

        .item.wrong {
            animation: shake 0.35s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* POPUP */
        .popup-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .popup-overlay.show {
            display: flex;
            opacity: 1;
        }

        .popup {
            background: #fff;
            width: 350px;
            border-radius: 40px;
            padding: 0;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 3px solid #4CAF50;
            box-shadow: 0 18px 45px rgba(15, 23, 42, .12);
            animation: popupSlide .45s cubic-bezier(.34, 1.56, .64, 1);
        }

        @keyframes popupSlide {
            0% { transform: scale(0.5) translateY(60px) rotate(-5deg); opacity: 0; }
            60% { transform: scale(1.05) translateY(-8px) rotate(2deg); }
            100% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; }
        }

        .popup-top {
            padding: 35px 24px 20px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
        }

        .popup-icon-wrap {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            background: #4CAF50;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            animation: iconPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes iconPop {
            0% { transform: scale(0) rotate(-30deg); }
            60% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .popup-icon-wrap span {
            color: #fff;
        }

        .popup-title {
            font-size: 26px;
            font-weight: 700;
            color: #2E7D32;
        }

        .popup-bottom {
            padding: 18px 24px 22px;
            background: #fff;
        }

        .popup-score {
            font-size: 20px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 8px;
        }

        .popup-stars {
            font-size: 38px;
            letter-spacing: 6px;
            color: #FACC15;
            margin-bottom: 12px;
        }

        .play-again-popup {
            background: #4CAF50;
            color: #fff;
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(76, 175, 80, 0.3);
        }

        .play-again-popup:hover {
            background: linear-gradient(135deg, #16A34A, #15803D);
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(34, 197, 94, .35);
        }
/* ===== FINAL POPUP ===== */

.popup.final{
    background:#FFFFFF;
    border:3px solid #4CAF50;
    box-shadow:0 18px 45px rgba(15,23,42,.12);
}

.popup.final .popup-top{
    background:linear-gradient(135deg,#F8FAFC,#EEF5FB);
}

.popup.final .popup-bottom{
    background:#FFFFFF;
    border-top:2px solid #EDF2F7;
}

.popup.final .popup-title{
    color:#334155;
    font-size:30px;
    font-weight:600;
    letter-spacing:.3px;
}

.popup.final .popup-score{
    color:#0F172A;
    font-size:24px;
    font-weight:500;
    margin:12px 0 15px;
}

.popup.final .popup-stars{
    color:#FACC15;
    font-size:38px;
    letter-spacing:6px;
}

.popup.final .popup-icon-wrap{
    width:95px;
    height:95px;
    background:#F1F5F9;
    border:5px solid #BBF7D0;
    box-shadow:
        0 12px 30px rgba(15,23,42,.08),
        0 0 0 8px rgba(187,247,208,.35);
}

.popup.final .popup-icon-wrap span{
    font-size:52px;
}

.popup.final .play-again-popup{
    height:58px;
    font-size:18px;
    font-weight:700;
}
        /* RESPONSIVE */
        @media (max-width: 768px) {
            body {
                padding: 20px 0 10px;
                align-items: flex-start;
                overflow: auto;
            }
            .row {
                gap: 20px;
                flex-wrap: wrap;
            }
            .item {
                width: 160px;
                padding: 8px 6px;
            }
            .item img {
                width: 120px;
                height: 100px;
            }
            .item span {
                font-size: 18px;
            }
            #line-canvas {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .row {
                gap: 14px;
            }
            .item {
                width: 140px;
                padding: 6px 4px;
            }
            .item img {
                width: 100px;
                height: 85px;
            }
            .item span {
                font-size: 16px;
            }
            .popup {
                width: 280px;
            }
        }

        /* @media screen and (min-width: 1024px) and (max-width: 1440px) {
            .item {
                width: 200px;
            }
            .item img {
                width: 140px;
                height: 115px;
            }
            .item span {
                font-size: 22px;
            }
        } */

        @media screen and (min-width: 1441px) {
            .item {
                width: 280px;
            }
            .item img {
                width: 210px;
                height: 170px;
            }
            .item span {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <main class="stage">
        <h2 class="pageHeading">Match the antonyms</h2>

        <div class="game-container">
            <svg id="line-canvas"></svg>
            <div class="row top-row" id="topRow"></div>
            <div class="row bottom-row" id="bottomRow"></div>
        </div>
    </main>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup" id="popupBox"></div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
      const topData = [
    { id: "a", text: "Dirty", match: "Clean", image: "../images/dirty1.png" },
    { id: "b", text: "Slow",  match: "Fast",  image: "../images/slow.png" },
    { id: "c", text: "Hot",   match: "Cold",  image: "../images/hot.png" },
    { id: "d", text: "Full",  match: "Empty", image: "../images/full.png" }
];
const bottomData = [
    { no: "1", match: "Cold",  text: "Cold",  image: "../images/cold.png" },
    { no: "2", match: "Empty", text: "Empty", image: "../images/empty.png" },
    { no: "3", match: "Fast",  text: "Fast",  image: "../images/fastimg.png" },
    { no: "4", match: "Clean", text: "Clean", image: "../images/clean1.png" }
];

        let selectedTop = null;
        let matchesFound = 0;
        let connections = [];

        const topRow = document.getElementById("topRow");
        const bottomRow = document.getElementById("bottomRow");
        const svg = document.getElementById("line-canvas");
        const overlay = document.getElementById("popupOverlay");
        const popupBox = document.getElementById("popupBox");

        function speakText(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function init() {
            topRow.innerHTML = "";
            bottomRow.innerHTML = "";
            svg.innerHTML = "";
            connections = [];
            selectedTop = null;
            matchesFound = 0;

            topData.forEach((item) => {
                const div = document.createElement("div");
                div.className = "item";
                div.dataset.match = item.match;
                div.innerHTML = `
                    <img src="${item.image}" alt="${item.text}">
                   <span>${item.id}. ${item.text}</span>
                `;
                div.onclick = () => {
                    if (div.classList.contains("matched")) return;
                    document.querySelectorAll(".top-row .item").forEach((i) => i.classList.remove("active"));
                    div.classList.add("active");
                    selectedTop = div;
                };
                topRow.appendChild(div);
            });

            bottomData.forEach((item) => {
                const div = document.createElement("div");
                div.className = "item";
                div.dataset.id = item.match;
                div.innerHTML = `
                  <span>${item.no}. ${item.text}</span>
                    <img src="${item.image}" alt="${item.text}">
                `;
                div.onclick = () => {
                    if (!selectedTop || div.classList.contains("matched")) return;
                    if (selectedTop.dataset.match === div.dataset.id) {
                        handleMatch(selectedTop, div);
                    } else {
                        handleWrong(div);
                    }
                };
                bottomRow.appendChild(div);
            });
        }

        function handleMatch(topEl, bottomEl) {
            matchesFound++;
            topEl.classList.add("matched");
            bottomEl.classList.add("matched");
            topEl.classList.remove("active");
            drawCurve(topEl, bottomEl);
            connections.push({ from: topEl, to: bottomEl });
            selectedTop = null;
            speakText('Correct');
            confetti({ particleCount: 40, angle: 60, spread: 55, origin: { x: 0, y: 0.8 } });
            confetti({ particleCount: 40, angle: 120, spread: 55, origin: { x: 1, y: 0.8 } });
            if (matchesFound === topData.length) {
                setTimeout(showFinalPopup, 800);
            }
        }

        function handleWrong(bottomEl) {
            speakText('Try again');
            bottomEl.classList.add("wrong");
            setTimeout(() => bottomEl.classList.remove("wrong"), 600);
        }
function drawCurve(el1, el2) {
    if (window.getComputedStyle(svg).display === "none") return;

    const box1 = el1.querySelector("span").getBoundingClientRect();
    const box2 = el2.querySelector("span").getBoundingClientRect();
    const containerRect = svg.getBoundingClientRect();

    // Bottom center of top word box
    const x1 = box1.left + box1.width / 2 - containerRect.left;
    const y1 = box1.bottom - containerRect.top;

    // Top center of bottom word box
    const x2 = box2.left + box2.width / 2 - containerRect.left;
    const y2 = box2.top - containerRect.top;

    const midY = (y1 + y2) / 2;
    const dx = Math.abs(x2 - x1);
    const curveStrength = Math.min(dx * 0.6, 120);
    const dir = x2 > x1 ? 1 : -1;

    const cx1 = x1 + dir * curveStrength;
    const cy1 = y1 + (midY - y1) * 0.5;

    const cx2 = x2 - dir * curveStrength;
    const cy2 = y2 - (y2 - midY) * 0.5;

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute(
        "d",
        `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`
    );
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#90A4AE");
    path.setAttribute("stroke-width", "3");
    path.setAttribute("stroke-linecap", "round");

    svg.appendChild(path);
}

        function showFinalPopup() {
            let end = Date.now() + (1.5 * 1000);
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());

          popupBox.className = 'popup final';
            popupBox.innerHTML = `
                <div class="popup-top">
                    <div class="popup-icon-wrap"><span>👑</span></div>
                    <div class="popup-title">Congratulations!</div>
                </div>
                <div class="popup-bottom">
                    <div class="popup-score">Score: ${topData.length}/${topData.length}</div>
                    <div class="popup-stars">⭐⭐⭐</div>
                    <button class="play-again-popup" id="playAgainBtn">Play Again</button>
                </div>
            `;
            overlay.classList.add('show');
            document.getElementById('playAgainBtn').addEventListener('click', () => {
                overlay.classList.remove('show');
                init();
            });
        }

        window.addEventListener("resize", () => {
            svg.innerHTML = "";
            connections.forEach((c) => drawCurve(c.from, c.to));
        });

        init();
    </script>
</body>

</html>
