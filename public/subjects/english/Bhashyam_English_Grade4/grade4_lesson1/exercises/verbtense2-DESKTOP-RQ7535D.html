/*====================================================
        WORKSHEET LAYOUT
====================================================*/
.worksheet-area{

    width:100%;

    display:grid;

    grid-template-columns:300px 110px 420px;

    grid-template-areas:
        "leftHeader . rightHeader"
        "left1 connector1 right1"
        "left2 connector2 right2"
        "left3 connector3 right3";

    justify-content:center;
    align-items:center;

    column-gap:40px;
    row-gap:10px;
    margin-top: -20px;

}
/*======================
        HEADERS
=======================*/

.worksheet-header{
    width:180px;
    height:54px;

    border-radius:30px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#fff;
    font-size:22px;
    font-weight:400;

    justify-self:center;

    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.left-title{
    background:linear-gradient(135deg,#4F93FF,#357BEB);
}

.right-title{
    background:linear-gradient(135deg,#63D37B,#47B65D);
}

.verb-label{

    width:300px;          /* decrease from full width */
    height:65px;

    justify-self:center;     /* align toward connector */

    background:#fff;
    border:2px solid #6FA8FF;
    border-radius:24px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:22px;
    color:#3E73D8;
  
}
.left-title{
    grid-area:leftHeader;
}

.right-title{
    grid-area:rightHeader;
}

.v2-label{
    grid-area:left1;
}

.v3-label{
    grid-area:left2;
}

.v4-label{
    grid-area:left3;
}

.c1{
    grid-area:connector1;
}

.c2{
    grid-area:connector2;
}

.c3{
    grid-area:connector3;
}

.a1{
    grid-area:right1;
}

.a2{
    grid-area:right2;
}

.a3{
    grid-area:right3;
}

}

.btn{

    position:relative;

    overflow:hidden;

    width:130px;

    height:55px;

    border:none;

    outline:none;

    border-radius:16px;

    cursor:pointer;

    color:#ffffff;

    font-size:20px;

    font-weight:500;

    letter-spacing:.3px;

    transition:.25s;

    box-shadow:
    0 8px 20px rgba(0,0,0,.12);

}

.btn::before{

    content:"";

    position:absolute;

    top:0;

    left:-150%;

    width:50%;

    height:100%;

    background:
    linear-gradient(
    90deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.45) 50%,
    rgba(255,255,255,0) 100%);

    transform:skewX(-25deg);

    animation:glassShine 3.5s infinite;

}

.btn:hover:not(:disabled){

    transform:translateY(-3px);

    box-shadow:
    0 12px 24px rgba(0,0,0,.18);

}
.btn:active:not(:disabled){

    transform:translateY(0);

}

.btn i{

    font-size:18px;

    margin:0 6px;

}

.prev-btn{

    background:
    linear-gradient(
    135deg,
    #FFC371 0%,
    #FFB347 100%);

}
.check-btn{

    width:150px;

    background:
    linear-gradient(
    135deg,
    #43C463 0%,
    #2EAD47 100%);

}
.next-btn{

    background:
    linear-gradient(
    135deg,
    #5BA3FF 0%,
    #4A90E2 100%);

}

.btn:disabled{

    opacity:.45;

    cursor:not-allowed;

    box-shadow:none;

}

.btn:focus{

    outline:none;

}
.btn span{

    font-weight:600;

}
.popup-overlay{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    z-index:9999;

    opacity:0;

    transition:opacity .35s ease;


}

.popup-overlay.show{

    display:flex;

    opacity:1;

}
.popup{
    background:#fff;
    width:350px;
    border-radius:40px;
    padding:0;
    text-align:center;
    position:relative;
    overflow:hidden;

    border:1px solid rgba(255,255,255,.9);

    /* Premium Floating Shadow */
    box-shadow:
        0 2px 6px rgba(0,0,0,.05),
        0 10px 18px rgba(0,0,0,.08),
        0 22px 35px rgba(0,0,0,.12),
        0 45px 70px rgba(0,0,0,.18),
        0 70px 110px rgba(0,0,0,.10);

    animation: popupSlide .45s cubic-bezier(.34,1.56,.64,1);
}
.popup{
    box-shadow:
        0 0 0 1px rgba(255,255,255,.7),
        0 8px 16px rgba(0,0,0,.06),
        0 18px 36px rgba(0,0,0,.10),
        0 35px 70px rgba(0,0,0,.18),
        0 0 40px rgba(255,255,255,.25);
}


@keyframes popupSlide{

0%{

opacity:0;

transform:
scale(.45)
translateY(60px)
rotate(-6deg);

}

60%{

transform:
scale(1.05)
translateY(-8px)
rotate(2deg);

}

100%{

opacity:1;

transform:
scale(1)
translateY(0)
rotate(0);

}

}
.popup-top{

    padding:34px 24px 22px;

    position:relative;

}
.popup.correct .popup-top{

background:
linear-gradient(
135deg,
#E8F5E9,
#C8E6C9);

}

.popup.wrong .popup-top{

background:
linear-gradient(
135deg,
#FBE9E7,
#FFCCBC);

}

.popup.final .popup-top{

background:
linear-gradient(
135deg,
#FFF3E0,
#FFE0B2);

}
.popup-title{

    margin-top:14px;

    font-size:26px;

    font-weight:700;

    color:#1A1A2E;

    text-align:center;

    letter-spacing:-.3px;

}
.popup-bottom{

    background:#ffffff;

    padding:22px 26px 24px;

}

.popup.correct .popup-bottom{

border-top:2px solid #C8E6C9;

}

.popup.wrong .popup-bottom{

border-top:2px solid #FFCCBC;

}

.popup.final .popup-bottom{

border-top:2px solid #FFE0B2;

}

.popup-msg{

    text-align:center;

    color:#5A5270;

    font-size:18px;

    font-weight:500;

    line-height:1.5;

}
.popup-score{

    text-align:center;

    font-size:22px;

    font-weight:700;

    color:#2D2A4A;

    margin-bottom:12px;

}

.popup-stars{

    text-align:center;

    font-size:34px;

    letter-spacing:6px;

    margin-bottom:18px;

    animation:starDance .8s ease;

}


@keyframes starDance{

0%{

opacity:0;

transform:
scale(0)
rotate(-20deg);

}

50%{

transform:
scale(1.25)
rotate(10deg);

}

100%{

opacity:1;

transform:
scale(1)
rotate(0);

}

}

.popup-icon-wrap{

    width:90px;

}
.popup.final .popup-icon-wrap{

    background:#ffffff;

    animation:
    iconPop .6s cubic-bezier(.34,1.56,.64,1),

}

}

.popup-title{

}

.popup-score{

}

.popup-stars{

}

.popup{

width:270px;

border-radius:24px;

}

.popup-top{

.popup-bottom{

}

}

}

.popup-msg{

}

.popup-score{

}

.popup-stars{

letter-spacing:4px;

}

}

.v1-display,
.verb-card input,
.heading,
.sub-heading,
.verb-word {
    text-transform: capitalize;
}


@media (max-width:768px){
    .page-heading{
        font-size:28px;
    }
}

@media (max-width:480px){
    .page-heading{
        font-size:22px;
        margin-bottom:6px;
    }
}

/* ===========================
   Large Monitor (1441px–1920px)
=========================== */
@media screen and (min-width:1441px) and (max-width:1920px){

    .stage{
        max-width:1650px;
        gap:28px;
    }

    .page-heading{
        font-size:34px;
    }

    .v1-question{
        font-size:42px;
        margin-top:-20px;
    }

    .image-box{
        height:190px;
        margin-bottom:25px;
    }

    .image-box img{
        max-height:190px;
    }

    .worksheet-area{

        grid-template-columns:340px 150px 340px;

        column-gap:90px;
        row-gap:22px;

        justify-content:center;
        align-items:center;
    }

    .worksheet-header{
        width:230px;
        height:60px;
        font-size:28px;
    }

    .verb-label{
        width:340px;
        height:74px;
        font-size:28px;
        border-radius:24px;
    }

    .answer-box{
        width:340px;
        height:74px;
        border-radius:24px;
    }

    .answer-box input{
        font-size:28px;
    }

    .answer-box input::placeholder{
        font-size:28px;
    }

    .connector{
        width:150px;
    }

    .connector .dot{
        width:20px;
        height:20px;
    }

    .connector .line{
        border-top:4px dashed #4F93FF;
    }

    .connector .arrow{
        font-size:24px;
    }

    .nav-row{
        margin-top:30px;
        gap:70px;
    }

    .btn{
        width: 160px;
                height: 58px;
                font-size: 22px;
    }
}
</style>

</head>

<body>


<div class="help-overlay" id="helpOverlay">
    <div class="help-box">

        <button class="close-help" onclick="closeHelp()">
            <i class="fa-solid fa-xmark"></i>
        </button>

      
</div>

    </div>
</div>
<main class="stage">
<div class="page-heading">
    Fill in the boxes with the correct verb forms
</div>

    <!-- Quiz Area -->
    <div class="quiz-card">

        <!-- Question Area -->
        <div class="question-area">
<div class="v1-question">
    <span class="label">Present (V1):</span>
    <span id="v1Text"></span>
</div>

<div class="image-box">
    <img
        id="verbImage"
        src=""
        alt="Verb Image"
        draggable="false">
</div>

         <div class="worksheet-area">

    <div class="worksheet-header left-title">
        Verb Forms
    </div>

    <div class="worksheet-header right-title">
        Correct Forms
    </div>


    <!-- V2 -->

  <div class="verb-label v2-label">
        Past (V2)
    </div>

  <div class="connector c1">
        <span class="dot"></span>
        <span class="line"></span>
      
        <span class="dot"></span>
    </div>

   <div class="answer-box a1">

        <input
            type="text"
            id="v2Input"
            placeholder="Type V2"
            autocomplete="off">

    </div>



    <!-- V3 -->

    <div class="verb-label v3-label">
        Past Participle (V3)
    </div>

  <div class="connector c2">
        <span class="dot"></span>
        <span class="line"></span>
        <!-- <span class="arrow">
            <i class="fa-solid fa-arrow-right"></i>
        </span> -->
        <span class="dot"></span>
    </div>

   <div class="answer-box a2">

        <input
            type="text"
            id="v3Input"
            placeholder="Type V3"
            autocomplete="off">

    </div>



    <!-- V4 -->

  <div class="verb-label v4-label">
        Present Participle (V4)
    </div>

   <div class="connector c3">
        <span class="dot"></span>
        <span class="line"></span>
        <!-- <span class="arrow">
            <i class="fa-solid fa-arrow-right"></i>
        </span> -->
        <span class="dot"></span>
    </div>

<div class="answer-box a3">
        <input
            type="text"
            id="v4Input"
            placeholder="Type V4"
            autocomplete="off">

    </div>

</div>
    <div class="nav-row">

        <button
            class="btn prev-btn"
            id="prevBtn"
            disabled>

            <i class="fa-solid fa-angles-left"></i>

            Prev

        </button>

        <button
            class="btn check-btn"
            id="checkBtn">

            <i class="fa-solid fa-circle-check"></i>

            Check

        </button>



        <button
            class="btn next-btn"
            id="nextBtn"
            disabled>

            Next

            <i class="fa-solid fa-angles-right"></i>

        </button>

    </div>

</main>



<!-- Popup -->

<div class="popup-overlay" id="popupOverlay">

    <div class="popup" id="popupBox">

    </div>

</div>



<!-- Sounds -->

<audio
id="correctSound"
src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3">
</audio>

<audio
id="wrongSound"
src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3">
</audio>

<script>
const questions = [
{
    v1: "tie",
    img: "../images/tie.png",
    v2: "tied",
    v3: "tied",
    v4: "tying"
},
{
    v1: "forgive",
    img: "../images/forgive.png",
    v2: "forgave",
    v3: "forgiven",
    v4: "forgiving"
},
{
    v1: "worry",
    img: "../images/worry.png",
    v2: "worried",
    v3: "worried",
    v4: "worrying"
},
{
    v1: "wait",
    img: "../images/wait.png",
    v2: "waited",
    v3: "waited",
    v4: "waiting"
},
{
    v1: "send",
    img: "../images/send.png",
    v2: "sent",
    v3: "sent",
    v4: "sending"
},
{
    v1: "take",
    img: "../images/take.png",
    v2: "took",
    v3: "taken",
    v4: "taking"
},
{
    v1: "cheat",
    img: "../images/cheat.png",
    v2: "cheated",
    v3: "cheated",
    v4: "cheating"
},
{
    v1: "withstand",
    img: "../images/withstand.png",
    v2: "withstood",
    v3: "withstood",
    v4: "withstanding"
},
{
    v1: "light",
    img: "../images/light_kids.png",
    v2: "lit",
    v3: "lit",
    v4: "lighting"
},
{
    v1: "hang",
    img: "../images/hang.png",
    v2: "hung",
    v3: "hung",
    v4: "hanging"
}
];
let current = 0;

let score = 0;
let currentStep = 2;   // 2 = V2, 3 = V3, 4 = V4

const answers =
new Array(questions.length).fill(false);
const v1Word =
document.getElementById("v1Word");

const verbImage =
document.getElementById("verbImage");
verbImage.draggable = false;

verbImage.addEventListener("dragstart", function (e) {
    e.preventDefault();
    return false;
});

const v2Input =
document.getElementById("v2Input");

const v3Input =
document.getElementById("v3Input");

const v4Input =
document.getElementById("v4Input");
const prevBtn =
document.getElementById("prevBtn");

const nextBtn =
document.getElementById("nextBtn");

const checkBtn =
document.getElementById("checkBtn");

const popupOverlay =
document.getElementById("popupOverlay");

const popupBox =
document.getElementById("popupBox");

const correctSound =
document.getElementById("correctSound");

const wrongSound =
document.getElementById("wrongSound");

function renderQuestion(){

const q = questions[current];
document.getElementById("v1Text").textContent =
    q.v1.charAt(0).toUpperCase() + q.v1.slice(1);
verbImage.src = q.img;

v2Input.value="";
v3Input.value="";
v4Input.value="";

v2Input.disabled=false;
v3Input.disabled=false;
v4Input.disabled=false;
currentStep = 2;

v2Input.focus();
v3Input.disabled = true;
v4Input.disabled = true;
v2Input.className="";
v3Input.className="";
v4Input.className="";

prevBtn.disabled = current===0;

nextBtn.disabled = true;
checkBtn.disabled = true;
updateCheckButton();
if(answers[current]){
v2Input.value = q.v2.charAt(0).toUpperCase() + q.v2.slice(1);
v3Input.value = q.v3.charAt(0).toUpperCase() + q.v3.slice(1);
v4Input.value = q.v4.charAt(0).toUpperCase() + q.v4.slice(1);
v2Input.disabled=true;
v3Input.disabled=true;
v4Input.disabled=true;
v2Input.classList.add("correct-input");
v2Input.parentElement.classList.add("correct");
v3Input.classList.add("correct-input");
v3Input.parentElement.classList.add("correct");

v4Input.classList.add("correct-input");
v4Input.parentElement.classList.add("correct");

nextBtn.disabled =
(current===questions.length-1);

}

}
nextBtn.addEventListener("click",()=>{

if(current>=questions.length-1)
return;

current++;

renderQuestion();

});

prevBtn.addEventListener("click",()=>{

if(current<=0)
return;

current--;

renderQuestion();

});
function updateCheckButton(){

    if(currentStep === 2){
        checkBtn.disabled = v2Input.value.trim()==="";
    }
    else if(currentStep === 3){
        checkBtn.disabled = v3Input.value.trim()==="";
    }
    else if(currentStep === 4){
        checkBtn.disabled = v4Input.value.trim()==="";
    }
}
function speakText(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-UK";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }
function fireConfetti(){

confetti({

particleCount:40,

angle:60,

spread:55,

origin:{x:0}

});

confetti({

particleCount:40,

angle:120,

spread:55,

origin:{x:1}

});

}

function clearInputStyles(){

v2Input.className="";

v3Input.className="";

v4Input.className="";

 v2Input.parentElement.classList.remove("correct","wrong");
    v3Input.parentElement.classList.remove("correct","wrong");
    v4Input.parentElement.classList.remove("correct","wrong");


}
checkBtn.addEventListener("click", checkAnswer);
function checkAnswer(){

    const q = questions[current];

    // ---------------- V2 ----------------

    if(currentStep===2){

        if(v2Input.value.trim().toLowerCase()===q.v2.toLowerCase()){

            v2Input.classList.remove("wrong-input");
            v2Input.classList.add("correct-input");
            v2Input.disabled=true;

            currentStep=3;

            v3Input.disabled=false;
            v3Input.focus();

            checkBtn.disabled=true;
correctSound.currentTime = 0;
correctSound.play();

speakText("Correct");

showCorrectPopup();
        }else{

          v2Input.classList.add("wrong-input");
v2Input.parentElement.classList.add("wrong");

            wrongSound.currentTime=0;
            wrongSound.play();

            speakText("Try Again");

            showWrongPopup();

           setTimeout(() => {
    v2Input.value = "";
    v2Input.classList.remove("wrong-input");
    v2Input.parentElement.classList.remove("wrong"); // Remove red border
    checkBtn.disabled = true;
    v2Input.focus();
}, 1200);

        }

        return;
    }

    // ---------------- V3 ----------------

    if(currentStep===3){

        if(v3Input.value.trim().toLowerCase()===q.v3.toLowerCase()){

            v3Input.classList.remove("wrong-input");
            v3Input.classList.add("correct-input");
            v3Input.disabled=true;

            currentStep=4;

            v4Input.disabled=false;
            v4Input.focus();

            checkBtn.disabled=true;
correctSound.currentTime = 0;
correctSound.play();
fireConfetti();
speakText("Correct");

showCorrectPopup();

        }else{

            v3Input.classList.add("wrong-input");
v3Input.parentElement.classList.add("wrong");
            wrongSound.currentTime=0;
            wrongSound.play();

            speakText("Try Again");

            showWrongPopup();

            setTimeout(()=>{
                v3Input.value="";
                v3Input.classList.remove("wrong-input");
                checkBtn.disabled=true;
                v3Input.focus();
            },1200);

        }

        return;
    }

    // ---------------- V4 ----------------

    if(currentStep===4){

        if(v4Input.value.trim().toLowerCase()===q.v4.toLowerCase()){

            v4Input.classList.remove("wrong-input");
            v4Input.classList.add("correct-input");
            v4Input.disabled=true;

            answers[current]=true;
            score++;

            fireConfetti();

            correctSound.currentTime=0;
            correctSound.play();

            speakText("Correct");
            fireConfetti();

            showCorrectPopup();

            nextBtn.disabled=(current===questions.length-1);

            if(current===questions.length-1){
                setTimeout(showFinalPopup,1500);
            }

            checkBtn.disabled=true;

        }else{

           v4Input.classList.add("wrong-input");
v4Input.parentElement.classList.add("wrong");
            wrongSound.currentTime=0;
            wrongSound.play();

            speakText("Try Again");

            showWrongPopup();

            setTimeout(()=>{
                v4Input.value="";
                v4Input.classList.remove("wrong-input");
                checkBtn.disabled=true;
                v4Input.focus();
            },1200);

        }
    }
}
function showCorrectPopup(){

popupBox.className="popup correct";

popupBox.innerHTML=`

<div class="popup-top">

    <div class="popup-icon-wrap">

        <span>🌟</span>

    </div>

    <div class="popup-title">

        Excellent!

    </div>

</div>

<div class="popup-bottom">

    <div class="popup-msg">

        Awesome! You got it right! 🎉

    </div>

</div>

`;

popupOverlay.classList.add("show");

setTimeout(()=>{

popupOverlay.classList.remove("show");

},1500);

}


function showWrongPopup(msg=" Nice try! Give it another shot. 😊"){

popupBox.className="popup wrong";

popupBox.innerHTML=`

<div class="popup-top">

    <div class="popup-icon-wrap">

        <span>🤔</span>

    </div>

    <div class="popup-title">

        Keep Trying

    </div>

</div>

<div class="popup-bottom">

    <div class="popup-msg">

        ${msg}

    </div>

</div>

`;

popupOverlay.classList.add("show");

setTimeout(()=>{

popupOverlay.classList.remove("show");

},1400);

}

function showWrongPopup(msg="Don't give up! 💪"){

popupBox.className="popup wrong";

popupBox.innerHTML=`

<div class="popup-top">

    <div class="popup-icon-wrap">

        <span>💪</span>

    </div>

    <div class="popup-title">

        Keep Trying

    </div>

</div>

<div class="popup-bottom">

    <div class="popup-msg">

        ${msg}

    </div>

</div>

`;

popupOverlay.classList.add("show");

setTimeout(()=>{

popupOverlay.classList.remove("show");

},1400);

}

function capitalizeFirstLetter(input) {
    input.addEventListener("input", function () {
        if (this.value.length > 0) {
            this.value =
                this.value.charAt(0).toUpperCase() +
                this.value.slice(1).toLowerCase();
        }
        updateCheckButton();
    });
}

capitalizeFirstLetter(v2Input);
capitalizeFirstLetter(v3Input);
capitalizeFirstLetter(v4Input);

function showFinalPopup(){

    let end = Date.now() + (1500);

    (function frame(){

        confetti({
            particleCount:3,
            angle:60,
            spread:55,
            origin:{x:0}
        });

        confetti({
            particleCount:3,
            angle:120,
            spread:55,
            origin:{x:1}
        });

        if(Date.now() < end){
            requestAnimationFrame(frame);
        }

    })();

    popupBox.className = "popup final";

    popupBox.innerHTML = `

    <div class="popup-top">

        <div class="popup-icon-wrap">

            <span>👑</span>

        </div>

        <div class="popup-title">

            Congratulations!

        </div>

    </div>

    <div class="popup-bottom">

        <div class="popup-score">

            Score :${score} / ${questions.length}

        </div>

        <div class="popup-stars">

            ${getStars()}

        </div>

        <div class="popup-msg">

         

        </div>

        <br>

        <button
            class="play-again-popup"
            id="playAgainBtn">

            <i class="fa-solid fa-rotate-right"></i>

            Play Again

        </button>

    </div>

    `;

    popupOverlay.classList.add("show");

    document
        .getElementById("playAgainBtn")
        .addEventListener("click",resetGame);

}
function getStars() {

    const percent = score / questions.length;

    if (percent === 1)
        return "⭐⭐⭐";      // 5 Stars

    if (percent >= 0.80)
        return "⭐⭐⭐⭐";        // 4 Stars

    if (percent >= 0.60)
        return "⭐⭐⭐";         // 3 Stars

    if (percent >= 0.40)
        return "⭐⭐";          // 2 Stars

    return "⭐";               // 1 Star
}



function getMessage(){

    const percent = score / questions.length;

    if(percent===1)
        return "Excellent! Perfect Score! 🎉";

    if(percent>=0.70)
        return "Great Job! Keep Learning! 😊";

    if(percent>=0.40)
        return "Nice Work! Practice More! 👍";

    return "Don't Give Up! Try Again 💪";

}



function resetGame(){

    popupOverlay.classList.remove("show");

    score = 0;

    current = 0;

    for(let i=0;i<answers.length;i++){

        answers[i]=false;

    }

    clearInputs();

    renderQuestion();

}


function clearInputs(){

    v2Input.value="";
    v3Input.value="";
    v4Input.value="";

    v2Input.disabled=false;
    v3Input.disabled=false;
    v4Input.disabled=false;
checkBtn.disabled = true;
    clearInputStyles();

}


popupOverlay.addEventListener("click",(e)=>{

    if(e.target===popupOverlay){

        popupOverlay.classList.remove("show");

    }

});

document.addEventListener("keydown",(e)=>{

    if(e.key==="Enter"){

        if(!answers[current]){

            checkAnswer();

        }
        else{

            if(current < questions.length-1){

                current++;

                renderQuestion();

            }

        }

    }

});

function openHelp(){
    document.getElementById("helpOverlay").style.display="flex";
}

function closeHelp(){
    document.getElementById("helpOverlay").style.display="none";
}

document.getElementById("helpOverlay").addEventListener("click",function(e){

    if(e.target===this){
        closeHelp();
    }

});
function focusFirstInput(){

    setTimeout(()=>{

        v2Input.focus();

    },150);

}


const oldRender = renderQuestion;

renderQuestion = function(){

    oldRender();

    focusFirstInput();

};
[v2Input, v3Input, v4Input].forEach(input => {

    input.addEventListener("input", updateCheckButton);

});

renderQuestion();

</script>

</body>

</html>
