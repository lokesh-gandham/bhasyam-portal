<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assessments</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'CCSYBold';
            src: url('./assets/CCSYBOLD.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "CCSYBold";


        }

        body {
            height: 100vh;
            overflow: hidden;
            /* Clean, inviting sky-soft backdrop */
            background: #f4f9fc;
            background-size: 100% 100%;
        }

        .app {
            height: 100vh;
            display: flex;
            background: rgba(255, 255, 255, 0.2);
        }

        .sidebar {
            width: 310px;
            padding: 25px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0px;
        }

        /* ================================
   GLASS CRYSTAL BUTTON
================================ */

        .island-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            height: 78px;
            padding: 0 22px;
            margin-bottom: 18px;
            cursor: pointer;

            border-radius: 22px;

            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1.8px solid rgba(255, 255, 255, .55);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, .08),
                inset 0 1px 1px rgba(255, 255, 255, .8);

            transition: .35s ease;
            overflow: hidden;


        }

        /* Crystal Shine */

        .island-btn::before {
            content: "";
            position: absolute;
            left: -60%;
            top: 0;
            width: 45%;
            height: 100%;

            background: linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, .75),
                    transparent);

            transform: skewX(-25deg);
            transition: .8s;
        }

        .island-btn:hover::before {
            left: 130%;
        }

        /* Hover */


        /* LEFT CONTENT */

        .option-left {

            display: flex;
            align-items: center;
            gap: 18px;
        }

        /* ICON */

        .option-num {

            width: 50px;
            height: 50px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;

            color: white;

            background: linear-gradient(135deg, #4F46E5, #06B6D4);

            box-shadow:
                0 8px 15px rgba(79, 70, 229, .35);

            transition: .35s;
        }

        /* Text */

        .island-btn div:last-child {

            font-size: 20px;

            color: #2f4f4f;
        }

        /* Hover Icon */

        .island-btn:hover .option-num {

            transform: rotate(10deg) scale(1.1);
        }

        .island-btn.active {

            background: rgba(255, 255, 255, .35);

            border: 2px solid rgba(255, 255, 255, .9);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, .15),
                0 0 20px rgba(255, 255, 255, .5);
        }

        /* Check Circle */

        .island-btn.active .option-num {

            background: linear-gradient(135deg, #10B981, #22C55E);

        }

        /* ACTIVE STATE TICK SYSTEM */
        .island-btn.active .option-num {
            background: #ffffff !important;
            box-shadow: inset 4px 4px 4px rgba(0, 0, 0, 0.144), inset -2px -2px 4px rgba(0, 0, 0, 0.144);
        }

        .island-btn.active .option-num::after {
            content: "✔";
        }

        .island-btn.active .option-num span {
            display: none;
        }

        /* CHERISHED INDIVIDUAL VIBRANT THEMES FOR EACH ACTIVE OPTION */
        .o1 .option-num {
            background: linear-gradient(135deg, #ff4f8b, #ff82b2);
        }

        .o2 .option-num {
            background: linear-gradient(135deg, #3B82F6, #38BDF8);
        }

        .o3 .option-num {
            background: linear-gradient(135deg, #22C55E, #4ADE80);
        }

        .o6 .option-num {
            background: linear-gradient(135deg, #8B5CF6, #C084FC);
        }

        .o4 .option-num {
            background: linear-gradient(135deg, #F59E0B, #FACC15);
        }

        /* ===========================
   ACTIVE BUTTON
=========================== */

        .island-btn.active {
            transform: translateX(8px);
            border: 2px solid transparent;
            box-shadow: none;
            color: #2f4f4f;
        }



        /* Pink */
        .o1.active {
            background: #FFE8F1;
            border-color: #F8BBD3;
            color: #D63384;
        }

        /* Blue */
        .o2.active {
            background: #E8F4FF;
            border-color: #B8DBFF;
            color: #2563EB;
        }

        /* Green */
        .o3.active {
            background: #EAFBF0;
            border-color: #BFECCF;
            color: #16A34A;
        }

        /* Purple */
        .o6.active {
            background: #F3ECFF;
            border-color: #D8C5FF;
            color: #7C3AED;
        }

        /* Orange */
        .o4.active {
            background: #FFF7E8;
            border-color: #FFE0A6;
            color: #D97706;
        }

        .island-btn.active .option-num {
            background: white;
            color: inherit;
            transform: scale(1.08);
            box-shadow: none;
        }

        .island-btn.active .option-num::after {
            content: "✔";
            font-size: 18px;

        }

        .island-btn.active .option-num span {
            display: none;
        }

        .main {
            flex: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* MOBILE GRAPHICS PRESERVATION */
        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:1065px) {
            .app {
                flex-direction: column;
            }

            .sidebar {
                display: none;
            }

            iframe {
                border-radius: 0px;
            }

            .menu-btn {
                display: block;
                position: fixed;
                top: 8px;
                right: 15px;
                font-size: 26px;
                background: #3b82f6;
                color: white;
                border: none;
                border-radius: 12px;
                padding: 6px 12px;
                cursor: pointer;
                z-index: 5000;
                box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            }

            .offcanvas {
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.15);
                backdrop-filter: blur(2px);
                display: none;
                z-index: 4000;
            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: 300px;
                height: 100%;
                background: #fdfdfd;
                padding: 0px;
                padding-top: 0px;
                transform: translateX(100%);
                transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
                overflow-y: hidden;
            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
                padding: 20px;
            }

            .offcanvas-panel .island-btn {
                margin-bottom: 12px;
            }
        }

        @media (min-width: 900px) and (max-height: 800px) {
            .app {
                transform: scaleY(0.95);
                transform-origin: top center;
                height: calc(100vh / 0.95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {
            .app {
                transform: scaleY(0.9);
                transform-origin: top center;
                height: calc(100vh / 0.9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {
            .app {
                transform: scaleY(0.85);
                transform-origin: top center;
                height: calc(100vh / 0.85);
            }
        }

        @media (min-width: 900px) and (max-height: 500px) {
            .app {
                transform: scaleY(0.8);
                transform-origin: top center;
                height: calc(100vh / 0.8);
            }
        }

        @media screen and (min-width: 1025px) and (max-width: 1440px) {
            .sidebar {
                width: 310px;
                padding: 26px 22px;
                gap: 24px;
            }

            .island-btn {
                font-size: 20px;
                padding: 18px 22px;
            }

            .option-num {
                width: 40px;
                height: 40px;
                font-size: 15px;
            }
        }

        @media screen and (min-width:1441px) and (max-width:1920px) {

            .sidebar {
                width: 400px;
                padding: 35px 28px;
                gap: 18px;
            }

            .island-btn {

                height: 90px;

                padding: 0 28px;

                border-radius: 28px;

                margin-bottom: 10px;

                border: 2px solid rgba(255, 255, 255, .55);

                background: rgba(255, 255, 255, .32);

                backdrop-filter: blur(22px);

                transition: .35s;
            }

            .option-left {
                gap: 22px;
            }

            .option-num {

                width: 60px;
                height: 60px;

                font-size: 24px;
            }

            .island-btn div:last-child {

                font-size: 24px;

            }

        }

        @media screen and (min-width:1921px) {

            .sidebar {

                width: 460px;

                padding: 45px 35px;

                gap: 24px;
            }

            .island-btn {

                height: 110px;

                padding: 0 34px;

                border-radius: 34px;

                border: 2px solid rgba(255, 255, 255, .55);

                background: rgba(255, 255, 255, .35);

                backdrop-filter: blur(24px);

                margin-bottom: 24px;
            }

            .option-left {
                gap: 28px;
            }

            .option-num {

                width: 72px;
                height: 72px;

                font-size: 28px;
            }

            .island-btn div:last-child {

                font-size: 28px;

            }

            iframe {
                border-radius: 40px 0 0 40px;
            }

        }
    </style>
</head>

<body>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="app">
        <div class="sidebar">

            <div class="island-btn o1 active" onclick="openIsland(0)">
                <div class="option-left">
                    <div class="option-num"><span> <i class="fa-solid fa-pen-to-square"></i></span></div>
                    <div>Fill In The Blanks</div>
                </div>
            </div>

            <div class="island-btn o2" onclick="openIsland(1)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-check-double"></i></span></div>
                    <div>Correct Option</div>
                </div>
            </div>
            <div class="island-btn o3" onclick="openIsland(2)">
                <div class="option-left">
                    <div class="option-num">
                        <span><i class="fa-solid fa-underline"></i></span>
                    </div>
                    <div>Phrase Detective</div>
                </div>
            </div>
            <div class="island-btn o3" onclick="openIsland(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-scale-balanced"></i></span></div>
                    <div>Synonym Word</div>
                </div>
            </div>
            <div class="island-btn o6" onclick="openIsland(4)">
                <div class="option-left">
                    <div class="option-num"><span> <i class="fa-solid fa-spell-check"></i></span></div>
                    <div>Antonym Word</div>
                </div>
            </div>
            <div class="island-btn o4" onclick="openIsland(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-link"></i></span></div>
                    <div>Correct Verb</div>
                </div>
            </div>
        </div>
        <div class="main"> <iframe id="contentFrame" src="./exercises/fillintheblanks.html"></iframe> </div>
    </div>
    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">
        <div class="offcanvas-panel" onclick="event.stopPropagation()">
            <div class="island-btn o1 active" onclick="mobileOpen(0)">
                <div class="option-left">
                    <div class="option-num"><span> <i class="fa-solid fa-pen-to-square"></i></span></div>
                    <div>Fill In The Blanks</div>
                </div>
            </div>
            <div class="island-btn o2" onclick="mobileOpen(1)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-circle-check"></i></span></div>
                    <div>Correct Option</div>
                </div>
            </div>
            <div class="island-btn o3" onclick="openIsland(2)">
                <div class="option-left">
                    <div class="option-num">
                        <span><i class="fa-solid fa-underline"></i></span>
                    </div>
                    <div>Phrase Detective</div>
                </div>
            </div>
            <div class="island-btn o3" onclick="mobileOpen(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-scale-balanced"></i></span></div>
                    <div>Synonym Word</div>
                </div>
            </div>
            <div class="island-btn o5" onclick="mobileOpen(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-font"></i></span></div>
                    <div>Antonym Word</div>
                </div>
            </div>
            <div class="island-btn o4" onclick="mobileOpen(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-link"></i></span></div>
                    <div>Correct Verb</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const sidebarButtons = document.querySelectorAll(".sidebar .island-btn"); const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");
        const frame = document.getElementById("contentFrame");
        const pages = [
            "./exercises/fillintheblanks.html",
            "./exercises/mcq.html",
            "./exercises/phrase2.html",
            "./exercises/synonym22.html",
            "./exercises/antonyms.html",
            "./exercises/verbtense2.html",
        ];
        function openIsland(index) {
            sidebarButtons.forEach(btn => btn.classList.remove("active")); sidebarButtons[index].classList.add("active");
            mobileButtons.forEach(btn => btn.classList.remove("active")); mobileButtons[index].classList.add("active");
            frame.src = pages[index];
        }
        function toggleMenu() {
            if (window.innerWidth > 1065) return; document.getElementById("offcanvas").classList.toggle("show");
        }
        function mobileOpen(i) {
            openIsland(i); toggleMenu();
        }
    </script>
</body>

</html>
