<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MCQ Quiz</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
             @font-face {
            font-family: 'CCSyntroman';
            src: url('../assets/CCSYNTRO.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "CCSyntroman";
            font-weight: 400;
        }
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.quiz {
    width: 95%;
    max-width: 1100px;
    border-radius: 40px;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.quiz-layout{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:25px;
    width:100%;
}
.header{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}
#question{
    width:100%;
    font-size:30px;
    color:#2f4f4f;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align:left;
    line-height:1.2;
    min-height: 80px;
    font-weight: normal;
   
}
.question-image{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:15px 0 25px;
    margin-top: -20px;
}

.question-image img{
    width:350px;
    height:250px;
    object-fit:contain;
}
.options{
    width:100%;
    max-width:900px;

    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:20px;
     margin-top: -60px;
}

.option{
    display:flex;
    align-items:center;
    gap:30px;

    height:120px;

    padding:18px;
    border-radius:20px;

    background:#fff;
    border:2px solid #DCE7F8;

    cursor:pointer;
    transition:.25s;

    box-shadow:0 8px 18px rgba(0,0,0,.08);
   
}
.option:hover {
    transform: translateY(-3px) scale(1.02);
}
.option-img{

    width:100px;
    height:100px;

    min-width:80px;

    border-radius:18px;

    display:flex;

    align-items:center;

    justify-content:center;
}
.option-img img{

    width:120px;
    height:120px;

    object-fit:contain;
}
.option-text{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:flex-start;

    height:100%;

    font-size:22px;

    line-height:1.1;

    color:#2f4f4f;

    overflow:hidden;

    text-align:left;
}

.option.correct {
    background: #d3ffdc;
    border: 4px solid #29b44c;
    box-shadow: 0 6px 0 #4fb869;
}

.option.wrong {
    animation: softBlink 0.8s ease;
}

@keyframes softBlink {

    0%,
    100% {
        background: #ffe5e5;
        border-color: #ff9a9a;
        box-shadow: 0 6px 0 #ff9a9a;
    }
}

.option.disabled {
    opacity: .5;
    pointer-events: none;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 150px;
    margin-top: 20px;
}

.controls button {
    width: 150px;
    height: 58px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    border-radius: 35px;
    border: 3px solid #ffffff;
    font-size: 20px;
    font-weight: 400;
    color: #ffffff;
    cursor: pointer;
    background-size: 200% 200%;
    transition: .15s ease;
    margin-top: -20px;
}

.prev {
    background: linear-gradient(#b5dffc, #7fc0eb);
    box-shadow: 0 4px 0 #4da5d4;
}

.next {
    background: linear-gradient(#f1e390, #ecc74e);
    box-shadow: 0 4px 0 #d1a72c;
}

.prev:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #4da5d4;
}

.next:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #d1a72c;
}

.controls button:disabled {
    opacity: .4;
    cursor: not-allowed;
}
/* =====================================================
   POPUP OVERLAY
===================================================== */

.popup-overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    opacity:0;
    transition:opacity .4s ease;
}

.popup-overlay.show{
    display:flex;
    opacity:1;
}


/* =====================================================
   POPUP CARD
===================================================== */
.popup{
    background:#fff;
    width:350px;
    border-radius:40px;
    padding:0;
    text-align:center;
    position:relative;
    overflow:hidden;

    border:1px solid rgba(255,255,255,.9);

    /* Premium Floating Shadow */
    box-shadow:
        0 2px 6px rgba(0,0,0,.05),
        0 10px 18px rgba(0,0,0,.08),
        0 22px 35px rgba(0,0,0,.12),
        0 45px 70px rgba(0,0,0,.18),
        0 70px 110px rgba(0,0,0,.10);

    animation: popupSlide .45s cubic-bezier(.34,1.56,.64,1);
}
.popup{
    box-shadow:
        0 0 0 1px rgba(255,255,255,.7),
        0 8px 16px rgba(0,0,0,.06),
        0 18px 36px rgba(0,0,0,.10),
        0 35px 70px rgba(0,0,0,.18),
        0 0 40px rgba(255,255,255,.25);
}

@keyframes popupSlide{

    0%{
        transform:scale(.5) translateY(60px) rotate(-5deg);
        opacity:0;
    }

    60%{
        transform:scale(1.05) translateY(-8px) rotate(2deg);
    }

    100%{
        transform:scale(1) translateY(0) rotate(0);
        opacity:1;
    }
}


/* =====================================================
   POPUP TOP
===================================================== */

.popup-top{
    padding:35px 24px 20px;
    position:relative;
}


/* =====================================================
   ICON
===================================================== */

.popup-icon-wrap{

    width:90px;
    height:90px;

    margin:0 auto 10px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:50px;

    box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.popup.correct .popup-icon-wrap{
    background:#4CAF50;
    animation:
        iconPop .6s cubic-bezier(.34,1.56,.64,1),
        glowGreen 1.2s ease-in-out infinite alternate;
}

.popup.wrong .popup-icon-wrap{
    background:#EF5350;
    animation:
        iconPop .6s cubic-bezier(.34,1.56,.64,1),
        glowRed 1.2s ease-in-out infinite alternate;
}
.popup.final .popup-icon-wrap{
    background:#ffffff;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.popup-icon-wrap span{
    color:#fff;
}


/* =====================================================
   GLOW ANIMATION
===================================================== */

@keyframes glowGreen{

    from{
        box-shadow:0 0 20px rgba(76,175,80,.3);
    }

    to{
        box-shadow:0 0 40px rgba(76,175,80,.6);
    }
}

@keyframes glowRed{

    from{
        box-shadow:0 0 20px rgba(239,83,80,.3);
    }

    to{
        box-shadow:0 0 40px rgba(239,83,80,.6);
    }
}

@keyframes iconPop{

    0%{
        transform:scale(0) rotate(-30deg);
    }

    60%{
        transform:scale(1.2) rotate(10deg);
    }

    100%{
        transform:scale(1) rotate(0);
    }
}


/* =====================================================
   TITLE
===================================================== */

.popup-title{

    font-size:26px;
    font-weight:700;
    letter-spacing:-.5px;
}


/* =====================================================
   BOTTOM
===================================================== */

.popup-bottom{

    padding:18px 24px 22px;
    background:#fff;
}

.popup-msg{

    font-size:18px;
    font-weight:500;

    line-height:1.45;

    color:#4B5563;
}


/* =====================================================
   SCORE
===================================================== */

.popup-score{

    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    margin:0 auto 12px;

    font-size:20px;
    font-weight:700;

   
}

.popup-score span{
    margin-right:8px;
}

.popup-score strong{

    font-size:20px;
    
}


/* =====================================================
   STARS
===================================================== */

.popup-stars{

    display:flex;
    justify-content:center;
    gap:8px;

    font-size:34px;

    margin:10px auto 18px;

    color:#FFC83D;

    animation:starDance .8s ease;
}

@keyframes starDance{

    0%{
        transform:scale(0) rotate(-20deg);
        opacity:0;
    }

    50%{
        transform:scale(1.3) rotate(10deg);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}


/* =====================================================
   CORRECT
===================================================== */

.popup.correct{

    background:#fff;
    border:3px solid #4CAF50;
}

.popup.correct .popup-top{
    background:#fff;
}

.popup.correct .popup-bottom{
    background:#fff;
    border-top:none;
}

.popup.correct .popup-title{
    color:#2E7D32;
}


/* =====================================================
   WRONG
===================================================== */

.popup.wrong{

    background:#fff;
    border:3px solid #EF5350;
}

.popup.wrong .popup-top{
    background:#fff;
}

.popup.wrong .popup-bottom{
    background:#fff;
    border-top:none;
}

.popup.wrong .popup-title{
    color:#D32F2F;
}
/* =========================
   FINAL POPUP - CLEAN WHITE
========================= */
.popup.final{
    background:#FFFFFF;
    border:3px solid #4CAF50;
    box-shadow:0 18px 45px rgba(15,23,42,.12);
}

.popup.final .popup-top{
    background:linear-gradient(135deg,#F8FAFC,#EEF5FB);
}

.popup.final .popup-bottom{
    background:#FFFFFF;
    border-top:2px solid #EDF2F7;
}

/* Title */

.popup.final .popup-title{
    color:#334155;
    font-size:30px;
    font-weight:700;
    letter-spacing:.3px;
}

/* Score */

.popup.final .popup-score{
    color:#0F172A;
    font-size:24px;
    font-weight:700;
    margin:12px 0 15px;
}

/* Stars */

.popup.final .popup-stars{
    color:#FACC15;
    font-size:38px;
    letter-spacing:6px;
}

/* Trophy Circle */

.popup.final .popup-icon-wrap{
    width:95px;
    height:95px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#F1F5F9;
    border:5px solid #BBF7D0;
    border-radius:50%;

    box-shadow:
        0 12px 30px rgba(15,23,42,.08),
        0 0 0 8px rgba(187,247,208,.35);
}

.popup.final .popup-icon-wrap span{
    font-size:52px;
}

/* Play Again Button */

.popup.final .play-again-popup{
    width:100%;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    border:none;
    border-radius:16px;

    background:#4CAF50;

    color:#fff;
    font-size:18px;
    font-weight:700;

    cursor:pointer;
    transition:.25s;

    box-shadow:0 10px 24px rgba(34,197,94,.28);
}

} */

<body>

    <div class="quiz">

        <div class="quiz-layout">

            <div class="header">
                <h2 id="question"></h2>
                <div class="question-image">
                    <img id="questionImg">
                </div>
            </div>

            <div class="options" id="options"></div>

        </div>

        <div class="controls">
            <button class="prev" id="prevBtn"><i class="fa-solid fa-angles-left"></i> Prev</button>
            <button class="next" id="nextBtn">Next <i class="fa-solid fa-angles-right"></i></button>
        </div>

    </div>

    <div class="popup-overlay" id="popupOverlay">
    <div class="popup" id="popupBox"></div>
</div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
    <script>
        const quizData = [

{
    q:"Q1. Why did Indra steal Sagara's stallion?",
    img:"../images/mcq1.png",
    options:[
        "../images/jealous.png|He was jealous",
        "../images/happy.png|He was happy",
        "../images/brave2.png|He was brave",
        "../images/all.png|All of the above"
    ],
    a:0
},

{
    q:"Q2. What did Sagara's sons assume after seeing the stallion?",
    img:"../images/mcq2.png",
    options:[
        "../images/cunning.png|Kapila was cunning",
        "../images/stolen.png|Kapila had stolen it",
        "../images/greedy.png|Kapila was greedy",
        "../images/brave.png|Kapila was brave"
    ],
    a:1
},

{
    q:"Q3. Why no king was able to perform the penance for many years?",
    img:"../images/mcq33.png",
    options:[
        "../images/lazy1.png|They were lazy",
        "../images/not_intersted1.png|They were not interested",
        "../images/ruling1.png|They were busy ruling",
        "../images/careless1.png|They were careless"
    ],
    a:2
},

{
    q:"Q4. What makes performing penance so difficult?",
    img:"../images/mcq4.png",
    options:[
        "../images/climate.png|Extreme climate",
        "../images/duration.png|Long duration",
        "../images/nofood.png|No food and water",
        "../images/all.png|All of the above"
    ],
    a:3
},

{
    q:"Q5. Who showed the way for Ganga to flow on the ashes of Sagara's sons?",
    img:"../images/mcq5.png",
    options:[
        "../images/sagar.png|Sagara",
        "../images/shiva.png|Lord Shiva",
        "../images/bhagiratha.png|Bhagiratha",
        "../images/kapila.png|Sage Kapila"
    ],
    a:2
}

];

let current = 0;
let score = 0;
let answered = Array(quizData.length).fill(null);

const qEl = document.getElementById("question");
const imgEl = document.getElementById("questionImg");
const optEl = document.getElementById("options");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-US";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

function smallConfetti() {
  confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
}

function bigConfetti() {
  confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } });
}

function loadQuestion() {
  const q = quizData[current];
  qEl.textContent = q.q;
  imgEl.src = q.img;
  optEl.innerHTML = "";
  nextBtn.disabled = answered[current] === null;

  q.options.forEach((t, i) => {
    const d = document.createElement("div");
    d.className = "option o" + ((i % 4) + 1);
const img = t.split("|")[0];
const text = t.split("|")[1];

d.innerHTML = `
    <div class="option-img">
        <img src="${img}" alt="">
    </div>

    <div class="option-text">
        ${text}
    </div>
`;

    if (answered[current] !== null) {
      if (i === q.a) d.classList.add("correct");
      else d.classList.add("disabled");
    }

    d.onclick = () => {
      if (answered[current] !== null) return;

      if (i === q.a) {
        answered[current] = i;
        score++;

        d.classList.add("correct");
        [...optEl.children].forEach((o) => {
          if (o !== d) o.classList.add("disabled");
        });

        speak("Correct");
        smallConfetti();
       showCorrectPopup();  nextBtn.disabled = false;

        if (answered.every((a) => a !== null)) setTimeout(showFinal, 1600);
      } else {
        speak("Try again");
      showWrongPopup();
        d.classList.add("wrong");
        setTimeout(() => {
          d.classList.remove("wrong");
        }, 700);
      }
    };

    optEl.appendChild(d);
  });

  prevBtn.disabled = current === 0;
}

prevBtn.onclick = () => {
  current--;
  loadQuestion();
};

nextBtn.onclick = () => {
  current++;
  loadQuestion();
};
function showCorrectPopup() {

    speak("Correct");

    smallConfetti();

    const overlay = document.getElementById("popupOverlay");
    const popupBox = document.getElementById("popupBox");

    popupBox.className = "popup correct";

    popupBox.innerHTML = `
        <div class="popup-top">
            <div class="popup-icon-wrap">
                <span>🌟</span>
            </div>

            <div class="popup-title">
                Excellent!
            </div>
        </div>

        <div class="popup-bottom">
            <div class="popup-msg">
                Awesome! You got it right! 🎉
            </div>
        </div>
    `;

    overlay.classList.add("show");

    setTimeout(() => {
        overlay.classList.remove("show");
    }, 1500);
}
function showWrongPopup() {

    speak("Try again");

    const overlay = document.getElementById("popupOverlay");
    const popupBox = document.getElementById("popupBox");

    popupBox.className = "popup wrong";

    popupBox.innerHTML = `
        <div class="popup-top">
            <div class="popup-icon-wrap">
                <span>🤔</span>
            </div>

            <div class="popup-title">
                Oops!
            </div>
        </div>

        <div class="popup-bottom">
            <div class="popup-msg">
                Nice try! Give it another shot. 😊
            </div>
        </div>
    `;

    overlay.classList.add("show");

    setTimeout(() => {
        overlay.classList.remove("show");
    }, 1500);
}
function showFinal() {

    let end = Date.now() + 1500;

    (function frame() {

        confetti({
            particleCount:3,
            angle:60,
            spread:55,
            origin:{x:0}
        });

        confetti({
            particleCount:3,
            angle:120,
            spread:55,
            origin:{x:1}
        });

        if(Date.now() < end){
            requestAnimationFrame(frame);
        }

    })();

    const overlay = document.getElementById("popupOverlay");
    const popupBox = document.getElementById("popupBox");

    popupBox.className = "popup final";

    popupBox.innerHTML = `
        <div class="popup-top">
            <div class="popup-icon-wrap">
                <span>👑</span>
            </div>

            <div class="popup-title">
                Congratulations!
            </div>
        </div>

        <div class="popup-bottom">

            <div class="popup-score">
                <span>Score:</span>
                <strong>${score}/${quizData.length}</strong>
            </div>

            <div class="popup-stars">
                ⭐⭐⭐
            </div>

            <button class="play-again-popup" id="playAgainBtn">
                Play Again
            </button>

        </div>
    `;

    overlay.classList.add("show");

    document.getElementById("playAgainBtn").onclick = () => {
        location.reload();
    };
}

loadQuestion();
