    .popup-overlay{

    ===================================================== */
    .popup{
        background:#fff;

    }
    .popup{

            0 0 40px rgba(255,255,255,.25);
    }


    @keyframes popupSlide{

        0%{
            transform:scale(.5) translateY(60px) rotate(-5deg);
            opacity:0;
        }

        60%{
            transform:scale(1.05) translateY(-8px) rotate(2deg);
        }

        100%{
            transform:scale(1) translateY(0) rotate(0);
            opacity:1;
        }

  cell.classList.add("selected");

clearTimeout(window.wordTimer);

window.wordTimer = setTimeout(checkAnswer, 350);

    }


    }

    });
function checkAnswer() {

    // 1. Check if any answer is fully matched
    for (const ans of answers) {

        if (document.getElementById(ans.question).classList.contains("completed"))
            continue;

        const correct =
            selected.length === ans.letters.length &&
            ans.letters.every(id => selected.includes(id));

        if (correct) {

            const q = document.getElementById(ans.question);

            let color = "";

            if (q.classList.contains("orange")) color = "hl-orange";
            if (q.classList.contains("purple")) color = "hl-purple";
            if (q.classList.contains("blue")) color = "hl-blue";
            if (q.classList.contains("yellow")) color = "hl-yellow";
            if (q.classList.contains("green")) color = "hl-green";
            if (q.classList.contains("lavender")) color = "hl-lavender";

            ans.letters.forEach(id => {

                const cell = document.getElementById(id);

                cell.classList.remove("selected");
                cell.classList.add(color);
                cell.classList.add("found");
                cell.style.pointerEvents = "none";

            });

            q.classList.add("completed");

            selected = [];

            score++;

            document.getElementById("correctSound").play();

            speak("Correct");

            showCorrectPopup();

            if (score === totalQuestions) {

                setTimeout(showFinal, 1500);

            }

            return;
        }
    }

    // 2. Don't show wrong until selection is impossible

    let possible = false;

    for (const ans of answers) {

        if (document.getElementById(ans.question).classList.contains("completed"))
            continue;

        const matched = selected.every(id => ans.letters.includes(id));

        if (matched) {
            possible = true;
            break;
        }
    }

    // Still building a word
    if (possible) return;

    // Impossible selection -> Wrong

    document.getElementById("wrongSound").play();

    speak("Try Again");

    showWrongPopup();

    selected.forEach(id => {

        document.getElementById(id).classList.remove("selected");

    });

    selected = [];

}

    function speak(text){

        speechSynthesis.cancel();

        const msg=new SpeechSynthesisUtterance(text);

        msg.lang="en-US";
        msg.volume=.25;
        msg.rate=1;
        msg.pitch=1;

        speechSynthesis.speak(msg);

    }
    function smallConfetti() {
        confetti({
            particleCount: 35,
            spread: 60,
            origin: { y: 0.6 }
        });
    }
    function showCorrectPopup() {

        speak("Correct");

        smallConfetti();

        const overlay = document.getElementById("popupOverlay");
        const popupBox = document.getElementById("popupBox");

        popupBox.className = "popup correct";

        popupBox.innerHTML = `
            <div class="popup-top">
                <div class="popup-icon-wrap">
                    <span>🌟</span>
                </div>

                <div class="popup-title">
                    Excellent!
                </div>
            </div>

            <div class="popup-bottom">
                <div class="popup-msg">
                Awesome! You got it right! 🎉
                </div>
            </div>
        `;

        overlay.classList.add("show");

        setTimeout(() => {
            overlay.classList.remove("show");
        }, 1500);
    }
    function showWrongPopup() {

        speak("Try again");

        const overlay = document.getElementById("popupOverlay");
        const popupBox = document.getElementById("popupBox");

        popupBox.className = "popup wrong";

        popupBox.innerHTML = `
            <div class="popup-top">
                <div class="popup-icon-wrap">
                    <span>🤔</span>
                </div>

                <div class="popup-title">
                    Oops!
                </div>
            </div>

            <div class="popup-bottom">
                <div class="popup-msg">
                    Nice try! Give it another shot. 😊
                </div>
            </div>
        `;

        overlay.classList.add("show");

        setTimeout(() => {
            overlay.classList.remove("show");
        }, 1500);
    }
    function showWord(word,color){

        // Remove previous color of this word
        document.querySelectorAll('[data-word="'+word+'"]').forEach(cell=>{

            cell.classList.remove(
                'hl-blue',
                'hl-orange',
                'hl-green',
                'hl-yellow',
                'hl-purple',
                'hl-lavender'
            );

            cell.classList.add(color);

        });

    }
    function openHint(){

        document.getElementById("hintPopup").style.display="flex";

    }

    function closeHint(){

        document.getElementById("hintPopup").style.display="none";

    }
    function showFinal() {

        let end = Date.now() + 1500;

        (function frame() {

            confetti({
                particleCount:3,
                angle:60,
                spread:55,
                origin:{x:0}
            });

            confetti({
                particleCount:3,
                angle:120,
                spread:55,
                origin:{x:1}
            });

            if(Date.now() < end){
                requestAnimationFrame(frame);
            }

        })();

        const overlay = document.getElementById("popupOverlay");
        const popupBox = document.getElementById("popupBox");

        popupBox.className = "popup final";

        popupBox.innerHTML = `
            <div class="popup-top">
                <div class="popup-icon-wrap">
                    <span>👑</span>
                </div>

                <div class="popup-title">
                    Congratulations!
                </div>
            </div>

            <div class="popup-bottom">

                <div class="popup-score">
                    <span>Score:</span>
                <strong>${score}/${totalQuestions}</strong>
                </div>

                <div class="popup-stars">
                    ⭐⭐⭐
                </div>

                <button class="play-again-popup" id="playAgainBtn">
                    Play Again
                </button>

            </div>
        `;

        overlay.classList.add("show");

        document.getElementById("playAgainBtn").onclick = () => {
            location.reload();
        };
    }

    </script>
