<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Verb Forms · Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
    </script>
    <style>
        @font-face {
            font-family: 'CCSyntroman';
            src: url('../assets/CCSYNTRO.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "CCSyntroman";
            font-weight: 400;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .stage {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

 .exercise-heading {
                font-size: 23px;
                font-weight:400;
    color:#5D4037;
    margin-bottom: 60px;
            }
        .quiz-layout{
    display:flex;
    gap:50px;
    align-items:center;
    justify-content:center;
    width:100%;
    margin-top:20px;
}

.left-panel{
     flex:0 0 52%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}
.image-stack{
    position:relative;
    width:100%;
    max-width:320px;
    height:320px;
}
.color-img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:1;
    clip-path:none;
    filter:none;
}
img{
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none; /* only if images are not clickable */
}
.right-panel{
    width:55%;
    display:flex;
    flex-direction:column;
    gap:25px;
}.exercise-question {
    font-size: 30px;
    margin-bottom: 20px;
    text-align: left;
    color: #2F6F73;
    font-weight: normal;
}

.exercise-question .verb-name {
    color: #2F4F4F;
}
.exercise-image{
    width:100%;
    max-width:320px;
    object-fit:contain;
}
.answer-row{
    position: relative;
    width: 100%;
    margin-top: 30px;
}

.answer-label{
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;          /* Same as page background */
    padding: 0 18px;
  
    font-size: 20px;
    color: #2f4f4f;
    z-index: 10;
    line-height: 1.2;
}

.input-wrapper{
    margin-top: 0;
}

        .input-wrapper {
            display: flex;
            padding: 5px;
            align-items: center;
            width: 100%;
            background: #fafdff;
            border: 2.5px solid #00c2a8;
            border-radius: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px #2d3a660a;
        }

        .input-wrapper:focus-within {
            border-color: #da9618;
            box-shadow: 0 4px 10px #ffcb6b49, 0 2px 8px #ffd86b;
            transform: translateY(-2px);
        }

        .input-wrapper.correct-wrapper {
            border-color: #6ba86b;
            background: #ffffff;
            box-shadow: 0 4px 10px #4caf5024, 0 2px 8px #4caf500f;
        }

        .input-wrapper.wrong-wrapper {
            animation: blinkRed 0.5s ease 2;
        }

        @keyframes blinkRed {

            0%,
            100% {
                border-color: #a2b7dc;
                background: #fdfeff;
                color: #3b4b72;
            }

            50% {
                border-color: #ef5350;
                background: #fbe9e7;
                color: #ef5350;
            }
        }

        .input-wrapper input {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 14px 0 0 14px;
            font-size: 22px;
            background: transparent;
            outline: none;
            color: #2f4f4f;
            text-align: left;
           
            min-height: 42px;
            width: 100%;
        }

        .input-wrapper input::placeholder {
            color: #8a8b8b;
            font-weight: 400;
            font-size: 22px;
        }

        .input-wrapper input:disabled {
            opacity: 1;
            cursor: not-allowed;
        }

        .input-wrapper .verify-btn {
            background: #8bb3e0;
            border: none;
            border-radius: 0 14px 14px 0;
            padding: 13px 12px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            min-height: 50px;
            height: 42px;
            flex-shrink: 0;
            margin: 2px 2px 2px 0;
            border-radius: 12px;
        }

        .input-wrapper .verify-btn:hover:not(:disabled):not(.correct-btn) {
            transform: scale(1.05);
            background: #78a3d6;
        }

        .input-wrapper .verify-btn:active:not(:disabled):not(.correct-btn) {
            transform: scale(0.95);
        }

        .input-wrapper .verify-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            /* background: #a7d3ff; */
        }

        .input-wrapper .verify-btn.correct-btn {
            background: #6ba86b;
            box-shadow: 0 4px 14px rgba(76, 175, 80, 0.25);
        }

        .input-wrapper .verify-btn.correct-btn:disabled {
            opacity: 0.75;
            cursor: not-allowed;
            background: #7cb87c;
        }

        /* --- buttons --- */
        /* Common Button */
.btn{
    width:150px;
    height:58px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;

    border-radius:35px;
    border:3px solid #fff;

    font-size:20px;
    font-weight:400;
    color:#fff;

    cursor:pointer;

    background-size:200% 200%;
    transition:.15s ease;
}

/* Previous */
.prev-btn{
    background:linear-gradient(#b5dffc,#7fc0eb);
    box-shadow:0 4px 0 #4da5d4;
}

/* Next */
.next-btn{
    background:linear-gradient(#f1e390,#ecc74e);
    box-shadow:0 4px 0 #d1a72c;
}

/* Press Effect */
.prev-btn:active:not(:disabled){
    transform:translateY(4px);
    box-shadow:0 2px 0 #4da5d4;
}

.next-btn:active:not(:disabled){
    transform:translateY(4px);
    box-shadow:0 2px 0 #d1a72c;
}

/* Disabled */
.btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}
        .nav-row {
            display: flex;
            gap: 50px;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
        }
/* =====================================================
   POPUP OVERLAY
===================================================== */

.popup-overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    opacity:0;
    transition:opacity .4s ease;
}

.popup-overlay.show{
    display:flex;
    opacity:1;
}


/* =====================================================
   POPUP CARD
===================================================== */
.popup{
    background:#fff;
    width:350px;
    border-radius:40px;
    padding:0;
    text-align:center;
    position:relative;
    overflow:hidden;

    border:1px solid rgba(255,255,255,.9);

    /* Premium Floating Shadow */
    box-shadow:
        0 2px 6px rgba(0,0,0,.05),
        0 10px 18px rgba(0,0,0,.08),
        0 22px 35px rgba(0,0,0,.12),
        0 45px 70px rgba(0,0,0,.18),
        0 70px 110px rgba(0,0,0,.10);

    animation: popupSlide .45s cubic-bezier(.34,1.56,.64,1);
}
.popup{
    box-shadow:
        0 0 0 1px rgba(255,255,255,.7),
        0 8px 16px rgba(0,0,0,.06),
        0 18px 36px rgba(0,0,0,.10),
        0 35px 70px rgba(0,0,0,.18),
        0 0 40px rgba(255,255,255,.25);
}

@keyframes popupSlide{

    0%{
        transform:scale(.5) translateY(60px) rotate(-5deg);
        opacity:0;
    }

    60%{
        transform:scale(1.05) translateY(-8px) rotate(2deg);
    }

    100%{
        transform:scale(1) translateY(0) rotate(0);
        opacity:1;
    }
}


/* =====================================================
   POPUP TOP
===================================================== */

.popup-top{
    padding:35px 24px 20px;
    position:relative;
}


/* =====================================================
   ICON
===================================================== */

.popup-icon-wrap{

    width:90px;
    height:90px;

    margin:0 auto 10px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:50px;

    box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.popup.correct .popup-icon-wrap{
    background:#4CAF50;
    animation:
        iconPop .6s cubic-bezier(.34,1.56,.64,1),
        glowGreen 1.2s ease-in-out infinite alternate;
}

.popup.wrong .popup-icon-wrap{
    background:#EF5350;
    animation:
        iconPop .6s cubic-bezier(.34,1.56,.64,1),
        glowRed 1.2s ease-in-out infinite alternate;
}
.popup.final .popup-icon-wrap{
    background:#ffffff;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.popup-icon-wrap span{
    color:#fff;
}


/* =====================================================
   GLOW ANIMATION
===================================================== */

@keyframes glowGreen{

    from{
        box-shadow:0 0 20px rgba(76,175,80,.3);
    }

    to{
        box-shadow:0 0 40px rgba(76,175,80,.6);
    }
}

@keyframes glowRed{

    from{
        box-shadow:0 0 20px rgba(239,83,80,.3);
    }

    to{
        box-shadow:0 0 40px rgba(239,83,80,.6);
    }
}

@keyframes iconPop{

    0%{
        transform:scale(0) rotate(-30deg);
    }

    60%{
        transform:scale(1.2) rotate(10deg);
    }

    100%{
        transform:scale(1) rotate(0);
    }
}


/* =====================================================
   TITLE
===================================================== */

.popup-title{

    font-size:26px;
    font-weight:700;
    letter-spacing:-.5px;
}


/* =====================================================
   BOTTOM
===================================================== */

.popup-bottom{

    padding:18px 24px 22px;
    background:#fff;
}

.popup-msg{

    font-size:18px;
    font-weight:500;

    line-height:1.45;

    color:#4B5563;
}


/* =====================================================
   SCORE
===================================================== */

.popup-score{

    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    margin:0 auto 12px;

    font-size:20px;
    font-weight:700;

   
}

.popup-score span{
    margin-right:8px;
}
.popup-score strong{
    font-family: "CCSyntroman";
    font-size:20px;
    font-weight:400;
    line-height:1;
    letter-spacing:0;
}


/* =====================================================
   STARS
===================================================== */

.popup-stars{

    display:flex;
    justify-content:center;
    gap:8px;

    font-size:34px;

    margin:10px auto 18px;

    color:#FFC83D;

    animation:starDance .8s ease;
}

@keyframes starDance{

    0%{
        transform:scale(0) rotate(-20deg);
        opacity:0;
    }

    50%{
        transform:scale(1.3) rotate(10deg);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}


/* =====================================================
   CORRECT
===================================================== */

.popup.correct{

    background:#fff;
    border:3px solid #4CAF50;
}

.popup.correct .popup-top{
    background:#fff;
}

.popup.correct .popup-bottom{
    background:#fff;
    border-top:none;
}

.popup.correct .popup-title{
    color:#2E7D32;
}


/* =====================================================
   WRONG
===================================================== */

.popup.wrong{

    background:#fff;
    border:3px solid #EF5350;
}

.popup.wrong .popup-top{
    background:#fff;
}

.popup.wrong .popup-bottom{
    background:#fff;
    border-top:none;
}

.popup.wrong .popup-title{
    color:#D32F2F;
}
/* =========================
   FINAL POPUP - CLEAN WHITE
========================= */
.popup.final{
    background:#FFFFFF;
    border:3px solid #4CAF50;
    box-shadow:0 18px 45px rgba(15,23,42,.12);
}

.popup.final .popup-top{
    background:linear-gradient(135deg,#F8FAFC,#EEF5FB);
}

.popup.final .popup-bottom{
    background:#FFFFFF;
    border-top:2px solid #EDF2F7;
}

/* Title */

.popup.final .popup-title{
    color:#334155;
    font-size:30px;
    font-weight:700;
    letter-spacing:.3px;
}

/* Score */

.popup.final .popup-score{
    color:#0F172A;
    font-size:24px;
    font-weight:500;
    margin:12px 0 15px;
}

/* Stars */

.popup.final .popup-stars{
    color:#FACC15;
    font-size:38px;
    letter-spacing:6px;
}

/* Trophy Circle */

.popup.final .popup-icon-wrap{
    width:95px;
    height:95px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#F1F5F9;
    border:5px solid #BBF7D0;
    border-radius:50%;

    box-shadow:
        0 12px 30px rgba(15,23,42,.08),
        0 0 0 8px rgba(187,247,208,.35);
}

.popup.final .popup-icon-wrap span{
    font-size:52px;
}

/* Play Again Button */

.popup.final .play-again-popup{
    width:100%;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    border:none;
    border-radius:16px;

    background:#4CAF50;

    color:#fff;
    font-size:18px;
    font-weight:700;

    cursor:pointer;
    transition:.25s;

    box-shadow:0 10px 24px rgba(34,197,94,.28);
}

    <main class="stage">
        <!-- NEW LAYOUT STARTS HERE -->
        <div class="exercise-area">
            <h2 class="exercise-heading">Fill in the boxes with the correct verb forms</h2>
           <div class="quiz-layout">

    <!-- Left Side -->
    <div class="left-panel">

    <div class="exercise-question" id="questionDisplay"></div>

    <div class="image-stack">

        <!-- Black & White Image -->
      
        <!-- Colour Image -->
        <img id="colorImg"
             class="exercise-image color-img"
             src=""
             alt="Colour">

    </div>

</div>
    <!-- Right Side -->
    <div class="right-panel">

        <div class="answer-row">
            <span class="answer-label">Past Tense</span>

            <div class="input-wrapper" id="wrapper0">
                <input type="text" id="input0" placeholder="Type V2">
                <button class="verify-btn" id="btn0">Check</button>
            </div>
        </div>

        <div class="answer-row">
            <span class="answer-label">Past Participle</span>

            <div class="input-wrapper" id="wrapper1">
                <input type="text" id="input1" placeholder="Type V3">
                <button class="verify-btn" id="btn1">Check</button>
            </div>
        </div>

        <div class="answer-row">
            <span class="answer-label">Present Participle</span>

            <div class="input-wrapper" id="wrapper2">
                <input type="text" id="input2" placeholder="Type V4">
                <button class="verify-btn" id="btn2">Check</button>
            </div>
        </div>

    </div>

</div>
                </div>
            </div>
        </div>
        <!-- NEW LAYOUT ENDS HERE -->

        <div class="nav-row">
            <button class="btn prev-btn" id="prevBtn" disabled><i class="fa-solid fa-angles-left"></i> Prev</button>
            <button class="btn next-btn" id="nextBtn" disabled>Next <i class="fa-solid fa-angles-right"></i></button>
        </div>
    </main>

    <!-- popup overlay -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup" id="popupBox"></div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3">
    </audio>

    <script>
     const quizData = [
{
    v1:"Flow",
    v2:"Flowed",
    v3:"Flowed",
    v4:"Flowing",
    given:["v1"],
    sketch:"../images/flow.png",
    color:"../images/flow_color.png"
},
{
    v1:"Leave",
    v2:"Left",
    v3:"Left",
    v4:"Leaving",
    given:["v2"],
    sketch:"../images/leave_normal.png",
    color:"../images/leave_color.png"
},
{
    v1:"Bring",
    v2:"Brought",
    v3:"Brought",
    v4:"Bringing",
    given:["v4"],
    sketch:"../images/bring_normal.png",
    color:"../images/bring_color.png"
},
{
    v1:"Fight",
    v2:"Fought",
    v3:"Fought",
    v4:"Fighting",
    given:["v3"],
    sketch:"../images/fight_normal.png",
    color:"../images/fight_color.png"
},
{
    v1:"Get",
    v2:"Got",
    v3:"Got",
    v4:"Getting",
    given:["v1"],
    sketch:"../images/get_normal.png",
    color:"../images/get_color.png"
},
{
    v1:"Think",
    v2:"Thought",
    v3:"Thought",
    v4:"Thinking",
    given:["v2"],
    sketch:"../images/think_normal.png",
    color:"../images/think_color.png"
},
{
    v1:"Steal",
    v2:"Stole",
    v3:"Stolen",
    v4:"Stealing",
    given:["v2"],
    sketch:"../images/steal_normal.png",
    color:"../images/steal_color.png"
},
{
    v1:"Fall",
    v2:"Fell",
    v3:"Fallen",
    v4:"Falling",
    given:["v1"],
    sketch:"../images/fall_normal.png",
    color:"../images/fall_color.png"
},
{
    v1:"Make",
    v2:"Made",
    v3:"Made",
    v4:"Making",
    given:["v1"],
    sketch:"../images/make_normal.png",
    color:"../images/make_color.png"
},
{
    v1:"Appear",
    v2:"Appeared",
    v3:"Appeared",
    v4:"Appearing",
    given:["v4"],
    sketch:"../images/appear_normal.png",
    color:"../images/appear_color.png"
}
];
        const ROWS_PER_PAGE = 1;
        const totalPages = quizData.length;
        let currentPage = 0;
        let score = 0;
      const answered = quizData.map(() => ({
    v1:false,
    v2:false,
    v3:false,
    v4:false
}));

const userAnswers = quizData.map(() => ({
    v1:"",
    v2:"",
    v3:"",
    v4:""
}));
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const overlay = document.getElementById('popupOverlay');
        const popupBox = document.getElementById('popupBox');

        // NEW LAYOUT ELEMENTS
        const questionDisplay = document.getElementById('questionDisplay');
   
const colorImg = document.getElementById("colorImg");
        const inputs = [
            document.getElementById('input0'),
            document.getElementById('input1'),
            document.getElementById('input2')
        ];
        const btns = [
            document.getElementById('btn0'),
            document.getElementById('btn1'),
            document.getElementById('btn2')
        ];
        const wrappers = [
            document.getElementById('wrapper0'),
            document.getElementById('wrapper1'),
            document.getElementById('wrapper2')
        ];

        // --- speech ---
        function speakText(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

        // --- popups (same as first code) ---
        function showCorrectPopup() {
            speakText('Correct');
            smallConfetti();
            popupBox.className = 'popup correct';
            popupBox.innerHTML = `
                        <div class="popup-top"><div class="popup-icon-wrap"><span>🌟</span></div><div class="popup-title"> Excellent!</div></div>
                        <div class="popup-bottom"><div class="popup-msg">  Awesome! You got it right! 🎉</div></div>
                    `;
            overlay.classList.add('show');
            setTimeout(() => overlay.classList.remove('show'), 1500);
        }

        function showWrongPopup() {
            speakText('Try again');
            popupBox.className = 'popup wrong';
            popupBox.innerHTML = `
                        <div class="popup-top"><div class="popup-icon-wrap"><span>🤔</span></div><div class="popup-title">Keep Trying</div></div>
                        <div class="popup-bottom"><div class="popup-msg">Nice try! Give it another shot. 😊</div></div>
                    `;
            overlay.classList.add('show');
            setTimeout(() => overlay.classList.remove('show'), 1400);
        }

        function showFinalPopup() {
            let end = Date.now() + (1.5 * 1000);
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
            popupBox.className = 'popup final';
            const finalScore = answered.filter((row, i) => {
    const given = quizData[i].given[0];

    return Object.keys(row)
        .filter(k => k !== given)
        .every(k => row[k]);
}).length;
            popupBox.innerHTML = `
                    <div class="popup-top"><div class="popup-icon-wrap"><span>👑</span></div><div class="popup-title">Congratulations!</div></div>
                    <div class="popup-bottom">
                      <div class="popup-score">
    Score: ${finalScore}/${quizData.length}
</div>
                        <div class="popup-stars">⭐⭐⭐⭐⭐</div>
                        <button class="play-again-popup" id="playAgainBtn">Play Again</button>
                    </div>
                `;
            overlay.classList.add('show');
            document.getElementById('playAgainBtn').addEventListener('click', resetGame);
        }

        function checkAllAnswered() {
            const all = answered.every(row => row.every(cell => cell === true));
            if (all) {
                setTimeout(showFinalPopup, 500);
            }
        }

        // --- verification (adapted for new layout) ---
      function handleVerify(rowIdx, colIdx, inputEl, btnEl, wrapperEl) {

    const key = inputEl.dataset.key;

    // Already answered
    if (answered[rowIdx][key]) return;

    const guess = inputEl.value.trim();

    if (!guess) {
        wrapperEl.style.borderColor = "#e57373";
        setTimeout(() => wrapperEl.style.borderColor = "", 600);
        return;
    }

    const correct = quizData[rowIdx][key];

    if (guess.toLowerCase() === correct.toLowerCase()) {

        answered[rowIdx][key] = true;

        const formattedAnswer =
            correct.charAt(0).toUpperCase() +
            correct.slice(1).toLowerCase();

        userAnswers[rowIdx][key] = formattedAnswer;

        inputEl.value = formattedAnswer;
        inputEl.disabled = true;

        btnEl.disabled = true;
        btnEl.classList.add("correct-btn");
        btnEl.textContent = "Check";

        wrapperEl.classList.add("correct-wrapper");

     

wrapperEl.classList.add("correct-wrapper");
// Move cursor to the next available input
setTimeout(() => {
    const currentIndex = inputs.indexOf(inputEl);

    for (let i = currentIndex + 1; i < inputs.length; i++) {
        if (!inputs[i].disabled) {
            inputs[i].focus();
            inputs[i].select();
            return;
        }
    }
}, 50);
        updateNavButtons();

        showCorrectPopup();

        // Final popup
        const allAnswered = answered.every((row, i) => {
            const given = quizData[i].given[0];
            return Object.keys(row)
                .filter(k => k !== given)
                .every(k => row[k]);
        });

        if (allAnswered) {
            setTimeout(showFinalPopup, 1500);
        }

    } else {

        wrapperEl.classList.add("wrong-wrapper");

        setTimeout(() => {
            wrapperEl.classList.remove("wrong-wrapper");
            inputEl.value = "";
            inputEl.focus();
            updateVerifyButtonState(inputEl, btnEl, wrapperEl);
        }, 500);

        showWrongPopup();
    }
}
        function updateVerifyButtonState(inputEl, btnEl, wrapperEl) {
            const rowIdx = parseInt(inputEl.dataset.row);
            const colIdx = parseInt(inputEl.dataset.col);
       const key = inputEl.dataset.key;
       const correct = quizData[rowIdx][key];

if (answered[rowIdx][key]) return;
            const hasText = inputEl.value.trim().length > 0;
            btnEl.disabled = !hasText;
        }

        function updateNavButtons() {
            const rowIdx = currentPage;

      const givenKey = quizData[rowIdx].given[0];

const allAnswered =
Object.keys(answered[rowIdx])
.filter(k => k !== givenKey)
.every(k => answered[rowIdx][k]);

            nextBtn.disabled = !allAnswered || currentPage === quizData.length - 1;
            prevBtn.disabled = currentPage === 0;
        }

        function getCurrentPageRows() {
            const start = currentPage * ROWS_PER_PAGE;
            const end = Math.min(start + ROWS_PER_PAGE, quizData.length);
            const indices = [];
            for (let i = start; i < end; i++) {
                indices.push(i);
            }
            return indices;
        }

        function renderPage() {
            const rowIndices = getCurrentPageRows();
            const rowIdx = rowIndices[0];
            const data = quizData[rowIdx];
const givenKey = data.given[0];

const labels = {
    v1: "Present",
    v2: "Past",
    v3: "Past Participle",
    v4: "Present Participle"
};
questionDisplay.innerHTML =
    `Q${rowIdx + 1}. ${labels[givenKey]} : <span class="verb-name">${data[givenKey]}</span>`;

colorImg.src = data.color;


         const COLUMN_KEYS = ["v1","v2","v3","v4"];
const COLUMN_LABELS = {
    v1: "Present",
    v2: "Past",
    v3: "Past Participle",
    v4: "Present Participle"
};

const given = new Set(data.given);

const cols = COLUMN_KEYS
    .filter(key => !given.has(key))
    .map(key => ({
        key,
        label: COLUMN_LABELS[key],
        placeholder: `Type ${key.toUpperCase()}`
    }));

            cols.forEach((col, index) => {
                const input = inputs[index];
                const btn = btns[index];
                const wrapper = wrappers[index];

                // reset
                input.value = '';
                input.disabled = false;
                input.dataset.row = rowIdx;
               input.dataset.key = col.key;
                btn.disabled = true;
                btn.classList.remove('correct-btn');
                btn.textContent = "Check";
                wrapper.classList.remove('correct-wrapper', 'wrong-wrapper');
                wrapper.style.borderColor = '';

                // update label
                const label = wrapper.parentElement.querySelector('.answer-label');
                if (label) label.textContent = col.label;

             if (answered[rowIdx][col.key]) {

    input.value = userAnswers[rowIdx][col.key];

    input.disabled = true;
    btn.disabled = true;
    btn.classList.add("correct-btn");
    wrapper.classList.add("correct-wrapper");
}

                // remove old listeners by cloning
                const newInput = input.cloneNode(true);
                const newBtn = btn.cloneNode(true);
                input.parentNode.replaceChild(newInput, input);
                btn.parentNode.replaceChild(newBtn, btn);

                // update references
                inputs[index] = newInput;
                btns[index] = newBtn;
                const newWrapper = newInput.closest('.input-wrapper');
                if (newWrapper) wrappers[index] = newWrapper;

                // attach events
                const currentInput = inputs[index];
                const currentBtn = btns[index];
                const currentWrapper = wrappers[index];

                currentInput.addEventListener('input', function () {
                    const r = parseInt(this.dataset.row);
                  const key = this.dataset.key;

if (!answered[r][key]) {
                        const pos = this.selectionStart;

                        this.value = this.value.toLowerCase();

                        if (this.value.length > 0) {
                            this.value =
                                this.value.charAt(0).toUpperCase() +
                                this.value.slice(1);
                        }

                        this.setSelectionRange(pos, pos);

                        currentBtn.disabled = this.value.trim().length === 0;
                    }
                });

                currentInput.addEventListener('focus', function () {
                    const r = parseInt(this.dataset.row);
                  const key = this.dataset.key;

if (!answered[r][key]) {
                        this.select();
                    }
                });

              currentBtn.addEventListener("click", function (e) {
    e.preventDefault();

    const r = parseInt(currentInput.dataset.row);

    handleVerify(
        r,
        null,
        currentInput,
        currentBtn,
        currentWrapper
    );
});

                currentInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (!currentBtn.disabled) {
                            currentBtn.click();
                        }
                    }
                });
            });

            updateNavButtons();
        }

        function resetGame() {
            for (let r = 0; r < answered.length; r++) {
              ["v1","v2","v3","v4"].forEach(k=>{
    answered[r][k]=false;
    userAnswers[r][k]="";
});
            }
            score = 0;
            currentPage = 0;
            overlay.classList.remove('show');
            renderPage();
            setTimeout(() => inputs[0]?.focus(), 100);
        }

        // Disable drag & drop on all text inputs
document.addEventListener("DOMContentLoaded", () => {

    document.querySelectorAll('input[type="text"]').forEach(input => {

        ["dragenter", "dragover", "dragleave", "drop"].forEach(event => {
            input.addEventListener(event, function (e) {
                e.preventDefault();
                e.stopPropagation();
            });
        });

    });

});

        prevBtn.addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                renderPage();
            }
        });

        nextBtn.addEventListener("click", () => {
            if (currentPage < quizData.length - 1) {
                currentPage++;
                renderPage();
            }
        });

        // initial render
        renderPage();
    </script>
</body>
