<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assessments</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
      @font-face {
            font-family: 'CCSYBold';
            src: url('./assets/CCSYBOLD.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
               font-family: "CCSYBold";
                 font-weight: 400;
             

        }
        body {
            height: 100vh;
            overflow: hidden;
           
            background-size: 100% 100%;
        }

        .app {
            height: 100vh;
            display: flex;
            /* background: #f3f3f3d7; */
             background: #fff; 
        }

        .sidebar {
            width: 300px;
            padding: 25px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0px;
        }

        /* ================= Ribbon Sidebar ================= */

.island-btn{
    position: relative;
    display:flex;
    align-items:center;
    justify-content:space-between;

    width:100%;
    height:78px;
    padding:0 22px;

    background:#ffffff;
    border:2px solid #edf0f5;
    border-radius:18px;

    cursor:pointer;
    overflow:hidden;

    transition:.35s ease;
    box-shadow:0 8px 18px rgba(0,0,0,.08);
}

/* Left Ribbon */
.island-btn::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:6px;
    height:100%;
    background:#cfd8dc;
    transition:.35s;
}


.island-btn div:last-child{

    font-size:20px;
   
    color:#2f4f4f;
}

.option-left{
    display:flex;
    align-items:center;
    gap:16px;
}

/* Icon Circle */
.option-num{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#f4f7fb;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:.35s;
}

.option-num i{
    font-size:20px;
    color:#5f6d7a;
    transition:.35s;
}


.island-btn:hover::after{
    transform:translateX(5px);
}

.island-btn:hover .option-num{
    transform:rotate(-10deg) scale(1.08);
}

/* ================= Active ================= */

.island-btn.active{
    background:#ffffff;
    box-shadow:0 18px 35px rgba(0,0,0,.16);
}

.island-btn.active::before{
    width:10px;
}

.island-btn.active::after{
    color:#ffffff;
    right:18px;
}

/* Individual Theme Colors */

.o1.active::before,
.o1.active .option-num{
    background:#ff6b81;
}
.o1.active::after,
.o1.active .option-num i{
    color:white;
}

.o2.active::before,
.o2.active .option-num{
    background:#3fa9f5;
}
.o2.active::after,
.o2.active .option-num i{
    color:white;
}

.o3.active::before,
.o3.active .option-num{
    background:#47c878;
}
.o3.active::after,
.o3.active .option-num i{
    color:white;
}

.o4.active::before,
.o4.active .option-num{
    background:#f6b93b;
}
.o4.active::after,
.o4.active .option-num i{
    color:white;
}

.o5.active::before,
.o5.active .option-num{
    background:#f57c48;
}
.o5.active::after,
.o5.active .option-num i{
    color:white;
}

.o6.active::before,
.o6.active .option-num{
    background:#8b5cf6;
}
.o6.active::after,
.o6.active .option-num i{
    color:white;
}
        .main {
            flex: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:1065px) {
            .app {
                flex-direction: column;
            }

            .sidebar {
                display: none;
            }

            iframe {
                border-radius: 0px;
            }

            .menu-btn {
                display: block;
                position: fixed;
                top: 8px;
                right: 15px;
                font-size: 26px;
                background: #c084fc;
                color: white;
                border: none;
                border-radius: 50px;
                padding: 8px 16px;
                cursor: pointer;
                z-index: 5000;
                box-shadow: 0 4px 15px rgba(192, 132, 252, 0.4);
            }

            .offcanvas {
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.08);
                backdrop-filter: blur(6px);
                display: none;
                z-index: 4000;
            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: 300px;
                height: 100%;
                background: rgba(255, 248, 252, 0.95);
                padding: 0px;
                padding-top: 0px;
                transform: translateX(100%);
                transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
                overflow-y: hidden;
                backdrop-filter: blur(10px);
            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
                padding: 20px;
            }

            .offcanvas-panel .island-btn {
                margin-bottom: 16px;
            }
        }

        @media (min-width: 900px) and (max-height: 800px) {
            .app {
                transform: scaleY(0.95);
                transform-origin: top center;
                height: calc(100vh / 0.95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {
            .app {
                transform: scaleY(0.9);
                transform-origin: top center;
                height: calc(100vh / 0.9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {
            .app {
                transform: scaleY(0.85);
                transform-origin: top center;
                height: calc(100vh / 0.85);
            }
        }

        @media (min-width: 900px) and (max-height: 500px) {
            .app {
                transform: scaleY(0.8);
                transform-origin: top center;
                height: calc(100vh / 0.8);
            }
        }

        @media screen and (min-width: 1025px) and (max-width: 1440px) {
            .sidebar {
                width: 300px;
                padding: 26px 22px;
                gap: 24px;
            }

            .island-btn {
                font-size: 20px;
                padding: 18px 15px;
            }

            .option-num {
                width: 38px;
                height: 38px;
            }
        }

        @media screen and (min-width: 1441px) and (max-width: 1920px) {
            .sidebar {
                width: 380px;
                padding: 30px 26px;
                gap: 25px;
            }

            .island-btn {
                font-size: clamp(19px, 1.1vw, 22px);
                padding: 20px 20px;
                border-radius: 22px;
            }

            .option-left {
                gap: 18px;
            }

            .option-num {
                width: 42px;
                height: 42px;
                border-radius: 14px;
            }
        }

        @media screen and (min-width: 1921px) {
            .sidebar {
                width: 420px;
                padding: 36px 30px;
                gap: 36px;
            }

            .island-btn {
                font-size: clamp(21px, 1.2vw, 26px);
                padding: 24px 30px;
                border-radius: 50px;
            }

            .option-left {
                gap: 22px;
            }

            .option-num {
                width: 48px;
                height: 48px;
                border-radius: 16px;
            }

            iframe {
                border-radius: 44px 0 0 44px;
            }
        }
   .o1.active{ border-color:#FFB8C6; }   /* Soft Pink */
.o2.active{ border-color:#9FD5FA; }   /* Soft Blue */
.o3.active{ border-color:#9BE5B4; }   /* Soft Green */
.o4.active{ border-color:#F9D98A; }   /* Soft Yellow */
.o5.active{ border-color:#F8BE9B; }   /* Soft Orange */
.o6.active{ border-color:#CDB8FA; }   /* Soft Purple */
    </style>
</head>

<body>

    <div class="app">

</div>

<div class="island-btn o2" onclick="openIsland(1)">

</div>
 <div class="island-btn o4" onclick="openIsland(2)">
                <div class="option-left">
                    <div class="option-num"><i class="fa-solid fa-puzzle-piece"></i></span></div>

            <div class="island-btn o3" onclick="openIsland(3)">

</span></div>

                    <div>Antonym Word</div>

            </div>
           
            <!-- NEW "Correct Verb" menu item (o7) -->
            <div class="island-btn o6" onclick="openIsland(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-wand-magic-sparkles"></i></span></div>
                    <div>Correct Verb</div>
                </div>

        </div>
        <div class="main"> <iframe id="contentFrame" src="./exercises/fillintheblanks.html"></iframe> </div>
    </div>
    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">
        <div class="offcanvas-panel" onclick="event.stopPropagation()">
           <div class="island-btn o1 active" onclick="openIsland(0)">
    <div class="option-left">

            <span><i class="fa-solid fa-pen-to-square"></i></span>

    </div>
</div>

<div class="island-btn o2" onclick="openIsland(1)">
    <div class="option-left">
        <div class="option-num">

</div>
   <div class="island-btn o4" onclick="mobileOpen(2)">

            </div>

            </div>

                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-spell-check"></i></span></div>

                    <div class="option-num"><span><i class="fa-solid fa-flag"></i></span></div>

    </div>
    <script>
        const sidebarButtons = document.querySelectorAll(".sidebar .island-btn");
        const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");
        const frame = document.getElementById("contentFrame");
        const pages = [
            "./exercises/fillintheblanks.html",
            "./exercises/mcq.html",
             "./exercises/matching.html",
            "./exercises/synonyms.html",

            "./exercises/antonyms2.html",
          
            "./exercises/verbforms.html"   // new page for Correct Verb
        ];

        function openIsland(index) {
            sidebarButtons.forEach(btn => btn.classList.remove("active"));
            sidebarButtons[index].classList.add("active");
            mobileButtons.forEach(btn => btn.classList.remove("active"));
            mobileButtons[index].classList.add("active");
            frame.src = pages[index];
        }

        function toggleMenu() {
            if (window.innerWidth > 1065) return;
            document.getElementById("offcanvas").classList.toggle("show");
        }

        function mobileOpen(i) {
            openIsland(i);
            toggleMenu();
        }
    </script>
</body>

</html>
