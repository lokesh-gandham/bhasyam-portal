<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assessments</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
      @font-face {
            font-family: 'CCSYBold';
            src: url('./assets/CCSYBOLD.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
               font-family: "CCSYBold";
                 font-weight: 400;
             

        }

        body {
            height: 100vh;
            overflow: hidden;
            background: url("./assets/images/bg.jpg");
            background-size: 100% 100%;
        }

        .app {
            height: 100vh;
            display: flex;
            background: #f3f3f3d7;
        }

        .sidebar {
            width: 300px;
            padding: 25px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0px;
        }

        .island-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    height:78px;
    padding:18px 22px;

    border-radius:22px;
    cursor:pointer;

    background:rgba(255,255,255,.82);
    border:2px solid rgba(255,255,255,.9);

    color:#284b63;
    font-size:19px;
    font-weight:600;

    box-shadow:
    0 8px 25px rgba(0,0,0,.08);

    transition:.35s;
}

.island-btn:hover{

    transform:translateY(-5px);

    box-shadow:
    0 16px 35px rgba(0,0,0,.15);

    background:#ffffff;
}

        .option-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
.option-num{

width:44px;
height:44px;

border-radius:50%;

background:#f3f4f6;

display:flex;
align-items:center;
justify-content:center;

transition:.35s;
}

.island-btn.active .option-num{

background:rgba(255,255,255,.25);

color:white;

transform:rotate(-8deg) scale(1.1);
}

.island-btn.active .option-num span{
color:white;
}

        .option-num span {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9a8ab8;
            font-size: 17px;
            transition: all 0.3s ease;
        }

        .island-btn:hover .option-num {
            background: rgba(200, 180, 220, 0.4);
            transform: scale(1.05) rotate(3deg);
        }
.island-btn.active{

    color:#2f4f4f;

    border:none;

    transform:translateX(8px);

    box-shadow:
    0 14px 30px rgba(0,0,0,.22);
}
.island-btn.active .option-num{

    background:rgba(255,255,255,.25);

    color:white;

    transform:rotate(-8deg) scale(1.1);
}
        .island-btn.active .option-num span {
            color: #ffffff;
        }
.island-btn:hover .option-num{

transform:rotate(10deg) scale(1.12);

background:#e8f0ff;
}
        /* Pastel color themes - each with unique vibrant personality */
        /* Soft Pastel Active Colors */

.o1.active{
    background:linear-gradient(135deg,#FFE5EC,#FFD6E7);
    border-color:#FF8EB5;
}

.o2.active{
    background:linear-gradient(135deg,#E3F5FF,#CDEFFF);
    border-color:#6EC8FF;
}

.o3.active{
    background:linear-gradient(135deg,#E7F9E7,#D5F5D5);
    border-color:#59CF59;
}

.o4.active{
    background:linear-gradient(135deg,#FFF8DD,#FFF0B8);
    border-color:#ECBC41;
}
.o5.active{
    background:linear-gradient(135deg,#EAF7FF,#D8EEFF);
    border-color:#5AA9E6;
}

.o6.active{
    background:linear-gradient(135deg,#F3E9FF,#E6D6FF);
    border-color:#AC75E4;
}

.o7.active{
    background:linear-gradient(135deg,#FFEBDD,#FFD9C2);
    border-color:#F7A072;
}
.island-btn.active{
    color:#36454F;
    font-weight:600;
}
/* Active Icon Colors */

.o1.active .option-num{
    background:#ff5c93;
}
.o2.active .option-num{
    background:#1da1f2;
}
.o3.active .option-num{
    background:#2fbf71;
}
.o4.active .option-num{
    background:#f4b400;
}
.o5.active .option-num{
    background:#5AA9E6;
}
.o6.active .option-num{
    background:#8b5cf6;
}
.o7.active .option-num{
    background:#f97316;
}

/* Icon color */
.island-btn.active .option-num span,
.island-btn.active .option-num i{
    color:#ffffff;
}
        .main {
            flex: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:1065px) {
            .app {
                flex-direction: column;
            }

            .sidebar {
                display: none;
            }

            iframe {
                border-radius: 0px;
            }

            .menu-btn {
                display: block;
                position: fixed;
                top: 8px;
                right: 15px;
                font-size: 26px;
                background: #c084fc;
                color: white;
                border: none;
                border-radius: 50px;
                padding: 8px 16px;
                cursor: pointer;
                z-index: 5000;
                box-shadow: 0 4px 15px rgba(192, 132, 252, 0.4);
            }

            .offcanvas {
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.08);
                backdrop-filter: blur(6px);
                display: none;
                z-index: 4000;
            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: 300px;
                height: 100%;
                background: rgba(255, 248, 252, 0.95);
                padding: 0px;
                padding-top: 0px;
                transform: translateX(100%);
                transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
                overflow-y: hidden;
                backdrop-filter: blur(10px);
            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
                padding: 20px;
            }

            .offcanvas-panel .island-btn {
                margin-bottom: 16px;
            }
        }

        @media (min-width: 900px) and (max-height: 800px) {
            .app {
                transform: scaleY(0.95);
                transform-origin: top center;
                height: calc(100vh / 0.95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {
            .app {
                transform: scaleY(0.9);
                transform-origin: top center;
                height: calc(100vh / 0.9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {
            .app {
                transform: scaleY(0.85);
                transform-origin: top center;
                height: calc(100vh / 0.85);
            }
        }

        @media (min-width: 900px) and (max-height: 500px) {
            .app {
                transform: scaleY(0.8);
                transform-origin: top center;
                height: calc(100vh / 0.8);
            }
        }

        @media screen and (min-width: 1025px) and (max-width: 1440px) {
            .sidebar {
                width: 300px;
                padding: 26px 22px;
                gap: 24px;
            }

            .island-btn {
                font-size: 20px;
                padding: 18px 15px;
            }

            .option-num {
                width: 38px;
                height: 38px;
            }
        }

        @media screen and (min-width: 1441px) and (max-width: 1920px) {
            .sidebar {
                width: 380px;
                padding: 30px 26px;
                gap: 28px;
            }

            .island-btn {
                font-size: clamp(19px, 1.1vw, 22px);
                padding: 20px 20px;
                border-radius: 22px;
            }

            .option-left {
                gap: 18px;
            }

            .option-num {
                width: 42px;
                height: 42px;
                border-radius: 14px;
            }
        }

        @media screen and (min-width: 1921px) {
            .sidebar {
                width: 420px;
                padding: 36px 30px;
                gap: 36px;
            }

            .island-btn {
                font-size: clamp(21px, 1.2vw, 26px);
                padding: 24px 30px;
                border-radius: 50px;
            }

            .option-left {
                gap: 22px;
            }

            .option-num {
                width: 48px;
                height: 48px;
                border-radius: 16px;
            }

            iframe {
                border-radius: 44px 0 0 44px;
            }
        }
    </style>
</head>

<body>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="app">
        <div class="sidebar">
             <div class="island-btn o1 active" onclick="openIsland(0)">
    <div class="option-left">
        <div class="option-num">
            <span><i class="fa-solid fa-pen-to-square"></i></span>
        </div>
        <div>Fill In The Blanks</div>
    </div>
</div>

<div class="island-btn o2" onclick="openIsland(1)">
    <div class="option-left">
        <div class="option-num">
            <span><i class="fa-solid fa-check-double"></i></span>
        </div>
        <div>Correct Option</div>
    </div>
</div>
 <div class="island-btn o4" onclick="openIsland(2)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-link"></i></span></div>
                    <div>Matching</div>
                </div>
            </div>
            <div class="island-btn o3" onclick="openIsland(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-scale-balanced"></i></span></div>
                    <div>Correct Synonym</div>
                </div>
            </div>
            
           
            <div class="island-btn o5" onclick="openIsland(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-spell-check"></i></span></div>
                    <div>Antonym Word</div>
                </div>
            </div>
           
            <!-- NEW "Correct Verb" menu item (o7) -->
            <div class="island-btn o6" onclick="openIsland(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-flag"></i></span></div>
                    <div>Correct Verb</div>
                </div>
            </div>
        </div>
        <div class="main"> <iframe id="contentFrame" src="./exercises/fillintheblanks.html"></iframe> </div>
    </div>
    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">
        <div class="offcanvas-panel" onclick="event.stopPropagation()">
           <div class="island-btn o1 active" onclick="openIsland(0)">
    <div class="option-left">
        <div class="option-num">
            <span><i class="fa-solid fa-pen-to-square"></i></span>
        </div>
        <div>Fill in the Blanks</div>
    </div>
</div>

<div class="island-btn o2" onclick="openIsland(1)">
    <div class="option-left">
        <div class="option-num">
            <span><i class="fa-solid fa-check-double"></i></span>
        </div>
        <div>Correct Option</div>
    </div>
</div>
   <div class="island-btn o4" onclick="mobileOpen(2)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-scale-balanced"></i></span></div>
                    <div>Matching</div>
                </div>
            </div>
            <div class="island-btn o3" onclick="mobileOpen(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-scale-balanced"></i></span></div>
                    <div>Correct Synonym</div>
                </div>
            </div>
            
         
            <div class="island-btn o5" onclick="mobileOpen(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-spell-check"></i></span></div>
                    <div>Antonym Word</div>
                </div>
            </div>
           
            <!-- NEW mobile "Correct Verb" -->
            <div class="island-btn o6" onclick="mobileOpen(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-flag"></i></span></div>
                    <div>Correct Verb</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const sidebarButtons = document.querySelectorAll(".sidebar .island-btn");
        const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");
        const frame = document.getElementById("contentFrame");
        const pages = [
            "./exercises/fillintheblanks.html",
            "./exercises/mcq.html",
             "./exercises/matching.html",
            "./exercises/synonym.html",

            "./exercises/antonyms_grid.html",
          
            "./exercises/tenseform.html"   // new page for Correct Verb
        ];

        function openIsland(index) {
            sidebarButtons.forEach(btn => btn.classList.remove("active"));
            sidebarButtons[index].classList.add("active");
            mobileButtons.forEach(btn => btn.classList.remove("active"));
            mobileButtons[index].classList.add("active");
            frame.src = pages[index];
        }

        function toggleMenu() {
            if (window.innerWidth > 1065) return;
            document.getElementById("offcanvas").classList.toggle("show");
        }

        function mobileOpen(i) {
            openIsland(i);
            toggleMenu();
        }
    </script>
</body>

</html>
