<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Assessments</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
       @font-face {
            font-family: 'CCSYBold';
            src: url('./assets/CCSYBOLD.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
               font-family: "CCSYBold";
                 font-weight: 400;
             

        }
        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(132deg, #faeaee, rgb(253, 255, 253));
            background-size: 4px 4px;
        }

        .app {
            height: 100vh;
            display: flex;
            background: rgba(206, 221, 217, 0.55);
        }

        .sidebar {
            width: 310px;

            padding: 25px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;

            gap: 0px;
        }

        /* OPTION BUTTON - PREMIUM WATER FLOW ANIMATION */
/* ===============================
   Premium Capsule Button
==================================*/

.island-btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:72px;
    padding:0 22px;
    margin:8px 0;
    border-radius:999px;
    cursor:pointer;

    background:#ffffff;
    border:1px solid #E8E8E8;

    box-shadow:
        0 2px 8px rgba(0,0,0,.04),
        0 8px 24px rgba(0,0,0,.05);

    transition:.35s ease;
    
}

.island-btn:hover{
    transform:translateY(-3px);
    box-shadow:
        0 6px 18px rgba(0,0,0,.08),
        0 14px 28px rgba(0,0,0,.08);
}

/* remove old water animation */
.island-btn::before{
    display:none;
}

.option-left{
    display:flex;
    align-items:center;
    gap:16px;
}

/* Icon Circle */

.option-num{
    width:46px;
    height:46px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:white;

    border:1px solid #ECECEC;

    box-shadow:
        0 4px 10px rgba(0,0,0,.06);

    font-size:19px;
    color:#5B6472;

    transition:.35s;
}

/* Text */

.option-left div:last-child{

    font-size:20px;


   color:#5B6472;
}

/* Right Arrow */

.island-btn::after{

    content:"›";

    font-size:26px;

    color:#B4B4B4;

    transition:.3s;
}

.island-btn:hover::after{

    transform:translateX(6px);

    color:#7C7C7C;
}


/* ===================================
   ACTIVE BUTTON
===================================*/

.island-btn.active{

    transform:translateX(8px);

    border:none;

    box-shadow:
        0 12px 28px rgba(0,0,0,.10);
        
    

}

.island-btn.active .option-num{

    transform:scale(1.08);
}

.island-btn.active .option-left div:last-child{

   color:#2f4f4f;
}


/* ===================================
   Pastel Active Colors
===================================*/

.o1.active{
    background:#FFE8D8;
}

.o2.active{
    background:#E2F3FF;
}

.o3.active{
    background:#EAF8DD;
}

.o4.active{
    background:#FFF4CC;
}

.o5.active{
    background:#FFE5EF;
}

.o6.active{
    background:#DDF7F4;
}


/* Icon Color */

.o1.active .option-num{
    color:#D97706;
}

.o2.active .option-num{
    color:#0284C7;
}

.o3.active .option-num{
    color:#65A30D;
}

.o4.active .option-num{
    color:#CA8A04;
}

.o5.active .option-num{
    color:#DB2777;
}

.o6.active .option-num{
    color:#0F766E;
}
        /* TRIGGERS OUTWARD FLUID FLOW (WIDTH 100%) */
        .island-btn.active::before {
            width: 100%;
            opacity: 1;
        }

        /* ACTIVE TICK TICKING */


        .main {
            flex: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* MOBILE */

        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:1065px) {

            .app {
                flex-direction: column;
            }

            .sidebar {
                display: none;
            }

            .menu-btn {
                display: block;
                position: fixed;
                top: 8px;
                right: 15px;
                font-size: 26px;
                background: #e9a106;
                color: white;
                border: none;
                border-radius: 10px;
                padding: 6px 12px;
                cursor: pointer;
                z-index: 5000;
            }

            .offcanvas {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, .45);
                display: none;
                z-index: 4000;
            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: 300px;
                height: 100%;
                background: #f1f5f9;
                padding: 0px;
                padding-top: 0px;
                transform: translateX(100%);
                transition: .3s;
                overflow-y: hidden;
            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
                padding: 20px;
            }

            .offcanvas-panel .island-btn {
                margin-bottom: 12px;
            }

        }

        @media (min-width: 900px) and (max-height: 800px) {
            .app {
                transform: scaleY(0.95);
                transform-origin: top center;
                height: calc(100vh / 0.95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {
            .app {
                transform: scaleY(0.9);
                transform-origin: top center;
                height: calc(100vh / 0.9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {
            .app {
                transform: scaleY(0.85);
                transform-origin: top center;
                height: calc(100vh / 0.85);
            }
        }

        @media (min-width: 900px) and (max-height: 500px) {
            .app {
                transform: scaleY(0.8);
                transform-origin: top center;
                height: calc(100vh / 0.8);
            }
        }

        /* ============================= */
        /* Desktop / Monitor (1025–1440) */
        /* ============================= */
        @media screen and (min-width: 1025px) and (max-width: 1440px) {

            .sidebar {
                width: 310px;
                padding: 26px 22px;
                gap: 24px;
            }

            .island-btn {
                font-size: 20px;
                padding: 18px 22px;
            }

            .option-num {
                width: 38px;
                height: 38px;
                font-size: 17px;
            }
        }

        /* ============================= */
        /* Large Monitors (1441–1920) */
        /* ============================= */
        @media screen and (min-width: 1441px) and (max-width: 1920px) {

            .sidebar {
                width: 380px;
                padding: 30px 26px;
                gap: 18px;
            }

            .island-btn {
                font-size:20px;
                padding: 20px 26px;
                border-radius: 999px;
            }

            .option-left {
                gap: 18px;
            }

            .option-num {
                width: 42px;
                height: 42px;
                font-size: 19px;
            }
        }

        /* ============================= */
        /* Extra Large Screens / 4K */
        /* ============================= */
        @media screen and (min-width: 1921px) {

            .sidebar {
                width: 420px;
                padding: 36px 30px;
                gap: 36px;
            }

            .island-btn {
                font-size: clamp(21px, 1.2vw, 26px);
                padding: 24px 30px;
                border-radius: 26px;
            }

            .option-left {
                gap: 22px;
            }

            .option-num {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }

            iframe {
                border-radius: 14px;
            }
        }
    </style>
</head>

<body>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <div class="app">

        <div class="sidebar">
            <div class="island-btn o1 active" onclick="openIsland(0)">
                <div class="option-left">
                    <div class="option-num"><span> <i class="fa-solid fa-pen-to-square"></i></span></div>
                    <div>Fill In The Blanks</div>
                </div>
            </div>

            <div class="island-btn o2" onclick="openIsland(1)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-check-double"></i></span></div>
                    <div>Correct Option</div>
                </div>
            </div>

            <div class="island-btn o3" onclick="openIsland(2)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-arrows-split-up-and-left"></i></span></div>
                    <div>One Word</div>
                </div>
            </div>

            <div class="island-btn o6" onclick="openIsland(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-arrow-right-arrow-left"></i></span></div>
                    <div>Synonym Word</div>
                </div>
            </div>

            <div class="island-btn o5" onclick="openIsland(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-lightbulb"></i></span></div>
                    <div>Antonym Word</div>
                </div>
            </div>

            <div class="island-btn o4" onclick="openIsland(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-link"></i></span></div>
                    <div>Correct Verb</div>
                </div>
            </div>
        </div>

        <div class="main">
            <iframe id="contentFrame" src="./exercises/fillintheblanks.html"></iframe>
        </div>

    </div>

    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

        <div class="offcanvas-panel" onclick="event.stopPropagation()">

            <div class="island-btn o1 active" onclick="mobileOpen(0)">
                <div class="option-left">
                    <div class="option-num"><span> <i class="fa-solid fa-pen-to-square"></i></span></div>
                    <div>Fill in the Blanks</div>
                </div>
            </div>

            <div class="island-btn o2" onclick="mobileOpen(1)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-circle-check"></i></span></div>
                    <div>Correct Option</div>
                </div>
            </div>

            <div class="island-btn o3" onclick="mobileOpen(2)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-scale-balanced"></i></span></div>
                    <div>One Word</div>
                </div>
            </div>

            <div class="island-btn o5" onclick="mobileOpen(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-font"></i></span></div>
                    <div>Synonym Word</div>
                </div>
            </div>

            <div class="island-btn o6" onclick="mobileOpen(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-lightbulb"></i></span></div>
                    <div>Antonym Word</div>
                </div>
            </div>

            <div class="island-btn o4" onclick="mobileOpen(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-link"></i></span></div>
                    <div>Correct Verb</div>
                </div>
            </div>
        </div>

    </div>

    <script>

        const sidebarButtons = document.querySelectorAll(".sidebar .island-btn");
        const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");

        const frame = document.getElementById("contentFrame");

        const pages = [

            "./exercises/fillintheblanks.html",
            "./exercises/mcq.html",
            "./exercises/oneword.html",
            "./exercises/Synonym2.html",
            "./exercises/antonym.html",
            "./exercises/tenseform2.html",

        ];

        function openIsland(index) {

            sidebarButtons.forEach(btn => btn.classList.remove("active"));
            sidebarButtons[index].classList.add("active");

            mobileButtons.forEach(btn => btn.classList.remove("active"));
            mobileButtons[index].classList.add("active");

            frame.src = pages[index];

        }

        function toggleMenu() {

            if (window.innerWidth > 1065) return;

            document.getElementById("offcanvas").classList.toggle("show");

        }

        function mobileOpen(i) {

            openIsland(i);
            toggleMenu();

        }

    </script>

</body>

</html>
