<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--lesson-body-font);
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: url("assets/images/bg.jpg");
      background-size: 100% 100%;
    }

    .app {
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 300px;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(8px);
    }

    .pill-btn {
      display: grid;
      grid-template-columns: 52px 1fr 28px;
      align-items: center;
      column-gap: 10px;
      height: 82px;
      padding: 0 10px 0 10px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      color: #4a4a5a;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      position: relative;
    }

    .o1 { background: rgba(245,158,11,0.10); }
    .o2 { background: rgba(216,132,62,0.10); }
    .o3 { background: rgba(16,185,129,0.10); }
    .o4 { background: rgba(6,182,212,0.10); }
    .o5 { background: rgba(139,92,246,0.10); }
    .o6 { background: rgba(236,72,153,0.10); }
    .o7 { background: rgba(59,130,246,0.10); }

    .pill-icon {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .pill-btn .pill-text {
      min-width: max-content;
      white-space: nowrap;
      font-size: 21px;
      font-weight: 500;
      color: #4a4a5a;
      transition: color 0.3s ease;
    }

    .pill-btn .pill-check {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: 2px solid #d0d0d0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      background: rgba(255,255,255,0.8);
      flex-shrink: 0;
      transition: all 0.3s ease;
      margin-right: 0;
    }

    .o1:hover { background: rgba(245,158,11,0.20); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,158,11,0.10); }
    .o2:hover { background: rgba(216,132,62,0.20); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(216,132,62,0.10); }
    .o3:hover { background: rgba(16,185,129,0.20); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(16,185,129,0.10); }
    .o4:hover { background: rgba(6,182,212,0.20); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(6,182,212,0.10); }
    .o5:hover { background: rgba(139,92,246,0.20); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(139,92,246,0.10); }
    .o6:hover { background: rgba(236,72,153,0.20); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(236,72,153,0.10); }
    .o7:hover { background: rgba(59,130,246,0.20); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59,130,246,0.10); }

    .o1.active { background: rgba(245,158,11,0.18); border-color: #f59e0b; box-shadow: 0 4px 20px rgba(245,158,11,0.20); }
    .o2.active { background: rgba(216,132,62,0.18); border-color: #d8843e; box-shadow: 0 4px 20px rgba(216,132,62,0.20); }
    .o3.active { background: rgba(16,185,129,0.18); border-color: #10b981; box-shadow: 0 4px 20px rgba(16,185,129,0.20); }
    .o4.active { background: rgba(6,182,212,0.18); border-color: #06b6d4; box-shadow: 0 4px 20px rgba(6,182,212,0.20); }
    .o5.active { background: rgba(139,92,246,0.18); border-color: #8b5cf6; box-shadow: 0 4px 20px rgba(139,92,246,0.20); }
    .o6.active { background: rgba(236,72,153,0.18); border-color: #ec4899; box-shadow: 0 4px 20px rgba(236,72,153,0.20); }
    .o7.active { background: rgba(59,130,246,0.18); border-color: #3b82f6; box-shadow: 0 4px 20px rgba(59,130,246,0.20); }

    .pill-btn.active .pill-text { font-weight: 600; color: #2a2a3a; }
    .pill-btn.active .pill-check { background: #7c5cbf; border-color: #7c5cbf; color: #fff; }
    .pill-btn.active .pill-check::after { content: "\2714"; }

    .pill-btn.active .pill-icon { transform: scale(1.08); }

    .o1 .pill-icon { color: #f59e0b; }
    .o2 .pill-icon { color: #d8843e; }
    .o3 .pill-icon { color: #10b981; }
    .o4 .pill-icon { color: #06b6d4; }
    .o5 .pill-icon { color: #8b5cf6; }
    .o6 .pill-icon { color: #ec4899; }
    .o7 .pill-icon { color: #3b82f6; }

    .main {
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    .menu-btn {
      display: none;
    }

    .offcanvas {
      display: none;
    }

    @media(max-width:1065px) {
      .app {
        flex-direction: column;
      }
      .sidebar {
        display: none;
      }
      .menu-btn {
        display: block;
        position: fixed;
        top: 6px;
        right: 12px;
        font-size: 22px;
        background: #e9a106;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 4px 10px;
        cursor: pointer;
        z-index: 5000;
      }
      .offcanvas {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .4);
        display: none;
        z-index: 4000;
      }
      .offcanvas.show {
        display: block;
      }
      .offcanvas-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: 300px;
        height: 100%;
        background: rgba(255,255,255,0.9);
        backdrop-filter: blur(8px);
        padding: 0px;
        padding-top: 0px;
        transform: translateX(100%);
        transition: .3s;
        overflow-y: auto;
      }
      .offcanvas.show .offcanvas-panel {
        transform: translateX(0);
        padding: 55px 14px 14px;
      }
      .offcanvas-panel .pill-btn { grid-template-columns: 46px 1fr 22px; column-gap: 10px; margin-bottom: 8px; height: 64px; font-size: 16px; padding: 0 12px; border-radius: 8px; }
      .offcanvas-panel .pill-btn .pill-icon { width: 46px; height: 46px; font-size: 17px; }
      .offcanvas-panel .pill-btn .pill-text { font-size: 16px; }
      .offcanvas-panel .pill-btn .pill-check { width: 22px; height: 22px; font-size: 12px; }
    }

    @media (min-width: 900px) and (max-height: 800px) {
      .app {
        transform: scaleY(0.95);
        transform-origin: top center;
        height: calc(100vh / 0.95);
      }
    }

    @media (min-width: 900px) and (max-height: 700px) {
      .app {
        transform: scaleY(0.9);
        transform-origin: top center;
        height: calc(100vh / 0.9);
      }
    }

    @media (min-width: 900px) and (max-height: 600px) {
      .app {
        transform: scaleY(0.85);
        transform-origin: top center;
        height: calc(100vh / 0.85);
      }
    }

    @media (min-width: 900px) and (max-height: 500px) {
      .app {
        transform: scaleY(0.8);
        transform-origin: top center;
        height: calc(100vh / 0.8);
      }
    }

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .sidebar { width: 330px; padding: 18px 16px; gap: 10px; }
      .pill-btn { grid-template-columns: 50px 1fr 26px; column-gap: 10px; font-size: 20px; height: 76px; padding: 0 14px; border-radius: 8px; }
      .pill-btn .pill-icon { width: 50px; height: 50px; font-size: 20px; }
      .pill-btn .pill-text { font-size: 22px; }
      .pill-btn .pill-check { width: 26px; height: 26px; font-size: 12px; }
    }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .sidebar { width: 350px; padding: 20px 18px; gap: 12px; }
      .pill-btn { grid-template-columns: 56px 1fr 28px; column-gap: 12px; font-size: 18px; height: 84px; padding: 0 16px; border-radius: 8px; }
      .pill-btn .pill-icon { width: 56px; height: 56px; font-size: 20px; }
      .pill-btn .pill-text { font-size: 21px; }
      .pill-btn .pill-check { width: 28px; height: 28px; font-size: 13px; }
    }

    @media screen and (min-width: 1921px) {
      .sidebar { width: 370px; padding: 22px 20px; gap: 14px; }
      .pill-btn { grid-template-columns: 62px 1fr 30px; column-gap: 14px; font-size: 20px; height: 92px; padding: 0 18px; border-radius: 8px; }
      .pill-btn .pill-icon { width: 62px; height: 62px; font-size: 22px; }
      .pill-btn .pill-text { font-size: 21px; }
      .pill-btn .pill-check { width: 30px; height: 30px; font-size: 14px; }
      iframe { border-radius: 10px; }
    }
  </style>
<link rel="stylesheet" href="../grade1-typography.css?v=grade1font1">
</head>

<body>

  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <div class="app">

    <div class="sidebar">

      <div class="pill-btn o1 active" onclick="openIsland(0)">
        <div class="pill-icon"><i class="fa-solid fa-thumbs-up"></i></div>
        <span class="pill-text">Choose Options</span>
        <div class="pill-check"></div>
      </div>
      <div class="pill-btn o2" onclick="openIsland(1)">
        <div class="pill-icon"><i class="fa-solid fa-book-open"></i></div>
        <span class="pill-text">Meanings</span>
        <div class="pill-check"></div>
      </div>
      <div class="pill-btn o3" onclick="openIsland(2)">
        <div class="pill-icon"><i class="fa-solid fa-arrows-left-right"></i></div>
        <span class="pill-text">Opposites</span>
        <div class="pill-check"></div>
      </div>
      <div class="pill-btn o4" onclick="openIsland(3)">
        <div class="pill-icon"><i class="fa-solid fa-layer-group"></i></div>
        <span class="pill-text">Singular / Plural</span>
        <div class="pill-check"></div>
      </div>
      <div class="pill-btn o5" onclick="openIsland(4)">
        <div class="pill-icon"><i class="fa-solid fa-people-group"></i></div>
        <span class="pill-text">Family Grid</span>
        <div class="pill-check"></div>
      </div>
      <div class="pill-btn o6" onclick="openIsland(5)">
        <div class="pill-icon"><i class="fa-solid fa-font"></i></div>
        <span class="pill-text">Common Nouns</span>
        <div class="pill-check"></div>
      </div>
      <div class="pill-btn o7" onclick="openIsland(6)">
        <div class="pill-icon"><i class="fa-solid fa-link"></i></div>
        <span class="pill-text">Matching</span>
        <div class="pill-check"></div>
      </div>

    </div>

    <div class="main">
      <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>
    </div>

  </div>

  <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

    <div class="offcanvas-panel" onclick="event.stopPropagation()">

      <div class="pill-btn o1 active" onclick="mobileOpen(0)">
        <div class="pill-icon"><i class="fa-solid fa-thumbs-up"></i></div>
        <span class="pill-text">Choose Options</span>
        <div class="pill-check"></div>
      </div>
      <div class="pill-btn o2" onclick="mobileOpen(1)">
        <div class="pill-icon"><i class="fa-solid fa-book-open"></i></div>
        <span class="pill-text">Meanings</span>
        <div class="pill-check"></div>
      </div>
      <div class="pill-btn o3" onclick="mobileOpen(2)">
        <div class="pill-icon"><i class="fa-solid fa-arrows-left-right"></i></div>
        <span class="pill-text">Opposites</span>
        <div class="pill-check"></div>
      </div>
      <div class="pill-btn o4" onclick="mobileOpen(3)">
        <div class="pill-icon"><i class="fa-solid fa-layer-group"></i></div>
        <span class="pill-text">Singular / Plural</span>
        <div class="pill-check"></div>
      </div>
      <div class="pill-btn o5" onclick="mobileOpen(4)">
        <div class="pill-icon"><i class="fa-solid fa-people-group"></i></div>
        <span class="pill-text">Family Grid</span>
        <div class="pill-check"></div>
      </div>
      <div class="pill-btn o6" onclick="mobileOpen(5)">
        <div class="pill-icon"><i class="fa-solid fa-font"></i></div>
        <span class="pill-text">Common Nouns</span>
        <div class="pill-check"></div>
      </div>
      <div class="pill-btn o7" onclick="mobileOpen(6)">
        <div class="pill-icon"><i class="fa-solid fa-link"></i></div>
        <span class="pill-text">Matching</span>
        <div class="pill-check"></div>
      </div>

    </div>

  </div>

  <script>

    const sidebarButtons = document.querySelectorAll(".sidebar .pill-btn");
    const mobileButtons = document.querySelectorAll(".offcanvas .pill-btn");

    const frame = document.getElementById("contentFrame");

    const pages = [
      "./exercises/mcq.html",
      "./exercises/match_meanings.html",
      "./exercises/opposites.html",
      "./exercises/singular_plural.html",
      "./exercises/pronouns.html",
      "./exercises/common_nouns.html",
      "./exercises/match_following.html"
    ];

    function openIsland(index) {
      sidebarButtons.forEach(btn => btn.classList.remove("active"));
      sidebarButtons[index].classList.add("active");

      mobileButtons.forEach(btn => btn.classList.remove("active"));
      mobileButtons[index].classList.add("active");

      frame.src = pages[index];
    }

    function toggleMenu() {
      if (window.innerWidth > 1065) return;
      document.getElementById("offcanvas").classList.toggle("show");
    }

    function mobileOpen(i) {
      openIsland(i);
      toggleMenu();
    }

  </script>
</body>
</html>
