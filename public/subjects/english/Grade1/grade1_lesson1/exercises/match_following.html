<!DOCTYPE html>
<html lang="en">
<head>
  <style>html,body{background:transparent!important;backdrop-filter:none!important}</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../assets/CSS/match.css?v=lesson1fix10">
<link rel="stylesheet" href="../../grade1-typography.css?v=grade1font1">
  <style>
    /* The board is pinned to 100vh with overflow hidden, so on a short screen the
       bottom row was simply cut off. The board already flexes into the leftover
       height, so let the rows divide that height instead of each taking a fixed
       120px. Tall screens are unchanged -- the image still caps at its 100px. */
    /* The container needs a definite height to constrain the rows. match.css only
       gives body a min-height, so a plain height:100% would resolve against an
       auto-height body and let the board grow straight past the viewport. */
    html, body {
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    body .match-container {
      height: 100%;
      min-height: 0;
    }
    .match-container .match-board {
      align-items: stretch;
      min-height: 0;
    }
    .match-container .match-column {
      height: 100%;
      min-height: 0;
      /* match.css uses repeat(4, 1fr); a bare 1fr has a min-content floor, so the
         rows could never shrink below the 100px image. minmax(0, 1fr) lets them. */
      grid-template-rows: repeat(4, minmax(0, 1fr));
      grid-auto-rows: minmax(0, 1fr);
      row-gap: clamp(4px, 1vh, 8px);
    }
    .match-container .match-item {
      height: 100%;
      min-height: 0;
    }
    .match-container .match-item-img {
      height: 100%;
      max-height: 100px;
      width: auto;
      aspect-ratio: 1 / 1;
    }
    .match-container .match-item-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* Column A is words only, so centre the word in the card. */
    .match-container .match-item.text-only {
      justify-content: center;
      text-align: center;
    }
    @media (max-height: 640px) {
      .match-container .match-header h2 { font-size: 24px !important; }
      .match-container .match-header .hint { font-size: 14px; }
      .match-container .match-header { margin-bottom: 6px; }
    }
  </style>

</head>
<body>

  <div class="match-container matching-section">

    <div class="match-header">
      <h2 id="question">Match the following</h2>
    </div>

    <div class="match-board" id="matchBoard"></div>

  </div>

  <div id="answerPopup" class="kid-popup">
    <div class="kid-card">
      <div class="kid-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <div id="finalPopup">
    <div class="final-kid-box">
      <h2>&#127881; Congratulations!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div>
      <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

  <script src="../assets/JavaScript/match_following.js?v=lesson1words1"></script>
  <script src="../../shared/answer-frame.js?v=grade1frame5"></script>

</body>
</html>
