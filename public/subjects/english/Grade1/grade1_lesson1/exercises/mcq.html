<!DOCTYPE html>
<html lang="en">

<head>
  <style>html,body{background:transparent!important}.option:hover{background:rgba(255,255,255,0.85)!important;border-color:#7c5cbf!important;border-width:2px!important}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../assets/CSS/mcq.css?v=lesson1fix13">
<link rel="stylesheet" href="../../grade1-typography.css?v=grade1font1">
  <style>
    .option, .option > span, .option > div > span { font-size: 30px !important; }
    .mcq-choice-quiz .option, .mcq-choice-quiz .option > span, .mcq-choice-quiz .option > div > span { font-size: 25px !important; }
    @media (min-width:1025px) and (max-width:1440px) {
      #question, .mcq-choice-quiz #question { font-size: 30px !important; }
      .option, .option > span, .option > div > span { font-size: 25px !important; }
      .mcq-choice-quiz .option, .mcq-choice-quiz .option > span, .mcq-choice-quiz .option > div > span { font-size: 25px !important; }
    }
    @media (min-width:1441px) and (max-width:1920px) {
      .option, .option > span, .option > div > span { font-size: 38px !important; }
      .mcq-choice-quiz .option, .mcq-choice-quiz .option > span, .mcq-choice-quiz .option > div > span { font-size: 40px !important; }
    }
    @media (min-width:1921px) {
      .option, .option > span, .option > div > span { font-size: 42px !important; }
      .mcq-choice-quiz .option, .mcq-choice-quiz .option > span, .mcq-choice-quiz .option > div > span { font-size: 52px !important; }
    }
  </style>
</head>

<body>

    <div class="quiz mcq-choice-quiz">

        <div class="content-row">
            <div class="question-image">
                <img id="questionImg" src="" alt="">
            </div>
            <div class="answer-panel">
                <h2 id="question"></h2>
                <div class="options" id="options"></div>
            </div>
        </div>

        <div class="controls">
            <button class="prev" id="prevBtn"><i style="margin-right: 5px;" class="fa-solid fa-angles-left"></i> Prev</button>
            <button class="next" id="nextBtn">Next <i style="margin-left: 5px;" class="fa-solid fa-angles-right"></i></button>
        </div>

    </div>

    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>&#127881; Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">
                Play Again
            </button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script src="../assets/JavaScript/mcq.js"></script>
    <script src="../../shared/answer-frame.js?v=grade1frame5"></script>

</body>
</html>
