<!DOCTYPE html>
<html lang="en">

<head>
  <style>html,body{background:transparent!important}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../assets/CSS/scramble.css?v=lesson1fixmsg18">
<link rel="stylesheet" href="../../grade1-typography.css?v=grade1font1">

  <style>
    @media (min-width:1025px) and (max-width:1440px) {
      .opposites-quiz .letter-circle { font-size: 36px !important; }
    }
    @media (min-width:1441px) and (max-width:1920px) {
      .opposites-quiz .letter-circle { font-size: 44px !important; }
    }
    @media (min-width:1921px) {
      .opposites-quiz .letter-circle { font-size: 50px !important; }
    }
  </style>
  <style>
    @media (min-width:1025px) and (max-width:1440px) {
      .letters-container {
        max-width: 560px !important;
        gap: 12px !important;
      }

      .opposites-quiz .letter-circle {
        width: 72px !important;
        height: 72px !important;
        font-size: 36px !important;
      }

      .answer-display {
        flex-wrap: nowrap !important;
        max-width: 640px !important;
        gap: 12px !important;
      }

      html body .answer-display .letter-slot {
        width: 70px !important;
        height: 82px !important;
        font-size: 42px !important;
        line-height: 1 !important;
      }
    }
    @media (min-width:1441px) and (max-width:1920px) {
      .letters-container {
        max-width: 640px !important;
        gap: 14px !important;
      }

      .opposites-quiz .letter-circle {
        width: 86px !important;
        height: 86px !important;
        font-size: 44px !important;
      }

      .answer-display {
        flex-wrap: nowrap !important;
        max-width: 720px !important;
        gap: 14px !important;
      }

      html body .answer-display .letter-slot {
        width: 82px !important;
        height: 96px !important;
        font-size: 56px !important;
        line-height: 1 !important;
      }
    }
    @media (min-width:1921px) {
      .letters-container {
        max-width: 700px !important;
        gap: 16px !important;
      }

      .opposites-quiz .letter-circle {
        width: 96px !important;
        height: 96px !important;
        font-size: 50px !important;
      }

      .answer-display {
        flex-wrap: nowrap !important;
        max-width: 800px !important;
        gap: 16px !important;
      }

      html body .answer-display .letter-slot {
        width: 90px !important;
        height: 106px !important;
        font-size: 64px !important;
        line-height: 1 !important;
      }
    }
    @media (max-width:768px) {
      .opposites-quiz .letter-circle {
        width: 50px !important;
        height: 50px !important;
        font-size: 24px !important;
      }
    }
    @media (max-width:480px) {
      .opposites-quiz .letter-circle {
        width: 42px !important;
        height: 42px !important;
        font-size: 20px !important;
      }
    }
  </style>
</head>

<body>

    <div class="quiz opposites-quiz">

        <div class="content-row">

            <div class="question-image" id="questionImgWrapper">
                <img id="questionImg" src="" alt="">
            </div>

            <div class="right-content">

                <h2 id="question"></h2>

                <div class="answer-display" id="answerDisplay"></div>

                <div class="letters-container" id="lettersContainer"></div>

                <div class="action-buttons">
                    <button class="action-btn clear-btn" id="clearBtn"><i class="fa-solid fa-rotate-left"></i> Clear</button>
                </div>

                <div class="controls">
                    <button class="prev" id="prevBtn"><i style="margin-right: 5px;" class="fa-solid fa-angles-left"></i> Prev</button>
                    <button class="next" id="nextBtn">Next <i style="margin-left: 5px;" class="fa-solid fa-angles-right"></i></button>
                </div>

            </div>

        </div>

    </div>

    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>&#127881; Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">
                Play Again
            </button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script src="../assets/JavaScript/opposites.js"></script>
  <script src="../../shared/answer-frame.js?v=grade1frame5"></script>
</body>
</html>
