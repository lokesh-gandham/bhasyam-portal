<!DOCTYPE html>
<html lang="en">

<head>
  <style>html,body{background:transparent!important}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../assets/CSS/mcq.css?v=lesson1fix6">
    <style>
      body { overflow: hidden; }
      .family-page {
        width: min(100%, 1300px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px 28px 14px;
        display: grid;
        grid-template-columns: minmax(570px, 650px) minmax(400px, 500px);
        grid-template-rows: auto auto;
        gap: 18px 28px;
        align-items: stretch;
        align-content: start;
        justify-content: center;
      }
      .family-page > section:first-child {
        align-self: start;
      }
      .family-instruction {
        margin-bottom: 12px;
        color: #1a1a2e;
        font-size: 18px;
        font-weight: 400;
        line-height: 1.35;
        text-align: center;
      }
      .word-grid {
        display: grid;
        grid-template-columns: repeat(8, 60px);
        gap: 7px;
        justify-content: center;
        touch-action: none;
        user-select: none;
        padding: 18px;
        border-radius: 16px;
        background: rgba(255, 248, 225, 0.55);
        box-shadow: 0 4px 16px rgba(255, 235, 200, 0.3);
      }
      .letter-cell {
        width: 60px;
        height: 60px;
        border: 2px solid #d4a0c4;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        color: #3f3f4f;
        font-size: 27px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      }
      .letter-cell.active {
        background: #f5e6ff;
        border-color: #9b59b6;
        color: #5a2d7a;
        transform: scale(1.06);
        box-shadow: 0 0 0 3px rgba(155, 89, 182, 0.25), 0 0 16px rgba(155, 89, 182, 0.15);
      }
      .letter-cell.found {
        background: #e6f7ee;
        border-color: #4caf7a;
        color: #2d6a4f;
      }
      .letter-cell.wrong {
        background: #fce8e8;
        border-color: #e07070;
        color: #8a3030;
        animation: shake 0.35s ease;
      }
      .family-image-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .display-box {
        background: rgba(255, 255, 255, 0.82);
        border: 2px solid rgba(124, 92, 191, 0.12);
        border-radius: 16px;
        padding: 16px 16px 14px;
        box-shadow: 0 6px 20px rgba(124, 92, 191, 0.06);
        min-height: 430px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .display-header {
        text-align: center;
        font-size: 18px;
        font-weight: 400;
        color: #7c5cbf;
        margin-bottom: 12px;
        letter-spacing: 0.3px;
      }
      .display-content {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        align-items: center;
        justify-items: center;
        align-content: center;
      }
      .display-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.7);
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        animation: fadeScale 0.4s ease;
      }
      .display-card .dc-img {
        width: 126px;
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .display-card .dc-img img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .display-card .dc-label {
        font-size: 14px;
        color: #4a4a6a;
        font-weight: 400;
        text-align: center;
      }
      .display-card.single {
        padding: 12px;
        animation: popIn 0.4s ease;
        grid-column: 1 / -1;
        justify-self: center;
      }
      .display-card.single .dc-img {
        width: 340px;
        height: 280px;
      }
      .display-card.single .dc-label {
        font-size: 18px;
      }
      @keyframes fadeScale {
        0% { opacity: 0; transform: scale(0.7); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.5); }
        70% { transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }
      .clue-panel {
        background: rgba(255, 255, 255, 0.8);
        border: 2px solid rgba(155, 89, 182, 0.18);
        border-radius: 14px;
        padding: 14px 20px;
        box-shadow: 0 6px 20px rgba(155, 89, 182, 0.08);
      }
      .clue-panel h3 {
        font-family: var(--lesson-body-font);
        color: #5a2d7a;
        font-size: 18px;
        margin-bottom: 8px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .clue-list {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 22px;
        color: #1a1a2e;
        font-size: 17px;
        font-weight: 400;
        line-height: 1.28;
        padding: 0;
        margin: 0;
      }
      .clue-list li {
        position: relative;
        font-family: var(--lesson-body-font);
        padding-left: 18px;
      }
      .clue-list li::before {
        content: "▸";
        position: absolute;
        left: 0;
        color: #9b59b6;
        font-size: 14px;
        top: 1px;
      }
      .family-bottom {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(940px, 100%);
        justify-self: center;
      }
      .found-row {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 0;
      }
      .found-count {
        color: #4a4a6a;
        font-size: 18px;
        font-weight: 400;
        flex: 0 0 auto;
        min-width: max-content;
        white-space: nowrap;
      }
      .found-actions {
        display: flex;
        flex: 0 0 auto;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      .check-family {
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        background: #55c090;
        color: #fff;
        font-size: 16px;
        font-weight: 400;
        cursor: pointer;
        box-shadow: 0 5px 16px rgba(85, 192, 144, 0.22);
      }
      .check-family:hover {
        background: #45a87a;
      }
      .check-family:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .reset-family {
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        background: #7c5cbf;
        color: #fff;
        font-size: 16px;
        font-weight: 400;
        cursor: pointer;
        box-shadow: 0 5px 16px rgba(124, 92, 191, 0.22);
      }
      .reset-family:hover {
        background: #6b4dab;
      }
      .help-family {
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        background: #e8e0f0;
        color: #7c5cbf;
        font-size: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.25s ease;
        box-shadow: 0 3px 10px rgba(124,92,191,0.12);
      }
      .help-family:hover {
        background: #7c5cbf;
        color: #fff;
        transform: translateY(-2px);
      }
      .help-card p {
        font-size: 15px !important;
        line-height: 1.6 !important;
      }
      @media(max-width: 860px) {
        body { overflow: auto; }
        .family-page {
          min-height: auto;
          grid-template-columns: 1fr;
          padding: 24px 14px;
          gap: 20px;
        }
        .family-bottom {
          grid-column: 1;
        }
        .word-grid {
          grid-template-columns: repeat(8, minmax(36px, 1fr));
          gap: 4px;
          max-width: 400px;
          margin: 0 auto;
        }
        .letter-cell {
          width: auto;
          height: 40px;
          font-size: 17px;
        }
        .family-instruction {
          font-size: 15px;
          text-align: center;
        }
        .clue-panel {
          padding: 16px;
        }
        .clue-list {
          font-size: 14px;
        }
      }
      @media (min-width: 861px) and (max-height: 820px) {
        .family-page {
          width: min(100%, 1160px);
          padding: 10px 16px 8px;
          grid-template-columns: minmax(500px, 560px) minmax(370px, 430px);
          gap: 8px 20px;
        }
        .family-instruction {
          margin-bottom: 6px;
          font-size: 16px;
          line-height: 1.25;
        }
        .word-grid {
          grid-template-columns: repeat(8, 52px);
          gap: 6px;
          padding: 12px;
        }
        .letter-cell {
          width: 52px;
          height: 52px;
          font-size: 24px;
        }
        .display-box {
          min-height: 380px;
          padding: 12px;
        }
        .display-header {
          font-size: 16px;
          margin-bottom: 8px;
        }
        .display-card .dc-img {
          width: 118px;
          height: 96px;
        }
        .display-card.single .dc-img {
          width: 285px;
          height: 235px;
        }
        .display-card.single .dc-label {
          font-size: 16px;
        }
        .found-row {
          gap: 8px;
        }
        .found-count {
          font-size: 16px;
        }
        .check-family,
        .reset-family,
        .help-family {
          padding: 10px 16px;
          font-size: 15px;
        }
        .family-bottom {
          width: min(900px, 100%);
        }
        .clue-panel {
          padding: 8px 16px;
        }
        .clue-panel h3 {
          font-size: 15px;
          margin-bottom: 4px;
        }
        .clue-list {
          gap: 4px 14px;
          font-size: 13px;
          line-height: 1.16;
        }
      }
      @media (min-width: 1300px) and (min-height: 840px) {
        .family-page {
          width: min(100%, 1420px);
          padding-top: 16px;
          grid-template-columns: minmax(700px, 820px) minmax(540px, 620px);
          gap: 14px 30px;
        }
        .family-instruction {
          margin-bottom: 8px;
        }
        .word-grid {
          grid-template-columns: repeat(8, 68px);
          gap: 8px;
          padding: 20px;
        }
        .letter-cell {
          width: 68px;
          height: 68px;
          font-size: 31px;
        }
        .family-image-col {
          padding-top: 0;
        }
        .display-box {
          min-height: 590px;
        }
        .display-card .dc-img {
          width: 160px;
          height: 132px;
        }
        .display-card.single .dc-img {
          width: 440px;
          height: 390px;
        }
        .family-bottom {
          width: min(1120px, 100%);
          margin-top: 0;
        }
        .clue-panel {
          padding: 16px 22px;
        }
        .clue-list {
          font-size: 18px;
          gap: 10px 28px;
        }
      }

      .word-grid {
        border: 1px solid rgba(124, 92, 191, 0.18);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(246, 241, 255, 0.58)),
          radial-gradient(circle at 20% 18%, rgba(255, 236, 186, 0.55), transparent 34%),
          radial-gradient(circle at 82% 76%, rgba(178, 228, 255, 0.42), transparent 36%);
        box-shadow:
          0 16px 38px rgba(87, 67, 130, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);
      }

      .letter-cell {
        border: 1px solid rgba(124, 92, 191, 0.16);
        border-radius: 12px;
        background: linear-gradient(180deg, #ffffff, #f8f5ff);
        color: #34324a;
        text-transform: uppercase;
        line-height: 1;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 5px 12px rgba(76, 55, 120, 0.10);
      }

      .letter-cell:hover {
        border-color: rgba(124, 92, 191, 0.45);
        transform: translateY(-2px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 9px 18px rgba(76, 55, 120, 0.16);
      }

      .letter-cell.active {
        position: relative;
        background: linear-gradient(180deg, #fff6ce, #ffd86a);
        border-color: #7c3aed;
        color: #25124d;
        transform: translateY(-3px) scale(1.08);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 0 0 4px rgba(124, 58, 237, 0.34),
          0 12px 22px rgba(87, 54, 150, 0.26);
        z-index: 2;
      }

      .letter-cell.active::after {
        content: "\2713";
        position: absolute;
        top: -10px;
        right: -10px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #7c3aed;
        color: #fff;
        border: 2px solid #fff;
        font-size: 14px;
        font-weight: 700;
        box-shadow: 0 4px 10px rgba(76, 55, 120, 0.26);
      }

      .letter-cell.found {
        background: linear-gradient(180deg, #e9fff2, #cff3df);
        border-color: #42a66c;
        color: #20553d;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 0 0 3px rgba(85, 192, 144, 0.18),
          0 8px 18px rgba(66, 166, 108, 0.16);
      }

      .letter-cell.found-grandpa {
        background: linear-gradient(180deg, #fdf3e7, #f0dfc4);
        border-color: #c9a96e;
        color: #6b4c1f;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 0 0 3px rgba(201, 169, 110, 0.18),
          0 8px 18px rgba(201, 169, 110, 0.16);
      }

      .letter-cell.found-grandma {
        background: linear-gradient(180deg, #fdf0f0, #f5dada);
        border-color: #d4918f;
        color: #7a3030;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 0 0 3px rgba(212, 145, 143, 0.18),
          0 8px 18px rgba(212, 145, 143, 0.16);
      }

      .letter-cell.found-mother {
        background: linear-gradient(180deg, #eaf3fb, #d0e4f5);
        border-color: #7badd4;
        color: #1e4a72;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 0 0 3px rgba(123, 173, 212, 0.18),
          0 8px 18px rgba(123, 173, 212, 0.16);
      }

      .letter-cell.found-father {
        background: linear-gradient(180deg, #eafaf4, #cdefe8);
        border-color: #5fbf9a;
        color: #1e5a3d;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 0 0 3px rgba(95, 191, 154, 0.18),
          0 8px 18px rgba(95, 191, 154, 0.16);
      }

      .letter-cell.found-brother {
        background: linear-gradient(180deg, #f3eefb, #e0d5f0);
        border-color: #a88cd4;
        color: #4a2d72;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 0 0 3px rgba(168, 140, 212, 0.18),
          0 8px 18px rgba(168, 140, 212, 0.16);
      }

      .letter-cell.found-sister {
        background: linear-gradient(180deg, #fdf0f5, #f5d8e8);
        border-color: #d48fb5;
        color: #722d52;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.82),
          0 0 0 3px rgba(212, 143, 181, 0.18),
          0 8px 18px rgba(212, 143, 181, 0.16);
      }

      .family-page {
        --family-cell: clamp(64px, 5.5vw, 86px);
        width: min(100%, 1500px);
        padding: 18px 26px 14px;
        grid-template-columns: minmax(0, max-content) minmax(300px, 360px);
        grid-template-rows: auto auto;
        gap: 18px clamp(34px, 4.2vw, 70px);
        align-items: start;
        align-content: center;
      }
      .family-header {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
        width: 100%;
      }
      .family-grid-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        grid-column: 1;
        grid-row: 2;
      }
      .family-instruction {
        width: 100%;
        margin: 0;
        font-size: 40px !important;
        line-height: 1.12;
      }
      .word-grid {
        grid-template-columns: repeat(8, var(--family-cell));
        gap: 10px;
        padding: 24px;
      }
      .letter-cell {
        width: var(--family-cell);
        height: var(--family-cell);
        font-size: clamp(25px, 3.2vw, 34px);
      }
      .family-clues-col {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 360px;
        grid-column: 2;
        grid-row: 2;
      }
      .family-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        padding: 0 4px;
      }
      .family-header .family-status {
        justify-content: flex-end;
        padding: 0;
      }
      .family-clues-col .clue-panel {
        background: rgba(255, 248, 225, 0.55);
        border: 1px solid rgba(155, 89, 182, 0.18);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 4px 16px rgba(255, 235, 200, 0.3);
      }
      .family-clues-col .clue-panel h3 {
        font-size: 25px;
        margin-bottom: 10px;
        text-align: center;
      }
      .family-clues-col .clue-list {
        display: grid;
        gap: 9px;
        padding: 0;
        margin: 0;
      }
      .clue-card {
        min-height: 82px;
        display: grid;
        grid-template-columns: 64px 1fr;
        align-items: center;
        gap: 10px;
        padding: 6px 4px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        box-shadow: none;
        color: #1a1a2e;
      }
      .family-clues-col .clue-list .clue-card::before {
        content: none !important;
        display: none !important;
      }
      .clue-card img {
        width: 64px;
        height: 54px;
        object-fit: contain;
        display: block;
      }
      .clue-text {
        font-size: clamp(17px, 1.2vw, 20px);
        line-height: 1.2;
        font-weight: 400;
      }
      .clue-card.solved {
        border-color: rgba(66, 166, 108, 0.45);
        background: rgba(221, 246, 233, 0.62);
        box-shadow:
          0 0 0 2px rgba(66, 166, 108, 0.16),
          0 8px 18px rgba(66, 166, 108, 0.14);
      }
      .clue-card.solved-grandpa { border-color: rgba(201, 169, 110, 0.5); background: rgba(253, 243, 231, 0.7); }
      .clue-card.solved-grandma { border-color: rgba(212, 145, 143, 0.5); background: rgba(253, 240, 240, 0.7); }
      .clue-card.solved-mother  { border-color: rgba(123, 173, 212, 0.5); background: rgba(234, 243, 251, 0.7); }
      .clue-card.solved-father  { border-color: rgba(95, 191, 154, 0.5); background: rgba(234, 250, 244, 0.7); }
      .clue-card.solved-brother { border-color: rgba(168, 140, 212, 0.5); background: rgba(243, 238, 251, 0.7); }
      .clue-card.solved-sister  { border-color: rgba(212, 143, 181, 0.5); background: rgba(253, 240, 245, 0.7); }
      .family-header .reset-family {
        padding: 14px 28px;
        font-size: 18px;
        font-weight: 500;
        border-radius: 12px;
      }

        }

        }
      }

      @media (min-width: 861px) and (max-height: 820px) {
        .family-page {
          --family-cell: clamp(58px, 5.45vw, 64px);
          width: min(100%, 1200px);
          padding: 10px 16px;
          grid-template-columns: minmax(0, max-content) minmax(290px, 330px);
          gap: 12px clamp(20px, 2.4vw, 34px);
        }
        .family-instruction {
          font-size: 26px !important;
          line-height: 1.1;
        }
        .word-grid {
          grid-template-columns: repeat(8, var(--family-cell));
          gap: 7px;
          padding: 14px;
        }
        .letter-cell {

          height: var(--family-cell);
          font-size: 28px;
        }
        .family-clues-col .clue-panel {
          padding: 10px;
        }
        .family-clues-col .clue-panel h3 {
          font-size: 22px;
          margin-bottom: 7px;
        }
        .family-clues-col .clue-list {
          gap: 7px;
          font-size: unset;
          line-height: normal;
        }
        .clue-card {
          min-height: 70px;
          grid-template-columns: 56px 1fr;
          padding: 6px 9px;
          gap: 8px;
        }
        .clue-card img {
          width: 56px;
          height: 48px;
        }
        .clue-text {
          font-size: 18px;
        }
        .found-count,
        .family-header .reset-family {
          font-size: 16px;
        }
        .family-header .reset-family {
          padding: 10px 20px;
        }
      }

      @media (min-width: 861px) and (max-width: 1200px) {
        .family-page {
          --family-cell: clamp(56px, 5.2vw, 64px);
          width: min(100%, 1120px);
          padding: 10px 14px;
          grid-template-columns: minmax(0, max-content) minmax(285px, 320px);
          gap: 12px clamp(18px, 2.2vw, 30px);
        }
        .family-header {
          gap: 14px;
        }
        .family-instruction {
          font-size: 34px !important;
          line-height: 1.1;
        }
        .word-grid {
          grid-template-columns: repeat(8, var(--family-cell));
          gap: 7px;
          padding: 14px;
        }
        .letter-cell {
          width: var(--family-cell);
          height: var(--family-cell);
          font-size: 27px;
        }
        .family-clues-col .clue-panel {
          padding: 10px;
        }
        .family-clues-col .clue-panel h3 {
          font-size: 20px;
          margin-bottom: 7px;
        }
        .family-clues-col .clue-list {
          gap: 7px;
        }
        .clue-card {
          min-height: 69px;
          grid-template-columns: 54px 1fr;
          gap: 8px;
          padding: 6px 9px;
        }
        .clue-card img {
          width: 54px;
          height: 46px;
        }
        .clue-text {
          font-size: 15px;
        }
        .found-count,
        .family-header .reset-family {
          font-size: 16px;
        }
        .family-header .reset-family {
          padding: 10px 20px;
        }
      }

      @media (min-width: 1300px) and (min-height: 840px) {
        .family-page {
          --family-cell: clamp(88px, 5.25vw, 104px);
          --family-box-height: calc((var(--family-cell) * 7) + (12px * 6) + 56px);
          width: min(100%, 1700px);
          grid-template-columns: minmax(0, max-content) minmax(430px, 500px);
          gap: 22px clamp(52px, 5vw, 88px);
          justify-content: center;
        }
        .family-instruction {
          font-size: 35px !important;
        }
        .word-grid {
          grid-template-columns: repeat(8, var(--family-cell));
          gap: 12px;
          padding: 28px;
        }
        .letter-cell {
          width: var(--family-cell);
          height: var(--family-cell);
        }
        .family-grid-area,
        .family-clues-col {
          align-self: start;
        }
        .family-grid-area {
          transform: translateX(22px);
        }
        .clue-card {
          min-height: 0;
          height: 100%;
          grid-template-columns: 104px minmax(max-content, 1fr);
          gap: 16px;
          padding: 4px 12px;
        }
        .clue-card img {
          width: 104px;
          height: 86px;
        }
        .clue-text {
          font-size: 25px;
          white-space: nowrap;
        }
        .family-clues-col {
          margin-top: 0;
          width: 100%;
          max-width: 500px;
          justify-self: start;
        }
        .family-clues-col .clue-panel {
          width: 100%;
          height: var(--family-box-height);
          padding: 20px 28px;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }
        .family-clues-col .clue-list {
          flex: 1;
          grid-template-rows: repeat(6, minmax(0, 1fr));
          gap: 7px;
          min-height: 0;
        }
        .clue-card.solved {
          box-shadow: 0 0 0 1px rgba(66, 166, 108, 0.16);
        }
        .family-header .reset-family {
          padding: 16px 34px;
          font-size: 20px;
          border-radius: 14px;
        }
      }

      .family-instruction {
        color: #2d2440 !important;
        font-weight: 400 !important;
        letter-spacing: 0 !important;
      }
    </style>

<body>

    <main class="family-page">
        <div class="family-header">
            <p class="family-instruction">Mark any six words related to family members in the grid below.</p>
            <div class="family-status">
                <div class="found-count" id="foundCount" style="display:none !important;">Found: 0 / 6</div>
                <button class="reset-family" type="button" onclick="resetFamilyGrid()">Reset</button>
            </div>
        </div>

        <section class="family-grid-area">
            <div class="word-grid" id="familyGrid" aria-label="Family word grid"></div>
        </section>

        <section class="family-clues-col">
            <div class="clue-panel">
                <h3>Clues</h3>
                <ol class="clue-list" id="clueList">
                    <li class="clue-card" data-word="grandpa">
                        <img src="../assets/images/grandpaaimage.png" alt="Father's father clue">
                        <span class="clue-text">your father's father</span>
                    </li>
                    <li class="clue-card" data-word="grandma">
                        <img src="../assets/images/grandmaa-removebg-preview.png" alt="Father's mother clue">
                        <span class="clue-text">your father's mother</span>
                    </li>
                    <li class="clue-card" data-word="mother">
                        <img src="../assets/images/mother-removebg-preview.png" alt="Father's wife clue">
                        <span class="clue-text">your father's wife</span>
                    </li>
                    <li class="clue-card" data-word="brother">
                        <img src="../assets/images/brother-removebg-preview.png" alt="Male sibling clue">
                        <span class="clue-text">your male sibling</span>
                    </li>
                    <li class="clue-card" data-word="sister">
                        <img src="../assets/images/sister-removebg-preview.png" alt="Female sibling clue">
                        <span class="clue-text">your female sibling</span>
                    </li>
                    <li class="clue-card" data-word="father">
                        <img src="../assets/images/father-removebg-preview.png" alt="Male parent clue">
                        <span class="clue-text">your male parent</span>
                    </li>
                </ol>
            </div>
        </section>
    </main>

    <template id="removedLegacyPopup">
        <div>
            <div class="kid-icon" style="background:linear-gradient(135deg,#7c5cbf,#6b4dab);color:#fff;box-shadow:0 0 20px rgba(124,92,191,0.3);">❓</div>
        </div>
    </template>

    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>&#127881; Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">
                Play Again
            </button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script src="../assets/JavaScript/pronouns.js?v=lesson1finalemoji1"></script>
    <script src="../../shared/answer-frame.js?v=grade1frame5"></script>

</body>
