<!DOCTYPE html>
<html lang="en">

<head>
  <style>html,body{background:transparent!important}</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../assets/CSS/mcq.css?v=lesson1fix10">
  <link rel="stylesheet" href="../../grade1-typography.css?v=grade1font1">

  <style>
body {
      height: 100vh;
      overflow: hidden;
    }

    .plural-page {
      width: min(100%, 1250px);
      height: 100vh;
      margin: 0 auto;
      padding: 28px 30px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .plural-title {
      width: 60%;
      margin: 0;
      color: #2f2d48;
      font-size: 40px !important;
      font-weight: 400;
      line-height: 1.18;
      justify-content: space-between;
      display: flex;
      margin-inline:auto;
      align-items: center;
      
    }

    .plural-workspace {
      display: grid;
      grid-template-columns: minmax(340px, 500px) 86px minmax(400px, 580px);
      gap: clamp(18px, 3vw, 42px);
      align-items: center;
      justify-content: center;
      height: 60vh;
      max-height: 600px;
    }

    .plural-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      padding: 20px;
      overflow: visible;
      height: 100%;
      min-height: 0;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(248, 245, 255, 0.95));
      border-radius: 20px;
      border: 2px solid rgba(200, 182, 234, 0.25);
      box-shadow: 0 8px 28px rgba(86, 73, 118, 0.06), 0 3px 10px rgba(184, 165, 224, 0.08);
    }

    .singular-img-wrap,
    .plural-img-wrap {
      width: 100%;
      min-height: 0;
      flex: 1 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .singular-img {
      max-width: 95%;
      max-height: 340px;
      object-fit: contain;
    }

    .plural-img-wrap {
      display: grid;
      grid-template-columns: repeat(2, minmax(140px, 1fr));
      gap: 12px;
      align-content: center;
      justify-items: center;
    }

    .plural-img-wrap.single-image {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .plural-img-wrap img {
      width: 100%;
      max-width: 240px;
      height: 150px;
      object-fit: contain;
    }

    .plural-img-wrap.single-image img {
      width: 95%;
      max-width: none;
      height: auto;
      max-height: 90%;
    }

    .word-label {
      color: #4a3b68;
      font-size: 42px;
      font-weight: 600;
      line-height: 1;
      text-align: center;
      flex-shrink: 0;
    }

    .machine-sign {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9a5a00;
      background: #ffe6ad;
      border: 2px solid #ffc457;
      box-shadow: 0 8px 22px rgba(188, 120, 0, 0.14);
      font-size: 24px;
      font-weight: 600;
      line-height: 1;
    }

    .machine-sign span {
      display: block;
    }

    .answer-row {
      width: min(100%, 860px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: nowrap;
      flex-shrink: 0;
      min-height: 0;
      overflow: hidden;
      margin: 0 auto;
    }

    .letter-circle {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 3px solid rgba(124, 92, 191, 0.3);
      background: #fff;
      color: #2f2d48;
      font-size: 28px;
      font-family: var(--lesson-body-font);
      font-weight: 600;
      text-align: center;
      outline: none;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(76,55,120,0.1);
      transition: all 0.2s ease;
      caret-color: #7c5cbf;
      padding: 0;
      line-height: 1;
    }

    .letter-circle:focus {
      border-color: #7c5cbf;
      box-shadow: 0 0 0 4px rgba(124, 92, 191, 0.18);
    }

    .letter-circle.correct {
      border-color: #22c55e;
      background: #e6f7ec;
      color: #154b2a;
    }

    .letter-circle.wrong {
      border-color: #e53935;
      background: #ffe8e8;
      color: #8a3030;
      animation: shake 0.35s ease;
    }

    .letter-circle:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (min-width: 1025px) and (max-width: 1440px) {
      .plural-page {
        justify-content: flex-start;
        padding-top: 34px;
        padding-bottom: 18px;
        gap: 8px;
      }

      .plural-title {
        font-size: 30px !important;
      }

      .plural-workspace {
        grid-template-columns: minmax(330px, 430px) 78px minmax(380px, 500px);
        width: 100%;
        height: 58vh;
        margin-top: 10px;
        gap: clamp(14px, 2.4vw, 28px);
      }

      .plural-card {
        height: 100%;
        gap: 10px;
        padding: 8px 14px;
        overflow: visible;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(248, 245, 255, 0.95));
        border-radius: 16px;
        border: 2px solid rgba(200, 182, 234, 0.25);
        box-shadow: 0 6px 20px rgba(86, 73, 118, 0.06), 0 2px 8px rgba(184, 165, 224, 0.08);
        justify-content: flex-start;
      }

      .singular-img-wrap,
      .plural-img-wrap {
        min-height: 0;
        flex: 1 1 0;
        height: auto;
      }

      .singular-img {
        max-height: 100%;
      }

      .plural-img-wrap {
        align-content: center;
        gap: 10px;
      }

      .plural-img-wrap.single-image {
        gap: 0;
      }

      .plural-img-wrap img {
        max-width: 210px;
        height: 125px;
      }

      .plural-img-wrap.single-image img {
        width: 95%;
        max-width: none;
        height: auto;
        max-height: 90%;
      }

      .word-label {
        font-size: 30px !important;
        margin-top: 4px;
      }

      .letter-circle {
        width: 58px;
        height: 58px;
        font-size: 27px;
      }

      .answer-row {
        gap: 10px;
        margin: 14px auto 0;
        flex-wrap: nowrap;
        justify-content: center;
      }

      .plural-controls {
        margin-top: auto;
        justify-content: center;
        gap: 34px;
      }

      .plural-controls button {
        width: 150px;
        height: 48px;
        min-width: 0;
        border-radius: 8px;
        font-size: 18px;
      }
    }

    @media (min-width: 1441px) {
      .plural-page {
        width: min(100%, 1450px);
        justify-content: flex-start;
        gap: 8px;
        padding-top: 44px;
        padding-bottom: 34px;
      }

      .plural-title {
        font-size: 30px !important;
      }

      .plural-workspace {
        grid-template-columns: minmax(480px, 620px) 104px minmax(540px, 700px);
        width: 100%;
        margin-top: 18px;
        height: 62vh;
        max-height: 620px;
        align-items: center;
      }

      .plural-card {
        min-height: auto;
        height: 100%;
        justify-content: flex-start;
        gap: 18px;
        overflow: visible;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(248, 245, 255, 0.95));
        border-radius: 22px;
        border: 2px solid rgba(200, 182, 234, 0.25);
        box-shadow: 0 8px 28px rgba(86, 73, 118, 0.06), 0 3px 10px rgba(184, 165, 224, 0.08);
      }

      .singular-img-wrap {
        min-height: 0;
        flex: 1 1 0;
        height: auto;
        align-items: flex-end;
      }

      .plural-img-wrap {
        min-height: 0;
        flex: 1 1 0;
        height: auto;
        align-content: center;
      }

      .singular-img {
        max-height: 100%;
      }

      .plural-img-wrap img {
        max-width: 300px;
        height: 180px;
      }

      .plural-img-wrap.single-image img {
        width: 95%;
        max-width: none;
        height: auto;
        max-height: 90%;
      }

      .word-label {
        font-size: 40px;
        margin-top: 4px;
      }

      .letter-circle {
        width: 78px;
        height: 78px;
        font-size: 36px;
        border-width: 3px;
      }

      .answer-row {
        width: min(100%, 860px);
        gap: 14px;
        margin: 16px auto 0;
        flex-wrap: nowrap;
        justify-content: center;
      }

      .plural-controls {
        margin-top: auto;
        padding-bottom: 0;
        gap: 34px;
      }
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .plural-page {
        height: auto;
        min-height: 100vh;
        padding: 20px 14px;
      }

      .plural-workspace {
        grid-template-columns: 1fr;
      }

      .machine-sign {
        justify-self: center;
      }

      .plural-card {
        min-height: auto;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(248, 245, 255, 0.95));
        border-radius: 16px;
        border: 2px solid rgba(200, 182, 234, 0.25);
        box-shadow: 0 6px 20px rgba(86, 73, 118, 0.06), 0 2px 8px rgba(184, 165, 224, 0.08);
        justify-content: flex-start;
      }

      .letter-circle {
        width: 42px;
        height: 42px;
        font-size: 18px;
      }
    }

    .plural-title {
      color: #2d2440 !important;
      font-weight: 400 !important;
      letter-spacing: 0 !important;
    }

    .controls {
      display: flex;
      gap: 24px;
      justify-content: center;
      padding-top: 16px;
      margin-top: auto;
    }
  </style>

  <style>
    /* Lesson 1 Singular/Plural: add bottom breathing room for answer circles. */
    .answer-row {
      padding-bottom: 18px !important;
      overflow: visible !important;
      min-height: 86px !important;
      box-sizing: border-box !important;
    }

    @media (min-width: 1441px) {
      .answer-row {
        padding-bottom: 28px !important;
        min-height: 118px !important;
      }
    }
  </style></head>

<body>
  <main class="plural-page">
    <h2 class="plural-title" id="question" style="background:none !important;border:none !important;box-shadow:none !important;padding:0 !important;color:#2e2a3a !important;font-size:30px !important;line-height:1.12 !important;font-weight:400 !important;">
    </h2>

    <section class="plural-workspace">
      <article class="plural-card">
        <span style="background:linear-gradient(135deg,#f8d0dd,#f0a0b8);color:#fff;font-family:var(--heading-font);font-size:14px;font-weight:700;padding:4px 14px;border-radius:16px;text-transform:uppercase;letter-spacing:1px;align-self:center;flex-shrink:0;min-width:110px;text-align:center;">Singular</span>
        <div class="singular-img-wrap">
          <img class="singular-img" id="questionImg" src="" alt="">
        </div>
        <div class="word-label" id="singularWord" style="font-size:40px !important;"></div>
      </article>

      <div class="machine-sign" aria-label="arrow right" style="width:auto;height:auto;background:none;border:none;box-shadow:none;">
        <img src="../assets/images/arrow-removebg-preview.png" alt="arrow" style="width:120px;height:auto;">
      </div>

      <article class="plural-card">
        <span style="background:linear-gradient(135deg,#b8e0f5,#8ec5e8);color:#fff;font-family:var(--heading-font);font-size:14px;font-weight:700;padding:4px 14px;border-radius:16px;text-transform:uppercase;letter-spacing:1px;align-self:center;flex-shrink:0;min-width:110px;text-align:center;">Plural</span>
        <div class="plural-img-wrap" id="pluralImages"></div>
        <span id="pluralQuestionMark" style="font-size:40px;font-weight:bold;color:#2d2440;align-self:center;flex-shrink:0;">?</span>
      </article>
    </section>

    <div class="answer-row" id="letterCircles"></div>

    <div class="controls">
      <button class="prev" id="prevBtn"><i style="margin-right: 5px;" class="fa-solid fa-angles-left"></i> Prev</button>
      <button class="next" id="nextBtn">Next <i style="margin-left: 5px;" class="fa-solid fa-angles-right"></i></button>
    </div>
  </main>

  <div id="answerPopup" class="kid-popup">
    <div class="kid-card">
      <div class="kid-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <div id="finalPopup">
    <div class="final-kid-box">
      <h2>&#127881; Congratulations!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div>
      <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

  <script src="../assets/JavaScript/singular_plural.js?v=lesson1finalemoji1"></script>
  <script src="../../shared/answer-frame.js?v=grade1frame5"></script>

</body>
</html>
