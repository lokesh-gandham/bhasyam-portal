<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--lesson-body-font);
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: url("assets/images/bg.jpg");
      background-size: 100% 100%;
    }

    .app {
      height: 100vh;
      display: flex;
      background: linear-gradient(135deg, #e0f2e9, #f0f7e6, #e8f0f5);
    }

    .sidebar {
      width: 240px;
      padding: 24px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      background: transparent;
    }

    .chip-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 66px;
      padding: 0 18px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      background: rgba(255,255,255,0.35);
      color: #3a5a4a;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .chip-btn i {
      width: 32px;
      text-align: center;
      font-size: 19px;
      flex-shrink: 0;
      opacity: 0.7;
      transition: all 0.3s ease;
    }

    .chip-btn .chip-text {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      font-size: 15px;
      font-weight: 500;
      color: #3a5a4a;
      transition: all 0.3s ease;
      line-height: 1.18;
    }



    .o1 i { color: #4caf78; } .o1.active i { color: #2e7d4a; }
    .o2 i { color: #66b89a; } .o2.active i { color: #3a8a6a; }
    .o3 i { color: #7fc8a8; } .o3.active i { color: #4a9a7a; }
    .o4 i { color: #9ad4b8; } .o4.active i { color: #5aaa8a; }
    .o5 i { color: #b0dcc8; } .o5.active i { color: #6abaa0; }

    .chip-btn:hover { transform: translateX(4px); background: rgba(255,255,255,0.5); }

    .chip-btn.active {
      background: rgba(255,255,255,0.85);
      border-color: rgba(80, 160, 120, 0.2);
      box-shadow: 0 4px 16px rgba(80, 160, 120, 0.08);
      transform: translateX(3px);
    }

    .chip-btn.active .chip-text { color: #2a4a3a; }
    .chip-btn.active i { opacity: 1; }

    .main { flex: 1; }

    iframe { width: 100%; height: 100%; border: none; background: transparent; }

    .menu-btn { display: none; }
    .offcanvas { display: none; }

    @media(max-width:1065px) {
      .app { flex-direction: column; }
      .sidebar { display: none; }
      .menu-btn { display: block; position: fixed; top: 6px; right: 12px; font-size: 22px; background: #4caf78; color: white; border: none; border-radius: 8px; padding: 4px 10px; cursor: pointer; z-index: 5000; }
      .offcanvas { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: none; z-index: 4000; }
      .offcanvas.show { display: block; }
      .offcanvas-panel { position: absolute; right: 0; top: 0; width: 250px; height: 100%; background: #f0f5ee; padding: 0; padding-top: 0; transform: translateX(100%); transition: .3s; overflow-y: auto; }
      .offcanvas.show .offcanvas-panel { transform: translateX(0); padding: 55px 12px 12px; }
      .offcanvas-panel .chip-btn { margin-bottom: 8px; height: 56px; font-size: 15px; padding: 0 14px; gap: 12px; }
      .offcanvas-panel .chip-btn .chip-text { font-size: 15px; line-height: 1.15; }
      .offcanvas-panel .chip-btn i { font-size: 16px; width: 26px; }
    }

    @media (min-width: 900px) and (max-height: 800px) {
      .app { transform: scaleY(0.95); transform-origin: top center; height: calc(100vh / 0.95); }
    }
    @media (min-width: 900px) and (max-height: 700px) {
      .app { transform: scaleY(0.9); transform-origin: top center; height: calc(100vh / 0.9); }
    }
    @media (min-width: 900px) and (max-height: 600px) {
      .app { transform: scaleY(0.85); transform-origin: top center; height: calc(100vh / 0.85); }
    }
    @media (min-width: 900px) and (max-height: 500px) {
      .app { transform: scaleY(0.8); transform-origin: top center; height: calc(100vh / 0.8); }
    }

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .sidebar { width: 280px; padding: 20px 14px; gap: 16px; }
      .chip-btn { font-size: 18px; height: 72px; padding: 0 20px; gap: 16px; }
      .chip-btn .chip-text { font-size: 18px; }
      .chip-btn i { font-size: 20px; width: 34px; }
    }
    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .sidebar { width: 300px; padding: 22px 18px; gap: 18px; }
      .chip-btn { font-size: 19px; height: 76px; padding: 0 22px; gap: 16px; }
      .chip-btn .chip-text { font-size: 19px; }
      .chip-btn i { font-size: 22px; width: 36px; }
    }
    @media screen and (min-width: 1921px) {
      .sidebar { width: 320px; padding: 24px 20px; gap: 20px; }
      .chip-btn { font-size: 20px; height: 80px; padding: 0 24px; gap: 18px; }
      .chip-btn .chip-text { font-size: 20px; }
      .chip-btn i { font-size: 24px; width: 38px; }
      iframe { border-radius: 10px; }
    }

    body {
      background: url("assets/images/bg.png");
      background-size: cover;
      background-position: center;
    }

    .app {
      background: transparent;
    }

    .sidebar {
      width: 260px;
      padding: 20px 8px 20px 12px;
      justify-content: center;
      gap: 12px;
      background: transparent;
      border-right: none;
      box-shadow: none;
    }

    .chip-btn {
      height: 76px;
      padding: 0 10px;
      gap: 8px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.58);
      border: 2px solid rgba(255, 255, 255, 0.7);
      color: #2d2440;
      box-shadow: 0 8px 22px rgba(91, 55, 139, 0.08);
    }

    .chip-btn i {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff !important;
      opacity: 1;
      box-shadow: 0 8px 18px rgba(50, 40, 84, 0.12);
    }

    .chip-btn .chip-text {
      color: #2d2440;
      font-size: 21px;
      font-weight: 600;
      min-width: 0;
      white-space: nowrap;
      line-height: 1.15;
    }



    .o1 i { background: linear-gradient(135deg, #f6a338, #e67f31); }
    .o2 i { background: linear-gradient(135deg, #9b7ce2, #7659c6); }
    .o3 i { background: linear-gradient(135deg, #2ec7a6, #15987e); }
    .o4 i { background: linear-gradient(135deg, #26b9d2, #0b8fac); }
    .o5 i { background: linear-gradient(135deg, #ef6b9a, #d83d7d); }

    .chip-btn:hover {
      transform: translateX(2px);
      background: rgba(255, 255, 255, 0.82);
      border-color: rgba(91, 55, 139, 0.18);
      box-shadow: 0 12px 28px rgba(91, 55, 139, 0.12);
    }

    .chip-btn.active {
      background: linear-gradient(135deg, rgba(255, 247, 231, 0.95), rgba(239, 228, 255, 0.92));
      border-color: #f08a31;
      box-shadow: 0 14px 32px rgba(91, 55, 139, 0.15);
      transform: translateX(2px);
    }

    .chip-btn.active .chip-text {
      color: #21143b;
      font-weight: 700;
    }



    @media(max-width:1065px) {
      .menu-btn {
        background: #8c5bd6;
      }

      .offcanvas-panel {
        background: rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(12px);
      }
    }
  </style>
<link rel="stylesheet" href="../grade1-typography.css?v=grade1font1">
</head>

<body>

  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <div class="app">

    <div class="sidebar">

      <div class="chip-btn o1 active" onclick="openIsland(0)">
        <i class="fa-solid fa-list-check"></i>
        <span class="chip-text">Choose Options</span>
      </div>
      <div class="chip-btn o2" onclick="openIsland(1)">
        <i class="fa-solid fa-book-open"></i>
        <span class="chip-text">Meanings</span>
      </div>
      <div class="chip-btn o3" onclick="openIsland(2)">
        <i class="fa-solid fa-arrows-left-right"></i>
        <span class="chip-text">Opposites</span>
      </div>
      <div class="chip-btn o4" onclick="openIsland(3)">
        <i class="fa-solid fa-layer-group"></i>
        <span class="chip-text">Singular / Plural</span>
      </div>
      <div class="chip-btn o5" onclick="openIsland(4)">
        <i class="fa-solid fa-briefcase"></i>
        <span class="chip-text">Profession</span>
      </div>

    </div>

    <div class="main">
      <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>
    </div>

  </div>

  <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

    <div class="offcanvas-panel" onclick="event.stopPropagation()">

      <div class="chip-btn o1 active" onclick="mobileOpen(0)">
        <i class="fa-solid fa-list-check"></i>
        <span class="chip-text">Choose Options</span>
      </div>
      <div class="chip-btn o2" onclick="mobileOpen(1)">
        <i class="fa-solid fa-book-open"></i>
        <span class="chip-text">Meanings</span>
      </div>
      <div class="chip-btn o3" onclick="mobileOpen(2)">
        <i class="fa-solid fa-arrows-left-right"></i>
        <span class="chip-text">Opposites</span>
      </div>
      <div class="chip-btn o4" onclick="mobileOpen(3)">
        <i class="fa-solid fa-layer-group"></i>
        <span class="chip-text">Singular / Plural</span>
      </div>
      <div class="chip-btn o5" onclick="mobileOpen(4)">
        <i class="fa-solid fa-briefcase"></i>
        <span class="chip-text">Profession</span>
      </div>

    </div>

  </div>

  <script>

    const sidebarButtons = document.querySelectorAll(".sidebar .chip-btn");
    const mobileButtons = document.querySelectorAll(".offcanvas .chip-btn");
    const frame = document.getElementById("contentFrame");

    const pages = [
      "./exercises/mcq.html",
      "./exercises/match_meanings.html?v=lesson2meaningsclick2",
      "./exercises/opposites.html?v=lesson2compact1",
      "./exercises/singular_plural.html?v=lesson2compact2",
      "./exercises/profession.html"
    ];

    function openIsland(index) {
      sidebarButtons.forEach(btn => btn.classList.remove("active"));
      sidebarButtons[index].classList.add("active");
      mobileButtons.forEach(btn => btn.classList.remove("active"));
      mobileButtons[index].classList.add("active");
      frame.src = pages[index];
    }

    function toggleMenu() {
      if (window.innerWidth > 1065) return;
      document.getElementById("offcanvas").classList.toggle("show");
    }

    function mobileOpen(i) {
      openIsland(i);
      toggleMenu();
    }

  </script>
</body>
</html>
