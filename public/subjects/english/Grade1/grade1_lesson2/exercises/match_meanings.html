<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../assets/CSS/match.css?v=lesson2meaningsclick2">
<link rel="stylesheet" href="../../grade1-typography.css?v=grade1font1">
  <style>
    html body .lesson2-meanings .slot-label-row .slot-number,
    html body .lesson2-meanings .slot-label-row .slot-meaning {
      font-size: 30px !important;
      line-height: 1.15 !important;
    }

    @media (min-width: 1441px) {
      html body .lesson2-meanings .slot-label-row .slot-number,
      html body .lesson2-meanings .slot-label-row .slot-meaning {
        font-size: 40px !important;
      }
    }
  </style>
</head>
<body>
  <div class="mean-container lesson2-meanings">
    <div class="mean-header">
      <h2 id="question"></h2>
      <div class="question-image"><img id="questionImg" src="" alt=""></div>
    </div>

    <div class="mean-body">
      <div class="mean-source" id="sourceWords"></div>
      <div class="mean-slots" id="slots"></div>
    </div>

    <div class="mean-controls">
      <button class="prev" id="prevBtn"><i style="margin-right:5px" class="fa-solid fa-angles-left"></i> Prev</button>
      <button class="next" id="nextBtn">Next <i style="margin-left:5px" class="fa-solid fa-angles-right"></i></button>
    </div>
  </div>

  <div id="answerPopup" class="kid-popup">
    <div class="kid-card">
      <div class="kid-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <div id="finalPopup">
    <div class="final-card">
      <h2>Well Done!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div>
      <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
  <script src="../assets/JavaScript/match_meanings.js?v=lesson2meaningsclick2"></script>
  <script src="../../shared/answer-frame.js?v=grade1frame5"></script>
</body>
</html>
