<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../assets/CSS/match.css?v=lesson2fix7">
  <style>
    .lesson2-profession { max-width: 1240px; padding: 18px 28px 18px; justify-content: center; gap: 14px; }
    .profession-title {
      font-family: var(--lesson-heading-font) !important;
      font-size: 54px !important;
      color: #241044;
      line-height: 1.05;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .lesson2-profession .prof-header { order: 2; margin-bottom: 6px; }
    #question { display: none; }
    .lesson2-profession .prof-header #profDesc {
      width: min(100%, 980px);
      margin: 0 auto 8px;
      padding: 0;
      border: none;
      border-radius: 0;
      background: none;
      box-shadow: none;
      color: #2e2a3a;
      font-family: var(--lesson-body-font);
      font-size: 30px;
      font-weight: 400;
      line-height: 1.18;
    }
    .lesson2-profession .prof-header .question-image { min-height: clamp(190px, 25vh, 280px); display: flex; align-items: center; justify-content: center; margin: 0 0 8px; }
    .lesson2-profession .prof-header .question-image img { max-height: clamp(190px, 25vh, 280px); max-width: 100%; object-fit: contain; border-radius: 16px; transition: opacity 0.4s ease; }
    .lesson2-profession .prof-body { order: 1; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; gap: 8px; }
    .lesson2-profession .answer-area { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
    .choice-grid {
      width: min(100%, 1120px);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
      margin: 14px auto 0;
    }
    .prof-choice {
      min-height: 168px;
      padding: 0;
      border-radius: 0;
      border: 0;
      background: transparent;
      color: #2d2440;
      font-size: 26px;
      font-family: var(--lesson-body-font);
      cursor: pointer;
      box-shadow: none;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      text-align: center;
    }
    .prof-choice img { width: 100%; height: 170px; object-fit: contain; display: block; filter: drop-shadow(0 10px 14px rgba(45, 36, 64, 0.14)); }
    .prof-choice span {
      display: block;
      font-family: var(--lesson-heading-font);
      font-size: 26px;
      font-weight: 600;
      color: #2d2440;
      margin-top: 8px;
      text-align: center;
      padding: 8px 16px;
      background: linear-gradient(135deg, rgba(232, 218, 245, 0.7), rgba(200, 182, 234, 0.5));
      border-radius: 12px;
      border: 1px solid rgba(184, 165, 224, 0.3);
      box-shadow: 0 2px 8px rgba(184, 165, 224, 0.12);
    }
    .prof-choice:hover {
      background: transparent;
      transform: translateY(-4px) scale(1.04);
      box-shadow: none;
    }
    .prof-choice.correct {
      outline: 4px solid rgba(47, 158, 98, 0.45);
      outline-offset: 8px;
      background: transparent;
      color: #17452c;
    }
    .prof-choice.wrong {
      outline: 4px solid rgba(220, 106, 114, 0.45);
      outline-offset: 8px;
      background: transparent;
      animation: shake 0.4s ease;
    }
    .prof-choice.disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }
    .feedback { font-size: 22px; min-height: 32px; transition: all 0.3s ease; }
    .feedback.correct { color: #2f9e62; }
    .feedback.wrong { color: #dc6a72; }
    .help-desk { display: none; }
    .lesson2-profession .prof-controls { order: 3; width: min(100%, 900px); margin: 20px auto 0; padding: 0; }
    @media (max-width: 768px) {
      .profession-title { font-size: 38px !important; }
      .lesson2-profession { height: auto; min-height: 100vh; overflow: auto; padding: 16px 12px; justify-content: flex-start; }
      .choice-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 520px; }
      .prof-choice { min-height: 118px; font-size: 22px; }
      .prof-choice img { height: 120px; }
      .prof-choice span { font-size: 20px; padding: 6px 12px; }
      .lesson2-profession .prof-controls { width: min(100%, 520px); margin-top: 16px; }
    }
    @media (min-width: 861px) and (max-height: 820px) {
      .lesson2-profession { max-width: 1080px; padding: 10px 22px 10px; gap: 10px; }
      .profession-title { font-size: 54px !important; margin-bottom: 6px; }
      .lesson2-profession .prof-header #profDesc {
        width: min(100%, 940px);
        font-size: 30px !important;
        line-height: 1.12;
        margin-bottom: 6px;
      }
      .lesson2-profession .prof-header .question-image {
        min-height: 220px;
        margin: 0 0 6px;
      }
      .lesson2-profession .prof-header .question-image img {
        max-height: 220px;
      }
      .choice-grid { width: min(100%, 900px); gap: 14px; margin-top: 8px; }
      .prof-choice {
        min-height: 140px;
        font-size: 23px;
      }
      .prof-choice img { height: 130px; }
      .prof-choice span { font-size: 22px; padding: 6px 14px; }
      .lesson2-profession .prof-controls { width: min(100%, 840px); margin-top: 16px; }
      .feedback { min-height: 22px; }
    }
    @media (min-width: 1441px) and (min-height: 840px) {
      .lesson2-profession { max-width: 1260px; padding-top: 20px; gap: 20px; }
      .profession-title { font-size: 72px !important; margin-bottom: 12px; }
      .lesson2-profession .prof-header #profDesc {
        width: min(100%, 1080px);
        font-size: 40px !important;
        margin-bottom: 12px;
      }
      .lesson2-profession .prof-header .question-image {
        min-height: 330px;
        margin-bottom: 24px;
      }
      .lesson2-profession .prof-header .question-image img {
        max-height: 330px;
      }
      .choice-grid { width: min(100%, 1160px); gap: 26px; }
      .prof-choice {
        min-height: 210px;
        font-size: 30px;
      }
      .prof-choice img { height: 190px; }
      .prof-choice span { font-size: 30px; padding: 10px 18px; }
      .lesson2-profession .prof-controls { width: min(100%, 980px); margin-top: 24px; }
    }
  </style>
<link rel="stylesheet" href="../../grade1-typography.css?v=grade1font1">
  <style>
    html body .lesson2-profession .prof-header #profDesc {
      font-family: var(--lesson-body-font) !important;
      font-size: 30px !important;
      font-weight: 400 !important;
      letter-spacing: 0 !important;
    }

    @media (min-width: 1441px) {
      html body .lesson2-profession .prof-header #profDesc {
        font-size: 40px !important;
      }
    }
  </style>
</head>
<body>
  <div class="prof-container lesson2-profession">
    <div class="help-desk">
      <div class="help-icon">💼</div>
      <div class="help-text">Read the clue and tap the correct profession.</div>
    </div>

    <div class="prof-body">
      <div class="answer-area">
        <div id="feedback" class="feedback"></div>
      </div>
    </div>

    <div class="prof-header">
     <div class="profession-title"></div>
      <h2 id="question"></h2>
      <div id="profDesc"></div>
      <div class="question-image"><img id="questionImg" src="" alt=""></div>
      <div id="choiceGrid" class="choice-grid"></div>
    </div>

    <div class="prof-controls">
      <button class="prev" id="prevBtn"><i style="margin-right:5px" class="fa-solid fa-angles-left"></i> Prev</button>
      <button class="next" id="nextBtn">Next <i style="margin-left:5px" class="fa-solid fa-angles-right"></i></button>
    </div>
  </div>

  <div id="finalPopup">
    <div class="final-card">
      <h2>Well Done!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div>
      <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <div id="answerPopup" class="kid-popup">
    <div class="kid-card">
      <div class="kid-icon" id="popupIcon">✓</div>
      <h3 id="popupTitle">Right!</h3>
      <p id="popupMsg">Great job!</p>
    </div>
  </div>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
  <script src="../assets/JavaScript/profession.js?v=lesson2profession2"></script>
  <script src="../../shared/answer-frame.js?v=grade1frame5"></script>
</body>
</html>
