<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../assets/CSS/mcq.css?v=lesson2compact2">
  <style>
    body { align-items: center !important; overflow: hidden; }
    .lesson2-singular {
      width: min(100%, 1120px);
      max-width: 1120px;
      height: 100vh;
      padding: 20px 26px 18px;
      justify-content: center;
      gap: 18px;
    }
    .header { flex: 0 0 auto; }
    #question { background: none !important; border: none !important; box-shadow: none !important; padding: 0 !important; color: #2e2a3a !important; font-size: 34px !important; line-height: 1.12 !important; }
    .question-image { min-height: clamp(180px, 25vh, 260px); display: flex; align-items: center; justify-content: center; margin: 0 0 4px; }
    .question-image img { max-height: clamp(180px, 25vh, 260px); max-width: 100%; object-fit: contain; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; padding: 0 20px; flex: 0 0 auto; align-content: center; justify-content: center; max-width: 700px; margin: 0 auto; width: 100%; }
    .option { display: flex !important; align-items: center !important; justify-content: center !important; text-align: center; padding: 0 18px !important; border-radius: 14px; cursor: pointer; font-size: 28px; font-weight: 500; color: #2e2a3a; transition: all 0.3s ease; border: 2px solid; background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,0.07); min-height: 76px; }
    .option span { display: flex !important; align-items: center !important; justify-content: center !important; width: 100% !important; min-height: inherit !important; margin: 0 !important; padding: 0 !important; text-align: center !important; line-height: 1.05 !important; transform: none !important; }
    .option.o1 { border-color: #eb9d67; }
    .option.o2 { border-color: #4ade80; }
    .option.o3 { border-color: #93c5fd; }
    .option.o4 { border-color: #f9a8d4; }
    .option.o1:hover { background: #fdf1e6; border-color: #e08a50; }
    .option.o2:hover { background: #eafbed; border-color: #22c55e; }
    .option.o3:hover { background: #eef4fd; border-color: #60a5fa; }
    .option.o4:hover { background: #fef0f5; border-color: #f472b6; }
    .option:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.12); }
    .option.correct { border-color: #2f9e62 !important; background: #e6f7ec !important; color: #154b2a; }
    .option.wrong { border-color: #dc6a72 !important; background: #ffe8e8 !important; color: #681b22; animation: shake 0.4s ease; }
    .option.disabled { opacity: 0.4; pointer-events: none; }
    .lesson2-singular .controls { width: min(100%, 860px); margin: 2px auto 0; padding: 0; }
    @media (min-width: 861px) and (max-height: 820px) {
      .lesson2-singular { max-width: 1060px; padding: 10px 22px 10px; gap: 10px; }
      #question { font-size: 30px !important; }
      .question-image { min-height: 180px; margin-bottom: 2px; }
      .question-image img { max-height: 180px; }
      .options { max-width: 660px; gap: 14px 18px; }
      .option { min-height: 68px; padding: 0 16px !important; font-size: 26px; }
    }
    @media (min-width: 1441px) and (min-height: 840px) {
      .lesson2-singular { max-width: 1240px; padding-top: 18px; gap: 20px; }
      #question { font-size: 40px !important; }
      .question-image { min-height: 280px; }
      .question-image img { max-height: 280px; }
      .options { max-width: 780px; gap: 18px 24px; }
      .option { min-height: 86px; font-size: 32px; }
      .lesson2-singular .controls { width: min(100%, 780px); }
    }
    @media (max-width: 768px) {
      .lesson2-singular { height: auto; min-height: 100vh; overflow: auto; padding: 16px 12px; justify-content: flex-start; }
      #question { font-size: 30px !important; }
      .options { grid-template-columns: 1fr; gap: 12px; padding: 0; max-width: 520px; }
      .option { min-height: 66px; font-size: 24px; padding: 0 16px !important; }
      .option span { transform: none !important; }
      .lesson2-singular .controls { width: min(100%, 520px); }
    }
    @media (min-width: 1025px) and (max-width: 1440px) {
      #question { font-size: 30px !important; }
    }
    @media (min-width: 1441px) {
      #question { font-size: 40px !important; }
    }
  </style>
<link rel="stylesheet" href="../../grade1-typography.css?v=grade1font1">
</head>
<body>
  <div class="quiz lesson2-singular">
    <div class="header">
      <h2 id="question"></h2>
    </div>
    <div class="question-image">
      <img id="questionImg" src="" alt="">
    </div>
    <div class="options" id="options"></div>
    <div class="controls">
      <button class="prev" id="prevBtn"><i style="margin-right:5px" class="fa-solid fa-angles-left"></i> Prev</button>
      <button class="next" id="nextBtn">Next <i style="margin-left:5px" class="fa-solid fa-angles-right"></i></button>
    </div>
  </div>

  <div id="answerPopup" class="kid-popup">
    <div class="kid-card">
      <div class="kid-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <div id="finalPopup">
    <div class="final-card">
      <h2>Well Done!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div>
      <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
  <script src="../assets/JavaScript/singular_plural.js"></script>
  <script src="../../shared/answer-frame.js?v=grade1frame5"></script>
</body>
</html>
