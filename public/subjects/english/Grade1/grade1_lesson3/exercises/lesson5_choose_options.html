<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../assets/CSS/lesson5.css?v=lesson3fix58">
  <style>
    body { background: url("../assets/images/background.jpg") !important; background-size: 100% 100% !important; }
    .choose-page {
      max-width: 100% !important;
      height: 100vh;
      margin: 0 auto;
      padding: 50px 40px 6px;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: hidden;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
    }
    html body main#lessonPage.choose-page {
      padding: 50px 40px 6px !important;
      justify-content: center !important;
      gap: 0 !important;
    }
    .choose-page .question-title {
      font-size: 30px !important;
      line-height: 1.25;
      font-weight: 400;
      color: #37324a;
      text-align: center;
      width: fit-content;
      max-width: min(920px, 100%);
      margin: 0 auto;
      padding: 2px 40px 0;
      flex-shrink: 0;
    }
    @media (min-width: 1441px) {
      .choose-page .question-title {
        font-size: 40px !important;
      }
    }
    .choose-page .image-nav-row {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 42vh;
      min-height: 0;
      flex-shrink: 1;
    }
    .choose-page .question-media {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border: 2px solid rgba(124, 92, 191, 0.48);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.56);
      width: 100%;
      max-width: 850px;
      box-sizing: border-box;
    }
    .choose-page .question-media img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }
    .choose-page .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      flex-shrink: 0;
      padding: 10px 4px;
      width: 100%;
      max-width: 700px;
    }
    .choose-page .option-card {
      counter-reset: option-letter;
      border-radius: 14px;
      color: #4a425f;
      cursor: pointer;
      display: flex;
      flex-direction: column-reverse;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 18px 16px 16px;
      text-align: center;
      font-size: 30px;
      font-weight: 400;
      min-height: 140px;
      min-width: 0;
      position: relative;
      border: 2px solid rgba(124, 92, 191, 0.36);
      background: rgba(255, 255, 255, 0.85);
      transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
      box-shadow: 0 4px 14px rgba(78, 63, 118, 0.06);
      box-sizing: border-box;
      overflow: hidden;
    }
    .choose-page .option-card::before {
      content: counter(option-letter, upper-alpha);
      position: absolute;
      top: 12px;
      left: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: #7c5cbf;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(78, 63, 118, 0.18);
    }
    .choose-page .option-card:nth-child(1) { border-color: rgba(65, 153, 76, 0.62); }
    .choose-page .option-card:nth-child(2) { border-color: rgba(235, 157, 26, 0.72); }
    .choose-page .option-card:nth-child(3) { border-color: rgba(46, 151, 205, 0.66); }
    .choose-page .option-card:nth-child(4) { border-color: rgba(139, 92, 191, 0.66); }
    .choose-page .option-card:nth-child(1)::before { background: #4a9b45; }
    .choose-page .option-card:nth-child(2)::before { background: #eba11a; }
    .choose-page .option-card:nth-child(3)::before { background: #2f9bd1; }
    .choose-page .option-card:nth-child(4)::before { background: #8d5ac3; }
    .choose-page .option-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(124, 92, 191, 0.18); }
    .choose-page .option-card .option-text {
      min-height: 38px;
      padding: 0 36px;
      color: #4b3c70;
      font-size: 32px;
      line-height: 1.15;
      font-weight: 600;
      width: 100%;
      text-align: center;
    }
    .choose-page .option-card .option-image {
      width: min(100%, 150px);
      height: 100px;
      flex: 0 0 100px;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .choose-page .option-card .option-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 0;
    }
    .choose-page .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0 0;
      flex-shrink: 0;
      width: 100%;
      max-width: 700px;
    }
    .choose-page .controls .prev,
    .choose-page .controls .next {
      min-width: 130px;
      height: 52px;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 25px;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }
    .choose-page .controls .prev { background: linear-gradient(135deg, #9a7ad4, #7c5cbf); }
    .choose-page .controls .next { background: linear-gradient(135deg, #5cb3d4, #3d9bc0); }
    .choose-page .controls .prev:hover { background: linear-gradient(135deg, #b08ce8, #8b6bcb); transform: translateY(-3px) scale(1.04); box-shadow: 0 8px 24px rgba(124, 92, 191, 0.35); }
    .choose-page .controls .next:hover { background: linear-gradient(135deg, #6ec0de, #4daace); transform: translateY(-3px) scale(1.04); box-shadow: 0 8px 24px rgba(61, 155, 192, 0.35); }
    .choose-page .controls button:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none; }
    .correct:not(.feedback-popout) { background: #e9f9ef !important; border: 2px solid #29a862; color: #16653d; }
    .wrong:not(.feedback-popout) { background: #fff0f0 !important; border: 2px solid #ef5350; color: #9f2323; animation: shake 0.35s ease; }
    .disabled, .used { opacity: 0.42; pointer-events: none; }
    .choose-page .message { min-height: 0; text-align: center; font-size: 22px; font-weight: 400; color: #5a4a80; flex-shrink: 0; }
    @media (max-width: 900px) {
      .choose-page { padding: 50px 20px 12px; }
      .choose-page .question-title { font-size: 30px; padding: 6px 20px; width: 100%; }
      .choose-page .option-card { min-height: 100px; font-size: 24px; }
      .choose-page .option-card .option-text { font-size: 24px; }
      .choose-page .option-card .option-image { height: 80px; flex-basis: 80px; }
      .choose-page .controls .prev,
      .choose-page .controls .next { min-width: 110px; height: 46px; font-size: 16px; }
    }
    @media (max-width: 520px) {
      .choose-page .question-title { font-size: 22px; padding: 4px 14px; }
      .choose-page .options-grid { gap: 10px; }
      .choose-page .option-card { min-height: 90px; font-size: 20px; padding: 12px 10px 10px; }
      .choose-page .option-card .option-text { font-size: 20px; min-height: 28px; padding: 0 24px; }
      .choose-page .option-card .option-image { height: 68px; flex-basis: 68px; }
      .choose-page .controls .prev,
      .choose-page .controls .next { min-width: 94px; height: 42px; font-size: 15px; padding: 0 16px; }
    }
  </style>
<link rel="stylesheet" href="../../grade1-typography.css?v=grade1font1">
</head>
<body>
  <main class="lesson-page choose-page" id="lessonPage">
    <h2 class="question-title" id="questionTitle"></h2>
    <div class="image-nav-row">
      <div class="question-media" id="questionImageWrap"></div>
    </div>
    <div class="options-grid" id="optionsArea"></div>
    <p class="message" id="message"></p>
    <div class="controls">
      <button class="prev" id="prevBtn" type="button"><i class="fa-solid fa-angles-left"></i> Prev</button>
      <button class="next" id="nextBtn" type="button">Next <i class="fa-solid fa-angles-right"></i></button>
    </div>
  </main>

  <script>
    window.lesson5Config = {
      type: "mcq",
      questions: [
        {
          q: "Q1. Where did the mouse live?",
          img: "../assets/images/lesson5/mouse-removebg-preview.png",
          answer: 1,
          options: [
            { text: "In a pond", img: "../assets/images/pond1-removebg-preview.png" },
            { text: "In a hole", img: "../assets/images/hole-removebg-preview.png" },
            { text: "In a hut", img: "../assets/images/hut-removebg-preview.png" },
            { text: "In a tree", img: "../assets/images/in_a_tree-removebg-preview.png" }
          ]
        },
        {
          q: "Q2. What did the frog tie to the mouse's tail?",
          img: "../assets/images/lesson5/mousefrog-removebg-preview.png",
          answer: 0,
          options: [
            { text: "A string", img: "../assets/images/lesson5/choose_q2_a.svg" },
            { text: "A wire", img: "../assets/images/lesson5/choose_q2_b.svg" },
            { text: "A rope", img: "../assets/images/lesson5/choose_q2_c.svg" },
            { text: "A hair", img: "../assets/images/lesson5/choose_q2_d.svg" }
          ]
        },
        {
          q: "Q3. Which bird flew down and grabbed the mouse?",
          img: "../assets/images/lesson5/scaredmouse.png",
          answer: 2,
          options: [
            { text: "A crow", img: "../assets/images/crow-removebg-preview.png" },
            { text: "A duck", img: "../assets/images/duck1-removebg-preview.png" },
            { text: "A hawk", img: "../assets/images/hawk1-removebg-preview.png" },
            { text: "A bat", img: "../assets/images/bat-removebg-preview.png" }
          ]
        }
      ]
    };
  </script>
  <audio id="correctSound" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
  <script src="../assets/JavaScript/lesson5.js?v=lesson3fix58"></script>
</body>
</html>
