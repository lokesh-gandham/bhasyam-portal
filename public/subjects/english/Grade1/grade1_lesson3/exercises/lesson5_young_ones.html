<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="../assets/CSS/lesson5.css?v=lesson3fix58">
  <style>
    body { background: url("../assets/images/background.jpg") !important; background-size: 100% 100% !important; }
  </style>
<link rel="stylesheet" href="../../grade1-typography.css?v=grade1font1">
</head>
<body>
  <main class="lesson-page" id="lessonPage">
    <h2 class="question-title" id="questionTitle"></h2>
    <section class="activity-layout">
      <div class="question-media" id="questionImageWrap"></div>
      <div class="options-grid" id="optionsArea"></div>
    </section>
    <p class="message" id="message"></p>
    <div class="controls">
      <button class="prev" id="prevBtn" type="button" aria-label="Previous"><i class="fa-solid fa-angles-left"></i> Prev</button>
      <button class="next" id="nextBtn" type="button" aria-label="Next">Next <i class="fa-solid fa-angles-right"></i></button>
    </div>
  </main>

  <script>
    window.lesson5Config = {
      type: "crossword",
      title: "Young ones crossword",
      prompt: "",
      rows: 7,
      cols: 10,
      words: [
        { number: 1, clue: "baby chicken", answer: "chick", row: 1, col: 0, dir: "across", given: [] },
        { number: 2, clue: "baby goat", answer: "kid", row: 0, col: 2, dir: "down", given: [] },
        { number: 3, clue: "baby duck", answer: "duckling", row: 2, col: 2, dir: "across", given: [] },
        { number: 4, clue: "baby sheep", answer: "lamb", row: 2, col: 6, dir: "down", given: [] },
        { number: 5, clue: "baby dog", answer: "pup", row: 4, col: 4, dir: "down", given: [] },
        { number: 6, clue: "baby lion", answer: "cub", row: 5, col: 3, dir: "across", given: [] }
      ],
      markers: [
        { img: "../assets/images/chick-removebg-preview.png", label: "baby chicken", className: "mark-chick" },
        { img: "../assets/images/kid-removebg-preview.png", label: "baby goat", className: "mark-kid" },
        { img: "../assets/images/lamb-removebg-preview.png", label: "baby sheep", className: "mark-lamb" },
        { img: "../assets/images/duck-removebg-preview.png", label: "baby duck", className: "mark-duck" },
        { img: "../assets/images/pup-removebg-preview.png", label: "baby dog", className: "mark-pup" },
        { img: "../assets/images/cub-removebg-preview.png", label: "baby lion", className: "mark-cub" }
      ]
    };
  </script>
  <audio id="correctSound" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
  <script src="../assets/JavaScript/lesson5.js?v=lesson3fix58"></script>
