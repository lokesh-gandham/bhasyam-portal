<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--lesson-body-font);
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: url("assets/images/background.jpg");
      background-size: 100% 100%;
    }

    .app {
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 280px;
      padding: 24px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
    }

    .pill-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 72px;
      padding: 0 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.75);
      transition: all 0.3s ease;
      border: none;
      box-shadow: none;
      position: relative;
    }

    .pill-icon {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      flex-shrink: 0;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .pill-btn .pill-text {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      font-size: 21px;
      font-weight: 500;
      color: #4a4a5a;
      transition: color 0.3s ease;
    }

    .o1:hover { background: rgba(245, 158, 11, 0.25); }
    .o2:hover { background: rgba(216, 132, 62, 0.25); }
    .o3:hover { background: rgba(16, 185, 129, 0.25); }
    .o4:hover { background: rgba(6, 182, 212, 0.25); }
    .o5:hover { background: rgba(139, 92, 246, 0.25); }
    .o6:hover { background: rgba(236, 72, 153, 0.25); }
    .o7:hover { background: rgba(59, 130, 246, 0.25); }

    .o1.active { background: #f59e0b; color: #fff; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35); }
    .o2.active { background: #d8843e; color: #fff; box-shadow: 0 4px 20px rgba(216, 132, 62, 0.35); }
    .o3.active { background: #10b981; color: #fff; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35); }
    .o4.active { background: #06b6d4; color: #fff; box-shadow: 0 4px 20px rgba(6, 182, 212, 0.35); }
    .o5.active { background: #8b5cf6; color: #fff; box-shadow: 0 4px 20px rgba(139, 92, 246, 0.35); }
    .o6.active { background: #ec4899; color: #fff; box-shadow: 0 4px 20px rgba(236, 72, 153, 0.35); }
    .o7.active { background: #3b82f6; color: #fff; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35); }

    .pill-btn.active .pill-text { color: #fff; font-weight: 500; }
    .pill-btn.active .pill-icon { background: rgba(255, 255, 255, 0.25); box-shadow: none; transform: none; }

    .o1 .pill-icon { background: rgba(255, 255, 255, 0.15); }
    .o2 .pill-icon { background: rgba(255, 255, 255, 0.15); }
    .o3 .pill-icon { background: rgba(255, 255, 255, 0.15); }
    .o4 .pill-icon { background: rgba(255, 255, 255, 0.15); }
    .o5 .pill-icon { background: rgba(255, 255, 255, 0.15); }
    .o6 .pill-icon { background: rgba(255, 255, 255, 0.15); }
    .o7 .pill-icon { background: rgba(255, 255, 255, 0.15); }
    .pill-btn.active .pill-icon { background: rgba(255, 255, 255, 0.25); }

    .main {
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    .menu-btn,
    .offcanvas {
      display: none;
    }

    @media(max-width:1065px) {
      .app { flex-direction: column; }
      .sidebar { display: none; }
      .menu-btn {
        display: block;
        position: fixed;
        top: 6px;
        right: 12px;
        font-size: 22px;
        background: #e9a106;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 4px 10px;
        cursor: pointer;
        z-index: 5000;
      }
      .offcanvas {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .4);
        display: none;
        z-index: 4000;
      }
      .offcanvas.show { display: block; }
      .offcanvas-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: 280px;
        height: 100%;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        transform: translateX(100%);
        transition: .3s;
        overflow-y: auto;
      }
      .offcanvas.show .offcanvas-panel {
        transform: translateX(0);
        padding: 55px 14px 14px;
      }
      .offcanvas-panel .pill-btn { margin-bottom: 8px; height: 60px; font-size: 16px; padding: 0 14px; border-radius: 12px; }
      .offcanvas-panel .pill-btn .pill-icon { width: 42px; height: 42px; font-size: 16px; }
      .offcanvas-panel .pill-btn .pill-text { font-size: 16px; }
    }

    @media (min-width: 1025px) and (max-width: 1440px) {
      .sidebar { width: 300px; padding: 18px 12px; gap: 8px; }
      .pill-btn { height: 66px; padding: 0 14px; border-radius: 12px; }
      .pill-btn .pill-icon { width: 46px; height: 46px; font-size: 17px; }
      .pill-btn .pill-text { font-size: 21px; }
    }

    @media (min-width: 1441px) {
      .sidebar { width: 320px; padding: 28px 18px; gap: 12px; }
      .pill-btn { height: 82px; padding: 0 20px; border-radius: 16px; }
      .pill-btn .pill-icon { width: 56px; height: 56px; font-size: 20px; }
      .pill-btn .pill-text { font-size: 23px; }
    }
  </style>
<link rel="stylesheet" href="../grade1-typography.css?v=grade1font1">
</head>

<body>

  <button class="menu-btn" onclick="toggleMenu()">&#9776;</button>

  <div class="app">
    <div class="sidebar">
      <div class="pill-btn o1 active" onclick="openIsland(0)">
        <div class="pill-icon"><i class="fa-solid fa-check"></i></div>
        <span class="pill-text">Choose options</span>
      </div>
      <div class="pill-btn o2" onclick="openIsland(1)">
        <div class="pill-icon"><i class="fa-solid fa-shuffle"></i></div>
        <span class="pill-text">Jumbled words</span>
      </div>
      <div class="pill-btn o3" onclick="openIsland(2)">
        <div class="pill-icon"><i class="fa-solid fa-arrows-left-right"></i></div>
        <span class="pill-text">Opposites</span>
      </div>
      <div class="pill-btn o4" onclick="openIsland(3)">
        <div class="pill-icon"><i class="fa-solid fa-paw"></i></div>
        <span class="pill-text">Young ones</span>
      </div>
      <div class="pill-btn o5" onclick="openIsland(4)">
        <div class="pill-icon"><i class="fa-solid fa-layer-group"></i></div>
        <span class="pill-text">Singular / plural</span>
      </div>
      <div class="pill-btn o6" onclick="openIsland(5)">
        <div class="pill-icon"><i class="fa-solid fa-pen"></i></div>
        <span class="pill-text">Fill In The Blanks</span>
      </div>
      <div class="pill-btn o7" onclick="openIsland(6)">
        <div class="pill-icon"><i class="fa-solid fa-palette"></i></div>
        <span class="pill-text">Colour picture</span>
      </div>
    </div>

    <div class="main">
      <iframe id="contentFrame" src="./exercises/lesson5_choose_options.html?v=lesson3fix58" allow="autoplay"></iframe>
    </div>
  </div>

  <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">
    <div class="offcanvas-panel" onclick="event.stopPropagation()">
      <div class="pill-btn o1 active" onclick="mobileOpen(0)">
        <div class="pill-icon"><i class="fa-solid fa-check"></i></div>
        <span class="pill-text">Choose options</span>
      </div>
      <div class="pill-btn o2" onclick="mobileOpen(1)">
        <div class="pill-icon"><i class="fa-solid fa-shuffle"></i></div>
        <span class="pill-text">Jumbled words</span>
      </div>
      <div class="pill-btn o3" onclick="mobileOpen(2)">
        <div class="pill-icon"><i class="fa-solid fa-arrows-left-right"></i></div>
        <span class="pill-text">Opposites</span>
      </div>
      <div class="pill-btn o4" onclick="mobileOpen(3)">
        <div class="pill-icon"><i class="fa-solid fa-paw"></i></div>
        <span class="pill-text">Young ones</span>
      </div>
      <div class="pill-btn o5" onclick="mobileOpen(4)">
        <div class="pill-icon"><i class="fa-solid fa-layer-group"></i></div>
        <span class="pill-text">Singular / plural</span>
      </div>
      <div class="pill-btn o6" onclick="mobileOpen(5)">
        <div class="pill-icon"><i class="fa-solid fa-pen"></i></div>
        <span class="pill-text">Fill In The Blanks</span>
      </div>
      <div class="pill-btn o7" onclick="mobileOpen(6)">
        <div class="pill-icon"><i class="fa-solid fa-palette"></i></div>
        <span class="pill-text">Colour picture</span>
      </div>
    </div>
  </div>

  <script>
    const sidebarButtons = document.querySelectorAll(".sidebar .pill-btn");
    const mobileButtons = document.querySelectorAll(".offcanvas .pill-btn");
    const frame = document.getElementById("contentFrame");

    const pages = [
      "./exercises/lesson5_choose_options.html?v=lesson3fix58",
      "./exercises/lesson5_jumbled_words.html?v=lesson3fix58",
      "./exercises/lesson5_opposites.html?v=lesson3fix58",
      "./exercises/lesson5_young_ones.html?v=lesson3fix58",
      "./exercises/lesson5_singular_plural.html?v=lesson3fix58",
      "./exercises/lesson5_fill_blanks.html?v=lesson3fix66",
      "./exercises/lesson5_colour_picture.html?v=lesson3fix58"
    ];

    const feedbackSounds = {
      correct: new Audio("https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"),
      wrong: new Audio("https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3")
    };

    Object.values(feedbackSounds).forEach(sound => {
      sound.preload = "auto";
      sound.volume = 1;
    });

    function speakFeedback(text) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.volume = 1;
      utterance.rate = 1;
      utterance.pitch = 1;
      speechSynthesis.speak(utterance);
    }

    function playFeedbackSound(result) {
      const type = result === "correct" ? "correct" : "wrong";
      const sound = feedbackSounds[type];
      if (sound) {
        sound.currentTime = 0;
        sound.play().catch(() => {});
      }
      speakFeedback(type === "correct" ? "Correct" : "Try again");
    }

    window.addEventListener("message", (event) => {
      if (!event.data || event.data.source !== "lesson3-feedback") return;
      playFeedbackSound(event.data.result);
    });

    function openIsland(index) {
      sidebarButtons.forEach(btn => btn.classList.remove("active"));
      sidebarButtons[index].classList.add("active");
      mobileButtons.forEach(btn => btn.classList.remove("active"));
      mobileButtons[index].classList.add("active");
      frame.src = pages[index];
    }

    function toggleMenu() {
      if (window.innerWidth > 1065) return;
      document.getElementById("offcanvas").classList.toggle("show");
    }

    function mobileOpen(i) {
      openIsland(i);
      toggleMenu();
    }
  </script>
</body>
</html>
