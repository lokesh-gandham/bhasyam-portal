<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
  <link rel="stylesheet" href="../assets/CSS/lesson6.css?v=lesson4fix68">
<link rel="stylesheet" href="../../grade1-typography.css?v=grade1font1">

<body class="fill-blanks-activity">
  <main class="page">
    <section class="activity-shell">
      <p class="sub-note">Observe the image and fill in the blanks with the words given below.</p>

      <section class="kind-workspace" id="fillBlanksArea" aria-label="Fill in the blanks"></section>
      <p class="message" id="message"></p>
      <div class="control-row">
        <button class="nav-btn prev" id="prevBtn" type="button">Previous</button>
        <button class="nav-btn next" id="nextBtn" type="button">Next</button>
      </div>
    </section>
  </main>

  <script>
    window.lesson6Config = {
      type: "fill",
      wordBank: ["Please", "Sorry", "Thank you", "Excuse me"],
      questions: [
        {
          textAfter: " for the present.",
          answer: "Thank you",
          image: "../assets/images/present-removebg-preview.png",
          imageAlt: "A child receiving a present",
          success: "We say Thank you when someone gives us something."
        },
        {
          textAfter: " teacher, I have a question.",
          answer: "Excuse me",
          image: "../assets/images/teacherquestion-removebg-preview.png",
          imageAlt: "A student asking the teacher a question",
          success: "We say Excuse me when we want to request attention."
        },
        {
          textBefore: "I'm ",
          textAfter: ". Take this ball.",
          answer: "Sorry",
          image: "../assets/images/sorry-removebg-preview.png",
          imageAlt: "A child saying sorry",
          success: "We say Sorry when we make a mistake."
        },
        {
          textAfter: ", give your book.",
          answer: "Please",
          image: "../assets/images/givingbook-removebg-preview.png",
          imageAlt: "A child asking for a book",
          success: "We say Please when we make a request."
        }
      ]
    };
  </script>
  <script src="../assets/JavaScript/lesson6.js?v=lesson4fix68"></script>
</body>

</html>
