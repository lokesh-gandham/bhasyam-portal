<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
  <link rel="stylesheet" href="../assets/CSS/lesson6.css?v=lesson4fix69">
<link rel="stylesheet" href="../../grade1-typography.css?v=grade1font1">
</head>

<body class="plural-activity">
  <main class="page">
    <section class="activity-shell">
      <div class="top-strip">
        <div class="question-pill" id="questionPill">Question 1 of 4</div>
        <div class="progress-dots" id="progressDots" aria-label="Question progress"></div>
      </div>
      
      <section class="transformer-frame">
        <div class="transformer-card singular-card">
          <span class="card-label">Singular</span>
          <div class="card-image" id="singularImage"></div>
          <span class="card-word" id="singularWord"></span>
        </div>
        
        <div class="transformer-arrow">
          <svg viewBox="0 0 80 40" aria-hidden="true">
            <path d="M5 20 L60 20" stroke="#b8a5e0" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
            <path d="M52 12 L68 20 L52 28" fill="none" stroke="#b8a5e0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="rule-badge" id="ruleBadge"></span>
        </div>
        
        <div class="transformer-card plural-card">
          <span class="card-label">Plural</span>
          <div class="card-word" id="pluralPreview"></div>
        </div>
      </section>
      
      <div class="suffix-choices" id="suffixChoices" aria-label="Choose the correct ending"></div>
      
      <p class="message" id="message"></p>
      <div class="control-row">
        <button class="nav-btn prev" id="prevBtn" type="button">Previous</button>
        <button class="nav-btn next" id="nextBtn" type="button">Next</button>
      </div>
    </section>
  </main>

  <script>
    window.lesson6Config = {
      type: "transform",
      questions: [
        {
          q: "Q1. What is the plural of class?",
          singular: "class",
          answer: 2,
          rule: "+ es",
          image: "../assets/images/class-removebg-preview.png",
          success: "class becomes classes",
          suffixes: ["+ s", "+ ss", "+ es", "+ ies"]
        },
        {
          q: "Q2. What is the plural of match?",
          singular: "match",
          answer: 2,
          rule: "+ es",
          image: "../assets/images/match-removebg-preview.png",
          success: "match becomes matches",
          suffixes: ["+ s", "+ ch", "+ es", "+ esh"]
        },
        {
          q: "Q3. What is the plural of dish?",
          singular: "dish",
          answer: 2,
          rule: "+ es",
          image: "../assets/images/dish-removebg-preview.png",
          success: "dish becomes dishes",
          suffixes: ["+ s", "+ sh", "+ es", "+ ies"]
        },
        {
