<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assessments</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #eef8cf;
      color: #42335c;
    }
    .app {
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 280px;
      padding: 24px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(180deg, rgba(244, 253, 211, 0.72), rgba(232, 247, 199, 0.62));
      border-right: 0;
      box-shadow: inset -1px 0 0 rgba(136, 172, 97, 0.08);
      backdrop-filter: none;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 72px;
      padding: 0 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      color: #5f5678;
      transition: all 0.3s ease;
      border: 2px solid rgba(255, 255, 255, 0.68);
      box-shadow: none;
      position: relative;
      overflow: hidden;
    }

    @media (max-height: 820px) {
      .sidebar {
        padding: 18px 12px;
        gap: 8px;
      }
      .menu-item {
        height: clamp(56px, 9vh, 70px);
        padding: 0 14px;
        gap: 12px;
        border-radius: 12px;
      }
      .menu-item span:first-child {
        width: 44px;
        height: 44px;
        font-size: 19px;
      }
      .menu-item span:last-child {
        font-size: 19px;
      }
    }

    @media (min-width: 1025px) and (max-width: 1440px) {
      .sidebar {
        width: 290px;
        padding: 20px 12px;
        gap: 8px;
      }
      .menu-item {
        height: 66px;
        padding: 0 14px;
        border-radius: 12px;
      }
      .menu-item span:first-child {
        width: 48px;
        height: 48px;
        font-size: 18px;
      }
      .menu-item span:last-child {
        font-size: 20px;
      }
    }

    @media (min-width: 1441px) {
      .sidebar {
        width: 320px;
        padding: 28px 18px;
        gap: 12px;
      }
      .menu-item {
        height: 82px;
        padding: 0 20px;
        border-radius: 16px;
      }
      .menu-item span:first-child {
        width: 56px;
        height: 56px;
        font-size: 20px;
      }
      .menu-item span:last-child {
        font-size: 23px;
      }
    }

    .menu-item:hover {
      transform: translateX(4px);
      background: rgba(255, 255, 255, 0.88);
      color: #463a66;
      box-shadow: 0 8px 20px rgba(93, 83, 131, 0.08);
    }

    .menu-item.active {
      color: #362854;
      background: linear-gradient(135deg, #ffffff, var(--tone-soft));
      box-shadow: 0 14px 30px rgba(93, 83, 131, 0.18), inset 0 0 0 2px rgba(255, 255, 255, 0.72);
      border: 3px solid var(--tone);
      transform: translateX(4px);
    }

    .menu-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 7px;
      border-radius: 0 999px 999px 0;
      background: linear-gradient(180deg, var(--tone), var(--tone-dark));
      box-shadow: 0 0 12px color-mix(in srgb, var(--tone) 44%, transparent);
    }

    .menu-item span:first-child {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--tone), var(--tone-dark));
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .menu-item.active span:first-child {
      background: linear-gradient(135deg, var(--tone), var(--tone-dark));
      box-shadow: 0 8px 18px color-mix(in srgb, var(--tone) 36%, transparent);
    }

    .menu-item.active span:last-child {
      color: #2f2948;
      font-weight: 700;
    }

    .menu-item span:last-child {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      font-size: 21px;
      font-weight: 500;
      color: #4a4a5a;
      transition: color 0.3s ease;
    }

    .m1 { --tone: #8f73d6; --tone-dark: #7053be; --tone-soft: #efe9ff; --tone-border: #cdbff4; }
    .m2 { --tone: #ff9a78; --tone-dark: #ef7856; --tone-soft: #fff0e9; --tone-border: #ffc7b4; }
    .m3 { --tone: #24b6a5; --tone-dark: #0d9387; --tone-soft: #e7fbf5; --tone-border: #a8eadf; }
    .m4 { --tone: #41aee1; --tone-dark: #238dc2; --tone-soft: #e7f6ff; --tone-border: #aedff7; }
    .m5 { --tone: #f05b9b; --tone-dark: #d64082; --tone-soft: #ffeaf3; --tone-border: #f8b7d3; }
    .m6 { --tone: #f0ad2d; --tone-dark: #d78d12; --tone-soft: #fff5dc; --tone-border: #f5d18a; }

    .main {
      flex: 1;
      min-width: 0;
      height: 100vh;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      display: block;
    }

    .menu-toggle,
    .mobile-layer {
      display: none;
    }

    @media (max-width: 980px) {
      .app {
        display: block;
      }

      .sidebar {
        display: none;
      }

      .menu-toggle {
        display: grid;
        place-items: center;
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 30;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: #7b61c8;
        box-shadow: 0 8px 18px rgba(71, 55, 122, 0.25);
      }

      .mobile-layer {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: none;
        background: rgba(44, 35, 62, 0.34);
      }

      .mobile-layer.show {
        display: block;
      }

      .mobile-panel {
        margin-left: auto;
        width: min(310px, 86vw);
        height: 100%;
        padding: 72px 14px 18px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: -12px 0 30px rgba(52, 44, 82, 0.2);
      }

      .mobile-panel .menu-item {
        margin-bottom: 10px;
        height: 62px;
        padding: 0 14px;
      }

      .mobile-panel .menu-item span:first-child {
        width: 44px;
        height: 44px;
        font-size: 19px;
      }

      .mobile-panel .menu-item span:last-child {
        font-size: 19px;
      }
    }
  </style>
<link rel="stylesheet" href="../grade1-typography.css?v=grade1font1">

</head>

<body>
  <button class="menu-toggle" type="button" aria-label="Open menu" onclick="toggleMenu()">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="app">
    <nav class="sidebar" aria-label="Lesson activities">
      <button class="menu-item m1 active" type="button" onclick="openPage(0)">
        <span><i class="fa-solid fa-list-check"></i></span><span>Choose Options</span>
      </button>
      <button class="menu-item m2" type="button" onclick="openPage(1)">
        <span><i class="fa-solid fa-link"></i></span><span>Meanings</span>
      </button>
      <button class="menu-item m3" type="button" onclick="openPage(2)">
        <span><i class="fa-solid fa-arrows-left-right"></i></span><span>Opposites</span>
      </button>
      <button class="menu-item m4" type="button" onclick="openPage(3)">
        <span><i class="fa-solid fa-layer-group"></i></span><span>Singular Plural</span>
      </button>
      <button class="menu-item m5" type="button" onclick="openPage(4)">
        <span><i class="fa-solid fa-pen-to-square"></i></span><span>Fill In The Blanks</span>
      </button>
      <button class="menu-item m6" type="button" onclick="openPage(5)">
        <span><i class="fa-solid fa-comment-dots"></i></span><span>Kind Words</span>
      </button>
    </nav>

    <main class="main">
      <iframe id="contentFrame" title="Lesson 4 activity" src="./exercises/lesson6_choose_options.html?v=lesson4fix70" allow="autoplay" allowtransparency="true"></iframe>
    </main>
  </div>

  <div class="mobile-layer" id="mobileLayer" onclick="toggleMenu()">
    <div class="mobile-panel" onclick="event.stopPropagation()">
      <button class="menu-item m1 active" type="button" onclick="mobileOpen(0)">
        <span><i class="fa-solid fa-list-check"></i></span><span>Choose Options</span>
      </button>
      <button class="menu-item m2" type="button" onclick="mobileOpen(1)">
        <span><i class="fa-solid fa-link"></i></span><span>Meanings</span>
      </button>
      <button class="menu-item m3" type="button" onclick="mobileOpen(2)">
        <span><i class="fa-solid fa-arrows-left-right"></i></span><span>Opposites</span>
      </button>
      <button class="menu-item m4" type="button" onclick="mobileOpen(3)">
        <span><i class="fa-solid fa-layer-group"></i></span><span>Singular Plural</span>
      </button>
      <button class="menu-item m5" type="button" onclick="mobileOpen(4)">
        <span><i class="fa-solid fa-pen-to-square"></i></span><span>Fill In The Blanks</span>
      </button>
      <button class="menu-item m6" type="button" onclick="mobileOpen(5)">
        <span><i class="fa-solid fa-comment-dots"></i></span><span>Kind Words</span>
      </button>
    </div>
  </div>

  <script>
    const pages = [
      "./exercises/lesson6_choose_options.html?v=lesson4fix70",
      "./exercises/lesson6_meanings.html?v=lesson4fix72",
      "./exercises/lesson6_opposites.html?v=lesson4fix77",
      "./exercises/lesson6_singular_plural.html?v=lesson4fix60",
      "./exercises/lesson6_kind_words_a.html?v=lesson4fix68",
      "./exercises/lesson6_kind_words_b.html?v=lesson4fix65"
    ];

    const frame = document.getElementById("contentFrame");
    const desktopItems = document.querySelectorAll(".sidebar .menu-item");
    const mobileItems = document.querySelectorAll(".mobile-panel .menu-item");

    function openPage(index) {
      frame.src = pages[index];
      desktopItems.forEach((item, itemIndex) => item.classList.toggle("active", itemIndex === index));
      mobileItems.forEach((item, itemIndex) => item.classList.toggle("active", itemIndex === index));
    }

    function toggleMenu() {
      document.getElementById("mobileLayer").classList.toggle("show");
    }

    function mobileOpen(index) {
      openPage(index);
      toggleMenu();
    }
  </script>

</body>

</html>
