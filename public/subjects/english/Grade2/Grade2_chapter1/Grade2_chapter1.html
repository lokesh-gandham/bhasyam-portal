<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Assessments</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    @font-face {
      font-family: 'CCSYBold';
      src: url('assets/CCSYBOLD.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'CCSyntroman';
      src: url('./assets/CCSYNTRO.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "CCSyntroman";
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: row;
      background-image: url("./assets/images/bg.png");
      background-size: cover;
      background-position: center center;
    }

    /* ================= HAMBURGER BUTTON ================= */
    .hamburger {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .hamburger:hover {
      background: rgba(255, 255, 255, 0.95);
      transform: scale(1.05);
    }

    .hamburger .bar {
      display: block;
      width: 24px;
      height: 2.5px;
      background: #2d3a3f;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .hamburger.active .bar:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .hamburger.active .bar:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active .bar:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* ================= SIDEBAR OVERLAY ================= */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 998;
    }

    .sidebar-overlay.active {
      display: block;
    }

    /* ================= SIDEBAR ================= */
    .sidebar {
      height: 100%;
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: 8px;
      padding: 24px 16px;
      position: relative;
      z-index: 999;
      border: none;
      outline: none;
      transition: transform 0.3s ease;
    }

    /* ---------- NAV ITEM (card) ---------- */
    .nav-item {
      flex: 0 0 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      padding: 8px 14px;
      border-radius: 20px;
      font-family: "CCSyntroman" !important;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all .3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      color: #2d3f2d;
      white-space: nowrap;
      position: relative;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      letter-spacing: 0.3px;
      overflow: hidden;
      gap: 0.7em;
      box-sizing: border-box;
    }

    .nav-item:hover {
      transform: translateY(-3px) scale(1.02);
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 12px 30px rgba(60, 180, 140, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      color: #1a2e26;
    }

    /* icon badge (left circle) */
    .nav-badge {
      width: 2.3em;
      height: 2.3em;
      min-width: 2.3em;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--badge-bg, #eee);
      color: var(--accent, #666);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.6), 0 2px 6px rgba(0, 0, 0, 0.04);
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .nav-badge i {
      font-size: 0.9em;
    }

    .nav-item:hover .nav-badge {
      transform: scale(1.1) rotate(-3deg);
    }

    /* label */
    .nav-label {
      flex: 1;
      min-width: 0;
      font-size: 1em;
      font-family: "CCSyntroman";
      font-weight: 600;
    }

    /* arrow (right circle) */
    .nav-arrow {
      width: 1.8em;
      height: 1.8em;
      min-width: 1.8em;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.85);
      color: var(--accent, #666);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .nav-arrow i {
      font-size: 0.65em;
    }

    .nav-item:hover .nav-arrow {
      transform: translateX(2px);
    }

    /* colour tokens per item */
    .nav-item[data-color="amber"] {
      --badge-bg: #fef3c7;
      --accent: #f59e0b;
    }

    .nav-item[data-color="green"] {
      --badge-bg: #d1fae5;
      --accent: #10b981;
    }

    .nav-item[data-color="pink"] {
      --badge-bg: #fce7f3;
      --accent: #ec4899;
    }

    .nav-item[data-color="yellow"] {
      --badge-bg: #fef9c3;
      --accent: #ca8a04;
    }

    .nav-item[data-color="purple"] {
      --badge-bg: #ede9fe;
      --accent: #8b5cf6;
    }

    .nav-item[data-color="blue"] {
      --badge-bg: #dbeafe;
      --accent: #3b82f6;
    }

    /* ----- ACTIVE STATE ----- */
    .nav-item.active {
      background: linear-gradient(145deg, #7cdb9e, #4fc47a);
      color: #fff;
      box-shadow: 0 8px 28px rgba(70, 200, 130, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transform: translateY(-2px) scale(1.02);
      text-shadow: 0 1px 8px rgba(0, 40, 20, 0.2);
    }

    .nav-item.active .nav-badge {
      background: rgba(255, 255, 255, 0.92);
      color: #2d8a5e;
    }

    .nav-item.active .nav-arrow {
      background: rgba(255, 255, 255, 0.95);
      color: #2d8a5e;
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), transparent, rgba(255, 255, 255, 0.1));
      z-index: -1;
      filter: blur(2px);
    }

    /* ================= QUIZ AREA ================= */
    .quiz-area {
      flex: 1;
      height: 100%;
      display: flex;
      min-width: 0;
    }

    iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    /* ================= TABLET ================= */
    @media (max-width:1024px) {
      .sidebar {
        width: 370px;
      }

      .nav-item {
        font-size: 18px;
        flex: 0 0 62px;
        height: 62px;
        padding: 6px 12px;
      }
    }

    /* ================= MOBILE ================= */
    @media (max-width:700px) {
      .hamburger {
        display: flex;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 340px;
        height: 100%;
        transform: translateX(-100%);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 70px 16px 24px;
        gap: 6px;
        box-shadow: 2px 0 30px rgba(0, 0, 0, 0.15);
        border: none;
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .nav-item {
        flex: 0 0 60px;
        height: 60px;
        font-size: 15px;
        padding: 6px 12px;
        border-radius: 16px;
        white-space: nowrap;
        background: rgba(255, 255, 255, 0.7);
        justify-content: flex-start;
      }

      .sidebar-overlay.active {
        display: block;
      }

      .quiz-area {
        margin-left: 0;
      }
    }

    /* ================= LARGE DESKTOP ================= */
    @media screen and (min-width: 1400px) and (max-width: 1600px) {
      .sidebar {
        width: 420px;
        gap: 8px;
        padding: 20px 18px;
      }

      .nav-item {
        flex: 0 0 72px;
        height: 72px;
        font-size: 24px !important;
        padding: 8px 18px;
        border-radius: 22px;
      }
    }

    /* ================= FULL HD / 2K DESKTOP ================= */
    @media screen and (min-width: 1920px) {
      .sidebar {
        width: 420px;
        gap: 10px;
        padding: 32px 24px;
      }

      .nav-item {
        flex: 0 0 78px;
        height: 78px;
        font-size: 24px !important;
        padding: 10px 20px;
        border-radius: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HAMBURGER BUTTON ================= -->
  <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <!-- ================= OVERLAY ================= -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ================= NAVIGATION ================= -->
  <div class="sidebar" id="navBar">
    <div class="nav-item active" data-color="amber" onclick="loadQuiz('exercises/MCQ.html', this)">
      <span class="nav-badge"><i class="fa-solid fa-circle-check"></i></span>
      <span class="nav-label">Choose Options</span>
      <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
    </div>

    <div class="nav-item" data-color="green" onclick="loadQuiz('exercises/matching.html', this)">
      <span class="nav-badge"><i class="fa-solid fa-link"></i></span>
      <span class="nav-label">Synonyms</span>
      <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
    </div>

    <div class="nav-item" data-color="pink" onclick="loadQuiz('exercises/crossWord.html', this)">
      <span class="nav-badge"><i class="fa-solid fa-pen"></i></span>
      <span class="nav-label">Cross Word</span>
      <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
    </div>

    <div class="nav-item" data-color="yellow" onclick="loadQuiz('exercises/pastTense.html', this)">
      <span class="nav-badge"><i class="fa-solid fa-lightbulb"></i></span>
      <span class="nav-label">Verb Forms</span>
      <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
    </div>

    <div class="nav-item" data-color="purple" onclick="loadQuiz('exercises/unscrambel.html', this)">
      <span class="nav-badge"><i class="fa-solid fa-puzzle-piece"></i></span>
      <span class="nav-label">Unscramble Words</span>
      <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
    </div>

    <div class="nav-item" data-color="blue" onclick="loadQuiz('exercises/mcq2.html', this)">
      <span class="nav-badge"><i class="fa-solid fa-users"></i></span>
      <span class="nav-label">Plural Form</span>
      <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
    </div>
  </div>

  <!-- ================= QUIZ AREA ================= -->
  <div class="quiz-area">
    <iframe id="quizFrame" src="exercises/MCQ.html"></iframe>
  </div>

  <script>
    function loadQuiz(link, element) {
      document.getElementById("quizFrame").src = link;
      document.querySelectorAll(".nav-item").forEach(btn => {
        btn.classList.remove("active");
      });
      element.classList.add("active");

      if (window.innerWidth <= 700) {
        document.getElementById('navBar').classList.remove('active');
        document.getElementById('hamburgerBtn').classList.remove('active');
        document.getElementById('sidebarOverlay').classList.remove('active');
      }
    }

    document.getElementById('hamburgerBtn').addEventListener('click', function () {
      this.classList.toggle('active');
      document.getElementById('navBar').classList.toggle('active');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    });

    document.getElementById('sidebarOverlay').addEventListener('click', function () {
      document.getElementById('hamburgerBtn').classList.remove('active');
      document.getElementById('navBar').classList.remove('active');
      this.classList.remove('active');
    });

    window.addEventListener('resize', function () {
      if (window.innerWidth > 700) {
        document.getElementById('navBar').classList.remove('active');
        document.getElementById('hamburgerBtn').classList.remove('active');
        document.getElementById('sidebarOverlay').classList.remove('active');
      }
    });
  </script>

</body>

</html>
