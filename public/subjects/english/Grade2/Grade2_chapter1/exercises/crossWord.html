<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Opposites Crossword</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/crossWord.css">
    <link rel="stylesheet" href="../assets/css/popups.css">
</head>

<body>

    <div class="panel active">
        <div class="panel-head">
            <h1>Fill the crossword with opposite words given in boxes</h1>
            <!-- <p>Type the word that means the opposite!</p> -->
        </div>

        <div class="cw-layout">
            <div class="cw-grid-wrap">
                <div class="cw-grid" id="cwGrid"></div>
            </div>
            <div class="cw-clues" id="cwClues"></div>
        </div>
    </div>

    <!-- final popup -->
    <div id="finalPopup">
        <div class="final-kid-box">
            <h2 id="finalTitle">🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="../assets/js/crossWord.js"></script>
</body>

</html>
