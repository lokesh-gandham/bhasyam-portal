<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matching Game</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../assets/css/m.css">
    <link rel="stylesheet" href="../assets/css/popups.css">
</head>

<body>

    <div class="main">
        <div class="game-container">
            <svg id="line-canvas"></svg>
            <div class="numbers" id="numbersColumn"></div>
            <div class="column left">
                <div class="col-header">Words</div>
                <div class="items" id="leftColumn"></div>
            </div>
            <div class="column right">
                <div class="col-header">Meanings</div>
                <div class="items" id="rightColumn"></div>
            </div>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script src="../assets/js/matching.js"></script>
</body>

</html>
