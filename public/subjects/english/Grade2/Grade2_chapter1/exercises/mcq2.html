<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MCQ Quiz</title>
   <!-- Google Font: Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/mcq2.css">
    <link rel="stylesheet" href="../assets/css/popups.css">
</head>

<body>

    <div class="quiz">

        <div class="quiz-layout">

            <!-- CARD 1: question + image -->
            <div class="header card-image">
                <div class="question-top">
                    <h2 id="question"></h2>
                    <button class="hint-btn" id="hintBtn" onclick="toggleHint()">
                        <i class="fa-regular fa-lightbulb"></i> Hint
                    </button>
                </div>
                <div id="hintText" class="hint-text">
                    <i class="fa-regular fa-circle-check"></i> Add 's' to the words to get their plural form.
                </div>
                <div class="question-image">
                    <img id="questionImg" src="" alt="Question image">
                </div>
            </div>

            <!-- CARD 2: question + image + options -->
            <div class="options-card card-options">
                <div class="question-top"><h2 id="question2"></h2></div>
                <div class="question-image">
                    <img id="questionImg2" src="" alt="Question image">
                </div>
                <!-- <div class="options" id="options"></div> -->
            </div>
            <div class="answer-wrapper">
            <div class="answer-circles" id="answerCircles"></div>
            <div class="letter-option-wrapper">
                <div class="letter-container" id="letterContainer"></div>
            </div>
            </div>
        </div>

        <div class="controls">
            <button class="prev" id="prevBtn"> <i class="fa-solid fa-circle-arrow-left"></i> Prev</button>
            <button class="next" id="nextBtn"><i class="fa-solid fa-circle-arrow-right"></i> Next</button>
        </div>

    </div>

    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">
               Play Again
            </button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="../assets/js/mcq2.js"></script>
</body>

</html>
