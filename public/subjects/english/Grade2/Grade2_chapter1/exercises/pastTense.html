<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Past Tense Worksheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/popups.css">

<style>
  @font-face {
    font-family: 'CCSYBold';
    src: url('../assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  @font-face {
            font-family: 'CCSyntroman';
            src: url('../assets/CCSYNTRO.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "CCSyntroman";
            font-weight: 400;
        }
       

body {
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* ============ CONTENT WRAPPER ============ */
.quiz {
    width: 95%;
    max-width: 1100px;
    height: 90vh;
    height: 90dvh;
    max-height: 850px;
    padding: 30px 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    /* background-color: #238fc2; */
}

.top-row {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    order: 1;
    flex: 0 0 auto;
    margin-bottom: 8px;
}

.quiz-title {

    color: #2f4f4f;
    font-size: 30px;
    font-weight: 400;
    line-height: 1.3;
    text-align: center;
    letter-spacing: 0.5px;
}

.quiz-subtitle {
    color: #6b8383;
    font-size: 18px;
    font-weight: 400;
    text-align: center;
    letter-spacing: 0.3px;
}

/* ============ SINGLE QUESTION ROW ============ */
.word-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
    gap: 40px;
    order: 2;
    flex: 1 1 auto;
    min-height: 0;
}

.col-title {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(145deg, #f6a95e, #ef8d2f);
    color: #ffffff;
    text-align: center;
    font-size: 26px;
    border-radius: 16px;
    padding: 12px 28px;
    box-shadow: 0 6px 0 #c96f16, 0 8px 20px rgba(239, 141, 47, 0.3);
    letter-spacing: 1px;
    white-space: nowrap;
    z-index: 2;
}

.past-title {
    background: linear-gradient(145deg, #6ec3e8, #4a9fc9);
    box-shadow: 0 6px 0 #2d7aa3, 0 8px 20px rgba(74, 159, 201, 0.3);
}

.col-sub {
    display: block;
    font-size: 0.55em;
    font-weight: 400;
    margin-top: 2px;
    letter-spacing: 0.5px;
}

/* Present tense card */
.present-card {
    position: relative;
    background: #fff8f2;
    border: 2px solid #f0a868;
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 38px 24px 26px;
    color: #2f2f2f;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
}

.present-card .word-text {
    font-size: 24pt;
    font-weight: 700;
    color: #2f2f2f;
}

.present-card .img-wrap {
    margin-left: 20px;
}

/* Past tense card */
.past-card {
    position: relative;
    background: #eef7fc;
    border: 2px solid #6ec3e8;
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 38px 24px 26px;
    color: #2f2f2f;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
    transition: all 0.3s ease;
}

.past-card.done {
    background: #d9f7e3;
    border-color: #29b44c;
    border-width: 3px;
}

.past-card.shake {
    animation: wrongShake 0.5s ease;
}

.card-content {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 26px;
    width: 100%;
}

.past-placeholder {
    background: #e2edf3;
    color: #8a9ba3;
    font-size: 18px;
    font-weight: 500;
    text-align: center;
    padding: 14px 22px;
    border-radius: 14px;
    transition: all 0.3s ease;
}

.past-placeholder.filled {
    background: transparent;
    color: #2f9e44;
    font-weight: 700;
    font-size: 24pt;
    padding: 0;
    text-align: center;
}

.card-icon {
    flex: 0 0 auto;
    width: 150px;
    height: 150px;
    object-fit: contain;
}

.img-wrap {
    position: relative;
    flex: 0 0 auto;
    display: inline-block;
}

.time-icon {
    position: absolute;
    top: -14px;
    right: -18px;
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    font-size: 26px;
    color: #ef8d2f;
    z-index: 2;
    line-height: 1;
}

.past-card .time-icon {
    color: #4a9fc9;
}

/* ============ ANSWER OPTIONS ============ */
.options-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    order: 3;
    flex: 0 0 auto;
}

.answer-btn {
    border: none;
    border-radius: 18px;
    color: #000;
    font-weight: 700;
    font-size: 20px;
    padding: 18px 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.4px;
    height:100px
}

.answer-btn{
    background: linear-gradient(145deg, #FFEFB5, #FFD86E);
    box-shadow: 0 6px 0 #D1AF45,
                0 8px 16px rgba(255, 216, 110, 0.30);
}

.answer-btn:hover:not(.disabled) {
    transform: translateY(-2px);
}

.answer-btn:active:not(.disabled) {
    transform: translateY(3px);
}

.answer-btn.wrong-ans {
    animation: shake 0.4s ease;
}

.answer-btn.correct-ans {
    outline: 4px solid #ffffff;
    outline-offset: -4px;
    transform: scale(1.04);
}

.answer-btn.disabled {
    opacity: 0.5;
    cursor: default;
}

@keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-12px); }
    40% { transform: translateX(12px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}

/* ============ CONTROLS ============ */
.controls {
    display: flex;
    justify-content: center;
    gap: 100px;
    flex-wrap: wrap;
    order: 4;
    flex: 0 0 auto;
}

.controls button {
    width: 130px;
    height: 55px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 35px;
    border: none;
    font-size: 20px;
    font-weight: 600;
    color: #ffffff;
    cursor: pointer;
    transition: all 0.3s ease;
    /* margin-top: -40px; */
    gap: 8px;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;

}

.controls button i {
    font-size: 24px;
    transition: transform 0.3s ease;
}
.prev {
    background: linear-gradient(145deg, #6ec3e8, #4a9fc9);
    box-shadow: 0 6px 0 #2d7aa3, 0 8px 20px rgba(74, 159, 201, 0.3);
}

.prev:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 0 #2d7aa3, 0 12px 30px rgba(74, 159, 201, 0.4);
}

.prev:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #2d7aa3, 0 8px 20px rgba(74, 159, 201, 0.3);
}

.next {
    background: linear-gradient(145deg, #f5d96a, #e8c445);
    box-shadow: 0 6px 0 #c4a22e, 0 8px 20px rgba(232, 196, 69, 0.3);
}

.next:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 0 #c4a22e, 0 12px 30px rgba(232, 196, 69, 0.4);
}

.next:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #c4a22e, 0 8px 20px rgba(232, 196, 69, 0.3);
}

.controls button:disabled {
    opacity: .4;
    cursor: not-allowed;
    transform: none !important;
}

/* ============ RESPONSIVE ============ */
@media (max-width: 1024px) {
    .quiz { padding: 20px 28px; gap: 12px;  }
    .quiz-title { font-size: 30px; }
    .quiz-subtitle { font-size: 15px; }
    .col-title { font-size: 22px; padding: 10px 22px; top: -20px; }
    .word-grid { gap: 30px; }
    .present-card, .past-card { padding: 32px 20px 20px; border-radius: 24px; }
    .present-card .word-text { font-size: 30px; }
    .card-content { gap: 18px; }
    .past-placeholder { font-size: 16px; padding: 12px 16px; }
    .past-placeholder.filled { font-size: 30px; }
    .card-icon { width: 110px; height: 110px; }
    .time-icon { top: -12px; right: -16px; font-size: 22px; }
    .options-row { gap: 14px; }
    .answer-btn { font-size: 18px; padding: 15px 6px; border-radius: 15px; }
    .controls { gap: 60px; }
}

@media (max-width: 768px) {
    .quiz { padding: 14px 18px; gap: 8px; height: 95vh; height: 95dvh;  }
    .quiz-title { font-size: 24px; }
    .quiz-subtitle { font-size: 13px; }
    .word-grid { gap: 16px; }
    .col-title { font-size: 16px; padding: 8px 16px; border-radius: 12px; top: -16px; }
    .present-card, .past-card { padding: 26px 12px 14px; border-radius: 18px; }
    .present-card .word-text { font-size: 26px; }
    .card-content { gap: 10px; }
    .past-placeholder { font-size: 15px; padding: 8px 12px; border-radius: 10px; }
    .past-placeholder.filled { font-size: 26px; }
    .card-icon { width: 78px; height: 78px; }
    .time-icon { top: -10px; right: -14px; font-size: 18px; }
    .options-row { gap: 10px; }
    .answer-btn { font-size: 16px; padding: 12px 4px; border-radius: 12px; }
    .controls { gap: 40px; }
    .controls button { width: 96px; height: 42px; font-size: 15px; }
    .controls button i { font-size: 16px; }
}

@media (max-width: 600px) {
    /* .quiz{
        background-color: #A97C65;
    } */
    .options-row { grid-template-columns: repeat(3, 1fr); }
    .answer-btn{height: 50px;}
}

@media (max-width: 480px) {
    .quiz { padding: 8px 12px; gap: 5px; height: 100vh; height: 100dvh; }
    .quiz-title { font-size: 12px; }
    .quiz-subtitle { font-size: 9px; }
    .word-grid { gap: 8px; }
    .col-title { font-size: 9px; padding: 5px 10px; border-radius: 8px; top: -10px; }
    .present-card, .past-card { padding: 16px 8px 8px; border-radius: 12px; border-width: 1.5px; }
    .present-card .word-text { font-size: 13px; }
    .card-content { gap: 6px; }
    .past-placeholder { font-size: 9px; padding: 5px 6px; border-radius: 7px; }
    .past-placeholder.filled { font-size: 13px; }
    .card-icon { width: 46px; height: 46px; }
    .time-icon { top: -8px; right: -10px; font-size: 14px; }
    .options-row { gap: 6px; }
    .answer-btn { font-size: 11px; padding: 7px 3px; border-radius: 9px; height:30px; }
    .controls { gap: 18px; }
    .controls button { width: 78px; height: 36px; font-size: 12px; border-radius: 20px; }
    .controls button i { font-size: 13px; }
}

@media (min-width: 1400px) {
    .quiz { max-width: 1300px; padding: 40px 55px; gap: 22px; max-height: 950px; }
    .quiz-title { font-size: 40px !important; font-weight: 400;  margin-bottom: 40px;}
    .quiz-subtitle { font-size: 22px; margin-top:-20px; }
    .word-grid { gap: 50px; }
    .col-title { font-size: 34px; padding: 10px 34px; top: -50px; }
    .present-card, .past-card { padding: 48px 34px 30px; border-radius: 32px; border-width: 3px; }
    .present-card .word-text { font-size: 46px; }
    .card-content{flex-wrap:nowrap;align-items:center;justify-content:center;gap:20px}
   .past-placeholder{
    white-space: nowrap;
    flex-shrink: 0;
    height: 90px;

    display: flex;
    align-items: center;      /* Vertical center */
    justify-content: center;  /* Horizontal center */
    text-align: center;
}
    .past-placeholder.filled{
    font-size: 46px;

    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}
    .card-icon{width:300px;height:250px;flex-shrink:0}
    .time-icon { top: -18px; right: -22px; font-size: 32px; }
    .options-row { gap: 24px; }
    .answer-btn { font-size: 34px; padding: 24px 10px; border-radius: 20px; height: 90px; }
}

@media (max-height: 560px) {
    .quiz { padding: 10px 24px; gap: 8px; }
    .quiz-title { font-size: 20px; }
    .quiz-subtitle { font-size: 12px; }
    .present-card, .past-card { padding: 20px 14px 10px; }
    .card-icon { width: 56px; height: 56px; }
    .time-icon { top: -9px; right: -12px; font-size: 16px; }
    .col-title { top: -14px; font-size: 14px; padding: 6px 14px; }
    .controls { margin-top: 4px; }
}
</style>
</head>

<body>

<div class="quiz">

    <div class="top-row">
        <h1 class="quiz-title">Choose the Correct Verb Form</h1>
        <!-- <p class="quiz-subtitle">Fill in the blank with the correct verb form.</p> -->
    </div>

    <div class="word-grid" id="wordGrid">
        <div class="present-card" id="presentCard">
          <div class="col-title present-title">
    Present Tense
    <!-- <span class="col-sub">(Now)</span> -->
</div>
            <div class="card-content">
                <span class="word-text" id="presentWord"></span>
                <div class="img-wrap">
                    <img class="card-icon" id="presentImg" alt="">
                    <i class="fa-solid fa-clock time-icon"></i>
                </div>
            </div>
        </div>
        <div class="past-card" id="pastCard">
           <div class="col-title past-title">
    Past Tense
    <!-- <span class="col-sub">(Yesterday)</span> -->
</div>
            <div class="card-content">
                <span class="past-placeholder" id="pastPlaceholder">select option below</span>
                <div class="img-wrap">
                    <img class="card-icon" id="pastImg" alt="">
                    <i class="fa-solid fa-clock-rotate-left time-icon"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="options-row" id="optionsRow"></div>

    <div class="controls">
        <button class="prev" id="prevBtn"><i class="fa-solid fa-circle-arrow-left"></i> Prev</button>
        <button class="next" id="nextBtn"></i> Next<i class="fa-solid fa-circle-arrow-right"></i></button>
    </div>

</div>

<!-- CORRECT / WRONG POPUP -->
<div id="answerPopup" class="kid-popup">
    <div class="kid-card">
        <div class="kid-icon" id="popupIcon"></div>
        <h3 id="popupTitle"></h3>
        <p id="popupMsg"></p>
    </div>
</div>

<!-- FINAL POPUP -->
<div id="finalPopup">
    <div class="final-kid-box">
        <h2>🎉 Congratulations!</h2>
        <p id="finalScore"></p>
        <div id="stars"></div>
        <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
</div>



<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
// ============================================================
// DATA — one present/past pair + image + 4 answer options per question
// ============================================================
const quizData = [
{
    root: "Use",
    full: "Used",
    presentImg: "../assets/images/paint.png",
    pastImg: "../assets/images/used.png",
    options: ["Using", "Used", "Uses", "Use"],
    correct: 1
},
{
    root: "Want",
    full: "Wanted",
    presentImg: "../assets/images/want.png",
    pastImg: "../assets/images/wanted.png",
    options: ["Wanting", "Wanted", "Wants", "Want"],
    correct: 1
},
{
    root: "Finish",
    full: "Finished",
    presentImg: "../assets/images/end.png",
    pastImg: "../assets/images/finished.png",
    options: ["Finishing", "Finished", "Finishes", "Finish"],
    correct: 1
},
{
    root: "Shock",
    full: "Shocked",
    presentImg: "../assets/images/shocked1.png",
    pastImg: "../assets/images/shocked.png",
    options: ["Shocking", "Shocked", "Shocks", "Shock"],
    correct: 1
},
{
    root: "Work",
    full: "Worked",
    presentImg: "../assets/images/mcq1-2.png",
    pastImg: "../assets/images/mcq2-4.png",
    options: ["Working", "Worked", "Works", "Work"],
    correct: 1
}
];

let current = 0;
let score = 0;
let answered = Array(quizData.length).fill(false);

const presentWord = document.getElementById("presentWord");
const presentImg = document.getElementById("presentImg");
const pastImg = document.getElementById("pastImg");
const pastCard = document.getElementById("pastCard");
const pastPlaceholder = document.getElementById("pastPlaceholder");
const optionsRow = document.getElementById("optionsRow");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-UK";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}



function smallConfetti() {
    confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 }, scalar: 0.8 });
}

function bigConfetti() {
    confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
    setTimeout(() => {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }, 300);
}

function showPopup(isCorrect) {
    const popup = document.getElementById("answerPopup");
    const icon = document.getElementById("popupIcon");
    const title = document.getElementById("popupTitle");
    const msg = document.getElementById("popupMsg");

    popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
    popup.style.display = "flex";

    if (isCorrect) {
        icon.textContent = "🎉";
        title.textContent = "Great Job!";
        msg.textContent = "You got it right!";
    } else {
        icon.textContent = "🥲";
        title.textContent = "Oops!";
        msg.textContent = "Try again, you can do it!";
    }

    setTimeout(() => {
        popup.style.display = "none";
    }, 1400);
}

function showFinal() {
    const popup = document.getElementById("finalPopup");
    document.getElementById("finalScore").textContent = `Your Score: ${score} / ${quizData.length}`;
    document.getElementById("stars").textContent = "⭐".repeat(score);
    popup.style.display = "flex";
    bigConfetti();
}

// ============================================================
// LOAD QUESTION
// ============================================================
function load() {
    const q = quizData[current];

    presentWord.textContent = q.root;
   presentImg.src = q.presentImg;
    presentImg.alt = q.root;
    pastImg.src = q.pastImg;
    pastImg.alt = q.full;

    pastCard.classList.remove("done", "shake");

    if (answered[current]) {
        pastPlaceholder.textContent = q.full;
        pastPlaceholder.classList.add("filled");
        pastCard.classList.add("done");

        optionsRow.innerHTML = q.options.map((opt, oi) =>
            `<button class="answer-btn c${oi + 1} ${oi === q.correct ? "correct-ans" : "disabled"}" disabled>${opt}</button>`
        ).join("");
    } else {
        pastPlaceholder.textContent = "select option below";
        pastPlaceholder.classList.remove("filled");

        optionsRow.innerHTML = q.options.map((opt, oi) =>
            `<button class="answer-btn c${oi + 1}" data-oi="${oi}">${opt}</button>`
        ).join("");

        optionsRow.querySelectorAll(".answer-btn").forEach(btn => {
            btn.onclick = () => handleAnswer(+btn.dataset.oi, btn);
        });
    }

    prevBtn.disabled = current === 0;
    nextBtn.disabled = answered[current] ? (current === quizData.length - 1) : true;
}

function handleAnswer(oi, btn) {
    const q = quizData[current];

    if (oi === q.correct) {
        btn.classList.add("correct-ans");
        pastPlaceholder.textContent = q.full;
        pastPlaceholder.classList.add("filled");
        pastCard.classList.add("done");

        optionsRow.querySelectorAll(".answer-btn").forEach(b => {
            b.disabled = true;
            if (b !== btn) b.classList.add("disabled");
        });

        answered[current] = true;
        score++;

        smallConfetti();
        speak("correct");
        showPopup(true);

        nextBtn.disabled = current === quizData.length - 1;
        if (current < quizData.length - 1) nextBtn.disabled = false;

        if (answered.every(Boolean)) {
            setTimeout(showFinal, 1600);
        }
    } else {
        btn.classList.add("wrong-ans");
        pastCard.classList.add("shake");

        speak("try again");
        showPopup(false);

        setTimeout(() => {
            btn.classList.remove("wrong-ans");
            pastCard.classList.remove("shake");
        }, 500);
    }
}

prevBtn.onclick = () => {
    if (current > 0) {
        current--;
        load();
    }
};

nextBtn.onclick = () => {
    if (current < quizData.length - 1) {
        current++;
        load();
    }
};

load();
</script>

</body>
</html>
