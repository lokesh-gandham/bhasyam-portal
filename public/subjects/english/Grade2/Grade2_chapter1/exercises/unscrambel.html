<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Plant Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <!-- <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
     <link rel="stylesheet" href="../assets/css/unscrambel.css">
     <link rel="stylesheet" href="../assets/css/popups.css">
    <style>
     
    </style>
</head>

<body>

  <div class="quiz-container">

    <div class="question-section">

        <div id="questionTitle" class="question-title"></div>

        <div class="question-content">

            <!-- LEFT SIDE -->
            <div class="left-side">

                <div class="question-image-row">
                    <div id="questionNumber" class="question-number"></div>
                    <img id="questionImage" alt="Question Image">
                </div>

                <div id="answerSlots" class="answer-slots"></div>

            </div>

            <!-- RIGHT SIDE -->
            <div class="right-side">

                <div class="letter-option-wrapper">
                    <div id="letterContainer" class="letter-container"></div>
                </div>

            </div>

        </div>

    </div>

    <div class="quiz-navigation">
        <button id="previousButton">
            <i class="fa-solid fa-circle-arrow-left"></i> Prev
        </button>

        <button id="nextButton">
            Next
            <i class="fa-solid fa-circle-arrow-right"></i>
        </button>
    </div>

</div>


    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
     <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
     <script src="../assets/js/unscrambel.js"></script>

</body>

</html>
