<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Family Tree Matching Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"> -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
 <link rel="stylesheet" href="../assets/CSS/m3.css">
 <link rel="stylesheet" href="../assets/CSS/popups.css">

<style>
  /* Prevent horizontal scroll */
  html, body {
    overflow: hidden;
  }

  /* Fixed positioning escapes any parent's overflow:hidden/width limits,
     so the title reliably centers across the FULL page above both panels */
  .main-title {
    position: fixed;
    top: 10px;
    left: 0;
    right: 0;
    width: 100%;
    margin: 0;
    text-align: center;
    box-sizing: border-box;
    padding: 6px 16px;
    font-size: clamp(14px, 2.4vw, 24px);
    line-height: 1.3;
    white-space: normal;
    overflow: visible;
    word-wrap: break-word;
    z-index: 1000;
    pointer-events: none;
  }
</style>

</head>
<body style="margin:0; padding:0; background:#fefcf5;">
  

<div class="app">

  <!-- ===================== PHOTO FRAME PANEL ===================== -->
  <section class="panel frame-panel">
   <h2 class="main-title"> Observe our family photo and match the family members </h2>
    <div class="frame-wrap">
<div class="frame" id="frame">
        <img id="framePhoto" class="frame-photo" src="../assets/images/familyPhoto.png">

        <button class="portrait-marker" data-name="grandfather" data-line="Hello! I'm your father's father." style="top:12%; left:15%;">
           <div class="ring"></div>
           <span class="sparkle">✨</span>
           <span class="marker-label">Grandfather</span>
        </button>
        <button class="portrait-marker" data-name="grandmother" data-line="Hi! I'm your mother's mother." style="top:12%; left:35%;">
           <div class="ring"></div>
           <span class="sparkle">✨</span>
           <span class="marker-label">Grandmother</span>
        </button>

        <button class="portrait-marker" data-name="father" data-line="Hey there! I'm your father." style="top:42%; left:18%;">
           <div class="ring"></div>
           <span class="sparkle">✨</span>
           <span class="marker-label">Father</span>
        </button>
        <button class="portrait-marker" data-name="mother" data-line="Hi! I'm your mother." style="top:42%; left:38%;">
           <div class="ring"></div>
           <span class="sparkle">✨</span>
           <span class="marker-label">Mother</span>
        </button>
        <button class="portrait-marker" data-name="uncle" data-line="Hello! I'm your mother's brother." style="top:42%; left:58%;">
           <div class="ring"></div>
           <span class="sparkle">✨</span>
           <span class="marker-label">Uncle</span>
        </button>
        <button class="portrait-marker" data-name="aunt" data-line="Hi! I'm your father's sister." style="top:42%; left:78%;">
           <div class="ring"></div>
           <span class="sparkle">✨</span>
           <span class="marker-label">Aunt</span>
        </button>

        <button class="portrait-marker cousin-sister"
         data-name="cousin"
         data-line="Let's play together!"
         style="top:75%; left:62%;">
     <div class="ring"></div>
     <span class="sparkle">✨</span>
     <span class="marker-label">Cousin</span>
 </button>

 <button class="portrait-marker cousin-brother"
         data-name="cousinBrother"
         data-line="Hey! I'm your cousin too!"
         style="top:75%; left:35%;">
     <div class="ring"></div>
     <span class="sparkle">✨</span>
     <span class="marker-label">Cousin</span>
 </button>
</div>
      <div class="speech-bubble" id="speechBubble"></div>
    </div>
  </section>

  <!-- ===================== MATCH PANEL ===================== -->
  <section class="panel match-panel">
    <!-- <h2 class="panel-title">🎯 Observe the picture and match</h2> -->
    <div class="game-container">
      <svg id="line-canvas"></svg>
      <div class="column left">
        <div class="items" id="leftColumn"></div>
      </div>
      <div class="column right">
        <div class="items" id="rightColumn"></div>
      </div>
    </div>
  </section>

</div>

<!-- FINAL POPUP -->
<div id="finalPopup">
  <div class="final-kid-box">
    <h2>🎉 Congratulations!</h2>
    <p id="finalScore"></p>
    <div id="stars"></div>
    <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script src="../assets/JavaScript/m3.js"></script>

</body>
</html>
