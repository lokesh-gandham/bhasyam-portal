<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../assets/CSS/popups.css">
    <style>
 @font-face {
    font-family: 'CCSYBold';
    src: url('../assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}

 @font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'CCSyntroman';
}

html,
body {
    height: 100%;
    overflow: hidden;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background-color: #fefcf5;
}

.main {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= GAME CONTAINER ================= */
.game-container {
    /* background-color: #d9594c; */
    position: relative;
    width: 95%;
    max-width: 950px;
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 110px;
    height: 82vh;
    max-height: 750px;
}

.page-title {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
    font-weight: 400;
    color: #1e293b;
    white-space: nowrap;
    z-index: 10;
}

#line-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

/* ================= COLUMN BOXES ================= */
.column {
    flex: 1;
    max-width: 380px;
    border: 3px dashed #c084fc;
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    z-index: 2;
    position: relative;
    height: 100%;
}

.col-header {
    display: none;
}

.items {
    display: flex;
    flex-direction: column;
    padding: 12px 18px;
    gap: 10px;
    flex: 1;
    justify-content: space-evenly;
}

.item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-size: 24px !important;
    font-weight: 400;
    color: #1f3340;
    border-bottom: 2px solid #E8A0BF;
    cursor: pointer;
    transition: .2s ease;
    padding: 8px 10px;
    flex: 1;
    min-height: 52px;
    text-transform: capitalize;
    font-family: 'CCSyntroman';
}

.items .item:last-child {
    border-bottom: none;
}

/* Number styling for left items */
.item-number {
    font-weight: 700;
    color: #d9594c;
    min-width: 34px;
    font-size: 20px;
    flex-shrink: 0;
}

/* Letter styling for right items */
.item-letter {
    font-weight: 600;
    color: #5d6b5a;
    min-width: 34px;
    font-size: 18px;
    flex-shrink: 0;
}

/* Left image styling */
.left-img {
    width: 80px;
    height: 80px;
    object-fit: contain;
    flex-shrink: 0;
}

/* Right image styling */
.right-img {
    width: 80px;
    height: 80px;
    object-fit: contain;
    flex-shrink: 0;
}

.item-text {
    flex: 1;
    text-align: center;
}

.item .dot {
    position: absolute;
    top: 50%;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #8f8f8f;
    transform: translateY(-50%);
    z-index: 3;
    flex-shrink: 0;
    transition: all 0.3s ease;
}

.left .item .dot {
    right: -7px;
}

.right .item .dot {
    left: -7px;
}

/* left item selected/active */
.left .item.active {
    background: #fff2ea;
    border-radius: 12px;
}

.left .item.active .dot {
    background: #d9594c;
    transform: translateY(-50%) scale(1.3);
}

/* matched state - images stay visible */
.item.matched {
    pointer-events: none;
    opacity: 0.8;
}

.item.matched .dot {
    background: #22c55e;
    transform: translateY(-50%) scale(1.3);
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
}

/* Images stay visible when matched - no hiding */
.item.matched .left-img,
.item.matched .right-img {
    display: block !important;
    opacity: 0.9;
}

/* right side error shake */
.right .item.error {
    animation: shakeError 0.4s ease;
    border-color: #ff4444;
}

@keyframes shakeError {
    0% {
        transform: translateX(0);
    }
    25% {
        transform: translateX(-8px);
    }
    50% {
        transform: translateX(8px);
    }
    75% {
        transform: translateX(-6px);
    }
    100% {
        transform: translateX(0);
    }
}

/* Answer box - removed, not needed anymore */
.answer-box {
    display: none;
}

<body>

    <div class="main">

        <div class="game-container">

            <h1 class="page-title">Match the Opposites</h1>

            <svg id="line-canvas"></svg>

            <!-- Words box -->
            <div class="column left">
                <div class="col-header">Words</div>
                <div class="items" id="leftColumn"></div>
            </div>

            <!-- Meanings box -->
            <div class="column right">
                <div class="col-header">Opposites</div>
                <div class="items" id="rightColumn"></div>
            </div>

        </div>
    </div>

    <!-- FINAL POPUP -->
    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        const leftData = [{
            id: "1",
            text: "yummy",
            img: "../assets/images/yummy.png",
            match: "b",
        }, {
            id: "2",
            text: "stop",
            img: "../assets/images/stop.png",
            match: "a",
        }, {
            id: "3",
            text: "friend",
            img: "../assets/images/friend.png",
            match: "d",
        }, {
            id: "4",
            text: "cry",
            img: "../assets/images/cry.png",
            match: "c",
        }, ];

        const rightData = [{
            match: "a",
            text: "start",
            img: "../assets/images/start.png",
        }, {
            match: "b",
            text: "tasteless",
            img: "../assets/images/tasteless.png",
        }, {
            match: "c",
            text: "laugh",
            img: "../assets/images/laugh.png",
        }, {
            match: "d",
            text: "enemy",
            img: "../assets/images/enemy.png",
        }, ];

        let selectedLeft = null;
        let matchesFound = 0;
        let score = 0;
        let connections = [];

        const leftCol = document.getElementById("leftColumn");
        const rightCol = document.getElementById("rightColumn");
        const svg = document.getElementById("line-canvas");

        function init() {
            if (!leftCol || !rightCol) {
                console.error("Required elements not found");
                return;
            }

            leftCol.innerHTML = "";
            rightCol.innerHTML = "";
            svg.innerHTML = "";
            connections = [];
            matchesFound = 0;
            score = 0;
            selectedLeft = null;

            // Render Left Column
            leftData.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "item";
                div.dataset.match = item.match;

                div.innerHTML = `
                    <span class="item-number">${index + 1}.</span>
                    ${item.img ? `<img src="${item.img}" class="left-img" onerror="this.style.display='none'">` : ""}
                    <span class="item-text">${item.text}</span>
                    <span class="dot"></span>
                `;

                div.onclick = () => {
                    if (div.classList.contains("matched")) return;

                    document
                        .querySelectorAll(".left .item")
                        .forEach((i) => i.classList.remove("active"));

                    div.classList.add("active");
                    selectedLeft = div;
                };

                leftCol.appendChild(div);
            });

            // Render Right Column - KEEP ITS OWN IMAGES
            rightData.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "item";
                div.dataset.id = item.match;

                const letter = String.fromCharCode(96 + index + 1);

                div.innerHTML = `
                    <span class="dot"></span>
                    <span class="item-letter">${letter})</span>
                    ${item.img ? `<img src="${item.img}" class="right-img" onerror="this.style.display='none'">` : ""}
                    <span class="item-text">${item.text}</span>
                    <div class="answer-box"></div>
                `;

                div.onclick = () => {
                    if (!selectedLeft || div.classList.contains("matched")) return;

                    if (selectedLeft.dataset.match === div.dataset.id) {
                        handleMatch(selectedLeft, div);
                    } else {
                        speak("Wrong");
                        div.classList.add("error");
                        setTimeout(() => div.classList.remove("error"), 400);
                        const wrongSound = document.getElementById("wrongSound");
                        if (wrongSound) wrongSound.play();
                    }
                };

                rightCol.appendChild(div);
            });
        }

        function speak(t) {
            try {
                speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(t);
                msg.lang = "en-UK";
                msg.volume = 0.25;
                msg.rate = 1;
                msg.pitch = 1;
                speechSynthesis.speak(msg);
            } catch (e) {
                console.log("Speech not supported");
            }
        }

        function smallConfetti() {
            if (typeof confetti !== 'undefined') {
                confetti({
                    particleCount: 35,
                    spread: 70,
                    origin: { y: 0.7 },
                    scalar: 0.8
                });
            }
        }

        function handleMatch(leftEl, rightEl) {
            score++;

            leftEl.classList.add("matched");
            rightEl.classList.add("matched");
            leftEl.classList.remove("active");

            // Images stay visible - no hiding or replacing

            drawCurve(leftEl, rightEl);

            connections.push({ from: leftEl, to: rightEl });

            selectedLeft = null;
            matchesFound++;
            speak("Correct");

            const correctSound = document.getElementById("correctSound");
            if (correctSound) correctSound.play();

            smallConfetti();

            if (matchesFound === leftData.length) {
                setTimeout(showFinal, 700);
            }
        }

        function drawCurve(el1, el2) {
            const dot1 = el1.querySelector(".dot") || el1;
            const dot2 = el2.querySelector(".dot") || el2;

            const rect1 = dot1.getBoundingClientRect();
            const rect2 = dot2.getBoundingClientRect();
            const containerRect = svg.getBoundingClientRect();

            const x1 = rect1.left + rect1.width / 2 - containerRect.left;
            const y1 = rect1.top + rect1.height / 2 - containerRect.top;

            const x2 = rect2.left + rect2.width / 2 - containerRect.left;
            const y2 = rect2.top + rect2.height / 2 - containerRect.top;

            const cx = (x1 + x2) / 2;

            const pathData = `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`;

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");

            path.setAttribute("d", pathData);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "#22c55e");
            path.setAttribute("stroke-width", "3");
            path.setAttribute("stroke-linecap", "round");

            svg.appendChild(path);
        }

        function showFinal() {
            document.getElementById("finalScore").textContent =
                `Your Score: ${score} / ${leftData.length}`;

            document.getElementById("stars").textContent = "⭐".repeat(score);

            document.getElementById("finalPopup").style.display = "flex";

          // 🎉 CONFETTI EFFECT
if (window.innerWidth >= 769) {
  const duration = 2000;
  const end = Date.now() + duration;

  (function frame() {
    confetti({
      particleCount: 6,
      angle: 60,
      spread: 55,
      origin: { x: 0 },
      scalar: 0.5, // Smaller confetti
    });

    confetti({
      particleCount: 6,
      angle: 120,
      spread: 55,
      origin: { x: 1 },
      scalar: 0.5, // Smaller confetti
    });

    if (Date.now() < end) {
      requestAnimationFrame(frame);
    }
  })();
}
            // Play celebration sound
            const correctSound = document.getElementById("correctSound");
            if (correctSound) {
                setTimeout(() => correctSound.play(), 100);
                setTimeout(() => correctSound.play(), 400);
            }
        }

        function redrawLines() {
            svg.innerHTML = "";
            connections.forEach((c) => {
                if (c.from && c.to && c.from.parentNode && c.to.parentNode) {
                    drawCurve(c.from, c.to);
                }
            });
        }

        let resizeTimeout;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(redrawLines, 200);
        });

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    </script>

</body>
