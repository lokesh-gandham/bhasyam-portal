<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habitat Quiz</title>

    <!-- Font -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet"> -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../assets/CSS/mcq.css">
    <link rel="stylesheet" href="../assets/CSS/lesson2-nav.css">
    <link rel="stylesheet" href="../assets/CSS/popups.css">
</head>

<body>
    <div class="app">
        <div class="template">

            <!-- <div class="quiz-type">🧠 MCQ's</div>
            <button class="home" onclick="location.href='../index.html'">🏠 Home</button> -->

            <!-- PROGRESS -->
            <!-- <div class="parts-progress" id="partsProgress"></div> -->

            <!-- QUESTION -->
            <div class="title" id="titleText"></div>

            <!-- IMAGE -->
            <div class="image-holder">
                <img id="animalImg" />
            </div>

            <!-- OPTIONS -->
            <div class="options" id="optionsBox"></div>

            <!-- NAV -->
            <div class="nav">
                <button class="prev" id="prevBtn" disabled>← Prev</button>
                <button class="next" id="nextBtn" disabled>Next →</button>
            </div>

        </div>
    </div>

    <!-- CORRECT / WRONG POPUP -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <!-- FINAL POPUP -->
    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button onclick="location.reload()" class="playAgain-btn"> Play Again </button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
    <script src="../assets/JavaScript/mcq.js"></script>
</body>

</html>
