<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Science Quiz – Plants | Fill in the Blanks</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* CCSyntroman Font */
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }

    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-size: 5px 5px;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* ===== MAIN ===== */
    .main {
      position: relative;
      min-width: 1000px;
    }
    .quiz-title{
      color: #2f4f4f;
      font-weight:500;
      font-size: 20pt;
  
    }
    .quiz-subtitle{
      font-size: 14pt;
    }

    .quiz-type {
      position: absolute;
      font-size: 25px;
      font-weight: 500;
       color: #2f4f4f !important;
      top: 0%;
      left: -12%;
    }

    .home {
      position: absolute;
      top: 0%;
      right: -12%;
      background: #86efac;
      border: none;
      border-radius: 18px;
      padding: 10px 18px;
      font-size: 18px;
      cursor: pointer;
      color: #064e3b;
    }

    /* ===== PARTS BAR PROGRESS ===== */
    .parts-progress {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 40px auto 20px;
      width: 90%;
    }

    .part {
      height: 18px;
      border-radius: 8px;
      background: #c9cace;
      position: relative;
      overflow: hidden;
    }

    .part.done {
      background: linear-gradient(90deg, #4ade80, #22c55e);
    }

    /* ===== CONTENT ===== */
    .content {
      border-radius: 25px;
      padding: 30px;
    }

    .question-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }

    /* QUESTION */
    .question {
      font-size: 30px;
      font-weight: 200;
      color: #2f4f4f;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      line-height: 1.8;
      min-height: 70px;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Underlined word with blank space */
    .underlined-blank {
      display: inline-block;
      min-width: 140px;
      padding: 0 12px 4px;
      border-bottom: 4px solid #018d5e;
      font-weight: 600;
      color: #2f4f4f;
      text-align: center;
      margin: 0 6px;
      font-size: 28px;
      letter-spacing: 2px;
    }

    .underlined-blank.filled {
      border-bottom-color: #22c55e;
      color: #22c55e;
    }

    .underlined-blank.hint {
      border-bottom-style: dashed;
      border-bottom-color: #ffb347;
      color: #94a3b8;
      font-weight: 400;
      font-size: 20px;
    }

    /* IMAGE */
    .image-wrap {
      display: flex;
      justify-content: center;
      margin-block: 15px;
    }

    .image-circle {
      width: 220px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* INPUT */
    .input-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .input-box {
      width: 500px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 25px;
      background: #fff;
      border: 3px solid #ffb347;
      min-height: 74px;
    }

    .input-box.correct {
      border-color: #2ecc71;
      background: #eafff3;
    }

    .input-box input {
      flex: 1;
      border: none;
      font-size: 20pt;
      padding: 10px 16px;
      outline: none;
    }

    .input-box button {
      border: none;
      border-radius: 20px;
      padding: 16px 30px;
      background: #ff5fa2;
      color: #fff;
      font-size: 19px;
      cursor: pointer;
      min-height: 54px;
    }

    .input-box button:disabled {
      opacity: 0.4;
    }

    /* NAV */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
    }

    .nav button {
      padding: 10px 25px;
      border: none;
      border-radius: 15px;
      font-size: 20px ;
      font-weight: 200;
      cursor: pointer;
      color: #fff;
      margin-top: -20px;
    }

    .prev {
      background: #60a5fa;
    }

    .next {
      background:#F0A8D0;
    }

    .nav button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ========== REDESIGNED POPUPS (MATCHED WITH MCQ) ========== */

    /* Correct/Wrong Popup */
    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.0);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      animation: popupFadeIn 0.3s ease;
    }

    @keyframes popupFadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .popup-content {
      background: linear-gradient(145deg, #ffffff, #f8f9fa);
      padding: 35px 45px;
      border-radius: 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .popup-content::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
    }

    .popup.correct .popup-content::before {
      background: linear-gradient(90deg, #22c55e, #4ade80, #22c55e);
    }

    .popup.wrong .popup-content::before {
      background: linear-gradient(90deg, #dc2626, #f87171, #dc2626);
    }

    @keyframes popIn {
      0% {
        transform: scale(0.5) rotate(-5deg);
        opacity: 0;
      }
      60% {
        transform: scale(1.05) rotate(1deg);
      }
      80% {
        transform: scale(0.95);
      }
      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    .popup-icon {
      font-size: 4.5em;
      margin-bottom: 8px;
      display: inline-block;
    }

    .popup.correct .popup-icon {
      animation: correctBounce 0.8s ease;
    }

    .popup.wrong .popup-icon {
      animation: wrongBounce 0.8s ease;
    }

    @keyframes correctBounce {
      0% {
        transform: scale(0) rotate(-30deg);
      }
      40% {
        transform: scale(1.4) rotate(10deg);
      }
      60% {
        transform: scale(0.9) rotate(-5deg);
      }
      80% {
        transform: scale(1.1) rotate(3deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes wrongBounce {
      0% {
        transform: scale(0) rotate(30deg);
      }
      30% {
        transform: scale(1.3) rotate(-15deg);
      }
      60% {
        transform: scale(0.9) rotate(10deg);
      }
      80% {
        transform: scale(1.1) rotate(-5deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    .popup-content h3 {
      font-size: 2em;
      font-weight: 700;
      margin: 8px 0 6px;
    }

    .popup.correct h3 {
      color: #16a34a;
    }

    .popup.wrong h3 {
      color: #dc2626;
    }

    .popup-content p {
      font-size: 1.2em;
      font-weight: 500;
      margin: 0;
    }

    .popup.correct p {
      color: #15803d;
    }

    .popup.wrong p {
      color: #b91c1c;
    }

    /* ========== REDESIGNED FINAL POPUP (MATCHED WITH MCQ) ========== */

    #finalPopup {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.0);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      animation: popupFadeIn 0.5s ease;
    }

    .finalpopup-box {
      background: linear-gradient(145deg, #ffffff, #f8f9fa);
      padding: 40px 50px;
      border-radius: 35px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      animation: finalPopIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .finalpopup-box::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(251, 191, 36, 0.1), transparent 70%);
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(180deg);
      }
    }

    @keyframes finalPopIn {
      0% {
        transform: scale(0.3) rotate(-10deg);
        opacity: 0;
      }
      50% {
        transform: scale(1.08) rotate(2deg);
      }
      70% {
        transform: scale(0.95) rotate(-1deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .final-heading {
      display: block;
      font-size: 2.2em;
      margin: 10px 0 15px;
      font-weight: 700;
      color: #16a34a;
      position: relative;
      z-index: 1;
    }

    #finalScore {
      font-size: 1.4em;
      font-weight: 600;
      color: #374151;
      margin: 10px 0;
      position: relative;
      z-index: 1;
    }

    #stars {
      font-size: 3em;
      margin: 10px 0 15px;
      letter-spacing: 8px;
      position: relative;
      z-index: 1;
    }

    .playAgain-btn {
      background: linear-gradient(145deg, #22c55e, #16a34a);
      color: #fff;
      border: none;
      padding: 14px 35px;
      border-radius: 50px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      margin: 5px 0 10px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
      position: relative;
      z-index: 1;
    }

    .playAgain-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.4);
    }

    .playAgain-btn:active {
      transform: translateY(0px);
    }

    /* =========================================================
       ⬇️ WORD BANK (single box: label + option chips together)
       ========================================================= */

 .word-bank-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 14px;
}

    .word-bank-box {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;

    background: #fff;
    border: 3px solid #60a5fa;
    border-radius: 24px;
    padding: 14px 22px;

    width: fit-content;
    max-width: 90%;
    margin: 0 auto;
}

    .word-bank-label {
      font-size: 15px;
      font-weight: 700;
      color: #1e3a8a;
      white-space: nowrap;
      padding-right: 14px;
      border-right: 2px solid #dbeafe;
      margin-right: 2px;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 0;
    }

    .word-chip {
      background: #fff;
      border: 3px solid #60a5fa;
      border-radius: 20px;
      padding: 10px 22px;
      font-size: 18px;
      font-weight: 600;
      color: #1e3a8a;
      cursor: grab;
      user-select: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .word-chip:hover:not(.disabled) {
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
    }

    .word-chip:active:not(.disabled) {
      cursor: grabbing;
    }

    .word-chip.dragging {
      opacity: 0.4;
    }

    .word-chip.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: #cbd5e1;
      color: #94a3b8;
      background: #f1f5f9;
      pointer-events: none;
    }

    /* ---- DROPZONE (replaces the typed input) ---- */
    .dropzone {
      flex: 1;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #1a7f4b;
      border-radius: 20px;
      padding: 14px 16px;
      border: 2px dashed #ffb347;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .dropzone.empty {
      color: #aaa;
      font-weight: 400;
      font-size: 16px;
    }

    .dropzone.empty::before {
      content: "Drop your answer here";
    }

    .dropzone.dragover {
      border-color: #ff5fa2;
      background: #fff0f6;
    }

    .input-box.correct .dropzone {
      border-style: solid;
      border-color: #2ecc71;
    }

    /* Shake animation for wrong answers */
    @keyframes shakeError {
      0% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-6px); }
      100% { transform: translateX(0); }
    }

    .dropzone.error {
      animation: shakeError 0.4s ease;
      border-color: #ff4444;
    }

    /* ---- PAGE TITLE ---- */
    .quiz-title {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      /* color: #017a4f; */
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .quiz-subtitle {
      text-align: center;
      font-size: 16px;
      font-weight: 400;
      color: #4b5563;
      margin-bottom: 10px;
    }

        padding: 10px 25px;
      }
    }
      @media screen and (min-width: 1440px) {
           .finalpopup-box {
                max-width: 500px;
                padding: 50px 55px;
            }

            .final-heading {
                font-size: 2.5em;
            }

  }



    /* =========================================
       📺 EXTRA LARGE / 4K (1921px+)
    ========================================= */
    @media screen and (min-width: 1921px) {
      .main {
        min-width: 1300px;
        transform: scale(1.15);
        transform-origin: center;
      }

      .question {
        font-size: 40px;
      }

      .underlined-blank {
        min-width: 180px;
        font-size: 36px;
        padding: 0 16px 5px;
      }

      .image-circle {
        width: 260px;
        height: 260px;
      }

      .input-box {
        min-height: 96px;
      }

      .input-box input {
        font-size: 28px;
      }

      .input-box button {
        padding: 20px 40px;
        font-size: 24px;
        min-height: 70px;
      }

      .dropzone {
        min-height: 66px;
        font-size: 30px;
        padding: 18px 22px;
      }

      .word-bank-box {
        padding: 20px 32px;
        gap: 20px;
        border-radius: 32px;
        max-width: 1200px;
      }

      .word-bank-label {
        font-size: 22px;
        padding-right: 20px;
      }

      .nav button {
        font-size: 24px;

      }
    }
  </style>

</head>

<body>

  <div class="main">
    <div class="content">
      <h1 class="quiz-title">🌱 Match with the meanings of the underlined words.</h1>
      <p class="quiz-subtitle">Drag or tap the correct word into the box, then hit Submit</p>

      <div class="word-bank-wrap">
        <div class="word-bank-box">
          <span class="word-bank-label">Word Bank</span>
          <div class="word-bank" id="wordBank"></div>
        </div>
      </div>

      <div class="question-wrapper">
        <div class="question" id="qText"></div>
      </div>

      <div class="image-wrap">
        <div class="image-circle">
          <img id="qImg" src="" alt="Question image"  draggable="false">
        </div>
      </div>

      <div class="input-wrap">
        <div class="input-box" id="inputBox">
          <div class="dropzone empty" id="dropZone"></div>
          <button id="checkBtn" disabled>Submit</button>
        </div>
      </div>

      <div class="nav">
        <button class="prev" id="prevBtn" disabled>← Prev</button>
        <button class="next" id="nextBtn" disabled>Next →</button>
      </div>
    </div>
  </div>

  <!-- CORRECT / WRONG POPUP -->
  <div id="answerPopup" class="popup">
    <div class="popup-content">
      <div class="popup-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <!-- FINAL POPUP -->
  <div id="finalPopup">
    <div class="finalpopup-box">
      <h2 class="final-heading">🎉 Congratulations!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div>
      <br>
      <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
    </div>
  </div>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

  <script>
    // Question data with underlined word and correct answer
    const questions = [{
      q: "Q1. Vivek was a very",
      underline: "Clever",
      qEnd: "child.",
      answer: "Brilliant",
      img: "../assets/images/schoolBoy.png"
    }, {
      q: "Q2. He was spending more time on a",
      underline: "Small computer",
      qEnd: ".",
      answer: "Tab",
      img: "../assets/images/meanings2.png"
    }, {
      q: "Q3. Vivek followed his uncle's",
      underline: "Suggestion",
      qEnd: ".",
      answer: "Advice",
      img: "../assets/images/uncleNboy.png"
    }, {
      q: "Q4. They ate a",
      underline: "Tasty",
      qEnd: "Cake.",
      answer: "Yummy",
      img: "../assets/images/cake.png"
    }];

    let index = 0,
      score = 0;
    const answers = Array(questions.length).fill(null);
    const solvedWords = new Set();

    const qText = document.getElementById("qText");
    const qImg = document.getElementById("qImg");
    const dropZone = document.getElementById("dropZone");
    const wordBank = document.getElementById("wordBank");
    const check = document.getElementById("checkBtn");
    const prev = document.getElementById("prevBtn");
    const next = document.getElementById("nextBtn");
    const inputBox = document.getElementById("inputBox");

    function speak(t) {
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-UK";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildWordBank() {
      wordBank.innerHTML = '';
      const words = shuffle(questions.map((q) => q.answer));
      words.forEach((word) => {
        const chip = document.createElement("div");
        chip.className = "word-chip";
        chip.textContent = word;
        chip.draggable = true;
        chip.dataset.word = word;

        chip.addEventListener("dragstart", (e) => {
          if (chip.classList.contains("disabled")) {
            e.preventDefault();
            return;
          }
          e.dataTransfer.setData("text/plain", word);
          chip.classList.add("dragging");
        });

        chip.addEventListener("dragend", () => {
          chip.classList.remove("dragging");
        });

        chip.addEventListener("click", () => {
          if (chip.classList.contains("disabled")) return;
          if (answers[index] !== null) return;
          placeWordInDropzone(word);
        });

        wordBank.appendChild(chip);
      });
      refreshWordBankState();
    }

    function refreshWordBankState() {
      document.querySelectorAll(".word-chip").forEach((chip) => {
        chip.classList.toggle("disabled", solvedWords.has(chip.dataset.word));
      });
    }

    function placeWordInDropzone(word) {
      if (answers[index] !== null) return;
      dropZone.textContent = word;
      dropZone.dataset.current = word;
      dropZone.classList.remove("empty");
      check.disabled = false;
    }

    function clearDropzone() {
      dropZone.textContent = "";
      dropZone.dataset.current = "";
      dropZone.classList.add("empty");
      check.disabled = true;
    }

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (answers[index] === null) dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      if (answers[index] !== null) return;
      const word = e.dataTransfer.getData("text/plain");
      if (word) placeWordInDropzone(word);
    });

    function load() {
      const q = questions[index];

      // Build question with underlined blank space
      let questionHTML = '';
      if (q.q) {
        questionHTML += q.q + ' ';
      }
      
      // Create the underlined blank space
      const isFilled = answers[index] !== null;
      const blankText = isFilled ? answers[index] : '______';
      const blankClass = isFilled ? 'underlined-blank filled' : 'underlined-blank';
      
questionHTML += `
<span class="underlined-blank ${isFilled ? 'filled' : ''}" id="blankSlot">
    ${q.underline}
</span>`;
      
      if (q.qEnd) {
        questionHTML += ' ' + q.qEnd;
      }

      qText.innerHTML = questionHTML;

      // Set image
      qImg.src = q.img;
      qImg.alt = q.underline || "Question image";

      // Handle dropzone state
      if (answers[index] !== null) {
        dropZone.textContent = answers[index];
        dropZone.dataset.current = answers[index];
        dropZone.classList.remove("empty");
        check.disabled = true;
        inputBox.classList.add("correct");
      } else {
        clearDropzone();
        inputBox.classList.remove("correct");
      }

      // Button states
      prev.disabled = index === 0;
      next.disabled = answers[index] === null;

      refreshWordBankState();
    }

    // ========== POPUP FUNCTIONS (MATCHED WITH MCQ) ==========
    
    function showPopup(isCorrect) {
      const popup = document.getElementById("answerPopup");
      const icon = document.getElementById("popupIcon");
      const title = document.getElementById("popupTitle");
      const msg = document.getElementById("popupMsg");
      popup.className = "popup " + (isCorrect ? "correct" : "wrong");
      popup.style.display = "flex";
      if (isCorrect) {
        icon.textContent = "🎉";
        title.textContent = "Correct!";
        msg.textContent = "Well done!";
      } else {
        icon.textContent = "😔";
        title.textContent = "Wrong!";
        msg.textContent = "Try again!";
      }
      setTimeout(() => {
        popup.style.display = "none";
      }, 1200);
    }

    function showFinal() {
      const finalPopup = document.getElementById("finalPopup");
      finalPopup.style.display = "flex";

      document.getElementById("finalScore").textContent = `Score: ${score}/${questions.length}`;
      document.getElementById("stars").textContent = "⭐".repeat(score);

      // 🎉 CONFETTI EFFECT
// 🎉 CONFETTI EFFECT
if (window.innerWidth >= 769) {
  const duration = 2000;
  const end = Date.now() + duration;

  (function frame() {
    confetti({
      particleCount: 6,
      angle: 60,
      spread: 55,
      origin: { x: 0 },
      scalar: 0.5, // Smaller confetti
    });

    confetti({
      particleCount: 6,
      angle: 120,
      spread: 55,
      origin: { x: 1 },
      scalar: 0.5, // Smaller confetti
    });

    if (Date.now() < end) {
      requestAnimationFrame(frame);
    }
  })();
}

      // Play celebration sound
      const correctSound = document.getElementById("correctSound");
      if (correctSound) {
        setTimeout(() => correctSound.play(), 100);
        setTimeout(() => correctSound.play(), 400);
      }
    }

    // ========== CHECK ANSWER ==========
    
    check.onclick = () => {
      const word = (dropZone.dataset.current || "").trim().toLowerCase();
      if (!word) return;

      const correctAnswer = questions[index].answer.toLowerCase();

      if (word === correctAnswer) {
answers[index] = questions[index].answer.toUpperCase();
        solvedWords.add(questions[index].answer);
        score++;
        speak("Correct");
        showPopup(true);
        inputBox.classList.add("correct");
        check.disabled = true;
        refreshWordBankState();

        // Play correct sound
        const correctSound = document.getElementById("correctSound");
        if (correctSound) correctSound.play();

        // Small confetti
        if (typeof confetti !== 'undefined') {
          confetti({
            particleCount: 35,
            spread: 70,
            origin: { y: 0.7 },
            scalar: 0.8
          });
        }

        if (index === questions.length - 1) {
          setTimeout(showFinal, 1600);
        }
        next.disabled = false;
        load();
      } else {
        speak("Wrong");
        showPopup(false);
        const wrongSound = document.getElementById("wrongSound");
        if (wrongSound) wrongSound.play();
        
        // Shake the dropzone
        dropZone.classList.add("error");
        setTimeout(() => {
          dropZone.classList.remove("error");
        }, 400);
        
        clearDropzone();
        load();
      }
    };

    prev.onclick = () => {
      if (index > 0) {
        index--;
        load();
      }
    };

    next.onclick = () => {
      if (index < questions.length - 1) {
        index++;
        load();
      }
    };

    // Initialize
    buildWordBank();
    load();
  </script>

</body>

</html>
