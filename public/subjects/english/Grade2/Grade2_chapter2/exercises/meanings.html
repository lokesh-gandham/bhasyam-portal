<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Science Quiz – Plants | Fill in the Blanks</title>

  <link rel="stylesheet" href="../assets/CSS/popups.css">
  <link rel="stylesheet" href="../assets/CSS/lesson2-nav.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* CCSyntroman Font */
@font-face {
    font-family: 'CCSYBold';
    src: url('../assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}

@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }

    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      background-size: 5px 5px;
      overflow: hidden;
      background-color: #fefcf5;
    }

    /* ===== MAIN ===== */
    .main {
      position: relative;
      width: 100%;
      max-width: 1100px;
      min-width: 0;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    .quiz-title{
      color: #2f4f4f;
      font-weight: 400;
      font-size: 30px;
      text-align: center;
      margin: 0 0 6px;
      flex-shrink: 0;
    }
    .quiz-subtitle{
      display: none;
    }

    .quiz-type {
      position: absolute;
      font-size: 25px;
      font-weight: 500;
       color: #2f4f4f !important;
      top: 0%;
      left: -12%;
    }

    .home {
      position: absolute;
      top: 0%;
      right: -12%;
      background: #86efac;
      border: none;
      border-radius: 18px;
      padding: 10px 18px;
      font-size: 18px;
      cursor: pointer;
      color: #064e3b;
    }

    /* ===== PARTS BAR PROGRESS ===== */
    .parts-progress {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 40px auto 20px;
      width: 90%;
    }

    .part {
      height: 18px;
      border-radius: 8px;
      background: #c9cace;
      position: relative;
      overflow: hidden;
    }

    .part.done {
      background: linear-gradient(90deg, #4ade80, #22c55e);
    }

    /* ===== CONTENT ===== */
    .content {
      border-radius: 25px;
      padding: 12px 24px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      box-sizing: border-box;
    }

    .question-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin: 4px 0;
      flex-shrink: 0;
    }

    /* QUESTION */
    .question {
      font-size: 26px;
      font-weight: 400;
      color: #2f4f4f;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      line-height: 1.5;
      min-height: 48px;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Underlined word with blank space */
    .underlined-blank {
      display: inline-block;
      min-width: 120px;
      padding: 0 10px 3px;
      border-bottom: 3px solid #018d5e;
      font-weight: 500;
      color: #2f4f4f;
      text-align: center;
      margin: 0 4px;
      font-size: 26px;
      letter-spacing: 1px;
    }

    .underlined-blank.filled {
      border-bottom-color: #22c55e;
      color: #22c55e;
    }

    .underlined-blank.hint {
      border-bottom-style: dashed;
      border-bottom-color: #ffb347;
      color: #94a3b8;
      font-weight: 400;
      font-size: 18px;
    }

    /* IMAGE + CLUE side by side */
    .stage-row {
      display: grid;
      grid-template-columns: minmax(200px, 0.9fr) minmax(260px, 1.1fr);
      align-items: center;
      gap: clamp(16px, 2.5vw, 28px);
      width: 100%;
      max-width: 980px;
      margin: 6px auto 4px;
      flex: 0 0 auto;
      min-height: 0;
    }

    .image-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
      width: 100%;
      height: 100%;
    }

    .image-circle {
      width: min(400px, 48vh, 100%);
      height: min(400px, 48vh, 100%);
      aspect-ratio: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Drop area – no outer card */
    .input-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
    }

    .input-box {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: none;
      min-height: 0;
      box-shadow: none;
      box-sizing: border-box;
    }

    .clue-label {
      font-size: 16px;
      font-weight: 400;
      color: #8a6a2f;
      text-align: center;
      line-height: 1.35;
      margin: 0;
      display: none;
    }

    .clue-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .input-box.correct {
      border: none;
      background: transparent;
    }

    .input-box.correct .dropzone {
      border-style: solid;
      border-color: #2ecc71;
      background: #eafff3;
    }

    .input-box input {
      flex: 1;
      border: none;
      font-size: 20pt;
      padding: 10px 16px;
      outline: none;
    }

    .input-box button {
      border: none;
      border-radius: 16px;
      padding: 12px 22px;
      background: #ff5fa2;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      min-height: 46px;
      flex-shrink: 0;
    }

    .input-box button:disabled {
      opacity: 0.4;
    }

    /* NAV – shared size from lesson2-nav.css; keep pinned to bottom */
    .content .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding: 10px 4px 8px;
      width: 100%;
      flex-shrink: 0;
    }

    .prev {
      background: #60a5fa;
    }

    .next {
      background:#F0A8D0;
    }

    /* =========================================================
       ⬇️ WORD BANK (single box: label + option chips together)
       ========================================================= */

 .word-bank-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
    flex-shrink: 0;
    width: 100%;
}

    .word-bank-box {
    display: inline-flex;
    align-items: center;
    flex-wrap: nowrap;
    justify-content: center;
    gap: 10px;

    background: #fff;
    border: 2px solid #cfe0f5;
    border-radius: 20px;
    padding: 10px 16px;

    width: max-content;
    max-width: 100%;
    margin: 0 auto;
    overflow-x: auto;
}

    .word-bank-label {
      display: none;
    }

    .word-bank {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 0;
      white-space: nowrap;
    }

    .word-chip {
      background: #f5f9ff;
      border: 2px solid #93c5fd;
      border-radius: 16px;
      padding: 8px 16px;
      font-size: 20px;
      font-weight: 500;
      color: #1e3a8a;
      cursor: grab;
      user-select: none;
      flex-shrink: 0;
      white-space: nowrap;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .word-chip:hover:not(.disabled) {
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
    }

    .word-chip:active:not(.disabled) {
      cursor: grabbing;
    }

    .word-chip.dragging {
      opacity: 0.4;
    }

    .word-chip.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: #cbd5e1;
      color: #94a3b8;
      background: #f1f5f9;
      pointer-events: none;
    }

    /* ---- DROPZONE (replaces the typed input) ---- */
    .dropzone {
      flex: 1;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 500;
      color: #1a7f4b;
      border-radius: 16px;
      padding: 14px 18px;
      border: 2px dashed #f0c978;
      background: #fffdf6;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .dropzone.empty {
      color: #aaa;
      font-weight: 400;
      font-size: 20px;
    }

    .dropzone.empty::before {
      content: "Drop here";
    }

    .dropzone.dragover {
      border-color: #ff5fa2;
      background: #fff0f6;
    }

    .input-box.correct .dropzone {
      border-style: solid;
      border-color: #2ecc71;
    }

    /* Shake animation for wrong answers */
    @keyframes shakeError {
      0% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-6px); }
      100% { transform: translateX(0); }
    }

    .dropzone.error {
      animation: shakeError 0.4s ease;
      border-color: #ff4444;
    }

    /* ---- PAGE TITLE ---- */
    .quiz-title {
      text-align: center;
      font-size: 30px;
      font-weight: 400;
      /* color: #017a4f; */
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .quiz-subtitle {
      text-align: center;
      font-size: 16px;
      font-weight: 400;
      color: #4b5563;
      margin-bottom: 10px;
    }

    /* ================================
       📱 FILL IN THE BLANKS RESPONSIVE
       ================================ */

    /* -------- TABLETS (≤ 1115px) -------- */
    @media (max-width: 1115px) {
      body {
        padding: 12px;
        align-items: flex-start;
        overflow: hidden;
      }

      .main {
        min-width: unset;
        width: 100%;
      }

      .quiz-type {
        position: static;
        text-align: center;
        margin-bottom: 10px;
      }

      .home {
        position: static;
        margin: 0 auto 10px;
        display: block;
      }

      .parts-progress {
        width: 100%;
        margin-top: 20px;
      }

      .content {
        padding: 22px;
      }

      .question {
        font-size: 30px;
        min-height: 60px;
      }

      .underlined-blank {
        min-width: 110px;
        font-size: 22pt;
        padding: 0 8px 3px;
      }

      .image-circle {
        width: min(360px, 44vh, 100%);
        height: min(360px, 44vh, 100%);
      }

      .stage-row {
        max-width: 940px;
        gap: 20px;
        grid-template-columns: minmax(280px, 1.15fr) minmax(240px, 0.85fr);
      }

      .input-box {
        width: 100%;
        max-width: 380px;
        min-height: 0;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .input-box input {
        font-size: 20pt;
      }

      .input-box button {
        padding: 14px 26px;
        font-size: 17px;
        min-height: 48px;
      }

      .dropzone {
        min-height: 48px;
      }

      .word-bank-box {
        padding: 10px 16px;
        gap: 10px;
        border-radius: 20px;
        flex-wrap: nowrap;
        max-width: 100%;
      }

      .word-bank-label {
        font-size: 14px;
        padding-right: 10px;
      }

      /* .nav {
        padding-inline: 20px;
        margin-top: -20px;
      } */

      .content .nav{
        margin-top: 12px;
      }
    }

    /* -------- MOBILE (≤ 768px) -------- */
    @media (max-width: 768px) {
      body {
        padding: 10px;
        align-items: flex-start;
        overflow: hidden;
      }

      .content {
        padding: 18px;
        border-radius: 20px;
      }

      .question {
        font-size: 30px;
        min-height: 50px;
        gap: 4px;
      }

      .underlined-blank {
        min-width: 90px;
        font-size: 20px;
        padding: 0 6px 3px;
      }

      .stage-row {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        gap: 14px;
        max-width: 520px;
      }

      .image-circle {
        width: min(260px, 34vh, 100%);
        height: min(260px, 34vh, 100%);
      }

      .input-box {
        flex-direction: column;
        gap: 10px;
        padding: 0;
        min-height: 0;
        max-width: 100%;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .clue-actions {
        flex-direction: column;
      }

      .input-box input {
        font-size: 18pt;
        padding: 10px;
      }

      .input-box button {
        width: 100%;
        font-size: 16px;
        padding: 14px 10px;
        min-height: 48px;
      }

      .dropzone {
        width: 100%;
        min-height: 44px;
        padding: 12px 14px;
      }

      .word-bank-box {
        padding: 10px 14px;
        gap: 8px;
        border-radius: 18px;
      }

      .word-bank-label {
        font-size: 13px;
        padding-right: 8px;
      }

      .content .nav {
        margin-top: 12px;
      }
    }

    /* -------- SMALL MOBILES (≤ 480px) -------- */
    @media (max-width: 480px) {
      .content {
        padding-block: 0;
      }

      .question {
        font-size: 20px;
      }

      .underlined-blank {
        min-width: 70px;
        font-size: 18px;
        padding: 0 4px 2px;
      }

      .image-circle {
        width: min(180px, 28vh, 100%);
        height: min(180px, 28vh, 100%);
      }

      .input-box input {
        font-size: 16px;
      }

      .input-box button {
        min-height: 42px;
        padding: 12px 10px;
      }

      .dropzone {
        min-height: 38px;
        padding: 10px 12px;
      }

      .word-bank-box {
        padding: 8px 12px;
        gap: 6px;
        border-radius: 16px;
      }

      .word-bank-label {
        font-size: 12px;
        padding-right: 6px;
      }

      .nav {
        flex-direction: row;
        gap: 10px;
      }

      /* .nav button {
        width: 95px;
        height: 42px;
      } */
    }

    /* -------- EXTRA SMALL (≤ 360px) -------- */
    @media (max-width: 360px) {
      .content {
        padding-block: 0;
      }

      .question {
        font-size: 18px;
      }

      .underlined-blank {
        min-width: 60px;
        font-size: 16px;
        padding: 0 4px 2px;
        border-bottom-width: 3px;
      }

      .input-box {
        padding: 8px;
      }

      .input-box button {
        font-size: 15px;
        min-height: 38px;
        padding: 10px 8px;
      }

      .dropzone {
        min-height: 34px;
        padding: 8px 10px;
      }

      .word-bank-box {
        padding: 6px 10px;
        gap: 5px;
        border-radius: 14px;
      }

      .word-bank-label {
        font-size: 11px;
        padding-right: 5px;
      }
    }

    /* =========================================
       💻 LAPTOPS (1024px – 1439px)
    ========================================= */
    @media screen and (min-width: 1024px) and (max-width: 1439px) {
      .stage-row {
        gap: 8px;
        grid-template-columns: minmax(200px, 0.9fr) minmax(240px, 1.1fr);
      }
    }

    /* =========================================
       🖥️ LARGE MONITORS (1441px – 1920px)
    ========================================= */
    @media screen and (min-width: 1350px) and (max-width: 1920px) {
      .main {
        min-width: 0;
        max-width: 1100px;
        width: 100%;
        transform: none;
      }
      .quiz-title{
        font-size: 40px;
      }
      .quiz-subtitle{
        font-size: 20px;
      }

      .question {
        font-size: 40px;
      }

      .underlined-blank {
        min-width: 160px;
        font-size: 28px;
        padding: 0 10px 4px;
      }

      .image-circle {
        width: min(400px, 48vh, 100%);
        height: min(400px, 48vh, 100%);
      }

      .input-box {
        min-height: 0;
        padding: 0;
        max-width: 400px;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .input-box input {
        font-size: 20pt;
      }

      .input-box button {
        padding: 16px 34px;
        font-size: 24px;
        min-height: 64px;
        border-radius: 20px;
      }

      .dropzone {
        min-height: 64px;
        font-size: 26px;
        padding: 16px 20px;
      }

      .input-box {
        max-width: 480px;
      }

      .word-bank-box {
        padding: 12px 20px;
        gap: 12px;
        border-radius: 22px;
        max-width: 980px;
      }

      .word-bank-label {
        font-size: 16px;
        padding-right: 12px;
      }

      .word-bank {
        gap: 12px;
      }

      .word-chip {
        font-size: 28px;
        padding: 12px 24px;
        border-radius: 18px;
      }

      .clue-label {
        font-size: 20px;
      }

        margin-top: 12px;
      }
    }


    /* =========================================
       📺 EXTRA LARGE / 4K (1921px+)
    ========================================= */
    @media screen and (min-width: 1921px) {
      .main {
        min-width: 0;
        max-width: 1200px;
        width: 100%;
        transform: none;
      }

      .question {
        font-size: 44px;
      }

      .underlined-blank {
        min-width: 180px;
        font-size: 32px;
        padding: 0 12px 4px;
      }

      .image-circle {
        width: min(420px, 50vh, 100%);
        height: min(420px, 50vh, 100%);
      }

      .input-box {
        min-height: 0;
        max-width: 420px;
        padding: 0;
        background: transparent;
        border: none;
        box-shadow: none;
      }

      .input-box input {
        font-size: 22px;
      }

      .input-box button {
        padding: 18px 38px;
        font-size: 26px;
        min-height: 72px;
        border-radius: 20px;
      }

      .dropzone {
        min-height: 72px;
        font-size: 28px;
        padding: 18px 22px;
      }

      .input-box {
        max-width: 520px;
      }

      .word-bank-box {
        padding: 14px 24px;
        gap: 14px;
        border-radius: 24px;

      }

        padding-right: 14px;

  </style>

<body>

  <div class="main">
    <div class="content">
      <p class="quiz-title">Match the Underlined Words with Their Meanings

</p>

      <div class="word-bank-wrap">
        <div class="word-bank-box">
          <div class="word-bank" id="wordBank"></div>
        </div>
      </div>

      <div class="question-wrapper">
        <div class="question" id="qText"></div>
      </div>

      <div class="stage-row">
        <div class="image-wrap">
          <div class="image-circle">
            <img id="qImg" src="" alt="Question image"  draggable="false">
          </div>
        </div>

        <div class="input-wrap">
          <div class="input-box" id="inputBox">
            <div class="clue-label">Clue box — drop the meaning of the underlined word</div>
            <div class="clue-actions">
              <div class="dropzone empty" id="dropZone"></div>
              <button id="checkBtn" disabled>Submit</button>
            </div>
          </div>
        </div>
      </div>

      <div class="nav">
        <button class="prev" id="prevBtn" disabled>← Prev</button>
        <button class="next" id="nextBtn" disabled>Next →</button>
      </div>
    </div>
  </div>

  <!-- CORRECT / WRONG POPUP -->
  <div id="answerPopup" class="kid-popup">
    <div class="kid-card">
      <div class="kid-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <!-- FINAL POPUP -->
  <div id="finalPopup">
    <div class="final-kid-box">
      <h2>🎉 Congratulations!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div>
      <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
    </div>
  </div>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

  <script>
    // Question data with underlined word and correct answer
    const questions = [{
      q: "Q1. Vivek was a very",
      underline: "Clever",
      qEnd: "child.",
      answer: "Brilliant",
      img: "../assets/images/schoolBoy.png"
    }, {
      q: "Q2. He was spending more time on a",
      underline: "Small computer",
      qEnd: ".",
      answer: "Tab",
      img: "../assets/images/meanings2.png"
    }, {
      q: "Q3. Vivek followed his uncle's",
      underline: "Suggestion",
      qEnd: ".",
      answer: "Advice",
      img: "../assets/images/uncleNboy.png"
    }, {
      q: "Q4. They ate a",
      underline: "Tasty",
      qEnd: "Cake.",
      answer: "Yummy",
      img: "../assets/images/cake.png"
    }];

    let index = 0,
      score = 0;
    const answers = Array(questions.length).fill(null);
    const solvedWords = new Set();

    const qText = document.getElementById("qText");
    const qImg = document.getElementById("qImg");
    const dropZone = document.getElementById("dropZone");
    const wordBank = document.getElementById("wordBank");
    const check = document.getElementById("checkBtn");
    const prev = document.getElementById("prevBtn");
    const next = document.getElementById("nextBtn");
    const inputBox = document.getElementById("inputBox");

    function speak(t) {
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-UK";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildWordBank() {
      wordBank.innerHTML = '';
      const words = shuffle(questions.map((q) => q.answer));
      words.forEach((word) => {
        const chip = document.createElement("div");
        chip.className = "word-chip";
        chip.textContent = word;
        chip.draggable = true;
        chip.dataset.word = word;

        chip.addEventListener("dragstart", (e) => {
          if (chip.classList.contains("disabled")) {
            e.preventDefault();
            return;
          }
          e.dataTransfer.setData("text/plain", word);
          chip.classList.add("dragging");
        });

        chip.addEventListener("dragend", () => {
          chip.classList.remove("dragging");
        });

        chip.addEventListener("click", () => {
          if (chip.classList.contains("disabled")) return;
          if (answers[index] !== null) return;
          placeWordInDropzone(word);
        });

        wordBank.appendChild(chip);
      });
      refreshWordBankState();
    }

    function refreshWordBankState() {
      document.querySelectorAll(".word-chip").forEach((chip) => {
        chip.classList.toggle("disabled", solvedWords.has(chip.dataset.word));
      });
    }

    function placeWordInDropzone(word) {
      if (answers[index] !== null) return;
      dropZone.textContent = word;
      dropZone.dataset.current = word;
      dropZone.classList.remove("empty");
      check.disabled = false;
    }

    function clearDropzone() {
      dropZone.textContent = "";
      dropZone.dataset.current = "";
      dropZone.classList.add("empty");
      check.disabled = true;
    }

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (answers[index] === null) dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      if (answers[index] !== null) return;
      const word = e.dataTransfer.getData("text/plain");
      if (word) placeWordInDropzone(word);
    });

    function load() {
      const q = questions[index];

      // Build question with underlined blank space
      let questionHTML = '';
      if (q.q) {
        questionHTML += q.q + ' ';
      }
      
      // Create the underlined blank space
      const isFilled = answers[index] !== null;
      const blankText = isFilled ? answers[index] : '______';
      const blankClass = isFilled ? 'underlined-blank filled' : 'underlined-blank';
      
questionHTML += `
<span class="underlined-blank ${isFilled ? 'filled' : ''}" id="blankSlot">
    ${q.underline}
</span>`;
      
      if (q.qEnd) {
        questionHTML += ' ' + q.qEnd;
      }

      qText.innerHTML = questionHTML;

      // Set image
      qImg.src = q.img;
      qImg.alt = q.underline || "Question image";

      // Handle dropzone state
      if (answers[index] !== null) {
        dropZone.textContent = answers[index];
        dropZone.dataset.current = answers[index];
        dropZone.classList.remove("empty");
        check.disabled = true;
        inputBox.classList.add("correct");
      } else {
        clearDropzone();
        inputBox.classList.remove("correct");
      }

      // Button states
      prev.disabled = index === 0;
      next.disabled = answers[index] === null;

      refreshWordBankState();
    }

    // ========== POPUP FUNCTIONS (MATCHED WITH MCQ) ==========
    
    function showPopup(isCorrect) {
      const popup = document.getElementById("answerPopup");
      const icon = document.getElementById("popupIcon");
      const title = document.getElementById("popupTitle");
      const msg = document.getElementById("popupMsg");
      popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
      popup.style.display = "flex";
      if (isCorrect) {
        icon.textContent = "🎉";
        title.textContent = "Great Job!";
        msg.textContent = "You got it right!";
      } else {
        icon.textContent = "🥲";
        title.textContent = "Oops!";
        msg.textContent = "Try again, you can do it!";
      }
      setTimeout(() => {
        popup.style.display = "none";
      }, 1400);
    }

    function showFinal() {
      const finalPopup = document.getElementById("finalPopup");
      finalPopup.style.display = "flex";

      document.getElementById("finalScore").textContent = `Your Score: ${score} / ${questions.length}`;
      document.getElementById("stars").textContent = "⭐".repeat(score);

      // 🎉 CONFETTI EFFECT
// 🎉 CONFETTI EFFECT
if (window.innerWidth >= 769) {
  const duration = 2000;
  const end = Date.now() + duration;

  (function frame() {
    confetti({
      particleCount: 6,
      angle: 60,
      spread: 55,
      origin: { x: 0 },
      scalar: 0.5, // Smaller confetti
    });

    confetti({
      particleCount: 6,
      angle: 120,
      spread: 55,
      origin: { x: 1 },
      scalar: 0.5, // Smaller confetti
    });

    if (Date.now() < end) {
      requestAnimationFrame(frame);
    }
  })();
}

      // Play celebration sound
      const correctSound = document.getElementById("correctSound");
      if (correctSound) {
        setTimeout(() => correctSound.play(), 100);
        setTimeout(() => correctSound.play(), 400);
      }
    }

    // ========== CHECK ANSWER ==========
    
    check.onclick = () => {
      const word = (dropZone.dataset.current || "").trim().toLowerCase();
      if (!word) return;

      const correctAnswer = questions[index].answer.toLowerCase();

      if (word === correctAnswer) {
answers[index] = questions[index].answer.charAt(0).toUpperCase() + questions[index].answer.slice(1);
        solvedWords.add(questions[index].answer);
        score++;
        speak("Correct");
        showPopup(true);
        inputBox.classList.add("correct");
        check.disabled = true;
        refreshWordBankState();

        // Play correct sound
        const correctSound = document.getElementById("correctSound");
        if (correctSound) correctSound.play();

        // Small confetti
        if (typeof confetti !== 'undefined') {
          confetti({
            particleCount: 35,
            spread: 70,
            origin: { y: 0.7 },
            scalar: 0.8
          });
        }

        if (index === questions.length - 1) {
          setTimeout(showFinal, 1600);
        }
        next.disabled = false;
        load();
      } else {
        speak("Wrong");
        showPopup(false);
        const wrongSound = document.getElementById("wrongSound");
        if (wrongSound) wrongSound.play();
        
        // Shake the dropzone
        dropZone.classList.add("error");
        setTimeout(() => {
          dropZone.classList.remove("error");
        }, 400);
        
        clearDropzone();
        load();
      }
    };

    prev.onclick = () => {
      if (index > 0) {
        index--;
        load();
      }
    };

    next.onclick = () => {
      if (index < questions.length - 1) {
        index++;
        load();
      }
    };

    // Initialize
    buildWordBank();
    load();
  </script>

</body>
