<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Verb Forms Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --ink:#4B4560;
    --bg-a:#F1ECFB;
    --bg-b:#E9F5FC;
    --bg-c:#FFF4E9;
    --card-bg:#FFFFFF;

    --purple:#C6B7EE;
    --purple-dark:#A997DE;
    --blue:#AFDBF4;
    --blue-dark:#87C4E8;
    --mint:#B9EAD0;
    --mint-dark:#8FDBAE;
    --gold:#FFE4A3;
    --gold-dark:#FFD273;
    --coral:#FFC9C9;
    --coral-dark:#FFA3A3;
    --lavender:#DCD3F7;
    --lavender-dark:#C4B4EF;

    --green-ok:#4CC98A;
    --green-bg:#EAFBF1;
    --red-bad:#FF8A8A;
    --grey-btn-ink:#6B7280;
  }
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }
  html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    background:#ffffff;
    display:flex;align-items:center;justify-content:center;
    height:100dvh;width:100vw;
  }

  .app{
    width:100vw;height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:clamp(8px,1.6vh,16px);
    padding:clamp(10px,2.4vh,22px) clamp(12px,3vw,32px);
    overflow:hidden;
  }

  .header{
    flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(5px,1vh,10px);
    text-align:center;
  }
  .header h1{
    font-weight:400;
    color: #2f4f4f;
    font-size:24pt;
    letter-spacing:.3px;
  }

  .flashcard{
    flex:1 1 auto;
    min-height:0;
    width:min(980px,94vw);
    max-height:58vh;
    background: #F8F5FF;
    border-radius:clamp(18px,3vw,30px);
    box-shadow:0 3px 0 rgba(0,0,0,0.03), 0 16px 34px rgba(120,110,160,0.12);
    display:flex;flex-direction:row;
    align-items:center;justify-content:center;
    gap:clamp(16px,4vw,56px);
    padding:clamp(14px,2.8vh,32px) clamp(16px,3.6vw,44px);
    position:relative;
    overflow:hidden;
  }

  .qnum{
    position:absolute;
    top:clamp(12px,2vh,20px);
    left:clamp(16px,2.6vw,30px);
    font-weight:700;
    color:var(--ink);
    font-size:clamp(14px,1.4vw,18px);
    opacity:0.7;
  }

  .visual-section{
    flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(8px,1.6vh,14px);
  }
  .image-holder{
    width:clamp(110px,16vw,185px);
    height:clamp(110px,16vw,185px);
    border-radius:50%;
    background:linear-gradient(155deg,var(--bg-b),var(--bg-a));
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 -6px 12px rgba(0,0,0,0.05), 0 10px 22px rgba(150,150,190,0.14);
    overflow:hidden;
  }
  .image-holder img{
    width:85%;
    height:85%;
    object-fit:contain;
  }
  .speak-btn{
    width:clamp(38px,4.2vw,50px);
    height:clamp(38px,4.2vw,50px);
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg,var(--blue),var(--blue-dark));
    color:#2E5E77;
    font-size:clamp(16px,2vw,22px);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(135,196,232,0.40);
    transition:transform .2s ease;
  }
  .speak-btn:hover{transform:scale(1.08);}
  .speak-btn:active{transform:scale(0.94);}

  .answer-section{
    flex:1 1 auto;
    min-width:0;
    max-width:420px;
    display:flex;flex-direction:column;
    gap:clamp(10px,2vh,18px);
  }
  .field-label{
    font-weight:600;
    color:var(--ink);
    font-size:18px;
    text-align:center;
    opacity:.7;
    letter-spacing:.3px;
    margin-bottom:clamp(3px,0.6vh,6px);
  }
  .tense-pill{
    background:linear-gradient(135deg,var(--purple),var(--purple-dark));
    color:#4A3B7A;
    font-weight:700;
    text-align:center;
    padding:clamp(10px,1.5vh,15px) clamp(16px,2.4vw,24px);
    border-radius:18px;
    font-size:clamp(17px,2.2vw,25px);
    letter-spacing:1px;
    text-transform:uppercase;
    box-shadow:0 3px 0 rgba(0,0,0,0.05), 0 10px 20px rgba(169,151,222,0.30);
  }
  #answerInput{
    width:100%;
    text-align:center;
    font-size:26px;
    font-weight:600;
    color:var(--ink);
    background:#FBFCFE;
    border:3px solid #E9E4F7;
    border-radius:16px;
    padding:clamp(9px,1.4vh,13px);
    outline:none;
    letter-spacing:2px;
    transition:border-color .2s ease, background .2s ease, color .2s ease;
    caret-color:transparent;
  }
  #answerInput::placeholder{color:#C3BEDB;font-weight:500;letter-spacing:normal;}
  #answerInput.correct{
    border-color:var(--green-ok);
    background:var(--green-bg);
    color:#1c7a48;
  }
  #answerInput.wrong-shake{
    animation:shakeError .4s ease;
    border-color:var(--red-bad);
  }
  @keyframes shakeError{
    0%{transform:translateX(0);}25%{transform:translateX(-8px);}
    50%{transform:translateX(8px);}75%{transform:translateX(-6px);}100%{transform:translateX(0);}
  }

  .letters-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:clamp(6px,1.1vw,10px);
  }
  .letter-tile{
    width:clamp(30px,4.6vw,42px);
    height:clamp(30px,4.6vw,42px);
    border-radius:10px;
    border:none;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
    font-size:clamp(14px,1.8vw,18px);
    text-transform:uppercase;
    cursor:pointer;
    color:#5C4A82;
    background:linear-gradient(135deg,var(--lavender),var(--lavender-dark));
    box-shadow:0 4px 0 rgba(0,0,0,0.05), 0 6px 12px rgba(180,160,230,0.30);
    transition:transform .15s ease, opacity .15s ease, box-shadow .15s ease;
  }
  .letter-tile:nth-child(4n+2){background:linear-gradient(135deg,var(--mint),var(--mint-dark));color:#256B47;box-shadow:0 4px 0 rgba(0,0,0,0.05), 0 6px 12px rgba(143,219,174,0.30);}
  .letter-tile:nth-child(4n+3){background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#7A5A00;box-shadow:0 4px 0 rgba(0,0,0,0.05), 0 6px 12px rgba(255,210,115,0.30);}
  .letter-tile:nth-child(4n+4){background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#2E5E77;box-shadow:0 4px 0 rgba(0,0,0,0.05), 0 6px 12px rgba(135,196,232,0.30);}
  .letter-tile:hover:not(:disabled){transform:translateY(-2px);}
  .letter-tile:active:not(:disabled){transform:translateY(1px);}
  .letter-tile:disabled{opacity:.28;cursor:not-allowed;transform:none;}
  .letter-tile.used{visibility:hidden;}

  .letters-controls{
    display:flex;justify-content:center;gap:10px;
    margin-top:clamp(2px,0.6vh,4px);
  }
  .mini-btn{
    border:none;
    border-radius:30px;
    padding:clamp(6px,1vh,9px) clamp(14px,2.2vw,20px);
    font-weight:600;
    font-size:clamp(11.5px,1.2vw,13.5px);
    cursor:pointer;
    background:linear-gradient(135deg,var(--coral),var(--coral-dark));
    color:#8A2F2F;
    box-shadow:0 4px 10px rgba(255,163,163,0.35);
    transition:transform .15s ease;
  }
  .mini-btn:hover:not(:disabled){transform:translateY(-2px);}
  .mini-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}

  .nav{
    flex:0 0 auto;
    display:flex;
    gap:clamp(12px,2.4vw,26px);
    justify-content:center;
    align-items:center;
  }
  .nav button{
    padding:10px 28px;
    border-radius:15px;
    border:none;
    font-weight:500;
    font-family:"CCSyntroman";
    font-size:22px;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,0.05), 0 8px 16px rgba(0,0,0,0.08);
    transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    display:flex;align-items:center;gap:6px;
  }
  .nav button:hover:not(:disabled){transform:translateY(-2px);}
  .nav button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,0.05), 0 4px 8px rgba(0,0,0,0.08);}
  .nav button:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;transform:none;}

  .nav .prev{
    background:#60a5fa;
    color:#fff;
  }
  .nav .next{
    background:#F0A8D0;
    color:#fff;
  }
  .nav .check{
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    color:#7A5A00;
  }


 

  /* ==============================================
     POPUP - EXACTLY MATCHING REFERENCE
     ============================================== */
  .popup {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.0);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    animation: popupFadeIn 0.3s ease;
  }
  @keyframes popupFadeIn { from { opacity: 0; } to { opacity: 1; } }

  .popup-content {
    background: linear-gradient(145deg, #ffffff, #f8f9fa);
    padding: 35px 45px;
    border-radius: 30px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
    position: relative;
    overflow: hidden;
  }
  .popup-content::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
  }
  .popup.correct .popup-content::before {
    background: linear-gradient(90deg, #22c55e, #4ade80, #22c55e);
  }
  .popup.wrong .popup-content::before {
    background: linear-gradient(90deg, #dc2626, #f87171, #dc2626);
  }

  @keyframes popIn {
    0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
    60% { transform: scale(1.05) rotate(1deg); }
    80% { transform: scale(0.95); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .popup-icon { font-size: 4.5em; margin-bottom: 8px; display: inline-block; }
  .popup.correct .popup-icon { animation: correctBounce 0.8s ease; }
  .popup.wrong .popup-icon { animation: wrongBounce 0.8s ease; }

  @keyframes correctBounce {
    0% { transform: scale(0) rotate(-30deg); }
    40% { transform: scale(1.4) rotate(10deg); }
    60% { transform: scale(0.9) rotate(-5deg); }
    80% { transform: scale(1.1) rotate(3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes wrongBounce {
    0% { transform: scale(0) rotate(30deg); }
    30% { transform: scale(1.3) rotate(-15deg); }
    60% { transform: scale(0.9) rotate(10deg); }
    80% { transform: scale(1.1) rotate(-5deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .popup-content h3 { font-size: 2em; font-weight: 700; margin: 8px 0 6px; }
  .popup.correct h3 { color: #16a34a; }
  .popup.wrong h3 { color: #dc2626; }
  .popup-content p { font-size: 1.2em; font-weight: 500; margin: 0; }
  .popup.correct p { color: #15803d; }
  .popup.wrong p { color: #b91c1c; }

  /* ==============================================
     FINAL POPUP - EXACTLY MATCHING REFERENCE
     ============================================== */
  #finalPopup {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 3000;
    animation: popupFadeIn 0.5s ease;
  }

  .finalpopup-box {
    background: linear-gradient(145deg, #ffffff, #f8f9fa);
    padding: 40px 50px;
    border-radius: 35px;
    text-align: center;
    max-width: 450px;
    width: 90%;
    animation: finalPopIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.15);
    position: relative;
    overflow: hidden;
  }
  .finalpopup-box::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(251, 191, 36, 0.1), transparent 70%);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(180deg); }
  }
  @keyframes finalPopIn {
    0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
    50% { transform: scale(1.08) rotate(2deg); }
    70% { transform: scale(0.95) rotate(-1deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .final-heading {
    display: block;
    font-size: 2.2em;
    margin: 10px 0 15px;
    font-weight: 700;
    color: #16a34a;
    position: relative;
    z-index: 1;
  }
  #finalScore {
    font-size: 1.4em;
    font-weight: 600;
    color: #374151;
    margin: 10px 0;
    position: relative;
    z-index: 1;
  }
  #stars {
    font-size: 3em;
    margin: 10px 0 15px;
    letter-spacing: 8px;
    position: relative;
    z-index: 1;
  }
  .playAgain-btn {
    background: linear-gradient(145deg, #22c55e, #16a34a);
    color: #fff;
    border: none;
    padding: 14px 35px;
    border-radius: 50px;
    font-size: 1.1em;
    font-weight: 600;
    cursor: pointer;
    margin: 5px 0 10px;
    transition: 0.3s ease;
    box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
    position: relative;
    z-index: 1;
  }
  .playAgain-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(34, 197, 94, 0.4); }
  .playAgain-btn:active { transform: translateY(0px); }

  /* ==============================================
     RESPONSIVE - ORDERED: LARGE → SMALL
     (button / popup / final-popup sizing matched
     exactly to reference file; breakpoints added
     where reference had them and this file didn't)
     ============================================== */

  /* ----- 1440px+ (large laptops / desktops) ----- */
  @media screen and (min-width: 1440px) {
    html, body {
      overflow: hidden !important;
      height: 100vh !important;
      height: 100dvh !important;
    }
    
    .app {
      gap: 24px;
      padding: 32px 48px;
      height: 100dvh;
      overflow: hidden;
    }

    .header h1 {
      font-size: 30pt;
      letter-spacing: 1px;
    }

    .flashcard {
      max-height: 62vh;
      min-height: 380px;
      width: min(1100px, 92vw);
      padding: 40px 56px;
      gap: 64px;
      border-radius: 40px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.03), 0 24px 48px rgba(120,110,160,0.15);
    }

    .qnum {
      font-size: 22px;
      top: 24px;
      left: 32px;
    }

    .visual-section {
      gap: 18px;
    }
    
    .image-holder {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      box-shadow: inset 0 -8px 16px rgba(0,0,0,0.05), 0 14px 28px rgba(150,150,190,0.18);
    }

    .speak-btn {
      width: 60px;
      height: 60px;
      font-size: 26px;
      box-shadow: 0 8px 20px rgba(135,196,232,0.45);
    }

    .answer-section {
      max-width: 520px;
      gap: 22px;
    }

    .field-label {
      font-size: 22px;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .tense-pill {
      font-size: 32px;
      padding: 16px 32px;
      border-radius: 24px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.05), 0 14px 28px rgba(169,151,222,0.35);
      letter-spacing: 2px;
    }

    #answerInput {
      font-size: 28px;
      padding: 14px 20px;
      border-radius: 20px;
      border-width: 4px;
      letter-spacing: 3px;
    }

    .letters-row {
      gap: 12px;
    }
    
    .letter-tile {
      width: 52px;
      height: 52px;
      font-size: 22px;
      border-radius: 14px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.05), 0 8px 16px rgba(180,160,230,0.35);
    }

    .letters-controls {
      gap: 14px;
      margin-top: 8px;
    }
    
    .mini-btn {
      font-size: 18px;
      padding: 10px 28px;
      border-radius: 40px;
      box-shadow: 0 6px 14px rgba(255,163,163,0.40);
    }

    .nav {
      gap: 40px;
      justify-content: center;
      align-items: center;
      width: 100%;
      flex: 0 0 auto;
      padding: 8px 0;
    }
    
    .nav button {
      font-size: 24px;
      padding: 10px 25px ;
      box-shadow: 0 6px 0 rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.10);
      justify-content: center;
    }

    .nav .prev {
      background: #60a5fa;
      color: #fff;
     
    }
    
    .nav .next {
      background: #F0A8D0;
      color: #fff;
      font-size: 22px;
        padding: 14px 32px;
    }
    
    .nav .check {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #7A5A00;
      font-size: 22px;
        padding: 10px 25px;
    }
     .finalpopup-box {
                max-width: 500px;
                padding: 50px 55px;
            }

            .final-heading {
                font-size: 2.5em;
            }

  }

  /* ----- 1025px – 1439px (standard laptops) ----- */
  @media screen and (max-width: 1439px) and (min-width: 1025px) {
    .header h1 {
      font-size: 18pt;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .nav button {
      font-size: 20px;
      padding: 10px 26px;
    }
  }

  /* ----- 481px – 768px (tablets / large phones) ----- */
  @media screen and (max-width: 768px) and (min-width: 481px) {
    .nav button {
      font-size: 18px;
      padding: 8px 20px;
    }
    .popup-content { padding: 30px 35px; max-width: 380px; }
    .popup-icon { font-size: 3.5em; }
    .popup-content h3 { font-size: 1.6em; }
    .popup-content p { font-size: 1em; }
    .finalpopup-box { padding: 30px 35px; max-width: 400px; }
    .final-heading { font-size: 1.8em; }
    #stars { font-size: 2.5em; letter-spacing: 6px; }
    .playAgain-btn { font-size: 1em; padding: 12px 28px; }
  }

  @media (max-width:700px){
    .flashcard{flex-direction:column;max-height:70vh;gap:clamp(10px,2vh,16px);}
    .answer-section{max-width:100%;width:100%;}
  }
  @media (max-height:600px){
    .app{gap:5px;padding:6px 12px;}
    .flashcard{max-height:76vh;padding:10px 16px;}
    .image-holder{width:clamp(70px,14vw,110px);height:clamp(70px,14vw,110px);}
    .qnum{font-size:10px;top:8px;left:10px;}
  }

  /* No scroll on any device */
  @media screen and (max-width: 480px) {
    .app { overflow: hidden; }
    .flashcard { overflow: hidden; }
  }

  /* ----- 361px – 480px (small phones) ----- */
  @media screen and (max-width: 480px) and (min-width: 361px) {
    .nav button {
      font-size: 16px;
      padding: 8px 16px;
    }
    .popup-content { padding: 25px 30px; max-width: 340px; }
    .popup-icon { font-size: 3.5em; }
    .popup-content h3 { font-size: 1.6em; }
    .popup-content p { font-size: 1em; }
    .finalpopup-box { padding: 25px 30px; max-width: 340px; }
    .final-heading { font-size: 1.5em; }
    #finalScore { font-size: 1.2em; }
    #stars { font-size: 2em; letter-spacing: 5px; }
    .playAgain-btn { font-size: 0.9em; padding: 10px 24px; }
  }

  /* ----- ≤ 360px (very small phones) ----- */
  @media screen and (max-width: 360px) {
    .nav button {
      font-size: 14px;
      padding: 6px 14px;
    }
    .popup-content { padding: 20px 25px; max-width: 300px; }
    .popup-icon { font-size: 3em; }
    .popup-content h3 { font-size: 1.4em; }
    .popup-content p { font-size: 0.9em; }
    .finalpopup-box { padding: 20px 25px; max-width: 300px; }
    .final-heading { font-size: 1.3em; }
    #stars { font-size: 1.8em; letter-spacing: 4px; }
    .playAgain-btn { font-size: 0.8em; padding: 8px 20px; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <h1 id="mainTitle">Q1. Write the Correct Tense</h1>
  </div>

  <div class="flashcard">
    <div class="visual-section">
      <div class="image-holder" id="imageHolder"><img id="questionImg" src="" alt="Question Image"></div>
      <button class="speak-btn" id="speakBtn" aria-label="Play pronunciation">🔊</button>
    </div>

    <div class="answer-section">
      <div>
        <div class="field-label" id="labelGiven">Present Tense</div>
        <div class="tense-pill" id="givenWord">COME</div>
      </div>
      <div>
        <div class="field-label" id="labelAnswer">Write the correctTense</div>
        <input id="answerInput" type="text" autocomplete="off" spellcheck="false" placeholder="tap the letters" readonly />
      </div>
      <div class="letters-row" id="lettersRow"></div>
      <div class="letters-controls">
        <button class="mini-btn" id="backspaceBtn">⌫</button>
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="prev" id="prevBtn" disabled>← Prev</button>
    <!-- <button class="check" id="checkBtn">Check</button> -->
    <button class="next" id="nextBtn" disabled>Next →</button>
  </div>

</div>

<div id="answerPopup" class="popup">
  <div class="popup-content">
    <div class="popup-icon" id="popupIcon"></div>
    <h3 id="popupTitle"></h3>
    <p id="popupMsg"></p>
  </div>
</div>

<div id="finalPopup">
  <div class="finalpopup-box">
    <h2 class="final-heading">🎉 Congratulations!</h2>
    <p id="finalScore"></p>
    <div id="stars"></div>
    <div class="finalpopup-actions">
      <button onclick="restartActivity()" class="playAgain-btn">Play Again</button>
    </div>
  </div>
</div>

<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
/* ============ DATA from image ============ */
const questions = [
  { given:'come',    answer:'came',    image:'../assets/images/walking.png', givenLabel:'Present Tense', answerLabel:'Write the Past Tense', title:'Write the Correct Past Tense' },
  { given:'ate',     answer:'eat',     image:'../assets/images/eat.png', givenLabel:'Past Tense', answerLabel:'Write the Present Tense', title:'Write the Correct Present Tense' },
  { given:'gift',    answer:'gifted',  image:'../assets/images/gifts.png', givenLabel:'Present Tense', answerLabel:'Write the Past Tense', title:'Write the Correct Past Tense' },
  { given:'hear',    answer:'heard',   image:'../assets/images/hear.png', givenLabel:'Present Tense', answerLabel:'Write the Past Tense', title:'Write the Correct Past Tense' },
];

const states = questions.map(() => ({ picked: [], status:'unanswered', letters: [] }));
let current = 0;
let wrongAttempts = 0;

const imageHolder   = document.getElementById('imageHolder');
const questionImg   = document.getElementById('questionImg');
const givenWord     = document.getElementById('givenWord');
const answerInput   = document.getElementById('answerInput');
const lettersRow    = document.getElementById('lettersRow');
const backspaceBtn  = document.getElementById('backspaceBtn');
const prevBtn       = document.getElementById('prevBtn');
// const checkBtn      = document.getElementById('checkBtn');
const nextBtn       = document.getElementById('nextBtn');
const speakBtn      = document.getElementById('speakBtn');
const correctSound  = document.getElementById('correctSound');
const wrongSound    = document.getElementById('wrongSound');
const mainTitle     = document.getElementById('mainTitle');
const labelGiven    = document.getElementById('labelGiven');
const labelAnswer   = document.getElementById('labelAnswer');

/* ============ SPEECH ============ */
function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-UK";
  msg.volume = 0.6;
  msg.rate = 0.95;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}
speakBtn.addEventListener('click', () => speak(questions[current].given));

/* ============ SHUFFLE ============ */
function shuffledLetters(word){
  const arr = word.split('');
  let tries = 0;
  do {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    tries++;
  } while (arr.join('') === word && arr.length > 1 && tries < 10);
  return arr;
}

/* ============ RENDER LETTER TILES ============ */
function renderLetterTiles(idx){
  const st = states[idx];
  lettersRow.innerHTML = '';
  st.letters.forEach((letter, i) => {
    const btn = document.createElement('button');
    btn.className = 'letter-tile';
    btn.textContent = letter;
    btn.dataset.index = i;
    if (st.picked.includes(i)) btn.classList.add('used');
    btn.addEventListener('click', () => pickLetter(i));
    lettersRow.appendChild(btn);
  });
  updateInputFromPicked(idx);
}

function updateInputFromPicked(idx){
  const st = states[idx];
  answerInput.value = st.picked.map(i => st.letters[i]).join('');
}

function pickLetter(i) {
  const idx = current;
  const st = states[idx];
  const q = questions[idx];

  if (st.status === "correct") return;
  if (st.picked.includes(i)) return;

  st.picked.push(i);
  renderLetterTiles(idx);

  // Automatically validate when all letters are selected
  if (st.picked.length === q.answer.length) {
    validateAnswer();
  }
}

backspaceBtn.addEventListener('click', () => {
  const idx = current;
  const st = states[idx];
  if (st.status === 'correct') return;
  st.picked.pop();
  renderLetterTiles(idx);
});

/* ============ RENDER QUESTION ============ */
function renderQuestion(idx){
  const q = questions[idx];
  const st = states[idx];

  questionImg.src = q.image;
  questionImg.alt = q.given;
  givenWord.textContent = q.given.toUpperCase();
  mainTitle.textContent = `Q${idx+1}. ${q.title}`;
  labelGiven.textContent = q.givenLabel;
  labelAnswer.textContent = q.answerLabel;

  if (st.letters.length === 0) st.letters = shuffledLetters(q.answer);

  answerInput.classList.remove('correct','wrong-shake');

  renderLetterTiles(idx);

  if (st.status === 'correct') {
    answerInput.classList.add('correct');
    // checkBtn.disabled = true;
    backspaceBtn.disabled = true;
    nextBtn.disabled = (idx === questions.length - 1);
  } else {
    answerInput.classList.remove('correct');
    // checkBtn.disabled = false;
    backspaceBtn.disabled = false;
    nextBtn.disabled = true;
  }

  prevBtn.disabled = idx === 0;
}

/* ============ CHECK ANSWER ============ */
function validateAnswer() {
  const idx = current;
  const q = questions[idx];
  const st = states[idx];
  const val = answerInput.value.trim().toLowerCase();

  if (!val) return;

  if (val === q.answer.toLowerCase()) {
    st.status = 'correct';

    const capitalized =
      q.answer.charAt(0).toUpperCase() + q.answer.slice(1);

    answerInput.value = capitalized;
    answerInput.classList.add('correct');

    backspaceBtn.disabled = true;
    lettersRow.querySelectorAll('.letter-tile').forEach(t => t.disabled = true);

    playSound(correctSound);
    speak("Correct");
    showPopup(true);
    burstConfettiAt(answerInput);

    if (idx < questions.length - 1) {
      nextBtn.disabled = false;
    } else {
      setTimeout(showFinalPopup, 900);
    }

  } else {
    wrongAttempts++;
    answerInput.classList.add('wrong-shake');

    playSound(wrongSound);
    speak("Wrong");
    showPopup(false);

    setTimeout(() => {
      answerInput.classList.remove('wrong-shake');
      st.picked = [];
      renderLetterTiles(idx);
    }, 1200);
  }
}

/* ============ NAV ============ */
prevBtn.addEventListener('click', () => {
  if (current > 0) { current--; renderQuestion(current); }
});
nextBtn.addEventListener('click', () => {
  if (current < questions.length - 1) { current++; renderQuestion(current); }
});

function playSound(audioEl) {
  audioEl.currentTime = 0;
  audioEl.play().catch(() => {});
}

/* ============ POPUP ============ */
function showPopup(isCorrect) {
  const popup = document.getElementById("answerPopup");
  const icon = document.getElementById("popupIcon");
  const title = document.getElementById("popupTitle");
  const msg = document.getElementById("popupMsg");

  popup.className = "popup " + (isCorrect ? "correct" : "wrong");
  popup.style.display = "flex";

  if (isCorrect) {
    icon.textContent = "🎉";
    title.textContent = "Correct!";
    msg.textContent = "Well done!";
  } else {
    icon.textContent = "😔";
    title.textContent = "Wrong!";
    msg.textContent = "Try again!";
  }

  setTimeout(() => { popup.style.display = "none"; }, 1200);
}

/* ============ FINAL POPUP ============ */
function showFinalPopup() {
  const finalPopup = document.getElementById("finalPopup");
  const scoreText = document.getElementById("finalScore");
  const starsEl = document.getElementById("stars");

  const correctCount = states.filter(s => s.status === 'correct').length;
  scoreText.textContent = `Score: ${correctCount} / ${questions.length}`;
  starsEl.textContent = "⭐".repeat(correctCount);

  finalPopup.style.display = "flex";

  if (window.innerWidth >= 769) {
    const duration = 2000;
    const end = Date.now() + duration;
    (function frame() {
      confetti({ particleCount: 6, angle: 60, spread: 55, origin: { x: 0 }, scalar: 0.5 });
      confetti({ particleCount: 6, angle: 120, spread: 55, origin: { x: 1 }, scalar: 0.5 });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  setTimeout(() => correctSound.play().catch(()=>{}), 100);
  setTimeout(() => correctSound.play().catch(()=>{}), 400);
}

function burstConfettiAt(el) {
  const rect = el.getBoundingClientRect();
  const x = (rect.left + rect.width/2) / window.innerWidth;
  const y = (rect.top + rect.height/2) / window.innerHeight;
  confetti({
    particleCount: 30,
    spread: 55,
    startVelocity: 28,
    origin: { x, y },
    colors: ['#C6B7EE','#FFE4A3','#B9EAD0','#AFDBF4']
  });
}

/* ============ RESTART ============ */
function restartActivity(){
  states.forEach(s => { s.picked = []; s.status = 'unanswered'; s.letters = []; });
  wrongAttempts = 0;
  current = 0;
  document.getElementById('finalPopup').style.display = 'none';
  renderQuestion(current);
}

/* ============ INIT ============ */
renderQuestion(current);
</script>

</body>
</html>
