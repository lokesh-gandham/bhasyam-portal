<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Verb Forms</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="../assets/CSS/popups.css">
<link rel="stylesheet" href="../assets/CSS/lesson2-nav.css">
<style>
  @font-face {
    font-family: 'CCSYBold';
    src: url('../assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  @font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'CCSyntroman';
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    background: #fefcf5;
    height: 100dvh;
    width: 100vw;
  }

  .app {
    width: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 1.5vh, 20px) clamp(16px, 2.5vw, 40px);
  }

  .section-title {
    grid-column: 1 / -1;
    font-size: 30px;
    font-weight: 400;
    color: #8b7355;
    letter-spacing: 0.5px;
    text-align: center;
    margin: 0;
    align-self: start;
  }

  .picture-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: center;
    justify-self: start;
    width: fit-content;
  }

  .q-image {
    width: min(100%, 400px);
    height: min(50vh, 400px);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .q-image img {
    width: auto;
    height: 100%;
    object-fit: contain;
  }

  .play-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-self: center;
    justify-self: stretch;
    align-items: stretch;
    gap: clamp(10px, 1.8vh, 18px);
    width: 100%;
    max-width: none;
    min-width: 0;
  }

  .ask-line {
    font-family: 'CCSyntroman';
    font-size: clamp(16px, 1.8vw, 22px);
    color: #2f3f55;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 4px;
    text-decoration: none !important;
  }

  .ask-line .target {
    color: #2e4057;
    font-weight: 600;
  }

  .q-word {
    font-size: clamp(36px, 5vw, 60px);
    font-weight: 400;
    color: #2e4057;
    letter-spacing: 3px;
    line-height: 1.2;
    display: block;
    text-align: center;
    width: 100%;
  }

  .q-word-text {
    display: block;
    font-family: 'CCSyntroman';
  }

  .prompt {
    font-size: clamp(22px, 2.6vw, 32px);
    color: #2f3f55;
    font-weight: 400;
    line-height: 1.35;
    margin-top: clamp(16px, 2.5vh, 28px);
    text-align: center;
    width: 100%;
  }

  .prompt .blank {
    display: inline-block;
    min-width: 2.4em;
    border-bottom: 4px solid #3ecf8e;
    color: #1f7a4d;
    text-align: center;
    margin: 0 4px;
    padding: 0 6px;
  }

  .prompt .blank.filled {
    border-bottom-color: transparent;
    background: #e8f8ef;
    border-radius: 10px;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(12px, 1.8vw, 18px);
    margin-top: clamp(10px, 1.5vh, 20px);
    width: 100%;
    align-self: stretch;
  }

  .option-btn {
    min-height: clamp(88px, 14vh, 112px);
    width: 100%;
    border-radius: 22px;
    border: 3px solid #e4d9c8;
    background: linear-gradient(145deg, #fffaf3, #f5efe6);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 0 rgba(0, 0, 0, 0.05);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.25s ease, background 0.25s ease;
  }

  .option-btn:hover:not(:disabled) {
    transform: translateY(-4px);
    box-shadow: 0 12px 0 rgba(0, 0, 0, 0.04);
    border-color: #cbb996;
  }

  .option-btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.05);
  }

  .option-btn:disabled { cursor: not-allowed; }

  .opt-word {
    font-family: 'CCSyntroman';
    font-size: clamp(24px, 3.2vw, 38px);
    font-weight: 400;
    color: #2e4057;
    letter-spacing: 1px;
  }

  .status-msg {
    min-height: 26px;
    text-align: center;
    font-size: clamp(16px, 1.8vw, 22px);
    color: #6b5a45;
    font-weight: 400;
  }

  .option-btn.correct {
    border-color: #3ecf8e;
    background: #e9fbf2;
    box-shadow: 0 0 0 4px rgba(62, 207, 142, 0.2), 0 8px 0 rgba(62, 207, 142, 0.15);
    animation: correctPop 0.4s ease;
  }

  .option-btn.wrong {
    border-color: #ff9f43;
    background: #fff6eb;
    animation: shakeX 0.4s ease;
  }

  @keyframes correctPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  @keyframes shakeX {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .status-msg.wrong { color: #e08a00; }

  .nav {
    display: flex;
    gap: 14px;
    justify-content: space-between;
    width: 100%;
    margin-top: auto;
  }

  .nav .prev { background: #5b9cf5; }
  .nav .next { background: #f0a8d0; }

  .app.enter .q-image { animation: fadeScale 0.4s ease; }
  .app.enter .q-word,
  .app.enter .prompt { animation: fadeUp 0.35s ease both; }
  .app.enter .option-btn { animation: fadeUp 0.35s ease both; }
  .app.enter .option-btn:nth-child(2) { animation-delay: 0.1s; }

  @keyframes fadeScale {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  button:focus-visible,
  .option-btn:focus-visible {
    outline: 4px solid rgba(91, 156, 245, 0.45);
    outline-offset: 2px;
  }

  @media (max-height: 780px) {
    .app {
      overflow-y: auto;
    }
    .q-image {
      width: min(35vw, 320px);
      height: min(35vw, 320px);
    }
    .play-panel { gap: clamp(6px, 1.2vh, 12px); }
    .q-word { font-size: clamp(32px, 4.5vw, 48px); }
    .ask-line { font-size: clamp(14px, 1.6vw, 20px); }
    .prompt { font-size: clamp(16px, 2vw, 24px); }
    .option-btn { min-height: clamp(56px, 8vh, 72px); border-radius: 16px; }
    .options { margin-top: clamp(6px, 1vh, 12px); gap: clamp(8px, 1.2vw, 14px); }
    .nav { gap: 8px; }
    .nav button { padding: 8px 16px; font-size: 14px; }
  }

  @media (max-width: 700px) {
    .app {
      flex-direction: column;
      overflow-y: auto;
    }
    .picture-stage { height: auto; justify-self: center; }
    .q-image {
      width: min(70vw, 320px);
      height: min(70vw, 320px);
    }
    .play-panel {
      justify-self: stretch;
      padding-bottom: 12px;
    }
  }

  @media (max-width: 900px) and (max-height: 780px) {
    .q-image {
      width: min(30vw, 260px);
      height: min(30vw, 260px);
    }
    .q-word { font-size: clamp(28px, 4vw, 42px); padding: 10px 24px; }
    .ask-line { font-size: clamp(13px, 1.5vw, 18px); }
    .prompt { font-size: clamp(14px, 1.8vw, 22px); }
    .option-btn { min-height: clamp(50px, 7vh, 64px); border-radius: 14px; }
    .opt-word { font-size: clamp(22px, 3vw, 30px); }
    .options { gap: clamp(6px, 1vw, 12px); }
    .nav button { padding: 7px 14px; font-size: 13px; }
  }

  @media (max-width: 600px) {
    .app { padding: 12px; gap: 12px; }
    .q-image {
      width: min(68vw, 280px);
      height: min(68vw, 280px);
    }
    .q-word { font-size: clamp(36px, 12vw, 52px); }
    .prompt { font-size: clamp(18px, 5.5vw, 24px); }
    .option-btn { min-height: 76px; border-radius: 16px; }
    .opt-word { font-size: clamp(24px, 8vw, 34px); }
  }

  /* Laptop (1024px - 1439px) */
  @media (min-width: 1024px) and (max-width: 1439px) {
    .section-title {
      display: none;
    }
    .app {
      align-items: center;
      justify-content: center;
    }
  }

  @media screen and (min-width: 1350px) {
    .app {
      align-items: center;
      justify-content: center;
      column-gap: clamp(28px, 3vw, 56px);
      padding: clamp(8px, 1.5vh, 20px) clamp(20px, 3vw, 48px);
    }
    .section-title {
      display: none;
    }
    .picture-stage {
      justify-content: center;
      justify-self: start;
      width: fit-content;
      max-width: none;
      padding: 0;
    }
    .q-image {
      width: fit-content !important;
      max-width: none !important;
      height: min(55vh, 420px) !important;
      aspect-ratio: auto !important;
      padding: 0;
    }
    .q-image img {
      width: auto;
      height: 100%;
    }
    .play-panel {
      width: 100%;
      max-width: none;
      justify-self: stretch;
      align-items: stretch;
      padding-left: 0;
      padding-right: clamp(8px, 1.5vw, 24px);
    }
    .q-word {
      font-size: clamp(40px, 3.2vw, 64px);
      padding: 16px 32px;
      width: 100%;
    }
    .prompt {
      font-size: clamp(24px, 2.2vw, 36px);
      width: 100%;
    }
    .option-btn {
      min-height: clamp(96px, 12vh, 128px);
    }
    .opt-word {
      font-size: clamp(28px, 2.6vw, 42px);
    }
    .options {
      width: 70%;
      margin: 0 auto;
    }
  }

  @media screen and (min-width: 1921px) {
    .app {
      align-items: center;
      justify-content: center;
      column-gap: clamp(32px, 2.5vw, 64px);
      padding: clamp(12px, 1.5vh, 24px) clamp(24px, 3vw, 56px);
    }
    .picture-stage {
      justify-content: center;
      justify-self: start;
      width: fit-content;
      padding: 0;
    }
    .q-image {
      width: fit-content !important;
      max-width: none !important;
      height: min(58vh, 480px) !important;
      aspect-ratio: auto !important;
      padding: 0;
    }
    .q-image img {
      width: auto;
      height: 100%;
    }
    .play-panel {
      width: 100%;
      max-width: none;
      justify-self: stretch;
      align-items: stretch;
      padding-left: 0;
      padding-right: clamp(12px, 2vw, 32px);
    }
    .q-word {
      font-size: clamp(48px, 2.8vw, 72px);
      padding: 18px 36px;
      width: 100%;
    }
    .prompt {
      font-size: clamp(28px, 1.8vw, 40px);
      width: 100%;
    }
    .option-btn {
      min-height: clamp(110px, 12vh, 140px);
    }
    .opt-word {
      font-size: clamp(32px, 2.2vw, 48px);
    }
    .options {
      width: 70%;
      margin: 0 auto;
    }
  }
</style>
</head>
<body>

<div class="app">

  <section class="picture-stage" aria-label="Question picture">
    <div class="q-image">
      <img id="questionImg" src="" alt="Question picture">
    </div>
  </section>

  <section class="play-panel">
    <div class="q-word" id="givenWord">
      <div class="ask-line" id="askLine">Choose the <span class="target">past tense</span> of</div>
      <span class="q-word-text">COME</span>
    </div>

    <div class="prompt" id="qPrompt">Yesterday I <span class="blank">?</span>.</div>

    <div class="options" id="optionsRow"></div>

    <div class="status-msg" id="statusMsg"></div>

    <div class="nav">
      <button class="prev" id="prevBtn" disabled>← Prev</button>
      <button class="next" id="nextBtn" disabled>Next →</button>
    </div>
  </section>

</div>

<div id="answerPopup" class="kid-popup">
  <div class="kid-card">
    <div class="kid-icon" id="popupIcon"></div>
    <h3 id="popupTitle"></h3>
    <p id="popupMsg"></p>
  </div>
</div>

<div id="finalPopup">
  <div class="final-kid-box">
    <h2>🎉 Congratulations!</h2>
    <p id="finalScore"></p>
    <div id="stars"></div>
    <button onclick="restartActivity()" class="playAgain-btn">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
/* Same questions – only distractors made harder */
const questions = [
  {
    given: 'come',
    answer: 'came',
    image: '../assets/images/walking.png',
    askPast: true,
    distractors: ['comed', 'comes', 'coming']
  },
  {
    given: 'ate',
    answer: 'eat',
    image: '../assets/images/eat.png',
    askPast: false,
    distractors: ['eated', 'eaten', 'eating']
  },
  {
    given: 'gift',
    answer: 'gifted',
    image: '../assets/images/gifts.png',
    askPast: true,
    distractors: ['gifts', 'gifting', 'giftd']
  },
  {
    given: 'hear',
    answer: 'heard',
    image: '../assets/images/hear.png',
    askPast: true,
    distractors: ['heared', 'hears', 'hearing']
  }
];

const states = questions.map(() => ({ status: 'unanswered' }));
let current = 0;

const app = document.querySelector('.app');
const askLine = document.getElementById('askLine');
const questionImg = document.getElementById('questionImg');
const givenWord = document.getElementById('givenWord');
const qPrompt = document.getElementById('qPrompt');
const optionsRow = document.getElementById('optionsRow');
const statusMsg = document.getElementById('statusMsg');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');

function shuffleArray(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* Correct answer + one tricky wrong form */
const optionSets = questions.map(q => {
  const wrong = q.distractors[Math.floor(Math.random() * q.distractors.length)];
  return shuffleArray([q.answer.toLowerCase(), wrong.toLowerCase()]);
});

function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }

function sentencePrefix(askPast) {
  return askPast ? 'Yesterday I' : 'Today I';
}

/* Same voice settings as other Lesson 2 sections */
function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = 'en-UK';
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

function setPrompt(q, filledWord) {
  const prefix = sentencePrefix(q.askPast);
  if (filledWord) {
    qPrompt.innerHTML = `${prefix} <span class="blank filled">${cap(filledWord)}</span>.`;
  } else {
    qPrompt.innerHTML = `${prefix} <span class="blank">?</span>.`;
  }
}

function renderQuestion(idx) {
  const q = questions[idx];
  const st = states[idx];

  questionImg.src = q.image;
  questionImg.alt = 'Picture for the word ' + q.given;
  document.querySelector('.q-word-text').textContent = q.given.toUpperCase();
  askLine.innerHTML = q.askPast
    ? 'Choose the <span class="target">past tense</span> of'
    : 'Choose the <span class="target">present tense</span> of';

  statusMsg.textContent = '';
  statusMsg.className = 'status-msg';

  if (st.status === 'correct') {
    setPrompt(q, q.answer);
    nextBtn.disabled = (idx === questions.length - 1);
  } else {
    setPrompt(q, null);
    nextBtn.disabled = true;
  }

  renderOptions(idx);
  prevBtn.disabled = idx === 0;

  app.classList.remove('enter');
  void app.offsetWidth;
  app.classList.add('enter');
}

function renderOptions(idx) {
  const q = questions[idx];
  const st = states[idx];
  optionsRow.innerHTML = '';

  optionSets[idx].forEach((w) => {
    const b = document.createElement('button');
    b.className = 'option-btn';
    b.type = 'button';
    b.innerHTML = `<span class="opt-word">${cap(w)}</span>`;

    if (st.status === 'correct') {
      if (w === q.answer.toLowerCase()) b.classList.add('correct');
      b.disabled = true;
    } else {
      b.addEventListener('click', () => choose(w, b, idx));
    }
    optionsRow.appendChild(b);
  });
}

function choose(w, btn, idx) {
  const q = questions[idx];
  const st = states[idx];
  if (st.status === 'correct') return;

  optionsRow.querySelectorAll('.option-btn.wrong').forEach(el => el.classList.remove('wrong'));
  statusMsg.textContent = '';
  statusMsg.className = 'status-msg';

  if (w === q.answer.toLowerCase()) {
    st.status = 'correct';
    optionsRow.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    btn.classList.add('correct');

    playSound(correctSound);
    speak('Correct');
    showPopup(true);
    setPrompt(q, q.answer);

    setTimeout(() => burstConfettiAt(qPrompt), 400);

    if (idx < questions.length - 1) {
      setTimeout(() => { nextBtn.disabled = false; }, 700);
    } else {
      setTimeout(showFinalPopup, 1500);
    }
  } else {
    btn.classList.add('wrong');
    playSound(wrongSound);
    speak('Wrong');
    showPopup(false);
    statusMsg.textContent = 'Try again 😊';
    statusMsg.className = 'status-msg wrong';
    setTimeout(() => btn.classList.remove('wrong'), 1000);
  }
}

prevBtn.addEventListener('click', () => {
  if (current > 0) { current--; renderQuestion(current); }
});
nextBtn.addEventListener('click', () => {
  if (current < questions.length - 1) { current++; renderQuestion(current); }
});

function playSound(audioEl) {
  audioEl.currentTime = 0;
  audioEl.play().catch(() => {});
}

function showPopup(isCorrect) {
  const popup = document.getElementById('answerPopup');
  const icon = document.getElementById('popupIcon');
  const title = document.getElementById('popupTitle');
  const msg = document.getElementById('popupMsg');

  popup.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
  popup.style.display = 'flex';

  if (isCorrect) {
    icon.textContent = '🎉';
    title.textContent = 'Great Job!';
    msg.textContent = 'You got it right!';
  } else {
    icon.textContent = '🥲';
    title.textContent = 'Oops!';
    msg.textContent = 'Try again, you can do it!';
  }

  setTimeout(() => { popup.style.display = 'none'; }, 1300);
}

function showFinalPopup() {
  const finalPopup = document.getElementById('finalPopup');
  const scoreText = document.getElementById('finalScore');
  const starsEl = document.getElementById('stars');
  const correctCount = states.filter(s => s.status === 'correct').length;

  scoreText.textContent = `Your Score: ${correctCount} / ${questions.length}`;
  starsEl.textContent = '⭐'.repeat(Math.max(correctCount, 1));
  finalPopup.style.display = 'flex';

  if (window.innerWidth >= 769) {
    const end = Date.now() + 1800;
    (function frame() {
      confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, scalar: 0.5 });
      confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, scalar: 0.5 });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }
}

function burstConfettiAt(el) {
  const rect = el.getBoundingClientRect();
  const x = (rect.left + rect.width / 2) / window.innerWidth;
  const y = (rect.top + rect.height / 2) / window.innerHeight;
  confetti({
    particleCount: 28,
    spread: 55,
    startVelocity: 26,
    origin: { x, y },
    colors: ['#C6B7EE', '#FFE4A3', '#B9EAD0', '#AFDBF4']
  });
}

function restartActivity() {
  states.forEach(s => { s.status = 'unanswered'; });
  current = 0;
  document.getElementById('finalPopup').style.display = 'none';
  renderQuestion(current);
}

renderQuestion(current);
</script>

</body>
</html>
