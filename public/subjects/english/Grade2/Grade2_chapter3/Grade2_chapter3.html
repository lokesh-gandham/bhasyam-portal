<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade2_chapter3 · compact sidebar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    @font-face {
      font-family: 'CCSYBold';
      src: url('./assets/CCSYBOLD.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'CCSyntroman';
      src: url('./assets/CCSYNTRO.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'CCSyntroman';
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #fffde7;
    }

    /* ===== APP CONTAINER ===== */
    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #fffde7;
    }

    /* ===== SIDEBAR (matched to Lesson 1) ===== */
    .sidebar {
      width: 320px;
      min-width: 320px;
      height: 100%;
      background: #fffde7;
      border-right: none;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.3s ease;
      z-index: 1000;
      justify-content: center;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      /* reduced gap */
      width: 100%;
      position: relative;
      z-index: 1;
      padding: 6px 0;
      justify-content: center;
      /* extra safety */
    }

    .nav-btn {
      width: 100%;
      flex: 0 1 68px;
      padding: 8px 14px;
      font-size: 18px;
      font-family: 'CCSyntroman';
      font-weight: 500;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      color: #3a3a3a;
      background: rgba(255, 255, 255, 0.5);
      transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease, color 0.25s ease;
      display: flex;
      align-items: center;
      gap: 0.7em;
      text-align: left;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      border: none;
    }

    .nav-btn:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 12px 30px rgba(60, 180, 140, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .nav-btn.active {
      background: rgba(255, 255, 255, 0.7);
      box-shadow: inset 4px 0 0 #8bc34a, 0 4px 12px rgba(139, 195, 74, 0.1);
      color: #2d5a2d;
      border: 1px solid rgba(139, 195, 74, 0.3);
    }

    .nav-btn .icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 0.9em;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .nav-btn.active .icon {
      background: rgba(139, 195, 74, 0.25);
      color: #2d5a2d;
      border-color: rgba(139, 195, 74, 0.3);
    }

    .nav-btn .label {
      flex: 1;
      font-size: 1em;
      letter-spacing: 0.2px;
      white-space: nowrap;
      font-family: 'CCSyntroman';
      font-weight: 600;
    }

    /* arrow (right circle) */
    .nav-arrow {
      width: 1.8em;
      height: 1.8em;
      min-width: 1.8em;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.85);
      color: var(--arrow-accent, #8a8a8a);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .nav-arrow i {
      font-size: 0.65em;
    }

    .nav-btn:hover .nav-arrow {
      transform: translateX(2px);
    }

    .nav-btn.active .nav-arrow {
      color: #2d5a2d;
    }

    /* Individual glass colors */
    .nav-btn.mcq {
      background: rgba(255, 215, 200, 0.25);
    }
    .nav-btn.mcq.active {
      background: rgba(255, 215, 200, 0.5);
      border-color: rgba(212, 163, 115, 0.4);
    }
    .nav-btn.mcq.active .icon {
      background: rgba(212, 163, 115, 0.3);
      color: #5a3d2a;
    }

    .nav-btn.fill {
      background: rgba(200, 215, 245, 0.25);
    }
    .nav-btn.fill.active {
      background: rgba(200, 215, 245, 0.5);
      border-color: rgba(123, 159, 212, 0.4);
    }
    .nav-btn.fill.active .icon {
      background: rgba(123, 159, 212, 0.3);
      color: #2a3d5a;
    }

    .nav-btn.true {
      background: rgba(245, 200, 200, 0.25);
    }
    .nav-btn.true.active {
      background: rgba(245, 200, 200, 0.5);
      border-color: rgba(212, 123, 123, 0.4);
    }
    .nav-btn.true.active .icon {
      background: rgba(212, 123, 123, 0.3);
      color: #5a2a2a;
    }

    .nav-btn.match {
      background: rgba(200, 240, 232, 0.25);
    }
    .nav-btn.match.active {
      background: rgba(200, 240, 232, 0.5);
      border-color: rgba(123, 212, 196, 0.4);
    }
    .nav-btn.match.active .icon {
      background: rgba(123, 212, 196, 0.3);
      color: #2a5a4a;
    }

    .nav-btn.one {
      background: rgba(232, 240, 200, 0.25);
    }
    .nav-btn.one.active {
      background: rgba(232, 240, 200, 0.5);
      border-color: rgba(184, 212, 123, 0.4);
    }
    .nav-btn.one.active .icon {
      background: rgba(184, 212, 123, 0.3);
      color: #4a5a2a;
    }

    .nav-btn.audio {
      background: rgba(240, 200, 232, 0.25);
    }
    .nav-btn.audio.active {
      background: rgba(240, 200, 232, 0.5);
      border-color: rgba(212, 123, 196, 0.4);
    }
    .nav-btn.audio.active .icon {
      background: rgba(212, 123, 196, 0.3);
      color: #5a2a4a;
    }

    /* ===== CONTENT ===== */
    .content {
      flex: 1;
      height: 100vh;
      overflow: hidden;
      background: #fffde7;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      display: block;
      background: #fffde7;
    }

    /* ===== HAMBURGER ===== */
    .hamburger {
      display: none;
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1001;
      background: rgba(255, 255, 255, 0.5);
      color: #4a4a4a;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
    }

    .hamburger:hover {
      background: rgba(255, 255, 255, 0.7);
      transform: scale(1.05);
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 999;
    }

    .overlay.show {
      display: block;
    }

    /* ============================================ */
    /* ===== RESPONSIVE TWEAKS ===== */
    /* ============================================ */

    /* large desktop (matched to Lesson 1) */
    @media screen and (min-width: 1400px) and (max-width: 1600px) {
      .sidebar {
        width: 420px;
        min-width: 420px;
        padding: 20px 18px;
      }
      .nav-btn {
        flex: 0 1 72px;
        padding: 8px 18px;
        font-size: 24px;
        border-radius: 22px;
        gap: 0.7em;
      }
      .nav-btn .icon {
        width: 38px;
        height: 38px;
        font-size: 0.9em;
      }
      .nav-btn .label {
        font-size: 1em;
      }
      .nav-list {
        gap: 8px;
      }
    }

    @media screen and (min-width: 1920px) {
      .sidebar {
        width: 420px;
        min-width: 420px;
        padding: 32px 24px;
      }
      .nav-btn {
        flex: 0 1 78px;
        padding: 10px 20px;
        font-size: 24px;
        border-radius: 24px;
        gap: 0.7em;
      }
      .nav-btn .icon {
        width: 38px;
        height: 38px;
        font-size: 0.9em;
      }
      .nav-list {
        gap: 10px;
      }
    }

    /* tablet (matched to Lesson 1 item sizes) */
    @media (max-width: 1024px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        transform: translateX(-100%);
        width: 370px;
        min-width: 370px;
        height: 100%;
        z-index: 1000;
        box-shadow: 4px 0 30px rgba(0, 0, 0, 0.1);
        padding: 24px 16px;
        border-radius: 0 20px 20px 0;
        justify-content: center;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .hamburger {
        display: block;
      }
      .content {
        width: 100vw;
      }
      .nav-btn {
        padding: 6px 12px;
        flex: 0 1 62px;
        font-size: 18px;
        gap: 0.7em;
        border-radius: 20px;
      }
      .nav-btn .icon {
        width: 30px;
        height: 30px;
        font-size: 0.9em;
      }
      .nav-btn .label {
        font-size: 1em;
      }
      .nav-list {
        gap: 8px;
      }
    }

    /* mobile (matched to Lesson 1) */
    @media (max-width: 700px) {
      .sidebar {
        width: 340px;
        min-width: 340px;
        padding: 70px 16px 24px;
      }
      .nav-btn {
        padding: 6px 12px;
        flex: 0 1 60px;
        font-size: 15px;
        gap: 0.7em;
        border-radius: 16px;
      }
      .nav-btn .icon {
        width: 26px;
        height: 26px;
        font-size: 0.9em;
        border-radius: 8px;
      }
      .nav-btn .label {
        font-size: 1em;
      }
      .nav-list {
        gap: 6px;
      }
      .hamburger {
        top: 14px;
        left: 14px;
        padding: 8px 12px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- HAMBURGER -->
  <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
  </button>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="app">

    <!-- SIDEBAR – vertical centering applied via flex -->
    <nav class="sidebar" id="sidebar">
      <div class="nav-list">

        <!-- Choose Option (MCQ) -->
        <button class="nav-btn mcq active" onclick="openPage('exercises/MCQ.html', this)">
          <span class="icon"><i class="fa-regular fa-circle-check"></i></span>
          <span class="label">Choose Option</span>
          <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
        </button>

        <!-- Word Puzzle -->
        <button class="nav-btn fill" onclick="openPage('exercises/w.html', this)">
          <span class="icon"><i class="fa-solid fa-pen-fancy"></i></span>
          <span class="label">Word Puzzle</span>
          <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
        </button>

        <!-- Opposites -->
        <button class="nav-btn true" onclick="openPage('exercises/opposite.html', this)">
          <span class="icon"><i class="fa-solid fa-arrow-right-arrow-left"></i></span>
          <span class="label">Opposites</span>
          <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
        </button>

        <!-- Verb Forms (Past Tense) -->
        <button class="nav-btn match" onclick="openPage('exercises/past.html', this)">
          <span class="icon"><i class="fa-solid fa-clock-rotate-left"></i></span>
          <span class="label">Verb Forms</span>
          <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
        </button>

        <!-- Plural Form -->
        <button class="nav-btn one" onclick="openPage('exercises/mcq2.html', this)">
          <span class="icon"><i class="fa-solid fa-people-group"></i></span>
          <span class="label">Plural Form</span>
          <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
        </button>

        <!-- Matching -->
        <button class="nav-btn audio" onclick="openPage('exercises/matching.html', this)">
          <span class="icon"><i class="fa-solid fa-link"></i></span>
          <span class="label">Matching</span>
          <span class="nav-arrow"><i class="fa-solid fa-chevron-right"></i></span>
        </button>

      </div>
    </nav>

    <!-- CONTENT -->
    <div class="content">
      <iframe id="viewer" src="./exercises/MCQ.html"></iframe>
    </div>

  </div>

  <script>
    // ===== OPEN PAGE =====
    function openPage(page, btn) {
      document.getElementById("viewer").src = page;

      document.querySelectorAll(".nav-btn").forEach(b => {
        b.classList.remove("active");
      });

      btn.classList.add("active");

      // Close sidebar on mobile
      closeSidebar();
    }

    // ===== TOGGLE SIDEBAR =====
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      sidebar.classList.toggle("open");
      overlay.classList.toggle("show");

      const hamburger = document.getElementById("hamburgerBtn");
      if (sidebar.classList.contains("open")) {
        hamburger.innerHTML = '<i class="fas fa-times"></i>';
      } else {
        hamburger.innerHTML = '<i class="fas fa-bars"></i>';
      }
    }

    // ===== CLOSE SIDEBAR =====
    function closeSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      sidebar.classList.remove("open");
      overlay.classList.remove("show");

      const hamburger = document.getElementById("hamburgerBtn");
      hamburger.innerHTML = '<i class="fas fa-bars"></i>';
    }

    // ===== CLOSE ON ESCAPE =====
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeSidebar();
      }
    });

    // ===== PREVENT BODY SCROLL =====
    document.addEventListener("touchmove", (e) => {
      if (!e.target.closest('.sidebar') && !e.target.closest('.hamburger')) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>

</body>

</html>
