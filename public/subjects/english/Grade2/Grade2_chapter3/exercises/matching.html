<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matching Quiz</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="../assets/css/popups.css">
<style>
@font-face{font-family:'CCSyBold';src:url('../assets/CCSYBOLD.TTF')format('truetype');}
@font-face{font-family:'CCSyntroman';src:url('../assets/CCSYNTRO.TTF')format('truetype');}
*{box-sizing:border-box;margin:0;padding:0;font-family:'CCSyntroman';}
html,body{height:100%;overflow:hidden;}
body{height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;background-color:#fffde7;}

.main{width:100%;height:100%;display:flex;justify-content:center;align-items:center;padding:20px;}

.game-container{position:relative;width:95%;max-width:1200px;display:flex;align-items:stretch;justify-content:center;gap:100px;height:80vh;max-height:700px;}

/* Page Title */
.page-title{position:absolute;top:-50px;left:50%;transform:translateX(-50%);font-size:clamp(18px,2.5vw,30px);font-weight:400;font-family:'CCSyntroman';color:#2d3748;background:transparent;padding:10px 40px;border-radius:30px;z-index:10;}

/* Column Containers */
.column{flex:0 0 320px;max-width:320px;border-radius:20px;display:flex;flex-direction:column;z-index:2;position:relative;}

.column.left{background:transparent;}
.column.right{background:transparent;}

/* Column Headers - Hidden */
.col-header{display:none;}

/* Items Container */
.items{display:flex;flex-direction:column;padding:0;gap:16px;flex:1;justify-content:space-evenly;}

/* Individual Item */
.item{position:relative;display:flex;align-items:center;gap:14px;font-size:20px !important;font-family:'CCSyntroman';font-weight:400;color:#2f4f4f;cursor:pointer;transition:.2s ease;padding:16px 20px;border-radius:16px;border:2px solid transparent;box-shadow:0 3px 12px rgba(0,0,0,0.08);}
.item:hover{transform:scale(1.02);box-shadow:0 5px 18px rgba(0,0,0,0.12);}
.item-text{font-size:24px !important;font-family:'CCSyntroman';font-weight:400;line-height:1.2;word-break:break-word;}

/* Pastel Background Colors */
.left .item:nth-child(1){background:#fce4ec;}
.left .item:nth-child(2){background:#fff3e0;}
.left .item:nth-child(3){background:#e8f5e9;}
.left .item:nth-child(4){background:#e3f2fd;}

.right .item:nth-child(1){background:#e8eaf6;}
.right .item:nth-child(2){background:#f3e5f5;}
.right .item:nth-child(3){background:#e0f7fa;}
.right .item:nth-child(4){background:#fff8e1;}

.item-number{ display:none !important;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;color:white;}
.column.left .item-number{background:#e91e63;}
.column.right .item-number{background:#2196f3;}

.item-letter{text-transform:uppercase; display:none;}

.left-img,.right-img{width:75px;height:75px;object-fit:contain;flex-shrink:0;}

.item-text{flex:1;text-align:left;}

/* Connection Dots */
.dot{width:20px;height:20px;border-radius:50%;background:#9e9e9e;border:3px solid white;flex-shrink:0;transition:all .3s ease;box-shadow:0 2px 8px rgba(0,0,0,0.25);}
.left .item .dot{margin-left:auto;}
.right .item .dot{margin-right:auto;}

/* Active State */
.left .item.active{background:#fff3e0;border-color:#ff9800;box-shadow:0 0 0 3px rgba(255,152,0,0.3);}
.left .item.active .dot{background:#ff9800;transform:scale(1.3);}

/* Matched State */
.item.matched{pointer-events:none;opacity:0.95;}
.item.matched{background:#e8f5e9;border-color:#4caf50;}
.item.matched .dot{background:#4caf50;transform:scale(1.3);box-shadow:0 0 10px rgba(76,175,80,0.5);}

/* Error State */
.right .item.error{animation:shakeError .4s ease;border-color:#f44336;background:#ffebee;}
@keyframes shakeError{0%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-6px)}100%{transform:translateX(0)}}

/* SVG Line Canvas */
#line-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}

.answer-box{display:none;}

/* Responsive */
@media(max-width:900px){
  .game-container{max-width:900px;gap:80px;height:85vh;}
  .column{flex:0 0 280px;max-width:280px;}
  .items{gap:14px;}
  .item{font-size:16px;padding:12px 16px;gap:10px;}
  /* .item-number{width:28px;height:28px;font-size:13px;} */
  .left-img,.right-img{width:55px;height:55px;}
  .dot{width:16px;height:16px;}
}
@media(min-width:769px) and (max-width:1439px){
  .page-title{font-size:30px;}
}
@media(max-width:700px){
  .game-container{max-width:650px;gap:50px;}
  .column{flex:0 0 230px;max-width:230px;}
  .items{gap:10px;}
  .item{font-size:14px;padding:10px 12px;gap:8px;}
  /* .item-number{width:24px;height:24px;font-size:12px;} */
  .left-img,.right-img{width:45px;height:45px;}
  .dot{width:14px;height:14px;}
  .page-title{font-size:18px;padding:8px 28px;top:-40px;}
}
@media(max-width:480px){
  .game-container{max-width:450px;gap:30px;}
  .column{flex:0 0 170px;max-width:170px;}
  .items{gap:8px;}
  .item{font-size:12px;padding:8px 10px;gap:6px;}
  /* .item-number{width:20px;height:20px;font-size:10px;} */
  .left-img,.right-img{width:38px;height:38px;}
  .dot{width:12px;height:12px;}
  .page-title{font-size:14px;padding:6px 20px;top:-35px;}
}
@media(min-width:1440px){
  .game-container{max-width:1400px;gap:200px;}
  .column{flex:0 0 380px;max-width:380px;}
  .items{gap:20px;}
.item{font-size:26px !important;padding:16px 20px;gap:14px;}
.item-text{font-size:30px !important;}

   /* .item-number{width:32px;height:32px;font-size:11px;} */
   .left-img,.right-img{width:100px;height:100px;}
   .dot{width:20px;height:20px;}
   .page-title{font-size:40px;padding:12px 44px;}
}
</style>
</head>
<body>
<div class="main">
  <div class="game-container">
    <h1 class="page-title">Match the Prefixes</h1>
    <svg id="line-canvas"></svg>
    <div class="column left">
      <div class="col-header">Base Words</div>
      <div class="items" id="leftColumn"></div>
    </div>
    <div class="column right">
      <div class="col-header">Prefixes + Words</div>
      <div class="items" id="rightColumn"></div>
    </div>
  </div>
</div>

<div id="finalPopup">
  <div class="final-kid-box">
    <h2>🎉 Congratulations!</h2>
    <p id="finalScore"></p>
    <div id="stars"></div>
    <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
const leftData=[
  {id:"1",text:"Correct",img:"../assets/images/correct.png",match:"d"},
  {id:"2",text:"Seen",img:"../assets/images/seesn.png",match:"a"},
  {id:"3",text:"Active",img:"../assets/images/happy.png",match:"b"},
  {id:"4",text:"Happy",img:"../assets/images/winner.png",match:"c"}
];
const rightData=[
  {match:"a",text:"Unseen",prefix:"un-",img:"../assets/images/hidenseek.png"},
  {match:"b",text:"Inactive",prefix:"in-",img:"../assets/images/inactive.png"},
  {match:"c",text:"Unhappy",prefix:"un-",img:"../assets/images/un-happy.png"},
  {match:"d",text:"Incorrect",prefix:"in-",img:"../assets/images/incorrect.png"}
];

let selectedLeft=null;
let matchesFound=0;
let score=0;
let connections=[];

const leftCol=document.getElementById("leftColumn");
const rightCol=document.getElementById("rightColumn");
const svg=document.getElementById("line-canvas");

function init(){
  leftCol.innerHTML="";
  rightCol.innerHTML="";
  svg.innerHTML="";
  connections=[];
  matchesFound=0;
  score=0;
  selectedLeft=null;

  leftData.forEach((item,index)=>{
    const div=document.createElement("div");
    div.className="item";
    div.dataset.match=item.match;
    div.innerHTML=`
      <span class="item-number">${index+1}</span>
      ${item.img?`<img src="${item.img}" class="left-img" onerror="this.style.display='none'">`:""}
      <span class="item-text">${item.text}</span>
      <span class="dot"></span>
    `;
    div.onclick=()=>{
      if(div.classList.contains("matched"))return;
      document.querySelectorAll(".left .item").forEach(i=>i.classList.remove("active"));
      div.classList.add("active");
      selectedLeft=div;
    };
    leftCol.appendChild(div);
  });

  rightData.forEach((item,index)=>{
    const div=document.createElement("div");
    div.className="item";
    div.dataset.id=item.match;
    const letter=String.fromCharCode(65+index);
    div.innerHTML=`
      <span class="dot"></span>
      <span class="item-number item-letter">${letter}</span>
      ${item.img?`<img src="${item.img}" class="right-img" onerror="this.style.display='none'">`:""}
      <span class="item-text">${item.text}</span>
    `;
    div.onclick=()=>{
      if(!selectedLeft||div.classList.contains("matched"))return;
      if(selectedLeft.dataset.match===div.dataset.id){
        handleMatch(selectedLeft,div);
      }else{
        speak("Wrong");
        div.classList.add("error");
        setTimeout(()=>div.classList.remove("error"),400);
        const wrongSound=document.getElementById("wrongSound");
        if(wrongSound)wrongSound.play();
      }
    };
    rightCol.appendChild(div);
  });
}

function speak(t){try{speechSynthesis.cancel();const msg=new SpeechSynthesisUtterance(t);msg.lang="en-UK";msg.volume=0.25;msg.rate=1;msg.pitch=1;speechSynthesis.speak(msg);}catch(e){}}
function smallConfetti(){if(typeof confetti!=='undefined')confetti({particleCount:35,spread:70,origin:{y:0.7},scalar:0.8});}

function handleMatch(leftEl,rightEl){
  score++;
  leftEl.classList.add("matched");
  rightEl.classList.add("matched");
  leftEl.classList.remove("active");
  drawCurve(leftEl,rightEl);
  connections.push({from:leftEl,to:rightEl});
  selectedLeft=null;
  matchesFound++;
  speak("Correct");
  const correctSound=document.getElementById("correctSound");
  if(correctSound)correctSound.play();
  smallConfetti();
  if(matchesFound===leftData.length)setTimeout(showFinal,700);
}

function drawCurve(el1,el2){
  const dot1=el1.querySelector(".dot")||el1;
  const dot2=el2.querySelector(".dot")||el2;
  const rect1=dot1.getBoundingClientRect();
  const rect2=dot2.getBoundingClientRect();
  const containerRect=svg.getBoundingClientRect();
  const x1=rect1.left+rect1.width/2-containerRect.left;
  const y1=rect1.top+rect1.height/2-containerRect.top;
  const x2=rect2.left+rect2.width/2-containerRect.left;
  const y2=rect2.top+rect2.height/2-containerRect.top;
  const cx=(x1+x2)/2;
  const pathData=`M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`;
  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",pathData);
  path.setAttribute("fill","none");
  path.setAttribute("stroke","#4caf50");
  path.setAttribute("stroke-width","4");
  path.setAttribute("stroke-linecap","round");
  path.setAttribute("stroke-dasharray","8 6");
  svg.appendChild(path);
}

function showFinal(){
  document.getElementById("finalScore").textContent=`Your Score: ${score} / ${leftData.length}`;
  document.getElementById("stars").textContent="⭐".repeat(score);
  document.getElementById("finalPopup").style.display="flex";
  if(window.innerWidth>=769){
    const duration=2000;const end=Date.now()+duration;
    (function frame(){
      confetti({particleCount:6,angle:60,spread:55,origin:{x:0},scalar:0.5});
      confetti({particleCount:6,angle:120,spread:55,origin:{x:1},scalar:0.5});
      if(Date.now()<end)requestAnimationFrame(frame);
    })();
  }
  const correctSound=document.getElementById("correctSound");
  if(correctSound){setTimeout(()=>correctSound.play(),100);setTimeout(()=>correctSound.play(),400);}
}

function redrawLines(){svg.innerHTML="";connections.forEach(c=>{if(c.from&&c.to&&c.from.parentNode&&c.to.parentNode)drawCurve(c.from,c.to);});}
let resizeTimeout;
window.addEventListener("resize",()=>{clearTimeout(resizeTimeout);resizeTimeout=setTimeout(redrawLines,200);});

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();
</script>
</body>
</html>
