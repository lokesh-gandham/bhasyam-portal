<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Verb Form Practice</title>
<!-- <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" /> -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="stylesheet" href="../assets/css/popups.css">
<style>
@font-face { font-family: 'CCSYBold'; src: url('../assets/CCSYBOLD.TTF') format('truetype'); font-weight: normal; font-style: normal; }
@font-face { font-family: 'CCSyntroman'; src: url('../assets/CCSYNTRO.TTF') format('truetype'); font-weight: normal; font-style: normal; }

* { box-sizing: border-box; margin: 0; padding: 0; font-family: "CCSyntroman", serif; }
html, body { height: 100vh; height: 100dvh; overflow: hidden; }
body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fffde7;
  padding: 16px;
}

.quiz {
  width: 100%;
  max-width: 1180px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: clamp(6px, 1.4vh, 14px);
}

/* ===== TOP ROW ===== */
.top-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
.quiz-title {
  color: #2f4f4f;
  font-size: 30px;
  font-weight: 500;
  letter-spacing: 0.3px;
}
.how-to-play-btn {
  display:none !important;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  background: linear-gradient(145deg, #bddcee, #99d8f5);
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  box-shadow: 0 4px 0 #4c6f86, 0 8px 16px rgba(65,134,146,0.25);
  transition: all 0.25s ease;
}
.how-to-play-btn:hover { transform: translateY(-2px) scale(1.05); }
.how-to-play-btn:active { transform: translateY(2px) scale(0.97); }

/* ===== INSTRUCTION LINE ===== */
.instruction-line {
  font-size: clamp(13pt, 2vw, 18pt);
  color: #4a2e2a;
  padding: 4px 20px;
  text-align: center;
  font-weight: 500;
  flex-shrink: 0;
}
.instruction-line .tense-word {
  padding: 2px 14px;
  border-radius: 30px;
  font-weight: 700;
  text-transform: uppercase;
}
.instruction-line .tense-word.present { background: #cdeedd; color: #217a4d; }
.instruction-line .tense-word.past { background: #fcdcdc; color: #b03a3a; }

/* ===== BOOK ===== */
.book-cover {
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  max-height: 64vh;
  background: linear-gradient(145deg, #8fc2a8, #6fa98d);
  border-radius: clamp(20px, 3vw, 40px);
   padding: clamp(4px, 0.8vw, 10px); 
  box-shadow: 0 14px 32px rgba(0,0,0,0.16);
  display: flex;
  perspective: 1800px;
}
.book-inner {
  flex: 1;
  background: #fdfaf1;
  border-radius: clamp(16px, 2.4vw, 32px);
  display: flex;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

.page {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 1.4vh, 16px);
  padding: clamp(10px, 2vw, 30px);
  min-width: 0;
  min-height: 0;
  position: relative;
  background: #fdfaf1;
}

.tag-pill {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 22px;
  border-radius: 30px;
  font-weight: 700;
  font-size: clamp(12pt, 1.5vw, 17pt);
  flex-shrink: 0;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.tag-pill.present {  color: #217a4d; }
.tag-pill.past {  color: #b03a3a; }

.image-box {
  flex: 1;
  width: 100%;
  min-height: 0;
  max-height: 58%;
  /* border: 1.5px dashed #d9cdb8; */
  /* border-radius: clamp(14px, 2vw, 24px); */
  /* background: #fef8f4; */
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(6px, 1.2vw, 16px);
}
.image-box img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.word-box {
  width: 100%;
  flex-shrink: 0;
  text-align: center;
  border-radius: clamp(12px, 1.6vw, 18px);
  font-weight: 700;
  font-size: clamp(18pt, 2.6vw, 32pt);
  padding: clamp(10px, 1.6vh, 18px) 10px;
}
.word-box.given.present { background: #d9f3e3; color: #1f6b47; }
.word-box.given.past { background: #ffe3ea; color: #a8395a; }

.blank-wrap { width: 100%; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.blank-input {
  width: 100%;
  text-align: center;
  font-family: "CCSyntroman", serif;
  font-weight: 700;
  font-size: clamp(16pt, 2.2vw, 26pt);
  padding: clamp(10px, 1.6vh, 16px) 10px;
  border-radius: clamp(12px, 1.6vw, 18px);
  border: 1.5px solid #ffc7d6;
  background: #fff;
  color: #2f4f4f;
  outline: none;
  transition: all 0.2s ease;
}
.blank-input.tense-present { border-color: #a6dfc0; }
.blank-input.tense-past { border-color: #ffc7d6; }
.blank-input::placeholder { color: #c3b9c9; font-weight: 500; font-style: italic; font-size: 0.75em; }
.blank-input:focus { transform: scale(1.02); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
.blank-input.correct { border-width: 1.5px; border-color: #2ecc71; background: #eafff1; color: #1f6b47; }
.blank-input.locked { cursor: default; }
.blank-input.shake-wrong { animation: optShake 0.4s ease; border-color: #ff4444; background: #fff2f2; }

.hint-line {
  font-size: 14px;
  color: #8a7a6a;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== PLAIN CENTER SPINE (spiral removed) ===== */
.spine {
  width: clamp(3px, 0.4vw, 6px);
  flex-shrink: 0;
  background: linear-gradient(to right, rgba(0,0,0,0.06), rgba(0,0,0,0.14), rgba(0,0,0,0.06));
  position: relative;
  z-index: 5;
}

/* ===== PAGE THICKNESS EDGES ===== */
.page::before {
  content: '';
  position: absolute;
  top: 6%;
  bottom: 6%;
  width: 5px;
  opacity: 0.5;
  pointer-events: none;
}
#leftPage::before {
  right: -2px;
  background: repeating-linear-gradient(to right, transparent 0 1px, rgba(0,0,0,0.05) 1px 2px);
}
#rightPage::before {
  left: -2px;
  background: repeating-linear-gradient(to left, transparent 0 1px, rgba(0,0,0,0.05) 1px 2px);
}
.tag-pill{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    height:64px;
    padding:0 20px;
}

.tag-icon{
    width:60px;
    height:60px;
    object-fit:contain;
    flex-shrink:0;
}

.tag-pill span{
    font-weight:700;
    letter-spacing:.5px;
}

/* ===== FOLDED CORNER (realistic dog-ear) ===== */
.page-corner {
  position: absolute;
  right: 0;
  bottom: 0;
  width: clamp(22px, 3vw, 38px);
  height: clamp(22px, 3vw, 38px);
  background: linear-gradient(135deg, transparent 50%, #f1e9d8 50%, #f1e9d8 100%);
  box-shadow: -2px -2px 6px rgba(0,0,0,0.12), inset -1px -1px 2px rgba(0,0,0,0.08);
  border-radius: 0 0 clamp(14px, 2vw, 24px) 0;
  pointer-events: none;
  z-index: 3;
}

/* ===== FLIP OVERLAY (premium page-turn animation) ===== */
.flip-overlay {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  background: #fdfaf1;
  z-index: 30;
  display: none;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  overflow: hidden;
}
.flip-overlay.right { right: 0; transform-origin: left center; border-radius: 0 clamp(16px, 2.4vw, 32px) clamp(16px, 2.4vw, 32px) 0; }
.flip-overlay.left { left: 0; transform-origin: right center; border-radius: clamp(16px, 2.4vw, 32px) 0 0 clamp(16px, 2.4vw, 32px); }
.flip-overlay .flip-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 1.4vh, 16px);
  padding: clamp(10px, 2vw, 30px);
}
.flip-overlay::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.22) 100%);
  opacity: 0;
  transition: opacity 0.35s ease;
  pointer-events: none;
}
.flip-overlay.left::after { background: linear-gradient(270deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.22) 100%); }
.flip-overlay.turning::after { opacity: 1; }
.flip-overlay.animate {
  transition: transform 0.62s cubic-bezier(0.45,0.05,0.35,1), box-shadow 0.62s ease;
}
.flip-overlay.right.animate { box-shadow: -18px 6px 30px rgba(0,0,0,0.22); }
.flip-overlay.left.animate { box-shadow: 18px 6px 30px rgba(0,0,0,0.22); }

.card.shake { animation: cardShake 0.5s ease; }

@keyframes optShake {
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  75%{transform:translateX(6px);}
}
@keyframes cardShake {
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-10px);}
  40%{transform:translateX(10px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(6px);}
}

/* ===== NAV (kept identical to source) ===== */
.nav {
  margin-top: 10px;
  display: flex;
  justify-content: center;
  gap: 70px;
  flex-shrink: 0;
}
.nav button {
  padding: 12px 30px;
  font-size: 22px;
  border: none;
  border-radius: 22px;
  cursor: pointer;
  width: clamp(130px,16vw,180px);
  height: clamp(48px,7vh,56px);
  transition: 0.2s;
}
.nav button:hover:not(:disabled) { transform: scale(1.05); }
.prev { background: #A2CB8B; color: #2f4f4f; }
.next { background: #EA7B7B; color: white; }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

#howToModal {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.35);
  z-index: 4000;
  padding: 20px;
}
.howto-box {
  width: 90%;
  max-width: 460px;
  background: #fff;
  border-radius: 30px;
  padding: 32px 36px;
  text-align: center;
}
.howto-box h2 {  color:#42bdc1; margin-bottom:18px; font-size:22px; }
.howto-box ul { list-style:none; text-align:left; margin:16px auto; max-width:380px; line-height:1.7; }
.howto-box li { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; font-size:14.5px; color:#2f4f4f; }
.howto-box li i { color:#42bdc1; margin-top:4px; }
#howToCloseBtn {
  margin-top:18px; padding:12px 40px; font-size:17px; font-weight:600;
  border:none; border-radius:50px;
  background:linear-gradient(145deg,#5cc0e7,#9bf7fe); color:white; cursor:pointer;
  box-shadow:0 4px 0 #4d9dac, 0 6px 20px rgba(87,190,216,0.35);
  transition:all 0.25s ease; letter-spacing:0.5px;
}
#howToCloseBtn:hover { transform:translateY(-2px); }

/* ===== RESPONSIVE: stack pages on narrow screens ===== */
@media (max-width: 720px) {
  .book-inner { flex-direction: column; }
  .page { padding: 8px 14px; gap: 6px; }
  .spine { width: 100%; height: clamp(3px, 0.6vh, 6px); background: linear-gradient(to bottom, rgba(0,0,0,0.06), rgba(0,0,0,0.14), rgba(0,0,0,0.06)); }
  #leftPage::before { right: auto; left: 6%; right: 6%; top: auto; bottom: -2px; width: auto; height: 5px; background: repeating-linear-gradient(to bottom, transparent 0 1px, rgba(0,0,0,0.05) 1px 2px); }
  #rightPage::before { left: 6%; right: 6%; top: -2px; width: auto; height: 5px; background: repeating-linear-gradient(to top, transparent 0 1px, rgba(0,0,0,0.05) 1px 2px); }
  .flip-overlay { width: 100%; height: 50%; }
  .flip-overlay.right { right: auto; top: 50%; bottom: 0; transform-origin: center top; border-radius: 0 0 clamp(16px, 2.4vw, 32px) clamp(16px, 2.4vw, 32px); }
  .flip-overlay.left { left: auto; top: 0; bottom: 50%; transform-origin: center bottom; border-radius: clamp(16px, 2.4vw, 32px) clamp(16px, 2.4vw, 32px) 0 0; }
  .flip-overlay.right::after { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.22) 100%); }
  .flip-overlay.left::after { background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.22) 100%); }
  .image-box { max-height: 46%; }
}

@media (max-width: 480px) {
  .quiz-title { font-size: 14pt; }
  .instruction-line { font-size: 10.5pt; padding: 3px 10px; }
  .how-to-play-btn { width: 36px; height: 36px; font-size: 14px; }
  .tag-pill { padding: 5px 14px; font-size: 10pt; }
  .word-box, .blank-input { font-size: 13pt; }
  .hint-line { font-size: 16px; }
}

@media (max-height: 560px) {
  .book-cover { max-height: 58vh; }
  .image-box { max-height: 40%; }
  .nav { margin-top: 6px; }
}

/* ===== NAV / responsive breakpoints — kept exactly as source quiz ===== */
@media (min-width: 1025px) {
  .nav { gap: 70px; }
  .nav button { font-size: 22px; height: 52px; padding: 12px 30px; }
  .tag-icon{
    width:75px;
    height:75px;
    object-fit:contain;
    flex-shrink:0;
}
}
@media (max-width: 1024px) and (min-width: 769px) {
  .nav { gap: 40px; }
  .nav button { font-size: 18px; height: 46px; padding: 10px 24px; }
  .tag-icon{
    width:65px;
    height:65px;
    object-fit:contain;
    flex-shrink:0;
}
}
@media (max-width: 768px) and (min-width: 481px) {
  .nav { gap: 30px; margin-top: 15px; }
  .nav button { font-size: 16px; height: 42px; padding: 8px 20px; width: clamp(100px, 30vw, 140px); }
}
@media (max-width: 480px) {
  .nav { gap: 16px; margin-top: 12px; }
  .nav button { font-size: 14px; height: 36px; padding: 6px 14px; width: clamp(80px, 35vw, 110px); border-radius: 16px; }
}
@media (min-width: 1400px) {
  /* .nav button { font-size: 26px; height: 60px; padding: 14px 36px; width: clamp(150px, 16vw, 200px); } */
  .quiz { max-width: 1400px; }
  .quiz-title { font-size: 40px; }
  .instruction-line { font-size: 20pt; }
  .book-cover { max-height: 68vh; }
  .image-box { max-height: 60%; }
  .hint-line { font-size: 24px; }
  .tag-icon{
    width:100px;
    height:100px;
    object-fit:contain;
    /* flex-shrink:0; */

}
.nav button{
font-size:24px;
height:56px;
padding:14px 30px;
}
.tag-pill{
   font-size:26px;
}
}
@media (max-height: 500px) {
  .nav button { height: 30px; font-size: 12px; padding: 4px 10px; }
}
</style>
</head>
<body>

<div class="quiz">

  <div class="top-row">
    <h1 class="quiz-title">Verb Form Practice</h1>
    <button class="how-to-play-btn" id="howToPlayBtn" aria-label="How to play">
      <i class="fas fa-question"></i>
    </button>
  </div>

  <div class="instruction-line" id="instructionLine"></div>

  <div class="book-cover">
    <div class="book-inner" id="bookInner">

      <div class="page" id="leftPage"></div>

      <div class="spine"></div>

      <div class="page" id="rightPage"></div>

      <div class="flip-overlay right" id="flipOverlayRight"><div class="flip-inner"></div></div>
      <div class="flip-overlay left" id="flipOverlayLeft"><div class="flip-inner"></div></div>

    </div>
  </div>

  <div class="nav">
    <button class="prev" id="prev" disabled>← Prev</button>
    <button class="next" id="next" disabled>Next →</button>
  </div>
</div>

<div id="howToModal">
  <div class="howto-box">
    <h2><i class="fas fa-lightbulb"></i> How to Play</h2>
    <ul>
      <li><i class="fas fa-keyboard"></i> Type the correct form in the empty box.</li>
      <li><i class="fas fa-arrow-turn-down"></i> It checks itself as soon as you finish typing.</li>
      <li><i class="fas fa-check-circle"></i> Correct answers turn the box green.</li>
      <li><i class="fas fa-times-circle"></i> Wrong answers shake — try again.</li>
      <li><i class="fas fa-star"></i> Fill in every blank to finish.</li>
    </ul>
    <button id="howToCloseBtn">Got it!</button>
  </div>
</div>

<div id="answerPopup" class="kid-popup">
  <div class="kid-card">
    <div class="kid-icon" id="popupIcon"></div>
    <h3 id="popupTitle"></h3>
    <p id="popupMsg"></p>
  </div>
</div>

<div id="finalPopup">
  <div class="final-kid-box">
    <h2>🎉 Congratulations!</h2>
    <p id="finalScore"></p>
    <div id="stars"></div>
    <button class="playAgain-btn" onclick="playAgain()">Play Again</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
  
  /* 2nd, 4th, 5th ask PRESENT tense; 1st and 3rd ask PAST tense */
  const quiz = [
    { word: "talk",     present: "talk",     past: "talked",    blank: "past" ,presentImg: "../assets/images/talk.png", pastImg: "../assets/images/talked.png" },
    { word: "teach",    present: "teach",    past: "taught",    blank: "present" ,presentImg: "../assets/images/teach.png", pastImg: "../assets/images/teached.png" },
    { word: "conduct",  present: "conduct",  past: "conducted", blank: "past" ,presentImg: "../assets/images/conduct.png", pastImg: "../assets/images/conducted.png" },
    { word: "announce", present: "announce", past: "announced", blank: "present" ,presentImg: "../assets/images/announce.png", pastImg: "../assets/images/announced.png" },
    { word: "clap",     present: "clap",     past: "clapped",   blank: "present" ,presentImg: "../assets/images/clap.png", pastImg: "../assets/images/clapped.png" }
  ];

 
  let index = 0, score = 0;
  const answered = new Array(quiz.length).fill(false);

  const instructionLine = document.getElementById("instructionLine");
  const leftPage = document.getElementById("leftPage");
  const rightPage = document.getElementById("rightPage");
  const bookInner = document.getElementById("bookInner");
  const flipOverlayRight = document.getElementById("flipOverlayRight");
  const flipOverlayLeft = document.getElementById("flipOverlayLeft");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  let animating = false;

  function speak(t) {
    speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(t);
    msg.lang = "en-UK"; msg.volume = 0.25; msg.rate = 1; msg.pitch = 1;
    speechSynthesis.speak(msg);
  }
  function launchConfetti() {
    confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
  }
  function smallConfetti() {
    confetti({ particleCount: 40, spread: 60, origin: { y: 0.55 }, scalar: 0.8 });
  }

  function showPopup(isCorrect) {
    const popup = document.getElementById("answerPopup");
    const icon = document.getElementById("popupIcon");
    const title = document.getElementById("popupTitle");
    const msg = document.getElementById("popupMsg");
    popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
    popup.style.display = "flex";
    if (isCorrect) {
      launchConfetti();
      icon.textContent = "🎉";
      title.textContent = "Great Job!";
      msg.textContent = "You got it right!";
    } else {
      icon.textContent = "🥲";
      title.textContent = "Oops!";
      msg.textContent = "Try again, you can do it!";
    }
    setTimeout(() => { popup.style.display = "none"; }, 1400);
  }
  const capitalize = str => str.charAt(0).toUpperCase() + str.slice(1);

  function setInstruction(tense) {
    const label = tense === "past" ? "Past" : "Present";
    const cls = tense === "past" ? "past" : "present";
    // instructionLine.innerHTML = `📝 Type the correct <span class="tense-word ${cls}">${label}</span> form of the verb.`;
  }

  function pagePiece(tense, q, qIndex) {
    const isPresent = tense === "present";
    const label = isPresent ? "Present" : "Past";
 const tagImg = isPresent
    ? "../assets/images/present.png"
    : "../assets/images/past.png";
const img = isPresent
    ? q.presentImg
    : q.pastImg;
    const isBlank = q.blank === tense;
  const actualAnswer = isPresent ? q.present : q.past;
const answer = actualAnswer.charAt(0).toUpperCase() + actualAnswer.slice(1);

    let bottomHtml;
    if (!isBlank) {
      bottomHtml = `<div class="word-box given ${tense}">${answer}</div>`;
    } else {
      const already = answered[qIndex];
      bottomHtml = `
        <div class="blank-wrap">
          <input
            class="blank-input tense-${tense} ${already ? 'correct locked' : ''}"
            id="blankInput"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            maxlength="${answer.length}"
            placeholder="Type the ${tense} form here..."
            value="${already ? answer : ''}"
            ${already ? 'disabled' : ''}
          />
          
        </div>`;
    }

   return `
  <div class="tag-pill ${tense}">
      <img src="${tagImg}" class="tag-icon" alt="${label}">
      <span>${label}</span>
  </div>

  <div class="image-box">
      <img src="${img}" alt="${tense}">
  </div>

  ${bottomHtml}
`;
  }

  function pageContentHtml(qIndex) {
    const q = quiz[qIndex];
    return {
      left: pagePiece("present", q, qIndex),
      right: pagePiece("past", q, qIndex)
    };
  }

  function load() {
    const q = quiz[index];
    setInstruction(q.blank);

    leftPage.innerHTML = pagePiece("present", q, index);
    rightPage.innerHTML = pagePiece("past", q, index);

    wireInput(q);

    prev.disabled = (index === 0);
    next.disabled = !answered[index];
  }

  function wireInput(q) {
    const input = document.getElementById("blankInput");
    if (!input || answered[index]) return;

   const expected = q.blank === "present" ? q.present : q.past;

    const validate = () => {
      const val = input.value.trim().toLowerCase();
      if (val.length < expected.length) return;
      if (val === expected) {
        input.value = capitalize(expected);
        input.classList.add("correct", "locked");
        input.disabled = true;
        answered[index] = true;
        score++;
        next.disabled = false;
        smallConfetti();
        showPopup(true);
        speak("Correct");
        if (index === quiz.length - 1) {
          setTimeout(() => { showFinal(); }, 1300);
        }
      } else {
        input.classList.add("shake-wrong");
        document.querySelector(".book-cover").classList.add("shake");
        showPopup(false);
        speak("Wrong");
        setTimeout(() => {
          input.classList.remove("shake-wrong");
          document.querySelector(".book-cover").classList.remove("shake");
          input.value = "";
          input.focus();
        }, 500);
      }
    };

    input.addEventListener("input", validate);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); validate(); }
    });

    setTimeout(() => input.focus(), 50);
  }

  /* ===== Realistic page-turn flip ===== */
  function turnPage(direction, callback) {
    if (animating) return;
    animating = true;

    const overlay = direction === "next" ? flipOverlayRight : flipOverlayLeft;
    const flipInner = overlay.querySelector(".flip-inner");
    const currentContent = direction === "next" ? pageContentHtml(index).right : pageContentHtml(index).left;

    flipInner.innerHTML = currentContent;
    overlay.style.display = "block";
    overlay.style.transform = "rotateY(0deg)";
    overlay.classList.remove("animate", "turning");

    callback();

    requestAnimationFrame(() => {
      overlay.classList.add("animate");
      requestAnimationFrame(() => {
        overlay.classList.add("turning");
        overlay.style.transform = direction === "next" ? "rotateY(-165deg)" : "rotateY(165deg)";
      });
    });

    setTimeout(() => {
      overlay.classList.remove("animate", "turning");
      overlay.style.display = "none";
      overlay.style.transform = "rotateY(0deg)";
      animating = false;
    }, 640);
  }

  next.onclick = () => {
    if (animating) return;
    if (index < quiz.length - 1) {
      turnPage("next", () => { index++; load(); });
    } else {
      showFinal();
    }
  };

  prev.onclick = () => {
    if (animating) return;
    turnPage("prev", () => { index--; load(); });
  };

  function showFinal() {
    const popup = document.getElementById("finalPopup");
    document.getElementById("finalScore").textContent = `Your Score: ${score} / ${quiz.length}`;
    document.getElementById("stars").textContent = "⭐".repeat(score);
    popup.style.display = "flex";
    launchConfetti();
    prev.disabled = true;
  }

  load();

  function playAgain() { location.reload(); }

  const howToBtn = document.getElementById('howToPlayBtn');
  const howToModal = document.getElementById('howToModal');
  const howToClose = document.getElementById('howToCloseBtn');
  howToBtn.addEventListener('click', () => { howToModal.style.display = 'flex'; });
  howToClose.addEventListener('click', () => { howToModal.style.display = 'none'; });
  howToModal.addEventListener('click', (e) => { if (e.target === howToModal) howToModal.style.display = 'none'; });
</script>
</body>
</html>
