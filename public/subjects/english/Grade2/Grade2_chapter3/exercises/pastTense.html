<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Past Tense Worksheet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @font-face {
            font-family: "CCSyntroman";
            src: url("../assets/CCSYNTRO.TTF") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "CCSyntroman";
        }


        html,
        body {
            height: 100vh;
            height: 100dvh;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #fffde7;
            font-family: "CCSyntroman";
            font-size: 16pt;
        }

        .quiz {
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            height: 90dvh;
            max-height: 850px;
            padding: 35px 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .top-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .how-to-play-btn {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            background: linear-gradient(145deg, #bddcee, #99d8f5);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 4px 0 #4c6f86, 0 8px 16px rgba(65, 134, 146, 0.25);
            transition: all .25s ease;
        }

        #howToModal {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, .35);
            z-index: 4000;
        }

        .howto-box {
            width: 90%;
            max-width: 500px;
            background: #fff;
            border-radius: 30px;
            padding: 35px 40px;
            text-align: center;
        }

        .howto-box h2 {
            font-family: "CCSyntroman";
            color: #45e3e9;
            margin-bottom: 20px;
        }

        .howto-box ul {
            list-style: none;
            text-align: left;
            margin: 20px auto;
            max-width: 380px;
            line-height: 1.8;
        }

        .howto-box li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }

        .howto-box li i {
            color: #42bdc1;
            margin-top: 4px;
        }

        .how-to-play-btn:hover {
            transform: translateY(-2px) scale(1.05);
        }

        .how-to-play-btn:active {
            transform: translateY(2px) scale(.97);
        }
        #howToCloseBtn {
    margin-top: 20px;
    padding: 12px 40px;
    font-size: 18px;
    font-weight: 600;
    font-family: "CCSyntroman";
    border: none;
    border-radius: 50px;
    background: linear-gradient(145deg, #5cc0e7, #9bf7fe);
    color: white;
    cursor: pointer;
    box-shadow: 
        0 4px 0 #4d9dac,
        0 6px 20px rgba(87, 190, 216, 0.35);
    transition: all 0.25s ease;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
}

        .how-to-play-btn i {
            pointer-events: none;
            
        }

        .quiz-title {
            color: #2f4f4f;
            font-size: 30px;
            font-weight: 500;
            line-height: 1.3;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .word-grid {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto repeat(5, 1fr);
            gap: 22px 50px;
        }

        .col-title {
            background: linear-gradient(145deg, #9bdbf5, #5adcfd);
            color: #ffffff;
            text-align: center;
            font-weight: 700;
            font-size: 24px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 5px 0 #75c9f0, 0 6px 14px rgba(14, 168, 214, 0.25);
            letter-spacing: 1px;
        }

        .present-card {
            background: #f5f5f5;
            border: 2px solid #e0d6d2;
            border-radius: 22px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            font-size: 16pt;
            color: #2f2f2f;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
            font-weight: 500;
            justify-content: flex-start;
        }

        .present-card span {
            font-size: 16pt;
            font-weight: 500;
            color: #2f2f2f;
        }

        .past-card {
            background: #fdf3f0;
            border: 2px solid #e3d9d5;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            font-size: 16pt;
            color: #2f2f2f;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
            position: relative;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .past-card:has(.opt-popover.open) {
            z-index: 999;
        }

        .past-card.done {
            background: #d9f7e3;
            border-color: #29b44c;
            border-width: 3px;
        }

        .past-card.shake {
            animation: wrongShake 0.5s ease;
        }

        .fb-text {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            position: relative;
            z-index: 2;
        }

        .fb-text span {
            font-weight: 500;
            font-size: 16pt;
            color: #2f2f2f;
        }

        .fb-text .root-word {
            transition: opacity 0.5s ease, width 0.5s ease;
        }

        .fb-text .root-word.hidden {
            opacity: 0;
            width: 0;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: none;
        }

      .blank {
    position: relative;
    display: inline-block;
    min-width: 90px;
    border-bottom: 4px dashed #43d9ff;
    padding-bottom: 6px;
    text-align: center;
}

.blank:empty::before {
    content: "Select";
    position: absolute;
    left: 50%;
    bottom: 6px;      /* text sits above the underline */
    transform: translateX(-50%);
    color: #8aa7b8;
    font-size: 18px;
    white-space: nowrap;
    pointer-events: none;
}

        .blank:hover:not(.locked) {
            border-bottom-color: #87c1f1;
            transform: scale(1.05);
        }

        .blank.fb-filled {
            border-bottom: none;
            color: #2f9e44;
            cursor: default;
            font-weight: 500;
        }

        .blank.locked {
            cursor: default;
        }

        .fb-icon {
            font-size: 34px;
            color: #d4c5c0;
            transition: all 0.4s ease;
            min-width: 50px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .fb-icon.revealed {
            color: #29b44c;
            transform: scale(1.2);
        }

        .opt-popover {
            position: absolute;
            top: calc(100% + 2px);
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 4px;
            background: #ffffff;
            padding: 5px 8px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            white-space: nowrap;
            border: 2px solid #ffd7c9;
            pointer-events: auto;
        }

        .opt-popover.open {
            display: flex;
        }

        .opt-btn {
            font-size: 14px;
            font-weight: 700;
            color: #2f4f4f;
            background: #fff3ee;
            border: 2px solid #ffd7c9;
            border-radius: 7px;
            padding: 4px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            z-index: 1000;
            pointer-events: auto;
        }

        .opt-btn:hover {
            background: #ffe6dc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 67, 0.2);
        }

        .opt-btn.correct-flash {
            background: #9ef2b0;
            border-color: #29b44c;
            transform: scale(1.1);
        }

        .opt-btn.wrong-flash {
            background: #ffb3b3;
            border-color: #ff4444;
            animation: shake 0.4s ease;
        }

        @keyframes wrongShake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-12px);
            }
            40% {
                transform: translateX(12px);
            }
            60% {
                transform: translateX(-8px);
            }
            80% {
                transform: translateX(8px);
            }
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }

        /* ===== FINAL POPUP - SAME LOOK AS MCQ FILE ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            /* background: rgba(0, 0, 0, 0.4); */
            /* backdrop-filter: blur(6px); */
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .final {
            background: white;
            padding: 60px;
            border-radius: 25px;
            text-align: center;
            width: 420px;
            max-width: 90vw;
            /* box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); */
            animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .final h2 {
            font-family: "CCSyntroman";
            font-size: 36px;
            margin-bottom: 20px;
            font-weight: 400;
            color: #2f4f4f;
        }

        .final h3 {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 400;
            color: #2f4f4f;
        }

        .star {
            color: gold;
            font-size: 50px;
        }

        .playBtn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: 0.2s;
        }

        .playBtn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 1024px) {
            .quiz {
                padding: 25px 30px;
                gap: 20px;
                /* background-color: #2a32a3; */
            }
            .quiz-title {
                font-size: 30px;
            }
            .word-grid {
                gap: 20px 30px;
            }
            .col-title {
                font-size: 20px;
                padding: 14px;
            }
            .present-card {
                font-size: 21pt;
                padding: 0 30px;
                border-radius: 18px;
            }
            .present-card span {
                font-size: 22px;
            }
            .past-card {
                font-size: 21pt;
                padding: 0 30px;
                border-radius: 18px;
            }
            .fb-text span {
                font-size: 22pt;
            }
            .blank {
                font-size: 22pt;
                min-width: 60px;
            }
            .fb-icon {
                font-size: 28px;
                min-width: 40px;
            }
            .opt-btn {
                font-size: 13px;
                padding: 3px 9px;
            }
            .opt-popover {
                padding: 4px 7px;
                gap: 3px;
                border-radius: 8px;
            }
            .top-row {
                gap: 12px;
            }

            .how-to-play-btn {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
            .final {
                padding: 40px 30px;
            }
            .final h2 {
                font-size: 28px;
            }
            .final h3 {
                font-size: 22px;
            }
            .star {
                font-size: 40px;
            }
        }

        @media (max-width: 768px) {
            .quiz {
                padding: 18px 20px;
                gap: 16px;
                height: 95vh;
                height: 95dvh;
                max-height: 700px;
            }
            .quiz-title {
                font-size: 20px;
            }
            .word-grid {
                gap: 14px 20px;
            }
            .col-title {
                font-size: 16px;
                padding: 10px;
                border-radius: 12px;
            }
            .present-card {
                font-size: 16px;
                padding: 0 16px;
                border-radius: 14px;
            }
            .present-card span {
                font-size: 18px;
            }
            .past-card {
                font-size: 16px;
                padding: 0 16px;
                border-radius: 14px;
            }
            .fb-text {
                gap: 8px;
            }
            .fb-text span {
                font-size: 18px;
            }
            .blank {
                font-size: 18px;
                min-width: 45px;
                border-bottom-width: 3px;
                margin-top: 4px;
                padding-bottom: 4px;
            }
            .fb-icon {
                font-size: 22px;
                min-width: 30px;
            }
            .opt-popover {
                padding: 4px 6px;
                gap: 3px;
                border-radius: 8px;
                margin-top: 2px;
            }
            .opt-btn {
                font-size: 12px;
                padding: 3px 8px;
                border-radius: 6px;
            }
            .final {
                width: 90%;
                padding: 30px;
            }
            .final h2 {
                font-size: 26px;
            }
            .final h3 {
                font-size: 20px;
            }
            .star {
                font-size: 35px;
            }
        }

        @media (max-width: 480px) {
            .quiz {
                padding: 12px 14px;
                gap: 10px;
                height: 100vh;
                height: 100dvh;
                max-height: 100dvh;
                width: 100%;
            }
            .quiz-title {
                font-size: 14px;
            }
            .word-grid {
                gap: 6px 10px;
                grid-template-rows: auto repeat(5, 1fr);
            }
            .col-title {
                font-size: 11px;
                padding: 6px;
                border-radius: 8px;
                box-shadow: 0 3px 0 #d94f26, 0 4px 10px rgba(217, 79, 38, 0.2);
            }
            .present-card {
                font-size: 12px;
                border-radius: 10px;
                padding: 0 10px;
                border-width: 1.5px;
            }
            .present-card span {
                font-size: 14px;
            }
            .past-card {
                font-size: 12px;
                border-radius: 10px;
                padding: 0 10px;
                border-width: 1.5px;
            }
            .fb-text {
                gap: 5px;
            }
            .fb-text span {
                font-size: 14px;
            }
            .blank {
                min-width: 30px;
                border-bottom-width: 2px;
                font-size: 14px;
                padding: 0 3px;
            }
            .fb-icon {
                font-size: 16px;

            }
            .opt-popover {
                padding: 3px 5px;
                gap: 2px;
                margin-top: 2px;
                border-radius: 6px;
                border-width: 1.5px;
            }
            .opt-btn {
                font-size: 10px;
                padding: 2px 6px;
                border-radius: 4px;
                border-width: 1.5px;
            }
            .final {
                width: 95%;
                padding: 20px;
                border-radius: 20px;
            }
            .final h2 {
                font-size: 20px;
                margin-bottom: 12px;
            }
            .final h3 {
                font-size: 16px;
                margin-bottom: 12px;
            }
            .star {
                font-size: 28px;
            }
            .playBtn {
                padding: 8px 20px;

            }
        }

        @media (min-width: 1440px) {
            .quiz {
                max-width: 1400px;
                padding: 45px 55px;
                gap: 32px;
                max-height: 950px;
                /* background-color: #b11d1d ; */
            }
            .quiz-title {
                font-size: 34pt;
            }
            .word-grid {
                gap: 24px 60px;
            }
            .col-title {
                font-size: 28px;
                padding: 20px;
                border-radius: 20px;
            }
            .present-card {
                font-size: 26pt !important;
                border-radius: 28px;
                padding: 0 32px;
            }
            .present-card span {
                font-size: 26pt !important;
            }
            .past-card {
                font-size: 26pt !important;
                border-radius: 28px;
                padding: 0 32px;
            }
            .fb-text span {
                font-size: 32px;
            }
            .blank {
                font-size: 26pt;
                min-width: 80px;
                border-bottom-width: 4px;
                margin-top: 8px;
                padding-bottom: 8px;
            }
            .fb-icon {
                font-size: 40px;
                min-width: 60px;
            }
            .opt-btn {

            }

            }

        /* Short-height screens: shrink so nothing ever needs to scroll */
        @media (max-height: 560px) {
            .quiz {
                padding: 12px 24px;
                gap: 10px;
            }
            .quiz-title {
                font-size: 16px;
            }

                gap: 6px 20px;
            }
            .col-title {
                font-size: 14px;
                padding: 6px;
            }

            .past-card {

            }

            }

                min-width: 26px;
            }
            .final {
                padding: 24px;
            }
            .final h2 {
                font-size: 22px;

            }

            .star {

        }
    </style>
</head>

<body>

    <div class="quiz">

        <div class="top-row">
            <h1 class="quiz-title">Write the correct verb forms.</h1>
            <button class="how-to-play-btn" id="howToPlayBtn" aria-label="How to play">
                <i class="fas fa-question"></i>
            </button>
        </div>

        <div class="word-grid" id="fbGrid">
            <div class="col-title present-title">Present Tense</div>
            <div class="col-title past-title">Past Tense</div>
        </div>

    </div>

    <!-- FINAL POPUP - SAME LOOK AS MCQ FILE -->
    <div id="finalPopup">
        <div class="final">
            <h2 id="finalTitle">🎉 Congratulations!</h2>
            <h3 id="finalScore"></h3>
            <div id="stars">
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
            </div>
            <button class="playBtn" id="playAgainBtn">Play Again</button>
        </div>
    </div>
    <div id="howToModal">
        <div class="howto-box">
            <h2><i class="fas fa-lightbulb"></i> How to Play</h2>

            <ul>
                <li><i class="fas fa-hand-pointer"></i> Click the purple underline.</li>
                <li><i class="fas fa-list"></i> Choose the correct word ending.</li>
                <li><i class="fas fa-check-circle"></i> Correct answers turn the card green.</li>
                <li><i class="fas fa-times-circle"></i> Wrong answers shake. Try again.</li>
                <li><i class="fas fa-star"></i> Finish all the words to complete the activity.</li>
            </ul>

            <button class="playAgain-btn" id="howToCloseBtn">
                Got it!
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const finalPopup = document.getElementById("finalPopup");
        const finalTitle = document.getElementById("finalTitle");
        const finalScoreEl = document.getElementById("finalScore");
        const playAgainBtn = document.getElementById("playAgainBtn");

        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-UK";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function smallConfetti(colors) {
            confetti({
                particleCount: 40,
                spread: 60,
                origin: { y: 0.7 },
                scalar: 0.8,
                colors: colors || undefined
            });
        }

        function bigConfetti() {
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
            setTimeout(() => {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }, 300);
        }

        function showFinalPopup(title, score, total) {
            finalTitle.textContent = title;
            finalScoreEl.textContent = `Your Score: ${score} / ${total}`;
            finalPopup.style.display = "flex";
            bigConfetti();
            // speak("Congratulations! You completed the worksheet!");
        }

        playAgainBtn.onclick = () => location.reload();

        const presentData = [
            "Talk",
            "Teach",
            "Conduct",
            "Announce",
            "Clap"
        ];

        const pastData = [{
            root: "Talk",
            full: "Talked",
            options: ["ed", "es", "ing"],
            correct: 0
        }, {
            root: "Teach",
            full: "Taught",
            options: ["taught", "teached", "teaching"],
            correct: 0
        }, {
            root: "Conduct",
            full: "Conducted",
            options: ["es", "ed", "ing"],
            correct: 1
        }, {
            root: "Announce",
            full: "Announced",
            options: ["ed", "ing", "es"],
            correct: 0
        }, {
            root: "Clap",
            full: "Clapped",
            options: ["es", "ped", "pped"],
            correct: 2
        }];

        const fbGrid = document.getElementById("fbGrid");
        const fbSolved = Array(pastData.length).fill(false);

        function renderFb() {
            while (fbGrid.children.length > 2) {
                fbGrid.removeChild(fbGrid.lastChild);
            }

            presentData.forEach((presentWord, idx) => {
                const pastWord = pastData[idx];

                const presentCard = document.createElement("div");
                presentCard.className = "present-card";
                presentCard.innerHTML = `<span>${presentWord}</span>`;
                fbGrid.appendChild(presentCard);

                const pastCard = document.createElement("div");
                pastCard.className = "past-card";
                pastCard.id = `past-card-${idx}`;

                const optsHtml = pastWord.options.map((opt, oi) =>
                    `<button class="opt-btn" data-idx="${idx}" data-oi="${oi}">${opt}</button>`
                ).join("");

                pastCard.innerHTML = `
                            <div class="fb-text">
                                <span class="root-word" id="root-${idx}">${pastWord.root}</span>
                                <span class="blank" data-idx="${idx}"></span>
                                <div class="opt-popover" id="pop-${idx}">${optsHtml}</div>
                            </div>
                            <div class="fb-icon" id="fb-icon-${idx}"><i class="fas fa-check-circle"></i></div>
                        `;
                fbGrid.appendChild(pastCard);
            });

            // ===== FIX: attach click listeners to .blank using event delegation =====
            document.querySelectorAll(".blank").forEach(blank => {
                blank.onclick = (e) => {
                    e.stopPropagation();
                    const idx = blank.dataset.idx;
                    if (fbSolved[idx]) return;

                    // Close all other popovers
                    document.querySelectorAll(".opt-popover").forEach(p => {
                        if (p.id !== `pop-${idx}`) p.classList.remove("open");
                    });

                    const pop = document.getElementById(`pop-${idx}`);
                    if (pop) {
                        pop.classList.toggle("open");
                    }
                };
            });

            document.querySelectorAll(".opt-btn").forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const idx = +btn.dataset.idx;
                    const oi = +btn.dataset.oi;
                    handleFbAnswer(idx, oi, btn);
                };
            });

            document.addEventListener("click", (e) => {
                if (!e.target.closest(".fb-text")) {
                    document.querySelectorAll(".opt-popover").forEach(p => p.classList.remove("open"));
                }
            });
        }

        function handleFbAnswer(idx, oi, btn) {
            const q = pastData[idx];
            const card = document.getElementById(`past-card-${idx}`);
            const blank = document.querySelector(`.blank[data-idx="${idx}"]`);
            const icon = document.getElementById(`fb-icon-${idx}`);
            const pop = document.getElementById(`pop-${idx}`);
            const rootWord = document.getElementById(`root-${idx}`);

            if (oi === q.correct) {
                fbSolved[idx] = true;
                btn.classList.add("correct-flash");
                blank.textContent = q.full;
                blank.classList.add("fb-filled", "locked");
                card.classList.add("done");
                icon.classList.add("revealed");
                pop.classList.remove("open");

                // Hide the root word in past tense column
                rootWord.classList.add("hidden");

                smallConfetti();
                speak("correct");

                if (fbSolved.every(Boolean)) {
                    setTimeout(() => {
                        showFinalPopup("🎉 Congratulations!", fbSolved.length, pastData.length);
                    }, 1200);
                }
            } else {
                btn.classList.add("wrong-flash");
                card.classList.add("shake");
                // Keep popover open so user can try again
                pop.classList.add("open");
                setTimeout(() => {
                    btn.classList.remove("wrong-flash");
                    card.classList.remove("shake");
                }, 500);
                speak("wrong");
            }
        }

        // --- How to Play modal ---
        const howToBtn = document.getElementById('howToPlayBtn');
        const howToModal = document.getElementById('howToModal');
        const howToClose = document.getElementById('howToCloseBtn');

        howToBtn.addEventListener('click', () => {
            howToModal.style.display = 'flex';
        });
        howToClose.addEventListener('click', () => {
            howToModal.style.display = 'none';
        });
        howToModal.addEventListener('click', (e) => {
            if (e.target === howToModal) howToModal.style.display = 'none';
        });

        renderFb();
    </script>
</body>

</html>
