    /* =========================

    ========================== */

    .sidebar{

    /* =========================
       NAV CARD
    ========================== */

    .island-btn{
      position:relative;

      display:flex;
      align-items:center;
      gap:18px;

      padding:18px;

      border-radius:12px;

      cursor:pointer;

      overflow:hidden;

      background:rgba(219, 218, 218, 0.95);

      border:2px solid transparent;

      transition:0.35s ease;

      box-shadow:
      0 10px 22px rgba(0,0,0,0.08),
      inset 0 1px 0 rgba(255,255,255,0.7);
    }

    /* =========================
       ICON (replaces img)
    ========================== */

    .icon-circle{
      width:38px;
      height:38px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      border-radius:22px;
      /* background:#fff3e7; */
      font-size:1.5rem;
      color:#444;
      transition:0.35s ease;
    }

    .island-btn:hover .icon-circle{
      transform:rotate(-3deg) scale(1.08);
    }

    /* =========================
       TEXT
    ========================== */

    .btn-text{
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .btn-title{
      font-size:18px;
      font-weight:400;
      color:#222;
      line-height:1.3;
    }

    .btn-desc{
      font-size:0.76rem;
      color:#666;
      margin-top:4px;
      font-weight:500;
    }

    /* =========================
       HOVER
    ========================== */

    .island-btn:hover{
      transform:translateY(-4px) scale(1.02);

      box-shadow:
      0 18px 35px rgba(0,0,0,0.12),
      inset 0 1px 0 rgba(255,255,255,0.8);
    }

    /* =========================
       SPARKLES
    ========================== */

    .sparkles{
      position:absolute;
      inset:0;
      overflow:hidden;
      pointer-events:none;
      border-radius:28px;
    }

    .sparkles span{
      position:absolute;

      width:6px;
      height:6px;

      border-radius:50%;

      background:radial-gradient(circle,#ffd966 40%,transparent 70%);

      opacity:0;

      animation:sparkle 2.5s infinite;
    }

    .sparkles span:nth-child(1){
      top:15%;
      left:8%;
      animation-delay:0s;
    }

    .sparkles span:nth-child(2){
      top:20%;
      right:10%;
      animation-delay:0.8s;
    }

    .sparkles span:nth-child(3){
      bottom:18%;
      left:15%;
      animation-delay:1.6s;
    }

    @keyframes sparkle{

      0%,100%{
        opacity:0;
        transform:scale(0.6);
      }

      50%{
        opacity:1;
        transform:scale(1.3);
      }
    }

    /* =========================
       MAIN
    ========================== */

    .main{
      flex:1;
      height:100vh;
      overflow:hidden;
    }

    iframe{
      width:100%;
      height:100%;
      border:none;

    ========================== */

       MOBILE

/* ==========================================
   Large Desktop (1441px - 1920px)
========================================== */
@media screen and (min-width: 1441px) and (max-width: 1920px) {

    body{
        overflow: hidden;
    }

    .app{
        width: 100%;
        height: 100vh;
    }

    /* Sidebar */

        width: 320px;
        padding: 40px 14px;
        gap: 20px;
    }

    /* Navigation Cards */

        gap: 20px;
    }

    .icon-circle{

        height: 52px;
        font-size: 1.9rem;
        border-radius: 50%;
    }

    .btn-title{
        font-size: 22px;
        line-height: 1.3;
    }

    .btn-desc{

    }

    /* Main Content */
    .main{
        flex: 1;
        height: 100vh;
    }

    iframe{
        width: 100%;
        height: 100%;
    }

    /* Sparkles */
    .sparkles span{
        width: 8px;
        height: 8px;
    }

    /* Hover Effect */
    .island-btn:hover{
        transform: translateY(-6px) scale(1.02);

}
    @media(max-width:1065px){

      .sidebar{

      .menu-btn{

      .offcanvas{

        z-index:4000;

      }

      .offcanvas.show{

      }

      .offcanvas-panel{

        top:0;
        right:0;

        width:320px;
        height:100%;

        background:#fff8f0;

        padding:80px 20px 20px;

        overflow-y:auto;

        transform:translateX(100%);
        transition:0.3s ease;

        border-radius:28px 0 0 28px;
      }

      .offcanvas.show .offcanvas-panel{
        transform:translateX(0);
      }

      .offcanvas-panel .island-btn{

        transition:0.35s ease;

      .offcanvas-panel .island-btn:hover .icon-circle{
        transform:rotate(-3deg) scale(1.08);
      }

      /* active states for mobile panel */

        background:linear-gradient(135deg,#fff1f1,#ffd6d6);
        border-color:#ff6b6b;
        box-shadow:0 14px 30px rgba(255,107,107,0.25);

      .offcanvas-panel .island-btn:nth-child(1).active .icon-circle{

  <script>

    const buttons =
      document.querySelectorAll(".sidebar .island-btn");

    const mobileButtons =
      document.querySelectorAll(".offcanvas .island-btn");

    const frame =
      document.getElementById("contentFrame");

    const pages = [
       "./exercises/Fill_Blanks.html",
      "./exercises/mcq.html",
      "./exercises/emojy2.html",
      "./exercises/puzzel.html",
      "./exercises/synonyms1.html",
      "./exercises/antonyms2.html",
       "./exercises/plural.html",
       "./exercises/verb.html"
    ];

    function openIsland(index){

      buttons.forEach(btn =>
        btn.classList.remove("active")
      );

      mobileButtons.forEach(btn =>
        btn.classList.remove("active")
      );

      buttons[index].classList.add("active");
      mobileButtons[index].classList.add("active");

      frame.src = pages[index];
    }

    function toggleMenu(){

      document
        .getElementById("offcanvas")
        .classList.toggle("show");
    }

    function mobileOpen(index){

      openIsland(index);

      toggleMenu();
    }

  </script>
