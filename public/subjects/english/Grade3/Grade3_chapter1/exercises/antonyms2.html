<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
  <title>Word Maze Match</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* ===== RESET & BASE ===== */
    @font-face {
      font-family: 'CCSYBold';
      src: url('./assets/CCSYBOLD.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'CCSyntroman';
      src: url('../assets/CCSYNTRO.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'CCSyntroman', 'Comic Sans MS', 'Baloo 2', system-ui, sans-serif;
    }
    html, body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    
    }
    .stage {
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .stage.slide-out {
      transform: translateX(-20px) scale(0.96);
      opacity: 0;
    }
    .stage.slide-in {
      animation: slideIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
    }
    @keyframes slideIn {
      0% { transform: translateX(25px) scale(0.96); opacity: 0; }
      100% { transform: translateX(0) scale(1); opacity: 1; }
    }
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 8px 0;
      flex-wrap: wrap;
      gap: 8px;
    }
    h1 {
      color: #2f4f4f;
      text-shadow: 0 2px 0 #ffffff88;
      font-size: 28px;
      margin: 0;
      letter-spacing: 0.5px;
    }
    .sub {
      font-size: 1.2rem;
      font-weight: 400;
      color: #5a6a8a;
      background: #ffffff;
      padding: 0.4rem 1.2rem;
      border-radius: 60px;
      text-align: center;
      border: 2px solid #5a6a8a;
    }
    .board-wrap {
      position: relative;
      /* background: #fff; */
      border-radius: 28px;
      padding: 20px;
      /* border: 10px solid #e7c98a; */
      /* box-shadow: 0 0 0 4px #c99a4e, 0 14px 0 -4px #00000022, 0 20px 30px #00000033; */
      overflow: visible;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .board-wrap::before, .board-wrap::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      background: radial-gradient(circle at 35% 30%, #9fd98f, #5fa652 70%);
      border-radius: 50%;
      box-shadow: inset 0 -4px 0 #3d7a34;
      display:none;
    }
    .board-wrap::before { top: -16px; left: -16px; }
    .board-wrap::after { bottom: -16px; right: -16px; }
    .svg-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      width: 980px;
      margin: 0 auto;
      overflow: visible;
    }
    .cell-word {
      cursor: pointer;
      user-select: none;
      transform-box: fill-box;
      transform-origin: 50% 50%;
      opacity: 0;
      animation: cardPopIn .6s cubic-bezier(.34,1.56,.64,1) forwards;
      animation-delay: var(--pop-delay, 0s);
    }
    .cell-word .bob {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: floatBob 3.2s ease-in-out infinite;
      animation-delay: var(--bob-delay, 0s);
    }
    @keyframes cardPopIn {
      0% { opacity: 0; transform: scale(0.35) rotate(-10deg); }
      60% { opacity: 1; transform: scale(1.1) rotate(3deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    /* @keyframes floatBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(0.6deg); }
    } */
    @keyframes matchPop {
      0% { transform: scale(1) rotate(0deg); }
      35% { transform: scale(1.22) rotate(-4deg); }
      65% { transform: scale(0.95) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .cell-word.matched .bob {
      animation: matchPop .55s ease;
    }
    .bubble-rect {
      filter: drop-shadow(0 3px 0 rgba(0,0,0,0.18));
      transition: transform .12s ease, fill 0.4s ease;
    }
    .cell-word.selected .bubble-rect {
      stroke: #ffffff;
      stroke-width: 3;
      filter: drop-shadow(0 0 8px #ffffffaa) drop-shadow(0 3px 0 rgba(0,0,0,0.18));
    }
    .cell-word.matched .bubble-rect {
      opacity: 1;
    }
    .cell-word.matched { cursor: default; }
    .cell-word.wrong .bob {
      animation: shake .35s ease;
    }
    @keyframes shake {
      0%,100%{ transform: translateX(0); }
      20%{ transform: translateX(-5px); }
      40%{ transform: translateX(5px); }
      60%{ transform: translateX(-4px); }
      80%{ transform: translateX(4px); }
    }
    .bubble-text {
      font-weight: 600;
      font-size: 30px;
      fill: #2c2f3a;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      text-transform: capitalize;
    }
    .bubble-icon {
      font-size: 30px;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .anchor-dot {
      fill: #5cb84d;
    }
    .maze-wall {
      stroke: #7c8aa6;
      stroke-width: 5;
      stroke-linecap: round;
      fill: none;
      opacity: 0.9;
    }
    .stub-line {
      stroke: #c9c2a8;
      stroke-width: 5;
      stroke-linecap: round;
      fill: none;
    }
    .solve-path {
      fill: none;
      stroke: #4caf3d;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.9;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    button {
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(#ffd873, #f4a821);
      color: #4a2e05;
      box-shadow: 0 4px 0 #c17d0f, 0 6px 10px #00000030;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #c17d0f, 0 2px 4px #00000030;
    }
    button.secondary {
      background: linear-gradient(#eaf3ff, #bcd8ff);
      color: #1c3a63;
      box-shadow: 0 4px 0 #7fa7d8, 0 6px 10px #00000020;
    }
    button.secondary:active {
      box-shadow: 0 1px 0 #7fa7d8, 0 2px 4px #00000020;
    }
    .status {
      text-align: center;
      margin-top: 10px;
      min-height: 22px;
      font-weight: 700;
      color: #2f5127;
      font-size: 14px;
      display:none;
    }
    /* ===== POPUP ===== */
    .kid-popup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 20px;
    }
    .kid-card {
      background: #ffffff;
      width: 380px;
      max-width: 95%;
      padding: 32px 28px;
      border-radius: 44px;
      text-align: center;
      animation: kidPop 0.6s ease;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }
    .kid-card::before,
    .kid-card::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
      pointer-events: none;
    }
    .kid-card::before {
      width: 200px;
      height: 200px;
      top: -80px;
      right: -60px;
      background: #ffd93d;
    }
    .kid-card::after {
      width: 150px;
      height: 150px;
      bottom: -60px;
      left: -50px;
      background: #6bcbff;
    }
    .kid-card>* {
      position: relative;
      z-index: 2;
    }
    .kid-icon {
      font-size: 4.8em;
      margin-bottom: 6px;
      animation: emojiBounce 0.9s infinite alternate;
      display: inline-block;
    }
    .kid-card h3 {
      font-size: 2.2em;
      margin-bottom: 4px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .kid-card p {
      font-size: 1.1em;
      color: #555;
      margin-top: 2px;
      font-weight: 500;
    }
    .kid-correct .kid-card {
      background: linear-gradient(145deg, #f0fff4, #d4f5e6);
      border: 5px solid #38d9a9;
    }
    .kid-correct .kid-card h3 {
      color: #0b8a4a;
    }
    .kid-correct .kid-card p {
      color: #1a6a3a;
    }
    .kid-wrong .kid-card {
      background: linear-gradient(145deg, #fff5f5, #fce4e4);
      border: 5px solid #ff8a8a;
    }
    .kid-wrong .kid-card h3 {
      color: #c0392b;
    }
    .kid-wrong .kid-card p {
      color: #922b21;
    }
    @keyframes kidPop {
      0% { transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg); opacity: 0; }
      50% { transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0) perspective(400px) rotateX(0); opacity: 1; }
    }
    @keyframes emojiBounce {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-12px) scale(1.05); }
    }
    /* ===== FINAL POPUP ===== */
    #finalPopup {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 4000;
      padding: 20px;
    }
    .final-kid-box {
      background: linear-gradient(145deg, #fff7d6, #e6fff5);
      padding: 35px 40px;
      border-radius: 44px;
      text-align: center;
      width: 480px;
      max-width: 95%;
      animation: finalBounce 0.8s ease;
      border: 4px solid rgba(255, 255, 255, 0.6);
      position: relative;
      overflow: hidden;
    }
    .final-kid-box::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      top: -120px;
      right: -100px;
      background: #ffd93d;
      border-radius: 50%;
      opacity: 0.15;
      pointer-events: none;
    }
    .final-kid-box>* {
      position: relative;
      z-index: 2;
    }
    .final-kid-box h2 {
      font-size: 2.4em;
      color: #2f9e44;
      margin-bottom: 8px;
      font-weight: 700 !important;
    }
    .final-kid-box p {
      font-size: 1.3em;
      font-weight: 600;
      color: #2d3a3a;
    }
    #stars {
      font-size: 2.6em;
      margin: 14px 0;
      letter-spacing: 6px;
    }
    .playAgain-btn {
      background: #ffac30;
      color: white;
      border: none;
      padding: 16px 38px;
      border-radius: 40px;
      font-size: 1.15em;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
      box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
      letter-spacing: 0.5px;
    }
    .playAgain-btn:hover {
      transform: translateY(-3px);
    }
    .playAgain-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #d4871f;
    }
    @keyframes finalBounce {
      0% { transform: scale(0.3) perspective(400px) rotateX(15deg); opacity: 0; }
      50% { transform: scale(1.08) perspective(400px) rotateX(-5deg); opacity: 1; }
      100% { transform: scale(1) perspective(400px) rotateX(0); opacity: 1; }
    }
    /* ============================================================ */
    /* ===== RESPONSIVE MEDIA QUERIES ===== */
    /* ============================================================ */
    @media screen and (min-width: 1324px) and (max-width: 1640px) {
      .stage { width: 1100px; }
      .board-wrap { padding: 20px; border-width: 10px; }
      h1 { font-size: 32px; }
      .sub { font-size: 20px; }
      svg { max-width: 1000px; }
      .bubble-text { font-size: 35px; }
      .controls button { padding: 10px 20px; font-size: 14px; }
      .kid-card { width: 460px; padding: 38px 34px; }
      .kid-icon { font-size: 5.4em; }
      .final-kid-box { width: 560px; padding: 42px; }
      .final-kid-box h2 { font-size: 2.8em; }
      #stars { font-size: 2.8em; }
      .playAgain-btn { padding: 18px 44px; font-size: 1.3em; }
    }
    @media screen and (max-width: 1199px) and (min-width: 1025px) {
      .stage { width: 990px; }
      .board-wrap { padding: 18px; border-width: 9px; border-radius: 25px; }
      h1 { font-size: 29px; }
      .sub { font-size: 20px; }
      svg { max-width: 700px; }
      .controls button { padding: 9px 18px; font-size: 13px; }
      .bubble-text { font-size: 35px; }
    }
    @media screen and (max-width: 1024px) and (min-width: 861px) {
      .stage { width: 1000px; padding: 0px; }
      .board-wrap { padding: 1px; border-width: 8px; border-radius: 22px; }
      .board-wrap::before, .board-wrap::after { width: 28px; height: 28px; }
      .board-wrap::before { top: -14px; left: -14px; }
      .board-wrap::after { bottom: -14px; right: -14px; }
      h1 { font-size: 28px; }
      .sub { font-size: 1.2rem; }
      svg { max-width: 730px;  }
      .controls button { padding: 8px 16px; font-size: 12px; }
      .bubble-text { font-size: 40px;  }
    }
    @media screen and (max-width: 860px) and (min-width: 741px) {
      .stage { max-width: 900px; padding: 8px; }
      .board-wrap { padding: 14px; border-width: 7px; border-radius: 20px; }
      .board-wrap::before, .board-wrap::after { width: 24px; height: 24px; }
      .board-wrap::before { top: -12px; left: -12px; }
      .board-wrap::after { bottom: -12px; right: -12px; }
      h1 { font-size: 28px; }
      .sub { font-size: 1.2rem; margin-bottom: 10px; }
      svg { max-width: 600px; }
      .bubble-text { font-size: 40px;  }
      .controls button { padding: 7px 14px; font-size: 11px; }
      
      .maze-wall { stroke-width: 3.5; }
      .stub-line { stroke-width: 4; }
      .solve-path { stroke-width: 5; }
    }
    @media screen and (max-width: 740px) and (min-width: 621px) {
      .stage { max-width: 660px; padding: 6px; }
      .board-wrap { padding: 12px; border-width: 6px; border-radius: 18px; }
      .board-wrap::before, .board-wrap::after { width: 20px; height: 20px; }
      .board-wrap::before { top: -10px; left: -10px; }
      .board-wrap::after { bottom: -10px; right: -10px; }
      h1 { font-size: 20px; }
      .sub { font-size: 11px; margin-bottom: 8px; }
      svg { max-width: 600px; }
      .controls button { padding: 6px 12px; font-size: 10px; gap: 6px; }
      .bubble-text { font-size: 14px; }
      .maze-wall { stroke-width: 3; }
      .stub-line { stroke-width: 3.5; }
      .solve-path { stroke-width: 4.5; }
      .status { font-size: 12px; min-height: 18px; }
    }
    @media screen and (max-width: 620px) {
      body { padding: 6px; }
      .stage { max-width: 100%; padding: 4px; }
      .header-container { flex-direction: column; align-items: center; text-align: center; }
      .sub { text-align: center; }
      .board-wrap { 
        padding: 8px; 
        border-width: 5px; 
        border-radius: 16px;
      }
      .board-wrap::before, .board-wrap::after { 
        width: 16px; 
        height: 16px; 
      }
      .board-wrap::before { top: -8px; left: -8px; }
      .board-wrap::after { bottom: -8px; right: -8px; }
      h1 { font-size: 17px; margin-bottom: 2px; }
      .sub { font-size: 10px; margin-bottom: 6px; }
      svg { max-width: 100%; }
      .controls button { 
        padding: 5px 10px; 
        font-size: 9px; 
      }
      .bubble-text { font-size: 12px; }
      .maze-wall { stroke-width: 2.5; }
      .stub-line { stroke-width: 3; }
      .solve-path { stroke-width: 4; }
      .status { font-size: 10px; min-height: 16px; margin-top: 6px; }
      .kid-card { width: 260px; padding: 16px 14px; border-radius: 28px; }
      .kid-icon { font-size: 2.8em; }
      .kid-card h3 { font-size: 1.3em; }
      .final-kid-box { width: 92%; padding: 16px; border-radius: 28px; }
      .final-kid-box h2 { font-size: 1.3em; }
      #stars { font-size: 1.6em; }
      .playAgain-btn { padding: 8px 18px; font-size: 0.8em; }
    }
    @media screen and (max-width: 360px) {
      body { padding: 4px; }
      .board-wrap { padding: 5px; border-width: 4px; border-radius: 12px; }
      .board-wrap::before, .board-wrap::after { width: 12px; height: 12px; }
      .board-wrap::before { top: -6px; left: -6px; }
      .board-wrap::after { bottom: -6px; right: -6px; }
      h1 { font-size: 14px; }
      .sub { font-size: 9px; }
      .controls button { padding: 4px 8px; font-size: 8px; }
      .bubble-text { font-size: 10px; }
      .maze-wall { stroke-width: 2; }
      .stub-line { stroke-width: 2.5; }
      .solve-path { stroke-width: 3.5; }
      .kid-card { width: 220px; padding: 12px 10px; border-radius: 24px; }
      .kid-icon { font-size: 2.2em; }
      .kid-card h3 { font-size: 1.1em; }
      .final-kid-box { width: 94%; padding: 12px; border-radius: 24px; }
      .final-kid-box h2 { font-size: 1.1em; }
      #stars { font-size: 1.4em; }
      .playAgain-btn { padding: 6px 14px; font-size: 0.7em; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      body { padding: 4px; align-items: flex-start; }
      .stage { padding: 4px; max-width: 98%; }
      .header-container { flex-direction: row; }
      .sub { text-align: right; }
      .board-wrap { padding: 6px; border-width: 4px; border-radius: 12px; }
      .board-wrap::before, .board-wrap::after { width: 14px; height: 14px; }
      .board-wrap::before { top: -6px; left: -6px; }
      .board-wrap::after { bottom: -6px; right: -6px; }
      h1 { font-size: 14px; margin-bottom: 1px; }
      .sub { font-size: 8px; margin-bottom: 4px; }
      svg { max-width: 70%; margin: 0 auto; }
      .controls button { padding: 3px 8px; font-size: 8px; }
      .status { font-size: 8px; min-height: 12px; }
      .bubble-text { font-size: 10px; }
      .maze-wall { stroke-width: 2; }
      .stub-line { stroke-width: 2.5; }
      .solve-path { stroke-width: 3; }
      .kid-card { width: 200px; padding: 12px 10px; border-radius: 20px; }
      .kid-icon { font-size: 2em; }
      .kid-card h3 { font-size: 1em; }
      .kid-card p { font-size: 0.7em; }
      .final-kid-box { width: 60%; padding: 10px; border-radius: 20px; }
      .final-kid-box h2 { font-size: 1em; }
      #stars { font-size: 1.2em; }
      .playAgain-btn { padding: 4px 12px; font-size: 0.6em; }
    }
    @media print {
      body { background: white; padding: 20px; }
      .board-wrap { box-shadow: none; border: 2px solid #333; }
      .controls button { display: none; }
    }
    .solve-path {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.9;
    }
    .path-glow {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.25;
    }
    /* all borders same initially - using a uniform color */
    .cell-word .bubble-rect {
      stroke: #7c8aa6;
      stroke-width: 3;
      fill: #ffffff;
    }
    /* matched state - change bg color and keep border */
    .cell-word.matched .bubble-rect {
      fill: var(--match-color, #d4edda);
      stroke: #7c8aa6;
      stroke-width: 3;
    }
    /* selected state override */
    .cell-word.selected .bubble-rect {
      stroke: #ffffff;
      stroke-width: 3;
      fill: #ffffff;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="header-container">
      <h1>Antonyms</h1>
      <p class="sub">Tap a word, then tap its match. Trace the maze path together!</p>
    </div>
    <div class="board-wrap">
      <div class="svg-container">
        <svg id="mazeSvg" viewBox="0 0 1256 832" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>
    <div class="status" id="status"></div>
  </div>
  <!-- ===== POPUPS ===== -->
  <div id="answerPopup" class="kid-popup">
    <div class="kid-card">
      <div class="kid-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>
  <div id="finalPopup">
    <div class="final-kid-box">
      <h2>🎉 Congratulations!</h2>
      <p id="finalScore"></p>
      <div id="stars">⭐⭐⭐⭐⭐</div>
      <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>
  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
  <script>
    (function(){
      // ---------- CONFIG ----------
      const COLS = 13, ROWS = 9, CELL = 40;
      const OX = 368, OY = 236;
      const STUB = 34;
      const PAIRS = [
        ['soon', 'late'],
        ['request', 'order'],
        ['decrease', 'increase'],
        ['damage', 'repair'],
        ['small', 'large'],
      ];
      const positionMap = {
        'soon': { side: 'top', pos: 1 },
        'late': { side: 'bottom', pos: 1 },
        'request': { side: 'top', pos: 6 },
        'order': { side: 'bottom', pos: 6 },
        'decrease': { side: 'left', pos: 2 },
        'increase': { side: 'right', pos: 2 },
        'damage': { side: 'left', pos: 6 },
        'repair': { side: 'right', pos: 6 },
        'small': { side: 'top', pos: 11 },
        'large': { side: 'bottom', pos: 11 }
      };
      const colorPairs = {
        'soon': ['#fff3d6','#f4a821'],
        'late': ['#fff3d6','#f4a821'],
        'request': ['#f1e4fc','#9b5fe0'],
        'order': ['#f1e4fc','#9b5fe0'],
        'decrease': ['#e0f0ff','#3f8fe0'],
        'increase': ['#e0f0ff','#3f8fe0'],
        'damage': ['#ffe3ea','#f0577a'],
        'repair': ['#ffe3ea','#f0577a'],
        'small': ['#e8f6dc','#6fae33'],
        'large': ['#e8f6dc','#6fae33']
      };
      // Icons for each word (emoji, matches reference art concept)
    const iconMap = {
    soon: "../assets/images/soon.png",
    late: "../assets/images/late.png",
    request: "../assets/images/request1.png",
    order: "../assets/images/order1.png",
    decrease: "../assets/images/decrease.png",
    increase: "../assets/images/increase.png",
    damage: "../assets/images/damage1.png",
    repair: "../assets/images/repair1.png",
    small: "../assets/images/small.png",
    large: "../assets/images/large.png"
};
      const WORDS = {};
      for (const word in positionMap) {
        WORDS[word] = {
          side: positionMap[word].side,
          pos: positionMap[word].pos,
          color: colorPairs[word] || ['#ffd873','#f4a821'],
          icon: iconMap[word] || '📌'
        };
      }
      const PATH_COLORS = [
        "#ff5252", "#3b82f6", "#22c55e", "#f59e0b", 
        "#a855f7", "#06b6d4", "#ec4899"
      ];
      const svg = document.getElementById('mazeSvg');
      const statusEl = document.getElementById('status');
      const stage = document.getElementById('stage');
      const popupOverlay = document.getElementById("answerPopup");
      const popupIcon = document.getElementById("popupIcon");
      const popupTitle = document.getElementById("popupTitle");
      const popupMsg = document.getElementById("popupMsg");
      const finalPopup = document.getElementById("finalPopup");
      const starsEl = document.getElementById("stars");
      let grid;
      let matchedWords = new Set();
      let selected = null;
      let isGameComplete = false;
      let pathCount = 0;
      let usedPathCells = new Map();
      let popupTimer = null;
      let finalTriggered = false;
      function speak(t) {
        speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(t);
        msg.lang = "en-US";
        msg.volume = 0.25;
        msg.rate = 1;
        msg.pitch = 1;
        speechSynthesis.speak(msg);
      }
      function resetPathHistory() {
        usedPathCells.clear();
      }
      function generateMaze() {
        const cells = [];
        for (let y = 0; y < ROWS; y++) {
          const row = [];
          for (let x = 0; x < COLS; x++) {
            row.push({
              top: true, right: true, bottom: true, left: true,
              visited: false,
              penalty: 0
            });
          }
          cells.push(row);
        }
        const stack = [];
        let cx = 0, cy = 0;
        cells[cy][cx].visited = true;
        stack.push([cx, cy]);
        function neighbors(x, y) {
          const list = [];
          if (y > 0 && !cells[y-1][x].visited) list.push([x, y-1, 'top', 'bottom']);
          if (x < COLS-1 && !cells[y][x+1].visited) list.push([x+1, y, 'right', 'left']);
          if (y < ROWS-1 && !cells[y+1][x].visited) list.push([x, y+1, 'bottom', 'top']);
          if (x > 0 && !cells[y][x-1].visited) list.push([x-1, y, 'left', 'right']);
          return list;
        }
        while (stack.length) {
          const [x, y] = stack[stack.length-1];
          const opts = neighbors(x, y);
          if (opts.length === 0) { stack.pop(); continue; }
          const [nx, ny, wallA, wallB] = opts[Math.floor(Math.random() * opts.length)];
          cells[y][x][wallA] = false;
          cells[ny][nx][wallB] = false;
          cells[ny][nx].visited = true;
          stack.push([nx, ny]);
        }
        const extraRemovals = Math.floor((COLS * ROWS) * 0.28);
        for (let i = 0; i < extraRemovals; i++) {
          const x = Math.floor(Math.random() * COLS);
          const y = Math.floor(Math.random() * ROWS);
          const walls = [];
          if (y > 0 && cells[y][x].top) walls.push(['top', y-1, x, 'bottom']);
          if (x < COLS-1 && cells[y][x].right) walls.push(['right', y, x+1, 'left']);
          if (y < ROWS-1 && cells[y][x].bottom) walls.push(['bottom', y+1, x, 'top']);
          if (x > 0 && cells[y][x].left) walls.push(['left', y, x-1, 'right']);
          if (walls.length > 0) {
            const [wallA, ny, nx, wallB] = walls[Math.floor(Math.random() * walls.length)];
            cells[y][x][wallA] = false;
            cells[ny][nx][wallB] = false;
          }
        }
        return cells;
      }
      function entryCell(side, pos) {
        if (side === 'top') return {x:pos, y:0};
        if (side === 'bottom') return {x:pos, y:ROWS-1};
        if (side === 'left') return {x:0, y:pos};
        if (side === 'right') return {x:COLS-1, y:pos};
      }
      function cellCenter(cx, cy) {
        return { x: OX + cx*CELL + CELL/2, y: OY + cy*CELL + CELL/2 };
      }
      function outsidePoint(side, cx, cy) {
        const c = cellCenter(cx, cy);
        if (side === 'top') return { x:c.x, y:c.y - CELL/2 - STUB };
        if (side === 'bottom') return { x:c.x, y:c.y + CELL/2 + STUB };
        if (side === 'left') return { x:c.x - CELL/2 - STUB, y:c.y };
        if (side === 'right') return { x:c.x + CELL/2 + STUB, y:c.y };
      }
      function findPath(fromCell, toCell, avoidOverlap = true) {
        const key = (x, y) => x + ',' + y;
        if (fromCell.x === toCell.x && fromCell.y === toCell.y) {
          return [{ ...fromCell }];
        }
        function heuristic(x1, y1, x2, y2) {
          return Math.abs(x1 - x2) + Math.abs(y1 - y2);
        }
        function getNeighbors(x, y) {
          const result = [];
          const cell = grid[y][x];
          if (!cell.top && y > 0) result.push({ x, y: y-1, dir: 'top' });
          if (!cell.right && x < COLS-1) result.push({ x: x+1, y, dir: 'right' });
          if (!cell.bottom && y < ROWS-1) result.push({ x, y: y+1, dir: 'bottom' });
          if (!cell.left && x > 0) result.push({ x: x-1, y, dir: 'left' });
          return result;
        }
        const startKey = key(fromCell.x, fromCell.y);
        const goalKey = key(toCell.x, toCell.y);
        const openSet = [];
        const closedSet = new Set();
        const gScore = new Map();
        const fScore = new Map();
        const cameFrom = new Map();
        const dirFrom = new Map();
        gScore.set(startKey, 0);
        fScore.set(startKey, heuristic(fromCell.x, fromCell.y, toCell.x, toCell.y));
        openSet.push({ key: startKey, x: fromCell.x, y: fromCell.y, f: fScore.get(startKey) });
        while (openSet.length > 0) {
          openSet.sort((a, b) => a.f - b.f);
          const current = openSet.shift();
          if (current.key === goalKey) {
            const path = [];
            let curKey = goalKey;
            while (curKey) {
              const [cx, cy] = curKey.split(',').map(Number);
              path.unshift({ x: cx, y: cy });
              curKey = cameFrom.get(curKey);
              if (curKey === startKey) {
                const [sx, sy] = startKey.split(',').map(Number);
                path.unshift({ x: sx, y: sy });
                break;
              }
            }
            return path;
          }
          closedSet.add(current.key);
          const neighbors = getNeighbors(current.x, current.y);
          for (const neighbor of neighbors) {
            const nKey = key(neighbor.x, neighbor.y);
            if (closedSet.has(nKey)) continue;
            let tentativeG = gScore.get(current.key) + 1;
            if (avoidOverlap) {
              const usageCount = usedPathCells.get(nKey) || 0;
              if (usageCount > 0) {
                tentativeG += 5 + (usageCount * 3);
              }
            }
            const distFromSource = Math.abs(neighbor.x - fromCell.x) + Math.abs(neighbor.y - fromCell.y);
            const distFromTarget = Math.abs(neighbor.x - toCell.x) + Math.abs(neighbor.y - toCell.y);
            const corridor = Math.abs(fromCell.x - toCell.x) + Math.abs(fromCell.y - toCell.y);
            const localBias = Math.max(0, (distFromSource + distFromTarget) - corridor - 4);
            tentativeG += localBias * 0.5;
            const prevDir = dirFrom.get(current.key);
            if (prevDir && prevDir !== neighbor.dir) {
              tentativeG += 0.8;
            }
            if (!gScore.has(nKey) || tentativeG < gScore.get(nKey)) {
              cameFrom.set(nKey, current.key);
              gScore.set(nKey, tentativeG);
              const h = heuristic(neighbor.x, neighbor.y, toCell.x, toCell.y);
              fScore.set(nKey, tentativeG + h);
              dirFrom.set(nKey, neighbor.dir);
              const existing = openSet.find(item => item.key === nKey);
              if (existing) {
                existing.f = tentativeG + h;
              } else {
                openSet.push({ key: nKey, x: neighbor.x, y: neighbor.y, f: tentativeG + h });
              }
            }
          }
        }
        if (avoidOverlap) {
          return findPath(fromCell, toCell, false);
        }
        return [{ ...fromCell }, { ...toCell }];
      }
      function showPopup(isCorrect, delay = 0) {
        if (popupTimer) {
          clearTimeout(popupTimer);
          popupTimer = null;
        }
        popupTimer = setTimeout(() => {
          popupOverlay.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
          popupOverlay.style.display = "flex";
          if (isCorrect) {
            popupIcon.textContent = "🌟";
            popupTitle.textContent = "Amazing!";
            popupMsg.textContent = "Perfect match! ✨";
            smallConfetti();
          } else {
            popupIcon.textContent = "😒";
            popupTitle.textContent = "Keep Going!";
            popupMsg.textContent = "Try again, you can do it! 🌈";
          }
          const sound = document.getElementById(isCorrect ? "correctSound" : "wrongSound");
          if (sound) sound.play().catch(() => {});
          setTimeout(() => {
            popupOverlay.style.display = "none";
            popupTimer = null;
          }, 1800);
        }, delay);
      }
      function showFinalPopup() {
        finalPopup.style.display = "flex";
        document.getElementById("finalScore").textContent =
        `Your Score: ${PAIRS.length} / ${PAIRS.length}`;
        starsEl.textContent = "⭐".repeat(Object.keys(WORDS).length / 2);
        bigConfetti();
      }
      function smallConfetti() { 
        confetti({ particleCount: 35, spread: 70, origin: { y: 0.7 } }); 
      }
      function bigConfetti() {
        confetti({ particleCount: 200, spread: 110, origin: { y: 0.5 } });
        setTimeout(() => {
          confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.2 } });
          confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.8 } });
        }, 150);
      }
      function svgEl(name, attrs) {
        const el = document.createElementNS('http://www.w3.org/2000/svg', name);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        return el;
      }
      function render() {
        svg.innerHTML = '';
        matchedWords.clear();
        resetPathHistory();
        selected = null;
        isGameComplete = false;
        finalTriggered = false;
        pathCount = 0;
        statusEl.textContent = '';
        finalPopup.style.display = 'none';
        popupOverlay.style.display = 'none';
        if (popupTimer) {
          clearTimeout(popupTimer);
          popupTimer = null;
        }
        grid = generateMaze();
        const wallsGroup = svgEl('g', {});
        const stubsGroup = svgEl('g', {});
        const pathsGroup = svgEl('g', { id:'pathsGroup' });
        const wordsGroup = svgEl('g', {});
        const entrySet = new Set();
        let wordIdx = 0;
        for (const w in WORDS) {
          const info = WORDS[w];
          const ec = entryCell(info.side, info.pos);
          entrySet.add(ec.x+','+ec.y+':'+info.side);
        }
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            const c = grid[y][x];
            const p0 = { x: OX + x*CELL, y: OY + y*CELL };
            if (c.top) {
              const skip = y === 0 && entrySet.has(x+','+y+':top');
              if (!skip) wallsGroup.appendChild(svgEl('line', {
                x1:p0.x, y1:p0.y, x2:p0.x+CELL, y2:p0.y, class:'maze-wall'
              }));
            }
            if (c.left) {
              const skip = x === 0 && entrySet.has(x+','+y+':left');
              if (!skip) wallsGroup.appendChild(svgEl('line', {
                x1:p0.x, y1:p0.y, x2:p0.x, y2:p0.y+CELL, class:'maze-wall'
              }));
            }
            if (y === ROWS-1 && c.bottom) {
              const skip = entrySet.has(x+','+(y)+':bottom');
              if (!skip) wallsGroup.appendChild(svgEl('line', {
                x1:p0.x, y1:p0.y+CELL, x2:p0.x+CELL, y2:p0.y+CELL, class:'maze-wall'
              }));
            }
            if (x === COLS-1 && c.right) {
              const skip = entrySet.has(x+','+y+':right');
              if (!skip) wallsGroup.appendChild(svgEl('line', {
                x1:p0.x+CELL, y1:p0.y, x2:p0.x+CELL, y2:p0.y+CELL, class:'maze-wall'
              }));
            }
          }
        }
        for (const w in WORDS) {
          const info = WORDS[w];
          const ec = entryCell(info.side, info.pos);
          const inner = cellCenter(ec.x, ec.y);
          const outer = outsidePoint(info.side, ec.x, ec.y);
          const bpos = bubblePos(info.side, outer, info.pos);
          stubsGroup.appendChild(svgEl('line', {
            x1:inner.x, y1:inner.y, x2:outer.x, y2:outer.y, class:'stub-line'
          }));
          stubsGroup.appendChild(svgEl('circle', {
            cx:outer.x, cy:outer.y, r:6, class:'anchor-dot'
          }));
          const g = svgEl('g', { class:'cell-word', 'data-word':w });
          const isVertical = (info.side === 'top' || info.side === 'bottom');
          let rect, iconText, text;
          if (isVertical) {
            const bw = 190, bh = 168;
            rect = svgEl('rect', {
              x:bpos.x-bw/2, y:bpos.y-bh/2, width:bw, height:bh, rx:26, ry:26,
              fill:"#ffffff", class:'bubble-rect', stroke:'#7c8aa6', 'stroke-width':3
            });
       const iconSize = 100;

iconText = svgEl('image', {
    href: info.icon,
    x: bpos.x - (iconSize / 2),
    y: bpos.y - (bh / 2) + 20,
    width: iconSize,
    height: iconSize,
    preserveAspectRatio: "xMidYMid meet"
});
            text = svgEl('text', {
              x:bpos.x, y:bpos.y+bh/2-32, class:'bubble-text',
              'text-anchor':'middle'
            });
          } else {
            const bw = 300, bh = 108;
            const padding = 30;
            const iconSize = 100;
            const gap = 90;
            rect = svgEl('rect', {
              x: bpos.x - bw / 2,
              y: bpos.y - bh / 2,
              width: bw,
              height: bh,
              rx: 26,
              ry: 26,
              fill: "#ffffff",
              class: "bubble-rect",
              stroke: '#7c8aa6',
              "stroke-width": 3
            });
            const iconX = bpos.x - bw / 2 + padding + iconSize / 2;
           iconText = svgEl('image', {
    href: info.icon,
    x: iconX - iconSize / 2,
    y: bpos.y - iconSize / 2,
    width: iconSize,
    height: iconSize,
    preserveAspectRatio: "xMidYMid meet"
});
            const textX = iconX + (iconSize / 2) + gap;
            text = svgEl('text', {
              x: textX,
              y: bpos.y + 2,
              class: 'bubble-text',
              'text-anchor': 'start',
              'dominant-baseline': 'middle'
            });
          }
    
          text.textContent = w;
          const bob = svgEl('g', { class:'bob' });
          bob.appendChild(rect);
          bob.appendChild(iconText);
          bob.appendChild(text);
          g.appendChild(bob);
          g.style.setProperty('--pop-delay', (wordIdx * 0.07) + 's');
          g.style.setProperty('--bob-delay', (0.6 + (wordIdx % 5) * 0.35) + 's');
          g.addEventListener('click', () => onWordClick(w));
          wordsGroup.appendChild(g);
          wordIdx++;
        }
        svg.appendChild(wallsGroup);
        svg.appendChild(stubsGroup);
        svg.appendChild(pathsGroup);
        svg.appendChild(wordsGroup);
        stage.classList.remove('slide-in');
        void stage.offsetWidth;
        stage.classList.add('slide-in');
      }
      function bubblePos(side, outer, pos) {
        const gapV = 104;
        const gapH = 170;
        const off = { x: 0, y: 0 };
        if (side === 'top') off.y = -gapV;
        else if (side === 'bottom') off.y = gapV;
        else if (side === 'left') off.x = -gapH;
        else if (side === 'right') off.x = gapH;
        return { x: outer.x + off.x, y: outer.y + off.y };
      }
      function onWordClick(word) {
        if (isGameComplete || matchedWords.has(word)) return;
        if (selected === null) {
          selected = word;
          setSelectedClass(word, true);
          return;
        }
        if (selected === word) {
          setSelectedClass(word, false);
          selected = null;
          return;
        }
        const isPair = PAIRS.some(p => (p[0] === selected && p[1] === word) || (p[1] === selected && p[0] === word));
        if (isPair) {
          matchedWords.add(selected);
          matchedWords.add(word);
          const wordA = selected;
          const wordB = word;
          drawSolvedPath(wordA, wordB, () => {
            showPopup(true, 100);
            if (matchedWords.size === Object.keys(WORDS).length && !finalTriggered) {
              finalTriggered = true;
              isGameComplete = true;
              setTimeout(() => {
                statusEl.textContent = '';
                showFinalPopup();
              }, 1900);
            }
          });
          markMatched(selected);
          markMatched(word);
          setSelectedClass(selected, false);
          selected = null;
          statusEl.textContent = 'Nice match! 🌟';
          speak("Correct");
        } else {
          showPopup(false, 50);
          speak("Try again");
          const prevSelected = selected;
          flashWrong(prevSelected);
          flashWrong(word);
          statusEl.textContent = 'Not quite — try again!';
          setSelectedClass(prevSelected, false);
          selected = null;
        }
      }
      function setSelectedClass(word, on) {
        const el = svg.querySelector(`.cell-word[data-word="${word}"]`);
        if (el) el.classList.toggle('selected', on);
      }
      function markMatched(word) {
        const el = svg.querySelector(`.cell-word[data-word="${word}"]`);
        if (el) el.classList.add('matched');
      }
      function flashWrong(word) {
        const el = svg.querySelector(`.cell-word[data-word="${word}"]`);
        if (!el) return;
        el.classList.add('wrong');
        setTimeout(() => el.classList.remove('wrong'), 400);
      }
      function drawSolvedPath(wordA, wordB, onComplete) {
        const pathIndex = pathCount++;
        const pathColor = PATH_COLORS[pathIndex % PATH_COLORS.length];
        const infoA = WORDS[wordA], infoB = WORDS[wordB];
        const ecA = entryCell(infoA.side, infoA.pos);
        const ecB = entryCell(infoB.side, infoB.pos);
        const cellPath = findPath(ecA, ecB, true);
        for (const cell of cellPath) {
          const key = cell.x + ',' + cell.y;
          usedPathCells.set(key, (usedPathCells.get(key) || 0) + 1);
        }
        const outerA = outsidePoint(infoA.side, ecA.x, ecA.y);
        const outerB = outsidePoint(infoB.side, ecB.x, ecB.y);
        const angle = (pathIndex / PATH_COLORS.length) * Math.PI * 2;
        const offsetMagnitude = 4 + (pathIndex % 3) * 2;
        const offX = Math.cos(angle) * offsetMagnitude;
        const offY = Math.sin(angle) * offsetMagnitude;
        const pts = [{ x: outerA.x + offX, y: outerA.y + offY }];
        for (let i = 0; i < cellPath.length; i++) {
          const c = cellPath[i];
          const p = cellCenter(c.x, c.y);
          const pointOffX = (Math.random() - 0.5) * 1.5;
          const pointOffY = (Math.random() - 0.5) * 1.5;
          pts.push({ 
            x: p.x + offX + pointOffX, 
            y: p.y + offY + pointOffY 
          });
        }
        pts.push({ x: outerB.x + offX, y: outerB.y + offY });
        const d = pts.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
        const glowEl = svgEl("path", {
          d,
          fill: "none",
          stroke: pathColor,
          "stroke-width": 14,
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
          "opacity": "0.2"
        });
        document.getElementById('pathsGroup').appendChild(glowEl);
        const pathEl = svgEl("path", {
          d,
          fill: "none",
          stroke: pathColor,
          "stroke-width": 5,
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
          "opacity": "0.95"
        });
        document.getElementById('pathsGroup').appendChild(pathEl);
        // Change bg color of matched bubbles
        const bubbleA = svg.querySelector(`.cell-word[data-word="${wordA}"] .bubble-rect`);
        const bubbleB = svg.querySelector(`.cell-word[data-word="${wordB}"] .bubble-rect`);
        [bubbleA, bubbleB].forEach(rect => {
          if (!rect) return;
          // set background color to a soft version of the path color
          rect.setAttribute("fill", pathColor + '33'); // 20% opacity
          rect.style.setProperty('--match-color', pathColor + '33');
        });
        const len = pathEl.getTotalLength();
        pathEl.style.strokeDasharray = len;
        pathEl.style.strokeDashoffset = len;
        glowEl.style.strokeDasharray = len;
        glowEl.style.strokeDashoffset = len;
        pathEl.style.transition = 'none';
        glowEl.style.transition = 'none';
        requestAnimationFrame(() => {
          const duration = Math.min(1.2, 0.3 + len/900);
          pathEl.style.transition = `stroke-dashoffset ${duration}s ease`;
          glowEl.style.transition = `stroke-dashoffset ${duration}s ease`;
          pathEl.style.strokeDashoffset = 0;
          glowEl.style.strokeDashoffset = 0;
          setTimeout(() => {
            if (onComplete) onComplete();
          }, duration * 1000 + 50);
        });
      }
      render();
    })();
  </script>
</body>
</html>
