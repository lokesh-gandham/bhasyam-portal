        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }


        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

        }

        .quiz-wrapper {
            width: 100%;
            width: 1100px;

            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #2f4f4f;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 3px dashed #d5c8ec;
        }

        h1 span {
            font-size: 28px;
        }

        h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #5a6a6a;
            display: block;
            margin-top: 2px;
        }

        /* ===== QUESTION DISPLAY ===== */
        .question-display {
            padding: 24px 28px;
            margin: 16px 0 24px;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: start;
        }

        .question-text {
            font-size: 30px;
            font-weight: 400;
            color: #1e3a3a;
            line-height: 1.4;
        }

        .question-text .label {
            font-weight: 700;
            color: #4a6a6a;
            margin-right: 8px;
            display: none;
        }

        /* ===== EMOJI OPTIONS ===== */
        .emoji-options {
            display: flex;
            justify-content: center;
            gap: 44px;
            margin: 20px 0 28px;
        }

      .emoji-btn{
    width:190px;
    height:190px;
    border:4px solid #d5c8ec;
    border-radius:28px;
    background:#fff;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.3s;
    overflow:hidden;
}

.emoji-btn img{
    width:90%;
    height:90%;
    object-fit:contain;

    /* Initially black & white */
    filter:grayscale(0%);
    transition:.4s;
}

.emoji-btn:hover:not(.disabled){
    transform:scale(1.05);
}

.emoji-btn.correct img{
    filter:grayscale(0%);
}

.emoji-btn.wrong{
    animation:shake .5s;
}

.emoji-btn.disabled{
    opacity:.55;
    pointer-events:none;
}
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-12px);
            }

            40% {
                transform: translateX(12px);
            }

            60% {
                transform: translateX(-8px);
            }

            80% {
                transform: translateX(8px);
            }
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            gap: 12px;
        }

        .controls button {
            width: 140px;
            padding: 13px 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            border-radius: 35px;
            border: 3px solid #ffffff;
            font-size: 20px;
            font-weight: 400;
            color: #ffffff;
            cursor: pointer;
            transition: background 0.2s ease;


        }

        #prevBtn {
            background: #7fc0eb;
        }

        #nextBtn {
            background: #ecc74e;
        }

        #prevBtn:active {
            background: #6bb4e4;
        }

        #nextBtn:active {
            background: #e6be3d;
        }

        .controls button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* ===== POPUPS ===== */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;

            padding: 20px;
        }

        .kid-card {
            background: #ffffff;
            width: 380px;
            max-width: 95%;
            padding: 32px 28px;
            border-radius: 44px;
            text-align: center;
            animation: kidPop 0.6s ease;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .kid-card::before,
        .kid-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .kid-card::before {
            width: 200px;
            height: 200px;
            top: -80px;
            right: -60px;
            background: #ffd93d;
        }

        .kid-card::after {
            width: 150px;
            height: 150px;
            bottom: -60px;
            left: -50px;
            background: #6bcbff;
        }

        .kid-card>* {
            position: relative;
            z-index: 2;
        }

        .kid-icon {
            font-size: 4.8em;
            margin-bottom: 6px;
            animation: emojiBounce 0.9s infinite alternate;
            display: inline-block;
        }

        .kid-card h3 {
            font-size: 2.2em;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .kid-card p {
            font-size: 1.1em;
            color: #555;
            margin-top: 2px;
            font-weight: 500;
        }

        .kid-correct .kid-card {
            background: linear-gradient(145deg, #f0fff4, #d4f5e6);
            border: 5px solid #38d9a9;
        }

        .kid-correct .kid-card h3 {
            color: #0b8a4a;
        }

        .kid-correct .kid-card p {
            color: #1a6a3a;
        }

        .kid-correct .kid-card::before {
            background: #38d9a9;
        }

        .kid-correct .kid-card::after {
            background: #38d9a9;
        }

        .kid-wrong .kid-card {
            background: linear-gradient(145deg, #fff5f5, #fce4e4);
            border: 5px solid #ff8a8a;
        }

        .kid-wrong .kid-card h3 {
            color: #c0392b;
        }

        .kid-wrong .kid-card p {
            color: #922b21;
        }

        .kid-wrong .kid-card::before {
            background: #ff8a8a;
        }

        .kid-wrong .kid-card::after {
            background: #ff8a8a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg);
                opacity: 0;
            }

            50% {
                transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0) scale(1);
            }

            to {
                transform: translateY(-12px) scale(1.05);
            }
        }

        /* ===== FINAL POPUP ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;

            padding: 20px;
        }

        .final-kid-box {
            background: linear-gradient(145deg, #fff7d6, #e6fff5);
            padding: 35px 40px;
            border-radius: 44px;
            text-align: center;
            width: 480px;
            max-width: 95%;
            animation: finalBounce 0.8s ease;
            /* box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2); */
            border: 4px solid rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .final-kid-box::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            top: -120px;
            right: -100px;
            background: #ffd93d;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .final-kid-box>* {
            position: relative;
            z-index: 2;
        }

        .final-kid-box h2 {
            font-size: 2.4em;
            color: #2f9e44;
            margin-bottom: 8px;
            font-weight: 700 !important;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
            color: #2d3a3a;
        }

        #stars {
            font-size: 2.6em;
            margin: 14px 0;
            letter-spacing: 6px;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
            letter-spacing: 0.5px;
        }

        .playAgain-btn:hover {
            transform: translateY(-3px);
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #d4871f;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3) perspective(400px) rotateX(15deg);
                opacity: 0;
            }

            50% {
                transform: scale(1.08) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

            .final-kid-box {
                padding: 10px 14px;
                border-radius: 24px;
                width: 70%;
            }

            .final-kid-box h2 {
                font-size: 1em;
            }

            .final-kid-box p {
                font-size: 0.7em;
            }

            #stars {
                font-size: 1.2em;
            }

            .playAgain-btn {
                padding: 4px 12px;
                font-size: 0.65em;
            }
        }
    </style>
</head>

<body>

    <div class="quiz-wrapper" id="quizWrapper">

        <h1>
            <span>👍</span> Good Point &nbsp;·&nbsp; <span>👎</span> Bad Point
            <small>Click the image to answer</small>
        </h1>

        <div class="question-display">
            <div class="question-text" id="questionText"></div>
        </div>

        <div class="emoji-options" id="emojiOptions">

            <button class="emoji-btn image-btn" data-emoji="🙂">
                <img src="../assets/images/up.png" alt="Good">
            </button>

            <button class="emoji-btn image-btn" data-emoji="☹️">
                <img src="../assets/images/down.png" alt="Bad">
            </button>

        </div>

        <div class="controls">
            <button id="prevBtn"><i class="fa-solid fa-angles-left"></i> Prev</button>
            <button id="nextBtn">Next <i class="fa-solid fa-angles-right"></i></button>
        </div>
    </div>

    <!-- ===== POPUPS ===== -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        // ================================================================
        //  DATA
        // ================================================================
        const questions = [
            { id: 'a', text: 'Q1. A minister gave the idea of giving a cow to each villager.', correct: '☹️' },
            { id: 'b', text: 'Q2. Tenali Ramakrishna\'s hunted the rats.', correct: '☹️' },
            { id: 'c', text: 'Q3. The cats became lazy after getting milk easily every day.', correct: '☹️' },
            { id: 'd', text: 'Q4. Tenali Ramakrishna explained to the king what the mistake was.', correct: '🙂' },
            { id: 'e', text: 'Q5. The king told the villagers to stop feeding their cats with milk.', correct: '🙂' }
        ];

        // ================================================================
        //  STATE
        // ================================================================
        let currentIndex = 0;
        let correctCount = 0;
        let status = {};      // { 'a': 'correct' | null }
        let wrongDisabled = {}; // { 'a': true } - track if wrong button was disabled

        // ================================================================
        //  DOM REFS
        // ================================================================
        const questionText = document.getElementById('questionText');
        const emojiBtns = document.querySelectorAll('.emoji-btn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        const popupOverlay = document.getElementById('answerPopup');
        const popupIcon = document.getElementById('popupIcon');
        const popupTitle = document.getElementById('popupTitle');
        const popupMsg = document.getElementById('popupMsg');

        // ================================================================
        //  UTILITIES
        // ================================================================
        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = 'en-US';
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }
        function bigConfetti() {
            confetti({ particleCount: 200, spread: 110, origin: { y: 0.5 } });
            setTimeout(() => {
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.2 } });
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.8 } });
            }, 150);
        }

        // ================================================================
        //  POPUP
        // ================================================================
        function showPopup(isCorrect) {
            popupOverlay.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
            popupOverlay.style.display = 'flex';

            if (isCorrect) {
                popupIcon.textContent = '🌟';
                popupTitle.textContent = 'Amazing!';
                popupMsg.textContent = 'You got it right! ✨';
            } else {
                popupIcon.textContent = '😒';
                popupTitle.textContent = 'Keep Going!';
                popupMsg.textContent = 'Try again, you can do it! 🌈';
            }

            const sound = document.getElementById(isCorrect ? 'correctSound' : 'wrongSound');
            if (sound) sound.play().catch(() => { });

            setTimeout(() => {
                popupOverlay.style.display = 'none';
            }, 1600);
        }

        // ================================================================
        //  SHOW FINAL POPUP
        // ================================================================
        function showFinal() {
            const popup = document.getElementById('finalPopup');
            document.getElementById('finalScore').textContent = `Your Score: ${correctCount} / ${questions.length}`;
            document.getElementById('stars').textContent = '⭐'.repeat(correctCount);
            popup.style.display = 'flex';
            bigConfetti();
            // setTimeout(() => speak(`You scored ${correctCount} out of ${questions.length}`), 400);
        }

        // ================================================================
        //  RENDER QUESTION
        // ================================================================
        function renderQuestion() {
            const q = questions[currentIndex];
            const qid = q.id;

            questionText.innerHTML = `<span class="label">${qid})</span> ${q.text}`;

            // Reset all buttons - remove classes and enable
            emojiBtns.forEach(btn => {
              btn.classList.remove('correct','wrong','disabled');
btn.disabled = false;
            });

            // If already answered correctly, highlight correct and disable only the wrong button
            if (status[qid] === 'correct') {
                const correctEmoji = q.correct;
                emojiBtns.forEach(btn => {
                    if (btn.dataset.emoji === correctEmoji) {
                        btn.classList.add('correct');
                    } else {
                        // Wrong button - disable it
                        btn.classList.add('disabled');
                        btn.disabled = true;
                    }
                });
            } else if (wrongDisabled[qid]) {
                // If wrong button was previously disabled (user clicked wrong), keep it disabled
                const correctEmoji = q.correct;
                emojiBtns.forEach(btn => {
                    if (btn.dataset.emoji !== correctEmoji) {
                        btn.classList.add('disabled');
                        btn.disabled = true;
                    }
                });
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = status[qid] !== 'correct';
        }

        // ================================================================
        //  HANDLE ANSWER
        // ================================================================
        function handleAnswer(emoji) {
            const q = questions[currentIndex];
            const qid = q.id;

            if (status[qid] === 'correct') return;

            const isCorrect = emoji === q.correct;

            if (isCorrect) {
                // Correct answer: highlight correct, disable ONLY the wrong button
                status[qid] = 'correct';
                correctCount++;

                const correctEmoji = q.correct;

                emojiBtns.forEach(btn => {
                    if (btn.dataset.emoji === correctEmoji) {
                        btn.classList.add('correct');
                    } else {
                        // Wrong button - disable it
                        btn.classList.add('disabled');
                        btn.disabled = true;
                    }
                });

                showPopup(true);
                smallConfetti();
                speak('Correct!');
                nextBtn.disabled = false;

                const allAnswered = questions.every(q => status[q.id] === 'correct');
                if (allAnswered) {
                    setTimeout(showFinal, 1800);
                }
            } else {
                // Wrong answer: disable ONLY the wrong button, keep correct enabled
                wrongDisabled[qid] = true;
                showPopup(false);
                speak('Try again!');

                const correctEmoji = q.correct;

                emojiBtns.forEach(btn => {
                    if (btn.dataset.emoji === emoji) {
                        // This is the wrong button - disable it
                        btn.classList.add('wrong');
                        btn.classList.add('disabled');
                        btn.disabled = true;
                        setTimeout(() => {
                            btn.classList.remove('wrong');
                        }, 600);
                    } else if (btn.dataset.emoji === correctEmoji) {
                        // Ensure correct button stays enabled
                        btn.classList.remove('disabled');
                        btn.disabled = false;
                    }
                });
            }
        }

        // ================================================================
        //  NAVIGATION
        // ================================================================
        function goToPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function goToNext() {
            const q = questions[currentIndex];
            if (status[q.id] === 'correct' && currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        // ================================================================
        //  INIT
        // ================================================================
        function init() {
            renderQuestion();

            emojiBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.disabled) return;
                    handleAnswer(btn.dataset.emoji);
                });
            });

            prevBtn.addEventListener('click', goToPrev);
            nextBtn.addEventListener('click', goToNext);
        }

        init();
    </script>
</body>

</html>
