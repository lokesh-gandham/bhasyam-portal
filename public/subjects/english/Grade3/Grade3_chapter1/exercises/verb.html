
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>🐦 Verb Forms · Auto-Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===============================================================
           TOKENS — "Word Safari" (matches the other verb-forms page)
        ================================================================ */
        :root {
            --canopy-deep: #0b3230;
            --canopy-mid: #155e56;
            --canopy-glow: #2c9c85;
            --parchment: #fff8e9;
            --parchment-soft: #fdeecb;
            --mango: #ff9f1c;
            --mango-deep: #d97e0a;
            --lime: #9fd93f;
            --lime-deep: #6ea621;
            --papaya: #ff6b5e;
            --papaya-deep: #d9483d;
            --ink: #16302b;
            --ink-soft: #3d5c53;
            --vine: #2e7d6b;
            --gold-line: #f0c14b;
        }
    @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }

        h1, h2, h3, .display-font {
           font-family: 'CCSyntroman';
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* padding: 18px; */
            overflow-y: auto;
            /* background:
                radial-gradient(circle at 12% 8%, rgba(255, 159, 28, 0.18), transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(159, 217, 63, 0.16), transparent 45%),
                linear-gradient(160deg, var(--canopy-deep) 0%, var(--canopy-mid) 55%, #0d4844 100%); */
            position: relative;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            pointer-events: none;
            opacity: 0.5;
            z-index: 0;
        }

        body::before {
            width: 260px;
            height: 260px;
            top: -80px;
            left: -80px;
            /* background: radial-gradient(circle, rgba(159, 217, 63, 0.35), transparent 70%); */
        }

        body::after {
            width: 320px;
            height: 320px;
            bottom: -100px;
            right: -100px;
            /* background: radial-gradient(circle, rgba(255, 159, 28, 0.28), transparent 70%); */
        }

        .app {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .template {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            /* background: var(--parchment);
            border-radius: 32px;
            padding: 24px 26px 20px;
            border: 4px solid var(--vine);
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.35),
                inset 0 0 0 8px rgba(255, 255, 255, 0.5); */
            position: relative;
            /* background-image:
                radial-gradient(circle at 6px 6px, rgba(46, 125, 107, 0.12) 1.4px, transparent 1.4px);
            background-size: 18px 18px; */
        }

        /* .template::before,
        .template::after {
            content: '🌿';
            position: absolute;
            font-size: 34px;
            opacity: 0.85;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.15));
        } */

        .template::before { top: -18px; left: 18px; transform: rotate(-25deg); }
        .template::after { bottom: -18px; right: 18px; transform: rotate(155deg); }

        /* ===== HEADER ===== */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 10px;
        }

      

        .instruction {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--ink);
            background: var(--parchment-soft);
            padding: 0.45rem 1.1rem;
            border-radius: 60px;
            text-align: center;
            border: 2.5px dashed var(--mango);
        }

        .sub-instruction {

            font-size: 17px;
            font-weight: 500;
            color: #000;
            background: #ffffff;
            padding: 0.45rem 1rem;
            border-radius: 60px;
            text-align: center;
            width: 100%;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
        }

        /* ===== QUESTION IMAGE — Polaroid ===== */
        .question-image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px 0 4px;
            position: relative;
        }

        .question-image-container::before {
            content: '📌';
            position: absolute;
            top: -6px;
            font-size: 26px;
            z-index: 3;
            filter: drop-shadow(0 3px 2px rgba(0,0,0,0.35));
        }

        .question-image {
            width: 180px;
            height: 180px;
            border-radius: 6px;
            object-fit: cover;
            filter: grayscale(100%) contrast(0.9) brightness(0.95);
            transition: all 0.6s ease;
            border: 10px solid #ffffff;
            border-bottom-width: 34px;
            background: #f0ece6;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            transform: rotate(-3deg);
        }

        .question-image.completed {
            filter: grayscale(0%) contrast(1) brightness(1);
            animation: revealImage 0.6s ease;
            box-shadow: 0 0 0 4px var(--gold-line), 0 14px 30px rgba(255, 159, 28, 0.45);
            border-color: #fffdf6;
            transform: rotate(-3deg) scale(1.03);
        }

        @keyframes revealImage {
            0% { transform: rotate(-3deg) scale(0.85); opacity: 0.5; }
            50% { transform: rotate(2deg) scale(1.1); }
            100% { transform: rotate(-3deg) scale(1.03); opacity: 1; }
        }
        .question-image-container{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.question-number{
    position:absolute;
    top:8px;
    left:calc(50% - 115px);
    width:46px;
    height:46px;
    border-radius:12px;
    background:linear-gradient(135deg,#ff9f1c,#ff7b00);
    color:#fff;
    font-size:20px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    border:3px solid #fff;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
    z-index:10;
}
        /* ===== TABLE ===== */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.55);
            padding: 4px;
            border: 2px solid rgba(46, 125, 107, 0.25);
        }

        .verb-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 18px;
            overflow: hidden;
        }

        .verb-table th {
            background: #dbdbdb;
            color: #000;
            
            font-size: 19px;
            font-weight: 700;
            padding: 14px 16px;
            text-align: center;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .verb-table td {
            padding: 14px 14px;
            text-align: center;
            font-size: 18px;
            background: #fffefb;
            border: 1px solid rgba(46, 125, 107, 0.15);
            vertical-align: middle;
        }

        .verb-table .present-cell {
            font-weight: 700;
            color: var(--ink);
            font-size: 22px;
            background: var(--parchment-soft);
            min-width: 90px;
        }

        .verb-table .input-cell {
            min-width: 150px;
        }

        /* ===== SELECT WRAPPER (chip style, wooden-sign placeholder) ===== */
        .select-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 58px;
        }

        .select-placeholder {
            
            width: 100%;
            max-width: 160px;
            padding: 10px 12px;
            font-size: 19px;
            font-weight: 700;
            border: 3px solid var(--mango);
            border-radius: 12px;
            background: repeating-linear-gradient(135deg, #fff3d9, #fff3d9 8px, #ffe9bd 8px, #ffe9bd 16px);
            color: var(--ink);
            text-align: center;
            transition: all 0.25s ease;
            cursor: pointer;
            user-select: none;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 var(--mango-deep);
        }

        .select-placeholder:hover {
            transform: scale(1.02);
        }

        .select-placeholder.locked-correct {
            border-color: var(--lime-deep);
            background: linear-gradient(145deg, #eafcd7, #d5f5ad);
            box-shadow: 0 4px 0 var(--lime-deep);
            cursor: default;
        }

        .option-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .select-chip {
            
            background: #ffffff;
            border: 2.5px solid var(--vine);
            border-radius: 40px 8px 40px 8px;
            padding: 8px 18px;
            font-size: 17px;
            font-weight: 600;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            box-shadow: 0 4px 0 var(--vine);
        }

        .select-chip:hover {
            background: var(--parchment-soft);
            transform: translateY(-2px);
            border-color: var(--mango);
            box-shadow: 0 4px 0 var(--mango-deep);
        }

        .select-chip:active {
            transform: scale(0.96);
        }

        .select-chip.chip-correct {
            background: linear-gradient(145deg, #eafcd7, #d5f5ad);
            border-color: var(--lime-deep);
            color: var(--ink);
            box-shadow: 0 4px 0 var(--lime-deep);
            pointer-events: none;
            cursor: default;
        }

        .select-chip.chip-wrong {
            background: #ffe3e0;
            border-color: var(--papaya-deep);
            color: var(--ink);
            animation: shake 0.5s ease;
            pointer-events: none;
            cursor: default;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        /* ===== NAVIGATION ===== */
        .nav-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            width: 100%;
            padding: 6px 0 2px;
        }

        .nav-btn {
            width: 140px;
            
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            border-radius: 35px;
            border: 3px solid #ffffff;
            padding: 13px 32px;
            font-size: 20px;
            font-weight: 400;
            color: #ffffff;
            cursor: pointer;
            transition: .15s ease;
        }

        .nav-btn:active:not(:disabled) { transform: translateY(4px); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        .prev-btn {
           background: #7fc0eb;
            
        }
        .prev-btn:active:not(:disabled) { box-shadow: 0 2px 0 var(--papaya-deep); }

        .next-btn {
          background: #ecc74e;
         
        }
        .next-btn:active:not(:disabled) { box-shadow: 0 2px 0 var(--mango-deep); }

        .dots-indicator {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 4px 12px;
            display: none;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #d8c9a0;
            transition: all 0.4s ease;
            border: 2px solid transparent;
        }

        .dot.active {
            background: var(--mango);
            border-color: var(--mango-deep);
            transform: scale(1.25);
        }

        .dot.completed {
            background: var(--lime);
            border-color: var(--lime-deep);
        }

      
        /* ===== POPUP DESIGNS (same as Fill in Blanks) ===== */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
           
            padding: 20px;
        }

        .kid-card {
            background: #ffffff;
            width: 380px;
            max-width: 95%;
            padding: 32px 28px;
            border-radius: 44px;
            text-align: center;
            animation: kidPop 0.6s ease;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Decorative circles */
        .kid-card::before,
        .kid-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .kid-card::before {
            width: 200px;
            height: 200px;
            top: -80px;
            right: -60px;
            background: #ffd93d;
        }

        .kid-card::after {
            width: 150px;
            height: 150px;
            bottom: -60px;
            left: -50px;
            background: #6bcbff;
        }

        .kid-card>* {
            position: relative;
            z-index: 2;
        }

        .kid-icon {
            font-size: 4.8em;
            margin-bottom: 6px;
            animation: emojiBounce 0.9s infinite alternate;
            display: inline-block;
        }

        .kid-card h3 {
            font-size: 2.2em;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .kid-card p {
            font-size: 1.1em;
            color: #555;
            margin-top: 2px;
            font-weight: 500;
        }

        /* Correct Popup */
        .kid-correct .kid-card {
            background: linear-gradient(145deg, #f0fff4, #d4f5e6);
            border: 5px solid #38d9a9;
        }

        .kid-correct .kid-card h3 {
            color: #0b8a4a;
        }

        .kid-correct .kid-card p {
            color: #1a6a3a;
        }

        .kid-correct .kid-card::before {
            background: #38d9a9;
        }

        .kid-correct .kid-card::after {
            background: #38d9a9;
        }

        /* Wrong Popup */
        .kid-wrong .kid-card {
            background: linear-gradient(145deg, #fff5f5, #fce4e4);
            border: 5px solid #ff8a8a;
        }

        .kid-wrong .kid-card h3 {
            color: #c0392b;
        }

        .kid-wrong .kid-card p {
            color: #922b21;
        }

        .kid-wrong .kid-card::before {
            background: #ff8a8a;
        }

        .kid-wrong .kid-card::after {
            background: #ff8a8a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg);
                opacity: 0;
            }

            50% {
                transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0) scale(1);
            }

            to {
                transform: translateY(-12px) scale(1.05);
            }
        }

        /* ===== FINAL POPUP ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
           
            padding: 20px;
        }

        .final-kid-box {
            background: linear-gradient(145deg, #fff7d6, #e6fff5);
            padding: 35px 40px;
            border-radius: 44px;
            text-align: center;
            width: 480px;
            max-width: 95%;
            animation: finalBounce 0.8s ease;
            /* box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2); */
            border: 4px solid rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .final-kid-box::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            top: -120px;
            right: -100px;
            background: #ffd93d;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .final-kid-box>* {
            position: relative;
            z-index: 2;
        }

        .final-kid-box h2 {
            font-size: 2.4em;
            color: #2f9e44;
            margin-bottom: 8px;
            
            font-weight: 700 !important;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
            color: #2d3a3a;
        }

        #stars {
            font-size: 2.6em;
            margin: 14px 0;
            letter-spacing: 6px;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
            letter-spacing: 0.5px;
        }

        .playAgain-btn:hover {
            transform: translateY(-3px);
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #d4871f;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3) perspective(400px) rotateX(15deg);
                opacity: 0;
            }

            50% {
                transform: scale(1.08) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }


        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .template { padding: 16px 14px; border-radius: 24px; gap: 10px; }
            .template::before, .template::after { font-size: 22px; }
            .title { font-size: 19px; }
            .title span { width: 36px; height: 36px; font-size: 22px; }
            .instruction { font-size: 10px; padding: 0.25rem 0.8rem; }
            .sub-instruction { font-size: 13px; padding: 0.25rem 0.8rem; }
            .question-image { width: 110px; height: 110px; border-width: 7px; border-bottom-width: 22px; }
            .verb-table th { font-size: 14px; padding: 10px 10px; }
            .verb-table td { padding: 8px 6px; font-size: 14px; }
            .verb-table .present-cell { font-size: 16px; min-width: 60px; }
            .verb-table .input-cell { min-width: 90px; }
            .select-placeholder { font-size: 14px; padding: 7px 8px; min-height: 40px; }
            .select-chip { font-size: 13px; padding: 6px 12px; }
            .nav-btn { padding: 10px 18px; font-size: 16px; }
            .dot { width: 12px; height: 12px; }
            .kid-card { width: 340px; padding: 28px 24px; }
            .kid-icon { font-size: 4em; }
            .kid-card h3 { font-size: 1.6em; }
            .final-kid-box { width: 92%; padding: 28px 24px; }
            .final-kid-box h2 { font-size: 1.9em; }
            .final-kid-box p { font-size: 1.1em; }
            #stars { font-size: 2.2em; }
            .playAgain-btn { padding: 12px 28px; font-size: 1em; }
        }

        @media (max-width: 480px) {
            body { padding: 6px; }
            .template { padding: 12px 8px; border-radius: 20px; gap: 8px; }
            .template::before, .template::after { font-size: 16px; }
            .title { font-size: 15px; }
            .title span { width: 30px; height: 30px; font-size: 17px; }
            .instruction { font-size: 8px; padding: 0.15rem 0.5rem; border-width: 1.5px; }
            .sub-instruction { font-size: 10px; padding: 0.15rem 0.5rem; }
            .question-image { width: 80px; height: 80px; border-width: 5px; border-bottom-width: 16px; }
            .verb-table th { font-size: 11px; padding: 6px 4px; }
            .verb-table td { padding: 5px 3px; font-size: 11px; }
            .verb-table .present-cell { font-size: 12px; min-width: 45px; }
            .verb-table .input-cell { min-width: 65px; }
            .select-placeholder { font-size: 11px; padding: 5px 6px; min-height: 34px; }
            .select-chip { font-size: 10px; padding: 4px 10px; }
            .nav-btn { padding: 6px 12px; font-size: 12px; gap: 4px; border-radius: 30px; width: 80px; }
            .dot { width: 10px; height: 10px; }
            .kid-card { width: 300px; padding: 22px 20px; border-radius: 28px; }
            .kid-icon { font-size: 3.6em; }
            .kid-card h3 { font-size: 1.4em; }
            .kid-card p { font-size: 1em; }
            .final-kid-box { padding: 24px 20px; border-radius: 28px; }
            .final-kid-box h2 { font-size: 1.6em; }
            .final-kid-box p { font-size: 1.1em; }
            #stars { font-size: 2.2em; }
            .playAgain-btn { padding: 12px 30px; font-size: 1em; }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .select-placeholder { max-width: 140px; font-size: 17px; }
            .verb-table th { font-size: 17px; padding: 12px 14px; }
            .verb-table td { font-size: 16px; padding: 10px 10px; }
            .question-image { width: 190px; height: 190px; }
            /* .nav-btn { font-size: 20px; width: 130px;  } */
        }

        @media (min-width: 1441px) {
            .template { max-width: 1000px; padding: 32px 42px; border-radius: 40px; gap:35px}
            .verb-table th { font-size: 22px; padding: 18px 22px; }
            .verb-table td { font-size: 22px; padding: 14px 18px; }
            .verb-table .present-cell { font-size: 26px; min-width: 120px; }
            .select-placeholder { font-size: 22px; max-width: 190px; min-height: 60px; }
            .select-chip { font-size: 20px; padding: 10px 22px; }
            .question-image { width: 230px; height: 230px; }
            .title { font-size: 34px; }
            .title span { width: 54px; height: 54px; font-size: 34px; }
            .instruction { font-size: 1.05rem; padding: 0.6rem 1.8rem; }
            .sub-instruction { font-size: 22px; padding: 0.5rem 1.6rem; }
            .nav-btn {
                 padding: 16px 8px;
                font-size: 22px; }
            .kid-card {
                width: 460px;
                padding: 38px 34px;
            }
            .kid-icon {
                font-size: 5.4em;
            }
            .final-kid-box {
                width: 560px;
                padding: 42px;
            }
            .final-kid-box h2 {
                font-size: 2.8em;
            }
            #stars {
                font-size: 2.8em;
            }
            .playAgain-btn {
                padding: 18px 44px;
                font-size: 1.3em;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 6px; align-items: flex-start; }
            .template { padding: 10px 14px; border-radius: 22px; gap: 8px; }
            .title { font-size: 16px; }
            .instruction { font-size: 9px; padding: 0.15rem 0.5rem; }
            .sub-instruction { font-size: 10px; padding: 0.15rem 0.5rem; }
            .question-image { width: 65px; height: 65px; border-width: 4px; border-bottom-width: 12px; }
            .verb-table th { font-size: 12px; padding: 6px 8px; }
            .verb-table td { padding: 4px 6px; font-size: 12px; }
            .select-placeholder { font-size: 12px; min-height: 34px; }
            .select-chip { font-size: 11px; padding: 4px 10px; }
            .nav-btn { padding: 4px 12px; font-size: 11px; gap: 4px; width: 70px; }
            .kid-card { width: 240px; padding: 14px 14px; border-radius: 24px; }
            .kid-icon { font-size: 2.5em; }
            .kid-card h3 { font-size: 1.2em; }
            .kid-card p { font-size: 0.8em; }
            .final-kid-box { width: 70%; padding: 14px; border-radius: 24px; }
            .final-kid-box h2 { font-size: 1.2em; }
            .final-kid-box p { font-size: 0.8em; }
            #stars { font-size: 1.4em; }
            .playAgain-btn { padding: 6px 16px; font-size: 0.7em; }
        }
    </style>
</head>

<body>

    <div class="app">
        <div class="template">
            <div class="header-area">
                <div class="title"> Verb Forms</div>
                <div class="instruction">Tap a ▼ sign, then pick a word!</div>
            </div>
            <div class="sub-instruction">✨ Select the correct past &amp; 'ing' form</div>

          <div class="question-image-container">
    <div class="question-number" id="questionNumber">Q1</div>

    <img class="question-image" id="questionImage"
        src="https://picsum.photos/seed/verb/200/200"
        alt="Question image" />
</div>

            <div class="table-wrapper">
                <table class="verb-table" id="verbTable">
                    <thead>
                        <tr>
                            <th>Present</th>
                            <th>Past</th>
                            <th>'ing'</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="nav-area" id="navArea">
                <button class="nav-btn prev-btn" id="prevBtn"><span><i class="fa-solid fa-angles-left"></i> Prev</span></button>
                <div class="dots-indicator" id="dotsIndicator"></div>
                <button class="nav-btn next-btn" id="nextBtn"><span>Next <i class="fa-solid fa-angles-right"></i></span></button>
            </div>
        </div>
    </div>

    <!-- POPUPS -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        // ================================================================
        //  DATA
        // ================================================================
        const VERB_DATA = [
            { image: "../assets/images/seek.jpg", present: "Seek", past: "Sought", ing: "Seeking" },
            { image: "../assets/images/hunt.jpg", present: "Hunt", past: "Hunted", ing: "Hunting" },
            { image: "../assets/images/know2.png", present: "Know", past: "Knew", ing: "Knowing" },
            { image: "../assets/images/feed.jpg", present: "Feed", past: "Fed", ing: "Feeding" },
            { image: "../assets/images/burn.jpg", present: "Burn", past: "Burnt", ing: "Burning" }
        ];

        // ================================================================
        //  STATE
        // ================================================================
        let currentIndex = 0;
        const totalQuestions = VERB_DATA.length;
        let questionStates = [];
        let completedQuestions = 0;

        // ================================================================
        //  DOM REFS
        // ================================================================
        const tableBody = document.getElementById('tableBody');
        const questionImage = document.getElementById('questionImage');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const dotsIndicator = document.getElementById('dotsIndicator');
        const playAgainBtn = document.getElementById('playAgainBtn');

        const popupOverlay = document.getElementById('answerPopup');
        const popupIcon = document.getElementById('popupIcon');
        const popupTitle = document.getElementById('popupTitle');
        const popupMsg = document.getElementById('popupMsg');

        // ================================================================
        //  AUDIO / CONFETTI
        // ================================================================
        function smallConfetti() { confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } }); }
        function bigConfetti() {
            confetti({ particleCount: 200, spread: 110, origin: { y: 0.5 } });
            setTimeout(() => {
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.2 } });
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.8 } });
            }, 150);
        }

        function showPopup(isCorrect) {
            popupOverlay.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
            popupOverlay.style.display = 'flex';
            if (isCorrect) {
                popupIcon.textContent = '🌟';
                popupTitle.textContent = 'Amazing!';
                popupMsg.textContent = 'You got it right! ✨';
            } else {
                popupIcon.textContent = '😒';
                popupTitle.textContent = 'Keep Going!';
                popupMsg.textContent = 'Try again, you can do it! 🌈';
            }
            const sound = document.getElementById(isCorrect ? 'correctSound' : 'wrongSound');
            if (sound) sound.play().catch(() => { });
            setTimeout(() => { popupOverlay.style.display = 'none'; }, 1800);
        }

        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = 'en-US'; msg.volume = 0.25; msg.rate = 1; msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        // ================================================================
        //  FINAL / NAV
        // ================================================================
        function showFinal() {
            document.getElementById('finalPopup').style.display = 'flex';
            document.getElementById('finalScore').textContent = `Your Score: ${completedQuestions} / ${totalQuestions}`;
            document.getElementById('stars').textContent = '⭐'.repeat(Math.min(completedQuestions, 5));
            bigConfetti();
        }

        function checkAllCompleted() {
            if (completedQuestions === totalQuestions) setTimeout(showFinal, 900);
        }

        function updateNav() {
            const state = questionStates[currentIndex];
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = !state.completed;
            const dots = dotsIndicator.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                dot.className = 'dot';
                if (index === currentIndex) dot.classList.add('active');
                if (questionStates[index] && questionStates[index].completed) dot.classList.add('completed');
            });
        }

        function buildDots() {
            dotsIndicator.innerHTML = '';
            for (let i = 0; i < totalQuestions; i++) {
                const dot = document.createElement('span');
                dot.className = 'dot';
                dot.dataset.index = i;
                dot.style.cursor = 'pointer';
                dot.addEventListener('click', function () {
                    const idx = parseInt(this.dataset.index);
                    if (idx === currentIndex) return;
                    if (idx < currentIndex && questionStates[idx].completed) goToQuestion(idx);
                    else if (idx === currentIndex + 1 && questionStates[currentIndex].completed) goToQuestion(idx);
                });
                dotsIndicator.appendChild(dot);
            }
            updateNav();
        }

        // ================================================================
        //  RENDER QUESTION
        // ================================================================
        function renderQuestion(index) {
            const data = VERB_DATA[index];
            const state = questionStates[index];

            questionImage.src = data.image;
            questionImage.alt = data.present;
            questionImage.classList.toggle('completed', state.completed);
            document.getElementById("questionNumber").textContent = `Q${index + 1}`;
            tableBody.innerHTML = '';
            const tr = document.createElement('tr');

            // Present
            const presCell = document.createElement('td');
            presCell.className = 'present-cell';
            presCell.textContent = data.present;
            tr.appendChild(presCell);

            // Past
            const pastCell = document.createElement('td');
            pastCell.className = 'input-cell';
            pastCell.appendChild(createSelectWrapper(index, 'past', data.past, data.ing, state));
            tr.appendChild(pastCell);

            // 'ing'
            const ingCell = document.createElement('td');
            ingCell.className = 'input-cell';
            ingCell.appendChild(createSelectWrapper(index, 'ing', data.ing, data.past, state));
            tr.appendChild(ingCell);

            tableBody.appendChild(tr);
            updateNav();
        }

        // ================================================================
        //  SELECT WRAPPER (chip auto-check)
        // ================================================================
        function createSelectWrapper(rowIdx, type, correctAns, wrongAns, state) {
            const wrapper = document.createElement('div');
            wrapper.className = 'select-wrapper';

            const placeholder = document.createElement('div');
            placeholder.className = 'select-placeholder';

            const optGroup = document.createElement('div');
            optGroup.className = 'option-group';
            optGroup.style.display = 'none';

            const alreadyCorrect = type === 'past' ? state.pastCorrect : state.ingCorrect;
            const savedValue = type === 'past' ? state.pastValue : state.ingValue;

            if (alreadyCorrect) {
                placeholder.textContent = savedValue;
                placeholder.classList.add('locked-correct');
                wrapper.appendChild(placeholder);
                return wrapper;
            }

            placeholder.textContent = 'Select ▼';
            placeholder.addEventListener('click', function (e) {
                e.stopPropagation();
                if (state.completed) return;
                document.querySelectorAll('.option-group').forEach(g => { if (g !== optGroup) g.style.display = 'none'; });
                optGroup.style.display = (optGroup.style.display === 'none' || optGroup.style.display === '') ? 'flex' : 'none';
            });

            const options = [correctAns, wrongAns];
            if (Math.random() < 0.5) options.reverse();
            options.forEach(opt => {
                const chip = document.createElement('span');
                chip.className = 'select-chip';
                chip.textContent = opt;
                chip.addEventListener('click', function (e) {
                    e.stopPropagation();
                    if (state.completed) return;
                    const isCorrect = opt === correctAns;

                    if (isCorrect) {
                        chip.classList.add('chip-correct');
                        placeholder.textContent = opt;
                        placeholder.classList.add('locked-correct');
                        optGroup.style.display = 'none';

                        if (type === 'past') { state.pastCorrect = true; state.pastValue = opt; }
                        else { state.ingCorrect = true; state.ingValue = opt; }

                        showPopup(true);
                        smallConfetti();
                        speak('Correct!');

                        if (state.pastCorrect && state.ingCorrect) {
                            state.completed = true;
                            completedQuestions++;
                            questionImage.classList.add('completed');
                            updateNav();
                            checkAllCompleted();
                        }
                    } else {
                        chip.classList.add('chip-wrong');
                        showPopup(false);
                        speak('Try again!');
                        setTimeout(() => {
                            chip.classList.remove('chip-wrong');
                            optGroup.style.display = 'none';
                        }, 600);
                    }
                });
                optGroup.appendChild(chip);
            });

            wrapper.appendChild(placeholder);
            wrapper.appendChild(optGroup);
            return wrapper;
        }

        // ================================================================
        //  NAVIGATION
        // ================================================================
        function goToQuestion(index) {
            if (index < 0 || index >= totalQuestions) return;
            currentIndex = index;
            renderQuestion(index);
        }
        prevBtn.addEventListener('click', () => { if (currentIndex > 0) goToQuestion(currentIndex - 1); });
        nextBtn.addEventListener('click', () => {
            const state = questionStates[currentIndex];
            if (state.completed && currentIndex < totalQuestions - 1) goToQuestion(currentIndex + 1);
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); if (currentIndex > 0) goToQuestion(currentIndex - 1); }
            else if (e.key === 'ArrowRight') {
                e.preventDefault();
                const state = questionStates[currentIndex];
                if (state.completed && currentIndex < totalQuestions - 1) goToQuestion(currentIndex + 1);
            }
        });
        document.addEventListener('click', function (e) {
            if (!e.target.closest('.select-wrapper')) {
                document.querySelectorAll('.option-group').forEach(g => g.style.display = 'none');
            }
        });

        // ================================================================
        //  RESTART
        // ================================================================
        function restartQuiz() {
            currentIndex = 0;
            completedQuestions = 0;
            questionStates = [];
            VERB_DATA.forEach(() => {
                questionStates.push({ pastCorrect: false, ingCorrect: false, completed: false, pastValue: '', ingValue: '' });
            });
            document.getElementById('finalPopup').style.display = 'none';
            buildDots();
            goToQuestion(0);
        }
        playAgainBtn.onclick = restartQuiz;

        // ================================================================
        //  INIT
        // ================================================================
        VERB_DATA.forEach(() => {
            questionStates.push({ pastCorrect: false, ingCorrect: false, completed: false, pastValue: '', ingValue: '' });
        });
        buildDots();
        goToQuestion(0);

        console.log('🐦 Verb Forms · Auto-Check · one question at a time');
    </script>
</body>

</html>
