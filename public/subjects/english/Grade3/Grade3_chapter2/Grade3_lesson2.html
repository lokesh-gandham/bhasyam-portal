<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Digital Assessments</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
  @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('./assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyBold';
        }

    /* ===== BACKGROUND - PARCHMENT WITH DOT PATTERN ===== */
    :root {
      --parchment: #deebe8;
      --parchment-soft: #fdeecb;
      --vine: #2e7d6b;
    }

    body {
      height: 100vh;
      overflow: hidden;
      
      background: var(--parchment);
      background-image: 
        radial-gradient(circle at 6px 6px, rgba(46, 125, 107, 0.08) 1.4px, transparent 1.4px);
      background-size: 18px 18px;
    }

    .app {
      display: flex;
      height: 100vh;
      gap: 20px;
      background: var(--parchment);
      background-image: 
        radial-gradient(circle at 6px 6px, rgba(46, 125, 107, 0.08) 1.4px, transparent 1.4px);
      background-size: 18px 18px;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 280px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      border-radius: 32px;
    }

    .sidebar-title {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #b0a090;
      padding: 0 8px 16px 8px;
      border-bottom: 2px solid #f0ece8;
      margin-bottom: 16px;
    }
    .sidebar-title i {
      margin-right: 8px;
    }

    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
    }
    .nav-scroll::-webkit-scrollbar { width: 4px; }
    .nav-scroll::-webkit-scrollbar-thumb { 
      background: #ddd6ce;
      border-radius: 20px;
    }

    /* ===== BUTTON DESIGN - Minimal with border ===== */
    .nav-btn {
      background: rgba(255, 255, 254, 0.7);
      backdrop-filter: blur(10px);
      border: 2px solid #e8e4e0;
      border-radius: 16px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
     
      width: 100%;
      flex-shrink: 0;
      position: relative;
    }

    .nav-btn .icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      transition: all 0.3s;
      color: #fff;
    }

    .nav-btn .btn-label {
      flex: 1;
      min-width: 0;
    }
    .nav-btn .btn-label .title {
      font-size: 18px;
      font-weight: 400;
      color: #2d2a24;
      line-height: 1.2;
      transition: color 0.3s;
    }

    .nav-btn .btn-label .sub {
      font-size: 0.6rem;
      font-weight: 600;
      color: #b0a898;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 2px;
      display: block;
      transition: color 0.3s;
    }

    /* Arrow indicator */
    .nav-btn .arrow {
      opacity: 0;
      transition: all 0.3s;
      font-size: 0.85rem;
      color: #b0a898;
    }

    .nav-btn:hover {
      border-color: #c8c0b8;
      transform: translateX(4px);
    }

    .nav-btn:hover .arrow {
      opacity: 1;
      transform: translateX(4px);
    }

    .nav-btn:hover .icon-wrap {
      transform: scale(1.05);
    }

    /* Active state - filled background */
    .nav-btn.active {
      border-color: transparent;
      background: rgba(255, 248, 233, 0.9);
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      transform: translateX(4px);
    }

    .nav-btn.active .arrow {
      opacity: 1;
    }

    .nav-btn.active .icon-wrap {
      transform: scale(1.05);
    }

    .nav-btn.active .btn-label .title {
      color: #1a1a1a;
    }

    /* Individual colors */
    /* ========================================
   Multiple Choice - Cherry Red
======================================== */

.nav-btn[data-type="0"] .icon-wrap{
    background:linear-gradient(135deg,#FF7A7A,#FF4D6D);
}

.nav-btn[data-type="0"].active{

}

.nav-btn[data-type="0"]:hover{

.nav-btn[data-type="3"].active{

}

.nav-btn[data-type="3"]:hover{

}


/* ===========================

=========================== */

.nav-btn[data-type="4"].active{

.nav-btn[data-type="4"]:hover{

/* ===========================

=========================== */

    /* ===== MAIN CONTENT ===== */
    .main {
      flex: 1;
      display: flex;

    .iframe-wrapper {
      width: 100%;

    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent;
    }

    /* ===== MOBILE ===== */
    .mobile-toggle {
      display: none;
      position: fixed;
      top: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f9a825, #fdd835);
      border: none;
      font-size: 26px;
      color: #3d2c1e;
      box-shadow: 0 6px 0 #c47d1a, 0 8px 32px rgba(249, 168, 37, 0.3);
      z-index: 5000;
      cursor: pointer;
      transition: 0.1s;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .mobile-toggle:active { transform: scale(0.85); }

    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.04);
      backdrop-filter: blur(2px);
      z-index: 4000;
    }
    .drawer-panel {
      position: absolute;
      right: 0;
      top: 0;
      width: 290px;
      height: 100%;
      background: #ffffff;
      padding: 60px 16px 30px;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
      box-shadow: 8px 0 40px rgba(0,0,0,0.04);
      border-radius: 0 32px 32px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .drawer-overlay.show { display: block; }
    .drawer-overlay.show .drawer-panel { transform: translateX(0); }

    .drawer-panel .nav-btn {
      background: rgba(255, 248, 233, 0.7);
    }
/* ==========================================

    @media (max-width: 900px) {

      .mobile-toggle { width: 52px; height: 52px; font-size: 22px; bottom: 16px; right: 16px; }
    }
  </style>

  <script>
    (function() {
      const frame = document.getElementById('contentFrame');
      const sidebarBtns = document.querySelectorAll('.sidebar .nav-btn');
      const drawerBtns = document.querySelectorAll('.drawer-overlay .nav-btn');

      const pages = [
        './exercises/fill-blanks.html',
        './exercises/mcq.html',        
       './exercises/synonyms.html',
       './exercises/puzzel.html',
       './exercises/antonyms.html',
      //  './exercises/Singular-Plural.html',
      './exercises/sp.html',
       './exercises/verb.html',
      ];

      window.openActivity = function(index) {
        if (index < 0 || index >= pages.length) return;
        
        sidebarBtns.forEach((b, i) => b.classList.toggle('active', i === index));
        drawerBtns.forEach((b, i) => b.classList.toggle('active', i === index));

        if (frame && pages[index]) {
          frame.src = pages[index];
          frame.onload = () => { frame.style.opacity = '1'; };
        }
      };

      window.toggleDrawer = function() {
        const overlay = document.getElementById('drawerOverlay');
        if (overlay) overlay.classList.toggle('show');
      };

      window.mobileOpen = function(index) {
        openActivity(index);
        toggleDrawer();
      };

      window.addEventListener('resize', () => {
        const overlay = document.getElementById('drawerOverlay');
        if (window.innerWidth > 900 && overlay && overlay.classList.contains('show')) {
          overlay.classList.remove('show');
        }
      });

      window.addEventListener('load', () => {
        document.body.style.overflow = 'hidden';
        const currentSrc = frame.src;
        let activeIndex = 0;
        for (let i = 0; i < pages.length; i++) {
          if (currentSrc.includes(pages[i]) || currentSrc.endsWith(pages[i].replace('./', ''))) {
            activeIndex = i;
            break;
          }
        }
        
        sidebarBtns.forEach((b, i) => b.classList.toggle('active', i === activeIndex));
        drawerBtns.forEach((b, i) => b.classList.toggle('active', i === activeIndex));
        if (activeIndex !== 0) frame.src = pages[activeIndex];
        console.log('🌈 Kids Quiz ready!');
      });

    })();
  </script>
