<html lang="en">
<head>

    <style>
       @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }
       

        body {
            /* background: #f7f6f4; */
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            margin: auto;
            padding: 2px 25px;
            /* background: #f7f6f4; */
            /* border-radius: 30px; */
        }

        /*=========================
        HEADER
        =========================*/
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .heading h2 {
            color: #2f4f4f;
            font-size: 24px;
            font-weight: 500;
        }

        .heading p {
            color: #353131;
            margin-top: 4px;
            font-size: 17px;
        }

        .badge {
            color:#2f4f4f;
            padding: 8px 28px;
            border-radius: 18px;
            font-size: 26px;
            font-weight: 700;
            white-space: nowrap;
        }

        /*=========================
        UPPER SECTION
        =========================*/
        .upper-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            height: 250px;
        }

        /*=========================
        LEFT SIDE - EXAMPLE
        =========================*/
        .left-side {
            width: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            background: rgba(255, 215, 175, 0.25);
            border-radius: 20px;
            padding: 12px 8px;
            border: 2px dashed #dba93f;
            position: relative;
        }

        .left-side::before {
            content: "EXAMPLE";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #dba93f;
            color: white;
            font-size: 11px;
            font-weight: 400;
            padding: 2px 16px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .left-side .rope-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .left-side .rope {
            width: 2px;
            height: 35px;
            background: #444;
        }

        .left-side .circle {
            border-color: #dba93f;
            background: #fff8f0;
            cursor: default;
            opacity: 0.8;
        }

        .left-side .circle:hover {
            transform: none;
        }

        .left-side .answer-box {
            background: #ef9446;
            border-color: #dba93f;
            cursor: default;
        }

        .left-side .answer-box span {
            font-size: 17px;
            font-weight: 600;
            color: #1e3a3a;
            display:none;
        }

        /*=========================
        CIRCLES
        =========================*/
        .circle {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #e64646;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            user-select: none;
            transition: .3s;
            text-transform:capitalize ;
        }

        .circle:hover {
            transform: scale(1.08);
        }

        /*=========================
        ANSWER BOX - INPUT STYLES
        =========================*/
        .answer-box {
            width: 120px;
            height: 42px;
            background: #ffbf75;
            border-radius: 10px;
            margin-top: 8px;
            border: 2px solid #ef9446;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: 600;
            transition: .25s;
            cursor: default;
            position: relative;
        }

        .answer-input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
            color: #1e3a3a;
         
            padding: 0 8px;
            border-radius: 10px;
            text-transform: capitalize;
        }

        .answer-input::placeholder {
            color: #a0886a;
            font-weight: 400;
            font-size: 17px;
        }

        .answer-input:focus {
            background: rgba(255, 255, 255, 0.3);
        }

        .answer-input.correct {
            background: #c8f7d0 !important;
            border: 3px solid #2ecc71 !important;
            color: #146c2e;
            border-radius: 10px;
        }

        .answer-input.wrong {
            background: #ffd4d4 !important;
            border: 3px solid #ff5252 !important;
            border-radius: 10px;
            animation: shake .45s;
        }

        .answer-input:disabled {
            opacity: 1;
            cursor: default;
        }

.answer-box.correct {
    background: #ef9446;
    border: 2px solid #ef9446;
}
        /* Verify Button */
        .verify-btn {
            position: absolute;
            right: -42px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: #4CAF50;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: .3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .verify-btn:hover:not(:disabled) {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .verify-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: translateY(-50%) scale(0.95);
        }

        .verify-btn.correct-btn {
            background: #2ecc71;
        }

        /*=========================
        TUB AREA - SMALLER
        =========================*/
        .tub-area {
            position: relative;
            width: 380px;
            height: 260px;
            flex-shrink: 0;
        }

        .tub {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            
        }

        /*=========================
        BALLS - SMALLER
        =========================*/
        .word-ball {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: white;
            border: 2px solid #777;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            font-size: 18px;
            transition: .3s;
            user-select: none;
            cursor: grab;
            font-weight: 600;
            text-transform: capitalize;
        }
.word-ball:active{
    cursor:grabbing;
}
        .word-ball.matched {
            background: #c8f7d0;
            border-color: #2ecc71;
            color: #146c2e;
        }

        /* Positions - Adjusted for smaller tub */
        .word-ball:nth-child(2) {
            left: 115px;
            top: 10px;
        }
        .word-ball:nth-child(3) {
            left: 200px;
            top: 10px;
        }
        .word-ball:nth-child(4) {
            left: 70px;
            top: 48px;
        }
        .word-ball:nth-child(5) {
            left: 155px;
            top: 50px;
        }
        .word-ball:nth-child(6) {
            left: 240px;
            top: 50px;
        }

        /*=========================
        BOTTOM STANDS
        =========================*/
        .stands {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            gap: 10px;
        }

        .stand {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stand .rope {
            height: 20px;
            width: 2px;
            background: #444;
        }

        /*=========================
        TOP SHAPES - HIDDEN INITIALLY
        =========================*/
        .shape {
            width: 110px;
            height: 65px;
            background: white;
            border: 2px solid #ff6b57;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 12px;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: shapeReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: capitalize;
        }

        .shape.visible {
            display: flex;
            animation: shapeReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .shape.matched {
            border-color: #2ecc71;
            background: #c8f7d0;
        }

        @keyframes shapeReveal {
            0% {
                transform: scale(0) rotate(-10deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.1) rotate(3deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .cloud {
            border-radius: 35px;
        }
        .round {
            border-radius: 30px;
        }
        .bubble {
            border-radius: 28px 35px 25px 35px;
        }
        .oval {
            border-radius: 50%;
        }
        .square {
            border-radius: 20px;
        }

        /*=========================
        DROP ZONE STATES
        =========================*/
        .drop-zone.hover {
            background: #ffe1b5;
            border: 3px dashed orange;
        }

        /* .drop-zone.correct {
            background: #c8f7d0 !important;
            border: 3px solid #2ecc71 !important;
            color: #146c2e;
        } */

        .drop-zone.wrong {
            background: #ffd4d4 !important;
            border: 3px solid #ff5252 !important;
        }

        .drop-zone.shake {
            animation: shake .45s;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            50% {
                transform: translateX(8px);
            }
            75% {
                transform: translateX(-6px);
            }
        }

        /*=========================
        NEW POPUP DESIGN - KID STYLE
        =========================*/
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }

        .kid-card {
            background: #ffffff;
            width: 380px;
            max-width: 95%;
            padding: 32px 28px;
            border-radius: 44px;
            text-align: center;
            animation: kidPop 0.6s ease;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .kid-card::before,
        .kid-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .kid-card::before {
            width: 200px;
            height: 200px;
            top: -80px;
            right: -60px;
            background: #ffd93d;
        }

        .kid-card::after {
            width: 150px;
            height: 150px;
            bottom: -60px;
            left: -50px;
            background: #6bcbff;
        }

        .kid-card>* {
            position: relative;
            z-index: 2;
        }

        .kid-icon {
            font-size: 4.8em;
            margin-bottom: 6px;
            animation: emojiBounce 0.9s infinite alternate;
            display: inline-block;
        }

        .kid-card h3 {
            font-size: 2.2em;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .kid-card p {
            font-size: 1.1em;
            color: #555;
            margin-top: 2px;
            font-weight: 500;
        }

        .kid-correct .kid-card {
            background: linear-gradient(145deg, #f0fff4, #d4f5e6);
            border: 5px solid #38d9a9;
        }

        .kid-correct .kid-card h3 {
            color: #0b8a4a;
        }

        .kid-correct .kid-card p {
            color: #1a6a3a;
        }

        .kid-wrong .kid-card {
            background: linear-gradient(145deg, #fff5f5, #fce4e4);
            border: 5px solid #ff8a8a;
        }

        .kid-wrong .kid-card h3 {
            color: #c0392b;
        }

        .kid-wrong .kid-card p {
            color: #922b21;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0) scale(1);
            }
            to {
                transform: translateY(-12px) scale(1.05);
            }
        }

        /*=========================
        FINAL POPUP
        =========================*/
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            padding: 20px;
        }

        .final-kid-box {
            background: linear-gradient(145deg, #fff7d6, #e6fff5);
            padding: 35px 40px;
            border-radius: 44px;
            text-align: center;
            width: 480px;
            max-width: 95%;
            animation: finalBounce 0.8s ease;
            border: 4px solid rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .final-kid-box::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            top: -120px;
            right: -100px;
            background: #ffd93d;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .final-kid-box>* {
            position: relative;
            z-index: 2;
        }

        .final-kid-box h2 {
            font-size: 2.4em;
            color: #2f9e44;
            margin-bottom: 8px;
            font-weight: 700 !important;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
            color: #2d3a3a;
        }

        #stars {
            font-size: 2.6em;
            margin: 14px 0;
            letter-spacing: 6px;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
            letter-spacing: 0.5px;
        }

        .playAgain-btn:hover {
            transform: translateY(-3px);
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #d4871f;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3) perspective(400px) rotateX(15deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.08) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

<body>

    <div class="container">

        <!-- Header -->
        <div class="top-bar">
            <div class="heading">
                <h2>There are some circles with words kept in a tub.</h2>
                <p>Type or Drop the antonym for each word in the stands using the words in the tub.</p>
            </div>
            <div class="badge">
                Antonyms
            </div>
        </div>

        <!-- Upper Section -->
        <div class="upper-section">

            <!-- Left Hanging Words - EXAMPLE -->
            <div class="left-side">
                <div class="rope-item">
                    <div class="rope"></div>
                    <div class="circle question" data-answer="go">come</div>
                </div>
                <div class="rope-item">
                    <div class="rope"></div>
                    <div class="circle question" data-answer="come">go</div>
                </div>
                <div class="answer-box">
                    <span>come</span>
                </div>
            </div>

            <!-- Tub -->
            <div class="tub-area">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Crect x='40' y='30' width='320' height='220' rx='40' fill='%2365435b'/%3E%3Cellipse cx='200' cy='250' rx='180' ry='30' fill='%235a3d4a'/%3E%3Cellipse cx='200' cy='30' rx='170' ry='20' fill='%237a5a6b'/%3E%3Crect x='60' y='50' width='280' height='180' rx='30' fill='%237a5a6b'/%3E%3Crect x='70' y='60' width='260' height='160' rx='25' fill='%238a6a7b'/%3E%3C/svg%3E" class="tub" alt="Tub">

                <div class="word-ball" data-word="fall">fall</div>
                <div class="word-ball" data-word="close">close</div>
                <div class="word-ball" data-word="low">low</div>
                <div class="word-ball" data-word="stop">stop</div>
                <div class="word-ball" data-word="big">big</div>
            </div>
        </div>

        <!-- Bottom Section -->
        <div class="stands">
            <!-- Stand 1: stop → start -->
            <div class="stand">
                <div class="rope"></div>
                <div class="shape cloud" data-question="stop">stop</div>
                <div class="circle">start</div>
                <div class="answer-box drop-zone">
                    <input type="text" class="answer-input" placeholder="Type/drop" data-index="0">
                    <button class="verify-btn" data-index="0">✔</button>
                </div>
            </div>

            <!-- Stand 2: close → open -->
            <div class="stand">
                <div class="rope"></div>
                <div class="shape round" data-question="close">close</div>
                <div class="circle">open</div>
                <div class="answer-box drop-zone">
                    <input type="text" class="answer-input" placeholder="Type/drop" data-index="1">
                    <button class="verify-btn" data-index="1">✔</button>
                </div>
            </div>

            <!-- Stand 3: low → high -->
            <div class="stand">
                <div class="rope"></div>
                <div class="shape bubble" data-question="low">low</div>
                <div class="circle">high</div>
                <div class="answer-box drop-zone">
                    <input type="text" class="answer-input" placeholder="Type/drop" data-index="2">
                    <button class="verify-btn" data-index="2">✔</button>
                </div>
            </div>

            <!-- Stand 4: big → small -->
            <div class="stand">
                <div class="rope"></div>
                <div class="shape oval" data-question="big">big</div>
                <div class="circle">small</div>
                <div class="answer-box drop-zone">
                    <input type="text" class="answer-input" placeholder="Type/drop" data-index="3">
                    <button class="verify-btn" data-index="3">✔</button>
                </div>
            </div>

            <!-- Stand 5: fall → rise -->
            <div class="stand">
                <div class="rope"></div>
                <div class="shape square" data-question="fall">fall</div>
                <div class="circle">rise</div>
                <div class="answer-box drop-zone">
                    <input type="text" class="answer-input" placeholder="Type/drop" data-index="4">
                    <button class="verify-btn" data-index="4">✔</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== KID POPUP ===== -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon">🌟</div>
            <h3 id="popupTitle">Amazing!</h3>
            <p id="popupMsg">You got it right! ✨</p>
        </div>
    </div>

    <!-- ===== FINAL POPUP ===== -->
    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        // ==========================
        // DATA
        // ==========================
        const answers = {
            "stop": "stop",
            "close": "close",
            "low": "low",
            "big": "big",
            "fall": "fall"
        };

        const questionOrder = ["stop", "close", "low", "big", "fall"];
        const totalQuestions = 5;
        let score = 0;
        let completedCount = 0;

        // ==========================
        // DOM REFS
        // ==========================
        const inputs = document.querySelectorAll('.answer-input');
        const verifyBtns = document.querySelectorAll('.verify-btn');
        const wordBalls = document.querySelectorAll('.word-ball');
        const shapes = document.querySelectorAll('.shape');
/*=========================
MAKE WORD BALLS DRAGGABLE
=========================*/

wordBalls.forEach(ball=>{

    ball.draggable = true;

    ball.addEventListener("dragstart",function(e){

        e.dataTransfer.setData("text",this.dataset.word);

    });

});
        const popupOverlay = document.getElementById('answerPopup');
        const popupIcon = document.getElementById('popupIcon');
        const popupTitle = document.getElementById('popupTitle');
        const popupMsg = document.getElementById('popupMsg');

        const finalPopup = document.getElementById('finalPopup');
        const finalScore = document.getElementById('finalScore');
        const starsEl = document.getElementById('stars');

        let popupTimer = null;

        // ==========================
        // POPUP - KID STYLE
        // ==========================
        function showPopup(isCorrect) {
            if (popupTimer) clearTimeout(popupTimer);

            popupOverlay.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
            popupOverlay.style.display = 'flex';

            if (isCorrect) {
                popupIcon.textContent = '🌟';
                popupTitle.textContent = 'Amazing!';
                popupMsg.textContent = 'You got it right! ✨';
                document.getElementById('correctSound').play().catch(() => {});
                smallConfetti();
            } else {
                popupIcon.textContent = '😒';
                popupTitle.textContent = 'Keep Going!';
                popupMsg.textContent = 'Try again, you can do it! 🌈';
                document.getElementById('wrongSound').play().catch(() => {});
            }

            popupTimer = setTimeout(() => {
                popupOverlay.style.display = 'none';
            }, 1800);
        }

        // ==========================
        // SPEECH
        // ==========================
        function speak(text) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        // ==========================
        // CONFETTI
        // ==========================
        function smallConfetti() {
            confetti({ particleCount: 35, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 80, spread: 100, origin: { y: 0.6 } });
            setTimeout(() => {
                confetti({ particleCount: 60, spread: 80, origin: { y: 0.5, x: 0.2 } });
                confetti({ particleCount: 60, spread: 80, origin: { y: 0.5, x: 0.8 } });
            }, 200);
        }

        // ==========================
        // VERIFY FUNCTION
        // ==========================
        function verifyAnswer(index) {
            const input = inputs[index];
            const verifyBtn = verifyBtns[index];
            
            if (input.disabled) return;

            const userAnswer = input.value.trim().toLowerCase();
            const questionWord = questionOrder[index];
            const correctAnswer = answers[questionWord];

            if (!userAnswer) {
                input.classList.add('wrong');
                setTimeout(() => {
                    input.classList.remove('wrong');
                }, 500);
                return;
            }

           if (userAnswer === correctAnswer) {
    // Disable verify button
    verifyBtn.disabled = true;
    verifyBtn.classList.add('correct-btn');
    verifyBtn.innerHTML = "✓";

    // Remove input completely
    input.remove();

    // Keep only the answer box
    const answerBox = verifyBtn.parentElement;
    answerBox.classList.add("correct");

    // Optional: remove verify button after correct answer
    verifyBtn.remove();

    // Show and match the shape
    const shape = shapes[index];
    shape.classList.add("visible");
    shape.classList.add("matched");

    // Mark matching word ball
   wordBalls.forEach(ball=>{

    if(ball.dataset.word===correctAnswer){

        ball.classList.add("matched");

        ball.style.pointerEvents="none";

        ball.style.opacity=".25";

    }

});

    score++;
    completedCount++;

    showPopup(true);
    speak("Correct");

    if (completedCount === totalQuestions) {
        setTimeout(() => {
            bigConfetti();
            showFinal();
        }, 1200);
    }
} else {
                // WRONG
                input.classList.add('wrong');
                showPopup(false);
                speak('Try again');

                setTimeout(() => {
                    input.classList.remove('wrong');
                    input.value = '';
                    input.focus();
                }, 800);
            }
        }

        // ==========================
        // EVENT LISTENERS
        // ==========================
        verifyBtns.forEach((btn, index) => {
            btn.addEventListener('click', () => {
                verifyAnswer(index);
            });
        });

        inputs.forEach((input, index) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    verifyAnswer(index);
                }
            });

            /*=========================
DROP ZONES
=========================*/

document.querySelectorAll(".drop-zone").forEach((box,index)=>{

    box.addEventListener("dragover",function(e){

        e.preventDefault();

        this.classList.add("hover");

    });

    box.addEventListener("dragleave",function(){

        this.classList.remove("hover");

    });

    box.addEventListener("drop",function(e){

        e.preventDefault();

        this.classList.remove("hover");

        const word = e.dataTransfer.getData("text");

        const input = this.querySelector(".answer-input");

        if(!input || input.disabled) return;

        input.value = word;

        verifyAnswer(index);

    });

});
            input.addEventListener('focus', function() {
                this.select();
            });
        });

        // ==========================
        // FINAL
        // ==========================
        function getStars() {
            if (score === 5) return '⭐⭐⭐⭐⭐';
            if (score >= 4) return '🌟🌟🌟🌟';
            if (score >= 3) return '🌟🌟🌟';
            if (score >= 2) return '🌟🌟';
            return '🌟';
        }

        function showFinal() {
            finalPopup.style.display = 'flex';
            finalScore.textContent = `Your Score: ${score} / ${totalQuestions}`;
            starsEl.textContent = getStars();
            // setTimeout(() => speak(`You scored ${score} out of ${totalQuestions}`), 600);
        }

        // ==========================
        // INIT - FOCUS FIRST BLANK INPUT
        // ==========================
        // Find the first input that is not disabled and not already correct
        for (let input of inputs) {
            if (!input.disabled && !input.classList.contains('correct')) {
                input.focus();
                break;
            }
        }
        
        console.log('📝 Antonyms Activity - Typing Version loaded!');
        console.log('📊 Total questions: ' + totalQuestions);
        console.log('✅ Shapes are hidden initially and revealed on correct answer');
        console.log('✅ Left side is example only - NO input validation');
        console.log('✅ Cursor automatically placed in first blank input');
    </script>

</body>
