<!DOCTYPE html>
<html lang="en">

<head>

    <style>
       @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }
       

        body {
      
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* MAIN CARD */
        .quiz-card {
            width: 100%;
            max-width: 950px;
            padding: 4px;
            position: relative;
            overflow: hidden;
        }

        .quiz-card.slide-in {
            animation: slideIn 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
        }

        @keyframes slideIn {
            0% {
                transform: translateX(30px) scale(0.96);
                opacity: 0;
            }
            100% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        /* TOP QUESTION */
        .question-title {
            text-align:start;
            font-size: 30px;
            font-weight: 400;
            color: #2f4f4f;
            line-height: 1.4;
            margin-bottom: 15px;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
        }

        /* IMAGE SECTION */
        .image-section {
            width: 50%;
            margin: auto;
            height: 180px;
            width: 250px;
            border-radius: 30px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            background: #f0f2f5;
            padding: 10px;
        }

        .question-image {
            width: 100%;
            height: 100%;
  
            transition: transform 0.3s ease;
        }

        .question-image:hover {
            transform: scale(1.02);
        }

        /* LABEL */
        .drag-label {
            text-align: center;
            color: #ff63a5;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: none;
        }

        /* OPTIONS - MCQ STYLE without images */
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .option {
            display: flex;
            align-items: center;
            justify-content: start;
            min-height: 70px;
            padding: 14px 20px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
          
            border: 2px solid #6ae2f8;
            box-shadow: 0 6px 0 rgba(0, 0, 0, .12);
            color: #2f4f4f;
            text-align: start;
        }

        .option:hover:not(.disabled) {
            transform: translateY(-3px);
        }

        /* Option Background Colors */
        .o1 {
            /* background: linear-gradient(135deg, #d9f9ff, #c2f0ff); */
            background: white;
        }
        .o2 {
            /* background: linear-gradient(135deg, #fff0d9, #ffe4b8); */
          background: white;
        }
        .o3 {
            /* background: linear-gradient(135deg, #f0e6ff, #e0ccff); */
           background: white;
        }
        .o4 {
            /* background: linear-gradient(135deg, #e6fff5, #ccffea); */
           background: white;
        }

        .option.correct {
            background: #edf8ed;
            border: 4px solid #42d366;
            box-shadow: 0 6px 0 #23db4b;
            color: #1e5a2b;
        }

        .option.wrong {
            animation: shakeWrong 0.5s ease;
        }

        @keyframes shakeWrong {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-12px);
            }
            40% {
                transform: translateX(12px);
            }
            60% {
                transform: translateX(-8px);
            }
            80% {
                transform: translateX(8px);
            }
        }

        .option.disabled {
            opacity: 0.7;
            pointer-events: none;
            cursor: default;
        }


.option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding:10px 22px;
}

.option-letter{
    width:50px;

.letter-a{

}

.letter-b{
    background:#2ecc71;
}

.letter-c{
    background:#9b59ff;
}

.letter-d{
    background:#ffa31a;
}

    line-height:1.35;
}

        /* BUTTONS */
        .bottom-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 5px;
        }

        .btn {
            border: none;
            border-radius: 35px;
            padding: 13px 32px;
            font-size: 20px;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s ease;
         
            letter-spacing: 0.5px;
             width: 150px;
            color: #ffffff;
            border: 3px solid #ffffff;
        }

        .btn:active:not(:disabled) {
            transform: translateY(4px);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .prev-btn {
            background: linear-gradient(#86cfe5, #66b6d2);
            box-shadow: 0 4px 0 #3e9dbb;
        }
        .prev-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 #3e9dbb;
        }

        .next-btn {
            background: linear-gradient(#ffc37a, #f7a24f);
            box-shadow: 0 4px 0 #e08634;
        }
        .next-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 #e08634;
        }

        /* ===== POPUPS - Same as One Word Quiz ===== */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }

        .kid-card {
            background: #ffffff;
            width: 380px;
            max-width: 95%;
            padding: 32px 28px;
            border-radius: 44px;
            text-align: center;
            animation: kidPop 0.6s ease;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Decorative circles */
        .kid-card::before,
        .kid-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .kid-card::before {
            width: 200px;
            height: 200px;
            top: -80px;
            right: -60px;
            background: #ffd93d;
        }

        .kid-card::after {
            width: 150px;
            height: 150px;
            bottom: -60px;
            left: -50px;
            background: #6bcbff;
        }

        .kid-card>* {
            position: relative;
            z-index: 2;
        }

        .kid-icon {
            font-size: 4.8em;
            margin-bottom: 6px;
            animation: emojiBounce 0.9s infinite alternate;
            display: inline-block;
        }

        .kid-card h3 {
            font-size: 2.2em;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .kid-card p {
            font-size: 1.1em;
            color: #555;
            margin-top: 2px;
            font-weight: 500;
        }

        /* Correct Popup */
        .kid-correct .kid-card {
            background: linear-gradient(145deg, #f0fff4, #d4f5e6);
            border: 5px solid #38d9a9;
        }

        .kid-correct .kid-card h3 {
            color: #0b8a4a;
        }

        .kid-correct .kid-card p {
            color: #1a6a3a;
        }

        .kid-correct .kid-card::before {
            background: #38d9a9;
        }

        .kid-correct .kid-card::after {
            background: #38d9a9;
        }

        /* Wrong Popup */
        .kid-wrong .kid-card {
            background: linear-gradient(145deg, #fff5f5, #fce4e4);
            border: 5px solid #ff8a8a;
        }

        .kid-wrong .kid-card h3 {
            color: #c0392b;
        }

        .kid-wrong .kid-card p {
            color: #922b21;
        }

        .kid-wrong .kid-card::before {
            background: #ff8a8a;
        }

        .kid-wrong .kid-card::after {
            background: #ff8a8a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0) scale(1);
            }
            to {
                transform: translateY(-12px) scale(1.05);
            }
        }

        /* ===== FINAL POPUP - Same as One Word Quiz ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            padding: 20px;
        }

        .final-kid-box {
            background: linear-gradient(145deg, #fff7d6, #e6fff5);
            padding: 35px 40px;
            border-radius: 44px;
            text-align: center;
            width: 480px;
            max-width: 95%;
            animation: finalBounce 0.8s ease;
            border: 4px solid rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .final-kid-box::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            top: -120px;
            right: -100px;
            background: #ffd93d;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .final-kid-box>* {
            position: relative;
            z-index: 2;
        }

        .final-kid-box h2 {
            font-size: 2.4em;
            color: #2f9e44;
            margin-bottom: 8px;
          
            font-weight: 700 !important;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
            color: #2d3a3a;
        }

        #stars {
            font-size: 2.6em;
            margin: 14px 0;
            letter-spacing: 6px;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
            letter-spacing: 0.5px;
          
        }

        .playAgain-btn:hover {
            transform: translateY(-3px);
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #d4871f;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3) perspective(400px) rotateX(15deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.08) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        /* Fallback image style */
        .image-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            font-size: 3rem;

<body>

    <div class="quiz-card" id="quizContainer">
        <div class="question-title" id="questionText">
            Loading...
        </div>

        <div class="image-section" id="imageSection">
            <img id="questionImage" class="question-image" src="" alt="Question illustration">
        </div>

        <div class="drag-label">
            ✨ Choose the correct answer ✨
        </div>

        <div class="options" id="optionsContainer"></div>

        <div class="bottom-buttons">
            <button class="btn prev-btn" id="prevBtn">
               
                <span><i class="fa-solid fa-angles-left"></i>Prev</span>
            </button>
            <button class="btn next-btn" id="nextBtn">
                <span>Next <i class="fa-solid fa-angles-right"></i></span>
                
            </button>
        </div>
    </div>

    <!-- ===== POPUPS ===== -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        // ================= QUIZ DATA =================
        const quizData = [{
            q: "Q1. The Sea never visited the house of the Sun's because",
            img: "../assets/images/mcq1.png",
            options: [
                { text: "The house was too small.", colorClass: "o1" },
                { text: "The house was too far.", colorClass: "o2" },
                { text: "The house was too dangerous.", colorClass: "o3" },
                { text: "He was too busy.", colorClass: "o4" }
            ],
            correctIndex: 0
        }, {
            q: "Q2. What did the Sea ask the Sun to do before visiting his house?",
            img: "../assets/images/mcq2.png",
            options: [
                { text: "To treat him with different sweets.", colorClass: "o1" },
                { text: "To rise at night.", colorClass: "o2" },
                { text: "To build a big compound around his house.", colorClass: "o3" },
                { text: "To become cool.", colorClass: "o4" }
            ],
            correctIndex: 2
        }, {
            q: "Q3. The Sea went to the house of the Sun with fishes, dolphins and others because",
            img: "../assets/images/mcq3.png",
            options: [
                { text: "They were the children of the Sea.", colorClass: "o1" },
                { text: "They were the friends of the Sea.", colorClass: "o2" },
                { text: "They met the Sea on the way.", colorClass: "o3" },
                { text: "They were curious to see the house of the Sun.", colorClass: "o4" }
            ],
            correctIndex: 1
        }, {
            q: "Q4. The water level rose higher and higher because",
            img: "../assets/images/mcq4.png",
            options: [
                { text: "It was raining heavily.", colorClass: "o1" },
                { text: "The tap was open for a long time.", colorClass: "o2" },
                { text: "The fire engine was discharging water.", colorClass: "o3" },
                { text: "The Sea and his friends entered the house.", colorClass: "o4" }
            ],
            correctIndex: 3
        }, {
            q: "Q5. When the water level kept rising, what did the Sun and the Moon do?",
            img: "../assets/images/mcq5.png",
            options: [
                { text: "They jumped into the water and drowned.", colorClass: "o1" },
                { text: "They jumped up and settled in the sky.", colorClass: "o2" },
                { text: "They jumped into the water and swam away.", colorClass: "o3" },
                { text: "They used a motor and pumped out all the water.", colorClass: "o4" }
            ],
            correctIndex: 1
        }];

        // ============================================================
        //  STATE
        // ============================================================
        let currentIndex = 0;
        let score = 0;
        const answered = new Array(quizData.length).fill(false);
        const locked = new Array(quizData.length).fill(false);
        let isTransitioning = false;
        let popupTimer = null;

        // ============================================================
        //  DOM REFS
        // ============================================================
        const elements = {
            questionText: document.getElementById("questionText"),
            questionImage: document.getElementById("questionImage"),
            optionsContainer: document.getElementById("optionsContainer"),
            prevBtn: document.getElementById("prevBtn"),
            nextBtn: document.getElementById("nextBtn"),
            popup: document.getElementById("answerPopup"),
            popupIcon: document.getElementById("popupIcon"),
            popupTitle: document.getElementById("popupTitle"),
            popupMsg: document.getElementById("popupMsg"),
            finalPopup: document.getElementById("finalPopup"),
            finalScore: document.getElementById("finalScore"),
            stars: document.getElementById("stars"),
            container: document.getElementById("quizContainer"),
            correctSound: document.getElementById("correctSound"),
            wrongSound: document.getElementById("wrongSound"),
            playAgainBtn: document.getElementById("playAgainBtn"),
        };

        // ============================================================
        //  UTILITIES - Same as One Word Quiz
        // ============================================================
        function speak(text) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function smallConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 35, spread: 70, origin: { y: 0.7 } });
            }
        }

        function bigConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 80, spread: 100, origin: { y: 0.6 } });
            }
        }

        // ============================================================
        //  POPUP - Same as One Word Quiz
        // ============================================================
        function showPopup(isCorrect) {
            if (popupTimer) clearTimeout(popupTimer);

            const popup = elements.popup;
            const icon = elements.popupIcon;
            const title = elements.popupTitle;
            const msg = elements.popupMsg;

            popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
            popup.style.display = "flex";

            if (isCorrect) {
                icon.textContent = "🌟";
                title.textContent = "Amazing!";
                msg.textContent = "You got it right! ✨";
                if (elements.correctSound) elements.correctSound.play().catch(() => {});
                smallConfetti();
                speak("Correct");
            } else {
                icon.textContent = "😒";
                title.textContent = "Keep Going!";
                msg.textContent = "Try again, you can do it! 🌈";
                if (elements.wrongSound) elements.wrongSound.play().catch(() => {});
                speak("Try again");
            }

            popupTimer = setTimeout(() => {
                popup.style.display = "none";
            }, 1800);
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderQuestion() {
            if (isTransitioning) return;
            isTransitioning = true;

            const q = quizData[currentIndex];
            elements.questionText.textContent = q.q;
            elements.questionImage.src = q.img;
            elements.questionImage.alt = `Question ${currentIndex + 1}`;

            // Clear options
            elements.optionsContainer.innerHTML = "";

            // Enable/disable nav
            elements.prevBtn.disabled = currentIndex === 0;
            
            // Next button: enabled if answered OR on last question (will show final)
            if (currentIndex === quizData.length - 1 && answered[currentIndex]) {
                elements.nextBtn.disabled = false;
                elements.nextBtn.innerHTML = '<span>Next<i class="fa-solid fa-angles-right"></i></span> ';
            } else if (currentIndex === quizData.length - 1 && !answered[currentIndex]) {
                elements.nextBtn.disabled = true;
                elements.nextBtn.innerHTML = '<span>Next <i class="fa-solid fa-angles-right"></i></span>';
            } else {
                elements.nextBtn.disabled = !answered[currentIndex];
                elements.nextBtn.innerHTML = '<span>Next<i class="fa-solid fa-angles-right"></i></span> ';
            }

            // Generate options
            q.options.forEach((opt, idx) => {
            const letters = ["A", "B", "C", "D"];
const letterClasses = ["letter-a", "letter-b", "letter-c", "letter-d"];

const optionDiv = document.createElement("div");
optionDiv.className = `option ${opt.colorClass}`;

optionDiv.innerHTML = `
    <div class="option-letter ${letterClasses[idx]}">
        ${letters[idx]}
    </div>

    <div class="option-text">
        ${opt.text}
    </div>

    ${
        opt.image
            ? `<img src="${opt.image}" class="option-image" alt="">`
            : ""
    }
`;

                if (answered[currentIndex]) {
                    if (idx === q.correctIndex) {
                        optionDiv.classList.add("correct");
                    }
                    optionDiv.classList.add("disabled");
                } else {
                    optionDiv.addEventListener("click", () => {
                        if (locked[currentIndex]) return;

                        if (idx === q.correctIndex) {
                            // CORRECT
                            locked[currentIndex] = true;
                            answered[currentIndex] = true;
                            score++;
                            showPopup(true);
                            optionDiv.classList.add("correct");
                            
                            // Update next button
                            if (currentIndex === quizData.length - 1) {
                                elements.nextBtn.disabled = false;
                                elements.nextBtn.innerHTML = '<span>Next<i class="fa-solid fa-angles-right"></i></span> ';
                            } else {
                                elements.nextBtn.disabled = false;
                                elements.nextBtn.innerHTML = '<span>Next<i class="fa-solid fa-angles-right"></i></span> ';
                            }

                            // Disable all options
                            document.querySelectorAll('.option').forEach(el => el.classList.add('disabled'));

                           if (score === quizData.length) {
    setTimeout(() => {
        showFinal();
    }, 1200);
}
                        } else {
                            // WRONG
                            showPopup(false);
                            optionDiv.classList.add("wrong");
                            setTimeout(() => {
                                optionDiv.classList.remove("wrong");
                            }, 600);
                        }
                    });
                }
                elements.optionsContainer.appendChild(optionDiv);
            });

            // Slide animation
            elements.container.classList.remove('slide-in');
            void elements.container.offsetWidth;
            elements.container.classList.add('slide-in');

            setTimeout(() => {
                isTransitioning = false;
            }, 500);
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        elements.prevBtn.onclick = () => {
            if (isTransitioning || currentIndex === 0) return;
            currentIndex--;
            renderQuestion();
        };

        elements.nextBtn.onclick = () => {
            if (isTransitioning) return;
            
            // If on last question and answered, show final
            if (currentIndex === quizData.length - 1 && answered[currentIndex]) {
                showFinal();
                return;
            }
            
            if (answered[currentIndex] === false) return;
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        };

        // ============================================================
        //  FINAL
        // ============================================================
        function showFinal() {
            elements.finalPopup.style.display = "flex";
            elements.finalScore.textContent = `Your Score: ${score} / ${quizData.length}`;
            elements.stars.textContent = "⭐".repeat(score);
            bigConfetti();
            // setTimeout(() => speak(`You scored ${score} out of ${quizData.length}`), 600);
        }

        // ============================================================
        //  RESTART
        // ============================================================
        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            for (let i = 0; i < quizData.length; i++) {
                locked[i] = false;
                answered[i] = false;
            }
            elements.finalPopup.style.display = 'none';
            renderQuestion();
        }

        elements.playAgainBtn.onclick = restartQuiz;

        // ============================================================
        //  INIT
        // ============================================================
        renderQuestion();
        console.log('✅ MCQ Quiz - with fixed Prev/Next navigation');
        console.log('✅ Next button works correctly when going back to previous questions');
    </script>
</body>

</html>
