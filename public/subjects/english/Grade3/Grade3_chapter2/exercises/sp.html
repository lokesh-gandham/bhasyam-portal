
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plural Forms Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
    @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
            /* background: #fbfcff; */
            position: relative;
        }

        /* ===== DECORATIVE CORNER STARS ===== */
        .decor {
            position: absolute;
            pointer-events: none;
            user-select: none;
            z-index: 0;
             display:none;
        }

        /* ===== BOTTOM GRASS / FLOWER DECORATION ===== */
        .grass-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: -18px;
            height: 60px;
            background: linear-gradient(#8fd977, #5bb84a);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            z-index: 0;
            display:none;
        }
        .flower {
            position: fixed;
            bottom: 6px;
            font-size: 24px;
            z-index: 1;
             display:none;
        }
        .leaf-corner {
            position: fixed;
            bottom: -10px;
            font-size: 60px;
            z-index: 0;
            opacity: 0.9;
             display:none;
        }

        .quiz {
            width: 100%;
            max-width: 780px;
            padding: 10px 25px;
            text-align: center;
            border-radius: 40px;
            position: relative;
            z-index: 2;
        }

        /* QUESTION BOX */
        .question-box {
            width: 92%;
            margin: 0 auto 18px;
            background: #ffffff;
            border: 2px solid #b39ddb;;
            border-radius: 60px;
            padding: 7px 12px;
            font-size: 22px;
            font-weight: 400;
            color: #5a6a8a;
           
            position: relative;
        }

        /* META ROW: Q number + given word badges */
        .meta-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .q-number-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffffff, #fcfbff);
            color: rgb(23, 36, 125);
            font-size: 20px;
            font-weight: 800;
            padding: 10px 22px;
            border-radius: 30px;
            /* box-shadow: 0 6px 14px rgba(94, 53, 177, 0.32); */
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .word-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            /* background: linear-gradient(135deg, #ffe082, #ffc247); */
            color: #4a3300;
            font-size: 20px;
            font-weight: 700;
            padding: 10px 22px;
            border-radius: 30px;
            /* box-shadow: 0 6px 14px rgba(255, 178, 40, 0.3); */
        }

        .english-word {
            font-size: 40px;
            font-weight: 800;
            color: rgb(23, 36, 125);
            text-transform: capitalize;
        }

        /* CONTENT CARD: image left, answer box right */
        .content-card {
            display: flex;
            align-items: stretch;
            background: #ffffff;
            border: 3px solid #4fd1c5;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.07);
            overflow: hidden;
            min-height: 190px;
            margin-bottom: 20px;
        }

        .image-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

.word-image{
    display: flex;
    justify-content: center;
    width: 100%;
    height: 100%;
}

.word-image img{
    width: 100%;
    height: 100%;
    max-height: 180px;
    object-fit: contain;
    border-radius: 20px;
}

        .divider {
            width: 0;
            border-left: 3px dashed #bcd7ea;
            margin: 24px 0;
        }

        .answer-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            gap: 10px;
        }

        /* INPUT GROUP */
        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            /* border: 3px dashed #8a6cf0; */
            border-radius: 18px;
            /* background: #faf7ff; */
            overflow: hidden;
            transition: all 0.3s ease;
            min-width: 220px;
            min-height: 110px;
            margin: 0 auto;
            padding: 0 15px;
            text-transform: capitalize;
        }

        .input-group.correct {
            border-style: solid;
            border-color: #2ecc71;
            background: #d4f5e0;
        }

        .input-group.wrong {
            border-style: solid;
            border-color: #e74c3c;
            background: #ffd5d5;
            animation: shake .3s linear;
        }

        .input-group.disabled {
            opacity: 0.9;
        }

        .pre-filled {
            font-size: 34px;
            font-weight: 400;
            color: #2f4f4f;
            padding: 8px 0;
            background: transparent;
            min-width: 30px;
        }

        .pre-filled.correct-text {
            color: #1f7a48;
        }

        .answer-input {
            font-size: 32px;
            font-weight: 400;
            color: #2f4f4f;
            padding: 8px 5px;
            border: none;
            outline: none;
            background: transparent;
            width: 120px;
            text-align: center;
        }

        .answer-input::placeholder {
            color: #2f4f4f;
            font-size: 20px;
            font-weight: 700;
        }

        .answer-input:disabled {
            opacity: 1;
            cursor: default;
        }

        .answer-input.correct-input {
            color: #1f7a48;
            text-transform: capitalize;
        }

        .input-group.correct .pre-filled {
            color: #1f7a48;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }

        /* FULL WORD DISPLAY BELOW INPUT (kept, same behavior/logic as before) */
        .full-word-hint {
            font-size: 22px;
            color: #6a7a8a;
            margin-bottom: 0;
            min-height: 35px;
            font-weight: 500;
            text-transform: capitalize;
            display: none;
        }

        .full-word-hint .highlight-word {
            color: #2ecc71;
            font-weight: 700;
        }

        /* SUFFIX OPTIONS */
        .options-label {
            font-size: 18px;
            color: #2f4f4f;
            margin-bottom: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .options-container {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .suffix-option {
            width: 130px;
            height: 66px;
            border: 3px dashed rgba(255, 255, 255, 0.85);
            border-radius: 16px;
            font-size: 28px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .suffix-option:nth-child(1) {
            background: #bfe3fb;
            color: #155a8a;
        }
        .suffix-option:nth-child(2) {
            background: #ffe08a;
            color: #7a4a00;
        }
        .suffix-option:nth-child(3) {
            background: #ffb3b3;
            color: #7a1f1f;
        }

        .suffix-option:hover:not(.disabled) {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }

        .suffix-option:active:not(.disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.06);
        }

        .suffix-option.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .suffix-option.correct-selected {
            background: #d4f5e0;
            border-color: #2ecc71;
            border-style: solid;
            color: #1f7a48;
            transform: scale(1.05);
        }

        .suffix-option.wrong-selected {
            background: #ffd5d5;
            border-color: #e74c3c;
            border-style: solid;
            animation: shake .3s linear;
        }

        /* NAVIGATION */
        .nav-area {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            margin-top: 0px;
        }

        .nav-btn {
            border-radius: 40px;
            padding: 14px 32px;
            font-size: 20px;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            width: 150px;
            color: #ffffff;
            border: 3px solid #ffffff;
        }

          .prev-btn {
            background: linear-gradient(#86cfe5, #66b6d2);
            box-shadow: 0 4px 0 #3e9dbb;
        }
        .prev-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 #3e9dbb;
        }

        .next-btn {
            background: linear-gradient(#ffc37a, #f7a24f);
            box-shadow: 0 4px 0 #e08634;
        }
        .next-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 #e08634;
        }

        .nav-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== KID POPUP (unchanged) ===== */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }

        .kid-card {
            background: #ffffff;
            width: 380px;
            max-width: 95%;
            padding: 32px 28px;
            border-radius: 44px;
            text-align: center;
            animation: kidPop 0.6s ease;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .kid-card::before,
        .kid-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .kid-card::before {
            width: 200px;
            height: 200px;
            top: -80px;
            right: -60px;
            background: #ffd93d;
        }

        .kid-card::after {
            width: 150px;
            height: 150px;
            bottom: -60px;
            left: -50px;
            background: #6bcbff;
        }

        .kid-card>* {
            position: relative;
            z-index: 2;
        }

        .kid-icon {
            font-size: 4.8em;
            margin-bottom: 6px;
            animation: emojiBounce 0.9s infinite alternate;
            display: inline-block;
        }

        .kid-card h3 {
            font-size: 2.2em;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .kid-card p {
            font-size: 1.1em;
            color: #555;
            margin-top: 2px;
            font-weight: 500;
        }

        .kid-correct .kid-card {
            background: linear-gradient(145deg, #f0fff4, #d4f5e6);
            border: 5px solid #38d9a9;
        }

        .kid-correct .kid-card h3 {
            color: #0b8a4a;
        }

        .kid-correct .kid-card p {
            color: #1a6a3a;
        }

        .kid-wrong .kid-card {
            background: linear-gradient(145deg, #fff5f5, #fce4e4);
            border: 5px solid #ff8a8a;
        }

        .kid-wrong .kid-card h3 {
            color: #c0392b;
        }

        .kid-wrong .kid-card p {
            color: #922b21;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0) scale(1);
            }
            to {
                transform: translateY(-12px) scale(1.05);
            }
        }

        /* ===== FINAL POPUP (unchanged) ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            padding: 20px;
        }

        .final-kid-box {
            background: linear-gradient(145deg, #fff7d6, #e6fff5);
            padding: 35px 40px;
            border-radius: 44px;
            text-align: center;
            width: 480px;
            max-width: 95%;
            animation: finalBounce 0.8s ease;
            border: 4px solid rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .final-kid-box::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            top: -120px;
            right: -100px;
            background: #ffd93d;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .final-kid-box>* {
            position: relative;
            z-index: 2;
        }

        .final-kid-box h2 {
            font-size: 2.4em;
            color: #2f9e44;
            margin-bottom: 8px;
            font-weight: 700 !important;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
            color: #2d3a3a;
        }

        #stars {
            font-size: 2.6em;
            margin: 14px 0;
            letter-spacing: 6px;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
            letter-spacing: 0.5px;
        }

        .playAgain-btn:hover {
            transform: translateY(-3px);
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #d4871f;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3) perspective(400px) rotateX(15deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.08) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        /* ================================
   Large Desktop (1441px - 1920px)
=================================== */
@media (min-width: 1441px) and (max-width: 1920px) {

    body{
        padding: 30px;
    }

    .quiz{
        max-width: 940px;
        padding: 40px 35px;
    }

    .question-box{
        width: 90%;
        font-size: 28px;
        padding: 20px 30px;
        margin-bottom: 26px;
    }
.english-word {
            font-size: 60px;
           
        }
    .meta-row{
        margin-bottom: 26px;
    }

    .q-number-box, .word-badge{
        font-size: 26px;
        padding: 14px 28px;
    }

    .content-card{
        min-height: 320px;
    }

.word-image img{
    max-height: 300px;
}

    .input-group{
        min-width: 260px;
        min-height: 130px;
        border-width: 4px;
        border-radius: 22px;
        padding: 0 20px;
    }

    .pre-filled{
        font-size: 44px;
    }

    .answer-input{
        font-size: 42px;
        width: 160px;
    }

    .answer-input::placeholder{
        font-size: 24px;
    }

    .options-label{
        font-size: 22px;
        margin-bottom: 20px;
    }

    .options-container{
        gap: 28px;
        margin-bottom: 40px;
    }

    .suffix-option{
        width: 150px;
        height: 78px;
        font-size: 34px;
        border-radius: 20px;
    }

    .nav-area{
        margin-top: 15px;
    }

   .nav-btn {
              font-size: 22px;
                padding: 16px 40px;
                min-width: 170px;
            }

     .kid-card {
                width: 460px;
                padding: 34px 32px;
            }
            .kid-icon {
                font-size: 5em;
            }
            .kid-card h3 {
                font-size: 2em;
            }
            .final-kid-box {
                width: 500px;
                padding: 38px;
            }
            .final-kid-box h2 {
                font-size: 2.6em;
            }
            .final-kid-box p {
                font-size: 1.4em;
            }
            #stars {
                font-size: 2.8em;
            }
            .playAgain-btn {
                padding: 16px 40px;
                font-size: 1.2em;
            }
        
}

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .quiz {
                padding: 20px 15px;
                border-radius: 30px;
            }
            .question-box {
                width: 95%;
                font-size: 14px;
                padding: 10px 15px;
                margin-bottom: 14px;
            }
            .meta-row {
                gap: 8px;
                margin-bottom: 14px;
            }
            .q-number-box, .word-badge {
                font-size: 14px;
                padding: 7px 14px;
                border-radius: 20px;
            }
            .english-word {
                font-size: 14px;
            }
            .content-card {
                flex-direction: column;
                min-height: unset;
            }
            .divider {
                border-left: none;
                border-top: 3px dashed #bcd7ea;
                width: 80%;
                margin: 0 auto;
            }
            .word-image img{
                max-height: 160px;
            }
            .pre-filled {
                font-size: 26px;
                padding: 6px 0;
            }
            .answer-input {
                font-size: 26px;
                width: 90px;
                padding: 6px 4px;
            }
            .answer-input::placeholder {
                font-size: 16px;
            }
            .input-group {
                border-width: 3px;
                border-radius: 14px;
                min-width: 180px;
                min-height: 80px;
                padding: 0 12px;
            }
            .suffix-option {
                width: 78px;
                height: 52px;
                font-size: 20px;
                border-width: 2px;
            }
            .options-container {
                gap: 12px;
                margin-bottom: 22px;
            }
            .options-label {
                font-size: 14px;
            }
            .nav-btn {
                width: 120px;
                font-size: 16px;
                padding: 10px 18px;
            }
            .nav-area {
                gap: 15px;
            }
            .kid-card {
                width: 320px;
                padding: 24px 22px;
                border-radius: 36px;
            }
            .kid-icon {
                font-size: 3.6em;
            }
            .kid-card h3 {
                font-size: 1.6em;
            }
            .final-kid-box {
                width: 92%;
                padding: 28px 24px;
            }
            .final-kid-box h2 {
                font-size: 2em;
            }
            #stars {
                font-size: 2.2em;
            }
            .playAgain-btn {
                padding: 12px 28px;
                font-size: 1em;
            }
            .grass-bar { height: 40px; }
            .flower { font-size: 16px; }
            .leaf-corner { font-size: 38px; }
        }

        @media (max-width: 480px) {
            .quiz {
                padding: 15px 10px;
                border-radius: 24px;
            }
            .question-box {
                font-size: 11px;
                padding: 8px 12px;
                margin-bottom: 12px;
                border-radius: 40px;
            }
            .q-number-box, .word-badge {
                font-size: 11px;
                padding: 6px 10px;
            }
            .english-word {
                font-size: 11px;
            }
            .word-image img{
                max-height: 120px;
            }
            .pre-filled {
                font-size: 20px;
                padding: 4px 0;
                min-width: 15px;
            }
            .answer-input {
                font-size: 20px;
                width: 75px;
                padding: 4px 3px;
            }
            .answer-input::placeholder {
                font-size: 12px;
            }
            .input-group {
                border-width: 2px;
                border-radius: 10px;
                min-width: 140px;
                min-height: 66px;
                padding: 0 8px;
            }
            .suffix-option {
                width: 60px;
                height: 42px;
                font-size: 16px;
                border-width: 2px;
                border-radius: 12px;
            }
            .options-container {
                gap: 8px;
                margin-bottom: 18px;
            }
            .options-label {
                font-size: 12px;
                margin-bottom: 8px;
            }
            .nav-btn {
                padding: 8px 14px;
                font-size: 13px;
                width: 100px;
            }
            .nav-area {
                gap: 10px;
            }
            .kid-card {
                width: 280px;
                padding: 18px 16px;
                border-radius: 32px;
            }
            .kid-icon {
                font-size: 3em;
            }
            .kid-card h3 {
                font-size: 1.4em;
            }
            .final-kid-box {
                width: 92%;
                padding: 20px 16px;
                border-radius: 32px;
            }
            .final-kid-box h2 {
                font-size: 1.5em;
            }
            #stars {
                font-size: 1.8em;
            }
            .playAgain-btn {
                padding: 10px 22px;
                font-size: 0.9em;
            }
            .grass-bar { height: 30px; }
            .flower { display: none; }
            .leaf-corner { display: none; }
        }

    </style>
</head>
<body>

    <!-- Decorative corner stars -->
    <div class="decor" style="top:14px;left:14px;font-size:22px;">⭐</div>
    <div class="decor" style="top:44px;left:60px;font-size:14px;">✨</div>
    <div class="decor" style="top:70px;left:20px;font-size:10px;color:#8a6cf0;">✦</div>
    <div class="decor" style="top:14px;right:14px;font-size:22px;">⭐</div>
    <div class="decor" style="top:44px;right:60px;font-size:14px;">✨</div>
    <div class="decor" style="top:70px;right:20px;font-size:10px;color:#ff8fa3;">✦</div>

    <!-- Bottom grass + flowers -->
    <div class="grass-bar"></div>
    <div class="leaf-corner" style="left:-8px;">🌿</div>
    <div class="leaf-corner" style="right:-8px; transform: scaleX(-1);">🌿</div>
    <div class="flower" style="left:6%;">🌼</div>
    <div class="flower" style="left:16%; font-size:16px;">🌸</div>
    <div class="flower" style="right:6%;">🌼</div>
    <div class="flower" style="right:16%; font-size:16px;">🌸</div>

    <div class="quiz">
        <div class="question-box">
            Write the plural form of the given word.
        </div>

        <!-- Question number + Given word badges -->
        <div class="meta-row">
            <span class="q-number-box" id="questionNo">Q1</span>
            <span class="word-badge">Given Word: <span id="englishWord" class="english-word">catch</span></span>
        </div>

        <!-- Content card: image left, answer box right -->
        <div class="content-card">
            <div class="image-side">
                <div class="word-image">
                    <img id="wordImage" src="./assets/images/catch.png" alt="Word Image">
                </div>
            </div>

            <div class="divider"></div>

            <div class="answer-side">
                <!-- Input Group -->
                <div class="input-group" id="inputGroup">
                    <span class="pre-filled" id="preFilled">catc</span>
                    <input type="text" class="answer-input" id="answerInput" placeholder="??" maxlength="5" autocomplete="off" readonly>
                </div>

                <!-- Full Word Hint (kept in DOM, same logic, hidden as in original) -->
                <div class="full-word-hint" id="fullWordHint">
                    <span>Complete word: </span>
                    <span class="highlight-word" id="highlightWord">catc + ??</span>
                </div>
            </div>
        </div>

        <!-- Suffix Options -->
        <div class="options-label">✨ Click the correct suffix ✨</div>
        <div class="options-container" id="optionsContainer">
            <button class="suffix-option" data-suffix="hes">hes</button>
            <button class="suffix-option" data-suffix="ses">ses</button>
            <button class="suffix-option" data-suffix="xes">xes</button>
        </div>

        <!-- Navigation -->
        <div class="nav-area">
            <button class="nav-btn prev-btn" id="prevBtn" disabled>
                <i class="fa-solid fa-angles-left"></i> Prev
            </button>
            <button class="nav-btn next-btn" id="nextBtn" disabled>
                Next <i class="fa-solid fa-angles-right"></i>
            </button>
        </div>
    </div>

    <!-- ===== KID POPUP ===== -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon">🌟</div>
            <h3 id="popupTitle">Amazing!</h3>
            <p id="popupMsg">You got it right! ✨</p>
        </div>
    </div>

    <!-- ===== FINAL POPUP ===== -->
    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        // ==========================
        // QUESTIONS - Plural Forms
        // ==========================
      const QUESTIONS = [
    {
        word: "catch",
        image: "../assets/images/catch.png",
        preFill: "catc",
        correctSuffix: "hes",
        fullAnswer: "catches",
        options: ["hes", "ses", "xes"]
    },
    {
        word: "brush",
        image: "../assets/images/brush.png",
        preFill: "brus",
        correctSuffix: "hes",
        fullAnswer: "brushes",
        options: ["hes", "ses", "xes"]
    },
    {
        word: "loss",
        image: "../assets/images/loss.png",
        preFill: "los",
        correctSuffix: "ses",
        fullAnswer: "losses",
        options: ["hes", "ses", "xes"]
    },
    {
        word: "patch",
        image: "../assets/images/patch.png",
        preFill: "patc",
        correctSuffix: "hes",
        fullAnswer: "patches",
        options: ["hes", "ses", "xes"]
    },
    {
        word: "fox",
        image: "../assets/images/fox.png",
        preFill: "fo",
        correctSuffix: "xes",
        fullAnswer: "foxes",
        options: ["hes", "ses", "xes"]
    },
    {
        word: "dress",
        image: "../assets/images/dress.png",
        preFill: "dres",
        correctSuffix: "ses",
        fullAnswer: "dresses",
        options: ["hes", "ses", "xes"]
    }
];
        // ==========================
        // AUDIO
        // ==========================
        let audioCtx = null;

        function playCorrectSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 880;
                gainNode.gain.value = 0.2;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch (e) { console.log("Audio error:", e); }
        }

        function playWrongSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 440;
                gainNode.gain.value = 0.25;
                oscillator.type = 'sawtooth';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
                oscillator.stop(audioCtx.currentTime + 0.4);
            } catch (e) { console.log("Audio error:", e); }
        }

        // ==========================
        // STATE
        // ==========================
        let currentIndex = 0;
        let quizCompleted = false;
        let userStates = [];
        const wordImage = document.getElementById("wordImage");
        function initStates() {
            userStates = [];
            for (let i = 0; i < QUESTIONS.length; i++) {
                userStates.push({
                    userSuffix: '',
                    isCorrect: false
                });
            }
        }
        initStates();

        // ==========================
        // DOM REFS
        // ==========================
        const englishWordEl = document.getElementById("englishWord");
        const questionNoEl = document.getElementById("questionNo");
        const preFilledEl = document.getElementById("preFilled");
        const answerInput = document.getElementById("answerInput");
        const inputGroup = document.getElementById("inputGroup");
        const fullWordHint = document.getElementById("fullWordHint");
        const highlightWord = document.getElementById("highlightWord");
        const optionsContainer = document.getElementById("optionsContainer");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        const popupOverlay = document.getElementById("answerPopup");
        const popupIcon = document.getElementById("popupIcon");
        const popupTitle = document.getElementById("popupTitle");
        const popupMsg = document.getElementById("popupMsg");

        const finalPopup = document.getElementById("finalPopup");
        const finalScore = document.getElementById("finalScore");
        const starsEl = document.getElementById("stars");
        const playAgainBtn = document.getElementById("playAgainBtn");

        let popupTimer = null;

        // ==========================
        // SPEECH
        // ==========================
        function speak(text) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        // ==========================
        // CONFETTI
        // ==========================
        function smallConfetti() {
            confetti({ particleCount: 35, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 80, spread: 100, origin: { y: 0.6 } });
            setTimeout(() => {
                confetti({ particleCount: 60, spread: 80, origin: { y: 0.5, x: 0.2 } });
                confetti({ particleCount: 60, spread: 80, origin: { y: 0.5, x: 0.8 } });
            }, 200);
        }

        // ==========================
        // POPUP
        // ==========================
        function showPopup(isCorrect) {
            if (popupTimer) clearTimeout(popupTimer);

            popupOverlay.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
            popupOverlay.style.display = 'flex';

            if (isCorrect) {
                popupIcon.textContent = '🌟';
                popupTitle.textContent = 'Amazing!';
                popupMsg.textContent = 'You got it right! ✨';
                // playCorrectSound();
                smallConfetti();
                speak('Correct');
            } else {
                popupIcon.textContent = '😒';
                popupTitle.textContent = 'Keep Going!';
                popupMsg.textContent = 'Try again, you can do it! 🌈';
                // playWrongSound();
                speak('Try again');
            }

            popupTimer = setTimeout(() => {
                popupOverlay.style.display = 'none';
            }, 1800);
        }

        // ==========================
        // FINAL
        // ==========================
        function showFinalCelebration() {
            if (quizCompleted) return;
            quizCompleted = true;

            bigConfetti();

            setTimeout(() => {
                finalPopup.style.display = 'flex';
                finalScore.textContent = `Your Score: ${QUESTIONS.length} / ${QUESTIONS.length}`;
                starsEl.textContent = '⭐⭐⭐⭐⭐';
                // setTimeout(() => speak(`You completed all questions!`), 600);
            }, 800);
        }

        // ==========================
        // BUTTONS
        // ==========================
        function updateNavButtons() {
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = !userStates[currentIndex].isCorrect;
        }

        // ==========================
        // UPDATE FULL WORD DISPLAY
        // ==========================
        function updateFullWordDisplay(suffix, isCorrect) {
            const q = QUESTIONS[currentIndex];

            if (isCorrect) {
                // Show the complete full word in green
                highlightWord.textContent = q.fullAnswer;
                highlightWord.style.color = '#2ecc71';
                highlightWord.style.background = '#d4f5e0';
                highlightWord.style.padding = '0 12px';
                highlightWord.style.borderRadius = '8px';
                // Also fill the input with the full word
                answerInput.value = q.fullAnswer;
                preFilledEl.style.display = "none";
preFilledEl.textContent = "";
            } else if (suffix) {
                // Show the combination with the suffix
                highlightWord.textContent = q.preFill + ' + ' + suffix + ' = ?';
                highlightWord.style.color = '#ff6b6b';
                highlightWord.style.background = 'transparent';
                highlightWord.style.padding = '0';
            } else {
                // Default state
                highlightWord.textContent = q.preFill + ' + ??';
                highlightWord.style.color = '';
                highlightWord.style.background = 'transparent';
                highlightWord.style.padding = '0';
            }
        }

        // ==========================
        // SELECT SUFFIX OPTION - Auto Check
        // ==========================
        function selectSuffixOption(suffix, btn) {
            const state = userStates[currentIndex];
            if (state.isCorrect) return;

            const q = QUESTIONS[currentIndex];

            // Fill the input with just the suffix
            answerInput.value = suffix;

            // Update the hint
            updateFullWordDisplay(suffix, false);

            if (suffix === q.correctSuffix) {
                // CORRECT - Show full word in input
                state.isCorrect = true;
                state.userSuffix = suffix;

                // Show the full word in the input box
                setTimeout(() => {
                    updateFullWordDisplay(suffix, true);
                }, 300);

                inputGroup.classList.add('correct');
                inputGroup.classList.remove('wrong');
                answerInput.disabled = true;
                answerInput.classList.add('correct-input');
                preFilledEl.classList.add('correct-text');

                // Mark correct option
                document.querySelectorAll('.suffix-option').forEach(b => {
                    b.classList.add('disabled');
                    b.style.pointerEvents = 'none';
                    if (b.dataset.suffix === suffix) {
                        b.classList.add('correct-selected');
                    }
                });

                showPopup(true);
                updateNavButtons();

                if (userStates.every(s => s.isCorrect)) {
                    showFinalCelebration();
                }

            } else {
                // WRONG
                inputGroup.classList.add('wrong');
                btn.classList.add('wrong-selected');

                showPopup(false);

                setTimeout(() => {
                    inputGroup.classList.remove('wrong');
                    btn.classList.remove('wrong-selected');
                    answerInput.value = '';
                    preFilledEl.textContent = q.preFill;
                    // Reset hint
                    highlightWord.textContent = q.preFill + ' + ??';
                    highlightWord.style.color = '';
                    highlightWord.style.background = 'transparent';
                    highlightWord.style.padding = '0';
                    // Re-enable all options
                    document.querySelectorAll('.suffix-option').forEach(b => {
                        if (!b.classList.contains('disabled')) {
                            b.style.pointerEvents = 'auto';
                        }
                    });
                }, 800);
            }
        }

        // ==========================
        // LOAD
        // ==========================
        function loadQuestion() {
            const q = QUESTIONS[currentIndex];
            const state = userStates[currentIndex];

            // Update question number box
            questionNoEl.textContent = 'Q' + (currentIndex + 1);

            englishWordEl.textContent = q.word;
            wordImage.src = q.image;
wordImage.alt = q.word;
            preFilledEl.textContent = q.preFill;
            answerInput.value = state.userSuffix || '';

            // Reset hint
            if (state.isCorrect) {
                highlightWord.textContent = q.fullAnswer;
                highlightWord.style.color = '#2ecc71';
                highlightWord.style.background = '#d4f5e0';
                highlightWord.style.padding = '0 12px';
                highlightWord.style.borderRadius = '8px';
                answerInput.value = q.fullAnswer;
                preFilledEl.style.display = "none";
preFilledEl.textContent = "";
            } else {
                highlightWord.textContent = q.preFill + ' + ??';
                highlightWord.style.color = '';
                highlightWord.style.background = 'transparent';
                highlightWord.style.padding = '0';
            }

            inputGroup.classList.remove('correct', 'wrong');
            inputGroup.classList.remove('disabled');
            preFilledEl.classList.remove('correct-text');
            answerInput.classList.remove('correct-input');

            // Reset options
            document.querySelectorAll('.suffix-option').forEach(btn => {
                btn.classList.remove('correct-selected', 'wrong-selected', 'disabled');
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            });

            // Update options for current question
            const optionBtns = document.querySelectorAll('.suffix-option');
            optionBtns.forEach((btn, idx) => {
                if (idx < q.options.length) {
                    btn.dataset.suffix = q.options[idx];
                    btn.textContent = q.options[idx];
                    btn.style.display = 'flex';
                } else {
                    btn.style.display = 'none';
                }
            });

            if (state.isCorrect) {
                inputGroup.classList.add('correct');
                inputGroup.classList.add('disabled');
                answerInput.disabled = true;
                answerInput.classList.add('correct-input');
                preFilledEl.classList.add('correct-text');

                document.querySelectorAll('.suffix-option').forEach(btn => {
                    btn.classList.add('disabled');
                    btn.style.pointerEvents = 'none';
                    if (btn.dataset.suffix === state.userSuffix) {
                        btn.classList.add('correct-selected');
                    }
                });
            } else {
                answerInput.disabled = false;
                answerInput.value = '';
                preFilledEl.style.display = "inline-block";
    preFilledEl.textContent = q.preFill;

            }

            updateNavButtons();
        }

        // ==========================
        // NAVIGATION
        // ==========================
        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        };

        nextBtn.onclick = () => {
            if (userStates[currentIndex].isCorrect && currentIndex < QUESTIONS.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        };

        // ==========================
        // EVENT LISTENERS
        // ==========================
        document.querySelectorAll('.suffix-option').forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.classList.contains('disabled')) return;
                selectSuffixOption(this.dataset.suffix, this);
            });
        });

        // ==========================
        // PLAY AGAIN
        // ==========================
        playAgainBtn.onclick = () => {
            currentIndex = 0;
            quizCompleted = false;
            initStates();
            finalPopup.style.display = 'none';
            loadQuestion();
        };

        // ==========================
        // START
        // ==========================
        loadQuestion();

        console.log('📝 Plural Forms Quiz - Click to Answer!');
        console.log('📊 Total questions: ' + QUESTIONS.length);
        console.log('✅ Click a suffix to see the full word combined!');
    </script>

</body>
</html>
