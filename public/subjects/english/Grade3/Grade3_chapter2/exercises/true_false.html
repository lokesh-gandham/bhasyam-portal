<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>True / False Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
            @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* background: linear-gradient(135deg, #f5f0ff, #e8e0ff);
            padding: 20px; */
        }

        .quiz-container {
            width: min(900px, 95vw);
            border-radius: 35px;
            /* padding: 30px; */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            /* background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15); */
        }

        .question-box {
            width: 100%;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: #172b63;
            font-weight: 700;
            line-height: 1.4;
            text-align: center;
            padding: 10px;
        }

        .question-image {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .question-image img {
            width: 250px;
            height: 180px;
            object-fit: contain;
            border-radius: 20px;
            /* background: #f0f2f5; */
            padding: 10px;
        }

        .answers {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px auto;

        }

        .answer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 120px;
            width:220px;
            margin: auto;
            border-radius: 18px;
            font-size: 32px;
            font-weight: 700;
            color: white;
            border: none;
            cursor: pointer;
            transition: transform .2s ease, opacity .2s ease;
            /* box-shadow: inset 0 2px 6px rgba(255, 255, 255, .4), inset 0 -4px 10px rgba(0, 0, 0, .15), 0 6px 12px rgba(0, 0, 0, .15); */
           background-color: #ede7ff00;
                       /* border: 5px dotted rgb(253, 252, 252); */

        }

        .answer:hover:not(:disabled) {
            transform: translateY(-6px);
        }

        .answer:disabled {
            cursor: not-allowed;
            opacity: 0.1;
        }

        .answer.true {
            /* background: linear-gradient(135deg, #34d399, #22c55e); */
            color: green;
           
        }

        .answer.false {
            /* background: linear-gradient(135deg, #e79494, #ff9393); */
            color: red;
        }

        .answer.correct {
            opacity: 1 !important;
        }

        .answer.wrong {
            opacity: 0.5 !important;
        }

        .emoji-container {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.685);
            display: none;
        }

        .answer-text {
            font-size: 70px;
            font-weight: 800;
            letter-spacing: 2px;
            /* text-shadow: 0 3px 6px rgba(0, 0, 0, 0.3); */
        }

        /* Bottom Buttons - Same as MCQ style */
        .nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        .nav button {
            border: none;
            border-radius: 40px;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-family: 'Baloo 2', cursive;
            letter-spacing: 0.5px;
            min-width: 110px;
        }

        .prev {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: white;
            box-shadow: 0 4px 0 #6d28d9;
        }
        .prev:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #6d28d9; }
        .prev:active { transform: translateY(2px); box-shadow: 0 2px 0 #6d28d9; }

        .next {
            background: linear-gradient(135deg, #ff6b9d, #ff8c5a);
            color: white;
            box-shadow: 0 4px 0 #d94a6e;
        }
        .next:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #d94a6e; }
        .next:active { transform: translateY(2px); box-shadow: 0 2px 0 #d94a6e; }

        .nav button:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        /* Popup Toast - Same as MCQ */
        .toast-popup {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            color: white;
            padding: 20px 35px;
            border-radius: 80px;
            font-size: 4rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: 0.2s;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            min-width: 140px;
        }
        .toast-popup.show { opacity: 1; transform: translateX(-50%) scale(1); }

        /* Final Modal - Same as MCQ */
        .final-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .final-modal.active { visibility: visible; opacity: 1; }

        .modal-card {
            background: white;
            border-radius: 52px;
            padding: 2rem 1.8rem;
            text-align: center;
            max-width: 380px;
            width: 85%;
            border: 3px solid #ffcd7e;
            box-shadow: 0 30px 35px rgba(0, 0, 0, 0.3);
        }
        .modal-card h2 { font-size: 2rem; color: #e67e22; margin: 8px 0; }
        .star-score { font-size: 2.3rem; letter-spacing: 6px; margin: 12px 0; }
        .playagain-btn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 50px;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 4px 0 #b45f1b;
            transition: 0.05s linear;
            color: white;
            font-family: 'Baloo 2', cursive;
        }
        .playagain-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b45f1b; }

        /* Confetti Canvas */
        .confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1500;
        }

        @media (max-width: 768px) {
            .quiz-container { padding: 20px; }
            .question-box { font-size: 22px; min-height: 70px; }
            .answers { gap: 20px; }
            .answer { height: 120px; flex-direction: row; gap: 15px; }
            .answer-text { font-size: 24px; }
            .emoji-container { width: 55px; height: 55px; font-size: 35px; }
            .question-image img { width: 200px; height: 150px; }
            .nav button { padding: 8px 18px; font-size: 13px; min-width: 90px; }
        }

        @media (max-width: 480px) {
            .answer { height: 100px; gap: 10px; }
            .answer-text { font-size: 18px; }
            .emoji-container { width: 45px; height: 45px; font-size: 28px; }
            .question-box { font-size: 18px; }
            .toast-popup { font-size: 2.8rem; padding: 12px 25px; }
            .modal-card { padding: 1.5rem; }
            .modal-card h2 { font-size: 1.5rem; }
        }
    </style>
</head>

<body>

    <div class="quiz-container">
        <div class="question-box" id="question"></div>

        <div class="question-image">
            <img id="questionImg" alt="Question illustration">
        </div>

        <div class="answers">
            <button class="answer true" id="trueBtn">
                <div class="emoji-container" id="trueIcon"></div>
                <div class="answer-text">TRUE</div>
            </button>

            <button class="answer false" id="falseBtn">
                <div class="emoji-container" id="falseIcon"></div>
                <div class="answer-text">FALSE</div>
            </button>
        </div>

        <div class="nav">
            <button class="prev" id="prevBtn">← Previous</button>
            <button class="next" id="nextBtn" disabled>Next →</button>
        </div>
    </div>

    <!-- Popup Toast - EMOJI ONLY -->
    <div id="popupToast" class="toast-popup"><span id="popupEmoji">🎉</span></div>

    <!-- Final Modal -->
    <div id="finalModal" class="final-modal">
        <div class="modal-card">
            <div>🏆✨🎉🌟</div>
            <h2>CONGRATULATIONS! 🎊</h2>
            <div class="star-score" id="finalStars">⭐⭐⭐⭐⭐</div>
            <p id="finalMessage">You mastered the quiz! 🌟</p>
            <button class="playagain-btn" id="playAgainBtn">🔁 PLAY AGAIN</button>
        </div>
    </div>

    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    <script>
        // ================= QUIZ DATA =================
        const questions = [
            { q: "Q1. An organ is the smallest living unit of an organism.", a: false, img: "../assets/images/lungs.png" },
            { q: "Q2. A newborn baby has 206 bones.", a: false, img: "https://cdn-icons-png.flaticon.com/512/2942/2942807.png" },
            { q: "Q3. The lungs are the major organs of the digestive system.", a: false, img: "https://cdn-icons-png.flaticon.com/512/3081/3081553.png" },
            { q: "Q4. The spongy substance inside the bone is called the bone marrow.", a: true, img: "https://cdn-icons-png.flaticon.com/512/2965/2965306.png" },
            { q: "Q5. The circulatory system protects the soft internal organs.", a: false, img: "https://cdn-icons-png.flaticon.com/512/3096/3096188.png" }
        ];

        let currentIndex = 0;
        let score = 0;
        let answeredStatus = new Array(5).fill(false);

        // DOM Elements
        const questionEl = document.getElementById("question");
        const imgEl = document.getElementById("questionImg");
        const trueBtn = document.getElementById("trueBtn");
        const falseBtn = document.getElementById("falseBtn");
        const trueIcon = document.getElementById("trueIcon");
        const falseIcon = document.getElementById("falseIcon");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const popupToast = document.getElementById("popupToast");
        const popupEmojiSpan = document.getElementById("popupEmoji");
        const finalModal = document.getElementById("finalModal");
        const playAgainBtn = document.getElementById("playAgainBtn");
        const finalStarsSpan = document.getElementById("finalStars");
        const finalMessageSpan = document.getElementById("finalMessage");

        // ================= SOUND EFFECTS =================
        function playCorrectSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 880;
                oscillator.type = "sine";
                gainNode.gain.value = 0.2;
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                oscillator.stop(audioCtx.currentTime + 0.5);
                setTimeout(() => audioCtx.close(), 600);
            } catch(e) { console.log("Audio not supported"); }
        }

        function playWrongSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 440;
                oscillator.type = "sawtooth";
                gainNode.gain.value = 0.15;
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
                oscillator.stop(audioCtx.currentTime + 0.4);
                setTimeout(() => audioCtx.close(), 500);
            } catch(e) { console.log("Audio not supported"); }
        }

        function playCelebrationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);
                osc1.frequency.value = 523.25;
                osc2.frequency.value = 659.25;
                osc1.type = "sine";
                osc2.type = "sine";
                gain.gain.value = 0.15;
                osc1.start();
                osc2.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.8);
                osc1.stop(now + 0.8);
                osc2.stop(now + 0.8);
                setTimeout(() => audioCtx.close(), 900);
            } catch(e) { console.log("Audio not supported"); }
        }

        // ================= CONFETTI =================
        const canvas = document.getElementById("confettiCanvas");
        let ctx = canvas.getContext("2d");
        let animationId = null;
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        function burstConfetti() {
            if (animationId) cancelAnimationFrame(animationId);
            particles = [];
            const colorList = ["#ffbc6e", "#ff9f4a", "#fdd67a", "#6fbf4c", "#ff6b6b", "#f4d03f", "#ffad60"];
            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    speedX: (Math.random() - 0.5) * 2.6,
                    speedY: Math.random() * 7 + 5,
                    color: colorList[Math.floor(Math.random() * colorList.length)],
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 9
                });
            }
            function drawConfettiFrame() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                for (let p of particles) {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    p.rotation += p.rotSpeed;
                    if (p.y < canvas.height + 100 && p.x > -100 && p.x < canvas.width + 100) {
                        alive = true;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rotation * Math.PI / 180);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size/1.7);
                        ctx.restore();
                    }
                }
                particles = particles.filter(p => p.y < canvas.height + 120 && p.x > -120 && p.x < canvas.width + 120);
                if (alive && particles.length) {
                    animationId = requestAnimationFrame(drawConfettiFrame);
                } else {
                    cancelAnimationFrame(animationId);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    animationId = null;
                }
            }
            drawConfettiFrame();
            setTimeout(() => {
                if (animationId) cancelAnimationFrame(animationId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                animationId = null;
            }, 1700);
        }

        // Show emoji popup
        function showEmojiPopup(emoji) {
            popupEmojiSpan.innerHTML = emoji;
            popupToast.classList.add("show");
            setTimeout(() => popupToast.classList.remove("show"), 1000);
        }

        function clearFeedback() {
            trueIcon.textContent = "";
            falseIcon.textContent = "";
            trueBtn.classList.remove("correct", "wrong");
            falseBtn.classList.remove("correct", "wrong");
        }

        function showFeedback(correctAnswer) {
            if (correctAnswer === true) {
                trueIcon.textContent = "😀";
                falseIcon.textContent = "😒";
                trueBtn.classList.add("correct");
                falseBtn.classList.add("wrong");
            } else {
                falseIcon.textContent = "😀";
                trueIcon.textContent = "😒";
                falseBtn.classList.add("correct");
                trueBtn.classList.add("wrong");
            }
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            questionEl.textContent = q.q;
            imgEl.src = q.img;
            imgEl.alt = "Question illustration";

            clearFeedback();
            prevBtn.disabled = currentIndex === 0;

            if (answeredStatus[currentIndex]) {
                showFeedback(q.a);
                nextBtn.disabled = false;
                trueBtn.disabled = true;
                falseBtn.disabled = true;
            } else {
                nextBtn.disabled = true;
                trueBtn.disabled = false;
                falseBtn.disabled = false;
            }
        }

        function handleAnswer(selected) {
            if (answeredStatus[currentIndex]) return;
            
            const correct = questions[currentIndex].a;
            const isCorrect = selected === correct;

            if (isCorrect) {
                score++;
                answeredStatus[currentIndex] = true;
                showFeedback(correct);
                playCorrectSound();
                showEmojiPopup("✅🎉");
                burstConfetti();
                nextBtn.disabled = false;
                trueBtn.disabled = true;
                falseBtn.disabled = true;

                if (currentIndex === questions.length - 1) {
                    playCelebrationSound();
                    setTimeout(() => burstConfetti(), 300);
                    setTimeout(() => showFinalModal(), 1100);
                }
            } else {
                playWrongSound();
                showEmojiPopup("❌😢");
                const wrongBtn = selected === true ? trueBtn : falseBtn;
                wrongBtn.classList.add("wrong");
                setTimeout(() => wrongBtn.classList.remove("wrong"), 600);
            }
        }

        function showFinalModal() {
            if (score === 5) {
                finalStarsSpan.innerHTML = "🌟🌟🌟🌟🌟";
                finalMessageSpan.innerHTML = "You're a True/False Champion! 🏆 All answers correct!";
                burstConfetti();
                setTimeout(() => burstConfetti(), 400);
            } else {
                finalStarsSpan.innerHTML = "⭐".repeat(score) + "☆".repeat(5 - score);
                finalMessageSpan.innerHTML = `Great job! You scored ${score} out of 5! 🌟`;
            }
            finalModal.classList.add("active");
        }

        function resetQuiz() {
            currentIndex = 0;
            score = 0;
            answeredStatus = new Array(5).fill(false);
            finalModal.classList.remove("active");
            renderQuestion();
            if (animationId) cancelAnimationFrame(animationId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            animationId = null;
        }

        // Event Listeners
        trueBtn.onclick = () => handleAnswer(true);
        falseBtn.onclick = () => handleAnswer(false);
        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        };
        nextBtn.onclick = () => {
            if (currentIndex < questions.length - 1 && answeredStatus[currentIndex]) {
                currentIndex++;
                renderQuestion();
            }
        };
        playAgainBtn.onclick = resetQuiz;

        // Start
        renderQuestion();

        window.addEventListener("resize", () => {
            resizeCanvas();
            if (animationId) {
                cancelAnimationFrame(animationId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                animationId = null;
            }
        });
    </script>
</body>

</html>
