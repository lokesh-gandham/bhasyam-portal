<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>📝 Verb Forms Activity</title>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
    @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
          
            overflow-y: auto;
        }

        .app {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .template {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
       
        }

        /* ===== HEADER ===== */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #2f4f4f;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title span {
            font-size: 30px;
        }

        .instruction {
            font-size: 0.95rem;
            font-weight: 400;
            color: #5a6a8a;
            background: #ffffff;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            text-align: center;
            border: 2px solid #b39ddb;
        }

        .sub-instruction {
            font-size: 18px;
            font-weight: 400;
            color: #6a7a8a;
            background: #f0ece6;
            padding: 0.3rem 1rem;
            border-radius: 60px;
            text-align: center;
            border: 1px solid #d5c8ec;
            width: 100%;
        }

        /* ===== QUESTION IMAGE ===== */
        .question-image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 4px 0;
        }

        .question-image {
            width: 230px;
            height: 160px;
            border-radius: 24px;
            object-fit: contain;
            filter: grayscale(100%);
            transition: all 0.6s ease;
            border: 4px solid #d5c8ec;
            background: #f0ece6;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .question-image.revealed {
            filter: grayscale(0%);
            animation: revealImage 0.6s ease;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
            border-color: #ffb300;
        }

        @keyframes revealImage {
            0% {
                transform: scale(0.85);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }


        .question-image-container{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    padding:4px 0;
}

.question-number{
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-135px);

    width:52px;
    height:52px;

    border-radius:16px;
    background:linear-gradient(135deg,#ff9800,#ff5722);

    color:#fff;
    font-size:22px;
    font-weight:700;

    display:flex;
    align-items:center;
    justify-content:center;

    border:4px solid #fff;

    box-shadow:0 8px 20px rgba(0,0,0,.18);

    z-index:20;
}
        /* ===== TABLE ===== */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.5);
            padding: 3px;
        }

        .verb-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 20px;
            overflow: hidden;
        }

        .verb-table th {
            background:  #e3e3e3;
            color: #000000;
            font-size: 24px;
            font-weight: 600 ;
            padding: 14px 16px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
            text-transform:uppercase;
        }

        .verb-table td {
            padding: 12px 14px;
            text-align: center;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(200, 190, 210, 0.3);
            vertical-align: middle;
            text-transform: capitalize;
           
        }

        .verb-table .present-cell {
            font-weight: 400;
            color: #1e3a3a;
            font-size: 20px;
            background: rgba(240, 240, 250, 0.5);
            min-width: 90px;
        }

        .verb-table .input-cell {
            min-width: 120px;
        }

        .verb-table .text-cell {
            font-weight: 400;
            color: #1e3a3a;
            font-size: 27px;
            background: rgba(255, 255, 255, 0.9);
            min-width: 120px;
        }

        /* ===== INPUT STYLES ===== */
        .verb-input {
            width: 100%;
            max-width: 140px;
            padding: 10px 12px;
            font-size: 27px;
            font-weight: 400;
            border: 3px solid #f0c040;
            border-radius: 14px;
            background: #fff9e6;
            color: #1e3a3a;
            text-align: center;
            transition: all 0.25s ease;
            outline: none;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.04);
            text-transform: capitalize;
            cursor: pointer;
            user-select: none;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
        }

        .verb-input:focus {
            border-color: #e6a800;
            background: #fffde0;
            box-shadow: 0 0 0 4px rgba(240, 192, 64, 0.2), 0 4px 0 rgba(0, 0, 0, 0.04);
            transform: scale(1.02);
        }

        .verb-input.active-input {
            border-color: #ff6b00;
            background: #fff0c9;
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.25), 0 4px 0 rgba(0, 0, 0, 0.04);
            transform: scale(1.04);
            /* animation: pulse-glow 1s infinite; */
        }

        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.2);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(255, 107, 0, 0.35);
            }
        }

        .verb-input.correct {
            border-color: #42d366;
            background: #d4f5e0;
            box-shadow: 0 0 0 4px rgba(66, 211, 102, 0.2);
            cursor: default;
            animation: none;
        }

        .verb-input.wrong {
            border-color: #ff8a8a;
            background: #fce4e4;
            box-shadow: 0 0 0 4px rgba(255, 138, 138, 0.2);
            animation: shake 0.5s ease;
        }

        .verb-input:disabled {
            opacity: 0.8;
            cursor: default;
        }

        .verb-input .placeholder-text {
            color: #b0a0b8;
            font-weight: 400;

        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-8px);
            }
            40% {
                transform: translateX(8px);
            }
            60% {
                transform: translateX(-5px);
            }
            80% {
                transform: translateX(5px);
            }
        }

        /* ===== VERIFY BUTTON ===== */
        .verify-btn {
            background: #8bb3e0;
            border: none;
            border-radius: 14px;
            padding: 12px 14px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(107, 140, 255, 0.20);
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            min-height: 48px;
            height: 48px;
            flex-shrink: 0;
            display: none;
        }

        .verify-btn:hover:not(:disabled):not(.correct-btn) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(107, 140, 255, 0.30);
            background: #78a3d6;
        }

        .verify-btn:active:not(:disabled):not(.correct-btn) {
            transform: translateY(0px);
        }

        .verify-btn:disabled {
            opacity: 0.35;
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(107, 140, 255, 0.06);
            cursor: not-allowed;
            background: #b8cfe6;
        }

        .verify-btn.correct-btn {
            background: #6ba86b;
            box-shadow: 0 4px 14px rgba(76, 175, 80, 0.25);
        }

        .verify-btn.correct-btn:disabled {
            opacity: 0.75;
            box-shadow: 0 2px 10px rgba(76, 175, 80, 0.12);
            cursor: not-allowed;
            background: #7cb87c;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: nowrap;
        }

        /* ===== WORD BANK ===== */
        .word-bank {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 18px;
            border: 3px dashed #b39ddb;
            width: 100%;
            margin-top: 4px;
            min-height: 60px;
        }

        .word-bank-label {
            font-size: 18px;
            font-weight: 600;
            color: #5a4a6a;
            margin-right: 6px;
        }

        .bank-word {
            padding: 8px 22px;
            background: #f0ece6;
            border-radius: 40px;
            border: 2.5px solid #d5c8ec;
            font-size: 20px;
            font-weight: 500;
            color: #1e3a3a;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.04);
        }

        .bank-word:hover:not(.used) {
            background: #e6ddf0;
            transform: scale(1.06);
            border-color: #b39ddb;
            box-shadow: 0 4px 12px rgba(179, 157, 219, 0.25);
        }

        .bank-word:active:not(.used) {
            transform: scale(0.95);
        }

        .bank-word.used {
            opacity: 0.4;
            cursor: not-allowed;
            /* text-decoration: line-through; */
            transform: scale(0.92);
            background: #e8e2ec;
        }

        /* ===== NAVIGATION - MCQ STYLE BUTTONS ===== */
        .nav-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            width: 100%;
            padding: 6px 0;
        }

        .nav-btn {
            border: 3px solid #ffffff;
            border-radius: 35px;
            padding: 13px 32px;
            font-size: 20px;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            width: 150px;
            color: #ffffff;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
        }

        .nav-btn:active:not(:disabled) {
            transform: translateY(4px);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Previous Button - Blue/Teal */
        .prev-btn {
            background: linear-gradient(#86cfe5, #66b6d2);
            box-shadow: 0 4px 0 #3e9dbb;
        }

        .prev-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 #3e9dbb;
        }

        /* Next Button - Orange/Gold */
        .next-btn {
            background: linear-gradient(#ffc37a, #f7a24f);
            box-shadow: 0 4px 0 #e08634;
        }

        .next-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 #e08634;
        }

        /* Dots Indicator */
        .dots-indicator {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 4px 12px;
            display: none;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #d5c8ec;
            transition: all 0.4s ease;
            border: 2px solid transparent;
        }

        .dot.active {
            background: #ff6b00;
            border-color: #ff6b00;
            transform: scale(1.25);
            box-shadow: 0 0 16px rgba(255, 107, 0, 0.4);
        }

        .dot.completed {
            background: #42d366;
            border-color: #42d366;
            box-shadow: 0 0 12px rgba(66, 211, 102, 0.3);
        }

        /* ===== POPUP DESIGNS ===== */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }

        .kid-card {
            background: #ffffff;
            width: 380px;
            max-width: 95%;
            padding: 32px 28px;
            border-radius: 44px;
            text-align: center;
            animation: kidPop 0.6s ease;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .kid-card::before,
        .kid-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .kid-card::before {
            width: 200px;
            height: 200px;
            top: -80px;
            right: -60px;
            background: #ffd93d;
        }

        .kid-card::after {
            width: 150px;
            height: 150px;
            bottom: -60px;
            left: -50px;
            background: #6bcbff;
        }

        .kid-card>* {
            position: relative;
            z-index: 2;
        }

        .kid-icon {
            font-size: 4.8em;
            margin-bottom: 6px;
            animation: emojiBounce 0.9s infinite alternate;
            display: inline-block;
        }

        .kid-card h3 {
            font-size: 2.2em;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .kid-card p {
            font-size: 1.1em;
            color: #555;
            margin-top: 2px;
            font-weight: 500;
        }

        .kid-correct .kid-card {
            background: linear-gradient(145deg, #f0fff4, #d4f5e6);
            border: 5px solid #38d9a9;
        }

        .kid-correct .kid-card h3 {
            color: #0b8a4a;
        }

        .kid-correct .kid-card p {
            color: #1a6a3a;
        }

        .kid-correct .kid-card::before {
            background: #38d9a9;
        }

        .kid-correct .kid-card::after {
            background: #38d9a9;
        }

        .kid-wrong .kid-card {
            background: linear-gradient(145deg, #fff5f5, #fce4e4);
            border: 5px solid #ff8a8a;
        }

        .kid-wrong .kid-card h3 {
            color: #c0392b;
        }

        .kid-wrong .kid-card p {
            color: #922b21;
        }

        .kid-wrong .kid-card::before {
            background: #ff8a8a;
        }

        .kid-wrong .kid-card::after {
            background: #ff8a8a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0) scale(1);
            }
            to {
                transform: translateY(-12px) scale(1.05);
            }
        }

        /* ===== FINAL POPUP ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            padding: 20px;
        }

        .final-kid-box {
            background: linear-gradient(145deg, #fff7d6, #e6fff5);
            padding: 35px 40px;
            border-radius: 44px;
            text-align: center;
            width: 480px;
            max-width: 95%;
            animation: finalBounce 0.8s ease;
            border: 4px solid rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .final-kid-box::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            top: -120px;
            right: -100px;
            background: #ffd93d;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .final-kid-box>* {
            position: relative;
            z-index: 2;
        }

        .final-kid-box h2 {
            font-size: 2.4em;
            color: #2f9e44;
            margin-bottom: 8px;
            font-weight: 700 !important;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
            color: #2d3a3a;
        }

        #stars {
            font-size: 2.6em;
            margin: 14px 0;
            letter-spacing: 6px;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
            letter-spacing: 0.5px;
        }

        .playAgain-btn:hover {
            transform: translateY(-3px);
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #d4871f;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3) perspective(400px) rotateX(15deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.08) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        /* ============================================================ */
        /* ===== RESPONSIVE ===== */
        /* ============================================================ */

        @media (max-width: 768px) {
            .template {
                padding: 14px 12px;
                border-radius: 28px;
                gap: 10px;
            }
            .title {
                font-size: 20px;
            }
            .header-area {
                gap: 8px;
            }
            .instruction {
                font-size: 10px;
                padding: 0.25rem 0.8rem;
            }
            .sub-instruction {
                font-size: 13px;
                padding: 0.2rem 0.8rem;
            }
            .question-image {
                width: 100px;
                height: 100px;
                border-radius: 18px;
            }
            .question-number{
  
    top:-10px;
    left:60%;

font-size: 15px;
    width:32px;
    height:32px;

            }
            .verb-table th {
                font-size: 15px;
                padding: 10px 10px;
            }
            .verb-table td {
                padding: 8px 6px;
                font-size: 14px;
            }
            .verb-table .present-cell {
                font-size: 15px;
                min-width: 60px;
            }
            .verb-table .input-cell {
                min-width: 80px;
            }
            .verb-table .text-cell {
                font-size: 14px;
                min-width: 80px;
            }
            .verb-input {
                font-size: 15px;
                padding: 7px 8px;
                max-width: 100px;
                border-radius: 10px;
                min-height: 44px;
            }
            .verify-btn {
                min-width: 38px;
                min-height: 38px;
                height: 38px;
                font-size: 1rem;
                padding: 8px 10px;
                border-radius: 10px;
            }
            .word-bank {
                gap: 8px;
                padding: 10px 12px;
            }
            .bank-word {
                font-size: 15px;
                padding: 6px 16px;
            }
            .word-bank-label {
                font-size: 14px;
            }
            .nav-btn {
                padding: 13px 32px;
                font-size: 20px;
                gap: 6px;
                width: 150px;
            }
            .dot {
                width: 12px;
                height: 12px;
            }
            .dots-indicator {
                gap: 5px;
                padding: 2px 8px;
            }
            .kid-card {
                width: 340px;
                padding: 28px 24px;
            }
            .kid-icon {
                font-size: 4em;
            }
            .kid-card h3 {
                font-size: 1.8em;
            }
            .final-kid-box {
                width: 92%;
                padding: 28px 24px;
            }
            .final-kid-box h2 {
                font-size: 2em;
            }
            .final-kid-box p {
                font-size: 1.1em;
            }
            #stars {
                font-size: 2.2em;
            }
            .playAgain-btn {
                padding: 12px 28px;
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 6px;
            }
            .template {
                padding: 10px 8px;
                border-radius: 20px;
                gap: 8px;
            }
            .title {
                font-size: 16px;
            }
            .title span {
                font-size: 18px;
            }
            .instruction {
                font-size: 8px;
                padding: 0.15rem 0.5rem;
                border-width: 1.5px;
            }
            .sub-instruction {
                font-size: 10px;
                padding: 0.15rem 0.5rem;
            }
            .question-image {
                width: 75px;
                height: 75px;
                border-radius: 14px;
                border-width: 3px;
            }
            .verb-table th {
                font-size: 11px;
                padding: 6px 4px;
            }
            .verb-table td {
                padding: 5px 3px;
                font-size: 11px;
            }
            .verb-table .present-cell {
                font-size: 12px;
                min-width: 45px;
            }
            .verb-table .input-cell {
                min-width: 55px;
            }
            .verb-table .text-cell {
                font-size: 11px;
                min-width: 50px;
            }

<body>

    <div class="app">
        <div class="template">

            <!-- Header -->
            <div class="header-area">
                <div class="title">
                    <span></span> Verb Forms
                </div>
                <div class="instruction">
                    Tap a blank, then tap a word!
                </div>
            </div>

            <div class="sub-instruction">
                🌟 Choose the correct verb form for each blank
            </div>

            <!-- Question Image -->
           <div class="question-image-container">

    <div class="question-number" id="questionNumber">
        Q1
    </div>

    <img
        class="question-image"
        id="questionImage"
        src="https://picsum.photos/seed/go/200/200"
        alt="Question image"
    >

</div>

            <!-- Table -->
            <div class="table-wrapper">
                <table class="verb-table" id="verbTable">
                    <thead>
                        <tr>
                            <th>Present</th>
                            <th>Past</th>
                            <th>'ing'</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rows generated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Word Bank -->
            <div class="word-bank" id="wordBank">
                <span class="word-bank-label">📚 Word Bank:</span>
                <!-- Words inserted by JS -->
            </div>

            <!-- Navigation -->
            <div class="nav-area" id="navArea">
                <button class="nav-btn prev-btn" id="prevBtn">
                    <span><i class="fa-solid fa-angles-left"></i> Prev</span>
                </button>

                <div class="dots-indicator" id="dotsIndicator">
                    <!-- Dots generated by JS -->
                </div>

                <button class="nav-btn next-btn" id="nextBtn">
                    <span>Next <i class="fa-solid fa-angles-right"></i></span>
                </button>
            </div>

        </div>
    </div>

    <!-- ===== POPUPS ===== -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <!-- ===== FINAL POPUP ===== -->
    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        // ================================================================
        //  DATA - Questions with image and word bank
        // ================================================================
        const QUESTIONS = [
         {
            present: 'live',
            past: 'lived',
            ing: 'living',
            image: '../assets/images/live.jpg',
            options: ['Lived', 'Living', 'Spread', 'Spreading'],
            blankPresent: false,
            blankPast: true,
            blankIng: true
        } ,   
        {
            present: 'go',
            past: 'went',
            ing: 'going',
            image: '../assets/images/go.jpg',
            options: ['Went', 'Going', 'Came', 'Coming'],
            blankPresent: false,
            blankPast: true,
            blankIng: true
        }, {
            present: 'come',
            past: 'came',
            ing: 'coming',
            image: '../assets/images/welcome1.png',
            options: ['Came', 'Coming', 'Went', 'Going'],
            blankPresent: false,
            blankPast: true,
            blankIng: true
        }, {
            present: 'sound',
            past: 'sounded',
            ing: 'sounding',
            image: '../assets/images/sound.png',
            options: ['sound', 'Sounding', 'Rose', 'Rising'],
            blankPresent: true,
            blankPast: false,
            blankIng: true
        }, {
            present: 'rise',
            past: 'rose',
            ing: 'rising',
            image: '../assets/images/rise1.png',
            options: ['Rose', 'Rising', 'Rise', 'Sounding'],
            blankPresent: true,
            blankPast: true,
            blankIng: false
        }, {
            present: 'spread',
            past: 'spread',
            ing: 'spreading',
            image: '../assets/images/spread.png',
            options: ['Spread', 'Spreading', 'Lived', 'Living'],
            blankPresent: false,
            blankPast: true,
            blankIng: true
        }];

        // ================================================================
        //  STATE
        // ================================================================
        let currentIndex = 0;
        const totalQuestions = QUESTIONS.length;
        let questionStates = [];
        let completedQuestions = 0;
        let activeBlank = null;

        // ================================================================
        //  DOM REFS
        // ================================================================
        const tableBody = document.getElementById('tableBody');
        const wordBankEl = document.getElementById('wordBank');
        const questionImage = document.getElementById('questionImage');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const dotsIndicator = document.getElementById('dotsIndicator');
        const playAgainBtn = document.getElementById('playAgainBtn');

        const popupOverlay = document.getElementById('answerPopup');
        const popupIcon = document.getElementById('popupIcon');
        const popupTitle = document.getElementById('popupTitle');
        const popupMsg = document.getElementById('popupMsg');

        // ================================================================
        //  AUDIO
        // ================================================================
        let audioCtx = null;

        function playCorrectSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 880;
                gainNode.gain.value = 0.2;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        function playWrongSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 440;
                gainNode.gain.value = 0.25;
                oscillator.type = 'sawtooth';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
                oscillator.stop(audioCtx.currentTime + 0.4);
            } catch (e) {}
        }

        // ================================================================
        //  CONFETTI
        // ================================================================
        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 200, spread: 110, origin: { y: 0.5 } });
            setTimeout(() => {
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.2 } });
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.8 } });
            }, 150);
        }

        // ================================================================
        //  POPUP
        // ================================================================
        function showPopup(isCorrect) {
            popupOverlay.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
            popupOverlay.style.display = 'flex';

            if (isCorrect) {
                popupIcon.textContent = '🌟';
                popupTitle.textContent = 'Amazing!';
                popupMsg.textContent = 'You got it right! ✨';
            } else {
                popupIcon.textContent = '😒';
                popupTitle.textContent = 'Keep Going!';
                popupMsg.textContent = 'Try again, you can do it! 🌈';
            }

            const sound = document.getElementById(isCorrect ? 'correctSound' : 'wrongSound');
            if (sound) sound.play().catch(() => {});

            setTimeout(() => {
                popupOverlay.style.display = 'none';
            }, 1800);
        }

        // ================================================================
        //  SPEECH
        // ================================================================
        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = 'en-US';
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        // ================================================================
        //  SHOW FINAL
        // ================================================================
        function showFinal() {
            document.getElementById('finalPopup').style.display = 'flex';
            document.getElementById('finalScore').textContent = `Your Score: ${completedQuestions} / ${totalQuestions}`;
            document.getElementById('stars').textContent = '⭐'.repeat(Math.min(completedQuestions, 5));
            bigConfetti();
        }

        // ================================================================
        //  CHECK IF ALL QUESTIONS COMPLETED
        // ================================================================
        function checkAllCompleted() {
            if (completedQuestions === totalQuestions) {
                setTimeout(showFinal, 800);
            }
        }

        // ================================================================
        //  REVEAL IMAGE
        // ================================================================
        function revealImage() {
            questionImage.classList.add('revealed');
            smallConfetti();
        }

        // ================================================================
        //  RESET IMAGE
        // ================================================================
        function resetImage() {
            questionImage.classList.remove('revealed');
        }

        // ================================================================
        //  UPDATE NAVIGATION & DOTS
        // ================================================================
        function updateNav() {
            const state = questionStates[currentIndex];
            const isCompleted = state.completed;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = !isCompleted;

            // Update dots
            const dots = dotsIndicator.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                dot.className = 'dot';
                if (index === currentIndex) {
                    dot.classList.add('active');
                }
                if (questionStates[index] && questionStates[index].completed) {
                    dot.classList.add('completed');
                }
            });
        }

        // ================================================================
        //  BUILD DOTS
        // ================================================================
        function buildDots() {
            dotsIndicator.innerHTML = '';
            for (let i = 0; i < totalQuestions; i++) {
                const dot = document.createElement('span');
                dot.className = 'dot';
                dot.dataset.index = i;
                dot.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (idx === currentIndex) return;
                    if (idx < currentIndex && questionStates[idx].completed) {
                        goToQuestion(idx);
                    } else if (idx === currentIndex + 1 && questionStates[currentIndex].completed) {
                        goToQuestion(idx);
                    }
                });
                dot.style.cursor = 'pointer';
                dotsIndicator.appendChild(dot);
            }
            updateNav();
        }

        // ================================================================
        //  RENDER QUESTION
        // ================================================================
        function renderQuestion(index) {
            const data = QUESTIONS[index];
            const state = questionStates[index];

            // Reset image
            resetImage();
            activeBlank = null;

            // Update image
            questionImage.src = data.image;
            document.getElementById("questionNumber").textContent = `Q${index + 1}`;
            questionImage.alt = data.present;

            // If this question was already completed, reveal image immediately
            if (state.completed) {
                questionImage.classList.add('revealed');
            }

            // Build table row
            tableBody.innerHTML = '';
            const tr = document.createElement('tr');

            // ---- Present Tense ----
            const presentCell = document.createElement('td');
            if (data.blankPresent) {
                presentCell.className = 'input-cell';
                const wrapper = createInputWrapper(index, 0, 'present', state, data.present);
                presentCell.appendChild(wrapper);
            } else {
                presentCell.className = 'text-cell';
                presentCell.innerHTML = `<strong>${data.present}</strong>`;
            }
            tr.appendChild(presentCell);

            // ---- Past Tense ----
            const pastCell = document.createElement('td');
            if (data.blankPast) {
                pastCell.className = 'input-cell';
                const wrapper = createInputWrapper(index, 1, 'past', state, data.past);
                pastCell.appendChild(wrapper);
            } else {
                pastCell.className = 'text-cell';
                pastCell.textContent = data.past;
            }
            tr.appendChild(pastCell);

            // ---- 'ing' Form ----
            const ingCell = document.createElement('td');
            if (data.blankIng) {
                ingCell.className = 'input-cell';
                const wrapper = createInputWrapper(index, 2, 'ing', state, data.ing);
                ingCell.appendChild(wrapper);
            } else {
                ingCell.className = 'text-cell';
                ingCell.textContent = data.ing;
            }
            tr.appendChild(ingCell);

            tableBody.appendChild(tr);

            // Build word bank
            renderWordBank(data.options, state);

            updateNav();

            // Auto-focus first blank after render
            setTimeout(() => {
                autoFocusFirstBlank(index);
            }, 200);
        }

        // ================================================================
        //  AUTO FOCUS FIRST BLANK
        // ================================================================
        function autoFocusFirstBlank(rowIdx) {
            const state = questionStates[rowIdx];
            if (state.completed) return;

            const inputs = document.querySelectorAll(`.verb-input[data-row="${rowIdx}"]`);
            for (let input of inputs) {
                if (!input.classList.contains('correct') && input.textContent === '___') {
                    input.click();
                    return;
                }
            }
        }

        // ================================================================
        //  CREATE INPUT WRAPPER
        // ================================================================
        function createInputWrapper(rowIdx, colIdx, type, state, correctAnswer) {
            const wrapper = document.createElement('div');
            wrapper.className = 'input-wrapper';

            const input = document.createElement('div');
            input.className = 'verb-input';
            input.dataset.row = rowIdx;
            input.dataset.col = colIdx;
            input.dataset.type = type;
            input.dataset.correct = correctAnswer;
            input.innerHTML = '<span class="placeholder-text">___</span>';
            input.setAttribute('role', 'button');
            input.setAttribute('tabindex', '0');

            const verify = document.createElement('button');
            verify.className = 'verify-btn';
            verify.innerHTML = '<i class="fa-regular fa-circle-check"></i>';
            verify.dataset.row = rowIdx;
            verify.dataset.col = colIdx;

            // If already correct, set as correct
            const key = `${rowIdx}-${colIdx}`;
            if (state.correctCells && state.correctCells[key]) {
                input.textContent = state.correctCells[key];
                input.classList.add('correct');
                input.style.cursor = 'default';
                verify.disabled = true;
                verify.classList.add('correct-btn');
                verify.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else {
                // Click on input to make it active
                input.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (state.completed) return;
                    if (this.classList.contains('correct')) return;

                    // Remove active from all inputs
                    document.querySelectorAll('.verb-input').forEach(el => {
                        el.classList.remove('active-input');
                    });

                    this.classList.add('active-input');
                    // Remove placeholder text
                    if (this.querySelector('.placeholder-text')) {
                        this.innerHTML = '';
                    }
                    activeBlank = { row: rowIdx, col: colIdx, input: this, verify: verify };
                });

                // Keyboard support
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });

                verify.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (state.completed) return;

                    const active = activeBlank;
                    if (!active) {
                        autoFocusFirstBlank(rowIdx);
                        return;
                    }

                    if (active.row !== rowIdx || active.col !== colIdx) {
                        return;
                    }

                    const word = active.input.textContent.trim();
                    if (word === '___' || word === '') {
                        active.input.style.borderColor = '#e57373';
                        setTimeout(() => active.input.style.borderColor = '', 600);
                        return;
                    }

                    const correct = active.input.dataset.correct.toLowerCase();
                    const guess = word.toLowerCase();

                    if (guess === correct) {
                        const key = `${rowIdx}-${colIdx}`;
                        if (!state.correctCells) state.correctCells = {};
                        state.correctCells[key] = word;

                        state.blanksFilled = (state.blanksFilled || 0) + 1;

                        active.input.classList.remove('active-input');
                        active.input.classList.add('correct');
                        active.input.style.cursor = 'default';
                        verify.disabled = true;
                        verify.classList.add('correct-btn');
                        verify.innerHTML = '<i class="fa-solid fa-check"></i>';

                        const bankWords = wordBankEl.querySelectorAll('.bank-word');
                        bankWords.forEach(el => {
                            if (el.dataset.word.toLowerCase() === guess) {
                                el.classList.add('used');
                            }
                        });

                        showPopup(true);
                        smallConfetti();
                        speak('Correct!');

                        const data = QUESTIONS[rowIdx];
                        const total = (data.blankPresent ? 1 : 0) + (data.blankPast ? 1 : 0) + (data.blankIng ? 1 : 0);
                        state.totalBlanks = total;

                        if (state.blanksFilled === total) {
                            state.completed = true;
                            completedQuestions++;
                            revealImage();
                            updateNav();
                            checkAllCompleted();
                        } else {
                            updateNav();
                            setTimeout(() => {
                                autoFocusFirstBlank(rowIdx);
                            }, 400);
                        }

                        activeBlank = null;

                    } else {
                        active.input.classList.add('wrong');
                        showPopup(false);
                        speak('Try again!');

                        const wordText = active.input.textContent;
                        const bankWords = wordBankEl.querySelectorAll('.bank-word');
                        bankWords.forEach(el => {
                            if (el.dataset.word.toLowerCase() === wordText.toLowerCase()) {
                                el.classList.remove('used');
                            }
                        });

                        setTimeout(() => {
                            active.input.classList.remove('wrong');
                            active.input.innerHTML = '<span class="placeholder-text">___</span>';
                            active.input.classList.add('active-input');
                        }, 600);
                    }
                });
            }

            wrapper.appendChild(input);
            wrapper.appendChild(verify);
            return wrapper;
        }

        // ================================================================
        //  RENDER WORD BANK
        // ================================================================
        function renderWordBank(options, state) {
            const label = wordBankEl.querySelector('.word-bank-label') || document.createElement('span');
            if (!wordBankEl.querySelector('.word-bank-label')) {
                label.className = 'word-bank-label';
                label.textContent = '📚 Word Bank:';
                wordBankEl.appendChild(label);
            }

            const existing = wordBankEl.querySelectorAll('.bank-word');
            existing.forEach(el => el.remove());

            const usedWords = new Set();
            if (state.correctCells) {
                Object.values(state.correctCells).forEach(val => {
                    if (val) usedWords.add(val);
                });
            }

            const shuffled = [...options].sort(() => Math.random() - 0.5);
            shuffled.forEach(word => {
                const el = document.createElement('span');
                el.className = 'bank-word';
                if (usedWords.has(word)) {
                    el.classList.add('used');
                }
                el.dataset.word = word;
                el.textContent = word;
                el.addEventListener('click', function() {
                    if (this.classList.contains('used')) return;
                    handleBankWordClick(this);
                });
                wordBankEl.appendChild(el);
            });
        }

        // ================================================================
        //  HANDLE BANK WORD CLICK
        // ================================================================
        function handleBankWordClick(el) {
            if (el.classList.contains('used')) return;

            const word = el.dataset.word;

            if (!activeBlank) {
                autoFocusFirstBlank(currentIndex);
                if (!activeBlank) return;
            }

            const active = activeBlank;
            if (active.input.classList.contains('correct')) {
                autoFocusFirstBlank(currentIndex);
                if (!activeBlank) return;
            }

            active.input.textContent = word;
            active.input.classList.remove('active-input');
            el.classList.add('used');

            setTimeout(() => {
                active.verify.click();
            }, 300);
        }

        // ================================================================
        //  NAVIGATION
        // ================================================================
        function goToQuestion(index) {
            if (index < 0 || index >= totalQuestions) return;
            currentIndex = index;
            activeBlank = null;
            renderQuestion(index);
        }

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                goToQuestion(currentIndex - 1);
            }
        });

        nextBtn.addEventListener('click', () => {
            const state = questionStates[currentIndex];
            if (state.completed && currentIndex < totalQuestions - 1) {
                goToQuestion(currentIndex + 1);
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (currentIndex > 0) {
                    goToQuestion(currentIndex - 1);
                }
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                const state = questionStates[currentIndex];
                if (state.completed && currentIndex < totalQuestions - 1) {
                    goToQuestion(currentIndex + 1);
                }
            }
        });

        // ================================================================
        //  RESTART
        // ================================================================
        function restartQuiz() {
            currentIndex = 0;
            completedQuestions = 0;
            questionStates = [];
            QUESTIONS.forEach((q, i) => {
                const total = (q.blankPresent ? 1 : 0) + (q.blankPast ? 1 : 0) + (q.blankIng ? 1 : 0);
                questionStates[i] = {
                    completed: false,
                    blanksFilled: 0,
                    totalBlanks: total,
                    correctCells: {}
                };
            });
            document.getElementById('finalPopup').style.display = 'none';
            goToQuestion(0);
        }

        playAgainBtn.onclick = restartQuiz;

        // ================================================================
        //  INIT
        // ================================================================
        QUESTIONS.forEach((q, i) => {
            const total = (q.blankPresent ? 1 : 0) + (q.blankPast ? 1 : 0) + (q.blankIng ? 1 : 0);
            questionStates[i] = {
                completed: false,
                blanksFilled: 0,
                totalBlanks: total,
                correctCells: {}
            };
        });

        buildDots();
        goToQuestion(0);

        console.log('📝 Verb Forms - With MCQ Style Buttons!');
        console.log(`✅ Total questions: ${totalQuestions}`);
    </script>
