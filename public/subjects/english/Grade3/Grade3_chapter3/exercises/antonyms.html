    <style>
        /* ===== RESET & BASE ===== */
         @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }
        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .app {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .template {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding: 25px 30px 30px;
        }

        /* ===== HEADER ===== */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            width: 100%;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #2f4f4f;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title span {
            font-size: 28px;
        }

        .instruction {
            font-size: 0.9rem;
            font-weight: 400;
            color: #5a6a8a;
            background: #ffffff;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            text-align: center;
            border: 2px solid #5a6a8a;
        }

        /* ===== GAME WRAP ===== */
        .game-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 200px;
            position: relative;
            min-height: 400px;
        }

        /* ===== SIDE WORDS ===== */
        .side-words {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 120px;
            flex-shrink: 0;
            z-index: 2;
        }

        .side-words.right {
            align-items: flex-end;
        }

        .word-item {
            position: relative;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 14px;
            border: 2.5px solid #d5c8ec;
            font-size: 28px;
            font-weight: 500;
            color: #1e3a3a;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
            width: 270px;
            height: 85px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.04);
            letter-spacing: 0.5px;
            user-select: none;
        
            overflow: hidden;
        }

        .word-item .word-text {
            width: 150px;
        }

        /* Left side: image on LEFT of text */
        .side-words:not(.right) .word-item .word-image {
            order: 0;
        }
        .side-words:not(.right) .word-item .word-text {
            order: 1;
        }

        /* Right side: image on RIGHT of text */
        .side-words.right .word-item .word-image {
            order: 1;
        }
        .side-words.right .word-item .word-text {
            order: 0;
        }

        /* ===== IMAGE CONTAINER – KEY & LOCK ===== */
        .word-item .word-image {
            width: 100px;
            height: 60px;
            flex-shrink: 0;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: #f0edf2;
            border: 2px solid #ddd8e0;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            perspective: 600px;
        }

  .word-item .word-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    backface-visibility: hidden;
    position: relative;
    z-index: 2;
}

/* Show images only on the left side */
.word-item .word-image img {
    display: block;
}

        /* --- LEFT: always show KEY emoji --- */
        /* .side-words:not(.right) .word-item .word-image::after {
            content: "🗝️";
            font-size: 38px;
            line-height: 1;
            transition: all 0.8s ease;
            position: absolute;
            z-index: 1;
        } */

        /* --- RIGHT: always show LOCK emoji --- */
        .side-words.right .word-item .word-image::after {
            content: "🔒";
            font-size: 38px;
            line-height: 1;
            transition: all 0.8s ease;
            position: absolute;
            z-index: 1;
        }

        /* ===== MATCHED STATE - LOCK OPENS FIRST ===== */
        .side-words.right .word-item.matched .word-image::after {
            content: "🔓";
            font-size: 38px;
            animation: lockOpenPop 0.6s ease forwards;
            z-index: 1;
        }
.side-words.right .word-item .word-image::after {
    display: none;
}
        @keyframes lockOpenPop {
            0% {
                transform: scale(0.2) rotate(-20deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.3) rotate(4deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0);
            }
        }

        /* sparkle overlay on lock when matched */
        .side-words.right .word-item.matched .word-image::before {
            content: "✨✨";
            position: absolute;
            font-size: 32px;
            animation: sparkleTwinkle 0.8s ease infinite alternate;
            pointer-events: none;
            z-index: 5;
            top: -10px;
            right: -10px;
        }

        @keyframes sparkleTwinkle {
            0% {
                transform: scale(0.6) rotate(0deg);
                opacity: 0.3;
            }
            100% {
                transform: scale(1.4) rotate(30deg);
                opacity: 1;
            }
        }

        /* ===== IMAGE REVEAL WITH FLIP EFFECT (after lock opens) ===== */
        .word-item.matched .word-image {
            background: #e8f5e9;
            border-color: #42d366;
        }

        .side-words:not(.right) .word-item.matched .word-image::after {
         
            display: none;
        }
        .side-words:not(.right) .word-item.matched .word-image img {
            display: block;
            filter: grayscale(0) blur(0px);
            transform: scale(1);
            opacity: 1;
            animation: imageReveal 0.7s ease forwards;
        }

        /* Right side: after lock opens, remove the open lock emoji and show image */
        .side-words.right .word-item.matched .word-image img {
            display: block;
            opacity: 1;
            transform: scale(1);
            filter: grayscale(0) blur(0px);
            animation: imageReveal 0.7s ease forwards;
        }

        /* After image reveals, remove the lock emoji completely */
        .side-words.right .word-item.matched.image-revealed .word-image::after {
            content: "";
            display: none;
        }

        /* Remove sparkles after image reveals */
        .side-words.right .word-item.matched.image-revealed .word-image::before {
            content: "";
            display: none;
        }

        @keyframes imageReveal {
            0% {
                transform: scale(0.3) rotateY(90deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.1) rotateY(-10deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotateY(0);
                opacity: 1;
            }
        }

        .word-item .word-image .image-placeholder {
            display: none;
        }

        .word-item .word-text {
            font-size: 28px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .word-item.active {
            background: #ffeaa7 !important;
            border-color: #ffb300 !important;
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(255, 179, 0, 0.3);
        }

        .word-item.matched {
            background: #d4f5e0;
            border-color: #42d366;
            color: #1a6a3a;
            cursor: default;
            pointer-events: none;
            opacity: 0.9;
        }

        .word-item.wrong {
            animation: shake 0.5s ease;
            background: #fce4e4 !important;
            border-color: #ff8a8a !important;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-10px);
            }
            40% {
                transform: translateX(10px);
            }
            60% {
                transform: translateX(-6px);
            }
            80% {
                transform: translateX(6px);
            }
        }

        /* ===== SVG LINES ===== */
        .svg-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .svg-wrapper svg {
            width: 100%;
            height: 100%;
        }

        .svg-path {
            fill: none;
            stroke: #ffb300;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 14 8;
            animation: drawLine .6s ease forwards, moveDash 1s linear infinite, glowLine 1.2s ease-in-out infinite;
            /* filter: drop-shadow(0 0 8px #ffb300); */
        }

        @keyframes drawLine {
            from {
                stroke-dashoffset: 600;
            }
            to {
                stroke-dashoffset: 0;
            }
        }
        @keyframes moveDash {
            to {
                stroke-dashoffset: -22;
            }
        }

        /* ===== POPUP ===== */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .kid-card {
            background: #ffffff;
            width: 380px;
            max-width: 95%;
            padding: 32px 28px;
            border-radius: 44px;
            text-align: center;
            animation: kidPop 0.6s ease;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .kid-card::before,
        .kid-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .kid-card::before {
            width: 200px;
            height: 200px;
            top: -80px;
            right: -60px;
            background: #ffd93d;
        }
        .kid-card::after {
            width: 150px;
            height: 150px;
            bottom: -60px;
            left: -50px;
            background: #6bcbff;
        }

        .kid-card>* {
            position: relative;
            z-index: 2;
        }

        .kid-icon {
            font-size: 4.8em;
            margin-bottom: 6px;
            animation: emojiBounce 0.9s infinite alternate;
            display: inline-block;
        }

        .kid-card h3 {
            font-size: 2.2em;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .kid-card p {
            font-size: 1.1em;
            color: #555;
            margin-top: 2px;
            font-weight: 500;
        }

        .kid-correct .kid-card {
            background: linear-gradient(145deg, #f0fff4, #d4f5e6);
            border: 5px solid #38d9a9;
        }
        .kid-correct .kid-card h3 {
            color: #0b8a4a;
        }
        .kid-correct .kid-card p {
            color: #1a6a3a;
        }

        .kid-wrong .kid-card {
            background: linear-gradient(145deg, #fff5f5, #fce4e4);
            border: 5px solid #ff8a8a;
        }
        .kid-wrong .kid-card h3 {
            color: #c0392b;
        }
        .kid-wrong .kid-card p {
            color: #922b21;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0) scale(1);
            }
            to {
                transform: translateY(-12px) scale(1.05);
            }
        }

        /* ===== FINAL POPUP ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }

        .final-kid-box {
            background: linear-gradient(145deg, #fff7d6, #e6fff5);
            padding: 35px 40px;
            border-radius: 44px;
            text-align: center;
            width: 480px;
            max-width: 95%;
            animation: finalBounce 0.8s ease;
            border: 4px solid rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .final-kid-box::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            top: -120px;
            right: -100px;
            background: #ffd93d;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .final-kid-box>* {
            position: relative;
            z-index: 2;
        }

        .final-kid-box h2 {
            font-size: 2.4em;
            color: #2f9e44;
            margin-bottom: 8px;
            font-weight: 700 !important;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
            color: #2d3a3a;
        }

        #stars {
            font-size: 2.6em;
            margin: 14px 0;
            letter-spacing: 6px;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
            letter-spacing: 0.5px;
        }

        .playAgain-btn:hover {
            transform: translateY(-3px);
        }
        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #d4871f;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3) perspective(400px) rotateX(15deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.08) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

                padding: 16px 40px;
                font-size: 1.2em;
            } */
        }

        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 10px;
                align-items: flex-start;
            }
            .template {
                padding: 10px 12px;
                border-radius: 24px;
                gap: 10px;
            }
            .title {
                font-size: 14px;
            }
            .header-area {
                gap: 4px;
            }
            .instruction {
                font-size: 8px;
                padding: 0.1rem 0.5rem;
            }
            .game-wrap {
                flex-direction: row;
                gap: 30px;
                align-items: flex-start;
                min-height: auto;
            }
            .side-words {
                gap: 6px;
                min-width: 80px;
            }
            .word-item {
                width: 90px;
                height: 35px;
                font-size: 11px;
                padding: 4px 8px;
                border-radius: 8px;
            }
            .word-item .word-image {
                width: 24px;
                height: 24px;
                font-size: 14px;
            }
            .word-item .word-text {
                font-size: 11px;
                width: 50px;
            }
            .svg-wrapper {
                display: block;
            }
            .kid-card {
                width: 240px;
                padding: 14px 14px;
                border-radius: 28px;
            }
            .kid-icon {
                font-size: 2.5em;
            }
            .kid-card h3 {
                font-size: 1.2em;
            }
            .kid-card p {
                font-size: 0.8em;
            }
            .final-kid-box {
                width: 70%;
                padding: 14px;
                border-radius: 28px;
            }
            .final-kid-box h2 {
                font-size: 1.2em;
            }
            .final-kid-box p {
                font-size: 0.8em;
            }
            #stars {
                font-size: 1.4em;
            }
            .playAgain-btn {
                padding: 6px 16px;
                font-size: 0.7em;
            }
        }
    </style>
</head>

<body>

    <div class="app">
        <div class="template">

            <!-- Header -->
            <div class="header-area">
                <div class="title">
                    <span></span> Antonyms Match
                </div>
                <div class="instruction">
                    Click a key word, then its lock match!
                </div>
            </div>

            <!-- Game Wrap -->
            <div class="game-wrap" id="gameWrap">

                <!-- LEFT SIDE (Keys) -->
                <div class="side-words" id="leftWords"></div>

                <!-- SVG LINES -->
                <div class="svg-wrapper" id="svgWrapper">
                    <svg id="svgLines"></svg>
                </div>

                <!-- RIGHT SIDE (Locks) -->
                <div class="side-words right" id="rightWords"></div>

            </div>

        </div>
    </div>

    <!-- ===== POPUPS ===== -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <!-- ===== FINAL POPUP ===== -->
     <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        // ================================================================
        //  DATA - Antonyms with Image URLs
        // ================================================================
        const imageMap = {
            "Always": "../assets/images/always.png",
            "Remember": "../assets/images/remember.png",
            "Dirty": "../assets/images/dirty.png",
            "Find": "../assets/images/find.png",
            "Behind": "../assets/images/behind.png",
            "Never": "../assets/images/never1.png",
            "Forget": "../assets/images/forget2.png",
            "Clean": "../assets/images/clean.png",
            "Lose": "../assets/images/lose.png",
            "In front of": "../assets/images/in-front-of.png"
        };

        const antonymData = {
            left: [
                { word: "Always", match: "Never" },
                { word: "Remember", match: "Forget" },
                { word: "Dirty", match: "Clean" },
                { word: "Find", match: "Lose" },
                { word: "Behind", match: "In front of" }
            ],
            right: [
                { word: "Forget" },
                { word: "Never" },
                { word: "Lose" },
                { word: "In front of" },
                { word: "Clean" }
            ]
        };

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        const shuffledRight = shuffle([...antonymData.right]);

        // ================================================================
        //  STATE
        // ================================================================
        let selectedLeft = null;
        let matchedPairs = {};
        let matchCount = 0;
        const totalMatches = antonymData.left.length;
        let isProcessing = false;

        // ================================================================
        //  DOM REFS
        // ================================================================
        const leftWordsEl = document.getElementById('leftWords');
        const rightWordsEl = document.getElementById('rightWords');
        const svg = document.getElementById('svgLines');
        const svgWrapper = document.getElementById('svgWrapper');

        const popupOverlay = document.getElementById('answerPopup');
        const popupIcon = document.getElementById('popupIcon');
        const popupTitle = document.getElementById('popupTitle');
        const popupMsg = document.getElementById('popupMsg');

        // ================================================================
        //  AUDIO
        // ================================================================
        let audioCtx = null;

        function playCorrectSound() {
            try {
                if (!audioCtx) { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 880;
                gain.gain.value = 0.2;
                osc.type = 'sine';
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        function playWrongSound() {
            try {
                if (!audioCtx) { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 440;
                gain.gain.value = 0.25;
                osc.type = 'sawtooth';
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
                osc.stop(audioCtx.currentTime + 0.4);
            } catch (e) {}
        }

        function playLockOpenSound() {
            try {
                if (!audioCtx) { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                gain.gain.value = 0.15;
                osc.type = 'sine';
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }

        // ================================================================
        //  CONFETTI
        // ================================================================
        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 200, spread: 110, origin: { y: 0.5 } });
            setTimeout(() => {
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.2 } });
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.8 } });
            }, 150);
        }

        // ================================================================
        //  POPUP
        // ================================================================
        function showPopup(isCorrect) {
            popupOverlay.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
            popupOverlay.style.display = 'flex';

            if (isCorrect) {
                popupIcon.textContent = '🌟';
                popupTitle.textContent = 'Amazing!';
                popupMsg.textContent = 'You unlocked a lock! ✨';
            } else {
                popupIcon.textContent = '😒';
                popupTitle.textContent = 'Keep Going!';
                popupMsg.textContent = 'That key didn\'t fit. Try again! 🌈';
            }

            const sound = document.getElementById(isCorrect ? 'correctSound' : 'wrongSound');
            if (sound) sound.play().catch(() => {});

            setTimeout(() => {
                popupOverlay.style.display = 'none';
            }, 1800);
        }

        // ================================================================
        //  SPEECH
        // ================================================================
        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = 'en-US';
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        // ================================================================
        //  RENDER WORDS
        // ================================================================
        function renderWords() {
            leftWordsEl.innerHTML = '';
            rightWordsEl.innerHTML = '';

            antonymData.left.forEach((item) => {
                const el = createWordElement(item.word, 'left', item.match);
                leftWordsEl.appendChild(el);
            });

            shuffledRight.forEach((item) => {
                const el = createWordElement(item.word, 'right', null);
                rightWordsEl.appendChild(el);
            });
        }

        function createWordElement(word, side, match) {
            const el = document.createElement('div');
            el.className = 'word-item';
            if (match) el.dataset.match = match;
            el.dataset.word = word;
            el.dataset.side = side;

            const imageDiv = document.createElement('div');
            imageDiv.className = 'word-image';

            const img = document.createElement('img');
            img.src = imageMap[word] || `https://picsum.photos/seed/${word}/100/100`;
            img.alt = word;
            img.loading = 'lazy';
            img.onerror = function() { this.style.display = 'none'; };
            imageDiv.appendChild(img);

            const textSpan = document.createElement('span');
            textSpan.className = 'word-text';
            textSpan.textContent = word;

            el.appendChild(imageDiv);
            el.appendChild(textSpan);

            el.addEventListener('click', () => {
                if (side === 'left') handleLeftClick(el);
                else handleRightClick(el);
            });

            return el;
        }

        // ================================================================
        //  HANDLE LEFT CLICK
        // ================================================================
        function handleLeftClick(el) {
            if (isProcessing) return;
            if (el.classList.contains('matched')) return;

            document.querySelectorAll('.side-words .word-item').forEach(item => {
                item.classList.remove('active');
            });
            el.classList.add('active');
            selectedLeft = el;
        }

        // ================================================================
        //  HANDLE RIGHT CLICK
        // ================================================================
        function handleRightClick(el) {
            if (isProcessing) return;
            if (el.classList.contains('matched')) return;
            if (!selectedLeft) {
                el.classList.add('wrong');
                setTimeout(() => el.classList.remove('wrong'), 400);
                return;
            }

            const leftMatch = selectedLeft.dataset.match;
            const rightWord = el.dataset.word;
            const isCorrect = leftMatch === rightWord;

            if (isCorrect) {
                isProcessing = true;
                matchedPairs[selectedLeft.dataset.word] = rightWord;
                matchCount++;

                // Step 1: key travels along path - draw the line
                drawCurvedLine(selectedLeft, el);

                // Step 2: lock shakes + sparkles (CSS handles sparkles)
                el.style.animation = 'none';
                void el.offsetHeight;
                el.style.animation = 'shake 0.4s ease';

                // Step 3: lock opens with sound
                // playLockOpenSound();

                // Mark both as matched - this triggers lock open animation via CSS
                selectedLeft.classList.remove('active');
                selectedLeft.classList.add('matched');
                el.classList.add('matched');

                // Step 4: After lock opens, reveal images with flip effect
                const leftImg = selectedLeft.querySelector('img');
                const rightImg = el.querySelector('img');

                // Force image display after lock animation completes
                setTimeout(() => {
                    if (leftImg) {
                        leftImg.style.display = 'block';
                        leftImg.style.animation = 'imageReveal 0.7s ease forwards';
                    }
                    // if (rightImg) {
                    //     rightImg.style.display = 'block';
                    //     rightImg.style.animation = 'imageReveal 0.7s ease forwards';
                    // }
                }, 400);

                // Step 5: After image reveals, remove the open lock emoji
                // setTimeout(() => {
                //     el.classList.add('image-revealed');
                // }, 1200);

                // Step 6: confetti + popup
                showPopup(true);
                smallConfetti();
                speak('Correct');

                selectedLeft = null;
                isProcessing = false;

                if (matchCount === totalMatches) {
                    setTimeout(showFinal, 2000);
                }
            } else {
                // Incorrect: key rejected, lock wiggles
                isProcessing = true;
                showPopup(false);
                speak('Try again!');

                selectedLeft.classList.add('wrong');
                el.classList.add('wrong');
                el.style.animation = 'none';
                void el.offsetHeight;
                el.style.animation = 'shake 0.5s ease';

                setTimeout(() => {
                    selectedLeft.classList.remove('wrong');
                    selectedLeft.classList.remove('active');
                    el.classList.remove('wrong');
                    selectedLeft = null;
                    isProcessing = false;
                }, 600);
            }
        }

        // ================================================================
        //  DRAW CURVED LINE
        // ================================================================
        function drawCurvedLine(leftEl, rightEl) {
            const wrapperRect = svgWrapper.getBoundingClientRect();
            const leftRect = leftEl.getBoundingClientRect();
            const lx = leftRect.right - wrapperRect.left;
            const ly = leftRect.top + leftRect.height / 2 - wrapperRect.top;

            const rightRect = rightEl.getBoundingClientRect();
            const rx = rightRect.left - wrapperRect.left;
            const ry = rightRect.top + rightRect.height / 2 - wrapperRect.top;

            const cp1x = lx + (rx - lx) * 0.5;
            const cp1y = ly + (ry - ly) * 0.2;
            const cp2x = rx - (rx - lx) * 0.5;
            const cp2y = ry - (ry - ly) * 0.2;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const d = `M ${lx} ${ly} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${rx} ${ry}`;
            path.setAttribute('d', d);
            path.classList.add("svg-path");
            svg.appendChild(path);
        }

        // ================================================================
        //  SHOW FINAL
        // ================================================================
      function showFinal() {
    const popup = document.getElementById("finalPopup");

    document.getElementById("finalScore").textContent =
        `Your Score: ${matchCount} / ${totalMatches}`;

    document.getElementById("stars").textContent =
        "⭐".repeat(matchCount);

    popup.style.display = "flex";

    bigConfetti();

   
}

        // ================================================================
        //  INIT
        // ================================================================
        renderWords();

        window.addEventListener('resize', () => {});

        console.log('🗝️ Magic Key & Lock Adventure loaded!');
        console.log(`📝 Total locks to open: ${totalMatches}`);
    </script>

</body>

</html>
