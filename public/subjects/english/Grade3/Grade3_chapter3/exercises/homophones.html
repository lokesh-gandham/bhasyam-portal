<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Homophones · Smart Auto-Check</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* ===== BASE ===== */
    @font-face {
      font-family: 'CCSYBold';
      src: url('./assets/CCSYBOLD.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'CCSyntroman';
      src: url('../assets/CCSYNTRO.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'CCSyntroman', 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
   
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      margin: 0;
      overflow:hidden;
    }

    .container {
      max-width: 1020px;
      width: 100%;
   
      transition: all 0.2s;
    }

    .main-heading {
      font-size: clamp(1rem, 4.5vw, 1.8rem);
      font-weight: 500;
      color: #1e293b;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 18px;
      letter-spacing: -0.3px;
      padding: 0 6px;
    }

    .word-strip {
      background: #fef0e6;
      border-radius: 60px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 18px;
      margin-bottom: 24px;
      border: 2px solid #fae4d8;
    }
    .word-strip span {
      font-size: clamp(0.7rem, 2vw, 1.1rem);
      font-weight: 600;
      color: #3d2a24;
      white-space: nowrap;
      letter-spacing: 0.2px;
      transition: 0.25s ease;
      padding: 4px 6px;
      border-radius: 30px;
    }
    .word-strip span.completed {
      background: #22c55e;
      color: #fff;
      padding: 4px 16px;
      box-shadow: 0 2px 12px rgba(34, 197, 94, 0.3);
    }
    .word-strip .dash {
      color: #b07a6a;
      font-weight: 300;
      margin: 0 2px;
    }

    .question-card {
      /* background: #ffffff;
      border: 2px solid #ede7e2; */
      border-radius: 28px;
      padding: 24px 18px 28px;
      margin-bottom: 16px;
      transition: border 0.2s;
    }

   .question-label{
    width: fit-content;
    min-width: 240px;
    height: 56px;
    margin: -29px auto 24px;
    padding: 0 40px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:'CCSYBold';
    font-size:28px;
    color:#ffffff;

    background:#8d64e7;
    border-radius:18px 18px 22px 22px;

    border:3px solid #ffffff;
    box-shadow:
        0 8px 20px rgba(155,116,239,.35),
        inset 0 2px 0 rgba(255,255,255,.45);

    position:relative;
    z-index:5;
}

    .image-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(16px, 6vw, 50px);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .image-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .image-box .img-frame {
      width: clamp(100px, 25vw, 220px);
      height: clamp(100px, 25vw, 220px);
      border-radius: 20px;
      background: #f7f4f2;
      border: 3px dashed #d5cdc8;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border 0.2s;
    }
    .image-box .img-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }

    .input-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(12px, 8vw, 60px);
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .input-group input {
      width: clamp(80px, 22vw, 160px);
      height: clamp(42px, 8vh, 58px);
      font-size: clamp(1.1rem, 3.5vw, 1.8rem);
      font-weight: 600;
      text-align: center;
      border: 3px solid #e2d6ce;
      border-radius: 18px;
      background: #fcfaf8;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      color: #1e293b;
      text-transform: capitalize;
      font-family: 'CCSyntroman';
      letter-spacing: 0.5px;
    }
    .input-group input::placeholder {
      color: #b5a8a0;
      font-weight: 400;
      font-size: clamp(0.6rem, 1.6vw, 0.9rem);
      text-transform: none;
        position: relative;
    top: -2px;
    }
    .input-group input:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
      background: #ffffff;
    }
    .input-group input.correct {
      border-color: #22c55e;
      background: #f0fdf4;
      pointer-events: none;
    }
    .input-group input.wrong {
      border-color: #ef4444;
      background: #fef2f2;
      animation: shake 0.4s ease;
    }
    .input-group input:disabled {
      opacity: 0.85;
    }

    .input-label {
      font-size: clamp(0.55rem, 1.4vw, 0.8rem);
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.4px;
      text-transform: capitalize;
      margin-top: 2px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      60% { transform: translateX(6px); }
    }

    /* ===== UPDATED CONTROLS - Matching MCQ Quiz Style ===== */
    .controls {
      display: flex;
      justify-content: space-between;
      gap: clamp(16px, 12vw, 80px);
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .controls button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 32px;
      border: 3px solid #ffffff;
      border-radius: 40px;
       font-size: 20px;
      font-weight: 400;
      color: #ffffff;
      cursor: pointer;
      transition: 0.15s ease;
      font-family: 'CCSyntroman', 'Inter', sans-serif;
      width: 130px;
            height: 55px;
    }

    .controls .prev-btn {
      background: linear-gradient(#b5dffc, #7fc0eb);
      box-shadow: 0 4px 0 #4da5d4;
    }

    .controls .prev-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #4da5d4;
    }

    .controls .next-btn {
      background: linear-gradient(#f1e390, #ecc74e);
      box-shadow: 0 4px 0 #d1a72c;
    }

    .controls .next-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d1a72c;
    }

    .controls button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: 0 4px 0 #4da5d4 !important;
    }

    .controls .next-btn:disabled {
      box-shadow: 0 4px 0 #d1a72c !important;
    }

    .controls button i {
      font-size: clamp(0.7rem, 1.4vw, 1rem);
    }

    /* ===== POPUPS - Same as reference ===== */
    .kid-popup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 20px;
   
    }

    .kid-card {
      background: #ffffff;
      width: 380px;
      max-width: 95%;
      padding: 32px 28px;
      border-radius: 44px;
      text-align: center;
      animation: kidPop 0.6s ease;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
      border: 5px solid transparent;
    }

    .kid-card::before,
    .kid-card::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
      pointer-events: none;
    }

    .kid-card::before {
      width: 200px;
      height: 200px;
      top: -80px;
      right: -60px;
      background: #ffd93d;
    }

    .kid-card::after {
      width: 150px;
      height: 150px;
      bottom: -60px;
      left: -50px;
      background: #6bcbff;
    }

    .kid-card>* {
      position: relative;
      z-index: 2;
    }

    .kid-icon {
      font-size: 4.8em;
      margin-bottom: 6px;
      animation: emojiBounce 0.9s infinite alternate;
      display: inline-block;
    }

    .kid-card h3 {
      font-size: 2.2em;
      margin-bottom: 4px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .kid-card p {
      font-size: 1.1em;
      color: #555;
      margin-top: 2px;
      font-weight: 500;
    }

    .kid-correct .kid-card {
      background: linear-gradient(145deg, #f0fff4, #d4f5e6);
      border-color: #38d9a9;
    }

    .kid-correct .kid-card h3 {
      color: #0b8a4a;
    }

    .kid-correct .kid-card p {
      color: #1a6a3a;
    }

    .kid-correct .kid-card::before {
      background: #38d9a9;
    }

    .kid-correct .kid-card::after {
      background: #38d9a9;
    }

    .kid-wrong .kid-card {
      background: linear-gradient(145deg, #fff5f5, #fce4e4);
      border-color: #ff8a8a;
    }

    .kid-wrong .kid-card h3 {
      color: #c0392b;
    }

    .kid-wrong .kid-card p {
      color: #922b21;
    }

    .kid-wrong .kid-card::before {
      background: #ff8a8a;
    }

    .kid-wrong .kid-card::after {
      background: #ff8a8a;
    }

    @keyframes kidPop {
      0% {
        transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg);
        opacity: 0;
      }
      50% {
        transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(0) perspective(400px) rotateX(0);
        opacity: 1;
      }
    }

    @keyframes emojiBounce {
      from {
        transform: translateY(0) scale(1);
      }
      to {
        transform: translateY(-12px) scale(1.05);
      }
    }

    /* ===== FINAL POPUP ===== */
    #finalPopup {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 4000;
      padding: 20px;

    }

    .final-kid-box {
      background: linear-gradient(145deg, #fff7d6, #e6fff5);
      padding: 35px 40px;
      border-radius: 44px;
      text-align: center;
      width: 480px;
      max-width: 95%;
      animation: finalBounce 0.8s ease;
      border: 4px solid rgba(255, 255, 255, 0.6);
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
    }

    .final-kid-box::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      top: -120px;
      right: -100px;
      background: #ffd93d;
      border-radius: 50%;
      opacity: 0.15;
      pointer-events: none;
    }

    .final-kid-box>* {
      position: relative;
      z-index: 2;
    }

    .final-kid-box h2 {
      font-size: 2.4em;
      color: #2f9e44;
      margin-bottom: 8px;
      font-weight: 700 !important;
    }

    .final-kid-box p {
      font-size: 1.3em;
      font-weight: 600;
      color: #2d3a3a;
    }

    #stars {
      font-size: 2.6em;
      margin: 14px 0;
      letter-spacing: 6px;
    }

    .playAgain-btn {
      background: #ffac30;
      color: white;
      border: none;
      padding: 16px 38px;
      border-radius: 40px;
      font-size: 1.15em;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
      box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
      letter-spacing: 0.5px;
    }

    .playAgain-btn:hover {
      transform: translateY(-3px);
    }

    .playAgain-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #d4871f;
    }

    @keyframes finalBounce {
      0% {
        transform: scale(0.3) perspective(400px) rotateX(15deg);
        opacity: 0;
      }
      50% {
        transform: scale(1.08) perspective(400px) rotateX(-5deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) perspective(400px) rotateX(0);
        opacity: 1;
      }
    }

    /* ===== COMPREHENSIVE MEDIA QUERIES: 320px to 1920px ===== */

    /* 1920px and above */

        max-width: 1200px;

      }
      .main-heading {

      }
      .word-strip {
        padding: 18px 32px;

      }
      .word-strip span {

      }
      .question-card {
        padding: 36px 32px 40px;
        border-radius: 32px;
        border-width: 3px;
      }
      .question-label {
        font-size: 1.6rem;
        margin-bottom: 24px;
      }
      .image-box .img-frame {
        width: 260px;
        height: 260px;
        border-radius: 28px;
        border-width: 4px;
      }
      .image-box .img-frame img {
        padding: 14px;
      }
      .image-row {
        gap: 60px;
        margin-bottom: 28px;
      }
      .input-group input {
        width: 190px;
        height: 64px;
        font-size: 2rem;
        border-width: 4px;
        border-radius: 20px;
      }
      .input-row {
        gap: 80px;
      }
      .controls {
        gap: 100px;
        margin-top: 8px;
      }
      .controls button {
        padding: 16px 44px;
        font-size: 1.3rem;
        border-radius: 48px;
        gap: 14px;
        min-width: 180px;
      }
    }

      }

      }

      }

    /* 1280px to 1440px */
    @media (min-width: 1281px) and (max-width: 1440px) {

      }
      /* .controls button {
        padding: 12px 36px;

        font-size: 0.45rem;
      }
      .kid-card {
        width: 250px;
        padding: 14px 12px;
        border-radius: 24px;
      }
      .kid-icon {
        font-size: 2.4rem;
      }
      .kid-card h3 {
        font-size: 1.2rem;
      }
      .kid-card p {
        font-size: 0.75rem;
      }
      .final-kid-box {
        width: 320px;
        padding: 16px 18px;
        border-radius: 28px;
      }
      .final-kid-box h2 {
        font-size: 1.4rem;
      }
      .final-kid-box p {
        font-size: 0.85rem;
      }
      #stars {
        font-size: 1.4rem;
        margin: 4px 0;
      }
      .playAgain-btn {
        padding: 6px 18px;
        font-size: 0.75rem;
        box-shadow: 0 5px 0 #d4871f;
      }
      .playAgain-btn:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #d4871f;
      }
    }

    /* Print */
    @media print {
      body {
        background: white;
        padding: 10px;
        overflow: visible;
      }
      .container {
        box-shadow: none;
        border: 1px solid #ddd;
        border-radius: 12px;
        background: white;
      }
      .controls, .kid-popup, #finalPopup, .check-btn {
        display: none !important;
      }
      .input-group input {
        border-color: #999 !important;
        background: white !important;
      }
      .question-card {
        border-color: #ccc !important;
        box-shadow: none !important;
      }
      .word-strip span.completed {
        background: #ddd !important;
        color: #333 !important;
        box-shadow: none !important;
      }
      .image-box .img-frame {
        border-color: #bbb !important;
        background: #f5f5f5 !important;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <h1 class="main-heading">
    Look at the pictures and write the following homophones at the right places.
  </h1>

  <div class="word-strip">
    <span id="pair-eye">eye <span class="dash">–</span> I</span>
    <span id="pair-write">write <span class="dash">–</span> right</span>
    <span id="pair-sun">sun <span class="dash">–</span> son</span>
    <span id="pair-hair">hair <span class="dash">–</span> hare</span>
    <span id="pair-hear">hear <span class="dash">–</span> here</span>
    <span id="pair-maze">maze <span class="dash">–</span> maize</span>
  </div>

  <div class="question-card">
    <div class="question-label" id="questionLabel">Question 1</div>

    <div class="image-row">
      <div class="image-box">
        <div class="img-frame">
          <img id="leftImg" src="" alt="Left image" />
        </div>
      </div>
      <div class="image-box">
        <div class="img-frame">
          <img id="rightImg" src="" alt="Right image" />
        </div>
      </div>
    </div>

    <div class="input-row">
      <div class="input-group">
        <input type="text" id="leftInput" placeholder="Type here..." autocomplete="off" maxlength="6" />
      </div>
      <div class="input-group">
        <input type="text" id="rightInput" placeholder="Type here..." autocomplete="off" maxlength="6" />
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="prev-btn" id="prevBtn"><i class="fa-solid fa-angles-left"></i> Prev</button>
    <button class="next-btn" id="nextBtn">Next <i class="fa-solid fa-angles-right"></i></button>
  </div>
</div>

<!-- Popups -->
<div id="answerPopup" class="kid-popup">
  <div class="kid-card">
    <div id="popupIcon" class="kid-icon"></div>
    <h3 id="popupTitle"></h3>
    <p id="popupMsg"></p>
  </div>
</div>

<div id="finalPopup">
  <div class="final-kid-box">
    <h2>🎉 Congratulations!</h2>
    <p id="finalScore"></p>
    <div id="stars"></div>
    <button class="playAgain-btn" id="playAgainBtn">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
  (function() {
    const cardData = [
      { leftImg: '../assets/images/p1.png', rightImg: '../assets/images/p2.png', ansL: 'sun', ansR: 'son' },
      { leftImg: '../assets/images/p3.png', rightImg: '../assets/images/p4.png', ansL: 'hair', ansR: 'hare' },
      { leftImg: '../assets/images/p5.png', rightImg: '../assets/images/p6.png', ansL: 'write', ansR: 'right' },
      { leftImg: '../assets/images/p7.png', rightImg: '../assets/images/p8.png', ansL: 'eye', ansR: 'i' },
      { leftImg: '../assets/images/p9.png', rightImg: '../assets/images/p10.png', ansL: 'maze', ansR: 'maize' },
      { leftImg: '../assets/images/p11.png', rightImg: '../assets/images/p12.png', ansL: 'hear', ansR: 'here' }
    ];

    const pairMap = {
      sun: 'pair-sun', son: 'pair-sun',
      hair: 'pair-hair', hare: 'pair-hair',
      write: 'pair-write', right: 'pair-write',
      eye: 'pair-eye', i: 'pair-eye',
      maze: 'pair-maze', maize: 'pair-maze',
      hear: 'pair-hear', here: 'pair-hear'
    };

    const leftImg = document.getElementById('leftImg');
    const rightImg = document.getElementById('rightImg');
    const leftInput = document.getElementById('leftInput');
    const rightInput = document.getElementById('rightInput');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const questionLabel = document.getElementById('questionLabel');
    const popup = document.getElementById('answerPopup');
    const popupIcon = document.getElementById('popupIcon');
    const popupTitle = document.getElementById('popupTitle');
    const popupMsg = document.getElementById('popupMsg');
    const finalPopup = document.getElementById('finalPopup');
    const finalScore = document.getElementById('finalScore');
    const stars = document.getElementById('stars');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const correctSound = document.getElementById('correctSound');
    const wrongSound = document.getElementById('wrongSound');

    let current = 0, correctCount = 0, total = cardData.length * 2;
    let answered = cardData.map(() => ({ left: false, right: false }));
    let popupTimer = null, isChecking = false, debounceTimer = null;

    function speak(text) {
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-US'; msg.rate = 0.9; msg.volume = 0.3;
        speechSynthesis.speak(msg);
      }
    }

    function smallConfetti() { confetti({ particleCount: 30, spread: 60, origin: { y: 0.7 } }); }
    function bigConfetti() {
      confetti({ particleCount: 180, spread: 100, origin: { y: 0.5 } });
      setTimeout(() => {
        confetti({ particleCount: 100, spread: 120, origin: { y: 0.4, x: 0.2 } });
        confetti({ particleCount: 100, spread: 120, origin: { y: 0.4, x: 0.8 } });
      }, 150);
    }

    function showPopup(isCorrect) {
      if (popupTimer) clearTimeout(popupTimer);
      popup.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
      popup.style.display = 'flex';
      if (isCorrect) {
        popupIcon.textContent = '🌟';
        popupTitle.textContent = 'Amazing!';
        popupMsg.textContent = "You got it right! ✨";
        correctSound.play().catch(() => {});
        smallConfetti();
        speak('Correct');
      } else {
        popupIcon.textContent = '😊';
        popupTitle.textContent = "Keep Going!";
        popupMsg.textContent = 'Try again, you can do it! 🌈';
        wrongSound.play().catch(() => {});
        speak('Try again');
      }
      popupTimer = setTimeout(() => { popup.style.display = 'none'; }, 1400);
    }

    function showFinalPopup() {
      finalPopup.style.display = 'flex';
      finalScore.textContent = `Your Score: 6 / 6`;
      stars.textContent = '⭐'.repeat(5);
      bigConfetti();
    }

    // popup.addEventListener('click', (e) => { if (e.target === popup) popup.style.display = 'none'; });
    // finalPopup.addEventListener('click', (e) => { if (e.target === finalPopup) finalPopup.style.display = 'none'; });

    function updateWordStrip() {
      document.querySelectorAll('.word-strip span').forEach(el => el.classList.remove('completed'));
      cardData.forEach((card, idx) => {
        if (answered[idx].left && answered[idx].right) {
          const id = pairMap[card.ansL];
          if (id) document.getElementById(id).classList.add('completed');
        }
      });
    }

    function allCompleted() { return answered.every(c => c.left && c.right); }

    function checkAnswer(input, side) {
      if (isChecking) return;
      const card = cardData[current];
      const isLeft = side === 'left';
      const answer = isLeft ? card.ansL : card.ansR;
      const val = input.value.trim().toLowerCase();
      if (answered[current][isLeft ? 'left' : 'right']) return;
      if (val === '') return;

      if (val === answer.toLowerCase()) {
        isChecking = true;
        input.classList.remove('wrong');
        input.classList.add('correct');
        input.disabled = true;
        answered[current][isLeft ? 'left' : 'right'] = true;
        correctCount++;
        updateWordStrip();
        showPopup(true);
        if (answered[current].left && answered[current].right) { nextBtn.disabled = false; }
        if (allCompleted()) { setTimeout(showFinalPopup, 800); }
        isChecking = false;
      } else {
        const isPartial = answer.toLowerCase().startsWith(val);
        const isTooLong = val.length > answer.length;
        if (!isPartial || isTooLong) {
          input.classList.add('wrong');
          showPopup(false);
          setTimeout(() => {
            input.classList.remove('wrong');
            input.value = '';
            input.focus();
            isChecking = false;
          }, 500);
        } else {
          input.classList.remove('wrong');
        }
      }
    }

    function loadQuestion(index) {
      const card = cardData[index];
      leftImg.src = card.leftImg;
      rightImg.src = card.rightImg;
      questionLabel.textContent = `Question ${index + 1}`;
      leftInput.value = ''; rightInput.value = '';
      leftInput.className = ''; rightInput.className = '';
      leftInput.disabled = false; rightInput.disabled = false;
      if (answered[index].left) {
        leftInput.value = card.ansL;
        leftInput.classList.add('correct');
        leftInput.disabled = true;
      }
      if (answered[index].right) {
        rightInput.value = card.ansR;
        rightInput.classList.add('correct');
        rightInput.disabled = true;
      }
      prevBtn.disabled = (index === 0);
      const both = answered[index].left && answered[index].right;
      nextBtn.disabled = !both && index < cardData.length - 1;
      if (allCompleted()) nextBtn.disabled = true;
    }

    function handleInput(input, side) {
      if (debounceTimer) clearTimeout(debounceTimer);
      const val = input.value.trim();
      if (val === '') return;
      const isLeft = side === 'left';
      if (answered[current][isLeft ? 'left' : 'right']) return;
      debounceTimer = setTimeout(() => { checkAnswer(input, side); }, 400);
    }

    leftInput.addEventListener('input', function() { handleInput(this, 'left'); });
    rightInput.addEventListener('input', function() { handleInput(this, 'right'); });
    leftInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); if (debounceTimer) clearTimeout(debounceTimer); checkAnswer(this, 'left'); } });
    rightInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); if (debounceTimer) clearTimeout(debounceTimer); checkAnswer(this, 'right'); } });

    function protect(input) {
      ['dragenter','dragover','dragleave','drop'].forEach(ev => input.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
      input.addEventListener('paste', e => e.preventDefault());
      input.addEventListener('contextmenu', e => e.preventDefault());
      input.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'v') e.preventDefault(); });
    }
    protect(leftInput); protect(rightInput);

    prevBtn.addEventListener('click', () => { if (current > 0) { current--; loadQuestion(current); } });
    nextBtn.addEventListener('click', () => { if (current < cardData.length - 1 && answered[current].left && answered[current].right) { current++; loadQuestion(current); } });

    function resetGame() {
      correctCount = 0;
      answered = cardData.map(() => ({ left: false, right: false }));
      current = 0;
      finalPopup.style.display = 'none';
      popup.style.display = 'none';
      updateWordStrip();
      loadQuestion(0);
    }
    playAgainBtn.addEventListener('click', resetGame);

    loadQuestion(0);
    updateWordStrip();
  })();
</script>
</body>
</html>
