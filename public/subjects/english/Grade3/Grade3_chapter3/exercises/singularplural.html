<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Plural Forms · Fun Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* ============================================================
           ROOT VARIABLES
        ============================================================ */
        :root {
            --bg-body: #FFF7F5;
            --card-bg: #ffffff;
            --orange: #FF8A3D;
            --pink-light: #FCE4EC;
            --green: #4CAF50;
            --green-light: #e8f5e9;
            --red: #EF5350;
            --red-light: #ffebee;
            --shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
            --radius: 18px;
            --radius-sm: 14px;
         
        }

        @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }
       

        body {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
         
            padding: 20px;
            overflow: hidden;
        }

        .app {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .template {
            width: min(1200px, 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        /* heading style */
        .heading {
            width: 80%;
            margin-inline: auto;
            text-align: center;
            padding: 14px 24px;
            border-radius: 18px;
            background: #f4f1ff;
            color: #444;
            font-size: 25px;
            font-weight: 500;
            box-shadow: 0 8px 18px rgba(0, 0, 0, .08);
        }

        /* questions grid */
        .questions-wrap {
            width: 90%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            align-items: start;
        }

        /* question card */
        .question {
            width: 100%;
            border: 3px solid #ffffff;
            border-radius: 20px;
            padding: 20px 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            background: #fffff8;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
        }

        .question-top {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            gap: 10px;
            padding: 0 10px;
            flex-wrap: wrap;
        }

        .question-label {
            font-size: 22px;
            font-weight: 600;
            color: #ff7a2f;
            white-space: nowrap;
            display: flex;
            justify-content: center;
            align-items: center;
             width: 42px;
    height: 42px;
    border-radius: 15px;

    background: linear-gradient(135deg, #ff8a3d, #ffb347);
    color: #fff;
        }

        .word-display {
            font-size: 32px;
            font-weight: 400;
            color: #2c3e50;
            text-transform: capitalize;
        }

        .arrow-icon {
            font-size: 28px;
            color: #555;
        }

        .answer-box {
            min-width: 140px;
            height: 50px;
            border-radius: 15px;
            border: 3px solid #ffd494;
            background: #fffdfa;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: 500;
            color: #555;
            transition: all 0.3s ease;
            padding: 0 15px;
        }

        .answer-box.correct {
            border-color: #17b655;
            /* background: #ddffe7;
            color: #10853f; */
            text-transform: capitalize;
        }

        .answer-box.wrong {
            border-color: red;
            background: #ffe0e0;
            animation: blink .5s ease;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: .2;
            }
        }

        /* =========================================
           IMAGE FRAME — image always visible, revealed when correct
           ========================================= */
        .image-frame {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .question-image {
            width: 150px;
            height: 110px;
            object-fit: contain;
            border-radius: 16px;
            /* border: 3px solid #ffe0b0;
            background: #f5f0ea; */
            /* filter: grayscale(100%) opacity(0.55); */
            transition: all 0.6s ease;
            display: block;
        }

        .question-image.revealed {
            filter: grayscale(0%) opacity(1);
            /* border-color: #17b655; */
            /* box-shadow: 0 0 0 4px #ddffe7, 0 10px 20px rgba(23, 182, 85, 0.3); */
            animation: revealImage 0.6s ease;
        }

        @keyframes revealImage {
            0% {
                transform: scale(0.85);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* =========================================
           PASTEL CIRCULAR OPTIONS - Always visible
           ========================================= */
        .options-container {
            width: 90%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .options {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 22px;
            padding: 20px;
            border-radius: 28px;
        }

        .option {
            width: 140px;
            height: 70px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-radius: 30px;
            border: 3px solid #ffb4d1;
            cursor: pointer;
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
            text-align: center;
            overflow: hidden;
            background: #ffffff;
            text-transform: capitalize;
        }

        .option:hover:not(.correct) {
            transform: translateY(-6px) scale(1.04);
            border-color: #ff9cc4;
            box-shadow: 0 12px 10px rgba(255, 155, 195, 0.308);
        }

        .option:active:not(.correct) {
            transform: scale(.96);
        }

        .option span {
            font-size: 30px;
            font-weight: 500;
            line-height: 1.1;
            color: #5a5566;
            pointer-events: none;
        }

        .option.correct {
            background: linear-gradient(135deg, #ddffe6, #c8ffd7);
            border-color: #22b455;
            color: #148a40;
            pointer-events: none;
        }

        .option.wrong-option {
            background: #ffe0e0;
            border-color: #ef5350;
            animation: blink .5s ease;
        }

        .option.disabled {
            pointer-events: none;
            opacity: 0.55;
            filter: grayscale(0.1);
        }

        /* ============================================================
           NAVIGATION BUTTONS - MCQ STYLE
        ============================================================ */
        .controls {
            display: flex;
            justify-content: center;
            gap: 120px;
            margin-top: 30px;
            width: 100%;
        }

        .controls button {
            width: 130px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-radius: 35px;
            border: 3px solid #ffffff;
            font-size: 20px;
            font-weight: 400;
            color: #ffffff;
            cursor: pointer;
            transition: .15s ease;
            
        }

        .controls button:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none !important;
        }

        .prev-btn {
            background: linear-gradient(#b5dffc, #7fc0eb);
            box-shadow: 0 4px 0 #4da5d4;
        }

        .prev-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4da5d4;
        }

        .next-btn {
            background: linear-gradient(#f1e390, #ecc74e);
            box-shadow: 0 4px 0 #d1a72c;
        }

        .next-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d1a72c;
        }

        /* ============================================================
           POPUPS - Enhanced with decorative circles (MCQ style)
        ============================================================ */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 6000;
            padding: 20px;

        }

        .kid-card {
            width: 380px;
            max-width: 90%;
            padding: 32px 28px;
            border-radius: 44px;
            text-align: center;
            animation: kidPop 0.6s ease;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .kid-card::before,
        .kid-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .kid-card::before {
            width: 200px;
            height: 200px;
            top: -80px;
            right: -60px;
            background: #ffd93d;
        }

        .kid-card::after {
            width: 150px;
            height: 150px;
            bottom: -60px;
            left: -50px;
            background: #6bcbff;
        }

        .kid-card>* {
            position: relative;
            z-index: 2;
        }

        .kid-correct .kid-card {
            background: linear-gradient(145deg, #f0fff4, #d4f5e6);
            border: 5px solid #38d9a9;
        }

        .kid-correct .kid-card h3 {
            color: #0b8a4a;
        }

        .kid-correct .kid-card p {
            color: #1a6a3a;
        }

        .kid-correct .kid-card::before,
        .kid-correct .kid-card::after {
            background: #38d9a9;
        }

        .kid-wrong .kid-card {
            background: linear-gradient(145deg, #fff5f5, #fce4e4);
            border: 5px solid #ff8a8a;
        }

        .kid-wrong .kid-card h3 {
            color: #c0392b;
        }

        .kid-wrong .kid-card p {
            color: #922b21;
        }

        .kid-wrong .kid-card::before,
        .kid-wrong .kid-card::after {
            background: #ff8a8a;
        }

        .kid-icon {
            font-size: 4.8em;
            margin-bottom: 6px;
            animation: emojiBounce 0.9s infinite alternate;
            display: inline-block;
        }

        .kid-card h3 {
            font-size: 2.2em;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .kid-card p {
            font-size: 1.1em;
            color: #555;
            margin-top: 2px;
            font-weight: 500;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0) scale(1);
            }
            to {
                transform: translateY(-12px) scale(1.05);
            }
        }

        /* ============================================================
           FINAL POPUP - Enhanced (MCQ style)
        ============================================================ */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 7000;
            padding: 20px;
           
        }

        .final-kid-box {
            background: linear-gradient(145deg, #fff7d6, #e6fff5);
            padding: 35px 40px;
            border-radius: 44px;
            text-align: center;
            width: 480px;
            max-width: 95%;
            animation: finalBounce 0.8s ease;
            border: 4px solid rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
            /* box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15); */
        }

        .final-kid-box::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            top: -120px;
            right: -100px;
            background: #ffd93d;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .final-kid-box>* {
            position: relative;
            z-index: 2;
        }

        .final-kid-box h2 {
            font-size: 2.4em;
            color: #2f9e44;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
            color: #2d3a3a;
        }

        #stars {
            font-size: 2.6em;
            margin: 14px 0;
            letter-spacing: 6px;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
            letter-spacing: 0.5px;
        }

        .playAgain-btn:hover {
            transform: translateY(-3px);
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #d4871f;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3) perspective(400px) rotateX(15deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.08) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

<body>
    <div class="app">
        <div class="template">
            <div class="heading">
                Write the plural forms of the following words.
            </div>
            <div class="questions-wrap" id="questionsWrap"></div>
            <div class="controls">
                <button class="prev-btn" id="prevBtn"><i class="fas fa-angles-left"></i> Prev</button>
                <button class="next-btn" id="nextBtn">Next <i class="fas fa-angles-right"></i></button>
            </div>
        </div>
    </div>

    <!-- ===== POPUPS (MCQ Style) ===== -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2 id="finalTitle">🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <!-- ===== AUDIO ===== -->
    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        // ===========================================
        // DATA - 6 questions with correct/wrong options + images
        // ===========================================
        const questionsData = [
            { word: "city", correct: "cities", wrong: "citys", image: "../assets/images/city.png", imagePlural: "../assets/images/cities.png" },
            { word: "candy", correct: "candies", wrong: "candys", image: "../assets/images/candy.png", imagePlural: "../assets/images/candies.png" },
            { word: "lady", correct: "ladies", wrong: "ladys", image: "../assets/images/lady.png", imagePlural: "../assets/images/ladies.png" },
            { word: "country", correct: "countries", wrong: "countrys", image: "../assets/images/country.png", imagePlural: "../assets/images/countries.png" },
            { word: "family", correct: "families", wrong: "familys", image: "../assets/images/family.png", imagePlural: "../assets/images/families.png" },
            { word: "cherry", correct: "cherries", wrong: "cherrys", image: "../assets/images/cherry.png", imagePlural: "../assets/images/cherries.png" }
        ];

        // ===========================================
        // DOM REFS
        // ===========================================
        const wrap = document.getElementById("questionsWrap");
        const popup = document.getElementById("answerPopup");
        const popupIcon = document.getElementById("popupIcon");
        const popupTitle = document.getElementById("popupTitle");
        const popupMsg = document.getElementById("popupMsg");
        const finalPopup = document.getElementById("finalPopup");
        const finalTitle = document.getElementById("finalTitle");
        const finalScore = document.getElementById("finalScore");
        const stars = document.getElementById("stars");
        const playAgainBtn = document.getElementById("playAgainBtn");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const correctSound = document.getElementById("correctSound");
        const wrongSound = document.getElementById("wrongSound");

        // ===========================================
        // STATE
        // ===========================================
        const totalQuestions = questionsData.length;
        const questionsPerPage = 2;
        let currentPage = 0;
        let solvedAnswers = {};
        let popupTimer = null;
        const totalPages = Math.ceil(totalQuestions / questionsPerPage);

        // ===========================================
        // SPEECH
        // ===========================================
        function speak(text) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        // ===========================================
        // CONFETTI
        // ===========================================
        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 200, spread: 110, origin: { y: 0.5 } });
            setTimeout(() => {
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.2 } });
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.8 } });
            }, 150);
        }
        // ===========================================
        // POPUPS (MCQ Style)
        // ===========================================
        function showPopup(isCorrect) {
            if (popupTimer) clearTimeout(popupTimer);

            popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
            popup.style.display = "flex";

            if (isCorrect) {
                popupIcon.textContent = "🌟";
                popupTitle.textContent = "Amazing!";
                popupMsg.textContent = "Perfect plural form! ✨";
                try { correctSound.play(); } catch (e) {}
                smallConfetti();
                speak("Correct");
            } else {
                popupIcon.textContent = "😒";
                popupTitle.textContent = "Keep Going!";
                popupMsg.textContent = "Try again, you can do it! 🌈";
                try { wrongSound.play(); } catch (e) {}
                speak("Try again");
            }

            popupTimer = setTimeout(() => {
                popup.style.display = "none";
            }, 1800);
        }

        function showFinalPopup() {
            const totalSolved = Object.values(solvedAnswers).reduce((sum, page) => sum + Object.keys(page).length, 0);
            finalPopup.style.display = "flex";
               prevBtn.disabled = true;
    nextBtn.disabled = true;
            finalTitle.textContent = "🎉 Congratulations!";
            finalScore.textContent = `Your Score: ${totalSolved} / ${totalQuestions}`;
            stars.textContent = "⭐".repeat(5);
            bigConfetti();
            // setTimeout(() => speak(`You scored ${totalSolved} out of ${totalQuestions}`), 600);
        }

        // Close popups on outside click
        // popup.addEventListener('click', (e) => {
        //     if (e.target === popup) popup.style.display = 'none';
        // });
        // finalPopup.addEventListener('click', (e) => {
        //     if (e.target === finalPopup) finalPopup.style.display = 'none';
        // });

        // ===========================================
        // RENDER
        // ===========================================
        function loadPage(pageIndex) {
            wrap.innerHTML = "";
            const startIdx = pageIndex * questionsPerPage;
            const endIdx = Math.min(startIdx + questionsPerPage, totalQuestions);

            for (let i = startIdx; i < endIdx; i++) {
                const q = questionsData[i];
                const isSolved = solvedAnswers[pageIndex] && solvedAnswers[pageIndex][i - startIdx] !== undefined;

                const options = [
                    { text: q.correct, isCorrect: true },
                    { text: q.wrong, isCorrect: false }
                ];
                // Shuffle options
                for (let j = options.length - 1; j > 0; j--) {
                    const k = Math.floor(Math.random() * (j + 1));
                    [options[j], options[k]] = [options[k], options[j]];
                }

                const optionsHtml = options.map(opt => {
                    const isCorrectOption = isSolved && opt.text === q.correct;
                    const isWrongSelected = isSolved && opt.text !== q.correct && solvedAnswers[pageIndex][i - startIdx] === opt.text;
                    let className = "option";
                    if (isCorrectOption) className += " correct";
                    if (isWrongSelected) className += " wrong-option";
                    if (isSolved) className += " disabled";
                    
                    return `
                        <div class="${className}" onclick="selectOption(${pageIndex}, ${i - startIdx}, '${opt.text}', '${q.correct}')">
                            <span>${opt.text}</span>
                        </div>
                    `;
                }).join("");

                // Use plural image if solved, otherwise singular
                const imageSrc = isSolved ? q.imagePlural : q.image;

                wrap.innerHTML += `
                    <div class="question">
                        <div class="question-top">
                            <span class="question-label">Q${i + 1}</span>
                            <span class="word-display">${q.word}</span>
                            <span class="arrow-icon">→</span>
                            <div class="answer-box ${isSolved ? "correct" : ""}" id="answer-${i}">
                                ${isSolved ? q.correct : "?"}
                            </div>
                        </div>
                        <div class="image-frame">
                            <img class="question-image ${isSolved ? "revealed" : ""}" src="${imageSrc}" alt="${q.word}" id="qimg-${i}">
                        </div>
                        <div class="options-container" id="opts-${i}">
                            <div class="options">
                                ${optionsHtml}
                            </div>
                        </div>
                    </div>
                `;
            }

            // Update buttons - MCQ style with disabled state
            prevBtn.disabled = pageIndex === 0;

            const isPageSolved = solvedAnswers[pageIndex] && Object.keys(solvedAnswers[pageIndex]).length === (endIdx - startIdx);
            const isLastPage = pageIndex === totalPages - 1;

            if (isLastPage && isPageSolved) {
                nextBtn.disabled = true;
                setTimeout(showFinalPopup, 800);
            } else if (isPageSolved && !isLastPage) {
                nextBtn.disabled = false;
            } else {
                nextBtn.disabled = true;
            }
        }

        // ===========================================
        // SELECT OPTION
        // ===========================================
        function selectOption(pageIdx, qIdx, selected, correct) {
            const globalIdx = pageIdx * questionsPerPage + qIdx;
            const answerBox = document.getElementById(`answer-${globalIdx}`);
            if (!answerBox) return;

            if (solvedAnswers[pageIdx] && solvedAnswers[pageIdx][qIdx] !== undefined) return;

            if (selected === correct) {
                answerBox.textContent = correct;
                answerBox.classList.remove("wrong");
                answerBox.classList.add("correct");

                if (!solvedAnswers[pageIdx]) solvedAnswers[pageIdx] = {};
                solvedAnswers[pageIdx][qIdx] = correct;

                // Change image to plural version
                const img = document.getElementById(`qimg-${globalIdx}`);
                if (img) {
                    const q = questionsData[globalIdx];
                    img.src = q.imagePlural;
                    img.classList.add("revealed");
                }

                // Find and mark the correct option, disable all options
                const optsContainer = document.getElementById(`opts-${globalIdx}`);
                if (optsContainer) {
                    const options = optsContainer.querySelectorAll('.option');
                    options.forEach(opt => {
                        opt.classList.add('disabled');
                        if (opt.querySelector('span').textContent === correct) {
                            opt.classList.add('correct');
                        }
                    });
                }

                showPopup(true);

                // update Prev/Next state without re-rendering
                const startIdx = pageIdx * questionsPerPage;
                const endIdx = Math.min(startIdx + questionsPerPage, totalQuestions);
                const isPageSolved = Object.keys(solvedAnswers[pageIdx]).length === (endIdx - startIdx);
                const isLastPage = pageIdx === totalPages - 1;

                if (isLastPage && isPageSolved) {
                    nextBtn.disabled = true;
                    setTimeout(showFinalPopup, 800);
                } else if (isPageSolved && !isLastPage) {
                    nextBtn.disabled = false;
                }
            } else {
                // Wrong answer - show in answer box and highlight wrong option
                answerBox.textContent = selected;
                answerBox.classList.remove("correct");
                answerBox.classList.add("wrong");
                
                // Highlight the wrong option
                const optsContainer = document.getElementById(`opts-${globalIdx}`);
                if (optsContainer) {
                    const options = optsContainer.querySelectorAll('.option');
                    options.forEach(opt => {
                        if (opt.querySelector('span').textContent === selected) {
                            opt.classList.add('wrong-option');
                            setTimeout(() => {
                                opt.classList.remove('wrong-option');
                            }, 700);
                        }
                    });
                }
                
                showPopup(false);
                setTimeout(() => {
                    answerBox.textContent = "?";
                    answerBox.classList.remove("wrong");
                }, 700);
            }
        }

        // ===========================================
        // NAVIGATION - MCQ Style
        // ===========================================
        prevBtn.onclick = () => {
            if (currentPage > 0) {
                currentPage--;
                loadPage(currentPage);
                window.scrollTo(0, 0);
            }
        };

        nextBtn.onclick = () => {
            if (currentPage < totalPages - 1) {
                currentPage++;
                loadPage(currentPage);
                window.scrollTo(0, 0);
            }
        };

        // ===========================================
        // RESET
        // ===========================================
        playAgainBtn.onclick = () => {
            solvedAnswers = {};
            currentPage = 0;
            finalPopup.style.display = "none";
            popup.style.display = "none";
              prevBtn.disabled = true;   // First page, so Prev stays disabled
    nextBtn.disabled = true; 
            loadPage(0);
            // speak("Game reset! Match the plural forms.");
        };

        // ===========================================
        // INIT
        // ===========================================
        loadPage(0);
        // speak("Write the plural forms of the following words.");
    </script>
</body>

</html>
