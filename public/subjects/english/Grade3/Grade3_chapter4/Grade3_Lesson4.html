<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Assessments</title>

  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('./assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
          font-family: 'CCSYBold';
        }
    :root {
      --canopy-deep: #0b3230;
      --canopy-mid: #155e56;
      --canopy-glow: #2c9c85;
      --parchment: #fff8e9;
      --parchment-soft: #fdeecb;
      --mango: #ff9f1c;
      --mango-deep: #d97e0a;
      --lime: #9fd93f;
      --lime-deep: #6ea621;
      --papaya: #ff6b5e;
      --papaya-deep: #d9483d;
      --ink: #16302b;
      --ink-soft: #3d5c53;
      --vine: #2e7d6b;
      --gold-line: #f0c14b;
    }

  

    body {
      height: 100vh;
      overflow: hidden;
      background: url("assets/images/bg.jpg");
      background-size: 100% 100%;
      position: relative;
    }

    /* Dot pattern overlay on body */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: 
        radial-gradient(circle at 6px 6px, rgba(46, 125, 107, 0.12) 1.4px, transparent 1.4px);
      background-size: 18px 18px;
    }

    .app {
      height: 100vh;
      display: flex;
background: var(--parchment);
   background-image: 
        radial-gradient(circle at 6px 6px, rgba(46, 125, 107, 0.08) 1.4px, transparent 1.4px);
      background-size: 18px 18px;
      position: relative;
      z-index: 1;
    }

    .sidebar {
      width: 300px;
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      background: var(--parchment);
      /* border-right: 4px solid var(--vine); */
      /* box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1); */
      background-image: 
        radial-gradient(circle at 6px 6px, rgba(46, 125, 107, 0.08) 1.4px, transparent 1.4px);
      background-size: 18px 18px;
    }

    /* OPTION BUTTON */
    .island-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 400;
      cursor: pointer;
      background: rgba(255, 248, 233, 0.7);
      backdrop-filter: blur(10px);
      color: var(--ink);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      transition: 0.3s;
      border: 2.5px solid transparent;
    }

    .option-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: white;
      transition: 0.3s;
    }

    .island-btn.active .option-check {
      background: var(--lime-deep);
      border-color: var(--lime-deep);
      color: white;
    }

    .island-btn.active .option-check::after {
      content: "✔";
    }

    .island-btn:hover {
      transform: scale(1.03);
      border-color: var(--mango);
    }

    .option-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-left i {
      font-size: 20px;
      width: 28px;
      text-align: center;
      color: var(--vine);
    }

    /* ACTIVE */
    .island-btn.active {
      color: var(--ink);
      box-shadow: 0 12px 22px rgba(0, 0, 0, .2), 0 0 0 3px var(--gold-line);
      border-color: var(--gold-line);
    }

    /* Color themes for each button */
    .o1.active { background: #fcb9c1; }
    .o2.active { background: #ffeaab; }
    .o3.active { background: #c1ffa9; }
    .o4.active { background: #a7ebf7ef; }
    .o5.active { background: #d4b8ff; }
    .o6.active { background: #ffb3b3; }
    .o7.active { background: #b3d9ff; }

    .main {
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    /* MOBILE */
    .menu-btn {
      display: none;
    }
    .offcanvas {
      display: none;
    }

    @media(max-width:1065px) {
      .app {
        flex-direction: column;
      }
      .sidebar {
        display: none;
      }
      .menu-btn {
        display: block;
        position: fixed;
        top: 8px;
        right: 15px;
        font-size: 26px;
        background: var(--mango);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 6px 12px;
        cursor: pointer;
        z-index: 5000;
        box-shadow: 0 4px 0 var(--mango-deep);
      }
      .menu-btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 var(--mango-deep);
      }
      .offcanvas {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .45);
        display: none;
        z-index: 4000;
      }
      .offcanvas.show {
        display: block;
      }
      .offcanvas-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: 300px;
        height: 100%;
        background: var(--parchment);
        padding: 0px;
        padding-top: 0px;
        transform: translateX(100%);
        transition: .3s;
        overflow-y: hidden;
        background-image: 
          radial-gradient(circle at 6px 6px, rgba(46, 125, 107, 0.08) 1.4px, transparent 1.4px);
        background-size: 18px 18px;
      }
      .offcanvas.show .offcanvas-panel {
        transform: translateX(0);
        padding: 65px 20px 20px;
      }
      .offcanvas-panel .island-btn {
        margin-bottom: 10px;
      }
    }

    /* Responsive scaling for smaller heights */
    @media (min-width: 900px) and (max-height: 800px) {
      .app { transform: scaleY(0.95); transform-origin: top center; height: calc(100vh / 0.95); }
    }
    @media (min-width: 900px) and (max-height: 700px) {
      .app { transform: scaleY(0.9); transform-origin: top center; height: calc(100vh / 0.9); }
    }
    @media (min-width: 900px) and (max-height: 600px) {
      .app { transform: scaleY(0.85); transform-origin: top center; height: calc(100vh / 0.85); }
    }
    @media (min-width: 900px) and (max-height: 500px) {
      .app { transform: scaleY(0.8); transform-origin: top center; height: calc(100vh / 0.8); }
    }

    /* ============================= */
    /* Desktop / Monitor (1025–1440) */
    /* ============================= */
    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .sidebar { width: 320px; padding: 20px 22px; gap: 25px; }
      .island-btn { font-size: 18px; height: 65px; padding: 14px 20px; }
      .option-left i { font-size: 22px; }
      .option-check { width: 32px; height: 32px; font-size: 16px; }
    }

    /* ============================= */
    /* Large Monitors (1441–1920) */
    /* ============================= */
    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .sidebar { width: 360px; padding: 25px 20px; gap: 12px; }
      .island-btn { font-size: 20px; height: 72px; padding: 16px 24px; border-radius: 18px; }
      .option-left { gap: 16px; }
      .option-left i { font-size: 26px; }
      .option-check { width: 36px; height: 36px; font-size: 18px; }
    }

    /* ============================= */
    /* Extra Large Screens / 4K */
    /* ============================= */
    @media screen and (min-width: 1921px) {
      .sidebar { width: 420px; padding: 30px 25px; gap: 16px; }
      .island-btn { font-size: 24px; height: 82px; padding: 18px 28px; border-radius: 22px; }
      .option-left { gap: 20px; }
      .option-left i { font-size: 32px; }
      .option-check { width: 42px; height: 42px; font-size: 20px; }
      iframe { border-radius: 14px; }
    }
  </style>
</head>

<body>

  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <div class="app">

    <div class="sidebar">

      <div class="island-btn o4 active" onclick="openIsland(0)">
        <div class="option-left">
          <i class="fa-solid fa-pen-to-square"></i>
          <div>Fill In The Blanks</div>
        </div>
        <div class="option-check"></div>
      </div>

      <div class="island-btn o1" onclick="openIsland(1)">
        <div class="option-left">
          <i class="fa-solid fa-list-check"></i>
          <div>Choose Option</div>
        </div>
        <div class="option-check"></div>
      </div>

      <div class="island-btn o5" onclick="openIsland(2)">
        <div class="option-left">
          <i class="fa-solid fa-arrows-left-right"></i>
          <div>Matching</div>
        </div>
        <div class="option-check"></div>
      </div>

      <div class="island-btn o6" onclick="openIsland(3)">
        <div class="option-left">
          <i class="fa-solid fa-book-open"></i>
          <div>Synonyms</div>
        </div>
        <div class="option-check"></div>
      </div>

      <div class="island-btn o7" onclick="openIsland(4)">
        <div class="option-left">
          <i class="fa-solid fa-book"></i>
          <div>Antonyms</div>
        </div>
        <div class="option-check"></div>
      </div>

      <div class="island-btn o2" onclick="openIsland(5)">
        <div class="option-left">
          <i class="fa-solid fa-check-double"></i>
          <div>Singular-Plural</div>
        </div>
        <div class="option-check"></div>
      </div>

      <div class="island-btn o3" onclick="openIsland(6)">
        <div class="option-left">
          <i class="fa-solid fa-shuffle"></i>
          <div>Verb Forms</div>
        </div>
        <div class="option-check"></div>
      </div>

    </div>

    <div class="main">
      <iframe id="contentFrame" src="./exercises/ftb1.html"></iframe>
    </div>

  </div>

  <!-- MOBILE OFF-CANVAS -->
  <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">
    <div class="offcanvas-panel" onclick="event.stopPropagation()">

      <div class="island-btn o4 active" onclick="mobileOpen(0)">
        <div class="option-left">
          <i class="fa-solid fa-pen-to-square"></i>
          <div>Fill In The Blanks</div>
        </div>
        <div class="option-check"></div>
      </div>

      <div class="island-btn o1" onclick="mobileOpen(1)">
        <div class="option-left">
          <i class="fa-solid fa-list-check"></i>
          <div>Choose Option</div>
        </div>
        <div class="option-check"></div>
      </div>

      <div class="island-btn o5" onclick="mobileOpen(2)">
        <div class="option-left">
          <i class="fa-solid fa-arrows-left-right"></i>
          <div>Matching</div>
        </div>
        <div class="option-check"></div>
      </div>

      <div class="island-btn o6" onclick="mobileOpen(3)">
        <div class="option-left">
          <i class="fa-solid fa-book-open"></i>
          <div>Synonyms</div>
        </div>
        <div class="option-check"></div>
      </div>

      <div class="island-btn o7" onclick="mobileOpen(4)">
        <div class="option-left">
          <i class="fa-solid fa-book"></i>
          <div>Antonyms</div>
        </div>
        <div class="option-check"></div>
      </div>

      <div class="island-btn o2" onclick="mobileOpen(5)">
        <div class="option-left">
          <i class="fa-solid fa-check-double"></i>
          <div>Singular-Plural</div>
        </div>
        <div class="option-check"></div>
      </div>

      <div class="island-btn o3" onclick="mobileOpen(6)">
        <div class="option-left">
          <i class="fa-solid fa-shuffle"></i>
          <div>Verb Forms</div>
        </div>
        <div class="option-check"></div>
      </div>

    </div>
  </div>

  <script>
    const sidebarButtons = document.querySelectorAll(".sidebar .island-btn");
    const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");
    const frame = document.getElementById("contentFrame");

    const pages = [
      "./exercises/ftb1.html",
      "./exercises/mcq.html",
      "./exercises/matching.html",
      "./exercises/synonyms.html",
      "./exercises/antonyms.html",
      "./exercises/plural.html",
      "./exercises/verb.html",
    ];

    function openIsland(index) {
      sidebarButtons.forEach(btn => btn.classList.remove("active"));
      sidebarButtons[index].classList.add("active");

      mobileButtons.forEach(btn => btn.classList.remove("active"));
      mobileButtons[index].classList.add("active");

      frame.src = pages[index];
    }

    function toggleMenu() {
      if (window.innerWidth > 1065) return;
      document.getElementById("offcanvas").classList.toggle("show");
    }

    function mobileOpen(i) {
      openIsland(i);
      toggleMenu();
    }
  </script>

</body>

</html>
