<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Plant Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .quiz-container {
            width: 900px;
            padding: 25px;
            border-radius: 30px;
            text-align: center;
        }

        .question-section {
            margin: 10px 0;
        }

        .question-title {
            font-size: 30px;
            color: #2f4f4f;
            font-weight: 400;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            text-align: start;
            margin-bottom: 1%;
        }

        #questionImage {
            width: 230px;
            height: 150px;
            object-fit: contain;

        }

        .answer-slots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 0;
        }

        .answer-slot {
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, #ffffff, #e6f7f7);
            border: 2px solid transparent;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: #2f4f4f;
            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.08),
                inset 0 2px 4px rgba(255, 255, 255, 0.6);
            transition: all 0.25s ease;
        }

        .answer-slot.correct {
            background-color: #a7f3d0;
            border: 2px solid #10b981;
            color: #065f46;
            box-shadow:
                0 6px 12px rgba(16, 185, 129, 0.25),
                inset 0 2px 6px rgba(255, 255, 255, 0.7);
        }

        .answer-gap {
            width: 15px;
        }

        .letter-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }

        .letter-tile {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #2f4f4f;
            background: linear-gradient(145deg, #8affc4, #a3ffd3);
            box-shadow:
                0 6px 0 #deffef,
                0 10px 18px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .letter-tile:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow:
                0 10px 0 #deffef,
                0 18px 25px rgba(0, 0, 0, 0.25);
            background: linear-gradient(145deg, #77ffbb, #6ffdb8);
            color: #0f172a;
        }

        .letter-tile:active {
            transform: translateY(2px);
            box-shadow:
                0 3px 0 #0284c7,
                0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .letter-tile.used {
            opacity: 0.3;
            transform: scale(0.95);
            box-shadow: none;
        }

        #submitButton {
            margin-top: 15px;
            border-radius: 30px;
            background: #2cca68;
            border: none;
            padding: 13px 30px;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: 400;
            cursor: pointer;
            border: 3px solid #fff;
            cursor: pointer;
        }

        #submitButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .quiz-navigation {
            display: flex;
            justify-content: space-between;
        }

        .quiz-navigation button {
            width: 150px;
            padding: 13px 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;

            border-radius: 35px;
            /* border: 3px solid #ffffff; */
 border:none;
            font-size: 20px;
            font-weight: 400;
            color: #ffffff;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #previousButton {
            background: #7fc0eb;
        }

        #nextButton {
            background: #ecc74e;
        }

        #previousButton:active {
            background: #6bb4e4;
        }

        #nextButton:active {
            background: #e6be3d;
        }

        .quiz-navigation button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* POPUP */

      .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            /* background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px); */
            padding: 20px;
        }

        .kid-card {
            background: #ffffff;
            width: 380px;
            max-width: 95%;
            padding: 32px 28px;
            border-radius: 44px;
            text-align: center;
            animation: kidPop 0.6s ease;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Decorative circles */
        .kid-card::before,
        .kid-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .kid-card::before {
            width: 200px;
            height: 200px;
            top: -80px;
            right: -60px;
            background: #ffd93d;
        }

        .kid-card::after {
            width: 150px;
            height: 150px;
            bottom: -60px;
            left: -50px;
            background: #6bcbff;
        }

        .kid-card>* {
            position: relative;
            z-index: 2;
        }

        .kid-icon {
            font-size: 4.8em;
            margin-bottom: 6px;
            animation: emojiBounce 0.9s infinite alternate;
            display: inline-block;
        }

        .kid-card h3 {
            font-size: 2.2em;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .kid-card p {
            font-size: 1.1em;
            color: #555;
            margin-top: 2px;
            font-weight: 500;
        }

        /* Correct Popup */
        .kid-correct .kid-card {
            background: linear-gradient(145deg, #f0fff4, #d4f5e6);
            border: 5px solid #38d9a9;
        }

        .kid-correct .kid-card h3 {
            color: #0b8a4a;
        }

        .kid-correct .kid-card p {
            color: #1a6a3a;
        }

        .kid-correct .kid-card::before {
            background: #38d9a9;
        }

        .kid-correct .kid-card::after {
            background: #38d9a9;
        }

        /* Wrong Popup */
        .kid-wrong .kid-card {
            background: linear-gradient(145deg, #fff5f5, #fce4e4);
            border: 5px solid #ff8a8a;
        }

        .kid-wrong .kid-card h3 {
            color: #c0392b;
        }

        .kid-wrong .kid-card p {
            color: #922b21;
        }

        .kid-wrong .kid-card::before {
            background: #ff8a8a;
        }

        .kid-wrong .kid-card::after {
            background: #ff8a8a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0) scale(1);
            }
            to {
                transform: translateY(-12px) scale(1.05);
            }
        }

        /* FINAL POPUP */

        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            /* background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px); */
            padding: 20px;
        }

        .final-kid-box {
            background: linear-gradient(145deg, #fff7d6, #e6fff5);
            padding: 35px 40px;
            border-radius: 44px;
            text-align: center;
            width: 480px;
            max-width: 95%;
            animation: finalBounce .8s ease;
            /* box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2); */
            border: 4px solid rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .final-kid-box::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            top: -120px;
            right: -100px;
            background: #ffd93d;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .final-kid-box>* {
            position: relative;
            z-index: 2;
        }

        .final-kid-box h2 {
            font-size: 2.4em;
            color: #2f9e44;
            margin-bottom: 8px;
        
            font-weight: 700 !important;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
            color: #2d3a3a;
        }

        #stars {
            font-size: 2.6em;
            margin: 14px 0;
            letter-spacing: 6px;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
            letter-spacing: 0.5px;
        }

        .playAgain-btn:hover {
            transform: translateY(-3px);
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #d4871f;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3) perspective(400px) rotateX(15deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.08) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        /* ============================
           RESPONSIVE MEDIA QUERIES
        ============================ */

        @media (max-width:900px) {

            body {
                align-items: center;
                padding: 20px;
                overflow: auto;
            }

            .quiz-container {
                width: 100%;
                max-width: 900px;
                padding: 25px;
            }

            .question-title {
                font-size: 30px;
                height: auto;
                padding: 10px;
                text-align: center;
            }

            #questionImage {
                width: 200px;
                height: 150px;
            }

            .answer-slots {
                gap: 10px;
            }

            .answer-slot {
                width: 55px;
                height: 55px;
                font-size: 24px;
            }

            .letter-tile {
                width: 70px;
                height: 50px;
                font-size: 20px;
            }

            .quiz-navigation {
                margin-top: 25px;
            }

            .final-kid-box {
                width: 90%;
                max-width: 340px;
                padding: 22px;
            }

            .final-kid-box h2 {
                font-size: 1.8em;
            }

            .final-kid-box p {
                font-size: 1.1em;
            }

            #stars {
                font-size: 1.8em;
            }

        }

        @media (max-width:768px) {

            .quiz-container {
                padding: 20px;
            }

            .question-title {
                font-size: 30px;
            }

            #questionImage {
                width: 180px;
                height: 140px;
            }

            .answer-slots {
                gap: 8px;
            }

            .answer-slot {
                width: 50px;
                height: 50px;
                font-size: 22px;
            }

            .letter-container {
                gap: 10px;
            }

            .letter-tile {
                width: 65px;
                height: 48px;
                font-size: 18px;
            }

            .quiz-navigation button {
                padding: 6px 20px;
                font-size: 18px;
            }

        }

        @media (max-width:480px) {

            body {
                padding: 30px 0 10px;
                align-items: flex-start;
            }

            .quiz-container {
                padding: 20px 5px;
            }

            .question-title {
                font-size: 20px;
            }

            #questionImage {
                width: 150px;
                height: 100px;
            }

            .answer-gap {
                width: 10px;
            }

            .answer-slots {
                flex-wrap: wrap;
                gap: 5px;
            }

            .answer-slot {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .letter-container {
                gap: 5px;
            }

            .letter-tile {
                width: 50px;
                height: 35px;
                font-size: 17px;
            }

            #submitButton {
                padding: 8px 25px;
            }

            .quiz-navigation {
                margin-top: 10px;
            }

            .kid-card {
                width: 260px;
                padding: 15px;
            }

            .kid-icon {
                font-size: 3em;
            }

            .kid-card h3 {
                font-size: 1.5em;
            }

            .final-kid-box {
                width: 90%;
                max-width: 300px;
                padding: 20px;
            }

            .final-kid-box h2 {
                font-size: 1.5em;
            }

            .final-kid-box p {
                font-size: 1em;
            }

            #stars {
                font-size: 1.6em;
            }

            .playAgain-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }

        /* ========================================
           💻 Desktop / Monitor (1025px – 1440px)
        ======================================== */
        @media screen and (min-width: 1325px) and (max-width: 1440px) {

            .quiz-container {
                width: 1000px;
            }

            .question-title {
                font-size: 30px;
            }

            #questionImage {
                width: 260px;
                height: 150px;
            }

            .answer-slot {
                width: 55px;
                height: 55px;
                font-size: 28px;
            }

            .letter-tile {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            #submitButton {
                font-size: 20px;
                padding: 12px 30px;
            }

            .quiz-navigation button {
                font-size: 20px;
                padding: 14px 36px;
            }

        }


        /* ========================================
           🖥️ Large Monitors (1441px – 1920px)
        ======================================== */
        @media screen and (min-width: 1541px) and (max-width: 1920px) {

            .quiz-container {
                width: 1100px;
            }

            .question-title {
                font-size: 40px;
            }

            #questionImage {
                width: 300px;
                height: 200px;
            }

            .answer-slot {
                width: 70px;
                height: 70px;
                font-size: 30px;
            }

            .letter-tile {
                width: 90px;
                height: 65px;
                font-size: 26px;
            }

            #submitButton {
                font-size: 22px;
                padding: 16px 46px;
            }

            .quiz-navigation button {
                font-size: 22px;
                padding: 15px 40px;
            }

        }


        /* ========================================
           📺 Extra Large Screens / 4K (1921px+)
        ======================================== */
        @media screen and (min-width: 1921px) {

            .quiz-container {
                width: 1200px;
            }

            .question-title {
                font-size: 40px;
            }

            #questionImage {
                width: 340px;
                height: 230px;
            }

            .answer-slot {
                width: 75px;
                height: 75px;
                font-size: 32px;
            }

            .letter-tile {
                width: 100px;
                height: 70px;
                font-size: 28px;
            }

            #submitButton {
                font-size: 24px;
                padding: 18px 50px;
            }

            .quiz-navigation button {
                font-size: 24px;
                padding: 16px 44px;
            }

        }
    </style>
</head>

<body>
    <div class="quiz-container">

        <div class="question-section">
            <div id="questionTitle" class="question-title"></div>
            <img id="questionImage" />
        </div>

        <div id="answerSlots" class="answer-slots"></div>

        <div id="letterContainer" class="letter-container"></div>

        <button id="submitButton">Submit</button>

        <div class="quiz-navigation">
            <button id="previousButton"><i class="fa-solid fa-angles-left"></i> Prev</button>
            <button id="nextButton">Next <i class="fa-solid fa-angles-right"></i></button>
        </div>

    </div>


    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        const quizData = [{
            q: "Q1. Reynard found a broken bucket near the ________ plants.",
            a: "CABBAGE",
            img: "../assets/images/ft1.png",
        }, {
            q: "Q2. A rooster is the name of a ________.",
            a: "COCK",
            img: "../assets/images/happy1.png",
        }, {
            q: 'Q3. Reynard said, "I am not your enemy. I am your ________."',
            a: "COUSIN",
            img: "../assets/images/ft3.png",
        }, {
            q: "Q4. People started throwing ________ at the fox.",
            a: "STONES",
            img: "../assets/images/ft4.png",
        }, {
            q: "Q5. The rooster flew up and sat on an ________ tree.",
            a: "APPLE",
            img: "../assets/images/ft5.png",
        }, ];
    

        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        let currentQuestionIndex = 0;
        let quizScore = 0;

        const answeredQuestions = Array(quizData.length).fill(false);
        const storedAnswers = Array(quizData.length).fill("");

        const questionTitle = document.getElementById("questionTitle");
        const questionImage = document.getElementById("questionImage");

        const nextButton = document.getElementById("nextButton");
        const previousButton = document.getElementById("previousButton");
        const submitButton = document.getElementById("submitButton");

        const answerSlotsContainer = document.getElementById("answerSlots");
        const letterContainer = document.getElementById("letterContainer");

        let correctAnswer = "";
        let letterTiles = [];



        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 200, spread: 110, origin: { y: 0.5 } });
            setTimeout(() => {
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.2 } });
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.8 } });
            }, 150);
        }

        function shuffleLetters(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function createAnswerSlots(word) {
            answerSlotsContainer.innerHTML = "";

            for (let i = 0; i < word.length; i++) {
                if (word[i] === " ") {
                    // create gap
                    const gap = document.createElement("div");
                    gap.className = "answer-gap";
                    answerSlotsContainer.appendChild(gap);
                } else {
                    const slot = document.createElement("div");
                    slot.className = "answer-slot";
                    slot.dataset.index = i;
                    slot.onclick = () => removeLetterFromSlot(slot);
                    answerSlotsContainer.appendChild(slot);
                }
            }
        }

        function removeLetterFromSlot(slot) {
            if (slot.classList.contains("locked")) return;
            const letter = slot.textContent;
            if (!letter) return;
            slot.textContent = "";
            const tile = letterTiles.find(
                (t) => t.textContent === letter && t.classList.contains("used"),
            );

            if (tile) {
                tile.classList.remove("used");
                tile.onclick = () => insertLetterIntoSlot(tile, letter);
            }

            submitButton.disabled = true;
        }

        function generateLetterTiles(answer) {
            letterContainer.innerHTML = "";
            letterTiles = [];

            let letters = answer.replace(/\s/g, "").split(""); // remove spaces
            shuffleLetters(letters);

            letters.forEach((letter) => {
                const tile = document.createElement("div");

                tile.className = "letter-tile";
                tile.textContent = letter;

                tile.onclick = () => insertLetterIntoSlot(tile, letter);

                letterContainer.appendChild(tile);
                letterTiles.push(tile);
            });
        }

        function insertLetterIntoSlot(tile, letter) {
            const slots = document.querySelectorAll(".answer-slot");

            const empty = [...slots].find((s) => !s.textContent);

            if (!empty) return;

            empty.textContent = letter;

            tile.classList.add("used");
            tile.onclick = null;

            validateSlotCompletion();
        }

        function validateSlotCompletion() {
            const slots = document.querySelectorAll(".answer-slot");

            let word = [...slots].map((s) => s.textContent).join("");

            if (word.length === correctAnswer.replace(/\s/g, "").length) {
                submitButton.disabled = false;
            }
        }

        function removeLastFilledSlot() {
                // Don't allow removing letters after the answer is correct
    if (answeredQuestions[currentQuestionIndex]) return;
            const slots = document.querySelectorAll(".answer-slot");

            const filled = [...slots].filter((s) => s.textContent);

            if (filled.length === 0) return;

            const last = filled[filled.length - 1];

            const letter = last.textContent;

            last.textContent = "";

            const tile = letterTiles.find(
                (t) => t.textContent === letter && t.classList.contains("used"),
            );

            if (tile) {
                tile.classList.remove("used");
                tile.onclick = () => insertLetterIntoSlot(tile, letter);
            }

            submitButton.disabled = true;
        }

        function showPopup(isCorrect) {
            const popup = document.getElementById("answerPopup");
            const icon = document.getElementById("popupIcon");
            const title = document.getElementById("popupTitle");
            const msg = document.getElementById("popupMsg");

            popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
            popup.style.display = "flex";

                if (isCorrect) {
                icon.textContent = "🌟";
                title.textContent = "Amazing!";
                msg.textContent = "You got it right! ✨";
            } else {
                icon.textContent = "😒";
                title.textContent = "Keep Going!";
                msg.textContent = "Try again, you can do it! 🌈";
            }

            setTimeout(() => {
                popup.style.display = "none";
            }, 1400);
        }

        function showFinal() {
            const popup = document.getElementById("finalPopup");
            document.getElementById("finalScore").textContent =
                `Your Score: ${quizScore} / ${quizData.length}`;
            document.getElementById("stars").textContent = "⭐".repeat(quizScore);
            popup.style.display = "flex";
            bigConfetti();
        }

        function renderQuestion() {
            const question = quizData[currentQuestionIndex];

            questionTitle.textContent = question.q;
            questionImage.src = question.img;

            correctAnswer = question.a.toUpperCase();

            createAnswerSlots(correctAnswer);

            if (answeredQuestions[currentQuestionIndex]) {
                const slots = document.querySelectorAll(".answer-slot");
                const saved = storedAnswers[currentQuestionIndex].split("");

                saved.forEach((letter, i) => {
                    slots[i].textContent = letter;
                    slots[i].classList.add("locked");
                    slots[i].classList.add("correct"); // restore green color
                    slots[i].onclick = null; // prevent removing letters
                });
                generateLetterTiles(correctAnswer);

                letterTiles.forEach((tile) => {
                    tile.classList.add("used");
                    tile.onclick = null;
                });

                submitButton.disabled = true;
                nextButton.disabled = false;
            } else {
                generateLetterTiles(correctAnswer);
                submitButton.disabled = true;
                nextButton.disabled = true;
            }

            previousButton.disabled = currentQuestionIndex === 0;
        }

        submitButton.onclick = () => {
            const slots = document.querySelectorAll(".answer-slot");

            let guess = [...slots].map((s) => s.textContent).join("");

            if (guess === correctAnswer.replace(/\s/g, "")) {
                quizScore++;

                showPopup(true);
                smallConfetti();
                  speak("Correct");

                answeredQuestions[currentQuestionIndex] = true;
                storedAnswers[currentQuestionIndex] = guess;

                slots.forEach((s) => {
                    s.classList.add("locked");
                    s.classList.add("correct");
                    s.onclick = null; // prevents removing letters
                });

                submitButton.disabled = true;
                nextButton.disabled = false;

                if (currentQuestionIndex === quizData.length - 1) {
                    setTimeout(showFinal, 1600);
                }
            } else {
                showPopup(false);
                speak("Try again");

                setTimeout(() => {
                    slots.forEach((s) => (s.textContent = ""));
                    letterTiles.forEach((tile) => {
                        tile.classList.remove("used");
                        tile.onclick = () => insertLetterIntoSlot(tile, tile.textContent);
                    });
                    submitButton.disabled = true;
                }, 800);
            }
        };

        nextButton.onclick = () => {
            currentQuestionIndex++;
            renderQuestion();
        };

        previousButton.onclick = () => {
            currentQuestionIndex--;
            renderQuestion();
        };

        document.addEventListener("keydown", (e) => {
               // Ignore Backspace/Delete after the question is solved
    if (answeredQuestions[currentQuestionIndex]) return;
            if (e.key === "Backspace" || e.key === "Delete") {
                removeLastFilledSlot();
            }
        });

        renderQuestion();
    </script>
</body>

</html>
