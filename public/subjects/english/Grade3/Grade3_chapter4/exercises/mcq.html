<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MCQ Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
     @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }
       

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
          
        }

        .quiz {
            width: 95%;
            max-width: 1100px;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 10px;
        }

        #question {
            font-size: 30px;
            font-weight: 400;
            color: #2f4f4f;
            line-height: 1.4;
            padding: 10px 20px;
            border-radius: 20px;
            width: 100%;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: start;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            /* margin-top: 10px; */
        }

        .option {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 18px;
            gap: 10px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            /* background: #ffffff;
            border: 3px solid #e6ecf2; */
            /* box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06); */
            transition: all 0.3s ease;
            min-height: 140px;
        }

        .option img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            display: block;
            transition: transform 0.3s ease;
        }

        .option:hover img {
            transform: scale(1.05);
        }

        .option .option-text {
            font-size: 24px;
            font-weight: 400;
            color: #2f4f4f;
            text-align: center;
            
        }

        .option:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            border-color: #b0c4de;
        }

        /* .option.o1 {
            border-left: 6px solid #ffd43b;
        }

        .option.o2 {
            border-left: 6px solid #4dabf7;
        }

        .option.o3 {
            border-left: 6px solid #0accbc;
        }

        .option.o4 {
            border-left: 6px solid #ffa94d;
        } */

        .option.correct {
            background: #ebfbee;
            border-color: #40c057;
            box-shadow: 0 10px 30px rgba(64, 192, 87, 0.25);
            transform: scale(1.02);
        }

        .option.correct::after {
            content: "✓";
            position: absolute;
            top: 8px;
            right: 14px;
            color: #2f9e44;
            font-size: 28px;
            font-weight: 700;
        }

        .option.wrong {
            background: #fff5f5;
            border-color: #fa5252;
            animation: shake 0.4s;
        }

        .option.wrong::after {
            content: "✕";
            position: absolute;
            top: 8px;
            right: 14px;
            color: #e03131;
            font-size: 28px;
            font-weight: 700;
        }

        .option.disabled {
            opacity: 0.4;
            box-shadow: none;
            pointer-events: none;
            transform: scale(0.98);
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            50% {
                transform: translateX(6px);
            }
            75% {
                transform: translateX(-4px);
            }
            100% {
                transform: translateX(0);
            }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }

        .controls button {
            width: 150px;
            padding: 13px 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            border-radius: 40px;
            /* border: 3px solid #ffffff; */
            border:none;
            font-size: 20px;
            font-weight: 400;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .controls button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .controls button:active:not(:disabled) {
            transform: translateY(0px);
        }

        .prev {
            background: linear-gradient(135deg, #7fc0eb, #5ba3d9);
        }

        .next {
            background: linear-gradient(135deg, #ecc74e, #e0b83a);
        }

        .controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* POPUPS */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }

        .kid-card {
            background: #ffffff;
            width: 380px;
            max-width: 95%;
            padding: 32px 28px;
            border-radius: 44px;
            text-align: center;
            animation: kidPop 0.6s ease;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .kid-card::before,
        .kid-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .kid-card::before {
            width: 200px;
            height: 200px;
            top: -80px;
            right: -60px;
            background: #ffd93d;
        }

        .kid-card::after {
            width: 150px;
            height: 150px;
            bottom: -60px;
            left: -50px;
            background: #6bcbff;
        }

        .kid-card>* {
            position: relative;
            z-index: 2;
        }

        .kid-icon {
            font-size: 4.8em;
            margin-bottom: 6px;
            animation: emojiBounce 0.9s infinite alternate;
            display: inline-block;
        }

        .kid-card h3 {
            font-size: 2.2em;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .kid-card p {
            font-size: 1.1em;
            color: #555;
            margin-top: 2px;
            font-weight: 500;
        }

        .kid-correct .kid-card {
            background: linear-gradient(145deg, #f0fff4, #d4f5e6);
            border: 5px solid #38d9a9;
        }

        .kid-correct .kid-card h3 {
            color: #0b8a4a;
        }

        .kid-correct .kid-card p {
            color: #1a6a3a;
        }

        .kid-correct .kid-card::before {
            background: #38d9a9;
        }

        .kid-correct .kid-card::after {
            background: #38d9a9;
        }

        .kid-wrong .kid-card {
            background: linear-gradient(145deg, #fff5f5, #fce4e4);
            border: 5px solid #ff8a8a;
        }

        .kid-wrong .kid-card h3 {
            color: #c0392b;
        }

        .kid-wrong .kid-card p {
            color: #922b21;
        }

        .kid-wrong .kid-card::before {
            background: #ff8a8a;
        }

        .kid-wrong .kid-card::after {
            background: #ff8a8a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0) scale(1);
            }
            to {
                transform: translateY(-12px) scale(1.05);
            }
        }

        /* FINAL POPUP */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            padding: 20px;
        }

        .final-kid-box {
            background: linear-gradient(145deg, #fff7d6, #e6fff5);
            padding: 35px 40px;
            border-radius: 44px;
            text-align: center;
            width: 480px;
            max-width: 95%;
            animation: finalBounce .8s ease;
            border: 4px solid rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .final-kid-box::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            top: -120px;
            right: -100px;
            background: #ffd93d;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .final-kid-box>* {
            position: relative;
            z-index: 2;
        }

        .final-kid-box h2 {
            font-size: 2.4em;
            color: #2f9e44;
            margin-bottom: 8px;
        
            font-weight: 700 !important;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
            color: #2d3a3a;
        }

        #stars {
            font-size: 2.6em;
            margin: 14px 0;
            letter-spacing: 6px;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
            letter-spacing: 0.5px;
        }

        .playAgain-btn:hover {
            transform: translateY(-3px);
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #d4871f;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3) perspective(400px) rotateX(15deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.08) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        /* ===================== MEDIA QUERIES ===================== */
        @media (max-width:900px) {
            body {
                align-items: center;
                padding: 20px;
                overflow: auto;
            }
            .quiz {
                width: 100%;
                padding: 20px;
            }
            #question {
                font-size: 30px;
                min-height: 60px;
                padding: 15px;
            }
            .options {
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }
            .option {
                font-size: 16px;
                padding: 15px;
                min-height: 110px;
            }
            .option img {
                width: 60px;
                height: 60px;
            }
            .controls {
                gap: 20px;
            }
            .controls button {
                padding: 10px 28px;
                font-size: 17px;
            }
            .final-kid-box {
                width: 90%;
                max-width: 360px;
                padding: 25px;
            }
            .final-kid-box h2 {
                font-size: 1.8em;
            }
            .kid-card {
                width: 300px;
                padding: 25px;
            }
        }

        @media (max-width:768px) {
            body {
                padding: 15px 0px;
                align-items: flex-start;
                overflow: auto;
            }
            .quiz {
                padding: 15px;
            }
            #question {
                font-size: 30px;
                min-height: 50px;
                padding: 12px;
            }
            .options {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .option {
                font-size: 14px;
                padding: 12px;
                min-height: 90px;
                border-radius: 15px;
            }
            .option img {
                width: 50px;
                height: 50px;
            }
            .option .option-text {
                font-size: 14px;
            }
            .controls button {
                padding: 8px 20px;
                font-size: 15px;
            }
            .controls {
                gap: 15px;
            }
        }

        @media (max-width:480px) {
            .quiz {
                padding: 10px;
                border-radius: 25px;
            }
            #question {
                font-size: 17px;
                min-height: 45px;
                padding: 10px;
                border-radius: 15px;
            }
            .options {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .option {
                font-size: 12px;
                padding: 10px 8px;
                min-height: 75px;
                border-radius: 12px;
                border-width: 2px;
            }
            .option img {
                width: 40px;
                height: 40px;
            }
            .option .option-text {
                font-size: 12px;
            }
            .controls {
                gap: 10px;
                flex-wrap: wrap;
            }
            .controls button {
                padding: 8px 16px;
                font-size: 14px;
                border-radius: 30px;
            }
            .kid-card {
                width: 260px;
                padding: 20px;
                border-radius: 28px;
            }
            .kid-icon {
                font-size: 3.5em;
            }
            .kid-card h3 {
                font-size: 1.6em;
            }
            .final-kid-box {
                width: 92%;
                max-width: 300px;
                padding: 20px 16px;
                border-radius: 30px;
            }
            .final-kid-box h2 {
                font-size: 1.4em;
            }
            .final-kid-box p {
                font-size: 1em;
            }
            #stars {
                font-size: 1.5em;
            }
            .playAgain-btn {
                padding: 10px 24px;
                font-size: 0.95em;
            }
        }

        @media screen and (min-width: 1025px) and (max-width: 1440px) {
            .quiz {
                max-width: 1200px;
                padding: 35px 45px;
            }
            #question {
                font-size: 30px;
                min-height: 90px;
            }
            .option {
                font-size: 20px;
                padding: 22px 20px;
                min-height: 160px;
            }
            .option img {
                width: 120px;
                height: 120px;
            }
            .controls button {
                font-size: 20px;
                padding: 13px 32px;
            }
        }

        @media screen and (min-width: 1441px) and (max-width: 1920px) {
            .quiz {
                max-width: 1400px;
                padding: 40px 50px;
            }
            #question {
                font-size: 40px;
                min-height: 100px;
            }
            .option {
                font-size: 26px;
                padding: 28px 24px;
                min-height: 180px;
                border-radius: 24px;
            }
            .option img {
                width: 170px;
                height: 170px;
            }
            .option-text{
                font-size: 40px;
          
            }
            .option .option-text
            {
                  font-size: 33px;
            }
            .controls button {
                font-size: 22px;
                padding: 15px 40px;
            }
        }

        @media screen and (min-width: 1921px) {
            .quiz {
                max-width: 1600px;
                padding: 45px 60px;
            }
            #question {
                font-size: 44px;
                min-height: 110px;
            }
            .option {
                font-size: 24px;
                padding: 32px 30px;
                min-height: 200px;
                border-radius: 28px;
            }
            .option img {
                width: 130px;
                height: 130px;
            }
            .controls button {
                font-size: 22px;
                padding: 15px 40px;
            }
        }
    </style>
</head>

<body>

    <div class="quiz">

        <div class="header">
            <h2 id="question"></h2>
        </div>

        <div class="options" id="options"></div>

        <div class="controls">
            <button class="prev" id="prevBtn"><i class="fa-solid fa-angles-left"></i> Prev</button>
            <button class="next" id="nextBtn">Next <i class="fa-solid fa-angles-right"></i></button>
        </div>

    </div>

    <!-- POPUPS -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        const quizData = [{
            q: "Q1. Reynard went to the farmhouse because he was.",
            options: [
                { img: "../assets/images/angry.png", text: "Angry" },
                { img: "../assets/images/hungry.png", text: "Hungry" },
                { img: "../assets/images/sleepy.png", text: "Sleepy" },
                { img: "../assets/images/tired.png", text: "Tired" }
            ],
            a: 1,
        }, {
            q: "Q2. The hens were shocked when the fox tried to cross the fence because they were.",
            options: [
                { img: "../assets/images/scared.png", text: "Scared" },
                { img: "../assets/images/happy.png", text: "Happy" },
                { img: "../assets/images/sad.png", text: "Sad" },
                { img: "../assets/images/angry1.png", text: "Angry" }
            ],
            a: 0,
        }, {
            q: "Q3. The fox told the rooster to close both his eyes because he wanted.",
            options: [
                { img: "../assets/images/sing.png", text: "To make the rooster sing well" },
                { img: "../assets/images/catch-rooster.png", text: "To catch the rooster" },
                { img: "../assets/images/protect-eyes.png", text: "To protect the eyes of the roosters from dust." },
                { img: "../assets/images/run-away.png", text: "To run away from the farmhouse." }
            ],
            a: 1,
        }, {
            q: "Q4. The rooster flew and sat on the tree to.",
            options: [
                { img: "../assets/images/eat-apple.png", text: "Eat an apple" },
                { img: "../assets/images/see-people.png", text: "See people from the top" },
                { img: "../assets/images/escape-fox.png", text: "Escape from the fox" },
                { img: "../assets/images/watch-fox.png", text: "See where the fox would go" }
            ],
            a: 2,
        }, {
            q: "Q5. We should remain silent when we are.",
            options: [
                { img: "../assets/images/sad1.png", text: "Sad" },
                { img: "../assets/images/happy1.png", text: "Happy" },
                { img: "../assets/images/scared1.png", text: "Scared" },
                { img: "../assets/images/angry2.png", text: "Angry" }
            ],
            a: 3,
        }, ];

        let current = 0;
        let score = 0;
        let answered = Array(quizData.length).fill(null);

        const qEl = document.getElementById("question");
        const optEl = document.getElementById("options");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

      
        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

       function bigConfetti() {
            confetti({ particleCount: 200, spread: 110, origin: { y: 0.5 } });
            setTimeout(() => {
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.2 } });
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.8 } });
            }, 150);
        }

        function loadQuestion() {
            const q = quizData[current];
            qEl.textContent = q.q;
            optEl.innerHTML = "";
            nextBtn.disabled = answered[current] === null;

            q.options.forEach((opt, i) => {
                const d = document.createElement("div");
                d.className = "option o" + ((i % 4) + 1);

                const img = document.createElement("img");
                img.src = opt.img;
                img.alt = opt.text;

                const textSpan = document.createElement("span");
                textSpan.className = "option-text";
                textSpan.textContent = opt.text;

                d.appendChild(img);
                d.appendChild(textSpan);

                if (answered[current] !== null) {
                    if (i === q.a) d.classList.add("correct");
                    else d.classList.add("disabled");
                }

                d.onclick = () => {
                    if (answered[current] !== null) return;

                    if (i === q.a) {
                        answered[current] = i;
                        score++;

                        d.classList.add("correct");
                        [...optEl.children].forEach((o) => {
                            if (o !== d) o.classList.add("disabled");
                        });

                        speak("Correct");
                       
                        smallConfetti();
                        showPopup(true);
                        nextBtn.disabled = false;

                        if (answered.every((a) => a !== null)) setTimeout(showFinal, 1600);
                    } else {
                        speak("Try again");
                     
                        showPopup(false);
                        d.classList.add("wrong");
                        setTimeout(() => {
                            d.classList.remove("wrong");
                        }, 700);
                    }
                };

                optEl.appendChild(d);
            });

            prevBtn.disabled = current === 0;
        }

        prevBtn.onclick = () => {
            current--;
            loadQuestion();
        };

        nextBtn.onclick = () => {
            current++;
            loadQuestion();
        };

        function showPopup(isCorrect) {
            const popup = document.getElementById("answerPopup");
            const icon = document.getElementById("popupIcon");
            const title = document.getElementById("popupTitle");
            const msg = document.getElementById("popupMsg");

            popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
            popup.style.display = "flex";

            if (isCorrect) {
                icon.textContent = "🌟";
                title.textContent = "Amazing!";
                msg.textContent = "You got it right! ✨";
            } else {
                icon.textContent = "😒";
                title.textContent = "Keep Going!";
                msg.textContent = "Try again, you can do it! 🌈";
            }
            
            const sound = document.getElementById(isCorrect ? 'correctSound' : 'wrongSound');
            if (sound) sound.play().catch(() => {});

            setTimeout(() => {
                popup.style.display = "none";
            }, 1400);
        }

        function showFinal() {
            const popup = document.getElementById("finalPopup");
            document.getElementById("finalScore").textContent =
                `Your Score: ${score} / ${quizData.length}`;
            document.getElementById("stars").textContent = "⭐".repeat(score);
            popup.style.display = "flex";
            bigConfetti();
            // speak(`You scored ${score} out of ${quizData.length}`);
        }

        loadQuestion();
    </script>

</body>
