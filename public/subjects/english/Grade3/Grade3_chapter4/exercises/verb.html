
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>🌿 Word Safari · Verb Forms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===============================================================
           TOKENS — "Word Safari"
           canopy-deep #0F3D3E · canopy-mid #1B5E59 · parchment #FFF8E9
           mango #FF9F1C (CTA/next) · lime #A9D939 (correct) · papaya #FF6B5E (wrong/prev)
           ink #14302B (text) · vine #2E7D6B (borders/rope)
        ================================================================ */
        :root {
            --canopy-deep: #0b3230;
            --canopy-mid: #155e56;
            --canopy-glow: #2c9c85;
            --parchment: #fff8e9;
            --parchment-soft: #fdeecb;
            --mango: #ff9f1c;
            --mango-deep: #d97e0a;
            --lime: #9fd93f;
            --lime-deep: #6ea621;
            --papaya: #ff6b5e;
            --papaya-deep: #d9483d;
            --ink: #16302b;
            --ink-soft: #3d5c53;
            --vine: #4ea08d;
            --gold-line: #f0c14b;
        }
        @font-face {
    font-family: 'CCSYBold';
    src: url('./assets/CCSYBOLD.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
@font-face {
    font-family: 'CCSyntroman';
    src: url('../assets/CCSYNTRO.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
}
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
           font-family: 'CCSyntroman';
        }

        h1, h2, h3, .display-font {
            font-family: 'CCSyntroman';
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            overflow-y: auto;
           
        }

        /* leafy ambient shapes */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            /* filter: blur(2px); */
            pointer-events: none;
            opacity: 0.5;
            z-index: 0;
        }

        body::before {
            width: 260px;
            height: 260px;
            top: -80px;
            left: -80px;
            /* background: radial-gradient(circle, rgba(159, 217, 63, 0.35), transparent 70%); */
        }

        body::after {
            width: 320px;
            height: 320px;
            bottom: -100px;
            right: -100px;
            /* background: radial-gradient(circle, rgba(255, 159, 28, 0.28), transparent 70%); */
        }

        .app {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .template {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            /* background: var(--parchment); */
            /* border-radius: 32px;
            padding: 14px 26px 14px; */
            /* border: 4px solid var(--vine); */
            /* box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.35),
                inset 0 0 0 8px rgba(255, 255, 255, 0.5);
            position: relative;
            background-image:
                radial-gradient(circle at 6px 6px, rgba(46, 125, 107, 0.12) 1.4px, transparent 1.4px);
            background-size: 18px 18px; */
        }

        /* corner leaf accents */
        /* .template::before,
        .template::after {
            content: '🌿';
            position: absolute;
            font-size: 34px;
            opacity: 0.85;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.15));
        } */

        .template::before {
            top: -18px;
            left: 18px;
            transform: rotate(-25deg);
        }

        .template::after {
            bottom: -18px;
            right: 18px;
            transform: rotate(155deg);
        }

        /* ===== HEADER ===== */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.2px;
        }

  

        .instruction {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--ink);
            background: var(--parchment-soft);
            padding: 0.45rem 1.1rem;
            border-radius: 60px;
            text-align: center;
            border: 2.5px dashed var(--mango);
        }

        .sub-instruction {
           
            font-size: 17px;
            font-weight: 400;
            color: #000;
            background: #f8fbfa;
            padding: 0.45rem 1rem;
            border-radius: 60px;
            text-align: center;
            border: none;
            width: 100%;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
        }

        /* ===== QUESTION IMAGE — Polaroid pinned to the card ===== */
        .question-image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px 0 4px;
        }

        .question-image-container {
            position: relative;
        }

        .question-image-container::before {
            content: '📌';
            position: absolute;
            top: -6px;
            font-size: 26px;
            z-index: 3;
            filter: drop-shadow(0 3px 2px rgba(0,0,0,0.35));
        }

        .question-image {
            width: 200px;
            height: 200px;
            border-radius: 6px;
            object-fit: cover;
            filter: grayscale(100%) contrast(0.9) brightness(0.95);
            transition: all 0.6s ease;
            border: 10px solid #ffffff;
            border-bottom-width: 34px;
            background: #f0ece6;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            transform: rotate(-3deg);
        }

        .question-image.revealed {
            filter: grayscale(0%) contrast(1) brightness(1);
            animation: revealImage 0.6s ease;
            box-shadow: 0 0 0 4px var(--gold-line), 0 14px 30px rgba(255, 159, 28, 0.45);
            border-color: #fffdf6;
            transform: rotate(-3deg) scale(1.03);
        }

        @keyframes revealImage {
            0% {
                transform: rotate(-3deg) scale(0.85);
                opacity: 0.5;
            }

            50% {
                transform: rotate(2deg) scale(1.1);
            }

            100% {
                transform: rotate(-3deg) scale(1.03);
                opacity: 1;
            }
        }
.question-image-container{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.question-number{
    position:absolute;
    top:10px;
    left:calc(50% - 120px);
    width:48px;
    height:48px;
    border-radius:14px;
    background:linear-gradient(135deg,#ff9f1c,#ff7b00);
    color:#fff;
    font-size:22px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    border:3px solid #fff;
    box-shadow:0 6px 15px rgba(0,0,0,.25);
    z-index:10;
}
        /* ===== TABLE ===== */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.55);
            padding: 4px;
            border: 2px solid rgba(46, 125, 107, 0.25);
        }

        .verb-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 18px;
            overflow: hidden;
        }

        .verb-table th {
            background: #55b19c;
            color: #191919;
         
            font-size: 19px;
            font-weight: 700;
            padding: 14px 16px;
            text-align: center;
            border: none;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .verb-table td {
            padding: 14px 14px;
            text-align: center;
            font-size: 18px;
            background: #fffefb;
            border: 1px solid rgba(46, 125, 107, 0.15);
            vertical-align: middle;
            text-transform: capitalize;
        }

        .verb-table .present-cell {
            font-weight: 700;
            color: var(--ink);
            font-size: 20px;
            background: var(--parchment-soft);
            min-width: 90px;
        }

        .verb-table .input-cell {
            min-width: 120px;
        }

        .verb-table .text-cell {
            font-weight: 700;
            color: var(--ink);
            font-size: 24px;
            background: #ffffff;
            min-width: 120px;
        }

        /* ===== INPUT — wooden trail-sign blanks ===== */
        .verb-input {
            width: 100%;
            max-width: 150px;
            padding: 10px 12px;
            
            font-size: 24px;
            font-weight: 700;
            border: 3px solid var(--mango);
            border-radius: 12px;
            background: repeating-linear-gradient(135deg, #fff3d9, #fff3d9 8px, #ffe9bd 8px, #ffe9bd 16px);
            color: var(--ink);
            text-align: center;
            transition: all 0.25s ease;
            outline: none;
            box-shadow: 0 4px 0 var(--mango-deep);
            text-transform: capitalize;
            cursor: pointer;
            user-select: none;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verb-input:focus {
            border-color: var(--mango-deep);
            box-shadow: 0 0 0 4px rgba(255, 159, 28, 0.25), 0 4px 0 var(--mango-deep);
            transform: scale(1.02);
        }

        .verb-input.active-input {
            border-color: var(--vine);
            background: #eafce0;
            box-shadow: 0 0 0 4px rgba(46, 125, 107, 0.28), 0 4px 0 var(--vine);
            transform: scale(1.04);
        }

        .verb-input.correct {
            border-color: var(--lime-deep);
            background: linear-gradient(145deg, #eafcd7, #d5f5ad);
            box-shadow: 0 0 0 4px rgba(159, 217, 63, 0.3), 0 4px 0 var(--lime-deep);
            cursor: default;
            animation: none;
        }

        .verb-input.wrong {
            border-color: var(--papaya-deep);
            background: #ffe3e0;
            box-shadow: 0 0 0 4px rgba(255, 107, 94, 0.25), 0 4px 0 var(--papaya-deep);
            animation: shake 0.5s ease;
        }

        .verb-input:disabled {
            opacity: 0.8;
            cursor: default;
        }

        .verb-input .placeholder-text {
            color: #b98a3a;
            font-weight: 700;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }
        }

        /* ===== VERIFY BUTTON (kept hidden — auto-verify on tap, per original behavior) ===== */
        .verify-btn {
            background: var(--vine);
            border: none;
            border-radius: 14px;
            padding: 12px 14px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            min-height: 48px;
            height: 48px;
            flex-shrink: 0;
            display: none;
        }

        .verify-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .verify-btn.correct-btn {
            background: var(--lime-deep);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: nowrap;
        }

        /* ===== WORD BANK — scattered leaf tiles on a rope mat ===== */
        .word-bank {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            background: repeating-linear-gradient(45deg, #f4ead0, #f4ead0 10px, #eee0bd 10px, #eee0bd 20px);
            border-radius: 18px;
            border: 3px solid var(--vine);
            width: 100%;
            margin-top: 4px;
            min-height: 60px;
            box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.55);
        }

        .word-bank-label {
            
            font-size: 17px;
            font-weight: 700;
            color: var(--vine);
            margin-right: 6px;
        }

        .bank-word {
            padding: 9px 22px;
            background: #ffffff;
            border-radius: 40px 8px 40px 8px;
            border: 2.5px solid var(--vine);
            
            font-size: 19px;
            font-weight: 600;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            box-shadow: 0 4px 0 var(--vine);
        }

        .bank-word:nth-child(odd) {
            transform: rotate(-2deg);
        }

        .bank-word:nth-child(even) {
            transform: rotate(2deg);
        }

        .bank-word:hover:not(.used) {
            background: var(--parchment-soft);
            transform: scale(1.08) rotate(0deg);
            border-color: var(--mango);
            box-shadow: 0 4px 0 var(--mango-deep);
        }

        .bank-word:active:not(.used) {
            transform: scale(0.95) rotate(0deg);
        }

        .bank-word.used {
            opacity: 0.35;
            cursor: not-allowed;
            text-decoration: line-through;
            transform: scale(0.9) rotate(0deg);
            background: #ded2ad;
            box-shadow: none;
        }

        /* ===== NAVIGATION ===== */
        .nav-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            width: 100%;
            padding: 6px 0 2px;
        }

        .nav-btn {
            width: 150px;
            padding: 13px 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            border-radius: 40px;
            /* border: 3px solid #ffffff; */
            border:none;
            font-size: 20px;
            font-weight: 400;
            color: #ffffff;
            cursor: pointer;
            transition: .15s ease;
            
        }

        .nav-btn:active:not(:disabled) {
            transform: translateY(4px);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

      .prev-btn {
            background: linear-gradient(135deg, #7fc0eb, #5ba3d9);
        }

       

        .prev-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 var(--papaya-deep);
        }

        .next-btn {
            background: linear-gradient(135deg, #ecc74e, #e0b83a);
        }

        .next-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 var(--mango-deep);
        }

        .dots-indicator {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 4px 12px;
            display: none;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #d8c9a0;
            transition: all 0.4s ease;
            border: 2px solid transparent;
        }

        .dot.active {
            background: var(--mango);
            border-color: var(--mango-deep);
            transform: scale(1.25);
        }

        .dot.completed {
            background: var(--lime);
            border-color: var(--lime-deep);
        }

        /* POPUPS */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }

        .kid-card {
            background: #ffffff;
            width: 380px;
            max-width: 95%;
            padding: 32px 28px;
            border-radius: 44px;
            text-align: center;
            animation: kidPop 0.6s ease;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .kid-card::before,
        .kid-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .kid-card::before {
            width: 200px;
            height: 200px;
            top: -80px;
            right: -60px;
            background: #ffd93d;
        }

        .kid-card::after {
            width: 150px;
            height: 150px;
            bottom: -60px;
            left: -50px;
            background: #6bcbff;
        }

        .kid-card>* {
            position: relative;
            z-index: 2;
        }

        .kid-icon {
            font-size: 4.8em;
            margin-bottom: 6px;
            animation: emojiBounce 0.9s infinite alternate;
            display: inline-block;
        }

        .kid-card h3 {
            font-size: 2.2em;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .kid-card p {
            font-size: 1.1em;
            color: #555;
            margin-top: 2px;
            font-weight: 500;
        }

        .kid-correct .kid-card {
            background: linear-gradient(145deg, #f0fff4, #d4f5e6);
            border: 5px solid #38d9a9;
        }

        .kid-correct .kid-card h3 {
            color: #0b8a4a;
        }

        .kid-correct .kid-card p {
            color: #1a6a3a;
        }

        .kid-correct .kid-card::before {
            background: #38d9a9;
        }

        .kid-correct .kid-card::after {
            background: #38d9a9;
        }

        .kid-wrong .kid-card {
            background: linear-gradient(145deg, #fff5f5, #fce4e4);
            border: 5px solid #ff8a8a;
        }

        .kid-wrong .kid-card h3 {
            color: #c0392b;
        }

        .kid-wrong .kid-card p {
            color: #922b21;
        }

        .kid-wrong .kid-card::before {
            background: #ff8a8a;
        }

        .kid-wrong .kid-card::after {
            background: #ff8a8a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-8deg) perspective(400px) rotateX(10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotate(2deg) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0) scale(1);
            }
            to {
                transform: translateY(-12px) scale(1.05);
            }
        }

        /* FINAL POPUP */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            padding: 20px;
        }

        .final-kid-box {
            background: linear-gradient(145deg, #fff7d6, #e6fff5);
            padding: 35px 40px;
            border-radius: 44px;
            text-align: center;
            width: 480px;
            max-width: 95%;
            animation: finalBounce .8s ease;
            border: 4px solid rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .final-kid-box::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            top: -120px;
            right: -100px;
            background: #ffd93d;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .final-kid-box>* {
            position: relative;
            z-index: 2;
        }

        .final-kid-box h2 {
            font-size: 2.4em;
            color: #2f9e44;
            margin-bottom: 8px;
        
            font-weight: 700 !important;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
            color: #2d3a3a;
        }

        #stars {
            font-size: 2.6em;
            margin: 14px 0;
            letter-spacing: 6px;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #d4871f, 0 8px 24px rgba(255, 172, 48, 0.3);
            letter-spacing: 0.5px;
        }

        .playAgain-btn:hover {
            transform: translateY(-3px);
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #d4871f;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3) perspective(400px) rotateX(15deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.08) perspective(400px) rotateX(-5deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) perspective(400px) rotateX(0);
                opacity: 1;
            }
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .template {
                padding: 16px 14px;
                border-radius: 24px;
                gap: 10px;
            }

            .template::before,
            .template::after {
                font-size: 22px;
            }

            .title {
                font-size: 19px;
            }

            .title span {
                width: 36px;
                height: 36px;
                font-size: 22px;
            }

            .header-area {
                gap: 8px;
            }

            .instruction {
                font-size: 10px;
                padding: 0.25rem 0.8rem;
            }

            .sub-instruction {
                font-size: 13px;
                padding: 0.25rem 0.8rem;
            }

            .question-image {
                width: 110px;
                height: 110px;
                border-width: 7px;
                border-bottom-width: 22px;
            }

            .verb-table th {
                font-size: 14px;
                padding: 10px 10px;
            }

            .verb-table td {
                padding: 8px 6px;
                font-size: 14px;
            }

            .verb-table .present-cell {
                font-size: 15px;
                min-width: 60px;
            }

            .verb-table .input-cell {
                min-width: 80px;
            }

            .verb-table .text-cell {
                font-size: 16px;
                min-width: 80px;
            }

            .verb-input {
                font-size: 15px;
                padding: 7px 8px;
                max-width: 100px;
                border-radius: 10px;
                min-height: 44px;
            }

            .verify-btn {
                min-width: 38px;
                min-height: 38px;

<body>

    <div class="app">
        <div class="template">
            <!-- Header -->
            <div class="header-area">
                <div class="title"><span></span> Verbs</div>
                <div class="instruction">Tap a sign, then tap a word!</div>
            </div>
            <div class="sub-instruction">🐾 Track down the correct verb form for each blank</div>

            <!-- Question Image -->
           <div class="question-image-container">
    <div class="question-number" id="questionNumber">Q1</div>

    <img class="question-image" id="questionImage"
        src="https://picsum.photos/seed/go/200/200"
        alt="Question image" />
</div>
            <!-- Table -->
            <div class="table-wrapper">
                <table class="verb-table" id="verbTable">
                    <thead>
                        <tr>
                            <th>Present</th>
                            <th>Past</th>
                            <th>'ing'</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Word Bank -->
            <div class="word-bank" id="wordBank">
                <span class="word-bank-label"></span>
            </div>

            <!-- Navigation -->
            <div class="nav-area" id="navArea">
                <button class="nav-btn prev-btn" id="prevBtn"><span><i class="fa-solid fa-angles-left"></i>
                        Prev</span></button>
                <div class="dots-indicator" id="dotsIndicator"></div>
                <button class="nav-btn next-btn" id="nextBtn"><span>Next <i
                            class="fa-solid fa-angles-right"></i></span></button>
            </div>
        </div>
    </div>

    <!-- ===== POPUPS ===== -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <!-- ===== FINAL POPUP ===== -->
    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        // ================================================================
        //  DATA - Questions with image and word bank
        // ================================================================
    const QUESTIONS = [
{
    present: "think",
    past: "thought",
    ing: "thinking",
    image: "../assets/images/think.png",
    options: ["Thought", "Thinking", "Fell", "Falling"],
    blankPresent: false,
    blankPast: true,
    blankIng: true
},
{
    present: "escape",
    past: "escaped",
    ing: "escaping",
    image: "../assets/images/escape.png",
    options: ["Escape", "Escaping", "Kept", "Keeping"],
    blankPresent: true,
    blankPast: false,
    blankIng: true
},
{
    present: "fall",
    past: "fell",
    ing: "falling",
    image: "../assets/images/fall.png",
    options: ["Fell", "Fall", "Thought", "Thinking"],
    blankPresent: true,
    blankPast: true,
    blankIng: false
},
{
    present: "keep",
    past: "kept",
    ing: "keeping",
    image: "../assets/images/keep1.png",
    options: ["Kept", "Keeping", "Escaped", "Escaping"],
    blankPresent: false,
    blankPast: true,
    blankIng: true
},
{
    present: "show",
    past: "showed",
    ing: "showing",
    image: "../assets/images/show1.png",
    options: ["Show", "Showing", "Shut", "Shutting"],
    blankPresent: true,
    blankPast: false,
    blankIng: true
},
{
    present: "shut",
    past: "shut",
    ing: "shutting",
    image: "../assets/images/shut.png",
    options: ["Shut", "Shutting", "Showed", "Showing"],
    blankPresent: true,
    blankPast: false,
    blankIng: false
}
];
        // ================================================================
        //  STATE
        // ================================================================
        let currentIndex = 0;
        const totalQuestions = QUESTIONS.length;
        let questionStates = [];
        let completedQuestions = 0;
        let activeBlank = null;

        // ================================================================
        //  DOM REFS
        // ================================================================
        const tableBody = document.getElementById('tableBody');
        const wordBankEl = document.getElementById('wordBank');
        const questionImage = document.getElementById('questionImage');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const dotsIndicator = document.getElementById('dotsIndicator');
        const playAgainBtn = document.getElementById('playAgainBtn');

        const popupOverlay = document.getElementById('answerPopup');
        const popupIcon = document.getElementById('popupIcon');
        const popupTitle = document.getElementById('popupTitle');
        const popupMsg = document.getElementById('popupMsg');

        // ================================================================
        //  AUDIO / CONFETTI
        // ================================================================
        let audioCtx = null;
        function playCorrectSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.frequency.value = 880; g.gain.value = 0.2; o.type = 'sine';
                o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                o.stop(audioCtx.currentTime + 0.5);
            } catch (e) { }
        }
        function playWrongSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.frequency.value = 440; g.gain.value = 0.25; o.type = 'sawtooth';
                o.start(); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
                o.stop(audioCtx.currentTime + 0.4);
            } catch (e) { }
        }
        function smallConfetti() { confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } }); }
        function bigConfetti() {
            confetti({ particleCount: 200, spread: 110, origin: { y: 0.5 } });
            setTimeout(() => {
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.2 } });
                confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.8 } });
            }, 150);
        }

        // ================================================================
        //  POPUP
        // ================================================================
        function showPopup(isCorrect) {
            popupOverlay.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
            popupOverlay.style.display = 'flex';
            if (isCorrect) {
                popupIcon.textContent = '🌟';
                popupTitle.textContent = 'Amazing!';
                popupMsg.textContent = 'You got it right! ✨';
            } else {
                popupIcon.textContent = '😒';
                popupTitle.textContent = 'Keep Going!';
                popupMsg.textContent = 'Try again, you can do it! 🌈';
            }
            const sound = document.getElementById(isCorrect ? 'correctSound' : 'wrongSound');
            if (sound) sound.play().catch(() => { });
            setTimeout(() => { popupOverlay.style.display = 'none'; }, 1800);
        }

        // ================================================================
        //  SPEECH
        // ================================================================
        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = 'en-US'; msg.volume = 0.25; msg.rate = 1; msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        // ================================================================
        //  SHOW FINAL
        // ================================================================
        function showFinal() {
            document.getElementById('finalPopup').style.display = 'flex';
            document.getElementById('finalScore').textContent = `Your Score: ${completedQuestions} / ${totalQuestions}`;
            document.getElementById('stars').textContent = '⭐'.repeat(Math.min(completedQuestions, 5));
            bigConfetti();
        }

        // ================================================================
        //  CHECK ALL COMPLETED
        // ================================================================
        function checkAllCompleted() {
            if (completedQuestions === totalQuestions) setTimeout(showFinal, 800);
        }

        // ================================================================
        //  REVEAL IMAGE
        // ================================================================
        function revealImage() {
            questionImage.classList.add('revealed');
            smallConfetti();
        }

        // ================================================================
        //  RESET IMAGE
        // ================================================================
        function resetImage() { questionImage.classList.remove('revealed'); }

        // ================================================================
        //  UPDATE NAV & DOTS
        // ================================================================
        function updateNav() {
            const state = questionStates[currentIndex];
            const isCompleted = state.completed;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = !isCompleted;
            const dots = dotsIndicator.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                dot.className = 'dot';
                if (index === currentIndex) dot.classList.add('active');
                if (questionStates[index] && questionStates[index].completed) dot.classList.add('completed');
            });
        }

        function buildDots() {
            dotsIndicator.innerHTML = '';
            for (let i = 0; i < totalQuestions; i++) {
                const dot = document.createElement('span');
                dot.className = 'dot';
                dot.dataset.index = i;
                dot.addEventListener('click', function () {
                    const idx = parseInt(this.dataset.index);
                    if (idx === currentIndex) return;
                    if (idx < currentIndex && questionStates[idx].completed) goToQuestion(idx);
                    else if (idx === currentIndex + 1 && questionStates[currentIndex].completed) goToQuestion(idx);
                });
                dot.style.cursor = 'pointer';
                dotsIndicator.appendChild(dot);
            }
            updateNav();
        }

        // ================================================================
        //  RENDER QUESTION
        // ================================================================
        function renderQuestion(index) {
            const data = QUESTIONS[index];
            const state = questionStates[index];
            resetImage();
            activeBlank = null;
            questionImage.src = data.image;
            questionImage.alt = data.present;
            document.getElementById("questionNumber").textContent =
    `Q${currentIndex + 1}`;
            if (state.completed) questionImage.classList.add('revealed');

            tableBody.innerHTML = '';
            const tr = document.createElement('tr');

            // Present
            const presentCell = document.createElement('td');
            if (data.blankPresent) {
                presentCell.className = 'input-cell';
                presentCell.appendChild(createInputWrapper(index, 0, 'present', state, data.present));
            } else {
                presentCell.className = 'text-cell';
                presentCell.innerHTML = `<strong>${data.present}</strong>`;
            }
            tr.appendChild(presentCell);

            // Past
            const pastCell = document.createElement('td');
            if (data.blankPast) {
                pastCell.className = 'input-cell';
                pastCell.appendChild(createInputWrapper(index, 1, 'past', state, data.past));
            } else {
                pastCell.className = 'text-cell';
                pastCell.textContent = data.past;
            }
            tr.appendChild(pastCell);

            // 'ing'
            const ingCell = document.createElement('td');
            if (data.blankIng) {
                ingCell.className = 'input-cell';
                ingCell.appendChild(createInputWrapper(index, 2, 'ing', state, data.ing));
            } else {
                ingCell.className = 'text-cell';
                ingCell.textContent = data.ing;
            }
            tr.appendChild(ingCell);

            tableBody.appendChild(tr);

            renderWordBank(data.options, state);
            updateNav();
            setTimeout(() => autoFocusFirstBlank(index), 200);
        }

        // ================================================================
        //  AUTO FOCUS FIRST BLANK
        // ================================================================
        function autoFocusFirstBlank(rowIdx) {
            const state = questionStates[rowIdx];
            if (state.completed) return;
            const inputs = document.querySelectorAll(`.verb-input[data-row="${rowIdx}"]`);
            for (let input of inputs) {
                if (!input.classList.contains('correct') && input.textContent === '___') {
                    input.click();
                    return;
                }
            }
        }

        // ================================================================
        //  CREATE INPUT WRAPPER
        // ================================================================
        function createInputWrapper(rowIdx, colIdx, type, state, correctAnswer) {
            const wrapper = document.createElement('div');
            wrapper.className = 'input-wrapper';

            const input = document.createElement('div');
            input.className = 'verb-input';
            input.dataset.row = rowIdx;
            input.dataset.col = colIdx;
            input.dataset.type = type;
            input.dataset.correct = correctAnswer;
            input.innerHTML = '<span class="placeholder-text">___</span>';
            input.setAttribute('role', 'button');
            input.setAttribute('tabindex', '0');

            const verify = document.createElement('button');
            verify.className = 'verify-btn';
            verify.innerHTML = '<i class="fa-regular fa-circle-check"></i>';
            verify.dataset.row = rowIdx;
            verify.dataset.col = colIdx;

            const key = `${rowIdx}-${colIdx}`;
            if (state.correctCells && state.correctCells[key]) {
                input.textContent = state.correctCells[key];
                input.classList.add('correct');
                input.style.cursor = 'default';
                verify.disabled = true;
                verify.classList.add('correct-btn');
                verify.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else {
                input.addEventListener('click', function (e) {
                    e.stopPropagation();
                    if (state.completed) return;
                    if (this.classList.contains('correct')) return;
                    document.querySelectorAll('.verb-input').forEach(el => el.classList.remove('active-input'));
                    this.classList.add('active-input');
                    if (this.querySelector('.placeholder-text')) this.innerHTML = '';
                    activeBlank = { row: rowIdx, col: colIdx, input: this, verify: verify };
                });
                input.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.click(); }
                });

                verify.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (state.completed) return;
                    const active = activeBlank;
                    if (!active) { autoFocusFirstBlank(rowIdx); return; }
                    if (active.row !== rowIdx || active.col !== colIdx) return;

                    const word = active.input.textContent.trim();
                    if (word === '___' || word === '') {
                        active.input.style.borderColor = '#e57373';
                        setTimeout(() => active.input.style.borderColor = '', 600);
                        return;
                    }

                    const correct = active.input.dataset.correct.toLowerCase();
                    const guess = word.toLowerCase();

                    if (guess === correct) {
                        const key = `${rowIdx}-${colIdx}`;
                        if (!state.correctCells) state.correctCells = {};
                        state.correctCells[key] = word;
                        state.blanksFilled = (state.blanksFilled || 0) + 1;

                        active.input.classList.remove('active-input');
                        active.input.classList.add('correct');
                        active.input.style.cursor = 'default';
                        verify.disabled = true;
                        verify.classList.add('correct-btn');
                        verify.innerHTML = '<i class="fa-solid fa-check"></i>';

                        const bankWords = wordBankEl.querySelectorAll('.bank-word');
                        bankWords.forEach(el => {
                            if (el.dataset.word.toLowerCase() === guess) el.classList.add('used');
                        });

                        showPopup(true);
                        smallConfetti();
                        speak('Correct!');

                        const data = QUESTIONS[rowIdx];
                        const total = (data.blankPresent ? 1 : 0) + (data.blankPast ? 1 : 0) + (data.blankIng ? 1 : 0);
                        state.totalBlanks = total;

                        if (state.blanksFilled === total) {
                            state.completed = true;
                            completedQuestions++;
                            revealImage();   // 👈 image revealed only when all blanks are correctly filled
                            updateNav();
                            checkAllCompleted();
                        } else {
                            updateNav();
                            setTimeout(() => autoFocusFirstBlank(rowIdx), 400);
                        }
                        activeBlank = null;
                    } else {
                        active.input.classList.add('wrong');
                        showPopup(false);
                        speak('Try again!');
                        const wordText = active.input.textContent;
                        const bankWords = wordBankEl.querySelectorAll('.bank-word');
                        bankWords.forEach(el => {
                            if (el.dataset.word.toLowerCase() === wordText.toLowerCase()) {
                                el.classList.remove('used');
                            }
                        });
                        setTimeout(() => {
                            active.input.classList.remove('wrong');
                            active.input.innerHTML = '<span class="placeholder-text">___</span>';
                            active.input.classList.add('active-input');
                        }, 600);
                    }
                });
            }

            wrapper.appendChild(input);
            wrapper.appendChild(verify);
            return wrapper;
        }

        // ================================================================
        //  RENDER WORD BANK
        // ================================================================
        function renderWordBank(options, state) {
            const label = wordBankEl.querySelector('.word-bank-label') || document.createElement('span');
            if (!wordBankEl.querySelector('.word-bank-label')) {
                label.className = 'word-bank-label';
                label.textContent = '🎒 Word Bank:';
                wordBankEl.appendChild(label);
            }
            const existing = wordBankEl.querySelectorAll('.bank-word');
            existing.forEach(el => el.remove());

            const usedWords = new Set();
            if (state.correctCells) {
                Object.values(state.correctCells).forEach(val => { if (val) usedWords.add(val); });
            }

            const shuffled = [...options].sort(() => Math.random() - 0.5);
            shuffled.forEach(word => {
                const el = document.createElement('span');
                el.className = 'bank-word';
                if (usedWords.has(word)) el.classList.add('used');
                el.dataset.word = word;
                el.textContent = word;
                el.addEventListener('click', function () {
                    if (this.classList.contains('used')) return;
                    handleBankWordClick(this);
                });
                wordBankEl.appendChild(el);
            });
        }

        // ================================================================
        //  HANDLE BANK WORD CLICK
        // ================================================================
        function handleBankWordClick(el) {
            if (el.classList.contains('used')) return;
            const word = el.dataset.word;
            if (!activeBlank) { autoFocusFirstBlank(currentIndex); if (!activeBlank) return; }
            const active = activeBlank;
            if (active.input.classList.contains('correct')) { autoFocusFirstBlank(currentIndex); if (!activeBlank) return; }
            active.input.textContent = word;
            active.input.classList.remove('active-input');
            el.classList.add('used');
            setTimeout(() => active.verify.click(), 300);
        }

        // ================================================================
        //  NAVIGATION
        // ================================================================
        function goToQuestion(index) {
            if (index < 0 || index >= totalQuestions) return;
            currentIndex = index;
            activeBlank = null;
            renderQuestion(index);
        }
        prevBtn.addEventListener('click', () => { if (currentIndex > 0) goToQuestion(currentIndex - 1); });
        nextBtn.addEventListener('click', () => {
            const state = questionStates[currentIndex];
            if (state.completed && currentIndex < totalQuestions - 1) goToQuestion(currentIndex + 1);
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); if (currentIndex > 0) goToQuestion(currentIndex - 1); }
            else if (e.key === 'ArrowRight') {
                e.preventDefault();
                const state = questionStates[currentIndex];
                if (state.completed && currentIndex < totalQuestions - 1) goToQuestion(currentIndex + 1);
            }
        });

        // ================================================================
        //  RESTART
        // ================================================================
        function restartQuiz() {
            currentIndex = 0;
            completedQuestions = 0;
            questionStates = [];
            QUESTIONS.forEach((q, i) => {
                const total = (q.blankPresent ? 1 : 0) + (q.blankPast ? 1 : 0) + (q.blankIng ? 1 : 0);
                questionStates[i] = { completed: false, blanksFilled: 0, totalBlanks: total, correctCells: {} };
            });
            document.getElementById('finalPopup').style.display = 'none';
            goToQuestion(0);
        }
        playAgainBtn.onclick = restartQuiz;

        // ================================================================
        //  INIT
        // ================================================================
        QUESTIONS.forEach((q, i) => {
            const total = (q.blankPresent ? 1 : 0) + (q.blankPast ? 1 : 0) + (q.blankIng ? 1 : 0);
            questionStates[i] = { completed: false, blanksFilled: 0, totalBlanks: total, correctCells: {} };
        });
        buildDots();
        goToQuestion(0);

        console.log('🌿 Word Safari · image reveals only after all blanks correct');
    </script>
</body>

</html>
