<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assessments</title>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
         @font-face {
            font-family: 'CCSYBold';
            src: url('./assets/CCSYBOLD.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "CCSYBold";
            font-weight: 400;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: url("./assets/images/bg1.png");
            background-size: 100% 100%;
        }

        .app {
            height: 100vh;
            display: flex;
            /* background: #ffffffa8; */
        }

        .sidebar {
            width: 300px;
            padding: 25px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0px;
        }

        /* FRESH DESIGN: "Jelly Bean" style with playful squishy active states */
        .island-btn {
            display: flex;
            align-items: center;
            height: 75px;
            gap: 15px;
            padding: 16px 15px;
            border-radius: 30px;
            font-size: 19px;
            font-weight: 500;
            cursor: pointer;
            background: rgb(238, 238, 238);
            color: #8a7aa8;
            border: 3px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 15px rgba(180, 160, 200, 0.08);
            position: relative;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option-num {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-weight: 400;
            color: transparent;
            font-size: 0px;
            background: rgba(200, 180, 220, 0.2);
            transition: all 0.4s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .option-num span {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9a8ab8;
            font-size: 17px;
            transition: all 0.3s ease;
        }

        .island-btn:hover {
            /* transform: translateY(-4px) scale(1.02); */
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 12px 30px rgba(180, 160, 200, 0.2);
            color: #5a4a78;
        }

        .island-btn:hover .option-num {
            background: rgba(200, 180, 220, 0.4);
            /* transform: scale(1.05) rotate(3deg); */
        }

        /* PLAYFUL ACTIVE STATE: "Jelly Bean Pop" with colorful glow */
        .island-btn.active {
            font-weight: 500;
            color: #3a2a58;
            /* transform: translateY(-6px) scale(1.04); */
            border-width: 3px;
            /* backdrop-filter: blur(8px); */
        }

        .island-btn.active .option-num {
            /* transform: scale(1.15) rotate(-8deg); */
            border-color: rgba(255, 255, 255, 0.8);
        }

        .island-btn.active .option-num span {
            color: #ffffff;
        }

        /* Pastel color themes - each with unique vibrant personality */
        .o1.active {
            background: linear-gradient(135deg, #ffffff, #ffffff);
            border-color: #ff8eb5;
        }

        .o1.active .option-num {
            background: #ff8eb5;
        }

        .o2.active {
            background: linear-gradient(135deg, #ffffff, #ffffff);
            border-color: #6ec8ff;
        }

        .o2.active .option-num {
            background: #6ec8ff;
        }

        .o3.active {
            background: linear-gradient(135deg, #ffffff, #ffffff);
            border-color: #59cf59;
        }

        .o3.active .option-num {
            background: #59cf59;
        }

        .o6.active {
            background: linear-gradient(135deg, #ffffff, #ffffff);
            border-color: #ac75e4;
        }

        .o6.active .option-num {
            background: #ac75e4;
        }

        .o4.active {
            background: linear-gradient(135deg, #ffffff, #ffffff);
            border-color: #ecbc41;
        }

        .o4.active .option-num {
            background: #ecbc41;
        }

        .o5.active {
            background: linear-gradient(135deg, #ffffff, #ffffff);
            border-color: #ff99cc;
        }

        .o5.active .option-num {
            background: #ff99cc;
        }

        /* NEW "Correct Verb" style – fresh coral/mango tone */
        .o7.active {
            background: linear-gradient(135deg, #ffffff, #ffffff);
            border-color: #f7a072;
        }

        .o7.active .option-num {
            background: #f7a072;
        }

        .main {
            flex: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:1065px) {
            .app {
                flex-direction: column;
            }

            .sidebar {
                display: none;
            }

            iframe {
                border-radius: 0px;
            }

            .menu-btn {
                display: block;
                position: fixed;
                top: 8px;
                right: 15px;
                font-size: 26px;
                background: #c084fc;
                color: white;
                border: none;
                border-radius: 50px;
                padding: 8px 16px;
                cursor: pointer;
                z-index: 5000;
                box-shadow: 0 4px 15px rgba(192, 132, 252, 0.4);
            }

            .offcanvas {
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.08);
                backdrop-filter: blur(6px);
                display: none;
                z-index: 4000;
            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: 300px;
                height: 100%;
                background: rgba(255, 248, 252, 0.95);
                padding: 0px;
                padding-top: 0px;
                transform: translateX(100%);
                transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
                overflow-y: hidden;
                backdrop-filter: blur(10px);
            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
                padding: 20px;
            }

            .offcanvas-panel .island-btn {
                margin-bottom: 16px;
            }
        }

        @media (min-width: 900px) and (max-height: 800px) {
            .app {
                transform: scaleY(0.95);
                transform-origin: top center;
                height: calc(100vh / 0.95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {
            .app {
                transform: scaleY(0.9);
                transform-origin: top center;
                height: calc(100vh / 0.9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {
            .app {
                transform: scaleY(0.85);
                transform-origin: top center;
                height: calc(100vh / 0.85);
            }
        }

        @media (min-width: 900px) and (max-height: 500px) {
            .app {
                transform: scaleY(0.8);
                transform-origin: top center;
                height: calc(100vh / 0.8);
            }
        }

        @media screen and (min-width: 1025px) and (max-width: 1440px) {
            .sidebar {
                width: 300px;
                padding: 26px 22px;
                gap: 24px;
            }

            .island-btn {
                font-size: 20px;
                padding: 18px 15px;
            }

            .option-num {
                width: 38px;
                height: 38px;
            }
        }

        @media screen and (min-width: 1441px) and (max-width: 1920px) {
            .sidebar {
                width: 380px;
                padding: 30px 26px;
                gap: 30px;
            }

            .island-btn {
                font-size: 22px;
                height: 85px;
                padding: 20px ;
            }

            .option-left {
                gap: 18px;
            }

            .option-num {
                width: 42px;
                height: 42px;
                border-radius: 14px;
            }
        }

        @media screen and (min-width: 1921px) {
            .sidebar {
                width: 400px;
                padding: 36px 30px;
                gap: 36px;
            }

            .island-btn {
                font-size: 24px;
                height: 95px;
                padding: 24px;
            }

            .option-left {
                gap: 22px;
            }

            .option-num {
                width: 48px;
                height: 48px;
                border-radius: 16px;
            }

            iframe {
                border-radius: 44px 0 0 44px;
            }
        }
    </style>
</head>

<body>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="app">
        <div class="sidebar">
            <div class="island-btn o1 active" onclick="openIsland(0)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-pen-to-square"></i></span></div>
                    <div>Fill In The Blanks</div>
                </div>
            </div>
            <div class="island-btn o2" onclick="openIsland(1)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-check-double"></i></span></div>
                    <div>Correct Options</div>
                </div>
            </div>
            <div class="island-btn o3" onclick="openIsland(2)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-link"></i></span></div>
                    <div>Affixes</div>
                </div>
            </div>
            <div class="island-btn o4" onclick="openIsland(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-scale-balanced"></i></span></div>
                    <div>Synonyms</div>
                </div>
            </div>
            <div class="island-btn o5" onclick="openIsland(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-spell-check"></i></span></div>
                    <div>Antonyms</div>
                </div>
            </div>
            <div class="island-btn o6" onclick="openIsland(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-flag"></i></span></div>
                    <div>Correct Verb</div>
                </div>
            </div>
        </div>
        <div class="main"> <iframe id="contentFrame" src="./exercises/FTB.html"></iframe> </div>
    </div>
    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">
        <div class="offcanvas-panel" onclick="event.stopPropagation()">
            <div class="island-btn o1 active" onclick="mobileOpen(0)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-pen-to-square"></i></span></div>
                    <div>Fill In The Blanks</div>
                </div>
            </div>
            <div class="island-btn o2" onclick="mobileOpen(1)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-check-double"></i></span></div>
                    <div>Correct Options</div>
                </div>
            </div>
            <div class="island-btn o3" onclick="mobileOpen(2)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-link"></i></span></div>
                    <div>Affixes</div>
                </div>
            </div>
            <div class="island-btn o4" onclick="mobileOpen(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-scale-balanced"></i></span></div>
                    <div>Synonyms</div>
                </div>
            </div>
            <div class="island-btn o5" onclick="mobileOpen(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-spell-check"></i></span></div>
                    <div>Antonyms</div>
                </div>
            </div>
            <div class="island-btn o6" onclick="mobileOpen(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-flag"></i></span></div>
                    <div>Correct Verb</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const sidebarButtons = document.querySelectorAll(".sidebar .island-btn");
        const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");
        const frame = document.getElementById("contentFrame");
        const pages = [
            "./exercises/FTB.html",
            "./exercises/mcq.html",
            "./exercises/affixes.html",
            "./exercises/synonym.html",
            "./exercises/antonym.html",
            "./exercises/verb.html"   // new page for Correct Verb
        ];

        function openIsland(index) {
            sidebarButtons.forEach(btn => btn.classList.remove("active"));
            sidebarButtons[index].classList.add("active");
            mobileButtons.forEach(btn => btn.classList.remove("active"));
            mobileButtons[index].classList.add("active");
            frame.src = pages[index];
        }

        function toggleMenu() {
            if (window.innerWidth > 1065) return;
            document.getElementById("offcanvas").classList.toggle("show");
        }

        function mobileOpen(i) {
            openIsland(i);
            toggleMenu();
        }
    </script>
</body>

</html>
