<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Assessments</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @font-face {
            font-family: 'CCSYBold';
            src: url('./assets/CCSYBOLD.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "CCSYBold";
            font-weight: 400;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(132deg, #faeaee, rgb(253, 255, 253));
            background-size: 4px 4px;
        }

        .app {
            height: 100vh;
            display: flex;
            background: rgba(206, 221, 217, 0.55);
        }

        .sidebar {
            width: 300px;

            padding: 25px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;

            gap: 0px;
        }

        /* OPTION BUTTON - PREMIUM WATER FLOW ANIMATION */

        .island-btn {
            display: flex;
            align-items: center;
            height: 75px;
            gap: 15px;
            padding: 16px 20px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            background: rgba(248, 250, 252, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #475569;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.05),
                0 2px 4px -1px rgba(0, 0, 0, 0.03),
                inset 0 2px 0 rgba(255, 255, 255, 0.8);

            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.3s ease;
        }

        /* Water Flow Effect Layer (Centered, initially squeezed to 0 width) */
        .island-btn::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 0;
            transform: translateX(-50%);
            border-radius: inherit;
            z-index: -1;
            opacity: 0;
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Content wrapper keeps icons/text layered correctly above animation */
        .option-left {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 2;
        }

        .option-num {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 700;
            color: #64748b;
            font-size: 16px;
            background: rgba(226, 232, 240, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .island-btn:hover {
            transform: translateY(-2px);
            color: #1e293b;
            box-shadow:
                0 10px 15px -3px rgba(0, 0, 0, 0.08),
                0 4px 6px -2px rgba(0, 0, 0, 0.04);
        }

        /* ACTIVE CONTAINER STATE */

        .island-btn.active {
            color: #0f172a;
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow:
                0 12px 24px -4px rgba(0, 0, 0, 0.12),
                0 4px 12px -2px rgba(0, 0, 0, 0.06),
                0 0 0 3px #ffffff;
        }

        /* TRIGGERS OUTWARD FLUID FLOW (WIDTH 100%) */
        .island-btn.active::before {
            width: 100%;
            opacity: 1;
        }

        /* ACTIVE TICK TICKING */

        .island-btn.active .option-num {
            background: #10b981;
            color: white;
            font-size: 20px;
            border-color: transparent;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
            transform: scale(1.05);
        }

        .island-btn.active .option-num::after {
            content: "✔";
        }

        .island-btn.active .option-num span {
            display: none;
        }

        /* INDIVIDUAL SOFT GRADIENTS (APPLIED TO WATER LAYER) */

        .o1::before {
            background: linear-gradient(90deg, #ffe3c2, #ffdbb2, #ffe3c2);
        }

        .o2::before {
            background: linear-gradient(90deg, #d0f0ff, #c0eaff, #d0f0ff);
        }

        .o3::before {
            background: linear-gradient(90deg, #cdffa9, #c1ffa9, #cdffa9);
        }

        .o4::before {
            background: linear-gradient(90deg, #fde7a3, #fae091, #fde7a3);
        }

        .o5::before {
            background: linear-gradient(90deg, #ffc4cc, #fcb9c1, #ffc4cc);
        }

        .o6::before {
            background: linear-gradient(90deg, #addbe3, #9dd2dbef, #addbe3);
        }

        .main {
            flex: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* MOBILE */

        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:1065px) {

            .app {
                flex-direction: column;
            }

            .sidebar {
                display: none;
            }

            .menu-btn {
                display: block;
                position: fixed;
                top: 8px;
                right: 15px;
                font-size: 26px;
                background: #e9a106;
                color: white;
                border: none;
                border-radius: 10px;
                padding: 6px 12px;
                cursor: pointer;
                z-index: 5000;
            }

            .offcanvas {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, .45);
                display: none;
                z-index: 4000;
            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: 300px;
                height: 100%;
                background: #f1f5f9;
                padding: 0px;
                padding-top: 0px;
                transform: translateX(100%);
                transition: .3s;
                overflow-y: hidden;
            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
                padding: 20px;
            }

            .offcanvas-panel .island-btn {
                margin-bottom: 12px;
            }

        }

        @media (min-width: 900px) and (max-height: 800px) {
            .app {
                transform: scaleY(0.95);
                transform-origin: top center;
                height: calc(100vh / 0.95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {
            .app {
                transform: scaleY(0.9);
                transform-origin: top center;
                height: calc(100vh / 0.9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {
            .app {
                transform: scaleY(0.85);
                transform-origin: top center;
                height: calc(100vh / 0.85);
            }
        }

        @media (min-width: 900px) and (max-height: 500px) {
            .app {
                transform: scaleY(0.8);
                transform-origin: top center;
                height: calc(100vh / 0.8);
            }
        }

        /* ============================= */
        /* Desktop / Monitor (1025–1440) */
        /* ============================= */
        @media screen and (min-width: 1025px) and (max-width: 1440px) {

            .sidebar {
                width: 300px;
                padding: 26px 22px;
                gap: 28px;
            }

            .island-btn {
                font-size: 20px;
                padding: 18px 22px;
            }

            .option-num {
                width: 38px;
                height: 38px;
                font-size: 17px;
            }
        }

        /* ============================= */
        /* Large Monitors (1441–1920) */
        /* ============================= */
        @media screen and (min-width: 1441px) and (max-width: 1920px) {

            .sidebar {
                width: 360px;
                padding: 30px 26px;
                gap: 32px;
            }

            .island-btn {
                font-size: 22px;
                height: 85px;
                padding: 20px;
            }

            .option-left {
                gap: 18px;
            }

            .option-num {
                width: 42px;
                height: 42px;
                font-size: 19px;
            }
        }

        /* ============================= */
        /* Extra Large Screens / 4K */
        /* ============================= */
        @media screen and (min-width: 1921px) {

            .sidebar {
                width: 420px;
                padding: 36px 30px;
                gap: 38px;
            }

            .island-btn {
                font-size: 24px;
                height: 95px;
                padding: 24px;
            }

            .option-left {
                gap: 22px;
            }

            .option-num {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }

            iframe {
                border-radius: 14px;
            }
        }
    </style>
</head>

<body>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <div class="app">

        <div class="sidebar">
            <div class="island-btn o1 active" onclick="openIsland(0)">
                <div class="option-left">
                    <div class="option-num"><span> <i class="fa-solid fa-pen-to-square"></i></span></div>
                    <div>Fill In The Blanks</div>
                </div>
            </div>

            <div class="island-btn o2" onclick="openIsland(1)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-check-double"></i></span></div>
                    <div>Correct Options</div>
                </div>
            </div>

            <div class="island-btn o3" onclick="openIsland(2)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-arrows-split-up-and-left"></i></span></div>
                    <div>Homonyms</div>
                </div>
            </div>

            <div class="island-btn o6" onclick="openIsland(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-arrow-right-arrow-left"></i></span></div>
                    <div>Synonyms</div>
                </div>
            </div>

            <div class="island-btn o5" onclick="openIsland(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-lightbulb"></i></span></div>
                    <div>Antonyms</div>
                </div>
            </div>

            <div class="island-btn o4" onclick="openIsland(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-link"></i></span></div>
                    <div>Correct Verb</div>
                </div>
            </div>
        </div>

        <div class="main">
            <iframe id="contentFrame" src="./exercises/FTB.html"></iframe>
        </div>

    </div>

    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

        <div class="offcanvas-panel" onclick="event.stopPropagation()">

            <div class="island-btn o1 active" onclick="mobileOpen(0)">
                <div class="option-left">
                    <div class="option-num"><span> <i class="fa-solid fa-pen-to-square"></i></span></div>
                    <div>Fill In The Blanks</div>
                </div>
            </div>

            <div class="island-btn o2" onclick="mobileOpen(1)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-circle-check"></i></span></div>
                    <div>Correct Options</div>
                </div>
            </div>

            <div class="island-btn o3" onclick="mobileOpen(2)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-scale-balanced"></i></span></div>
                    <div>Homonyms</div>
                </div>
            </div>

            <div class="island-btn o5" onclick="mobileOpen(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-font"></i></span></div>
                    <div>Synonyms</div>
                </div>
            </div>

            <div class="island-btn o6" onclick="mobileOpen(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-lightbulb"></i></span></div>
                    <div>Antonyms</div>
                </div>
            </div>

            <div class="island-btn o4" onclick="mobileOpen(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-link"></i></span></div>
                    <div>Correct Verb</div>
                </div>
            </div>
        </div>

    </div>

    <script>

        const sidebarButtons = document.querySelectorAll(".sidebar .island-btn");
        const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");

        const frame = document.getElementById("contentFrame");

        const pages = [

            "./exercises/FTB.html",
            "./exercises/mcq.html",
            "./exercises/homonyms.html",
            "./exercises/synonym.html",
            "./exercises/antonym.html",
            "./exercises/verb.html",

        ];

        function openIsland(index) {

            sidebarButtons.forEach(btn => btn.classList.remove("active"));
            sidebarButtons[index].classList.add("active");

            mobileButtons.forEach(btn => btn.classList.remove("active"));
            mobileButtons[index].classList.add("active");

            frame.src = pages[index];

        }

        function toggleMenu() {

            if (window.innerWidth > 1065) return;

            document.getElementById("offcanvas").classList.toggle("show");

        }

        function mobileOpen(i) {

            openIsland(i);
            toggleMenu();

        }

    </script>

</body>

</html>
