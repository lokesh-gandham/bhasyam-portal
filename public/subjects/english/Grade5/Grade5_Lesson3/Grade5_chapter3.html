<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Assessments</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @font-face {
            font-family: 'CCSYBold';
            src: url('./assets/CCSYBOLD.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "CCSYBold";
            font-weight: 400;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(70deg, rgb(224, 255, 246), rgb(253, 237, 252));
            background-size: 5px 5px;
        }

        .app {
            height: 100vh;
            display: flex;
        }

        /* Continuous Minimalist Sidebar Workspace - Right border removed */
        .sidebar {
            width: 300px;
            padding: 25px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0px;
        }

        /* Clean Typographic Rows — completely cardless layout */
        .island-btn {
            display: flex;
            align-items: center;
            height: 75px;
            padding: 16px 20px;
            font-size: 20px;
            cursor: pointer;
            color: #02425f;
            background: transparent;
            border: none;
            box-shadow: none;
            border-radius: 0;
            position: relative;
            overflow: visible;
            z-index: 1;

            /* High-end interpolation transitions */
            transition: color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Dynamic Morphing Left Bar Layer */
        .island-btn::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%) scaleY(0.3);
            width: 4px;
            height: 24px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s ease,
                transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                background-color 0.3s ease;
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 2;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Minimalist Icon Node without borders or ticks */
        .option-num {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #02425f;
            background: transparent;
            border: none;
            box-shadow: none;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), color 0.3s ease;
        }

        /* No text hiding logic needed since ticks are eradicated */
        .option-num span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Hover Actions */
        .island-btn:hover {
            color: #4a5568;
        }

        .island-btn:hover .option-left {
            transform: translateX(6px);
        }

        .island-btn:hover .option-num {
            color: #4a5568;
        }

        /* ACTIVE SELECTION STATE - Dynamic scaling highlight shift */
        .island-btn.active::before {
            opacity: 1;
            transform: translateY(-50%) scaleY(1);
        }

        .island-btn.active .option-left {
            transform: translateX(12px) scale(1.04);
        }

        /* Medium-Light Distinct Chromatic Accents per category */
        .o1.active {
            color: #f97316;
        }

        .o1.active::before {
            background-color: #f97316;
        }

        .o1.active .option-num {
            color: #f97316;
        }

        .o2.active {
            color: #0284c7;
        }

        .o2.active::before {
            background-color: #0284c7;
        }

        .o2.active .option-num {
            color: #0284c7;
        }

        .o3.active {
            color: #16a34a;
        }

        .o3.active::before {
            background-color: #16a34a;
        }

        .o3.active .option-num {
            color: #16a34a;
        }

        .o6.active {
            color: #ca8a04;
        }

        .o6.active::before {
            background-color: #ca8a04;
        }

        .o6.active .option-num {
            color: #ca8a04;
        }

        .o5.active {
            color: #db2777;
        }

        .o5.active::before {
            background-color: #db2777;
        }

        .o5.active .option-num {
            color: #db2777;
        }

        .o4.active {
            color: #4f46e5;
        }

        .o4.active::before {
            background-color: #4f46e5;
        }

        .o4.active .option-num {
            color: #4f46e5;
        }

        .main {
            flex: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* MOBILE DRAWER INFRASTRUCTURE */
        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:1065px) {
            .app {
                flex-direction: column;
            }

            .sidebar {
                display: none;
            }

            .menu-btn {
                display: block;
                position: fixed;
                top: 10px;
                right: 15px;
                font-size: 20px;
                background: #ffffff;
                color: #4a5568;
                border: 1px solid #e2e8f0;
                border-radius: 12px;
                padding: 10px 16px;
                cursor: pointer;
                z-index: 5000;
            }

            .offcanvas {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.05);
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
                display: none;
                z-index: 4000;
            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: 300px;
                height: 100%;
                background: #ffffff;
                padding: 0px;
                transform: translateX(100%);
                transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                overflow-y: hidden;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
                padding: 20px;
            }
        }

        /* Height Distribution Matrix Maintained Perfectly */
        @media (min-width: 900px) and (max-height: 800px) {
            .app {
                transform: scaleY(0.95);
                transform-origin: top center;
                height: calc(100vh / 0.95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {
            .app {
                transform: scaleY(0.9);
                transform-origin: top center;
                height: calc(100vh / 0.9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {
            .app {
                transform: scaleY(0.85);
                transform-origin: top center;
                height: calc(100vh / 0.85);
            }
        }

        @media (min-width: 900px) and (max-height: 500px) {
            .app {
                transform: scaleY(0.8);
                transform-origin: top center;
                height: calc(100vh / 0.8);
            }
        }

        /* Boundary Breakpoint Distributions Retained */
        @media screen and (min-width: 1025px) and (max-width: 1440px) {
            .sidebar {
                width: 280px;
                padding: 26px 22px;
                gap: 24px;
            }

            .island-btn {
                font-size: 22px;
                padding: 18px 10px;
            }
        }

        @media screen and (min-width: 1441px) and (max-width: 1920px) {
            .sidebar {
                width: 360px;
                padding: 30px 26px;
                gap: 28px;
            }

            .island-btn {
                font-size: 26px;
                padding: 20px 26px;
            }

            .option-left {
                gap: 18px;
            }
        }

        @media screen and (min-width: 1921px) {
            .sidebar {
                width: 400px;
                padding: 36px 30px;
                gap: 36px;
            }

            .island-btn {
                font-size: clamp(21px, 1.2vw, 26px);
                padding: 24px 30px;
            }

            .option-left {
                gap: 22px;
            }
        }
    </style>
</head>

<body>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <div class="app">

        <div class="sidebar">
            <div class="island-btn o1 active" onclick="openIsland(0)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-file-signature"></i></span></div>
                    <div>Fill In The Blanks</div>
                </div>
            </div>

            <div class="island-btn o2" onclick="openIsland(1)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-list-check"></i></span></div>
                    <div>Correct Options</div>
                </div>
            </div>

            <div class="island-btn o3" onclick="openIsland(2)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-clone"></i></span></div>
                    <div>Word Family</div>
                </div>
            </div>

            <div class="island-btn o6" onclick="openIsland(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-equals"></i></span></div>
                    <div>Synonyms</div>
                </div>
            </div>

            <div class="island-btn o5" onclick="openIsland(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-arrows-left-right"></i></span></div>
                    <div>Antonyms</div>
                </div>
            </div>

            <div class="island-btn o4" onclick="openIsland(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-play"></i></span></div>
                    <div>Correct Verb</div>
                </div>
            </div>
        </div>

        <div class="main">
            <iframe id="contentFrame" src="./exercises/FTB.html"></iframe>
        </div>

    </div>

    <!-- Mobile Navigation Panel -->
    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">
        <div class="offcanvas-panel" onclick="event.stopPropagation()">
            <div class="island-btn o1 active" onclick="mobileOpen(0)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-file-signature"></i></span></div>
                    <div>Fill In The Blanks</div>
                </div>
            </div>

            <div class="island-btn o2" onclick="mobileOpen(1)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-list-check"></i></span></div>
                    <div>Correct Options</div>
                </div>
            </div>

            <div class="island-btn o3" onclick="mobileOpen(2)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-clone"></i></span></div>
                    <div>Word Family</div>
                </div>
            </div>

            <div class="island-btn o6" onclick="mobileOpen(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-equals"></i></span></div>
                    <div>Synonyms</div>
                </div>
            </div>

            <div class="island-btn o5" onclick="mobileOpen(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-arrows-left-right"></i></span></div>
                    <div>Antonyms</div>
                </div>
            </div>

            <div class="island-btn o4" onclick="mobileOpen(5)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-play"></i></span></div>
                    <div>Correct Verb</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const sidebarButtons = document.querySelectorAll(".sidebar .island-btn");
        const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");
        const frame = document.getElementById("contentFrame");

        const pages = [
            "./exercises/FTB.html",
            "./exercises/mcq.html",
            "./exercises/word-family.html",
            "./exercises/synonym.html",
            "./exercises/antonym.html",
            "./exercises/verb.html",
        ];

        function openIsland(index) {
            sidebarButtons.forEach(btn => btn.classList.remove("active"));
            sidebarButtons[index].classList.add("active");

            mobileButtons.forEach(btn => btn.classList.remove("active"));
            mobileButtons[index].classList.add("active");

            frame.src = pages[index];
        }

        function toggleMenu() {
            if (window.innerWidth > 1065) return;
            document.getElementById("offcanvas").classList.toggle("show");
        }

        function mobileOpen(i) {
            openIsland(i);
            toggleMenu();
        }
    </script>
</body>

</html>
