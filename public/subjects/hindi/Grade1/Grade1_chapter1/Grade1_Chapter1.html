<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* font-family: "Tiro Devanagari Hindi" !important; */
    }

    body {
      /* display: none !important; */
      height: 100vh;
      overflow: hidden;
      /* background: url("assets/images/bg4l4bg3.png")  no-repeat center center; */
      /* background:
      linear-gradient(
        135deg,
        #FFF8EE,
        #FDF1E4,
        #F7E7D3
      ); */
      background: #FFF8F0;
      /* background-color: rgb(201, 234, 255); */
      background-size: cover;
      /* display: none !important; */

      font-family: "Tiro Devanagari Hindi" !important;
    }

    /* .color4{
      display: none !important;
    } */

    .app {
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 280px;
      padding: 22px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px !important;


    }

    /* MAIN CARD */
    .nav-card {

      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      padding: 16px;
      border-radius: 28px;

      /* background: linear-gradient(135deg,#ffe6f0,#f3e7ff) !important; */
      /* background-color: rgb(255, 242, 216);
      backdrop-filter: blur(12px);

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.15),
        inset 0 2px 6px rgba(255, 255, 255, 0.8); */

      display: flex;
      flex-direction: column;
      gap: 40px !important;
    }

    /* TOP BAR */
    .top-tab {
      height: 40px;
      border-radius: 20px;
      background: linear-gradient(135deg, #8ec5fc, #e0c3fc);
    }

    /* DEFAULT BUTTON (ALL SAME FIRST) */
    .menu-btn {
      height: 56px;
      border-radius: 18px;

      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 0;

      font-size: 23px !important;
      font-weight: 400;

      background: linear-gradient(135deg, #f3f4f7, #e6e9f0);

      color: #4b5563;
      border: 3px solid transparent;

      cursor: pointer;

      box-shadow:
        0 2px 4px rgba(138, 138, 138, 0.425),
        0 4px 10px rgba(180, 179, 179, 0.466);

      transition: all 0.25s ease;
    }

    /* ICON */
    .icon-box {
      width: 32px;
      height: 32px;
      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px !important;

      /* background: rgba(0,0,0,0.05); */
    }

    /* ACTIVE ONLY HAS COLOR */
    .menu-btn.active {
      color: #2f4f4f;
      border: 3px solid rgb(255, 255, 255) !important;
      box-shadow:
        0 2px 4px rgba(138, 138, 138, 0.8),
        0 4px 10px rgba(139, 139, 139, 0.726);
    }

    /* .color1 {
  background: #ffdede;
}

.color2 {
  background: #dff4ff;
}

.color3 {
  background: #e8fff7;
}

.color4 {
  background: #f2e8ff;
}

.color5 {
  background: #eeffd9;
} */



    /* MODERN CLEAN COLORS */

    /* .color1 {
      background: #ffa4a4;
    }

    .color2 {
      background: #83c9ff;
    }

    .color3 {
      background: #ffbf01;
    }

    .color4 {
      background: #fc04ef;
    }

    .color5 {
      background: linear-gradient(135deg,
          #f1e4ff,
          #d9b8ff);
    } */

    .color1,
    .color2,
    .color3,
    .color4,
    .color5 {
      background: #ffffff;
      /* muted beige */
      color: #7A6E63;
      border: 3px solid transparent;
    }

    .menu-btn.active {
      background: #FFA4A4 !important;
      /* pink */
      color: #2f4f4f;
      border: 3px solid #fff !important;
      box-shadow:
        0 2px 4px rgba(138, 138, 138, 0.8),
        0 4px 10px rgba(139, 139, 139, 0.7);
    }

    /* Active icon */
    .menu-btn.active .icon-box {
      color: #fff;
    }


    /* ACTIVE ICON */
    .menu-btn.active .icon-box {
      /* background: rgba(255,255,255,0.25); */
      color: #fff;
    }


    .main {
      flex: 1;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .menu-toggle {
      display: none;
    }

    .offcanvas {
      display: none;
    }

    @media(max-width:900px) {




      .app {
        flex-direction: column;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: -100%;
        /* start hidden */
        width: 100%;
        height: 100vh;

        padding: 20px;
        background: #FFF8F0;

        transition: left 0.35s ease;
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* OPEN STATE */
      .sidebar.active {
        left: 0;
      }

      .menu-toggle {
        display: block;
        position: fixed;
        top: 15px;
        right: 16px;
        font-size: 24px;
        background: #5b6cff;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 6px 12px;
        cursor: pointer;
        z-index: 5000;
      }


      .menu-btn {
        transition: transform 0.15s ease;
      }

      .menu-btn:active {
        transform: scale(0.96);
      }

      .icon-box {
        width: 28px;
        height: 28px;
        font-size: 18px !important;
        /* background-color: yellow !important; */
        margin-left: 10px !important;
      }

    }

    @media (min-width: 900px) and (max-height: 800px) {
      .app {
        transform: scaleY(0.95);
        transform-origin: top center;
        height: calc(100vh / 0.95);
      }
    }

    @media (min-width: 900px) and (max-height: 700px) {
      .app {
        transform: scaleY(0.9);
        transform-origin: top center;
        height: calc(100vh / 0.9);
      }
    }

    @media (min-width: 900px) and (max-height: 600px) {
      .app {
        transform: scaleY(0.85);
        transform-origin: top center;
        height: calc(100vh / 0.85);
      }
    }

    @media (min-width: 900px) and (max-height: 500px) {
      .app {
        transform: scaleY(0.8);
        transform-origin: top center;
        height: calc(100vh / 0.8);
      }
    }

    /* ============================= */
    /* Desktop / Monitor (1025–1440) */
    /* ============================= */
    @media screen and (min-width: 1025px) and (max-width: 1440px) {

      .sidebar {
        width: 300px;
        gap: 28px;
      }

      .menu-btn {
        height: 75px;
        font-size: clamp(15px, 1vw, 17px);
        padding: 0 20px;
      }

      .icon-box {
        width: 48px;
        height: 48px;
        font-size: 21px;
      }
    }

    /* ============================= */
    /* Large Monitors (1441–1920) */
    /* ============================= */
    @media screen and (min-width: 1441px) and (max-width: 1920px) {

      .sidebar {
        width: 360px;
        gap: 32px;
        padding: 28px 16px;
        /* background-color: yellow !important; */
      }

      .nav-card {
        max-width: 100%;
        width: 100%;
        padding: 0;
        margin: 0;
      }

      .menu-btn {
        height: 95px;
        font-size: 30px !important;
        padding: 0 24px;
        border-radius: 22px;
      }

      .icon-box {
        width: 55px;
        height: 55px;
        font-size: 24px;
      }
    }




    /* ============================= */
    /* Extra Large Screens / 4K */
    /* ============================= */
    @media screen and (min-width: 1921px) {

      .sidebar {
        width: 450px;
        gap: 40px;
        padding: 36px 20px;
      }

      .nav-card {
        max-width: 100%;
        width: 100%;
        padding: 0;
        margin: 0;
      }

      .menu-btn {
        height: 110px;
        font-size: 30px !important;
        padding: 0 30px;
        border-radius: 26px;
      }

      .icon-box {
        width: 65px;
        height: 65px;
        font-size: 28px;
      }

      iframe {
        border-radius: 14px;
      }
    }
  </style>
  <link rel="stylesheet" href="assets/CSS/walkman-font.css">
</head>

<body>

  <button class="menu-toggle" onclick="toggleMenu()">☰</button>

  <div class="app">


    <div class="sidebar">
      <div class="nav-card">


        <div class="menu-btn color1 active" onclick="openPage(0)">
          <div class="icon-box"><i class="fa-solid fa-circle-check"></i></div>
         सही विकल्प
        </div>

        <div class="menu-btn color2" onclick="openPage(1)">
          <div class="icon-box"><i class="fa-solid fa-puzzle-piece"></i></div>
          आगे वाला अक्षर
        </div>

        <div class="menu-btn color3" onclick="openPage(2)">
          <div class="icon-box"><i class="fa-solid fa-object-group"></i></div>
          बाद वाला अक्षर
        </div>

        <div class="menu-btn color4" onclick="openPage(3)">
          <div class="icon-box"><i class="fa-solid fa-chalkboard-user"></i></div>
          बीच वाला अक्षर
        </div>









      </div>

    </div>

    <div class="main">
      <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>
    </div>

  </div>

  <div class="menu-btn color1 active" onclick="mobileOpen(0, this)">
    <div class="icon-box"><i class="fa-solid fa-circle-check"></i></div>
    Choose Correct
  </div>


  <div class="menu-btn color2" onclick="mobileOpen(1, this)">
    <div class="icon-box"><i class="fa-solid fa-scale-balanced"></i></div>
    True / False
  </div>

  <div class="menu-btn color3" onclick="mobileOpen(2, this)">
    <div class="icon-box"><i class="fa-solid fa-chalkboard-user"></i></div>
    One Example
  </div>

  <div class="menu-btn color4" onclick="mobileOpen(3, this)">
    <div class="icon-box"><i class="fa-solid fa-chalkboard-user"></i></div>
    One Example
  </div>












  <script>

    const sidebarButtons = document.querySelectorAll(".sidebar .menu-btn");
    const mobileButtons = document.querySelectorAll(".offcanvas .menu-btn");
    const frame = document.getElementById("contentFrame");

    const pages = [

      "./exercises/mcq.html",
      "./exercises/first.html",
      "./exercises/last.html",
      "./exercises/one_example2.html",



    ];

    function openPage(index) {

      sidebarButtons.forEach(btn => btn.classList.remove("active"));
      sidebarButtons[index].classList.add("active");

      frame.src = pages[index];

      // ✅ close menu on mobile
      if (window.innerWidth <= 900) {
        document.querySelector(".sidebar").classList.remove("active");
      }
    }

    function toggleMenu() {
      if (window.innerWidth > 900) return;
      document.querySelector(".sidebar").classList.toggle("active");
    }


  </script>



</body>

</html>
