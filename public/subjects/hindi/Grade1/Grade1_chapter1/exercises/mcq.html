<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/CSS/mcq.css">
  <link rel="stylesheet" href="../assets/CSS/walkman-font.css">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</head>

<body>
  <div class="app">
    <div class="template">
      <div id="imgLoader" class="img-loader"></div>
  <div class="instruction">
  जो एक जैसे हैं, उन पर (✓) गोला लगाइए।
</div>
      <div class="title" id="titleText"></div>
      <div class="animal-wrap">
        <img id="animalImg" class="animal-img" />
      </div>
      <div class="options" id="optionsBox"></div>

      <nav class="quiz-nav">
        <button class="prev" id="prevBtn">❮ पिछला</button>
        <button class="next" id="nextBtn">अगला ❯</button>
      </nav>
    </div>
  </div>

  <div id="answerPopup" class="kid-popup">
    <div class="kid-card">
      <div class="kid-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <div id="finalPopup">
    <div class="final-kid-box">
      <h2> शाबाश !</h2>
      <p id="finalScore"></p>
      <div id="stars"></div>
      <button class="playAgain-btn" onclick="location.reload()">
         फिर से शुरू करें
      </button>
    </div>
  </div>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
  <script src="../assets/JavaScript/mcq.js"></script>
</body>

</html>
