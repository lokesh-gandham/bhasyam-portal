<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Livvic", sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            /* background: url("./assets/images/bg4l4bg3.png"); */
            /* background: #fff7c7; */
            background: #fff5d6;
            background-size: 100% 100%;
        }

        .app {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            justify-content: center;
            align-items: center;
            height: clamp(60px, 8vh, 90px);
            margin: 0 clamp(10px, 3vw, 20px);
        }

        .nav-group {
            position: relative;
            display: flex;

            align-items: center;
            justify-content: center;
            /* center items */
            gap: clamp(30px, 1.8vw, 40px);
            width: 100%;
            max-width: 1150px;
            padding: clamp(6px, 1vw, 10px);
        }

        /* .nav-slider {
            position: absolute;
            top: 10px;
            left: 10px;
            height: calc(100% - 20px);
            border-radius: 12px;
            transition: transform .45s cubic-bezier(.65, .05, .36, 1), width .35s ease;
            z-index: 1;
        } */
        .nav-slider {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            border-radius: 40px;
            transition: transform .45s cubic-bezier(.65, .05, .36, 1), width .35s ease;
            z-index: 0;
        }

        .island-btn {
            flex: 1;
            max-width: 240px;
            /* 🔥 prevents over-stretch */
            min-width: 140px;
            /* 🔥 keeps readable */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 1vw, 8px);
            padding: clamp(10px, 1.5vw, 16px) clamp(12px, 2vw, 20px);
            font-size: clamp(15px, 1.2vw, 20px);
            font-weight: 600;
            cursor: pointer;
            border-radius: 40px;
            white-space: nowrap;
            transition: .3s;
            color: #2b2b2b;
            /* background: #f4f4f4; */
            /* box-shadow: 0 6px 14px rgba(0, 0, 0, .12); */
            transform: translateY(0);

            position: relative;
            z-index: 2;
        }

        .island-btn:hover {
            transform: translateY(-1px) scale(1);
            opacity: .9;
        }

        /* .island-btn.active {
    border: 5px solid #ffffff;
    color: white;
} */

        .island-btn.active {

            /* color: white; */
            color: rgb(77, 77, 77);

            background: linear-gradient(135deg, #ff7eb3, #ff758c);

            border: 4px dashed #ffffff;

            border-radius: 70px;

            box-shadow:
                0 6px 0 #ff4f81,
                0 9px 18px rgba(0, 0, 0, 0.15);

            transform: translateY(-1px) scale(1.01);
            padding: 13px 13px;
        }


        /* 🌸 SOFT PEACH (UPGRADED) */
        /* ☁️ LIGHT SKY BLUE */
        .nav-group .island-btn:nth-child(1) {
            background: #c5deff;
        }

        /* 🍑 LIGHT APRICOT */
        .nav-group .island-btn:nth-child(2) {
            background: #ffd9c7;
        }

        /* 🌿 LIGHT MINT */
        .nav-group .island-btn:nth-child(3) {
            background: #bbffee;
        }

        /* 🌸 LIGHT ROSE */
        .nav-group .island-btn:nth-child(4) {
            background: #ffb8c9;
        }

        /* 💜 LIGHT LAVENDER */
        .nav-group .island-btn:nth-child(5) {
            background: #d3abff;
        }

        .nav-group .island-btn:nth-child(6) {
            background: #c0e8ff;
        }

        .main {
            flex: 1;
            padding: clamp(6px, 1vw, 10px) 0 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:900px) {



            .topbar {
                display: none;

            }

            .menu-btn {
                display: block;
                position: fixed;
                top: clamp(10px, 2vw, 15px);
                right: clamp(10px, 2vw, 15px);
                font-size: clamp(18px, 3vw, 24px);
                background: #f59e0b;
                color: white;
                border: none;
                border-radius: 8px;
                padding: clamp(4px, 1vw, 6px) clamp(8px, 2vw, 12px);
                cursor: pointer;
                z-index: 5000;
            }

            .offcanvas {
                position: fixed;
                inset: 0;
                background: linear-gradient(135deg,
                        #fdfbfb 0%,
                        #f7f3ff 25%,
                        #eef9f6 50%,
                        #fff6f0 75%,
                        #f0f7ff 100%);
                display: none;
                z-index: 4000;
                margin-top: 5%;

            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: clamp(220px, 70vw, 280px);
                height: 100%;
                /* background: linear-gradient(135deg, 
        #fdfbfb 0%,
        #f7f3ff 25%,
        #eef9f6 50%,
        #fff6f0 75%,
        #f0f7ff 100%
    ); */
                padding: clamp(20px, 4vw, 30px);
                padding-top: clamp(60px, 10vw, 80px);
                display: flex;
                flex-direction: column;
                gap: clamp(20px, 5vw, 50px);
                transform: translateX(100%);
                transition: .35s;
                overflow-y: auto;


            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
                display: flex;
                justify-content: flex-start;
                /* ✅ vertical center */
                align-items: flex-start;
                /* ✅ horizontal center */
            }

            .offcanvas-panel .island-btn {
                flex: none;
                width: 100%;
                justify-content: flex-start;
                padding: clamp(14px, 3vw, 18px) clamp(16px, 3vw, 20px);
                border-radius: 40px;
                font-size: clamp(13px, 2.5vw, 15px);
            }

            .offcanvas-panel .island-btn:nth-child(1) {
                background: #FFE3C8;
            }

            .offcanvas-panel .island-btn:nth-child(2) {
                background: #CFE8FF;
            }

            .offcanvas-panel .island-btn:nth-child(3) {
                background: #D7F7DC;
            }

            .offcanvas-panel .island-btn:nth-child(4) {
                background: #FFF2C6;
            }

            .offcanvas-panel .island-btn:nth-child(5) {
                background: #FFD8DD;
            }

            .offcanvas-panel .island-btn:nth-child(6) {
                background: #DCD6FF;
            }
        }

        /* 1200px → 1599px */

        @media (min-width: 1200px) and (max-width: 1599px) {

            .island-btn {
                font-size: 15px !important;
            }

        }



        /* 1600 → 1899 */
        @media (min-width: 1600px) {
            .nav-group {
                transform: scale(1.3);
                transform-origin: top center;
            }
        }

        /* 1900 → 2299 */
        @media (min-width: 1900px) {
            .nav-group {
                transform: scale(1.4);
                transform-origin: top center;
            }
        }

        /* 2300 → 2599 */
        @media (min-width: 2300px) {
            .nav-group {
                transform: scale(1.5);
                transform-origin: top center;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/CSS/walkman-font.css">
</head>

<body>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <div class="app">

        <div class="topbar">
            <div class="nav-group">

                <div class="nav-slider" id="navSlider"></div>

                <div class="island-btn active" onclick="openIsland(0)">
                    <i class="fa-solid fa-list-check"></i>
                    सही विकल्प
                </div>

                <div class="island-btn" onclick="openIsland(1)">
                    <i class="fa-solid fa-gamepad"></i>
                    आगे वाला शब्द
                </div>

                <div class="island-btn" onclick="openIsland(2)">
                    <i class="fa-solid fa-dice"></i>
                    बाद वाला शब्द
                </div>

                <div class="island-btn" onclick="openIsland(3)">
                    <i class="fa-solid fa-meteor"></i>
                    बीच वाला शब्द
                </div>

                <!-- <div class="island-btn" onclick="openIsland(4)">
                    <i class="fa-solid fa-scale-balanced"></i>
               मिलान कीजिए
                </div> -->



            </div>
        </div>

        <div class="main">
            <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>
        </div>

    </div>

    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

        <div class="offcanvas-panel" onclick="event.stopPropagation()">

            <div class="island-btn active" onclick="mobileOpen(0)">
                <i class="fa-solid fa-list-check"></i>
                सही विकल्प
            </div>

            <div class="island-btn" onclick="mobileOpen(1)">
                <i class="fa-solid fa-gamepad"></i>
                आगे वाला शब्द लिखिए
            </div>


            <div class="island-btn" onclick="mobileOpen(2)">
                <i class="fa-solid fa-dice"></i>
                बाद वाला शब्द लिखिए
            </div>


            <div class="island-btn" onclick="mobileOpen(3)">
                <i class="fa-solid fa-meteor"></i>
                बीच वाला शब्द लिखिए
            </div>
            <!-- 
            <div class="island-btn" onclick="mobileOpen(4)">
                <i class="fa-solid fa-scale-balanced"></i>
              मिलान कीजिए
            </div> -->



        </div>

    </div>

    <script>

        const sidebarButtons = document.querySelectorAll(".topbar .island-btn");
        const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");

        const slider = document.getElementById("navSlider");
        const frame = document.getElementById("contentFrame");

        const pages = [
            "./exercises/mcq.html",
            "./exercises/FTB.html",
            "./exercises/FTB2.html",
            "./exercises/FTB3.html",
            //    "./exercises/match.html",


        ];

        function moveSlider(el) {
            slider.style.width = el.offsetWidth + "px";
            slider.style.transform = `translateX(${el.offsetLeft}px)`;
        }

        function openIsland(index) {
            sidebarButtons.forEach(btn => btn.classList.remove("active"));
            sidebarButtons[index].classList.add("active");

            mobileButtons.forEach(btn => btn.classList.remove("active"));
            mobileButtons[index].classList.add("active");

            moveSlider(sidebarButtons[index]);
            frame.src = pages[index];
        }

        function toggleMenu() {
            if (window.innerWidth > 900) return;
            document.getElementById("offcanvas").classList.toggle("show");
        }

        function mobileOpen(i) {
            openIsland(i);
            toggleMenu();
        }

        window.onload = () => {
            moveSlider(sidebarButtons[0]);
        };

    </script>




</body>

</html>
