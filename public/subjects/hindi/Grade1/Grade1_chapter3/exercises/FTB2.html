<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../assets/CSS/FTB2.css">
    <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>
     
    <div class="main-container">
            <div class="instruction">
  निम्नलिखित अक्षरों के बाद वाला अक्षर चुनिए।
</div>
        <div class="quiz-container">

            <div class="question-area">
                <h2 id="questionText"></h2>
            </div>

            <div class="image-area">
                <img id="questionImage">
            </div>

          <div class="answer-wrapper">

    <input
        type="text"
        id="answerInput"
        readonly
        placeholder="उत्तर चुनिए"
    >

    <button id="checkAnswerBtn">
        जाँच
    </button>

</div>

<div class="input-area" id="inputsContainer"></div>

            <div class="nav-buttons">
                <button id="prevBtn">  <i class="fa-solid fa-circle-arrow-left"></i>  पिछला </button>
                <button id="nextBtn">अगला  <i class="fa-solid fa-circle-arrow-right"></i></button>
            </div>

        </div>
    </div>

    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
          <h2> बहुत बढ़िया!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">दोबारा खेलें</button>
        </div>
    </div>

    <script src="../assets/JavaScript/FTB2.js"></script>

</body>

</html>
