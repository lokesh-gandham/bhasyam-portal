<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Livvic", sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
        /* background: #f3f8ff; */
        background: #f4f1ea;   /* soft beige */
      background-size: 100% 100%;
    }

    .app {
      height: 100vh;
      display: flex;
      /* background: rgba(211, 226, 228, 0.795); */
    }

    .sidebar {
      width: 300px;

      padding: 25px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;

      gap: 0px;
    }

    /* OPTION BUTTON */

    .island-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 85px;
      padding: 16px 20px;
    border-radius: 40px;
      font-size: 18px !important;
      font-weight: 600;
      cursor: pointer;

      background: linear-gradient(135deg, rgba(221, 216, 216, 0.7), rgba(179, 178, 178, 0.4));
      backdrop-filter: blur(10px);

      color: #416969;
    

      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      transition: 0.3s;
    }

    .option-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: white;
      /* display: none; */
    }

    .island-btn.active .option-check {
      background: #22c55e;
      border-color: #22c55e;
      color: white;
    }

    .island-btn.active .option-check::after {
      content: "★";
    }

    .island-btn:hover {
      transform: scale(1.05);
    }

    .option-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .option-num {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: 700;
      color: white;
      font-size: 16px;
      background: #9ca3af;
    }

    .island-btn:hover {
      transform: translateY(-2px);
    }

    /* ACTIVE */

    .island-btn.active {
      color: #1f2937;
      box-shadow:
        0 12px 22px rgba(0, 0, 0, .2),
        0 0 0 6px white;
    }

    /* ACTIVE TICK */

    .island-btn.active .option-num {
      background: #22c55e;
      font-size: 20px;
    }

    .island-btn.active .option-num::after {
      content: "✔";
    }

    .island-btn.active .option-num span {
      display: none;
    }
.o1.active {
  background: #ff9eb5;
}

.o2.active {
  background: #ffd86b;
}

.o3.active {
  background: #8df58d;
}

.o4.active {
  background: #73dcff;
}

.o5.active {
  background: #c79cff;
}
    .main {
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    /* MOBILE */

    .menu-btn {
      display: none;
    }

    .offcanvas {
      display: none;
    }

    @media(max-width:1065px) {

      .app {
        flex-direction: column;
      }

      .sidebar {
        display: none;
      }

      .menu-btn {
        display: block;
        position: fixed;
        top: 8px;
        right: 15px;
        font-size: 26px;
        background: #e9a106;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 6px 12px;
        cursor: pointer;
        z-index: 5000;
      }

      .offcanvas {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .45);
        display: none;
        z-index: 4000;
      }

      .offcanvas.show {
        display: block;
      }

      .offcanvas-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: 300px;
        height: 100%;
        background: #f1f5f9;
        padding: 0px;
        padding-top: 0px;
        transform: translateX(100%);
        transition: .3s;
        overflow-y: hidden;
      }

      .offcanvas.show .offcanvas-panel {
        transform: translateX(0);
        padding: 65px 20px 20px;
      }

      .offcanvas-panel .island-btn {
        margin-bottom: 12px;
      }
      .island-btn {
        font-size: 15px;
      }

    }

    @media (min-width: 900px) and (max-height: 800px) {
      .app {
        transform: scaleY(0.95);
        transform-origin: top center;
        height: calc(100vh / 0.95);
      }
    }

    @media (min-width: 900px) and (max-height: 700px) {
      .app {
        transform: scaleY(0.9);
        transform-origin: top center;
        height: calc(100vh / 0.9);
      }
    }

    @media (min-width: 900px) and (max-height: 600px) {
      .app {
        transform: scaleY(0.85);
        transform-origin: top center;
        height: calc(100vh / 0.85);
      }
    }

    @media (min-width: 900px) and (max-height: 500px) {
      .app {
        transform: scaleY(0.8);
        transform-origin: top center;
        height: calc(100vh / 0.8);
      }
    }

    /* ============================= */
    /* Desktop / Monitor (1025–1440) */
    /* ============================= */
    @media screen and (min-width: 1025px) and (max-width: 1440px) {

      .sidebar {
        width: 320px;
        padding: 26px 22px;
        gap: 24px;
        /* background-color: yellow; */
      
      }

      .island-btn {
        font-size: 20px;
        padding: 40px 15px;
      }

      .option-left i {
        font-size: 24px;
      }

      .option-check {
        width: 35px;
        height: 35px;
        font-size: 18px;
      }

      .option-num {
        width: 46px;
        height: 46px;
        font-size: 17px;
      }
    }

    /* ============================= */
    /* Large Monitors (1441–1920) */
    /* ============================= */
    @media screen and (min-width: 1441px) and (max-width: 1920px) {

      .sidebar {
        width: 360px;
        padding: 30px 15px;
        gap: 28px;
        
      }

      .island-btn {
        font-size: 20px;
        padding: 45px 26px;
        border-radius: 40px;
      }

      .option-left {
        gap: 18px;
      }

      .option-left i {
        font-size: 36px;
      }

      .option-check {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }

      .option-num {
        width: 52px;
        height: 52px;
        font-size: 19px;
      }
    }

    /* ============================= */
    /* Extra Large Screens / 4K */
    /* ============================= */
    @media screen and (min-width: 1921px) {

      .sidebar {
        width: 420px;
        padding: 36px 20px;
        gap: 36px;
          /* background-color: yellow; */
      }

      .island-btn {
        font-size: 26px;
        padding: 50px 25px;
        border-radius: 40px;
        gap: 10px;
      }

      .option-left {
        gap: 22px;
      }

      .option-left i {
        font-size: 36px;
      }

      .option-check {
        width: 45px;
        height: 45px;
        font-size: 22px;
      }

      .option-num {
        width: 62px;
        height: 62px;
        font-size: 22px;
      }

      iframe {
        border-radius: 14px;
      }
    }
  </style>
  <link rel="stylesheet" href="assets/CSS/walkman-font.css">
</head>

<body>

  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <div class="app">

    <div class="sidebar">

      <div class="island-btn o1 active" onclick="openIsland(0)">
        <div class="option-left"> 
          <div class="option-check"></div>
  <i class="fa-solid fa-trophy"></i>
          <div>सही विकल्प</div>
        </div>
       
      </div>

      <div class="island-btn o2" onclick="openIsland(1)">
        <div class="option-left">
           <div class="option-check"></div>
         <i class="fa-solid fa-check-double"></i>
          <div>आगे वाला शब्द </div>
        </div>
        <!-- <div class="option-check"></div> -->
      </div>

      <div class="island-btn o3" onclick="openIsland(2)">
        <div class="option-left">
           <div class="option-check"></div>
          <i class="fa-solid fa-shuffle"></i>
          <div>बाद वाला शब्द </div>
        </div>
        <!-- <div class="option-check"></div> -->
      </div>

      <div class="island-btn o4" onclick="openIsland(3)">
        <div class="option-left">
           <div class="option-check"></div>
          <i class="fa-solid fa-pen-to-square"></i>
          <div>बीच वाला शब्द </div>
        </div>
        <!-- <div class="option-check"></div> -->
      </div>
    

     <!-- <div class="island-btn o5" onclick="openIsland(4)">
        <div class="option-left">
           <div class="option-check"></div>
        <i class="fa-solid fa-puzzle-piece"></i>
          <div>मिलान कीजिए</div>
        </div>
      </div> -->
    </div>
<!-- </div> -->
    <div class="main">
      <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>
    </div>

  </div>

  <!-- MOBILE -->

  <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

    <div class="offcanvas-panel" onclick="event.stopPropagation()">

      <div class="island-btn o1 active" onclick="mobileOpen(0)">
        <div class="option-left">
           <div class="option-check"></div>
       <i class="fa-solid fa-trophy"></i>
          <div>सही विकल्प</div>
        </div>
       
      </div>

      <div class="island-btn o2" onclick="mobileOpen(1)">
        <div class="option-left">
           <div class="option-check"></div>
          <i class="fa-solid fa-check-double"></i>
          <div>आगे वाला शब्द </div>
        </div>
        <!-- <div class="option-check"></div> -->
      </div>

      <div class="island-btn o3" onclick="mobileOpen(2)">
        <div class="option-left">
           <div class="option-check"></div>
           <i class="fa-solid fa-shuffle"></i>
          <div>बाद वाला शब्द </div>
        </div>
        <!-- <div class="option-check"></div> -->
      </div>

      <div class="island-btn o4" onclick="mobileOpen(3)">
        <div class="option-left">
           <div class="option-check"></div>
          <i class="fa-solid fa-pen-to-square"></i>
          <div>बीच वाला शब्द </div>
        </div>
        <!-- <div class="option-check"></div> -->
      </div>
    
    <!-- <div class="island-btn o5" onclick="mobileOpen(4)">
        <div class="option-left">
           <div class="option-check"></div>
         <i class="fa-solid fa-puzzle-piece"></i>
          <div> मिलान कीजिए</div>
        </div>

      </div> -->
    </div>

  <!-- </div> -->
  </div>

  <script>

    const sidebarButtons = document.querySelectorAll(".sidebar .island-btn");
    const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");

    const frame = document.getElementById("contentFrame");

    const pages = [
      "./exercises/mcq.html",
      "./exercises/FTB.html",
      "./exercises/FTB2.html",
      "./exercises/FTB3.html",
    //  "./exercises/match.html"
    ];

    function openIsland(index) {

      sidebarButtons.forEach(btn => btn.classList.remove("active"));
      sidebarButtons[index].classList.add("active");

      mobileButtons.forEach(btn => btn.classList.remove("active"));
      mobileButtons[index].classList.add("active");

      frame.src = pages[index];

    }

    function toggleMenu() {

      if (window.innerWidth > 1065) return;

      document.getElementById("offcanvas").classList.toggle("show");

    }

    function mobileOpen(i) {

      openIsland(i);
      toggleMenu();

    }

  </script>




</body>

</html>
