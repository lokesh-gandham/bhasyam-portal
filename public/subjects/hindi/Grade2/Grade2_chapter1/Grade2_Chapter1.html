<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Tiro Devanagari Hindi";

    }

    body {
      height: 100vh;
      overflow: hidden;
      background: url("./assets/images/bg-2.png");
      background-size: 100% 100%;
    }

    .app {
      height: 100vh;
      display: flex;
      background: #f9fdf233;
    }

    .sidebar {
      width: 300px;

      padding: 25px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;

      gap: 0px;
    }

    /* OPTION BUTTON - NEW MODERN DESIGN */

    .island-btn {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 95px;

      padding: 18px;
      border-radius: 28px;

      cursor: pointer;
      transition: all 0.25s ease;

      background: rgba(202, 202, 202, 0.42);
      border: 3px solid #fff;

      backdrop-filter: blur(6px);

      color: #2d3748;

      box-shadow:
        0 10px 20px rgba(0, 0, 0, 0.08);
    }

    /* REMOVE WHITE CIRCLE BOX */

    .option-check {
      display: none;
    }

    /* LEFT CONTENT */

    .option-left {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;
      text-align: center;
    }

    /* NEW ICON STYLE */

    .option-left i {
      font-size: 28px;
      width: 54px;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: rgba(255, 255, 255, 0.6);
      border: 2px solid #fff;

      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.5),
        0 4px 10px rgba(0, 0, 0, 0.08);
    }

    /* TEXT */

    .option-left div:last-child {
      font-size: 22px;
      font-weight: 500;
      line-height: 1.2;
    }

    /* HOVER */

    .island-btn:hover {
      transform: translateY(-4px) scale(1.02);
    }

    /* ACTIVE */

    .island-btn.active {
      transform: scale(1.03);

      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.15);

      color: #111827;
    }

    /* ACTIVE COLORS */

    .o1.active {
      background: linear-gradient(135deg, #ffbccf, #ffa3ba);
    }

    .o2.active {
      background: linear-gradient(135deg, #ffe6a2, #ffd66f);
    }

    .o3.active {
      background: linear-gradient(135deg, #addcd8, #89cac5);
    }

    .o4.active {
      background: linear-gradient(135deg, #d8f7ff, #b7ebff);
    }

    .main {
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    /* MOBILE */

    .menu-btn {
      display: none;
    }

    .offcanvas {
      display: none;
    }

    @media(max-width:1065px) {

      .app {
        flex-direction: column;
      }

      .sidebar {
        display: none;
      }

      .menu-btn {
        display: block;
        position: fixed;
        top: 8px;
        right: 15px;
        font-size: 26px;
        background: #e9a106;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 6px 12px;
        cursor: pointer;
        z-index: 5000;
      }

      .offcanvas {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .45);
        display: none;
        z-index: 4000;
      }

      .offcanvas.show {
        display: block;
      }

      .offcanvas-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: 300px;
        height: 100%;
        background: #f1f5f9;
        padding: 0px;
        padding-top: 0px;
        transform: translateX(100%);
        transition: .3s;
        overflow-y: hidden;
      }

      .offcanvas.show .offcanvas-panel {
        transform: translateX(0);
        padding: 65px 20px 20px;
      }

      .offcanvas-panel .island-btn {
        margin-bottom: 12px;
      }

      .island-btn {
        font-size: 15px;
      }

    }

    @media (min-width: 900px) and (max-height: 800px) {
      .app {
        transform: scaleY(0.95);
        transform-origin: top center;
        height: calc(100vh / 0.95);
      }
    }

    @media (min-width: 900px) and (max-height: 700px) {
      .app {
        transform: scaleY(0.9);
        transform-origin: top center;
        height: calc(100vh / 0.9);
      }
    }

    @media (min-width: 900px) and (max-height: 600px) {
      .app {
        transform: scaleY(0.85);
        transform-origin: top center;
        height: calc(100vh / 0.85);
      }
    }

    @media (min-width: 900px) and (max-height: 500px) {
      .app {
        transform: scaleY(0.8);
        transform-origin: top center;
        height: calc(100vh / 0.8);
      }
    }

    /* ============================= */
    /* Desktop / Monitor (1025–1440) */
    /* ============================= */
    @media screen and (min-width: 1025px) and (max-width: 1440px) {

      .sidebar {
        width: 320px;
        padding: 26px 22px;
        gap: 24px;
        /* background-color: yellow; */

      }

      .option-left div:last-child {
        font-size: 22px;
        font-weight: 500;
        line-height: 1.2;
      }

      .island-btn {
        font-size: 20px;
        padding: 40px 15px;
      }

      .option-left i {
        font-size: 24px;
      }

      .option-check {
        width: 35px;
        height: 35px;
        font-size: 18px;
      }

      .option-num {
        width: 46px;
        height: 46px;
        font-size: 17px;
      }
    }

    /* ============================= */
    /* Large Monitors (1441–1920) */
    /* ============================= */
    @media screen and (min-width: 1441px) and (max-width: 1920px) {

      .sidebar {
        width: 360px;
        padding: 30px 15px;
        gap: 28px;

      }

      .island-btn {
        font-size: 20px;
        padding: 45px 26px;
        border-radius: 40px;
      }

      .option-left div:last-child {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.2;
    }

      .option-left {
        gap: 18px;
      }

      .option-left i {
        font-size: 36px;
      }

      .option-check {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }

      .option-num {
        width: 52px;
        height: 52px;
        font-size: 19px;
      }
    }

    /* ============================= */
    /* Extra Large Screens / 4K */
    /* ============================= */
    @media screen and (min-width: 1921px) {

      .sidebar {
        width: 420px;
        padding: 36px 20px;
        gap: 36px;
        /* background-color: yellow; */
      }

      .island-btn {
        font-size: 26px;
        padding: 50px 25px;
        border-radius: 40px;
        gap: 10px;
      }

      .option-left div:last-child {
      font-size: 30px;
      font-weight: 500;
      line-height: 1.2;
    }

      .option-left {
        gap: 22px;
      }

      .option-left i {
        font-size: 36px;
      }

      .option-check {
        width: 45px;
        height: 45px;
        font-size: 22px;
      }

      .option-num {
        width: 62px;
        height: 62px;
        font-size: 22px;
      }

      iframe {
        border-radius: 14px;
      }
    }
  </style>
  <link rel="stylesheet" href="assets/CSS/walkman-font.css">
</head>

<body>

  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <div class="app">

    <div class="sidebar">

      <div class="island-btn o1 active" onclick="openIsland(0)">
        <div class="option-left">
          <div class="option-check"></div>
          <i class="fa-solid fa-medal"></i>
          <div>सही विकल्प</div>
        </div>

      </div>

      <div class="island-btn o2" onclick="openIsland(1)">
        <div class="option-left">
          <div class="option-check"></div>
          <i class="fa-solid fa-arrow-right"></i>
          <div>आगे वाला शब्द </div>
        </div>
        <!-- <div class="option-check"></div> -->
      </div>

      <div class="island-btn o3" onclick="openIsland(2)">
        <div class="option-left">
          <div class="option-check"></div>
          <i class="fa-solid fa-forward-step"></i>
          <div>बाद वाला शब्द </div>
        </div>
        <!-- <div class="option-check"></div> -->
      </div>

      <div class="island-btn o4" onclick="openIsland(3)">
        <div class="option-left">
          <div class="option-check"></div>
          <i class="fa-solid fa-grip"></i>
          <div>बीच वाला शब्द </div>
        </div>
        <!-- <div class="option-check"></div> -->
      </div>


      <!-- <div class="island-btn o5" onclick="openIsland(4)">
        <div class="option-left">
           <div class="option-check"></div>
        <i class="fa-solid fa-puzzle-piece"></i>
          <div>मिलान कीजिए</div>
        </div>
      </div> -->
    </div>
    <!-- </div> -->
    <div class="main">
      <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>
    </div>

  </div>

  <!-- MOBILE -->

  <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

    <div class="offcanvas-panel" onclick="event.stopPropagation()">

      <div class="island-btn o1 active" onclick="mobileOpen(0)">
        <div class="option-left">
          <div class="option-check"></div>
          <i class="fa-solid fa-medal"></i>
          <div>सही विकल्प</div>
        </div>

      </div>

      <div class="island-btn o2" onclick="mobileOpen(1)">
        <div class="option-left">
          <div class="option-check"></div>
          <i class="fa-solid fa-arrow-right"></i>
          <div>आगे वाला शब्द </div>
        </div>
        <!-- <div class="option-check"></div> -->
      </div>

      <div class="island-btn o3" onclick="mobileOpen(2)">
        <div class="option-left">
          <div class="option-check"></div>
          <i class="fa-solid fa-forward-step"></i>
          <div>बाद वाला शब्द </div>
        </div>
        <!-- <div class="option-check"></div> -->
      </div>

      <div class="island-btn o4" onclick="mobileOpen(3)">
        <div class="option-left">
          <div class="option-check"></div>
          <i class="fa-solid fa-grip"></i>
          <div>बीच वाला शब्द </div>
        </div>
        <!-- <div class="option-check"></div> -->
      </div>

      <!-- <div class="island-btn o5" onclick="mobileOpen(4)">
        <div class="option-left">
           <div class="option-check"></div>
         <i class="fa-solid fa-puzzle-piece"></i>
          <div> मिलान कीजिए</div>
        </div>

      </div> -->
    </div>

    <!-- </div> -->
  </div>

  <script>

    const sidebarButtons = document.querySelectorAll(".sidebar .island-btn");
    const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");

    const frame = document.getElementById("contentFrame");

    const pages = [
      "./exercises/mcq.html",
      "./exercises/FTB.html",
      "./exercises/FTB2.html",
      "./exercises/FTB3.html",
      //  "./exercises/match.html"
    ];

    function openIsland(index) {

      sidebarButtons.forEach(btn => btn.classList.remove("active"));
      sidebarButtons[index].classList.add("active");

      mobileButtons.forEach(btn => btn.classList.remove("active"));
      mobileButtons[index].classList.add("active");

      frame.src = pages[index];

    }

    function toggleMenu() {

      if (window.innerWidth > 1065) return;

      document.getElementById("offcanvas").classList.toggle("show");

    }

    function mobileOpen(i) {

      openIsland(i);
      toggleMenu();

    }

  </script>




</body>

</html>
