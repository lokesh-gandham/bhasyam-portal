    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Tiro Devanagari Hindi", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* background: linear-gradient(145deg, #fef9e6, #fff4e0); */
        }

        /* MAIN CONTAINER */
        .main-container {
            width: 750px;
        }

        /* QUIZ CARD */
        .quiz-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .instruction {
            font-size: 30px;
            position: relative;
            width: fit-content;
            padding: 10px 60px;
            margin-top: -20px;
            border-radius: 24px;
            font-weight: 400;
            color: #4b4b63;
            background: #fdd1d1;
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 24px rgba(120, 120, 180, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            overflow: hidden;
            margin: auto;
        }

        /* QUESTION */
        .question-area {
            width: 100%;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .question-area h2 {
            font-size: 40px;
            font-weight: 400;
            color: #2f4f4f;
            text-align: center;
        }

        /* OPTIONS WRAP - 4 big buttons with image + text (replaces input-area) */
        .options-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 25px 0 20px;
            flex-wrap: wrap;
        }

        .option-btn {
            width: 160px;
            height: auto;
            min-height: 160px;
            border: none;
            border-radius: 28px;
            /* background: #ffd089; */
            background: #ffd089a1;
            border: 3px solid #fff;
            font-size: 32px;
            font-weight: 600;
            color: #2f4f4f;
            cursor: pointer;
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.15);
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 8px;
        }

        .option-btn img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.2));
        }

        .option-btn span {
            font-size: 40px;
            font-weight: 500;
            /* padding: 4px 12px; */
            border-radius: 40px;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-5px);
            background: #ffd48a;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        .correct-option {
            background: #b8f5c8 !important;
            color: #146c2e !important;
            box-shadow: 0 4px 0 #4cae4c;
            transform: translateY(2px);
            pointer-events: none;
            opacity: 1 !important;
        }

        .wrong-option {
            background: #ffd6d6 !important;
            color: #b42323 !important;
            animation: wrongBlink 0.3s ease 2;
        }

        @keyframes wrongBlink {

            0%,
            100% {
                background: #ffd6d6;
            }

            50% {
                background: #ffaaaa;
            }
        }

        /* NAV BUTTONS - exactly same style */
        .nav-buttons {
            width: 100%;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        .nav-buttons button {
            width: 150px;
            height: 60px;
            padding: 14px 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            border: 3px solid #ffffff;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            background-size: 200% 200%;
            transition: .15s ease;
        }

        #prevBtn {
            background: linear-gradient(#86cfe5, #66b6d2);
            box-shadow: 0 4px 0 #3e9dbb;
        }

        #nextBtn {
            background: linear-gradient(#ffc37a, #f7a24f);
            box-shadow: 0 4px 0 #e08634;
        }

        .nav-buttons button:active {
            transform: translateY(2px);
        }

        .nav-buttons button:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none;
        }

        /* POPUP - exactly same as original */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .kid-card {
            background: #fff;
            width: 320px;
            padding: 25px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 0 #ffd966, 0 25px 40px rgba(0, 0, 0, 0.2);
            animation: kidPop 0.6s ease;
        }

        .kid-icon {
            font-size: 4.5em;
            margin-bottom: 10px;
            animation: emojiBounce .9s infinite alternate;
        }

        .kid-card h3 {
            font-size: 2em;
            margin-bottom: 8px;
            color: #2f9e44;
        }

        .kid-card p {
            font-size: 1.2em;
            color: #1c7c54;
        }

        .kid-correct .kid-card {
            background: #e6fffa;
            border: 6px solid #38d9a9;
        }

        .kid-wrong .kid-card {
            background: #fff5f5;
            border: 6px solid #ffa8a8;
        }

        .kid-wrong h3 {
            color: #e03131;
        }

        .kid-wrong p {
            color: #c92a2a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(.3) rotate(-10deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.1) rotate(5deg);
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }

        /* FINAL POPUP - same as original */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .final-kid-box {
            background: linear-gradient(135deg, #fff7d6, #e6fff5);
            padding: 30px 35px;
            border-radius: 35px;
            text-align: center;
            width: 450px;
            animation: finalBounce .8s ease;
            box-shadow: 0 20px 0 #ffd43b, 0 30px 50px rgba(0, 0, 0, 0.2);
        }

        .final-kid-box h2 {
            font-size: 2.2em;
            color: #2f9e44;
            margin-bottom: 10px;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
        }

        #stars {
            font-size: 2.3em;
            margin: 12px 0;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 12px;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 20px;
                overflow: auto;
                height: auto;
                align-items: center;

        function getOptionImage(letter) {
            return letterImageMap[letter] || "../assets/images/kamal.png";
        }

        let currentQuestion = 0;
        let score = 0;
        const answers = new Array(questions.length).fill(null);
        const optionsWrap = document.getElementById("optionsWrap");
        const questionText = document.getElementById("questionText");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

  
// ===== AUDIO =====
let audioCtx = null;

function playCorrectSound() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.frequency.value = 880;
    gainNode.gain.value = 0.2;
    oscillator.type = "sine";

    oscillator.start();

    gainNode.gain.exponentialRampToValueAtTime(
      0.00001,
      audioCtx.currentTime + 0.5,
    );

    oscillator.stop(audioCtx.currentTime + 0.5);
  } catch (e) {
    console.log("Audio error:", e);
  }
}

function playWrongSound() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.frequency.value = 440;
    gainNode.gain.value = 0.25;
    oscillator.type = "sawtooth";

    oscillator.start();

    gainNode.gain.exponentialRampToValueAtTime(
      0.00001,
      audioCtx.currentTime + 0.4,
    );

    oscillator.stop(audioCtx.currentTime + 0.4);
  } catch (e) {
    console.log("Audio error:", e);
  }
}

// Initialize audio
function initAudioOnFirstClick() {
  if (audioCtx) return;

  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const buffer = audioCtx.createBuffer(1, 1, 22050);
    const source = audioCtx.createBufferSource();

    source.buffer = buffer;
    source.connect(audioCtx.destination);
    source.start();
  } catch (e) {
    console.log("Audio init error:", e);
  }
}

document.body.addEventListener("click", initAudioOnFirstClick, { once: true });

        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } });
        }

        function showPopup(isCorrect) {
            const popup = document.getElementById("answerPopup");
            const icon = document.getElementById("popupIcon");
            const title = document.getElementById("popupTitle");
            const msg = document.getElementById("popupMsg");

            popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
            popup.style.display = "flex";

            if (isCorrect) {
                icon.textContent = "🐵";
                title.textContent = "वाह!";
                msg.textContent = "आपने कमाल कर दिया!";
            } else {
                icon.textContent = "🙈";
                title.textContent = "अरे!";
                msg.textContent = "थोड़ा और सोचिए!";
            }

            setTimeout(() => {
                popup.style.display = "none";
            }, 1400);
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            questionText.innerText = q.question;

            optionsWrap.innerHTML = "";

            // If already answered, show all options but disabled with correct highlighted
            if (answers[currentQuestion] !== null) {
                let opts = [...q.options];
                // Shuffle for variety
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                opts.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    if (opt === q.answer) {
                        btn.classList.add("correct-option");
                    }
                    const img = document.createElement("img");
                    img.src = getOptionImage(opt);
                    img.alt = opt;
                    const span = document.createElement("span");
                    span.innerText = opt;
                    btn.appendChild(img);
                    btn.appendChild(span);
                    btn.disabled = true;
                    optionsWrap.appendChild(btn);
                });
                prevBtn.disabled = currentQuestion === 0;
                nextBtn.disabled = false;
                return;
            }

            // Not answered yet - create clickable options
            let opts = [...q.options];
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }

            opts.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                const img = document.createElement("img");
                img.src = getOptionImage(opt);
                img.alt = opt;
                const span = document.createElement("span");
                span.innerText = opt;
                btn.appendChild(img);
                btn.appendChild(span);

                btn.onclick = () => {
                    if (answers[currentQuestion] !== null) return;

                    if (opt === q.answer) {
                        // CORRECT ANSWER
                        answers[currentQuestion] = opt;
                        score++;
                        playCorrectSound();
                        smallConfetti();
                        showPopup(true);

                        // Disable all buttons and mark correct one
                        const allBtns = document.querySelectorAll(".option-btn");
                        allBtns.forEach(b => {
                            b.disabled = true;
                            b.onclick = null;
                            if (b.querySelector("span").innerText === q.answer) {
                                b.classList.add("correct-option");
                            }
                        });

                        nextBtn.disabled = false;

                        if (answers.every(a => a !== null)) {
                            setTimeout(showFinal, 800);
                        }
                    } else {
                        // WRONG ANSWER - only flash wrong, don't disable
                        playWrongSound();
                        showPopup(false);
                        btn.classList.add("wrong-option");
                        setTimeout(() => {
                            btn.classList.remove("wrong-option");
                        }, 500);
                    }
                };
                optionsWrap.appendChild(btn);
            });

            prevBtn.disabled = currentQuestion === 0;
            nextBtn.disabled = false;
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1 && answers[currentQuestion] !== null) {
                currentQuestion++;
                loadQuestion();
            } else if (currentQuestion === questions.length - 1 && answers[currentQuestion] !== null) {
                if (answers.every(a => a !== null)) {
                    showFinal();
                }
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function showFinal() {
            const popup = document.getElementById("finalPopup");
            document.getElementById("finalScore").textContent = `आपके अंक: ${score} / ${questions.length}`;

            let starRating = "";
            const percent = (score / questions.length) * 100;
            if (percent === 100) starRating = "🌟🌟🌟🌟🌟";
            else if (percent >= 80) starRating = "🌟🌟🌟🌟 ⭐";
            else if (percent >= 60) starRating = "🌟🌟🌟 ✨";
            else if (percent >= 40) starRating = "🌟🌟 🌱";
            else starRating = "🌟 कोशिश जारी रखें!";

            document.getElementById("stars").textContent = starRating;
            popup.style.display = "flex";
            bigConfetti();
        }

        nextBtn.onclick = nextQuestion;
        prevBtn.onclick = prevQuestion;

        // Initialize
        loadQuestion();
    </script>
