    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Tiro Devanagari Hindi", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* background: linear-gradient(145deg, #fef9e6, #fff4e0); */
        }

        /* MAIN CONTAINER */
        .main-container {
            width: 750px;
        }

        /* QUIZ CARD */
        .quiz-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .instruction {
            font-size: 30px;
            position: relative;
            width: fit-content;
            padding: 10px 60px;
            margin-top: -20px;
            border-radius: 24px;
            font-weight: 400;
            color: #4b4b63;
            background: #fdd1d1;
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 24px rgba(120, 120, 180, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            overflow: hidden;
            margin: auto;
            text-align: center;
        }

        /* QUESTION */
        .question-area {
            width: 100%;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .question-area h2 {
            font-size: 40px;
            font-weight: 400;
            color: #2f4f4f;
            text-align: center;
        }

        /* IMAGE AREA - REMOVED (hidden) */
        .image-area {
            display: none;
        }

        /* INPUT AREA */
        .input-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* OPTIONS WRAP - 4 BIG BUTTONS WITH IMAGES */
        .options-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .option-btn {
            width: 140px;
            height: 140px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffffff, #f8f8ff);
            font-size: 40px;
            font-weight: 700;
            color: #3b3b5c;
            cursor: pointer;
            border: 3px solid #89cac5;
            box-shadow: inset 0 3px 8px rgba(255, 255, 255, .9), 0 8px 18px rgba(0, 0, 0, 0.151);
            transition: .25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .option-btn img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.2));
            border-radius: 12px;
        }

        .option-btn span {
            font-size: 40px;
            font-weight: 500;
            /* background: rgba(255, 248, 220, 0.8); */
            padding: 2px 12px;
            border-radius: 30px;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-5px);
            background: #ffeac6;
        }

        .option-btn:active:not(:disabled) {
            transform: scale(1);
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
            transform: none;
        }

        .correct-option {
            background: linear-gradient(145deg, #dfffe5, #bdf7c7) !important;
            border-color: #58d68d !important;
            color: #157a2e !important;
            opacity: 1 !important;
        }

        .wrong-option {
            background: linear-gradient(145deg, #ffe4e4, #ffcaca) !important;
            border-color: #ff8b8b !important;
            color: #c12222 !important;
            animation: wrongBlink 0.3s ease 2;
        }

        @keyframes wrongBlink {

            0%,
            100% {
                background: #ffe4e4;
            }

            50% {
                background: #ffaaaa;
            }
        }

        /* NAV BUTTONS */
        .nav-buttons {
            width: 100%;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        .nav-buttons button {
            width: 150px;
            height: 60px;
            padding: 14px 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            border: 3px solid #ffffff;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: .15s ease;
        }

        #prevBtn {
            background: linear-gradient(#86cfe5, #66b6d2);
            box-shadow: 0 4px 0 #3e9dbb;
        }

        #nextBtn {
            background: linear-gradient(#ffc37a, #f7a24f);
            box-shadow: 0 4px 0 #e08634;
        }

        .nav-buttons button:active {
            transform: translateY(2px);
        }

        .nav-buttons button:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none;
        }

        /* POPUP */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .kid-card {
            background: #fff;
            width: 320px;
            padding: 25px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 0 #ffd966, 0 25px 40px rgba(0, 0, 0, 0.2);
            animation: kidPop 0.6s ease;
        }

        .kid-icon {
            font-size: 4.5em;
            margin-bottom: 10px;
            animation: emojiBounce .9s infinite alternate;
        }

        .kid-card h3 {
            font-size: 2em;
            margin-bottom: 8px;
            color: #2f9e44;
        }

        .kid-card p {
            font-size: 1.2em;
            color: #1c7c54;
        }

        .kid-correct .kid-card {
            background: #e6fffa;
            border: 6px solid #38d9a9;
        }

        .kid-wrong .kid-card {
            background: #fff5f5;
            border: 6px solid #ffa8a8;
        }

        .kid-wrong h3 {
            color: #e03131;
        }

        .kid-wrong p {
            color: #c92a2a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(.3) rotate(-10deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.1) rotate(5deg);
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }

        /* FINAL POPUP */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .final-kid-box {
            background: linear-gradient(135deg, #fff7d6, #e6fff5);
            padding: 30px 35px;
            border-radius: 35px;
            text-align: center;
            width: 450px;
            animation: finalBounce .8s ease;
            box-shadow: 0 20px 0 #ffd43b, 0 30px 50px rgba(0, 0, 0, 0.2);
        }

        .final-kid-box h2 {
            font-size: 2.2em;
            color: #2f9e44;
            margin-bottom: 10px;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-weight: 600;
        }

        #stars {
            font-size: 2.3em;
            margin: 12px 0;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 12px;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

    <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>
    <div class="main-container">
        <div class="instruction">
            निम्नलिखित अक्षरों के बाद वाला अक्षर चुनिए।
        </div>
        <div class="quiz-container">
            <div class="question-area">
                <h2 id="questionText"></h2>
            </div>

            <!-- Image area removed (hidden) -->

            <div class="input-area">
                <div class="options-wrap" id="optionsWrap"></div>
            </div>

            <div class="nav-buttons">
                <button id="prevBtn"><i style="margin-right: 5px;" class="fa-solid fa-angles-left"></i> पिछला </button>
                <button id="nextBtn">अगला <i style="margin-left: 5px;" class="fa-solid fa-angles-right"></i></button>
            </div>
        </div>
    </div>

    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎊 कमाल कर दिया!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()"> पुनः खेलें</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        // ==================== QUESTIONS (UPDATED) ====================
        const questions = [
            { question: "Q1. अ ______", answer: "आ", options: ["आ", "इ", "उ", "अ"] },
            { question: "Q2. इ ______", answer: "ई", options: ["ई", "इ", "उ", "ऊ"] },
            { question: "Q3. उ ______", answer: "ऊ", options: ["ऊ", "ऋ", "इ", "उ"] },
            { question: "Q4. ऋ ______", answer: "ए", options: ["ए", "ऐ", "ऋ", "ऊ"] },
            { question: "Q5. ए ______", answer: "ऐ", options: ["ऐ", "ए", "ओ", "औ"] },
            { question: "Q6. ओ ______", answer: "औ", options: ["औ", "ओ", "अं", "अः"] },
            { question: "Q7. अं ______", answer: "अः", options: ["अः", "अं", "औ", "आ"] },
            { question: "Q8. आ ______", answer: "इ", options: ["इ", "ई", "आ", "उ"] },
            { question: "Q9. क ______", answer: "ख", options: ["ख", "म", "ग", "क"] },
            { question: "Q10. ग ______", answer: "घ", options: ["घ", "ज", "ट", "ग"] },
            { question: "Q11. ख ______", answer: "ग", options: ["च", "ग", "द", "ख"] },
            { question: "Q12. घ ______", answer: "ड़", options: ["ड़", "फ", "ल", "घ"] },
            { question: "Q13. च ______", answer: "छ", options: ["छ", "न", "प", "च"] },
            { question: "Q14. ज ______", answer: "झ", options: ["थ", "झ", "य", "ज"] },
            { question: "Q15. छ ______", answer: "ज", options: ["ल", "ज", "व", "छ"] },
            { question: "Q16. झ ______", answer: "ञ", options: ["ञ", "ह", "र", "झ"] },
            { question: "Q17. ट ______", answer: "ठ", options: ["ठ", "ड", "ढ", "ट"] },
            { question: "Q18. फ ______", answer: "ब", options: ["ब", "प", "म", "फ"] },
            { question: "Q19. भ ______", answer: "म", options: ["म", "ब", "फ", "भ"] },
            { question: "Q20. ढ ______", answer: "ण", options: ["ण", "ट", "ठ", "ढ"] },
            { question: "Q21. त ______", answer: "थ", options: ["थ", "त", "द", "ध"] },
            { question: "Q22. ड ______", answer: "ढ", options: ["ढ", "ठ", "ण", "ड"] },
            { question: "Q23. द ______", answer: "ध", options: ["ध", "थ", "न", "द"] },
            { question: "Q24. ध ______", answer: "न", options: ["न", "त", "थ", "ध"] },
            { question: "Q25. य ______", answer: "र", options: ["र", "ल", "व", "य"] },
            { question: "Q26. ष ______", answer: "स", options: ["स", "श", "ह", "ष"] },
            { question: "Q27. त्र ______", answer: "ज्ञ", options: ["ज्ञ", "क्ष", "श", "त्र"] },
            { question: "Q28. स ______", answer: "ह", options: ["ह", "श", "ष", "स"] },
            { question: "Q29. र ______", answer: "ल", options: ["ल", "य", "व", "र"] }
        ];

        // Image URL mapping for each letter (using your existing assets)
        function getImageUrl(letter) {
            const imgMap = {
                "आ": "../assets/images/aam.png", "इ": "../assets/images/imli.png", "उ": "../assets/images/ullu.png", "अ": "../assets/images/anar.png",
                "ई": "../assets/images/ekha.png", "ऊ": "../assets/images/un.png", "ऋ": "../assets/images/rishi.png", "ए": "../assets/images/edi.png",
                "ऐ": "../assets/images/enak.png", "ओ": "../assets/images/okhali.png", "औ": "../assets/images/aurat.png", "अं": "../assets/images/angur.png",
                "अः": "../assets/images/boy-think.png", "क": "../assets/images/kamal.png", "ख": "../assets/images/khargosh.png", "ग": "../assets/images/gamla.png",
                "घ": "../assets/images/ghadi.png", "ड़": "../assets/images/damaru.png", "च": "../assets/images/chamach.png", "छ": "../assets/images/chhata.png",
                "ज": "../assets/images/jahaj.png", "झ": "../assets/images/jhula.png", "ञ": "../assets/images/boy-think.png", "ट": "../assets/images/tamater.png",
                "ठ": "../assets/images/thathera.png", "ड": "../assets/images/damaru.png", "ढ": "../assets/images/dhakkan.png", "ण": "../assets/images/boy-think.png",
                "त": "../assets/images/tarbuj.png", "थ": "../assets/images/tharmas.png", "द": "../assets/images/dant.png", "ध": "../assets/images/dhanush.png",
                "न": "../assets/images/nal.png", "प": "../assets/images/patang.png", "फ": "../assets/images/fal.png", "ब": "../assets/images/bakri.png",
                "भ": "../assets/images/bhalu.png", "म": "../assets/images/machhli.png", "य": "../assets/images/yagya.png", "र": "../assets/images/rath.png",
                "ल": "../assets/images/lattu.png", "व": "../assets/images/lattu.png", "श": "../assets/images/sahad.png", "ष": "../assets/images/satkond2.png",
                "स": "../assets/images/sun.png", "ह": "../assets/images/hal.png", "त्र": "../assets/images/trisul.png", "क्ष": "../assets/images/chhatriya.png",
                "ज्ञ": "../assets/images/rishi.png"
            };
            return imgMap[letter] || "../assets/images/kamal.png";
        }

        let currentQuestion = 0;
        let score = 0;
        const answers = new Array(questions.length).fill(null);
        const optionsWrap = document.getElementById("optionsWrap");
        const questionText = document.getElementById("questionText");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
      
// ===== AUDIO =====
let audioCtx = null;

function playCorrectSound() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.frequency.value = 880;
    gainNode.gain.value = 0.2;
    oscillator.type = "sine";

    oscillator.start();

    gainNode.gain.exponentialRampToValueAtTime(
      0.00001,
      audioCtx.currentTime + 0.5,
    );

    oscillator.stop(audioCtx.currentTime + 0.5);
  } catch (e) {
    console.log("Audio error:", e);
  }
}

function playWrongSound() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.frequency.value = 440;
    gainNode.gain.value = 0.25;
    oscillator.type = "sawtooth";

    oscillator.start();

    gainNode.gain.exponentialRampToValueAtTime(
      0.00001,
      audioCtx.currentTime + 0.4,
    );

    oscillator.stop(audioCtx.currentTime + 0.4);
  } catch (e) {
    console.log("Audio error:", e);
  }
}

// Initialize audio
function initAudioOnFirstClick() {
  if (audioCtx) return;

  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const buffer = audioCtx.createBuffer(1, 1, 22050);
    const source = audioCtx.createBufferSource();

    source.buffer = buffer;
    source.connect(audioCtx.destination);
    source.start();
  } catch (e) {
    console.log("Audio init error:", e);
  }
}

document.body.addEventListener("click", initAudioOnFirstClick, { once: true });

function smallConfetti() { confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } }); }
        function bigConfetti() { confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } }); }

        function showPopup(isCorrect) {
            const popup = document.getElementById("answerPopup");
            const icon = document.getElementById("popupIcon");
            const title = document.getElementById("popupTitle");
            const msg = document.getElementById("popupMsg");
            popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
            popup.style.display = "flex";
            if (isCorrect) {
                icon.textContent = "🐵";
                title.textContent = "वाह!";
                msg.textContent = "आपने कमाल कर दिया!";
            } else {
                icon.textContent = "🙈";
                title.textContent = "अरे!";
                msg.textContent = "थोड़ा और सोचिए!";
            }
            setTimeout(() => { popup.style.display = "none"; }, 1400);
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            questionText.innerText = q.question;
            optionsWrap.innerHTML = "";

            // If already answered, show all options but disabled, with correct one highlighted
            if (answers[currentQuestion] !== null) {
                let opts = [...q.options];
                // Shuffle for display consistency but keep all
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                opts.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    if (opt === q.answer) {
                        btn.classList.add("correct-option");
                    }
                    const img = document.createElement("img");
                    img.src = getImageUrl(opt);
                    img.alt = opt;
                    const span = document.createElement("span");
                    span.innerText = opt;
                    btn.appendChild(img);
                    btn.appendChild(span);
                    btn.disabled = true;
                    optionsWrap.appendChild(btn);
                });
                prevBtn.disabled = currentQuestion === 0;
                nextBtn.disabled = answers[currentQuestion] === null;
                return;
            }

            // Not answered yet - create clickable options
            let opts = [...q.options];
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }

            opts.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                const img = document.createElement("img");
                img.src = getImageUrl(opt);
                img.alt = opt;
                const span = document.createElement("span");
                span.innerText = opt;
                btn.appendChild(img);
                btn.appendChild(span);

                btn.onclick = () => {
                    if (answers[currentQuestion] !== null) return;

                    if (opt === q.answer) {
                        // CORRECT ANSWER
                        answers[currentQuestion] = opt;
                        score++;
                        playCorrectSound();
                        smallConfetti();
                        showPopup(true);

                        // Disable all buttons and mark correct one
                        const allBtns = document.querySelectorAll(".option-btn");
                        allBtns.forEach(b => {
                            b.disabled = true;
                            b.onclick = null;
                            if (b.querySelector("span").innerText === q.answer) {
                                b.classList.add("correct-option");
                            }
                        });

                        nextBtn.disabled = false;

                        if (answers.every(a => a !== null)) {
                            setTimeout(showFinal, 800);
                        }
                    } else {
                        // WRONG ANSWER - only flash wrong, don't disable
                        playWrongSound();
                        showPopup(false);
                        btn.classList.add("wrong-option");
                        setTimeout(() => {
                            btn.classList.remove("wrong-option");
                        }, 500);
                    }
                };
                optionsWrap.appendChild(btn);
            });

            prevBtn.disabled = currentQuestion === 0;
            nextBtn.disabled = answers[currentQuestion] === null;
        }

        function showFinal() {
            const popup = document.getElementById("finalPopup");
            document.getElementById("finalScore").textContent = `आपके अंक: ${score} / ${questions.length}`;
            let starsMsg = "👌👌👌";
            if (score === questions.length) starsMsg = "🌟🌟🌟🌟🌟 🎉";
            else if (score >= 25) starsMsg = "🌟🌟🌟🌟 ⭐";
            else if (score >= 18) starsMsg = "🌟🌟🌟 ✨";
            document.getElementById("stars").textContent = starsMsg;
            popup.style.display = "flex";
            bigConfetti();
        }

        nextBtn.onclick = () => {
            if (currentQuestion < questions.length - 1 && answers[currentQuestion] !== null) {
                currentQuestion++;
                loadQuestion();
            } else if (currentQuestion === questions.length - 1 && answers[currentQuestion] !== null) {
                if (answers.every(a => a !== null)) showFinal();
            }
        };

        prevBtn.onclick = () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        };

        loadQuestion();
    </script>
</body>

</html>
