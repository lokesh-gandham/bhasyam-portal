<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Tiro Devanagari Hindi";

        }

        body {
            height: 100vh;
            overflow: hidden;

            background: url("./assets/images/bg.png");
            background-size: 100% 100%;
        }

        .app {
            height: 100vh;
            display: flex;
            background: rgba(211, 226, 228, 0.25);
        }

        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {

            width: 300px;

            padding: 25px 25px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            gap: 16px;
        }

        /* =========================================
           BUTTON
        ========================================= */

        .island-btn {

            display: flex;
            align-items: center;

            gap: 14px;

            width: 100%;

            min-height: 50px;

            padding: 12px 18px;

            border-radius: 18px;

            font-size: 28px;
            font-weight: 500;

            cursor: pointer;

            transition: .3s ease;

            color: #8e8e8e;

            background:
                linear-gradient(to bottom,
                    rgba(218, 218, 218, 0.95),
                    rgba(239, 239, 239, 0.95));

            border: 2px solid #bdbdbd;

            opacity: .55;

            box-shadow:
                inset 0 2px 6px rgba(255, 255, 255, 0.8),
                0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .island-btn i {
            font-size: 20px;
            transition: .35s ease;
        }

        /* HOVER */

        .island-btn:hover {
            transform: translateY(-2px);
            opacity: .9;
        }

        /* ACTIVE */

        .island-btn.active {

            opacity: 1;

            transform: translateY(-4px);

            box-shadow:
                0 12px 22px rgba(0, 0, 0, .2),
                0 0 0 3px white;
        }

        .island-btn.active i {
            transform: scale(1.12);
        }

        /* ACTIVE COLORS */

        .o1.active {
            background: #ffdce5;
            border-color: #ffb6c8;
            color: #c95b7d;
        }

        .o2.active {
            background: #dff4ff;
            border-color: #9edfff;
            color: #438eb7;
        }

        .o3.active {
            background: #fff5cc;
            border-color: #ffe17c;
            color: #bc9822;
        }

        .o4.active {
            background: #dfffe0;
            border-color: #8fe18f;
            color: #2f8b3a;
        }

        .o5.active {
            background: #ffe7c8;
            border-color: #ffc67c;
            color: #d18d34;
        }

        /* =========================================
           MAIN
        ========================================= */

        .main {
            flex: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* =========================================
           MOBILE
        ========================================= */

        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:1065px) {

            .app {
                flex-direction: column;
            }

            .sidebar {
                display: none;
            }

            .menu-btn {

                display: block;

                position: fixed;

                top: 8px;
                right: 15px;

                font-size: 26px;

                background: #e9a106;

                color: white;

                border: none;

                border-radius: 10px;

                padding: 6px 12px;

                cursor: pointer;

                z-index: 5000;
            }

            .offcanvas {

                position: fixed;

                inset: 0;

                background: rgba(0, 0, 0, .45);

                display: none;

                z-index: 4000;
            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {

                position: absolute;

                right: 0;
                top: 0;

                width: 300px;
                height: 100%;

                background: #f1f5f9;

                padding: 65px 20px 20px;

                transform: translateX(100%);

                transition: .3s;

                overflow-y: hidden;

                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
            }
        }

        /* =========================================
           HEIGHT RESPONSIVE
        ========================================= */

        @media (min-width: 900px) and (max-height: 800px) {

            .app {
                transform: scaleY(.95);
                transform-origin: top center;
                height: calc(100vh / .95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {

            .app {
                transform: scaleY(.9);
                transform-origin: top center;
                height: calc(100vh / .9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {

            .app {
                transform: scaleY(.85);
                transform-origin: top center;
                height: calc(100vh / .85);
            }
        }

        /* =========================================
           DESKTOP / MONITOR
        ========================================= */

        @media screen and (min-width:1025px) and (max-width:1440px) {

            .sidebar {
                width: 320px;
                padding: 26px 22px;
                gap: 20px;
            }

            .island-btn {
                font-size: 30px;
                padding: 20px 15px;
                border-radius: 20px;
            }

            .island-btn i {
                font-size: 22px;
            }
        }

        /* =========================================
           LARGE MONITORS
        ========================================= */

        @media screen and (min-width:1441px) and (max-width:1920px) {

            .sidebar {
                width: 360px;
                padding: 30px 15px;
                gap: 24px;
            }

            .island-btn {
                font-size: 30px;
                padding: 22px 20px;
                border-radius: 22px;
            }

            .island-btn i {
                font-size: 30px;
            }
        }

        /* =========================================
           4K
        ========================================= */

        @media screen and (min-width:1921px) {

            .sidebar {
                width: 420px;
                padding: 36px 20px;
                gap: 28px;
            }

            .island-btn {
                font-size: 30px;
                padding: 24px 22px;
                border-radius: 26px;
            }

            .island-btn i {
                font-size: 34px;
            }

            iframe {
                border-radius: 14px;
            }
        }
    </style>

    <link rel="stylesheet" href="assets/CSS/walkman-font.css">
</head>

<body>

    <!-- MOBILE BUTTON -->

    <button class="menu-btn" onclick="toggleMenu()">
        ☰
    </button>

    <div class="app">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <!-- <div class="island-btn o1 active" onclick="openIsland(0)">
                <i class="fa-solid fa-book-open"></i>
                पढ़ो और लिखो
            </div> -->

            <div class="island-btn o1 active" onclick="openIsland(0)">
                <i class="fa-solid fa-circle-dot"></i>
                चित्रो पे गोला
            </div>

            <div class="island-btn o2" onclick="openIsland(1)">
                <i class="fa-solid fa-image"></i>
                चित्रो के नाम
            </div>

            <div class="island-btn o3" onclick="openIsland(2)">
                <i class="fa-solid fa-puzzle-piece"></i>
                चित्र मिलान
            </div>

            <div class="island-btn o4" onclick="openIsland(3)">
                <i class="fa-solid fa-check"></i>
                सही शब्द
            </div>

        </div>

        <!-- MAIN -->

        <div class="main">

            <iframe id="contentFrame" src="./exercises/circle.html"></iframe>

        </div>

    </div>

    <!-- MOBILE SIDEBAR -->

    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

        <div class="offcanvas-panel" onclick="event.stopPropagation()">

            <!-- <div class="island-btn o1 active" onclick="mobileOpen(0)">
                <i class="fa-solid fa-book-open"></i>
                पढ़ो और लिखो
            </div> -->

            <div class="island-btn o1 active" onclick="mobileOpen(0)">
                <i class="fa-solid fa-circle-dot"></i>
                चित्रो पे गोला
            </div>

            <div class="island-btn o2" onclick="mobileOpen(1)">
                <i class="fa-solid fa-image"></i>
                चित्रो के नाम
            </div>

            <div class="island-btn o3" onclick="mobileOpen(2)">
                <i class="fa-solid fa-puzzle-piece"></i>
                चित्र मिलान
            </div>

            <div class="island-btn o4" onclick="mobileOpen(3)">
                <i class="fa-solid fa-check"></i>
                सही शब्द
            </div>

        </div>

    </div>

    <script>

        const sidebarButtons =
            document.querySelectorAll(".sidebar .island-btn");

        const mobileButtons =
            document.querySelectorAll(".offcanvas .island-btn");

        const frame =
            document.getElementById("contentFrame");

        const pages = [

            // "./exercises/read-write.html",

            "./exercises/circle.html",

            "./exercises/picture-name.html",

            "./exercises/match.html",

            "./exercises/right-word.html"
        ];

        function openIsland(index) {

            sidebarButtons.forEach(btn =>
                btn.classList.remove("active")
            );

            sidebarButtons[index]
                .classList.add("active");

            mobileButtons.forEach(btn =>
                btn.classList.remove("active")
            );

            mobileButtons[index]
                .classList.add("active");

            frame.src = pages[index];
        }

        function toggleMenu() {

            if (window.innerWidth > 1065)
                return;

            document
                .getElementById("offcanvas")
                .classList.toggle("show");
        }

        function mobileOpen(i) {

            openIsland(i);

            toggleMenu();
        }

    </script>




</body>

</html>
