<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Tiro Devanagari Hindi";

    }

    body {

      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .app {

      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .template {

      width: min(1250px, 100%);

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 22px;
    }

    /* =========================================
       HEADING
    ========================================= */

    .instruction {

      padding: 10px 28px;

      border-radius: 18px;

      font-size: 30px;
      font-weight: 500;

      color: #4f4f4f;

      background: #f8e77f;

      text-align: center;

      box-shadow:
        0 6px 16px rgba(0, 0, 0, .08);
    }

    /* =========================================
       MATCH AREA
    ========================================= */

    .match-layout {

      width: 100%;

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      position: relative;

      min-height: auto;

      padding-inline: 50px;

      margin-top: 8px;

      gap: 70px;
    }

    .side {

      width: 32%;

      display: flex;

      flex-direction: column;

      justify-content: flex-start;

      gap: 55px;
    }

    .center-words {

      width: 18%;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 24px;

      padding-top: 12px;

      position: relative;

      z-index: 5;
    }

    .match-item {

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      position: relative;

      min-height: 120px;
    }

    .match-number {

      font-size: 28px;
      font-weight: 700;

      color: #555;

      width: 34px;
    }

    /* =========================================
       IMAGE BOX
    ========================================= */

    .img-box {

      width: 95px;
      height: 95px;

      border: 2px solid #ff6ba5;

      border-radius: 12px;

      background: transparent;

      display: flex;
      justify-content: center;
      align-items: center;

      cursor: pointer;

      transition: .2s;

      position: relative;
    }

    .img-box img {

      width: 78px;
      height: 78px;

      object-fit: contain;
    }

    /* =========================================
       WORD BOX
    ========================================= */

    .word-box {

      width: 140px;

      min-height: 56px;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 10px 18px;

      border-radius: 50px;

      background: #ecd7df;

      text-align: center;

      font-size: 30px;
      font-weight: 500;

      color: #555;

      cursor: pointer;

      transition: .2s;

      position: relative;

      z-index: 5;
    }

    /* =========================================
       STATES
    ========================================= */

    .active {

      transform: scale(1.06);

      box-shadow:
        0 0 0 4px #ff5f9f55;
    }

    .matched {

      border-color: #18bf54 !important;

      background: #dcffe7 !important;

      color: #10813a !important;
    }

    .wrong {

      border-color: red !important;

      background: #ffdede !important;

      animation: blink .5s ease;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .3;
      }
    }

    /* =========================================
       SVG LINE
    ========================================= */

    #lineSvg {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 0;
    }

    /* =========================================
       BUTTONS
    ========================================= */

    .navigation-btns {

      width: 100%;

      height: 80px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 20px;

      margin-top: 10px;

      flex-shrink: 0;

      position: relative;

      z-index: 3000;
    }

    .nav-btn {

      width: 150px;

      padding: 14px 26px;

      border: none;

      background: #ff4f9a;

      color: white;

      border-radius: 50px;

      font-size: 20px;
      font-weight: 500;

      cursor: pointer;

      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.18);

      flex-shrink: 0;
    }

    /* =========================================
       POPUP
    ========================================= */

    .kid-popup {

      position: fixed;

      inset: 0;

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 5000;
      /* 
      backdrop-filter: blur(4px); */
    }

    .popup-card {

      width: 320px;

      padding: 28px;

      border-radius: 30px;

      text-align: center;

      background: white;

      /* box-shadow:
        0 20px 50px rgba(0, 0, 0, .2); */
    }

    .popup-icon {

      width: 90px;
      height: 90px;

      border-radius: 50%;

      margin: auto;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 42px;

      margin-bottom: 15px;
    }

    .popup-card h2 {

      font-size: 32px;

      margin-bottom: 10px;
    }

    .popup-card p {
      font-size: 20px;
    }

    .popup-correct .popup-icon {

      background: #dff8e5;

      color: #22b455;
    }

    .popup-correct h2 {
      color: #189a48;
    }

    .popup-wrong .popup-icon {

      background: #ffe3e3;

      color: #ff4d4d;
    }

    .popup-wrong h2 {
      color: #e63946;
    }

    /* =========================================
       FINAL POPUP
    ========================================= */

    #finalPopup {

      position: fixed;

      inset: 0;

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 6000;

      /* backdrop-filter: blur(6px); */
    }

    .final-card {

      width: 420px;
      max-width: 92%;

      background: white;

      border-radius: 40px;

      padding: 35px;

      text-align: center;
    }

    .final-card h2 {

      font-size: 42px;

      color: #1ca34a;

      margin-bottom: 12px;
    }

    .final-card p {

      font-size: 24px;

      color: #4d5875;

      font-weight: 600;
    }

    #stars {

      font-size: 50px;

      margin: 20px 0;
    }

    .playAgain-btn {

      border: none;

      background:
        linear-gradient(135deg,
          #ffb14d,
          #ff8b2b);

      color: white;

      padding: 14px 35px;

      border-radius: 50px;

      font-size: 20px;
      font-weight: 600;

      cursor: pointer;
    }

    /* =========================================
📱 TABLETS (≤ 900px)
========================================= */

    @media (max-width:900px) {

      body {

        align-items: center;
        padding: 20px;
        overflow: hidden;
      }

      .template {

        width: 100%;

        gap: 18px;
      }

      .instruction {

        font-size: 24px;

        width: auto;

        padding: 10px 22px;
      }

      .match-layout {

        width: 70%;

        padding-inline: 25px;

        gap: 30px;
      }

      .side {

        width: 32%;

        gap: 40px;
      }

      .center-words {

        width: 22%;

        gap: 22px;
      }

      .match-item {

        min-height: 100px;
      }

      .img-box {

        width: 80px;
        height: 80px;
      }

      .img-box img {

        width: 65px;
        height: 65px;
      }

      .word-box {

        width: 120px;

        min-height: 50px;

        font-size: 30px;
      }

      .match-number {

        font-size: 22px;
      }

      .nav-btn {

        font-size: 16px;
        padding: 10px 18px;
        min-width: 130px;
        height: 48px;
      }

      .popup-card {

        width: 280px;

        padding: 22px;
      }

      .popup-card h2 {

        font-size: 24px;
      }

      .popup-card p {

        font-size: 16px;
      }

      .final-card {

        width: 90%;
        max-width: 340px;

        padding: 24px;
      }

      .final-card h2 {

        font-size: 32px;
      }

      .final-card p {

        font-size: 18px;
      }

      #stars {

        font-size: 34px;
      }
    }


    /* =========================================
📱 MOBILE (≤ 768px)
========================================= */

    @media (max-width:768px) {

      body {

        padding: 25px 10px;

        align-items: flex-start;

        overflow: hidden;
      }

      .app {

        min-width: 850px;
      }

      .template {

        width: 100%;
      }

      .instruction {

        font-size: 20px;

        line-height: 1.4;

        padding: 10px 18px;
      }

      .match-layout {

        flex-direction: row;

        align-items: flex-start;

        justify-content: space-between;

        padding-inline: 20px;

        gap: 20px;
      }

      .side {

        width: 32%;

        gap: 25px;
      }

      .center-words {

        width: 20%;

        gap: 18px;
      }

      .match-item {

        min-height: 85px;
      }

      .img-box {

        width: 68px;
        height: 68px;
      }

      .img-box img {

        width: 52px;
        height: 52px;
      }

      .word-box {

        width: 105px;

        min-height: 44px;

        font-size: 17px;

        padding: 8px 10px;
      }

      .match-number {

        font-size: 18px;

        width: 24px;
      }

      #lineSvg {

        display: block;
      }

      .navigation-btns {

        height: 70px;

        margin-top: 15px;
      }

      .nav-btn {

        min-width: 115px;

        height: 44px;

        font-size: 15px;

        padding: 8px 14px;
      }

      .popup-card {

        width: 250px;

        padding: 18px;
      }

      .popup-icon {

        width: 70px;
        height: 70px;

        font-size: 34px;
      }

      .popup-card h2 {

        font-size: 22px;
      }

      .popup-card p {

        font-size: 15px;
      }

      .final-card {

        width: 92%;

        padding: 20px;
      }

      .final-card h2 {

        font-size: 28px;
      }

      .final-card p {

        font-size: 16px;
      }

      #stars {

        font-size: 30px;
      }

      .playAgain-btn {

        font-size: 16px;

        padding: 10px 22px;
      }
    }


    /* =========================================
📱 SMALL PHONES (≤ 480px)
========================================= */

    @media (max-width:480px) {

      body {

        padding: 20px 6px 100px;
        overflow: hidden;
      }

      .app {

        min-width: 450px;
      }

      .instruction {

        font-size: 17px;

        padding: 10px 14px;
      }

      .match-layout {

        padding-inline: 12px;

        gap: 15px;
      }

      .side {

        gap: 18px;
      }

      .center-words {

        gap: 14px;
      }

      .match-item {

        min-height: 72px;
      }

      .img-box {

        width: 58px;
        height: 58px;
      }

      .img-box img {

        width: 42px;
        height: 42px;
      }

      .word-box {

        width: 88px;

        min-height: 38px;

        font-size: 14px;
      }

      .match-number {

        font-size: 15px;

        width: 20px;
      }

      .navigation-btns {

        height: 65px;
      }

      .nav-btn {

        min-width: 95px;

        height: 38px;

        font-size: 13px;

        padding: 6px 10px;
      }

      .popup-card {

        width: 220px;

        padding: 14px;
      }

      .popup-icon {

        width: 60px;
        height: 60px;

        font-size: 28px;
      }

      .popup-card h2 {

        font-size: 18px;
      }

      .popup-card p {

        font-size: 13px;
      }

      .final-card {

        padding: 18px;
      }

      .final-card h2 {

        font-size: 24px;
      }

      .final-card p {

        font-size: 14px;
      }

      #stars {

        font-size: 24px;
      }

      .playAgain-btn {

        padding: 8px 18px;

        font-size: 14px;
      }
    }


    /* ========================================
💻 Desktop / Laptop
======================================== */

    @media screen and (min-width:1025px) and (max-width:1440px) {

      .template {

        max-width: 1150px;
      }

      .instruction {

        font-size: 30px;
      }

      .img-box {

        width: 100px;
        height: 100px;
      }

      .img-box img {

        width: 80px;
        height: 80px;
      }

      .word-box {

        width: 145px;

        font-size: 30px;
      }
    }


    /* ========================================
🖥️ LARGE MONITORS
======================================== */

    @media screen and (min-width:1441px) and (max-width:1920px) {

      .template {

        max-width: 1350px;
      }

      .instruction {

        font-size: 38px;
      }

      .img-box {

        width: 115px;
        height: 115px;
      }

      .img-box img {

        width: 92px;
        height: 92px;
      }

      .word-box {

        width: 160px;

        min-height: 62px;

        font-size: 35px;
      }

      .match-number {

        font-size: 32px;
      }

      .nav-btn {
        font-size: 22px;

        padding: 18px 28px;

        min-width: 170px;

        height: 60px;
      }
    }


    /* ========================================
📺 4K / EXTRA LARGE
======================================== */

    @media screen and (min-width:1921px) {

      .template {

        max-width: 1500px;
      }

      .instruction {

        font-size: 44px;
      }

      .img-box {

        width: 130px;
        height: 130px;
      }

      .img-box img {

        width: 105px;
        height: 105px;
      }

      .word-box {

        width: 180px;

        min-height: 72px;

        font-size: 34px;
      }

      .match-number {

        font-size: 38px;
      }

      .nav-btn {

        font-size: 24px;

        padding: 18px 28px;

        min-width: 180px;

        height: 65px;
      }
    }
  </style>

  <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

  <div class="app">

    <div class="template">

      <div class="instruction">
        चित्रों को उनके नाम से मिलाइए।
      </div>

      <div class="match-layout">

        <div class="side left-side" id="leftSide">
        </div>

        <div class="center-words" id="centerWords">
        </div>

        <div class="side right-side" id="rightSide">
        </div>

        <svg id="lineSvg"></svg>

      </div>

    </div>

  </div>

  <!-- POPUP -->

  <div id="answerPopup" class="kid-popup">

    <div class="popup-card" id="popupCard">

      <div class="popup-icon" id="popupIcon">

        🎉

      </div>

      <h2 id="popupTitle"></h2>

      <p id="popupMsg"></p>

    </div>

  </div>

  <!-- FINAL -->

  <div id="finalPopup">

    <div class="final-card">

      <h2>🎉 शाबाश !</h2>

      <p id="finalScore"></p>

      <div id="stars">
        ⭐⭐⭐
      </div>

      <button class="playAgain-btn" onclick="location.reload()">

        फिर से शुरू करें

      </button>

    </div>

  </div>

  <script>

    const gamePages = [

      // PAGE 1

      [

        {
          id: 1,
          word: "जल",
          img: "../assets/images/water.png",
          side: "left"
        },

        {
          id: 2,
          word: "घर",
          img: "../assets/images/home.png",
          side: "left"
        },

        {
          id: 3,
          word: "पग",
          img: "../assets/images/foot.png",
          side: "right"
        },

        {
          id: 4,
          word: "कसरत",
          img: "../assets/images/exercise.png",
          side: "right"
        }

      ],

      // PAGE 2

      [

        {
          id: 5,
          word: "गमला",
          img: "../assets/images/flowerpot.png",
          side: "left"
        },

        {
          id: 6,
          word: "बादल",
          img: "../assets/images/cloud.png",
          side: "left"
        },

        {
          id: 7,
          word: "टमाटर",
          img: "../assets/images/tomato.png",
          side: "left"
        },

        {
          id: 8,
          word: "गाजर",
          img: "../assets/images/carrot.png",
          side: "right"
        },

        {
          id: 9,
          word: "आम",
          img: "../assets/images/mango.png",
          side: "right"
        },

        {
          id: 10,
          word: "बाजा",
          img: "../assets/images/band.png",
          side: "right"
        }

      ]

    ];

    let selectedImage = null;
    let selectedWord = null;

    let currentPage = 0;

    let pageSolved = [false, false];

    let matchedItems = {};

    const leftSide =
      document.getElementById("leftSide");

    const rightSide =
      document.getElementById("rightSide");

    const centerWords =
      document.getElementById("centerWords");

    const svg =
      document.getElementById("lineSvg");

    function loadGame() {

      leftSide.innerHTML = "";
      rightSide.innerHTML = "";
      centerWords.innerHTML = "";

      svg.innerHTML = "";

      const data =
        gamePages[currentPage];

      let leftCount = 1;

      let rightCount =
        currentPage === 0
          ? 3
          : 4;

      const shuffledWords =
        [...data].sort(
          () => Math.random() - 0.5
        );

      data.forEach((item) => {

        const imageBox =

          `
        <div class="match-item">

          ${item.side === "left"
            ?

            `<div class="match-number">
              ${leftCount++})
            </div>`

            :

            ""
          }

          <div class="img-box
          ${matchedItems[item.id] ? "matched" : ""}"

          id="img-${item.id}"

          onclick="selectImage(${item.id})">

            <img src="${item.img}">

          </div>

          ${item.side === "right"
            ?

            `<div class="match-number">
              ${rightCount++})
            </div>`

            :

            ""
          }

        </div>
        `;

        if (item.side === "left") {

          leftSide.innerHTML +=
            imageBox;
        }

        else {

          rightSide.innerHTML +=
            imageBox;
        }
      });

      shuffledWords.forEach((item) => {

        const wordBox =

          `
        <div class="word-box
        ${matchedItems[item.id] ? "matched" : ""}"

        id="word-${item.id}"

        onclick="selectWord(${item.id})">

          ${item.word}

        </div>
        `;

        centerWords.innerHTML +=
          wordBox;
      });

      restoreLines();

      updateButtons();
    }

    loadGame();

    function updateButtons() {

      let nextBtn =
        document.getElementById("nextBtn");

      let prevBtn =
        document.getElementById("prevBtn");

      if (!nextBtn) {

        const btnWrap =
          document.createElement("div");

        btnWrap.className =
          "navigation-btns";

        btnWrap.innerHTML =

          `
        <button id="prevBtn"
        class="nav-btn">

          ⬅ पिछला

        </button>

        <button id="nextBtn"
        class="nav-btn">

          अगला ➡

        </button>
        `;

        document
          .querySelector(".template")
          .appendChild(btnWrap);

        nextBtn =
          document.getElementById("nextBtn");

        prevBtn =
          document.getElementById("prevBtn");

        nextBtn.onclick = nextPage;
        prevBtn.onclick = prevPage;
      }

      prevBtn.style.display =
        currentPage === 0
          ? "none"
          : "block";

      nextBtn.style.display =
        pageSolved[currentPage]
          ? "block"
          : "none";

      if (currentPage === gamePages.length - 1) {

        nextBtn.style.display = "none";
      }
    }

    function selectImage(id) {

      const box =
        document.getElementById(
          `img-${id}`
        );

      if (
        box.classList.contains(
          "matched"
        )
      ) return;

      document
        .querySelectorAll(".img-box")
        .forEach(el => {

          el.classList.remove(
            "active"
          );
        });

      box.classList.add("active");

      selectedImage = id;

      checkMatch();
    }

    function selectWord(id) {

      const box =
        document.getElementById(
          `word-${id}`
        );

      if (
        box.classList.contains(
          "matched"
        )
      ) return;

      document
        .querySelectorAll(".word-box")
        .forEach(el => {

          el.classList.remove(
            "active"
          );
        });

      box.classList.add("active");

      selectedWord = id;

      checkMatch();
    }

    function checkMatch() {

      if (
        selectedImage === null ||
        selectedWord === null
      ) return;

      const img =
        document.getElementById(
          `img-${selectedImage}`
        );

      const word =
        document.getElementById(
          `word-${selectedWord}`
        );

      const currentData =
        gamePages[currentPage];

      const imgData =
        currentData.find(
          item => item.id === selectedImage
        );

      const wordData =
        currentData.find(
          item => item.id === selectedWord
        );

      if (
        imgData.word ===
        wordData.word
      ) {

        matchedItems[selectedImage] = true;

        img.classList.add(
          "matched"
        );

        word.classList.add(
          "matched"
        );

        img.classList.remove(
          "active"
        );

        word.classList.remove(
          "active"
        );

        drawLine(img, word);

        playCorrectSound();

        showPopup(true);

        fireConfetti();

        const solvedCount =
          currentData.filter(
            item => matchedItems[item.id]
          ).length;

        if (
          solvedCount === currentData.length
        ) {

          pageSolved[currentPage] = true;

          updateButtons();

          if (
            currentPage ===
            gamePages.length - 1
          ) {

            setTimeout(
              showFinal,
              1200
            );
          }
        }
      }

      else {

        img.classList.add(
          "wrong"
        );

        word.classList.add(
          "wrong"
        );

        playWrongSound();

        showPopup(false);

        setTimeout(() => {

          img.classList.remove(
            "wrong",
            "active"
          );

          word.classList.remove(
            "wrong",
            "active"
          );

        }, 600);
      }

      selectedImage = null;
      selectedWord = null;
    }

    function nextPage() {

      if (
        currentPage <
        gamePages.length - 1
      ) {

        currentPage++;

        loadGame();

        window.scrollTo(0, 0);
      }
    }

    function prevPage() {

      if (currentPage > 0) {

        currentPage--;

        loadGame();

        window.scrollTo(0, 0);
      }
    }

    function restoreLines() {

      const currentData =
        gamePages[currentPage];

      currentData.forEach(item => {

        if (matchedItems[item.id]) {

          const img =
            document.getElementById(
              `img-${item.id}`
            );

          const word =
            document.getElementById(
              `word-${item.id}`
            );

          drawLine(img, word);
        }
      });
    }

    function drawLine(imgEl, wordEl) {

      const svgRect =
        svg.getBoundingClientRect();

      const imgRect =
        imgEl.getBoundingClientRect();

      const wordRect =
        wordEl.getBoundingClientRect();

      let x1;
      let y1;
      let x2;
      let y2;

      if (
        imgRect.left <
        window.innerWidth / 2
      ) {

        x1 =
          imgRect.right -
          svgRect.left;

        y1 =
          imgRect.top +
          imgRect.height / 2 -
          svgRect.top;

        x2 =
          wordRect.left -
          svgRect.left;

        y2 =
          wordRect.top +
          wordRect.height / 2 -
          svgRect.top;
      }

      else {

        x1 =
          imgRect.left -
          svgRect.left;

        y1 =
          imgRect.top +
          imgRect.height / 2 -
          svgRect.top;

        x2 =
          wordRect.right -
          svgRect.left;

        y2 =
          wordRect.top +
          wordRect.height / 2 -
          svgRect.top;
      }

      const line =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      line.setAttribute("x1", x1);
      line.setAttribute("y1", y1);

      line.setAttribute("x2", x2);
      line.setAttribute("y2", y2);

      line.setAttribute(
        "stroke",
        "#1aae4b"
      );

      line.setAttribute(
        "stroke-width",
        "4"
      );

      line.setAttribute(
        "stroke-linecap",
        "round"
      );

      svg.appendChild(line);
    }

    function showPopup(isCorrect) {

      const popup =
        document.getElementById(
          "answerPopup"
        );

      const popupCard =
        document.getElementById(
          "popupCard"
        );

      const icon =
        document.getElementById(
          "popupIcon"
        );

      const title =
        document.getElementById(
          "popupTitle"
        );

      const msg =
        document.getElementById(
          "popupMsg"
        );

      popup.style.display =
        "flex";

      popupCard.className =
        "popup-card " +

        (
          isCorrect
            ? "popup-correct"
            : "popup-wrong"
        );

      if (isCorrect) {

        icon.textContent = "🎉";

        title.textContent =
          "बहुत बढ़िया!";

        msg.textContent =
          "आपका उत्तर सही है।";
      }

      else {

        icon.textContent = "😯";

        title.textContent =
          "ओह!";

        msg.textContent =
          "फिर से प्रयास करें।";
      }

      setTimeout(() => {

        popup.style.display =
          "none";

      }, 1000);
    }

    function showFinal() {

      const popup =
        document.getElementById(
          "finalPopup"
        );

      let totalSolved =
        Object.keys(
          matchedItems
        ).length;

      document.getElementById(
        "finalScore"
      ).textContent =

        `आपने ${totalSolved}
        सही मिलान किए`;

      popup.style.display =
        "flex";

      confetti({

        particleCount: 160,

        spread: 120,

        origin: { y: 0.6 }

      });
      playCorrectSound();
    }

    function fireConfetti() {

      confetti({

        particleCount: 60,

        spread: 80,

        origin: { y: 0.6 }

      });
    }

    // SOUNDS

    const audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    // =========================================
    // UNLOCK AUDIO
    // =========================================

    document.addEventListener(
      "click",
      () => {

        if (
          audioContext.state === "suspended"
        ) {

          audioContext.resume();
        }
      },
      { once: true }
    );

    // =========================================
    // CORRECT SOUND
    // =========================================

    function playCorrectSound() {

      const osc =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      osc.type = "triangle";

      osc.frequency.setValueAtTime(
        520,
        audioContext.currentTime
      );

      osc.frequency.exponentialRampToValueAtTime(
        880,
        audioContext.currentTime + 0.18
      );

      gain.gain.setValueAtTime(
        0.25,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.35
      );

      osc.connect(gain);

      gain.connect(audioContext.destination);

      osc.start();

      osc.stop(
        audioContext.currentTime + 0.35
      );
    }

    // =========================================
    // WRONG SOUND
    // =========================================

    function playWrongSound() {

      const osc =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      osc.type = "sawtooth";

      osc.frequency.setValueAtTime(
        300,
        audioContext.currentTime
      );

      osc.frequency.exponentialRampToValueAtTime(
        120,
        audioContext.currentTime + 0.4
      );

      gain.gain.setValueAtTime(
        0.22,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.4
      );

      osc.connect(gain);

      gain.connect(audioContext.destination);

      osc.start();

      osc.stop(
        audioContext.currentTime + 0.4
      );
    }

  </script>

</body>
