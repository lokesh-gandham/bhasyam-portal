    <style>
        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            font-family: "Tiro Devanagari Hindi";

        }

        body {

            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app {

            width: 100%;
            display: flex;
            justify-content: center;
        }

        .template {

            width: min(1250px, 100%);

            flex-direction: column;

        }

        .heading {

            row-gap: 15px;

            margin-top: 10px;

            height: 52px;

            align-items: center;

            transition: .2s;
        }

        .letter-box.locked {

            background: #dfffe5;

            border-color: #27c75c;

            color: #13813b;

            pointer-events: none;
        }

        .letter-box.wrong {

            background: #ffe0e0;

            border-color: red;

            animation: blink .5s ease;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .2;
            }
        }

            top: 190px;

            display: flex;

            gap: 10px;

            z-index: 1000;
        }

            color: white;

<body>

    <div class="app">

        <div class="template">

            <div class="heading">
                चित्रों के नाम लिखिए।
            </div>

            <div class="questions-wrap" id="questionsWrap"></div>

            <div class="navigation-btns">

                <button id="prevBtn" class="nav-btn" onclick="prevPage()">
                    ⬅ पिछला
                </button>

                <button id="nextBtn" class="nav-btn" onclick="nextPage()">
                    अगला ➡
                </button>

            </div>

        </div>

    </div>
    </div>

    <!-- POPUP -->

    <div id="answerPopup" class="kid-popup">

        <div class="popup-card" id="popupCard">

            <div class="popup-icon" id="popupIcon">🎉</div>

            <h2 id="popupTitle"></h2>

            <p id="popupMsg"></p>

        </div>

    </div>

    <!-- FINAL -->

    <div id="finalPopup">

        <div class="final-card">

            <h2>🎉 शाबाश !</h2>

            <p id="finalScore"></p>

            <div id="stars">
                ⭐⭐⭐
            </div>

            <button class="playAgain-btn" onclick="location.reload()">
                फिर से शुरू करें
            </button>

        </div>

    </div>

    <script>

        const pages = [

            [

                {
                    image: "../assets/images/bus.png",
                    word: "बस"
                },

                {
                    image: "../assets/images/home.png",
                    word: "घर"
                },

                {
                    image: "../assets/images/lotus.png",
                    word: "कमल"
                },

                {
                    image: "../assets/images/bargad.png",
                    word: "बरगद"
                },

                {
                    image: "../assets/images/sharbat.png",
                    word: "शरबत"
                }

            ],

            [

                {
                    image: "../assets/images/lock.png",
                    word: "ताला"
                },

                {
                    image: "../assets/images/pot.png",
                    word: "घड़ा"
                },

                {
                    image: "../assets/images/plate.png",
                    word: "थाल"
                },

                {
                    image: "../assets/images/tomato.png",
                    word: "टमाटर"
                },

                {
                    image: "../assets/images/carrot.png",
                    word: "गाजर"
                }

            ]

        ];

        const wrap =
            document.getElementById(
                "questionsWrap"
            );

        let currentPage = 0;

        let solvedCount = 0;
        let solvedPages = {};


        function splitHindiWord(word) {

            const matras = "ािीुूृेैोौंःँ";
            const letters = [];

            for (let i = 0; i < word.length; i++) {

                let letter = word[i];

                // attach nukta
                if (i + 1 < word.length && word[i + 1] === "़") {
                    letter += word[++i];
                }

                // attach matras
                while (i + 1 < word.length && matras.includes(word[i + 1])) {
                    letter += word[++i];
                }

                // attach halant + next consonant
                while (i + 1 < word.length && word[i + 1] === "्") {

                    letter += word[++i];

                    if (i + 1 < word.length) {
                        letter += word[++i];
                    }

                    // attach nukta after consonant
                    if (i + 1 < word.length && word[i + 1] === "़") {
                        letter += word[++i];
                    }

                    // attach matras
                    while (i + 1 < word.length && matras.includes(word[i + 1])) {
                        letter += word[++i];
                    }
                }

                letters.push(letter);
            }

            return letters;
        }

        function makeWrongLetter(correct) {

            const consonants = [
                "क", "ख", "ग", "घ", "च", "छ", "ज", "झ",
                "ट", "ठ", "ड", "ढ", "त", "थ", "द", "ध",
                "न", "प", "फ", "ब", "भ", "म", "य", "र",
                "ल", "व", "स", "ह"
            ];

            if (correct.startsWith("ड़")) {
                const simple = ["का", "गा", "चा", "जा", "टा", "डा", "ता", "दा", "ना", "पा", "फा", "बा", "भा", "मा", "रा", "ला", "सा", "हा"];
                return simple[Math.floor(Math.random() * simple.length)];
            }

            const matra = correct.slice(1);   // gets ा, ि, ी, ो etc.

            let wrong;

            do {
                wrong =
                    consonants[Math.floor(Math.random() * consonants.length)] + matra;
            } while (wrong === correct);

            return wrong;
        }

        function loadPage(index) {
            wrap.innerHTML = "";

            const pageData =
                pages[index];

            pageData.forEach((item, qIndex) => {

                let savedWord =
                    solvedPages[index]?.[qIndex] || "";

                let html = `

                    <div class="question-card">

                    <div class="q-number">
                    ${qIndex + 1}
                    </div>

                    <div class="img-box">
                    <img src="${item.image}">
                    </div>

                    <div class="letter-row">

                    ${splitHindiWord(item.word).map((l, i) => `

                    <div class="letter-box
                    ${savedWord ? "locked" : ""}"

                    data-answer="${l}"
                    data-index="${i}"
                    data-question="${qIndex}"

                    onclick="showOptions(this,'${l}')">

                    ${savedWord[i] || ""}

                    </div>

                    `).join("")}

                    </div>

                    <div class="options"
                    id="options-${qIndex}">
                    </div>

                    </div>

                    `;

                wrap.innerHTML += html;

            });

            const cards =
                document.querySelectorAll(
                    ".question-card"
                );

            cards.forEach((card, i) => {

                if (i >= 3) {

                    card.style.marginTop =
                        "20px";
                }

            });

            // PREV BUTTON

            document.getElementById(
                "prevBtn"
            ).style.display =

                index === 0
                    ? "none"
                    : "block";

            // NEXT BUTTON

            let allSolved = true;

            document.querySelectorAll(
                ".question-card"
            ).forEach(card => {

                const boxes =
                    card.querySelectorAll(
                        ".letter-box"
                    );

                boxes.forEach(box => {

                    if (
                        !box.classList.contains(
                            "locked"
                        )
                    ) {

                        allSolved = false;
                    }
                });
            });

            document.getElementById(
                "nextBtn"
            ).style.display =

                (
                    allSolved &&
                    currentPage <
                    pages.length - 1
                )
                    ? "block"
                    : "none";

            enableCurrentQuestion();
        }

        loadPage(0);

        function enableCurrentQuestion() {

            const cards = document.querySelectorAll(".question-card");

            cards.forEach(card => {

                const boxes = card.querySelectorAll(".letter-box");

                boxes.forEach(box => {

                    if (!box.classList.contains("locked")) {

                        box.style.pointerEvents = "auto";
                        box.style.opacity = "1";
                    }
                });
            });
        }

        function showOptions(
            box,
            correctLetter
        ) {

            // ALLOW ONLY CURRENT EMPTY BOX

            const currentRow =
                box.parentElement;

            const allBoxes =
                currentRow.querySelectorAll(
                    ".letter-box"
                );

            let firstEmpty = null;

            allBoxes.forEach(b => {

                if (
                    firstEmpty === null &&
                    b.textContent.trim() === ""
                ) {

                    firstEmpty = b;
                }
            });

            // BLOCK OTHER BOXES

            if (box !== firstEmpty) {

                return;
            }

            if (
                box.classList.contains(
                    "locked"
                )
            ) return;

            document.querySelectorAll(
                ".options"
            ).forEach(opt => {

                opt.innerHTML = "";
            });

            const optionsWrap =
                box.parentElement.nextElementSibling;

            optionsWrap.innerHTML = "";

            const hindiLetters = [

                "क", "ख", "ग", "च", "ट",
                "द", "न", "म", "र", "स",
                "प", "ल", "ब", "ह"

            ];

            let wrong = makeWrongLetter(correctLetter);

            if (wrong === correctLetter) {

                wrong = "न";
            }

            const arr =
                Math.random() > .5
                    ? [correctLetter, wrong]
                    : [wrong, correctLetter];

            arr.forEach(letter => {

                const btn =
                    document.createElement(
                        "button"
                    );

                btn.className =
                    "option-btn";

                btn.textContent =
                    letter;

                btn.onclick = (e) => {

                    e.stopPropagation();

                    chooseLetter(
                        box,
                        letter,
                        correctLetter
                    );
                };

                optionsWrap.appendChild(
                    btn
                );
            });
        }

        function chooseLetter(
            box,
            selected,
            correct
        ) {

            // FILL SELECTED LETTER

            box.textContent =
                selected;

            // CLOSE OPTIONS

            box.parentElement
                .nextElementSibling.innerHTML =
                "";

            const currentRow =
                box.parentElement;

            const allBoxes =
                currentRow.querySelectorAll(
                    ".letter-box"
                );

            let formedWord = "";

            let originalWord = "";

            let filledCount = 0;

            // CREATE WORDS

            allBoxes.forEach(b => {

                formedWord +=
                    b.textContent.trim();

                originalWord +=
                    b.dataset.answer.trim();

                // COUNT FILLED BOXES

                if (
                    b.textContent.trim() !== ""
                ) {

                    filledCount++;
                }

            });

            // DO NOT CHECK UNTIL FULL WORD FILLED

            if (
                filledCount !== allBoxes.length
            ) {

                return;
            }

            // =========================
            // CORRECT WORD
            // =========================

            if (
                formedWord === originalWord
            ) {

                playCorrectSound();

                allBoxes.forEach(x => {

                    x.classList.add(
                        "locked"
                    );
                });

                // SAVE ANSWER

                if (!solvedPages[currentPage]) {

                    solvedPages[currentPage] = {};
                }

                const qIndex =
                    box.dataset.question;

                solvedPages[currentPage][qIndex] =
                    formedWord;

                showPopup(true);

                fireConfetti();

                checkCompleted();
                enableCurrentQuestion();
            }

            // =========================
            // WRONG WORD
            // =========================

            else {

                playWrongSound();

                allBoxes.forEach(x => {

                    x.classList.add(
                        "wrong"
                    );

                    setTimeout(() => {

                        x.classList.remove(
                            "wrong"
                        );

                        x.textContent = "";

                        x.classList.remove(
                            "locked"
                        );

                    }, 700);

                });

                showPopup(false);
                enableCurrentQuestion();
            }
        }

        function checkCompleted() {

            const cards =
                document.querySelectorAll(
                    ".question-card"
                );

            let allDone = true;

            cards.forEach(card => {

                const boxes =
                    card.querySelectorAll(
                        ".letter-box"
                    );

                boxes.forEach(box => {

                    if (
                        !box.classList.contains(
                            "locked"
                        )
                    ) {

                        allDone = false;
                    }

                });

            });

            if (allDone) {

                solvedCount += 5;

                fireConfetti();

                if (
                    currentPage <
                    pages.length - 1
                ) {

                    document.getElementById(
                        "nextBtn"
                    ).style.display = "block";
                }

                else {

                    setTimeout(
                        showFinal,
                        1000
                    );
                }
            }
        }

        function nextPage() {

            if (
                currentPage <
                pages.length - 1
            ) {

                currentPage++;

                loadPage(currentPage);

                window.scrollTo(0, 0);
            }
        }

        function prevPage() {

            if (currentPage > 0) {

                currentPage--;

                loadPage(currentPage);

                window.scrollTo(0, 0);
            }
        }

        document.addEventListener(
            "click",
            (e) => {

                if (
                    !e.target.classList.contains(
                        "letter-box"
                    ) &&
                    !e.target.classList.contains(
                        "option-btn"
                    )
                ) {

                    document.querySelectorAll(
                        ".options"
                    ).forEach(opt => {

                        opt.innerHTML = "";
                    });
                }
            }
        );

        // POPUP

        function showPopup(isCorrect) {

            const popup =
                document.getElementById(
                    "answerPopup"
                );

            const popupCard =
                document.getElementById(
                    "popupCard"
                );

            const icon =
                document.getElementById(
                    "popupIcon"
                );

            const title =
                document.getElementById(
                    "popupTitle"
                );

            const msg =
                document.getElementById(
                    "popupMsg"
                );

            popup.style.display = "flex";

            popupCard.className =
                "popup-card " +
                (
                    isCorrect
                        ? "popup-correct"
                        : "popup-wrong"
                );

            if (isCorrect) {

                icon.textContent = "🎉";

                title.textContent =
                    "बहुत बढ़िया!";

                msg.textContent =
                    "आपका उत्तर सही है।";
            }

            else {

                icon.textContent = "😯";

                title.textContent =
                    "ओह!";

                msg.textContent =
                    "फिर से प्रयास करें।";
            }

            setTimeout(() => {

                popup.style.display =
                    "none";

            }, 1000);
        }

        // FINAL

        function showFinal() {

            const popup =
                document.getElementById(
                    "finalPopup"
                );

            document.getElementById(
                "finalScore"
            ).textContent =

                `आपने ${solvedCount}
शब्द सही लिखे`;

            popup.style.display =
                "flex";

            confetti({

                particleCount: 180,

                spread: 120,

                origin: { y: 0.6 }

            });
            playCorrectSound();
        }

        // CONFETTI

        function fireConfetti() {

            confetti({

                particleCount: 60,

                spread: 80,

                origin: { y: 0.6 }

            });
        }

        document.addEventListener("keydown", (e) => {

            if (e.key !== "Backspace") return;

            // current active question
            const cards = document.querySelectorAll(".question-card");

            for (const card of cards) {

                const boxes = card.querySelectorAll(".letter-box");

                // skip solved questions
                if ([...boxes].every(box => box.classList.contains("locked"))) {
                    continue;
                }

                // remove last filled unlocked box
                for (let i = boxes.length - 1; i >= 0; i--) {

                    if (
                        boxes[i].textContent.trim() !== "" &&
                        !boxes[i].classList.contains("locked")
                    ) {

                        boxes[i].textContent = "";
                        e.preventDefault();
                        return;
                    }
                }

                break; // only work on first active question
            }
        });

        // SOUNDS

        // SOUNDS

        const audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        // =========================================
        // UNLOCK AUDIO
        // =========================================

        document.addEventListener(
            "click",
            () => {

                if (
                    audioContext.state === "suspended"
                ) {

                    audioContext.resume();
                }
            },
            { once: true }
        );

        // =========================================
        // CORRECT SOUND
        // =========================================

        function playCorrectSound() {

            const osc =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            osc.type = "triangle";

            osc.frequency.setValueAtTime(
                520,
                audioContext.currentTime
            );

            osc.frequency.exponentialRampToValueAtTime(
                880,
                audioContext.currentTime + 0.18
            );

            gain.gain.setValueAtTime(
                0.25,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 0.35
            );

            osc.connect(gain);

            gain.connect(audioContext.destination);

            osc.start();

            osc.stop(
                audioContext.currentTime + 0.35
            );
        }

        // =========================================
        // WRONG SOUND
        // =========================================

        function playWrongSound() {

            const osc =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            osc.type = "sawtooth";

            osc.frequency.setValueAtTime(
                300,
                audioContext.currentTime
            );

            osc.frequency.exponentialRampToValueAtTime(
                120,
                audioContext.currentTime + 0.4
            );

            gain.gain.setValueAtTime(
                0.22,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 0.4
            );

            osc.connect(gain);

            gain.connect(audioContext.destination);

            osc.start();

            osc.stop(
                audioContext.currentTime + 0.4
            );
        }

    </script>

</body>
