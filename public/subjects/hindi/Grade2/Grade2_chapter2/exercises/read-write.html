<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Livvic", sans-serif;
        }

        body {

            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;

            overflow: hidden;
        }

        .app {

            width: 100%;

            display: flex;
            justify-content: center;

            padding: 30px 20px 120px;
        }

        .template {

            width: min(1200px, 100%);

            display: flex;
            flex-direction: column;

            gap: 18px;
        }

        /* =========================================
           HEADING
        ========================================= */

        .heading {

            width: 50%;

            margin-inline: auto;

            text-align: center;

            padding: 12px 24px;

            border-radius: 18px;

            background: #ffe27a;

            color: #444;

            font-size: 34px;
            font-weight: 700;

            box-shadow:
                0 8px 18px rgba(0, 0, 0, .08);
        }

        /* =========================================
           QUESTIONS
        ========================================= */

        .questions-wrap {

            width: 100%;

            display: flex;
            flex-wrap: wrap;

            justify-content: center;

            column-gap: 40px;

            row-gap: 35px;

            margin-top: 10px;
        }

        .question-card {

            width: 250px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 12px;
        }

        .question-top {

            display: flex;
            align-items: center;

            gap: 8px;
        }

        .q-number {

            font-size: 24px;
            font-weight: 700;

            color: #555;
        }

        .word {

            font-size: 38px;
            font-weight: 700;

            color: #ff3f7f;
        }

        /* =========================================
           INPUT BOXES
        ========================================= */

        .input-row {

            display: flex;
            justify-content: center;

            gap: 6px;

            flex-wrap: wrap;
        }

        .letter-box {

            min-width: 52px;
            height: 56px;

            padding: 0 10px;

            border-radius: 14px;

            background: white;

            border: 2px solid #ff95bb;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 24px;
            font-weight: 700;

            color: #333;

            transition: .2s;

            cursor: pointer;
        }

        .letter-box.locked {

            background: #dfffe5;

            border-color: #27c75c;

            color: #13813b;

            cursor: default;
        }

        .letter-box.wrong {

            background: #ffe0e0;

            border-color: red;

            animation: blink .5s ease;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .2;
            }
        }

        /* =========================================
           OPTIONS
        ========================================= */

        .options {

            display: flex;

            gap: 6px;

            flex-wrap: wrap;

            justify-content: center;
        }

        .option-btn {

            min-width: 46px;
            height: 44px;

            padding: 0 10px;

            border-radius: 12px;

            border: none;

            background: #ff5f9f;

            color: white;

            font-size: 20px;
            font-weight: 700;

            cursor: pointer;

            transition: .2s;

            box-shadow:
                0 5px 10px rgba(0, 0, 0, .12);
        }

        .option-btn:hover {
            transform: translateY(-2px);
        }

        .option-btn.disabled {

            opacity: .4;

            pointer-events: none;
        }

        /* =========================================
           NAVIGATION
        ========================================= */

        .navigation-btns {

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 20px;

            margin-top: 25px;
        }

        .nav-btn {

            border: none;

            background: #ff4f9a;

            color: white;

            padding: 12px 24px;

            border-radius: 50px;

            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(0, 0, 0, .18);

            transition: .2s;

            display: none;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
        }

        /* =========================================
           POPUP
        ========================================= */

        .kid-popup {

            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;
            align-items: center;

            z-index: 5000;

            /* backdrop-filter: blur(4px); */
        }

        .popup-card {

            width: 300px;

            padding: 24px;

            border-radius: 28px;

            text-align: center;

            background: white;

            /* box-shadow:
                0 20px 50px rgba(0, 0, 0, .2); */
        }

        .popup-icon {

            width: 80px;
            height: 80px;

            border-radius: 50%;

            margin: auto auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
        }

        .popup-card h2 {

            font-size: 30px;

            margin-bottom: 10px;
        }

        .popup-card p {

            font-size: 18px;
        }

        .popup-correct .popup-icon {

            background: #dff8e5;

            color: #22b455;
        }

        .popup-correct h2 {

            color: #189a48;
        }

        .popup-wrong .popup-icon {

            background: #ffe3e3;

            color: #ff4d4d;
        }

        .popup-wrong h2 {

            color: #e63946;
        }

        /* =========================================
           FINAL POPUP
        ========================================= */

        #finalPopup {

            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;
            align-items: center;

            z-index: 6000;

            /* backdrop-filter: blur(6px); */
        }

        .final-card {

            padding: 35px;

            text-align: center;

        .final-card h2 {

            color: #4d5875;

            font-weight: 600;
        }

        }

        .playAgain-btn {

                    #ff8b2b);

            color: white;

            padding: 14px 35px;

<body>

    <div class="app">

        <div class="template">

            <div class="heading">
                पढ़ो और लिखो।
            </div>

            <div class="questions-wrap" id="questionsWrap">
            </div>

            <div class="navigation-btns">

                <button id="prevBtn" class="nav-btn" onclick="prevPage()">

                    ⬅ पिछला

                </button>

                <button id="nextBtn" class="nav-btn" onclick="nextPage()">

                    अगला ➡

                </button>

            </div>

        </div>

    </div>

    <!-- POPUP -->

    <div id="answerPopup" class="kid-popup">

        <div class="popup-card" id="popupCard">

            <div class="popup-icon" id="popupIcon">

                🎉

            </div>

            <h2 id="popupTitle"></h2>

            <p id="popupMsg"></p>

        </div>

    </div>

    <!-- FINAL -->

    <div id="finalPopup">

        <div class="final-card">

            <h2>🎉 शाबाश !</h2>

            <p id="finalScore"></p>

            <div id="stars">
                ⭐⭐⭐
            </div>

            <button class="playAgain-btn" onclick="location.reload()">

                फिर से शुरू करें

            </button>

        </div>

    </div>

    <script>

        const pages = [

            [

                {
                    word: "जल",
                    options: ["ज", "ल", "घ"]
                },

                {
                    word: "घर",
                    options: ["घ", "र", "न"]
                },

                {
                    word: "सच",
                    options: ["स", "च", "द"]
                },

                {
                    word: "कसरत",
                    options: ["क", "स", "र", "त", "न"]
                },

                {
                    word: "अचकन",
                    options: ["अ", "च", "क", "न", "ल"]
                },

                {
                    word: "नटखट",
                    options: ["न", "ट", "ख", "ट", "र"]
                }

            ],

            [

                {
                    word: "बाहर",
                    options: ["बा", "ह", "र", "न"]
                },

                {
                    word: "पाठ",
                    options: ["पा", "ठ", "न"]
                },

                {
                    word: "टमाटर",
                    options: ["ट", "मा", "ट", "र", "ल"]
                },

                {
                    word: "याद",
                    options: ["या", "द", "पा"]
                },

                {
                    word: "गाना",
                    options: ["गा", "ना", "ला"]
                },

                {
                    word: "आया",
                    options: ["आ", "या", "का"]
                }

            ]

        ];

        pages.forEach(page => {

            page.forEach(item => {

                item.options.sort(() => Math.random() - 0.5);

            });

        });

        const wrap =
            document.getElementById(
                "questionsWrap"
            );

        let currentPage = 0;

        let solvedPages = {};

        let solvedCount = 0;

        // =========================================
        // SPLIT HINDI WORD
        // =========================================

        function splitWord(word) {

            return word.match(
                /(?:[क-ह]|[अ-औ]|[क़-य़])(?:[ािीुूृेैोौंःँ]*)/g
            ) || [];
        }

        // =========================================
        // LOAD PAGE
        // =========================================

        function loadPage(index) {

            wrap.innerHTML = "";

            const pageData =
                pages[index];

            pageData.forEach((item, qIndex) => {

                const letters =
                    splitWord(item.word);

                const saved =
                    solvedPages[index]?.[qIndex] || [];

                let html =

                    `
                <div class="question-card">

                    <div class="question-top">

                        <div class="q-number">
                            ${currentPage * 6 + qIndex + 1})
                        </div>

                        <div class="word">
                            ${item.word}
                        </div>

                    </div>

                    <div class="input-row">

                        ${letters.map((l, i) =>

                        `
                        <div class="letter-box
                        ${saved[i] ? "locked" : ""}"

                        data-answer="${l}"

                        onclick="removeLetter(
                        ${qIndex},
                        ${i}
                        )">

                        ${saved[i] || ""}

                        </div>
                        `

                    ).join("")}

                    </div>

                    <div class="options">

                        ${item.options.map(letter =>

                        `
                        <button
                        class="option-btn"

                        onclick="fillLetter(
                        '${letter}',
                        ${qIndex},
                        this
                        )">

                        ${letter}

                        </button>
                        `

                    ).join("")}

                    </div>

                </div>
                `;

                wrap.innerHTML += html;

            });

            restoreSolvedQuestions();

            document.getElementById(
                "prevBtn"
            ).style.display =

                currentPage === 0
                    ? "none"
                    : "block";

            document.getElementById(
                "nextBtn"
            ).style.display =
                "none";

            enableCurrentQuestion();

            checkPageCompleted();
        }

        loadPage(0);

        // =========================================
        // RESTORE SOLVED QUESTIONS
        // =========================================

        function restoreSolvedQuestions() {

            const cards =
                document.querySelectorAll(
                    ".question-card"
                );

            cards.forEach((card, qIndex) => {

                const boxes =
                    card.querySelectorAll(
                        ".letter-box"
                    );

                const buttons =
                    card.querySelectorAll(
                        ".option-btn"
                    );

                let allFilled = true;

                boxes.forEach(box => {

                    if (
                        box.textContent.trim() === ""
                    ) {

                        allFilled = false;
                    }
                });

                if (allFilled) {

                    let formed = "";

                    let original = "";

                    boxes.forEach(box => {

                        formed += box.textContent;
                        original += box.dataset.answer;
                    });

                    if (formed === original) {

                        boxes.forEach(box => {

                            box.classList.add(
                                "locked"
                            );
                        });

                        buttons.forEach(btn => {

                            btn.disabled = true;

                            btn.classList.add(
                                "disabled"
                            );
                        });
                    }
                }
            });
        }

        // =========================================
        // ENABLE ONLY FIRST UNSOLVED
        // =========================================

        function enableCurrentQuestion() {

            const cards =
                document.querySelectorAll(
                    ".question-card"
                );

            let firstUnsolvedFound = false;

            cards.forEach(card => {

                const boxes =
                    card.querySelectorAll(
                        ".letter-box"
                    );

                const buttons =
                    card.querySelectorAll(
                        ".option-btn"
                    );

                let solved = true;

                boxes.forEach(box => {

                    if (
                        !box.classList.contains(
                            "locked"
                        )
                    ) {

                        solved = false;
                    }
                });

                // ====================================
                // SOLVED QUESTION
                // ====================================

                if (solved) {

                    buttons.forEach(btn => {

                        btn.disabled = true;

                        btn.classList.add(
                            "disabled"
                        );
                    });

                    return;
                }

                // ====================================
                // FIRST UNSOLVED ENABLE
                // ====================================

                if (!firstUnsolvedFound) {

                    firstUnsolvedFound = true;

                    buttons.forEach(btn => {

                        btn.disabled = false;

                        btn.classList.remove(
                            "disabled"
                        );
                    });
                }

                // ====================================
                // OTHER QUESTIONS DISABLE
                // ====================================

                else {

                    buttons.forEach(btn => {

                        btn.disabled = true;

                        btn.classList.add(
                            "disabled"
                        );
                    });
                }
            });
        }

        // =========================================
        // REMOVE LETTER
        // =========================================

        function removeLetter(
            qIndex,
            boxIndex
        ) {

            const card =
                document.querySelectorAll(
                    ".question-card"
                )[qIndex];

            const boxes =
                card.querySelectorAll(
                    ".letter-box"
                );

            const buttons =
                card.querySelectorAll(
                    ".option-btn"
                );

            const targetBox =
                boxes[boxIndex];

            // DON'T REMOVE LOCKED

            if (
                targetBox.classList.contains(
                    "locked"
                )
            ) {

                return;
            }

            const value =
                targetBox.textContent.trim();

            if (value === "") return;

            targetBox.textContent = "";


            buttons.forEach(btn => {

                if (
                    btn.textContent.trim() === value
                ) {

                    btn.disabled = false;

                    btn.classList.remove(
                        "disabled"
                    );
                }
            });
        }

        function fillLetter(
            selected,
            qIndex,
            clickedBtn
        ) {

            const card =
                document.querySelectorAll(
                    ".question-card"
                )[qIndex];

            const boxes =
                card.querySelectorAll(
                    ".letter-box"
                );

            const buttons =
                card.querySelectorAll(
                    ".option-btn"
                );

            let targetBox = null;

            boxes.forEach(box => {

                if (
                    !targetBox &&
                    box.textContent.trim() === ""
                ) {

                    targetBox = box;
                }
            });

            if (!targetBox) return;

            targetBox.textContent =
                selected;

            clickedBtn.disabled = true;

            clickedBtn.classList.add(
                "disabled"
            );

            let formedWord = "";

            let originalWord = "";

            let allFilled = true;

            boxes.forEach(box => {

                formedWord +=
                    box.textContent.trim();

                originalWord +=
                    box.dataset.answer;

                if (
                    box.textContent.trim() === ""
                ) {

                    allFilled = false;
                }
            });

            if (!allFilled) {
                return;
            }


            if (
                formedWord === originalWord
            ) {

                playCorrectSound();

                boxes.forEach(box => {

                    box.classList.add(
                        "locked"
                    );
                });

                buttons.forEach(btn => {

                    btn.disabled = true;

                    btn.classList.add(
                        "disabled"
                    );
                });

                solvedPages[currentPage] ??= {};

                solvedPages[currentPage][qIndex] =
                    boxes.length
                        ? Array.from(boxes).map(
                            box => box.textContent.trim()
                        )
                        : [];

                solvedCount++;

                showPopup(true);

                fireConfetti();

                enableCurrentQuestion();

                checkPageCompleted();
            }


            else {

                playWrongSound();

                boxes.forEach(box => {

                    box.classList.add(
                        "wrong"
                    );
                });

                showPopup(false);

                setTimeout(() => {

                    boxes.forEach(box => {

                        box.classList.remove(
                            "wrong"
                        );

                        box.textContent = "";
                    });

                    buttons.forEach(btn => {

                        btn.disabled = false;

                        btn.classList.remove(
                            "disabled"
                        );
                    });

                    enableCurrentQuestion();

                }, 700);
            }
        }

        function checkPageCompleted() {

            const cards =
                document.querySelectorAll(
                    ".question-card"
                );

            let allDone = true;

            cards.forEach(card => {

                const boxes =
                    card.querySelectorAll(
                        ".letter-box"
                    );

                boxes.forEach(box => {

                    if (
                        !box.classList.contains(
                            "locked"
                        )
                    ) {

                        allDone = false;
                    }
                });
            });

            if (allDone) {

                if (
                    currentPage <
                    pages.length - 1
                ) {

                    document.getElementById(
                        "nextBtn"
                    ).style.display =
                        "block";
                }

                else {

                    setTimeout(
                        showFinal,
                        1000
                    );
                }
            }
        }

        function nextPage() {

            currentPage++;

            loadPage(currentPage);

            window.scrollTo(0, 0);
        }

        function prevPage() {

            currentPage--;

            loadPage(currentPage);

            window.scrollTo(0, 0);
        }

        function showPopup(isCorrect) {

            const popup =
                document.getElementById(
                    "answerPopup"
                );

            const popupCard =
                document.getElementById(
                    "popupCard"
                );

            const icon =
                document.getElementById(
                    "popupIcon"
                );

            const title =
                document.getElementById(
                    "popupTitle"
                );

            const msg =
                document.getElementById(
                    "popupMsg"
                );

            popup.style.display =
                "flex";

            popupCard.className =
                "popup-card " +

                (
                    isCorrect
                        ? "popup-correct"
                        : "popup-wrong"
                );

            if (isCorrect) {

                icon.textContent = "🎉";

                title.textContent =
                    "बहुत बढ़िया!";

                msg.textContent =
                    "आपका उत्तर सही है।";
            }

            else {

                icon.textContent = "😯";

                title.textContent =
                    "ओह!";

                msg.textContent =
                    "फिर से प्रयास करें।";
            }

            setTimeout(() => {

                popup.style.display =
                    "none";

            }, 1000);
        }

        function showFinal() {

            const popup =
                document.getElementById(
                    "finalPopup"
                );

            document.getElementById(
                "finalScore"
            ).textContent =

                `आपने ${solvedCount}
            शब्द सही लिखे`;

            popup.style.display =
                "flex";

            confetti({

                particleCount: 180,

                spread: 120,

                origin: { y: 0.6 }

            });
            playCorrectSound();
        }

        function fireConfetti() {

            confetti({

                particleCount: 60,

                spread: 80,

                origin: { y: 0.6 }

            });
        }

        // SOUNDS

        const audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        // =========================================
        // UNLOCK AUDIO
        // =========================================

        document.addEventListener(
            "click",
            () => {

                if (
                    audioContext.state === "suspended"
                ) {

                    audioContext.resume();
                }
            },
            { once: true }
        );

        // =========================================
        // CORRECT SOUND
        // =========================================

        function playCorrectSound() {

            const osc =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            osc.type = "triangle";

            osc.frequency.setValueAtTime(
                520,
                audioContext.currentTime
            );

            osc.frequency.exponentialRampToValueAtTime(
                880,
                audioContext.currentTime + 0.18
            );

            gain.gain.setValueAtTime(
                0.25,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 0.35
            );

            osc.connect(gain);

            gain.connect(audioContext.destination);

            osc.start();

            osc.stop(
                audioContext.currentTime + 0.35
            );
        }

        // =========================================
        // WRONG SOUND
        // =========================================

        function playWrongSound() {

            const osc =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            osc.type = "sawtooth";

            osc.frequency.setValueAtTime(
                300,
                audioContext.currentTime
            );

            osc.frequency.exponentialRampToValueAtTime(
                120,
                audioContext.currentTime + 0.4
            );

            gain.gain.setValueAtTime(
                0.22,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 0.4
            );

            osc.connect(gain);

            gain.connect(audioContext.destination);

            osc.start();

            osc.stop(
                audioContext.currentTime + 0.4
            );
        }

    </script>

</body>
