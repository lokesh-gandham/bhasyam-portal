<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Tiro Devanagari Hindi", system-ui, sans-serif;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .template {
            width: min(1200px, 100%);
            min-height: 700px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        /* heading style */
        .heading {
            width: 50%;
            margin-inline: auto;
            text-align: center;
            padding: 14px 24px;
            border-radius: 18px;
            background: #ffe27a;
            color: #444;
            font-size: 30px;
            font-weight: 500;
            box-shadow: 0 8px 18px rgba(0, 0, 0, .08);
        }

        /* questions grid */
        .questions-wrap {
            width: 90%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            align-items: start;
        }

        /* question card */
        .question {
            width: 100%;
            border: 3px solid #ffffff;
            border-radius: 20px;
            padding: 20px 0px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            background: #fffff8;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
        }

        .question-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 40px;
            font-weight: 500;
            color: #555;
            flex-wrap: wrap;
        }

        .answer-line {
            width: 150px;
            border-bottom: 4px solid #555555;
            display: inline-block;
            flex-shrink: 0;
        }

        .answer-box {
            width: 220px;
            height: 60px;
            border-radius: 15px;
            border: 3px solid #ffd494;
            background: #fffdfa;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 500;
        }

        .answer-box.correct {
            border-color: #17b655;
            background: #ddffe7;
            color: #10853f;
        }

        .answer-box.wrong {
            border-color: red;
            background: #ffe0e0;
        }

        .question-top {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
        }

        .q-no {
            font-size: 35px;
            font-weight: 500;
            color: #555;
            min-width: 40px;
        }

        .line {
            min-width: 180px;
            height: 60px;
            padding-inline: 20px;
            border-radius: 999px;
            border: 3px solid #ffb4d1;
            background: #fff4fa;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 700;
            color: #555;
            transition: .25s;
        }

        .line.correct {
            background: #ddffe7;
            border-color: #17b655;
            color: #10853f;
        }

        .line.wrong {
            background: #ffe0e0;
            border-color: red;
            animation: blink .5s ease;
        }

        .sentence {
            font-size: 40px;
            font-weight: 400;
            color: #555;
        }

        /* =========================================
           🌸 NEW PASTEL CIRCULAR OPTIONS (FULLY REPLACED)
           ========================================= */
        .options-container {
            width: 90%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .options {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 22px;
            padding: 20px;
            border-radius: 28px;
        }

        .option {
            width: 140px;
            height: 140px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border-radius: 30%;
            border: 3px solid #ffb4d1;
            cursor: pointer;
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
            padding: 10px;
            text-align: center;
            overflow: hidden;
        }

        .option:hover {
            transform: translateY(-6px) scale(1.04);
            border-color: #ff9cc4;
            box-shadow: 0 12px 10px rgba(255, 155, 195, 0.308);
        }

        .option:active {
            transform: scale(.96);
        }

        .option img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            pointer-events: none;
        }

        .option span {
            font-size: 30px;
            font-weight: 400;
            line-height: 1.1;
            color: #5a5566;
            pointer-events: none;
        }

        /* correct option state */
        .option.correct {
            background: linear-gradient(135deg, #ddffe6, #c8ffd7);
            border-color: #22b455;
            color: #148a40;
            opacity: 0.7;
            pointer-events: none;
        }

        /* disabled global */
        .option.disabled {
            pointer-events: none;
            opacity: 0.55;
            filter: grayscale(0.1);
        }

        /* navigation buttons */
        .navigation-btns {
            width: 100%;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
        }

        .nav-btn {
            width: 150px;
            border: none;
            background: #ff4f9a;
            color: white;
            padding: 14px 26px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0, 0, 0, .18);
            transition: 0.2s;
        }

        .nav-btn:hover {
            background: #ff2a7e;
            transform: scale(0.97);
        }

        /* popups */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5000;
            /* backdrop-filter: blur(4px); */
        }

        .popup-card {
            width: 320px;
            padding: 28px;
            border-radius: 30px;
            text-align: center;
            background: white;
            /* box-shadow: 0 20px 50px rgba(0, 0, 0, .2); */
        }

        .popup-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            margin-bottom: 15px;
        }

        .popup-card h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .popup-card p {
            font-size: 20px;
        }

        .popup-correct .popup-icon {
            background: #dff8e5;
            color: #22b455;
        }

        .popup-correct h2 {
            color: #189a48;
        }

        .popup-wrong .popup-icon {
            background: #ffe3e3;
            color: #ff4d4d;
        }

        .popup-wrong h2 {
            color: #e63946;
        }

        /* final popup */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 6000;
            /* backdrop-filter: blur(6px); */
        }

        .final-card {
            width: 420px;
            max-width: 92%;
            background: white;
            border-radius: 40px;
            padding: 35px;
            text-align: center;
        }

        .final-card h2 {
            font-size: 42px;
            color: #1ca34a;
            margin-bottom: 12px;
        }

        .final-card p {
            font-size: 24px;
            color: #4d5875;
            font-weight: 600;
        }

        #stars {
            font-size: 50px;
            margin: 20px 0;
        }

        .playAgain-btn {
            border: none;
            background: linear-gradient(135deg, #ffb14d, #ff8b2b);
            color: white;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .2;
            }
        }

        /* =========================================
           📱 TABLET MEDIA (900px)
        ========================================= */
        @media (max-width:900px) {
            body {
                align-items: center;
                padding: 20px;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .template {
                width: 100%;
                gap: 18px;
            }

            .heading {
                width: auto;
                font-size: 24px;
                padding: 10px 22px;
            }

            .questions-wrap {
                gap: 18px;
                max-height: none;
            }

            .question {
                width: 100%;
                padding: 18px 14px;
            }

            .question-top {
                gap: 12px;
            }

            .q-no {
                font-size: 22px;
            }

            .line {
                min-width: 120px;
                height: 48px;
                font-size: 22px;
            }

            .sentence {
                font-size: 22px;
            }

            .question-text {
                font-size: 22px;
            }

            .answer-box {
                width: 170px;
                height: 48px;
                font-size: 22px;
            }

            .nav-btn {
                font-size: 16px;
                padding: 10px 18px;
                min-width: 130px;
                height: 48px;
            }

            .popup-card {
                width: 280px;
                padding: 22px;
            }

            .popup-card h2 {
                font-size: 24px;
            }

            .popup-card p {
                font-size: 16px;
            }

            .final-card {
                width: 90%;
                max-width: 340px;
                padding: 24px;
            }

            .final-card h2 {
                font-size: 32px;
            }

            .final-card p {
                font-size: 18px;
            }

            #stars {
                font-size: 34px;
            }

            /* option tablet */
            .options {
                gap: 18px;
                padding: 18px;
            }

            .option {
                width: 120px;
                height: 120px;
            }

            .option img {
                width: 52px;
                height: 52px;
            }

            .option span {
                font-size: 16px;
            }
        }

        /* =========================================
           📱 MOBILE (≤ 768px)
        ========================================= */
        @media (max-width:768px) {
            body {
                padding: 25px 10px;
                align-items: flex-start;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .app {
                padding: 16px 10px 50px;
            }

            .heading {
                width: 100%;
                font-size: 20px;
                line-height: 1.4;
                padding: 10px 18px;
            }

            .questions-wrap {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .question {
                min-height: 110px;
                gap: 14px;
                padding: 18px 14px;
                border-radius: 18px;
            }

            .q-no {
                font-size: 18px;
            }

            .line {
                min-width: 95px;
                height: 42px;
                font-size: 18px;
            }

            .sentence {
                font-size: 18px;
            }

            .question-text {
                font-size: 18px;
            }

            .answer-box {
                width: 140px;
                height: 42px;
                font-size: 18px;
            }

            .answer-line {
                width: 140px;
            }

            .navigation-btns {
                min-height: 70px;
                margin-top: 15px;
            }

            .nav-btn {
                min-width: 115px;

                height: 44px;

                font-size: 15px;

                padding: 8px 14px;
            }

            .popup-card {
                width: 250px;
                padding: 18px;
            }

            .popup-icon {
                width: 70px;
                height: 70px;
                font-size: 34px;
            }

            .popup-card h2 {
                font-size: 22px;
            }

            .popup-card p {
                font-size: 15px;
            }

            .final-card {
                width: 92%;
                padding: 20px;
            }

            .final-card h2 {
                font-size: 28px;
            }

            .final-card p {
                font-size: 16px;
            }

            #stars {
                font-size: 30px;
            }

            .playAgain-btn {
                font-size: 16px;
                padding: 10px 22px;
            }

            /* options mobile */
            .options {
                gap: 14px;
                padding: 14px;
            }

            .option {
                width: 100px;
                height: 100px;
            }

            .option img {
                width: 42px;
                height: 42px;
            }

            .option span {
                font-size: 14px;
            }
        }

        /* =========================================
           📱 SMALL PHONES (≤ 480px)
        ========================================= */
        @media (max-width:480px) {
            body {
                padding: 20px 6px 100px;
            }

            .heading {
                font-size: 17px;
                padding: 10px 14px;
            }

            .question {
                min-height: 72px;
                padding: 14px 8px;
            }

            .q-no {
                font-size: 15px;
                min-width: 20px;
            }

            .line {
                min-width: 88px;
                min-height: 38px;
                font-size: 14px;
            }

            .sentence {
                font-size: 14px;
            }

            .question-text {
                font-size: 14px;
            }

            .answer-box {
                width: 110px;
                height: 38px;
                font-size: 14px;
            }

            .answer-line {
                width: 100px;
            }

            .navigation-btns {
                min-height: 65px;
            }

            .nav-btn {
                min-width: 95px;

                height: 38px;

                font-size: 13px;

                padding: 6px 10px;
            }

            .popup-card {
                width: 220px;
                padding: 14px;
            }

            .popup-icon {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            .popup-card h2 {
                font-size: 18px;
            }

            .popup-card p {
                font-size: 13px;
            }

            .final-card {
                padding: 18px;
            }

            .final-card h2 {
                font-size: 24px;
            }

            .final-card p {
                font-size: 14px;
            }

            #stars {
                font-size: 24px;
            }

            .playAgain-btn {
                padding: 8px 18px;
                font-size: 14px;
            }

            /* small phone options */
            .options {
                gap: 10px;
                padding: 10px;
            }

            .option {
                width: 85px;
                height: 85px;
                border-width: 3px;
            }

            .option img {
                width: 32px;
                height: 32px;
            }

            .option span {
                font-size: 11px;
            }
        }

        /* =========================================
           💻 DESKTOP / LARGE (1025px - 1440px)
        ========================================= */
        @media screen and (min-width:1025px) and (max-width:1440px) {
            .template {
                max-width: 1150px;
            }

            .heading {
                font-size: 30px;
            }

            .question-text{
                font-size: 40px;
            }
            .question {
                width: 92%;
            }

            .line {
                min-width: 180px;
                font-size: 28px;
            }

            .sentence {
                font-size: 40px;
            }

            .option {
                width: 140px;
                height: 140px;
            }

            .option img {
                width: 80px;
                height: 80px;
            }

            .option span {
                font-size: 30px;
                font-weight: 500 !important;
            }
        }

        /* =========================================
           🖥️ LARGE MONITORS (1441px - 1920px)
        ========================================= */
        @media screen and (min-width:1441px) and (max-width:1920px) {
            .template {
                max-width: 1350px;
            }

            .heading {
                font-size: 38px;
            }

            .question {
                width: 95%;
            }

            .q-no {
                font-size: 32px;
            }

            .line {
                min-width: 220px;
                height: 70px;
                font-size: 34px;
            }

            .sentence {
                font-size: 36px;
            }

            .option {
                width: 165px;
                height: 165px;
            }

            .option img {
                width: 72px;
                height: 72px;
            }

            .option span {
                font-size: 40px;
            }

             .nav-btn {
                font-size: 22px;

                padding: 18px 28px;

                min-width: 170px;

                height: 60px;
            }
        }

        /* =========================================
           📺 4K / EXTRA LARGE (1921px+)
        ========================================= */
        @media screen and (min-width:1921px) {
            .template {
                max-width: 1500px;
            }

            .heading {
                font-size: 44px;
            }

            .question {
                width: 96%;
            }

            .q-no {
                font-size: 38px;
            }

            .line {
                min-width: 260px;
                height: 82px;
                font-size: 40px;
            }

            .sentence {
                font-size: 42px;
            }

            .option {
                width: 190px;
                height: 190px;
            }

            .option img {
                width: 85px;
                height: 85px;
            }

            .option span {
                font-size: 40px;
            }

            .nav-btn {
                font-size: 24px;

                padding: 18px 28px;

                min-width: 180px;

                height: 65px;
            }
        }
    </style>

<body>
    <div class="app">
        <div class="template">
            <div class="heading">
                सही शब्द चुनकर लिखिए।
            </div>
            <div class="questions-wrap" id="questionsWrap"></div>
            <div class="navigation-btns">
                <button id="prevBtn" class="nav-btn" onclick="prevPage()">
                    ⬅ पिछला
                </button>
                <button id="nextBtn" class="nav-btn" onclick="nextPage()">
                    अगला ➡
                </button>
            </div>
        </div>
    </div>

    <div id="answerPopup" class="kid-popup">
        <div class="popup-card" id="popupCard">
            <div class="popup-icon" id="popupIcon">🎉</div>
            <h2 id="popupTitle"></h2>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-card">
            <h2>🎉 शाबाश !</h2>
            <p id="finalScore"></p>
            <div id="stars">⭐⭐⭐</div>
            <button class="playAgain-btn" onclick="location.reload()">फिर से शुरू करें</button>
        </div>
    </div>

    <script>
        const pages = [
            [
                { answer: "नटखट", before: "", after: "मत बन ।", options: [{ text: "कसरत", image: "../assets/images/exercise.png" }, { text: "नटखट", image: "../assets/images/natkhat.png" }] },
                { answer: "अचकन", before: "", after: "पहन ।", options: [{ text: "अचकन", image: "../assets/images/achkan.png" }, { text: "कसरत", image: "../assets/images/exercise.png" }] }
            ],
            [
                { answer: "सच", before: "", after: "कह ।", options: [{ text: "पग", image: "../assets/images/foot.png" }, { text: "सच", image: "../assets/images/sach.png" }] },
                { answer: "जल", before: "", after: "भर ।", options: [{ text: "मत", image: "../assets/images/no.png" }, { text: "जल", image: "../assets/images/water.png" }] }
            ],
            [
                { answer: "बाजा", before: "राजा", after: "लाया ।", options: [{ text: "आया", image: "../assets/images/raja.png" }, { text: "बाजा", image: "../assets/images/band.png" }] },
                { answer: "गाना", before: "राजा", after: "गाया ।", options: [{ text: "गाना", image: "../assets/images/gaya.png" }, { text: "खाना", image: "../assets/images/khaya.png" }] }
            ],
            [
                { answer: "आम", before: "राजा", after: "खाया ।", options: [{ text: "आम", image: "../assets/images/mango.png" }, { text: "टमाटर", image: "../assets/images/tomato.png" }] },
                { answer: "बाजा", before: "राजा", after: "बजाया ।", options: [{ text: "गाना", image: "../assets/images/gaya.png" }, { text: "बाजा", image: "../assets/images/band.png" }] }
            ]
        ];

        const wrap = document.getElementById("questionsWrap");
        let currentPage = 0;
        let solvedAnswers = {};

        function loadPage(index) {
            wrap.innerHTML = "";
            pages[index].forEach((q, i) => {
                let saved = solvedAnswers[index]?.[i] || "";
                const optionsHtml = q.options.map(opt => `
                    <div class="option ${saved ? "disabled" : ""}" onclick="${saved ? "" : `selectOption(${i}, '${opt.text}', '${q.answer}')`}">
                        <img src="${opt.image}" alt="${opt.text}">
                        <span>${opt.text}</span>
                    </div>
                `).join("");

                wrap.innerHTML += `
                    <div class="question">
                        <div class="q-no">Q${(index * 2) + i + 1}.</div>
                        <div class="question-text">
                            ${q.before}
                            <div class="answer-line"></div>
                            ${q.after}
                        </div>
                        <div class="answer-box ${saved ? "correct" : ""}" id="line-${i}">${saved}</div>
                        <div class="options-container">
                            <div class="options">
                                ${optionsHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            enableQuestion();
            document.getElementById("prevBtn").style.display = currentPage === 0 ? "none" : "inline-block";
            checkPageSolved();
        }

        function enableQuestion() {
            const questions = document.querySelectorAll(".question");
            questions.forEach((q, i) => {
                const opts = q.querySelectorAll(".option");
                let solved = solvedAnswers[currentPage]?.[i];
                if (!solved) {
                    opts.forEach(o => {
                        o.style.pointerEvents = "auto";
                        o.style.opacity = "1";
                        o.classList.remove("disabled");
                    });
                } else {
                    opts.forEach(o => o.classList.add("disabled"));
                }
            });
        }

        function selectOption(qIndex, selected, answer) {
            const line = document.getElementById(`line-${qIndex}`);
            if (!line) return;
            line.innerHTML = selected;
            if (selected === answer) {
                line.classList.remove("wrong");
                line.classList.add("correct");
                if (!solvedAnswers[currentPage]) solvedAnswers[currentPage] = {};
                solvedAnswers[currentPage][qIndex] = selected;
                showPopup(true);
                playCorrectSound();
                fireConfetti();
                loadPage(currentPage);
            } else {
                line.classList.remove("correct");
                line.classList.add("wrong");
                showPopup(false);
                playWrongSound();
                setTimeout(() => {
                    if (line) {
                        line.innerHTML = "";
                        line.classList.remove("wrong");
                    }
                }, 700);
            }
        }

        function checkPageSolved() {
            let solved = solvedAnswers[currentPage] && Object.keys(solvedAnswers[currentPage]).length === pages[currentPage].length;
            const nextBtn = document.getElementById("nextBtn");
            if (solved && currentPage < pages.length - 1) {
                nextBtn.style.display = "block";
            } else if (!solved) {
                nextBtn.style.display = "none";
            } else if (solved && currentPage === pages.length - 1) {
                nextBtn.style.display = "none";
                setTimeout(showFinal, 1000);
            } else {
                nextBtn.style.display = "none";
            }
        }

        function nextPage() {
            if (currentPage + 1 < pages.length) {
                currentPage++;
                loadPage(currentPage);
                window.scrollTo(0, 0);
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                loadPage(currentPage);
                window.scrollTo(0, 0);
            }
        }

        function showPopup(isCorrect) {
            const popup = document.getElementById("answerPopup");
            const popupCard = document.getElementById("popupCard");
            const icon = document.getElementById("popupIcon");
            const title = document.getElementById("popupTitle");
            const msg = document.getElementById("popupMsg");
            popup.style.display = "flex";
            popupCard.className = "popup-card " + (isCorrect ? "popup-correct" : "popup-wrong");
            if (isCorrect) {
                icon.textContent = "🎉";
                title.textContent = "बहुत बढ़िया!";
                msg.textContent = "आपका उत्तर सही है।";
            } else {
                icon.textContent = "😯";
                title.textContent = "ओह!";
                msg.textContent = "फिर से प्रयास करें।";
            }
            setTimeout(() => { popup.style.display = "none"; }, 1200);
        }

        function showFinal() {
            const popup = document.getElementById("finalPopup");
            let totalSolved = 0;
            Object.keys(solvedAnswers).forEach(page => {
                totalSolved += Object.keys(solvedAnswers[page]).length;
            });
            document.getElementById("finalScore").innerHTML = `आपने ${totalSolved} शब्द सही किए`;
            popup.style.display = "flex";
            confetti({ particleCount: 180, spread: 130, origin: { y: 0.6 } });
            playCorrectSound();
        }

        function fireConfetti() {
            confetti({ particleCount: 60, spread: 80, origin: { y: 0.6 } });
        }

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        document.addEventListener("click", () => {
            if (audioContext.state === "suspended") audioContext.resume();
        }, { once: true });

        function playCorrectSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(520, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioContext.currentTime + 0.18);
            gain.gain.setValueAtTime(0.25, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.35);
        }

        function playWrongSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(300, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioContext.currentTime + 0.4);
            gain.gain.setValueAtTime(0.22, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.4);
        }

        loadPage(0);
    </script>
</body>

</html>
