<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Tiro Devanagari Hindi";

        }

        body {
            height: 100vh;
            overflow: hidden;

            background: url("./assets/images/bg.png");
            background-size: 100% 100%;
        }

        .app {
            height: 100vh;
            display: flex;
            background: rgba(211, 226, 228, 0.25);
        }

        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {

            width: 300px;

            padding: 25px 25px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            gap: 16px;
        }

        /* =========================================
   NEW KIDS FRIENDLY OPTION DESIGN
========================================= */

        .island-btn {

            position: relative;

            display: flex;
            align-items: center;

            gap: 16px;

            width: 100%;

            min-height: 62px;

            padding: 14px 18px;

            border-radius: 20px;

            font-size: 30px;
            font-weight: 500;

            cursor: pointer;

            transition: .3s ease;

            color: #8e8e8e;
            border: none;
            opacity: .7;

            overflow: hidden;
        }

        /* ONLY BOTTOM BORDER */

        .island-btn::after {

            content: "";

            position: absolute;

            left: 14px;
            right: 50px;
            bottom: 0;

            height: 4px;

            border-radius: 20px;

            background: #bdbdbd;

            transition: .3s ease;
        }

        /* ICON STYLE */

        .island-btn i {

            width: 42px;
            height: 42px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;

            flex-shrink: 0;

            transition: .3s ease;

            background: #efefef;

            color: #8b8b8b;
        }

        /* HOVER */

        .island-btn:hover {

            transform: translateY(-2px);
            opacity: .95;
        }

        .island-btn:hover i {
            transform: rotate(-5deg) scale(1.08);
        }

        /* ACTIVE */

        .island-btn.active {

            opacity: 1;
            transform: translateY(-3px);
        }

        .island-btn.active::after {
            height: 7px;
        }

        /* =========================================
   ACTIVE COLORS ONLY
========================================= */

        /* OPTION 1 */

        .o1.active {
            color: #3b82c4;
        }

        .o1.active::after {
            background: #57c7ff;
        }

        .o1.active i {
            color: #3b82c4;
        }

        /* OPTION 2 */

        .o2.active {
            color: #e08a1e;
        }

        .o2.active::after {
            background: #ffb14d;
        }

        .o2.active i {
            color: #e08a1e;
        }

        /* OPTION 3 */

        .o3.active {
            color: #34a853;
        }

        .o3.active::after {
            background: #6be585;
        }

        .o3.active i {
            color: #34a853;
        }

        /* OPTION 4 */

        .o4.active {
            color: #d95d84;
        }

        .o4.active::after {
            background: #ff8db0;
        }

        .o4.active i {
            color: #d95d84;
        }

        /* OPTION 5 */

        .o5.active {
            color: #e0b21a;
        }

        .o5.active::after {
            background: #e2c868;
        }

        .o5.active i {
            color: #e0b21a;
        }

        /* =========================================
           MAIN
        ========================================= */

        .main {
            flex: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* =========================================
           MOBILE
        ========================================= */

        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:1065px) {

            .app {
                flex-direction: column;
            }

            .sidebar {
                display: none;
            }

            .menu-btn {

                display: block;

                position: fixed;

                top: 8px;
                right: 15px;

                font-size: 26px;

                background: #e9a106;

                color: white;

                border: none;

                border-radius: 10px;

                padding: 6px 12px;

                cursor: pointer;

                z-index: 5000;
            }

            .offcanvas {

                position: fixed;

                inset: 0;

                background: rgba(0, 0, 0, .45);

                display: none;

                z-index: 4000;
            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {

                position: absolute;

                right: 0;
                top: 0;

                width: 300px;
                height: 100%;

                background: #f1f5f9;

                padding: 65px 20px 20px;

                transform: translateX(100%);

                transition: .3s;

                overflow-y: hidden;

                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
            }
        }

        /* =========================================
           HEIGHT RESPONSIVE
        ========================================= */

        @media (min-width: 900px) and (max-height: 800px) {

            .app {
                transform: scaleY(.95);
                transform-origin: top center;
                height: calc(100vh / .95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {

            .app {
                transform: scaleY(.9);
                transform-origin: top center;
                height: calc(100vh / .9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {

            .app {
                transform: scaleY(.85);
                transform-origin: top center;
                height: calc(100vh / .85);
            }
        }

        /* =========================================
           DESKTOP / MONITOR
        ========================================= */

        @media screen and (min-width:1025px) and (max-width:1440px) {

            .sidebar {
                width: 320px;
                padding: 26px 22px;
                gap: 20px;
            }

            .island-btn {
                font-size: 30px;
                padding: 20px 16px;
                border-radius: 22px;
            }

            .island-btn i {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
        }

        /* =========================================
           LARGE MONITORS
        ========================================= */

        @media screen and (min-width:1441px) and (max-width:1920px) {

            .sidebar {
                width: 360px;
                padding: 30px 15px;
                gap: 24px;
            }

            .island-btn {
                font-size: 30px;
                padding: 22px 20px;
                border-radius: 24px;
            }

            .island-btn i {
                width: 56px;
                height: 56px;
                font-size: 26px;
            }
        }

        /* =========================================
           4K
        ========================================= */

        @media screen and (min-width:1921px) {

            .sidebar {
                width: 420px;
                padding: 36px 20px;
                gap: 28px;
            }

            .island-btn {
                font-size: 30px;
                padding: 24px 22px;
                border-radius: 28px;
            }

            .island-btn i {
                width: 66px;
                height: 66px;
                font-size: 32px;
            }

            iframe {
                border-radius: 14px;
            }
        }
    </style>

    <link rel="stylesheet" href="assets/CSS/walkman-font.css">
</head>

<body>

    <!-- MOBILE BUTTON -->

    <button class="menu-btn" onclick="toggleMenu()">
        ☰
    </button>

    <div class="app">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <!-- <div class="island-btn o1 active" onclick="openIsland(0)">
                <i class="fa-solid fa-pencil"></i>
                पढ़ो और लिखो
            </div> -->

            <div class="island-btn o1 active" onclick="openIsland(0)">
                <i class="fa-solid fa-bullseye"></i>
                चित्रो पे गोला
            </div>

            <div class="island-btn o2" onclick="openIsland(1)">
                <i class="fa-solid fa-camera-retro"></i>
                चित्रो के नाम
            </div>

            <div class="island-btn o3" onclick="openIsland(2)">
                <i class="fa-solid fa-shapes"></i>
                चित्र मिलान
            </div>

            <div class="island-btn o4" onclick="openIsland(3)">
                <i class="fa-solid fa-star"></i>
                सही शब्द
            </div>

        </div>

        <!-- MAIN -->

        <div class="main">

            <iframe id="contentFrame" src="./exercises/circle.html"></iframe>

        </div>

    </div>

    <!-- MOBILE SIDEBAR -->

    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

        <div class="offcanvas-panel" onclick="event.stopPropagation()">

            <!-- <div class="island-btn o1 active" onclick="mobileOpen(0)">
                <i class="fa-solid fa-pencil"></i>
                पढ़ो और लिखो
            </div> -->

            <div class="island-btn o1 active" onclick="mobileOpen(0)">
                <i class="fa-solid fa-bullseye"></i>
                चित्रो पे गोला
            </div>

            <div class="island-btn o2" onclick="mobileOpen(1)">
                <i class="fa-solid fa-camera-retro"></i>
                चित्रो के नाम
            </div>

            <div class="island-btn o3" onclick="mobileOpen(2)">
                <i class="fa-solid fa-shapes"></i>
                चित्र मिलान
            </div>

            <div class="island-btn o4" onclick="mobileOpen(3)">
                <i class="fa-solid fa-star"></i>
                सही शब्द
            </div>

        </div>

    </div>

    <script>

        const sidebarButtons =
            document.querySelectorAll(".sidebar .island-btn");

        const mobileButtons =
            document.querySelectorAll(".offcanvas .island-btn");

        const frame =
            document.getElementById("contentFrame");

        const pages = [

            // "./exercises/read-write.html",

            "./exercises/circle.html",

            "./exercises/picture-name.html",

            "./exercises/match.html",

            "./exercises/right-word.html"
        ];

        function openIsland(index) {

            sidebarButtons.forEach(btn =>
                btn.classList.remove("active")
            );

            sidebarButtons[index]
                .classList.add("active");

            mobileButtons.forEach(btn =>
                btn.classList.remove("active")
            );

            mobileButtons[index]
                .classList.add("active");

            frame.src = pages[index];
        }

        function toggleMenu() {

            if (window.innerWidth > 1065)
                return;

            document
                .getElementById("offcanvas")
                .classList.toggle("show");
        }

        function mobileOpen(i) {

            openIsland(i);

            toggleMenu();
        }

    </script>




</body>

</html>
