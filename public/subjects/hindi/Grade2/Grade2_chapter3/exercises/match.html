<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Tiro Devanagari Hindi";

    }

    body {

      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app {

      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .template {

      width: min(1250px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 12px;
    }

    /* =========================================
       HEADING
    ========================================= */

    .instruction {
      text-align: center;

      padding: 12px 24px;

      border-radius: 0;

      background: transparent;

      color: #4b4b4b;

      font-size: 34px;
      font-weight: 500;

      border-bottom: 6px solid #ff9eb5;
    }

    /* =========================================
       MATCH AREA
    ========================================= */

    .match-layout {

      width: 100%;

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      position: relative;

      min-height: auto;

      padding-inline: 50px;

      margin-top: 8px;

      gap: 70px;
    }

    .side {

      width: 32%;

      display: flex;

      flex-direction: column;

      justify-content: flex-start;

      gap: 55px;
    }

    .center-words {

      width: 18%;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 18px;

      /* padding-top: 10px; */

      position: relative;

      z-index: 5;
    }

    .match-item {

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      position: relative;

      min-height: 120px;
    }

    .match-number {

      font-size: 28px;
      font-weight: 700;

      color: #555;

      width: 34px;
    }

    /* =========================================
       IMAGE BOX
    ========================================= */

    .img-box {

      width: 95px;
      height: 95px;

      display: flex;
      justify-content: center;
      align-items: center;

      cursor: pointer;

      transition: .25s ease;

      position: relative;

      background: transparent;

      border: 2px solid transparent;
      border-radius: 30px;

      box-shadow: none;
    }

    .img-box img {

      width: 90px;
      height: 90px;

      object-fit: contain;

      transition: .25s ease;

      filter:
        drop-shadow(0 6px 10px rgba(0, 0, 0, .08));
    }

    /* .left-side .match-item:nth-child(1) .img-box {
      background: #E5F7FF;
    }

    .left-side .match-item:nth-child(2) .img-box {
      background: #FFE5EE;
    }

    .left-side .match-item:nth-child(3) .img-box {
      background: #FFF5D9;
    }

    .left-side .match-item:nth-child(4) .img-box {
      background: #E7FFE8;
    } */


    /* RIGHT SIDE COLORS */

    /* .right-side .match-item:nth-child(1) .img-box {
      background: #F3E8FF;
    }

    .right-side .match-item:nth-child(2) .img-box {
      background: #DFF7F2;
    }

    .right-side .match-item:nth-child(3) .img-box {
      background: #FFEBD6;
    }

    .right-side .match-item:nth-child(4) .img-box {
      background: #E5ECFF;
    } */

    /* =========================================
       WORD BOX
    ========================================= */

    .word-box {

      width: 140px;

      min-height: 56px;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 10px 18px;

      border-radius: 18px;

      background:
        linear-gradient(135deg,
          #fff0c6,
          #ffeec0);

      text-align: center;

      font-size: 30px;
      font-weight: 500;

      color: #5f5f5f;

      cursor: pointer;

      transition: .25s ease;

      position: relative;

      z-index: 5;

      border: 2px solid #ffb96a;

      box-shadow:
        inset 0 3px 8px rgba(255, 255, 255, .9),
        0 8px 18px rgba(0, 0, 0, .05);
    }

    /* =========================================
       STATES
    ========================================= */

    .active {

      transform: scale(1.06);
      border: 2px solid orange;
      box-shadow:
        0 0 0 5px rgba(255, 209, 122, 0.25),
        0 10px 22px rgba(233, 181, 121, 0.08);
    }

    .matched {

      border-color: #7bd8a6 !important;

      background:
        linear-gradient(135deg,
          #effff4,
          #ddffe8) !important;

      color: #14914a !important;

      box-shadow:
        inset 0 3px 10px rgba(255, 255, 255, .9),
        0 6px 18px rgba(61, 185, 108, .12);
    }

    .wrong {

      border-color: red !important;

      background: #ffdede !important;

      animation: blink .5s ease;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .3;
      }
    }

    /* =========================================
       SVG LINE
    ========================================= */

    #lineSvg {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 0;
    }

    /* =========================================
       BUTTONS
    ========================================= */

    .navigation-btns {

      width: 100%;

      height: 80px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 20px;

      margin-top: 0px;

      flex-shrink: 0;

      position: relative;

      z-index: 3000;
    }

    .nav-btn {
      width: 150px;
      border: none;

      background:
        linear-gradient(135deg,
          #7dc8ff,
          #5ba7ff);

      color: white;

      padding: 14px 26px;

      border-radius: 50px;

      font-size: 20px;
      font-weight: 500;

      cursor: pointer;

      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.18);

      flex-shrink: 0;
    }

    /* =========================================
       POPUP
    ========================================= */

    .kid-popup {

      position: fixed;

      inset: 0;

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 5000;

      /* backdrop-filter: blur(4px); */
    }

    .popup-card {

      width: 320px;

      padding: 28px;

      border-radius: 30px;

      text-align: center;

      background: white;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, .2);
    }

    .popup-icon {

      width: 90px;
      height: 90px;

      border-radius: 50%;

      margin: auto;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 42px;

      margin-bottom: 15px;
    }

    .popup-card h2 {

      font-size: 32px;

      margin-bottom: 10px;
    }

    .popup-card p {
      font-size: 20px;
    }

    .popup-correct .popup-icon {

      background: #dff8e5;

      color: #22b455;
    }

    .popup-correct h2 {
      color: #189a48;
    }

    .popup-wrong .popup-icon {

      background: #ffe3e3;

      color: #ff4d4d;
    }

    .popup-wrong h2 {
      color: #e63946;
    }

    /* =========================================
       FINAL POPUP
    ========================================= */

    #finalPopup {

      position: fixed;

      inset: 0;

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 6000;

      /* backdrop-filter: blur(6px); */
    }

    .final-card {

      width: 420px;
      max-width: 92%;

      background: white;

      border-radius: 40px;

      padding: 35px;

      text-align: center;
    }

    .final-card h2 {

      font-size: 42px;

      color: #1ca34a;

      margin-bottom: 12px;
    }

    .final-card p {

      font-size: 24px;

      color: #4d5875;

      font-weight: 600;
    }

    #stars {

      font-size: 50px;

      margin: 20px 0;
    }

    .playAgain-btn {

      border: none;

      background:
        linear-gradient(135deg,
          #ffb14d,
          #ff8b2b);

      color: white;

      padding: 14px 35px;

      border-radius: 50px;

      font-size: 20px;
      font-weight: 600;

      cursor: pointer;
    }

    /* =========================================
📱 TABLETS (≤ 900px)
========================================= */

    @media (max-width:900px) {

      body {

        align-items: center;

        padding: 20px;

        overflow-x: hidden;
        overflow-y: auto;
      }

      .template {

        width: 100%;

        gap: 18px;
      }

      .instruction {

        font-size: 24px;

        width: auto;

        padding: 10px 22px;
      }

      .match-layout {

        width: 90%;

        padding-inline: 25px;

        gap: 30px;
      }

      .side {

        width: 32%;

        gap: 40px;
      }

      .center-words {

        width: 22%;

        gap: 22px;
      }

      .match-item {

        min-height: 100px;
      }

      .img-box {

        width: 90px;
        height: 90px;
      }

      .img-box img {

        width: 80px;
        height: 80px;
      }

      .word-box {

        width: 120px;

        min-height: 50px;

        font-size: 30px
      }

      .match-number {

        font-size: 22px;
      }

      .nav-btn {

        font-size: 16px;

        padding: 10px 18px;

        min-width: 130px;

        height: 48px;
      }

      .popup-card {

        width: 280px;

        padding: 22px;
      }

      .popup-card h2 {

        font-size: 24px;
      }

      .popup-card p {

        font-size: 16px;
      }

      .final-card {

        width: 90%;
        max-width: 340px;

        padding: 24px;
      }

      .final-card h2 {

        font-size: 32px;
      }

      .final-card p {

        font-size: 18px;
      }

      #stars {

        font-size: 34px;
      }
    }


    /* =========================================
📱 MOBILE (≤ 768px)
========================================= */

    @media (max-width:768px) {

      body {

        /* padding: 25px 10px; */

        align-items: flex-start;
        overflow: hidden;
      }

      .app {

        min-width: 850px;
      }

      .template {

        width: 100%;
      }

      .instruction {

        font-size: 20px;

        line-height: 1.4;

        padding: 10px 18px;
      }

      .match-layout {

        flex-direction: row;

        align-items: flex-start;

        justify-content: space-between;

        padding-inline: 20px;

        gap: 20px;
      }

      .side {

        width: 32%;

        gap: 25px;
      }

      .center-words {

        width: 20%;

        gap: 18px;
      }

      .match-item {

        min-height: 85px;
      }

      .img-box {

        width: 68px;
        height: 68px;
      }

      .img-box img {

        width: 52px;
        height: 52px;
      }

      .word-box {

        width: 105px;

        min-height: 44px;

        font-size: 17px;

        padding: 8px 10px;
      }

      .match-number {

        font-size: 18px;

        width: 24px;
      }

      #lineSvg {

        display: block;
      }

      .navigation-btns {

        height: 70px;

        margin-top: 15px;
      }

      .nav-btn {

        min-width: 115px;

        height: 44px;

        font-size: 15px;

        padding: 8px 14px;
      }

      .popup-card {

        width: 250px;

        padding: 18px;
      }

      .popup-icon {

        width: 70px;
        height: 70px;

        font-size: 34px;
      }

      .popup-card h2 {

        font-size: 22px;
      }

      .popup-card p {

        font-size: 15px;
      }

      .final-card {

        width: 92%;

        padding: 20px;
      }

      .final-card h2 {

        font-size: 28px;
      }

      .final-card p {

        font-size: 16px;
      }

      #stars {

        font-size: 30px;
      }

      .playAgain-btn {

        font-size: 16px;

        padding: 10px 22px;
      }
    }


    /* =========================================
📱 SMALL PHONES (≤ 480px)
========================================= */

    @media (max-width:480px) {

      /* body {

        padding: 20px 6px 100px;
      } */

      .app {

        min-width: 450px;
      }

      .instruction {

        font-size: 17px;

        padding: 10px 14px;
      }

      .match-layout {

        padding-inline: 12px;

        gap: 15px;
      }

      .side {

        gap: 18px;
      }

      .center-words {

        gap: 14px;
      }

      .match-item {

        min-height: 72px;
      }

      .img-box {

        width: 58px;
        height: 58px;
      }

      .img-box img {

        width: 42px;
        height: 42px;
      }

      .word-box {

        width: 88px;

        min-height: 38px;

        font-size: 14px;
      }

      .match-number {

        font-size: 15px;

        width: 20px;
      }

      .navigation-btns {

        height: 65px;
      }

      .nav-btn {

        min-width: 95px;

        height: 38px;

        font-size: 13px;

        padding: 6px 10px;
      }

      .popup-card {

        width: 220px;

        padding: 14px;
      }

      .popup-icon {

        width: 60px;
        height: 60px;

        font-size: 28px;
      }

      .popup-card h2 {

        font-size: 18px;
      }

      .popup-card p {

        font-size: 13px;
      }

      .final-card {

        padding: 18px;
      }

      .final-card h2 {

        font-size: 24px;
      }

      .final-card p {

        font-size: 14px;
      }

      #stars {

        font-size: 24px;
      }

      .playAgain-btn {

        padding: 8px 18px;

        font-size: 14px;
      }
    }


    /* ========================================
💻 Desktop / Laptop
======================================== */

    @media screen and (min-width:1025px) and (max-width:1440px) {

      .template {

        max-width: 1150px;
      }

      .instruction {

        font-size: 30px;
      }

      .img-box {

        width: 100px;
        height: 100px;
      }

      .img-box img {

        width: 90px;
        height: 90px;
      }

      .word-box {

        width: 145px;

        font-size: 30px;
      }
    }


    /* ========================================
🖥️ LARGE MONITORS
======================================== */

    @media screen and (min-width:1441px) and (max-width:1920px) {

      .template {

        max-width: 1350px;
      }

      .instruction {

        font-size: 38px;
      }

      .img-box {

        width: 115px;
        height: 115px;
      }

      .img-box img {

        width: 110px;
        height: 110px;
      }

      .word-box {

        width: 160px;

        min-height: 62px;

        font-size: 30px;
      }

      .match-number {

        font-size: 32px;
      }
    }


    /* ========================================
📺 4K / EXTRA LARGE
======================================== */

    @media screen and (min-width:1921px) {

      .template {

        max-width: 1500px;
      }

      .instruction {

        font-size: 44px;
      }

      .img-box {

        width: 130px;
        height: 130px;
      }

      .img-box img {

        width: 125px;
        height: 125px;
      }

      .word-box {

        width: 180px;

        min-height: 72px;

        font-size: 34px;
      }

      .match-number {

        font-size: 38px;
      }

      .nav-btn {

        font-size: 24px;

        padding: 18px 28px;

        min-width: 180px;

        height: 65px;
      }
    }
  </style>

<body>

  <div class="app">

    <div class="template">

      <div class="instruction">
        चित्रों को उनके नाम से मिलाइए।
      </div>

      <div class="match-layout">

        <div class="side left-side" id="leftSide">
        </div>

        <div class="center-words" id="centerWords">
        </div>

        <div class="side right-side" id="rightSide">
        </div>

        <svg id="lineSvg"></svg>

      </div>

    </div>

  </div>

  <!-- POPUP -->

  <div id="answerPopup" class="kid-popup">

    <div class="popup-card" id="popupCard">

      <div class="popup-icon" id="popupIcon">

        🎉

      </div>

      <h2 id="popupTitle"></h2>

      <p id="popupMsg"></p>

    </div>

  </div>

  <!-- FINAL -->

  <div id="finalPopup">

    <div class="final-card">

      <h2>🎉 शाबाश !</h2>

      <p id="finalScore"></p>

      <div id="stars">
        ⭐⭐⭐
      </div>

      <button class="playAgain-btn" onclick="location.reload()">

        फिर से शुरू करें

      </button>

    </div>

  </div>

  <script>

    const gamePages = [
      // PAGE 1
      [
        {
          id: 1,
          word: "डाकिया",
          img: "../assets/images/postman.png",
          side: "left"
        },
        {
          id: 2,
          word: "किशमिश",
          img: "../assets/images/raisins.png",
          side: "left"
        },
        {
          id: 3,
          word: "किसान",
          img: "../assets/images/farmer.png",
          side: "left"
        },
        {
          id: 4,
          word: "किताब",
          img: "../assets/images/book.png",
          side: "right"
        },
        {
          id: 5,
          word: "गिटार",
          img: "../assets/images/guitar.png",
          side: "right"
        },
        {
          id: 6,
          word: "लिफाफा",
          img: "../assets/images/envelope1.png",
          side: "right"
        }
      ],

      // PAGE 2
      [
        {
          id: 7,
          word: "सीढ़ी",
          img: "../assets/images/ladder.png",
          side: "left"
        },
        {
          id: 8,
          word: "नीला",
          img: "../assets/images/blue.png",
          side: "left"
        },
        {
          id: 9,
          word: "झील",
          img: "../assets/images/lake.png",
          side: "left"
        },
        {
          id: 10,
          word: "रानी",
          img: "../assets/images/queen.png",
          side: "right"
        },
        {
          id: 11,
          word: "लीची",
          img: "../assets/images/litchi.png",
          side: "right"
        },
        {
          id: 12,
          word: "नानी",
          img: "../assets/images/grandmother.png",
          side: "right"
        }
      ]
    ];

    let selectedImage = null;
    let selectedWord = null;

    let currentPage = 0;

    let pageSolved = [false, false];

    let matchedItems = {};

    const leftSide =
      document.getElementById("leftSide");

    const rightSide =
      document.getElementById("rightSide");

    const centerWords =
      document.getElementById("centerWords");

    const svg =
      document.getElementById("lineSvg");

    function loadGame() {

      leftSide.innerHTML = "";
      rightSide.innerHTML = "";
      centerWords.innerHTML = "";

      svg.innerHTML = "";

      const data =
        gamePages[currentPage];

      let leftCount = 1;

      let rightCount =
        currentPage === 0
          ? 3
          : 4;

      const shuffledWords =
        [...data].sort(
          () => Math.random() - 0.5
        );

      data.forEach((item) => {

        const imageBox =

          `
        <div class="match-item">

          ${item.side === "left"
            ?

            `<div class="match-number">
              ${leftCount++})
            </div>`

            :

            ""
          }

          <div class="img-box
          ${matchedItems[item.id] ? "matched" : ""}"

          id="img-${item.id}"

          onclick="selectImage(${item.id})">

            <img src="${item.img}">

          </div>

          ${item.side === "right"
            ?

            `<div class="match-number">
              ${rightCount++})
            </div>`

            :

            ""
          }

        </div>
        `;

        if (item.side === "left") {

          leftSide.innerHTML +=
            imageBox;
        }

        else {

          rightSide.innerHTML +=
            imageBox;
        }
      });

      shuffledWords.forEach((item) => {

        const wordBox =

          `
        <div class="word-box
        ${matchedItems[item.id] ? "matched" : ""}"

        id="word-${item.id}"

        onclick="selectWord(${item.id})">

          ${item.word}

        </div>
        `;

        centerWords.innerHTML +=
          wordBox;
      });

      restoreLines();

      updateButtons();
    }

    loadGame();

    function updateButtons() {

      let nextBtn =
        document.getElementById("nextBtn");

      let prevBtn =
        document.getElementById("prevBtn");

      if (!nextBtn) {

        const btnWrap =
          document.createElement("div");

        btnWrap.className =
          "navigation-btns";

        btnWrap.innerHTML =

          `
        <button id="prevBtn"
        class="nav-btn">

          ⬅ पिछला

        </button>

        <button id="nextBtn"
        class="nav-btn">

          अगला ➡

        </button>
        `;

        document
          .querySelector(".template")
          .appendChild(btnWrap);

        nextBtn =
          document.getElementById("nextBtn");

        prevBtn =
          document.getElementById("prevBtn");

        nextBtn.onclick = nextPage;
        prevBtn.onclick = prevPage;
      }

      prevBtn.style.display =
        currentPage === 0
          ? "none"
          : "block";

      nextBtn.style.display =
        pageSolved[currentPage]
          ? "block"
          : "none";

      if (currentPage === gamePages.length - 1) {

        nextBtn.style.display = "none";
      }
    }

    function selectImage(id) {

      const box =
        document.getElementById(
          `img-${id}`
        );

      if (
        box.classList.contains(
          "matched"
        )
      ) return;

      document
        .querySelectorAll(".img-box")
        .forEach(el => {

          el.classList.remove(
            "active"
          );
        });

      box.classList.add("active");

      selectedImage = id;

      checkMatch();
    }

    function selectWord(id) {

      const box =
        document.getElementById(
          `word-${id}`
        );

      if (
        box.classList.contains(
          "matched"
        )
      ) return;

      document
        .querySelectorAll(".word-box")
        .forEach(el => {

          el.classList.remove(
            "active"
          );
        });

      box.classList.add("active");

      selectedWord = id;

      checkMatch();
    }

    function checkMatch() {

      if (
        selectedImage === null ||
        selectedWord === null
      ) return;

      const img =
        document.getElementById(
          `img-${selectedImage}`
        );

      const word =
        document.getElementById(
          `word-${selectedWord}`
        );

      const currentData =
        gamePages[currentPage];

      const imgData =
        currentData.find(
          item => item.id === selectedImage
        );

      const wordData =
        currentData.find(
          item => item.id === selectedWord
        );

      if (
        imgData.word ===
        wordData.word
      ) {

        matchedItems[selectedImage] = true;

        img.classList.add(
          "matched"
        );

        word.classList.add(
          "matched"
        );

        img.classList.remove(
          "active"
        );

        word.classList.remove(
          "active"
        );

        drawLine(img, word);

        playCorrectSound();

        showPopup(true);

        fireConfetti();

        const solvedCount =
          currentData.filter(
            item => matchedItems[item.id]
          ).length;

        if (
          solvedCount === currentData.length
        ) {

          pageSolved[currentPage] = true;

          updateButtons();

          if (
            currentPage ===
            gamePages.length - 1
          ) {

            setTimeout(
              showFinal,
              1200
            );
          }
        }
      }

      else {

        img.classList.add(
          "wrong"
        );

        word.classList.add(
          "wrong"
        );

        playWrongSound();

        showPopup(false);

        setTimeout(() => {

          img.classList.remove(
            "wrong",
            "active"
          );

          word.classList.remove(
            "wrong",
            "active"
          );

        }, 600);
      }

      selectedImage = null;
      selectedWord = null;
    }

    function nextPage() {

      if (
        currentPage <
        gamePages.length - 1
      ) {

        currentPage++;

        loadGame();

        window.scrollTo(0, 0);
      }
    }

    function prevPage() {

      if (currentPage > 0) {

        currentPage--;

        loadGame();

        window.scrollTo(0, 0);
      }
    }

    function restoreLines() {

      const currentData =
        gamePages[currentPage];

      currentData.forEach(item => {

        if (matchedItems[item.id]) {

          const img =
            document.getElementById(
              `img-${item.id}`
            );

          const word =
            document.getElementById(
              `word-${item.id}`
            );

          drawLine(img, word);
        }
      });
    }

    function drawLine(imgEl, wordEl) {

      const svgRect =
        svg.getBoundingClientRect();

      const imgRect =
        imgEl.getBoundingClientRect();

      const wordRect =
        wordEl.getBoundingClientRect();

      let x1;
      let y1;
      let x2;
      let y2;

      if (
        imgRect.left <
        window.innerWidth / 2
      ) {

        x1 =
          imgRect.right -
          svgRect.left;

        y1 =
          imgRect.top +
          imgRect.height / 2 -
          svgRect.top;

        x2 =
          wordRect.left -
          svgRect.left;

        y2 =
          wordRect.top +
          wordRect.height / 2 -
          svgRect.top;
      }

      else {

        x1 =
          imgRect.left -
          svgRect.left;

        y1 =
          imgRect.top +
          imgRect.height / 2 -
          svgRect.top;

        x2 =
          wordRect.right -
          svgRect.left;

        y2 =
          wordRect.top +
          wordRect.height / 2 -
          svgRect.top;
      }

      const line =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      line.setAttribute("x1", x1);
      line.setAttribute("y1", y1);

      line.setAttribute("x2", x2);
      line.setAttribute("y2", y2);

      line.setAttribute(
        "stroke",
        "#8ccfb5"
      );

      line.setAttribute(
        "stroke-width",
        "4"
      );

      line.setAttribute(
        "stroke-dasharray",
        "8 8"
      );

      svg.appendChild(line);
    }

    function showPopup(isCorrect) {

      const popup =
        document.getElementById(
          "answerPopup"
        );

      const popupCard =
        document.getElementById(
          "popupCard"
        );

      const icon =
        document.getElementById(
          "popupIcon"
        );

      const title =
        document.getElementById(
          "popupTitle"
        );

      const msg =
        document.getElementById(
          "popupMsg"
        );

      popup.style.display =
        "flex";

      popupCard.className =
        "popup-card " +

        (
          isCorrect
            ? "popup-correct"
            : "popup-wrong"
        );

      if (isCorrect) {

        icon.textContent = "🎉";

        title.textContent =
          "बहुत बढ़िया!";

        msg.textContent =
          "आपका उत्तर सही है।";
      }

      else {

        icon.textContent = "😯";

        title.textContent =
          "ओह!";

        msg.textContent =
          "फिर से प्रयास करें।";
      }

      setTimeout(() => {

        popup.style.display =
          "none";

      }, 1000);
    }

    function showFinal() {

      const popup =
        document.getElementById(
          "finalPopup"
        );

      let totalSolved =
        Object.keys(
          matchedItems
        ).length;

      document.getElementById(
        "finalScore"
      ).textContent =

        `आपने ${totalSolved}
        सही मिलान किए`;

      popup.style.display =
        "flex";

      confetti({

        particleCount: 160,

        spread: 120,

        origin: { y: 0.6 }

      });
      playCorrectSound();
    }

    function fireConfetti() {

      confetti({

        particleCount: 60,

        spread: 80,

        origin: { y: 0.6 }

      });
    }

    const audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    // =========================================
    // UNLOCK AUDIO
    // =========================================

    document.addEventListener(
      "click",
      () => {

        if (
          audioContext.state === "suspended"
        ) {

          audioContext.resume();
        }
      },
      { once: true }
    );

    // =========================================
    // CORRECT SOUND
    // =========================================

    function playCorrectSound() {

      const osc =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      osc.type = "triangle";

      osc.frequency.setValueAtTime(
        520,
        audioContext.currentTime
      );

      osc.frequency.exponentialRampToValueAtTime(
        880,
        audioContext.currentTime + 0.18
      );

      gain.gain.setValueAtTime(
        0.25,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.35
      );

      osc.connect(gain);

      gain.connect(audioContext.destination);

      osc.start();

      osc.stop(
        audioContext.currentTime + 0.35
      );
    }

    // =========================================
    // WRONG SOUND
    // =========================================

    function playWrongSound() {

      const osc =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      osc.type = "sawtooth";

      osc.frequency.setValueAtTime(
        300,
        audioContext.currentTime
      );

      osc.frequency.exponentialRampToValueAtTime(
        120,
        audioContext.currentTime + 0.4
      );

      gain.gain.setValueAtTime(
        0.22,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.4
      );

      osc.connect(gain);

      gain.connect(audioContext.destination);

      osc.start();

      osc.stop(
        audioContext.currentTime + 0.4
      );
    }

  </script>

</body>
