    <style>
        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            font-family: "Tiro Devanagari Hindi";

        }

        body {

            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app {

            width: 100%;
            display: flex;
            justify-content: center;
        }

        .template {

            width: min(1250px, 100%);

            display: flex;
            flex-direction: column;

            gap: 20px;

            position: relative;
        }

        .question-card {

            width: 220px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 20px;

            position: relative;
        }


        /* IMAGE BOX */

        .img-box {

            width: 120px;
            height: 120px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            overflow: hidden;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.08);

            transition: .3s ease;
        }

        /* DIFFERENT PASTEL COLORS */

        .question-card:nth-child(1) .img-box {
            background: #FFE5EC;
        }

        .question-card:nth-child(2) .img-box {
            background: #E3F6FF;
        }

        .question-card:nth-child(3) .img-box {
            background: #FFF4CC;
        }

        .question-card:nth-child(4) .img-box {
            background: #E8FFE7;
        }

        .question-card:nth-child(5) .img-box {
            background: #F3E8FF;
        }

        .img-box:hover {

            transform: translateY(-4px) scale(1.03);
        }

        .img-box img {

            width: 78%;
            height: 78%;

            object-fit: contain;
        }


        /* QUESTION NUMBER */

        .q-number {

            position: absolute;

            top: -8px;
            right: 42px;

            width: 36px;
            height: 36px;

            border-radius: 50%;

            background: linear-gradient(135deg,
                    #ff7eb3,
                    #ff4f9a);

            color: white;

            font-size: 17px;
            font-weight: 700;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow:
                0 6px 15px rgba(255, 79, 154, .35);

            z-index: 100;
        }


        /* LETTER ROW */

        .letter-row {

            display: flex;

            gap: 12px;

            justify-content: center;

            margin-top: 12px;
        }


        /* NEW INPUT STYLE */

        .letter-box {

            width: 44px;
            height: 50px;

            background: transparent;

            border: none;

            border-bottom: 4px solid #ff8ab5;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
            font-weight: 500;

            color: #444;

            cursor: pointer;

            transition: .25s ease;

            position: relative;
        }


        /* STYLISH HOVER */

        .letter-box:hover {

            transform: translateY(-3px);

            border-color: #8b5cf6;
        }


        /* FILLED LETTER */

        .letter-box.locked {

            border-bottom: 4px solid #22c55e;

            color: #16a34a;

            /* background: rgba(34, 197, 94, .08); */

            border-radius: 12px 12px 4px 4px;
        }


        /* WRONG */

        .letter-box.wrong {

            border-bottom: 4px solid #ef4444;

            color: #ef4444;

            animation: shake .4s ease;
        }


        /* SHAKE */

        @keyframes shake {

            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            50% {
                transform: translateX(4px);
            }

            75% {
                transform: translateX(-4px);
            }

            100% {
                transform: translateX(0);
            }
        }


        /* OPTION BUTTONS */

        .option-btn {

            min-width: 54px;
            height: 52px;

            border-radius: 16px;

            border: none;

            background: linear-gradient(135deg,
                    #ff9ec4,
                    #ff5f9f);

            font-size: 26px;
            font-weight: 500;

            cursor: pointer;

            box-shadow:

            transition: .25s;
        }

        .option-btn:hover {

            transform: scale(1.08);
        }

            .heading {
                font-size: 44px;
            }

            .nav-btn {
                min-width: 180px;
                height: 65px;
                font-size: 24px;
                padding: 18px 28px;
            }
        }
    </style>

    <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

    <div class="app">

        <div class="template">

            <div class="heading">
                चित्रों के नाम लिखिए।
            </div>

            <div class="questions-wrap" id="questionsWrap"></div>

            <div class="navigation-btns">

                <button id="prevBtn" class="nav-btn" onclick="prevPage()">
                    ⬅ पिछला
                </button>

                <button id="nextBtn" class="nav-btn" onclick="nextPage()">
                    अगला ➡
                </button>

            </div>

        </div>

    </div>
    </div>

    <!-- POPUP -->

    <div id="answerPopup" class="kid-popup">

        <div class="popup-card" id="popupCard">

            <div class="popup-icon" id="popupIcon">🎉</div>

            <h2 id="popupTitle"></h2>

            <p id="popupMsg"></p>

        </div>

    </div>

    <!-- FINAL -->

    <div id="finalPopup">

        <div class="final-card">

            <h2>🎉 शाबाश !</h2>

            <p id="finalScore"></p>

            <div id="stars">
                ⭐⭐⭐
            </div>

            <button class="playAgain-btn" onclick="location.reload()">
                फिर से शुरू करें
            </button>

        </div>

    </div>

    <script>

        const pages = [
            [
                {
                    image: "../assets/images/fort.png",
                    word: "किला"
                },
                {
                    image: "../assets/images/farmer.png",
                    word: "किसान"
                },
                {
                    image: "../assets/images/glass.png",
                    word: "गिलास"
                },
                {
                    image: "../assets/images/aeroplane.png",
                    word: "विमान"
                },
                {
                    image: "../assets/images/wheel.png",
                    word: "पहिया"
                }
            ],
            [
                {
                    image: "../assets/images/lamp.png",
                    word: "दीपक"
                },
                {
                    image: "../assets/images/ladder.png",
                    word: "सीढ़ी"
                },
                {
                    image: "../assets/images/saree.png",
                    word: "साड़ी"
                },
                {
                    image: "../assets/images/arrow.png",
                    word: "तीर"
                },
                {
                    image: "../assets/images/spider.png",
                    word: "मकड़ी"
                }
            ]
        ];

        const wrap =
            document.getElementById(
                "questionsWrap"
            );

        let currentPage = 0;

        let solvedCount = 0;
        let solvedPages = {};

        function splitHindiLetters(word) {

            const matras = [
                "ा", "ि", "ी", "ु", "ू",
                "े", "ै", "ो", "ौ", "ं",
                "ः", "ँ", "ृ"
            ];

            let letters = [];

            for (let i = 0; i < word.length; i++) {

                let current = word[i];

                // HANDLE NUKTA LETTERS (ड़, ढ़ etc)

                if (
                    i + 1 < word.length &&
                    word[i + 1] === "़"
                ) {

                    current += word[i + 1];
                    i++;
                }

                // ATTACH MATRA

                if (
                    i + 1 < word.length &&
                    matras.includes(word[i + 1])
                ) {

                    current += word[i + 1];
                    i++;
                }

                letters.push(current);
            }

            return letters;
        }

        function loadPage(index) {

            wrap.innerHTML = "";

            const pageData =
                pages[index];

            pageData.forEach((item, qIndex) => {

                let savedWord =
                    solvedPages[index]?.[qIndex] || "";

                let html = `

                    <div class="question-card">

                    <div class="q-number">
                    ${qIndex + 1}
                    </div>

                    <div class="img-box">
                    <img src="${item.image}">
                    </div>

                    <div class="letter-row">

                    ${splitHindiLetters(item.word).map((l, i) => `

                    <div class="letter-box
                    ${savedWord ? "locked" : ""}"

                    data-answer="${l}"
                    data-index="${i}"
                    data-question="${qIndex}"

                    onclick="showOptions(this,'${l}')">

                    ${splitHindiLetters(savedWord)[i] || ""}

                    </div>

                    `).join("")}

                    </div>

                    <div class="options"
                    id="options-${qIndex}">
                    </div>

                    </div>

                    `;

                wrap.innerHTML += html;

            });

            const cards =
                document.querySelectorAll(
                    ".question-card"
                );

            cards.forEach((card, i) => {

                if (i >= 3) {

                    card.style.marginTop =
                        "20px";
                }

            });

            // PREV BUTTON

            document.getElementById(
                "prevBtn"
            ).style.display =

                index === 0
                    ? "none"
                    : "block";

            // NEXT BUTTON

            let allSolved = true;

            document.querySelectorAll(
                ".question-card"
            ).forEach(card => {

                const boxes =
                    card.querySelectorAll(
                        ".letter-box"
                    );

                boxes.forEach(box => {

                    if (
                        !box.classList.contains(
                            "locked"
                        )
                    ) {

                        allSolved = false;
                    }
                });
            });

            document.getElementById(
                "nextBtn"
            ).style.display =

                (
                    allSolved &&
                    currentPage <
                    pages.length - 1
                )
                    ? "block"
                    : "none";

            enableCurrentQuestion();
        }

        loadPage(0);

        function enableCurrentQuestion() {

            document.querySelectorAll(".letter-box").forEach(box => {

                if (!box.classList.contains("locked")) {

                    box.style.pointerEvents = "auto";
                    box.style.opacity = "1";
                }
            });

        }

        function showOptions(
            box,
            correctLetter
        ) {

            // ALLOW ONLY CURRENT EMPTY BOX

            const currentRow =
                box.parentElement;

            const allBoxes =
                currentRow.querySelectorAll(
                    ".letter-box"
                );

            let firstEmpty = null;

            allBoxes.forEach(b => {

                if (
                    firstEmpty === null &&
                    b.textContent.trim() === ""
                ) {

                    firstEmpty = b;
                }
            });

            // BLOCK OTHER BOXES

            if (box !== firstEmpty) {

                return;
            }

            if (
                box.classList.contains(
                    "locked"
                )
            ) return;

            document.querySelectorAll(
                ".options"
            ).forEach(opt => {

                opt.innerHTML = "";
            });

            const optionsWrap =
                box.parentElement.nextElementSibling;

            optionsWrap.innerHTML = "";

            const hindiLetters = [

                "क", "ख", "ग", "च", "ट",
                "द", "न", "म", "र", "स",
                "प", "ल", "ब", "ह"

            ];

            let wrong =
                hindiLetters[
                Math.floor(
                    Math.random() *
                    hindiLetters.length
                )
                ];

            if (wrong === correctLetter) {

                wrong = "न";
            }

            const arr =
                Math.random() > .5
                    ? [correctLetter, wrong]
                    : [wrong, correctLetter];

            arr.forEach(letter => {

                const btn =
                    document.createElement(
                        "button"
                    );

                btn.className =
                    "option-btn";

                btn.textContent =
                    letter;

                btn.onclick = (e) => {

                    e.stopPropagation();

                    chooseLetter(
                        box,
                        letter,
                        correctLetter
                    );
                };

                optionsWrap.appendChild(
                    btn
                );
            });
        }

        function chooseLetter(
            box,
            selected,
            correct
        ) {

            // FILL SELECTED LETTER

            box.textContent =
                selected;

            // CLOSE OPTIONS

            box.parentElement
                .nextElementSibling.innerHTML =
                "";

            const currentRow =
                box.parentElement;

            const allBoxes =
                currentRow.querySelectorAll(
                    ".letter-box"
                );

            let formedWord = "";

            let originalWord = "";

            let filledCount = 0;

            // CREATE WORDS

            allBoxes.forEach(b => {

                formedWord +=
                    b.textContent.trim();

                originalWord +=
                    b.dataset.answer.trim();

                // COUNT FILLED BOXES

                if (
                    b.textContent.trim() !== ""
                ) {

                    filledCount++;
                }

            });

            // DO NOT CHECK UNTIL FULL WORD FILLED

            if (
                filledCount !== allBoxes.length
            ) {

                return;
            }

            // =========================
            // CORRECT WORD
            // =========================

            if (
                formedWord === originalWord
            ) {

                playCorrectSound();

                allBoxes.forEach(x => {

                    x.classList.add(
                        "locked"
                    );
                });

                // SAVE ANSWER

                if (!solvedPages[currentPage]) {

                    solvedPages[currentPage] = {};
                }

                const qIndex =
                    box.dataset.question;

                solvedPages[currentPage][qIndex] =
                    formedWord;

                showPopup(true);

                fireConfetti();

                checkCompleted();
                enableCurrentQuestion();
            }

            // =========================
            // WRONG WORD
            // =========================

            else {

                playWrongSound();

                allBoxes.forEach(x => {

                    x.classList.add(
                        "wrong"
                    );

                    setTimeout(() => {

                        x.classList.remove(
                            "wrong"
                        );

                        x.textContent = "";

                        x.classList.remove(
                            "locked"
                        );

                    }, 700);

                });

                showPopup(false);
                enableCurrentQuestion();
            }
        }

        function checkCompleted() {

            const cards =
                document.querySelectorAll(
                    ".question-card"
                );

            let allDone = true;

            cards.forEach(card => {

                const boxes =
                    card.querySelectorAll(
                        ".letter-box"
                    );

                boxes.forEach(box => {

                    if (
                        !box.classList.contains(
                            "locked"
                        )
                    ) {

                        allDone = false;
                    }

                });

            });

            if (allDone) {

                solvedCount += 5;

                fireConfetti();

                if (
                    currentPage <
                    pages.length - 1
                ) {

                    document.getElementById(
                        "nextBtn"
                    ).style.display = "block";
                }

                else {

                    setTimeout(
                        showFinal,
                        1000
                    );
                }
            }
        }

        function nextPage() {

            if (
                currentPage <
                pages.length - 1
            ) {

                currentPage++;

                loadPage(currentPage);

                window.scrollTo(0, 0);
            }
        }

        function prevPage() {

            if (currentPage > 0) {

                currentPage--;

                loadPage(currentPage);

                window.scrollTo(0, 0);
            }
        }

        document.addEventListener(
            "click",
            (e) => {

                if (
                    !e.target.classList.contains(
                        "letter-box"
                    ) &&
                    !e.target.classList.contains(
                        "option-btn"
                    )
                ) {

                    document.querySelectorAll(
                        ".options"
                    ).forEach(opt => {

                        opt.innerHTML = "";
                    });
                }
            }
        );

        document.addEventListener("keydown", (e) => {

            if (e.key !== "Backspace") return;

            // current active question
            const cards = document.querySelectorAll(".question-card");

            for (const card of cards) {

                const boxes = card.querySelectorAll(".letter-box");

                // skip solved questions
                if ([...boxes].every(box =>
                    box.classList.contains("locked")
                )) {
                    continue;
                }

                // remove last filled unlocked box
                for (let i = boxes.length - 1; i >= 0; i--) {

                    if (
                        boxes[i].textContent.trim() !== "" &&
                        !boxes[i].classList.contains("locked")
                    ) {

                        boxes[i].textContent = "";

                        e.preventDefault();

                        return;
                    }
                }

                break; // only work on first active question
            }
        });

        // POPUP

        function showPopup(isCorrect) {

            const popup =
                document.getElementById(
                    "answerPopup"
                );

            const popupCard =
                document.getElementById(
                    "popupCard"
                );

            const icon =
                document.getElementById(
                    "popupIcon"
                );

            const title =
                document.getElementById(
                    "popupTitle"
                );

            const msg =
                document.getElementById(
                    "popupMsg"
                );

            popup.style.display = "flex";

            popupCard.className =
                "popup-card " +
                (
                    isCorrect
                        ? "popup-correct"
                        : "popup-wrong"
                );

            if (isCorrect) {

                icon.textContent = "🎉";

                title.textContent =
                    "बहुत बढ़िया!";

                msg.textContent =
                    "आपका उत्तर सही है।";
            }

            else {

                icon.textContent = "😯";

                title.textContent =
                    "ओह!";

                msg.textContent =
                    "फिर से प्रयास करें।";
            }

            setTimeout(() => {

                popup.style.display =
                    "none";

            }, 1000);
        }

        // FINAL

        function showFinal() {

            const popup =
                document.getElementById(
                    "finalPopup"
                );

            document.getElementById(
                "finalScore"
            ).textContent =

                `आपने ${solvedCount}
                शब्द सही लिखे`;

            popup.style.display =
                "flex";

            confetti({

                particleCount: 180,

                spread: 120,

                origin: { y: 0.6 }

            });

            playCorrectSound();
        }

        // CONFETTI

        function fireConfetti() {

            confetti({

                particleCount: 60,

                spread: 80,

                origin: { y: 0.6 }

            });
        }

        // SOUNDS

        const audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        // =========================================
        // UNLOCK AUDIO
        // =========================================

        document.addEventListener(
            "click",
            () => {

                if (
                    audioContext.state === "suspended"
                ) {

                    audioContext.resume();
                }
            },
            { once: true }
        );

        // =========================================
        // CORRECT SOUND
        // =========================================

        function playCorrectSound() {

            const osc =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            osc.type = "triangle";

            osc.frequency.setValueAtTime(
                520,
                audioContext.currentTime
            );

            osc.frequency.exponentialRampToValueAtTime(
                880,
                audioContext.currentTime + 0.18
            );

            gain.gain.setValueAtTime(
                0.25,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 0.35
            );

            osc.connect(gain);

            gain.connect(audioContext.destination);

            osc.start();

            osc.stop(
                audioContext.currentTime + 0.35
            );
        }

        // =========================================
        // WRONG SOUND
        // =========================================

        function playWrongSound() {

            const osc =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            osc.type = "sawtooth";

            osc.frequency.setValueAtTime(
                300,
                audioContext.currentTime
            );

            osc.frequency.exponentialRampToValueAtTime(
                120,
                audioContext.currentTime + 0.4
            );

            gain.gain.setValueAtTime(
                0.22,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 0.4
            );

            osc.connect(gain);

            gain.connect(audioContext.destination);

            osc.start();

            osc.stop(
                audioContext.currentTime + 0.4
            );
        }

    </script>

</body>

</html>
