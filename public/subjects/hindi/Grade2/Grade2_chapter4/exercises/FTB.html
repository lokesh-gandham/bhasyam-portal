        * {

            margin: 0;
            padding: 0;
            font-family: "Tiro Devanagari Hindi";

        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* background: linear-gradient(145deg, #fef5e7 0%, #fae8f0 100%); */
            /* padding: 20px; */
        }

        .quiz {
            width: 100%;
            max-width: 1000px;
            /* background: #fffef9;
            border-radius: 65px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.12);
            padding: 2rem 1.8rem 2.5rem;
            border: 1px solid #ffe0e7; */
        }

        /* QUESTION */
        .question-box {

            width: 80%;
            margin: 0 auto 7px;
            background: #fff2f0;
            border: 1px solid #ffcdd9;
            border-radius: 60px;
            padding: 10px 25px;
            text-align: center;
            font-size: 22px;
            font-weight: 500;
            color: #bc5f7a;
        }

        /* LAYOUT */
        .quiz-layout {
            display: flex;
            /* gap: 40px; */
            width: 100%;
            flex-wrap: wrap;

        }

        /* LEFT SECTION - Image */
        .left-section {
            flex: 1;
            min-width: 280px;
            min-height: 240px;
            text-align: center;
        }

        .question-above-image {
            font-size: 1.1rem;
            font-weight: 600;
            color: #5a6a8a;
            background: #ffffff;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid #becae3;
            margin-bottom: 15px;
            display: none;
        }

        .meaning-image {
            width: 80%;
            height: 100%;
            object-fit: contain;
            margin: 0 auto;
            display: block;
            /* background: #fff0e0;
            border-radius: 40px;
            padding: 20px;
            border: 3px solid #ffaa55;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); */
        }

        /* RIGHT SECTION - Poem Box with Options Inside */
        .right-section {
            flex: 1;
            min-width: 300px;
            margin-top: 30px;
        }

        .poem-box {
            /* background: white; */
            /* border: 2px solid #becae3; */
            border-radius: 35px;
            padding: 30px;
            min-height: 350px;
            /* box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); */
            display: flex;
            flex-direction: column;
            gap: 25px;

        }

        .poem-line {
            /* font-size: 1.3rem; */
            font-size: 30px;
            line-height: 2;
            color: #5a6a8a;
            font-weight: 500;
            text-align: center;
        }

        .blank-input {
            display: inline-block;
            min-width: 100px;
            padding: 6px 12px;
            background: #f0f0f0;
            border-radius: 30px;
            color: #1f7a48;
            font-weight: 500;
            /* font-size: 1.2rem; */
            font-size: 30px;
            text-align: center;
            margin: 0 5px;
        }

        /* Options inside poem box */
        .options-container {
            margin-top: 10px;
            border-top: 2px dashed #becae3;
            padding-top: 20px;
        }

        .options-title {
            font-size: 1rem;
            font-weight: 500;
            color: #5a6a8a;
            text-align: center;
            margin-bottom: 15px;
            padding: 5px;
            background: #ffffff;
            border-radius: 40px;
        }

        .options-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .option-btn {
            background: white;
            border: 2px solid #becae3;
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            color: #5a6a8a;
        }

        .option-btn:hover {
            transform: translateY(-3px);
            background: #fff5ea;
            border-color: #ffaa55;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.1);
        }

        .disabled-option {
            opacity: 0.5;
            pointer-events: none;
        }

        /* WRONG */
        .selected-wrong {
            animation: shakeAnim 0.3s ease-in-out 0s 2;
            background: #fdcccc;
            border-color: #e74c3c;
        }

        @keyframes shakeAnim {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        /* NAV */
        .nav-area {
            /* margin-top: 30px; */
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .nav-btn {
            width: 150px;
            background: #ffb347;
            border: none;
            font-size: 20px;
            font-weight: 500;
            color: white;
            padding: 12px 32px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 0 #c25d1a;
            transition: .07s linear;
        }

        /* .prev-btn {
            background: linear-gradient(#ff9aa2, #ff6f91);
            box-shadow: 0 4px 0 #d29ba0;
        }

        .next-btn {
            background: linear-gradient(#b39ddb, #9575cd);
            box-shadow: 0 4px 0 #b9aad6;
        } */

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c25d1a;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        /* EMOJI POPUP */

        .emoji-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.8);
            background: white;
            border-radius: 100px;
            padding: 35px 50px;
            text-align: center;
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: all .2s ease;
            box-shadow: 0 25px 50px rgba(0, 0, 0, .3);
            min-width: 200px;
        }

        .emoji-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .emoji-popup-correct {
            background: linear-gradient(135deg, #e8f8f0, #d4efdf);
            border: 5px solid #2ecc71;
        }

        .emoji-popup-wrong {
            background: linear-gradient(135deg, #fdeded, #fadbd8);
            border: 5px solid #e74c3c;
        }

        .popup-emoji {
            font-size: 5.5rem;
            line-height: 1.2;
        }

        /* FINAL POPUP */

        .final-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* background: rgba(0, 0, 0, .6); */
            /* backdrop-filter: blur(5px); */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all .25s ease;
        }

        .final-popup-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .final-popup {
            background: linear-gradient(135deg, #fff9e6, #fff0e0);
            border-radius: 70px;
            padding: 35px 45px;
            text-align: center;
            max-width: 450px;
            width: 85%;
            box-shadow:
                0 30px 45px rgba(0, 0, 0, .25),
                0 0 0 8px #ffd966,
                0 0 0 14px #ff9f4a;
        }

        .final-popup h2 {
            font-size: 2.6rem;
            color: #d45a2b;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .final-stars {
            font-size: 3.8rem;
            letter-spacing: 15px;
            margin: 18px 0;
            color: #ffc107;
        }

        .final-popup p {
            font-size: 1.5rem;
            color: #5a3e2b;
            margin: 15px 0;
            font-weight: 500;
        }

        .popup-playagain-btn {
            background: #ffac30;
            border: none;
            padding: 14px 34px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;

            margin-top: 15px;

        }

        /* ========================================
💻 DESKTOP / LAPTOP
======================================== */

        @media screen and (min-width:1025px) and (max-width:1440px) {

            .popup-emoji {

            }

            .emoji-popup {

        /* ========================================

        @media screen and (min-width:1441px) and (max-width:1920px) {

            }

        /* ========================================
📺 4K / EXTRA LARGE
======================================== */

        @media screen and (min-width:1921px) {

            .popup-emoji {
                font-size: 8rem;
            }

            .emoji-popup {
                padding: 55px 75px;

            }

            .final-popup {
                max-width: 700px;
                padding: 60px 75px;

            }

    </style>
    <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

    <div class="quiz">

        <div class="question-box">
            रिक्त स्थानों में कविता की पंक्तियों के अनुसार सही शब्द भरिए।
        </div>

        <div class="quiz-layout">

            <!-- LEFT SECTION - Image -->
            <div class="left-section">
                <div class="question-above-image" id="questionAboveImage">
                    इस चित्र में क्या दिख रहा है?
                </div>
                <img id="meaningImage" src="" alt="Picture" class="meaning-image">
            </div>

            <!-- RIGHT SECTION - Poem Box with Options Inside -->
            <div class="right-section">

                <div class="poem-box" id="poemBox">
                    <!-- Poem line will be inserted here -->
                    <!-- Options will be inserted here inside the same box -->
                </div>

            </div>

        </div>

        <!-- NAV -->
        <div class="nav-area">
            <button class="nav-btn prev-btn" id="prevBtn">◀ पिछला</button>
            <button class="nav-btn next-btn" id="nextBtn" disabled>अगला ▶</button>
        </div>

    </div>

    <!-- POPUP -->

    <div id="emojiPopup" class="emoji-popup">

        <div class="popup-emoji" id="popupEmoji">
            😊
        </div>

    </div>

    <!-- FINAL -->

    <div id="finalPopup" class="final-popup-overlay">

        <div class="final-popup">

            <h2>🎉 बहुत बहुत बधाई! 🎉</h2>

            <div class="final-stars">
                ⭐⭐⭐⭐
            </div>

            <p>
                आपने सभी प्रश्न सही किए!
            </p>

            <p>
                ✨ आप होशियार हो! ✨
            </p>

            <button class="popup-playagain-btn" id="playAgainBtn">

                🔄 फिर से खेलें

            </button>

        </div>

    </div>

    <script>
        // QUESTIONS with images
        const QUESTIONS = [

            /* ================= FIRST IMAGE ================= */

            {
                id: 1,

                image: "../assets/images/bulbula.png",

                sentence: "इधर से आया ____ ।",

                options: ["बुलबुला", "गुलगुला"],

                correct: "बुलबुला"
            },

            {
                id: 2,

                image: "../assets/images/gul.png",

                sentence: "उधर से आया ____ ।",

                options: ["गुलगुला", "बुलबुला"],

                correct: "गुलगुला"
            },

            {
                id: 3,

                image: "../assets/images/bulbula2.png",

                sentence: "आओ खेलें ____ ।",

                options: ["बुलबुला", "गुलगुला"],

                correct: "बुलबुला"
            },

            {
                id: 4,

                image: "../assets/images/bath.png",

                sentence: "____ लगाकर नहा।",

                options: ["दातुन", "साबुन"],

                correct: "साबुन"
            },

            /* ================= SECOND IMAGE ================= */

            {
                id: 5,

                image: "../assets/images/rat.png",

                sentence: "चूहा ____ खाया।",

                options: ["आलू", "आलु"],

                correct: "आलु"
            },

            {
                id: 6,

                image: "../assets/images/mouse.png",

                sentence: "ठुमक कर ____ आई।",

                options: ["चुहिया", "चूहा"],

                correct: "चुहिया"
            },

            {
                id: 7,

                image: "../assets/images/swing.png",

                sentence: "____ झूला झूल रहा था।",

                options: ["भालू", "आलू"],

                correct: "भालू"
            },

            {
                id: 8,

                image: "../assets/images/bear.png",

                sentence: "भालू ____ खाया।",

                options: ["तरबूज", "आलू"],

                correct: "तरबूज"
            },

            {
                id: 9,

                image: "../assets/images/sunlight2.png",

                sentence: "____ बहुत तेज थी।",

                options: ["धूप", "फूल"],

                correct: "धूप"
            },

            {
                id: 10,

                image: "../assets/images/sunflower.png",

                sentence: "____ का फूल खिल उठा।",

                options: ["सूरजमुखी", "आलू"],

                correct: "सूरजमुखी"
            }

        ];

        // VARIABLES
        let currentIndex = 0;
        let quizCompleted = false;
        let userStates = [];

        function initStates() {
            userStates = [];
            for (let q = 0; q < QUESTIONS.length; q++) {
                userStates.push({ isCorrect: false });
            }
        }
        initStates();

        /* SOUND */

        let audioCtx = null;

        // ✅ CORRECT SOUND
        function playCorrectSound() {

            try {

                if (!audioCtx) {

                    audioCtx =
                        new (
                            window.AudioContext ||
                            window.webkitAudioContext
                        )();
                }

                const now =
                    audioCtx.currentTime;

                // MAIN SOUND
                const osc1 =
                    audioCtx.createOscillator();

                const gain1 =
                    audioCtx.createGain();

                osc1.type = "triangle";

                osc1.frequency.setValueAtTime(
                    650,
                    now
                );

                osc1.frequency.exponentialRampToValueAtTime(
                    1250,
                    now + 0.22
                );

                gain1.gain.setValueAtTime(
                    0.18,
                    now
                );

                gain1.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + 0.28
                );

                osc1.connect(gain1);

                gain1.connect(
                    audioCtx.destination
                );

                osc1.start(now);

                osc1.stop(now + 0.28);

                // SPARKLE SOUND
                const osc2 =
                    audioCtx.createOscillator();

                const gain2 =
                    audioCtx.createGain();

                osc2.type = "sine";

                osc2.frequency.value = 1700;

                gain2.gain.setValueAtTime(
                    0.08,
                    now + 0.12
                );

                gain2.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + 0.4
                );

                osc2.connect(gain2);

                gain2.connect(
                    audioCtx.destination
                );

                osc2.start(now + 0.12);

                osc2.stop(now + 0.4);

            } catch (e) {

                console.log(e);
            }
        }


        // ❌ WRONG SOUND
        function playWrongSound() {

            try {

                if (!audioCtx) {

                    audioCtx =
                        new (
                            window.AudioContext ||
                            window.webkitAudioContext
                        )();
                }

                const now =
                    audioCtx.currentTime;

                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();

                osc.type = "square";

                osc.frequency.setValueAtTime(
                    240,
                    now
                );

                osc.frequency.exponentialRampToValueAtTime(
                    110,
                    now + 0.25
                );

                gain.gain.setValueAtTime(
                    0.14,
                    now
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + 0.3
                );

                osc.connect(gain);

                gain.connect(
                    audioCtx.destination
                );

                osc.start(now);

                osc.stop(now + 0.3);

            } catch (e) {

                console.log(e);
            }
        }


        // 🔊 AUDIO INIT
        function initAudio() {

            if (audioCtx) return;

            try {

                audioCtx =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

                const buffer =
                    audioCtx.createBuffer(1, 1, 22050);

                const source =
                    audioCtx.createBufferSource();

                source.buffer = buffer;

                source.connect(
                    audioCtx.destination
                );

                source.start();

            } catch (e) { }
        }

        document.body.addEventListener(
            "click",
            initAudio,
            { once: true }
        );

        const meaningImage = document.getElementById("meaningImage");
        const questionAboveImage = document.getElementById("questionAboveImage");
        const poemBox = document.getElementById("poemBox");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        // const popup = document.getElementById("simpleEmojiPopup");
        // const popupEmoji = document.getElementById("popupEmoji");
        // const finalPopup = document.getElementById("finalPopup");
        // const playAgainBtn = document.getElementById("playAgainBtn");

        let popupTimeout = null;

        function showPopup(isCorrect) {

            const popup =
                document.getElementById("emojiPopup");

            const popupEmoji =
                document.getElementById("popupEmoji");

            popup.classList.remove(
                "emoji-popup-correct",
                "emoji-popup-wrong"
            );

            if (isCorrect) {

                popupEmoji.innerHTML = "😊✨";

                popup.classList.add(
                    "emoji-popup-correct"
                );
                playCorrectSound();

            } else {

                popupEmoji.innerHTML = "😢💔";

                popup.classList.add(
                    "emoji-popup-wrong"
                );
                playWrongSound();
            }

            popup.classList.add("active");

            setTimeout(() => {

                popup.classList.remove("active");

            }, 1000);
        }

        // function speak(text) {
        //     speechSynthesis.cancel();
        //     const msg = new SpeechSynthesisUtterance(text);
        //     msg.lang = "hi-IN";
        //     msg.volume = 0.25;
        //     speechSynthesis.speak(msg);
        // }

        /* CONFETTI */

        function fireConfetti() {

            confetti({

                particleCount: 120,

                spread: 90,

                startVelocity: 55,

                scalar: 1.1,

                origin: {
                    y: 0.6
                }

            });

            setTimeout(() => {

                confetti({

                    particleCount: 80,

                    spread: 120,

                    startVelocity: 45,

                    scalar: .9,

                    origin: {
                        x: 0.2,
                        y: 0.5
                    }

                });

            }, 250);

            setTimeout(() => {

                confetti({

                    particleCount: 80,

                    spread: 120,

                    startVelocity: 45,

                    scalar: .9,

                    origin: {
                        x: 0.8,
                        y: 0.5
                    }

                });

            }, 450);
        }


        function showFinalCelebration() {
            if (quizCompleted) return;
            quizCompleted = true;
            fireConfetti();
            // speak("बहुत बहुत बधाई! आपने सभी उत्तर सही दिए!");
            setTimeout(() => {
                finalPopup.classList.add("active");
                prevBtn.disabled = true;
                nextBtn.disabled = true;
            }, 500);
        }

        function checkQuizComplete() {
            if (userStates.every(q => q.isCorrect)) {
                setTimeout(() => {
                    showFinalCelebration();
                }, 700);
            }
        }

        function loadQuestion() {
            const q = QUESTIONS[currentIndex];
            const state = userStates[currentIndex];

            // Update image and question above image
            meaningImage.src = q.image;
            questionAboveImage.textContent = q.imageQuestion;

            // Create HTML for poem box with options inside
            poemBox.innerHTML = `
                <div class="poem-line">
                    Q${q.id}. ${q.sentence.replace("____", `<span class="blank-input">${state.isCorrect ? q.correct : "_____"}</span>`)}
                </div>
                <div class="options-container">
                    <div class="options-title">✨ सही शब्द चुनिए ✨</div>
                    <div class="options-list" id="optionsList"></div>
                </div>
            `;

            // Create options
            const optionsList = document.getElementById("optionsList");
            optionsList.innerHTML = "";

            q.options.forEach(opt => {
                const btn = document.createElement("div");
                btn.className = "option-btn";
                btn.textContent = opt;

                if (!state.isCorrect) {
                    btn.addEventListener("click", () => {
                        if (state.isCorrect) return;

                        if (opt === q.correct) {
                            state.isCorrect = true;

                            // Update poem with correct answer
                            poemBox.innerHTML = `
                                <div class="poem-line">
                                    Q${q.id}. ${q.sentence.replace("____", `<span class="blank-input">${q.correct}</span>`)}
                                </div>
                                <div class="options-container">
                                    <div class="options-title">✨ सही शब्द चुनिए ✨</div>
                                    <div class="options-list" id="optionsList"></div>
                                </div>
                            `;

                            // Disable all option buttons
                            const newOptionsList = document.getElementById("optionsList");
                            newOptionsList.innerHTML = "";
                            q.options.forEach(opt2 => {
                                const newBtn = document.createElement("div");
                                newBtn.className = "option-btn disabled-option";
                                newBtn.textContent = opt2;
                                newOptionsList.appendChild(newBtn);
                            });

                            showPopup(true);
                            confetti({
                                particleCount: 35,
                                spread: 70,
                                scalar: .8,
                                origin: {
                                    y: 0.7
                                }
                            });
                            nextBtn.disabled = false;
                            checkQuizComplete();
                        } else {
                            showPopup(false);
                            // speak("गलत उत्तर");
                            btn.classList.add("selected-wrong");
                            setTimeout(() => {
                                btn.classList.remove("selected-wrong");
                            }, 500);
                        }
                    });
                }

                optionsList.appendChild(btn);
            });

            nextBtn.disabled = !state.isCorrect;
            prevBtn.disabled = (currentIndex === 0);
        }

        // Navigation
        nextBtn.addEventListener("click", () => {
            if (currentIndex < QUESTIONS.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        });

        prevBtn.addEventListener("click", () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        });

        // Play Again
        playAgainBtn.addEventListener("click", () => {
            currentIndex = 0;
            quizCompleted = false;
            initStates();
            finalPopup.classList.remove("active");
            loadQuestion();
        });

        // Initialize audio on first click
        function initAudioOnFirstClick() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start();
            } catch (e) {
                console.log("Audio init error:", e);
            }
        }

        document.body.addEventListener('click', initAudioOnFirstClick, { once: true });

        // Start
        loadQuestion();






    </script>
