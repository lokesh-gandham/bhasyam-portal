<html lang="hi">

<head>

        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Tiro Devanagari Hindi";

        }

        body {
            /* background:linear-gradient(145deg,#fef5e7 0%,#fae8f0 100%); */
            overflow: hidden;
        }

        .container {
            width: min(1500px, 100%);
            margin: auto;
            padding: 20px;
        }

        /* QUESTION */

        .question-box {
            width: 80%;
            margin: 0 auto 7px;
            background: #fff2f0;
            border: 1px solid #ffcdd9;
            border-radius: 60px;
            padding: 5px 25px;
            text-align: center;
            font-size: 22px;
            font-weight: 500;
            color: #bc5f7a;
        }

        /* STAGE */

        .stage-title {
            text-align: center;
            font-size: 50px;
            color: #ff1493;
            margin-bottom: 40px;
            font-weight: bold;
            display: none;
        }

        /* MATCH AREA */

        .match-wrapper {
            position: relative;
            width: 100%;
        }

        .matching-area {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            gap: 70px;
            padding-inline: 40px;
        }

        /* SIDES */

        .left-side,
        .right-side {
            width: 32%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .center-side {
            width: 20%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            position: relative;
            z-index: 5;
        }

        /* ITEM */

        .item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            position: relative;
            min-height: 120px;
        }

        .right-item {
            justify-content: center;
        }

        .number {
            font-size: 22px;
            font-weight: bold;
        }

        .right-number {
            width: 40px;
        }

        /* IMAGE */

        .image-box {
            width: 130px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 4px solid transparent;
            transition: .3s;
            overflow: hidden;
            border-radius: 50%;
        }

        .image-box.correct-image {
            border: 4px solid #2ecc71 !important;
            border-radius: 50%;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* WORD */

        .word {
            background: #fcecf4;
            width: 140px;
            margin: auto;
            border-radius: 50px;
            padding: 10px 20px;
            text-align: center;
            font-size: 25px;
            font-weight: 500;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 10px 22px rgba(0, 0, 0, .12);
        }

        .word:hover {
            transform: translateY(-4px);
        }

        .word.correct {
            background: #c7ffdb;
            outline: 3px solid rgb(50, 206, 50);
            color: #222;
        }

        /* SVG */

        svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* BUTTONS */

        .next-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
            gap: 20px;
            width: 100%;
        }

        .nav-btn {
            width: 150px;
            background: #ffb347;
            border: none;
            font-size: 20px;
            font-weight: 500;
            color: white;
            padding: 12px 32px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 0 #c25d1a;
            transition: .07s linear;
        }

        .nav-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #c25d1a;
        }

        .nav-btn:disabled {
            opacity: .3;
            cursor: not-allowed;
            transform: translateY(0);
            box-shadow: 0 6px 0 #c25d1a;
        }

        /* EMOJI POPUP */

        .emoji-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.8);
            background: white;
            border-radius: 100px;
            padding: 35px 50px;
            text-align: center;
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: all .2s ease;
            box-shadow: 0 25px 50px rgba(0, 0, 0, .3);
            min-width: 200px;
        }

        .emoji-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .emoji-popup-correct {
            background: linear-gradient(135deg, #e8f8f0, #d4efdf);
            border: 5px solid #2ecc71;
        }

        .emoji-popup-wrong {
            background: linear-gradient(135deg, #fdeded, #fadbd8);
            border: 5px solid #e74c3c;
        }

        .popup-emoji {
            font-size: 5.5rem;
            line-height: 1.2;
        }

        /* FINAL POPUP */

        .final-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* background: rgba(0, 0, 0, .6); */
            /* backdrop-filter: blur(5px); */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all .25s ease;
        }

        .final-popup-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .final-popup {
            background: linear-gradient(135deg, #fff9e6, #fff0e0);
            border-radius: 70px;
            padding: 35px 45px;
            text-align: center;
            max-width: 450px;

        }

        .final-popup h2 {

            font-weight: 800;
        }

        .final-stars {

        }

        .final-popup p {
            font-size: 1.5rem;
            color: #5a3e2b;
            margin: 15px 0;
            font-weight: 500;
        }

        .popup-playagain-btn {

            font-size: 1.3rem;
            font-weight: bold;

<body>

    <div class="container">

        <div class="question-box">
            चित्रों का सही शब्द से मिलान कीजिए।
        </div>

        <div class="stage-title" id="stageTitle">

        </div>

            <svg id="svgLines"></svg>

        <div class="next-buttons">

            <button class="nav-btn" id="prevBtn">
                ◀ पिछला
            </button>

            <button class="nav-btn" id="nextBtn" disabled>
                अगला ▶
            </button>

        </div>

    </div>

    <!-- POPUP -->

    <div id="emojiPopup" class="emoji-popup">

        <div class="popup-emoji" id="popupEmoji">
            😊
        </div>

    </div>

    <!-- FINAL -->

    <div id="finalPopup" class="final-popup-overlay">

        <div class="final-popup">

            <h2>🎉 बहुत बहुत बधाई! 🎉</h2>

            <div class="final-stars">
                ⭐⭐⭐⭐
            </div>

            <p>
                आपने सभी प्रश्न सही किए!
            </p>

            <p>
                ✨ आप होशियार हो! ✨
            </p>

            <button class="popup-playagain-btn" onclick="location.reload()">

                🔄 फिर से खेलें

            </button>

        </div>

    </div>

    <script>

        const stages = [

            {
                stage: 1,

                questions: [

                    {
                        image: "../assets/images/datun.png",
                        word: "दातुन"
                    },

                    {
                        image: "../assets/images/jamun.png",
                        word: "जामुन"
                    },

                    {
                        image: "../assets/images/gulgula.png",
                        word: "गुलगुला"
                    },

                    {
                        image: "../assets/images/rose.png",
                        word: "गुलाब"
                    },

                    {
                        image: "../assets/images/turtle.png",
                        word: "कछुआ"
                    },

                    {
                        image: "../assets/images/soap.png",
                        word: "साबुन"
                    }

                ]
            },

            {
                stage: 2,

                questions: [

                    {
                        image: "../assets/images/swing.png",
                        word: "झूला"
                    },

                    {
                        image: "../assets/images/tarbuj.png",
                        word: "तरबूज"
                    },

                    {
                        image: "../assets/images/mouse.png",
                        word: "चूहा"
                    },

                    {
                        image: "../assets/images/bear.png",
                        word: "भालू"
                    },

                    {
                        image: "../assets/images/khajur.png",
                        word: "खजूर"
                    },

                    {
                        image: "../assets/images/potato.png",
                        word: "आलू"
                    }

                ]
            }

        ];

        let currentStage = 0;

        let stageProgress = stages.map(() => ({
            completedMatches: []
        }));

        const leftSide =
            document.getElementById("leftSide");

        const rightSide =
            document.getElementById("rightSide");

        const centerWords =
            document.getElementById("centerWords");

        const stageTitle =
            document.getElementById("stageTitle");

        const nextBtn =
            document.getElementById("nextBtn");

        const prevBtn =
            document.getElementById("prevBtn");

        const svg =
            document.getElementById("svgLines");

        /* SOUND */

        /* 🔊 NEW GAME SOUND */

        let audioCtx = null;

        // ✅ CORRECT SOUND
        function playCorrectSound() {

            try {

                if (!audioCtx) {

                    audioCtx =
                        new (
                            window.AudioContext ||
                            window.webkitAudioContext
                        )();
                }

                const now =
                    audioCtx.currentTime;

                // MAIN SOUND
                const osc1 =
                    audioCtx.createOscillator();

                const gain1 =
                    audioCtx.createGain();

                osc1.type = "triangle";

                osc1.frequency.setValueAtTime(
                    650,
                    now
                );

                osc1.frequency.exponentialRampToValueAtTime(
                    1250,
                    now + 0.22
                );

                gain1.gain.setValueAtTime(
                    0.18,
                    now
                );

                gain1.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + 0.28
                );

                osc1.connect(gain1);

                gain1.connect(
                    audioCtx.destination
                );

                osc1.start(now);

                osc1.stop(now + 0.28);

                // SPARKLE SOUND
                const osc2 =
                    audioCtx.createOscillator();

                const gain2 =
                    audioCtx.createGain();

                osc2.type = "sine";

                osc2.frequency.value = 1700;

                gain2.gain.setValueAtTime(
                    0.08,
                    now + 0.12
                );

                gain2.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + 0.4
                );

                osc2.connect(gain2);

                gain2.connect(
                    audioCtx.destination
                );

                osc2.start(now + 0.12);

                osc2.stop(now + 0.4);

            } catch (e) {

                console.log(e);
            }
        }


        // ❌ WRONG SOUND
        function playWrongSound() {

            try {

                if (!audioCtx) {

                    audioCtx =
                        new (
                            window.AudioContext ||
                            window.webkitAudioContext
                        )();
                }

                const now =
                    audioCtx.currentTime;

                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();

                osc.type = "square";

                osc.frequency.setValueAtTime(
                    240,
                    now
                );

                osc.frequency.exponentialRampToValueAtTime(
                    110,
                    now + 0.25
                );

                gain.gain.setValueAtTime(
                    0.14,
                    now
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + 0.3
                );

                osc.connect(gain);

                gain.connect(
                    audioCtx.destination
                );

                osc.start(now);

                osc.stop(now + 0.3);

            } catch (e) {

                console.log(e);
            }
        }


        // 🔊 AUDIO INIT
        function initAudio() {

            if (audioCtx) return;

            try {

                audioCtx =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

                const buffer =
                    audioCtx.createBuffer(1, 1, 22050);

                const source =
                    audioCtx.createBufferSource();

                source.buffer = buffer;

                source.connect(
                    audioCtx.destination
                );

                source.start();

            } catch (e) { }
        }

        document.body.addEventListener(
            "click",
            initAudio,
            { once: true }
        );

        /* POPUP */

        function showPopup(isCorrect) {

            const popup =
                document.getElementById("emojiPopup");

            const popupEmoji =
                document.getElementById("popupEmoji");

            popup.classList.remove(
                "emoji-popup-correct",
                "emoji-popup-wrong"
            );

            if (isCorrect) {

                popupEmoji.innerHTML = "😊✨";

                popup.classList.add(
                    "emoji-popup-correct"
                );

            } else {

                popupEmoji.innerHTML = "😢💔";

                popup.classList.add(
                    "emoji-popup-wrong"
                );
            }

            popup.classList.add("active");

            setTimeout(() => {

                popup.classList.remove("active");

            }, 1000);
        }

        /* CONFETTI */

        function fireConfetti() {

            confetti({

                particleCount: 120,

                spread: 90,

                startVelocity: 55,

                scalar: 1.1,

                origin: {
                    y: 0.6
                }

            });

            setTimeout(() => {

                confetti({

                    particleCount: 80,

                    spread: 120,

                    startVelocity: 45,

                    scalar: .9,

                    origin: {
                        x: 0.2,
                        y: 0.5
                    }

                });

            }, 250);

            setTimeout(() => {

                confetti({

                    particleCount: 80,

                    spread: 120,

                    startVelocity: 45,

                    scalar: .9,

                    origin: {
                        x: 0.8,
                        y: 0.5
                    }

                });

            }, 450);
        }

        /* LOAD */

        function loadStage() {

            leftSide.innerHTML = "";
            rightSide.innerHTML = "";
            centerWords.innerHTML = "";
            svg.innerHTML = "";

            const data =
                stages[currentStage].questions;

            stageTitle.innerHTML =
                "Stage " +
                stages[currentStage].stage;

            const half =
                Math.ceil(data.length / 2);

            const leftItems =
                data.slice(0, half);

            const rightItems =
                data.slice(half);

            leftItems.forEach((item, index) => {

                leftSide.innerHTML += `

        <div class="item">

            <div class="number">
                ${index + 1})
            </div>

            <div class="image-box"
                 data-index="${index}">

                <img src="${item.image}">

            </div>

        </div>

        `;
            });

            rightItems.forEach((item, index) => {

                rightSide.innerHTML += `

<div class="item right-item">

<div class="image-box"
data-index="${index + half}">

<img src="${item.image}">

</div>

<div class="number right-number">
${index + half + 1})
</div>

</div>

`;

            });

            const shuffled =
                [...data].sort(() => Math.random() - 0.5);

            shuffled.forEach(item => {

                centerWords.innerHTML += `

        <div class="word"
             data-word="${item.word}">

             ${item.word}

        </div>

        `;
            });

            addEvents(data);

            restoreStageProgress();

            prevBtn.disabled =
                currentStage === 0;

            if (
                stageProgress[currentStage]
                    .completedMatches.length
                ===
                data.length
            ) {

                nextBtn.disabled = false;

            } else {

                nextBtn.disabled = true;
            }
        }

        /* RESTORE */

        function restoreStageProgress() {

            const saved =
                stageProgress[currentStage]
                    .completedMatches;

            const words =
                document.querySelectorAll(".word");

            const images =
                document.querySelectorAll(".image-box");

            saved.forEach(match => {

                const image =
                    images[match.index];

                const word =
                    [...words].find(w =>
                        w.dataset.word === match.word
                    );

                if (word) {

                    word.classList.add("correct");

                    image.classList.add(
                        "correct-image"
                    );

                    drawLine(image, word);
                }
            });
        }

        /* EVENTS */

        function addEvents(data) {

            let selectedImage = null;

            let selectedIndex = null;

            const imageBoxes =
                document.querySelectorAll(".image-box");

            const words =
                document.querySelectorAll(".word");

            imageBoxes.forEach((imgBox) => {

                imgBox.onclick = () => {

                    const alreadyMatched =
                        stageProgress[currentStage]
                            .completedMatches
                            .find(m =>
                                m.index ==
                                imgBox.dataset.index
                            );

                    if (alreadyMatched) return;

                    document
                        .querySelectorAll(".image-box")
                        .forEach(box => {

                            if (
                                !box.classList.contains(
                                    "correct-image"
                                )
                            ) {

                                box.style.border =
                                    "4px solid transparent";
                            }

                            box.style.transform =
                                "scale(1)";
                        });

                    imgBox.style.border =
                        "4px solid #ff1493";

                    imgBox.style.transform =
                        "scale(1.08)";

                    selectedImage = imgBox;

                    selectedIndex =
                        imgBox.dataset.index;
                };
            });

            words.forEach(word => {

                word.onclick = () => {

                    if (selectedImage === null)
                        return;

                    if (word.classList.contains("correct"))
                        return;

                    const correctWord =
                        data[selectedIndex].word;

                    if (
                        correctWord ===
                        word.dataset.word
                    ) {

                        word.classList.add("correct");

                        selectedImage.classList.add(
                            "correct-image"
                        );

                        drawLine(
                            selectedImage,
                            word
                        );

                        playCorrectSound();

                        showPopup(true);
                        confetti({
                            particleCount: 35,
                            spread: 70,
                            scalar: .8,
                            origin: {
                                y: 0.7
                            }
                        });

                        stageProgress[currentStage]
                            .completedMatches.push({

                                index: selectedIndex,

                                word: word.dataset.word
                            });

                        selectedImage = null;

                        selectedIndex = null;

                        if (
                            stageProgress[currentStage]
                                .completedMatches.length
                            ===
                            data.length
                        ) {

                            nextBtn.disabled = false;

                            if (
                                currentStage ===
                                stages.length - 1
                            ) {

                                setTimeout(() => {

                                    document
                                        .getElementById(
                                            "finalPopup"
                                        )
                                        .classList.add(
                                            "active"
                                        );

                                    fireConfetti();

                                }, 800);
                            }
                        }

                    } else {

                        playWrongSound();

                        showPopup(false);
                    }
                };
            });
        }

        /* DRAW LINE */

        function drawLine(imageBox, word) {

            const svgRect =
                svg.getBoundingClientRect();

            const imageRect =
                imageBox.getBoundingClientRect();

            const wordRect =
                word.getBoundingClientRect();

            let x1, y1, x2, y2;

            if (imageRect.left < window.innerWidth / 2) {

                x1 =
                    imageRect.right -
                    svgRect.left;

                y1 =
                    imageRect.top +
                    imageRect.height / 2 -
                    svgRect.top;

                x2 =
                    wordRect.left -
                    svgRect.left;

                y2 =
                    wordRect.top +
                    wordRect.height / 2 -
                    svgRect.top;

            } else {

                x1 =
                    imageRect.left -
                    svgRect.left;

                y1 =
                    imageRect.top +
                    imageRect.height / 2 -
                    svgRect.top;

                x2 =
                    wordRect.right -
                    svgRect.left;

                y2 =
                    wordRect.top +
                    wordRect.height / 2 -
                    svgRect.top;
            }

            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );

            line.setAttribute("x1", x1);
            line.setAttribute("y1", y1);

            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);

            line.setAttribute(
                "stroke",
                "#ff1493"
            );

            line.setAttribute(
                "stroke-width",
                "5"
            );

            line.setAttribute(
                "stroke-dasharray",
                "8 8"
            );

            line.setAttribute(
                "stroke-linecap",
                "round"
            );

            svg.appendChild(line);
        }

        /* NEXT */

        nextBtn.onclick = () => {

            const data =
                stages[currentStage].questions;

            if (
                stageProgress[currentStage]
                    .completedMatches.length
                !==
                data.length
            ) {

                return;
            }

            if (currentStage < stages.length - 1) {

                currentStage++;

                loadStage();
            }
        };

        /* PREVIOUS */

        prevBtn.onclick = () => {

            if (currentStage > 0) {

                currentStage--;

                loadStage();
            }
        };

        loadStage();

    </script>

</body>

</html>
