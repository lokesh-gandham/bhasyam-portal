<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: #FFF8F0;
      background-size: cover;
    }

    .app {
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 300px;
      padding: 22px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(
        180deg,
        #fffaf4,
        #fff1e6
      );
    }

    .nav-card {
      width: 100%;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .menu-btn {
      height: 9%;
      border-radius: 28px;
      padding: 18px 14px;
      display: flex;
      flex-direction:row;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      transition: .25s ease;
      position: relative;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .08);
      border: 3px solid transparent;
    }

    .menu-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 28px rgba(0, 0, 0, .12);
    }

    .menu-btn.active {
      border: 4px solid rgba(255, 255, 255, .9);
      transform: scale(1.03);
      box-shadow: 0 18px 34px rgba(0, 0, 0, .16);
      color: #334155;
      font-size: 24px;
    }

    .icon-box {
      width: 34px;
      height: 34px;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      background: rgba(255, 255, 255, .45);
      color: #475569;
      flex-shrink: 0;
    }

    .color0 {
      background: linear-gradient(
        135deg,
        #d8f5c0,
        #b7eb8f
      );
    }

    .color1 {
      background: linear-gradient(135deg, #ffb6c9, #ff9fb7);
    }

    .color2 {
      background: linear-gradient(135deg, #9ed8ff, #83c9ff);
    }

    .color3 {
      background: linear-gradient(
        135deg,
        #fff4c2,
        #ffe28a
      );
    }

    .color4 {
      background: linear-gradient(
        135deg,
        #f1e4ff,
        #d9b8ff
      );
    }

    .color5 {
      background: linear-gradient(
        135deg,
        #fff7c9,
        #fff0a8
      );
    }

    .color6 {
      background: linear-gradient(
        135deg,
        #ffd6a5,
        #ffbe7a
      );
    }

    .main {
      flex: 1;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .menu-toggle {
      display: none;
    }

    @media(max-width:900px) {

      .app {
        flex-direction: column;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100vh;
        padding: 20px;
        background: #FFF8F0;
        transition: left 0.35s ease;
        z-index: 999;
      }

      .sidebar.active {
        left: 0;
      }

      .menu-toggle {
        display: block;
        position: fixed;
        top: 15px;
        right: 16px;
        font-size: 24px;
        background: #A1D6B2;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 6px 12px;
        cursor: pointer;
        z-index: 5000;
      }

      .menu-btn {
        min-height: 100px;
      }

      .icon-box {
        width: 50px;
        height: 50px;
        font-size: 22px;
      }
    }
    @media screen and (min-width: 1920px) {

  .sidebar{
    width: 420px;
    padding: 36px 20px;
  }

  .nav-card{
    width: 380px;
    gap: 34px;
  }

  .menu-btn{
    min-height: 125px;
    padding: 22px 24px;
    gap: 24px;

    font-size: 26px;
    border-radius: 38px;
  }

  .menu-btn.active{
    font-size: 32px;
  }

  .icon-box{
    width: 70px;
    height: 70px;
    font-size: 32px;
  }
}
  </style>
      <link rel="stylesheet" href="assets/CSS/walkman-font.css">
</head>

<body>

  <button class="menu-toggle" onclick="toggleMenu()">☰</button>

  <div class="app">

    <div class="sidebar">

      <div class="nav-card">

        <!-- सही चित्र मिलाओ -->
        <div class="menu-btn color0 active" onclick="openPage(0)">
          <div class="icon-box">
            <i class="fa-solid fa-image"></i>
          </div>
            चित्र और शब्द
          <!-- सही चित्र मिलाओ -->
        </div>

        <!-- रिक्त स्थान -->
        <div class="menu-btn color4" onclick="openPage(1)">
          <div class="icon-box">
            <i class="fa-solid fa-keyboard"></i>
          </div>
          <!-- रिक्त स्थान -->
           आगे का अक्षर
        </div>

        <!-- चित्र और शब्द -->
        <div class="menu-btn color5" onclick="openPage(2)">
          <div class="icon-box">
            <i class="fa-solid fa-font"></i>
          </div>
          <!-- चित्र और शब्द -->
           बीच का अक्षर
        </div>

        <!-- चित्र मिलान -->
        <div class="menu-btn color1" onclick="openPage(3)">
          <div class="icon-box">
            <i class="fa-solid fa-images"></i>
          </div>
          <!-- चित्र मिलान -->
           बाद का अक्षर
        </div>

        <!-- शब्द पहचान -->
        <div class="menu-btn color2" onclick="openPage(4)">
          <div class="icon-box">
            <i class="fa-solid fa-book-open"></i>
          </div>
          चित्र पहचान
        </div>

        <!-- सही उत्तर चुनो -->
        <div class="menu-btn color6" onclick="openPage(5)">
          <div class="icon-box">
            <i class="fa-solid fa-circle-check"></i>
          </div>
           चित्र मिलान
        </div>

      </div>

    </div>

    <div class="main">
      <iframe id="contentFrame" src="./exercises/pictureMatch2.html"></iframe>
    </div>

  </div>

  <script>

    const sidebarButtons = document.querySelectorAll(".sidebar .menu-btn");
    const frame = document.getElementById("contentFrame");

    const pages = [
    "./exercises/pictureMatch2.html",
    "./exercises/translation.html",
    "./exercises/translation1.html",
     "./exercises/translation2.html",
     "./exercises/pictureMatch.html",
      "./exercises/matching.html",
      
     
      
      
     
    ];

    function openPage(index) {

      sidebarButtons.forEach(btn => btn.classList.remove("active"));

      sidebarButtons[index].classList.add("active");

      frame.src = pages[index];

      if (window.innerWidth <= 900) {
        document.querySelector(".sidebar").classList.remove("active");
      }
    }

    function toggleMenu() {

      if (window.innerWidth > 900) return;

      document.querySelector(".sidebar").classList.toggle("active");
    }

  </script>




</body>

</html>
