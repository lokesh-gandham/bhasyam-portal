<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

  <!-- GOOGLE FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- CHANAKYA / WALKMAN -->

  <link
    rel="stylesheet"
    href="../assets/fonts/fonts.css"
  />

  <!-- CONFETTI -->

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="../assets/CSS/pictureMatch2.css"
  />

    <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

  <div class="main">

    <!-- TOP BAR -->

    <div class="top-bar">

      <h1 class="heading">
        चित्र देख कर रिक्त स्थानों में उचित वर्ण भरिए।
      </h1>

      <div
        class="page-indicator"
        id="pageIndicator"
      >
        1 / 6
      </div>

    </div>


    <!-- FLASHCARD GRID -->

    <div
      class="cards-grid"
      id="cardsGrid"
    >

      <!-- JS WILL RENDER 4 FLASHCARDS HERE -->

    </div>


    <!-- NAVIGATION -->

    <div class="nav">

      <button
        class="nav-btn prev"
        id="prev"
      >
        पिछला
      </button>

      <button
        class="nav-btn next"
        id="next"
      >
        अगला
      </button>

    </div>

  </div>


  <!-- CORRECT / WRONG POPUP -->

  <div
    id="answerPopup"
    class="popup"
  >

    <div class="popup-content">

      <div class="popup-top-circle">

        <div
          class="popup-icon"
          id="popupIcon"
        ></div>

      </div>

      <h3 id="popupTitle"></h3>

      <p id="popupMsg"></p>

    </div>

  </div>


  <!-- FINAL POPUP -->

  <div id="finalPopup">

    <div class="final-kid-box">

      <h2>शाबाश !</h2>

      <p id="finalScore"></p>

      <div id="stars"></div>

      <button
        class="playAgain-btn"
        onclick="location.reload()"
      >
        फिर से शुरू करें
      </button>

    </div>

  </div>


  <!-- AUDIO -->

  <audio
    id="correctSound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"
  ></audio>

  <audio
    id="wrongSound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"
  ></audio>


  <!-- JS -->

  <script src="../assets/JavaScript/pictureMatch2.js"></script>

</body>

</html>
