<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/CSS/translation.css">

  <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

  <div class="quiz">

    <!-- TITLE -->

    <div class="question">

      <!-- <img src="../assets/images/alphabet.png" alt="alphabet"> -->

      <h2 id="questionTitle"></h2>

    </div>

    <!-- MAIN CONTENT -->

    <div class="row">

      <!-- LEFT SIDE -->

      <div class="options">

        <div class="word-area">

          <!-- QUESTIONS RENDER HERE -->
          <div class="blanks" id="blanks"></div>

          <!-- OPTIONS RENDER HERE -->
          <div class="letters" id="letters"></div>

        </div>

      </div>

      <!-- RIGHT IMAGE -->

      <div class="imgbox">
        <img id="questionImage">
      </div>

    </div>

    <!-- NAVIGATION -->

   <div class="nav">
  <button class="nav-btn prev" id="prev" disabled>पिछला</button>
  <button class="nav-btn next" id="next" disabled>अगला</button>
</div>

  </div>

  <!-- ANSWER POPUP -->

  <div id="answerPopup" class="popup">

    <div class="popup-content">

      <div class="popup-top-circle">

        <div class="popup-icon" id="popupIcon"></div>

      </div>

      <h3 id="popupTitle"></h3>

      <p id="popupMsg"></p>

    </div>

  </div>

  <!-- FINAL SCORE -->

  <div id="finalPopup">

    <div class="final-kid-box">

      <h2>शाबाश !</h2>

      <p id="finalScore"></p>

      <div id="stars"></div>

      <button class="playAgain-btn" onclick="location.reload()">
        फिर से शुरू करें
      </button>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script src="../assets/JavaScript/translation.js"></script>

</body>

</html>
