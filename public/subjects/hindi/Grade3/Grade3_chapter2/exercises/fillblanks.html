<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

   
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../assets/CSS/fillblanks.css">
    <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

    <div class="main">
        <div class="header">
           <span> Fill & Blanks </span>
           <div class="progress" id="progress"></div>
       </div>
          <button class="home" onclick="location.href='../index.html'">🏠 Home</button>

        <div class="q-indicator" id="indicator"></div>

        <div class="card">

            <div class="question" id="question"></div>

<div class="image-box">
                <img id="image">
            </div>

            <div class="letters" id="letters"></div>
<div class="options-row" id="optionsRow"></div>

            

            <div class="action-row nav">
                <button class="prev" id="prevBtn" disabled>पिछला</button>
                <button class="submit" id="checkBtn" disabled>जमा</button>
                <button class="next" id="nextBtn" disabled>अगला</button>
            </div>

        </div>
    </div>

    <!-- CORRECT / WRONG POPUP -->
   
  <!-- 🔔 POPUP -->
<!-- ANSWER POPUP (Correct / Wrong) -->
 <div id="answerPopup" class="popup">
  <div class="popup-card">

    <!-- TOP ICON -->
    <div class="popup-bubble" id="popupIcon"></div>

    <!-- TEXT -->
    <h2 id="popupTitle"></h2>
    <p id="popupMsg"></p>

    <!-- ⭐ STARS (only for correct) -->
    <div id="popupStars" class="popup-stars"></div>

  </div>
</div>
<!-- FINAL SCORE POPUP -->
<div id="finalPopup">
  <div class="finalpopup-box">
    
    <div class="medals">
      <span>🏅</span>
      <span>🥇</span>
      <span>🏅</span>
    </div>

    <h2 class="final-heading">बधाई हो!</h2>

    <p class="final-sub">
      आपने प्रश्नोत्तरी सफलतापूर्वक पूरी की।
    </p>

    <p id="finalScore"></p>

    <div id="stars"></div>

    <div class="final-buttons">

      <button
        onclick="restart()"
        class="playAgain-btn">

        फिर से खेलें

      </button>

      <!-- <button
        onclick="nextSection()"
        class="next-section-btn">

        अगला भाग

      </button> -->

    </div>

  </div>
</div>


<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
    <script src="../assets/JavaScript/fillblanks.js"></script>
</body>
</html>
