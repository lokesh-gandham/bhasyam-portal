<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
    <link rel="stylesheet" href="../assets/CSS/matching.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

<div class="container">

    <!-- <div class="question-box">
        सही चिन्ह से मिलाकर शब्द बनाइए।
    </div> -->

    <div class="match-wrapper">

        <svg id="svgLines"></svg>

        <div class="matching-area">

            <!-- LEFT SIDE - As per image -->
            <div class="left-side">

                <div class="item">
                    <div class="image-box">
                        <img src="../assets/images/balloon.png" alt="balloon">
                    </div>
                    <div class="text-box" data-word="gubara">
                        गु ___ बारा
                        <div class="match-connector" data-match="ब्"></div>
                    </div>
                </div>

                <div class="item">
                    <div class="image-box">
                        <img src="../assets/images/stone.png" alt="stone">
                    </div>
                    <div class="text-box" data-word="pathar">
                        प ___ थर
                        <div class="match-connector" data-match="त्"></div>
                    </div>
                </div>

                <div class="item">
                    <div class="image-box">
                        <img src="../assets/images/cat.png" alt="cat">
                    </div>
                    <div class="text-box" data-word="billi">
                        बि ___ ली
                        <div class="match-connector" data-match="ल्"></div>
                    </div>
                </div>

                <div class="item">
                    <div class="image-box">
                        <img src="../assets/images/cup.png" alt="cup">
                    </div>
                    <div class="text-box" data-word="pyala">
                        ___ याला
                        <div class="match-connector" data-match="प्"></div>
                    </div>
                </div>

                <div class="item">
                    <div class="image-box">
                        <img src="../assets/images/fly.png" alt="fly">
                    </div>
                    <div class="text-box" data-word="makhi">
                        म ___ खी
                        <div class="match-connector" data-match="क्"></div>
                    </div>
                </div>

            </div>

            <!-- RIGHT SIDE - As per image -->
         <!-- RIGHT SIDE - CORRECTED LETTERS AS PER IMAGE -->
<div class="right-side">

    <div class="item">
        <div class="text-box answer" data-letter="प्">
            प्
            <div class="right-connector"></div>
        </div>
    </div>

    <div class="item">
        <div class="text-box answer" data-letter="ब्">
            ब्
            <div class="right-connector"></div>
        </div>
    </div>

    <div class="item">
        <div class="text-box answer" data-letter="त्">
            त्
            <div class="right-connector"></div>
        </div>
    </div>

    <div class="item">
        <div class="text-box answer" data-letter="क्">
            क्
            <div class="right-connector"></div>
        </div>
    </div>

    <div class="item">
        <div class="text-box answer" data-letter="ल्">
            ल् 
            <div class="right-connector"></div>
        </div>
    </div>

</div>

        </div>

    </div>

</div>

<!-- EMOJI POPUP -->
<!-- FINAL SCORE POPUP -->
<div id="finalPopup">
  <div class="finalpopup-box">
    
    <div class="medals">
      <span>🏅</span>
      <span>🥇</span>
      <span>🏅</span>
    </div>

    <h2 class="final-heading">बधाई हो!</h2>

    <p class="final-sub">
      आपने प्रश्नोत्तरी सफलतापूर्वक पूरी की।
    </p>

    <p id="finalScore"></p>

    <div id="stars"></div>

    <div class="final-buttons">

      <button
        onclick="restart()"
        class="playAgain-btn">

        फिर से खेलें

      </button>

    </div>

  </div>
</div>

<script src="../assets/JavaScript/matching.js"></script>

</body>

</html>
