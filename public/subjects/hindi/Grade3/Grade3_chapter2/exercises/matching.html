
<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Wise Wings</title>

<link rel="icon" type="image/svg+xml" href="/iconsa1.png">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:'Tiro Devanagari Hindi',serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   GAME
========================= */

.game{
    width:100%;
    max-width:1100px;
    height:100vh;
    padding:18px 25px;

    display:flex;
    flex-direction:column;
    align-items:center;
}

/* =========================
   QUESTION NUMBER
========================= */

.question-number{
    font-size:20px;
    font-weight:bold;
    color:#ff4da0;
    margin-bottom:5px;
}

/* =========================
   QUESTION AREA
========================= */

.question-area{
    width:100%;
    flex:1;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:14px;
}

/* =========================
   IMAGE
========================= */

.question-image{
    width:170px;
    height:170px;

    object-fit:contain;

    user-select:none;
    -webkit-user-drag:none;
}

/* =========================
   QUESTION TEXT
========================= */

.question-text{
    font-size:35px;
    font-weight:bold;
    color:#333;

    text-align:center;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    flex-wrap:wrap;
}

/* =========================
   DROP BOX
========================= */

.drop-box{
    width:110px;
    height:65px;

    border:4px dashed #ff8fc2;
    border-radius:16px;

    background:#fff5fa;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    color:#aaa;

    font-size:30px;
    font-weight:bold;

    transition:.2s ease;
}

/* COMPLETE WORD */

.completed-word{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    color:#45a85b;
    font-weight:800;

    animation:wordComplete .35s ease;
}

/* DRAG OVER */

.drop-box.drag-over{
    background:#ffe0ef;
    border-color:#ff4da0;

    transform:scale(1.05);
}

/* CORRECT */

.drop-box.correct{
    background:#c9f7d7;
    border-color:#45c66d;
    color:#238b45;

    border-style:solid;
}

/* WRONG */

.drop-box.wrong{
    background:#ffd3d3;
    border-color:#ff5555;

    animation:shake .4s;
}

/* =========================
   OPTIONS TITLE
========================= */

.options-title{
    font-size:20px;
    color:#777;
    margin-top:5px;
}

/* =========================
   OPTIONS
========================= */

.options{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:22px;

    flex-wrap:wrap;

    width:100%;
    max-width:850px;
}

.option{
    width:130px;
    min-height:65px;

    background:white;

    border:4px solid #ffd0e4;
    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
    font-weight:bold;

    color:#444;

    cursor:grab;

    user-select:none;

    box-shadow:
        0 6px 15px rgba(0,0,0,.08);

    transition:
        transform .2s,
        box-shadow .2s,
        background .2s;
}

.option:hover{
    transform:translateY(-4px);

    box-shadow:
        0 10px 20px rgba(0,0,0,.12);
}

.option:active{
    cursor:grabbing;
    transform:scale(.95);
}

/* USED OPTIONS */

.option.used{
    opacity:.3;
    pointer-events:none;
}

/* =========================
   NAVIGATION
========================= */

.navigation{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:20px;

    padding-top:10px;
}

.nav-btn{
    min-width:145px;

    border:none;
    border-radius:40px;

    padding:12px 28px;

    font-family:inherit;
    font-size:19px;
    font-weight:bold;

    cursor:pointer;

    color:white;

    transition:.2s;
}

.prev-btn{
    background:linear-gradient(
        135deg,
        #ff4da0,
        #ff6b6b
    );
}

.next-btn{
    background:linear-gradient(
        135deg,
        #ff4da0,
        #ff6b6b
    );
}

.nav-btn:hover:not(:disabled){
    transform:translateY(-3px);
}

.nav-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* =========================
   HINT
========================= */

.hint{
    position:fixed;

    top:12%;
    left:50%;

    transform:translateX(-50%);

    padding:12px 24px;

    background:#ff6262;
    color:white;

    border-radius:14px;

    font-size:18px;

    z-index:9999;

    animation:fadeHint 1.8s forwards;
}

/* =========================
   FINAL POPUP
========================= */

#finalPopup{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    z-index:10000;

    padding:20px;
}

#finalPopup.show{
    display:flex;
}

.final-box{
    width:100%;
    max-width:430px;

    background:white;

    border-radius:30px;

    padding:35px 25px;

    text-align:center;

    box-shadow:
        0 25px 60px rgba(0,0,0,.25);

    animation:popup .4s ease;
}

.medals{
    font-size:48px;
    margin-bottom:10px;
}

.final-box h2{
    color:#ff4da0;
    font-size:32px;
}

.final-box p{
    color:#666;
    font-size:18px;
    margin-top:8px;
}

#stars{
    font-size:38px;
    margin:15px;
}

.play-again{
    border:none;

    background:
        linear-gradient(
            135deg,
            #ff4da0,
            #ff6b6b
        );

    color:white;

    border-radius:40px;

    padding:13px 32px;

    font-family:inherit;
    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes wordComplete{

    from{
        transform:scale(.75);
        opacity:.3;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

@keyframes correctImageAnimation{

    0%{
        transform:scale(1) rotate(0deg);
    }

    25%{
        transform:scale(1.12) rotate(-4deg);
    }

    50%{
        transform:scale(1.16) rotate(4deg);
    }

    75%{
        transform:scale(1.10) rotate(-2deg);
    }

    100%{
        transform:scale(1) rotate(0deg);
    }

}

.question-image.correct-animation{
    animation:correctImageAnimation .65s ease;
}

@keyframes shake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-8px);
    }

    75%{
        transform:translateX(8px);
    }

}

@keyframes fadeHint{

    0%{
        opacity:1;
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}

@keyframes popup{

    from{
        transform:scale(.6);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

/* =========================
   LARGE MONITOR
   1350px+
========================= */

@media(min-width:1350px){

    .game{
        max-width:1300px;
        padding:28px 60px;
    }

    .question-number{
        font-size:26px;
        margin-bottom:10px;
    }

    .question-area{
        gap:22px;
    }

    .question-image{
        width:280px;
        height:280px;
    }

    .question-text{
        font-size:58px;
        gap:14px;
    }

    .completed-word{
        font-size:1em;
    }

    .drop-box{
        width:150px;
        height:82px;
        font-size:38px;
        border-width:5px;
    }

    .options-title{
        font-size:24px;
        margin-top:8px;
    }

    .options{
        max-width:1100px;
        gap:30px;
    }

    .option{
        width:170px;
        min-height:82px;
        font-size:36px;
        border-width:5px;
    }

    .navigation{
        gap:28px;
        padding-top:18px;
    }

    .nav-btn{
        min-width:180px;
        padding:15px 34px;
        font-size:23px;
    }

    .final-box{
        max-width:520px;
        padding:45px 35px;
    }

    .final-box h2{
        font-size:38px;
    }

    .final-box p{
        font-size:21px;
    }

}

/* =========================
   TABLET
========================= */

@media(max-width:700px){

    .game{
        padding:10px 12px;
    }

    .question-image{
        width:130px;
        height:130px;
    }

    .question-text{
        font-size:27px;
    }

    .drop-box{
        width:90px;
        height:55px;
        font-size:25px;
    }

    .option{
        width:105px;
        min-height:55px;
        font-size:24px;
    }

    .options{
        gap:12px;
    }

    .nav-btn{
        min-width:115px;
        padding:10px 18px;
        font-size:16px;
    }

}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:430px){

    .question-number{
        font-size:17px;
    }

    .question-image{
        width:105px;
        height:105px;
    }

    .question-text{
        font-size:22px;
        gap:6px;
    }

    .drop-box{
        width:75px;
        height:48px;
        font-size:21px;
    }

    .option{
        width:82px;
        min-height:48px;
        font-size:20px;
        border-width:3px;
    }

    .options{
        gap:8px;
    }

    .navigation{
        gap:10px;
    }

    .nav-btn{
        min-width:100px;
        font-size:15px;
    }

}

</style>
</head>

<body>

<div class="game">

    <!-- QUESTION NUMBER -->

    <div
        class="question-number"
        id="questionNumber">
        प्रश्न 1 / 5
    </div>


    <!-- QUESTION -->

    <div class="question-area">

        <img
            id="questionImage"
            class="question-image"
            src="../assets/images/balloon.png"
            alt="question">


        <div
            class="question-text"
            id="questionText">
        </div>


        <div class="options-title">
            सही अक्षर को खाली स्थान में खींचकर छोड़ें
        </div>


        <!-- OPTIONS -->

        <div
            class="options"
            id="options">
        </div>

    </div>


    <!-- NAVIGATION -->

    <div class="navigation">

        <button
            id="prevBtn"
            class="nav-btn prev-btn"
            onclick="previousQuestion()">

            ← पिछला

        </button>


        <button
            id="nextBtn"
            class="nav-btn next-btn"
            onclick="nextQuestion()">

            अगला →

        </button>

    </div>

</div>


<!-- FINAL POPUP -->

<div id="finalPopup">

    <div class="final-box">

        <div class="medals">
            🏅 🥇 🏅
        </div>

        <h2>
            बधाई हो!
        </h2>

        <p>
            आपने प्रश्नोत्तरी सफलतापूर्वक पूरी की।
        </p>

        <p id="finalScore"></p>

        <div id="stars"></div>

        <button
            class="play-again"
            onclick="restart()">

            फिर से खेलें

        </button>

    </div>

</div>


<script>

/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

    {
        image:"../assets/images/balloon.png",
        before:"गु",
        after:"बारा",
        correct:"ब्‍",
        fullWord:"गुब्बारा"
    },

    {
        image:"../assets/images/stone.png",
        before:"प",
        after:"थर",
        correct:"त्‍",
        fullWord:"पत्थर"
    },

    {
        image:"../assets/images/cat.png",
        before:"बि",
        after:"ली",
        correct:"ल्‍",
        fullWord:"बिल्ली"
    },

    {
        image:"../assets/images/cup.png",
        before:"",
        after:"याला",
        correct:"प्‍",
        fullWord:"प्याला"
    },

    {
        image:"../assets/images/fly.png",
        before:"म",
        after:"खी",
        correct:"क्‍",
        fullWord:"मक्खी"
    }

];


/* =====================================================
   OPTIONS
===================================================== */

const options = [
    "प्‍",
    "ब्‍",
    "त्‍",
    "क्‍",
    "ल्‍"
];


/* =====================================================
   GAME STATE
===================================================== */

let currentQuestion = 0;

let answered =
    Array(questions.length).fill(false);

let selectedAnswers =
    Array(questions.length).fill(null);

let score = 0;

let finalShown = false;


/* =====================================================
   ELEMENTS
===================================================== */

const questionNumber =
    document.getElementById(
        "questionNumber"
    );

const questionImage =
    document.getElementById(
        "questionImage"
    );

const questionText =
    document.getElementById(
        "questionText"
    );

const optionsBox =
    document.getElementById(
        "options"
    );

const prevBtn =
    document.getElementById(
        "prevBtn"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const finalPopup =
    document.getElementById(
        "finalPopup"
    );


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion(){

    const q =
        questions[currentQuestion];


    questionNumber.textContent =
        `प्रश्न ${currentQuestion + 1} / ${questions.length}`;


    questionImage.src =
        q.image;


    /*
       If already answered:
       show COMPLETE WORD.

       If not answered:
       show EMPTY DROP BOX.
       No "?" is inserted.
    */

    if(answered[currentQuestion]){

        questionText.innerHTML = `
            <span class="completed-word">
                ${q.fullWord}
            </span>
        `;

    }else{

        questionText.innerHTML = `
            <span>${q.before}</span>

            <span
                class="drop-box"
                id="dropBox">
            </span>

            <span>${q.after}</span>
        `;

    }


    createOptions();

    updateNavigation();


    /*
       Restore previous answered question.
    */

    if(answered[currentQuestion]){

        document.querySelectorAll(".option").forEach(option => {

            option.classList.add("used");

            option.draggable = false;

        });

    }


    setupDropZone();

}


/* =====================================================
   CREATE OPTIONS
===================================================== */

function createOptions(){

    optionsBox.innerHTML = "";


    options.forEach(
        letter => {

            const option =
                document.createElement(
                    "div"
                );


            option.className =
                "option";


            option.textContent =
                letter;


            option.draggable =
                true;


            /*
               Disable all options when
               current question is already answered.
            */

            if(answered[currentQuestion]){

                option.classList.add("used");

                option.draggable = false;

            }


            option.addEventListener(
                "dragstart",
                function(e){

                    if(
                        answered[currentQuestion]
                    ){

                        e.preventDefault();

                        return;
                    }

                    e.dataTransfer.setData(
                        "text/plain",
                        letter
                    );

                }
            );


            /*
               Mobile tap support.
            */

            option.addEventListener(
                "click",
                function(){

                    if(
                        answered[currentQuestion]
                    ){

                        return;
                    }


                    const dropBox =
                        document.getElementById(
                            "dropBox"
                        );


                    if(!dropBox){

                        return;
                    }


                    dropBox.classList.remove(
                        "wrong"
                    );


                    checkAnswer(
                        letter
                    );

                }
            );


            optionsBox.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   DROP ZONE
===================================================== */

function setupDropZone(){

    const dropBox =
        document.getElementById(
            "dropBox"
        );


    if(!dropBox){

        return;
    }


    dropBox.addEventListener(
        "dragover",
        function(e){

            if(
                answered[currentQuestion]
            ){

                return;
            }

            e.preventDefault();

            dropBox.classList.add(
                "drag-over"
            );

        }
    );


    dropBox.addEventListener(
        "dragleave",
        function(){

            dropBox.classList.remove(
                "drag-over"
            );

        }
    );


    dropBox.addEventListener(
        "drop",
        function(e){

            e.preventDefault();


            if(
                answered[currentQuestion]
            ){

                return;
            }


            dropBox.classList.remove(
                "drag-over"
            );


            const letter =
                e.dataTransfer.getData(
                    "text/plain"
                );


            if(letter){

                checkAnswer(
                    letter
                );

            }

        }
    );

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(letter){

    if(answered[currentQuestion]){

        return;
    }


    const q =
        questions[currentQuestion];


    const dropBox =
        document.getElementById(
            "dropBox"
        );


    if(!dropBox){

        return;
    }


    /* =========================================
       CORRECT ANSWER
    ========================================= */

    if(letter === q.correct){

        answered[currentQuestion] = true;

        selectedAnswers[currentQuestion] = letter;

        score++;


        /*
           IMPORTANT:
           Immediately replace the question
           with the FULL WORD.

           This prevents the green "?"
           problem completely.
        */

        questionText.innerHTML = `
            <span class="completed-word">
                ${q.fullWord}
            </span>
        `;


        /*
           Disable ALL options.
        */

        document.querySelectorAll(".option").forEach(option => {

            option.classList.add("used");

            option.draggable = false;

        });


        /*
           Correct image animation.
        */

        questionImage.classList.remove(
            "correct-animation"
        );

        void questionImage.offsetWidth;

        questionImage.classList.add(
            "correct-animation"
        );


        playCorrect();


        if(typeof confetti === "function"){

            confetti({

                particleCount:70,

                spread:65,

                origin:{
                    y:.65
                }

            });

        }


        updateNavigation();


        /*
           Questions 1-4:
           Stay on current question.

           User MUST click Next.

           Question 5:
           Show final popup automatically.
        */

        if(
            currentQuestion ===
            questions.length - 1
        ){

            setTimeout(
                function(){

                    showFinalPopup();

                },
                650
            );

        }

    }


    /* =========================================
       WRONG ANSWER
    ========================================= */

    else{

        dropBox.classList.add(
            "wrong"
        );


        playWrong();


        showHint(
            "❌ गलत उत्तर, फिर कोशिश करें"
        );


        /*
           Keep the box EMPTY after
           wrong answer.

           NEVER put "?" here.
        */

        setTimeout(
            function(){

                dropBox.classList.remove(
                    "wrong"
                );

                dropBox.textContent = "";

            },
            500
        );

    }

}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

    /*
       User must answer current question
       correctly first.
    */

    if(
        !answered[currentQuestion]
    ){

        showHint(
            "⚠️ पहले सही उत्तर दें!"
        );

        return;
    }


    /*
       Move only when user clicks Next.
    */

    if(
        currentQuestion <
        questions.length - 1
    ){

        currentQuestion++;

        loadQuestion();

    }

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousQuestion(){

    if(
        currentQuestion > 0
    ){

        currentQuestion--;

        loadQuestion();

    }

}


/* =====================================================
   NAVIGATION
===================================================== */

function updateNavigation(){

    /*
       Previous disabled only on
       first question.
    */

    prevBtn.disabled =
        currentQuestion === 0;


    /*
       Next enabled only after
       current question is correctly answered.
    */

    nextBtn.disabled =
        !answered[currentQuestion];

}


/* =====================================================
   HINT
===================================================== */

function showHint(message){

    const hint =
        document.createElement(
            "div"
        );


    hint.className =
        "hint";


    hint.textContent =
        message;


    document.body.appendChild(
        hint
    );


    setTimeout(
        function(){

            hint.remove();

        },
        1800
    );

}


/* =====================================================
   CORRECT SOUND
===================================================== */

function playCorrect(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const osc =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        osc.connect(gain);

        gain.connect(
            ctx.destination
        );


        osc.frequency.value =
            880;


        osc.type =
            "sine";


        gain.gain.value =
            .18;


        osc.start();


        gain.gain.exponentialRampToValueAtTime(
            .00001,
            ctx.currentTime + .4
        );


        osc.stop(
            ctx.currentTime + .4
        );

    }catch(e){}

}


/* =====================================================
   WRONG SOUND
===================================================== */

function playWrong(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const ctx =
            new AudioContext();


        const osc =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        osc.connect(gain);

        gain.connect(
            ctx.destination
        );


        osc.frequency.value =
            420;


        osc.type =
            "triangle";


        gain.gain.value =
            .18;


        osc.start();


        gain.gain.exponentialRampToValueAtTime(
            .00001,
            ctx.currentTime + .35
        );


        osc.stop(
            ctx.currentTime + .35
        );

    }catch(e){}

}


/* =====================================================
   FINAL POPUP
===================================================== */

function showFinalPopup(){

    if(finalShown){

        return;
    }


    finalShown =
        true;


    document.getElementById(
        "finalScore"
    ).textContent =
        `आपका स्कोर: ${score} / ${questions.length}`;


    document.getElementById(
        "stars"
    ).textContent =
        "⭐".repeat(score);


    finalPopup.classList.add(
        "show"
    );


    if(
        typeof confetti ===
        "function"
    ){

        confetti({

            particleCount:250,

            spread:120,

            origin:{
                y:.6
            }

        });

    }

}
