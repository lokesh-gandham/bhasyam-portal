<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Wise Wings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/svg+xml" href="/iconsa1.png">

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Livvic', sans-serif;
}

body {
    display: flex;
    height: 100vh;
    overflow: hidden;
    background: #FCE7F1;
    background-size: cover;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 2000;
}

.overlay.active {
    opacity: 1;
    pointer-events: auto;
}

/* ================= TOGGLE BUTTON ================= */
.menu-toggle {
    display: none;
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 3001;
    background: #1F3C5B;
    color: white;
    border: none;
    font-size: 22px;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

/* ================= SIDEBAR - CENTERED ================= */
.sidebar {
    width: 320px;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 25px 20px;
    transition: 0.35s ease;
    z-index: 3000;
}

.brand {
    text-align: center;
    margin-bottom: 50px;
    font-size: 32px;
    color: #1F3C5B;
    font-weight: 700;
    display: block;
    letter-spacing: 2px;
}

.sidebar ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 25px;
    width: 100%;
}

/* ================= NAV BUTTON STYLES ================= */
.sidebar ul li a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    padding: 18px 25px;
    text-decoration: none;
    color: #2c3e50;
    font-size: 18px;
    font-weight: 600;
    border-radius: 70% 30% 60% 40% / 40% 60% 40% 60%;
    background: #A2CB8B;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    text-align: center;
}

/* hover effect */
.sidebar ul li a:hover {
    transform: translateX(8px) scale(1.03);
    box-shadow: 0 12px 28px rgba(0,0,0,0.15);
}

/* active state */
.sidebar ul li a.active {
    background: #f8caca;
    outline: 3px solid white;
    box-shadow: 0 8px 18px rgba(0,0,0,0.1);
}

/* Different colors for each section */
.sidebar ul li:first-child a {
    background: #cde8f6;
}
.sidebar ul li:last-child a {
    background: #cdebdc;
}

/* ================= CONTENT ================= */
.content {
    flex: 1;
    height: 100%;
    /* padding: 20px; */
    
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    /* border-radius: 30px; */
    /* background: white; */
    /* box-shadow: 0 10px 30px rgba(0,0,0,0.1); */
}

/* ================= DESKTOP LARGE SCREENS ================= */
@media (min-width: 1400px) {
    .sidebar {
        width: 450px;
        padding: 50px 30px;
    }
    
    .brand {
        font-size: 42px;
        margin-bottom: 70px;
    }
    
    .sidebar ul {
        gap: 35px;
    }
    
    .sidebar ul li a {
        padding: 28px 35px;
        font-size: 26px;
        gap: 20px;
        border-radius:70% 30% 60% 40% / 40% 60% 40% 60%;
    }
    
    .sidebar ul li a .sticker {
        font-size: 32px;
    }
    
    .content {
        padding: 30px;
    }
    
    iframe {
        border-radius: 40px;
    }
}

/* ================= DESKTOP (1200px - 1399px) ================= */
@media (min-width: 1200px) and (max-width: 1399px) {
    .sidebar {
        width: 380px;
        padding: 40px 25px;
    }
    
    .brand {
        font-size: 36px;
        margin-bottom: 55px;
    }
    
    .sidebar ul {
        gap: 28px;
    }
    
    .sidebar ul li a {
        padding: 22px 30px;
        font-size: 22px;
        gap: 18px;
        border-radius: 70% 30% 60% 40% / 40% 60% 40% 60%;
    }
    
    .sidebar ul li a .sticker {
        font-size: 28px;
    }
    
    .content {
        padding: 25px;
    }
}

/* ================= TABLET (768px - 1199px) ================= */
@media (max-width: 1199px) and (min-width: 768px) {
    .sidebar {
        width: 280px;
        padding: 20px 15px;
    }
    
    .brand {
        font-size: 24px;
        margin-bottom: 35px;
    }
    
    .sidebar ul {
        gap: 18px;
    }
    
    .sidebar ul li a {
        padding: 14px 20px;
        font-size: 16px;
        gap: 12px;
    }
    
    .sidebar ul li a .sticker {
        font-size: 20px;
    }
    
    .content {
        padding: 15px;
    }
}

/* ================= MOBILE (below 768px) ================= */
@media (max-width: 767px) {
    .menu-toggle {
        display: block;
    }
    
    /* sidebar hidden initially */
    .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        height: 100%;
        width: 280px;
        background: #FCE7F1;
        box-shadow: 4px 0 20px rgba(0,0,0,0.2);
        z-index: 3000;
    }
    
    /* open state */
    .sidebar.open {
        left: 0;
    }
    
    body {
        flex-direction: column;
    }
    
    .brand {
        margin-top: 30px;
        margin-bottom: 30px;
        font-size: 22px;
    }
    
    .sidebar ul {
        gap: 15px;
    }
    
    .sidebar ul li a {
        padding: 12px 18px;
        font-size: 15px;
        justify-content: center;
    }
    
    .content {
        padding: 10px;
    }
    
    iframe {
        border-radius: 20px;
    }
}

/* ================= SMALL MOBILE (below 480px) ================= */
@media (max-width: 480px) {
    .sidebar {
        width: 260px;
        left: -260px;
    }
    
    .brand {
        font-size: 20px;
        margin-bottom: 25px;
    }
    
    .sidebar ul li a {
        padding: 10px 15px;
        font-size: 14px;
    }
    
    .sidebar ul li a .sticker {
        font-size: 18px;
    }
    
    .content {
        padding: 8px;
    }
}

/* ================= LANDSCAPE MODE FOR MOBILES ================= */
@media (max-width: 800px) and (orientation: landscape) {
    .sidebar {
        width: 240px;
    }
    
    .brand {
        font-size: 18px;
        margin-bottom: 20px;
        margin-top: 15px;
    }
    
    .sidebar ul {
        gap: 10px;
    }
    
    .sidebar ul li a {
        padding: 8px 12px;
        font-size: 13px;
    }
    
    .content {
        padding: 8px;
    }
}

</style>
<link rel="stylesheet" href="assets/CSS/walkman-font.css">
</head>

<body>
<div class="overlay"></div>
<button class="menu-toggle">☰</button>

<nav class="sidebar">
    <!-- <div class="brand">📚 हिंदी खेल</div> -->
    
    <ul>
        <li>
            <a href="exercises/matching.html" target="quiz-frame">
                <span class="sticker">🖼️</span>
                मिलान करो
            </a>
        </li>
        
        <li>
            <a href="exercises/fillblanks.html" target="quiz-frame">
                <span class="sticker">✏️</span>
                चित्र पहचानो
            </a>
        </li>
    </ul>
      
</nav>

<main class="content">
    <iframe name="quiz-frame" src="exercises/matching.html"></iframe>
</main>

<script>
    const toggleBtn = document.querySelector('.menu-toggle');
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.querySelector('.overlay');
    
    // Toggle sidebar on mobile
    toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    });
    
    // Close on overlay click
    overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    });
    
    // Active link logic
    const links = document.querySelectorAll('.sidebar a');
    links[0].classList.add('active');
    
    links.forEach(link => {
        link.addEventListener('click', (e) => {
            links.forEach(l => l.classList.remove('active'));
            e.currentTarget.classList.add('active');
            
            // Auto close on mobile
            if (window.innerWidth <= 767) {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            }
        });
    });
    
    // Listen for messages from iframe for navigation
    window.addEventListener("message", (e) => {
        if (e.data && e.data.action === "nextSection") {
            const target = e.data.target;
            
            // Load iframe
            const frame = document.querySelector("iframe[name='quiz-frame']");
            if (frame && target) {
                frame.src = "exercises/" + target;
            }
            
            // Update active sidebar link
            const links = document.querySelectorAll(".sidebar a");
            links.forEach(link => {
                link.classList.remove("active");
                if (link.getAttribute("href") && link.getAttribute("href").includes(target)) {
                    link.classList.add("active");
                }
            });
        }
    });
    
    // Handle window resize - close sidebar on resize to desktop
    window.addEventListener('resize', () => {
        if (window.innerWidth > 767) {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    });
</script>




</body>
</html>
