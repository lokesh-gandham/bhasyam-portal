<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Livvic:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 30%, #fff6eb, #ffefdf);
      font-family: 'Inter', 'Livvic', sans-serif;
      overflow: hidden;
      position: fixed;
    }

    .quiz {
      width: 100vw;
      max-width: 1400px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem 2rem;
      text-align: center;
      overflow: hidden;

    }



    .question-box {
      text-align: center;
      font-weight: 500;
      color: #1e3a5f;
      margin-bottom: 8px;
      padding-bottom: 0;
      border-bottom: none;
      flex-shrink: 0;
      letter-spacing: 1px;
      font-size: 30px !important;
    }

    .hindi-word {
      background: linear-gradient(125deg, #ffffff, #fffaf2);
      border: 3px solid #ffcf9a;
      border-radius: 100px;
      font-weight: 500;
      color: #2c3e66;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(2px);
      transition: 0.2s;
      display: inline-block;
      letter-spacing: 4px;
      font-size: 74px;
      padding: 18px 60px;
      margin-bottom: 40px;
    }

    .options-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 38px;
      margin-bottom: 48px;
    }

    .option-btn {
      background: linear-gradient(135deg, #ffffff 0%, #fff9f0 100%);
      border: none;
      font-weight: 500;
      color: #d1415c;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.95, 0.4, 1.1);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
      letter-spacing: 2px;
      border-radius: 60px;
      min-width: 160px;
      font-size: 52px;
      padding: 16px 24px;
    }

    .option-btn:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.15);
      background: linear-gradient(135deg, #fffef7, #fff5e6);
      color: #c03a55;
    }

    .option-btn.correct-selected {
      background: linear-gradient(135deg, #b8ffd4, #90e6b6);
      color: #0e5e32;
      box-shadow: 0 0 0 3px #2ecc71, 0 12px 24px rgba(46, 204, 113, 0.25);
      transform: scale(1.01);
    }

    .option-btn.wrong-selected {
      background: linear-gradient(135deg, #ffd6d6, #ffbdbd);
      color: #c0392b;
      animation: shakeAnim 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      box-shadow: 0 0 0 2px #e74c3c;
    }

    .option-btn.disabled-option {
      opacity: 0.75;
      pointer-events: none;
      filter: grayscale(0.02);
    }

    @keyframes shakeAnim {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-8px);
      }

      60% {
        transform: translateX(8px);
      }
    }

    .nav-area {
      display: flex;
      gap: 32px;
      margin-top: 8px;
    }

    .nav-btn {
      width: 150px;
      height: 50px;
      border: none;
      border-radius: 80px;
      font-weight: 800;
      color: white;
      cursor: pointer;
      transition: 0.08s linear;
      display: flex;
      align-items: center;
      justify-content: center;
      align-items: center;
      gap: 10px;
      letter-spacing: 1px;
      font-size: 18px;
      padding: 0px !important;
    }

    .prev-btn {
      background: #ffbc70;
      /* box-shadow: 0 9px 0 #b32d48; */
    }

    .next-btn {
      background: linear-gradient(135deg, #4facfe, #00c6fb);
      /* box-shadow: 0 9px 0 #5f3e9e; */
    }

    .nav-btn:active {
      transform: translateY(4px);
    }

    .prev-btn:active {
      /* box-shadow: 0 3px 0 #b32d48; */
    }

    .next-btn:active {
      /* box-shadow: 0 3px 0 #5f3e9e; */
    }

    .nav-btn:disabled {
      opacity: 0.5;
      transform: translateY(0);
      cursor: not-allowed;
    }

    .prev-btn:disabled {
      /* box-shadow: 0 9px 0 #b32d48; */
    }

    .next-btn:disabled {
      /* box-shadow: 0 9px 0 #5f3e9e; */
    }

    .popup-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);

      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s cubic-bezier(0.34, 1.4, 0.55, 1);
      text-align: center;
      white-space: nowrap;
    }

    .popup-glow.active {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .popup-emoji-big {
      font-size: 5rem;
      font-weight: 800;
      animation: bounceScale 0.45s ease;
    }

    @keyframes bounceScale {
      0% {
        transform: scale(0) rotate(-12deg);
        opacity: 0;
      }

      55% {
        transform: scale(1.25) rotate(2deg);
      }

      100% {
        transform: scale(1) rotate(0);
      }
    }

    .final-overlay-luxury {
      position: fixed;
      inset: 0;
      backdrop-filter: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      visibility: hidden;
      opacity: 0;
      transition: .25s ease;
    }

    .final-overlay-luxury.active {
      visibility: visible;
      opacity: 1;
    }

    .final-card-modern {
      background: linear-gradient(135deg, #fff7e8, #fff0dd);
      border-radius: 50px;
      padding: 1.6rem 2rem;
      text-align: center;
      max-width: 360px;
      width: 90%;
      border: 5px solid #ffbc6e;
      box-shadow: 0 20px 30px rgba(0, 0, 0, .25), 0 0 0 10px #ffdd9e;
      animation: floatWin .55s cubic-bezier(.34, 1.2, .55, 1);
    }

    @keyframes floatWin {
      0% {
        transform: scale(.1) rotate(-10deg);
        opacity: 0;
      }

      70% {
        transform: scale(1.02);
      }

      100% {
        transform: scale(1);
      }
    }

    .final-card-modern h2 {
      font-size: 1.5rem;
      color: #c94f1f;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .final-stars {
      font-size: 2.2rem;
      letter-spacing: 8px;
      margin: 12px 0;
      color: #f5b042;
      text-shadow: 1px 1px 0 #e67e22;
    }


    .final-card-modern p {
      font-size: 1.1rem;
      margin: 7px 0;
      color: #5a3e2b;
      font-weight: 600;
    }


    .btn-replay-luxury {
      background: #ffac30;
      border: none;
      padding: 10px 28px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #4a2a0e;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 6px 0 #b46f2a;
    }

    .btn-replay-luxury:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b46f2a;
    }

    @media (min-width: 1600px) {
      .question-box {
        font-size: 40px !important;
        padding: 14px 36px !important;
      }

      .hindi-word {
        font-size: 86px !important;
        padding: 22px 70px !important;
        margin-bottom: 45px !important;
      }

      .option-btn {
        min-width: 210px !important;
        font-size: 56px !important;
        padding: 20px 24px !important;
        border-radius: 70px !important;
      }

      .options-list {
        gap: 45px !important;
        margin-bottom: 50px !important;
      }

      .nav-btn {
        font-size: 1.5rem !important;
        padding: 16px 48px !important;
      }
    }

    @media (min-width: 1300px) and (max-width: 1599px) {
      .question-box {
        font-size: 30px !important;
        padding: 10px 32px;
      }

      .hindi-word {
        font-size: 74px;
        padding: 18px 60px;
      }

      .option-btn {
        min-width: 180px;
        font-size: 52px;
        padding: 16px 22px;
      }

      .options-list {
        gap: 38px;
      }

      .nav-btn {
        font-size: 20px;
        padding: 14px 40px;
      }
    }

    @media (min-width: 1024px) and (max-width: 1299px) {
      .question-box {
        font-size: 30px !important;
        padding: 8px 28px;
        margin-bottom: 28px;
      }

      .hindi-word {
        font-size: 64px;
        padding: 14px 48px;
        margin-bottom: 36px;
      }

      .option-btn {
        min-width: 155px;
        font-size: 50px;
        padding: 14px 18px;
        border-radius: 55px;
      }

      .options-list {
        gap: 32px;
        margin-bottom: 42px;
      }

      .nav-btn {
        font-size: 18px;
        padding: 12px 34px;
      }
    }

    @media (max-width: 1023px) {
      .quiz {
        justify-content: center;
        padding: 1rem;
        overflow: hidden;
      }

      .hindi-word {
        font-size: 30px !important;
        padding: 12px 28px;
        white-space: normal;
      }

      .option-btn {
        min-width: 110px;
        font-size: 38px;
        padding: 12px 14px;
      }

      .options-list {
        gap: 20px;
        margin-bottom: 35px;
      }

      body {
        overflow: hidden;
      }

      .nav-btn {
        font-size: 18px;
        padding: 10px 35px;
      }
    }

    @media (max-width: 700px) {
      .final-card-modern {
        padding: 30px 20px;
      }

      .final-card-modern h2 {
        font-size: 1.8rem;
      }

      .final-stars {
        font-size: 2.2rem;
        letter-spacing: 6px;
      }

      .final-card-modern p {
        font-size: 1.2rem;
      }

      .btn-replay-luxury {
        font-size: 1.2rem;
        padding: 10px 28px;
      }

      .popup-emoji-big {
        font-size: 3rem;
      }

      .popup-glow {
        padding: 0.8rem 2rem;
        white-space: nowrap;
      }

      .option-btn {
        min-width: 100px;
        font-size: 32px;
        padding: 10px 16px;
      }
    }

    @media (max-width: 550px) {
      .hindi-word {
        font-size: 34px;
        padding: 10px 20px;
      }

      .option-btn {
        min-width: 85px;
        font-size: 28px;
        padding: 8px 10px;
      }

      .nav-btn {
        font-size: 0.9rem;
        padding: 8px 20px;
      }

      .question-box {
        font-size: 13px;
      }
    }
  </style>
  <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

  <div class="quiz">
    <div class="question-box">🌟 दिए गए शब्दों को ‘र’ के रूप के अनुसार लिखिए।
      🌟</div>
    <div class="hindi-word" id="hindiWord">तीन</div>
    <div class="options-list" id="optionsList"></div>
    <div class="nav-area">
      <button class="nav-btn prev-btn" id="prevBtn" disabled> पिछला</button>
      <button class="nav-btn next-btn" id="nextBtn" disabled>अगला </button>
    </div>
  </div>

  <div id="reactionPopup" class="popup-glow">
    <div class="popup-emoji-big" id="popupEmojiDisplay">🎉</div>
  </div>

  <div id="finalPopupOverlay" class="final-overlay-luxury">
    <div class="final-card-modern">
      <h2>🎉 बहुत बहुत बधाई! 🎉</h2>
      <div class="final-stars">⭐⭐⭐⭐⭐</div>
      <p>आपने सभी प्रश्न सही किए!</p>
      <p>✨ आप होशियार हो! ✨</p>
      <button class="btn-replay-luxury" id="finalPlayAgainBtn">🔄 फिर से खेलें</button>
    </div>
  </div>

  <script>
    function speakHindi(text) {
      const voices = speechSynthesis.getVoices();

      const hindiVoice = voices.find(v =>
        v.lang.includes("hi")
      );

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.voice = hindiVoice;
      utterance.rate = 1;
      utterance.pitch = 1;

      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }
    let audioCtx = null;

    function playCorrect() {

      try {

        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        audioCtx.resume();

        const osc = audioCtx.createOscillator();

        const gain = audioCtx.createGain();

        osc.connect(gain);

        gain.connect(audioCtx.destination);

        osc.frequency.value = 880;

        gain.gain.value = 0.2;

        osc.type = "sine";

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
          0.00001,
          audioCtx.currentTime + 0.45
        );

        osc.stop(audioCtx.currentTime + 0.45);

      } catch (e) { }

    }

    function playWrong() {

      try {

        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        audioCtx.resume();

        const osc = audioCtx.createOscillator();

        const gain = audioCtx.createGain();

        osc.connect(gain);

        gain.connect(audioCtx.destination);

        osc.frequency.value = 480;

        gain.gain.value = 0.2;

        osc.type = "triangle";

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
          0.00001,
          audioCtx.currentTime + 0.4
        );

        osc.stop(audioCtx.currentTime + 0.4);

      } catch (e) { }

    }

    function initAudioOnce() {

      if (audioCtx) return;

      try {

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const buffer = audioCtx.createBuffer(1, 1, 22050);

        const src = audioCtx.createBufferSource();

        src.buffer = buffer;

        src.connect(audioCtx.destination);

        src.start();

      } catch (e) { }

    }

    const QUESTIONS = [

      {
        hindiWord: "र",
        displayOptions: ["मटर", "घर"],
        hiddenOptions: ["पर्व", "रथ"],
        correct: "रथ"
      },

      {
        hindiWord: "र्",
        displayOptions: ["पर्व", "हर्ष"],
        hiddenOptions: ["दर्पण", "घर"],
        correct: "दर्पण"
      },

      {
        hindiWord: "/",
        displayOptions: ["चक्र", "प्रणाम"],
        hiddenOptions: ["प्रश्न", "मेट्रो"],
        correct: "प्रश्न"
      },

      {
        hindiWord: "^",
        displayOptions: ["मेट्रो", "ड्रम"],
        hiddenOptions: ["ड्रामा", "तबला"],
        correct: "ड्रामा"
      }

    ];

    let currentIndex = 0;
    let quizCompleted = false;

    let userState = QUESTIONS.map(() => ({
      correctFlag: false,
      selectedVal: null,
      blankOpened: false
    }));

    const hindiWordEl = document.getElementById("hindiWord");
    const optionsContainer = document.getElementById("optionsList");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const popupDiv = document.getElementById("reactionPopup");
    const popupEmojiSpan = document.getElementById("popupEmojiDisplay");
    const finalOverlay = document.getElementById("finalPopupOverlay");

    function showResultPopup(isCorrect) {

      if (isCorrect) {

        popupEmojiSpan.innerHTML = "😊";

        // speakHindi("सही");
        playCorrect();


        confetti({
          particleCount: 140,
          spread: 80,
          origin: { y: 0.6 }
        });

      } else {

        popupEmojiSpan.innerHTML = "😢";

        // speakHindi("गलत");
        playWrong()
      }

      popupDiv.classList.add("active");

      setTimeout(() => {
        popupDiv.classList.remove("active");
      }, 900);
    }

    function updateNavButtons() {

      prevBtn.disabled = currentIndex === 0;

      nextBtn.disabled = !userState[currentIndex].correctFlag;
    }

    function triggerFinalCelebration() {

      if (quizCompleted) return;

      quizCompleted = true;

      confetti({
        particleCount: 350,
        spread: 130,
        origin: { y: 0.5 }
      });

      setTimeout(() => {
        finalOverlay.classList.add("active");
      }, 500);
    }

    function renderQuestion() {

      const q = QUESTIONS[currentIndex];
      const state = userState[currentIndex];

      hindiWordEl.innerText = q.hindiWord;

      optionsContainer.innerHTML = "";

      /* FIRST TWO OPTIONS */

      q.displayOptions.forEach(opt => {

        const btn = document.createElement("button");

        btn.className = "option-btn";

        btn.innerText = opt;

        btn.disabled = true;

        btn.style.opacity = "0.8";

        optionsContainer.appendChild(btn);

      });

      /* BLANK BUTTON */

      const blankBtn = document.createElement("div");

      blankBtn.className = "option-btn";

      blankBtn.style.minWidth = "240px";

      blankBtn.style.minHeight = "90px";

      blankBtn.style.display = "flex";

      blankBtn.style.alignItems = "center";

      blankBtn.style.justifyContent = "center";

      blankBtn.style.flexDirection = "row";

      blankBtn.style.gap = "10px";

      blankBtn.style.cursor = "pointer";

      blankBtn.style.padding = "10px 16px";

      if (state.correctFlag) {

        blankBtn.innerHTML = state.selectedVal;

        blankBtn.classList.add("correct-selected");

        blankBtn.style.pointerEvents = "none";

      } else {

        if (!state.blankOpened) {

          blankBtn.innerHTML = "_____";

        } else {

          blankBtn.innerHTML = "";

          q.hiddenOptions.forEach(opt => {

            const hiddenBtn = document.createElement("button");

            hiddenBtn.className = "option-btn";

            hiddenBtn.style.minWidth = "80px";

            hiddenBtn.style.fontSize = "26px";

            hiddenBtn.style.padding = "6px 10px";

            hiddenBtn.style.borderRadius = "40px";

            hiddenBtn.style.margin = "0";

            hiddenBtn.innerText = opt;

            hiddenBtn.onclick = (e) => {

              e.stopPropagation();

              if (state.correctFlag) return;

              const isCorrect = opt === q.correct;

              if (isCorrect) {

                state.correctFlag = true;

                state.selectedVal = opt;

                blankBtn.innerHTML = opt;

                blankBtn.classList.add("correct-selected");

                blankBtn.style.pointerEvents = "none";

                showResultPopup(true);

                updateNavButtons();

                const allCorrect = userState.every(s => s.correctFlag);

                if (allCorrect) {

                  triggerFinalCelebration();
                }

              } else {

                hiddenBtn.classList.add("wrong-selected");

                showResultPopup(false);

                setTimeout(() => {

                  hiddenBtn.classList.remove("wrong-selected");

                }, 500);
              }
            };

            blankBtn.appendChild(hiddenBtn);

          });

        }

      }

      blankBtn.onclick = () => {

        if (state.correctFlag) return;

        state.blankOpened = true;

        renderQuestion();
      };

      optionsContainer.appendChild(blankBtn);

      updateNavButtons();
    }
    prevBtn.onclick = () => {

      if (currentIndex > 0) {

        currentIndex--;

        renderQuestion();
      }
    };

    nextBtn.onclick = () => {

      if (!userState[currentIndex].correctFlag) return;

      if (currentIndex < QUESTIONS.length - 1) {

        currentIndex++;

        renderQuestion();

      } else {

        triggerFinalCelebration();
      }
    };

    document.getElementById("finalPlayAgainBtn").onclick = () => {

      currentIndex = 0;

      quizCompleted = false;

      userState = QUESTIONS.map(() => ({
        correctFlag: false,
        selectedVal: null,
        blankOpened: false
      }));

      finalOverlay.classList.remove("active");

      renderQuestion();
    };

    renderQuestion();

  </script>
</body>

</html>
