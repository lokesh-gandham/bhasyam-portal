    <script>

        // ======================== SPEECH ========================

        function speakHindi(text) {

            if (!("speechSynthesis" in window)) return;

            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);

            utterance.lang = "hi-IN";

            utterance.rate = 0.9;

            utterance.pitch = 1.1;

            speechSynthesis.speak(utterance);
        }

        // ======================== SOUNDS ========================
        let audioCtx = null;

        function playCorrect() {

            try {

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                audioCtx.resume();

                const osc = audioCtx.createOscillator();

                const gain = audioCtx.createGain();

                osc.connect(gain);

                gain.connect(audioCtx.destination);

                osc.frequency.value = 880;

                gain.gain.value = 0.2;

                osc.type = "sine";

                osc.start();

                gain.gain.exponentialRampToValueAtTime(
                    0.00001,
                    audioCtx.currentTime + 0.45
                );

                osc.stop(audioCtx.currentTime + 0.45);

            } catch (e) { }

        }

        function playWrong() {

            try {

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                audioCtx.resume();

                const osc = audioCtx.createOscillator();

                const gain = audioCtx.createGain();

                osc.connect(gain);

                gain.connect(audioCtx.destination);

                osc.frequency.value = 480;

                gain.gain.value = 0.2;

                osc.type = "triangle";

                osc.start();

                gain.gain.exponentialRampToValueAtTime(
                    0.00001,
                    audioCtx.currentTime + 0.4
                );

                osc.stop(audioCtx.currentTime + 0.4);

            } catch (e) { }

        }

        function initAudioOnce() {

            if (audioCtx) return;

            try {

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                const buffer = audioCtx.createBuffer(1, 1, 22050);

                const src = audioCtx.createBufferSource();

                src.buffer = buffer;

                src.connect(audioCtx.destination);

                src.start();

            } catch (e) { }

        }





        // ======================== CONFETTI ========================

        function triggerConfetti() {

            confetti({
                particleCount: 350,
                spread: 130,
                origin: { y: 0.5 }
            });

        }

        // ======================== QUESTIONS ========================

        const allQuestions = [

            { image: "../assets/images/mom.png", word: "अम्मा" },
            { image: "../assets/images/baby.png", word: "बच्चा" },
            { image: "../assets/images/sand.png", word: "मिट्टी" },
            { image: "../assets/images/balloon.png", word: "गुब्बारा" },
            { image: "../assets/images/corn.png", word: "मक्का" },
            { image: "../assets/images/grain.png", word: "अन्न" },

            { image: "../assets/images/bed.png", word: "बिस्तर" },
            { image: "../assets/images/fly.png", word: "मक्खी" },
            { image: "../assets/images/letter.png", word: "चिट्ठी" },
            { image: "../assets/images/cup.png", word: "प्याला" },
            { image: "../assets/images/doctor.png", word: "डॉक्टर" },
            { image: "../assets/images/stone.png", word: "पत्थर" },

            { image: "../assets/images/truck.png", word: "ट्रक" },
            { image: "../assets/images/sun.png", word: "सूर्य" },
            { image: "../assets/images/moon.png", word: "चंद्रमा" },
            { image: "../assets/images/map.png", word: "राष्ट्र" },
            { image: "../assets/images/mountain.png", word: "पर्वत" },
            { image: "../assets/images/lamp.png", word: "प्रकाश" }

        ];

        const QUESTIONS_PER_PAGE = 6;

        const TOTAL_PAGES =
            Math.ceil(allQuestions.length / QUESTIONS_PER_PAGE);

        let currentPage = 0;

        let solvedStatus =
            new Array(allQuestions.length).fill(false);

        let selectedImageIndex = null;

        const leftSide = document.getElementById("leftSide");

        const rightSide = document.getElementById("rightSide");

        const centerWords = document.getElementById("centerWords");

        const stageTitle = document.getElementById("stageTitle");

        const nextBtn = document.getElementById("nextBtn");

        const prevBtn = document.getElementById("prevBtn");

        const svg = document.getElementById("svgLines");

        // ======================== HELPERS ========================

        function shuffleArray(arr) {

            for (let i = arr.length - 1; i > 0; i--) {

                const j = Math.floor(Math.random() * (i + 1));

                [arr[i], arr[j]] = [arr[j], arr[i]];
            }

            return arr;
        }

        function getCurrentPageQuestions() {

            const start = currentPage * QUESTIONS_PER_PAGE;

            const end =
                Math.min(start + QUESTIONS_PER_PAGE, allQuestions.length);

            return allQuestions.slice(start, end).map((q, idx) => ({

                ...q,

                globalIndex: start + idx

            }));
        }

        // ======================== DRAW LINE ========================
        function drawLine(imageElem, wordElem) {

            const svgRect = svg.getBoundingClientRect();

            const imgRect = imageElem.getBoundingClientRect();

            const wordRect = wordElem.getBoundingClientRect();

            const isLeftSide =
                imageElem.closest(".left-side") !== null;

            let x1, y1, x2, y2;

            if (isLeftSide) {

                // LEFT IMAGE → LEFT SIDE WORD

                x1 = imgRect.right - svgRect.left;

                y1 = imgRect.top +
                    imgRect.height / 2 -
                    svgRect.top;

                x2 = wordRect.left -
                    svgRect.left -
                    6;

                y2 = wordRect.top +
                    wordRect.height / 2 -
                    svgRect.top;

            } else {

                // RIGHT IMAGE → RIGHT SIDE WORD

                x1 = imgRect.left -
                    svgRect.left;

                y1 = imgRect.top +
                    imgRect.height / 2 -
                    svgRect.top;

                x2 = wordRect.right -
                    svgRect.left +
                    6;

                y2 = wordRect.top +
                    wordRect.height / 2 -
                    svgRect.top;
            }

            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );

            line.setAttribute("x1", x1);
            line.setAttribute("y1", y1);
            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);

            line.setAttribute("stroke", "#ff1493");
            line.setAttribute("stroke-width", "3");
            line.setAttribute("stroke-dasharray", "8,6");
            line.setAttribute("stroke-linecap", "round");

            svg.appendChild(line);
        }
        // ======================== NAV ========================

        function updateNavButtons() {

            const start =
                currentPage * QUESTIONS_PER_PAGE;

            const end =
                Math.min(start + QUESTIONS_PER_PAGE, allQuestions.length);

            let allSolved = true;

            for (let i = start; i < end; i++) {

                if (!solvedStatus[i]) {

                    allSolved = false;

                    break;
                }
            }

            nextBtn.disabled = !allSolved;

            prevBtn.disabled = currentPage === 0;

            stageTitle.textContent =
                `पृष्ठ ${currentPage + 1} / ${TOTAL_PAGES}`;
        }

        // ======================== FINAL POPUP ========================

        function checkAndShowFinalPopup() {

            const allFinished =
                solvedStatus.every(status => status === true);

            if (allFinished) {

                // speakHindi("बधाई हो! आपने सभी प्रश्न पूरे कर लिए");

                triggerConfetti();

                const finalOverlay =
                    document.getElementById("finalPopupOverlay");

                finalOverlay.classList.add("active");

                document.getElementById("finalPlayAgainBtn").onclick = () => {

                    location.reload();

                };
            }
        }

        // ======================== RENDER ========================

        function renderPage() {

            leftSide.innerHTML = "";

            rightSide.innerHTML = "";

            centerWords.innerHTML = "";

            svg.innerHTML = "";

            selectedImageIndex = null;

            const questions = getCurrentPageQuestions();

            const half = Math.ceil(questions.length / 2);

            const leftItems = questions.slice(0, half);

            const rightItems = questions.slice(half);

            leftItems.forEach((item, idx) => {

                const div = document.createElement("div");

                div.className = "left-item";

                div.innerHTML = `
            <div class="number">${idx + 1}) ●</div>

            <div class="image-box"
                 data-index="${item.globalIndex}">
                <img src="${item.image}">
            </div>
        `;

                leftSide.appendChild(div);

            });

            rightItems.forEach((item, idx) => {

                const div = document.createElement("div");

                div.className = "right-item";

                div.innerHTML = `
            <div class="image-box"
                 data-index="${item.globalIndex}">
                <img src="${item.image}">
            </div>

            <div class="number">
                ● ${half + idx + 1})
            </div>
        `;

                rightSide.appendChild(div);

            });

            shuffleArray([...questions]).forEach(item => {

                const word = document.createElement("div");

                word.className = "word";

                word.dataset.word = item.word;

                word.dataset.index = item.globalIndex;

                word.textContent = item.word;

                centerWords.appendChild(word);

            });

            addEvents();
            // ===== RESTORE LOCKED ANSWERS =====

            questions.forEach(item => {

                if (solvedStatus[item.globalIndex]) {

                    const image =
                        document.querySelector(
                            `.image-box[data-index="${item.globalIndex}"]`
                        );

                    const word =
                        document.querySelector(
                            `.word[data-index="${item.globalIndex}"]`
                        );

                    if (image && word) {

                        image.classList.add("correct");

                        word.classList.add("correct");

                        image.style.pointerEvents = "none";

                        word.style.pointerEvents = "none";

                        drawLine(image, word);

                    }

                }

            });

            updateNavButtons();
        }

        // ======================== EVENTS ========================

        function addEvents() {

            const imageBoxes =
                document.querySelectorAll(".image-box");

            const words =
                document.querySelectorAll(".word");

            imageBoxes.forEach(box => {

                box.onclick = () => {

                    document
                        .querySelectorAll(".image-box")
                        .forEach(b => b.classList.remove("selected"));

                    box.classList.add("selected");

                    selectedImageIndex =
                        parseInt(box.dataset.index);
                };
            });

            words.forEach(word => {

                word.onclick = () => {

                    if (selectedImageIndex === null) {

                        // speakHindi("पहले चित्र चुनें");

                        return;
                    }

                    const question =
                        allQuestions[selectedImageIndex];

                    if (question.word === word.dataset.word) {

                        solvedStatus[selectedImageIndex] = true;

                        // speakHindi("सही");
                        playCorrect();

                        triggerConfetti();

                        // speakHindi("सही उत्तर");

                        const image =
                            document.querySelector(
                                `.image-box[data-index="${selectedImageIndex}"]`
                            );

                        image.classList.add("correct");

                        image.classList.remove("selected");

                        word.classList.add("correct");

                        drawLine(image, word);

                        selectedImageIndex = null;

                        updateNavButtons();

                        checkAndShowFinalPopup();

                    } else {



                        //  speakHindi("गलत");
                        playWrong();

                        word.style.backgroundColor = "#ffe0e0";

                        setTimeout(() => {

                            word.style.backgroundColor = "";

                        }, 300);
                    }
                };
            });
        }

        // ======================== NAVIGATION ========================

        prevBtn.onclick = () => {

            if (currentPage > 0) {

                currentPage--;

                renderPage();
            }
        };

        nextBtn.onclick = () => {

            if (currentPage < TOTAL_PAGES - 1) {

                currentPage++;

                renderPage();

            } else {

                checkAndShowFinalPopup();
            }
        };

        // ======================== START ========================

        renderPage();

    </script>

</body>

</html>
