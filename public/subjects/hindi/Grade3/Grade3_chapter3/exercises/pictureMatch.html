<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/CSS/pictureMatch.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>
<body>

  <div class="game-container">
    <!-- Title at center -->
    <h1 class="main-title">चित्रों के नाम लिखिए</h1>
    
    <!-- Questions Grid 2x3 (6 questions per page) -->
    <div class="questions-grid" id="questionsGrid"></div>

    <!-- Options Area (6 clickable options in ONE ROW) -->
    <div class="options-area" id="optionsArea">
      <div class="options-container" id="optionsContainer"></div>
    </div>

    <!-- Navigation Buttons -->
    <div class="nav-buttons">
      <button id="prevBtn" class="nav-btn prev-btn">पिछला</button>
      <button id="nextBtn" class="nav-btn next-btn">अगला</button>
    </div>
  </div>

  <!-- Popup for Correct/Wrong/Final -->
 <!-- REACTION POPUP -->

<div id="reactionPopup" class="popup-glow">
  <div class="popup-emoji-big" id="popupEmojiDisplay">🎉</div>
</div>

<!-- FINAL POPUP -->

<div id="finalPopupOverlay" class="final-overlay-luxury">
  <div class="final-card-modern">

    <h2>🎉 बहुत बहुत बधाई! 🎉</h2>

    <div class="final-stars">⭐⭐⭐⭐⭐</div>

    <p>आपने सभी प्रश्न सही किए!</p>

    <p>✨ आप होशियार हो! ✨</p>

    <button class="btn-replay-luxury" id="finalPlayAgainBtn">
      🔄 फिर से खेलें
    </button>

  </div>
</div>
  

  <script src="../assets/JavaScript/pictureMatch.js"></script>
</body>
</html>
