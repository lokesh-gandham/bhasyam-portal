<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family:  'Livvic';
            overflow: hidden;
        }
        html, body {
    height: 100%;
    overflow: hidden;
    position: fixed;
    width: 100%;
}

        body {
            height: 100vh;
            overflow: hidden;
            background: #FFF9F0;;
            background-size: 100% 100%;
            position: relative;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .topbar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 20px 10px 20px;
            position: relative;
            z-index: 100;
            width: 100%;
        }

        .nav-group {
            position: relative;
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 15px 20px;
            border-radius: 25px;
        }

        .island-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 8px;
            font-size: 18px;
            font-weight: 400;
            cursor: pointer;
            white-space: nowrap;
            z-index: 2;
            transition: all 0.2s ease;
            background:#eb7395;
            color: #000;
            border: none;
            letter-spacing: 0.5px;
            border-radius: 12px;
            box-shadow: none;
            transform: translateY(-2px);
            flex: 1;
            min-width: 0;
            width: auto;
            opacity: .45;
            filter: grayscale(.3);
        }

        .island-btn::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 15%;
            width: 18px;
            height: 9px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 10px 10px 0 0;
        }

        .island-btn::after {
            content: '';
            position: absolute;
            top: -8px;
            right: 15%;
            width: 18px;
            height: 9px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 10px 10px 0 0;
        }

        .island-btn i {
            font-size: 1.1em;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        .island-btn:hover {
            box-shadow: none;
            transform: translateY(0);
            filter: brightness(1.05);
        }

        .island-btn:active {
            box-shadow: none;
            transform: translateY(0);
        }

        .island-btn:disabled {
            box-shadow: none;
        }

        .island-btn.active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
            filter: brightness(0.95);
            opacity: 1;
            filter: grayscale(0);
            pointer-events: auto;
        }

        .main {
            flex: 1;
            display: none;
            padding: 10px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .menu-btn {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: #f5a623;
            border: none;
            font-size: 28px;
            padding: 12px 18px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 6px 0 #c17d1a;
            cursor: pointer;
            z-index: 5000;
            transition: 0.07s linear;
            font-weight: bold;
        }
        
        .menu-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #c17d1a;
        }

        .offcanvas {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: none;
            z-index: 4000;
        }
        
        .offcanvas.show {
            display: block;
        }
        
        .offcanvas-panel {
            position: absolute;
            right: 0;
            top: 0;
            width: 300px;
            height: 100%;
            background: #fff8e8;
            padding: 80px 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transform: translateX(100%);
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            overflow-y: auto;
            box-shadow: -5px 0 30px rgba(0, 0, 0, 0.3);
            border-left: 5px solid #ffd966;
        }
        
        .offcanvas.show .offcanvas-panel {
            transform: translateX(0);
        }
        
        .offcanvas-panel .island-btn {
            flex: none;
            padding: 15px 20px;
            font-size: 16px;
            justify-content: flex-start;
            gap: 15px;
            min-width: auto;
        }
        
        .offcanvas-panel .island-btn::before,
        .offcanvas-panel .island-btn::after {
            display: none;
        }

        @keyframes legoPop {
            0% {
                transform: scale(0.9) translateY(0);
                opacity: 0;
            }
            80% {
                transform: scale(1.05) translateY(-3px);
            }
            100% {
                transform: scale(1) translateY(-2px);
                opacity: 1;
            }
        }

        .island-btn {
            animation: legoPop 0.3s ease-out;
        }

        /* ========== MEDIA QUERIES IN ORDER: smallest to largest ========== */

        /* Small Mobile (up to 480px) */
        @media (max-width: 480px) {
            .menu-btn {
                font-size: 22px;
                padding: 10px 15px;
                top: 15px;
                right: 15px;
            }
            .offcanvas-panel {
                width: 85%;
            }
            .offcanvas-panel .island-btn {
                font-size: 14px;
                padding: 12px 16px;
            }
        }

        /* Mobile (up to 767px) - Hide topbar, show menu button */
        @media (max-width: 767px) {
            .topbar {
                display: none;
            }
            .menu-btn {
                display: block;
            }
            .main {
                padding: 8px;
            }
        }

        /* Tablets (768px - 1023px) */
        @media (min-width: 768px) and (max-width: 1023px) {
            .topbar {
                padding: 12px 15px 8px 15px;
            }
            .nav-group {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
                padding: 12px 15px;
            }
           
             .island-btn {
                font-size: 22px !important;
                padding: 16px 8px;
                gap: 8px;
            
            }
            .island-btn::before,
            .island-btn::after {
                width: 14px;
                height: 7px;
                top: -7px;
            }
        }

        /* Small Laptops (1024px - 1280px) */
        @media (min-width: 1024px) and (max-width: 1280px) {
            .topbar {
                padding: 15px 15px 10px 15px;
            }
            .nav-group {
                gap: 10px;
                padding: 18px 15px;
            }
            .island-btn {
                font-size: 18px !important;
                padding: 16px 8px;
                gap: 8px;
            }
            .island-btn i {
                font-size: 1.1em;
            }
            .island-btn::before,
            .island-btn::after {
                width: 16px;
                height: 8px;
                top: -8px;
            }
        }

        /* Standard Laptops (1281px - 1440px) */
        @media (min-width: 1281px) and (max-width: 1440px) {
            .topbar {
                padding: 20px 22px 14px 22px;
            }
            .nav-group {
                gap: 14px;
                padding: 28px 24px;
                border-radius: 30px;
            }
            .island-btn {
                font-size: 19px !important;
                padding: 20px 30px;
                gap: 10px;
                border-radius: 15px;
                height: 60px;
            }
            .island-btn i {
                font-size: 1.25em;
            }
            .island-btn::before,
            .island-btn::after {
                width: 20px;
                height: 10px;
                top: -10px;
            }
        }

        /* Desktop (1441px - 1680px) */
      
@media (min-width: 1441px) and (max-width: 1680px) {
    .topbar {
        padding: 15px 25px 10px 25px;
       
    }
    .nav-group {
        gap: 12px;
        padding: 16px 25px;
    }
    .island-btn {
        font-size: 20px !important;
        padding: 13px 10px !important;
        gap: 8px;
        height: 70px;
    }
    .island-btn i {
        font-size: 1.4em;
    }
    .island-btn::before,
    .island-btn::after {
        width: 18px;
        height: 9px;
        top: -9px;
    }
}

        /* Large Desktop (1681px - 1920px) */
        @media (min-width: 1681px) and (max-width: 1920px) {
            .topbar {
                padding: 18px 30px 12px 30px;
            }
            .nav-group {
                gap: 15px;
                padding: 18px 30px;
            }
            .island-btn {
                font-size: 24px !important;
                padding: 15px 12px;
                gap: 10px;
                height: 80px;
            }
            .island-btn i {
                font-size: 25px;
            }
            .island-btn::before,
            .island-btn::after {
                width: 20px;
                height: 10px;
                top: -10px;
            }
        }

        /* Ultra Wide (1921px+) */
        @media (min-width: 1921px) {
            .topbar {
                padding: 25px 50px 20px 50px;
            }
            .nav-group {
                gap: 25px;
                padding: 28px 45px;
                border-radius: 35px;
                border-width: 4px;
            }
            .island-btn {
                font-size: 29px;
                padding: 35px 20px;
                gap: 15px;
                border-radius: 18px;
                box-shadow: none;
            }
            .island-btn i {
                font-size: 28px;
            }
            .island-btn::before,
            .island-btn::after {
                width: 30px;
                height: 15px;
                top: -15px;
                border-radius: 15px 15px 0 0;
            }
            .island-btn:nth-child(1) { box-shadow: 0 8px 0 #b86b63; }
            .island-btn:nth-child(2) { box-shadow: 0 8px 0 #5f8fb3; }
            .island-btn:nth-child(3) { box-shadow: 0 8px 0 #6c9f7b; }
            .island-btn:nth-child(4) { box-shadow: 0 8px 0 #c08a5b; }
            .island-btn:nth-child(5) { box-shadow: 0 8px 0 #8a6aa3; }
            .island-btn:nth-child(6) { box-shadow: 0 8px 0 #5f9a91; }
            .island-btn:nth-child(7) { box-shadow: 0 8px 0 #b87852; }
            .island-btn:nth-child(8) { box-shadow: 0 8px 0 #a86a63; }
        }

        /* Height adjustments for smaller screens */
        @media (max-height: 600px) {
            .island-btn {
                padding: 10px 7px;
                font-size: 18px;
                font-weight: 500;
            }
            .island-btn i {
                font-size: 0.9em;
            }
        }

        @media (max-height: 700px) {
            .topbar {
                padding: 8px 20px 5px 20px;
            }
            .nav-group {
                padding: 10px 15px;
                gap: 8px;
            }
            .island-btn {
                padding: 8px 6px;
                font-size: 11px;
            }
            .main {
                padding: 5px;
            }
        }
    </style>
            <link rel="stylesheet" href="assets/CSS/walkman-font.css">
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()">🧱 ☰</button>

    <div class="app">
        <div class="topbar">
            <div class="nav-group">
                <div class="island-btn active" onclick="mobileOpen(0)">
                <i class="fa-solid fa-link"></i>सही शब्द
            </div>
             <div class="island-btn" onclick="mobileOpen(1)">
                <i class="fa-regular fa-star"></i> सही अंक
            </div>
             <div class="island-btn" onclick="mobileOpen(2)">
                <i class="fa-solid fa-bullseye"></i> सही संख्या
            </div>
                <div class="island-btn" onclick="mobileOpen(3)">
                <i class="fa-regular fa-circle-check"></i>सही विकल्प
            </div>
            <div class="island-btn" onclick="mobileOpen(4)">
                <i class="fa-solid fa-pencil"></i>मिलते-जुलते
            </div>
            <div class="island-btn" onclick="mobileOpen(5)">
                <i class="fa-regular fa-check-circle"></i>रिक्त स्थान
            </div>
            <div class="island-btn" onclick="mobileOpen(6)">
                <i class="fa-solid fa-puzzle-piece"></i>चित्र पर गोला
            </div>
           
        
            
            <div class="island-btn" onclick="mobileOpen(7)">
                <i class="fa-solid fa-circle-check"></i>मिलान
            </div>
                 <div class="island-btn" onclick="openIsland(8)">
                    <i class="fa-solid fa-link"></i>
                    संज्ञा चुनो
                </div>
            </div>
        </div>

        <div class="main">
            <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>
        </div>
    </div>

    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">
        <div class="offcanvas-panel" onclick="event.stopPropagation()">
          <div class="island-btn active" onclick="mobileOpen(0)">
                <i class="fa-regular fa-circle-check"></i>सही विकल्प
            </div>
            <div class="island-btn" onclick="mobileOpen(1)">
                <i class="fa-solid fa-pencil"></i>मिलते-जुलते
            </div>
            <div class="island-btn" onclick="mobileOpen(2)">
                <i class="fa-regular fa-check-circle"></i>रिक्त स्थान
            </div>
            <div class="island-btn" onclick="mobileOpen(3)">
                <i class="fa-solid fa-puzzle-piece"></i>मिलान
            </div>
            <div class="island-btn" onclick="mobileOpen(4)">
                <i class="fa-regular fa-star"></i>लिंग बदलिए
            </div>
            <div class="island-btn" onclick="mobileOpen(5)">
                <i class="fa-solid fa-bullseye"></i>चित्र पर गोला
            </div>
            <div class="island-btn" onclick="mobileOpen(6)">
                <i class="fa-solid fa-link"></i>मिलान
            </div>
            <div class="island-btn" onclick="mobileOpen(7)">
                <i class="fa-solid fa-circle-check"></i>हा/नहीं
            </div>
             <div class="island-btn" onclick="openIsland(8)">
                    <i class="fa-solid fa-link"></i>
                    मिलान
                </div>
                 <div class="island-btn" onclick="openIsland(9)">
                    <i class="fa-solid fa-link"></i>
                    संज्ञा चुनो
                </div>
        </div>
    </div>

    <script>
        const sidebarButtons = document.querySelectorAll(".topbar .island-btn");
        const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");
        const frame = document.getElementById("contentFrame");

        const pages = [
            "./exercises/hanhi.html",
            "./exercises/numbers.html",  
            "./exercises/true_false.html",
    "./exercises/mcq.html",
    "./exercises/matching.html", 
    "./exercises/FTB.html",
    "./exercises/wordPuzzel.html",
    
    "./exercises/matching1.html",
    "./exercises/mcq2.html"
];

        function openIsland(index) {
            sidebarButtons.forEach(btn => btn.classList.remove("active"));
            if (sidebarButtons[index]) sidebarButtons[index].classList.add("active");
            
            mobileButtons.forEach(btn => btn.classList.remove("active"));
            if (mobileButtons[index]) mobileButtons[index].classList.add("active");
            
            if (pages[index]) {
                frame.src = pages[index];
            }
            
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(30);
            }
        }

        function toggleMenu() {
            if (window.innerWidth > 767) return;
            const offcanvas = document.getElementById("offcanvas");
            offcanvas.classList.toggle("show");
        }

        function mobileOpen(i) {
            openIsland(i);
            toggleMenu();
        }

        window.onload = () => {
            document.querySelectorAll(".main").forEach(m => m.style.display = "flex");
            frame.src = pages[0];
            
            sidebarButtons.forEach((btn, i) => {
                setTimeout(() => {
                    btn.style.animation = "legoPop 0.3s ease-out";
                }, i * 50);
            });
        };

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (window.innerWidth > 767) {
                    document.getElementById("offcanvas").classList.remove("show");
                }
            }, 100);
        });
        
        frame.style.opacity = "0";
        frame.style.transition = "opacity 0.3s ease";
        frame.addEventListener('load', () => {
            frame.style.opacity = "1";
        });
        
        setTimeout(() => {
            frame.style.opacity = "1";
        }, 100);
    </script>

</body>
</html>
