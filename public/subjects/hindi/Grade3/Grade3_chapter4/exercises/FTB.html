<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wise Wings</title>
    <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Tiro Devanagari Hindi";
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(145deg, #fef7e0 0%, #fff3d6 100%);
            font-family: "Tiro Devanagari Hindi";
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
        }

        .quiz-container {
            width: 100%;
            height: 100vh;
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem 1.5rem;
            gap: 0.6rem;
            background: transparent;
            /* background-color: #1d5633; */
        }


        .question-header {
            text-align: center;
            margin-bottom: 0;
            width: fit-content;
            margin: 0 auto 12px auto;
            background: #fff2e9;
            color: #bc5f7a;
            padding: 8px 28px;
            border-radius: 60px;
            border: 2px solid #ffcfb5;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .question-badge {
            /* background: #fff5e6; */
            /* padding: 0.4rem 1.8rem; */
            /* border-radius: 50px;
            border: 2px solid #ffcd7a; */
            /* box-shadow: 0 6px 0 #daa44b; */
            display: inline-block;
        }

        .question-badge span {
            font-size: 20px;
            font-weight: 400;
            color: #bc5f7a;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 40px;
            font-weight: 400;
            color: #2c3e66;
            /* background: #fffaf0; */
            padding: 0.6rem 1.5rem;
            /* border-radius: 70px; */
            /* border: 3px solid #ffcf8a; */
            /* box-shadow: 0 6px 0 #dcb065; */
            /* margin: 0.3rem 0; */
            margin-top: -20px;
            text-align: center;
            max-width: 95%;
        }

        .game-layout {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 70px;
            width: 100%;
            /* flex: 1;
            max-height: 65vh; */
            flex-direction: row;
        }

        .image-section {
            /* flex: 0.8; */
            text-align: center;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .question-image {
            width: 250px;
            height: 250px;
            object-fit: contain;
            background: #fff9ef;
            border-radius: 55px;
            padding: 1rem;

            border: 4px solid #ffd194;
            box-shadow: 0 12px 18px rgba(0, 0, 0, 0.08);
        }

        .question-image-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #b87a3a;
        }

        .question-image-revealed {
            padding: 1rem;
        }

        .game-section {
            /* flex: 1; */
            min-width: unset;
            background: transparent;
        }

        .letters-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            background: transparent;
        }

        .word-group {
            display: flex;
            gap: 8px;
            background: transparent;
        }

        .word-group input {

            width: 220px;
            height: 65px;
            border: 3px solid #e6d5b8;
            border-radius: 20px;
            background: #ffffff;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #5a3e22;
            font-family: "Tiro Devanagari Hindi";
            outline: none;
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 #c9b386;
        }

        .word-group input:focus {
            border-color: #ffb347;
            box-shadow: 0 6px 0 #e09d42;
            transform: translateY(-2px);
        }

        .word-group input.correct {
            border-color: #2ecc71;
            background: #e8f8e8;
            color: #1e6b3b;
            box-shadow: 0 6px 0 #239c54;
        }

        .options-row {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .option-btn {
            background: #fde7c4;
            border: 2px solid #f3cd81;
            border-radius: 35px;
            padding: 0.8rem;
            font-size: 30px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.08s linear;
            text-align: center;
            color: #5a3e22;
            box-shadow: 0 4px 0 #d4a457;
            position: relative;
            background: #fff2de;
            font-family: "Tiro Devanagari Hindi";
            min-width: 200px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .option-btn img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            border-radius: 12px;
            flex-shrink: 0;
        }



        .option-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 11px 0 #d4a457;
            background: #fff8ea;
        }

        .option-btn.selected {
            background: #d0f0da;
            border-color: #2a8e4a;
            box-shadow: 0 8px 0 #1f6a3a;
            color: #1d5633;
        }

        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .nav-row {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 30px;
            width: 100%;
        }

        .nav-btn {
            width: 150px;
            height: 50px;
            border: none;
            font-size: 18px;
            font-weight: 500px;
            padding: 0px !important;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            font-family: inherit;
            background: #ffbc70;
            /* box-shadow: 0 8px 0 #b76a2c; */
            color: #ffffff;
            transition: 0.05s linear;
        }

        .nav-btn.prev-btn {
            background: linear-gradient(135deg, #f97316, #ea580c);
        }

        .nav-btn.next-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            /* box-shadow: 0 8px 0 #6d8f63; */
            /* color: #2f4b2d; */
        }



        .nav-btn:active {
            transform: translateY(4px);
            /* box-shadow: 0 3px 0 #b76a2c; */
        }

        .nav-btn:disabled {
            opacity: 0.5;
            transform: translateY(0);
            cursor: not-allowed;
        }

        .progress-indicator {
            display: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: #b87a3a;
            background: #fff0db;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            border: 2px solid #ffcf8a;
            /* display: inline-block; */
        }

        .emoji-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
            background: #fff6e8;
            padding: 0.8rem 2rem;
            border-radius: 80px;
            border: 5px solid #ffcd7e;
            box-shadow: 0 15px 0 #c4833a;
        }

        .emoji-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .popup-emoji {
            font-size: 3.5rem;
            line-height: 1;
            animation: popEmoji 0.4s ease;
            text-align: center;
        }

        @keyframes popEmoji {
            0% {
                transform: scale(0.2) rotate(-10deg);
                opacity: 0;
            }

            70% {
                transform: scale(1.2) rotate(2deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }

        .final-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* background: rgba(0, 0, 0, 0.5); */
            backdrop-filter: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s ease;
        }

        .final-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .final-popup-box {
            background: #fff8eb;
            border-radius: 70px;
            padding: 1.5rem 1.8rem;
            text-align: center;
            max-width: 400px;
            width: 85%;
            border: 8px solid #ffc471;
            box-shadow: 0 25px 0 #b87a38;
            animation: legoFinal 0.5s cubic-bezier(0.34, 1.2, 0.55, 1);
        }

        @keyframes legoFinal {
            0% {
                transform: scale(0.2) rotate(-5deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .medals-row {
            font-size: 1.8rem;
            letter-spacing: 6px;
            margin-bottom: 0.5rem;
        }

        .final-heading {
            font-size: 1.5rem;
            color: #e67e22;
            margin-bottom: 0.3rem;
        }

        .final-sub {
            color: #785d37;
            font-size: 0.9rem;
            margin-bottom: 0.6rem;
        }

        .final-score {
            font-weight: 700;
            font-size: 1rem;
            color: #b87a3a;
            margin: 0.4rem 0;
        }

        .final-stars {
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: #f7b32b;
            margin: 0.4rem 0;
        }

        .final-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 0.8rem;
            justify-content: center;
        }

        .final-btn {
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 7px 0 #b87232;
            transition: 0.05s linear;
            font-family: inherit;
        }

        .playagain-btn {
            background: #ffe2a4;
            color: #6b451f;
        }

        .final-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b87232;
        }

        @media screen and (max-width: 900px) {
            .quiz-container {
                padding: 0.6rem;
                gap: 0.4rem;
            }

            .game-layout {
                gap: 0.4rem;
                flex-direction: column;
                max-height: 75vh;
            }

            .question-text {
                font-size: 40px;
                padding: 0.4rem 1rem;
            }

            .question-image {
                width: 160px;
                height: 145px;
            }

            .word-group input {
                width: 180px;
                height: 55px;
                font-size: 1.2rem;
            }

            .option-btn {
                padding: 0.5rem;
                font-size: 30px;
                min-width: 100px;
            }

            .option-btn::before,
            .option-btn::after {
                font-size: 12px;
                top: -9px;
            }

            .nav-btn {
                padding: 7px 18px;
                font-size: 0.85rem;
            }
        }

        @media screen and (max-width: 650px) {
            .word-group input {
                width: 160px;
                height: 50px;
                font-size: 1.1rem;
            }

            .option-btn {
                font-size: 0.85rem;
                padding: 0.45rem 0.8rem;
                min-width: 85px;
            }

            .nav-row {
                gap: 0.8rem;
                flex-wrap: wrap;
            }
        }

        @media screen and (max-width: 480px) {
            .word-group input {
                width: 140px;
                height: 45px;
                font-size: 1rem;
            }

            .option-btn {
                font-size: 0.75rem;
                min-width: 75px;
            }

            .question-image {
                width: 130px;
                height: 120px;
            }
        }

        @media (min-width: 1300px) and (max-width: 1599px) {
            .nav-btn {
                font-size: 20px;
            }
        }

        @media (min-width: 1024px) and (max-width: 1440px) {
            .option-btn img {
                width: 100px;
                height: 80px;
            }
        }

        @media (min-width: 1440px) and (max-width: 1920px) {
            .options-row {
                margin-block: 20px;
            }

            .word-group input {
                width: 220px !important;
                height: 100px !important;
            }

            .question-image {
                width: 380px;
                height: 380px;
                object-fit: contain;
                background: #fff9ef;
                border-radius: 55px;
                padding: 1rem;
                border: 4px solid #ffd194;
                box-shadow: 0 12px 18px rgba(0, 0, 0, 0.08);
            }

            .option-btn {
                width: 220px;
                height: 180px;
            }

            .option-btn img {
                width: 130px;
                height: 100px;
            }
        }

        @media screen and (min-width: 1800px) {

            /* .quiz-container{
            background-color: #1d5633;
        } */
            .question-badge span {
                margin-bottom: 20px !important;
                font-size: 20px !important;
            }

            .question-header {
                margin-bottom: 25px;
                margin-bottom: 35px !important;
            }

            .question-text {
                margin-bottom: 20px;
            }

            .question-image {
                margin-bottom: 20px;
            }

            .letters-row {
                margin-bottom: 2rem;
            }


            .options-row {
                column-gap: 2rem;
                row-gap: 1.5rem;
            }

            .word-group input {
                height: 65px;
            }

            .nav-row {
                margin-top: 1.5rem;
                gap: 1.8rem;
            }

        }

        /* ==================== DRAG & DROP OPTIONS ==================== */
        .drop-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            min-height: 60px;
            width: 100%;
            max-width: 900px;
            margin: 10px auto;
            transition: all 0.15s ease;
        }

        .drop-zone .word-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .word-group input.drop-target {
            cursor: grab;
            border-style: dashed;
        }

        .word-group input.drop-target.drag-over {
            border-color: #e49c01;
            background: #f8f4e8;
            box-shadow: 0 6px 0 #e7a619;
        }

        .option-btn {
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .option-btn.dragging {
            opacity: 0.45;
            transform: scale(0.96);
        }

        .options-row {
            min-height: 60px;
        }

        .options-row .option-btn {
            cursor: grab;
        }

        .options-row .option-btn:active {
            cursor: grabbing;
        }

        .drag-hint {
            width: 100%;
            text-align: center;
            color: #a07845;
            font-size: 0.9rem;
            margin-bottom: 0.35rem;
            display: none;
        }

        @media screen and (max-width: 650px) {
            .drop-zone {
                min-height: 65px;
                gap: 8px;
                padding: 8px 10px;
            }

            .drag-hint {
                font-size: 0.78rem;
            }
        }
    </style>
    <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

    <div class="quiz-container">
        <div class="question-header">
            <div class="question-badge"><span>सही शब्द को खींचकर रिक्त स्थान की पूर्ति कीजिए।</span></div>
        </div>

        <div class="question-text" id="questionText">रिक्त स्थान भरें</div>

        <div class="game-layout">
            <div class="image-section">
                <img id="questionImage" class="question-image" src="" alt="प्रश्न का चित्र">
            </div>

            <div class="game-section">
                <div class="drop-zone" id="dropZone">
                    <div class="drag-hint">सही शब्द को यहाँ खींचकर छोड़ें</div>
                    <div class="letters-row" id="lettersRow"></div>
                </div>
                <div class="options-row" id="optionsRow"></div>
            </div>
        </div>

        <div class="nav-row">
            <button class="nav-btn prev-btn" id="prevBtn">◀ पिछला</button>
            <!-- <button class="nav-btn submit-btn" id="submitBtn" disabled>✔ सबमिट</button> -->
            <button class="nav-btn next-btn" id="nextBtn" disabled>अगला ▶</button>
        </div>
        <div class="progress-indicator" id="progressIndicator">प्रश्न 1/5</div>
    </div>

    <div id="emojiPopup" class="emoji-popup">
        <div class="popup-emoji" id="popupEmoji">🎉</div>
    </div>

    <div id="finalPopup" class="final-overlay">
        <div class="final-popup-box">
            <div class="medals-row">🏅 🥇 🏅</div>
            <h2 class="final-heading">बधाई हो!</h2>
            <p class="final-sub">आपने क्विज सफलतापूर्वक पूरी की!</p>
            <div class="final-score" id="finalScoreText">स्कोर: 5/5</div>
            <div class="final-stars" id="finalStars">⭐⭐⭐</div>
            <div class="final-buttons">
                <button class="final-btn playagain-btn" id="playAgainFinalBtn">🔄 फिर से खेलें</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== QUIZ DATA WITH ALWAYS-VISIBLE IMAGES ====================
        const questions = [
            {
                q: "Q1. एक घने ________ में एक बड़ा-सा पेड़ था।",
                a: "जंगल",
                a_mobile: "जंगल",
                img: "../assets/images/tree12.png"
            },
            {
                q: "Q2. बहेलिया वहाँ पर अपना ________ बिछा देता है।",
                a: "जाल",
                a_mobile: "जाल",
                img: "../assets/images/hunter.png"
            },
            {
                q: "Q3. एक कबूतरों का ________ आकर विश्राम करने लगता है।",
                a: "झुंड",
                a_mobile: "झुंड",
                img: "../assets/images/slept.png"
            },
            {
                q: "Q4. कबूतर ________ होने के लिए ________ सोचने लगे।",

                a: ["आज़ाद", "तरकीब"],

                a_mobile: ["आज़ाद", "तरकीब"],

                img: "../assets/images/question4.png"
            },
            {
                q: "Q5. कबूतरों ने चूहे को बहुत-बहुत ________ दिया।",
                a: "धन्यवाद",
                a_mobile: "धन्यवाद",
                img: "../assets/images/thanks.png"
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let answered = Array(questions.length).fill(false);
        // Keep one fixed set/order of options for each question.
        let questionOptions = Array(questions.length).fill(null);
        let audioCtx = null;

        const questionText = document.getElementById("questionText");
        const questionImage = document.getElementById("questionImage");
        const lettersRow = document.getElementById("lettersRow");
        const dropZone = document.getElementById("dropZone");
        const optionsRowDiv = document.getElementById("optionsRow");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        // const submitBtn = document.getElementById("submitBtn");
        const progressIndicator = document.getElementById("progressIndicator");
        const emojiPopup = document.getElementById("emojiPopup");
        const popupEmoji = document.getElementById("popupEmoji");
        const finalPopup = document.getElementById("finalPopup");
        const finalScoreText = document.getElementById("finalScoreText");
        const finalStars = document.getElementById("finalStars");
        const playAgainFinalBtn = document.getElementById("playAgainFinalBtn");

        let popupTimer = null;

        function playCorrectSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 880;
                gain.gain.value = 0.2;
                osc.type = 'sine';
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.45);
                osc.stop(audioCtx.currentTime + 0.45);
                audioCtx.resume().catch(e => null);
            } catch (e) { }
        }

        function playWrongSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 480;
                gain.gain.value = 0.2;
                osc.type = 'triangle';
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
                osc.stop(audioCtx.currentTime + 0.4);
                audioCtx.resume().catch(e => null);
            } catch (e) { }
        }

        function showEmoji(isCorrect) {

            if (popupTimer) clearTimeout(popupTimer);

            if (isCorrect) {

                popupEmoji.textContent = "🥳";
                playCorrectSound();



                if (typeof confetti === 'function') {

                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#ffb347', '#2ecc71', '#f1c40f']
                    });

                }

            } else {

                popupEmoji.textContent = "😢";

                playWrongSound();
            }

            emojiPopup.classList.add("active");

            popupTimer = setTimeout(() => {

                emojiPopup.classList.remove("active");

            }, 900);

        }
        function fireBigConfetti() {

            if (typeof confetti === 'function') {

                confetti({
                    particleCount: 250,
                    spread: 120,
                    origin: { y: 0.5 },
                    startVelocity: 28
                });

                setTimeout(() => {

                    confetti({
                        particleCount: 140,
                        spread: 130,
                        origin: { y: 0.4, x: 0.2 }
                    });

                    confetti({
                        particleCount: 140,
                        spread: 130,
                        origin: { y: 0.4, x: 0.8 }
                    });

                }, 150);

            }

        }

        function showFinalPopup() {
            finalScoreText.textContent = `स्कोर: ${score}/${questions.length}`;
            const starCount = score;
            finalStars.textContent = "⭐".repeat(starCount) + (starCount < questions.length ? "☆".repeat(questions.length - starCount) : "");
            finalPopup.classList.add("active");
            fireBigConfetti();
        }

        function isMobile() { return window.innerWidth <= 768; }

        function getCurrentAnswer() {
            const q = questions[currentIndex];
            return (isMobile() && q.a_mobile) ? q.a_mobile : q.a;
        }

        function getAllAnswers() {
            return questions.map(q => (isMobile() && q.a_mobile) ? q.a_mobile : q.a);
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateOptions(correctAns) {
            const correctArray = Array.isArray(correctAns) ? correctAns : [correctAns];

            // Keep exactly 3 options for every question.
            const allAnswers = [...new Set(getAllAnswers().flat())];
            const distractors = allAnswers.filter(word => !correctArray.includes(word));

            const optionCount = 3;
            const neededDistractors = Math.max(0, optionCount - correctArray.length);
            const selectedDistractors = shuffleArray(distractors).slice(0, neededDistractors);

            return shuffleArray([...correctArray, ...selectedDistractors]).slice(0, optionCount);
        }

        function getOptionImage(opt) {
            const optionImages = {
                "जंगल": "../assets/images/jungle.png",
                "जाल": "../assets/images/net.png",
                "झुंड": "../assets/images/friends.png",
                "आज़ाद": "../assets/images/ajad.png",
                "तरकीब": "../assets/images/thinking.png",
                "धन्यवाद": "../assets/images/bird-bowing.png"
            };

            return optionImages[opt] || "../assets/images/friends.png";
        }

        function setDropValue(index, opt, sourceBtn) {
            if (answered[currentIndex]) return;

            const inputs = lettersRow.querySelectorAll(".word-group input");
            const correctAns = getCurrentAnswer();
            const answers = Array.isArray(correctAns) ? correctAns : [correctAns];

            if (!inputs[index]) return;

            // Only allow a drop into an empty/current target.
            inputs[index].value = opt;
            inputs[index].dataset.answer = opt;

            inputs[index].classList.add("selected-answer");
            if (sourceBtn) sourceBtn.classList.add("selected");

            // Validate immediately, as in the original quiz.
            if (opt === answers[index]) {
                inputs[index].classList.add("correct");
                inputs[index].readOnly = true;
                inputs[index].dataset.locked = "true";

                if (sourceBtn) sourceBtn.classList.add("correct-option");
                sourceBtn && (sourceBtn.disabled = true);

                showEmoji(true);
            } else {
                showEmoji(false);

                // Wrong answer is returned to the option list.
                setTimeout(() => {
                    inputs[index].value = "";
                    inputs[index].classList.remove("selected-answer");
                    inputs[index].dataset.answer = "";
                    if (sourceBtn) sourceBtn.classList.remove("selected");
                }, 180);
                return;
            }

            const allCorrect = [...inputs].every(
                (inp, i) => inp.value.trim() === answers[i]
            );

            if (allCorrect) {
                answered[currentIndex] = true;
                score++;
                nextBtn.disabled = false;

                optionsRowDiv.querySelectorAll(".option-btn").forEach(btn => {
                    btn.disabled = true;
                    btn.draggable = false;
                });

                if (currentIndex === questions.length - 1) {
                    setTimeout(() => showFinalPopup(), 500);
                }
            }
        }

        function attachDragHandlers(btn) {
            btn.draggable = true;

            btn.addEventListener("dragstart", (e) => {
                if (btn.disabled || answered[currentIndex]) {
                    e.preventDefault();
                    return;
                }

                btn.classList.add("dragging");
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData("text/plain", btn.textContent.trim());
                e.dataTransfer.setData("application/x-option-index", btn.dataset.optionIndex);

                // Use a small text-only drag preview instead of dragging the whole option button/image.
                const dragGhost = document.createElement("div");
                dragGhost.textContent = btn.textContent.trim();
                dragGhost.style.cssText = `
                    position: fixed;
                    top: -1000px;
                    left: -1000px;
                    width: max-content;
                    max-width: 260px;
                    padding: 12px 22px;
                    background: #fff2de;
                    border: 2px solid #f3cd81;
                    border-radius: 18px;
                    color: #5a3e22;
                    font-family: "Tiro Devanagari Hindi";
                    font-size: 30px;
                    font-weight: 400;
                    line-height: 1.2;
                    white-space: nowrap;
                    box-shadow: 0 3px 0 #d4a457;
                    pointer-events: none;
                    z-index: 99999;
                `;
                document.body.appendChild(dragGhost);
                e.dataTransfer.setDragImage(dragGhost, dragGhost.offsetWidth / 2, dragGhost.offsetHeight / 2);

                setTimeout(() => dragGhost.remove(), 0);
            });

            btn.addEventListener("dragend", () => {
                btn.classList.remove("dragging");
                dropZone.classList.remove("drag-over");
                lettersRow.querySelectorAll("input").forEach(input => {
                    input.classList.remove("drag-over");
                });
            });
        }

        function setupDropTarget(input, index) {
            input.classList.add("drop-target");

            input.addEventListener("dragover", (e) => {
                if (answered[currentIndex] || input.dataset.locked === "true") return;
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                input.classList.add("drag-over");
            });

            input.addEventListener("dragleave", () => {
                input.classList.remove("drag-over");
            });

            input.addEventListener("drop", (e) => {
                if (answered[currentIndex] || input.dataset.locked === "true") return;
                e.preventDefault();

                const text = e.dataTransfer.getData("text/plain");
                const optionIndex = e.dataTransfer.getData("application/x-option-index");
                const btn = optionsRowDiv.querySelector(
                    `.option-btn[data-option-index="${optionIndex}"]`
                );

                input.classList.remove("drag-over");

                if (text && btn && !btn.disabled) {
                    setDropValue(index, text, btn);
                }
            });
        }

        function setupDropZone() {
            dropZone.addEventListener("dragover", (e) => {
                if (answered[currentIndex]) return;
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                dropZone.classList.add("drag-over");
            });

            dropZone.addEventListener("dragleave", (e) => {
                if (!dropZone.contains(e.relatedTarget)) {
                    dropZone.classList.remove("drag-over");
                }
            });

            dropZone.addEventListener("drop", (e) => {
                if (answered[currentIndex]) return;
                e.preventDefault();
                dropZone.classList.remove("drag-over");

                const text = e.dataTransfer.getData("text/plain");
                const optionIndex = e.dataTransfer.getData("application/x-option-index");
                const btn = optionsRowDiv.querySelector(
                    `.option-btn[data-option-index="${optionIndex}"]`
                );

                if (!text || !btn || btn.disabled) return;

                const inputs = lettersRow.querySelectorAll(".word-group input");
                const emptyIndex = [...inputs].findIndex(
                    input => !input.value.trim() && input.dataset.locked !== "true"
                );

                if (emptyIndex !== -1) {
                    setDropValue(emptyIndex, text, btn);
                }
            });
        }

        function renderOptions() {
            optionsRowDiv.innerHTML = "";

            // Generate options only the first time this question is shown.
            // On returning to the question, reuse the exact same options/order.
            if (!questionOptions[currentIndex]) {
                const correctAns = getCurrentAnswer();
                questionOptions[currentIndex] = generateOptions(correctAns);
            }

            const options = questionOptions[currentIndex];

            options.forEach((opt, index) => {
                const btn = document.createElement("button");

                btn.className = "option-btn";
                btn.type = "button";

                const optionImage = document.createElement("img");
                optionImage.src = getOptionImage(opt);
                optionImage.alt = "";
                optionImage.draggable = false;

                const optionText = document.createElement("span");
                optionText.textContent = opt;

                btn.appendChild(optionImage);
                btn.appendChild(optionText);

                btn.dataset.optionIndex = index;
                btn.setAttribute("aria-label", `खींचकर छोड़ें: ${opt}`);

                attachDragHandlers(btn);

                // Keep click support as a fallback for devices where drag/drop is awkward.
                // btn.onclick = () => {
                //     if (answered[currentIndex] || btn.disabled) return;

                //     const inputs = lettersRow.querySelectorAll(".word-group input");
                //     const emptyIndex = [...inputs].findIndex(
                //         input => !input.value.trim() && input.dataset.locked !== "true"
                //     );

                //     if (emptyIndex !== -1) {
                //         setDropValue(emptyIndex, opt, btn);
                //     }
                // };

                optionsRowDiv.appendChild(btn);
            });
        }

        function loadQuestion() {

            const q =
                questions[currentIndex];

            questionText.textContent =
                q.q;

            // Always show the question image immediately.
            questionImage.src = q.img;
            questionImage.alt = `प्रश्न ${currentIndex + 1} का चित्र`;

            progressIndicator.textContent =
                `प्रश्न ${currentIndex + 1}/${questions.length}`;

            const correctAns =
                getCurrentAnswer();

            lettersRow.innerHTML = "";
            // Clear options from the previous question before rendering this one.
            optionsRowDiv.innerHTML = "";

            /* CREATE INPUTS */

            const answers =
                Array.isArray(correctAns)
                    ? correctAns
                    : [correctAns];

            answers.forEach((ans, index) => {

                const wordGroup =
                    document.createElement(
                        "div"
                    );

                wordGroup.className =
                    "word-group";

                const input =
                    document.createElement(
                        "input"
                    );

                input.type = "text";

                input.maxLength = 20;

                input.readOnly = true;

                input.placeholder = "????";

                /* SHOW OLD ANSWER */

                if (answered[currentIndex]) {

                    input.value = ans;

                    input.classList.add(
                        "correct"
                    );

                }

                setupDropTarget(input, index);

                wordGroup.appendChild(input);
                lettersRow.appendChild(wordGroup);

            });

            /* ANSWERED STATE */

            // Render this question's own saved options first.
            renderOptions();

            if (answered[currentIndex]) {

                nextBtn.disabled = false;

                optionsRowDiv.querySelectorAll(".option-btn").forEach(btn => {
                    btn.disabled = true;
                    btn.draggable = false;
                });

            } else {

                nextBtn.disabled = true;

            }

            prevBtn.disabled =
                (currentIndex === 0);

        }
        function checkAnswer() {

            if (answered[currentIndex])
                return;

            const inputs =
                lettersRow.querySelectorAll(
                    ".word-group input"
                );

            const correctAns =
                getCurrentAnswer();

            const answers =
                Array.isArray(correctAns)
                    ? correctAns
                    : [correctAns];

            let allCorrect = true;

            inputs.forEach((input, index) => {

                if (
                    input.value.trim() !==
                    answers[index]
                ) {

                    allCorrect = false;

                }

            });

            if (allCorrect) {

                answered[currentIndex] = true;

                score++;

                inputs.forEach(input => {

                    input.classList.add(
                        "correct"
                    );

                    input.readOnly = true;

                });

                nextBtn.disabled = false;

                showEmoji(true);

                optionsRowDiv
                    .querySelectorAll(
                        ".option-btn"
                    )
                    .forEach(btn => {

                        btn.disabled = true;

                    });

                if (
                    currentIndex ===
                    questions.length - 1
                ) {

                    setTimeout(() => {

                        showFinalPopup();

                    }, 500);

                }

            } else {

                showEmoji(false);

                inputs.forEach(input => {

                    input.value = "";

                });

                optionsRowDiv
                    .querySelectorAll(
                        ".option-btn"
                    )
                    .forEach(btn => {

                        btn.disabled = false;

                        btn.classList.remove(
                            "selected"
                        );

                    });

            }

        }

        function goPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function goNext() {
            if (currentIndex < questions.length - 1 && answered[currentIndex]) {
                currentIndex++;
                loadQuestion();
            }
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            answered = Array(questions.length).fill(false);
            questionOptions = Array(questions.length).fill(null);
            finalPopup.classList.remove("active");
            if (popupTimer) clearTimeout(popupTimer);
            emojiPopup.classList.remove("active");
            loadQuestion();
        }

        setupDropZone();

        // submitBtn.addEventListener("click", checkAnswer);
        prevBtn.addEventListener("click", goPrev);
        nextBtn.addEventListener("click", goNext);
        playAgainFinalBtn.addEventListener("click", restartQuiz);

        function initAudioOnce() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const src = audioCtx.createBufferSource();
                src.buffer = buffer;
                src.connect(audioCtx.destination);
                src.start();
            } catch (e) { }
        }
        document.body.addEventListener("click", initAudioOnce, { once: true });

        loadQuestion();
    </script>
</body>
