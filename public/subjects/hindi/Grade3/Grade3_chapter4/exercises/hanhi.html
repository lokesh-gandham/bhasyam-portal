<!DOCTYPE html>
<html lang="hi-IN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wise Wings</title>
    <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            /* background: linear-gradient(145deg, #f0f9ff 0%, #e6f2f5 100%); */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Tiro Devanagari Hindi";
            padding: 20px;
        }

        .main {
            width: 100%;
            height: auto;
            max-width: 1300px;
            /* height: 100%; */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            text-align: center;
            flex-shrink: 0;
            margin-bottom: 20px;
        }

        .main-title {
            font-weight: 400;
            color: #bc5f7a;
            background: #fff2f0;
            padding: 10px 15px;
            font-size: 30px;
            width: 50%;
            margin: auto;
            border-radius: 60px;
            text-align: center;
            border: 1px solid #ffcdd9;
            width: fit-content;

        }

        .stats-row {
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 5px;
        }

        .stat-badge {
            display: none;
            background: #fff2f0;
            border: 1px solid #ffcdd9;
            border-radius: 40px;
            padding: 5px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #bc5f7a;
        }

        /* 3 QUESTIONS IN ONE ROW - 3 COLUMNS, 1 ROW - NO SCROLL */
        .questions-grid {
            display: grid;
            grid-template-columns: 1fr;
            width: 60%;
            margin-inline: auto;
            gap: 20px;
            flex: 1;
            min-height: 0;
            align-content: center;
            justify-content: center;
        }

        /* Question card */
        .q-item {
            background: rgba(255, 255, 255, 0.94);
            border-radius: 28px;
            padding: 16px 14px 18px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #ffe0c0;
            height: 100%;
        }

        /* Image */
        .q-image {
            flex-shrink: 0;
            margin-bottom: 10px;
        }

        .q-image img {
            width: 200px;
            height: 180px;
            object-fit: contain;
            background: #fef8e7;
            border-radius: 25px;
            /* padding: 10px; */
            filter: drop-shadow(3px 5px 10px rgba(0, 0, 0, 0.1));
        }

        /* Question text */
        .q-prompt {
            font-size: 16px;
            font-weight: 500;
            color: #1e4a5f;
            background: #fff3df;
            padding: 6px 10px;
            border-radius: 40px;
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .highlight {
            background: #ffe0b0;
            display: inline-block;
            padding: 2px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
        }

        /* LEGO OPTIONS */
        .options-lego {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            width: 100%;
        }

        .lego-btn {
            width: 120px;
            height: 80px;
            padding: 15px;
            border: none;
            border-radius: 18px;
            font-size: 30px;
            font-weight: 400;
            color: #2d3748;
            cursor: pointer;
            transition: all 0.1s ease;
            background: #fde68a;
            box-shadow: 0 4px 0 #ca8a04;
            position: relative;
            font-family: "Livvic", monospace;
        }

        .lego-btn::before {
            content: "";
            position: absolute;
            top: -4px;
            left: 20%;
            width: 60%;
            height: 7px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 20px 20px 0 0;
        }

        .lego-btn:nth-child(1) {
            background: #a7f3d0;
            box-shadow: 0 4px 0 #059669;
        }

        .lego-btn:nth-child(2) {
            background: #fed7aa;
            box-shadow: 0 4px 0 #ea580c;
        }

        .lego-btn:nth-child(3) {
            background: #bfdbfe;
            box-shadow: 0 4px 0 #2563eb;
        }

        .lego-btn:nth-child(4) {
            background: #fbcfe8;
            box-shadow: 0 4px 0 #db2777;
        }

        .lego-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2);
        }

        .lego-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
        }

        .correct-lego {
            background: #22c55e !important;
            box-shadow: 0 2px 0 #15803d !important;
            color: white;
            transform: translateY(2px);
            pointer-events: none;
        }

        .wrong-lego {
            background: #ef4444 !important;
            box-shadow: 0 2px 0 #b91c1c !important;
            color: white;
            animation: shake 0.25s ease;
            transform: translateY(2px);
        }

        .locked-lego {
            background: #22c55e !important;
            box-shadow: 0 2px 0 #15803d !important;
            color: white;
            cursor: default;
            transform: translateY(2px);
            pointer-events: none;
            opacity: 0.95;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        /* Navigation buttons */
        .nav-footer {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-top: 20px;
            flex-shrink: 0;
            padding-bottom: 5px;
        }

        .nav-btn {
            /* min-width: 130px; */
            width: 150px;
            height: 50px;
            padding: 0px !important;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .nav-btn.prev {
            background: linear-gradient(135deg, #f97316, #ea580c);
        }

        .nav-btn.next {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.02);
        }

        .nav-btn:disabled {
            opacity: 0.45;
            transform: none;
            cursor: not-allowed;
        }

        /* NEW EMOJI POPUP */

        .emoji-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            visibility: hidden;
            z-index: 3000;
            background: #fff6e7;
            border: 5px solid #ffc977;
            border-radius: 70px;
            padding: 12px 35px;
            box-shadow: 0 10px 0 #cb8a3d;
            transition: all 0.22s cubic-bezier(0.34, 1.4, 0.64, 1);
        }

        .emoji-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .popup-emoji {
            font-size: 50px;
            animation: emojiPop 0.35s ease;
        }

        @keyframes emojiPop {

            0% {
                transform: scale(0.2) rotate(-8deg);
                opacity: 0;
            }

            70% {
                transform: scale(1.1) rotate(2deg);
            }

            100% {
                transform: scale(1) rotate(0);
            }
        }


        .final-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            backdrop-filter: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s ease;
        }

        .final-overlay.active {
            visibility: visible !important;
            opacity: 1 !important;
            display: flex !important;
        }

        .final-popup-box {
            background: #fff8eb;
            border-radius: 70px;
            padding: 1.5rem 1.8rem;
            text-align: center;
            max-width: 400px;
            width: 85%;
            border: 8px solid #ffc471;
            box-shadow: 0 25px 0 #b87a38;
            animation: legoFinal 0.5s cubic-bezier(0.34, 1.2, 0.55, 1);
            position: relative;
            z-index: 9999;
        }

        @keyframes legoFinal {

            0% {
                transform: scale(0.2) rotate(-5deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .medals-row {
            font-size: 1.8rem;
            letter-spacing: 6px;
            margin-bottom: 0.5rem;
        }

        .final-heading {
            font-size: 1.5rem;
            color: #e67e22;
            margin-bottom: 0.3rem;
        }

        .final-sub {
            color: #785d37;
            font-size: 1rem;
            margin-bottom: 0.7rem;
        }

        .final-stars {
            font-size: 1.7rem;
            letter-spacing: 5px;
            color: #f7b32b;
            margin: 0.5rem 0;
        }

        .final-buttons {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .final-btn {
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 7px 0 #b87232;
            transition: 0.05s linear;
            font-family: inherit;
        }

        .playagain-btn {
            background: #ffe2a4;
            color: #6b451f;
        }

        .final-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b87232;
        }

        /* ==================== LAPTOP SCREENS (UP TO 1366px) - KEEP AS IS ==================== */
        /* This is your current working laptop layout - NO CHANGES */

        /* ==================== LARGE DESKTOP SCREENS (>1366px) - SCALE UP ==================== */
        @media (min-width: 1367px) and (max-width: 1920px) {
            .main {
                max-width: 1400px;
            }

            .questions-grid {
                gap: 28px;
            }

            .q-item {
                padding: 30px 30px 40px;
                border-radius: 36px;
            }

            .q-image img {
                width: 280px;
                height: 230px;
                border-radius: 32px;
                /* padding: 14px; */
            }

            .q-prompt {
                font-size: 20px;
                padding: 10px 16px;
                margin-bottom: 18px;
            }

            .highlight {
                font-size: 18px;
                padding: 4px 18px;
            }

            .lego-btn {
                width: 200px;
                height: 110px;
                padding: 18px;
                font-size: 30px;
                border-radius: 22px;
                margin-block: 30px;
            }

            .lego-btn::before {
                height: 9px;
                top: -5px;
            }

            .nav-btn {
                padding: 12px 28px;
                font-size: 20px;
            }

            .stat-badge {
                font-size: 16px;
                padding: 6px 20px;
            }

            .main-title {
                font-size: 30px
            }
        }




        @media (min-width: 1900px) {
            .main {
                max-width: 1600px;
            }

            .questions-grid {
                gap: 35px;
            }

            .q-item {
                padding: 30px 25px 32px;
                border-radius: 42px;
            }

            .q-image img {
                width: 280px;
                height: 250px;
                border-radius: 38px;
                /* padding: 18px; */
            }

            .q-prompt {
                font-size: 24px;
                padding: 12px 20px;
                margin-bottom: 22px;
            }

            .highlight {
                font-size: 22px;
                padding: 6px 22px;
            }

            .lego-btn {
                min-width: 110px;
                padding: 12px 24px;
                font-size: 22px;
                border-radius: 26px;
            }

            .lego-btn::before {
                height: 10px;
                top: -6px;
            }

            .nav-btn {
                padding: 14px 32px;
                font-size: 22px;
            }

            .stat-badge {
                font-size: 18px;
                padding: 8px 28px;
            }

            .main-title {
                font-size: 30px;
            }


        }

        /* Small screens - maintain 3 columns but smaller */
        @media (max-width: 800px) {
            body {
                padding: 12px;
            }

            .questions-grid {
                gap: 12px;
            }

            .q-image img {
                width: 75px;
                height: 70px;
            }

            .q-prompt {
                font-size: 13px;
            }

            .highlight {
                font-size: 12px;
                padding: 2px 8px;
            }

            .lego-btn {
                font-size: 12px;
                min-width: 55px;
                padding: 5px 8px;
            }

            .nav-btn {
                min-width: 100px;
                padding: 8px 16px;
                font-size: 14px;
            }

            .stat-badge {
                font-size: 11px;
                padding: 3px 12px;
            }
        }

        @media (max-width: 650px) {
            .q-image img {
                width: 60px;
                height: 55px;
            }

            .lego-btn {
                min-width: 48px;
                font-size: 11px;
                padding: 4px 6px;
            }

            .q-prompt {
                font-size: 11px;
            }

            .questions-grid {
                gap: 8px;
            }
        }
    </style>

</head>

<body>

    <div class="main">
        <div class="header">
            <div class="main-title">अंक के सही हिन्दी नाम पर क्लिक कीजिए।</div>
            <div class="stats-row">
                <div class="stat-badge" id="pageIndicator">पेज 1 / 5</div>
                <div class="stat-badge" id="scoreBadge">✅ सही: 0/15</div>
            </div>
        </div>

        <div id="questionsContainer" class="questions-grid"></div>

        <div class="nav-footer">
            <button class="nav-btn prev" id="prevPageBtn">◀ पिछला</button>
            <button class="nav-btn next" id="nextPageBtn">अगला ▶</button>
        </div>
    </div>
    <!-- EMOJI POPUP -->
    <div id="emojiPopup" class="emoji-popup">

        <div class="popup-emoji" id="popupEmoji">
            🎉
        </div>

    </div>

    <!-- POPUPS -->
    <div id="finalPopup" class="final-overlay">

        <div class="final-popup-box">

            <div class="medals-row">
                🏅 🥇 🏅
            </div>

            <h2 class="final-heading">
                बधाई हो!
            </h2>

            <p class="final-sub">
                आपने सभी प्रश्न सही किए!
            </p>

            <div class="final-stars">
                ⭐⭐⭐⭐⭐
            </div>

            <div class="final-buttons">

                <button class="final-btn playagain-btn" id="playAgainFinalBtn">
                    🔄 फिर से खेलें
                </button>

            </div>

        </div>

    </div>



    <script>
        // ======================== 15 QUESTIONS (Number to Hindi Word / Word to Number) ========================
        const questionsData = [
            { num: "2", correct: "दो", type: "num2word", img: "../assets/images/two.png" },
            { num: "12", correct: "बारह", type: "num2word", img: "../assets/images/12.png" },
            { num: "4", correct: "चार", type: "num2word", img: "../assets/images/4.png" },
            { num: "15", correct: "पंद्रह", type: "num2word", img: "../assets/images/15.png" },
            { num: "10", correct: "दस", type: "num2word", img: "../assets/images/10.png" },
            { num: "7", correct: "सात", type: "num2word", img: "../assets/images/7.png" },
            { num: "13", correct: "तेरह", type: "num2word", img: "../assets/images/13.png" },
            { num: "17", correct: "सत्रह", type: "num2word", img: "../assets/images/17.png" },
            { num: "19", correct: "उन्नीस", type: "num2word", img: "../assets/images/19.png" },

        ];

        const TOTAL_QS = questionsData.length;
        const ITEMS_PER_PAGE = 1;  // 3 questions per page (3 columns, 1 row)
        const totalPages = Math.ceil(TOTAL_QS / ITEMS_PER_PAGE);
        let currentPage = 0;

        let answersState = Array(TOTAL_QS).fill(false);
        let selectedAnswerValue = Array(TOTAL_QS).fill("");
        let totalScore = 0;

        const container = document.getElementById("questionsContainer");
        const prevBtn = document.getElementById("prevPageBtn");
        const nextBtn = document.getElementById("nextPageBtn");
        const pageIndicatorSpan = document.getElementById("pageIndicator");
        const scoreBadgeSpan = document.getElementById("scoreBadge");
        const emojiPopupDiv = document.getElementById("emojiPopup");
        const popupEmojiSpan = document.getElementById("popupEmoji");
        const finalOverlay = document.getElementById("finalPopup");

        //  const correctAudio = document.getElementById("correctSound");
        // const wrongAudio = document.getElementById("wrongSound");

        // function playCorrect() {

        //     correctAudio.pause();

        //     correctAudio.currentTime = 0;

        //     const playPromise = correctAudio.play();

        //     if (playPromise !== undefined) {
        //         playPromise.catch(() => {});
        //     }
        // }

        // function playWrong() {

        //     wrongAudio.pause();

        //     wrongAudio.currentTime = 0;

        //     const playPromise = wrongAudio.play();

        //     if (playPromise !== undefined) {
        //         playPromise.catch(() => {});
        //     }
        // }
        let audioCtx = null;

        function playCorrect() {

            try {

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                audioCtx.resume();

                const osc = audioCtx.createOscillator();

                const gain = audioCtx.createGain();

                osc.connect(gain);

                gain.connect(audioCtx.destination);

                osc.frequency.value = 880;

                gain.gain.value = 0.2;

                osc.type = "sine";

                osc.start();

                gain.gain.exponentialRampToValueAtTime(
                    0.00001,
                    audioCtx.currentTime + 0.45
                );

                osc.stop(audioCtx.currentTime + 0.45);

            } catch (e) { }

        }

        function playWrong() {

            try {

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                audioCtx.resume();

                const osc = audioCtx.createOscillator();

                const gain = audioCtx.createGain();

                osc.connect(gain);

                gain.connect(audioCtx.destination);

                osc.frequency.value = 480;

                gain.gain.value = 0.2;

                osc.type = "triangle";

                osc.start();

                gain.gain.exponentialRampToValueAtTime(
                    0.00001,
                    audioCtx.currentTime + 0.4
                );

                osc.stop(audioCtx.currentTime + 0.4);

            } catch (e) { }

        }

        function initAudioOnce() {

            if (audioCtx) return;

            try {

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                const buffer = audioCtx.createBuffer(1, 1, 22050);

                const src = audioCtx.createBufferSource();

                src.buffer = buffer;

                src.connect(audioCtx.destination);

                src.start();

            } catch (e) { }

        }
        function speakCorrect() {
            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance("सही");
            utterance.lang = "hi-IN";
            utterance.rate = 0.9;
            utterance.pitch = 1.2;
            utterance.volume = 1;

            speechSynthesis.speak(utterance);
        }

        function speakWrong() {
            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance("गलत");
            utterance.lang = "hi-IN";
            utterance.rate = 0.9;
            utterance.pitch = 0.9;
            utterance.volume = 1;

            speechSynthesis.speak(utterance);
        }

        document.body.addEventListener(
            "click",
            initAudioOnce,
            { once: true }
        );
        function showEmoji(isCorrect) {
            popupEmojiSpan.textContent = isCorrect ? "🥳" : "😢";
            emojiPopupDiv.classList.add("active");
            setTimeout(() => emojiPopupDiv.classList.remove("active"), 900);
            if (isCorrect) {
                playCorrect();

                confetti({ particleCount: 45, spread: 55, origin: { y: 0.6 }, colors: ['#ffd966', '#4caf50'] });
            } else {
                playWrong();

            }
        }

        function showFinalPopup() {
            finalOverlay.classList.add("active");

            confetti({ particleCount: 200, spread: 110, origin: { y: 0.5 }, startVelocity: 20 });
            setTimeout(() => {
                confetti({ particleCount: 100, spread: 130, origin: { x: 0.2, y: 0.5 } });
                confetti({ particleCount: 100, spread: 130, origin: { x: 0.8, y: 0.5 } });
            }, 150);
        }

        function updateGlobalScoreUI() {
            scoreBadgeSpan.textContent = `✅ सही: ${totalScore}/${TOTAL_QS}`;
            if (totalScore === TOTAL_QS) {
                setTimeout(() => showFinalPopup(), 400);
            }
        }

        // Generate 3 options (2 distractors + correct)
        function generateOptionsForQuestion(q) {
            const correctAns = q.correct;
            if (q.type === "num2word") {
                const allWords = ["दो", "बारह", "चार", "पंद्रह", "दस", "सात", "तेरह", "सत्रह", "उन्नीस"];
                const others = allWords.filter(w => w !== correctAns);
                const shuffled = [...others].sort(() => Math.random() - 0.5);
                let dists = shuffled.slice(0, 2);
                if (dists.length < 2) dists = ["दस", "सात"];
                let opts = [...dists, correctAns];
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return opts;
            } else {
                const allDigits = ["3", "9", "11", "16", "18", "20"];
                const others = allDigits.filter(d => d !== correctAns);
                const shuffled = [...others].sort(() => Math.random() - 0.5);
                let dists = shuffled.slice(0, 2);
                if (dists.length < 2) dists = ["5", "8"];
                let opts = [...dists, correctAns];
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return opts;
            }
        }

        function renderCurrentPage() {
            const start = currentPage * ITEMS_PER_PAGE;
            const end = Math.min(start + ITEMS_PER_PAGE, TOTAL_QS);
            const pageQuestions = questionsData.slice(start, end);
            container.innerHTML = "";

            for (let i = 0; i < pageQuestions.length; i++) {
                const globalIdx = start + i;
                const q = pageQuestions[i];
                const isAnswered = answersState[globalIdx];
                const selectedVal = selectedAnswerValue[globalIdx];

                const qItem = document.createElement("div");
                qItem.className = "q-item";

                // Image
                const imgDiv = document.createElement("div");
                imgDiv.className = "q-image";
                const img = document.createElement("img");
                img.src = q.img;
                img.alt = "चित्र";
                img.onerror = () => { img.src = "https://placehold.co/120x110/f9e0bb/8b5a2b?text=🔢"; };
                imgDiv.appendChild(img);
                qItem.appendChild(imgDiv);

                // Question text
                // const promptDiv = document.createElement("div");
                // promptDiv.className = "q-prompt";
                // if (q.type === "num2word") {
                //     promptDiv.innerHTML = `🔢 <span class="highlight">${q.num}</span> → शब्द में लिखिए`;
                // } else {
                //     promptDiv.innerHTML = `📖 <span class="highlight">${q.num}</span> → अंक में लिखिए`;
                // }
                // qItem.appendChild(promptDiv);

                // Options
                const optionsDiv = document.createElement("div");
                optionsDiv.className = "options-lego";

                if (isAnswered) {
                    const lockedBtn = document.createElement("button");
                    lockedBtn.className = "lego-btn locked-lego";
                    lockedBtn.textContent = selectedVal;
                    lockedBtn.disabled = true;
                    optionsDiv.appendChild(lockedBtn);
                } else {
                    const opts = generateOptionsForQuestion(q);
                    opts.forEach(opt => {
                        const btn = document.createElement("button");
                        btn.className = "lego-btn";
                        btn.textContent = opt;
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            if (answersState[globalIdx]) return;
                            if (opt === q.correct) {
                                answersState[globalIdx] = true;
                                selectedAnswerValue[globalIdx] = opt;
                                totalScore++;
                                updateGlobalScoreUI();
                                renderCurrentPage();
                                showEmoji(true);
                                if (totalScore === TOTAL_QS) {
                                    setTimeout(() => showFinalPopup(), 500);
                                }
                            } else {
                                btn.classList.add("wrong-lego");
                                showEmoji(false);
                                setTimeout(() => {
                                    if (!answersState[globalIdx]) {
                                        renderCurrentPage();
                                    }
                                }, 700);
                            }
                        };
                        optionsDiv.appendChild(btn);
                    });
                }
                qItem.appendChild(optionsDiv);
                container.appendChild(qItem);
            }

            // Fill empty slots if less than 3 questions on last page
            const remainingSlots = ITEMS_PER_PAGE - pageQuestions.length;
            for (let i = 0; i < remainingSlots; i++) {
                const emptyDiv = document.createElement("div");
                emptyDiv.style.visibility = "hidden";
                emptyDiv.style.pointerEvents = "none";
                emptyDiv.style.background = "transparent";
                emptyDiv.style.boxShadow = "none";
                emptyDiv.style.border = "none";
                container.appendChild(emptyDiv);
            }

            pageIndicatorSpan.textContent = `पेज ${currentPage + 1} / ${totalPages}`;
            prevBtn.disabled = (currentPage === 0);

            const pageStart = currentPage * ITEMS_PER_PAGE;
            const pageEnd = Math.min(pageStart + ITEMS_PER_PAGE, TOTAL_QS);
            let allPageAnswered = true;
            for (let i = pageStart; i < pageEnd; i++) {
                if (!answersState[i]) { allPageAnswered = false; break; }
            }

            if (currentPage === totalPages - 1) {
                if (allPageAnswered && totalScore === TOTAL_QS) {
                    nextBtn.disabled = false;
                    nextBtn.textContent = "🎉 समाप्त 🎉";
                } else {
                    nextBtn.disabled = !allPageAnswered;
                    nextBtn.textContent = "अगला  ▶";
                }
            } else {
                nextBtn.disabled = !allPageAnswered;
                nextBtn.textContent = "अगला ▶";
            }
        }

        function goToPrevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderCurrentPage();
            }
        }

        function goToNextPage() {
            const pageStart = currentPage * ITEMS_PER_PAGE;
            const pageEnd = Math.min(pageStart + ITEMS_PER_PAGE, TOTAL_QS);
            let allCompleted = true;
            for (let i = pageStart; i < pageEnd; i++) {
                if (!answersState[i]) { allCompleted = false; break; }
            }
            if (!allCompleted) {
                showEmoji(false);
                popupEmojiSpan.textContent = "⚠️ पहले सभी 3 प्रश्न हल करें!";
                emojiPopupDiv.classList.add("active");
                setTimeout(() => emojiPopupDiv.classList.remove("active"), 1000);
                return;
            }
            if (currentPage === totalPages - 1) {
                if (totalScore === TOTAL_QS) showFinalPopup();
                else showEmoji(false);
                return;
            }
            if (currentPage < totalPages - 1) {
                currentPage++;
                renderCurrentPage();
            }
        }

        // Enable audio on any click (first user interaction)
        // document.body.addEventListener('click', initAudio, { once: true });

        prevBtn.addEventListener("click", goToPrevPage);
        nextBtn.addEventListener("click", goToNextPage);

        renderCurrentPage();
        updateGlobalScoreUI();
        document
            .getElementById("playAgainFinalBtn")
            .onclick = () => {
                location.reload();
            };
    </script>
</body>

</html>
