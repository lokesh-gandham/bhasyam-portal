            color: white;
        }

            background: #ffe0e0;
            border-color: #e74c3c;
            animation: shakeAnim 0.3s ease-in-out 0s 2;
        }

        .option-btn.wrong-selected .option-letter {
            background: #e74c3c;
            color: white;
        }

        .option-btn.disabled-option {
            opacity: 0.8;
            pointer-events: none;
            transform: none;
        }

        @keyframes shakeAnim {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);

        .emoji-popup {
            position: fixed;

            left: 50%;
            transform: translate(-50%, -50%) scale(0);

            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);

    <script>
        // Audio Setup
        function speakHindi(text) {
            speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "hi-IN";
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;

            speechSynthesis.speak(utterance);
        }
        let audioCtx = null;
        function playCorrectSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 880;
                gain.gain.value = 0.2;
                osc.type = 'sine';
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                osc.stop(audioCtx.currentTime + 0.5);
                audioCtx.resume();
            } catch (e) { console.log("audio error", e); }
        }
        function playWrongSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 440;
                gain.gain.value = 0.2;
                osc.type = 'sawtooth';
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.45);
                osc.stop(audioCtx.currentTime + 0.45);
                audioCtx.resume();
            } catch (e) { console.log("audio error", e); }
        }

        // Quiz Data
        const QUESTIONS = [

            },

                id: 3,
                image: "../assets/images/rice.png",
                question: "कर,बैठ , चावल, जाता, अपना",
                options: ["कर", "बैठ", "चावल", "जाता", "अपना"],
                correct: "चावल"
            },

            {
                id: 4,
                image: "../assets/images/bird.png",
                question: "कबूतर, देख, कर, और ,जाल",
                options: ["कबूतर", "देख", "कर", "और", "जाल"],
                correct: "कबूतर"
            }
        ]
        let currentIndex = 0;
        let quizCompleted = false;
        let userStates = [];

        function initStates() {
            userStates = QUESTIONS.map(() => ({ selectedAnswer: null, isCorrect: false }));
        }
        initStates();

        const questionTextEl = document.getElementById("questionText");
        const questionImage = document.getElementById("questionImage");
        const optionsList = document.getElementById("optionsList");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const popupDiv = document.getElementById("emojiPopup")
        const popupEmojiSpan = document.getElementById("popupEmoji");
        const finalOverlay = document.getElementById("finalPopup");
        const finalReplayBtn = document.getElementById("playAgainFinalBtn");

        let popupTimer = null;
        function showPopup(isCorrect) {
            if (popupTimer) clearTimeout(popupTimer);
            if (isCorrect) {
                popupEmojiSpan.textContent = "🥳";
                playCorrectSound();
                // speakHindi("सही");
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 }, colors: ['#ffb347', '#2ecc71', '#f1c40f'] });
                }
            } else {
                popupEmojiSpan.textContent = "😢";
                playWrongSound();
                // speakHindi("गलत");
            }
            popupDiv.classList.add("active");
            popupTimer = setTimeout(() => {
                popupDiv.classList.remove("active");
            }, 900);
        }

        function speakHindi(text) {
            try {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = "hi-IN";
                utterance.volume = 0.4;
                speechSynthesis.speak(utterance);
            } catch (e) { }
        }

        function bigCelebration() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 250, spread: 120, origin: { y: 0.5 }, startVelocity: 28 });
                setTimeout(() => {
                    confetti({ particleCount: 140, spread: 130, origin: { y: 0.4, x: 0.2 } });
                    confetti({ particleCount: 140, spread: 130, origin: { y: 0.4, x: 0.8 } });
                }, 150);
            }
        }

        function finishQuizCelebration() {
            if (quizCompleted) return;
            quizCompleted = true;
            bigCelebration();
            // speakHindi("बहुत बहुत बधाई! आपने सभी प्रश्न सही किए!");
            setTimeout(() => {
                finalOverlay.classList.add("active");
                prevBtn.disabled = true;
                nextBtn.disabled = true;
            }, 450);
        }

        function updateNavButtons() {
            prevBtn.disabled = (currentIndex === 0);
            const currentState = userStates[currentIndex];
            nextBtn.disabled = !currentState.isCorrect;
        }

        function checkAllComplete() {
            if (userStates.every(s => s.isCorrect) && !quizCompleted) {
                finishQuizCelebration();
            }
        }

        function handleAnswer(selectedVal, btnElement, allOptionButtons) {
            const q = QUESTIONS[currentIndex];
            const state = userStates[currentIndex];
            if (state.isCorrect) return;
            const isCorrectAnswer = (selectedVal === q.correct);
            if (isCorrectAnswer) {
                state.isCorrect = true;
                state.selectedAnswer = selectedVal;
                btnElement.classList.add("correct-selected");
                allOptionButtons.forEach(btn => {
                    btn.style.pointerEvents = 'none';
                    btn.classList.add('disabled-option');
                });
                showPopup(true);
                // speakHindi("सही उत्तर");
                updateNavButtons();
                checkAllComplete();
            } else {
                showPopup(false);
                // speakHindi("गलत उत्तर");
                btnElement.classList.add("wrong-selected");
                setTimeout(() => {
                    btnElement.classList.remove("wrong-selected");
                }, 500);
            }
        }

        function loadQuestion() {
            const q = QUESTIONS[currentIndex];
            const state = userStates[currentIndex];
            questionTextEl.innerHTML = `Q${q.id}. ${q.question}`;
            questionImage.src = q.image;
            questionImage.alt = `${q.id}`;
            questionImage.onerror = () => { questionImage.src = "https://via.placeholder.com/280x180?text=चित्र+उपलब्ध+नहीं"; };

            optionsList.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D', 'E'];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerHTML = `
                <div class="option-letter">${letters[idx]}</div>
                <div class="option-text">${opt}</div>
            `;
                if (!state.isCorrect) {
                    btn.addEventListener('click', (e) => {
                        if (state.isCorrect) return;
                        const allBtns = document.querySelectorAll('.option-btn');
                        handleAnswer(opt, btn, allBtns);
                    });
                } else {
                    btn.style.pointerEvents = 'none';
                    btn.classList.add('disabled-option');
                    if (opt === q.correct) {
                        btn.classList.add('correct-selected');
                    }
                }
                optionsList.appendChild(btn);
            });
            updateNavButtons();
        }

        // Navigation
        prevBtn.addEventListener("click", () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        });
        nextBtn.addEventListener("click", () => {
            const state = userStates[currentIndex];
            if (state.isCorrect && currentIndex < QUESTIONS.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        });

        // Reset Game
        function resetGame() {
            currentIndex = 0;
            quizCompleted = false;
            initStates();
            finalOverlay.classList.remove("active");
            loadQuestion();
        }

        finalReplayBtn.onclick = () => {
            resetGame();
        };

        // Audio init on interaction
        function initAudioOnAnyClick() {
            if (audioCtx && audioCtx.state !== 'running') {
                audioCtx.resume().catch(e => null);
            } else if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const buffer = audioCtx.createBuffer(1, 1, 22050);
                    const source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioCtx.destination);
                    source.start();
                    audioCtx.resume();
                } catch (e) { }
            }
        }
        document.body.addEventListener('click', initAudioOnAnyClick);
        document.body.addEventListener('touchstart', initAudioOnAnyClick);

        // Initial load
        loadQuestion();

        // Ensure NO SCROLL anywhere
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';
    </script>
</body>

</html>
