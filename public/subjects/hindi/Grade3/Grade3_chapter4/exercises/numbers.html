<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 30%, #fff6eb, #ffefdf);
      font-family: "Tiro Devanagari Hindi";
      overflow: hidden;
      position: fixed;
    }

    .quiz {
      width: 100vw;
      max-width: 1400px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem 2rem;
      text-align: center;
      overflow: hidden;
    }

    .question-box {
      background: #fff3ed;
      border: 2px solid #ffc8cf;
      border-radius: 120px;
      font-weight: 400;
      color: #bc5f7a;
      backdrop-filter: blur(2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.02);
      margin-bottom: 35px;
      letter-spacing: 0.3px;
      display: inline-block;
      padding: 10px 32px;
      font-size: 30px;
    }

    .hindi-word {
      background: linear-gradient(125deg, #ffffff, #fffaf2);
      border: 3px solid #ffcf9a;
      border-radius: 100px;
      font-weight: 500;
      color: #2c3e66;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(2px);
      transition: 0.2s;
      display: inline-block;
      letter-spacing: 4px;
      font-size: 74px;
      padding: 18px 60px;
      margin-bottom: 40px;
    }

    .options-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 38px;
      margin-bottom: 48px;
    }

    .option-btn {
      background: linear-gradient(135deg, #ffffff 0%, #fff9f0 100%);
      border: none;
      font-weight: 800;
      color: #d1415c;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.95, 0.4, 1.1);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
      letter-spacing: 2px;
      border-radius: 60px;
      min-width: 160px;
      font-size: 52px;
      padding: 16px 24px;
      font-family: inherit;
    }

    .option-btn:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.15);
      background: linear-gradient(135deg, #fffef7, #fff5e6);
      color: #c03a55;
    }

    .option-btn.correct-selected {
      background: linear-gradient(135deg, #b8ffd4, #90e6b6);
      color: #0e5e32;
      box-shadow: 0 0 0 3px #2ecc71, 0 12px 24px rgba(46, 204, 113, 0.25);
      transform: scale(1.01);
    }

    .option-btn.wrong-selected {
      background: linear-gradient(135deg, #ffd6d6, #ffbdbd);
      color: #c0392b;
      animation: shakeAnim 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      box-shadow: 0 0 0 2px #e74c3c;
    }

    .option-btn.disabled-option {
      opacity: 0.75;
      pointer-events: none;
      filter: grayscale(0.02);
    }

    @keyframes shakeAnim {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-8px);
      }

      60% {
        transform: translateX(8px);
      }
    }

    .nav-area {
      display: flex;
      gap: 32px;
      margin-top: 8px;
    }

    .nav-btn {
      width: 150px;
      height: 50px;
      border: none;
      border-radius: 80px;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: 0.08s linear;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      letter-spacing: 1px;
      font-size: 18px;
      padding: 0px !important;
      font-family: inherit;
    }

    .prev-btn {
      background: linear-gradient(135deg, #f97316, #ea580c);
    }

    .next-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }

    .nav-btn:active {
      transform: translateY(4px);
    }

    .prev-btn:active {
      box-shadow: 0 3px 0 #b32d48;
    }

    .next-btn:active {
      box-shadow: 0 3px 0 #5f3e9e;
    }

    .nav-btn:disabled {
      opacity: 0.5;
      transform: translateY(0);
      cursor: not-allowed;
    }

    .popup-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: radial-gradient(circle, #fffbf0, #fff3e0);
      padding: 1.4rem 3rem;
      border-radius: 140px;
      border: 5px solid #ffcd7a;
      box-shadow: 0 30px 45px rgba(0, 0, 0, 0.25), 0 0 0 10px #ffe4ab;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s cubic-bezier(0.34, 1.4, 0.55, 1);
      text-align: center;
      white-space: nowrap;
    }

    .popup-glow.active {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .popup-emoji-big {
      font-size: 5rem;
      font-weight: 800;
      animation: bounceScale 0.45s ease;
    }

    @keyframes bounceScale {
      0% {
        transform: scale(0) rotate(-12deg);
        opacity: 0;
      }

      55% {
        transform: scale(1.25) rotate(2deg);
      }

      100% {
        transform: scale(1) rotate(0);
      }
    }

    .final-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      backdrop-filter: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s ease;
    }

    .final-overlay.active {
      visibility: visible !important;
      opacity: 1 !important;
      display: flex !important;
    }

    .final-popup-box {
      background: #fff8eb;
      border-radius: 70px;
      padding: 1.5rem 1.8rem;
      text-align: center;
      max-width: 400px;
      width: 85%;
      border: 8px solid #ffc471;
      box-shadow: 0 25px 0 #b87a38;
      animation: legoFinal 0.5s cubic-bezier(0.34, 1.2, 0.55, 1);
      position: relative;
      z-index: 9999;
    }

    @keyframes legoFinal {
      0% {
        transform: scale(0.2) rotate(-5deg);
        opacity: 0;
      }

      60% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
      }
    }

    .medals-row {
      font-size: 1.8rem;
      letter-spacing: 6px;
      margin-bottom: 0.5rem;
    }

    .final-heading {
      font-size: 1.5rem;
      color: #e67e22;
      margin-bottom: 0.3rem;
    }

    .final-sub {
      color: #785d37;
      font-size: 1rem;
      margin-bottom: 0.7rem;
    }

    .final-stars {
      font-size: 1.7rem;
      letter-spacing: 5px;
      color: #f7b32b;
      margin: 0.5rem 0;
    }

    .final-buttons {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }

    .final-btn {
      border: none;
      padding: 10px 24px;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 0 #b87232;
      transition: 0.05s linear;
      font-family: inherit;
    }

    .playagain-btn {
      background: #ffe2a4;
      color: #6b451f;
    }

    .final-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b87232;
    }

    /* ========================= MEDIA QUERIES ========================== */

    @media (max-width: 550px) {
      .hindi-word {
        font-size: 34px;
        padding: 10px 20px;
      }

      .option-btn {
        min-width: 85px;
        font-size: 28px;
        padding: 8px 10px;
      }

      .nav-btn {
        font-size: 0.9rem;
        padding: 8px 20px;
      }

      .question-box {
        font-size: 13px;
      }
    }

    @media (max-width: 700px) {
      .popup-emoji-big {
        font-size: 3rem;
      }

      .popup-glow {
        padding: 0.8rem 2rem;
        white-space: nowrap;
      }

      .option-btn {
        min-width: 100px;
        font-size: 32px;
        padding: 10px 16px;
      }
    }

    @media (max-width: 1023px) {
      .quiz {
        justify-content: center;
        padding: 1rem;
        overflow: hidden;
      }

      .hindi-word {
        font-size: 48px;
        padding: 12px 28px;
        white-space: normal;
      }

      .option-btn {
        min-width: 110px;
        font-size: 38px;
        padding: 12px 14px;
      }

      .options-list {
        gap: 20px;
        margin-bottom: 35px;
      }

      body {
        overflow: hidden;
      }
    }

    @media (min-width: 1024px) and (max-width: 1299px) {
      .question-box {
        font-size: 30px;
        padding: 8px 28px;
        margin-bottom: 28px;
      }

      .hindi-word {
        font-size: 64px;
        padding: 14px 48px;
        margin-bottom: 36px;
      }

      .option-btn {
        min-width: 155px;
        font-size: 50px;
        padding: 14px 18px;
        border-radius: 55px;
      }

      .options-list {
        gap: 32px;
        margin-bottom: 42px;
      }

      .nav-btn {
        font-size: 18px;
        padding: 12px 34px;
      }
    }

    @media (min-width: 1300px) and (max-width: 1599px) {
      .question-box {
        font-size: 30px;
        padding: 10px 32px;
      }

      .hindi-word {
        font-size: 74px;
        padding: 18px 60px;
      }

      .option-btn {
        min-width: 180px;
        font-size: 58px;
        padding: 16px 22px;
      }

      .options-list {
        gap: 38px;
      }

      .nav-btn {
        font-size: 20px;
        padding: 14px 20px;
      }
    }

    @media (min-width: 1600px) {
      .question-box {
        font-size: 30px !important;
        padding: 14px 36px !important;
      }

      .hindi-word {
        font-size: 86px !important;
        padding: 22px 70px !important;
        margin-bottom: 45px !important;
      }

      .option-btn {
        min-width: 210px !important;
        font-size: 68px !important;
        padding: 20px 24px !important;
        border-radius: 70px !important;
      }

      .options-list {
        gap: 45px !important;
        margin-bottom: 50px !important;
      }

      .nav-btn {
        font-size: 1.5rem !important;
        padding: 10px 18px !important;
      }
    }
  </style>
  <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

  <div class="quiz">
    <div class="question-box">गिनती के शब्दों को अंकों में लिखिए</div>
    <div class="hindi-word" id="hindiWord">तीन</div>
    <div class="options-list" id="optionsList"></div>
    <div class="nav-area">
      <button class="nav-btn prev-btn" id="prevBtn" disabled>◀ पिछला</button>
      <button class="nav-btn next-btn" id="nextBtn" disabled>अगला ▶</button>
    </div>
  </div>

  <div id="reactionPopup" class="popup-glow">
    <div class="popup-emoji-big" id="popupEmojiDisplay">🎉</div>
  </div>

  <!-- FIX: id was "playAgainFinalBtn" in original HTML but JS looked for "finalPlayAgainBtn" -->
  <div id="finalPopup" class="final-overlay">
    <div class="final-popup-box">
      <div class="medals-row">🏅 🥇 🏅</div>
      <h2 class="final-heading">बधाई हो!</h2>
      <p class="final-sub">आपने सभी प्रश्न सही किए!</p>
      <div class="final-stars">⭐⭐⭐⭐⭐</div>
      <div class="final-buttons">
        <!-- FIX: changed id from "playAgainFinalBtn" → "finalPlayAgainBtn" to match JS -->
        <button class="final-btn playagain-btn" id="finalPlayAgainBtn">
          🔄 फिर से खेलें
        </button>
      </div>
    </div>
  </div>

  <script>
    let audioCtx = null;

    function playCorrectSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume().then(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.value = 880;
          gain.gain.value = 0.2;
          osc.type = 'sine';
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.45);
          osc.stop(audioCtx.currentTime + 0.45);
        });
      } catch (e) { }
    }

    function playWrongSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume().then(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.value = 480;
          gain.gain.value = 0.2;
          osc.type = 'triangle';
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
          osc.stop(audioCtx.currentTime + 0.4);
        });
      } catch (e) { }
    }

    const QUESTIONS = [
      { hindiWord: "तीन", options: ["3", "5", "8"], correct: "3" },
      { hindiWord: "नौ", options: ["6", "2", "9"], correct: "9" },
      { hindiWord: "ग्यारह", options: ["11", "15", "10"], correct: "11" },
      { hindiWord: "सोलह", options: ["11", "16", "18"], correct: "16" },
      { hindiWord: "अठारह", options: ["18", "21", "19"], correct: "18" },
      { hindiWord: "बीस", options: ["20", "22", "25"], correct: "20" },
    ];

    let currentIndex = 0;
    let quizCompleted = false;
    let userState = [];

    function initUserState() {
      userState = QUESTIONS.map(() => ({ correctFlag: false, selectedVal: null }));
    }
    initUserState();

    const hindiWordEl = document.getElementById("hindiWord");
    const optionsContainer = document.getElementById("optionsList");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const popupDiv = document.getElementById("reactionPopup");
    const popupEmojiSpan = document.getElementById("popupEmojiDisplay");
    const finalOverlay = document.getElementById("finalPopup");
    // FIX: now matches the corrected id in HTML above
    const finalReplayBtn = document.getElementById("finalPlayAgainBtn");

    function showResultPopup(isCorrect) {
      if (isCorrect) {
        popupEmojiSpan.innerHTML = "🥳";
        playCorrectSound();
        //  speakCorrect();
        confetti({ particleCount: 120, spread: 75, origin: { y: 0.55 }, startVelocity: 18, colors: ['#2ecc71', '#f1c40f', '#ff9f4a'] });
        confetti({ particleCount: 50, spread: 45, origin: { y: 0.65, x: 0.3 }, startVelocity: 12 });
      } else {
        popupEmojiSpan.innerHTML = "😢";
        playWrongSound();
        // speakWrong();
      }
      popupDiv.classList.add("active");
      setTimeout(() => popupDiv.classList.remove("active"), 900);
    }

    function triggerFinalCelebration() {
      if (quizCompleted) return;
      quizCompleted = true;
      confetti({ particleCount: 350, spread: 130, origin: { y: 0.5 }, startVelocity: 26 });
      confetti({ particleCount: 200, spread: 100, origin: { y: 0.7, x: 0.2 }, colors: ['#ffd966', '#ffac30'] });
      confetti({ particleCount: 200, spread: 100, origin: { y: 0.7, x: 0.8 }, colors: ['#f9a26c', '#b28be6'] });
      setTimeout(() => finalOverlay.classList.add("active"), 450);
    }

    function updateNavButtons() {
      prevBtn.disabled = (currentIndex === 0);
      nextBtn.disabled = !(userState[currentIndex]?.correctFlag);
    }

    function onAnswerSelect(selectedValue, clickedBtn, allOptionButtons) {
      const currentQ = QUESTIONS[currentIndex];
      const currentState = userState[currentIndex];
      if (currentState.correctFlag) return;

      const isAnswerCorrect = (selectedValue === currentQ.correct);
      if (isAnswerCorrect) {
        currentState.correctFlag = true;
        currentState.selectedVal = selectedValue;
        clickedBtn.classList.add("correct-selected");
        allOptionButtons.forEach(btn => {
          btn.classList.add("disabled-option");
          btn.style.pointerEvents = "none";
        });
        showResultPopup(true);
        updateNavButtons();

        const allCorrect = userState.every(s => s.correctFlag === true);
        if (allCorrect && !quizCompleted) triggerFinalCelebration();
      } else {
        clickedBtn.classList.add("wrong-selected");
        showResultPopup(false);
        setTimeout(() => clickedBtn.classList.remove("wrong-selected"), 500);
      }
    }

    function renderQuestion() {
      const qData = QUESTIONS[currentIndex];
      const stateData = userState[currentIndex];
      hindiWordEl.innerText = qData.hindiWord;
      optionsContainer.innerHTML = "";

      qData.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;

        if (stateData.correctFlag) {
          btn.classList.add("disabled-option");
          btn.style.pointerEvents = "none";
          if (opt === qData.correct) btn.classList.add("correct-selected");
        }

        btn.onclick = () => {
          if (stateData.correctFlag) return;
          const allCurrentBtns = document.querySelectorAll(".option-btn");
          onAnswerSelect(opt, btn, allCurrentBtns);
        };
        optionsContainer.appendChild(btn);
      });
      updateNavButtons();
    }

    prevBtn.onclick = () => {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); }
    };

    nextBtn.onclick = () => {
      if (!userState[currentIndex]?.correctFlag) return;
      if (currentIndex < QUESTIONS.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        // already on last question — show final if not shown yet
        const allDone = userState.every(s => s.correctFlag);
        if (allDone && !quizCompleted) triggerFinalCelebration();
      }
    };

    function resetGame() {
      quizCompleted = false;
      currentIndex = 0;
      initUserState();
      finalOverlay.classList.remove("active");
      renderQuestion();
    }

    // FIX: finalReplayBtn is now correctly resolved (non-null), so onclick works
    finalReplayBtn.onclick = () => resetGame();

    renderQuestion();
  </script>
</body>

</html>
