            position: relative;
        }

        .cell:nth-child(even) {
            background: #f4e6ec;
        }

        .cell.selected {

            background: #ffeaa7 !important;

            border: 2px solid #ffb300;
        }

        .cell.correct {

            background: #d8ffd8 !important;

            border: 3px solid #1fb655 !important;
        }

        .cell.wrong {

            background: #ffd6d6 !important;

            border: 2px solid red !important;
        }

        .inside-number {

            position: absolute;

            top: -10px;

            left: -10px;

            width: 22px;

            height: 22px;

            border-radius: 50%;

            background: #ff1493;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 12px;

            font-weight: 700;
        }

/* EMOJI POPUP */

.emoji-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 1500;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
    background: #fff6e8;
    padding: 0.8rem 2rem;
    border-radius: 80px;
    border: 5px solid #ffcd7e;
    box-shadow: 0 15px 0 #c4833a;
}

.emoji-popup.active {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
}

.popup-emoji {
    font-size: 3.5rem;
    line-height: 1;
    animation: popEmoji 0.4s ease;
    text-align: center;
}

@keyframes popEmoji {

    0% {
        transform: scale(0.2) rotate(-10deg);
        opacity: 0;
    }

    70% {
        transform: scale(1.2) rotate(2deg);
    }

    100% {
        transform: scale(1) rotate(0);
    }
}

/* FINAL POPUP */

.final-overlay {
    position: fixed;
    inset: 0;
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    visibility: hidden;
    opacity: 0;
    transition: 0.2s ease;
}

.final-overlay.active {
    visibility: visible;
    opacity: 1;
}

.final-popup-box {
    background: #fff8eb;
    border-radius: 70px;
    padding: 1.5rem 1.8rem;
    text-align: center;
    max-width: 400px;
    width: 85%;
    border: 8px solid #ffc471;
    box-shadow: 0 25px 0 #b87a38;
    animation: legoFinal 0.5s cubic-bezier(0.34, 1.2, 0.55, 1);
}

@keyframes legoFinal {

    0% {
        transform: scale(0.2) rotate(-5deg);
        opacity: 0;
    }

    60% {
        transform: scale(1.05);
    }

    100% {
        transform: scale(1);
    }
}

.medals-row {
    font-size: 1.8rem;

}

.final-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #b87232;

    <script>
   const gameData = {
   gridLetters: [
    ["क", "आ", "स", "मा", "न", "ख", "ग"],

    ["जं", "ग", "ल", "घ", "ऊ", "जा", "च"],

    ["छ", "क", "ज", "झ", "ज", "ल", "ट"],

    ["ठ", "बू", "ड़", "चू", "हा", "ढ़", "णा"],

    ["प", "त", "फ", "ब", "भ", "म", "स"],

   ["श", "र", "ष", "ह", "पे", "ड़", "क्ष"]
],
answers: [
    { number: 1, word: "जंगल" },   // row 1: जं→ग→ल ✅
    { number: 2, word: "कबूतर" },  // row 2: क→बू→त→र ✅
    { number: 3, word: "जाल" },    // row 1: जा→ल? ❌ need to fix
    { number: 4, word: "पेड़" },    // row 5: पे→ड़ ✅
    { number: 5, word: "चूहा" },   // row 3: चू→हा ✅
    { number: 6, word: "आसमान" }   // row 0: आ→स→मा→न ✅
]
       
    };
        const grid =
            document.getElementById("grid");

        let currentSelection = [];

        let solvedWords = 0;

        const totalWords =
            gameData.answers.length;

        gameData.gridLetters.forEach((row) => {

            row.forEach((letter) => {

                const cell =
                    document.createElement("div");

                cell.className = "cell";

                cell.textContent = letter;

                cell.onclick = () =>
                    selectLetter(cell, letter);

                grid.appendChild(cell);

            });

        });

        function selectLetter(cell, letter) {

            if (cell.classList.contains("correct")) return;

            if (cell.classList.contains("selected")) return;

            const cells =
                [...document.querySelectorAll(".cell")];

            const currentIndex =
                cells.indexOf(cell);

            const cols = 7;

            const currentRow =
                Math.floor(currentIndex / cols);

            const currentCol =
                currentIndex % cols;

            if (currentSelection.length > 0) {

                const lastCell =
                    currentSelection[
                        currentSelection.length - 1
                    ].element;

                const lastIndex =
                    cells.indexOf(lastCell);

                const lastRow =
                    Math.floor(lastIndex / cols);

                const lastCol =
                    lastIndex % cols;

                const isNextHorizontal =
                    currentRow === lastRow &&
                    currentCol === lastCol + 1;

                const isNextVertical =
                    currentCol === lastCol &&
                    currentRow === lastRow + 1;

                if (!isNextHorizontal &&
                    !isNextVertical) {
                    return;
                }
            }

            cell.classList.add("selected");

            currentSelection.push({
                letter,
                element: cell
            });

            checkWord();
        }

        function checkWord() {

            const formedWord =
                currentSelection
                .map(x => x.letter)
                .join("");

            let matched = false;

            gameData.answers.forEach((ans) => {

               if (formedWord === ans.word) {

    matched = true;

    currentSelection.forEach((x, index) => {

        x.element.classList.remove("selected");

        x.element.classList.add("correct");

        if (index === 0) {

            const badge =
                document.createElement("div");

            badge.className =
                "inside-number";

            badge.textContent =
                ans.number;

            x.element.appendChild(badge);
        }

    });

    solvedWords++;

    showPopup(true);

    currentSelection = [];

    if (solvedWords === totalWords) {

        setTimeout(showFinal, 1000);

    }
}
            });

            const possible =
                gameData.answers.some(a =>
                    a.word.startsWith(formedWord)
                );

            if (!matched && !possible) {

                wrongSelection();
            }
        }
function wrongSelection() {

    currentSelection.forEach((x) => {

        x.element.classList.add("wrong");

        setTimeout(() => {

            x.element.classList.remove("wrong");

            x.element.classList.remove("selected");

        }, 500);

    });

    showPopup(false);

    currentSelection = [];
}
      /* AUDIO */

let audioCtx = null;

function playCorrectSound(){

    try{

        if(!audioCtx){

            audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        }

        const oscillator =
        audioCtx.createOscillator();

        const gainNode =
        audioCtx.createGain();

        oscillator.connect(gainNode);

        gainNode.connect(
            audioCtx.destination
        );

        oscillator.frequency.value =
        880;

        gainNode.gain.value =
        0.2;

        oscillator.type =
        "sine";

        oscillator.start();

        gainNode.gain
        .exponentialRampToValueAtTime(
            0.00001,
            audioCtx.currentTime + 0.5
        );

        oscillator.stop(
            audioCtx.currentTime + 0.5
        );

    }catch(e){}

}

function playWrongSound(){

    try{

        if(!audioCtx){

            audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        }

        const oscillator =
        audioCtx.createOscillator();

        const gainNode =
        audioCtx.createGain();

        oscillator.connect(gainNode);

        gainNode.connect(
            audioCtx.destination
        );

        oscillator.frequency.value =
        440;

        gainNode.gain.value =
        0.25;

        oscillator.type =
        "sawtooth";

        oscillator.start();

        gainNode.gain
        .exponentialRampToValueAtTime(
            0.00001,
            audioCtx.currentTime + 0.4
        );

        oscillator.stop(
            audioCtx.currentTime + 0.4
        );

    }catch(e){}

}

/* POPUP */

function showPopup(correct = true) {

    const popup =
        document.getElementById(
            "emojiPopup"
        );

    const emoji =
        document.getElementById(
            "popupEmoji"
        );

    if (correct) {

        emoji.innerHTML = "🥳";

        playCorrectSound();

        confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
        });

    } else {

        emoji.innerHTML = "😢";

        playWrongSound();

    }

    popup.classList.add(
        "active"
    );

    setTimeout(() => {

        popup.classList.remove(
            "active"
        );

    }, 1000);

}

/* BIG CONFETTI */

function bigConfetti(){

    confetti({
        particleCount:200,

        origin:{y:0.5}
    });

    setTimeout(()=>{

        confetti({
            particleCount:120,
            spread:130,
            origin:{

                x:0.2
            }
        });

        confetti({
            particleCount:120,
            spread:130,
            origin:{
                y:0.4,
                x:0.8
            }
        });

    },150);

}

/* FINAL POPUP */

let finalPopupShown = false;

function showFinal(){

    if(finalPopupShown)
    return;

    finalPopupShown = true;

    bigConfetti();

    setTimeout(()=>{

        document
        .getElementById(
            "finalPopup"
        )
        .classList.add(
            "active"
        );

    },500);

}
