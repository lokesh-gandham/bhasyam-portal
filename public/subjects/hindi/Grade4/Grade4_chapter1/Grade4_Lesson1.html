<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

  <!-- GOOGLE FONT -->
 <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">


  <!-- FONT AWESOME -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
        font-family: "Tiro Devanagari Hindi";
    }

    body {
      height: 100vh;
      overflow: hidden;

      background:
        radial-gradient(circle at top left,
          rgba(255, 210, 230, 0.5),
          transparent 28%),

        radial-gradient(circle at bottom right,
          rgba(180, 230, 255, 0.5),
          transparent 30%),

        linear-gradient(145deg,
          #fef5e7 0%,
          #fae8f0 100%);
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 330px;

      padding: 35px 20px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    /* =========================
       NAV BUTTON
    ========================= */

    .island-btn {
      position: relative;

      width: 100%;
      height: 88px;

      border-radius: 30px;

      overflow: hidden;

      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 18px;

      padding: 0 22px;

      background: rgba(255, 255, 255, 0.3);

      backdrop-filter: blur(18px);

      border: 1px solid rgba(255, 255, 255, 0.5);

      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.8),
        0 10px 30px rgba(0, 0, 0, 0.08);

      transition: 0.45s ease;
      
    }

    /* ACTIVE ANIMATION */

    .island-btn::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(135deg,
          #8FD3FF,
          #6EC6FF,
          #5BA8FF);

      transform: translateX(-102%);

      transition: 0.8s cubic-bezier(0.22, 1, 0.36, 1);

      z-index: 1;
    }

    /* SHINE EFFECT */

    .island-btn::after {
      content: "";

      position: absolute;

      top: 0;
      left: -130%;

      width: 90px;
      height: 100%;

      background:
        linear-gradient(to right,
          transparent,
          rgba(255, 255, 255, 0.7),
          transparent);

      transform: skewX(-20deg);

      transition: 0.9s ease;

      z-index: 3;
    }

    /* ACTIVE */

    .island-btn.active::before {
      transform: translateX(0);
    }

    .island-btn.active::after {
      left: 130%;
    }

    .island-btn.active {
      transform: scale(1.02);

      box-shadow:
        0 18px 40px rgba(59, 130, 246, 0.28),
        0 0 0 2px rgba(255, 255, 255, 0.35);
    }

    /* =========================
       ICON
    ========================= */

    .nav-icon {
      position: relative;
      z-index: 5;

      width: 52px;
      height: 52px;

      border-radius: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;

      background: rgba(255, 255, 255, 0.85);

      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.9),
        0 4px 12px rgba(0, 0, 0, 0.08);

      transition: 0.45s ease;
    }

    /* DIFFERENT COLORS */

    .icon-1 {
      color: #ff4d6d;
    }

    .icon-2 {
      color: #06b6d4;
    }

    .icon-3 {
      color: #8b5cf6;
    }

    .icon-4 {
      color: #f59e0b;
    }

    .icon-5 {
      color: #10b981;
    }

    .icon-6 {
      color: #ef4444;
    }

    /* ACTIVE ICON */

    .island-btn.active .nav-icon {
      color: white;

      background: rgba(255, 255, 255, 0.18);

      transform:
        rotate(-8deg)
        scale(1.08);
    }

    /* =========================
       TEXT
    ========================= */

    .btn-title {
      position: relative;
      z-index: 5;

      font-size: 1.08rem;
      font-weight: 500;

      color: #1e293b;

      letter-spacing: 0.2px;

      transition: 0.45s ease;
    }

    .island-btn.active .btn-title {
      color: white;
    }

    /* FLOATING DOT */

    .dot {
      position: absolute;

      top: 14px;
      right: 16px;

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.7);

      z-index: 6;

      opacity: 0;

      transform: scale(0);

      transition: 0.4s ease;
    }

    .island-btn.active .dot {
      opacity: 1;
      transform: scale(1);
    }

    /* HOVER */

    .island-btn:hover {
      transform: translateY(-4px);

      box-shadow:
        0 18px 35px rgba(0, 0, 0, 0.12),
        inset 0 1px 2px rgba(255, 255, 255, 0.9);
    }

    .island-btn:active {
      transform: scale(0.98);
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;
      height: 100vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
          
    }

    /* =========================
       MOBILE MENU
    ========================= */

    .menu-btn {
      display: none;
    }

    .offcanvas {
      display: none;
    }

    @media(max-width:1065px) {

      .sidebar {
        display: none;
      }

      .menu-btn {
        display: flex;

        position: fixed;

        top: 18px;
        right: 18px;

        width: 58px;
        height: 58px;

        border-radius: 50%;
        border: none;

        background:
          linear-gradient(135deg,
            #4f46e5,
            #3b82f6);

        color: white;

        font-size: 28px;

        align-items: center;
        justify-content: center;

        cursor: pointer;

        z-index: 9999;

        box-shadow:
          0 10px 30px rgba(59, 130, 246, 0.3);
      }

      .offcanvas {
        position: fixed;

        inset: 0;

        background: rgba(0, 0, 0, 0.35);

        backdrop-filter: blur(5px);

        z-index: 5000;
      }

      .offcanvas.show {
        display: block;
      }

      .offcanvas-panel {
        position: absolute;

        top: 0;
        right: 0;

        width: 310px;
        height: 100%;

        padding: 90px 18px 20px;

        background:
          linear-gradient(180deg,
            #f8fbff,
            #eef5ff);

        display: flex;
        flex-direction: column;
        gap: 18px;

        transform: translateX(100%);
        transition: 0.4s ease;
      }

      .offcanvas.show .offcanvas-panel {
        transform: translateX(0);
      }
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(min-width:1440px) {

      .sidebar {
        width: 370px;
      }

      .island-btn {
        height: 96px;
      }

      .btn-title {
        font-size: 1.18rem;
      }
    }

    @media(min-width:1920px) {

      .sidebar {
        width: 450px;
      }

      .island-btn {
        height: 112px;
        border-radius: 38px;
      }

      .nav-icon {
        width: 62px;
        height: 62px;
        font-size: 26px;
      }

      .btn-title {
        font-size: 1.45rem;
      }
    }
  </style>
        <link rel="stylesheet" href="assets/CSS/walkman-font.css">
</head>

<body>

  <!-- MOBILE BUTTON -->

  <button class="menu-btn" onclick="toggleMenu()">
    ☰
  </button>

  <div class="app">

    <!-- SIDEBAR -->

    <div class="sidebar">

      <!-- 1 -->

      
      <div class="island-btn  active" onclick="openIsland(0)">

        <div class="dot"></div>

        <div class="nav-icon icon-6">
          <i class="fa-solid fa-pen"></i>
        </div>

        <span class="btn-title">
          सही मात्राएँ लगाइए
        </span>

      </div>

       <div class="island-btn" onclick="openIsland(1)">

        <div class="dot"></div>

        <div class="nav-icon icon-3">
          <i class="fa-solid fa-a"></i>
        </div>

        <span class="btn-title">
          आगे वाला अक्षर
        </span>

      </div>

      <div class="island-btn" onclick="openIsland(2)">

        <div class="dot"></div>

        <div class="nav-icon icon-5">
          <i class="fa-solid fa-arrow-right"></i>
        </div>

        <span class="btn-title">
          बाद वाला अक्षर
        </span>

      </div>

       <div class="island-btn" onclick="openIsland(3)">

        <div class="dot"></div>

        <div class="nav-icon icon-4">
          <i class="fa-solid fa-grip-lines"></i>
        </div>

        <span class="btn-title">
          बीच वाला अक्षर
        </span>

      </div>

       <div class="island-btn" onclick="openIsland(4)">

        <div class="dot"></div>

        <div class="nav-icon icon-2">
          <i class="fa-solid fa-link"></i>
        </div>

        <span class="btn-title">
          मिलान
        </span>

      </div>

      <div class="island-btn" onclick="openIsland(5)">

        <div class="dot"></div>

        <div class="nav-icon icon-1">
          <i class="fa-solid fa-circle-check"></i>
        </div>

        <span class="btn-title">
          सही विकल्प चुनें
        </span>

      </div>

    


    </div>

    <!-- MAIN CONTENT -->

    <div class="main">

      <iframe id="contentFrame"
        src="./exercises/circle.html"></iframe>

    </div>

  </div>

  <!-- MOBILE MENU -->

  <div class="offcanvas"
    id="offcanvas"
    onclick="toggleMenu()">

    <div class="offcanvas-panel"
      onclick="event.stopPropagation()">

      <div class="island-btn"
        onclick="mobileOpen(0)">

        <div class="dot"></div>

        <div class="nav-icon icon-6">
          <i class="fa-solid fa-pen"></i>
        </div>

        <span class="btn-title">
          सही मात्राएँ लगाइए
        </span>

      </div>

        <div class="island-btn"
        onclick="mobileOpen(1)">

        <div class="dot"></div>

        <div class="nav-icon icon-3">
          <i class="fa-solid fa-a"></i>
        </div>

        <span class="btn-title">
          आगे वाला अक्षर
        </span>

      </div>

        <div class="island-btn"
        onclick="mobileOpen(2)">

        <div class="dot"></div>

        <div class="nav-icon icon-5">
          <i class="fa-solid fa-arrow-right"></i>
        </div>

        <span class="btn-title">
          बाद वाला अक्षर
        </span>

      </div>

      <div class="island-btn"
        onclick="mobileOpen(3)">

        <div class="dot"></div>

        <div class="nav-icon icon-4">
          <i class="fa-solid fa-grip-lines"></i>
        </div>

        <span class="btn-title">
          बीच वाला अक्षर
        </span>

      </div>

      
      <div class="island-btn"
        onclick="mobileOpen(4)">

        <div class="dot"></div>

        <div class="nav-icon icon-2">
          <i class="fa-solid fa-link"></i>
        </div>

        <span class="btn-title">
          मिलान
        </span>

      </div>

      <div class="island-btn active"
        onclick="mobileOpen(5)">

        <div class="dot"></div>

        <div class="nav-icon icon-1">
          <i class="fa-solid fa-circle-check"></i>
        </div>

        <span class="btn-title">
          सही विकल्प चुनें
        </span>

      </div>

      

    

      

    

      

    </div>

  </div>

  <script>

    const sidebarButtons =
      document.querySelectorAll(".sidebar .island-btn");

    const mobileButtons =
      document.querySelectorAll(".offcanvas .island-btn");

    const frame =
      document.getElementById("contentFrame");

    const pages = [
      "./exercises/circle.html",
      "./exercises/first.html",
      "./exercises/last.html",
      "./exercises/meddel.html",
      "./exercises/matching.html",
      "./exercises/mcq.html",
    ];

    function openIsland(index) {

      sidebarButtons.forEach(btn => {
        btn.classList.remove("active");
      });

      mobileButtons.forEach(btn => {
        btn.classList.remove("active");
      });

      if (sidebarButtons[index]) {
        sidebarButtons[index].classList.add("active");
      }

      if (mobileButtons[index]) {
        mobileButtons[index].classList.add("active");
      }

      if (pages[index]) {
        frame.src = pages[index];
      }

    }

    function toggleMenu() {

      document
        .getElementById("offcanvas")
        .classList.toggle("show");

    }

    function mobileOpen(index) {

      openIsland(index);
      toggleMenu();

    }

    window.addEventListener("resize", () => {

      const offcanvas =
        document.getElementById("offcanvas");

      if (window.innerWidth > 1065) {
        offcanvas.classList.remove("show");
      }

    });

  </script>


</body>

</html>
