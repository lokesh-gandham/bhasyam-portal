<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
<link rel="stylesheet" href="../assets/CSS/matching.css">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

<div class="container">

    <div class="question-box">
       चित्रों को उनके सही नामों से मिलाइए।
    </div>

    <div class="stage-title" id="stageTitle">
        Stage 1
    </div>

    <div class="match-wrapper">

        <svg id="svgLines"></svg>

        <div class="matching-area">

            <div class="left-side" id="leftSide"></div>

            <div class="center-side" id="centerWords"></div>

            <div class="right-side" id="rightSide"></div>

        </div>

    </div>

    <div class="next-buttons">

        <button class="nav-btn" id="prevBtn">
            ◀ पिछला
        </button>

        <button class="nav-btn" id="nextBtn" disabled>
            अगला ▶
        </button>

    </div>

</div>

<!-- POPUP -->

<div id="emojiPopup" class="emoji-popup">

    <div class="popup-emoji" id="popupEmoji">
        😊
    </div>

</div>

<!-- FINAL -->

<div id="finalPopup" class="final-popup-overlay">

    <div class="final-popup">

        <h2>🎉 बहुत बहुत बधाई! 🎉</h2>

        <div class="final-stars">
            ⭐⭐⭐⭐
        </div>

        <p>
            आपने सभी प्रश्न सही किए!
        </p>

        <!-- <p>
            ✨ आप होशियार हो! ✨
        </p> -->

        <button class="popup-playagain-btn"
                onclick="location.reload()">

            🔄 फिर से खेलें

        </button>

    </div>

</div>

<script src="../assets/JavaScript/matching.js">


</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</body>
</html>
