<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
    <link rel="stylesheet" href="../assets/CSS/mcq.css">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>
<body>

<div class="quiz">
    <div class="question-box" id="question">चित्रों के सही नामों पर गोला लगाइए।</div>

    <div class="content">
        <div class="image-card">
            <img id="questionImg" alt="Question Image">
        </div>
        <div class="options" id="options"></div>
    </div>

    <div class="nav-area">
        <button class="nav-btn" id="prevBtn">◀ पिछला</button>
        <button class="nav-btn" id="nextBtn" disabled>अगला ▶</button>
    </div>
</div>

<!-- EMOJI POPUP -->
<div id="emojiPopup" class="emoji-popup">
    <div class="popup-emoji" id="popupEmoji">😊</div>
</div>

<!-- FINAL POPUP -->
<div id="finalPopup" class="final-popup-overlay">
    <div class="final-popup">
        <h2>🎉 बहुत बहुत बधाई! 🎉</h2>
        <div class="final-stars">⭐⭐⭐⭐</div>
        <p>आपने सभी प्रश्न सही किए!</p>
        <!-- <p>✨ आप होशियार हो! ✨</p> -->
        <button class="popup-playagain-btn" id="playAgainBtn">🔄 फिर से खेलें</button>
    </div>
</div>

<script src="../assets/JavaScript/mcq.js">
</script>
</body>
</html>
