<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
        <link rel="stylesheet" href="../assets/CSS/True_false.css">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    
        <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

    <div class="quiz">

        <div class="question-box">
            ‘हाँ’ या ‘नहीं’ पर सही (✓) का निशान लगाइए।
        </div>

        <div class="quiz-layout">
            <!-- LEFT SECTION - Image -->
            <div class="left-section">
                <img id="questionImage" src="" alt="Picture" class="question-image">
            </div>

            <!-- RIGHT SECTION - Question & Buttons -->
            <div class="right-section">
                <div class="question-text" id="questionText"></div>
                <div class="answer-buttons" id="answerButtons">
                    <button class="answer-btn" data-answer="हाँ">हाँ</button>
                    <button class="answer-btn" data-answer="नहीं">नहीं</button>
                </div>
            </div>
        </div>

        <div class="nav-area">
            <button class="nav-btn prev-btn" id="prevBtn" disabled>◀ पिछला</button>
            <button class="nav-btn next-btn" id="nextBtn" disabled>अगला ▶</button>
        </div>

    </div>

    <!-- POPUP -->
    <div id="simpleEmojiPopup" class="emoji-popup-simple">
        <div class="popup-emoji-large" id="popupEmoji">😊</div>
    </div>

    <!-- FINAL -->
    <div class="final-popup-overlay" id="finalPopup">
        <div class="final-popup">
            <h2>🎉 बहुत बहुत बधाई! 🎉</h2>
            <div class="final-stars">⭐⭐⭐⭐⭐</div>
            <p>आपने सभी उत्तर सही दिए!</p>
            <p>✨ आप होशियार हो! ✨</p>
            <button class="popup-playagain-btn" id="playAgainBtn">
                🔄 फिर से खेलें
            </button>
        </div>
    </div>

    <script src="../assets/js/true_false.js">
    
    </script>

</body>

</html>
