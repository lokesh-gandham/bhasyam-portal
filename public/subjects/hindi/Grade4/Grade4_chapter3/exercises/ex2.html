<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
   <link rel="stylesheet" href="../assets/CSS/ex2.css">
   <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

   <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

<div class="quiz">

    <div class="question-box">
        दिए गए शब्दों में से संज्ञा शब्द पर क्लिक कीजिए।  
    </div>

    <div
        class="options-list"
        id="optionsList"
    >
    </div>

    <div class="nav-area">

        <button
            class="nav-btn prev-btn"
            id="prevBtn"
        >
            ◀ पिछला
        </button>

        <button
            class="nav-btn next-btn"
            id="nextBtn"
            disabled
        >
            अगला ▶
        </button>

    </div>

</div>

<!-- POPUP -->

<div
    id="simpleEmojiPopup"
    class="emoji-popup-simple"
>

    <div
        class="popup-emoji-large"
        id="popupEmoji"
    >
        😊
    </div>

</div>

<!-- FINAL POPUP -->

<div
    id="finalPopup"
    class="final-popup-overlay"
>

    <div class="final-popup">

        <h2>
            🎉 बहुत बहुत बधाई! 🎉
        </h2>

        <div class="final-stars">
            ⭐⭐⭐⭐⭐
        </div>

        <p>
            आपने सभी प्रश्नों के सही उत्तर दिए!
        </p>

        <p>
            ✨ आप होशियार हो! ✨
        </p>

        <button
            class="popup-playagain-btn"
            onclick="location.reload()"
        >
            🔄 फिर से खेलें
        </button>

    </div>

</div>

<script src="../assets/js/ex2.js">
</script>

</body>
</html>
