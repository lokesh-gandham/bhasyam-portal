<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
       <link rel="stylesheet" href="../assets/CSS/image.css">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
   
       <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>
<body>

<div class="quiz">
    <div class="question-box" id="question">चित्र देख कर सही समय का अंदाजा लगाइए।</div>

    <div class="quiz-layout">
        <!-- LEFT SECTION - Image -->
        <div class="left-section">
            <img id="meaningImage" src="" alt="Picture" class="meaning-image">
        </div>

        <!-- RIGHT SECTION - Answer Box & Options -->
        <div class="right-section">
            <div class="answer-box" id="answerBox">
                <div class="answer-text" id="answerText">???</div>
            </div>
            <div class="options-title">✨ सही अक्षर चुनिए ✨</div>
            <div class="options-list" id="optionsList"></div>
        </div>
    </div>

    <div class="nav-area">
        <button class="nav-btn prev-btn" id="prevBtn">◀ पिछला</button>
        <button class="nav-btn next-btn" id="nextBtn" disabled>अगला ▶</button>
    </div>
</div>

<!-- SIMPLE EMOJI POPUP -->
<div id="simpleEmojiPopup" class="emoji-popup-simple">
    <div class="popup-emoji-large" id="popupEmoji">😊</div>
</div>

<!-- FINAL POPUP -->
<div id="finalPopup" class="final-popup-overlay">
    <div class="final-popup">
        <h2>🎉 बहुत बहुत बधाई! 🎉</h2>
        <div class="final-stars">⭐⭐⭐⭐⭐</div>
        <p>आपने सभी शब्द सही बनाए!</p>
        <p>✨ आप होशियार हो! ✨</p>
        <button class="popup-playagain-btn" id="playAgainBtn">🔄 फिर से खेलें</button>
    </div>
</div>

<script src="../assets/js/image.js">
  
</script>
</body>
</html>
