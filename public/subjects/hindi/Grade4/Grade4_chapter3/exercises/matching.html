<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
   <link rel="stylesheet" href="../assets/CSS/matching.css">
   <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


   <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

<div class="container">

    <div class="question-box">
        वाक्यांशों की सही जोड़ी बनाइए।
    </div>

    <div class="match-wrapper">

        <svg id="svgLines"></svg>

        <div class="matching-area">

            <!-- LEFT -->

            <div class="left-side">

                <div class="item">

                    <div class="image-box">
                        <img src="../assets/images/sun1.png">
                    </div>

                    <div class="text-box">
                        पूरब में सूरज

                        <div class="dot"
                             data-match="उगता है।">
                        </div>
                    </div>

                </div>

                <div class="item">

                    <div class="image-box">
                        <img src="../assets/images/boy.png">
                    </div>

                    <div class="text-box">
                        सूरज के आने पर

                        <div class="dot"
                             data-match="सुस्ती नहीं रहती।">
                        </div>
                    </div>

                </div>

                <div class="item">

                    <div class="image-box">
                        <img src="../assets/images/bird.png">
                    </div>

                    <div class="text-box">
                        चिड़ियाँ

                        <div class="dot"
                             data-match="गाती हैं।">
                        </div>
                    </div>

                </div>

                <div class="item">

                    <div class="image-box">
                        <img src="../assets/images/flower.png">
                    </div>

                    <div class="text-box">
                        कलियाँ

                        <div class="dot"
                             data-match="खिलती हैं।">
                        </div>
                    </div>

                </div>

                <div class="item">

                    <div class="image-box">
                        <img src="../assets/images/rat.png">
                    </div>

                    <div class="text-box">
                        पश्चिम में

                        <div class="dot"
                             data-match="सूरज ढलता है।">
                        </div>
                    </div>

                </div>

            </div>

            <!-- RIGHT -->

            <div class="right-side">

                <div class="item">
                    <div class="text-box answer">
                        सुस्ती नहीं रहती।
                        <div class="dot right-dot"></div>
                    </div>
                </div>

                <div class="item">
                    <div class="text-box answer">
                        खिलती हैं।
                        <div class="dot right-dot"></div>
                    </div>
                </div>

                <div class="item">
                    <div class="text-box answer">
                        उगता है।
                        <div class="dot right-dot"></div>
                    </div>
                </div>

                <div class="item">
                    <div class="text-box answer">
                        सूरज ढलता है।
                        <div class="dot right-dot"></div>
                    </div>
                </div>

                <div class="item">
                    <div class="text-box answer">
                        गाती हैं।
                        <div class="dot right-dot"></div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

<!-- EMOJI POPUP -->

<div class="emoji-popup" id="emojiPopup">

    <div class="popup-emoji">
        🎉😍✨
    </div>

</div>

<!-- FINAL POPUP -->

<div id="finalPopup" class="final-popup-overlay">

    <div class="final-popup-box">

        <h2>
            🎉 बहुत बहुत बधाई! 🎉
        </h2>

        <div class="final-stars">
            ⭐⭐⭐⭐⭐
        </div>

        <p>
            आपने सभी मिलान पूरे किए!
        </p>

        <p>
            ✨ आप बहुत होशियार हो! ✨
        </p>

        <button
            class="popup-playagain-btn"
            onclick="location.reload()"
        >
            🔄 फिर से खेलें
        </button>

    </div>

</div>

<script src="../assets/js/matching.js">

</script>

</body>
</html>
