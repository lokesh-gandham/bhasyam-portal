<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Tiro Devanagari Hindi";
        }

        body {
            height: 100vh;
            overflow: hidden;

            background:
                linear-gradient(135deg,
                    #FFEFF8 0%,
                    #FFF9EE 40%,
                    #F2FCFF 100%);

            background-size: 100% 100%;
            position: relative;
        }

        /* ================= APP ================= */

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ================= TOPBAR ================= */

        .topbar {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 95px;
            position: relative;
            z-index: 100;
            padding: 8px 12px;
        }

        /* ================= NAV GROUP ================= */

        .nav-group {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: start;
            gap: 8px;

            width: 100%;
            max-width: 1300px;

            padding: 10px 14px;

            border-radius: 60px;

            background:
                rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(18px);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.12),
                inset 0 2px 4px rgba(255, 255, 255, 0.8);

            /* UPDATED SCROLL */

            overflow-x: auto;
            overflow-y: hidden;

            scroll-behavior: smooth;

            white-space: nowrap;

            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .nav-group::-webkit-scrollbar {
            display: none;
        }

        /* ================= NAV SLIDER ================= */

        .nav-slider {
            position: absolute;
            top: 8px;
            left: 0;

            height: calc(100% - 16px);

            border-radius: 40px;

            transition:
                transform .45s cubic-bezier(.22, 1, .36, 1),
                width .45s cubic-bezier(.22, 1, .36, 1);

            background-color: #ffb7d5;

            background-size: 300% 300%;

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.12);

            z-index: 1;
        }

        /* ================= BUTTONS ================= */

        .island-btn {

            /* UPDATED */

            flex: none;

            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 12px 16px;

            height: 58px;

            font-size: 15px !important;
            font-weight: 400;

            cursor: pointer;

            border-radius: 40px;

            white-space: nowrap;

            transition: all .25s ease;

            background: transparent;

            color: #555;

            border: none;

            letter-spacing: .2px;
        }

        .island-btn i {
            font-size: 18px;
            transition: .25s ease;
        }

        .island-btn:hover {
            transform: translateY(-3px) scale(1.03);
        }

        .island-btn:hover i {
            transform: rotate(-8deg) scale(1.12);
        }

        .island-btn.active {
            color: white;
        }

        /* ================= MAIN ================= */

        .main {
            flex: 1;
            display: none;
            position: relative;
            overflow: hidden;
            perspective: 1800px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;

            transform-origin: left center;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        /* ================= PAGE TURN ================= */

        .page-turn {
            animation: bookPageTurn .75s cubic-bezier(.22, 1, .36, 1);
        }

        @keyframes bookPageTurn {

            0% {
                opacity: .15;
                transform:
                    rotateY(-80deg) scale(.96);
                filter: blur(2px);
            }

            40% {
                opacity: .5;
            }

            100% {
                opacity: 1;
                transform:
                    rotateY(0deg) scale(1);
                filter: blur(0px);
            }

        }

        /* ================= MOBILE MENU ================= */

        .menu-btn {
            display: none;

            position: fixed;
            top: 20px;
            right: 20px;

            background:
                linear-gradient(135deg,
                    #ffb7d5,
                    #a0c4ff);

            border: none;

            font-size: 30px;

            padding: 12px 20px;

            border-radius: 22px;

            color: white;

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.2);

            cursor: pointer;

            z-index: 5000;

            transition: .2s ease;
        }

        .menu-btn:active {
            transform: scale(.94);
        }

        /* ================= OFFCANVAS ================= */

        .offcanvas {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(6px);

            display: none;

            z-index: 4000;
        }

        .offcanvas.show {
            display: block;
        }

        .offcanvas-panel {

            position: absolute;
            right: 0;
            top: 0;

            width: 280px;
            height: 100%;

            padding: 80px 20px 30px;

            display: flex;
            flex-direction: column;
            gap: 16px;

            background:
                linear-gradient(180deg,
                    #fff0f7,
                    #eef7ff);

            transform: translateX(100%);

            transition: .35s cubic-bezier(.22, 1, .36, 1);

            overflow-y: auto;

            box-shadow:
                -8px 0 30px rgba(0, 0, 0, 0.15);
        }

        .offcanvas.show .offcanvas-panel {
            transform: translateX(0);
        }

        .offcanvas-panel .island-btn {

            flex: none;

            height: 58px;

            justify-content: flex-start;

            padding-left: 20px;

            background: white;

            border-radius: 22px;

            box-shadow:
                0 6px 16px rgba(0, 0, 0, 0.08);

            color: #555;
        }

        .offcanvas-panel .island-btn.active {

            background:
                linear-gradient(135deg,
                    #ffb7d5,
                    #a0c4ff);

            color: white;
        }

        /* ================= MEDIA ================= */

        @media (max-width:1000px) {

            .topbar {
                display: none;
            }

            .menu-btn {
                display: block;
            }

            .offcanvas-panel {
                width: 280px;
            }

        }

        @media (max-width:550px) {

            .offcanvas-panel {
                width: 75%;
            }

            .offcanvas-panel .island-btn {
                font-size: 16px;
                padding: 14px 18px;
            }

            .menu-btn {
                font-size: 28px;
                padding: 10px 18px;
                top: 15px;
                right: 15px;
            }

        }

        /* Responsive scaling */

        @media (min-width:900px) and (max-height:800px) {

            .app {
                transform: scaleY(0.95);
                transform-origin: top center;
                height: calc(100vh / 0.95);
            }

        }

        @media (min-width:900px) and (max-height:700px) {

            .app {
                transform: scaleY(0.9);
                transform-origin: top center;
                height: calc(100vh / 0.9);
            }

        }

        @media (min-width:900px) and (max-height:600px) {

            .app {
                transform: scaleY(0.85);
                transform-origin: top center;
                height: calc(100vh / 0.85);
            }

        }

        @media (min-width:900px) and (max-height:500px) {

            .app {
                transform: scaleY(0.8);
                transform-origin: top center;
                height: calc(100vh / 0.8);
            }

        }

        /* Desktop */

        @media screen and (min-width:1025px) and (max-width:1440px) {

            .nav-group {
                max-width: 1350px;
                gap: 10px;
            }

            .island-btn {
                font-size: 17px;
                padding: 15px 20px;
                gap: 8px;
            }

            .topbar {
                height: 85px;
            }

        }

        @media screen and (min-width:1441px) and (max-width:1920px) {

            .nav-group {
                max-width: 1750px;
                gap: 18px;
                padding: 12px 20px;
            }

            .island-btn {
                font-size: 18px;
                padding: 16px 24px;
                gap: 14px;
            }

            .topbar {
                height: 105px;
            }

        }

        @media screen and (min-width:1921px) {

            .nav-group {
                max-width: 1750px;
                gap: 28px;
                padding: 18px 28px;
            }

            .island-btn {
                font-size: 22px;
                padding: 20px 32px;
                gap: 18px;
            }

            .topbar {
                height: 125px;
            }

            .main {
                padding: 0;
            }

        }

        /* ================= FLOAT ================= */

        @keyframes floaty {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-4px);
            }

            100% {
                transform: translateY(0px);
            }
        }
    </style>
            <link rel="stylesheet" href="assets/css/walkman-font.css">
</head>

<body>

    <button class="menu-btn" onclick="toggleMenu()">

        <i class="fa-solid fa-bars"></i>

    </button>

    <div class="app">

        <div class="topbar">

            <div class="nav-group" id="navGroup">

                <div class="nav-slider" id="navSlider"></div>

                <div class="island-btn active" onclick="openIsland(0)">
                    <i class="fa-solid fa-check"></i>
                    सही विकल्प
                </div>
                 <div class="island-btn" onclick="openIsland(1)">
                    <i class="fa-solid fa-circle-check"></i>
                    रिक्त स्थान भरें
                </div>
  <div class="island-btn" onclick="openIsland(2)">
                    <i class="fa-solid fa-puzzle-piece"></i>
                    मिलान
                </div>
              

               

                <div class="island-btn" onclick="openIsland(3)">
                    <i class="fa-solid fa-pencil"></i>
                    मिलते-जुलते
                </div>

                  <div class="island-btn" onclick="openIsland(4)">
                    <i class="fa-solid fa-bullseye"></i>
                    चित्र पर गोला
                </div>

                 <div class="island-btn" onclick="openIsland(5)">
                    <i class="fa-solid fa-link"></i>
                    मिलान
                </div>

                <div class="island-btn" onclick="openIsland(6)">
                    <i class="fa-solid fa-children"></i>
                    संज्ञा शब्द
                </div>

              
               

                <div class="island-btn" onclick="openIsland(7)">
                    <i class="fa-solid fa-circle-check"></i>
                    हा/नहीं
                </div>

                <div class="island-btn" onclick="openIsland(8)">
                    <i class="fa-solid fa-link"></i>
                    मिलान
                </div>

                <div class="island-btn" onclick="openIsland(9)">
                    <i class="fa-solid fa-link"></i>
                    अंक
                </div>

            </div>
        </div>

        <div class="main">

            <iframe id="contentFrame" src="./exercises/mcq.html">
            </iframe>

        </div>

    </div>

    <!-- ================= MOBILE ================= -->

    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

        <div class="offcanvas-panel" onclick="event.stopPropagation()">

            <div class="island-btn active" onclick="mobileOpen(0)">
                <i class="fa-solid fa-check"></i>
                सही विकल्प
            </div>

            

            <div class="island-btn" onclick="mobileOpen(1)">
                <i class="fa-solid fa-circle-check"></i>
                रिक्त स्थान भरें
            </div>

            <div class="island-btn" onclick="mobileOpen(2)">
                <i class="fa-solid fa-puzzle-piece"></i>
                मिलान
            </div>

            <div class="island-btn" onclick="mobileOpen(3)">
                <i class="fa-solid fa-pencil"></i>
                मिलते-जुलते
            </div>
 <div class="island-btn" onclick="mobileOpen(4)">
                <i class="fa-solid fa-bullseye"></i>
                चित्र पर गोला
            </div>

            
            <div class="island-btn" onclick="mobileOpen(5)">
                <i class="fa-solid fa-link"></i>
                मिलान
            </div>
            <div class="island-btn" onclick="mobileOpen(6)">
                <i class="fa-solid fa-children"></i>
                संज्ञा शब्द
            </div>

           


            <div class="island-btn" onclick="mobileOpen(7)">
                <i class="fa-solid fa-circle-check"></i>
                हा/नहीं
            </div>

            <div class="island-btn" onclick="mobileOpen(8)">
                <i class="fa-solid fa-link"></i>
                मिलान
            </div>

            <div class="island-btn" onclick="mobileOpen(9)">
                <i class="fa-solid fa-link"></i>
                मिलान
            </div>

        </div>
    </div>

    <script>

        const sidebarButtons =
            document.querySelectorAll(
                ".topbar .island-btn"
            );

        const mobileButtons =
            document.querySelectorAll(
                ".offcanvas .island-btn"
            );

        const slider =
            document.getElementById(
                "navSlider"
            );

        const frame =
            document.getElementById(
                "contentFrame"
            );

        const navGroup =
            document.getElementById(
                "navGroup"
            );

        const pages = [

            "./exercises/mcq.html",
            "./exercises/fill.html",
            "./exercises/matching1.html",
            "./exercises/same_same.html",
            "./exercises/puzzel.html",
            "./exercises/matching2.html",
            "./exercises/sngya.html",
            "./exercises/hanhi.html",
            "./exercises/matching3.html",
            "./exercises/digits.html"

        ];

        /* ================= SLIDER ================= */

        function moveSlider(el) {

            if (!el) return;

            const containerRect =
                el.parentElement
                    .getBoundingClientRect();

            const btnRect =
                el.getBoundingClientRect();

            let relativeLeft =
                (btnRect.left -
                    containerRect.left)
                +
                navGroup.scrollLeft;

            slider.style.width =
                el.offsetWidth + "px";

            slider.style.transform =
                `translateX(${relativeLeft}px)`;

        }

        /* ================= AUTO SCROLL ================= */

        function scrollActiveButton(el) {

            if (!el) return;

            el.scrollIntoView({

                behavior: "smooth",
                inline: "center",
                block: "nearest"

            });

        }

        /* ================= OPEN PAGE ================= */

        function openIsland(index) {

            sidebarButtons.forEach(btn =>
                btn.classList.remove("active"));

            mobileButtons.forEach(btn =>
                btn.classList.remove("active"));

            if (sidebarButtons[index])
                sidebarButtons[index]
                    .classList.add("active");

            if (mobileButtons[index])
                mobileButtons[index]
                    .classList.add("active");

            const activeBtn =
                sidebarButtons[index];

            if (activeBtn) {

                moveSlider(activeBtn);

                scrollActiveButton(activeBtn);

            }

            if (pages[index]) {

                frame.classList.remove(
                    "page-turn"
                );

                void frame.offsetWidth;

                frame.src = pages[index];

                frame.classList.add(
                    "page-turn"
                );

            }

        }

        /* ================= MOBILE ================= */

        function toggleMenu() {

            if (window.innerWidth > 1000)
                return;

            const offcanvas =
                document.getElementById(
                    "offcanvas"
                );

            offcanvas.classList.toggle(
                "show"
            );

        }

        function mobileOpen(i) {

            openIsland(i);

            toggleMenu();

        }

        /* ================= INIT ================= */

        window.onload = () => {

            document
                .querySelectorAll(".main")
                .forEach(m =>
                    m.style.display = "flex"
                );

            if (sidebarButtons.length &&
                sidebarButtons[0]) {

                moveSlider(
                    sidebarButtons[0]
                );

            }

            frame.src = pages[0];

        };

        /* ================= RESIZE ================= */

        let resizeTimer;

        window.addEventListener(
            'resize',
            () => {

                clearTimeout(resizeTimer);

                resizeTimer =
                    setTimeout(() => {

                        const activeIndex =
                            Array.from(sidebarButtons)
                                .findIndex(btn =>
                                    btn.classList.contains(
                                        'active'
                                    ));

                        if (activeIndex !== -1 &&
                            sidebarButtons[activeIndex]) {

                            moveSlider(
                                sidebarButtons[
                                activeIndex
                                ]
                            );

                        }

                    }, 120);

            });

    </script>


</body>

</html>
