<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<link rel="stylesheet" href="../assets/css/matching1.css">
<link rel="stylesheet" href="../assets/css/walkman-font.css">
</head>

<body>

<div class="container">

    <div class="question-box">
      वाक्योंशों की सही जोड़ी बनाइए।
    </div>

    <div class="match-wrapper">

        <svg id="svgLines"></svg>

        <div class="matching-area">

            <!-- LEFT -->

            <div class="left-side">

                <div class="item">

                    <div class="image-box">
                        <img src="../assets/images/welcome.png">
                    </div>

                    <div class="text-box">
                       दरबार में एक

                        <div class="dot"
                             data-match="राजकवि आए।">
                        </div>
                    </div>

                </div>

                <div class="item">

                    <div class="image-box">
                        <img src="../assets/images/pradam1.png">
                    </div>

                    <div class="text-box">
                        आशीर्वाद दिया

                        <div class="dot"
                             data-match="आपके शत्रु चिरंजीव रहें।">
                        </div>
                    </div>

                </div>

                <div class="item">

                    <div class="image-box">
                        <img src="../assets/images/raja-angry.png">
                    </div>

                    <div class="text-box">
                       राजा भी राजकवि से

                        <div class="dot"
                             data-match="नाराज़ हो गया।">
                        </div>
                    </div>

                </div>

                <div class="item">

                    <div class="image-box">
                        <img src="../assets/images/relex.png">
                    </div>

                    <div class="text-box">
                        समझाया – शत्रु रहने पर

                        <div class="dot"
                             data-match="सावधानी बनी रहती है।">
                        </div>
                    </div>

                </div>

                <div class="item">

                    <div class="image-box">
                        <img src="../assets/images/gift.png">
                    </div>

                    <div class="text-box">
                       राजा ने संतुष्ट होकर

                        <div class="dot"
                             data-match="राजकवि को उपहार दिया।">
                        </div>
                    </div>

                </div>

            </div>

            <!-- RIGHT -->

            <div class="right-side">

                <div class="item">
                    <div class="text-box answer">
                       नाराज़ हो गया।
                        <div class="dot right-dot"></div>
                    </div>
                </div>

                <div class="item">
                    <div class="text-box answer">
                        सावधानी बनी रहती है।
                        <div class="dot right-dot"></div>
                    </div>
                </div>

                <div class="item">
                    <div class="text-box answer">
                        राजकवि आए।
                        <div class="dot right-dot"></div>
                    </div>
                </div>

                <div class="item">
                    <div class="text-box answer">
                       राजकवि को उपहार दिया।
                        <div class="dot right-dot"></div>
                    </div>
                </div>

                <div class="item">
                    <div class="text-box answer">
                        आपके शत्रु चिरंजीव रहें।
                        <div class="dot right-dot"></div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

<!-- EMOJI POPUP -->

<div class="emoji-popup" id="emojiPopup">

    <div class="popup-emoji">
        🎉😍✨
    </div>

</div>

<!-- FINAL POPUP -->

<div id="finalPopup" class="final-popup-overlay">

    <div class="final-popup-box">

        <h2>
            🎉 बहुत बहुत बधाई! 🎉
        </h2>

        <div class="final-stars">
            ⭐⭐⭐⭐⭐
        </div>

        <p>
            आपने सभी मिलान पूरे किए!
        </p>

        <p>
            ✨ आप बहुत होशियार हो! ✨
        </p>

        <button
            class="popup-playagain-btn"
            onclick="location.reload()"
        >
            🔄 फिर से खेलें
        </button>

    </div>

</div>
<script src="../assets/JavaScript/matching1.js"></script>


</body>
</html>
