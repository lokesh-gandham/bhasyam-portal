<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
<link rel="stylesheet" href="../assets/css/matching2.css">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>




<link rel="stylesheet" href="../assets/css/walkman-font.css">
</head>

<body>

<div class="container">

    <div class="question-box">
        चित्रों को सही लिंग परिवर्तन से मिलाइए।

    </div>

    <div class="match-wrapper">

        <svg id="svgLines"></svg>

        <div class="matching-area">

            <!-- LEFT -->

         <!-- LEFT -->

<div class="left-side">

    <div class="item">

        <div class="image-box">
            <img src="../assets/images/woman.png">
        </div>

        <div class="text-box">

            औरत

            <div class="dot"
                 data-match="आदमी">
            </div>

        </div>

    </div>

    <div class="item">

        <div class="image-box">
            <img src="../assets/images/gay.png">
        </div>

        <div class="text-box">

            गाय

            <div class="dot"
                 data-match="बैल">
            </div>

        </div>

    </div>

    <div class="item">

        <div class="image-box">
            <img src="../assets/images/mor1.png">
        </div>

        <div class="text-box">

            मोर

            <div class="dot"
                 data-match="मोरनी">
            </div>

        </div>

    </div>

    <div class="item">

        <div class="image-box">
            <img src="../assets/images/sherni.png">
        </div>

        <div class="text-box">

            शेरनी

            <div class="dot"
                 data-match="शेर">
            </div>

        </div>

    </div>

</div>

            <!-- RIGHT -->

       <!-- RIGHT -->

<div class="right-side">

    <div class="item">

        <div class="image-box">
            <img src="../assets/images/morni.png">
        </div>

        <div class="text-box answer">

            मोरनी

            <div class="dot right-dot"></div>

        </div>

    </div>

    <div class="item">

        <div class="image-box">
            <img src="../assets/images/sher.png">
        </div>

        <div class="text-box answer">

            शेर

            <div class="dot right-dot"></div>

        </div>

    </div>

    <div class="item">

        <div class="image-box">
            <img src="../assets/images/bel.png">
        </div>

        <div class="text-box answer">

            बैल

            <div class="dot right-dot"></div>

        </div>

    </div>

    <div class="item">

        <div class="image-box">
            <img src="../assets/images/aadmi.png">
        </div>

        <div class="text-box answer">

            आदमी

            <div class="dot right-dot"></div>

        </div>

    </div>

</div>

        </div>

    </div>

</div>

<!-- EMOJI POPUP -->

<div class="emoji-popup" id="emojiPopup">

    <div class="popup-emoji">
        🎉😍✨
    </div>

</div>

<!-- FINAL POPUP -->

<div id="finalPopup" class="final-popup-overlay">

    <div class="final-popup-box">

        <h2>
            🎉 शाबाश! 🎉
        </h2>

        <div class="final-stars">
            ⭐⭐⭐⭐⭐
        </div>

        <p>
            आपके सभी उत्तर सही हैं!
        </p>

        <p>
            ✨ ऐसे ही खेलते रहिए और सीखते रहिए!  ✨
        </p>

        <button
            class="popup-playagain-btn"
            onclick="location.reload()"
        >
            🔄 फिर से खेलें
        </button>

    </div>

</div>
<script src="../assets/JavaScript/matching2.js"></script>
</body>
</html>
