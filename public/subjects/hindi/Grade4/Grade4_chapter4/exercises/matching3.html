<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
 <link rel="stylesheet" href="../assets/css/matching3.css">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

 <link rel="stylesheet" href="../assets/css/walkman-font.css">
</head>

<body>

<div class="container">

    <div class="question-box">
        अंकों को सही नाम से मिलान कीजिए।
    </div>

    <div class="match-wrapper">

        <svg id="svgLines"></svg>

        <div class="matching-area">

            <div class="left-side" id="leftSide"></div>

            <div class="center-side" id="centerWords"></div>

            <div class="right-side" id="rightSide"></div>

        </div>

    </div>

</div>

<!-- POPUP -->

<div id="emojiPopup" class="emoji-popup">
    <div class="popup-emoji" id="popupEmoji">😊</div>
</div>

<!-- FINAL POPUP -->

<div id="finalPopup" class="final-popup-overlay">

    <div class="final-popup">

        <h2>🎉 शाबाश! 🎉</h2>

        <div class="final-stars">⭐⭐⭐⭐</div>

        <p>आपके सभी उत्तर सही हैं!!</p>

        <p>✨ ऐसे ही खेलते रहिए और सीखते रहिए! ! ✨</p>

        <button class="popup-playagain-btn"
        onclick="location.reload()">

            🔄 फिर से खेलें

        </button>

    </div>

</div>

<script src="../assets/JavaScript/matching3.js">

</script>

</body>
</html>
