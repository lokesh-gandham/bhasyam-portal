<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
    <link rel="stylesheet" href="../assets/css/mcq.css">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
 
    <link rel="stylesheet" href="../assets/css/walkman-font.css">
</head>
<body>

<div class="quiz">
    <!-- 1. QUESTION BOX (header badge) -->
    <div class="question-box">
        प्रश्नों के सही उत्तर पर क्लिक कीजिए।

    </div>

    <!-- 2. QUESTION TEXT -->
    <div class="question-text" id="questionText"></div>

    <!-- 3. QUESTION IMAGE -->
    <div class="image-wrapper">
        <img id="questionImage" src="" alt="प्रश्न चित्र" class="question-image">
    </div>

    <!-- 4. OPTIONS LIST -->
    <div class="options-list" id="optionsList"></div>

    <!-- 5. NAVIGATION BUTTONS -->
    <div class="nav-area">
        <button class="nav-btn prev-btn" id="prevBtn" disabled>◀ पिछला</button>
        <button class="nav-btn next-btn" id="nextBtn" disabled>अगला ▶</button>
    </div>
</div>

<!-- SIMPLE EMOJI POPUP -->
<div id="simpleEmojiPopup" class="emoji-popup-simple">
    <div class="popup-emoji-large" id="popupEmoji">😊</div>
</div>

<!-- FINAL POPUP -->
<div id="finalPopup" class="final-popup-overlay">
    <div class="final-popup">
        <h2>🎉 शाबाश! 🎉</h2>
        <div class="final-stars">⭐⭐⭐⭐⭐</div>
        <p>आपके सभी उत्तर सही हैं!</p>
        <p>✨ ऐसे ही खेलते रहिए और सीखते रहिए! ✨</p>
        <button class="popup-playagain-btn" id="playAgainBtn">🔄 फिर से खेलें</button>
    </div>
</div>

<script src="../assets/JavaScript/mcq.js">
 
</script>
</body>
</html>
