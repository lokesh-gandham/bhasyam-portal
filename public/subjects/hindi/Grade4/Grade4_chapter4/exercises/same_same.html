<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
    <link rel="stylesheet" href="../assets/css/same_same.css">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
 
    <link rel="stylesheet" href="../assets/css/walkman-font.css">
</head>
<body>

<div class="quiz">
    <div class="question-box">
        मिलते-जुलते शब्दों को सही स्थान में लिखिए।

    </div>

    <div class="quiz-layout">
        <!-- LEFT SECTION - Text above Image -->
        <div class="left-section">
            <div class="question-above-image" id="questionAboveImage">
                इस शब्द का अंग्रेजी अर्थ क्या है?
            </div>
            <div class="hindi-word" id="hindiWord">स्वागत</div>
            <img id="wordImage" src="" alt="Word Image" class="word-image">
            
        </div>

        <!-- RIGHT SECTION - Options -->
        <div class="right-section">
            <div class="options-title">✨ सही अंग्रेजी अर्थ चुनिए ✨</div>
            <div class="options-list" id="optionsList"></div>
        </div>
    </div>

    <div class="nav-area">
        <button class="nav-btn prev-btn" id="prevBtn" disabled>◀ पिछला</button>
        <button class="nav-btn next-btn" id="nextBtn" disabled>अगला ▶</button>
    </div>
</div>

<!-- SIMPLE EMOJI POPUP -->
<div id="simpleEmojiPopup" class="emoji-popup-simple">
    <div class="popup-emoji-large" id="popupEmoji">😊</div>
</div>

<!-- FINAL POPUP -->
<div id="finalPopup" class="final-popup-overlay">
    <div class="final-popup">
        <h2>🎉 बहुत बहुत बधाई! 🎉</h2>
        <div class="final-stars">⭐⭐⭐⭐⭐</div>
        <p>आपने सभी शब्दों के सही अर्थ दिए!</p>
        <p>✨ आप होशियार हो! ✨</p>
        <button class="popup-playagain-btn" id="playAgainBtn">🔄 फिर से खेलें</button>
    </div>
</div>

<script src="../assets/JavaScript/same_same.js">
   
</script>
</body>
</html>
