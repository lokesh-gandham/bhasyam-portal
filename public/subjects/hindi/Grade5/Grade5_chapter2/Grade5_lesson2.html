<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Tiro Devanagari Hindi";

        }

        body {
            height: 100vh;
            overflow: hidden;
            /* background: url("./assets/images/bg4l4bg3.png"); */
            /* background: #fff7c7; */
            /* background: #fff5d6; */
            background: #f7f4ff;
            background-size: 100% 100%;
        }

        .app {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            justify-content: center;
            align-items: center;
            height: clamp(60px, 8vh, 90px);
            margin: 0 clamp(10px, 3vw, 20px);
        }

        .nav-group {
            position: relative;
            display: flex;

            align-items: center;
            justify-content: center;
            /* center items */
            gap: clamp(30px, 1.8vw, 40px);
            width: 100%;
            max-width: 1150px;
            padding: clamp(6px, 1vw, 10px);
            margin-top: 20px;
        }

        /* .nav-slider {
            position: absolute;
            top: 10px;
            left: 10px;
            height: calc(100% - 20px);
            border-radius: 12px;
            transition: transform .45s cubic-bezier(.65, .05, .36, 1), width .35s ease;
            z-index: 1;
        } */
        .nav-slider {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            border-radius: 40px;
            transition: transform .45s cubic-bezier(.65, .05, .36, 1), width .35s ease;
            z-index: 0;
        }

        .island-btn {

            flex: 1;

            max-width: 240px;
            min-width: 140px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 15px 24px;

            font-size: 22px !important;
            font-weight: 500;

            cursor: pointer;

            border-radius: 28px 55px 32px 55px;

            white-space: nowrap;

            transition: all .35s ease;

            color: #3b3b3b;

            /* border: 3px solid rgba(255,255,255,0.7); */

            backdrop-filter: blur(8px);

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.08),
                inset 0 2px 4px rgba(255, 255, 255, 0.8);

            position: relative;
            overflow: hidden;

            z-index: 2;
        }


        /* ✨ glossy shine */
        .island-btn::before {

            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 80%;
            height: 100%;

            background: linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, 0.8),
                    transparent);

            transition: .6s;
        }

        .island-btn:hover::before {
            left: 130%;
        }


        .island-btn:hover {

            transform: translateY(-3px) scale(1.03);

            box-shadow:
                0 12px 24px rgba(0, 0, 0, 0.12),
                inset 0 2px 6px rgba(255, 255, 255, 0.9);
        }



        /* 🌈 ACTIVE BUTTON SUPER STYLE */

        .island-btn.active {

            /* color: white; */

            background: linear-gradient(135deg,
                    #ff7eb3,
                    #ff758c);

            border: 2px solid rgb(66, 64, 64);

            /* SAME SHAPE */
            border-radius: 28px 55px 32px 55px;

            box-shadow:
                0 8px 20px rgba(255, 120, 160, .35);

            transform: scale(1.02);
        }


        @keyframes activePop {

            from {
                transform: translateY(-2px) scale(1.03);
            }

            to {
                transform: translateY(-5px) scale(1.06);
            }
        }



        /* 🌸 PASTEL COLORS */

        .nav-group .island-btn:nth-child(1) {
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
        }

        .nav-group .island-btn:nth-child(2) {
            background: linear-gradient(135deg, #ffe0cc, #ffd6ba);
        }

        .nav-group .island-btn:nth-child(3) {
            background: linear-gradient(135deg, #d1fae5, #b7f7de);
        }

        .nav-group .island-btn:nth-child(4) {
            background: linear-gradient(135deg, #ffd6e7, #ffc2d8);
        }

        .nav-group .island-btn:nth-child(5) {
            background: linear-gradient(135deg, #ede9fe, #ddd6fe);
        }

        .nav-group .island-btn:nth-child(6) {
            background: linear-gradient(135deg, #d6f4ff, #bae6fd);
        }

        .main {
            flex: 1;
            padding: clamp(6px, 1vw, 10px) 0 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:900px) {



            .topbar {
                display: none;

            }

            .menu-btn {
                display: block;
                position: fixed;
                top: clamp(10px, 2vw, 15px);
                right: clamp(10px, 2vw, 15px);
                font-size: clamp(18px, 3vw, 24px);
                background: #f59e0b;
                color: white;
                border: none;
                border-radius: 8px;
                padding: clamp(4px, 1vw, 6px) clamp(8px, 2vw, 12px);
                cursor: pointer;
                z-index: 5000;
            }

            .offcanvas {
                position: fixed;
                inset: 0;
                background: linear-gradient(135deg,
                        #fdfbfb 0%,
                        #f7f3ff 25%,
                        #eef9f6 50%,
                        #fff6f0 75%,
                        #f0f7ff 100%);
                display: none;
                z-index: 4000;
                margin-top: 5%;

            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: clamp(220px, 70vw, 280px);
                height: 100%;
                /* background: linear-gradient(135deg, 
        #fdfbfb 0%,
        #f7f3ff 25%,
        #eef9f6 50%,
        #fff6f0 75%,
        #f0f7ff 100%
    ); */
                padding: clamp(20px, 4vw, 30px);
                padding-top: clamp(60px, 10vw, 80px);
                display: flex;
                flex-direction: column;
                gap: clamp(20px, 5vw, 50px);
                transform: translateX(100%);
                transition: .35s;
                overflow-y: auto;


            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
                display: flex;
                justify-content: flex-start;
                /* ✅ vertical center */
                align-items: flex-start;
                /* ✅ horizontal center */
            }

            .offcanvas-panel .island-btn {
                flex: none;
                width: 100%;
                justify-content: flex-start;
                padding: clamp(14px, 3vw, 18px) clamp(16px, 3vw, 20px);
                border-radius: 40px;
                font-size: clamp(13px, 2.5vw, 15px);
            }

            .offcanvas-panel .island-btn:nth-child(1) {
                background: #FFE3C8;
            }

            .offcanvas-panel .island-btn:nth-child(2) {
                background: #CFE8FF;
            }

            .offcanvas-panel .island-btn:nth-child(3) {
                background: #D7F7DC;
            }

            .offcanvas-panel .island-btn:nth-child(4) {
                background: #FFF2C6;
            }

            .offcanvas-panel .island-btn:nth-child(5) {
                background: #FFD8DD;
            }

            .offcanvas-panel .island-btn:nth-child(6) {
                background: #DCD6FF;
            }
        }

        /* 1200px → 1599px */

        @media (min-width: 1200px) and (max-width: 1599px) {

            .island-btn {
                font-size: 22px !important;
            }

        }



        /* 1600 → 1899 */
        @media (min-width: 1600px) {
            .nav-group {
                transform: scale(1.3);
                transform-origin: top center;
            }
        }

        /* 1900 → 2299 */
        @media (min-width: 1900px) {
            .nav-group {
                transform: scale(1.4);
                transform-origin: top center;
            }
        }

        /* 2300 → 2599 */
        @media (min-width: 2300px) {
            .nav-group {
                transform: scale(1.5);
                transform-origin: top center;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/CSS/walkman-font.css">
</head>

<body>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <div class="app">

        <div class="topbar">
            <div class="nav-group">

                <div class="nav-slider" id="navSlider"></div>


                <div class="island-btn active" onclick="openIsland(0)">
                    <i class="fa-solid fa-scale-balanced"></i>
                    मिलान कीजिए
                </div>


                <div class="island-btn " onclick="openIsland(1)">
                    <i class="fa-solid fa-list-check"></i>
                    सही विकल्प
                </div>


                <div class="island-btn" onclick="openIsland(2)">
                    <i class="fa-solid fa-gamepad"></i>
                    वर्णों के चिह्न चुनिए
                </div>

                <div class="island-btn" onclick="openIsland(3)">
                    <i class="fa-solid fa-dice"></i>
                    चिन्हों के वर्णों चुनिए
                </div>

                <!--      <div class="island-btn" onclick="openIsland(3)">
                  <i class="fa-solid fa-meteor"></i>
               बीच वाला शब्द 
                </div> -->





            </div>
        </div>

        <div class="main">
            <iframe id="contentFrame" src="./exercises/match.html"></iframe>
        </div>

    </div>

    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

        <div class="offcanvas-panel" onclick="event.stopPropagation()">

            <div class="island-btn  active" onclick="mobileOpen(0)">
                <i class="fa-solid fa-scale-balanced"></i>
                मिलान कीजिए
            </div>

            <div class="island-btn " onclick="mobileOpen(1)">
                <i class="fa-solid fa-list-check"></i>
                सही विकल्प
            </div>



            <div class="island-btn" onclick="mobileOpen(2)">
                <i class="fa-solid fa-gamepad"></i>
                वर्णों के चिह्न चुनिए
            </div>


            <div class="island-btn" onclick="mobileOpen(3)">
                <i class="fa-solid fa-dice"></i>
                चिन्हों के वर्णों चुनिए
            </div>


            <!--   <div class="island-btn" onclick="mobileOpen(3)">
               <i class="fa-solid fa-meteor"></i>
              बीच वाला शब्द लिखिए
            </div> -->





        </div>

    </div>

    <script>

        const sidebarButtons = document.querySelectorAll(".topbar .island-btn");
        const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");

        const slider = document.getElementById("navSlider");
        const frame = document.getElementById("contentFrame");

        const pages = [
            "./exercises/match.html",
            "./exercises/mcq.html",
            "./exercises/FTB.html",
            "./exercises/FTB2.html",
            //"./exercises/FTB3.html",



        ];

        function moveSlider(el) {
            slider.style.width = el.offsetWidth + "px";
            slider.style.transform = `translateX(${el.offsetLeft}px)`;
        }

        function openIsland(index) {
            sidebarButtons.forEach(btn => btn.classList.remove("active"));
            sidebarButtons[index].classList.add("active");

            mobileButtons.forEach(btn => btn.classList.remove("active"));
            mobileButtons[index].classList.add("active");

            moveSlider(sidebarButtons[index]);
            frame.src = pages[index];
        }

        function toggleMenu() {
            if (window.innerWidth > 900) return;
            document.getElementById("offcanvas").classList.toggle("show");
        }

        function mobileOpen(i) {
            openIsland(i);
            toggleMenu();
        }

        window.onload = () => {
            moveSlider(sidebarButtons[0]);
        };

    </script>


</body>

</html>
