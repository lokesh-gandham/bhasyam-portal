.container{
    max-width:1500px;
    margin:auto;
    margin-top: 20px;
}

/* QUESTION */

.question-box{
    font-size: 25px;

    position: relative;

    width: fit-content;

    padding: 10px 60px;
    margin: auto;

    margin-top: 1px ;

    border-radius: 24px;

    
    font-weight: 400;

    color: #4b4b63;

     background: #fffbfb;
     
 
    backdrop-filter: blur(16px);

    border: 2px solid rgba(255,255,255,0.7);

    box-shadow:
      0 8px 24px rgba(120,120,180,0.12),
      inset 0 1px 0 rgba(255,255,255,0.9);

    overflow: hidden;
    
    
}

/* STAGE */

.stage-title{
    text-align:center;
    font-size:50px;
    color:#ff1493;
    margin-bottom:40px;
    font-weight:bold;
    display: none;
}

/* MATCH AREA */

.match-wrapper{
    position:relative;
}

.matching-area{
    display:grid;
    grid-template-columns:1fr 300px 1fr;
    align-items:center;
    gap:70px !important;
    width:100%;
    margin-top: 10px;
   
}

/* SIDES */

.left-side,
.right-side{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.right-item{
    justify-content:flex-end;
    margin-right: 3%;
    flex-direction: row-reverse;
}

.right-number{
    width:40px;
    /* text-align:right; */
   
}

.center-side{
    display:flex;
    flex-direction:column;
    gap:10px;
    justify-content:center;
}

/* ITEM */

.item{
    display:flex;
    align-items:center;
    justify-content: center;
    gap:20px;
}

.number{
    font-size:22px;
    /* font-weight:bold; */
}

/* IMAGE */

.image-box{
    width:100px;
    height:90px !important;
    background:#fff5ea;
    border-radius:40px;
    /* padding:10px; */
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    border:4px solid transparent;
    transition:.3s;
    overflow:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,.05);
}

.image-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* WORD */

.word{
    background:#fcecf4;
    /* background-color: yellow; */
    width: 140px;
    height: 45px;
    margin: auto;
    border-radius:50px;
    padding:5px 20px;
    text-align:center;
    font-size:25px;
    font-weight:400;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 10px 22px rgba(0,0,0,.12);
}

.word:hover{
    transform:translateY(-4px);
}

.word.correct{
    background:#c7ffdb;
    outline:3px solid rgb(50,206,50);
    color:#222;
}

/* SVG */

svg{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

/* BUTTONS */

.next-buttons{
    margin-top:20px;
    display:flex;
    justify-content:space-around;
    gap:20px;
    width:100%;
    display: none;
}

.nav-btn{
    background:#ffb347;
    border:none;
    font-size:1.3rem;
    font-weight:bold;
    color:white;
    padding:12px 32px;
    border-radius:50px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 6px 0 #c25d1a;
    transition:.07s linear;
    display: none !important;
}

.nav-btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #c25d1a;
}

.nav-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:translateY(0);
    box-shadow:0 6px 0 #c25d1a;
}

/* EMOJI POPUP */

.emoji-popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(.8);
    background:white;
    border-radius:100px;
    padding:35px 50px;
    text-align:center;
    z-index:1500;
    opacity:0;
    visibility:hidden;
    transition:all .2s ease;
    box-shadow:0 25px 50px rgba(0,0,0,.3);
    min-width:200px;
}

.emoji-popup.active{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,-50%) scale(1);
}

.emoji-popup-correct{
    background:linear-gradient(135deg,#e8f8f0,#d4efdf);
    border:5px solid #2ecc71;
}

.emoji-popup-wrong{
    background:linear-gradient(135deg,#fdeded,#fadbd8);
    border:5px solid #e74c3c;
}

.popup-emoji{
    font-size:5.5rem;
    line-height:1.2;
}

/* FINAL POPUP */

.final-popup-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(5px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2000;
    visibility:hidden;
    opacity:0;
    transition:all .25s ease;
}

.final-popup-overlay.active{
    visibility:visible;
    opacity:1;
}

.final-popup p{

let currentStage = 0;

const leftSide =
document.getElementById("leftSide");

const centerWords =
document.getElementById("centerWords");

const prevBtn =
document.getElementById("prevBtn");

const svg =
document.getElementById("svgLines");

/* SOUND */

// ===== AUDIO =====
let audioCtx = null;

function playCorrectSound() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.frequency.value = 880;
    gainNode.gain.value = 0.2;
    oscillator.type = "sine";

    oscillator.start();

    gainNode.gain.exponentialRampToValueAtTime(
      0.00001,
      audioCtx.currentTime + 0.5
    );

    oscillator.stop(audioCtx.currentTime + 0.5);

  } catch (e) {
    console.log("Audio error:", e);
  }
}

function playWrongSound() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.frequency.value = 440;
    gainNode.gain.value = 0.25;
    oscillator.type = "sawtooth";

    oscillator.start();

    gainNode.gain.exponentialRampToValueAtTime(
      0.00001,
      audioCtx.currentTime + 0.4
    );

    oscillator.stop(audioCtx.currentTime + 0.4);

  } catch (e) {
    console.log("Audio error:", e);
  }
}

// Initialize audio
function initAudioOnFirstClick() {
  if (audioCtx) return;

  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const buffer = audioCtx.createBuffer(1, 1, 22050);
    const source = audioCtx.createBufferSource();

    source.buffer = buffer;
    source.connect(audioCtx.destination);
    source.start();

  } catch (e) {
    console.log("Audio init error:", e);
  }
}

document.body.addEventListener(
  "click",
  initAudioOnFirstClick,
  { once: true }
);

/* RESTORE */

function restoreStageProgress(){

    const saved =
    stageProgress[currentStage]
    .completedMatches;

    const words =
    document.querySelectorAll(".word");

    const images =
    document.querySelectorAll(".image-box");

    saved.forEach(match=>{

        const image =
        images[match.index];

        const word =
        [...words].find(w=>
            w.dataset.word === match.word
        );

        if(word){

            word.classList.add("correct");

            image.style.border =
            "4px solid #2ecc71";

            drawLine(image,word);
        }
    });
}

                    stageProgress[currentStage]
                    .completedMatches.length
                    ===
                    data.length
                ){

                    nextBtn.disabled = false;

                    // FINAL POPUP

/* DRAW LINE */

function drawLine(imageBox,word){

    const imageRect =
    imageBox.getBoundingClientRect();

    const wordRect =
    word.getBoundingClientRect();

    const svgRect =
    svg.getBoundingClientRect();
// const x1 =
// imageRect.right - 55 -
// svgRect.left;

// const x2 =
// wordRect.left - 1 -
// svgRect.left;

let x1;
let x2;

const isRightSide =
imageBox.closest(".right-side");

if(isRightSide){

    x1 =
    imageRect.left - 1 -
    svgRect.left;

    x2 =
    wordRect.right -1 -
    svgRect.left;

}else{

    x1 =
    imageRect.right - 1 -
    svgRect.left;

    x2 =
    wordRect.left - 1 -
    svgRect.left;
}

    const y1 =
    imageRect.top +
    imageRect.height/2 -
    svgRect.top;

   

    const y2 =
    wordRect.top +
    wordRect.height/2 -
    svgRect.top;

    const line =
    document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
    );

    line.setAttribute("x1",x1);

    line.setAttribute("y1",y1);

    line.setAttribute("x2",x2);

    line.setAttribute("y2",y2);

    line.setAttribute(
        "stroke",
        "#ff1493"
    );

    line.setAttribute(
        "stroke-width",
        "3"
    );

    svg.appendChild(line);
}
