    .sidebar {

      position: fixed;

      top: 10px;
      left: 50%;

      transform: translateX(-50%);

      width: 90%;
      max-width: 1450px;

      height: 90px;

      display: flex;
      align-items: center;

      overflow: hidden;
      /* IMPORTANT */

      padding: 0 70px;

      z-index: 1000;
    }

    .nav-scroll {

      display: flex;
      align-items: center;

      gap: 28px;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-behavior: smooth;

      white-space: nowrap;

      width: 100%;
      height: 100%;

      padding: 12px 20px;

    }

    /* hide scrollbar */

    .nav-scroll::-webkit-scrollbar {
      display: none;
    }

    /* 🔥 hide scrollbar */

    .sidebar::-webkit-scrollbar {
      height: 6px;
    }

    /* .sidebar::-webkit-scrollbar-thumb{
  background:#d7d7d7;
  border-radius:20px;
} */

    .sidebar::-webkit-scrollbar-track {

    /* MENU BUTTON */
    /* ===== MODERN PASTEL NAV BUTTON ===== */

    .menu-btn {
      flex-shrink: 0;
      width: 210px;
      height: 62px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      position: relative;
      overflow: hidden;

      border: none;
      border-radius: 20px;

      font-size: 22px !important;
      font-weight: 400;
      color: #3d4a63;

      cursor: pointer;
      transition: 0.35s ease;

      /* backdrop-filter:blur(10px); */

      /* box-shadow:
    0 8px 20px rgba(0,0,0,0.08),
    inset 0 2px 6px rgba(255,255,255,0.9); */

      /* ✨ NEW SHAPE */

    }

    /* ✨ SOFT SHINE */
    .menu-btn::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -120%;
      width: 80px;
      height: 220%;
      background: rgba(255, 255, 255, 0.5);
      transform: rotate(25deg);
      transition: 0.6s;
    }

    .menu-btn:hover::before {
      left: 130%;
    }

    /* ===== HOVER ===== */
    .menu-btn:hover {
      transform: translateY(-5px) scale(1.03);

      /* box-shadow:
    0 14px 25px rgba(0,0,0,0.12),
    inset 0 2px 8px rgba(255,255,255,0.9);
} */
    }

    /* ===== ACTIVE ===== */
    .menu-btn.active {
      border: 4px solid rgba(255, 255, 255, 0.8);

      transform: scale(1.04);
      /* 
  box-shadow:
    0 0 0 5px rgba(255,255,255,0.25),
    0 14px 28px rgba(0,0,0,0.12); */
    }

    /* ===== ICON ===== */
    .icon-box {
      width: 32px;
      height: 32px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.55);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
      color: #4d5b77;

      box-shadow:
        inset 0 2px 5px rgba(255, 255, 255, 0.9),
        0 3px 8px rgba(0, 0, 0, 0.08);
    }

    /* ===== ACTIVE BUTTON SUPER STYLE ===== */

      background: white !important;

      color: #222 !important;

      border: 4px solid white;

    /* ✨ ACTIVE ICON */

    .menu-btn.active .icon-box {

      background: linear-gradient(135deg, #6a8cff, #8ec5ff);

      color: white;

      /* transform:scale(1.15) rotate(-8deg); */

      box-shadow:
        0 8px 18px rgba(106, 140, 255, 0.4);
    }

    /* ✨ GLOW LINE */

    .menu-btn.active::after {
      content: "";

      position: absolute;

      bottom: 0;
      left: 50%;

      transform: translateX(-50%);

      width: 70%;
      height: 6px;

      border-radius: 20px;

      background: white;

      box-shadow: 0 0 15px white;
    }

    /* CONTENT */

    .content {
      flex: 1;
      position: relative;
      margin-top: 50px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* TOGGLE BUTTON (hidden by default) */

    .toggle-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: white;
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 1000;
    }


    /* ===== RIGHT SCROLL BUTTON ===== */

    .scroll-right {

      position: fixed;

      top: 18px;
      right: 12px;

      width: 44px;
      height: 44px;

      border: none;

      border-radius: 50%;

      cursor: pointer;

      z-index: 2000;

      color: white;

      font-size: 18px;

      background:
        linear-gradient(135deg,
          #8ec5ff,
          #6a8cff);

      box-shadow:
        0 8px 20px rgba(106, 140, 255, .28);

      transition: .25s ease;
    }

    /* hover */

    .scroll-right:hover {

      box-shadow:

    }

    /* MOBILE STYLES */

      /* body background fix */

        height: 100vh;

      }

        position: fixed;
        top: 0;
        left: -100%;
        /* 👈 hide full screen */
        width: 100%;
        height: 100vh;

        display: flex;
        flex-direction: column;
        /* ✅ vertical layout */
        justify-content: center;
        /* 👈 CENTER CONTENT */
        align-items: center;

        padding: 25px 15px;
        gap: 15px;

        background-color: #F2F7FF;
        transition: 0.3s ease;

        z-index: 999;
      }

      /* open sidebar */

      .sidebar.active {
        left: 0;
      }

      /* menu buttons */

      .menu-btn {
        width: 50%;
        height: 65px;

        justify-content: flex-start;
        /* 👈 align left */

        font-size: 16px;
        padding: 0 15px;

        border-radius: 20px !important;
      }

      /* icons */

      .icon-box {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }

      /* toggle button */

      .toggle-btn {
        display: block;
        background: #8b97ff;
        color: white;
        width: 42px;
        height: 42px;
        border-radius: 12px;
      }

      /* content area */

      .content {
        width: 100%;
        height: 100vh;
      }

      /* iframe */

      iframe {
        width: 100%;
        height: 100%;
        border: none !important;
      }

      /* spacing between menu items */

      .sidebar .menu-btn {
        margin-bottom: 12px;
      }

    }

      /* 🔥 SCROLL BUTTON */


      /* ===== BOTH SCROLL BUTTONS ===== */

      .scroll-left,

        position: fixed;

        top: 24px;

    }

    /* ===== BOTH SCROLL BUTTONS ===== */

    .scroll-left,

      transition: .25s ease;
    }

      pointer-events: none;
    }

    .scroll-right {

    }

    /* show left */

    .scroll-left.show {

      pointer-events: auto;

<body>

  <button class="toggle-btn" id="toggleBtn">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="sidebar">

    <div class="nav-scroll" id="navScroll">

      <div class="menu-btn color1 active" onclick="loadPage(this,'./exercises/mcq.html')">
        <div class="icon-box">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        सहीविकल्प
      </div>

      <div class="menu-btn color3" onclick="loadPage(this,'./exercises/matching.html')">
        <div class="icon-box">
          <i class="fa-solid fa-shuffle"></i>
        </div>
        पंक्तियों पूरी करो
      </div>

      <div class="menu-btn color4" onclick="loadPage(this,'./exercises/matching2.html')">
        <div class="icon-box">
          <i class="fa-solid fa-link"></i>
        </div>
        सही जोड़ी
      </div>


      <div class="menu-btn color2" onclick="loadPage(this,'./exercises/fillblanks.html')">
        <div class="icon-box">
          <i class="fa-solid fa-compass-drafting"></i>
        </div>
        रिक्त स्थान
      </div>

      <div class="menu-btn color4" onclick="loadPage(this,'./exercises/true_false.html')">
        <div class="icon-box">
          <i class="fa-solid fa-star-half-stroke"></i>
        </div>
        मिलते-जुलते शब्द
      </div>



      <div class="menu-btn color6" onclick="loadPage(this,'./exercises/one_example.html')">
        <div class="icon-box">
          <i class="fa-solid fa-thumbs-up"></i>
        </div>
        हाँ / नहीं
      </div>

      <div class="menu-btn color7" onclick="loadPage(this,'./exercises/mcq2.html')">
        <div class="icon-box">
          <i class="fa-solid fa-cloud-sun-rain"></i>
        </div>
        नाम वाले शब्द
      </div>

      <div class="menu-btn color8" onclick="loadPage(this,'./exercises/vilom.html')">
        <div class="icon-box">
          <i class="fa-solid fa-bezier-curve"></i>
        </div>
        विलोम शब्द
      </div>

      <div class="menu-btn color9" onclick="loadPage(this,'./exercises/bahuvachan.html')">
        <div class="icon-box">
          <i class="fa-solid fa-gamepad"></i>
        </div>
        बहुवचन शब्द
      </div>

      <div class="menu-btn color10" onclick="loadPage(this,'./exercises/kal.html')">
        <div class="icon-box">
          <i class="fa-solid fa-cloud-moon"></i>
        </div>
        काल लिखिए
      </div>




    </div>

  </div>

  <button class="scroll-left" id="scrollLeft">
    <i class="fa-solid fa-chevron-left"></i>
  </button>

  <button class="scroll-right" id="scrollRight">
    <i class="fa-solid fa-chevron-right"></i>
  </button>

  <div class="content">

    <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>

  </div>


  <script>

    const sidebar =
      document.getElementById("navScroll");

    const scrollRightBtn =
      document.getElementById("scrollRight");

    const scrollLeftBtn =
      document.getElementById("scrollLeft");

    /* RIGHT */

    scrollRightBtn.onclick = () => {

      sidebar.scrollBy({
        left: 300,
        behavior: "smooth"
      });

    };

    /* LEFT */

    scrollLeftBtn.onclick = () => {

      sidebar.scrollBy({
        left: -300,
        behavior: "smooth"
      });

    };

    /* AUTO SHOW/HIDE */

    sidebar.addEventListener("scroll", () => {

      /* show left button */

      if (sidebar.scrollLeft > 20) {

        scrollLeftBtn.classList.add("show");

      } else {

        scrollLeftBtn.classList.remove("show");
      }

      /* hide right at end */

      const maxScroll =
        sidebar.scrollWidth - sidebar.clientWidth;

      if (sidebar.scrollLeft >= maxScroll - 20) {

        scrollRightBtn.style.opacity = "0";
        scrollRightBtn.style.pointerEvents = "none";

      } else {

        scrollRightBtn.style.opacity = "1";
        scrollRightBtn.style.pointerEvents = "auto";
      }

    });

    /* ===== LOAD PAGE ===== */

    function loadPage(btn, url) {

      document
        .querySelectorAll('.menu-btn')
        .forEach(b => b.classList.remove('active'));

      btn.classList.add('active');

      document
        .getElementById('contentFrame')
        .src = url;

    }

  </script>
