
<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wise Wings</title>

    <link rel="icon" type="image/png" href="/iconsa1.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Tiro Devanagari Hindi", sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }


        /* =========================================================
           MAIN
        ========================================================= */

        .main {
            width: min(1000px, 94vw);
            min-height: 620px;
        margin-top:20px;
            padding: 24px;

            display: flex;
            flex-direction: column;

            border-radius: 24px;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .quiz-header {
            display: none;

            width: 100%;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .quiz-title {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            color: #3c5e3c;
        }

        .quiz-subtitle {
            font-size: 18px;
            margin-top: 4px;
        }

        .score-box {
            position: absolute;
            right: 0;
            top: 0;

            padding: 8px 18px;

            border-radius: 20px;

            background: #e98a9d;
            color: white;

            font-size: 18px;
            font-weight: 600;
        }


        /* =========================================================
           INSTRUCTION
        ========================================================= */

        .instruction-text {
            width: min(650px, 90%);

            margin: 0px auto 0px;

            padding: 10px 16px;

            text-align: center;

            font-size: 20px;
            font-weight: 400;

            color: #4b5563;

            background: #f3f4f6;

            border: 1px solid #4b5563;

            border-radius: 10px;
        }


        /* =========================================================
           QUESTION
        ========================================================= */

        .question {
            width: 100%;

            /* min-height: 105px; */
margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            /* padding: 10px 15px; */

            font-size: clamp(24px, 3vw, 34px);

            line-height: 1.6;

            color: #2F4F4F;

            flex-wrap: wrap;
        }


        /* =========================================================
           BLANK DROP ZONE
        ========================================================= */

        .blank-drop {
            display: inline-flex;

            min-width: 120px;
            height: 58px;

            margin: 0 8px;

            padding: 3px 15px;

            align-items: center;
            justify-content: center;

            vertical-align: middle;

            border: 3px dashed #5ec2ff;

            border-radius: 12px;

            background: #ffffff;

            color: #6a1b9a;

            font-size: clamp(22px, 3vw, 30px);

            font-weight: 700;

            transition: .2s ease;

            user-select: none;
        }

        .blank-drop.drag-over {
            background: #e0f7ff;

            border-color: #2196f3;

            transform: scale(1.05);
        }

        .blank-drop.filled {
            background: #dcfce7;

            border: 3px solid #22c55e;

            color: #15803d;
        }


        /* =========================================================
           QUESTION IMAGE
        ========================================================= */

        .left {
            width: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 0;
        }

        .left img {
            width: min(300px, 45vw);
            height: 190px;

            object-fit: contain;
        }


        /* =========================================================
           CHOICE AREA
        ========================================================= */

        .choice-area {
            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            margin-top: 5px;
        }


        /* =========================================================
           HIDDEN ANSWER SLOT
        ========================================================= */

        .answer-slot {
            display: none !important;
        }


        /* =========================================================
           OPTIONS
        ========================================================= */

        .option-row {
            width: 100%;

            display: flex;

            justify-content: center;
            align-items: stretch;

            gap: 18px;

            margin-top: 5px;
        }


        /* =========================================================
           OPTION CARD
        ========================================================= */

        .option-btn {
            width: 185px;
            min-width: 0;

            height: 90px;

            padding: 8px;

            border: none;

            border-radius: 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            background:
                linear-gradient(
                    145deg,
                    #ffc8dd,
                    #cdb4ff
                );

            color: #6a1b9a;

            box-shadow:
                0 7px 0 #b8a2ef,
                0 10px 18px rgba(0, 0, 0, .10);

            cursor: grab;

            user-select: none;

            touch-action: none;

            transition:
                transform .15s ease,
                box-shadow .15s ease,
                opacity .2s ease;
        }

        .option-btn:hover {
            transform: translateY(-3px);
        }

        .option-btn:active {
            cursor: grabbing;

            transform: translateY(5px);

            box-shadow:
                0 2px 0 #b8a2ef;
        }

        .option-btn.dragging {
            opacity: .55;

            transform: scale(1.08) rotate(2deg);

            cursor: grabbing;
        }

        .option-btn.disabled {
            pointer-events: none;

            opacity: .45;

            cursor: default;
        }


        /* =========================================================
           OPTION IMAGE
        ========================================================= */

        .option-img {
            width: 54px;
            height: 54px;

            flex: 0 0 54px;

            object-fit: contain;

            pointer-events: none;

            user-select: none;
        }


        /* =========================================================
           OPTION TEXT
        ========================================================= */

        .option-text {
            min-width: 0;

            flex: 1;

            text-align: center;

            font-size: clamp(16px, 2vw, 23px);

            line-height: 1.25;

            font-weight: 600;

            color: #6a1b9a;

            word-break: keep-all;
        }


        /* =========================================================
           CORRECT OPTION
        ========================================================= */

        .option-btn.correct-only {
            background: #22c55e;

            color: white;

            box-shadow:
                0 7px 0 #159447,
                0 10px 18px rgba(0, 0, 0, .10);

            cursor: default;

            opacity: 1;
        }

        .option-btn.correct-only .option-text {
            color: white;
        }


        /* =========================================================
           NAVIGATION
        ========================================================= */

        .quiz-nav {
            width: 100%;

            /* margin-top: auto; */

            padding-top: 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .prev,
        .next {
            width: 125px;
            height: 50px;

            border: 2px solid white;

            border-radius: 35px;

            color: white;

            font-size: 18px;

            font-weight: 600;

            cursor: pointer;
        }

        .prev {
            background: #06b6d4;
        }

        .next {
            background: #fb7185;
        }

        .prev:disabled,
        .next:disabled {
            opacity: .4;

            cursor: not-allowed;
        }


        /* =========================================================
           POPUP
        ========================================================= */

        .popup {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 5000;

            padding: 20px;
        }

        .popup-content {
            width: min(420px, 90vw);

            padding: 35px 30px;

            text-align: center;

            border-radius: 25px;

            background: white;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .25);

            animation: popIn .3s ease;
        }

        @keyframes popIn {
            from {
                transform: scale(.6);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .popup-icon {
            font-size: 65px;

            margin-bottom: 10px;
        }

        .popup-title {
            font-size: 28px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .popup-msg {
            font-size: 18px;
        }

        .popup.correct .popup-title {
            color: #15803d;
        }

        .popup.wrong .popup-title {
            color: #dc2626;
        }


        /* =========================================================
           FINAL POPUP
        ========================================================= */

        #finalPopup {
            display: none;
        }

        #finalPopup .popup-content {
            padding: 35px;
        }

        #finalPopup h2 {
            color: #2E7D32;

            font-size: 27px;

            margin-bottom: 15px;
        }

        #finalScore {
            font-size: 21px;

            color: #2E7D32;

            margin-bottom: 10px;
        }

        #stars {
            font-size: 42px;

            margin-bottom: 15px;
        }

        .playAgain-btn {
            border: none;

            padding: 12px 28px;

            border-radius: 25px;

            background: #1fb36b;

            color: white;

            font-size: 18px;

            cursor: pointer;
        }

        .playAgain-btn:hover {
            background: #159447;
        }


        /* =========================================================
           DRAG GHOST
        ========================================================= */

        .drag-ghost {
            position: fixed;

            z-index: 9999;

            pointer-events: none;

            width: 180px;

            height: 80px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            padding: 8px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #ffc8dd,
                    #cdb4ff
                );

            box-shadow:
                0 12px 30px rgba(0, 0, 0, .25);

            transform: translate(-50%, -50%);

            opacity: .95;
        }

        .drag-ghost img {
            width: 45px;
            height: 45px;

            object-fit: contain;
        }

        .drag-ghost span {
            font-size: 18px;

            color: #6a1b9a;

            font-weight: 600;
        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 768px) {

            body {
                overflow-y: auto;
                overflow-x: hidden;

                align-items: flex-start;

                padding: 10px 0;
            }

            .main {
                width: 96vw;

                min-height: calc(100vh - 20px);

                padding: 12px;
            }

            .instruction-text {
                width: 95%;

                margin-top: 5px;
                margin-bottom: 12px;

                font-size: 16px;

                line-height: 1.5;
            }

            .question {
                min-height: 100px;

                font-size: clamp(19px, 5vw, 27px);

                line-height: 1.5;

                padding: 5px;
            }

            .blank-drop {
                min-width: 90px;

                height: 48px;

                padding: 2px 10px;

                font-size: 20px;
            }

            .left img {
                width: min(220px, 55vw);

                height: 145px;
            }

            .option-row {
                gap: 8px;
            }

            .option-btn {
                width: 31%;

                height: 76px;

                border-radius: 15px;

                gap: 4px;

                padding: 5px;
            }

            .option-img {
                width: 38px;
                height: 38px;

                flex-basis: 38px;
            }

            .option-text {
                font-size: clamp(13px, 3.5vw, 18px);
            }

            .quiz-nav {
                padding-top: 20px;
            }

            .prev,
            .next {
                width: 105px;

                height: 45px;

                font-size: 15px;
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 480px) {

            .main {
                width: 97vw;

                padding: 8px;
            }

            .instruction-text {
                font-size: 14px;

                padding: 7px 8px;
            }

            .question {
                min-height: 95px;

                font-size: 19px;

                line-height: 1.45;
            }

            .blank-drop {
                min-width: 82px;

                height: 43px;

                margin: 3px 5px;

                font-size: 18px;

                border-width: 2px;
            }

            .left img {
                width: 155px;

                height: 120px;
            }

            .option-row {
                gap: 6px;
            }

            .option-btn {
                width: calc((100% - 12px) / 3);

                height: 70px;

                padding: 4px;

                border-radius: 13px;

                gap: 2px;

                box-shadow:
                    0 4px 0 #b8a2ef,
                    0 7px 12px rgba(0, 0, 0, .08);
            }

            .option-img {
                width: 30px;
                height: 30px;

                flex-basis: 30px;
            }

            .option-text {
                font-size: 12px;

                line-height: 1.1;
            }

            .quiz-nav {
                padding-top: 18px;
            }

            .prev,
            .next {
                width: 90px;

                height: 42px;

                font-size: 13px;
            }

            .popup-content {
                padding: 25px 18px;
            }

            .popup-icon {
                font-size: 52px;
            }

            .popup-title {
                font-size: 23px;
            }

            .popup-msg {
                font-size: 16px;
            }
        }


        /* =========================================================
           VERY SMALL MOBILE
        ========================================================= */

        @media (max-width: 360px) {

            .option-img {
                width: 25px;
                height: 25px;

                flex-basis: 25px;
            }

            .option-text {
                font-size: 10px;
            }

            .option-btn {
                height: 65px;
            }

            .prev,
            .next {
                width: 82px;

                font-size: 12px;
            }
        }
        /* =========================================================
   DESKTOP LARGE (1600px - 1920px)
========================================================= */

@media (min-width: 1700px) and (max-width: 1920px) {

    .main {
        max-width: 1100px;
        min-height: 900px;
        padding: 32px 40px;
        margin-top: 80px;
    }

    .quiz-title {
        font-size: 38px;
    }

    .quiz-subtitle {
        font-size: 20px;
    }

    .score-box {
        font-size: 20px;
        padding: 10px 24px;
    }

    .instruction-text {
        width: min(750px, 85%);
        font-size: 22px;
        padding: 14px 20px;
    }

    .question {
        font-size: clamp(28px, 3.2vw, 38px);
        margin-top: 24px;
    }

    .blank-drop {
        min-width: 140px;
        height: 64px;
        padding: 4px 20px;
        font-size: clamp(26px, 3vw, 34px);
        border-width: 3px;
    }

    .left img {
        width: min(350px, 40vw);
        height: 260px;
    }

    .option-btn {
        width: 200px;
        height: 140px;
        border-radius: 22px;
        gap: 10px;
        padding: 10px 12px;
        box-shadow: 0 8px 0 #b8a2ef, 0 12px 20px rgba(0, 0, 0, .10);
    }

    .option-btn:hover {
        transform: translateY(-4px);
    }

    .option-btn:active {
        transform: translateY(6px);
        box-shadow: 0 2px 0 #b8a2ef;
    }

    .option-img {
        width: 8%;
        height: 80px;
        flex-basis: 60px;
    }

    .option-text {
        font-size: clamp(18px, 2vw, 25px);
    }

    .option-row {
        gap: 22px;
        margin-top: 8px;
    }

    .quiz-nav {
        padding-top: 30px;
    }

    .prev,
    .next {
        width: 140px;
        height: 55px;
        font-size: 20px;
        border-width: 2px;
    }

    .drag-ghost {
        width: 200px;
        height: 88px;
        border-radius: 20px;
        gap: 10px;
        padding: 10px;
    }

    .drag-ghost img {
        width: 50px;
        height: 50px;
    }

    .drag-ghost span {
        font-size: 20px;
    }

    .popup-content {
        width: min(460px, 85vw);
        padding: 40px 35px;
        border-radius: 28px;
    }

    .popup-icon {
        font-size: 72px;
    }

    .popup-title {
        font-size: 30px;
    }

    .popup-msg {
        font-size: 20px;
    }

    #finalPopup .popup-content {
        padding: 40px;
    }

    #finalPopup h2 {
        font-size: 30px;
    }

    #finalScore {
        font-size: 23px;
    }

    #stars {
        font-size: 48px;
    }

    .playAgain-btn {
        padding: 14px 32px;
        font-size: 20px;
        border-radius: 28px;
    }
}
    </style>
</head>


<body>

    <div class="main">

        <!-- HEADER -->

        <div class="quiz-header">

            <div class="quiz-title">
                🌱 Plant World Quiz

                <div class="quiz-subtitle">
                    Let's explore the world of plants!
                </div>
            </div>

            <div class="score-box" id="scoreBox">
                Score: 0
            </div>

        </div>


        <!-- INSTRUCTION -->

        <div class="instruction-text">
            सही शब्द को खींचकर रिक्त स्थान की पूर्ति कीजिए।
        </div>


        <!-- QUESTION -->

        <div
            class="question"
            id="qText">
        </div>


        <!-- QUESTION IMAGE -->

        <div class="left">

            <img
                id="qImg"
                src="../assets/images/kidstand.png"
                alt="Question image">

        </div>


        <!-- OPTIONS -->

        <div class="choice-area">

            <!-- Kept hidden as requested -->

            <div
                class="answer-slot"
                id="answerSlot">
            </div>


            <div
                class="option-row"
                id="optionRow">
            </div>

        </div>


        <!-- NAVIGATION -->

        <nav class="quiz-nav">

            <button
                class="prev"
                id="prevBtn">
                ⮜ पिछला
            </button>

            <button
                class="next"
                id="nextBtn">
                अगला ⮞
            </button>

        </nav>


        <!-- ANSWER POPUP -->

        <div
            id="answerPopup"
            class="popup">

            <div class="popup-content">

                <div
                    id="popupIcon"
                    class="popup-icon">
                </div>

                <div
                    id="popupTitle"
                    class="popup-title">
                </div>

                <div
                    id="popupMsg"
                    class="popup-msg">
                </div>

            </div>

        </div>


        <!-- FINAL POPUP -->

        <div
            id="finalPopup"
            class="popup">

            <div class="popup-content">

                <h2>
                    🏆 वाह! कमाल कर दिया!
                </h2>

                <div id="finalScore"></div>

                <div id="stars"></div>

                <button
                    class="playAgain-btn"
                    id="playAgainBtn">
                    दोबारा खेलें 🎮
                </button>

            </div>

        </div>

    </div>


    <!-- CONFETTI -->

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


    <script>

        /* =========================================================
           QUESTIONS
        ========================================================= */

        const questions = [

            {
                before: "Q1. एक बच्चे ने आँखें",
                after: "कर ली।",

                answer: "बंद",

                options: [

                    {
                        text: "बंद",
                        emoji: "🙈",
                        image: "../assets/images/q1-opt1.png"
                    },

                    {
                        text: "दौड़",
                        emoji: "🏃",
                        image: "../assets/images/q1-opt2.png"
                    },

                    {
                        text: "मेल",
                        emoji: "🤝",
                        image: "../assets/images/q1-opt3.png"
                    }

                ],

                img: "../assets/images/kidstand.png"
            },


            {
                before: "Q2. बाकी बच्चे",
                after: "लगाए।",

                answer: "दौड़",

                options: [

                    {
                        text: "हार",
                        emoji: "😔",
                        image: "../assets/images/q2-opt1.png"
                    },

                    {
                        text: "दौड़",
                        emoji: "🏃‍♂️",
                        image: "../assets/images/q2-opt2.png"
                    },

                    {
                        text: "खेल",
                        emoji: "⚽",
                        image: "../assets/images/q2-opt3.png"
                    }

                ],

                img: "../assets/images/kidrun.png"
            },


            {
                before: "Q3.",
                after: "खेल में हार-जीत नहीं होती।",

                answer: "पकड़म-पकड़ाई",

                options: [

                    {
                        text: "मेला",
                        emoji: "🎪",
                        image: "../assets/images/q3-opt1.png"
                    },

                    {
                        text: "पकड़म-पकड़ाई",
                        emoji: "🏃‍♀️",
                        image: "../assets/images/q3-opt2.png"
                    },

                    {
                        text: "बच्चे",
                        emoji: "👧👦",
                        image: "../assets/images/q3-opt3.png"
                    }

                ],

                img: "../assets/images/win.png"
            },


            {
                before: "Q4. पकड़म-पकड़ाई मन से मन का",
                after: "है।",

                answer: "मेल",

                options: [

                    {
                        text: "दौड़",
                        emoji: "🏃",
                        image: "../assets/images/q4-opt1.png"
                    },

                    {
                        text: "खेल",
                        emoji: "🎮",
                        image: "../assets/images/q4-opt2.png"
                    },

                    {
                        text: "मेल",
                        emoji: "🤝",
                        image: "../assets/images/q4-opt3.png"
                    }

                ],

                img: "../assets/images/pp.png"
            }

        ];


        /* =========================================================
           VARIABLES
        ========================================================= */

        let index = 0;

        let score = 0;

        const answers =
            Array(questions.length).fill(null);


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const qTextEl =
            document.getElementById("qText");

        const qImgEl =
            document.getElementById("qImg");

        const optionRow =
            document.getElementById("optionRow");

        const answerSlot =
            document.getElementById("answerSlot");

        const prevBtn =
            document.getElementById("prevBtn");

        const nextBtn =
            document.getElementById("nextBtn");

        const scoreBox =
            document.getElementById("scoreBox");

        const answerPopup =
            document.getElementById("answerPopup");

        const popupIcon =
            document.getElementById("popupIcon");

        const popupTitle =
            document.getElementById("popupTitle");

        const popupMsg =
            document.getElementById("popupMsg");

        const finalPopup =
            document.getElementById("finalPopup");

        const finalScore =
            document.getElementById("finalScore");

        const stars =
            document.getElementById("stars");

        const playAgainBtn =
            document.getElementById("playAgainBtn");


        /* =========================================================
           SCORE
        ========================================================= */

        function updateScore() {

            scoreBox.textContent =
                "Score: " + score;
        }


        /* =========================================================
           QUESTION HTML
        ========================================================= */

        function buildQuestion(q) {

            qTextEl.innerHTML = "";

            const before =
                document.createTextNode(
                    q.before + " "
                );

            const blank =
                document.createElement("span");

            blank.id =
                "blankDrop";

            blank.className =
                "blank-drop";

            blank.textContent =
                answers[index] || "____";


            const after =
                document.createTextNode(
                    " " + q.after
                );


            qTextEl.appendChild(before);

            qTextEl.appendChild(blank);

            qTextEl.appendChild(after);


            setupDropZone();
        }


        /* =========================================================
           DROP ZONE
        ========================================================= */

        function setupDropZone() {

            const dropZone =
                document.getElementById(
                    "blankDrop"
                );


            if (!dropZone) return;


            /* Mouse drag */

            dropZone.addEventListener(
                "dragover",
                function (e) {

                    e.preventDefault();

                    if (!answers[index]) {

                        dropZone.classList.add(
                            "drag-over"
                        );
                    }
                }
            );


            dropZone.addEventListener(
                "dragleave",
                function () {

                    dropZone.classList.remove(
                        "drag-over"
                    );
                }
            );


            dropZone.addEventListener(
                "drop",
                function (e) {

                    e.preventDefault();

                    dropZone.classList.remove(
                        "drag-over"
                    );

                    const optionIndex =
                        e.dataTransfer.getData(
                            "text/plain"
                        );


                    if (
                        optionIndex !== ""
                    ) {

                        handleDrop(
                            Number(optionIndex)
                        );
                    }
                }
            );


            /* Touch drop */

            dropZone.addEventListener(
                "pointerup",
                function (e) {

                    if (
                        window.activeDragOption !==
                        null &&
                        window.activeDragOption !==
                        undefined
                    ) {

                        handleDrop(
                            Number(
                                window.activeDragOption
                            )
                        );
                    }
                }
            );
        }


        /* =========================================================
           LOAD QUESTION
        ========================================================= */

        function loadQuestion() {

            const q =
                questions[index];


            qImgEl.src =
                q.img;


            buildQuestion(q);


            optionRow.innerHTML =
                "";


            q.options.forEach(
                (option, optionIndex) => {

                    if (
                        answers[index] &&
                        option.text !==
                        q.answer
                    ) {
                        return;
                    }


                    const btn =
                        createOption(
                            option,
                            optionIndex,
                            answers[index] !== null
                        );


                    optionRow.appendChild(
                        btn
                    );
                }
            );


            prevBtn.disabled =
                index === 0;


            nextBtn.disabled =
                !answers[index];
        }


        /* =========================================================
           CREATE OPTION
        ========================================================= */

        function createOption(
            option,
            optionIndex,
            answered
        ) {

            const btn =
                document.createElement(
                    "div"
                );


            btn.className =
                "option-btn";


            if (
                answered &&
                option.text ===
                questions[index].answer
            ) {

                btn.classList.add(
                    "correct-only"
                );
            }


            btn.dataset.index =
                optionIndex;


            /* IMAGE */

            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "option-img";

            img.src =
                option.image;

            img.alt =
                option.text;

            img.draggable =
                false;


            img.onerror =
                function () {

                    this.style.display =
                        "none";
                };


            /* TEXT */

            const text =
                document.createElement(
                    "span"
                );

            text.className =
                "option-text";

            text.textContent =
                option.emoji +
                " " +
                option.text;


            btn.appendChild(img);

            btn.appendChild(text);


            if (!answered) {

                setupDrag(btn, optionIndex);
            } else {

                btn.classList.add(
                    "disabled"
                );
            }


            return btn;
        }


        /* =========================================================
           DESKTOP DRAG
        ========================================================= */

        function setupDrag(
            btn,
            optionIndex
        ) {

            /* Native desktop drag */

            btn.draggable =
                true;


            btn.addEventListener(
                "dragstart",
                function (e) {

                    e.dataTransfer.effectAllowed =
                        "move";

                    e.dataTransfer.setData(
                        "text/plain",
                        optionIndex
                    );

                    btn.classList.add(
                        "dragging"
                    );
                }
            );


            btn.addEventListener(
                "dragend",
                function () {

                    btn.classList.remove(
                        "dragging"
                    );
                }
            );


            /* Touch / pointer drag */

            btn.addEventListener(
                "pointerdown",
                function (e) {

                    if (
                        e.pointerType ===
                        "mouse"
                    ) {
                        return;
                    }


                    if (answers[index]) {
                        return;
                    }


                    startTouchDrag(
                        e,
                        btn,
                        optionIndex
                    );
                }
            );
        }


        /* =========================================================
           TOUCH DRAG
        ========================================================= */

        let touchDragging =
            false;

        window.activeDragOption =
            null;

        let ghost =
            null;


        function startTouchDrag(
            e,
            btn,
            optionIndex
        ) {

            touchDragging =
                true;

            window.activeDragOption =
                optionIndex;


            btn.classList.add(
                "dragging"
            );


            createGhost(
                btn,
                e.clientX,
                e.clientY
            );


            const moveHandler =
                function (moveEvent) {

                    if (!touchDragging)
                        return;


                    moveEvent.preventDefault();


                    moveGhost(
                        moveEvent.clientX,
                        moveEvent.clientY
                    );


                    const dropZone =
                        document.getElementById(
                            "blankDrop"
                        );


                    if (
                        isInside(
                            moveEvent.clientX,
                            moveEvent.clientY,
                            dropZone
                        )
                    ) {

                        dropZone.classList.add(
                            "drag-over"
                        );

                    } else {

                        dropZone.classList.remove(
                            "drag-over"
                        );
                    }
                };


            const upHandler =
                function (upEvent) {

                    if (!touchDragging)
                        return;


                    touchDragging =
                        false;


                    btn.classList.remove(
                        "dragging"
                    );


                    const dropZone =
                        document.getElementById(
                            "blankDrop"
                        );


                    if (
                        isInside(
                            upEvent.clientX,
                            upEvent.clientY,
                            dropZone
                        )
                    ) {

                        handleDrop(
                            optionIndex
                        );
                    }


                    dropZone.classList.remove(
                        "drag-over"
                    );


                    removeGhost();


                    window.activeDragOption =
                        null;


                    document.removeEventListener(
                        "pointermove",
                        moveHandler
                    );

                    document.removeEventListener(
                        "pointerup",
                        upHandler
                    );
                };


            document.addEventListener(
                "pointermove",
                moveHandler,
                {
                    passive: false
                }
            );


            document.addEventListener(
                "pointerup",
                upHandler
            );
        }


        /* =========================================================
           GHOST
        ========================================================= */

        function createGhost(
            btn,
            x,
            y
        ) {

            removeGhost();


            ghost =
                document.createElement(
                    "div"
                );


            ghost.className =
                "drag-ghost";


            const img =
                btn.querySelector(
                    ".option-img"
                );


            const text =
                btn.querySelector(
                    ".option-text"
                );


            if (img) {

                const ghostImg =
                    img.cloneNode(true);

                ghost.appendChild(
                    ghostImg
                );
            }


            if (text) {

                const ghostText =
                    document.createElement(
                        "span"
                    );

                ghostText.textContent =
                    text.textContent;

                ghost.appendChild(
                    ghostText
                );
            }


            document.body.appendChild(
                ghost
            );


            moveGhost(x, y);
        }


        function moveGhost(
            x,
            y
        ) {

            if (!ghost)
                return;


            ghost.style.left =
                x + "px";

            ghost.style.top =
                y + "px";
        }


        function removeGhost() {

            if (ghost) {

                ghost.remove();

                ghost =
                    null;
            }
        }


        /* =========================================================
           CHECK POSITION
        ========================================================= */

        function isInside(
            x,
            y,
            element
        ) {

            if (!element)
                return false;


            const rect =
                element.getBoundingClientRect();


            return (
                x >= rect.left &&
                x <= rect.right &&
                y >= rect.top &&
                y <= rect.bottom
            );
        }


        /* =========================================================
           HANDLE DROP
        ========================================================= */

        function handleDrop(
            optionIndex
        ) {

            if (
                answers[index]
            ) {
                return;
            }


            const q =
                questions[index];


            const selected =
                q.options[optionIndex];


            if (!selected)
                return;


            /* =========================
               CORRECT
            ========================= */

            if (
                selected.text ===
                q.answer
            ) {

                answers[index] =
                    selected.text;


                score++;


                updateScore();


                const blank =
                    document.getElementById(
                        "blankDrop"
                    );


                if (blank) {

                    blank.textContent =
                        selected.emoji +
                        " " +
                        selected.text;

                    blank.classList.add(
                        "filled"
                    );
                }


                showPopup(true);


                /*
                Rebuild options after
                popup starts so only
                correct answer remains.
                */

                setTimeout(() => {

                    loadQuestion();

                }, 50);


                nextBtn.disabled =
                    false;


                /*
                Last question
                */

                if (
                    index ===
                    questions.length - 1
                ) {

                    setTimeout(
                        showFinal,
                        1500
                    );
                }


            } else {

                /* =========================
                   WRONG
                ========================= */

                showPopup(false);
            }
        }


        /* =========================================================
           POPUP
        ========================================================= */

        function showPopup(
            isCorrect
        ) {

            answerPopup.className =
                "popup " +
                (
                    isCorrect
                        ? "correct"
                        : "wrong"
                );


            answerPopup.style.display =
                "flex";


            if (isCorrect) {

                popupIcon.textContent =
                    "🌟";

                popupTitle.textContent =
                    "बहुत बढ़िया!";

                popupMsg.textContent =
                    "आपका उत्तर सही है।";


                playCorrectSound();

                fireConfetti();

            } else {

                popupIcon.textContent =
                    "😔";

                popupTitle.textContent =
                    "ओह नहीं!";

                popupMsg.textContent =
                    "फिर से प्रयास करें।";


                playWrongSound();
            }


            setTimeout(() => {

                answerPopup.style.display =
                    "none";

            }, 1400);
        }


        /* =========================================================
           FINAL
        ========================================================= */

        function showFinal() {

            finalScore.textContent =
                `परिणाम: ${score} / ${questions.length}`;


            stars.textContent =
                "🏅🏅🏅";


            finalPopup.style.display =
                "flex";


            fireConfettif();
        }


        /* =========================================================
           PLAY AGAIN
        ========================================================= */

        playAgainBtn.onclick =
            function () {

                index = 0;

                score = 0;

                answers.fill(null);


                finalPopup.style.display =
                    "none";


                updateScore();

                loadQuestion();
            };


        /* =========================================================
           PREVIOUS
        ========================================================= */

        prevBtn.onclick =
            function () {

                if (index > 0) {

                    index--;

                    loadQuestion();
                }
            };


        /* =========================================================
           NEXT
        ========================================================= */

        nextBtn.onclick =
            function () {

                if (
                    index <
                    questions.length - 1 &&
                    answers[index]
                ) {

                    index++;

                    loadQuestion();
                }
            };


        /* =========================================================
           AUDIO
        ========================================================= */

        let audioCtx =
            null;


        function getAudioContext() {

            if (!audioCtx) {

                audioCtx =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();
            }


            if (
                audioCtx.state ===
                "suspended"
            ) {

                audioCtx.resume();
            }


            return audioCtx;
        }


        function playCorrectSound() {

            try {

                const ctx =
                    getAudioContext();


                const oscillator =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();


                oscillator.connect(
                    gain
                );

                gain.connect(
                    ctx.destination
                );


                oscillator.type =
                    "sine";

                oscillator.frequency.value =
                    880;


                gain.gain.setValueAtTime(
                    .2,
                    ctx.currentTime
                );


                gain.gain.exponentialRampToValueAtTime(
                    .00001,
                    ctx.currentTime + .5
                );


                oscillator.start();

                oscillator.stop(
                    ctx.currentTime + .5
                );

            } catch (error) {

                console.log(
                    "Audio error:",
                    error
                );
            }
        }


        function playWrongSound() {

            try {

                const ctx =
                    getAudioContext();


                const oscillator =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();


                oscillator.connect(
                    gain
                );

                gain.connect(
                    ctx.destination
                );


                oscillator.type =
                    "sawtooth";

                oscillator.frequency.value =
                    440;


                gain.gain.setValueAtTime(
                    .2,
                    ctx.currentTime
                );


                gain.gain.exponentialRampToValueAtTime(
                    .00001,
                    ctx.currentTime + .4
                );


                oscillator.start();

                oscillator.stop(
                    ctx.currentTime + .4
                );

            } catch (error) {

                console.log(
                    "Audio error:",
                    error
                );
            }
        }


        /* =========================================================
           CONFETTI
        ========================================================= */

        function fireConfetti() {

            if (
                typeof confetti !==
                "function"
            ) {
                return;
            }


            confetti({

                particleCount: 45,

                spread: 80,

                origin: {
                    y: .6
                }

            });
        }


        function fireConfettif() {

            if (
                typeof confetti !==
                "function"
            ) {
                return;
            }


            confetti({

                particleCount: 120,

                spread: 120,

                origin: {
                    y: .6
                }

            });
        }


        /* =========================================================
           START
        ========================================================= */

        updateScore();

        loadQuestion();


        /* =========================================================
           PREVENT PAGE DRAG/DROP
        ========================================================= */

        document.addEventListener(
            "dragover",
            function (e) {

                e.preventDefault();
            }
        );


        document.addEventListener(
            "drop",
            function (e) {

                /*
                Allow native drop only
                when it happens on the
                question blank.
                */

                if (
                    !e.target.closest(
                        "#blankDrop"
                    )
                ) {

                    e.preventDefault();
                }
            }
        );

    </script>

</body>
