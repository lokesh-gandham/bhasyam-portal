
<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wise Wings</title>

    <link rel="icon" type="image/png" href="/iconsa1.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../assets/CSS/walkman-font.css">

    <style>
        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-family: "Tiro Devanagari Hindi", sans-serif;
        }


        /* =====================================================
           MAIN QUIZ
        ===================================================== */

        .quiz {
            width: min(1100px, 94vw);

            min-height: 680px;

            padding: 25px;

            display: flex;
            flex-direction: column;

            border-radius: 25px;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .quiz-header {
            display: none;

            width: 100%;

            align-items: center;
            justify-content: center;

            position: relative;
        }

        .quiz-title {
            text-align: center;

            font-size: 32px;

            font-weight: 700;

            color: #3c5e3c;
        }

        .quiz-subtitle {
            font-size: 18px;

            margin-top: 3px;
        }

        .score-box {
            position: absolute;

            right: 0;
            top: 0;

            padding: 8px 18px;

            border-radius: 22px;

            background: #e98a9d;

            color: white;

            font-size: 18px;

            font-weight: 600;
        }


        /* =====================================================
           INSTRUCTION
        ===================================================== */

        .instruction-text {
            width: min(400px, 62%);

            margin: 15px auto 12px;

            padding: 7px;

            text-align: center;

            font-family: "Tiro Devanagari Hindi", sans-serif;

            font-size: clamp(16px, 2.2vw, 21px);

            font-weight: 400;

            /* line-height: 1.5; */

            color: #4b5563;

            background: #f3f4f6;

            border: 1px solid #4b5563;

            border-radius: 10px;
        }


        /* =====================================================
           MATCH AREA
        ===================================================== */

        .match-area {
            position: relative;

            width: 100%;

            flex: 1;

            min-height: 500px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            column-gap: clamp(80px, 15vw, 190px);

            align-items: center;

            /* padding: 10px 25px; */
        }


        /* =====================================================
           COLUMNS
        ===================================================== */

        .column {
            width: 100%;

            height: 100%;

            display: flex;

            flex-direction: column;

            /* justify-content: space-e; */

            gap: 7px;

            position: relative;

            z-index: 5;
        }


        /* =====================================================
           MATCH ITEM
        ===================================================== */

        .item {
            width: min(280px, 100%);

            min-height: 65px;

            margin: 0 auto;

            display: flex;

            align-items: center;

            position: relative;

            cursor: pointer;

            user-select: none;

            transition:
                transform .18s ease,
                opacity .2s ease;
        }


        /* LEFT ITEMS */

        .left .item {
            justify-content: flex-end;
        }


        /* RIGHT ITEMS */

        .right .item {
            justify-content: flex-start;
        }


        /* =====================================================
           TEXT BOX
        ===================================================== */

        .text-bg {
            min-width: 155px;

            max-width: 220px;

            min-height: 58px;

            padding: 8px 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            border-radius: 17px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #fefdff
                );

            color: #2e2e2e;

            font-size: clamp(17px, 2vw, 23px);

            font-weight: 500;

            line-height: 1.3;

            box-shadow:
                0 5px 0 #b8a2ef,
                0 8px 15px rgba(0, 0, 0, .08);

            transition:
                .2s ease;
        }


        /* =====================================================
           DOT
        ===================================================== */

        .dot {
            width: 22px;

            height: 22px;

            flex: 0 0 22px;

            border-radius: 50%;

            background: #8fd3ff;

            border: 4px solid white;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, .15);

            z-index: 20;

            transition:
                transform .2s ease,
                background .2s ease;
        }


        .left .dot {
            margin-left: 13px;
        }

        .right .dot {
            margin-right: 13px;
        }


        /* =====================================================
           ACTIVE
        ===================================================== */

        .item.active .text-bg {

            transform: scale(1.05);

            background:
                linear-gradient(
                    145deg,
                    #ffe29a,
                    #ffc8dd
                );

            box-shadow:
                0 6px 0 #e7b56b,
                0 10px 18px rgba(0, 0, 0, .12);
        }

        .item.active .dot {

            background: #ff9f43;

            transform: scale(1.2);
        }


        /* =====================================================
           TEMP WRONG EFFECT
        ===================================================== */

        .item.temp-active .text-bg {

            animation: shake .35s ease;
        }

        @keyframes shake {

            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-7px);
            }

            50% {
                transform: translateX(7px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }


        /* =====================================================
           CORRECT
        ===================================================== */

        .item.correct .text-bg {

            background: #22c55e;

            color: white;

            box-shadow:
                0 5px 0 #159447,
                0 8px 15px rgba(0, 0, 0, .10);
        }

        .item.correct .dot {

            background: #22c55e;

            border-color: #dcfce7;
        }


        /* =====================================================
           SVG LINE
        ===================================================== */

        #lineLayer {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            pointer-events: none;

            z-index: 2;

            overflow: visible;
        }

        .match-line {

            fill: none;

            stroke: #70c9ff;

            stroke-width: 5;

            stroke-linecap: round;

            stroke-dasharray: 8 6;

            animation: lineDraw .35s ease forwards;
        }

        @keyframes lineDraw {

            from {
                stroke-dashoffset: 100;
                opacity: 0;
            }

            to {
                stroke-dashoffset: 0;
                opacity: 1;
            }
        }


        /* =====================================================
           POPUP
        ===================================================== */

        .popup {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 5000;

            padding: 20px;
        }

        .popup-content {

            width: min(430px, 90vw);

            padding: 35px;

            text-align: center;

            border-radius: 25px;

            background: white;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .25);

            animation: popupIn .3s ease;
        }

        @keyframes popupIn {

            from {
                transform: scale(.6);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        #finalPopup h2 {

            color: #2E7D32;

            font-size: 27px;

            font-weight: 600 !important;

            margin-bottom: 15px;
        }

        #finalScore {

            font-size: 21px;

            color: #2E7D32;

            margin-bottom: 12px;
        }

        #stars {

            font-size: 40px;

            margin-bottom: 15px;

            letter-spacing: 3px;
        }

        .playAgain-btn {

            border: none;

            padding: 12px 28px;

            border-radius: 25px;

            background: #1fb36b;

            color: white;

            font-family: inherit;

            font-size: 18px;

            cursor: pointer;

            transition: .2s ease;
        }

        .playAgain-btn:hover {

            background: #159447;

            transform: translateY(-2px);
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 768px) {

            body {

                align-items: flex-start;

                padding: 12px 0;

                overflow-y: auto;
            }

            .quiz {

                width: 97vw;

                min-height: calc(100vh - 24px);

                padding: 12px;
            }

            .instruction-text {

                width: 96%;

                margin-bottom: 15px;

                padding: 8px 12px;

                font-size: 16px;
            }

            .match-area {

                min-height: 500px;

                column-gap: 45px;

                padding: 5px 8px;
            }

            .column {

                gap: 12px;
            }

            .item {

                min-height: 58px;
            }

            .text-bg {

                min-width: 125px;

                max-width: 175px;

                min-height: 52px;

                padding: 7px 10px;

                border-radius: 14px;

                font-size: 16px;
            }

            .dot {

                width: 19px;

                height: 19px;

                flex-basis: 19px;

                border-width: 3px;
            }

            .left .dot {

                margin-left: 8px;
            }

            .right .dot {

                margin-right: 8px;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            body {

                padding: 5px 0;
            }

            .quiz {

                width: 98vw;

                min-height: calc(100vh - 10px);

                padding: 7px;
            }

            .instruction-text {

                width: 98%;

                margin: 2px auto 10px;

                padding: 6px 8px;

                font-size: 13px;

                line-height: 1.45;
            }

            .match-area {

                min-height: 520px;

                column-gap: 18px;

                padding: 2px 0;
            }

            .column {

                gap: 8px;

                justify-content: space-evenly;
            }

            .item {

                min-height: 52px;
            }

            .text-bg {

                min-width: 95px;

                max-width: 125px;

                min-height: 46px;

                padding: 5px 7px;

                border-radius: 12px;

                font-size: 13px;

                line-height: 1.15;

                box-shadow:
                    0 4px 0 #b8a2ef,
                    0 6px 10px rgba(0, 0, 0, .08);
            }

            .dot {

                width: 16px;

                height: 16px;

                flex-basis: 16px;

                border-width: 2px;
            }

            .left .dot {

                margin-left: 5px;
            }

            .right .dot {

                margin-right: 5px;
            }

            .match-line {

                stroke-width: 3;
            }
        }


        /* =====================================================
           VERY SMALL MOBILE
        ===================================================== */

        @media (max-width: 360px) {

            .match-area {

                column-gap: 10px;
            }

            .text-bg {

                min-width: 82px;

                max-width: 105px;

                min-height: 42px;

                padding: 4px 5px;

                font-size: 11px;
            }

            .dot {

                width: 14px;

                height: 14px;

                flex-basis: 14px;
            }

            .left .dot {

                margin-left: 3px;
            }

            .right .dot {

                margin-right: 3px;
            }
        }

        /* =====================================================
   DESKTOP LARGE (1600px - 1920px)
===================================================== */

@media (min-width: 1600px) and (max-width: 1920px) {

    .quiz {
        width: min(1300px, 92vw);
        min-height: 800px;
        padding: 35px 40px;
        border-radius: 30px;
    }

    .quiz-title {
        font-size: 38px;
    }

    .quiz-subtitle {
        font-size: 22px;
    }

    .score-box {
        font-size: 20px;
        padding: 10px 24px;
        border-radius: 25px;
    }

    .instruction-text {
        width: min(800px, 88%);
        margin: 20px auto 18px;
        padding: 12px 20px;
        font-size: clamp(18px, 2vw, 23px);
        border-radius: 12px;
    }

    .match-area {
        min-height: 600px;
        column-gap: clamp(120px, 18vw, 250px);
        padding: 15px 30px;
    }

    .column {
        gap: 12px;
    }

    .item {
        min-height: 80px;
        transition: transform .2s ease, opacity .2s ease;
    }

    .item:hover {
        transform: scale(1.03);
    }

    .item.active .text-bg {
        transform: scale(1.08);
        box-shadow: 0 8px 0 #e7b56b, 0 14px 24px rgba(0, 0, 0, .15);
    }

    .item.correct .text-bg {
        box-shadow: 0 6px 0 #159447, 0 10px 18px rgba(0, 0, 0, .12);
    }

    .text-bg {
        min-width: 190px;
        max-width: 270px;
        min-height: 72px;
        padding: 10px 28px;
        border-radius: 20px;
        font-size: clamp(20px, 2.2vw, 27px);
        font-weight: 600;
        box-shadow: 0 6px 0 #b8a2ef, 0 10px 18px rgba(0, 0, 0, .10);
    }

    .dot {
        width: 26px;
        height: 26px;
        flex-basis: 26px;
        border-width: 4px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, .18);
    }

    .left .dot {
        margin-left: 18px;
    }

    .right .dot {
        margin-right: 18px;
    }

    .item.active .dot {
        transform: scale(1.3);
    }

    .match-line {
        stroke-width: 6;
        stroke-dasharray: 10 8;
    }

    @keyframes lineDraw {
        from {
            stroke-dashoffset: 120;
            opacity: 0;
        }
        to {
            stroke-dashoffset: 0;
            opacity: 1;
        }
    }

    #finalPopup .popup-content {
        width: min(500px, 85vw);
        padding: 45px 40px;
        border-radius: 30px;
    }

    #finalPopup h2 {
        font-size: 32px;
        margin-bottom: 18px;
    }

    #finalScore {
        font-size: 24px;
        margin-bottom: 15px;
    }

    #stars {
        font-size: 48px;
        margin-bottom: 20px;
        letter-spacing: 5px;
    }

    .playAgain-btn {
        padding: 14px 34px;
        font-size: 20px;
        border-radius: 28px;
        transition: .25s ease;
    }

    .playAgain-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(27, 179, 107, 0.3);
    }

    @keyframes shake {
        0% { transform: translateX(0); }
        20% { transform: translateX(-10px); }
        40% { transform: translateX(10px); }
        60% { transform: translateX(-7px); }
        80% { transform: translateX(7px); }
        100% { transform: translateX(0); }
    }
}
    </style>
</head>


<body>

    <div class="quiz">

        <!-- HEADER -->

        <div class="quiz-header">

            <div class="quiz-title">

                🌱 Plant World Quiz

                <div class="quiz-subtitle">
                    Let's explore the world of plants!
                </div>

            </div>

            <div
                class="score-box"
                id="scoreBox">

                Score: 0

            </div>

        </div>


        <!-- =====================================================
             INSTRUCTION
        ====================================================== -->

        <div class="instruction-text">

            सही जोड़ी मिलाइए।

        </div>


        <!-- =====================================================
             MATCH AREA
        ====================================================== -->

        <div class="match-area">

            <div
                class="column left"
                id="leftCol">
            </div>


            <svg
                id="lineLayer">
            </svg>


            <div
                class="column right"
                id="rightCol">
            </div>

        </div>

    </div>


    <!-- =====================================================
         FINAL POPUP
    ====================================================== -->

    <div
        id="finalPopup"
        class="popup">

        <div class="popup-content">

            <h2>
                🏆 वाह! कमाल कर दिया!
            </h2>

            <div id="finalScore"></div>

            <div id="stars"></div>

            <button
                class="playAgain-btn"
                id="playAgainBtn">

                दोबारा खेलें 🎮

            </button>

        </div>

    </div>


    <!-- CONFETTI -->

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


    <script>

        /* =====================================================
           ORIGINAL COMMENTED CONTENT
        ===================================================== */

        // const pairs = [
        //  { l:"ख ", r:"ख " },
        //  { l:"घ ", r:"घ " },
        //  { l:"झ ", r:"झ " },
        //  { l:"छ ", r:"छ " },
        //
        // ];


        // const images = {
        //  "छ ": "../assets/images/brain_function.png",
        //  "झ ": "../assets/images/digestion.png",
        //  "ख ": "../assets/images/breathing.png",
        //  "घ ": "../assets/images/heart_pumping.png",
        //
        // };


        /* =====================================================
           PAIRS
        ===================================================== */

        const pairs = [

            {
                l: "गिल्ली",
                r: "डंडा"
            },

            {
                l: "गेंद",
                r: "बल्ला"
            },

            {
                l: "पकड़म",
                r: "पकड़ाई"
            },

            {
                l: "रस्सी",
                r: "कूद"
            },

            {
                l: "मल्ल",
                r: "खंभ"
            },

            {
                l: "तलवार",
                r: "बाजी"
            }

        ];


        /* =====================================================
           LEFT SIDE IMAGES
        ===================================================== */

        const leftImages = {

            गिल्ली:
                "../assets/images/gilli.png",

            गेंद:
                "../assets/images/ball.png",

            पकड़म:
                "../assets/images/pakadam.png",

            रस्सी:
                "../assets/images/rope.png",

            मल्ल:
                "../assets/images/mall.png",

            तलवार:
                "../assets/images/sword.png"

        };


        /* =====================================================
           RIGHT SIDE IMAGES
        ===================================================== */

        const rightImages = {

            डंडा:
                "../assets/images/danda.png",

            बल्ला:
                "../assets/images/bat.png",

            पकड़ाई:
                "../assets/images/pakadai.png",

            कूद:
                "../assets/images/jump.png",

            खंभ:
                "../assets/images/pole.png",

            बाजी:
                "../assets/images/baji.png"

        };


        /* =====================================================
           CORRECT ANSWERS
        ===================================================== */

        const correctPairs = {

            गिल्ली: "डंडा",

            गेंद: "बल्ला",

            पकड़म: "पकड़ाई",

            रस्सी: "कूद",

            मल्ल: "खंभ",

            तलवार: "बाजी"

        };


        /* =====================================================
           VARIABLES
        ===================================================== */

        let armed = null;

        let score = 0;

        let matched = 0;

        let popupTimer = null;


        const leftCol =
            document.getElementById(
                "leftCol"
            );

        const rightCol =
            document.getElementById(
                "rightCol"
            );

        const scoreBox =
            document.getElementById(
                "scoreBox"
            );


        /* =====================================================
           SCORE
        ===================================================== */

        function updateScore() {

            scoreBox.textContent =
                "Score: " + score;

        }


        /* =====================================================
           AUDIO
        ===================================================== */

        let audioCtx = null;


        function playCorrectSound() {

            try {

                if (!audioCtx) {

                    audioCtx =
                        new (
                            window.AudioContext ||
                            window.webkitAudioContext
                        )();

                }


                if (
                    audioCtx.state ===
                    "suspended"
                ) {

                    audioCtx.resume();

                }


                const oscillator =
                    audioCtx.createOscillator();

                const gainNode =
                    audioCtx.createGain();


                oscillator.connect(
                    gainNode
                );

                gainNode.connect(
                    audioCtx.destination
                );


                oscillator.frequency.value =
                    880;

                gainNode.gain.value =
                    0.2;

                oscillator.type =
                    "sine";


                oscillator.start();


                gainNode.gain.exponentialRampToValueAtTime(
                    0.00001,
                    audioCtx.currentTime + 0.5
                );


                oscillator.stop(
                    audioCtx.currentTime + 0.5
                );

            } catch (e) {

                console.log(
                    "Audio error:",
                    e
                );

            }

        }


        function playWrongSound() {

            try {

                if (!audioCtx) {

                    audioCtx =
                        new (
                            window.AudioContext ||
                            window.webkitAudioContext
                        )();

                }


                if (
                    audioCtx.state ===
                    "suspended"
                ) {

                    audioCtx.resume();

                }


                const oscillator =
                    audioCtx.createOscillator();

                const gainNode =
                    audioCtx.createGain();


                oscillator.connect(
                    gainNode
                );

                gainNode.connect(
                    audioCtx.destination
                );


                oscillator.frequency.value =
                    440;

                gainNode.gain.value =
                    0.25;

                oscillator.type =
                    "sawtooth";


                oscillator.start();


                gainNode.gain.exponentialRampToValueAtTime(
                    0.00001,
                    audioCtx.currentTime + 0.4
                );


                oscillator.stop(
                    audioCtx.currentTime + 0.4
                );

            } catch (e) {

                console.log(
                    "Audio error:",
                    e
                );

            }

        }


        function initAudioOnFirstClick() {

            if (audioCtx)
                return;


            try {

                audioCtx =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();


                if (
                    audioCtx.state ===
                    "suspended"
                ) {

                    audioCtx.resume();

                }

            } catch (e) {

                console.log(
                    "Audio init error:",
                    e
                );

            }

        }


        document.body.addEventListener(
            "click",
            initAudioOnFirstClick,
            {
                once: true
            }
        );


        /* =====================================================
           RENDER
        ===================================================== */

        function render() {

            leftCol.innerHTML =
                "";

            rightCol.innerHTML =
                "";


            pairs.forEach(
                (p) => {

                    const l =
                        document.createElement(
                            "div"
                        );


                    l.className =
                        "item";


                    l.innerHTML = `

                        <div class="text-bg">
                            ${p.l}
                        </div>

                        <div class="dot"></div>

                    `;


                    l.onclick =
                        () => arm(
                            l,
                            p
                        );


                    leftCol.appendChild(
                        l
                    );

                }
            );


            [...pairs]
                .sort(
                    () =>
                        Math.random() -
                        0.5
                )
                .forEach(
                    (p) => {

                        const r =
                            document.createElement(
                                "div"
                            );


                        r.className =
                            "item";


                        r.innerHTML = `

                            <div class="dot"></div>

                            <div class="text-bg">
                                ${p.r}
                            </div>

                        `;


                        r.onclick =
                            () => attempt(
                                r,
                                p
                            );


                        rightCol.appendChild(
                            r
                        );

                    }
                );

        }


        /* =====================================================
           SELECT LEFT
        ===================================================== */

        function arm(
            el,
            p
        ) {

            if (
                el.classList.contains(
                    "correct"
                )
            ) {
                return;
            }


            document
                .querySelectorAll(
                    ".left .item"
                )
                .forEach(
                    item => {

                        item.classList.remove(
                            "active"
                        );

                    }
                );


            el.classList.add(
                "active"
            );


            armed = {

                el: el,

                p: p

            };

        }


        /* =====================================================
           SELECT RIGHT
        ===================================================== */

        function attempt(
            el,
            p
        ) {

            if (
                !armed ||
                el.classList.contains(
                    "correct"
                )
            ) {

                return;

            }


            showRightClickEffect(
                el
            );


            /* =========================
               CORRECT
            ========================= */

            if (
                correctPairs[
                    armed.p.l
                ] === p.r
            ) {

                drawLine(
                    armed.el,
                    el
                );


                armed.el.classList.remove(
                    "active"
                );


                el.classList.remove(
                    "active"
                );


                armed.el.classList.add(
                    "correct"
                );


                el.classList.add(
                    "correct"
                );


                score++;

                matched++;


                updateScore();


                playCorrectSound();


                fireConfetti();


                document
                    .querySelectorAll(
                        ".left .item"
                    )
                    .forEach(
                        i =>
                            i.classList.remove(
                                "armed"
                            )
                    );


                armed = null;


                if (
                    matched ===
                    pairs.length
                ) {

                    setTimeout(
                        finalPopup,
                        1100
                    );

                }


            }

            /* =========================
               WRONG
            ========================= */

            else {

                playWrongSound();

                /*
                LEFT QUESTION STAYS SELECTED
                */

            }

        }


        /* =====================================================
           DRAW MATCHING LINE
        ===================================================== */

        function drawLine(
            leftEl,
            rightEl
        ) {

            const svg =
                document.getElementById(
                    "lineLayer"
                );


            const svgRect =
                svg.getBoundingClientRect();


            const leftDot =
                leftEl.querySelector(
                    ".dot"
                );


            const rightDot =
                rightEl.querySelector(
                    ".dot"
                );


            const leftDotRect =
                leftDot.getBoundingClientRect();


            const rightDotRect =
                rightDot.getBoundingClientRect();


            const startX =
                leftDotRect.left +
                leftDotRect.width / 2 -
                svgRect.left;


            const startY =
                leftDotRect.top +
                leftDotRect.height / 2 -
                svgRect.top;


            const endX =
                rightDotRect.left +
                rightDotRect.width / 2 -
                svgRect.left;


            const endY =
                rightDotRect.top +
                rightDotRect.height / 2 -
                svgRect.top;


            const curve =
                Math.max(
                    30,
                    (endX - startX) *
                    0.35
                );


            const path =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );


            const d = `

                M ${startX} ${startY}

                C
                ${startX + curve} ${startY},
                ${endX - curve} ${endY},
                ${endX} ${endY}

            `;


            path.setAttribute(
                "d",
                d
            );


            path.setAttribute(
                "class",
                "match-line"
            );


            svg.appendChild(
                path
            );

        }


        /* =====================================================
           WRONG EFFECT
        ===================================================== */

        function showRightClickEffect(
            el
        ) {

            el.classList.add(
                "temp-active"
            );


            setTimeout(
                () => {

                    el.classList.remove(
                        "temp-active"
                    );

                },
                500
            );

        }


        /* =====================================================
           FINAL POPUP
        ===================================================== */

        function finalPopup() {

            const final =
                document.getElementById(
                    "finalPopup"
                );


            final.style.display =
                "flex";


            document.getElementById(
                "finalScore"
            ).textContent =
                `परिणाम: ${score} / ${pairs.length}`;


            document.getElementById(
                "stars"
            ).textContent =
                "⭐".repeat(
                    score
                );


            fireConfettif();

        }


        /* =====================================================
           PLAY AGAIN
        ===================================================== */

        document
            .getElementById(
                "playAgainBtn"
            )
            .onclick =
            function () {

                score = 0;

                matched = 0;

                armed = null;


                document.getElementById(
                    "finalPopup"
                ).style.display =
                    "none";


                document.getElementById(
                    "lineLayer"
                ).innerHTML =
                    "";


                updateScore();


                render();

            };


        /* =====================================================
           CONFETTI
        ===================================================== */

        function fireConfetti() {

            if (
                typeof confetti !==
                "function"
            ) {
                return;
            }


            confetti({

                particleCount: 40,

                spread: 80,

                origin: {
                    y: .6
                }

            });

        }


        function fireConfettif() {

            if (
                typeof confetti !==
                "function"
            ) {
                return;
            }


            confetti({

                particleCount: 100,

                spread: 120,

                origin: {
                    y: .6
                }

            });

        }


        /* =====================================================
           KEEP MATCHING LINES CORRECT ON RESIZE
        ===================================================== */

        window.addEventListener(
            "resize",
            function () {

                /*
                Existing SVG lines are
                recreated from their
                matching elements.
                */

                const svg =
                    document.getElementById(
                        "lineLayer"
                    );


                svg.innerHTML =
                    "";


                document
                    .querySelectorAll(
                        ".left .item.correct"
                    )
                    .forEach(
                        leftEl => {

                            const leftText =
                                leftEl
                                    .querySelector(
                                        ".text-bg"
                                    )
                                    .textContent
                                    .trim();


                            const rightAnswer =
                                correctPairs[
                                    leftText
                                ];


                            const rightItems =
                                document
                                    .querySelectorAll(
                                        ".right .item.correct"
                                    );


                            rightItems.forEach(
                                rightEl => {

                                    const rightText =
                                        rightEl
                                            .querySelector(
                                                ".text-bg"
                                            )
                                            .textContent
                                            .trim();


                                    if (
                                        rightText ===
                                        rightAnswer
                                    ) {

                                        drawLine(
                                            leftEl,
                                            rightEl
                                        );

                                    }

                                }
                            );

                        }
                    );

            }
        );


        /* =====================================================
           START
        ===================================================== */

        updateScore();

        render();

    </script>

</body>

</html>
