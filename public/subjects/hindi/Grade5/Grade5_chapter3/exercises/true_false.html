<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
 <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/CSS/true_false.css">
    <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>
   <div class="main">

    <!-- HEADER -->
    <div class="quiz-header">
        <div class="quiz-title">
            🌱 Plant World Quiz
            <div class="quiz-subtitle">
                Let's explore the world of plants!
            </div>
        </div>

        <div class="score-box" id="scoreBox">
            Score: 0
        </div>
    </div>
  <div class="instruction-text">
शब्दों को पढ़िए और उनसे मिलते-जुलते शब्द को चुनिए।
</div>
    <!-- CONTENT -->
    <div class="question" id="qText"></div>
        <div class="left">
            <img id="qImg" src="../assests/images/q5-img.png">
        </div>
    <div class="choice-wrapper">

    <div class="choice-title">
        👇 उत्तर का चयन करें
    </div>

    <div class="choice-options" id="choiceOptions">

    </div>

</div>
    


      <nav class="quiz-nav">

<button class="prev" id="prevBtn">
⮜ पिछला 
</button>

<button class="next" id="nextBtn">
 अगला  ⮞
</button>

</nav>

 <!-- ANSWER POPUP -->
<div id="answerPopup" class="popup">
  <div class="popup-content">
    <div id="popupIcon" class="popup-icon"></div>
    <div id="popupTitle" class="popup-title"></div>
    <div id="popupMsg" class="popup-msg"></div>
  </div>
</div>

<!-- FINAL POPUP -->
<div id="finalPopup" class="popup">
  <div class="popup-content">
  <h2 style="color: #2E7D32;">🏆 वाह! कमाल कर दिया!</h2>
    <div id="finalScore"></div>
    <div id="stars"></div>
     <button class="playAgain-btn" onclick="location.reload()">दोबारा खेलें 🎮</button>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script src="../assets/JavaScript/true_false.js"></script>
