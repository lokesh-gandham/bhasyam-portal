    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            /* max-width: 1000px; */
            width: 80%;
            margin: auto;
        }

        /* QUESTION */

        .question-box {
            font-size: 1.2rem;
            font-weight: 700;
            color: #bc5f7a;
            background: #fff2f0;
            padding: 0.7rem 1.6rem;
            width: 50%;
            margin: auto;
            border-radius: 60px;
            text-align: center;
            border: 1px solid #ffcdd9;
            margin-bottom: 30px;
        }

        /* MATCH AREA */

        .match-wrapper {
            position: relative;
        }

        .matching-area {
            display: flex;
            justify-content: space-between;
            gap: 50px;
        }

        .left-side,
        .right-side {
            width: 45%;

            display: flex;
            flex-direction: column;

            gap: 20px;
        }

        /* ITEM */

        .item {
            display: flex;
            align-items: center;
            gap: 20px;

            position: relative;
        }

        /* IMAGE */

        .image-box {
            width: 60px;
            height: 60px;

            /* background:#ffeef6; */

            border-radius: 15px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-box img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        /* TEXT */

        .text-box {
            flex: 1;

            min-height: 85px;

            background: #ffe6a36c;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 15px 25px;

            font-size: 24px;
            font-weight: 500;

            color: #4a5a7a;

            position: relative;

            cursor: pointer;

            transition: .3s;
        }

        .text-box.active {
            box-shadow: 0 0 0 5px #ffb6d9;
        }

        /* MATCHED */

        .text-box.matched {
            opacity: 1;
            pointer-events: none;
        }

        /* DOT */

        .dot {
            width: 22px;
            height: 22px;

            background: #ff1493;

            border-radius: 50%;

            position: absolute;

            right: 40px;

            top: 50%;

            transform: translateY(-50%);

            transition: .3s;
            z-index: 2;
        }

        .right-dot {
            left: 42px;
            right: auto;
        }

        /* ANSWERS */

        .answer.correct {
            background: #2ecc71;
            color: white;

            pointer-events: none;
        }

        /* WRONG */

        .answer.wrong {
            background: #ff6b6b;
            color: white;

            animation: shake .3s;
        }

        @keyframes shake {

            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            50% {
                transform: translateX(6px);
            }

            75% {
                transform: translateX(-6px);
            }

            100% {
                transform: translateX(0);
            }

        }

        /* SVG */

        svg {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;
            z-index: 1;
        }

        /* EMOJI POPUP */

        .emoji-popup {
            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%) scale(0);

            opacity: 0;
            visibility: hidden;

            z-index: 999;

            transition: .3s;
        }

        .emoji-popup.active {

            opacity: 1;
            visibility: visible;

            transform: translate(-50%, -50%) scale(1);

        }

        .popup-emoji {
            font-size: 200px;
        }

        /* FINAL POPUP */

        .final-popup-overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            /* background:rgba(0,0,0,.7); */

            /* backdrop-filter: blur(8px); */

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 2000;

            visibility: hidden;
            opacity: 0;

            transition: .3s ease;
        }

        .final-popup-overlay.active {

            visibility: visible;
            opacity: 1;

        }

        .final-popup-box {

            background:
                linear-gradient(135deg,
                    #fff9e6,
                    #e6fff5);

            border-radius: 80px;

            padding: 40px 50px;

            text-align: center;

            max-width: 480px;
            width: 85%;

            box-shadow:
                0 30px 50px rgba(0, 0, 0, .3),
                0 0 0 10px #ffd966,
                0 0 0 18px #ff9f4a;

            animation:
                finalBounce .5s cubic-bezier(0.68,
                    -0.55,
                    0.265,
                    1.55);
        }

        @keyframes finalBounce {

            0% {
                transform: scale(.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        }

        .final-popup-box h2 {

            color: #d45a2b;

            margin-bottom: 15px;

            font-weight: 800;
        }

        .final-stars {

        }

        .final-popup-box p {

        }

        .popup-playagain-btn {

            padding: 12px 30px;

            border-radius: 50px;

            margin-top: 15px;

            transition: .05s linear;
        }

        .popup-playagain-btn:active {

        }

            .text-box.matched {
                opacity: 1;
            }

            .answer.correct {
                background: #d4edda;
                color: black;
            }
        }
    </style>
            <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

    <div class="container">

        <div class="question-box">
            कहानी के अंशों को सही ढंग से जोड़िए।
        </div>

        <div class="match-wrapper">

            <svg id="svgLines"></svg>

            <div class="matching-area">

                <!-- LEFT -->

                <div class="left-side">

                    <div class="item">

                        <div class="image-box">
                            <img src="../assets/images/aadmi.png">
                        </div>

                        <div class="text-box">
                            आम

                            <div class="dot" data-match="आदमी">
                            </div>
                        </div>

                    </div>

                    <div class="item">

                        <div class="image-box">
                            <img src="../assets/images/MCQ3.png">
                        </div>

                        <div class="text-box">
                            आधा

                            <div class="dot" data-match="रास्ता">
                            </div>
                        </div>

                    </div>

                    <div class="item">

                        <div class="image-box">
                            <img src="../assets/images/boy1.png">
                        </div>

                        <div class="text-box">
                            भारी

                            <div class="dot" data-match="पत्थर">
                            </div>
                        </div>

                    </div>

                    <div class="item">

                        <div class="image-box">
                            <img src="../assets/images/building.png">
                        </div>

                        <div class="text-box">
                            सुंदर

                            <div class="dot" data-match="भवन">
                            </div>
                        </div>

                    </div>

                    <div class="item">

                        <div class="image-box">
                            <img src="../assets/images/help-boy.png">
                        </div>

                        <div class="text-box">
                            अच्छी

                            <div class="dot" data-match="शिक्षा">
                            </div>
                        </div>

                    </div>

                </div>

                <!-- RIGHT -->

                <div class="right-side">

                    <div class="item">
                        <div class="text-box answer">
                            भवन
                            <div class="dot right-dot"></div>
                        </div>
                    </div>

                    <div class="item">
                        <div class="text-box answer">
                            पत्थर
                            <div class="dot right-dot"></div>
                        </div>
                    </div>

                    <div class="item">
                        <div class="text-box answer">
                            शिक्षा
                            <div class="dot right-dot"></div>
                        </div>
                    </div>

                    <div class="item">
                        <div class="text-box answer">
                            आदमी
                            <div class="dot right-dot"></div>
                        </div>
                    </div>

                    <div class="item">
                        <div class="text-box answer">
                            रास्ता
                            <div class="dot right-dot"></div>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- EMOJI POPUP -->

    <div class="emoji-popup" id="emojiPopup">

        <div class="popup-emoji">
            😍
        </div>

    </div>

    <!-- FINAL POPUP -->

    <div id="finalPopup" class="final-popup-overlay">

        <div class="final-popup-box">

            <h2>
                🎉 बहुत बहुत बधाई! 🎉
            </h2>

            <div class="final-stars">
                ⭐⭐⭐⭐⭐
            </div>

            <p>
                आपने सभी मिलान पूरे किए!
            </p>

            <p>
                ✨ आप बहुत होशियार हो! ✨
            </p>

            <button class="popup-playagain-btn" onclick="location.reload()">
                🔄 फिर से खेलें
            </button>

        </div>

    </div>

    <script>

        /* ELEMENTS */

        const leftBoxes =
            document.querySelectorAll(".left-side .text-box");

        const leftDots =
            document.querySelectorAll(".left-side .dot");

        const answers =
            document.querySelectorAll(".answer");

        const svg =
            document.getElementById("svgLines");

        /* VARIABLES */

        let selectedDot = null;

        let completed = 0;

        let audioCtx = null;

        /* AUDIO INIT */

        document.body.addEventListener(
            "click",
            () => {

                if (audioCtx) return;

                audioCtx =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

            },
            { once: true }
        );

        /* CORRECT SOUND */

        function playCorrectSound() {

            try {

                const oscillator =
                    audioCtx.createOscillator();

                const gainNode =
                    audioCtx.createGain();

                oscillator.connect(gainNode);

                gainNode.connect(
                    audioCtx.destination
                );

                oscillator.frequency.value = 880;

                gainNode.gain.value = 0.2;

                oscillator.type = "sine";

                oscillator.start();

                gainNode.gain
                    .exponentialRampToValueAtTime(
                        0.00001,
                        audioCtx.currentTime + 0.5
                    );

                oscillator.stop(
                    audioCtx.currentTime + 0.5
                );

            } catch (e) { }

        }

        /* WRONG SOUND */

        function playWrongSound() {

            try {

                const oscillator =
                    audioCtx.createOscillator();

                const gainNode =
                    audioCtx.createGain();

                oscillator.connect(gainNode);

                gainNode.connect(
                    audioCtx.destination
                );

                oscillator.frequency.value = 300;

                gainNode.gain.value = 0.25;

                oscillator.type = "sawtooth";

                oscillator.start();

                gainNode.gain
                    .exponentialRampToValueAtTime(
                        0.00001,
                        audioCtx.currentTime + 0.4
                    );

                oscillator.stop(
                    audioCtx.currentTime + 0.4
                );

            } catch (e) { }

        }

        /* POPUP */

        function showPopup(correct = true) {

            const popup =
                document.getElementById("emojiPopup");

            const emoji =
                popup.querySelector(".popup-emoji");

            if (correct) {

                emoji.innerHTML =
                    "😊";

                playCorrectSound();

                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });

            } else {

                emoji.innerHTML =
                    "😢";

                playWrongSound();

            }

            popup.classList.add("active");

            setTimeout(() => {

                popup.classList.remove("active");

            }, 1000);

        }

        /* BIG CONFETTI */

        function bigConfetti() {

            confetti({
                particleCount: 200,
                spread: 120,
                origin: { y: 0.6 }
            });

            setTimeout(() => {

                confetti({
                    particleCount: 120,
                    spread: 140,
                    origin: { x: 0.2, y: 0.5 }
                });

                confetti({
                    particleCount: 120,
                    spread: 140,
                    origin: { x: 0.8, y: 0.5 }
                });

            }, 200);

        }

        /* SELECT LEFT */

        leftBoxes.forEach(box => {

            box.onclick = () => {

                if (
                    box.classList.contains(
                        "matched"
                    )
                ) return;

                leftBoxes.forEach(b => {

                    b.classList.remove("active");

                });

                leftDots.forEach(d => {

                    d.style.transform =
                        "translateY(-50%) scale(1)";

                });

                box.classList.add("active");

                const dot =
                    box.querySelector(".dot");

                // dot.style.transform =
                //     "translateY(-50%) scale(1.4)";

                selectedDot = dot;

            };

        });

        /* ANSWER CLICK */

        answers.forEach(answer => {

            answer.onclick = () => {

                if (!selectedDot) return;

                if (
                    answer.classList.contains(
                        "correct"
                    )
                ) return;

                const correct =
                    selectedDot.dataset.match ===
                    answer.innerText.trim();

                /* CORRECT */

                if (correct) {

                    answer.classList.add(
                        "correct"
                    );

                    drawLine(
                        selectedDot,
                        answer
                    );

                    showPopup(true);

                    completed++;

                    selectedDot.parentElement
                        .classList.remove("active");

                    selectedDot.parentElement
                        .classList.add("matched");

                    selectedDot = null;

                    if (
                        completed === answers.length
                    ) {

                        setTimeout(() => {

                            bigConfetti();

                            document
                                .getElementById(
                                    "finalPopup"
                                )
                                .classList.add(
                                    "active"
                                );

                        }, 1000);

                    }

                }

                /* WRONG */

                else {

                    answer.classList.add(
                        "wrong"
                    );

                    showPopup(false);

                    setTimeout(() => {

                        answer.classList.remove(
                            "wrong"
                        );

                    }, 400);

                }

            };

        });

        /* DRAW LINE */

        function drawLine(dot, answer) {

            const dotRect =
                dot.getBoundingClientRect();

            const answerRect =
                answer.querySelector(".right-dot")
                    .getBoundingClientRect();

            const svgRect =
                svg.getBoundingClientRect();

            const x1 =
                dotRect.left +
                dotRect.width / 2 -
                svgRect.left;

            const y1 =
                dotRect.top +
                dotRect.height / 2 -
                svgRect.top;

            const x2 =
                answerRect.left +
                answerRect.width / 2 -
                svgRect.left;

            const y2 =
                answerRect.top +
                answerRect.height / 2 -
                svgRect.top;

            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );

            line.setAttribute("x1", x1);
            line.setAttribute("y1", y1);

            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);

            line.setAttribute(
                "stroke",
                "#333"
            );

            line.setAttribute(
                "stroke-width",
                "3"
            );

            svg.appendChild(line);

        }

    </script>

</body>

</html>
