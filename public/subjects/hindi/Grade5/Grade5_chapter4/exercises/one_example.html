<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

    <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Livvic", sans-serif;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(145deg, #fef5e7 0%, #fae8f0 100%);
        }

        .app {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 30px 20px 120px;
            overflow-y: auto;
        }

        .template {
            width: min(1200px, 100%);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .heading {
            font-size: 1.2rem;
            font-weight: 700;
            color: #bc5f7a;
            background: #fff2f0;
            padding: 0.7rem 1.6rem;
            width: 40%;
            margin: auto;
            border-radius: 60px;
            text-align: center;
            border: 1px solid #ffcdd9;
            margin-bottom: 30px;
        }

        .questions-wrap {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            column-gap: 40px;
            row-gap: 35px;
            margin-top: 10px;
        }

        .question-card {
            width: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            padding: 15px 10px;
            transition: all 0.3s ease;
        }

        .question-card.disabled-card {
            opacity: 0.5;
            background: rgba(200, 200, 200, 0.3);
        }

        .question-card.current-card {
            opacity: 1;
            background: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 2px solid #ff95bb;
        }

        .question-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .q-number {
            font-size: 24px;
            font-weight: 700;
            color: #555;
            display: none;
        }

        .word-image {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #ff95bb;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .word-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .input-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .letter-box {
            min-width: 52px;
            height: 56px;
            padding: 0 10px;
            border-radius: 14px;
            background: white;
            border: 2px solid #ff95bb;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 700;
            color: #333;
            transition: .2s;
            cursor: pointer;
        }

        .letter-box.locked {
            background: #dfffe5;
            border-color: #27c75c;
            color: #13813b;
            cursor: default;
        }

        .letter-box.wrong {
            background: #ffe0e0;
            border-color: red;
            animation: blink .5s ease;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .2;
            }
        }

        .options {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .option-btn {
            min-width: 46px;
            height: 44px;
            padding: 0 10px;
            border-radius: 12px;
            border: none;
            background: #ff5f9f;
            color: white;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
            box-shadow: 0 5px 10px rgba(0, 0, 0, .12);
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .option-btn.disabled,
        .option-btn:disabled {
            opacity: .4;
            pointer-events: none;
        }

        .navigation-btns {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
        }

        .nav-btn {
            border: none;
            background: #ff4f9a;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0, 0, 0, .18);
            transition: .2s;
            display: none;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
        }

        /* EMOJI POPUP */
        .emoji-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .emoji-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .popup-emoji-large {
            font-size: 200px;
        }

        /* FINAL POPUP */
        .final-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* background: rgba(0,0,0,.75); */
            /* backdrop-filter: blur(8px); */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: .3s;
        }

        .final-popup-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .final-popup {
            background: linear-gradient(135deg, #fff9e6, #e6fff5);
            border-radius: 80px;
            padding: 40px 50px;
            text-align: center;
            max-width: 480px;
            width: 85%;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3), 0 0 0 10px #ffd966, 0 0 0 18px #ff9f4a;
            animation: finalBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .final-popup h2 {
            font-size: 2rem;
            color: #d45a2b;
            margin-bottom: 15px;
        }

        .final-stars {
            font-size: 3rem;
            letter-spacing: 12px;
            margin: 18px 0;
        }

        .popup-playagain-btn {
            background: linear-gradient(135deg, #ffac30, #ff8c00);
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Lock icon indicator */
        .lock-indicator {
            font-size: 12px;
            margin-top: 5px;
            color: #ff6f91;
        }

        /* Responsive */
        @media (max-width:768px) {
            .question-card {
                width: 220px;
            }

            .letter-box {
                min-width: 45px;
                height: 48px;

            }

            .option-btn {

            }

        /* High Resolution Retina Displays */
        @media screen and (-webkit-min-device-pixel-ratio: 2),
        (min-resolution: 192dpi) {
            .word-image img {
                image-rendering: -webkit-optimize-contrast;
                image-rendering: crisp-edges;
            }

            .option-btn {
                font-weight: 700;
            }
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                overflow: visible;
            }

            .nav-btn,
            .emoji-popup,
            .final-popup-overlay,
            .option-btn,
            .letter-box {
                display: none;
            }

            .question-card {
                break-inside: avoid;
                page-break-inside: avoid;
                border: 1px solid #ccc;
                box-shadow: none;
            }

            .heading {
                background: #f0f0f0;
                color: black;
                border: 1px solid #ccc;
            }

            .letter-box.locked {
                background: #f0f0f0;
                border: 1px solid #999;
                color: black;
            }
        }

        /* Reduced Motion Preference */
        @media (prefers-reduced-motion: reduce) {

            .option-btn,
            .nav-btn,
            .question-card,
            .letter-box {
                transition: none !important;
                animation: none !important;
            }

            .option-btn:hover:not(:disabled) {
                transform: none;
            }

            @keyframes blink {

                0%,
                100% {
                    opacity: 1;
                }
            }
        }
    </style>

            <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
</head>

<body>

    <div class="app">

        <div class="template">

            <div class="heading">
                📝 चित्र देखिए और उचित अक्षरों को क्लिक कर शब्द पूरा कीजिए 📝
            </div>

            <div class="questions-wrap" id="questionsWrap">
            </div>

            <div class="navigation-btns">

                <button id="prevBtn" class="nav-btn" onclick="prevPage()">
                    ⬅ पिछला
                </button>

                <button id="nextBtn" class="nav-btn" onclick="nextPage()">
                    अगला ➡
                </button>

            </div>

        </div>

    </div>

    <!-- EMOJI POPUP -->
    <div id="emojiPopup" class="emoji-popup">
        <div class="popup-emoji-large" id="popupEmoji">😊</div>
    </div>

    <!-- FINAL POPUP -->
    <div id="finalPopup" class="final-popup-overlay">
        <div class="final-popup">
            <h2>🎉 बहुत बहुत बधाई! 🎉</h2>
            <div class="final-stars">⭐⭐⭐⭐⭐</div>
            <p>आपने सभी प्रश्न सही किए!</p>
            <p>✨ आप होशियार हो! ✨</p>
            <button class="popup-playagain-btn" onclick="location.reload()">
                🔄 फिर से खेलें
            </button>
        </div>
    </div>

    <script>

        // ======================== QUESTION DATA ========================
        const pages = [

            [
                {
                    image: "../assets/images/tree.png",
                    word: "पेड़",
                    wordParts: ["पे", "ड़"],
                    options: ["पे", "ड़", "क"]
                },
                {
                    image: "../assets/images/tracher.png",
                    word: "शिक्षक",
                    wordParts: ["शि", "क्षक"],
                    options: ["शि", "क्षक", "न"]
                },
                {
                    image: "../assets/images/boy.png",
                    word: "बालक",
                    wordParts: ["बा", "लक"],
                    options: ["बा", "लक", "र"]
                },
                {
                    image: "../assets/images/roak.png",
                    word: "पत्थर",
                    wordParts: ["पत्थ", "र"],
                    options: ["पत्थ", "र", "ल"]
                }
            ]

        ];

        // Shuffle options
        pages.forEach(page => {
            page.forEach(item => {
                item.options.sort(() => Math.random() - 0.5);
            });
        });

        // ======================== GLOBAL STATE ========================
        const wrap = document.getElementById("questionsWrap");
        let currentPage = 0;
        let currentActiveQuestionIndex = 0;  // Which question is currently active (0 to length-1)
        let solvedStatus = {};  // { pageIndex: { questionIndex: true/false } }

        // Initialize solved status
        function initSolvedStatus() {
            solvedStatus = {};
            for (let p = 0; p < pages.length; p++) {
                solvedStatus[p] = {};
                for (let q = 0; q < pages[p].length; q++) {
                    solvedStatus[p][q] = false;
                }
            }
        }
        initSolvedStatus();

        // ======================== HELPER FUNCTIONS ========================
        let audioCtx = null;

        function playCorrectSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 880;
                gainNode.gain.value = 0.2;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch (e) { }
        }

        function playWrongSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 440;
                gainNode.gain.value = 0.25;
                oscillator.type = 'sawtooth';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
                oscillator.stop(audioCtx.currentTime + 0.4);
            } catch (e) { }
        }

        function showPopup(isCorrect) {
            const popup = document.getElementById("emojiPopup");
            const popupEmoji = document.getElementById("popupEmoji");

            if (isCorrect) {
                popupEmoji.textContent = "😊";
                playCorrectSound();
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            } else {
                popupEmoji.textContent = "😢";
                playWrongSound();
            }

            popup.classList.add("active");
            setTimeout(() => {
                popup.classList.remove("active");
            }, 900);
        }

        function showFinalCelebration() {
            setTimeout(() => {
                document.getElementById("finalPopup").classList.add("active");
                confetti({ particleCount: 220, spread: 120, origin: { y: 0.5 } });
            }, 700);
        }

        // Check if all questions on current page are solved
        function isAllQuestionsSolved() {
            for (let i = 0; i < pages[currentPage].length; i++) {
                if (!solvedStatus[currentPage][i]) return false;
            }
            return true;
        }

        // Update navigation buttons visibility
        function updateNavButtons() {
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");

            prevBtn.style.display = currentPage === 0 ? "none" : "block";

            if (isAllQuestionsSolved()) {
                if (currentPage === pages.length - 1) {
                    // All done, show final popup after a delay
                    setTimeout(showFinalCelebration, 500);
                    nextBtn.style.display = "none";
                } else {
                    nextBtn.style.display = "block";
                }
            } else {
                nextBtn.style.display = "none";
            }
        }

        // Find the first unsolved question index
        // function getFirstUnsolvedIndex() {
        //     for (let i = 0; i < pages[currentPage].length; i++) {
        //         if (!solvedStatus[currentPage][i]) {
        //             return i;
        //         }
        //     }
        //     return -1;
        // }

        // Enable/disable question cards based on which one is currently active
        function updateCardActivation() {
            const cards = document.querySelectorAll(".question-card");

            cards.forEach((card, idx) => {
                card.classList.remove("disabled-card", "current-card");

                if (solvedStatus[currentPage][idx]) {
                    // solved card
                    const btns = card.querySelectorAll(".option-btn");
                    btns.forEach(btn => {
                        btn.disabled = true;
                        btn.classList.add("disabled");
                    });
                } else {
                    // every unsolved question is active
                    const btns = card.querySelectorAll(".option-btn");
                    btns.forEach(btn => {
                        btn.disabled = false;
                        btn.classList.remove("disabled");
                    });
                }
            });
        }

        // Remove letter from a box (only if it's the active question)
        function removeLetter(qIndex, boxIndex) {
            // const firstUnsolved = getFirstUnsolvedIndex();

            // Only allow removal from the currently active question
            // if (qIndex !== firstUnsolved) return;

            const card = document.querySelectorAll(".question-card")[qIndex];
            if (!card) return;

            const boxes = card.querySelectorAll(".letter-box");
            const buttons = card.querySelectorAll(".option-btn");
            const targetBox = boxes[boxIndex];

            if (targetBox.classList.contains("locked")) return;

            const value = targetBox.textContent.trim();
            if (value === "") return;

            targetBox.textContent = "";

            // Re-enable the corresponding option button
            buttons.forEach(btn => {
                if (btn.textContent.trim() === value) {
                    btn.disabled = false;
                    btn.classList.remove("disabled");
                }
            });
        }

        // Fill letter in the next empty box
        function fillLetter(selected, qIndex, clickedBtn) {
            // const firstUnsolved = getFirstUnsolvedIndex();

            // Only allow filling in the currently active question
            // if (qIndex !== firstUnsolved) return;

            const card = document.querySelectorAll(".question-card")[qIndex];
            if (!card) return;

            const boxes = card.querySelectorAll(".letter-box");
            const buttons = card.querySelectorAll(".option-btn");

            // Find first empty box
            let targetBox = null;
            for (let box of boxes) {
                if (box.textContent.trim() === "") {
                    targetBox = box;
                    break;
                }
            }

            if (!targetBox) return;

            // Fill the letter
            targetBox.textContent = selected;
            clickedBtn.disabled = true;
            clickedBtn.classList.add("disabled");

            // Check if all boxes are filled
            let allFilled = true;
            let formedWord = "";
            let originalWord = "";

            for (let box of boxes) {
                const text = box.textContent.trim();
                if (text === "") {
                    allFilled = false;
                    break;
                }
                formedWord += text;
                originalWord += box.dataset.answer;
            }

            if (!allFilled) return;

            // Verify answer
            if (formedWord === originalWord) {
                // Correct answer!
                solvedStatus[currentPage][qIndex] = true;

                // Lock all boxes in this card
                boxes.forEach(box => {
                    box.classList.add("locked");
                });

                // Disable all buttons in this card
                buttons.forEach(btn => {
                    btn.disabled = true;
                    btn.classList.add("disabled");
                });

                showPopup(true);

                // Re-render activation state for next question
                updateCardActivation();
                updateNavButtons();

                // Check if page is complete (handled in updateNavButtons)
            } else {
                // Wrong answer - show error and reset
                showPopup(false);

                boxes.forEach(box => {
                    box.classList.add("wrong");
                });

                setTimeout(() => {
                    boxes.forEach(box => {
                        box.classList.remove("wrong");
                        box.textContent = "";
                    });

                    // Re-enable all option buttons for this card
                    buttons.forEach(btn => {
                        btn.disabled = false;
                        btn.classList.remove("disabled");
                    });

                    updateCardActivation();
                }, 700);
            }
        }

        // ======================== RENDER PAGE ========================
        function loadPage(index) {
            wrap.innerHTML = "";
            currentPage = index;

            const pageData = pages[index];

            pageData.forEach((item, qIndex) => {
                const letters = item.wordParts;
                const isSolved = solvedStatus[currentPage][qIndex];

                let boxesHtml = "";
                letters.forEach((l, i) => {
                    boxesHtml += `
                        <div class="letter-box ${isSolved ? "locked" : ""}"
                             data-answer="${l}"
                             onclick="removeLetter(${qIndex}, ${i})">
                            ${isSolved ? l : ""}
                        </div>
                    `;
                });

                let optionsHtml = "";
                item.options.forEach(letter => {
                    optionsHtml += `
                        <button class="option-btn"
                                onclick="fillLetter('${letter}', ${qIndex}, this)">
                            ${letter}
                        </button>
                    `;
                });

                const cardHtml = `
                    <div class="question-card ${isSolved ? "" : ""}" id="card-${qIndex}">
                        <div class="question-top">
                            <div class="q-number">${qIndex + 1})</div>
                            <div class="word-image">
                                <img src="${item.image}" alt="image" onerror="this.src='https://placehold.co/100x100?text=🖼️'">
                            </div>
                        </div>
                        <div class="input-row">
                            ${boxesHtml}
                        </div>
                        <div class="options">
                            ${optionsHtml}
                        </div>
                    </div>
                `;

                wrap.innerHTML += cardHtml;
            });

            updateCardActivation();
            updateNavButtons();
        }

        // ======================== NAVIGATION ========================
        function nextPage() {
            if (isAllQuestionsSolved() && currentPage < pages.length - 1) {
                currentPage++;
                loadPage(currentPage);
                window.scrollTo(0, 0);
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                loadPage(currentPage);
                window.scrollTo(0, 0);
            }
        }

        // Make functions globally accessible for inline onclick
        window.removeLetter = removeLetter;
        window.fillLetter = fillLetter;
        window.nextPage = nextPage;
        window.prevPage = prevPage;

        // ======================== INIT AUDIO ON FIRST CLICK ========================
        function initAudioOnFirstClick() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const silentBuffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = silentBuffer;
                source.connect(audioCtx.destination);
                source.start();
            } catch (e) { }
        }
        document.body.addEventListener('click', initAudioOnFirstClick, { once: true });

        // ======================== START ========================
        loadPage(0);

    </script>

</body>

</html>
