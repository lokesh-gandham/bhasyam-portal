    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Livvic", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* background: linear-gradient(145deg, #fef5e7 0%, #fae8f0 100%);
            padding: 20px; */
        }

        .quiz {
            width: 100%;
            max-width: 1000px;
        }

        /* QUESTION */
        .question-box {
            font-size: 1.2rem;
            font-weight: 700;
            color: #bc5f7a;
            background: #fff2f0;
            padding: 0.7rem 1.6rem;
            width: 80%;
            margin: auto;
            border-radius: 60px;
            text-align: center;
            border: 1px solid #ffcdd9;
            margin-bottom: 30px;
        }

        /* LAYOUT */
        .quiz-layout {
            display: flex;
            gap: 20px;
            width: 100%;
            flex-wrap: wrap;
        }

        /* LEFT SECTION - Image */
        .left-section {
            flex: 1;
            min-width: 280px;
            min-height: 300px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .meaning-image {
            width: 100%;
            max-width: 300px;
            height: auto;
            object-fit: contain;
            display: block;
            background: #fff0e0;
            border-radius: 40px;
            padding: 20px;
            border: 3px solid #ffaa55;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        /* RIGHT SECTION - Poem Box with Parts Options */
        .right-section {
            flex: 1;
            min-width: 300px;
        }

        .poem-box {
            /* background: white;
            border: 2px solid #becae3;
            border-radius: 35px; */
            padding: 30px;
            min-height: 400px;
            /* box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); */
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .poem-line {
            font-size: 2rem;
            line-height: 2;
            color: #5a6a8a;
            font-weight: 500;
            text-align: center;
        }

        .blank-input {
            display: inline-block;
            min-width: 150px;
            padding: 8px 15px;
            background: #f0f0f0;
            border-radius: 40px;
            color: #1f7a48;
            font-weight: 700;
            font-size: 1.3rem;
            text-align: center;
            margin: 0 5px;
        }

        .blank-input.filled {
            background: #c7ffdb;
            border: 2px solid #2ecc71;
        }

        /* Parts Options */
        .parts-container {
            margin-top: 10px;
            border-top: 2px dashed #becae3;
            padding-top: 20px;
        }

        .parts-title {
            font-size: 1rem;
            font-weight: 600;
            color: #5a6a8a;
            text-align: center;
            margin-bottom: 15px;
            padding: 5px;
            background: #ffffff;
            border-radius: 40px;
        }

        .parts-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .part-btn {
            background: white;
            border: 2px solid #becae3;
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 25px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            color: #5a6a8a;
        }

        .part-btn:hover {
            transform: translateY(-3px);
            background: #fff5ea;
            border-color: #ffaa55;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.1);
        }

        .part-btn.disabled-part {
            opacity: 0.5;
            pointer-events: none;
        }

        /* WRONG */
        .selected-wrong {
            animation: shakeAnim 0.3s ease-in-out 0s 2;
            background: #fdcccc;
            border-color: #e74c3c;
        }

        @keyframes shakeAnim {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        /* NAV */
        .nav-area {
            margin-top: 30px;
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        .nav-btn {
            width: 150px;
            border: none;
            font-size: 1.1rem;
            /* font-weight: bold; */
            color: white;
            padding: 12px 32px;
            border-radius: 50px;
            cursor: pointer;
        }

        .prev-btn {
            background: linear-gradient(#ff9aa2, #ff6f91);
            box-shadow: 0 4px 0 #d29ba0;
        }

        .next-btn {
            background: linear-gradient(#b39ddb, #9575cd);
            box-shadow: 0 4px 0 #b9aad6;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c25d1a;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* POPUP */
        .emoji-popup-simple {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.2));
        }

        .emoji-popup-simple.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .popup-emoji-large {
            font-size: 200px;
            animation: emojiBounce 0.4s ease;
        }

        @keyframes emojiBounce {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* FINAL POPUP */
        .final-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* background: rgba(0, 0, 0, 0.7); */
            /* backdrop-filter: blur(8px); */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .final-popup-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .final-popup {
            background: linear-gradient(135deg, #fff9e6, #e6fff5);
            border-radius: 80px;
            padding: 35px 45px;
            text-align: center;
            max-width: 450px;
            width: 85%;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3), 0 0 0 10px #ffd966, 0 0 0 18px #ff9f4a;
            animation: finalBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .final-popup h2 {
            font-size: 2rem;
            color: #d45a2b;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .final-stars {
            font-size: 3rem;
            letter-spacing: 12px;
            margin: 18px 0;
            color: #ffc107;
        }

        .final-popup p {
            font-size: 1.2rem;
            color: #5a3e2b;
            margin: 15px 0;
            font-weight: 500;
        }

        .popup-playagain-btn {
            background: linear-gradient(135deg, #ffac30, #ff8c00);
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 0 #b4621a;
            transition: 0.05s linear;
        }

        .popup-playagain-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b4621a;
        }

        /* RESPONSIVE */
        @media (max-width: 800px) {
            .quiz-layout {
                flex-direction: column;
            }

            .left-section {
                order: -1;
            }

            .meaning-image {
                max-width: 200px;
            }

            .poem-line {
                font-size: 1rem;
            }

            .blank-input {
                min-width: 100px;
                font-size: 1rem;
            }

            .part-btn {
                padding: 6px 12px;
                font-size: 1rem;
            }
            .question-box {

                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {

            }

            .blank-input {
                min-width: 80px;
                font-size: 0.85rem;
            }

            .part-btn {
                font-size: 0.85rem;
            }
        }

        max-width: 200px;
    }
    
    .blank-input {
        background: transparent;
        border: 1px solid #ccc;
    }
}
    
/* DRAG & DROP UPDATE */
.blank-input{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:150px;

    padding:7px 16px;

<body>

    <div class="quiz">

        <div class="question-box">
            🖼️  सही शब्द को खींचकर रिक्त स्थान की पूर्ति कीजिए। 🖼️
        </div>

        <div class="quiz-layout">

            <!-- LEFT SECTION - Image -->
            <div class="left-section">
                <img id="meaningImage" src="" alt="Picture" class="meaning-image">
            </div>

            <!-- RIGHT SECTION - Poem Box with Parts -->

            </div>

    <!-- FINAL POPUP -->
    <div id="finalPopup" class="final-popup-overlay">
        <div class="final-popup">
            <h2>🎉 बहुत बहुत बधाई! 🎉</h2>
            <div class="final-stars">⭐⭐⭐⭐⭐</div>
            <p>आपने सभी शब्द सही बनाए!</p>
            <p>✨ आप होशियार हो! ✨</p>
            <button class="popup-playagain-btn" id="playAgainBtn">🔄 फिर से खेलें</button>
        </div>
    </div>

    <script>
        // AUDIO
        let audioCtx = null;

        function playCorrectSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 880;
                gainNode.gain.value = 0.2;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.log("Audio error:", e);
            }
        }

        function playWrongSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 440;
                gainNode.gain.value = 0.25;
                oscillator.type = 'sawtooth';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
                oscillator.stop(audioCtx.currentTime + 0.4);
            } catch (e) {
                console.log("Audio error:", e);
            }
        }

        // QUESTIONS with WORKING IMAGE URLs (free online images)
   const QUESTIONS = [

    {
        id: 1,

        image: "../assets/images/king.png",

        sentence: "विजयनगर के राजा ____ सैर करने निकले।",

        parts: ["सुबह", "-", "सुबह"],

        correctOrder: ["सुबह", "-", "सुबह"],

        fullWord: "सुबह-सुबह"
    },

    {
        id: 2,

        image: "../assets/images/king1.png",

        sentence: "रास्ते में राजा को एक ____ दिखाई नहीं दिया।",

        parts: ["पत्", "थर"],

        correctOrder: ["पत्", "थर"],

        fullWord: "पत्थर"
    },

    {
        id: 3,

        image: "../assets/images/MCQ3.png",

        sentence: "कई लोग उस रास्ते से ____ , लेकिन किसी ने पत्थर नहीं हटाया।",

        parts: ["गु", "जरे"],

        correctOrder: ["गु", "जरे"],

        fullWord: "गुजरे"
    },

    {
        id: 4,

        image: "../assets/images/school-boy.png",

        sentence: "एक ____ वहाँ आया, जो विद्यालय जा रहा था।",

        parts: ["बा", "लक"],

        correctOrder: ["बा", "लक"],

        fullWord: "बालक"
    },

    {
        id: 5,

        image: "../assets/images/roak.png",

        sentence: "बालक ने सोचा कि यह पत्थर सबके लिए ____ है।",

        parts: ["ख", "तरा"],

        correctOrder: ["ख", "तरा"],

        fullWord: "खतरा"
    },

    {
        id: 6,

        image: "../assets/images/help-boy.png",

        sentence: "बालक के पत्थर हटाने से राजा बहुत ____ हुए।",

        parts: ["खु","श"],

        correctOrder: ["खु","श"],

        fullWord: "खुश"
    }

];
        // VARIABLES
        let currentIndex = 0;
        let quizCompleted = false;
        let userStates = [];

        function initStates() {
            userStates = [];
            for (let q = 0; q < QUESTIONS.length; q++) {
                userStates.push({
                    selectedParts: [],
                    isCorrect: false
                });
            }
        }
        initStates();

        const meaningImage = document.getElementById("meaningImage");
        const poemLine = document.getElementById("poemLine");
        const partsList = document.getElementById("partsList");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const popup = document.getElementById("simpleEmojiPopup");
        const popupEmoji = document.getElementById("popupEmoji");
        const finalPopup = document.getElementById("finalPopup");
        const playAgainBtn = document.getElementById("playAgainBtn");

        let popupTimeout = null;
        let popupShownForCurrentQuestion = false;

        function showPopup(isCorrect) {
            if (popupTimeout) clearTimeout(popupTimeout);

            if (isCorrect) {
                popupEmoji.textContent = "😊";
                playCorrectSound();
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 60, spread: 65, origin: { y: 0.6 }, colors: ['#ffb347', '#2ecc71', '#f1c40f'] });
                }
            } else {
                popupEmoji.textContent = "😢";
                playWrongSound();
            }

            popup.classList.add("active");
            popupTimeout = setTimeout(() => {
                popup.classList.remove("active");
            }, 800);
        }

        function bigConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 200, spread: 110, origin: { y: 0.5 }, startVelocity: 28 });
                setTimeout(() => {
                    confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.2 } });
                    confetti({ particleCount: 120, spread: 130, origin: { y: 0.4, x: 0.8 } });
                }, 150);
                setTimeout(() => {
                    confetti({ particleCount: 80, spread: 90, origin: { y: 0.7 } });
                }, 300);
            }
        }

        // function speak(text) {
        //     speechSynthesis.cancel();
        //     const msg = new SpeechSynthesisUtterance(text);
        //     msg.lang = "hi-IN";
        //     msg.volume = 0.25;
        //     speechSynthesis.speak(msg);
        // }

        function showFinalCelebration() {
            if (quizCompleted) return;
            quizCompleted = true;
            bigConfetti();
            // speak("बहुत बहुत बधाई! आपने सभी शब्द सही बनाए!");
            setTimeout(() => {
                finalPopup.classList.add("active");
                prevBtn.disabled = true;
                nextBtn.disabled = true;
            }, 500);
        }

        function checkQuizComplete() {
            if (userStates.every(q => q.isCorrect)) {
                setTimeout(() => {
                    showFinalCelebration();
                }, 700);
            }
        }

        function updateBlankDisplay() {
            const q = QUESTIONS[currentIndex];
            const state = userStates[currentIndex];

            let blankContent = state.selectedParts.length
                ? state.selectedParts.join('')
                : "_____";

            if (state.isCorrect) blankContent = q.fullWord;

            poemLine.innerHTML =
                `Q${q.id}. ${q.sentence.replace(
                    "____",
                    `<span class="blank-input ${state.isCorrect ? 'filled' : ''}" id="dropBlank" data-drop-target="true">${blankContent}</span>`
                )}`;

            setupDropTarget();
        }

        function handleDroppedPart(partValue, sourceElement) {
            const q = QUESTIONS[currentIndex];
            const state = userStates[currentIndex];

            if (state.isCorrect) return;

            const nextExpectedIndex = state.selectedParts.length;
            const expectedPart = q.correctOrder[nextExpectedIndex];

            if (partValue === expectedPart) {
                state.selectedParts.push(partValue);

                if (sourceElement) {
                    sourceElement.classList.add("disabled-part");
                    sourceElement.draggable = false;
                    sourceElement.style.pointerEvents = "none";
                }

                playCorrectSound();
                updateBlankDisplay();

                if (state.selectedParts.length === q.correctOrder.length) {
                    state.isCorrect = true;
                    updateBlankDisplay();

                    document.querySelectorAll(".part-btn").forEach(btn => {
                        btn.classList.add("disabled-part");
                        btn.draggable = false;
                        btn.style.pointerEvents = "none";
                    });

                    if (!popupShownForCurrentQuestion) {
                        popupShownForCurrentQuestion = true;
                        showPopup(true);
                    }

                    nextBtn.disabled = false;
                    checkQuizComplete();
                }
            } else {
                showPopup(false);

                if (sourceElement) {
                    sourceElement.classList.add("selected-wrong");
                    setTimeout(() => {
                        sourceElement.classList.remove("selected-wrong");
                    }, 500);
                }
            }
        }

        function setupDropTarget() {
            const dropBlank = document.getElementById("dropBlank");
            if (!dropBlank) return;

            dropBlank.addEventListener("dragover", e => {
                e.preventDefault();
                if (!userStates[currentIndex].isCorrect) {
                    dropBlank.classList.add("drag-over");
                }
            });

            dropBlank.addEventListener("dragleave", () => {
                dropBlank.classList.remove("drag-over");
            });

            dropBlank.addEventListener("drop", e => {
                e.preventDefault();
                dropBlank.classList.remove("drag-over");

                const partValue = e.dataTransfer.getData("text/plain");
                const sourceId = e.dataTransfer.getData("sourceId");
                const source = sourceId ? document.getElementById(sourceId) : null;

                if (partValue) {
                    handleDroppedPart(partValue, source);
                }
            });
        }

        function loadQuestion() {
            const q = QUESTIONS[currentIndex];
            const state = userStates[currentIndex];

            popupShownForCurrentQuestion = false;

            meaningImage.src = q.image;
            meaningImage.alt = q.fullWord + " का चित्र";
            meaningImage.onerror = function() {
                this.src = "https://cdn-icons-png.flaticon.com/512/1380/1380338.png";
            };

            let blankContent = state.isCorrect
                ? q.fullWord
                : (state.selectedParts.length ? state.selectedParts.join('') : "_____");

            poemLine.innerHTML =
                `Q${q.id}. ${q.sentence.replace(
                    "____",
                    `<span class="blank-input ${state.isCorrect ? 'filled' : ''}" id="dropBlank" data-drop-target="true">${blankContent}</span>`
                )}`;

            partsList.innerHTML = "";

            const shuffledParts = [...q.parts].sort(() => Math.random() - 0.5);

            shuffledParts.forEach((part, index) => {
                const btn = document.createElement("div");
                btn.className = "part-btn";
                btn.textContent = part;
                btn.draggable = !state.isCorrect && !state.selectedParts.includes(part);

                // Unique id is needed to identify the dragged option.
                btn.id = `dragPart_${currentIndex}_${index}`;

                const isUsed = state.selectedParts.includes(part);

                if (state.isCorrect || isUsed) {
                    btn.classList.add("disabled-part");
                    btn.draggable = false;
                } else {
                    btn.addEventListener("dragstart", e => {
                        e.dataTransfer.setData("text/plain", part);
                        e.dataTransfer.setData("sourceId", btn.id);
                        e.dataTransfer.effectAllowed = "move";
                        btn.classList.add("dragging");
                    });

                    btn.addEventListener("dragend", () => {
                        btn.classList.remove("dragging");
                    });

                    // Pointer/touch drag: no click-to-answer behavior.
                    let pointerDragging = false;
                    let ghost = null;

                    btn.addEventListener("pointerdown", e => {
                        if (e.pointerType === "mouse") return;
                        pointerDragging = true;
                        btn.setPointerCapture(e.pointerId);
                        btn.classList.add("dragging");
                    });

                    btn.addEventListener("pointermove", e => {
                        if (!pointerDragging) return;
                        const drop = document.getElementById("dropBlank");
                        if (!drop) return;

                        const r = drop.getBoundingClientRect();
                        const inside =
                            e.clientX >= r.left && e.clientX <= r.right &&
                            e.clientY >= r.top && e.clientY <= r.bottom;

                        drop.classList.toggle("drag-over", inside);
                    });

                    btn.addEventListener("pointerup", e => {
                        if (!pointerDragging) return;
                        pointerDragging = false;
                        btn.classList.remove("dragging");

                        const drop = document.getElementById("dropBlank");
                        if (!drop) return;

                        const r = drop.getBoundingClientRect();
                        const inside =
                            e.clientX >= r.left && e.clientX <= r.right &&
                            e.clientY >= r.top && e.clientY <= r.bottom;

                        drop.classList.remove("drag-over");

                        if (inside) {
                            handleDroppedPart(part, btn);
                        }
                    });

                    btn.addEventListener("pointercancel", () => {
                        pointerDragging = false;
                        btn.classList.remove("dragging");
                        document.getElementById("dropBlank")?.classList.remove("drag-over");
                    });
                }

                partsList.appendChild(btn);
            });

            setupDropTarget();

            nextBtn.disabled = !state.isCorrect;
            prevBtn.disabled = (currentIndex === 0);
        }

        // Navigation
        nextBtn.addEventListener("click", () => {
            if (currentIndex < QUESTIONS.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        });

        prevBtn.addEventListener("click", () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        });

        // Play Again
        playAgainBtn.addEventListener("click", () => {
            currentIndex = 0;
            quizCompleted = false;
            initStates();
            finalPopup.classList.remove("active");
            loadQuestion();
        });

        // Initialize audio on first click
        function initAudioOnFirstClick() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start();
            } catch (e) {
                console.log("Audio init error:", e);
            }
        }

        document.body.addEventListener('click', initAudioOnFirstClick, { once: true });

        // Start the quiz
        loadQuestion();
    </script>
