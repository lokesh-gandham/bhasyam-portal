<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1"
>

<title>Count and Pop</title>

<link
    href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* ==========================================
   RESET
========================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:'Livvic',sans-serif;

    background:#ffffff;

    color:#40394d;

    user-select:none;
}


/* ==========================================
   MAIN GAME
========================================== */

#game{

    width:100%;
    height:100vh;

    position:relative;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}


/* ==========================================
   QUESTION SECTION
========================================== */

#questionSection{

    width:100%;

    height:47vh;

    min-height:300px;

    flex-shrink:0;

    display:flex;
    flex-direction:column;

    align-items:center;

    justify-content:center;

    position:relative;

    z-index:5;

    padding:15px 20px 5px;
}


/* ==========================================
   QUESTION HEADING
========================================== */

#questionHeading{

    margin:0 0 8px;

    font-size:clamp(25px,4vw,42px);

    font-weight:900;

    text-align:center;

    letter-spacing:.2px;

    color:#40394d;

    animation:headingIn .5s ease;
}


@keyframes headingIn{

    from{
        opacity:0;
        transform:translateY(-15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* ==========================================
   SINGLE BIG QUESTION IMAGE
========================================== */

#imageStage{

    width:min(1200px,94vw);

    height:calc(100% - 65px);

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    overflow:visible;
}


#questionImage{

    max-width:100%;

    max-height:100%;

    width:auto;

    height:auto;

    object-fit:contain;

    display:block;

    filter:
        drop-shadow(
            0 10px 12px
            rgba(0,0,0,.08)
        );

    animation:imageIn .55s ease;
}


@keyframes imageIn{

    from{

        opacity:0;

        transform:
            scale(.90)
            translateY(15px);

    }

    to{

        opacity:1;

        transform:
            scale(1)
            translateY(0);

    }

}


/* ==========================================
   BALLOON GAME AREA
========================================== */

#balloonArea{

    flex:1;

    width:100%;

    min-height:280px;

    position:relative;

    overflow:hidden;

    border-top:
        1px solid
        rgba(64,57,77,.06);
}


/* ==========================================
   INSTRUCTION
========================================== */

#instruction{

    position:absolute;

    top:10px;

    left:50%;

    transform:translateX(-50%);

    width:100%;

    text-align:center;

    font-size:clamp(16px,2.3vw,22px);

    font-weight:800;

    color:#7b7484;

    z-index:10;

    pointer-events:none;
}


/* ==========================================
   ATTRACTIVE BALLOON
========================================== */

.balloon{

    position:absolute;

    width:150px;

    height:215px;

    cursor:pointer;

    pointer-events:auto;

    z-index:3;

    transition:
        filter .2s ease;
}


.balloon:hover{

    filter:
        brightness(1.05)
        saturate(1.1);

}


/* ==========================================
   BALLOON BODY
========================================== */

.balloonBody{

    position:absolute;

    top:0;

    left:0;

    width:150px;

    height:170px;

    border-radius:

        50%
        50%
        48%
        48%

        /

        55%
        55%
        45%
        45%;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    box-shadow:

        inset
        -15px
        -17px
        22px
        rgba(0,0,0,.13),

        inset
        14px
        12px
        20px
        rgba(255,255,255,.38),

        0
        14px
        22px
        rgba(0,0,0,.12);
}


/* ==========================================
   BALLOON SHINE
========================================== */

.balloonBody::before{

    content:"";

    position:absolute;

    top:23px;

    left:28px;

    width:30px;

    height:55px;

    border-radius:50%;

    background:

        linear-gradient(
            90deg,
            rgba(255,255,255,.58),
            rgba(255,255,255,.08)
        );

    transform:rotate(25deg);
}


/* ==========================================
   BALLOON NUMBER
========================================== */

.balloonNumber{

    position:relative;

    z-index:2;

    font-size:62px;

    font-weight:900;

    color:#ffffff;

    text-shadow:

        0 3px 0
        rgba(0,0,0,.08),

        0 5px 10px
        rgba(0,0,0,.15);
}


/* ==========================================
   KNOT
========================================== */

.balloonKnot{

    position:absolute;

    top:163px;

    left:50%;

    transform:
        translateX(-50%);

    width:0;

    height:0;

    border-left:
        13px solid transparent;

    border-right:
        13px solid transparent;

    border-top:
        18px solid;
}


/* ==========================================
   STRING
========================================== */

.balloonString{

    position:absolute;

    top:180px;

    left:50%;

    width:2px;

    height:42px;

    background:
        rgba(85,76,94,.38);

    transform:
        translateX(-50%);

    border-radius:10px;
}


/* ==========================================
   POP
========================================== */

.balloon.pop{

    animation:
        balloonPop .5s
        ease
        forwards;
}


@keyframes balloonPop{

    0%{

        opacity:1;

        transform:
            scale(1);

    }

    40%{

        opacity:1;

        transform:
            scale(1.32);

    }

    100%{

        opacity:0;

        transform:
            scale(.05);

    }

}


/* ==========================================
   WRONG SHAKE
========================================== */

.balloon.shake{

    animation:
        balloonShake .45s ease;
}


@keyframes balloonShake{

    0%,100%{

        margin-left:0;

        transform:
            rotate(0);

    }

    20%{

        margin-left:-14px;

        transform:
            rotate(-7deg);

    }

    40%{

        margin-left:14px;

        transform:
            rotate(7deg);

    }

    60%{

        margin-left:-10px;

    }

    80%{

        margin-left:10px;

    }

}


/* ==========================================
   FEEDBACK
========================================== */

#feedback{

    position:fixed;

    top:50%;

    left:50%;

    width:115px;

    height:115px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:68px;

    font-weight:900;

    color:#ffffff;

    transform:

        translate(-50%,-50%)
        scale(0);

    opacity:0;

    pointer-events:none;

    z-index:100;
}


#feedback.correct{

    background:#64c98b;

    animation:
        feedbackAnimation .75s ease forwards;
}


#feedback.wrong{

    background:#ff8377;

    animation:
        feedbackAnimation .75s ease forwards;
}


@keyframes feedbackAnimation{

    0%{

        opacity:0;

        transform:

            translate(-50%,-50%)
            scale(0);

    }

    35%{

        opacity:1;

        transform:

            translate(-50%,-50%)
            scale(1.15);

    }

    70%{

        opacity:1;

        transform:

            translate(-50%,-50%)
            scale(1);

    }

    100%{

        opacity:0;

        transform:

            translate(-50%,-50%)
            scale(.7);

    }

}


/* ==========================================
   CONFETTI
========================================== */

.confetti{

    position:absolute;

    width:10px;

    height:10px;

    border-radius:3px;

    pointer-events:none;

    z-index:20;
}


/* ==========================================
   FINAL SCREEN
========================================== */

#finalScreen{

    position:fixed;

    inset:0;

    background:#ffffff;

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

    z-index:200;

    padding:25px;
}


#finalScreen.show{

    display:flex;
}


#finalScreen h1{

    margin:10px 0 5px;

    font-size:
        clamp(42px,7vw,70px);

    font-weight:900;

    color:#40394d;
}


#finalScreen p{

    margin:5px 0 25px;

    font-size:
        clamp(18px,3vw,26px);

    font-weight:600;

    color:#81798b;
}


.trophy{

    font-size:
        clamp(100px,15vw,170px);

    animation:
        trophyFloat
        2s
        ease-in-out
        infinite;
}


@keyframes trophyFloat{

    0%,100%{

        transform:
            translateY(0)
            rotate(-5deg);

    }

    50%{

        transform:
            translateY(-18px)
            rotate(5deg);

    }

}


#restartButton{

    border:none;

    border-radius:50px;

    padding:17px 42px;

    font-family:'Livvic',sans-serif;

    font-size:20px;

    font-weight:900;

    cursor:pointer;

    background:#ff8b6a;

    color:#ffffff;

    box-shadow:
        0 7px 0
        #d96d51;

    transition:.2s;
}


#restartButton:hover{

    transform:
        translateY(-3px);
}


#restartButton:active{

    transform:
        translateY(4px);

    box-shadow:
        0 2px 0
        #d96d51;
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:650px){

    #questionSection{

        height:42vh;

        min-height:250px;

        padding-top:10px;
    }


    #imageStage{

        width:96vw;

        height:
            calc(100% - 55px);
    }


    #balloonArea{

        min-height:300px;
    }


    .balloon{

        width:115px;

        height:175px;
    }


    .balloonBody{

        width:115px;

        height:132px;
    }


    .balloonNumber{

        font-size:48px;
    }


    .balloonKnot{

        top:126px;
    }


    .balloonString{

        top:143px;

        height:34px;
    }


    #instruction{

        font-size:15px;

        top:8px;
    }

}


/* ==========================================
   SMALL MOBILE
========================================== */

@media(max-height:650px){

    #questionSection{

        height:40vh;

        min-height:210px;
    }


    #promptWrap{

        transform:
            scale(.9);
    }

}


/* ===== LESSON 1 QUIZ HEADINGS: title large, subheading smaller ===== */
header h1,
header h2,
header .instruction-title,
header .distance-title,
.game-header h1,
.game-header h2,
.game-header .instruction-title,
#questionHeading {
    font-weight: 400 !important;
    font-size: 30px !important;
}
.game-header:not(:has(h1, h2)) .instruction,
.game-header:not(:has(h1, h2)) p.instruction {
    font-weight: 400 !important;
    font-size: 30px !important;
    color: #2f4f4f;
}
header:has(h1, h2, .instruction-title) .instruction,
header:has(h1, h2) .instruction-text,
header:has(h1, h2, .instruction-title) p.instruction,
header:has(h1, h2) p.instruction-text,
.game-header:has(h1, h2) .instruction,
.game-header:has(h1, h2) p.instruction,
#instruction,
.distance-header .instruction-text,
.distance-header p.instruction-text {
    font-weight: 400 !important;
    font-size: 15px !important;
    color: #666;
    line-height: 1.3;
}
header .instruction span,
header .instruction-text span,
header p.instruction span,
header p.instruction-text span,
.game-header .instruction span,
#instruction span {
    font-weight: 700 !important;
    font-size: inherit !important;
}
@media screen and (min-width: 1600px) {
    header h1,
    header h2,
    header .instruction-title,
    header .distance-title,
    .game-header h1,
    .game-header h2,
    .game-header .instruction-title,
    #questionHeading {
        font-size: 40px !important;
    }
    .game-header:not(:has(h1, h2)) .instruction,
    .game-header:not(:has(h1, h2)) p.instruction {
        font-size: 40px !important;
    }
    header:has(h1, h2, .instruction-title) .instruction,
    header:has(h1, h2) .instruction-text,
    header:has(h1, h2, .instruction-title) p.instruction,
    header:has(h1, h2) p.instruction-text,
    .game-header:has(h1, h2) .instruction,
    .game-header:has(h1, h2) p.instruction,
    #instruction,
    .distance-header .instruction-text,
    .distance-header p.instruction-text {
        font-size: 18px !important;
    }
}

/* ===== LAYOUT FIT: the heading always keeps its own space =====
   The header is a fixed-size flex item and the play area takes exactly
   the height that is left over, so artwork can never ride up into the
   title on shorter laptop screens. */
header,
.game-header,
.distance-header {
    flex: 0 0 auto;
    position: relative;
    z-index: 5;
}
main.game-stage,
main.game-area,
.game-stage,
.game-area {
    flex: 1 1 auto;
    height: auto;
    min-height: 0;
}
footer,
.navigation {
    flex: 0 0 auto;
}

/* ===== Sub-heading stays on a single line ===== */
.instruction-box,
.distance-title { max-width: none !important; }
header .instruction,
header .instruction-text,
header p.instruction,
header p.instruction-text,
.game-header .instruction,
#instruction,
.distance-header .instruction-text {
    white-space: nowrap;
    max-width: 100%;
}
@media screen and (max-width: 1100px) {
    header .instruction, header .instruction-text,
    header p.instruction, header p.instruction-text,
    .game-header .instruction,
    #instruction,
    .distance-header .instruction-text {
        white-space: normal;
    }
}
</style>
</head>

<body>


<div id="game">


    <!-- ======================
         QUESTION AREA
    ======================= -->

    <section id="questionSection">

        <h1 id="questionHeading">
            How many birds are there?
        </h1>


        <div id="imageStage">

            <img
                id="questionImage"
                src=""
                alt="Counting question"
            >

        </div>

    </section>


    <!-- ======================
         BALLOON AREA
    ======================= -->

    <section id="balloonArea">

        <div id="instruction">

            Pop the balloon with the correct number!

        </div>

    </section>


</div>


<!-- FEEDBACK -->

<div id="feedback"></div>


<!-- FINAL SCREEN -->

<div id="finalScreen">

    <div class="trophy">
        🏆
    </div>

    <h1>
        Amazing!
    </h1>

    <p>
        You counted everything correctly!
    </p>

    <button
        id="restartButton"
        onclick="restartGame()"
    >

        Play Again ↻

    </button>

</div>


<script>

/* ==========================================
   REQUIRED SPEAK FUNCTION
========================================== */

function speak(t) {

    speechSynthesis.cancel();

    const msg =
        new SpeechSynthesisUtterance(t);

    msg.lang = "en-US";

    msg.volume = 0.25;

    msg.rate = 1;

    msg.pitch = 1;

    speechSynthesis.speak(msg);

}


/* ==========================================
   QUESTIONS

   CHANGE ONLY IMAGE PATHS
========================================== */

const rounds = [

    {

        image:
            "../images/bird_m1.png",

        count:5,

        options:[3,5,7],

        question:
            "How many birds are there?"

    },

    {

        image:
            "../images/m2.png",

        count:6,

        options:[4,6,8],

        question:
            "How many hippos are there?"

    },

    {

        image:
            "../images/m3.png",
        count:4,

        options:[2,4,6],

        question:
            "How many hedgehogs are there?"

    },

    {

        image:
            "../images/m4.png",

        count:3,

        options:[1,3,5],

        question:
            "How many ducks are there?"

    }

];


/* ==========================================
   VARIABLES
========================================== */

let currentRound = 0;

let roundLocked = false;

let spawnTimer = null;


const questionHeading =
    document.getElementById(
        "questionHeading"
    );


const questionImage =
    document.getElementById(
        "questionImage"
    );


const balloonArea =
    document.getElementById(
        "balloonArea"
    );


const feedback =
    document.getElementById(
        "feedback"
    );


const balloonColors = [

    "#ff7f6b",
    "#ffbf45",
    "#5fc98b",
    "#a786e8",
    "#5dbbea"

];


/* ==========================================
   LOAD ROUND
========================================== */

function loadRound(){

    roundLocked = false;


    clearInterval(
        spawnTimer
    );


    clearBalloons();


    const round =
        rounds[currentRound];


    questionHeading.textContent =
        round.question;


    questionImage.style.opacity = "0";


    questionImage.src =
        round.image;


    questionImage.onload =
        function(){

            questionImage.style.opacity =
                "1";

        };


    startBalloonGame(
        round
    );

}


/* ==========================================
   START BALLOONS
========================================== */

function startBalloonGame(round){

    spawnBalloon(round);


    spawnTimer =
        setInterval(
            function(){

                if(!roundLocked){

                    spawnBalloon(round);

                }

            },
            2100
        );

}


/* ==========================================
   CREATE BALLOON
========================================== */

function spawnBalloon(round){

    if(roundLocked) return;


    const values =
        [...round.options];


    const value =
        values[
            Math.floor(
                Math.random()
                * values.length
            )
        ];


    const balloon =
        document.createElement(
            "div"
        );


    balloon.className =
        "balloon";


    const color =
        balloonColors[
            Math.floor(
                Math.random()
                * balloonColors.length
            )
        ];


    balloon.innerHTML = `

        <div
            class="balloonBody"
            style="background:${color}"
        >

            <div class="balloonNumber">

                ${value}

            </div>

        </div>


        <div
            class="balloonKnot"
            style="
                border-top-color:${color}
            "
        ></div>


        <div
            class="balloonString"
        ></div>

    `;


    const areaWidth =
        balloonArea.clientWidth;


    const balloonWidth =
        window.innerWidth <= 650
        ? 115
        : 150;


    const left =
        10
        +
        Math.random()
        *
        Math.max(
            1,
            areaWidth
            - balloonWidth
            - 20
        );


    balloon.style.left =
        left + "px";


    balloonArea.appendChild(
        balloon
    );


    animateBalloon(
        balloon,
        value,
        round
    );

}


/* ==========================================
   FLOAT BALLOON

   Starts safely below screen
   and moves upward.
========================================== */

function animateBalloon(
    balloon,
    value,
    round
){

    const areaHeight =
        balloonArea.clientHeight;


    const duration =
        7500
        +
        Math.random() * 1800;


    const startTime =
        performance.now();


    function animation(now){

        if(
            !balloon.isConnected
            ||
            roundLocked
        ){

            return;

        }


        const progress =
            (now - startTime)
            /
            duration;


        if(progress >= 1){

            balloon.remove();

            return;

        }


        /* Start below area and move upward */

        const startY =
            areaHeight + 40;


        const endY =
            -230;


        const y =
            startY
            +
            (
                endY
                - startY
            )
            *
            progress;


        const wave =
            Math.sin(
                progress
                *
                Math.PI
                *
                4
            )
            *
            28;


        balloon.style.transform =
            `translate(${wave}px,${y}px)`;


        requestAnimationFrame(
            animation
        );

    }


    requestAnimationFrame(
        animation
    );


    balloon.addEventListener(
        "click",
        function(){

            checkAnswer(
                balloon,
                value,
                round
            );

        }
    );

}


/* ==========================================
   CHECK ANSWER
========================================== */

function checkAnswer(
    balloon,
    value,
    round
){

    if(roundLocked) return;


    /* CORRECT */

    if(value === round.count){

        roundLocked = true;


        clearInterval(
            spawnTimer
        );


        balloon.classList.add(
            "pop"
        );


        showFeedback(true);


        /* ONLY CORRECT SOUND */

        speak("Correct!");


        createConfetti(
            balloon
        );


        setTimeout(
            function(){

                currentRound++;


                if(
                    currentRound
                    >= rounds.length
                ){

                    showFinal();

                }

                else{

                    loadRound();

                }

            },
            850
        );

    }


    /* WRONG */

    else{


        balloon.classList.remove(
            "shake"
        );


        void balloon.offsetWidth;


        balloon.classList.add(
            "shake"
        );


        showFeedback(false);


        /* ONLY WRONG SOUND */

        speak("Wrong!");


        setTimeout(
            function(){

                balloon.classList.remove(
                    "shake"
                );

            },
            500
        );

    }

}


/* ==========================================
   FEEDBACK
========================================== */

function showFeedback(correct){

    feedback.className = "";


    if(correct){

        feedback.textContent =
            "✓";


        feedback.classList.add(
            "correct"
        );

    }

    else{

        feedback.textContent =
            "✕";


        feedback.classList.add(
            "wrong"
        );

    }


    setTimeout(
        function(){

            feedback.className = "";

        },
        800
    );

}


/* ==========================================
   CONFETTI
========================================== */

function createConfetti(balloon){

    const rect =
        balloon.getBoundingClientRect();


    const areaRect =
        balloonArea.getBoundingClientRect();


    const centerX =
        rect.left
        -
        areaRect.left
        +
        rect.width / 2;


    const centerY =
        rect.top
        -
        areaRect.top
        +
        rect.height / 2;


    for(
        let i = 0;
        i < 25;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            centerX + "px";


        piece.style.top =
            centerY + "px";


        piece.style.background =
            balloonColors[
                Math.floor(
                    Math.random()
                    *
                    balloonColors.length
                )
            ];


        balloonArea.appendChild(
            piece
        );


        const angle =
            Math.random()
            *
            Math.PI
            *
            2;


        const distance =
            80
            +
            Math.random()
            *
            130;


        const x =
            Math.cos(angle)
            *
            distance;


        const y =
            Math.sin(angle)
            *
            distance;


        requestAnimationFrame(
            function(){

                piece.style.transition =
                    "transform .8s ease-out, opacity .8s ease-out";


                piece.style.transform =
                    `translate(${x}px,${y}px)
                    rotate(360deg)`;


                piece.style.opacity =
                    "0";

            }
        );


        setTimeout(
            function(){

                piece.remove();

            },
            850
        );

    }

}


/* ==========================================
   CLEAR BALLOONS
========================================== */

function clearBalloons(){

    document
        .querySelectorAll(
            ".balloon"
        )
        .forEach(
            function(balloon){

                balloon.remove();

            }
        );

}


/* ==========================================
   FINAL
========================================== */

function showFinal(){

    clearInterval(
        spawnTimer
    );


    clearBalloons();


    document
        .getElementById(
            "finalScreen"
        )
        .classList.add(
            "show"
        );

}


/* ==========================================
   RESTART
========================================== */

function restartGame(){

    currentRound = 0;


    roundLocked = false;


    document
        .getElementById(
            "finalScreen"
        )
        .classList.remove(
            "show"
        );


    loadRound();

}


/* ==========================================
   DIRECT START
========================================== */

loadRound();

</script>
