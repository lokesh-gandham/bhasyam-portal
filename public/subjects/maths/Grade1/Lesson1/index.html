<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade1_Lesson1</title>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:'Livvic',sans-serif;margin:0;padding:0}
body{background:#fbf8eb;color:#29434a;overflow-x:hidden;overflow-y:auto}
body.quiz-open{overflow:hidden}
button{font-family:inherit}

.app{min-height:100vh;height:auto;position:relative;overflow:visible;padding:18px 0 28px;background:
radial-gradient(circle at 8% 12%,rgba(255,193,91,.17) 0 90px,transparent 91px),
radial-gradient(circle at 93% 15%,rgba(91,190,255,.13) 0 115px,transparent 116px),
radial-gradient(circle at 84% 88%,rgba(108,214,134,.14) 0 120px,transparent 121px),#fbf8eb}
.app:before,.app:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.app:before{width:280px;height:280px;left:-135px;bottom:-145px;background:rgba(255,210,106,.12)}
.app:after{width:180px;height:180px;right:-80px;top:-65px;background:rgba(138,108,221,.08)}
.home{width:min(1500px,96vw);margin:auto;position:relative;z-index:1}
.hero{text-align:center;margin-bottom:20px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:8px 18px;border:1px solid #eadfca;background:rgba(255,255,255,.86);border-radius:999px;color:#68747d;font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(86,72,42,.07)}
.eyebrow i{color:#f0a415}
.hero h1{font-size:clamp(30px,3vw,47px);line-height:1.05;margin-top:8px;font-weight:900;letter-spacing:-1px}
.hero h1 span{color:#ed7194}

.cards{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:18px}
.game-card{--accent:#ed7194;--soft:#fff0f4;--ink:#a94b69;position:relative;border:0;border-radius:30px;background:rgba(255,255,255,.92);padding:16px 17px 15px;min-height:260px;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 34px rgba(75,67,50,.10),inset 0 0 0 1px rgba(232,225,210,.85);transition:.25s ease}
.game-card:before{content:"";position:absolute;right:-45px;top:-50px;width:150px;height:150px;border-radius:50%;background:var(--soft);opacity:.8}
.game-card:hover{transform:translateY(-7px) rotate(-.15deg);box-shadow:0 25px 42px rgba(75,67,50,.16),inset 0 0 0 1px rgba(232,225,210,.85)}
.game-card:active{transform:translateY(-2px)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:3}
.card-number{width:39px;height:35px;display:grid;place-items:center;border-radius:12px;background:var(--soft);color:var(--accent);font-size:14px;font-weight:900;letter-spacing:.5px}
.card-icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:white;font-size:19px;box-shadow:0 9px 17px color-mix(in srgb,var(--accent) 30%,transparent)}
.art{height:112px;margin:8px 0 7px;border-radius:24px;background:linear-gradient(135deg,var(--soft),rgba(255,255,255,.72));position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.75)}
.art:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;left:-50px;bottom:-72px;background:#fff;opacity:.62}
.art:after{content:"";position:absolute;width:58px;height:58px;border-radius:50%;right:-16px;top:-18px;background:#fff;opacity:.48}
.visual{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
.card-title{font-size:21px;line-height:1.05;font-weight:900;color:#344e55;position:relative;z-index:2}
.card-sub{font-size:13px;color:#7c8a90;margin-top:5px;font-weight:500;position:relative;z-index:2}
.play-row{margin-top:auto;padding-top:9px;display:flex;align-items:center;justify-content:space-between;color:var(--accent);font-size:13px;font-weight:900;letter-spacing:.6px;position:relative;z-index:2}
.play-circle{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;transition:.2s}
.game-card:hover .play-circle{transform:translateX(5px) scale(1.06)}
.theme-pink{--accent:#e96d91;--soft:#fff0f4}.theme-blue{--accent:#4387c9;--soft:#edf6ff}.theme-green{--accent:#35ad6b;--soft:#e9f8ef}.theme-teal{--accent:#259c99;--soft:#e8faf8}.theme-purple{--accent:#7a5bc1;--soft:#f1edff}.theme-orange{--accent:#ed9913;--soft:#fff5df}.theme-indigo{--accent:#5068bd;--soft:#edf0ff}.theme-sky{--accent:#3885b1;--soft:#eaf7fc}.theme-rose{--accent:#cf6681;--soft:#fff0f4}

/* 01 - Size planets */
.size-scene{gap:23px;align-items:flex-end;padding-bottom:14px}.planet-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}.planet{border-radius:50%;display:block;position:relative;box-shadow:inset -8px -9px 0 rgba(0,0,0,.08),0 8px 14px rgba(0,0,0,.09)}.planet:after{content:"";position:absolute;width:18%;height:18%;left:22%;top:20%;border-radius:50%;background:rgba(255,255,255,.5)}.planet.big{width:72px;height:72px;background:#e66b91}.planet.small{width:40px;height:40px;background:#ffc24f}.scene-tag{font-size:9px;font-weight:900;letter-spacing:1px;color:#a95271}.scene-tag.gold{color:#bb8121}

/* 02 - height towers */
.height-scene{gap:20px;align-items:flex-end;padding-bottom:13px}.tower{width:38px;border-radius:19px 19px 10px 10px;position:relative;box-shadow:inset -7px 0 rgba(0,0,0,.08),0 8px 12px rgba(45,100,160,.14)}.tower.short{height:48px;background:#4387c9}.tower.tall{height:86px;background:#76c8e3}.tower:after{content:"";position:absolute;left:7px;right:7px;top:9px;height:3px;border-radius:4px;background:rgba(255,255,255,.35)}.height-ground{position:absolute;width:165px;height:5px;background:#b7d7e7;border-radius:99px;bottom:11px}

/* 03 - balance */
.balance-scene{padding-bottom:5px}.beam{width:154px;height:5px;border-radius:8px;background:#e3a235;position:absolute;top:55px;transform:rotate(-4deg)}.stand{position:absolute;width:10px;height:42px;background:#d69628;top:54px;border-radius:9px}.stand:after{content:"";position:absolute;left:-16px;bottom:-3px;width:42px;height:7px;border-radius:9px;background:#d69628}.pan{position:absolute;width:51px;height:20px;border-bottom:5px solid #d9a03a;border-radius:0 0 50% 50%;top:65px}.pan.left{left:58px}.pan.right{right:58px;top:55px}.chain{position:absolute;width:1px;height:24px;background:#d9a03a;top:39px}.chain.l1{left:82px;transform:rotate(22deg)}.chain.l2{left:118px;transform:rotate(-22deg)}.rock{position:absolute;width:35px;height:27px;background:#83949c;left:66px;top:59px;border-radius:45% 55% 38% 62%}.feather{position:absolute;font-size:38px;right:68px;top:17px;transform:rotate(-22deg)}

/* 04 - pencil strokes */
.stroke-scene{flex-direction:column;gap:18px}.stroke{border-radius:99px;background:var(--accent);box-shadow:0 6px 10px rgba(0,0,0,.08)}.stroke.thick{width:155px;height:14px}.stroke.thin{width:105px;height:4px;background:#70b8b4}.stroke-labels{position:absolute;bottom:11px;display:flex;gap:68px;font-size:9px;font-weight:900;color:#258b88;letter-spacing:.7px}

/* 05 - fruit grouping */
.apple-scene{gap:34px}.divider{height:68px;width:2px;border-radius:2px;background:rgba(122,91,193,.18)}.apple{width:38px;height:35px;background:#f04c5a;border-radius:48% 48% 44% 44%;position:relative;box-shadow:inset -6px -6px 0 rgba(0,0,0,.07),0 6px 10px rgba(190,55,65,.14)}.apple:before{content:"";position:absolute;width:11px;height:15px;background:#58a943;border-radius:100% 0 100% 0;left:19px;top:-9px;transform:rotate(-28deg)}.apple:after{content:"";position:absolute;width:3px;height:11px;background:#6e542e;left:18px;top:-8px;border-radius:4px}.apple-group{display:grid;grid-template-columns:repeat(2,28px);gap:4px}.apple-group .apple{width:28px;height:27px;transform:scale(.9)}

/* 06 - cookie jars */
.cookie-scene{gap:24px}.cookie-stack{display:flex;gap:4px;align-items:center}.cookie{width:34px;height:34px;border-radius:50%;background:#d99a68;position:relative;box-shadow:inset -5px -5px 0 rgba(120,67,44,.12),0 5px 8px rgba(110,70,35,.12)}.cookie:before{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#754e42;left:9px;top:8px;box-shadow:12px 6px #754e42,5px 17px #754e42}.cookie.more:nth-child(2){transform:translateY(-18px)}.cookie.more:nth-child(3){transform:translateY(15px)}.amount-badge{position:absolute;bottom:8px;font-size:9px;font-weight:900;letter-spacing:1px;color:#b77717}.amount-badge.left{left:61px}.amount-badge.right{right:62px}

/* 07 - distance path */
.distance-scene{justify-content:stretch}.house{position:absolute;left:38px;bottom:24px;width:48px;height:34px;background:#f3bd73;border-radius:4px}.house:before{content:"";position:absolute;left:-5px;top:-20px;border-left:29px solid transparent;border-right:29px solid transparent;border-bottom:23px solid #dd6e54}.house:after{content:"";position:absolute;width:10px;height:16px;background:#6f98b5;left:19px;bottom:0}.road{position:absolute;left:86px;right:76px;top:61px;border-top:4px dashed #6078c3}.car{position:absolute;right:36px;bottom:30px;width:57px;height:26px;border-radius:9px 12px 7px 7px;background:#ed5967}.car:before{content:"";position:absolute;width:27px;height:18px;background:#7ac6dd;border-radius:8px 8px 2px 2px;left:13px;top:-12px}.car:after{content:"●  ●";letter-spacing:17px;color:#3d4e67;position:absolute;bottom:-9px;left:8px;font-size:13px}.near-dot{position:absolute;left:94px;top:25px;color:#5068bd;font-size:9px;font-weight:900}.far-dot{position:absolute;right:42px;top:25px;color:#5068bd;font-size:9px;font-weight:900}

/* 08 - odd one out */
.odd-scene{gap:13px}.orb{width:48px;height:48px;border-radius:50%;background:#4284d1;box-shadow:inset -7px -7px 0 rgba(0,0,0,.08),0 6px 9px rgba(30,100,160,.12)}.orb.odd{border-radius:10px;background:#d9597e;transform:rotate(45deg);position:relative}.orb.odd:after{content:"?";position:absolute;transform:rotate(-45deg);color:white;font-weight:900;font-size:23px;left:15px;top:10px}.odd-ring{position:absolute;width:61px;height:61px;border:2px dashed rgba(216,90,124,.5);border-radius:16px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg)}

/* 09 - mismatch cards */
.match-scene{gap:20px}.pair-card{width:82px;height:63px;border-radius:16px;background:#fff;box-shadow:0 8px 14px rgba(85,60,50,.08);display:flex;align-items:center;justify-content:center;gap:7px;font-size:31px;position:relative}.pair-card.good:after{content:"✓";position:absolute;right:6px;bottom:4px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#4eb57a;color:white;font-size:11px;font-weight:900}.pair-card.bad{border:2px solid #e99aac}.pair-card.bad:after{content:"×";position:absolute;right:5px;bottom:3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#dc657d;color:white;font-size:13px;font-weight:900}

.game-view{display:none;position:fixed;inset:0;z-index:9999;width:100%;height:100vh;background:#fbf8eb;overflow:hidden}.game-view.show{display:block}.game-topbar{height:54px;padding:6px 18px 0;display:flex;align-items:center;background:transparent;border:0;box-shadow:none}.back-btn{
    border:0;
    border-radius:16px;
    padding:8px 16px 8px 10px;
    min-height:44px;
    background:rgba(255,255,255,.94);
    color:#355158;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:9px;
    box-shadow:0 6px 16px rgba(75,67,50,.11),inset 0 0 0 1px rgba(225,220,207,.9);
    transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
    position:relative;
}
.back-btn i{
    width:28px;
    height:28px;
    border-radius:10px;
    display:grid;
    place-items:center;
    background:#355158;
    color:#fff;
    font-size:13px;
    box-shadow:0 4px 9px rgba(53,81,88,.18);
    transition:transform .2s ease;
}
.back-btn:hover{
    background:#fff;
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(75,67,50,.15),inset 0 0 0 1px rgba(215,210,198,.95);
}
.back-btn:hover i{transform:translateX(-2px)}
.back-btn:active{transform:translateY(0)}
.back-btn:focus-visible{outline:3px solid rgba(53,81,88,.2);outline-offset:3px}
#contentFrame{width:100%;height:calc(100vh - 54px);border:0;display:block;background:#fbf8eb}
@media(max-width:980px){.cards{grid-template-columns:repeat(2,minmax(240px,1fr))}.app{padding-top:14px}}
@media(max-width:620px){.home{width:min(94vw,560px)}.cards{grid-template-columns:1fr;gap:14px}.hero h1{font-size:31px}.game-card{min-height:250px}.game-topbar{height:52px;padding:5px 12px 0}.back-btn{min-height:42px;padding:7px 14px 7px 9px;border-radius:15px}.back-btn i{width:27px;height:27px;border-radius:9px}#contentFrame{height:calc(100vh - 52px)}}
</style>
</head>
<body>
<div class="app"><main class="home">
<header class="hero"><div class="eyebrow"><i class="fa-solid fa-star"></i> FUN LEARNING ACTIVITIES <i class="fa-solid fa-star"></i></div><h1>Choose an <span>Adventure!</span></h1></header>
<section class="cards">
<button class="game-card theme-pink" onclick="openIsland(0,'Big and Small')"><div class="card-top"><div class="card-number">01</div><div class="card-icon"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></div></div><div class="art"><div class="visual size-scene"><div class="planet-wrap"><span class="planet big"></span><span class="scene-tag">BIG</span></div><div class="planet-wrap"><span class="planet small"></span><span class="scene-tag gold">SMALL</span></div></div></div><div class="card-title">Big and Small</div><div class="card-sub">Discover different sizes</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-blue" onclick="openIsland(1,'Shorter and Taller')"><div class="card-top"><div class="card-number">02</div><div class="card-icon"><i class="fa-solid fa-arrows-up-down"></i></div></div><div class="art"><div class="height-ground"></div><div class="visual height-scene"><span class="tower short"></span><span class="tower tall"></span></div></div><div class="card-title">Shorter and Taller</div><div class="card-sub">Compare heights and lengths</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-green" onclick="openIsland(2,'Heavy and Light')"><div class="card-top"><div class="card-number">03</div><div class="card-icon"><i class="fa-solid fa-weight-hanging"></i></div></div><div class="art"><div class="visual balance-scene"><span class="beam"></span><span class="stand"></span><span class="chain l1"></span><span class="chain l2"></span><span class="pan left"></span><span class="pan right"></span><span class="rock"></span><span class="feather">🪶</span></div></div><div class="card-title">Heavy and Light</div><div class="card-sub">Explore weight differences</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-teal" onclick="openIsland(3,'Thick and Thin')"><div class="card-top"><div class="card-number">04</div><div class="card-icon"><i class="fa-solid fa-grip-lines"></i></div></div><div class="art"><div class="visual stroke-scene"><span class="stroke thick"></span><span class="stroke thin"></span></div><div class="stroke-labels"><span>THICK</span><span>THIN</span></div></div><div class="card-title">Thick and Thin</div><div class="card-sub">Spot the line differences</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-purple" onclick="openIsland(4,'One and Many')"><div class="card-top"><div class="card-number">05</div><div class="card-icon"><i class="fa-solid fa-people-group"></i></div></div><div class="art"><div class="visual apple-scene"><span class="apple"></span><span class="divider"></span><div class="apple-group"><span class="apple"></span><span class="apple"></span><span class="apple"></span><span class="apple"></span></div></div></div><div class="card-title">One and Many</div><div class="card-sub">Learn single and groups</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-orange" onclick="openIsland(5,'More and Less')"><div class="card-top"><div class="card-number">06</div><div class="card-icon"><i class="fa-solid fa-chart-simple"></i></div></div><div class="art"><div class="visual cookie-scene"><div class="cookie-stack"><span class="cookie more"></span><span class="cookie more"></span><span class="cookie more"></span></div><span class="divider"></span><span class="cookie"></span></div><span class="amount-badge left">MORE</span><span class="amount-badge right">LESS</span></div><div class="card-title">More and Less</div><div class="card-sub">Compare different amounts</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-indigo" onclick="openIsland(6,'Far and Near')"><div class="card-top"><div class="card-number">07</div><div class="card-icon"><i class="fa-solid fa-arrows-left-right-to-line"></i></div></div><div class="art"><span class="house"></span><span class="road"></span><span class="near-dot">NEAR</span><span class="far-dot">FAR</span><span class="car"></span></div><div class="card-title">Far and Near</div><div class="card-sub">Understand distance visually</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-sky" onclick="openIsland(7,'Odd One Out')"><div class="card-top"><div class="card-number">08</div><div class="card-icon"><i class="fa-solid fa-puzzle-piece"></i></div></div><div class="art"><div class="odd-ring"></div><div class="visual odd-scene"><span class="orb"></span><span class="orb odd"></span><span class="orb"></span></div></div><div class="card-title">Odd One Out</div><div class="card-sub">Find what does not belong</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-rose" onclick="openIsland(8,'Not Match')"><div class="card-top"><div class="card-number">09</div><div class="card-icon"><i class="fa-solid fa-xmark"></i></div></div><div class="art"><div class="visual match-scene"><div class="pair-card good">🐟<span>🌊</span></div><div class="pair-card bad">🐟<span>🥕</span></div></div></div><div class="card-title">Not Match</div><div class="card-sub">Identify the wrong pair</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
</section></main></div>
<div class="game-view" id="gameView"><div class="game-topbar"><button class="back-btn" onclick="goHome()" aria-label="Go to Home"><i class="fa-solid fa-house"></i><span>Home</span></button></div><iframe id="contentFrame" src="" title="Learning Activity"></iframe></div>
<script>
const frame=document.getElementById('contentFrame');
const gameView=document.getElementById('gameView');

const pages=[
    './exercise/big_small.html',
    './exercise/shorter_taller.html',
    './exercise/heavy_light.html',
    './exercise/thick_thin.html',
    './exercise/one_many.html',
    './exercise/many_less.html',
    './exercise/far_near.html',
    './exercise/odd_one.html',
    './exercise/shape_notmatch.html'
];

/* Keep the selected lesson in the URL so a browser refresh
   returns the user to the same lesson instead of the index page. */
function openIsland(index,title,updateUrl=true){
    if(index < 0 || index >= pages.length) return;

    frame.src=pages[index];
    gameView.classList.add('show');
    document.body.classList.add('quiz-open');

    if(updateUrl){
        history.replaceState(
            {lesson:index},
            '',
            window.location.pathname + window.location.search + '#lesson=' + index
        );
    }

    window.scrollTo({top:0,behavior:'instant'});
}

function goHome(){
    gameView.classList.remove('show');
    document.body.classList.remove('quiz-open');
    frame.src='';

    /* Remove the lesson from the URL when returning Home. */
    history.replaceState(
        null,
        '',
        window.location.pathname + window.location.search
    );
}

/* Restore the lesson after refresh if a lesson is present in the URL. */
function restoreLessonFromUrl(){
    const match=window.location.hash.match(/^#lesson=(\d+)$/);

    if(!match) return;

    const index=Number(match[1]);

    if(index >= 0 && index < pages.length){
        openIsland(index,'',false);
    }else{
        history.replaceState(
            null,
            '',
            window.location.pathname + window.location.search
        );
    }
}

/* Browser Back/Forward support. */
window.addEventListener('popstate',()=>{
    restoreLessonFromUrl();
});

window.addEventListener('hashchange',()=>{
    restoreLessonFromUrl();
});

window.addEventListener('keydown',e=>{
    if(e.key==='Escape' && gameView.classList.contains('show')){
        goHome();
    }
});

/* Restore the currently selected lesson when the index page loads. */
restoreLessonFromUrl();
</script>
</body></html>
