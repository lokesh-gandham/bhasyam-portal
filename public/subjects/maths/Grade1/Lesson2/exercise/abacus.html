<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abacus Number Name Quiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
        }

        body {
           
            background-size: 30px 30px;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            overflow: hidden;
        }

        header {
            text-align: center;
           
        }

        h2 {
    font-size:22px;
    color:#2f4f4f;
    font-weight:400;
}

         .instruction {
    font-size:20px;
    color:#2f4f4f;
    font-weight:400;
}

        /* Main Playground */
        .game-stage {
            width: 100%;
            max-width: 900px;
            height: 65vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .slide-item {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
        }

        .slide-item.active {
            display: flex;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- INNOVATIVE 3D ABACUS DESIGN --- */
        .abacus-container {
            display: flex;
            flex-direction: column;
            align-items: center;
           margin-top: 15px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.1));
        }

        .rods-area {
            display: flex;
            gap: 80px;
            height: 220px;
            align-items: flex-end; 
            border-bottom: 6px solid #7f8c8d;
            padding: 0 40px;
            z-index: 2;
        }

        .rod {
            width: 8px;
            height: 100%;
            background: linear-gradient(90deg, #b2bec3, #dfe6e9, #b2bec3);
            border-radius: 4px 4px 0 0;
            position: relative;
            display: flex;
            flex-direction: column-reverse; /* Stack beads from bottom to top */
            align-items: center;
            gap: 2px;
            padding-bottom: 4px;
        }

        .bead {
            width: 40px;
            height: 24px;
            border-radius: 12px;
            box-shadow: inset -4px -4px 8px rgba(0,0,0,0.2), 0 4px 6px rgba(0,0,0,0.3);
            z-index: 3;
            opacity: 0; 
        }

        .bead.tens { background: radial-gradient(circle at 35% 25%, #a8e6cf, #27ae60); }
        .bead.ones { background: radial-gradient(circle at 35% 25%, #74b9ff, #0984e3); }

        /* Bead Drop Animation */
        @keyframes dropIn {
            0% { transform: translateY(-200px) scale(0.8); opacity: 0; }
            70% { transform: translateY(10px) scale(1.05); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .slide-item.active .bead {
            animation: dropIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .abacus-base {
            width: 260px;
            height: 60px;
            background: linear-gradient(180deg, #ecf0f1, #bdc3c7);
            border: 3px solid #95a5a6;
            border-radius: 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: -6px;
            z-index: 4;
            box-shadow: inset 0 4px 6px rgba(255,255,255,0.6), 0 8px 15px rgba(0,0,0,0.15);
        }

        .base-label {
            font-size: 1.8rem;
            font-weight: 500;
            color: #2c3e50;
            text-shadow: 1px 1px 0 #fff;
        }

        /* --- INPUT CONTROLS --- */
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            margin-top: 10px;
            
        }

        .custom-input {
            text-align: center;
            font-weight: 500;
            border: 2px solid #e67e22;
            border-radius: 20px;
            background: #ffffff;
            color: #2d3436;
            outline: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .custom-input:focus {
            border-color: #0984e3;
            transform: scale(1.05);
        }

        .custom-input:disabled {
            background-color: #f1f2f6;
            border-color: #00b894;
            color: #2d3436;
            cursor: not-allowed;
            transform: none;
        }

        .input-num {
            width: 140px;
            height: 45px;
            font-size: 1.5rem;
        }

        .input-name {
            width: 250px;
            height: 45px;
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        /* --- EXACT NAV BUTTONS FROM REFERENCE --- */
        footer {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
        }

         .nav-btn {
    background:#e67e22;
    color:#ffffff;
    border:none;
    width:178px;
    height:45px;
    padding:0;
    font-size:20px;
    font-weight:500;
    border-radius:40px;
    cursor:pointer;
    box-shadow:0 6px 0 #d35400;
    transition:all 0.1s ease;
    margin-top:60px;
}

        .nav-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d35400;
        }

        .nav-btn:disabled {
            background: #b2bec3;
            box-shadow: 0 6px 0 #636e72;
            cursor: not-allowed;
            opacity: 0.7;
        }

         .check-btn {
    background:#00b894;
    box-shadow:0 6px 0 #008f72;
    margin-top:60px;
}

        .check-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 #008f72;
        }

        .replay-btn {
            background: #0984e3;
            box-shadow: 0 6px 0 #0975c7;
            margin-top: 20px;
            z-index: 5;
        }

        .replay-btn:active {
            box-shadow: 0 2px 0 #0975c7;
        }

        @media screen and (min-width:1600px) {
    h2 {
        font-size:30px;
        font-weight:600;
        color:#2f4f4f;
    }

    .instruction {
        font-size:25px;
    }

    .nav-btn,
    .check-btn {
        width:178px;
        height:45px;
        padding:0;
        font-size:20px;
        font-weight:500;
    }
}
        

        /* --- EXACT POPUP OVERLAY FROM REFERENCE --- */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
          
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-card {
            position: relative;
            width: 90%;
            max-width: 520px;
            padding: 40px 30px;
            border-radius: 36px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transform: scale(0.8);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .popup-card::before,
        .popup-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .popup-card::before {
            width: 220px;
            height: 220px;
            top: -60px;
            right: -50px;
        }

        .popup-card::after {
            width: 180px;
            height: 180px;
            bottom: -70px;
            left: -40px;
        }

        .popup-card.correct {
            background: #edfbf4;
            border: 6px solid #00c885;
        }
        .popup-card.correct::before, .popup-card.correct::after { background: rgba(162, 245, 209, 0.45); }
        .popup-card.correct .popup-title { color: #00a86b; }
        .popup-card.correct .popup-subtitle { color: #2e7d5b; }

        .popup-card.wrong {
            background: #fff0f2;
            border: 6px solid #ff6b7a;
        }
        .popup-card.wrong::before, .popup-card.wrong::after { background: rgba(255, 196, 203, 0.45); }
        .popup-card.wrong .popup-title { color: #d33847; }
        .popup-card.wrong .popup-subtitle { color: #a33b45; }

        .popup-card.complete {
            background: #f0f3ff;
            border: 6px solid #6c5ce7;
           /* height: 300px;
           min-height: 300px; */

        }
        .popup-card.complete::before, .popup-card.complete::after { background: rgba(162, 155, 254, 0.35); }
        .popup-card.complete .popup-title { color: #6c5ce7; }
        .popup-card.complete .popup-subtitle { color: #4834d4; }

        .popup-overlay.active .popup-card { transform: scale(1); }

        .popup-icon {
            font-size: 4.8rem;
            margin-bottom: 12px;
            z-index: 2;
            line-height: 1;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.1));
        }

        .popup-title {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 8px;
            z-index: 2;
            letter-spacing: -0.5px;
        }

        .popup-subtitle {
            font-size: 1.4rem;
            font-weight: 500;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* EXACT SAME CONFETTI EFFECT */
        #confettiContainer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 90;
        }

        .confetti-piece {
            position: absolute;
            width: 9px;
            height: 14px;
            border-radius: 2px;
            opacity: 0;
            animation: pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
            will-change: transform, opacity;
        }

        .final-confetti-piece {
            width: 10px;
            height: 16px;
            animation-duration: 2300ms;
        }

        .final-confetti-piece:nth-child(3n) {
            border-radius: 50%;
        }

        .final-confetti-piece:nth-child(4n) {
            width: 7px;
            height: 19px;
            border-radius: 1px;
        }

        .final-confetti-piece:nth-child(5n) {
            width: 13px;
            height: 8px;
            border-radius: 2px;
        }

        @keyframes pageConfetti {
            0% {
                opacity: 1;
                transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
            }
            55% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(0.72);
            }
        }

        .final-confetti-piece::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: inherit;
        }

        .popup-card.complete .replay-btn {
            width: 178px;
            height: 45px;
            padding: 0;
            margin-top: 20px;
            font-size: 20px;
            font-weight: 500;
            line-height: 45px;
            flex: 0 0 45px;
        }
.popup-card.complete {
    width: 520px;
    max-width: 90vw;
    height: 300px;
    padding: 40px 30px;
    box-sizing: border-box;
    border-radius: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
        .popup-card.complete {
            box-shadow:
                0 20px 45px rgba(108, 92, 231, 0.18),
                0 0 0 8px rgba(162, 155, 254, 0.12);
        }

        .popup-card.complete .popup-icon {
            animation: finalTrophyBounce 1.2s ease-in-out infinite;
        }

        @keyframes finalTrophyBounce {
            0%, 100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            50% {
                transform: translateY(-5px) rotate(-4deg) scale(1.06);
            }
        }

    </style>
</head>
<body>

    <header>
        <h2>Write the number and the number name of the following abacus</h2>
        
        
    </header>

    <main class="game-stage">
        
        <div class="slide-item active" data-q="0">
            <div class="abacus-container">
                <div class="rods-area">
                    <div class="rod"><div class="spacer"></div></div> <div class="rod">
                        <div class="bead ones" style="animation-delay: 0.1s"></div>
                        <div class="bead ones" style="animation-delay: 0.2s"></div>
                        <div class="bead ones" style="animation-delay: 0.3s"></div>
                        <div class="bead ones" style="animation-delay: 0.4s"></div>
                        <div class="bead ones" style="animation-delay: 0.5s"></div>
                        <div class="bead ones" style="animation-delay: 0.6s"></div>
                    </div> </div>
                <div class="abacus-base">
                    <span class="base-label">T</span>
                    <span class="base-label">O</span>
                </div>
            </div>
            <div class="input-group">
                <input type="text" class="custom-input input-num" maxlength="2" placeholder="Num" data-target="6">
                <input type="text" class="custom-input input-name" placeholder="Name" data-target="SIX">
            </div>
        </div>

        <div class="slide-item" data-q="1">
            <div class="abacus-container">
                <div class="rods-area">
                    <div class="rod">
                        <div class="bead tens" style="animation-delay: 0.1s"></div>
                    </div> <div class="rod">
                        <div class="bead ones" style="animation-delay: 0.2s"></div>
                        <div class="bead ones" style="animation-delay: 0.3s"></div>
                        <div class="bead ones" style="animation-delay: 0.4s"></div>
                        <div class="bead ones" style="animation-delay: 0.5s"></div>
                    </div> </div>
                <div class="abacus-base">
                    <span class="base-label">T</span>
                    <span class="base-label">O</span>
                </div>
            </div>
            <div class="input-group">
                <input type="text" class="custom-input input-num" maxlength="2" placeholder="Num" data-target="14">
                <input type="text" class="custom-input input-name" placeholder="Name" data-target="FOURTEEN">
            </div>
        </div>

        <div class="slide-item" data-q="2">
            <div class="abacus-container">
                <div class="rods-area">
                    <div class="rod">
                        <div class="bead tens" style="animation-delay: 0.1s"></div>
                    </div> <div class="rod">
                        <div class="bead ones" style="animation-delay: 0.2s"></div>
                        <div class="bead ones" style="animation-delay: 0.3s"></div>
                        <div class="bead ones" style="animation-delay: 0.4s"></div>
                        <div class="bead ones" style="animation-delay: 0.5s"></div>
                        <div class="bead ones" style="animation-delay: 0.6s"></div>
                        <div class="bead ones" style="animation-delay: 0.7s"></div>
                        <div class="bead ones" style="animation-delay: 0.8s"></div>
                    </div> </div>
                <div class="abacus-base">
                    <span class="base-label">T</span>
                    <span class="base-label">O</span>
                </div>
            </div>
            <div class="input-group">
                <input type="text" class="custom-input input-num" maxlength="2" placeholder="Num" data-target="17">
                <input type="text" class="custom-input input-name" placeholder="Name" data-target="SEVENTEEN">
            </div>
        </div>

    </main>

    <footer>
        <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>PREV</button>
        <button class="nav-btn check-btn" id="submitBtn" onclick="checkAnswers()" disabled>SUBMIT</button>
        <button class="nav-btn" id="nextBtn" onclick="navigate(1)" disabled>NEXT</button>
    </footer>

    <div id="confettiContainer"></div>

    <div class="popup-overlay" id="popup">
        <div class="popup-card" id="popupCard">
            <div class="popup-icon" id="popupIcon">⭐</div>
            <h2 class="popup-title" id="popupTitle">Amazing!</h2>
            <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
            <button class="nav-btn replay-btn" id="playAgainBtn" style="display: none;" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        let quizState = Array.from({ length: 3 }, () => ({
            inputNum: '',
            inputName: '',
            isUnlocked: false
        }));

        let currentIndex = 0;
        let popupTimer = null;

        const slides = document.querySelectorAll('.slide-item');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');

        // Reference Audio/Voice Methods
        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-US";
            msg.volume = 0.8;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playAudioTone(isCorrect) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isCorrect) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2); 
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            }
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // Input Bindings
        function bindSlideEvents() {
            slides.forEach((slide, sIdx) => {
                const numInput = slide.querySelector('.input-num');
                const nameInput = slide.querySelector('.input-name');

                // Filter out non-numbers for numInput
                numInput.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    quizState[sIdx].inputNum = e.target.value;
                    updateNavButtons();
                });

                nameInput.addEventListener('input', (e) => {
                    let val = e.target.value.toUpperCase();
                    e.target.value = val;
                    quizState[sIdx].inputName = val;
                    updateNavButtons();
                });
            });
        }
        bindSlideEvents();

        function navigate(dir) {
            slides[currentIndex].classList.remove('active');
            currentIndex += dir;
            
            // Re-trigger drop animation by cloning/replacing node or just adding class
            const nextSlide = slides[currentIndex];
            nextSlide.classList.add('active');
            
            restoreCurrentSlideState();
            updateNavButtons();
        }

        function restoreCurrentSlideState() {
            const activeSlide = slides[currentIndex];
            const numInput = activeSlide.querySelector('.input-num');
            const nameInput = activeSlide.querySelector('.input-name');
            const savedState = quizState[currentIndex];

            numInput.value = savedState.inputNum;
            nameInput.value = savedState.inputName;

            numInput.disabled = savedState.isUnlocked;
            nameInput.disabled = savedState.isUnlocked;
        }

        function updateNavButtons() {
            prevBtn.disabled = currentIndex === 0;
            
            const isLastQuestion = currentIndex === slides.length - 1;
            const isUnlocked = quizState[currentIndex].isUnlocked;

            nextBtn.disabled = isLastQuestion || !isUnlocked;

            const activeSlide = slides[currentIndex];
            const numVal = activeSlide.querySelector('.input-num').value.trim();
            const nameVal = activeSlide.querySelector('.input-name').value.trim();

            submitBtn.disabled = isUnlocked || !numVal || !nameVal;
        }


        /* EXACT SAME CONFETTI EFFECT */
        function showSmallConfetti(isFinal = false) {
            const confettiContainer = document.getElementById('confettiContainer');
            if (!confettiContainer) return;

            confettiContainer.innerHTML = '';

            const count = isFinal ? 95 : 42;

            const colors = [
                '#00b894',
                '#e67e22',
                '#6c5ce7',
                '#0984e3',
                '#fdcb6e',
                '#ff6b7a',
                '#00cec9',
                '#a29bfe'
            ];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('span');

                piece.className =
                    isFinal
                        ? 'confetti-piece final-confetti-piece'
                        : 'confetti-piece';

                const startX = Math.random() * 100;
                const startY = -8 + Math.random() * 10;

                const drift =
                    (Math.random() * 520 - 260) *
                    (isFinal ? 1.15 : 0.9);

                const fall =
                    window.innerHeight *
                    (0.82 + Math.random() * 0.48);

                const rotation =
                    Math.random() * 1400 - 700;

                piece.style.left = startX + '%';
                piece.style.top = startY + '%';

                piece.style.setProperty('--x', drift + 'px');
                piece.style.setProperty('--y', fall + 'px');
                piece.style.setProperty('--r', rotation + 'deg');

                piece.style.background =
                    colors[Math.floor(Math.random() * colors.length)];

                piece.style.animationDelay =
                    (Math.random() * (isFinal ? 500 : 220)) + 'ms';

                confettiContainer.appendChild(piece);

                setTimeout(
                    () => piece.remove(),
                    isFinal ? 2900 : 2050
                );
            }
        }

        function checkAnswers() {
            const activeSlide = slides[currentIndex];
            const numInput = activeSlide.querySelector('.input-num');
            const nameInput = activeSlide.querySelector('.input-name');
            
            const numVal = numInput.value.trim();
            const nameVal = nameInput.value.trim().toUpperCase();

            const targetNum = numInput.dataset.target;
            const targetName = nameInput.dataset.target;

            if (Number(numVal) === Number(targetNum) && nameVal === targetName) {
                quizState[currentIndex].isUnlocked = true;
                
                numInput.disabled = true;
                nameInput.disabled = true;

                if (currentIndex === slides.length - 1) {
                    // Last question: Correct popup first, then Final popup with final confetti.
                    showSmallConfetti(false);
                    showPopup('correct', '🌟', 'Amazing!', 'You got it right! ✨', false);
                    playAudioTone(true);
                    speak("Correct");

                    clearTimeout(popupTimer);
                    popupTimer = setTimeout(() => {
                        showSmallConfetti(true);
                        showPopup('complete', '🏆', 'Congratulations!', 'Great job! You completed it! 🎉', true);
                    }, 1800);
                } else {
                    showSmallConfetti(false);
                    showPopup('correct', '🌟', 'Amazing!', 'You got it right! ✨', false);
                    playAudioTone(true);
                    speak("Correct");
                }
                updateNavButtons();
            } else {
                showPopup('wrong', '😟', 'Keep Going!', 'Try again, you can do it! 🌈', false);
                playAudioTone(false);
                speak("Wrong");
                resetCurrentInputs();
            }
        }

        function resetCurrentInputs() {
            const activeSlide = slides[currentIndex];
            const numInput = activeSlide.querySelector('.input-num');
            const nameInput = activeSlide.querySelector('.input-name');
            
            numInput.value = '';
            nameInput.value = '';

            quizState[currentIndex].inputNum = '';
            quizState[currentIndex].inputName = '';

            updateNavButtons();
        }

        // Popup logic exactly as requested
        function showPopup(status, icon, title, subtitle, isFinal = false) {
            const popup = document.getElementById('popup');
            const card = document.getElementById('popupCard');
            
            card.className = `popup-card ${status}`;
            document.getElementById('popupIcon').innerText = icon;
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupSubtitle').innerText = subtitle;
            
            if (isFinal) {
                playAgainBtn.style.display = 'inline-block';
            } else {
                playAgainBtn.style.display = 'none';
            }

            popup.classList.add('active');

            clearTimeout(popupTimer);
            if (!isFinal) {
                popupTimer = setTimeout(() => {
                    closePopup();
                }, 1800);
            }
        }

        function closePopup() {
            document.getElementById('popup').classList.remove('active');
        }

        function restartGame() {
            clearTimeout(popupTimer);
            const confettiContainer = document.getElementById('confettiContainer');
            if (confettiContainer) confettiContainer.innerHTML = '';
            closePopup();
            quizState = Array.from({ length: 3 }, () => ({
                inputNum: '',
                inputName: '',
                isUnlocked: false
            }));

            slides[currentIndex].classList.remove('active');
            currentIndex = 0;
            slides[currentIndex].classList.add('active');

            slides.forEach((slide) => {
                const numInput = slide.querySelector('.input-num');
                const nameInput = slide.querySelector('.input-name');
                numInput.value = '';
                nameInput.value = '';
                numInput.disabled = false;
                nameInput.disabled = false;
            });

            updateNavButtons();
        }

        // Initialize state
        updateNavButtons();
    </script>
</body>
</html>
