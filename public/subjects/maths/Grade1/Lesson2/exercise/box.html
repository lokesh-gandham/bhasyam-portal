<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tens and Ones</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Livvic,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    
    color:#435266;
}

/* MAIN */

.game{
    width:100%;
    height:100dvh;
    padding:clamp(10px,1.5vh,20px) clamp(12px,3vw,45px);

    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
    gap:clamp(8px,1.5vh,18px);
}

/* QUESTION */

.question{
    display:flex;
    justify-content:center;
}

.question-box{    color:#2f4f4f;
    width:min(50vw,620px);
    min-height:clamp(58px,9vh,88px);

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    padding:8px 25px;

    background:#fffdf7;
    border:3px solid #edc27f;
    border-radius:28px;

    box-shadow:0 7px 0 rgba(218,151,61,.15);

    font-size: 22px;
    font-weight: 500;
}

.target{
    color:#e68a25;
}

/* GAME AREA */

.stage{
    min-height:0;
    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;
}

.cards{
    width:min(100%,1500px);
    height:96%;

    display:grid;
    grid-template-columns:repeat(2,minmax(280px,1fr));
    gap:clamp(20px,5vw,80px);

    align-items:stretch;
}

/* CARD */

.card{
    min-height:0;
    height:96%;

    position:relative;
    overflow:hidden;

    display:grid;
    grid-template-rows:auto minmax(90px,1fr) minmax(70px,1fr) auto;

    align-items:center;

    padding:clamp(12px,2vw,24px);

    border:3px solid var(--border);
    border-radius:30px;
    background:var(--bg);

    box-shadow:0 10px 25px rgba(0,0,0,.06);
}

.card::before,
.card::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:var(--blob);
    opacity:.55;
    pointer-events:none;
}

.card::before{
    width:140px;
    height:140px;
    top:-70px;
    right:-45px;
}

.card::after{
    width:110px;
    height:110px;
    bottom:-60px;
    left:-35px;
}

/* TITLE */
.card-title{
    position:relative;
    z-index:2;

    text-align:center;
    color:var(--title);

    font-size:clamp(1.7rem,3vw,2.5rem);
    font-weight:500;

    transform:translateY(-12px);
    margin-bottom:12px;
}
/* MONSTER */

.monster-wrap{
    position:relative;
    z-index:1;

    display:flex;
    align-items:center;
    justify-content:center;
    transform:scale(.82);
}

.monster{
    width:clamp(90px,10vw,135px);
    height:clamp(90px,10vw,135px);

    position:relative;

    border-radius:48% 48% 43% 43%;
    background:var(--monster);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:
        inset 0 -9px rgba(0,0,0,.06),
        0 8px 16px rgba(0,0,0,.08);
}

.monster::before,
.monster::after{
    content:"";
    position:absolute;

    width:15px;
    height:30px;

    top:-12px;

    background:#ffd166;
    border-radius:20px 20px 6px 6px;
}

.monster::before{
    left:24px;
    transform:rotate(-18deg);
}

.monster::after{
    right:24px;
    transform:rotate(18deg);
}

.eyes{
    display:flex;
    gap:14px;
}

.eye{
    width:clamp(28px,3vw,40px);
    height:clamp(28px,3vw,40px);

    border-radius:50%;
    background:white;

    display:flex;
    align-items:center;
    justify-content:center;
}

.pupil{
    width:40%;
    height:40%;

    border-radius:50%;
    background:#354052;
}

.mouth{
    width:55%;
    height:22%;

    margin-top:9px;

    background:#5b3037;
    border-radius:0 0 35px 35px;
}

.chewing{
    animation:chew .35s infinite alternate;
}

@keyframes chew{
    from{transform:scale(1) rotate(-2deg)}
    to{transform:scale(1.06) rotate(2deg)}
}

/* TRAY */
/* MIDDLE DROP BOX - BIGGER + MORE VISIBLE */

.tray{
    position:relative;
    z-index:1;

    width:100%;
    height:clamp(85px,15vh,135px); /* increased */

    display:flex;
    align-items:center;
    justify-content:center;
    align-content:center;
    flex-wrap:wrap;

    gap:10px;
    padding:12px;

    background:rgba(255,255,255,.88); /* more visible */
    border:3px dashed var(--tray);
    border-radius:24px;
}
/* TENS */
.ten{
    width:36px;
    height:78px;

    padding:5px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    background:#f3a4c8;
    border:3px solid #d96d9f;
    border-radius:9px;

    box-shadow:0 3px 6px rgba(190,70,125,.15);
}

.ten span{
    height:5px;
    border-radius:5px;
    background:#fff7fa;
}
/* ONES */
.one{
    width:34px;
    height:34px;

    border-radius:50%;

    background:#9bd3eb;
    border:3px solid #5dabc9;

    box-shadow:0 3px 6px rgba(50,130,165,.15);
}

/* CONTROLS */

.controls{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(10px,2vw,20px);

    padding-top:8px;
}

.step{
    width:clamp(48px,5vw,64px);
    height:clamp(48px,5vw,64px);

    border:none;
    border-radius:50%;

    background:var(--button);
    color:white;

    font-size:clamp(2rem,3vw,2.7rem);
    font-weight:500;

    cursor:pointer;

    box-shadow:0 5px 0 var(--shadow);
}

.step:active:not(:disabled){
    transform:translateY(3px);
    box-shadow:0 2px 0 var(--shadow);
}

.step:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.count{
    width:clamp(60px,6vw,78px);
    height:clamp(55px,6vw,72px);

    display:flex;
    align-items:center;
    justify-content:center;

    background:white;
    border:3px solid var(--border);
    border-radius:18px;

    font-size:clamp(2rem,3vw,3rem);
    font-weight:500;
}

/* LOCKED */

.card.locked{
    opacity:.85;
}

/* NAVIGATION */

.navigation{
    width:min(100%,1500px);
    justify-self:center;

    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
}

.nav{
    width:178px;
    height:45px;

    padding:0;

    border:none;
    border-radius:35px;

    background:#e67e22;
    color:white;

    font-size:20px;
    font-weight:500;

    cursor:pointer;

    box-shadow:0 6px #d35400;
}

.nav:active:not(:disabled){
    transform:translateY(4px);
    box-shadow:0 2px #d35400;
}

.nav:disabled{
    background:#b2bec3;
    box-shadow:0 6px #7f8c8d;
    cursor:not-allowed;
}

#prev{
    justify-self:start;
}

#next{
    justify-self:end;
}

.submit{
    background:#00b894;
    box-shadow:0 6px #008f72;
}

.submit:active:not(:disabled){
    box-shadow:0 2px #008f72;
}

/* SHAKE */

.shake{
    animation:shake .4s;
}

@keyframes shake{
    20%,60%{transform:translateX(-10px)}
    40%,80%{transform:translateX(10px)}
}

/* =========================
   HEAVY & LIGHT POPUP
========================= */

.popup-bg{

    position:fixed;

    top:0;

    left:0;

    width:100vw;

    height:100vh;

    
    display:flex;

    justify-content:center;

    align-items:center;

    opacity:0;

    pointer-events:none;

    transition:opacity .3s ease;

    z-index:100;
}

.popup-bg.show{

    opacity:1;

    pointer-events:auto;
}

.popup{

    position:relative;

    width:90%;

    max-width:520px;

    padding:40px 30px;

    border-radius:36px;

    text-align:center;

    box-shadow:0 20px 40px rgba(0,0,0,.1);

    transform:scale(.8);

    transition:

    transform .35s

    cubic-bezier(.175,.885,.32,1.275);

    overflow:hidden;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}

.popup::before,
.popup::after{

    content:'';

    position:absolute;

    border-radius:50%;

    pointer-events:none;
}

.popup::before{

    width:220px;

    height:220px;

    top:-60px;

    right:-50px;
}

.popup::after{

    width:180px;

    height:180px;

    bottom:-70px;

    left:-40px;
}


/* CORRECT */

.popup.correct{

    background:#edfbf4;

    border:6px solid #00c885;
}

.popup.correct::before,
.popup.correct::after{

    background:rgba(162,245,209,.45);
}

.popup.correct .popup-title{

    color:#00a86b;
}

.popup.correct .popup-subtitle{

    color:#2e7d5b;
}


/* WRONG */

.popup.wrong{

    background:#fff0f2;

    border:6px solid #ff6b7a;
}

.popup.wrong::before,
.popup.wrong::after{

    background:rgba(255,196,203,.45);
}

.popup.wrong .popup-title{

    color:#d33847;
}

.popup.wrong .popup-subtitle{

    color:#a33b45;
}


/* FINAL */

.popup.final{

    background:#f0f3ff;

    border:6px solid #6c5ce7;
    width: 520px;
    max-width: 90vw;
    padding: 40px 30px;
    box-sizing: border-box;
    border-radius: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

}

.popup.final::before,
.popup.final::after{

    background:rgba(162,155,254,.35);
}

.popup.final .popup-title{

    color:#6c5ce7;
}

.popup.final .popup-subtitle{

    color:#4834d4;
}

.popup-bg.show .popup{

    transform:scale(1);
}

.popup-icon{

    font-size:4.8rem;

    margin-bottom:12px;

    z-index:2;

    line-height:1;

    filter:
    drop-shadow(0 6px 10px rgba(0,0,0,.1));
}

.popup-title{

    font-size:3rem;

    font-weight:600;

    margin-bottom:8px;

    z-index:2;

    letter-spacing:-.5px;
}

.popup-subtitle{

    font-size:1.4rem;

    font-weight:500;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    text-align:center;
}

.replay-btn{

    background:#0984e3;

    box-shadow:0 6px 0 #0975c7;

    margin-top:20px;

    z-index:5;
}

.replay-btn:active{

    transform:translateY(4px);

    box-shadow:0 2px 0 #0975c7;
}


/* =========================
   RESPONSIVE
========================= */

@media screen and (min-width:1600px){
    .digital-screen{
        font-size:30px;
    }

    .nav-btn{
        width:178px;
        height:45px;
        padding:0;
        font-size:20px;
        font-weight:500;
    }
}


.instruction{
    font-size:20px;
    font-weight:400;
    color:#2f4f4f;
}

@media screen and (min-width:1600px){
    .instruction{
        font-size:25px;
    }
}



/* SMALL SCREENS */

@media(max-width:700px){

    html,body{
        overflow:auto;
    }

    .game{
        height:auto;
        min-height:100dvh;
    }

    .question-box{
        width:100%;
        font-size:1.4rem;
    }

    .cards{
        grid-template-columns:1fr;
        height:auto;
    }

    .card{
        height:390px;
    }

    .navigation{
        margin-top:5px;
    }
}

.instruction{
    font-size:20px;
    font-weight:400;
    color:#2f4f4f;
}


@media screen and (min-width:1600px){
    .question-box{
        font-size:30px;
        font-weight:600;
        color:#2f4f4f;
    }

    .instruction{
        font-size:25px;
    }

    .nav{
        width:178px;
        height:45px;
        padding:0;
        font-size:20px;
        font-weight:500;
    }
}


/* EXACT SAME CONFETTI */
#confettiContainer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 90;
}

.confetti-piece {
    position: absolute;
    width: 9px;
    height: 14px;
    border-radius: 2px;
    opacity: 0;
    animation: pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
    will-change: transform, opacity;
}

.final-confetti-piece {
    width: 10px;
    height: 16px;
    animation-duration: 2300ms;
}

.final-confetti-piece:nth-child(3n) {
    border-radius: 50%;
}

.final-confetti-piece:nth-child(4n) {
    width: 7px;
    height: 19px;
    border-radius: 1px;
}

.final-confetti-piece:nth-child(5n) {
    width: 13px;
    height: 8px;
    border-radius: 2px;
}

@keyframes pageConfetti {
    0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
    }
    55% {
        opacity: 1;
    }
    100% {
        opacity: 0;
        transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(0.72);
    }
}

.popup.complete {
    box-shadow:
        0 20px 45px rgba(108, 92, 231, 0.18),
        0 0 0 8px rgba(162, 155, 254, 0.12);
}

.popup.complete .popup-icon {
    animation: finalTrophyBounce 1.2s ease-in-out infinite;
}

@keyframes finalTrophyBounce {
    0%, 100% {
        transform: translateY(0) rotate(0deg) scale(1);
    }
    50% {
        transform: translateY(-5px) rotate(-4deg) scale(1.06);
    }
}

</style>
</head>

<body>

<div id="confettiContainer"></div>

<div class="game">

    <div class="question">
        <div class="question-box">
            Make the number
            <span class="target" id="target">12</span>
        </div>
    </div>

    <main class="stage">

        <div class="cards">

            <!-- TENS -->

            <section class="card" id="tensCard"
            style="
            --bg:#fff8fb;
            --border:#f2b8d3;
            --blob:#f7d8e8;
            --title:#c75b91;
            --monster:#e990bd;
            --tray:#e9a8ca;
            --button:#e78dbb;
            --shadow:#c96b9d;
            ">

                <div class="card-title">Tens</div>

                <div class="monster-wrap">
                    <div class="monster" id="tensMonster">
                        <div class="eyes">
                            <div class="eye"><div class="pupil"></div></div>
                            <div class="eye"><div class="pupil"></div></div>
                        </div>
                        <div class="mouth"></div>
                    </div>
                </div>

                <div class="tray" id="tensTray"></div>

                <div class="controls">
                    <button class="step" id="tensMinus" onclick="change('t',-1)">−</button>
                    <div class="count" id="tensCount">0</div>
                    <button class="step" id="tensPlus" onclick="change('t',1)">+</button>
                </div>

            </section>

            <!-- ONES -->

            <section class="card" id="onesCard"
            style="
            --bg:#f7fbff;
            --border:#b8dcef;
            --blob:#d9edf8;
            --title:#5b99bc;
            --monster:#86bdd8;
            --tray:#a9d2e8;
            --button:#7db6d3;
            --shadow:#5b98b7;
            ">

                <div class="card-title">Ones</div>

                <div class="monster-wrap">
                    <div class="monster" id="onesMonster">
                        <div class="eyes">
                            <div class="eye"><div class="pupil"></div></div>
                        </div>
                        <div class="mouth"></div>
                    </div>
                </div>

                <div class="tray" id="onesTray"></div>

                <div class="controls">
                    <button class="step" id="onesMinus" onclick="change('o',-1)">−</button>
                    <div class="count" id="onesCount">0</div>

        </button>

    </footer>

</div>

<!-- POPUP -->

    <div class="popup" id="popup">

        <div class="popup-icon" id="popupIcon">⭐</div>

        <h2 class="popup-title" id="popupTitle">Amazing!</h2>

        <p class="popup-subtitle" id="popupText">You got it right!</p>

        <button class="nav replay-btn" id="playAgain"
        onclick="restart()" style="display:none">
            Play Again
        </button>

    </div>

</div>

<script>


/* =========================
   CORRECT / WRONG BG SOUND
   SAME AS BIG AND SMALL
========================= */

const audioCtx =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

function playAudioTone(isCorrect) {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (isCorrect) {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    }

    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

function showSmallConfetti(isFinal = false) {
    const confettiContainer = document.getElementById('confettiContainer');
    if (!confettiContainer) return;

    confettiContainer.innerHTML = '';

    const count = isFinal ? 95 : 42;

    const colors = [
        '#00b894',
        '#e67e22',
        '#6c5ce7',
        '#0984e3',
        '#fdcb6e',
        '#ff6b7a',
        '#00cec9',
        '#a29bfe'
    ];

    for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');

        piece.className =
            isFinal
                ? 'confetti-piece final-confetti-piece'
                : 'confetti-piece';

        const startX = Math.random() * 100;
        const startY = -8 + Math.random() * 10;

        const drift =
            (Math.random() * 520 - 260) *
            (isFinal ? 1.15 : 0.9);

        const fall =
            window.innerHeight *
            (0.82 + Math.random() * 0.48);

        const rotation =
            Math.random() * 1400 - 700;

        piece.style.left = startX + '%';
        piece.style.top = startY + '%';

        piece.style.setProperty('--x', drift + 'px');
        piece.style.setProperty('--y', fall + 'px');
        piece.style.setProperty('--r', rotation + 'deg');

        piece.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        piece.style.animationDelay =
            (Math.random() * (isFinal ? 500 : 220)) + 'ms';

        confettiContainer.appendChild(piece);

        setTimeout(
            () => piece.remove(),
            isFinal ? 2900 : 2050
        );
    }
}


const questions=[
    {num:12,t:1,o:2},
    {num:19,t:1,o:9},
    {num:17,t:1,o:7}
];

let round=0;
let tens=0;
let ones=0;
let paused=false;
let timer;

let states=questions.map(()=>({
    t:0,
    o:0,
    done:false
}));

function speak(text){
    speechSynthesis.cancel();

    const msg=new SpeechSynthesisUtterance(text);

    msg.lang="en-US";
    msg.volume=.25;
    msg.rate=1;
    msg.pitch=1;

    speechSynthesis.speak(msg);
}

function load(){

    paused=false;

    const state=states[round];

    tens=state.t;
    ones=state.o;

    document.getElementById("target").textContent=
        questions[round].num;

    render();
    controls();
}

function change(type,value){

    if(paused || states[round].done)return;

    if(type==="t"){
        tens=Math.max(0,Math.min(9,tens+value));
        states[round].t=tens;
    }else{
        ones=Math.max(0,Math.min(9,ones+value));
        states[round].o=ones;
    }

    render();
    controls();
}

function render(){

    document.getElementById("tensCount").textContent=tens;
    document.getElementById("onesCount").textContent=ones;

    const tensTray=document.getElementById("tensTray");
    const onesTray=document.getElementById("onesTray");

    tensTray.innerHTML="";
    onesTray.innerHTML="";

    for(let i=0;i<tens;i++){

        const block=document.createElement("div");

        block.className="ten";

        for(let j=0;j<10;j++){
            const line=document.createElement("span");
            block.appendChild(line);
        }

        tensTray.appendChild(block);
    }

    for(let i=0;i<ones;i++){

        const dot=document.createElement("div");

        dot.className="one";

        onesTray.appendChild(dot);
    }
}

function controls(){

    const locked=states[round].done;
    const isEmpty=(tens===0 && ones===0);

    document.getElementById("prev").disabled=
        round===0;

    document.getElementById("next").disabled=
        round===questions.length-1 || !locked;

    document.getElementById("submit").disabled=
        locked || isEmpty;

    [
        "tensMinus",
        "tensPlus",
        "onesMinus",
        "onesPlus"
    ].forEach(id=>{
        document.getElementById(id).disabled=locked;
    });

    document.getElementById("tensCard")
        .classList.toggle("locked",locked);

    document.getElementById("onesCard")
        .classList.toggle("locked",locked);
}

function submitAnswer(){

    if(paused || states[round].done)return;
    if(tens===0 && ones===0)return;

    const q=questions[round];

    if(tens===q.t && ones===q.o){

        paused=true;

        states[round].done=true;

        speak("Correct");
        playAudioTone(true);
        showSmallConfetti(false);

        document.getElementById("tensMonster")
            .classList.add("chewing");

        document.getElementById("onesMonster")
            .classList.add("chewing");

        setTimeout(()=>{

            document.getElementById("tensMonster")
                .classList.remove("chewing");

            document.getElementById("onesMonster")
                .classList.remove("chewing");

            controls();

            if(round===questions.length-1){

                showPopup(
                    "correct",
                    "🌟",
                    "Amazing!",
                    "You got it right!",
                    false
                );

                setTimeout(()=>{

                    showPopup(
                        "final",
                        "🏆",
                        "Congratulations!",
                        "Great job! You completed it! 🎉",
                        true
                    );

                  

                },1600);

            }else{

                showPopup(
                    "correct",
                    "🌟",
                    "Amazing!",
                    "You got it right!",
                    false
                );

                paused=false;
            }

        },350);

    }else{

    paused=true;

    speak("Wrong");
    playAudioTone(false);

    document.getElementById("tensCard")
        .classList.add("shake");

    document.getElementById("onesCard")
        .classList.add("shake");

    setTimeout(()=>{

        document.getElementById("tensCard")
            .classList.remove("shake");

        document.getElementById("onesCard")
            .classList.remove("shake");

        /* Automatically clear Tens and Ones */
        tens=0;
        ones=0;

        states[round].t=0;
        states[round].o=0;

        render();
        controls();

        showPopup(
            "wrong",
            "😟",
            "Keep Going!",
            "Try again, you can do it!",
            false
        );

        paused=false;

    },350);
}
}


function move(direction){

    const next=round+direction;

    if(next<0 || next>=questions.length)return;

    if(direction===1 && !states[round].done)return;

    round=next;

    load();
}

function showPopup(type,icon,title,text,final){

    clearTimeout(timer);

    const popup=document.getElementById("popup");

    popup.className="popup "+type+(final?" complete":"");

    document.getElementById("popupIcon").textContent=icon;
    document.getElementById("popupTitle").textContent=title;
    document.getElementById("popupText").textContent=text;

    document.getElementById("playAgain").style.display=
        final?"inline-block":"none";

    document.getElementById("popupBg")
        .classList.add("show");

    if(!final){

        timer=setTimeout(closePopup,1600);
    }
}

function closePopup(){

    document.getElementById("popupBg")
        .classList.remove("show");
}

function restart(){

    clearTimeout(timer);

    round=0;
    tens=0;
    ones=0;
    paused=false;

    states=questions.map(()=>({
        t:0,
        o:0,
        done:false
    }));

    closePopup();

    const confettiContainer = document.getElementById("confettiContainer");
    if(confettiContainer) confettiContainer.innerHTML="";

    load();
}

window.addEventListener("load",load);

</script>
