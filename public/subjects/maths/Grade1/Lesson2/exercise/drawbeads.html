<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Draw beads</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow: hidden;
        }

        body {
            min-height: 100dvh;
            overflow: hidden;
        }

        /* LIGHT PASTEL BACKGROUND */
        body {

            background-size: 40px 40px;
            color: #435266;
            overflow: hidden;
        }

        /* MAIN LAYOUT */
        .game {
            width: 100%;
            min-height: 100dvh;
            padding: clamp(10px, 1.5vh, 18px) clamp(12px, 3vw, 42px) clamp(16px, 2vh, 28px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 1.8vh, 20px);
        }

        /* HEADER & QUESTION */
        .header-text {
            width: min(100%, 1200px);
            font-size: 22px;
            line-height: 1.25;
            font-weight: 400;
            text-align: center;
            color: #2f4f4f;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .question {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .question-box {
            width: min(92vw, 640px);
            min-height: clamp(54px, 7vh, 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 2vw, 18px);
            padding: 9px clamp(18px, 4vw, 34px);
            background: #fffdf7;
            border: 3px solid #a29bfe;
            border-radius: 28px;
            box-shadow: 0 5px 0 rgba(108, 92, 231, .12);
            font-size: 30px;
            font-weight: 400;
            margin: 0;
        }

        .question-box {
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .question-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 rgba(108, 92, 231, .16);
        }

        .target {
            color: #6c5ce7;
            font-weight: 400;
            font-size: 30px;
            background: #e0d9ff;
            padding: 2px 16px;
            border-radius: 15px;
        }

        /* GAME AREA - UNIQUE ABACUS DESIGN */
        .stage {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .abacus-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .abacus-base {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: clamp(42px, 7vw, 78px);
            width: min(94vw, 530px);
            padding: clamp(16px, 2.5vh, 24px) clamp(22px, 4vw, 38px) 18px;
            background: #ffeaa7;
            /* Pastel yellow base */
            border-radius: 30px;
            border: 4px solid #fdcb6e;
            box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.05), 0 10px 20px rgba(253, 203, 110, 0.2);
            margin-top: 20px;
        }

        .rod-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* The vertical rods */
        .rod {
            width: 12px;
            height: clamp(145px, 21vh, 195px);
            background: #dfe6e9;
            border-radius: 10px 10px 0 0;
            position: relative;
            display: flex;
            flex-direction: column-reverse;
            /* Stacks beads bottom-up */
            align-items: center;
            justify-content: flex-start;
            padding-bottom: 5px;
            gap: 2px;
            box-shadow: inset 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .rod::after {
            content: '';
            position: absolute;
            bottom: -15px;
            width: 40px;
            height: 15px;
            background: #b2bec3;
            border-radius: 10px;
        }

        /* Beads */
        .bead {
            width: clamp(45px, 6vw, 60px);
            height: clamp(16px, 2.5vh, 20px);
            border-radius: 12px;
            box-shadow: inset 0 -3px 5px rgba(0, 0, 0, 0.15), 0 3px 5px rgba(0, 0, 0, 0.1);
            animation: dropIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .bead.ten-bead {
            background: #ffb8b8;
            border: 2px solid #ff7675;
        }

        .bead.one-bead {
            background: #c7ecee;
            border: 2px solid #22a6b3;
        }

        @keyframes dropIn {
            0% {
                transform: translateY(-30px) scale(0.8);
                opacity: 0;
            }

            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .rod-label {
            font-size: clamp(1.5rem, 2.5vw, 2rem);
            font-weight: 900;
            color: #2d3436;
            background: #ffffff;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            box-shadow: 0 4px 0 #dfe6e9;
            margin-top: 10px;
        }

        /* LIVE BEAD COUNT - child-friendly */
        .bead-count {
            min-width: 82px;
            min-height: 44px;
            padding: 5px 12px;
            margin-top: 2px;
            border-radius: 16px;
            background: #fff;
            border: 3px solid #dfe6e9;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #2f4f4f;
            line-height: 1;
        }

        .bead-count .count-number {
            font-size: 26px;
            font-weight: 500;
        }

        .bead-count .count-label {
            font-size: 15px;
            font-weight: 500;
        }

        @media (max-width: 700px) {
            .bead-count {
                min-width: 76px;
                min-height: 40px;
                padding: 4px 10px;
                border-radius: 14px;
            }

            .bead-count .count-number {
                font-size: 23px;
            }

            .bead-count .count-label {
                font-size: 14px;
            }
        }

        /* Add / Remove Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .ctrl-btn {
            width: clamp(35px, 5vw, 45px);
            height: clamp(35px, 5vw, 45px);
            border-radius: 50%;
            border: none;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            font-weight: 600;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .ctrl-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0, 0, 0, 0.1);
        }

        .ctrl-btn.add {
            background: #55efc4;
            box-shadow: 0 4px 0 #00b894;
        }

        .ctrl-btn.add:active:not(:disabled) {
            box-shadow: 0 0 0 #00b894;
        }

        .ctrl-btn.sub {
            background: #fab1a0;
            box-shadow: 0 4px 0 #e17055;
        }

        .ctrl-btn.sub:active:not(:disabled) {
            box-shadow: 0 0 0 #e17055;
        }

        .ctrl-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #b2bec3;
            box-shadow: 0 4px 0 #636e72;
        }

        /* LOCKED STATE */
        .abacus-container.locked {
            opacity: 0.9;
            pointer-events: none;
        }

        /* SHAKE ANIMATION FOR WRONG ANSWER */
        .shake {
            animation: shake .4s;
        }

        @keyframes shake {

            20%,
            60% {
                transform: translateX(-10px);
            }

            40%,
            80% {
                transform: translateX(10px);
            }
        }

        /* EXACT NAVIGATION BUTTONS FROM REFERENCE */
        .navigation {
            width: min(100%, 1100px);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding-top: 2px;
            padding-bottom: 2px;
        }

        .nav {
            width: 178px;
            height: 45px;
            padding: 0;
            border: none;
            border-radius: 35px;
            background: #e67e22;
            color: white;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 6px #d35400;
            transition: all 0.1s ease;
            margin-top: 30px;
        }

        .nav:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px #d35400;
        }

        .nav:disabled {
            background: #b2bec3;
            box-shadow: 0 6px #7f8c8d;
            cursor: not-allowed;
        }

        #prev {
            justify-self: start;
        }

        #next {
            justify-self: end;
        }

        .submit {
            background: #00b894;
            box-shadow: 0 6px #008f72;
        }

        .submit:active:not(:disabled) {
            box-shadow: 0 2px #008f72;
        }

        /* EXACT POPUP STYLE USED BY TENS & ONES / HEAVY & LIGHT */
        .popup-bg {
            position: fixed;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease;
            z-index: 1000;
        }

        .popup-bg.show {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-bg.show .popup {
            transform: scale(1);
        }

        .popup {
            position: relative;
            width: 90%;
            max-width: 520px;
            padding: 40px 30px;
            border-radius: 36px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .1);
            transform: scale(.8);
            transition: transform .35s cubic-bezier(.175, .885, .32, 1.275);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .popup::before,
        .popup::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .popup::before {
            width: 220px;
            height: 220px;
            top: -60px;
            right: -50px;
        }

        .popup::after {
            width: 180px;
            height: 180px;
            bottom: -70px;
            left: -40px;
        }

        .popup.correct {
            background: #edfbf4;
            border: 6px solid #00c885;
        }

        .popup.correct::before,
        .popup.correct::after {
            background: rgba(162, 245, 209, .45);
        }

        .popup.correct h2 {
            color: #00a86b;
        }

        .popup.correct p {
            color: #2e7d5b;
        }

        .popup.wrong {
            background: #fff0f2;
            border: 6px solid #ff6b7a;
        }

        .popup.wrong::before,
        .popup.wrong::after {
            background: rgba(255, 196, 203, .45);
        }

        .popup.wrong h2 {
            color: #d33847;
        }

        .popup.wrong p {
            color: #a33b45;
        }

        .popup.final {
            background: #f0f3ff;
            border: 6px solid #6c5ce7;
            width: 520px;
            max-width: 90vw;
            height: 300px;
            padding: 40px 30px;
            box-sizing: border-box;
            border-radius: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .popup.final::before,
        .popup.final::after {
            background: rgba(162, 155, 254, .35);
        }

        .popup.final h2 {
            color: #6c5ce7;
        }

        .popup.final p {
            color: #4834d4;
        }

        .popup-icon {
            position: relative;
            z-index: 5;
            font-size: 72px;
            line-height: 1;
            margin-bottom: 14px;
        }

        .popup h2 {
            position: relative;
            z-index: 5;
            margin: 0;
            font-size: 3rem;
            font-weight: 600;
        }

        .popup p {
            position: relative;
            z-index: 5;
            font-size: 1.4rem;
            font-weight: 500;
        }

        .play {
            position: relative;
            z-index: 5;
            border: none;
            border-radius: 45px;
            padding: 10px 35px;
            margin-top: 20px;
            background: #0984e3;
            color: white;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 0 #0975c7;
            display: none;
        }

        .play:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0975c7;
        }

        /* =========================
   BEAD COUNTER + BUTTON LAYOUT FIX
   Keeps the +/- controls visible and prevents footer buttons
   from being pushed below the viewport.
========================= */

        .abacus-base {
            align-items: flex-start;
            padding-top: 16px;
            padding-bottom: 14px;
            gap: clamp(46px, 6vw, 72px);
        }

        .rod-group {
            gap: 8px;
            flex: 0 0 auto;
        }

        .rod {
            height: clamp(150px, 18vh, 170px);
        }

        .bead {
            height: clamp(14px, 2vh, 17px);
        }

        .rod-label {
            margin-top: 4px;
            flex: 0 0 auto;
        }

        .bead-count {
            min-width: 78px;
            min-height: 36px;
            height: 36px;
            padding: 3px 8px;
            margin-top: 0;
            border-radius: 13px;
            flex: 0 0 auto;
        }

        .bead-count .count-number {
            font-size: 23px;
            font-weight: 400;
        }

        .bead-count .count-label {
            font-size: 13px;
            font-weight: 400;
        }

        .controls {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: max-content;
            height: 45px;
            margin-top: 0;
            flex: 0 0 45px;
        }

        .ctrl-btn {
            flex: 0 0 45px;
            width: 45px;
            height: 45px;
            min-width: 45px;
            min-height: 45px;
            padding: 0;
        }

        .navigation {
            flex: 0 0 auto;
            min-height: 51px;
            z-index: 10;
        }

        /* Give the main stage only the space it actually needs. */
        .stage {
            flex: 0 1 auto;
        }

        /* Laptop / smaller screens */
        @media (max-width: 700px) {
            .abacus-base {
                width: min(94vw, 440px);
                gap: clamp(30px, 8vw, 52px);
                padding: 12px 16px 12px;
            }

            .rod {
                height: 150px;
            }

            .bead {
                width: clamp(40px, 12vw, 52px);
                height: 14px;
            }

            .rod-label {
                width: 42px;
                height: 42px;
                font-size: 1.2rem;
            }

            .bead-count {
                min-width: 72px;
                width: 72px;
                height: 34px;
                min-height: 34px;
            }

            .bead-count .count-number {
                font-size: 21px;
            }

            .bead-count .count-label {
                font-size: 12px;
            }

            .controls {
                height: 42px;
                flex-basis: 42px;
                gap: 8px;
            }

            .ctrl-btn {
                flex-basis: 42px;
                width: 42px;
                height: 42px;
                min-width: 42px;
                min-height: 42px;
            }
        }

        /* Very short laptop screens: make the complete game fit without hiding
   the navigation. */
        @media (max-height: 760px) {
            .game {
                gap: 7px;
                padding-top: 7px;
                padding-bottom: 8px;
            }

            .header-text {
                font-size: 22px;
            }

            .question-box {
                min-height: 52px;
                padding: 6px 18px;
            }

            .abacus-base {
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .rod {
                height: 135px;
            }

            .bead {
                height: 13px;
            }

            .rod-group {
                gap: 5px;
            }

            .rod-label {
                width: 40px;
                height: 40px;
            }

            .bead-count {
                height: 32px;
                min-height: 32px;
            }

            .controls,
            .ctrl-btn {
                height: 40px;
                min-height: 40px;
            }

            .ctrl-btn {
                width: 40px;
                min-width: 40px;
                flex-basis: 40px;
            }
        }

        /* RESPONSIVE TWEAKS */
        @media (max-width: 700px) {
            .game {
                gap: 10px;
                padding: 10px 12px 16px;
            }

            .header-text {
                font-size: clamp(1.05rem, 5vw, 1.35rem);
                padding: 2px 8px;
            }

            .question-box {
                width: min(94vw, 500px);
                min-height: 52px;
                border-radius: 24px;
                padding: 8px 16px;
            }

            .abacus-base {
                width: min(94vw, 440px);
                gap: clamp(34px, 10vw, 58px);
                padding: 15px 20px 16px;
                border-radius: 24px;
            }

            .rod {
                height: clamp(135px, 24vh, 175px);
            }

            .bead {
                width: clamp(42px, 13vw, 56px);
            }

            .rod-label {
                width: 42px;
                height: 42px;
                font-size: 1.2rem;
                margin-top: 6px;
            }

            .navigation {
                gap: 6px;
            }

            .nav,
            .submit {
                width: 178px;
                height: 45px;
                padding: 0;
                font-size: 22px;
                font-weight: 600;
            }
        }

        @media (max-width: 380px) {
            .header-text {
                font-size: 1rem;
            }

            .question-box {
                font-size: .95rem;
            }

            .abacus-base {
                gap: 28px;
                padding: 14px 14px 15px;
            }

            .navigation {
                grid-template-columns: 1fr;
            }

            #prev,
            #next,
            .submit {
                justify-self: center;
                width: 178px;
                height: 45px;
            }
        }

        @media screen and (min-width: 1441px) and (max-width: 1920px) {
            .abacus-base {
                display: flex;
                align-items: flex-start;
                justify-content: center;
                gap: clamp(42px, 9vw, 120px);
                width: min(94vw, 700px);
                padding-block: 60px;
                background: #ffeaa7;
                /* Pastel yellow base */
                border-radius: 30px;
                border: 4px solid #fdcb6e;
                box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.05), 0 10px 20px rgba(253, 203, 110, 0.2);
                margin-top: 20px;
            }

            .bead-count {
                min-width: 60px;
                min-height: 45px;
                height: 45px;
            }

            .rod-group {
                gap: 18px;
            }

            .bead-count .count-number,
            .bead-count .count-label {
                font-size: 30px;
            }

            .ctrl-btn {
                flex: 0 0 60px;
                width: 60px;
                height: 60px;
                padding: 0;
            }

            .header-text{
                font-size: 35px;
            }
        }

        /* EXACT SAME CONFETTI EFFECT */
        #confettiContainer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 90;
        }

        .confetti-piece {
            position: absolute;
            width: 9px;
            height: 14px;
            border-radius: 2px;
            opacity: 0;
            animation: pageConfetti 1700ms cubic-bezier(.16, .72, .3, 1) forwards;
            will-change: transform, opacity;
        }

        .final-confetti-piece {
            width: 10px;
            height: 16px;
            animation-duration: 2300ms;
        }

        .final-confetti-piece:nth-child(3n) {
            border-radius: 50%;
        }

        .final-confetti-piece:nth-child(4n) {
            width: 7px;
            height: 19px;
            border-radius: 1px;
        }

        .final-confetti-piece:nth-child(5n) {
            width: 13px;
            height: 8px;
            border-radius: 2px;
        }

        @keyframes pageConfetti {
            0% {
                opacity: 1;
                transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
            }

            55% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(0.72);
            }
        }

        .final-confetti-piece::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: inherit;
        }


        /* FINAL POPUP — exact reference sizing and typography on every device */
        .popup.final.complete {
            width: 90%;
            max-width: 520px;
            padding: 40px 30px;
            border-radius: 36px;
        }

        .popup.final.complete h2 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .popup.final.complete p {
            font-size: 1.4rem;
            font-weight: 500;
            line-height: 1.35;
            white-space: nowrap;
        }

        .popup.final.complete .play {
            font-size: 20px;
            font-weight: 500;
            padding: 10px 35px;
            border-radius: 40px;
            margin-top: 20px;
        }

        .popup.final.complete {
            box-shadow:
                0 20px 45px rgba(108, 92, 231, 0.18),
                0 0 0 8px rgba(162, 155, 254, 0.12);
        }

        .popup.final.complete .play {
            margin-top: 20px;
        }

        .popup.final.complete .popup-icon {
            animation: finalTrophyBounce 1.2s ease-in-out infinite;
        }

        @keyframes finalTrophyBounce {

            0%,
            100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }

            50% {
                transform: translateY(-5px) rotate(-4deg) scale(1.06);
            }
        }
    </style>
</head>

<body>
    <div id="confettiContainer"></div>

    <div class="game">

        <div class="header-text">Draw the beads to represent the given numbers on the abacus.</div>

        <div class="question">
            <div class="question-box">
                Target number:
                <span class="target" id="target">9</span>
            </div>
        </div>

        <main class="stage">
            <div class="abacus-container" id="abacus">
                <div class="abacus-base">

                    <div class="rod-group">
                        <div class="rod" id="tensRod"></div>
                        <div class="rod-label">T</div>
                        <div class="bead-count" aria-live="polite">
                            <span class="count-number" id="tensCount">0</span>
                            <span class="count-label">beads</span>
                        </div>
                        <div class="controls">
                            <button class="ctrl-btn sub" id="tensMinus" onclick="change('t',-1)">−</button>
                            <button class="ctrl-btn add" id="tensPlus" onclick="change('t',1)">+</button>
                        </div>
                    </div>

                    <div class="rod-group">
                        <div class="rod" id="onesRod"></div>
                        <div class="rod-label">O</div>
                        <div class="bead-count" aria-live="polite">
                            <span class="count-number" id="onesCount">0</span>
                            <span class="count-label">beads</span>
                        </div>
                        <div class="controls">
                            <button class="ctrl-btn sub" id="onesMinus" onclick="change('o',-1)">−</button>
                            <button class="ctrl-btn add" id="onesPlus" onclick="change('o',1)">+</button>
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <footer class="navigation">
            <button class="nav" id="prev" onclick="move(-1)">PREV</button>
            <button class="nav submit" id="submit" onclick="submitAnswer()">SUBMIT</button>
            <button class="nav" id="next" onclick="move(1)">NEXT</button>
        </footer>

    </div>

    <div class="popup-bg" id="popupBg">
        <div class="popup" id="popup">
            <div class="popup-icon" id="popupIcon">⭐</div>
            <h2 id="popupTitle">Amazing!</h2>
            <p id="popupText">You got it right!</p>
            <button class="play" id="playAgain" onclick="restart()" style="display:none">
                Play Again
            </button>
        </div>
    </div>

    <script>

        /* EXACT SAME CONFETTI EFFECT */

        /* EXACT CORRECT / WRONG BACKGROUND SOUND */
        const audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        function playAudioTone(isCorrect) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isCorrect) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            }

            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function showSmallConfetti(isFinal = false) {
            const confettiContainer = document.getElementById('confettiContainer');
            if (!confettiContainer) return;

            confettiContainer.innerHTML = '';

            const count = isFinal ? 95 : 42;

            const colors = [
                '#00b894',
                '#e67e22',
                '#6c5ce7',
                '#0984e3',
                '#fdcb6e',
                '#ff6b7a',
                '#00cec9',
                '#a29bfe'
            ];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('span');

                piece.className =
                    isFinal
                        ? 'confetti-piece final-confetti-piece'
                        : 'confetti-piece';

                const startX = Math.random() * 100;
                const startY = -8 + Math.random() * 10;

                const drift =
                    (Math.random() * 520 - 260) *
                    (isFinal ? 1.15 : 0.9);

                const fall =
                    window.innerHeight *
                    (0.82 + Math.random() * 0.48);

                const rotation =
                    Math.random() * 1400 - 700;

                piece.style.left = startX + '%';
                piece.style.top = startY + '%';

                piece.style.setProperty('--x', drift + 'px');
                piece.style.setProperty('--y', fall + 'px');
                piece.style.setProperty('--r', rotation + 'deg');

                piece.style.background =
                    colors[Math.floor(Math.random() * colors.length)];

                piece.style.animationDelay =
                    (Math.random() * (isFinal ? 500 : 220)) + 'ms';

                confettiContainer.appendChild(piece);

                setTimeout(
                    () => piece.remove(),
                    isFinal ? 2900 : 2050
                );
            }
        }

        // Data from the provided image
        const questions = [
            { num: 9, t: 0, o: 9 },
            { num: 18, t: 1, o: 8 },
            { num: 13, t: 1, o: 3 }
        ];

        let round = 0;
        let tens = 0;
        let ones = 0;
        let paused = false;
        let timer;
        let finalTimer;

        let states = questions.map(() => ({
            t: 0,
            o: 0,
            done: false
        }));

        // Exact voice logic from reference
        function speak(text) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = "en-US";
            msg.volume = .25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function load() {
            paused = false;
            const state = states[round];

            tens = state.t;
            ones = state.o;

            document.getElementById("target").textContent = questions[round].num;

            render();
            controls();
        }

        function change(type, value) {
            if (paused || states[round].done) return;

            if (type === "t") {
                tens = Math.max(0, Math.min(9, tens + value));
                states[round].t = tens;
            } else {
                ones = Math.max(0, Math.min(9, ones + value));
                states[round].o = ones;
            }
            render();
            controls();
        }

        function render() {
            const tensRod = document.getElementById("tensRod");
            const onesRod = document.getElementById("onesRod");

            tensRod.innerHTML = "";
            onesRod.innerHTML = "";

            // Show the exact number of beads currently added.
            document.getElementById("tensCount").textContent = tens;
            document.getElementById("onesCount").textContent = ones;

            // Draw Tens Beads
            for (let i = 0; i < tens; i++) {
                const bead = document.createElement("div");
                bead.className = "bead ten-bead";
                tensRod.appendChild(bead);
            }

            // Draw Ones Beads
            for (let i = 0; i < ones; i++) {
                const bead = document.createElement("div");
                bead.className = "bead one-bead";
                onesRod.appendChild(bead);
            }
        }

        function controls() {
            const locked = states[round].done;
            const isEmpty = (tens === 0 && ones === 0);

            document.getElementById("prev").disabled = (round === 0);
            document.getElementById("next").disabled = (round === questions.length - 1 || !locked);
            document.getElementById("submit").disabled = locked || isEmpty;

            ["tensMinus", "tensPlus", "onesMinus", "onesPlus"].forEach(id => {
                document.getElementById(id).disabled = locked;
            });

            document.getElementById("abacus").classList.toggle("locked", locked);
        }

        function submitAnswer() {
            if (paused || states[round].done) return;
            if (tens === 0 && ones === 0) return;

            const q = questions[round];

            if (tens === q.t && ones === q.o) {
                paused = true;
                states[round].done = true;
                speak("Correct");
                playAudioTone(true);
                showSmallConfetti(false);

                controls();

                // Show the Correct popup first for every question.
                showPopup(
                    "correct",
                    "🌟",
                    "Amazing!",
                    "You got it right!",
                    false
                );

                if (round === questions.length - 1) {
                    // Then automatically show the Final popup.
                    clearTimeout(finalTimer);
                    const confettiContainer = document.getElementById("confettiContainer");
                    // if (confettiContainer) confettiContainer.innerHTML = "";
                    finalTimer = setTimeout(() => {
                        closePopup();

                        setTimeout(() => {
                            paused = true;

                            showSmallConfetti(true);

                            showPopup(
                                "final",
                                "🏆",
                                "Congratulations!",
                                "Great job! You completed it! 🎉",
                                true
                            );


                        }, 180);
                    }, 1800);
                } else {
                    paused = false;
                }

            } else {
                paused = true;
                speak("Wrong");
                playAudioTone(false);

                const abacus = document.getElementById("abacus");
                abacus.classList.add("shake");

                setTimeout(() => {
                    abacus.classList.remove("shake");

                    // Automatically clear Tens and Ones on wrong answer
                    tens = 0;
                    ones = 0;
                    states[round].t = 0;
                    states[round].o = 0;
                    render();
                    controls();

                    showPopup(
                        "wrong",
                        "😟",
                        "Keep Going!",
                        "Try again, you can do it!",
                        false
                    );

                    paused = false;
                }, 350);
            }
        }

        function move(direction) {
            const next = round + direction;
            if (next < 0 || next >= questions.length) return;
            if (direction === 1 && !states[round].done) return;

            round = next;
            load();
        }

        // Exact popup logic from reference
        function showPopup(type, icon, title, text, final) {
            clearTimeout(timer);
            const popup = document.getElementById("popup");

            popup.className = "popup " + type + (final ? " complete" : "");
            document.getElementById("popupIcon").textContent = icon;
            document.getElementById("popupTitle").textContent = title;
            document.getElementById("popupText").textContent = text;

            document.getElementById("playAgain").style.display = final ? "inline-block" : "none";
            document.getElementById("popupBg").classList.add("show");

            if (!final) {
                timer = setTimeout(closePopup, 1600);
            }
        }

        function closePopup() {
            document.getElementById("popupBg").classList.remove("show");
        }

        function restart() {
            clearTimeout(timer);
            clearTimeout(finalTimer);
            round = 0;
            tens = 0;
            ones = 0;
            paused = false;

            states = questions.map(() => ({
                t: 0,
                o: 0,
                done: false
            }));

            closePopup();
            load();
        }

        window.addEventListener("load", load);

    </script>
</body>

</html>
