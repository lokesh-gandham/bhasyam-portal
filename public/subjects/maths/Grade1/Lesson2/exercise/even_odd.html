<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count even and odd</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Livvic", sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {

            color: #435266;
        }

        .game {
            width: 100%;
            height: 100dvh;
            padding:
                clamp(12px, 2vh, 24px) clamp(18px, 4vw, 70px);
            display: grid;
            grid-template-rows:
                auto minmax(0, 1fr) auto;
            gap:
                clamp(10px, 2vh, 22px);
            overflow: hidden;
        }

        .header {
            width: 100%;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .question-heading {
            max-width: 1300px;
            color: #2f4f4f;
            font-size: 30px;
            font-weight: 400;
            line-height: 1.3;
            text-align: center;
        }

        @media(min-width:1600px) {
            .question-heading {
                font-size: 40px;
            }

            .pod-title {
                font-size: 30px;
                color: #2f4f4f;
            }
        }

        .quiz-area {
            width: 100%;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .garden-world {
            width: min(100%, 1150px);
            height: 100%;
            min-height: 0;
            position: relative;
            display: grid;
            grid-template-rows:
                auto minmax(0, 1fr);
            align-items: center;
            gap:
                clamp(12px, 2vh, 25px);
        }

        .question-number {
            justify-self: center;
            padding:
                clamp(10px, 1.5vh, 16px) clamp(25px, 4vw, 55px);
            border-radius: 40px;
            background:
                rgba(255, 255, 255, .72);
            border:
                3px solid #f1c27d;
            box-shadow:
                0 7px 0 rgba(224, 160, 78, .22),
                0 12px 28px rgba(67, 82, 102, .08);
            color: #435266;
            font-size:
                clamp(20px, 2.2vw, 32px);
            text-align: center;
        }

        .question-number span {
            color: #e67e22;
        }

        .counting-garden {
            width: 100%;
            min-height: 0;
            display: grid;
            grid-template-columns:
                minmax(0, 1fr) minmax(220px, .55fr) minmax(0, 1fr);
            align-items: center;
            gap:
                clamp(20px, 4vw, 65px);
            position: relative;
        }

        .object-zone {
            min-width: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .object-field {
            width: 100%;
            max-width: 520px;
            min-height:
                clamp(200px, 38vh, 380px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding:
                clamp(20px, 3vw, 40px);
            position: relative;
        }

        .object-field::before {
            content: "";
            position: absolute;
            width: 88%;
            height: 78%;
            border-radius: 50%;
            background:
                radial-gradient(circle,
                    rgba(255, 244, 214, .7),
                    rgba(255, 255, 255, .15));
            z-index: 0;
        }

        .count-object {
            width:
                clamp(220px, 34vw, 520px);
            max-width: 100%;
            max-height:
                clamp(250px, 48vh, 500px);
            height: auto;
            object-fit: contain;
            position: relative;
            z-index: 2;
            animation:
                bloom .45s ease both;
        }

        @keyframes bloom {
            from {
                opacity: 0;
                transform:
                    scale(.75) translateY(15px);
            }

            to {
                opacity: 1;
                transform:
                    scale(1) translateY(0);
            }
        }

        .count-pod {
            width: 100%;
            min-height:
                clamp(250px, 38vh, 410px);
            border-radius:
                42% 42% 35% 35%;
            background:
                linear-gradient(180deg,
                    rgba(255, 255, 255, .92),
                    rgba(247, 244, 236, .95));
            border:
                3px solid #d7c7a8;
            box-shadow:
                0 10px 0 rgba(180, 155, 110, .18),
                0 20px 40px rgba(67, 82, 102, .10);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap:
                clamp(12px, 2vh, 22px);
            padding:
                clamp(18px, 2vw, 30px);
            position: relative;
        }

        .count-pod::before {
            content: "";
            position: absolute;
            top: -20px;
            width: 70%;
            height: 40px;
            border-radius: 50%;
            background: #f4e4c1;
            border:
                3px solid #d7c7a8;
        }

        .pod-title {
            font-size: 22px;
            color: #2f4f4f;
            text-align: center;
        }

        .number-input {
            width:
                clamp(90px, 10vw, 140px);
            height:
                clamp(90px, 10vw, 140px);
            border-radius: 50%;
            background:
                linear-gradient(145deg,
                    #fff9ec,
                    #f1dfbb);
            border:
                4px solid #e3b55d;
            text-align: center;
            color: #d35400;
            font-size:
                clamp(42px, 5vw, 70px);
            outline: none;
            box-shadow:
                inset 0 -7px 0 rgba(190, 140, 50, .12);
            appearance: textfield;
        }

        .number-input::-webkit-outer-spin-button,
        .number-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .number-input:focus {
            border-color: #e67e22;
            box-shadow:
                0 0 0 6px rgba(230, 126, 34, .12),
                inset 0 -7px 0 rgba(190, 140, 50, .12);
        }

        .number-input:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .answer-zone {
            min-width: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .answer-garden {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap:
                clamp(18px, 3vh, 30px);
        }

        .answer-title {
            font-size:
                clamp(19px, 2vw, 28px);
            color: #435266;
            text-align: center;
        }

        .choice-row {
            width: 100%;
            display: flex;
            gap:
                clamp(12px, 2vw, 22px);
            justify-content: center;
        }

        .choice-btn {
            width:
                clamp(110px, 11vw, 170px);
            min-height:
                clamp(70px, 9vh, 100px);
            border-radius: 28px;
            border:
                3px solid #d5dde2;
            background:
                rgba(255, 255, 255, .82);
            color: #435266;
            font-size:
                clamp(20px, 2.2vw, 30px);
            cursor: pointer;
            box-shadow:
                0 7px 0 rgba(67, 82, 102, .12);
            transition:
                transform .15s,
                box-shadow .15s,
                border-color .15s;
        }

        .choice-btn:hover:not(:disabled) {
            transform:
                translateY(-3px);
        }

        .choice-btn:active:not(:disabled) {
            transform:
                translateY(5px);
            box-shadow:
                0 2px 0 rgba(67, 82, 102, .12);
        }

        .choice-btn.active {
            border-color: #e67e22;
            background: #fff7e8;
            color: #d35400;
        }

        .choice-btn:disabled {
            cursor: not-allowed;
            opacity: .75;
        }

        .lock-note {
            display: none;
            color: #00a86b;
            font-size:
                clamp(14px, 1.4vw, 18px);
        }

        .lock-note.show {
            display: block;
        }

        .shake {
            animation:
                shake .4s;
        }

        @keyframes shake {
            20% {
                transform:
                    translateX(-10px);
            }

            40% {
                transform:
                    translateX(10px);
            }

            60% {
                transform:
                    translateX(-7px);
            }

            80% {
                transform:
                    translateX(7px);
            }
        }

        .navigation {
            width: min(100%, 1100px);
            justify-self: center;
            display: grid;
            grid-template-columns:
                1fr auto 1fr;
            align-items: center;
        }

        .nav {
            width: 178px;
            height: 45px;
            min-width: 178px;
            padding: 0;
            border: none;
            border-radius: 35px;
            background: #e67e22;
            color: white;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            box-shadow:
                0 6px #d35400;
            transition:
                all .1s ease;
                text-transform: uppercase;
        }

        .nav:active:not(:disabled) {
            transform:
                translateY(4px);
            box-shadow:
                0 2px #d35400;
        }

        .nav:disabled {
            background: #b2bec3;
            box-shadow:
                0 6px #7f8c8d;
            cursor: not-allowed;
        }

        #prev {
            justify-self: start;
            text-transform: uppercase;
        }

        #next {
            justify-self: end;
            text-transform: uppercase;
        }

        .submit {
            background: #00b894;
            box-shadow:
                0 6px #008f72;
                text-transform: uppercase;
        }

        .submit:active:not(:disabled) {
            box-shadow:
                0 2px #008f72;
        }

        .popup-bg {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s
        }

        .popup-bg.show {
            opacity: 1;
            pointer-events: auto
        }

        .popup {
            position: relative;
            width: 90%;
            max-width: 520px;
            padding: 40px 30px;
            border-radius: 36px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .1);
            transform: scale(.8);
            transition: transform .35s cubic-bezier(.175, .885, .32, 1.275);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center
        }

        .popup::before {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            top: -60px;
            right: -50px;
            pointer-events: none
        }

        .popup::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            bottom: -70px;
            left: -40px;
            pointer-events: none
        }

        .popup.correct {
            background: #edfbf4;
            border: 6px solid #00c885
        }

        .popup.correct::before,
        .popup.correct::after {
            background: rgba(162, 245, 209, .45)
        }

        .popup.wrong {
            background: #fff0f2;
            border: 6px solid #ff6b7a
        }

        .popup.wrong::before,
        .popup.wrong::after {
            background: rgba(255, 196, 203, .45)
        }

        .popup.final {
            background: #f0f3ff;
            border: 6px solid #6c5ce7;
            width: 520px;
    max-width: 90vw;
    height: 300px;
    padding: 40px 30px;
    box-sizing: border-box;
    border-radius: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

            
        }

        .popup.final::before,
        .popup.final::after {
            background: rgba(162, 155, 254, .35)
        }

        .popup-bg.show .popup {
            transform: scale(1)
        }

        .popup-icon {
            font-size: 4.8rem;
            margin-bottom: 12px;
            z-index: 2;
            line-height: 1;
            filter: drop-shadow(0 5px 5px rgba(0, 0, 0, .08))
        }

        .popup h2 {
            margin: 0 0 8px;
            font-size: 3rem;
            z-index: 2;
            letter-spacing: -.5px
        }

        .popup p {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 500;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px
        }

        .correct h2 {
            color: #00a86b
        }

        .correct p {
            color: #2e7d5b
        }

        .wrong h2 {
            color: #d33847
        }

        .wrong p {
            color: #a33b45
        }

        .final h2 {
            color: #6c5ce7
        }

        .final p {
            color: #4834d4
        }

        .play {
            margin-top: 20px;
            padding: 10px 35px;
            border: none;
            border-radius: 30px;
            background: #0984e3;
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 5px #0975c7;
            z-index: 2
        }

        .play:active {
            transform: translateY(3px);
            box-shadow: 0 2px #0975c7
        }

        @media(max-width:1000px) {
            .pod-title {
                font-size: 22px;
            }

            .counting-garden {
                grid-template-columns:
                    minmax(0, 1fr) minmax(190px, .55fr);
            }

            .answer-zone {
                grid-column:
                    1 / -1;
                height: auto;
            }

            .answer-garden {
                max-width: 600px;
                flex-direction: row;
                flex-wrap: wrap;
            }

            .object-field {
                min-height:
                    clamp(180px, 32vh, 280px);
            }

            .count-pod {
                min-height:
                    clamp(210px, 32vh, 300px);
            }
        }

        @media(max-width:650px) {

            html,
            body {
                overflow: auto;
            }

            .game {
                height: auto;
                min-height: 100dvh;
                padding:
                    10px 12px;
            }

            .question-heading {
                font-size: 20px;
            }

            .pod-title {
                font-size: 22px;
                color: #2f4f4f;
            }

            .counting-garden {
                grid-template-columns:
                    1fr;
                gap: 10px;
            }

            .object-zone {
                height: auto;
            }

            .object-field {
                min-height: 200px;
                padding: 15px;
            }

            .count-object {
                width: min(80vw, 320px);
            }

            .count-pod {
                min-height: 190px;
                max-width: 280px;
                justify-self: center;
            }

            .answer-zone {
                grid-column: auto;
            }

            .choice-btn {
                min-width: 100px;
            }

            .nav {
                width: 178px;
                height: 45px;
                min-width: 178px;
                padding: 0;
                font-size: 20px;
            }
        }

        @media(max-width:560px) {
            .navigation {
                grid-template-columns: 1fr;
                justify-items: center;
                gap: 14px;
            }

            #prev,
            #submit,
            #next {
                justify-self: center;
            }
        }

        #confettiContainer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 90;
        }

        .confetti-piece {
            position: absolute;
            width: 9px;
            height: 14px;
            border-radius: 2px;
            opacity: 0;
            animation: pageConfetti 1700ms cubic-bezier(.16, .72, .3, 1) forwards;
            will-change: transform, opacity;
        }

        .final-confetti-piece {
            width: 10px;
            height: 16px;
            animation-duration: 2300ms;
        }

        .final-confetti-piece:nth-child(3n) {
            border-radius: 50%
        }

        .final-confetti-piece:nth-child(4n) {
            width: 7px;
            height: 19px;
            border-radius: 1px;
        }

        .final-confetti-piece:nth-child(5n) {
            width: 13px;
            height: 8px;
            border-radius: 2px;
        }

        @keyframes pageConfetti {
            0% {
                opacity: 1;
                transform: translate3d(0, 0, 0) rotate(0deg) scale(1)
            }

            55% {
                opacity: 1
            }

            100% {
                opacity: 0;
                transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(.72);
            }
        }

        .final-confetti-piece::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: inherit;
        }

        /* Requested responsive number and text sizing */
        .number-input {
            font-size: 30px;
            font-weight: 400;
            text-align: center;
        }

        @media(min-width:1600px) {
            .number-input {
                font-size: 40px;
            }

            .question-number {
                font-size: 40px;
            }
        }

        @media(max-width:1599px) and (min-width:651px) {
            .number-input {
                font-size: 30px;
            }

            .question-number {
                font-size: 30px;
            }
        }

        @media(max-width:650px) {
            .number-input {
                font-size: 30px;
            }

            .question-number {
                font-size: 30px;
            }
        }

        /* First letter capital, remaining letters lowercase */
        .question-heading,
        .pod-title,
        .answer-title,
        .choice-btn,
        .nav,
        .popup h2,
        .popup p,
        .play {
            text-transform: none;
        }

        /* Responsive monitor layout */
        @media(min-width:1600px) {
            .game {
                padding: clamp(18px, 2vh, 32px) clamp(30px, 4vw, 90px);
            }

            .garden-world {
                width: min(100%, 1450px);
            }

            .counting-garden {
                gap: clamp(35px, 4vw, 90px);
            }

            .object-field {
                max-width: 620px;
            }

            .count-object {
                width: clamp(300px, 34vw, 600px);
                max-height: clamp(300px, 50vh, 560px);
            }

            .count-pod {
                min-height: clamp(280px, 40vh, 440px);
            }
        }
    </style>
</head>

<body>
    <div id="confettiContainer"></div>
    <div class="game">

        <header class="header">
            <div class="question-heading">
                Count and write the number. tick (✓) whether the number is even or odd.
            </div>
        </header>

        <main class="quiz-area">
            <section class="garden-world">
                <div class="question-number" id="questionNumber">
                    Question
                    <span>1</span>
                </div>
                <div class="counting-garden">

                    <div class="object-zone">
                        <div class="object-field" id="objectField"></div>
                    </div>

                    <div class="count-pod" id="countPod">
                        <div class="pod-title">
                            Count the flowers
                        </div>
                        <input type="number" id="numberInput" class="number-input" inputmode="numeric" min="0"
                            placeholder="" autocomplete="off">
                    </div>

                    <div class="answer-zone">
                        <div class="answer-garden">
                            <div class="answer-title">
                                Is the number even or odd?
                            </div>
                            <div class="choice-row">
                                <button class="choice-btn" id="evenBtn" onclick="selectAnswer('Even')">
                                    Even
                                </button>
                                <button class="choice-btn" id="oddBtn" onclick="selectAnswer('Odd')">
                                    Odd
                                </button>
                            </div>
                            <div class="lock-note" id="lockNote">

                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="navigation">
            <button class="nav" id="prev" onclick="move(-1)">
                PREV
            </button>
            <button class="nav submit" id="submit" onclick="submitAnswer()">
                SUBMIT
            </button>
            <button class="nav" id="next" onclick="move(1)">
                NEXT
            </button>
        </footer>
    </div>
    <div class="popup-bg" id="popupBg">
        <div class="popup" id="popup">
            <div class="popup-icon" id="popupIcon">
                ⭐
            </div>
            <h2 id="popupTitle">
                Amazing!
            </h2>
            <p id="popupText">
                You got it right!
            </p>
            <button class="play" id="playAgain" onclick="restart()" style="display:none">
               Play Again
            </button>
        </div>
    </div>
    <script>

        const audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        function playAudioTone(isCorrect) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isCorrect) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            }

            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }


        function showSmallConfetti(isFinal = false) {
            const confettiContainer = document.getElementById("confettiContainer");
            if (!confettiContainer) return;
            confettiContainer.innerHTML = "";
            const count = isFinal ? 95 : 42;
            const colors = ["#00b894", "#e67e22", "#6c5ce7", "#0984e3", "#fdcb6e", "#ff6b7a", "#00cec9", "#a29bfe"];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement("span");
                piece.className = isFinal
                    ? "confetti-piece final-confetti-piece"
                    : "confetti-piece";

                const startX = Math.random() * 100;
                const startY = -8 + Math.random() * 10;
                const drift = (Math.random() * 520 - 260) * (isFinal ? 1.15 : .9);
                const fall = window.innerHeight * (.82 + Math.random() * .48);
                const rotation = Math.random() * 1400 - 700;

                piece.style.left = startX + "%";
                piece.style.top = startY + "%";
                piece.style.setProperty("--x", drift + "px");
                piece.style.setProperty("--y", fall + "px");
                piece.style.setProperty("--r", rotation + "deg");
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = (Math.random() * (isFinal ? 500 : 220)) + "ms";

                confettiContainer.appendChild(piece);
                setTimeout(() => piece.remove(), isFinal ? 2900 : 2050);
            }
        }

        const questions = [
            {
                label: "1",
                image: "../images/pink-flower.png",
                count: 12,
                answer: "Even"
            },
            {
                label: "2",
                image: "../images/roses.png",
                count: 9,
                answer: "Odd"
            },
            {
                label: "3",
                image: "../images/yellowflower.png",
                count: 8,
                answer: "Even"
            },
            {
                label: "4",
                image: "../images/flower2.png",
                count: 11,
                answer: "Odd"
            }
        ];
        let round = 0;
        let selectedAnswer = "";
        let typedNumber = "";
        let paused = false;
        let timer = null;
        let finalTimer = null;
        let states = questions.map(() => ({
            selected: "",
            number: "",
            done: false
        }));
        function speak(text) {
            speechSynthesis.cancel();
            const msg =
                new SpeechSynthesisUtterance(text);
            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }
        function loadQuestion() {
            paused = false;
            const q = questions[round];
            const state = states[round];
            selectedAnswer = state.selected;
            typedNumber = state.number;
            document
                .getElementById("questionNumber")
                .innerHTML =
                `Question <span>${q.label}</span>`;
            document
                .getElementById("numberInput")
                .value = typedNumber;
            renderObjects();
            updateAnswerButtons();
            updateControls();
        }
        function renderObjects() {
            const field =
                document.getElementById("objectField");
            field.innerHTML = "";
            const q = questions[round];
            const img =
                document.createElement("img");
            img.src = q.image;
            img.className = "count-object";
            img.alt = "Question Object";
            img.onerror = function () {
                console.log(
                    "Image not found:",
                    q.image
                );
            };
            field.appendChild(img);
        }
        document
            .getElementById("numberInput")
            .addEventListener("input", function () {
                if (paused) return;
                if (states[round].done) return;
                typedNumber = this.value;
                states[round].number = typedNumber;
            });
        function selectAnswer(answer) {
            if (paused) return;
            if (states[round].done) return;
            selectedAnswer = answer;
            states[round].selected = answer;
            updateAnswerButtons();
        }
        function updateAnswerButtons() {
            const even =
                document.getElementById("evenBtn");
            const odd =
                document.getElementById("oddBtn");
            even.classList.remove("active");
            odd.classList.remove("active");
            if (selectedAnswer === "Even") {
                even.classList.add("active");
            }
            if (selectedAnswer === "Odd") {
                odd.classList.add("active");
            }
            const locked = states[round].done;
            even.disabled = locked;
            odd.disabled = locked;
            document
                .getElementById("numberInput")
                .disabled = locked;
            document
                .getElementById("lockNote")
                .classList.toggle(
                    "show",
                    locked
                );
        }
        function updateControls() {
            const locked = states[round].done;
            document
                .getElementById("prev")
                .disabled = round === 0;
            document
                .getElementById("next")
                .disabled =
                round === questions.length - 1
                ||
                !locked;
            document
                .getElementById("submit")
                .disabled = locked;
        }
        function submitAnswer() {
            if (paused) return;
            if (states[round].done) return;
            const input =
                document.getElementById("numberInput");
            const enteredNumber =
                Number(input.value);
            if (
                input.value === ""
                ||
                !selectedAnswer
            ) {
                const pod =
                    document.getElementById("countPod");
                pod.classList.add("shake");
                setTimeout(() => {
                    pod.classList.remove("shake");
                }, 400);
                return;
            }
            const q = questions[round];

            if (
                enteredNumber === q.count
                &&
                selectedAnswer === q.answer
            ) {
                paused = true;
                states[round].done = true;
                speak("Correct");
                playAudioTone(true);
                showSmallConfetti(false);
                updateAnswerButtons();
                updateControls();

                if (
                    round === questions.length - 1
                ) {
                    showPopup(
                        "correct",
                        "🌟",
                        "Amazing!",
                        "You got it right!",
                        false
                    );
                    clearTimeout(finalTimer);
                    finalTimer =
                        setTimeout(() => {
                            closePopup();
                            setTimeout(() => {
                                showSmallConfetti(true);
                                showPopup(
                                    "final",
                                    "🏆",
                                    "Congratulations!",
                                    "Great job! You completed it! 🎉",
                                    true
                                );
                            }, 180);
                        }, 1800);
                    return;
                }

                showPopup(
                    "correct",
                    "🌟",
                    "Amazing!",
                    "You got it right!",
                    false
                );
                paused = false;
            }

            else {
                paused = true;
                speak("Wrong");
                playAudioTone(false);
                const pod =
                    document.getElementById("countPod");
                pod.classList.add("shake");
                setTimeout(() => {
                    pod.classList.remove("shake");
                    selectedAnswer = "";
                    typedNumber = "";
                    states[round].selected = "";
                    states[round].number = "";
                    document
                        .getElementById("numberInput")
                        .value = "";
                    updateAnswerButtons();
                    showPopup(
                        "wrong",
                        "😟",
                        "Keep going!",
                        "Try again, you can do it!",
                        false
                    );
                    paused = false;
                }, 350);
            }
        }
        function move(direction) {
            const next =
                round + direction;
            if (
                next < 0
                ||
                next >= questions.length
            ) {
                return;
            }
            if (
                direction === 1
                &&
                !states[round].done
            ) {
                return;
            }
            round = next;
            loadQuestion();
        }
        function showPopup(
            type,
            icon,
            title,
            text,
            final
        ) {
            clearTimeout(timer);
            const popup =
                document.getElementById("popup");
            popup.className =
                "popup " + type;
            document
                .getElementById("popupIcon")
                .textContent = icon;
            document
                .getElementById("popupTitle")
                .textContent = title;
            document
                .getElementById("popupText")
                .textContent = text;
            document
                .getElementById("playAgain")
                .style.display =
                final
                    ?
                    "inline-block"
                    :
                    "none";
            document
                .getElementById("popupBg")
                .classList.add("show");
            if (!final) {
                timer =
                    setTimeout(
                        closePopup,
                        1600
                    );
            }
        }
        function closePopup() {
            document
                .getElementById("popupBg")
                .classList.remove("show");
        }
        function restart() {
            clearTimeout(timer);
            clearTimeout(finalTimer);
            const confettiContainer = document.getElementById("confettiContainer");
            if (confettiContainer) confettiContainer.innerHTML = "";
            round = 0;
            selectedAnswer = "";
            typedNumber = "";
            paused = false;
            states =
                questions.map(() => ({
                    selected: "",
                    number: "",
                    done: false
                }));
            closePopup();
            loadQuestion();
        }
        window.addEventListener(
            "load",
            loadQuestion
        );
    </script>
</body>

</html>
