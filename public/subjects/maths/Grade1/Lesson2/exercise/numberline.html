<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Number Challenge</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Livvic',sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    /* background:#fbf8ef; */
    color:#435266;
}

/* =========================
   MAIN GAME
========================= */

.game{
    width:100%;
    height:100dvh;

    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;

    padding:
        clamp(10px,1.5vh,22px)
        clamp(15px,3vw,50px);

    gap:clamp(10px,2vh,22px);

    overflow:hidden;

    background:
        radial-gradient(circle at 8% 15%,rgba(255,224,185,.28),transparent 22%),
        radial-gradient(circle at 92% 82%,rgba(202,226,255,.32),transparent 24%),
        radial-gradient(circle at 50% 50%,rgba(255,255,255,.6),transparent 45%),
        #fbf8ef;
}
.instruction-heading{
    width:100%;
    text-align:center;
    color:#2f4f4f;
    font-size:22px;
    font-weight:400;
    line-height:1.3;
    padding:0 15px;
}

@media(min-width:1600px){
    .instruction-heading{
        font-size:25px;
    }
}
/* =========================
   NUMBER LINE
========================= */

.number-line-wrapper{
    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:clamp(6px,1vh,12px) 0;
     margin-top: -80px;
}

.number-line{
    width:min(92vw,1400px);

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:relative;

    padding:0 clamp(4px,1vw,14px);
   
}

.number-line::before{
    content:"";

    position:absolute;

    left:1.5%;
    right:1.5%;
    top:50%;

    height:3px;

    background:linear-gradient(
        90deg,
        #a29bfe,
        #74b9ff
    );

    transform:translateY(-50%);

    z-index:1;
}

.tick{
    width:clamp(26px,2.4vw,42px);
    height:clamp(26px,2.4vw,42px);

    border-radius:50%;

    background:#fffdf8;

    border:2px solid #8ab6d6;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(11px,1.1vw,17px);
    font-weight:600;

    color:#435266;

    position:relative;

    z-index:2;

    box-shadow:0 3px 8px rgba(80,100,130,.12);

    transition:.25s ease;
}

.tick.active{
    background:#fff3dd;
    border-color:#e67e22;
    color:#d35400;

    transform:scale(1.1);

    box-shadow:
        0 0 0 4px rgba(230,126,34,.12),
        0 5px 12px rgba(230,126,34,.18);
}

/* =========================
   MAIN STAGE
========================= */

.quiz-container{
    min-height:0;

    width:100%;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:clamp(15px,3vh,35px);

    overflow:hidden;
}

/* =========================
   QUESTION
========================= */

.question-title{
    max-width:min(90vw,1250px);

    text-align:center;

    color:#2f4f4f;

    font-weight:400;

    line-height:1.25;

    font-size:30px;

    padding:0 15px;
}

@media(min-width:1600px){

    .question-title{
        font-size:30px;
    }

}

/* =========================
   ROCKET STAGE
========================= */

.rocket-stage{
    width:min(90vw,700px);

    min-height:clamp(210px,34vh,320px);

    display:flex;

    justify-content:center;
    align-items:center;

    gap:clamp(18px,3vw,35px);

    position:relative;
}

/* Decorative background */

.rocket-stage::before{
    content:"";

    position:absolute;

    width:100%;
    height:100%;

    border-radius:45px;

    background:
        radial-gradient(circle at 15% 25%,rgba(255,214,153,.28),transparent 14%),
        radial-gradient(circle at 85% 75%,rgba(174,214,241,.32),transparent 15%);

    pointer-events:none;
}

/* =========================
   ROCKET NUMBER
========================= */

.rocket-module,
.rocket-input-wrapper{
    position:relative;

    z-index:2;
}

.rocket-module{
    width:clamp(110px,12vw,155px);
    height:clamp(165px,24vh,230px);

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #e9eef5 55%,
            #cfd8e5 100%
        );

    border-radius:
        60px 60px
        20px 20px;

    display:flex;

    justify-content:center;
    align-items:flex-end;

    padding-bottom:clamp(22px,3vh,35px);

    border:2px solid #d5dde7;

    box-shadow:
        0 8px 0 #aeb9c8,
        0 14px 25px rgba(60,75,95,.16);
}

.rocket-module::before{
    content:"";

    position:absolute;

    top:clamp(18px,3vh,28px);

    width:clamp(42px,5vw,58px);
    height:clamp(42px,5vw,58px);

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #6dd5ed,
            #3498db
        );

    border:4px solid #2876a3;

    box-shadow:
        inset 0 -5px 8px rgba(0,0,0,.15);
}

.num-display{
    font-size:30px;

   

    color:#2f4f4f;

    line-height:1;
}

/* =========================
   ANSWER ROCKET
========================= */

.rocket-input{
    width:clamp(110px,12vw,155px);
    height:clamp(165px,24vh,230px);

    border-radius:
        60px 60px
        20px 20px;

    border:2px dashed #e67e22;

    background:
        linear-gradient(
            180deg,
            #fffdf8,
            #fff4e6
        );

    outline:none;

    text-align:center;

    font-size:clamp(44px,5vw,70px);

    font-weight:400;

    color:#d35400;

    box-shadow:
        0 8px 0 rgba(211,84,0,.12),
        0 12px 25px rgba(211,84,0,.12);

    transition:.25s ease;

    appearance:textfield;
    font-size: 40px;
}

.rocket-input::-webkit-outer-spin-button,
.rocket-input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
}

.rocket-input:focus{
    border-color:#00b894;

    background:#ffffff;

    box-shadow:
        0 0 0 6px rgba(0,184,148,.12),
        0 12px 25px rgba(0,184,148,.16);
}

.rocket-input:disabled{
    cursor:not-allowed;

    opacity:.75;

    border-style:solid;

    border-color:#00b894;

    color:#008f72;

    background:#edfbf4;
}

/* =========================
   BETWEEN CONNECTOR
========================= */

.between-line{
    width:clamp(20px,3vw,45px);
    height:4px;

    border-radius:10px;

    background:#a29bfe;

    position:relative;

    z-index:2;
}

/* =========================
   NAVIGATION
   SAME STYLE AS TENS & ONES
========================= */

.navigation{
    width:min(100%,1100px);

    display:grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items:center;

    gap:20px;

    margin:auto;
}

 .nav{
    width:178px;
    height:45px;
    padding:0;
    border:none;
    border-radius:35px;
    background:#e67e22;
    color:white;
    font-size:20px;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 6px #d35400;
    transition:
        transform .1s ease,
        opacity .2s ease;
}

.nav:active:not(:disabled){
    transform:translateY(4px);

    box-shadow:0 2px #d35400;
}

.nav:disabled{
    background:#b2bec3;

    box-shadow:0 6px #7f8c8d;

    cursor:not-allowed;

    opacity:.9;
}

#prev{
    justify-self:start;
}

#next{
    justify-self:end;
}

.submit{
    width:178px;
    height:45px;
    padding:0;
    background:#00b894;
    box-shadow:0 6px #008f72;
    font-size:20px;
    font-weight:500;
}

.submit:active:not(:disabled){
    box-shadow:0 2px #008f72;
}

/* EXACT POPUP STYLE USED BY TENS & ONES / HEAVY & LIGHT */
.popup-bg {
    position: fixed;
    inset: 0;
   
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
    z-index: 1000;
}

.popup-bg.show {
    opacity: 1;
    pointer-events: auto;
}

.popup-bg.show .popup {
    transform: scale(1);
}

.popup {
    position: relative;
    width: 90%;
    max-width: 520px;
    padding: 40px 30px;
    border-radius: 36px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,.1);
    transform: scale(.8);
    transition: transform .35s cubic-bezier(.175,.885,.32,1.275);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
}

.popup::before,
.popup::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
}

.popup::before {
    width: 220px;
    height: 220px;
    top: -60px;
    right: -50px;
}

.popup::after {
    width: 180px;
    height: 180px;
    bottom: -70px;
    left: -40px;
}

.popup.correct {
    background: #edfbf4;
    border: 6px solid #00c885;
}

.popup.correct::before,
.popup.correct::after {
    background: rgba(162,245,209,.45);
}

.popup.correct h2 { color: #00a86b; }
.popup.correct p { color: #2e7d5b; }

.popup.wrong {
    background: #fff0f2;
    border: 6px solid #ff6b7a;
}

.popup.wrong::before,
.popup.wrong::after {
    background: rgba(255,196,203,.45);
}

.popup.wrong h2 { color: #d33847; }
.popup.wrong p { color: #a33b45; }

.popup.final {
    background: #f0f3ff;
    border: 6px solid #6c5ce7;
        width: 520px;
    max-width: 90vw;
    height: 300px;
    padding: 40px 30px;
    box-sizing: border-box;
    border-radius: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.popup.final::before,
.popup.final::after {
    background: rgba(162,155,254,.35);
}

.popup.final h2 { color: #6c5ce7; }
.popup.final p { color: #4834d4; }

.popup-icon {
    position: relative;
    z-index: 5;
    font-size: 72px;
    line-height: 1;
    margin-bottom: 14px;
}

.popup h2 {
    position: relative;
    z-index: 5;
    margin: 0;
    font-size: 3rem;
    font-weight: 600;
}

.popup p {
    position: relative;
    z-index: 5;
    font-size: 1.4rem;
    font-weight: 500;
}

.play {
    position: relative;
    z-index: 5;
    border: none;
    border-radius: 45px;
    padding: 10px 35px;
    margin-top: 20px;
    background: #0984e3;
    color: white;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 0 #0975c7;
    display: none;
}

.play:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #0975c7;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .game{
        padding:10px;
        gap:8px;
    }

    .number-line{
        width:100%;
    }

    .tick{
        width:18px;
        height:18px;

        font-size:7px;
    }

    .rocket-stage{
        min-height:190px;

        gap:12px;
    }

    .rocket-module,
    .rocket-input{
        width:90px;
        height:140px;
    }

    .question-title{
        font-size:22px;
    }

    .navigation{
        gap:8px;
    }
    .nav,
    .submit{
        width:178px;
        height:45px;
        padding:0;
        font-size:20px;
        font-weight:500;
    }

}



/* EXACT SAME CONFETTI EFFECT */
#confettiContainer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 90;
}

.confetti-piece {
    position: absolute;
    width: 9px;
    height: 14px;
    border-radius: 2px;
    opacity: 0;
    animation: pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
    will-change: transform, opacity;
}

.final-confetti-piece {
    width: 10px;
    height: 16px;
    animation-duration: 2300ms;
}

.final-confetti-piece:nth-child(3n) {
    border-radius: 50%;
}

.final-confetti-piece:nth-child(4n) {
    width: 7px;
    height: 19px;
    border-radius: 1px;
}

.final-confetti-piece:nth-child(5n) {
    width: 13px;
    height: 8px;
    border-radius: 2px;
}

@keyframes pageConfetti {
    0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
    }
    55% {
        opacity: 1;
    }
    100% {
        opacity: 0;
        transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(0.72);
    }
}

.final-confetti-piece::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: inherit;
}

.popup.final.complete {
    box-shadow:
        0 20px 45px rgba(108, 92, 231, 0.18),
        0 0 0 8px rgba(162, 155, 254, 0.12);
}

.popup.final.complete .play {
    margin-top: 20px;
}

.popup.final.complete .popup-icon {
    animation: finalTrophyBounce 1.2s ease-in-out infinite;
}

@keyframes finalTrophyBounce {
    0%, 100% {
        transform: translateY(0) rotate(0deg) scale(1);
    }
    50% {
        transform: translateY(-5px) rotate(-4deg) scale(1.06);
    }
}


/* =========================
   LARGE MONITOR / FULL-PAGE RESPONSIVE
   ========================= */
.popup.final h2{
    font-size:48px;
}

.popup.final p{
    font-size:22px;
}

@media (min-width: 2000px) {

    }

.popup-bg.show .popup.final{

}
</style>
</head>

<div id="confettiContainer"></div>

<div class="game">
 <div class="instruction-heading">

    </div>

<script>

/* EXACT SAME CORRECT / WRONG BACKGROUND SOUND AS BIG AND SMALL */
const audioCtx =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

function playAudioTone(isCorrect) {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (isCorrect) {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    }

    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}



/* EXACT SAME CONFETTI EFFECT */
function showSmallConfetti(isFinal = false) {
    const confettiContainer = document.getElementById('confettiContainer');
    if (!confettiContainer) return;

    confettiContainer.innerHTML = '';

    const count = isFinal ? 95 : 42;

    const colors = [
        '#00b894',
        '#e67e22',
        '#6c5ce7',
        '#0984e3',
        '#fdcb6e',
        '#ff6b7a',
        '#00cec9',
        '#a29bfe'
    ];

    for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');

        piece.className =
            isFinal
                ? 'confetti-piece final-confetti-piece'
                : 'confetti-piece';

        const startX = Math.random() * 100;
        const startY = -8 + Math.random() * 10;

        const drift =
            (Math.random() * 520 - 260) *
            (isFinal ? 1.15 : 0.9);

        const fall =
            window.innerHeight *
            (0.82 + Math.random() * 0.48);

        const rotation =
            Math.random() * 1400 - 700;

        piece.style.left = startX + '%';
        piece.style.top = startY + '%';

        piece.style.setProperty('--x', drift + 'px');
        piece.style.setProperty('--y', fall + 'px');
        piece.style.setProperty('--r', rotation + 'deg');

        piece.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        piece.style.animationDelay =
            (Math.random() * (isFinal ? 500 : 220)) + 'ms';

        confettiContainer.appendChild(piece);

        setTimeout(
            () => piece.remove(),
            isFinal ? 2900 : 2050
        );
    }
}


/* =========================
   QUESTIONS
========================= */

const questions = [

    {
        type:"before",
        given:[15],
        answer:14,
        text:"Write the number that comes before fifteen."
    },

    {
        type:"before",
        given:[18],
        answer:17,
        text:"Write the number that comes before eighteen."
    },

    {
        type:"after",
        given:[14],
        answer:15,
        text:"Write the number that comes after fourteen."
    },

    {
        type:"after",
        given:[19],
        answer:20,
        text:"Write the number that comes after nineteen."
    },

    {
        type:"between",
        given:[16,18],
        answer:17,
        text:"Write the number that comes in between sixteen and eighteen."
    },

    {
        type:"between",
        given:[11,13],
        answer:12,
        text:"Write the number that comes in between eleven and thirteen."
    }

];


/* =========================
   GAME STATE
========================= */

let round = 0;

let paused = false;

let timer = null;


/* Store answers */

let states = questions.map(() => ({

    answer:"",

    done:false

}));


/* =========================
   VOICE
   ONLY CORRECT / WRONG
========================= */

function speak(text){

    speechSynthesis.cancel();

    const msg =
        new SpeechSynthesisUtterance(text);

    msg.lang = "en-US";

    msg.volume = 0.25;

    msg.rate = 1;

    msg.pitch = 1;

    speechSynthesis.speak(msg);

}


/* =========================
   CREATE NUMBER LINE
========================= */

function initNumberLine(){

    const line =
        document.getElementById("numberLine");

    line.innerHTML = "";

    for(let i = 0; i <= 20; i++){

        const tick =
            document.createElement("div");

        tick.className = "tick";

        tick.textContent = i;

        line.appendChild(tick);

    }

}


function updateNumberLine(){

    const ticks =
        document.querySelectorAll(".tick");

    ticks.forEach(tick => {

        tick.classList.remove("active");

    });


    const q =
        questions[round];


    q.given.forEach(number => {

        if(ticks[number]){

            ticks[number]
                .classList
                .add("active");

        }

    });

}


/* =========================
   LOAD QUESTION
========================= */

function loadQuestion(){

    paused = false;

    const q =
        questions[round];

    const state =
        states[round];


    document
        .getElementById("questionText")
        .textContent =
        q.text;


    updateNumberLine();


    const stage =
        document.getElementById("stage");

    stage.innerHTML = "";


    const input =
        document.createElement("input");

    input.type = "number";

    input.id = "answerInput";

    input.className =
        "rocket-input";

    input.autocomplete = "off";

    input.value =
        state.answer;


    input.addEventListener(
        "input",
        function(){

            if(!states[round].done){

                states[round].answer =
                    input.value;

            }

        }
    );


    if(state.done){

        input.disabled = true;

    }


    const createRocket =
        function(number){

            const rocket =
                document.createElement("div");

            rocket.className =
                "rocket-module";


            const display =
                document.createElement("div");

            display.className =
                "num-display";

            display.textContent =
                number;


            rocket.appendChild(display);

            return rocket;

        };


    if(q.type === "before"){

        stage.appendChild(input);

        stage.appendChild(
            createRocket(q.given[0])
        );

    }


    if(q.type === "after"){

        stage.appendChild(
            createRocket(q.given[0])
        );

        stage.appendChild(input);

    }


    if(q.type === "between"){

        stage.appendChild(
            createRocket(q.given[0])
        );


        const line1 =
            document.createElement("div");

        line1.className =
            "between-line";

        stage.appendChild(line1);


        stage.appendChild(input);


        const line2 =
            document.createElement("div");

        line2.className =
            "between-line";

        stage.appendChild(line2);


        stage.appendChild(
            createRocket(q.given[1])
        );

    }


    updateControls();


    if(!state.done){

        setTimeout(() => {

            input.focus();

        },100);

    }

}


/* =========================
   BUTTON CONTROL
========================= */

function updateControls(){

    const state =
        states[round];


    document
        .getElementById("prev")
        .disabled =
        round === 0;


    document
        .getElementById("next")
        .disabled =
        round === questions.length - 1
        ||
        !state.done;


    document
        .getElementById("submit")
        .disabled =
        state.done;

}


/* =========================
   SUBMIT ANSWER
========================= */

function submitAnswer(){

    if(paused) return;


    const state =
        states[round];


    if(state.done) return;


    const input =
        document.getElementById(
            "answerInput"
        );


    const value =
        input.value;


    if(value === "") return;


    const q =
        questions[round];


    if(parseInt(value) === q.answer){


        paused = true;


        state.answer =
            value;


        state.done =
            true;


        input.disabled =
            true;


        speak("Correct");
        playAudioTone(true);
        showSmallConfetti(false);


        updateControls();


        if(
            round ===
            questions.length - 1
        ){

            showPopup(

                "correct",

                "🌟",

                "Amazing!",

                "You got it right!",

                false

            );

            setTimeout(() => {

                showSmallConfetti(true);

                showPopup(

                    "final",

                    "🏆",

                    "Congratulations!",

                    "Great job! You completed it! 🎉",

                    true

                );

            }, 1800);

        }

        else{

            showPopup(

                "correct",

                "🌟",

                "Amazing!",

                "You got it right!",

                false

            );


            paused = false;

        }

    }

    else{


        paused = true;


        speak("Wrong");
        playAudioTone(false);


        input.style.transform =
            "translateX(-8px)";


        setTimeout(() => {

            input.style.transform =
                "";


            input.value =
                "";


            state.answer =
                "";


            showPopup(

                "wrong",

                "😟",

                "Keep Going!",

                "Try again, you can do it!",

                false

            );


            paused = false;


            input.focus();

        },250);

    }

}


/* =========================
   NAVIGATION
========================= */

function move(direction){

    const next =
        round + direction;


    if(
        next < 0
        ||
        next >= questions.length
    ){
        return;
    }


    if(
        direction === 1
        &&
        !states[round].done
    ){
        return;
    }


    round = next;


    loadQuestion();

}


/* =========================
   POPUP
========================= */

function showPopup(
    type,
    icon,
    title,
    text,
    final
){

    clearTimeout(timer);


    const popup =
        document.getElementById("popup");


    popup.className =
        "popup " + type + (final ? " complete" : "");


    document
        .getElementById("popupIcon")
        .textContent =
        icon;


    document
        .getElementById("popupTitle")
        .textContent =
        title;


    document
        .getElementById("popupText")
        .textContent =
        text;


    document
        .getElementById("playAgain")
        .style.display =
        final
            ?
            "inline-block"
            :
            "none";


    document
        .getElementById("popupBg")
        .classList
        .add("show");


    if(!final){

        timer =
            setTimeout(
                closePopup,
                1600
            );

    }

}


function closePopup(){

    document
        .getElementById("popupBg")
        .classList
        .remove("show");

}


/* =========================
   RESTART
========================= */

function restart(){

    clearTimeout(timer);

    const confettiContainer = document.getElementById("confettiContainer");
    if (confettiContainer) confettiContainer.innerHTML = "";


    round = 0;

    paused = false;


    states =
        questions.map(() => ({

            answer:"",

            done:false

        }));


    closePopup();


    loadQuestion();

}


/* =========================
   KEYBOARD ENTER
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
            &&
            !states[round].done
        ){

            submitAnswer();

        }

    }
);


/* =========================
   START
========================= */

window.addEventListener(
    "load",
    function(){

        initNumberLine();

        loadQuestion();

    }
);

</script>
