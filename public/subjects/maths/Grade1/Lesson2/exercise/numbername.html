<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tens and Ones Word Match</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Livvic',sans-serif;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:transparent;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    color:#435266;
    
}


/* MAIN */

.game-environment{
    width:100vw;
    height:100vh;

    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;

    position:relative;
    overflow:hidden;

    background:transparent;
    
}


/* QUESTION AREA */

.question-area{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;

    padding:5px 20px 10px;
    z-index:5;
}


.question-box{
    width:min(760px,92vw);
    min-height:115px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(20px,3vw,42px);

    padding:18px 38px;

    background:linear-gradient(
        180deg,
        rgba(255,255,255,.96) 0%,
        rgba(248,244,235,.96) 100%
    );

    border:3px solid #d9c9aa;
    border-radius:32px;

    box-shadow:
        0 8px 0 #cbbd9f,
        0 16px 30px rgba(90,75,50,.10);

    backdrop-filter:blur(8px);
}


.place-box{
    min-width:clamp(135px,15vw,180px);
    height:120px;

    display:flex;
    flex-direction:column;
    align-items:center;

    overflow:hidden;

    background:#fffdf8;

    border:3px solid #eadcc5;
    border-radius:20px;

    box-shadow:
        0 6px 0 #d4c5aa,
        0 10px 20px rgba(90,75,50,.08);
}

.place-title{
    width:100%;
    padding:9px 12px;
    text-align:center;

    background:linear-gradient(180deg,#f7e7c9,#efd8ae);

    color:#6c5942;
    font-size:clamp(18px,2vw,24px);
    
}

.place-value{
    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:4px 12px;

    font-size:clamp(42px,5vw,60px);
    font-weight:400;

    color:#e68a25;
}


.question-equals{
    font-size:clamp(26px,4vw,42px);
    font-weight:500;

    color:#786b58;
}


/* STAGE */

.stage-area{
    min-height:0;

    width:100%;

    position:relative;

    display:grid;

    grid-template-columns:
    minmax(180px,1fr)
    minmax(280px,430px)
    minmax(180px,1fr);

    align-items:center;

    padding:
    clamp(6px,1.5vh,18px)
    clamp(20px,5vw,80px);

    gap:clamp(25px,5vw,70px);
}


/* WORD AREAS */

.word-area{
    height:100%;

    display:grid;

    grid-template-columns:repeat(2,minmax(100px,1fr));

    grid-auto-rows:minmax(65px,90px);

    align-content:center;

    gap:clamp(14px,2vw,24px);
}


.word-bubble{
    position:relative;

    min-height:65px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:10px 18px;

    background:
    linear-gradient(
        180deg,
        #ffffff 0%,
        #f7f4ec 100%
    );

    border:3px solid #d7c7ad;

    border-radius:24px;

    color:#4d5b6b;

    font-size:clamp(18px,2vw,25px);
    font-weight:400;

    cursor:grab;

    box-shadow:
    0 7px 0 #c5b69e,
    0 10px 20px rgba(90,75,50,.10);

    transition:
    transform .15s ease,
    opacity .2s ease;

    touch-action:none;
}


.word-bubble:hover{
    transform:translateY(-3px);
}


.word-bubble.dragging{
    opacity:.75;
    transform:scale(1.06);
    cursor:grabbing;
    z-index:20;
}


.word-bubble.locked-word{
    cursor:default;
    pointer-events:none;
    opacity:.6;
}


/* CENTER BUCKET */

.bucket-zone{
    width:100%;

    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:clamp(22px,3vh,34px);
    margin-top: 20px;
}


.bucket-instruction{
    font-size:22px;
    font-weight:400;

    text-align:center;
    color:#2f4f4f;
    line-height:1.2;
    margin:0;
}


.bucket{
    width:min(100%,250px);

    min-height:clamp(170px,25vh,240px);
    margin-bottom: 20px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:38px 22px 24px;

    margin-top:18px;

    background:
    linear-gradient(
        180deg,
        #cfe8f2 0%,
        #9ecfe2 100%
    );

    border:
    clamp(7px,1vw,11px)
    solid
    #6faec8;

    border-radius:
    28px
    28px
    70px
    70px;

    box-shadow:
    inset 0 12px 0 rgba(255,255,255,.35),
    inset 0 -14px 0 rgba(55,125,155,.12),
    0 14px 0 #5798b5,
    0 22px 30px rgba(60,110,135,.16);

    transition:
    transform .2s ease,
    border-color .2s ease;
}


/* BUCKET TOP */

.bucket::before{
    content:'';

    position:absolute;

    top:-25px;

    width:90%;
    height:48px;

    background:
    radial-gradient(
        ellipse,
        #eaf7fb 0%,
        #c2e2ed 58%,
        #83bdd4 100%
    );

    border:6px solid #6faec8;

    border-radius:50%;

    box-shadow:
    inset 0 8px 12px rgba(70,130,155,.15);
}


/* BUCKET HANDLE */

.bucket::after{
    content:'';

    position:absolute;

    width:65%;
    height:72px;

    top:-58px;

    border:
    7px solid
    #82bbd1;

    border-bottom:none;

    border-radius:
    90px
    90px
    0
    0;

    z-index:-1;
}


.bucket.drag-over{
    transform:scale(1.03);

    border-color:#e68a25;
}


.bucket-content{
    position:relative;
    z-index:3;

    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:#426170;

    font-size:clamp(18px,1.6vw,25px);
    font-weight:500;
}


.bucket-placeholder{
    opacity:.8;

    line-height:1.4;
}


/* SELECTED ANSWER */

.selected-answer{
    width:100%;

    padding:18px 14px;

    background:#fffdf8;

    border:3px solid #ffffff;

    border-radius:20px;

    color:#435266;

    font-size:clamp(22px,2.8vw,34px);
    font-weight:400;

    box-shadow:
    0 6px 14px rgba(60,100,120,.15);
}


/* LOCK STATE */

.lock-note{
    display:none;

    padding:7px 16px;

    background:#eff8f2;

    border:2px solid #9bd4af;

    border-radius:30px;

    color:#34835a;

    font-size:15px;
    font-weight:400;
}


.question-locked .lock-note{
    display:block;
}


.question-locked .bucket{
    border-color:#76bf92;

    box-shadow:
    inset 0 12px 0 rgba(255,255,255,.35),
    inset 0 -14px 0 rgba(55,125,155,.10),
    0 14px 0 #5ca87b,
    0 22px 30px rgba(60,110,135,.14);
}


/* SHAKE */

.shake-error{
    animation:errorShake .4s cubic-bezier(.36,.07,.19,.97) both;
}


@keyframes errorShake{

    10%,
    90%{
        transform:translateX(-8px);
    }

    20%,
    80%{
        transform:translateX(8px);
    }

    30%,
    50%,
    70%{
        transform:translateX(-14px);
    }

    40%,
    60%{
        transform:translateX(14px);
    }

}


/* NAVIGATION */

.navigation{
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:
    12px
    clamp(25px,4vw,70px)
    clamp(18px,3vh,28px);

    z-index:30;
}


.nav-btn{
    background:#e67e22;

    color:#ffffff;

    border:none;

    width:178px;
    height:45px;

    padding:0;

    font-size:20px;
    font-weight:500;

    border-radius:40px;

    cursor:pointer;

    box-shadow:0 6px 0 #d35400;

    transition:all .1s ease;
      transform:translateY(10px);
   
}


.nav-btn:active:not(:disabled){
    transform:translateY(4px);

    box-shadow:0 2px 0 #d35400;
}


.nav-btn:disabled{
    background:#b2bec3;

    box-shadow:0 6px 0 #636e72;

    cursor:not-allowed;

    opacity:.7;
}


.submit-btn{
    background:#00b894;
    box-shadow:0 6px #008f72;
}

.submit-btn:active:not(:disabled){
    box-shadow:0 2px #008f72;
}

/* HEAVY & LIGHT POPUP STYLE */

.popup-overlay{
    position:fixed;

    inset:0;

   
    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;

    pointer-events:none;

    transition:opacity .3s ease;

    z-index:100;
}


.popup-overlay.active{
    opacity:1;

    pointer-events:auto;
}


.popup-card{
    position:relative;

    width:90%;
    max-width:520px;

    padding:40px 30px;

    border-radius:36px;

    text-align:center;

    box-shadow:
    0 20px 40px rgba(0,0,0,.1);

    transform:scale(.8);

    transition:
    transform .35s
    cubic-bezier(.175,.885,.32,1.275);

    overflow:hidden;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}


.popup-card::before,
.popup-card::after{
    content:'';

    position:absolute;

    border-radius:50%;

    pointer-events:none;
}


.popup-card::before{
    width:220px;
    height:220px;

    top:-60px;
    right:-50px;
}


.popup-card::after{
    width:180px;
    height:180px;

    bottom:-70px;
    left:-40px;
}


/* CORRECT */

.popup-card.correct{
    background:#edfbf4;

    border:6px solid #00c885;
}


.popup-card.correct::before,
.popup-card.correct::after{
    background:rgba(162,245,209,.45);
}


.popup-card.correct .popup-title{
    color:#00a86b;
}


.popup-card.correct .popup-subtitle{
    color:#2e7d5b;
}


/* WRONG */

.popup-card.wrong{
    background:#fff0f2;

    border:6px solid #ff6b7a;
}


.popup-card.wrong::before,
.popup-card.wrong::after{
    background:rgba(255,196,203,.45);
}


.popup-card.wrong .popup-title{
    color:#d33847;
}


.popup-card.wrong .popup-subtitle{
    color:#a33b45;
}


/* FINAL */

.popup-card.complete{
    background:#f0f3ff;

    border:6px solid #6c5ce7;
}
.popup-card.complete {
    width: 520px;
    max-width: 90vw;
    height: 300px;
    padding: 40px 30px;
    box-sizing: border-box;
    border-radius: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.popup-card.complete::before,
.popup-card.complete::after{
    background:rgba(162,155,254,.35);
}


.popup-card.complete .popup-title{
    color:#6c5ce7;
}


.popup-card.complete .popup-subtitle{
    color:#4834d4;
}


.popup-overlay.active .popup-card{
    transform:scale(1);
}


.popup-icon{
    font-size:4.8rem;

    margin-bottom:12px;

    z-index:2;

    line-height:1;

    filter:
    drop-shadow(
        0 6px 10px
        rgba(0,0,0,.1)
    );
}


.popup-title{
    font-size:3rem;

    font-weight:600;

    margin-bottom:8px;

    z-index:2;

    letter-spacing:-.5px;
}


.popup-subtitle{
    font-size:1.4rem;

    font-weight:500;

    z-index:2;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    text-align:center;

    line-height:1.4;
}


.replay-btn{
    background:#0984e3;

    color:#fff;

    border:none;

    border-radius:40px;
    padding: 10px 35px;
    font-size: 20px;
    font-weight: 500;

    cursor:pointer;

    box-shadow:0 6px 0 #0975c7;

    margin-top:20px;

    z-index:5;
}


.replay-btn:active{
    transform:translateY(4px);

    box-shadow:0 2px 0 #0975c7;
}



/* REQUESTED QUIZ TYPOGRAPHY */
.question-box{
    color:#2f4f4f;
}

@media screen and (min-width:1600px){
    .question-box{
        font-size:30px;
        font-weight:600;
        color:#2f4f4f;
    }

    .bucket-instruction{
        font-size:25px;
    }
}

/* RESPONSIVE */

@media(max-width:850px){

    body{
        overflow:auto;
    }

    .game-environment{
        height:auto;
        min-height:100vh;

        grid-template-rows:auto auto auto;
    }

    .question-box{
        gap:8px;
    }

    .stage-area{
        grid-template-columns:1fr;

        padding:30px 25px;

        gap:35px;
    }

    .word-area{
        grid-template-columns:repeat(2,1fr);
    }

    .word-area.right{
        order:3;
    }

    .bucket-zone{
        order:2;
    }

    .bucket{
        width:min(100%,250px);
        min-height:190px;
    }

    .navigation{
        padding:20px;
    }

}


@media(max-width:500px){

    .question-box{
        padding:14px 10px;
    }

    .place-box{
        min-width:100px;
    }

    .nav-btn{
        width:178px;
        height:45px;
        padding:0;
        font-size:20px;
        font-weight:500;
    }

    .popup-title{
        font-size:2.3rem;
    }

}


/* EXACT SAME CONFETTI */
#confettiContainer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:200;
}

.confetti-piece{
    position:absolute;
    width:9px;
    height:14px;
    border-radius:2px;
    opacity:0;
    animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
    will-change:transform,opacity;
}

.final-confetti-piece{
    width:10px;
    height:16px;
    animation-duration:2300ms;
}

.final-confetti-piece:nth-child(3n){
    border-radius:50%;
}

.final-confetti-piece:nth-child(4n){
    width:7px;
    height:19px;
    border-radius:1px;
}

.final-confetti-piece:nth-child(5n){
    width:13px;
    height:8px;
    border-radius:2px;
}

@keyframes pageConfetti{
    0%{
        opacity:1;
        transform:translate3d(0,0,0) rotate(0deg) scale(1);
    }
    55%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72);
    }
}

.popup-card.complete{
    box-shadow:
        0 20px 45px rgba(108,92,231,.18),
        0 0 0 8px rgba(162,155,254,.12);
}

.popup-card.complete .popup-icon{
    animation:finalTrophyBounce 1.2s ease-in-out infinite;
}

@keyframes finalTrophyBounce{
    0%,100%{
        transform:translateY(0) rotate(0deg) scale(1);
    }
    50%{
        transform:translateY(-5px) rotate(-4deg) scale(1.06);
    }
}

</style>

<body>

<script>


/* EXACT CORRECT / WRONG BACKGROUND SOUND */
const audioCtx =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

function playAudioTone(isCorrect) {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (isCorrect) {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    }

    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

function showSmallConfetti(isFinal=false){
    const confettiContainer=document.getElementById('confettiContainer');
    if(!confettiContainer)return;

    confettiContainer.innerHTML='';

    const count=isFinal?95:42;

    const colors=[
        '#00b894',
        '#e67e22',
        '#6c5ce7',
        '#0984e3',
        '#fdcb6e',
        '#ff6b7a',
        '#00cec9',
        '#a29bfe'
    ];

    for(let i=0;i<count;i++){
        const piece=document.createElement('span');

        piece.className=
            isFinal
                ? 'confetti-piece final-confetti-piece'
                : 'confetti-piece';

        const startX=Math.random()*100;
        const startY=-8+Math.random()*10;

        const drift=
            (Math.random()*520-260)*
            (isFinal?1.15:.9);

        const fall=
            window.innerHeight*
            (.82+Math.random()*.48);

        const rotation=
            Math.random()*1400-700;

        piece.style.left=startX+'%';
        piece.style.top=startY+'%';

        piece.style.setProperty('--x',drift+'px');
        piece.style.setProperty('--y',fall+'px');
        piece.style.setProperty('--r',rotation+'deg');

        piece.style.background=
            colors[Math.floor(Math.random()*colors.length)];

        piece.style.animationDelay=
            (Math.random()*(isFinal?500:220))+'ms';

        confettiContainer.appendChild(piece);

        setTimeout(
            ()=>piece.remove(),
            isFinal?2900:2050
        );
    }
}



/* QUIZ DATA */

const quizData=[

    {
        tens:1,
        ones:5,
        target:"fifteen",

        options:[
            "fifteen",
            "fifty",
            "five",
            "fifty-five"
        ]
    },

    {
        tens:1,
        ones:8,
        target:"eighteen",

        options:[
            "eighteen",
            "eighty",
            "eight",
            "eighty-one"
        ]
    },

    {
        tens:1,
        ones:1,
        target:"eleven",

        options:[
            "eleven",
            "one",
            "eleventy",
            "ten"
        ]
    },

    {
        tens:2,
        ones:0,
        target:"twenty",

        options:[
            "twenty",
            "two",
            "twelve",
            "zero"
        ]
    }

];


let currentRound=0;

let isPaused=false;

let popupTimer=null;

let finalTimer=null;


/* STORE ANSWERS */

let answers=quizData.map(()=>({

    selected:null,

    correct:false

}));


/* SPEAK */

function speak(t){

    speechSynthesis.cancel();

    const msg=
    new SpeechSynthesisUtterance(t);

    msg.lang="en-US";

    msg.volume=0.25;

    msg.rate=1;

    msg.pitch=1;

    speechSynthesis.speak(msg);

}


/* TITLE CASE */

function titleCase(text){

    return text
        .toLowerCase()
        .split(/\\s+/)
        .map(word =>
            word.charAt(0).toUpperCase() + word.slice(1)
        )
        .join(" ");

}


/* SHUFFLE */

function shuffle(items){

    const array=[...items];

    for(
        let i=array.length-1;
        i>0;
        i--
    ){

        const j=
        Math.floor(
            Math.random()*(i+1)
        );

        [
            array[i],
            array[j]

        ]

        =

        [
            array[j],
            array[i]
        ];

    }

    return array;

}


/* LOAD ROUND */

function loadRound(){

    isPaused=false;

    const item=
    quizData[currentRound];

    const answer=
    answers[currentRound];


    document
    .getElementById("val-tens")
    .textContent=item.tens;


    document
    .getElementById("val-ones")
    .textContent=item.ones;


    const environment=
    document.getElementById(
        "environment"
    );


    environment.classList.toggle(
        "question-locked",
        answer.correct
    );


    renderBucket();


    if(answer.correct){

        clearWords();

    }

    else{

        renderWords(
            shuffle(item.options)
        );

    }


    updateNavigation();

}


/* CLEAR WORDS */

function clearWords(){

    document
    .getElementById("leftWords")
    .innerHTML="";


    document
    .getElementById("rightWords")
    .innerHTML="";

}


/* RENDER WORDS */

function renderWords(options){

    clearWords();


    const left=
    document.getElementById(
        "leftWords"
    );


    const right=
    document.getElementById(
        "rightWords"
    );


    options.forEach(

        (word,index)=>{

            const bubble=
            document.createElement("button");


            bubble.type="button";


            bubble.className=
            "word-bubble";


            bubble.textContent=
            titleCase(word);


            bubble.dataset.word=
            word;


            attachWordEvents(
                bubble,
                word
            );


            if(index<2){

                left.appendChild(
                    bubble
                );

            }

            else{

                right.appendChild(
                    bubble
                );

            }

        }

    );

}


/* RENDER BUCKET */

function renderBucket(){

    const content=
    document.getElementById(
        "bucketContent"
    );


    const answer=
    answers[currentRound];


    if(answer.selected){

        content.innerHTML=
        `

        <div class="selected-answer">

            ${titleCase(answer.selected)}

        </div>

        `;

    }

    else{

        content.innerHTML=
        `

        <div class="bucket-placeholder">

            Drop the matching<br>
            number word here

        </div>

        `;

    }

}


/* WORD EVENTS */

function attachWordEvents(
    element,
    word
){

    let startX=0;

    let startY=0;

    let moved=false;


    element.addEventListener(

        "pointerdown",

        event=>{

            if(
                isPaused ||

                answers[currentRound]
                .correct
            ){

                return;

            }


            element.setPointerCapture(
                event.pointerId
            );


            startX=
            event.clientX;


            startY=
            event.clientY;


            moved=false;


            element.classList.add(
                "dragging"
            );

        }

    );


    element.addEventListener(

        "pointermove",

        event=>{

            if(
                !element.classList
                .contains("dragging")
            ){

                return;

            }


            const dx=
            Math.abs(
                event.clientX-startX
            );


            const dy=
            Math.abs(
                event.clientY-startY
            );


            if(dx>6 || dy>6){

                moved=true;

            }


            const bucket=
            document
            .getElementById("bucket");


            const rect=
            bucket
            .getBoundingClientRect();


            const inside=

                event.clientX>=rect.left

                &&

                event.clientX<=rect.right

                &&

                event.clientY>=rect.top

                &&

                event.clientY<=rect.bottom;


            bucket.classList.toggle(
                "drag-over",
                inside
            );

        }

    );


    element.addEventListener(

        "pointerup",

        event=>{

            if(
                !element.classList
                .contains("dragging")
            ){

                return;

            }


            element.classList.remove(
                "dragging"
            );


            const bucket=
            document
            .getElementById("bucket");


            bucket.classList.remove(
                "drag-over"
            );


            const rect=
            bucket
            .getBoundingClientRect();


            const inside=

                event.clientX>=rect.left

                &&

                event.clientX<=rect.right

                &&

                event.clientY>=rect.top

                &&

                event.clientY<=rect.bottom;


            if(inside){

                chooseWord(word);

            }

            else if(!moved){

                chooseWord(word);

            }

        }

    );

}


/* CHOOSE WORD */

function chooseWord(word){

    if(
        isPaused ||

        answers[currentRound].correct
    ){

        return;

    }


    answers[currentRound]
    .selected=word;


    renderBucket();
    updateNavigation();




}


/* EVALUATE */

function evaluateAnswer(){

    if(isPaused)return;


    const item=
    quizData[currentRound];


    const answer=
    answers[currentRound];


    isPaused=true;


    if(
        answer.selected===
        item.target
    ){

        answer.correct=true;


        speak("Correct");
        playAudioTone(true);
        showSmallConfetti(false);


        clearWords();


        renderBucket();


        document
        .getElementById("environment")
        .classList.add(
            "question-locked"
        );


        updateNavigation();


        showPopup(

            "correct",

            "🌟",

            "Amazing!",

            `${titleCase(item.target)} Is Correct!`

        );


        /* LAST QUESTION */

        if(
            currentRound===
            quizData.length-1
        ){

            clearTimeout(finalTimer);

            // Show the normal Correct popup and small confetti first.
            showSmallConfetti(false);

            showPopup(
                "correct",
                "🌟",
                "Amazing!",
                `${titleCase(item.target)} Is Correct!`,
                false
            );

            // Then show the final popup with large confetti.
            finalTimer=setTimeout(()=>{

                closePopup();

                showSmallConfetti(true);

                showPopup(
                    "complete",
                    "🏆",
                    "Congratulations!",
                    "Great job! You completed it! 🎉",
                    true
                );

             
            },1800);

        }

        else{

            setTimeout(

                ()=>{

                    isPaused=false;

                },

                300

            );

        }

    }


    else{

        speak("Wrong");
        playAudioTone(false);


        const bucket=
        document.getElementById(
            "bucket"
        );


        bucket.classList.add(
            "shake-error"
        );


        setTimeout(

            ()=>{

                bucket.classList.remove(
                    "shake-error"
                );


                showPopup(

                    "wrong",

                    "😟",

                    "Keep Going!",

                    "That Word Does Not Match. Try Again!"

                );


                answers[currentRound]
                .selected=null;


                renderBucket();
                updateNavigation();


            },

            350

        );

    }

}


/* POPUP */

function showPopup(

    status,

    icon,

    title,

    subtitle,

    isFinal=false

){

    const popup=
    document.getElementById(
        "popup"
    );


    const card=
    document.getElementById(
        "popupCard"
    );


    const playAgainBtn=
    document.getElementById(
        "playAgainBtn"
    );


    card.className=
    `popup-card ${status}${isFinal?" complete":""}`;


    document
    .getElementById("popupIcon")
    .textContent=icon;


    document
    .getElementById("popupTitle")
    .textContent=title;


    document
    .getElementById("popupSubtitle")
    .textContent=subtitle;


    playAgainBtn.style.display=

        isFinal

        ?

        "inline-block"

        :

        "none";


    popup.classList.add(
        "active"
    );


    if(!isFinal){

        clearTimeout(
            popupTimer
        );

        popupTimer=setTimeout(

            ()=>{

                closePopup();

            },

            1800

        );

    }

}


/* CLOSE POPUP */

function closePopup(){

    document
    .getElementById("popup")
    .classList.remove(
        "active"
    );


    if(
        currentRound<
        quizData.length-1
    ){

        isPaused=false;

    }

}


/* PREVIOUS */

function previousQuestion(){

    if(currentRound<=0)return;


    currentRound--;


    loadRound();

}


/* NEXT */

function nextQuestion(){

    if(
        !answers[currentRound]
        .correct
    ){

        return;

    }


    if(
        currentRound<
        quizData.length-1
    ){

        currentRound++;


        loadRound();

    }

}


/* NAVIGATION */

function updateNavigation(){

    const prevBtn=
    document.getElementById(
        "prevBtn"
    );


    const nextBtn=
    document.getElementById(
        "nextBtn"
    );

    const submitBtn=
    document.getElementById(
        "submitBtn"
    );


    prevBtn.disabled=
    currentRound===0;

    submitBtn.disabled=
        !answers[currentRound].selected ||
        answers[currentRound].correct;


    nextBtn.disabled=

        !answers[currentRound]
        .correct

        ||

        currentRound===
        quizData.length-1;

}


/* RESTART */

function restartGame(){

    clearTimeout(
        popupTimer
    );


    clearTimeout(
        finalTimer
    );


    currentRound=0;


    isPaused=false;


    answers=quizData.map(

        ()=>({

            selected:null,

            correct:false

        })

    );


    closePopup();

    const confettiContainer=document.getElementById("confettiContainer");
    if(confettiContainer)confettiContainer.innerHTML="";


    loadRound();

}


/* START */

window.addEventListener(

    "load",

    ()=>{

        loadRound();

    }

);

</script>
