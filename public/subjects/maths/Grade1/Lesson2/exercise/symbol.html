<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare Numbers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Livvic",sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
   
    color:#435266;
}


/* =========================
   GAME
========================= */

.game{
    width:100%;
    height:100dvh;

    display:grid;

    grid-template-rows:
        auto
        minmax(0,1fr)
        auto;

    gap:clamp(10px,2vh,22px);

    padding:
        clamp(12px,2vh,28px)
        clamp(18px,4vw,70px);

    overflow:hidden;

    background:
        radial-gradient(
            circle at 8% 18%,
            rgba(255,220,177,.32),
            transparent 18%
        ),

        radial-gradient(
            circle at 92% 78%,
            rgba(190,220,245,.30),
            transparent 20%
        ),

        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.65),
            transparent 42%
        ),

        #fbf8ef;
}


/* =========================
   HEADING
========================= */

.game-heading{
    width:100%;

    text-align:center;

    color:#2f4f4f;

    font-size:22px;

    font-weight:400;

    line-height:1.35;

    padding:0 15px;
}

@media(min-width:1600px){

    .game-heading{
        font-size:30px;
        font-weight:600;
        color:#2f4f4f;
    }

        .symbol-title{
        font-size:25px;
        font-weight:400;
        color:#2f4f4f;
    }

.nav,
    .submit{
        width:178px;
        height:45px;
        padding:0;
        font-size:20px;
        font-weight:500;
    }

}


/* =========================
   QUIZ AREA
========================= */

.quiz-container{
    width:100%;
    min-height:0;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}


/* =========================
   COMPARE WORLD
========================= */

.compare-world{
    width:min(100%,1350px);
    height:min(100%,600px);

    min-height:0;

    position:relative;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        auto
        minmax(0,1fr);

    align-items:center;

    gap:clamp(20px,4vw,70px);
}


/* =========================
   DECORATIVE PATH
========================= */

.compare-world::before{
    content:"";

    position:absolute;

    left:8%;
    right:8%;

    top:50%;

    height:5px;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            rgba(116,185,255,.25),
            rgba(162,155,254,.35),
            rgba(116,185,255,.25)
        );

    transform:translateY(-50%);

    z-index:0;
}


/* =========================
   SIDE AREA
========================= */

.side-zone{
    min-width:0;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:clamp(12px,2vh,24px);

    position:relative;

    z-index:2;
}


/* =========================
   LABEL
========================= */

.zone-label{
    color:#435266;

    font-size:clamp(18px,2vw,30px);

    font-weight:400;

    letter-spacing:.3px;

    text-align:center;
}


/* =========================
   IMAGE DISPLAY AREA
========================= */

.object-display{
    width:min(100%,420px);

    height:clamp(180px,35vh,330px);

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;
}


/* Soft background only */

.object-display::before{
    content:"";

    position:absolute;

    width:90%;
    height:82%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.9),
            rgba(255,255,255,.25),
            transparent 70%
        );

    pointer-events:none;
}


/* =========================
   USER IMAGE
========================= */

.compare-image{
    max-width:100%;
    max-height:100%;

    width:auto;
    height:auto;

    object-fit:contain;

    position:relative;

    z-index:2;

    filter:
        drop-shadow(
            0 12px 16px
            rgba(67,82,102,.16)
        );

    user-select:none;

    -webkit-user-drag:none;
}


/* =========================
   CENTER SYMBOL STATION
========================= */

.symbol-station{
    width:clamp(190px,22vw,290px);

    min-height:clamp(250px,42vh,390px);

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:clamp(16px,3vh,28px);

    position:relative;

    z-index:5;
}


/* =========================
   SYMBOL TITLE
========================= */

.symbol-title{
    color:#2f4f4f;

    font-size:20px;

    font-weight:400;

    text-align:center;
}


/* =========================
   SYMBOL ORBIT
========================= */

.symbol-orbit{
    width:clamp(150px,18vw,220px);
    height:clamp(150px,18vw,220px);

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 0%,
            rgba(247,244,237,.9) 58%,
            rgba(221,231,238,.6) 100%
        );

    border:
        2px solid
        rgba(138,182,214,.45);

    box-shadow:
        0 12px 28px
        rgba(70,90,115,.12);
}


/* =========================
   SELECTED SYMBOL
========================= */

.selected-symbol{
    width:clamp(70px,8vw,100px);
    height:clamp(70px,8vw,100px);

    border-radius:24px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#fffdf8;

    border:
        3px dashed
        #e67e22;

    color:#d35400;

    font-size:clamp(40px,5vw,68px);

    font-weight:300;

    box-shadow:
        0 8px 0
        rgba(211,84,0,.12),

        0 12px 22px
        rgba(211,84,0,.12);

    transition:.25s ease;
}

.selected-symbol.locked{
    border-style:solid;

    border-color:#00b894;

    color:#008f72;

    background:#edfbf4;
}


/* =========================
   SYMBOL BUTTONS
========================= */

.symbol-options{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;
}

.symbol-btn{
    width:clamp(46px,5vw,64px);
    height:clamp(46px,5vw,64px);

    border:none;

    border-radius:50%;

    background:#fffdf8;

    border:
        2px solid
        #b8cfe0;

    color:#435266;

    font-size:clamp(25px,3vw,38px);

    font-weight:300;

    cursor:pointer;

    box-shadow:
        0 5px 0
        #9eb8ca;

    transition:
        transform .15s ease,
        background .2s ease,
        color .2s ease;
}

.symbol-btn:hover:not(:disabled){
    transform:translateY(-3px);
}

.symbol-btn:active:not(:disabled){
    transform:translateY(3px);

    box-shadow:
        0 2px 0
        #9eb8ca;
}

.symbol-btn.active{
    background:#fff3dd;

    border-color:#e67e22;

    color:#d35400;

    box-shadow:
        0 5px 0
        #d35400;
        font-weight: normal;
}

.symbol-btn:disabled{
    opacity:.6;

    cursor:not-allowed;
}


/* =========================
   QUESTION BADGE
========================= */

.question-badge{
    position:absolute;

    top:clamp(5px,1vh,15px);

    left:50%;

    transform:translateX(-50%);

    color:#435266;

    font-size:clamp(16px,1.7vw,23px);

    font-weight:500;

    white-space:nowrap;

    z-index:6;
}


/* =========================
   NAVIGATION
   SAME STYLE
========================= */

.navigation{
    width:min(100%,1100px);

    display:grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items:center;

    gap:20px;

    margin:auto;
}

 .nav{
    width:178px;
    height:45px;
    padding:0;
    border:none;
    border-radius:35px;
    background:#e67e22;
    color:white;
    font-size:20px;
    font-weight:500;

    cursor:pointer;

    box-shadow:
        0 6px
        #d35400;

    transition:
        transform .1s ease,
        opacity .2s ease;
}

.nav:active:not(:disabled){
    transform:translateY(4px);

    box-shadow:
        0 2px
        #d35400;
}

.nav:disabled{
    background:#b2bec3;

    box-shadow:
        0 6px
        #7f8c8d;

    cursor:not-allowed;

    opacity:.9;
}

#prev{
    justify-self:start;
}

#next{
    justify-self:end;
}

.submit{
    background:#00b894;

    box-shadow:
        0 6px
        #008f72;
}

.submit:active:not(:disabled){
    box-shadow:
        0 2px
        #008f72;
}


/* =========================
   POPUP
========================= */

/* =========================
   POPUP
========================= */

.popup-bg{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
   
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
}

.popup-bg.show{
    opacity:1;
    pointer-events:auto;
}

.popup{
    position:relative;
    width:90%;
    max-width:520px;
    padding:40px 30px;
    border-radius:36px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.1);
    transform:scale(.8);
    transition:transform .35s cubic-bezier(.175,.885,.32,1.275);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.popup::before{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    top:-60px;
    right:-50px;
    border-radius:50%;
    z-index:0;
}

.popup::after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    bottom:-70px;
    left:-40px;
    border-radius:50%;
    z-index:0;
}

.popup.correct{
    background:#edfbf4;
    border:6px solid #00c885;
}

.popup.correct::before,
.popup.correct::after{
    background:rgba(162,245,209,.45);
}

.popup.wrong{
    background:#fff0f2;
    border:6px solid #ff6b7a;
}

.popup.wrong::before,
.popup.wrong::after{
    background:rgba(255,196,203,.45);
}

.popup.final{
    background:#f0f3ff;
    border:6px solid #6c5ce7;
    width: 520px;
    max-width: 90vw;
    height: 300px;
    padding: 40px 30px;
    box-sizing: border-box;
    border-radius: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    
}

.popup.final::before,
.popup.final::after{
    background:rgba(162,155,254,.35);
}

.popup-bg.show .popup{
    transform:scale(1);
}

.popup-icon{
    position:relative;
    z-index:2;
    font-size:4.8rem;
    line-height:1;
    margin-bottom:12px;
    filter:drop-shadow(0 5px 5px rgba(0,0,0,.12));
}

.popup h2{
    position:relative;
    z-index:2;
    margin:0 0 8px;
    font-size:3rem;
    font-weight:600;
    letter-spacing:-.5px;
}

.popup p{
    position:relative;
    z-index:2;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:1.4rem;
    font-weight:500;
}

.correct h2{ color:#00a86b; }
.correct p{ color:#2e7d5b; }

.wrong h2{ color:#d33847; }
.wrong p{ color:#a33b45; }

.final h2{ color:#6c5ce7; }
.final p{ color:#4834d4; }

.play{
    position:relative;
    z-index:2;
    margin-top:20px;
    padding:10px 35px;
    border:none;
    border-radius:30px;
    background:#0984e3;
    color:white;
    font-size: 20px;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 5px #0975c7;
}

.play:active{
    transform:translateY(3px);
    box-shadow:0 2px #0975c7;
}

/* =========================
   TABLET
========================= */

@media(max-width:900px){

    .compare-world{
        gap:18px;
    }

    .object-display{
        height:220px;
    }

    .symbol-station{
        width:180px;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    html,
    body{
        overflow:hidden;
    }

    .game{
        padding:10px;

        gap:8px;
    }

    .game-heading{
        font-size:20px;
        font-weight:400;
        color:#2f4f4f;
        padding:0 5px;
    }

    .compare-world{
        grid-template-columns:
            1fr
            auto
            1fr;

        gap:5px;

        width:100%;
    }

    .zone-label{
        font-size:14px;
    }

    .object-display{
        height:140px;
    }

    .symbol-station{
        width:110px;

        min-height:180px;

        gap:8px;
    }

    .symbol-title{
        font-size:12px;
    }

    .symbol-orbit{
        width:105px;
        height:105px;
    }

    .selected-symbol{
        width:52px;
        height:52px;

        border-radius:15px;

        font-size:30px;
    }

    .symbol-options{
        gap:4px;
    }

    .symbol-btn{
        width:30px;
        height:30px;

        font-size:18px;

        box-shadow:
            0 3px 0
            #9eb8ca;
    }

    .navigation{
        gap:8px;
    }
    .nav,
    .submit{
        width:178px;
        height:45px;
        padding:0;
        font-size:20px;
        font-weight:500;
    }

    .question-badge{
        font-size:12px;
    }

}


/* =========================
   EXACT SAME CONFETTI EFFECT
   ========================= */
#confettiContainer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 90;
}

.confetti-piece {
    position: absolute;
    width: 9px;
    height: 14px;
    border-radius: 2px;
    opacity: 0;
    animation: pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
    will-change: transform, opacity;
}

.final-confetti-piece {
    width: 10px;
    height: 16px;
    animation-duration: 2300ms;
}

.final-confetti-piece:nth-child(3n) {
    border-radius: 50%;
}

.final-confetti-piece:nth-child(4n) {
    width: 7px;
    height: 19px;
    border-radius: 1px;
}

.final-confetti-piece:nth-child(5n) {
    width: 13px;
    height: 8px;
    border-radius: 2px;
}

@keyframes pageConfetti {
    0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
    }
    55% {
        opacity: 1;
    }
    100% {
        opacity: 0;
        transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(0.72);
    }
}

.final-confetti-piece::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: inherit;
}

.popup.final.complete {
    box-shadow:
        0 20px 45px rgba(108, 92, 231, 0.18),
        0 0 0 8px rgba(162, 155, 254, 0.12);
}

.popup.final.complete .play {
    margin-top: 20px;
}

.popup.final.complete .popup-icon {
    animation: finalTrophyBounce 1.2s ease-in-out infinite;
}

@keyframes finalTrophyBounce {
    0%, 100% {
        transform: translateY(0) rotate(0deg) scale(1);
    }
    50% {
        transform: translateY(-5px) rotate(-4deg) scale(1.06);
    }
}

</style>

<script>

/* =========================
   EXACT SAME CORRECT / WRONG SOUND
   FROM BIG AND SMALL
   ========================= */
const audioCtx =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

function playAudioTone(isCorrect) {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (isCorrect) {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    }

    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}


/* =========================
   EXACT SAME CONFETTI EFFECT
   ========================= */
function showSmallConfetti(isFinal = false) {
    const confettiContainer = document.getElementById('confettiContainer');
    if (!confettiContainer) return;

    confettiContainer.innerHTML = '';

    const count = isFinal ? 95 : 42;

    const colors = [
        '#00b894',
        '#e67e22',
        '#6c5ce7',
        '#0984e3',
        '#fdcb6e',
        '#ff6b7a',
        '#00cec9',
        '#a29bfe'
    ];

    for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');

        piece.className =
            isFinal
                ? 'confetti-piece final-confetti-piece'
                : 'confetti-piece';

        const startX = Math.random() * 100;
        const startY = -8 + Math.random() * 10;

        const drift =
            (Math.random() * 520 - 260) *
            (isFinal ? 1.15 : 0.9);

        const fall =
            window.innerHeight *
            (0.82 + Math.random() * 0.48);

        const rotation =
            Math.random() * 1400 - 700;

        piece.style.left = startX + '%';
        piece.style.top = startY + '%';

        piece.style.setProperty('--x', drift + 'px');
        piece.style.setProperty('--y', fall + 'px');
        piece.style.setProperty('--r', rotation + 'deg');

        piece.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        piece.style.animationDelay =
            (Math.random() * (isFinal ? 500 : 220)) + 'ms';

        confettiContainer.appendChild(piece);

        setTimeout(
            () => piece.remove(),
            isFinal ? 2900 : 2050
        );
    }
}

    label:"c)",
    leftImage:"../images/question3-left.png",
    rightImage:"../images/question3-right.png",
    answer:"<"
}


];


/* =========================
   GAME STATE
========================= */

let round = 0;

let paused = false;

let timer = null;


/* =========================
   ANSWER STORAGE
========================= */

let states = questions.map(() => ({

    answer:"",

    done:false

}));


/* =========================
   VOICE

   SAME FUNCTION
   ONLY CORRECT / WRONG
========================= */

function speak(text){

    speechSynthesis.cancel();

    const msg =
        new SpeechSynthesisUtterance(text);

    msg.lang = "en-US";

    msg.volume = 0.25;

    msg.rate = 1;

    msg.pitch = 1;

    speechSynthesis.speak(msg);

}


/* =========================
   LOAD QUESTION
========================= */

function loadQuestion(){

    paused = false;


    const q =
        questions[round];


    const state =
        states[round];


    document
        .getElementById("questionBadge")
        .textContent =
        q.label;


    document
        .getElementById("leftImage")
        .src =
        q.leftImage;


    document
        .getElementById("rightImage")
        .src =
        q.rightImage;


    const selected =
        document.getElementById(
            "selectedSymbol"
        );


    selected.textContent =
        state.answer || "?";


    selected.classList.remove(
        "locked"
    );


    if(state.done){

        selected.classList.add(
            "locked"
        );

    }


    const buttons =
        document.querySelectorAll(
            ".symbol-btn"
        );


    buttons.forEach(button => {

        button.classList.remove(
            "active"
        );

        button.disabled =
            state.done;


        if(
            button.textContent.trim()
            ===
            state.answer
        ){

            button.classList.add(
                "active"
            );

        }

    });


    updateControls();

}


/* =========================
   SELECT SYMBOL
========================= */

function selectSymbol(symbol){

    if(paused) return;


    if(states[round].done) return;


    states[round].answer =
        symbol;


    const selected =
        document.getElementById(
            "selectedSymbol"
        );


    selected.textContent =
        symbol;


    const buttons =
        document.querySelectorAll(
            ".symbol-btn"
        );


    buttons.forEach(button => {

        button.classList.remove(
            "active"
        );


        if(
            button.textContent.trim()
            ===
            symbol
        ){

            button.classList.add(
                "active"
            );

        }

    });

}


/* =========================
   BUTTON CONTROL
========================= */

function updateControls(){

    const state =
        states[round];


    document
        .getElementById("prev")
        .disabled =
        round === 0;


    document
        .getElementById("next")
        .disabled =
        round ===
        questions.length - 1
        ||
        !state.done;


    document
        .getElementById("submit")
        .disabled =
        state.done;

}


/* =========================
   SUBMIT ANSWER
========================= */

function submitAnswer(){

    if(paused) return;


    const state =
        states[round];


    if(state.done) return;


    if(state.answer === "") return;


    const q =
        questions[round];


    if(
        state.answer ===
        q.answer
    ){


        paused = true;


        state.done =
            true;


        const selected =
            document.getElementById(
                "selectedSymbol"
            );


        selected.classList.add(
            "locked"
        );


        document
            .querySelectorAll(
                ".symbol-btn"
            )
            .forEach(button => {

                button.disabled = true;

            });


        speak("Correct");
        playAudioTone(true);
        showSmallConfetti(false);


        updateControls();


        if(
            round ===
            questions.length - 1
        ){


            showPopup(

                "correct",

                "🌟",

                "Amazing!",

                "You got it right!",

                false

            );

            setTimeout(() => {
                showSmallConfetti(true);

                showPopup(
                    "final",
                    "🏆",
                    "Congratulations!",
                    "Great job! You completed it! 🎉",
                    true
                );
            }, 1600);


        }

        else{


            showPopup(

                "correct",

                "🌟",

                "Amazing!",

                "You got it right!",

                false

            );


            paused = false;

        }


    }

    else{


        paused = true;


        speak("Wrong");
        playAudioTone(false);


        const selected =
            document.getElementById(
                "selectedSymbol"
            );


        selected.style.transform =
            "translateX(-8px)";


        setTimeout(() => {


            selected.style.transform =
                "";


            state.answer =
                "";


            selected.textContent =
                "?";


            document
                .querySelectorAll(
                    ".symbol-btn"
                )
                .forEach(button => {

                    button.classList.remove(
                        "active"
                    );

                });


            showPopup(

                "wrong",

                "😟",

                "Keep Going!",

                "Try again, you can do it!",

                false

            );


            paused = false;


        },250);


    }

}


/* =========================
   NAVIGATION
========================= */

function move(direction){

    const next =
        round + direction;


    if(
        next < 0
        ||
        next >= questions.length
    ){

        return;

    }


    if(
        direction === 1
        &&
        !states[round].done
    ){

        return;

    }


    round = next;


    loadQuestion();

}


/* =========================
   POPUP
========================= */

function showPopup(

    type,

    icon,

    title,

    text,

    final

){


    clearTimeout(timer);


    const popup =
        document.getElementById(
            "popup"
        );


    popup.className =
        "popup " + type + (final ? " complete" : "");


    document
        .getElementById("popupIcon")
        .textContent =
        icon;


    document
        .getElementById("popupTitle")
        .textContent =
        title;


    document
        .getElementById("popupText")
        .textContent =
        text;


    document
        .getElementById("playAgain")
        .style.display =
        final
            ?
            "inline-block"
            :
            "none";


    document
        .getElementById("popupBg")
        .classList
        .add("show");


    if(!final){

        timer =
            setTimeout(

                closePopup,

                1600

            );

    }

}


function closePopup(){

    document
        .getElementById("popupBg")
        .classList
        .remove("show");

}


/* =========================
   RESTART
========================= */

function restart(){

    clearTimeout(timer);

    const confettiContainer = document.getElementById("confettiContainer");
    if (confettiContainer) confettiContainer.innerHTML = "";


    round = 0;


    paused = false;


    states =
        questions.map(() => ({

            answer:"",

            done:false

        }));


    closePopup();


    loadQuestion();

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(

    "keydown",

    function(event){


        if(
            event.key === "Enter"
            &&
            !states[round].done
        ){

            submitAnswer();

        }


        if(
            event.key === ">"
        ){

            selectSymbol(">");

        }


        if(
            event.key === "<"
        ){

            selectSymbol("<");

        }


        if(
            event.key === "="
        ){

            selectSymbol("=");

        }

    }

);


/* =========================
   START
========================= */

window.addEventListener(

    "load",

    function(){

        loadQuestion();

    }

);


</script>
