<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numberland — Pick a Pack</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#fffaf0;
  --ink:#292241;
  --pink:#f4436c;
  --pink-soft:#ffe2ea;
  --green:#3fae6b;
  --green-soft:#e2f7e9;
  --blue:#1f9ed9;
  --blue-soft:#def3ff;
  --shadow:0 12px 28px rgba(42,34,65,.12);
  
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:'Livvic';
  color:var(--ink);
  /* background:
    radial-gradient(circle at 4% 10%, #ffdced 0 10%, transparent 25%),
    radial-gradient(circle at 96% 14%, #d8f3ff 0 10%, transparent 26%),
    radial-gradient(circle at 6% 92%, #dfffe9 0 10%, transparent 28%),
    radial-gradient(circle at 96% 90%, #fff0c7 0 11%, transparent 28%),
    var(--cream); */
    background-color: #ffffff;
  overflow-x:hidden;
}

button{
  font-family:inherit;
}

.wrap{
  width:min(1780px, calc(100% - 48px));
  margin:0 auto;
  padding:30px 0 55px;
}

/* ---------------- HOME ---------------- */

.top{
  position:relative;
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:45px;
  padding:34px 55px;
  /* margin-bottom:30px; */
  border-radius:34px;
  overflow:hidden;
  /* background:linear-gradient(110deg,#ffe0ed 0%,#fffaf3 47%,#d9f3ff 100%);
  box-shadow:var(--shadow); */
}

.top-copy{
  position:relative;
  z-index:2;
  max-width:850px;
}

.top-kicker{
  display:block;
  margin-bottom:4px;
  font-family:"Livvic";
  font-size:clamp(20px,2vw,31px);
  font-weight:700;
  color:#69617b;
}

h1{
  margin:0;
  font-family:"Livvic";
  font-size:clamp(42px,5vw,82px);
  line-height:.98;
  letter-spacing:-1px;
  font-weight: 600;
}

.top-art{
  position:relative;
  z-index:2;
  width:min(410px,30vw);
  min-width:230px;
  height:245px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.top-art img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

/* ONLY HOME IMAGE #1 */
.home-main-image{
  content:url("./images/home.png");
}

#backBtn{
  display:none;
  position:fixed;
  top:16px;
  left:16px;
  z-index:9000;
  border:3px solid #fff;
  border-radius:999px;
  padding:10px 18px;
  min-height:46px;
  background:#fff;
  color:var(--ink);
  font-family:"Livvic";
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(42,34,65,.18);
}

#backBtn:hover{transform:translateY(-1px)}

#home{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px;
}

.pack{
  position:relative;
  min-height:330px;
  padding:30px;
  border:0;
  border-radius:30px;
  text-align:left;
  cursor:pointer;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .16s ease,box-shadow .16s ease;
}

.pack:hover{
  transform:translateY(-5px);
  box-shadow:0 18px 35px rgba(42,34,65,.16);
}

.pack:active{transform:translateY(0)}

.pack::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-60px;
  bottom:-75px;
  border-radius:50%;
  opacity:.18;
}

.pack[data-pack="1"]{background:var(--pink-soft)}
.pack[data-pack="1"]::after{background:var(--pink)}

.pack[data-pack="2"]{background:var(--green-soft)}
.pack[data-pack="2"]::after{background:var(--green)}

.pack[data-pack="3"]{background:var(--blue-soft)}
.pack[data-pack="3"]::after{background:var(--blue)}

.pack-emoji{
  display:block;
  position:relative;
  z-index:1;
  font-size:50px;
  margin-bottom:18px;
}

.pack h2{
  position:relative;
  z-index:1;
  margin:0 0 8px;
  font-family:"Livvic";
  font-size:clamp(23px,2vw,31px);
  line-height:1.05;
  font-weight: 500;
}

.pack p{
  position:relative;
  z-index:1;
  margin:0 0 22px;
  max-width:470px;
  color:#5e5674;
  font-size:clamp(17px,1.5vw,21px);
  line-height:1.45;
}

.pack-count{
  position:relative;
  z-index:1;
  display:inline-block;
  padding:8px 15px;
  border-radius:999px;
  background:#fff;
  font-family:"Livvic";
  font-size:clamp(17px,1.5vw,21px);
  font-weight:500;
}

.pack[data-pack="1"] .pack-count{color:var(--pink)}
.pack[data-pack="2"] .pack-count{color:var(--green)}
.pack[data-pack="3"] .pack-count{color:var(--blue)}

/* ---------------- PACK VIEW ---------------- */

#packView{
  display:none;
  padding-top:0px;
}

.pack-page-head{
  min-height:175px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
  padding:20px 45px;
  margin-bottom:28px;
  border-radius:30px;
  overflow:hidden;
  color:#fff;
  box-shadow:var(--shadow);
}

.pack-page-copy{
  flex:1;
  min-width:0;
}

.pack-page-copy h2{
  margin:0 0 8px;
  font-family:"Livvic";
  font-size:clamp(30px,3.5vw,52px);
  line-height:1;
  font-weight: 500;
}

.pack-page-copy p{
  margin:0;
  font-size:clamp(15px,1.35vw,20px);
  line-height:1.4;
}

.pack-page-art{
  flex:0 0 clamp(210px,22vw,370px);
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.pack-page-art img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

/* Pack headers use icons only — no header images */
.pack-page-art{display:none}

.pack-header-icon{
  width:64px;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
  border-radius:20px;
  background:rgba(255,255,255,.18);
  font-size:36px;
  line-height:1;
}

#quizGrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;
}

.quiz-card{
  min-width:0;
  min-height:335px;
  padding:18px;
  border-radius:26px;
  background:#fff;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
}

.quiz-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.num-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:48px;
  height:38px;
  padding:0 12px;
  border-radius:999px;
  font-family:"Livvic";
  font-size:15px;
  font-weight:800;
}

.icon-badge{
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:20px;
}

.quiz-illustration{
  height:130px;
  border-radius:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:46px;
  margin-bottom:17px;
}

.quiz-card h3{
  margin:0 0 5px;
  font-family:"Livvic";
  font-size:22px;
  line-height:1.1;
  font-weight: 500;
}

.quiz-card p{
  margin:0 0 18px;
  color:#68607d;
  font-size:15px;
  line-height:1.4;
  flex-grow:1;
}

.start-btn{
  width:100%;
  min-height:50px;
  border:0;
  border-radius:16px;
  color:#fff;
  font-family:"Livvic";
  font-size:clamp(17px,1.5vw,21px);
  font-weight:500;
  cursor:pointer;
  transition:transform .14s ease,filter .14s ease;
}

.start-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.05);
}

/* ---------------- FULL SCREEN QUIZ ---------------- */

#quizModal{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  width:100vw;
  height:100dvh;
  background:#fff;
  overflow:hidden;
}

#quizModal.open{display:block}

#quizFrame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  margin:0;
  padding:0;
  display:block;
}

#quizHomeBtn{
  position:absolute;
  top:15px;
  left:15px;
  z-index:100000;
  min-width:105px;
  height:48px;
  padding:0 18px;
  border:3px solid #fff;
  border-radius:999px;
  background:var(--pink);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-family:"Livvic";
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(42,34,65,.25);
}

/* ---------------- LARGE MONITORS ---------------- */

@media (min-width:1600px){
  .wrap{
    width:min(1840px,calc(100% - 70px));
    padding-top:35px;
  }

  .top{
    min-height:370px;
    padding:40px 70px;
  }

  #home{gap:34px}

  .pack{
    min-height:390px;
    padding:38px;
  }

  .pack-emoji{font-size:58px}
  .pack h2{font-size:34px}
  .pack p{font-size:18px}

  #quizGrid{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:30px;
  }

  .quiz-card{
    min-height:390px;
    padding:22px;
  }

  .quiz-illustration{height:155px}
}

/* ---------------- LAPTOP ---------------- */

@media (max-width:1250px){
  .wrap{width:min(1180px,calc(100% - 34px))}
  .top{min-height:200px;padding:28px 38px}
  .top-art{width:300px;height:200px}
  #quizGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ---------------- TABLET ---------------- */

@media (max-width:900px){
  .wrap{
    width:calc(100% - 28px);
    padding-top:20px;
  }

  .top{
    min-height:260px;
    padding:25px;
    gap:15px;
  }

  .top-art{
    width:230px;
    min-width:180px;
    height:165px;
  }

  #home{grid-template-columns:1fr}

  .pack{
    min-height:260px;
    padding:25px;
  }

  #quizGrid{grid-template-columns:repeat(2,minmax(0,1fr))}

  .pack-page-head{
    min-height:220px;
    padding:25px;
  }

  .pack-page-art{
    flex-basis:230px;
    height:170px;
  }
}

/* ---------------- MOBILE ---------------- */

@media (max-width:600px){
  .wrap{
    width:calc(100% - 20px);
    padding:12px 0 35px;
  }

  .top{
    min-height:0;
    padding:25px 20px;
    flex-direction:column;
    align-items:flex-start;
    border-radius:24px;
  }

  .top-copy{max-width:none}

  h1{font-size:42px}

  .top-art{
    width:100%;
    height:170px;
    min-width:0;
  }

  #backBtn{
    top:10px;
    left:10px;
    min-height:42px;
    padding:8px 14px;
    font-size:14px;
  }

  #packView{padding-top:58px}

  .pack-page-head{
    flex-direction:column;
    align-items:flex-start;
    min-height:0;
    padding:22px;
    border-radius:24px;
  }

  .pack-page-art{
    width:100%;
    flex-basis:auto;
    height:150px;
  }

  #quizGrid{grid-template-columns:1fr}

  .quiz-card{
    min-height:0;
  }

  .quiz-illustration{height:125px}

  #quizHomeBtn{
    top:9px;
    left:9px;
    min-width:92px;
    height:43px;
    padding:0 13px;
    font-size:14px;
  }
}
</style>

<style id="final-soft-pastel-theme">
.pack{
  border:3px solid rgba(255,255,255,.85) !important;
}

.pack[data-pack="1"]{
  border-color:#E5BFCA !important;
}
.pack[data-pack="2"]{
  border-color:#C1DEC9 !important;
}
.pack[data-pack="3"]{
  border-color:#BBD9E9 !important;
}

.pack-page-head{
  border:3px solid #DDBCC8 !important;
  box-shadow:0 10px 24px rgba(42,34,65,.08) !important;
}

.quiz-card{
  border-width:3px !important;
  border-style:solid !important;
  box-shadow:0 10px 24px rgba(42,34,65,.08) !important;
}

.quiz-illustration{
  box-sizing:border-box;
}

.start-btn{
  box-sizing:border-box;
  cursor:pointer;
  transition:transform .14s ease, box-shadow .14s ease !important;
}

.start-btn:hover{
  filter:none !important;
  transform:translateY(-2px);
  box-shadow:0 4px 10px rgba(42,34,65,.08);
}
</style>

</head>

<body>

<div class="wrap">

  <header class="top">
    <div class="top-copy">
      <!-- <span class="top-kicker">Numberland</span> -->
      <h1>Pick a card to start playing</h1>
    </div>

    <!-- IMAGE PLACE 1: HOME ONLY -->
    <div class="top-art">
      <img class="home-main-image" alt="Numberland learning illustration">
    </div>
  </header>

  <button id="backBtn" type="button" onclick="showHome()">🏠 Home</button>

  <!-- HOME PACK CARDS -->
  <section id="home"></section>

  <!-- INSIDE PACK — NO HEADER IMAGES -->
  <section id="packView">
    <div class="pack-page-head" id="packBanner"></div>
    <div id="quizGrid"></div>
  </section>

</div>

<!-- FULL SCREEN QUIZ -->
<div id="quizModal" aria-hidden="true">
  <button id="quizHomeBtn" type="button" onclick="closeQuiz()">
    <span>⌂</span> Home
  </button>
  <iframe id="quizFrame" title="Numberland Quiz" src="about:blank" allow="fullscreen"></iframe>
</div>

<script>
const packs = [
  {
    id:1,
    title:"Match & Sort",
    emoji:"🔗",
    color:"#F88FA5",
soft:"#FFF6F8",
    blurb:"Connect pairs and sort items into the right group",
    quizzes:[
      {title:"Matching",desc:"Find and connect the right pairs",emoji:"🔗",icon:"🔗"},
      {title:"Matching Bird",desc:"Play and match the birds",emoji:"🕊️",icon:"🕊️"},
      {title:"Even Odd Game",desc:"Sort numbers into two groups",emoji:"🔢",icon:"↕️"}
    ]
  },
  {
    id:2,
    title:"Draw & Complete",
    emoji:"✏️",
    color:"#7ACB98",
soft:"#F5FCF7",
    blurb:"Fill in, draw, or complete the missing piece",
    quizzes:[
      {title:"Fill In The Blanks",desc:"Complete the missing answers",emoji:"✏️",icon:"✏️"},
      {title:"Complete Box",desc:"Complete the missing part",emoji:"🧩",icon:"＋"},
      {title:"Draw Beads",desc:"Draw and count the beads",emoji:"🟠✏️",icon:"⚪"}
    ]
  },
  {
    id:3,
    title:"Number Concepts",
    emoji:"🔢",
   color:"#55B5E3",
soft:"#EFF9FF",
    blurb:"Learn to name, count, order and compare numbers",
    quizzes:[
      {title:"Number Name",desc:"Connect numbers with their names",emoji:"7️⃣",icon:"A"},
      {title:"Abacus Game",desc:"Count and learn with colourful beads",emoji:"🧮",icon:"🧮"},
      {title:"Number Line",desc:"Explore numbers in order",emoji:"1️⃣ ─ 2️⃣ ─ 3️⃣",icon:"📏"},
      {title:"Symbol",desc:"Choose the correct comparison sign",emoji:"< > + -",icon:">"},
      {title:"Ordinal Number",desc:"Learn first, second and third",emoji:"🥇",icon:"≡"}
    ]
  }
];

const homeEl=document.getElementById("home");
const packView=document.getElementById("packView");
const packBanner=document.getElementById("packBanner");
const quizGrid=document.getElementById("quizGrid");
const backBtn=document.getElementById("backBtn");

function renderHome(){
  homeEl.innerHTML=packs.map(p=>`
    <button class="pack" data-pack="${p.id}" onclick="openPack(${p.id})">
      <span class="pack-emoji">${p.emoji}</span>
      <h2>${p.id}. ${p.title}</h2>
      <p>${p.blurb}</p>
      <span class="pack-count">${p.quizzes.length} quizzes</span>
    </button>
  `).join("");
}

function openPack(id){
  const pack=packs.find(p=>p.id===id);
  if(!pack)return;

  homeEl.style.display="none";
  packView.style.display="block";
  backBtn.style.display="inline-flex";

  /* Same color family as the selected Pick a Card, but soft pastel */
  const pastel = {
    1:{
      banner:"#F4CFDA",
      border:"#E4BBC8",
      card:"#FFF4F7",
      illustration:"#FFE8EE",
      button:"#EFCBD7",
      buttonBorder:"#DEB4C2",
      text:"#5C4F56"
    },
    2:{
      banner:"#D6EDDD",
      border:"#BFDCC7",
      card:"#F3FAF5",
      illustration:"#E7F6EB",
      button:"#D3EBD9",
      buttonBorder:"#B9D9C1",
      text:"#4F5D54"
    },
    3:{
      banner:"#D3E8F5",
      border:"#B9D7E9",
      card:"#F2F9FD",
      illustration:"#E4F3FA",
      button:"#D0E6F2",
      buttonBorder:"#B5D4E4",
      text:"#4F5D66"
    }
  }[pack.id];

  packBanner.style.background=pastel.banner;
  packBanner.style.borderColor=pastel.border;
  packBanner.style.color=pastel.text;

  packBanner.innerHTML=`
    <div class="pack-page-copy">
      <div class="pack-header-icon" aria-hidden="true">${pack.emoji}</div>
      <h2>${pack.title}</h2>
      <p>${pack.blurb}</p>
    </div>
  `;

  quizGrid.innerHTML=pack.quizzes.map((q,i)=>`
    <article class="quiz-card"
      style="
        background:${pastel.card};
        border-color:${pastel.border};
      ">
      <div class="quiz-top">
        <span class="num-badge"
          style="background:${pack.soft};color:${pack.color}">
          ${String(i+1).padStart(2,"0")}
        </span>

        <span class="icon-badge"
          style="
            background:${pastel.button};
            color:${pastel.text};
            border:2px solid ${pastel.buttonBorder};
          ">
          ${q.icon}
        </span>
      </div>

      <div class="quiz-illustration"
        style="
          background:${pastel.illustration};
          border:2px solid ${pastel.border};
        ">
        ${q.emoji}
      </div>

      <h3>${q.title}</h3>
      <p>${q.desc}</p>

      <button
        class="start-btn"
        style="
          background:${pastel.button};
          color:${pastel.text};
          border:2px solid ${pastel.buttonBorder};
        "
        type="button"
        onclick="startQuiz('${q.title.replace(/'/g,"\\'")}')">
        Play →
      </button>
    </article>
  `).join("");

  window.scrollTo({top:0,behavior:"instant"});
}

function showHome(){
  closeQuiz();
  homeEl.style.display="grid";
  packView.style.display="none";
  backBtn.style.display="none";
  window.scrollTo({top:0,behavior:"instant"});
}

function getQuizUrl(title){
  const known={
    "Matching":"matching.html",
    "Matching Bird":"matching-bird.html",
    "Even Odd Game":"even-odd-game.html",
    "Fill In The Blanks":"fill-in-the-blanks.html",
    "Complete Box":"complete-box.html",
    "Draw Beads":"draw-beads.html",
    "Number Name":"number-name.html",
    "Abacus Game":"abacus-game.html",
    "Number Line":"number-line.html",
    "Symbol":"symbol.html",
    "Ordinal Number":"ordinal-number.html"
  };

  return known[title] || title.toLowerCase()
    .replace(/&/g,"and")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"") + ".html";
}

function startQuiz(title){
  const modal=document.getElementById("quizModal");
  const frame=document.getElementById("quizFrame");

  frame.src=getQuizUrl(title);
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}

function closeQuiz(){
  const modal=document.getElementById("quizModal");
  const frame=document.getElementById("quizFrame");

  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
  frame.src="about:blank";
  document.body.style.overflow="";
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeQuiz();
});

renderHome();
</script>

</body>
</html>
