<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoon Abacus Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
        }

        body {
          
            background-size: 120px 120px, 160px 160px, 100% 100%;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden; /* STRICTLY Prevents Scrolling */
            color: #1e293b;
            position: relative;
        }

        /* Keep the page clean: no scenery card/background objects */
        .scenery {
            display: none;
        }
        .hill-back {
            position: absolute; bottom: -5vh; left: -10%; width: 60%; height: 35vh;
            background: #4ade80; border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            box-shadow: inset 0 20px 0 #22c55e;
        }
        .hill-front {
            position: absolute; bottom: -5vh; right: -10%; width: 70%; height: 30vh;
            background: #22c55e; border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            box-shadow: inset 0 20px 0 #16a34a;
        }
        .clouds {
            position: absolute; top: 10%; width: 200%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="white" opacity="0.6"><circle cx="20" cy="30" r="12"/><circle cx="32" cy="25" r="16"/><circle cx="44" cy="30" r="12"/></svg>') repeat-x;
            background-size: 300px;
            animation: drift 100s linear infinite;
        }
        @keyframes drift { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* Header Area */
        header {
            text-align: center;
            z-index: 10;
            flex-shrink: 0;
            padding-top: 15px;
            width: 100%;
        }

        h1 {
            color: #2f4f4f;
            font-weight: 600;
            font-size: 22px;
            margin-bottom: 10px;
        }

        @media screen and (max-width: 1599px) {
            h1 { font-size: 22px; }
            input[type="text"] { font-size: 30px; }
        }

        @media screen and (min-width: 1600px) {
            h1 { font-size: 30px; }
            input[type="text"] { font-size: 40px; }
        }

        .instruction {
            font-size: clamp(20px, 1.5vw, 25px);
            color: #334155;
            font-weight: 400;
        
            box-shadow: none;
            display: inline-block;
        }
        
        .instruction span.tens { color: #16a34a; }
        .instruction span.ones { color: #0284c7; }

        /* Main Game Stage */
        .game-stage {
            width: 96%;
            max-width: 1500px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            min-height: 0;
        }

        /* Open game layout — card removed */
        .equation-board {
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(14px, 2.5vw, 38px);
            padding: 2vh 1vw;
            width: 100%;
            max-height: 60vh;
            position: relative;
        }

        .question-letter {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: clamp(24px, 3vw, 38px);
            font-weight: 900;
            color: #334155;
            z-index: 6;
            line-height: 1;
        }

        .group-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            height: 100%;
            justify-content: flex-end;
        }

        /* Exact Abacus Design from Image */
        .toy-abacus {
            /* Fixed outer frame: every abacus stays exactly the same width and height,
               even when one question has only an Ones rod and another has Tens + Ones. */
            width: clamp(130px, 15vw, 220px);
            flex: 0 0 clamp(130px, 15vw, 220px);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: clamp(160px, 25vh, 270px);
            position: relative;
        }

        .rods-area {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 25px; /* Space between T and O rods */
            flex-grow: 1;
            padding: 0 15px;
            z-index: 1;
        }

        .rod-col {
            position: relative;
            width: 24px;
            height: 100%;
            display: flex;
            flex-direction: column-reverse; /* Beads stack at bottom */
            align-items: center;
        }

        /* Unique toy rail: a soft double-line candy-cane style track */
        .rod-col::after {
            content: '';
            position: absolute;
            bottom: -10px;
            width: 10px;
            height: calc(100% + 10px);
            background: linear-gradient(90deg, #64748b 0 22%, #dbeafe 22% 42%, #ffffff 42% 58%, #dbeafe 58% 78%, #64748b 78% 100%);
            border: 1px solid rgba(71,85,105,.32);
            border-radius: 999px;
            box-shadow: 0 0 0 3px rgba(255,255,255,.55), inset 0 0 3px rgba(15,23,42,.25);
            z-index: 0;
        }

        .rod-col::before {
            content: '';
            position: absolute;
            top: -8px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffffff 0 12%, #cbd5e1 13% 48%, #64748b 49% 100%);
            border: 2px solid #f8fafc;
            z-index: 1;
            box-shadow: 0 3px 0 rgba(71,85,105,.35);
        }

        /* The Exact Beads */
        .bead {
            width: 26px;
            height: 20px;
            border-radius: 50% 50% 46% 46%;
            z-index: 2;
            margin-bottom: 1px;
            border: 1px solid rgba(15,23,42,.22);
            box-shadow: inset -2px -4px 6px rgba(0,0,0,0.2), inset 2px 2px 4px rgba(255,255,255,0.55), 0 2px 0 rgba(255,255,255,.45);
            animation: bounceDrop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
        }

        .bead-tens { background: #22c55e; } /* Exact bright green */
        .bead-ones { background: #0ea5e9; } /* Exact bright blue */

        @keyframes bounceDrop {
            0% { transform: translateY(-100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* The exact grey base with T/O cutouts */
        .abacus-base {
            width: 100%;
            height: 35px;
            background: linear-gradient(180deg, #ffffff 0%, #e7edf5 100%);
            border: 2px solid #b8c5d3;
            border-radius: 16px;
            box-shadow: 0 5px 0 #9aa9ba, inset 0 2px 0 #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 5;
            padding: 0 15px;
        }

        .abacus-base span {
            font-size: 16px;
            font-weight: 900;
            color: #475569;
            width: 24px;
            text-align: center;
        }

        /* Operators */
        .operator {
            font-size: clamp(3rem, 5vw, 4.5rem);
            font-weight: 600;
            color: #d97706;
            text-shadow: 0 4px 0 #ffffff;
            flex-shrink: 0;
            transform: translateY(-20px);
        }

        /* Chunky Gaming Inputs */
        input[type="text"] {
            width: clamp(70px, 8vw, 85px);
            height: clamp(55px, 6.5vw, 65px);
            font-size: clamp(2rem, 3vw, 2.5rem);
            font-weight:400;
            text-align: center;
            border: 4px solid #f59e0b;
            border-radius: 16px;
            background: #ffffff;
            color: #0f172a;
            outline: none;
            box-shadow: 0 6px 0 #d97706, 0 10px 15px rgba(0,0,0,0.1);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        input[type="text"]:focus {
            transform: translateY(-4px);
            border-color: #fbbf24;
            box-shadow: 0 10px 0 #d97706;
        }

        input[type="text"]:disabled {
            background-color: #f1f2f6;
            border-color: #10b981;
            color: #059669;
            box-shadow: 0 6px 0 #059669;
            cursor: not-allowed;
            transform: none;
        }

        /* NEW LAYOUT: Single Grid Footer (Prev Left, Submit Center, Next Right) */
        footer {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            width: 100%;
            max-width: 1300px;
            padding: 15px 30px 25px 30px;
            z-index: 10;
        }

        .prev-wrap { justify-self: start; }
        .submit-wrap { justify-self: center; }
        .next-wrap { justify-self: end; }

        /* Strict Button Sizing Rules */
        .nav-btn, .submit-btn, .replay-btn {
            font-weight: 600; border: none; cursor: pointer; transition: all .1s ease;
            display:flex; align-items:center; justify-content:center; gap:10px;
            font-size:20px; min-width:178px; width:178px; height:45px; border-radius:40px;
        }

        @media screen and (min-width:1600px){
            .nav-btn, .submit-btn { font-size:30px; width:200px; min-width:200px; height:60px; padding:0; border-radius:40px; }
            .replay-btn { font-size:20px; width:178px; min-width:178px; height:45px; padding:0; border-radius:40px; }
        }

        .nav-btn { background: #e67e22; color: #ffffff; box-shadow: 0 6px 0 #d35400; }
        .nav-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px #d35400; }
        
        .submit-btn { background: #00b894; color: #ffffff; box-shadow: 0 8px 0 #008f72; padding-left: 50px; padding-right: 50px; }
        .submit-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #008f72; }

        .replay-btn { background: #0984e3; color: white; box-shadow: 0 6px 0 #0975c7; margin-top: 20px; z-index: 5; pointer-events: auto; }
        .replay-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0975c7; }

        .nav-btn:disabled { background:#b2bec3; box-shadow:0 6px 0 #636e72; cursor:not-allowed; opacity:.7; }
        .submit-btn:disabled { background:#b2bec3; box-shadow:0 6px 0 #636e72; color:#ffffff; cursor:not-allowed; opacity:.7; }

        .popup-overlay{
            position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
           opacity:0;pointer-events:none;transition:opacity .3s;
        }
        .popup-overlay.active{opacity:1;pointer-events:auto;}
        .popup-card{
            position:relative;width:90%;max-width:520px;padding:40px 30px;border-radius:36px;text-align:center;
            box-shadow:0 20px 40px rgba(0,0,0,.1);transform:scale(.8);
            transition:transform .35s cubic-bezier(.175,.885,.32,1.275);overflow:hidden;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
        }
        .popup-card::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;top:-60px;right:-50px;pointer-events:none;}
        .popup-card::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;bottom:-70px;left:-40px;pointer-events:none;}
        .popup-card.correct{background:#edfbf4;border:6px solid #00c885;}
        .popup-card.correct::before,.popup-card.correct::after{background:rgba(162,245,209,.45);}
        .popup-card.wrong{background:#fff0f2;border:6px solid #ff6b7a;}
        .popup-card.wrong::before,.popup-card.wrong::after{background:rgba(255,196,203,.45);}
        .popup-card.complete{background:#f0f3ff;border:6px solid #6c5ce7;}
        .popup-card.complete::before,.popup-card.complete::after{background:rgba(162,155,254,.35);}
        .popup-overlay.active .popup-card{transform:scale(1);}
        .popup-icon{font-size:4.8rem;margin-bottom:12px;z-index:2;line-height:1;filter:drop-shadow(0 5px 5px rgba(0,0,0,.08));}
        .popup-title{margin:0 0 8px;font-size:3rem;font-weight:600;z-index:2;letter-spacing:-.5px;}
        .popup-subtitle{margin:0;font-size:1.4rem;font-weight:500;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px;}
        .popup-card.correct .popup-title{color:#00a86b}.popup-card.correct .popup-subtitle{color:#2e7d5b;}
        .popup-card.wrong .popup-title{color:#d33847}.popup-card.wrong .popup-subtitle{color:#a33b45;}
        .popup-card.complete .popup-title{color:#6c5ce7}.popup-card.complete .popup-subtitle{color:#4834d4;}
        /* Large monitor responsive layout */
        @media screen and (min-width: 1600px) {
            .game-stage {
                width: 94%;
                max-width: 1650px;
            }

            .equation-board {
                gap: clamp(28px, 3vw, 60px);
                padding: 2vh 1.5vw;
            }

            .toy-abacus {
                width: clamp(220px, 14vw, 280px);
                flex-basis: clamp(220px, 14vw, 280px);
                height: clamp(260px, 30vh, 330px);
            }

            .rods-area {
                gap: clamp(28px, 2vw, 42px);
                padding: 0 18px;
            }

            .rod-col {
                width: 32px;
            }

            .bead {
                width: 38px;
                height: 28px;
            }

            .abacus-base {
                height: 48px;
                gap: clamp(32px, 2.2vw, 46px);
                padding: 0 20px;
            }

            .abacus-base span {
                font-size: 22px;
                width: 32px;
            }

            input[type="text"] {
                width: clamp(80px, 5vw, 100px);
                height: clamp(62px, 6vw, 76px);
                font-size: clamp(2.2rem, 2.6vw, 3rem);
            }
        }

        @media screen and (min-width: 1920px) {
            .game-stage {
                max-width: 1800px;
            }

            .equation-board {
                gap: 55px;
            }

            .toy-abacus {
                width: 250px;
                flex-basis: 250px;
                height: 300px;
            }

            .bead {
                width: 34px;
                height: 25px;
            }
        }

        @media screen and (max-width: 768px) {
            .operator { margin: 0; font-size: 2.5rem; transform: rotate(90deg); margin: -5px 0; }
            .equation-board { flex-direction: column; gap: 5px; max-height: none; padding: 15px; }
            .toy-abacus {
                width: 145px;
                flex-basis: 145px;
                height: 120px;
            }
            .bead { height: 12px; width: 16px; }
            input[type="text"] { height: 45px; font-size: 1.5rem; }
            footer { padding: 10px 15px; }
        }
    
#confettiContainer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90}
.confetti-piece{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;will-change:transform,opacity}
.final-confetti-piece{width:10px;height:16px;animation-duration:2300ms}
.final-confetti-piece:nth-child(3n){border-radius:50%}
.final-confetti-piece:nth-child(4n){width:7px;height:19px;border-radius:1px}
.final-confetti-piece:nth-child(5n){width:13px;height:8px;border-radius:2px}
@keyframes pageConfetti{0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg) scale(1)}55%{opacity:1}100%{opacity:0;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72)}}
.popup-card.complete{box-shadow:0 20px 45px rgba(108,92,231,.18),0 0 0 8px rgba(162,155,254,.12)}
.popup-card.complete .replay-btn{margin-top:12px}
.popup-card.complete .popup-icon{animation:finalTrophyBounce 1.2s ease-in-out infinite}
@keyframes finalTrophyBounce{0%,100%{transform:translateY(0) rotate(0deg) scale(1)}50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}}

    
/* ===== LESSON 3 HEADINGS: normal weight (400), no bold ===== */
header h1,
header h2,
header h3,
header p,
header .instruction,
header .instruction-text,
.heading h1,
.heading h2,
.heading p {
    font-weight: 400 !important;
}
header h1 *,
header h2 *,
header h3 *,
header p *,
header .instruction *,
header .instruction-text *,
.heading h1 *,
.heading h2 *,
.heading p * {
    font-weight: 400 !important;
}

/* ===== LESSON 3: Play Again only on final popup (20px) ===== */
.popup-card .replay-btn,
.popup-card #playAgainBtn {
    display: none !important;
}
.popup-card.complete .replay-btn,
.popup-card.complete #playAgainBtn {
    display: inline-flex !important;
    margin-top: 12px !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 40px !important;
    background: #0984e3 !important;
    color: #ffffff !important;
    font-size: 20px !important;
    font-weight: 600 !important;
    cursor: pointer;
    box-shadow: 0 6px 0 #0975c7 !important;
    z-index: 5;
    min-width: 178px !important;
    width: 178px !important;
    height: 45px !important;
    align-items: center;
    justify-content: center;
    transition: all 0.1s ease;
}
.popup-card.complete .replay-btn:active,
.popup-card.complete #playAgainBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #0975c7 !important;
}
</style>
</head>
<body>

    <div class="scenery">
        <div class="clouds"></div>
        <div class="hill-back"></div>
        <div class="hill-front"></div>
    </div>

    <header>
        <h1>Count the beads on the abacus and find the sum</h1>
        <p class="instruction">Count <span class="tens">Tens</span> and <span class="ones">Ones</span>, then type your answers!</p>
    </header>

    <main class="game-stage">
        <div class="equation-board" id="board">
            </div>
    </main>

    <footer>
        <div class="prev-wrap">
            <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">PREV</button>
        </div>
        <div class="submit-wrap">
            <button class="submit-btn" id="submitBtn" onclick="checkAnswers()" disabled>SUBMIT</button>
        </div>
        <div class="next-wrap">
            <button class="nav-btn" id="nextBtn" onclick="navigate(1)">NEXT</button>
        </div>
    </footer>

    <div id="confettiContainer"></div>

    <div class="popup-overlay" id="popup">
        <div class="popup-card" id="popupCard">
            <div class="popup-icon" id="popupIcon">⭐</div>
            <h2 class="popup-title" id="popupTitle">Amazing!</h2>
            <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
            <button class="replay-btn" id="playAgainBtn" style="display: none;" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>

        function showSmallConfetti(isFinal = false) {
            const confettiContainer = document.getElementById('confettiContainer');
            if (!confettiContainer) return;
            confettiContainer.innerHTML = '';
            const count = isFinal ? 95 : 42;
            const colors = ['#00b894','#e67e22','#6c5ce7','#0984e3','#fdcb6e','#ff6b7a','#00cec9','#a29bfe'];
            for (let i = 0; i < count; i++) {
                const piece = document.createElement('span');
                piece.className = isFinal ? 'confetti-piece final-confetti-piece' : 'confetti-piece';
                const startX = Math.random() * 100;
                const startY = -8 + Math.random() * 10;
                const drift = (Math.random() * 520 - 260) * (isFinal ? 1.15 : 0.9);
                const fall = window.innerHeight * (0.82 + Math.random() * 0.48);
                const rotation = Math.random() * 1400 - 700;
                piece.style.left = startX + '%';
                piece.style.top = startY + '%';
                piece.style.setProperty('--x', drift + 'px');
                piece.style.setProperty('--y', fall + 'px');
                piece.style.setProperty('--r', rotation + 'deg');
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = (Math.random() * (isFinal ? 500 : 220)) + 'ms';
                confettiContainer.appendChild(piece);
                setTimeout(() => piece.remove(), isFinal ? 2900 : 2050);
            }
        }

        // Exact Data extracted from the image
        const questionLabels = ['', '', '', ''];

        const quizData = [
            { 
                groups: [ { t: 0, o: 5, showT: false }, { t: 0, o: 3, showT: false }, { t: 0, o: 8, showT: false } ],
                targets: ["5", "3", "8"]
            },
            { 
                groups: [ { t: 1, o: 3, showT: true }, { t: 0, o: 2, showT: true }, { t: 1, o: 5, showT: true } ],
                targets: ["13", "2", "15"]
            },
            { 
                groups: [ { t: 1, o: 1, showT: true }, { t: 0, o: 7, showT: true }, { t: 1, o: 8, showT: true } ],
                targets: ["11", "7", "18"]
            },
            { 
                groups: [ { t: 0, o: 8, showT: false }, { t: 1, o: 0, showT: true }, { t: 1, o: 8, showT: true } ],
                targets: ["8", "10", "18"]
            }
        ];

        // State Array
        let quizState = Array.from({ length: quizData.length }, () => ({
            isSolved: false,
            isLocked: false,
            inputs: ['', '', '']
        }));

        let currentIndex = 0;
        let popupTimer = null;
        let audioCtx = null;

        const boardEl = document.getElementById('board');
        const submitBtn = document.getElementById('submitBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');

        // Robust Audio Engine
        function playTone(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2); 
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'clack') {
                    // Toy plastic clack sound
                    osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                }
            } catch(e) { console.log('Audio error:', e); }
        }

        function speak(t) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(t);
                msg.lang = "en-US"; msg.volume = 0.8; msg.rate = 1; msg.pitch = 1.2;
                speechSynthesis.speak(msg);
            }
        }

        // Generator for Toy Abacus HTML
        function buildAbacusHTML(groupData, isAnimated) {
            let html = `<div class="toy-abacus"><div class="rods-area">`;
            
            // Tens Rod
            if (groupData.showT) {
                let beads = '';
                for(let i=0; i<groupData.t; i++) {
                    const delay = isAnimated ? `animation-delay: ${i * 0.1}s;` : 'animation: none;';
                    beads += `<div class="bead bead-tens" style="${delay}"></div>`;
                }
                html += `<div class="rod-col">${beads}</div>`;
            }

            // Ones Rod
            let oBeads = '';
            for(let i=0; i<groupData.o; i++) {
                const delay = isAnimated ? `animation-delay: ${(i * 0.1) + 0.2}s;` : 'animation: none;';
                oBeads += `<div class="bead bead-ones" style="${delay}"></div>`;
            }
            html += `<div class="rod-col">${oBeads}</div>`;
            
            html += `</div>
                <div class="abacus-base">
                    ${groupData.showT ? '<span>T</span>' : ''}
                    <span>O</span>
                </div>
            </div>`;
            return html;
        }

        function loadQuestion() {
            const q = quizData[currentIndex];
            const state = quizState[currentIndex];
            
            // Generate board. Result abacus empty initially unless solved
            const resultGroup = state.isSolved ? q.groups[2] : { t: 0, o: 0, showT: q.groups[2].showT };
            
            boardEl.innerHTML = `
                
                <div class="group-col">
                    ${buildAbacusHTML(q.groups[0], !state.isSolved)}
                    <input type="text" class="ans-input" data-idx="0" inputmode="numeric" maxlength="2">
                </div>
                <div class="operator">+</div>
                <div class="group-col">
                    ${buildAbacusHTML(q.groups[1], !state.isSolved)}
                    <input type="text" class="ans-input" data-idx="1" inputmode="numeric" maxlength="2">
                </div>
                <div class="operator">=</div>
                <div class="group-col" id="result-col">
                    ${buildAbacusHTML(resultGroup, false)}
                    <input type="text" class="ans-input" data-idx="2" inputmode="numeric" maxlength="2">
                </div>
            `;

            // Bind Inputs & Restore State
            const inputs = document.querySelectorAll('.ans-input');
            inputs.forEach(inp => {
                const idx = inp.dataset.idx;
                inp.value = state.inputs[idx];
                
                if (state.isSolved || state.isLocked) {
                    inp.disabled = true;
                } else {
                    inp.addEventListener('input', handleInput);
                }
            });

            submitBtn.disabled = state.isSolved || state.isLocked || !allInputsFilled();
            
            // Keep both navigation buttons visible. Progress is sequential: a → b → c → d.
            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === quizData.length - 1) || !state.isSolved;

            // Whenever the game starts or the page is refreshed, place the cursor
            // directly in the first editable answer box.
            if (!state.isSolved && !state.isLocked) {
                requestAnimationFrame(() => {
                    const firstEmpty = Array.from(document.querySelectorAll('.ans-input:not(:disabled)'))
                        .find(input => input.value.trim() === '');
                    (firstEmpty || document.querySelector('.ans-input:not(:disabled)'))?.focus();
                });
            }
        }

        function handleInput(e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            quizState[currentIndex].inputs[e.target.dataset.idx] = e.target.value;
            submitBtn.disabled = !allInputsFilled();

            // Move automatically to the next answer box after typing.
            if (e.target.value.length >= e.target.maxLength) {
                const allInputs = Array.from(document.querySelectorAll('.ans-input:not(:disabled)'));
                const currentPos = allInputs.indexOf(e.target);
                if (currentPos !== -1 && currentPos < allInputs.length - 1) {
                    allInputs[currentPos + 1].focus();
                }
            }
        }

        function allInputsFilled() {
            const inputs = quizState[currentIndex].inputs;
            return inputs[0].trim() !== '' && inputs[1].trim() !== '' && inputs[2].trim() !== '';
        }

        function navigate(dir) {
            const nextIndex = currentIndex + dir;
            if (nextIndex < 0 || nextIndex >= quizData.length) return;

            const currentState = quizState[currentIndex];

            // The learner can move forward only after solving the current sub-question.
            if (dir === 1 && !currentState.isSolved) return;

            // A solved question is permanently read-only. Going back to a), b), or c)
            // only shows the saved answers; they cannot be changed.
            if (currentState.isSolved) currentState.isLocked = true;

            currentIndex = nextIndex;
            loadQuestion();
        }

        function checkAnswers() {
            const q = quizData[currentIndex];
            const inputs = document.querySelectorAll('.ans-input');
            let allCorrect = true;

            inputs.forEach((inp, i) => {
                const userValue = inp.value.trim();
                const correctValue = q.targets[i];

                // Leading zeros are valid: 09 means the same number as 9.
                if (userValue === '' || Number(userValue) !== Number(correctValue)) {
                    allCorrect = false;
                }
            });

            if (!allCorrect) {
                showPopup('wrong', '😟', 'Oops!', 'Check your counting and math, then try again!', false);
                playTone('wrong');
                speak("Try again.");
                quizState[currentIndex].inputs = ['', '', ''];
                inputs.forEach(inp => inp.value = '');
                submitBtn.disabled = true;
                return;
            }

            // SUCCESS! Lock state
            quizState[currentIndex].isSolved = true;
            quizState[currentIndex].isLocked = true;
            inputs.forEach(inp => inp.disabled = true);
            submitBtn.disabled = true;
            nextBtn.disabled = currentIndex === quizData.length - 1;
            
            // Auto-build the result abacus
            const resultCol = document.getElementById('result-col');
            resultCol.innerHTML = `
                ${buildAbacusHTML(q.groups[2], true)}
                <input type="text" class="ans-input" value="${q.targets[2]}" disabled>
            `;
            // Play clack sounds while showing feedback immediately.
            const totalBeads = q.groups[2].t + q.groups[2].o;
            for(let i=0; i<totalBeads; i++) {
                setTimeout(() => playTone('clack'), i * 100);
            }

            showPopup('correct', '🌟', 'Amazing!', 'You got it exactly right! ✨', false);
            playTone('correct');
            speak("Correct");
            showSmallConfetti(false);

            if (currentIndex === quizData.length - 1) {
                setTimeout(() => {
                    closePopup();
                    showSmallConfetti(true);
                    showPopup('complete', '🏆','Congratulations!', 'Fantastic job! You solved all questions! 🎉', true);
                    playTone('correct');
                    
                }, 1800);
            } else {
                setTimeout(() => navigate(1), 2000);
            }
        }

        function showPopup(status, icon, title, subtitle, isFinal = false) {
            const popup = document.getElementById('popup');
            const card = document.getElementById('popupCard');

            card.className = `popup-card ${status}${isFinal ? ' complete' : ''}`;
            document.getElementById('popupIcon').innerText = icon;
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupSubtitle').innerText = subtitle;

            playAgainBtn.style.display = isFinal ? 'inline-block' : 'none';
            popup.classList.add('active');

            clearTimeout(popupTimer);
            if (!isFinal) {
                popupTimer = setTimeout(() => closePopup(), 2000);
            }
        }

        function closePopup() { document.getElementById('popup').classList.remove('active'); }

        function restartGame() {
            closePopup();
            const confettiContainer = document.getElementById('confettiContainer');
            if (confettiContainer) confettiContainer.innerHTML = '';
            quizState = Array.from({ length: quizData.length }, () => ({
                isSolved: false, isLocked: false, inputs: ['', '', '']
            }));
            currentIndex = 0;
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
