<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture Addition</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --orange:#e67e22;
    --orange-dark:#d35400;
    --green:#00b894;
    --green-dark:#008f72;
    --grey:#b2bec3;
    --grey-dark:#636e72;
    --ink:#34495e;
    --cream:#fbf8eb;
    --red:#ff6b7a;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Livvic",sans-serif}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--cream)}

.app{
    width:100vw;height:100vh;overflow:hidden;position:relative;
    display:flex;flex-direction:column;

}

.sparkle{position:absolute;pointer-events:none;z-index:0;animation:float 3s ease-in-out infinite}
.s1{left:8%;top:20%;font-size:35px}.s2{right:11%;top:28%;font-size:36px;animation-delay:.8s}.s3{left:12%;bottom:22%;font-size:28px;animation-delay:1.4s}
@keyframes float{50%{transform:translateY(-8px)}}

main{
    flex:1;min-height:0;width:100%;max-width:1500px;margin:auto;
    display:flex;flex-direction:column;justify-content:center;
    padding:10px 4vw 0;position:relative;z-index:1;
}
.heading{text-align:center;flex-shrink:0;margin-bottom:8px}
.heading h1{color:var(--ink);font-size:22px;font-weight:600;line-height:1.15}
.heading p{margin-top:6px;color:#66717c;font-size:clamp(20px,1.5vw,25px);font-weight:600}

.quiz{
    flex:1;min-height:0;display:grid;align-items:center;
    grid-template-columns:minmax(170px,1fr) auto minmax(170px,1fr) auto minmax(220px,.82fr);
    gap:clamp(14px,2.8vw,46px);
}
.picture{
    min-width:0;min-height:220px;display:flex;align-items:center;justify-content:center;
}
.picture img{
    width:100%;max-width:500px;max-height:325px;object-fit:contain;display:block;
    filter:drop-shadow(0 12px 10px rgba(0,0,0,.10));
    animation:picFloat 3s ease-in-out infinite;
}
.right img{animation-delay:.6s}
@keyframes picFloat{50%{transform:translateY(-6px)}}

.symbol{
    width:clamp(60px,7vw,90px);height:clamp(60px,7vw,90px);border-radius:50%;
    background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-size:clamp(38px,4vw,56px);font-weight:400;
}
.plus{color:var(--orange);box-shadow:0 9px 0 rgba(211,84,0,.18),0 14px 24px rgba(0,0,0,.08)}
.equal{color:#6c5ce7;box-shadow:0 9px 0 rgba(108,92,231,.18),0 14px 24px rgba(0,0,0,.08)}

.answer-zone{
    min-height:245px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.answer-title{color:#555;font-size:clamp(13px,1.35vw,17px);font-weight:600;letter-spacing:.2px;margin-bottom:10px}

.answer-target{
    width:clamp(88px,8vw,112px);height:clamp(88px,8vw,112px);border-radius:50%;
    border:4px solid #e7d6c1;background:#fff;color:var(--orange);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;margin-bottom:18px;font-size:clamp(32px,3.5vw,48px);font-weight:500;
    box-shadow:0 8px 0 #e5d8c8,0 14px 22px rgba(0,0,0,.08);transition:.22s ease;
}
.answer-target:hover:not(:disabled){border-color:var(--orange);transform:translateY(-3px)}
.answer-target.active{
    border-color:var(--orange);background:#fffaf4;transform:scale(1.06);
    box-shadow:0 0 0 8px rgba(230,126,34,.12),0 8px 0 var(--orange-dark),0 14px 24px rgba(0,0,0,.1);
}
.answer-target.has-answer{border-color:var(--orange);background:#fffaf4}
.answer-target.correct{
    border-color:var(--green);color:#009b7c;background:#ecfff8;
    box-shadow:0 0 0 8px rgba(0,184,148,.10),0 8px 0 var(--green-dark),0 14px 24px rgba(0,0,0,.08);
}
.answer-target.wrong{
    border-color:var(--red);color:#d63045;background:#fff1f3;
    box-shadow:0 0 0 7px rgba(255,107,122,.10),0 8px 0 #e55363,0 14px 22px rgba(0,0,0,.08);
}
.answer-target.attention{animation:attention .45s ease}
@keyframes attention{25%{transform:scale(1.12)}50%{transform:scale(.96)}75%{transform:scale(1.07)}}

.options{display:flex;flex-wrap:wrap;justify-content:center;gap:13px;max-width:320px}
.option{
    width:clamp(58px,5vw,76px);height:clamp(58px,5vw,76px);border-radius:17px;
    border:3px solid #e7d6c1;background:#fff;color:#2d3436;font-size:clamp(22px,2.5vw,32px);font-weight:400;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 0 #e5d8c8,0 10px 16px rgba(0,0,0,.07);transition:.2s ease;
}
.option:hover:not(:disabled){border-color:var(--orange);color:var(--orange);transform:translateY(-4px)}
.option.selected{border-color:var(--orange);color:var(--orange);background:#fff5e9}
.option.wrong-option{border-color:var(--red);color:#d63045;background:#fff1f3;position:relative;opacity:.72}
.option.wrong-option::after{
    content:"✕";position:absolute;top:-10px;right:-8px;width:28px;height:28px;border-radius:50%;
    background:var(--red);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:500
}
.option.correct-option{border-color:var(--green);color:#009b7c;background:#ecfff8}
.option:disabled{cursor:default}

.message{min-height:23px;margin-top:9px;font-size:15px;font-weight:500;max-width:330px}
.message.hint{color:#c26a16}.message.wrong{color:#d63045}.message.correct{color:#009b7c}

footer{
    width:100%;display:flex;justify-content:space-between;align-items:center;
    padding:10px 8vw 16px;position:relative;z-index:10;flex-shrink:0;
}
.nav-btn{
    background:var(--orange);color:#fff;border:none;padding:10px 35px;font-size:20px;font-weight:500;
    border-radius:40px;cursor:pointer;box-shadow:0 6px 0 var(--orange-dark);transition:all .1s ease;
    min-width:178px;height:45px;
}
.nav-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--orange-dark)}
.nav-btn:disabled{background:var(--grey);box-shadow:0 6px 0 var(--grey-dark);cursor:not-allowed;opacity:.7}
.check-btn{background:var(--green);box-shadow:0 6px 0 var(--green-dark);display:none}
.check-btn:active:not(:disabled){box-shadow:0 2px 0 var(--green-dark)}
.check-btn:disabled{background:var(--grey);box-shadow:0 6px 0 var(--grey-dark)}

 .popup-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.popup-overlay.active{opacity:1;pointer-events:auto}
.popup-card{position:relative;width:90%;max-width:520px;padding:40px 30px;border-radius:36px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.1);transform:scale(.8);transition:transform .35s cubic-bezier(.175,.885,.32,1.275);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.popup-card::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;top:-60px;right:-50px;pointer-events:none}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}.confetti i{position:absolute;width:8px;height:16px;top:-20px;border-radius:2px;animation:confettiFall 1.8s ease-out forwards}.confetti i:nth-child(1){left:12%;animation-delay:.05s}.confetti i:nth-child(2){left:25%;animation-delay:.15s}.confetti i:nth-child(3){left:38%;animation-delay:.25s}.confetti i:nth-child(4){left:52%;animation-delay:.1s}.confetti i:nth-child(5){left:67%;animation-delay:.2s}.confetti i:nth-child(6){left:82%;animation-delay:.3s}.confetti i:nth-child(1),.confetti i:nth-child(4){background:#00b894}.confetti i:nth-child(2),.confetti i:nth-child(5){background:#e67e22}.confetti i:nth-child(3),.confetti i:nth-child(6){background:#6c5ce7}@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:1}100%{transform:translateY(430px) rotate(540deg);opacity:0}}
.popup-card::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;bottom:-70px;left:-40px;pointer-events:none}
.popup-card.correct{background:#edfbf4;border:6px solid #00c885}
.popup-card.correct::before,.popup-card.correct::after{background:rgba(162,245,209,.45)}
.popup-card.wrong{background:#fff0f2;border:6px solid #ff6b7a}
.popup-card.wrong::before,.popup-card.wrong::after{background:rgba(255,196,203,.45)}
.popup-card.complete{background:#f0f3ff;border:6px solid #6c5ce7}
.popup-card.complete::before,.popup-card.complete::after{background:rgba(162,155,254,.35)}
.popup-overlay.active .popup-card{transform:scale(1)}
.popup-icon{font-size:4.8rem;margin-bottom:12px;z-index:2;line-height:1;filter:drop-shadow(0 5px 5px rgba(0,0,0,.08))}
.popup-title{margin:0 0 8px;font-size:3rem;font-weight:600;z-index:2;letter-spacing:-.5px}
.popup-subtitle{margin:0;font-size:1.4rem;font-weight:500;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px}
.popup-card.correct .popup-title{color:#00a86b}.popup-card.correct .popup-subtitle{color:#2e7d5b}
.popup-card.wrong .popup-title{color:#d33847}.popup-card.wrong .popup-subtitle{color:#a33b45}
.popup-card.complete .popup-title{color:#6c5ce7}.popup-card.complete .popup-subtitle{color:#4834d4}
.replay-btn{margin-top:20px;padding:10px 30px;border:none;border-radius:30px;background:#0984e3;color:white;font-size:18px;font-weight:600;cursor:pointer;box-shadow:0 5px #0975c7;z-index:2}
.replay-btn:active{transform:translateY(3px);box-shadow:0 2px #0975c7}
@media(max-width:1050px){
    .quiz{
        grid-template-columns:1fr auto 1fr;
        grid-template-areas:"left plus right" ". equal ." "answer answer answer";
        gap:10px;
    }
    .left{grid-area:left}.plus{grid-area:plus}.right{grid-area:right}.equal{grid-area:equal;margin:auto}.answer-zone{grid-area:answer}
    .picture{min-height:150px}.picture img{max-height:175px}.answer-zone{min-height:185px}
}
@media(min-width:1400px){
    /*
       Large monitor layout:
       Keep the heading, quiz content and footer visually balanced instead
       of letting .quiz consume all remaining vertical space.
    */
    main{
        max-width:1700px;
        padding:10px 2vw 0;
        justify-content:center;
    }

    .heading{
        margin-bottom:4px;
    }

    .heading h1{font-size:30px}
    .heading p{font-size:25px;margin-top:6px}

    .quiz{
        flex:0 0 auto;
        width:100%;
        min-height:520px;
        grid-template-columns:minmax(300px,1.25fr) auto minmax(300px,1.25fr) auto minmax(240px,.72fr);
        gap:clamp(18px,2.2vw,38px);
    }

    .picture{
        min-height:360px;
        width:100%;
    }

    .picture img{
        width:100%;
        max-width:100%;
        max-height:430px;
    }

    .answer-zone{
        min-height:300px;
    }

    .nav-btn{min-width:200px;height:60px}
}

#confettiContainer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90}
.confetti-piece{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;will-change:transform,opacity}
.final-confetti-piece{width:10px;height:16px;animation-duration:2300ms}
.final-confetti-piece:nth-child(3n){border-radius:50%}
.final-confetti-piece:nth-child(4n){width:7px;height:19px;border-radius:1px}
.final-confetti-piece:nth-child(5n){width:13px;height:8px;border-radius:2px}
@keyframes pageConfetti{0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg) scale(1)}55%{opacity:1}100%{opacity:0;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72)}}
.final-confetti-piece::after{content:'';position:absolute;inset:0;border-radius:inherit;background:inherit}
.popup-card.complete{box-shadow:0 20px 45px rgba(108,92,231,.18),0 0 0 8px rgba(162,155,254,.12)}
.popup-card.complete .replay-btn{margin-top:12px}
.popup-card.complete .popup-icon{animation:finalTrophyBounce 1.2s ease-in-out infinite}
@keyframes finalTrophyBounce{0%,100%{transform:translateY(0) rotate(0deg) scale(1)}50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}}

/* ===== LESSON 3 HEADINGS: normal weight (400), no bold ===== */
header h1,
header h2,
header h3,
header p,
header .instruction,
header .instruction-text,
.heading h1,
.heading h2,
.heading p {
    font-weight: 400 !important;
}
header h1 *,
header h2 *,
header h3 *,
header p *,
header .instruction *,
header .instruction-text *,
.heading h1 *,
.heading h2 *,
.heading p * {
    font-weight: 400 !important;
}

/* ===== Left and right pictures render at the SAME size =====
   The artwork was stretched to the column width, so a picture holding one
   big item came out far larger than a picture holding several small ones.
   The items are drawn at different scales inside each PNG and some sit in
   two rows, so the exact size is worked out per question by fitPictures()
   in the script below; this just clears the old stretching. */
.picture img {
    width: auto;
    max-width: 100%;
    max-height: none;
    object-fit: contain;
}

/* ===== LESSON 3: Play Again only on final popup (20px) ===== */
.popup-card .replay-btn,
.popup-card #playAgainBtn {
    display: none !important;
}
.popup-card.complete .replay-btn,
.popup-card.complete #playAgainBtn {
    display: inline-flex !important;
    margin-top: 12px !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 40px !important;
    background: #0984e3 !important;
    color: #ffffff !important;
    font-size: 20px !important;
    font-weight: 600 !important;
    cursor: pointer;
    box-shadow: 0 6px 0 #0975c7 !important;
    z-index: 5;
    min-width: 178px !important;
    width: 178px !important;
    height: 45px !important;
    align-items: center;
    justify-content: center;
    transition: all 0.1s ease;
}
.popup-card.complete .replay-btn:active,
.popup-card.complete #playAgainBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #0975c7 !important;
}
</style>
</head>
<body>

<div id="confettiContainer"></div>
<div class="app">
    <!-- <div class="sparkle s1">✨</div>
    <div class="sparkle s2">⭐</div>
    <div class="sparkle s3">✦</div> -->

    <main>
        <div class="heading">
            <h1>Count and circle the correct number</h1>
        </div>

        <section class="quiz">
            <div class="picture left"><img id="leftImage" alt="Left question picture"></div>
            <div class="symbol plus">+</div>
            <div class="picture right"><img id="rightImage" alt="Right question picture"></div>
            <div class="symbol equal">=</div>

            <div class="answer-zone">
                <div class="answer-title">Click Circle, then click a number</div>
                <button id="answerTarget" class="answer-target" type="button" aria-label="Empty answer circle">
                    <span id="targetNumber"></span>
                </button>
                <div id="options" class="options"></div>
                <div id="message" class="message"></div>
            </div>
        </section>
    </main>

    <footer>
        <button id="prevBtn" class="nav-btn" type="button">PREV</button>
        <button id="submitBtn" class="nav-btn check-btn" type="button">SUBMIT</button>
        <button id="nextBtn" class="nav-btn" type="button">NEXT</button>
    </footer>
</div>

<div id="popupOverlay" class="popup-overlay">
    <div id="popupCard" class="popup-card">
        <div class="confetti"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div id="popupIcon" class="popup-icon">⭐</div>
        <h2 id="popupTitle" class="popup-title">Amazing!</h2>
        <p id="popupSubtitle" class="popup-subtitle">You got it right!</p>
        <button id="playAgainBtn" class="nav-btn replay-btn" type="button" style="display:none">PLAY AGAIN</button>
    </div>
</div>

<script>
"use strict";
function showSmallConfetti(isFinal = false) {
    const confettiContainer = document.getElementById('confettiContainer');
    if (!confettiContainer) return;
    confettiContainer.innerHTML = '';
    const count = isFinal ? 95 : 42;
    const colors = ['#00b894','#e67e22','#6c5ce7','#0984e3','#fdcb6e','#ff6b7a','#00cec9','#a29bfe'];
    for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');
        piece.className = isFinal ? 'confetti-piece final-confetti-piece' : 'confetti-piece';
        const startX = Math.random() * 100;
        const startY = -8 + Math.random() * 10;
        const drift = (Math.random() * 520 - 260) * (isFinal ? 1.15 : 0.9);
        const fall = window.innerHeight * (0.82 + Math.random() * 0.48);
        const rotation = Math.random() * 1400 - 700;
        piece.style.left = startX + '%';
        piece.style.top = startY + '%';
        piece.style.setProperty('--x', drift + 'px');
        piece.style.setProperty('--y', fall + 'px');
        piece.style.setProperty('--r', rotation + 'deg');
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = (Math.random() * (isFinal ? 500 : 220)) + 'ms';
        confettiContainer.appendChild(piece);
        setTimeout(() => piece.remove(), isFinal ? 2900 : 2050);
    }
}


/* ==========================================================
   CHANGE ONLY THESE IMAGE PATHS AND ANSWERS IF REQUIRED
========================================================== */
const questions = [
    { leftImage:"../images/question1-left.png", rightImage:"../images/question1-right.png", options:[4,5,6], answer:4 },
    { leftImage:"../images/question2-left.png", rightImage:"../images/question2-right.png", options:[7,8,9], answer:9 },
    { leftImage:"../images/question3-left.png", rightImage:"../images/question3-right.png", options:[7,6,5], answer:7 },
    { leftImage:"../images/question4-left.png", rightImage:"../images/question4-right.png", options:[5,8,3], answer:8 },
    { leftImage:"../images/question5-left.png", rightImage:"../images/question5-right.png", options:[4,5,6], answer:5 },
    { leftImage:"../images/question6-left.png", rightImage:"../images/question6-right.png", options:[6,7,8], answer:6 }
];

/* STATE */
let currentIndex = 0;
let selectedAnswer = null;
let targetActive = false;
let popupTimer = null;
let states = questions.map(() => ({
    selected:null,
    wrongAnswers:[],
    correct:false
}));

/* ELEMENTS */
const $ = id => document.getElementById(id);
const leftImage = $("leftImage");
const rightImage = $("rightImage");
const answerTarget = $("answerTarget");
const targetNumber = $("targetNumber");
const optionsBox = $("options");
const message = $("message");
const prevBtn = $("prevBtn");
const submitBtn = $("submitBtn");
const nextBtn = $("nextBtn");
const popupOverlay = $("popupOverlay");
const popupCard = $("popupCard");
const popupIcon = $("popupIcon");
const popupTitle = $("popupTitle");
const popupSubtitle = $("popupSubtitle");
const playAgainBtn = $("playAgainBtn");

function speak(text){
    if(!("speechSynthesis" in window)) return;
    try{
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-US";
        u.volume = .45;
        u.rate = 1;
        u.pitch = 1;
        window.speechSynthesis.speak(u);
    }catch(e){}
}

function tone(correct){
    try{
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if(!Ctx) return;
        const ctx = new Ctx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = correct ? "sine" : "sawtooth";
        osc.frequency.setValueAtTime(correct ? 620 : 220, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(correct ? 900 : 120, ctx.currentTime + .22);
        gain.gain.setValueAtTime(.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .32);
        osc.start();
        osc.stop(ctx.currentTime + .32);
        osc.addEventListener("ended", () => ctx.close());
    }catch(e){}
}

function setMessage(text="", type=""){
    message.textContent = text;
    message.className = "message" + (type ? " " + type : "");
}


/* Canvas size and the size a single item is drawn at, per picture, measured
   from the PNGs themselves. fitPictures() uses these to render both sides so
   that one item on the left looks exactly as big as one item on the right. */
const pictureMetrics = [
    { l:[2172,724,492], r:[1774,887,733] },
    { l:[2112,744,524], r:[2172,724,565] },
    { l:[2073,758,737], r:[1774,887,465] },
    { l:[1818,865,537], r:[2204,713,490] },
    { l:[2172,724,594], r:[1964,801,624] },
    { l:[2179,722,520], r:[2172,724,767] }
];

function fitPictures(){
    const m = pictureMetrics[currentIndex];
    if(!m) return;

    const box = leftImage.parentElement;
    const colW = box.clientWidth;
    if(!colW) return;

    const w = window.innerWidth;
    const maxH = w >= 1400 ? 430 : (w <= 1050 ? 175 : 325);

    /* Pick the biggest item size that still lets BOTH pictures fit their
       column and the height allowance. */
    const cap = ([cw, ch, item]) => Math.min(colW * item / cw, maxH * item / ch);
    const target = Math.min(cap(m.l), cap(m.r));

    const apply = (img, [cw, ch, item]) => {
        const scale = target / item;
        img.style.width  = Math.round(cw * scale) + "px";
        img.style.height = Math.round(ch * scale) + "px";
    };
    apply(leftImage,  m.l);
    apply(rightImage, m.r);
}

window.addEventListener("resize", fitPictures);

function renderQuestion(){
    const q = questions[currentIndex];
    const state = states[currentIndex];

    selectedAnswer = state.selected;
    targetActive = false;

    leftImage.src = q.leftImage;
    rightImage.src = q.rightImage;
    fitPictures();

    answerTarget.disabled = state.correct;
    answerTarget.className = "answer-target";
    targetNumber.textContent = "";

    if(state.correct){
        targetNumber.textContent = q.answer;
        answerTarget.classList.add("has-answer","correct");
        setMessage("Excellent! You got it right!","correct");
    }else if(state.selected !== null){
        targetNumber.textContent = state.selected;
        answerTarget.classList.add("has-answer");
        setMessage("");
    }else{
        setMessage("");
    }

    optionsBox.innerHTML = "";
    q.options.forEach(value => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        btn.textContent = value;

        if(state.wrongAnswers.includes(value)){
            btn.classList.add("wrong-option");
            btn.disabled = true;
        }
        if(state.selected === value && !state.correct){
            btn.classList.add("selected");
        }
        if(state.correct && value === q.answer){
            btn.classList.add("correct-option");
        }
        if(state.correct) btn.disabled = true;

        btn.addEventListener("click", () => chooseAnswer(value));
        optionsBox.appendChild(btn);
    });

    updateNavigation();
}

function activateTarget(){
    const state = states[currentIndex];
    if(state.correct) return;

    targetActive = true;
    answerTarget.classList.remove("wrong");
    answerTarget.classList.add("active");
    setMessage("Now choose one number.","hint");
}

function chooseAnswer(value){
    const state = states[currentIndex];
    if(state.correct || state.wrongAnswers.includes(value)) return;

    selectedAnswer = value;
    state.selected = value;
    targetNumber.textContent = value;

    answerTarget.classList.remove("wrong");
    answerTarget.classList.add("has-answer","active");

    [...optionsBox.querySelectorAll(".option")].forEach(btn => {
        btn.classList.toggle("selected", Number(btn.textContent) === value);
    });

    setMessage("");
    updateNavigation();

    /* Numbers can be clicked directly; validate immediately. */
    submitAnswer();
}

function submitAnswer(){
    const q = questions[currentIndex];
    const state = states[currentIndex];
    if(state.correct || selectedAnswer === null) return;

    if(selectedAnswer === q.answer){
        state.correct = true;
        state.selected = q.answer;
        targetNumber.textContent = q.answer;
        answerTarget.className = "answer-target has-answer correct";
        answerTarget.disabled = true;
        [...optionsBox.querySelectorAll(".option")].forEach(btn => {
            btn.disabled = true;
            btn.classList.remove("selected");
            if(Number(btn.textContent) === q.answer) btn.classList.add("correct-option");
        });
    
        tone(true);
        speak("Correct");
        showSmallConfetti(false);
        updateNavigation();

        setTimeout(() => {
            if(currentIndex === questions.length - 1 && states.every(s => s.correct)){
                showPopup("correct","🌟","Amazing!","You got it right! ✨",false);
                setTimeout(() => {
                    closePopup();
                    showSmallConfetti(true);
                    showPopup("complete","🏆","Congratulations!","Fantastic job! You solved all questions! 🎉",true);
                },1600);
            }else{
                showPopup("correct","🌟","Amazing!","You got it right! ✨",false);
            }
        },220);
        return;
    }

    const wrong = selectedAnswer;
    if(!state.wrongAnswers.includes(wrong)) state.wrongAnswers.push(wrong);
    state.selected = null;
    selectedAnswer = null;
    targetActive = false;

    targetNumber.textContent = wrong;
    answerTarget.className = "answer-target wrong";
    [...optionsBox.querySelectorAll(".option")].forEach(btn => {
        if(Number(btn.textContent) === wrong){
            btn.classList.remove("selected");
            btn.classList.add("wrong-option");
            btn.disabled = true;
        }
    });

    setMessage("Wrong answer. Click the circle and try another number.","wrong");
    tone(false);
    speak("Try again");
    updateNavigation();
    showPopup("wrong","😟","Keep Going!","Try again, you can do it! 🌈",false);
}

function updateNavigation(){
    const state = states[currentIndex];
    prevBtn.disabled = currentIndex === 0;
    submitBtn.disabled = state.correct || selectedAnswer === null;
    nextBtn.disabled = currentIndex >= questions.length - 1 || !state.correct;
}

function move(direction){
    const next = currentIndex + direction;
    if(next < 0 || next >= questions.length) return;
    if(direction > 0 && !states[currentIndex].correct) return;
    currentIndex = next;
    renderQuestion();
}

function showPopup(type, icon, title, subtitle, finalPopup){
    if(finalPopup){
        prevBtn.disabled = true;
        nextBtn.disabled = true;
    }
    clearTimeout(popupTimer);
    popupCard.className = "popup-card " + type + (finalPopup ? " complete" : "");
    popupIcon.textContent = icon;
    popupTitle.textContent = title;
    popupSubtitle.textContent = subtitle;
    playAgainBtn.style.display = finalPopup ? "inline-block" : "none";
    popupOverlay.classList.add("active");

    if(!finalPopup){
        popupTimer = setTimeout(closePopup,1800);
    }
}

function closePopup(){
    popupOverlay.classList.remove("active");
}

function restartGame(){
    clearTimeout(popupTimer);
    prevBtn.disabled = false;
    nextBtn.disabled = false;
    const confettiContainer = document.getElementById("confettiContainer");
    if (confettiContainer) confettiContainer.innerHTML = "";
    closePopup();
    currentIndex = 0;
    selectedAnswer = null;
    targetActive = false;
    states = questions.map(() => ({selected:null,wrongAnswers:[],correct:false}));
    renderQuestion();
}

/* EVENTS */
answerTarget.addEventListener("click", activateTarget);
prevBtn.addEventListener("click", () => move(-1));
nextBtn.addEventListener("click", () => move(1));
submitBtn.addEventListener("click", submitAnswer);
playAgainBtn.addEventListener("click", restartGame);

/* START */
window.addEventListener("DOMContentLoaded", renderQuestion);
</script>
</body>
</html>
