<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Lines</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
        }

        body {
          
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2vh 2vw;
            overflow: hidden; /* STRICTLY Prevents Scrolling */
            color: #1e293b;
        }

        header {
            text-align: center;
            z-index: 10;
            flex-shrink: 0;
            margin-bottom: 1vh;
        }

        /* Specific Heading Sizing Requested */
        h1 {
            color: #2f4f4f;
            font-weight: 600;
         
            margin-bottom: 6px;
            font-size: 22px;
        }

        @media screen and (max-width: 1599px) { h1 { font-size: 22px; } }
        @media screen and (min-width: 1600px) { h1 { font-size: 30px; } }

        .instruction {
            font-size: clamp(20px, 1.5vw, 25px);
            color: #64748b;
            font-weight: 500;
           
           
            display: inline-block;
        }

        

        /* Main Game Stage */
        .game-stage {
            width: 100%;
            max-width: 1100px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            min-height: 0;
            position: relative;
        }

        /* Equation Layout */
        .equation-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(15px, 2.5vw, 35px);
            width: 100%;
            height: 100%;
            max-height: 50vh;
        }

        .vine-group {
            display: flex;
            align-items: center;
            gap: clamp(10px, 1.5vw, 20px);
        }

        /* Vine Canopy Container */
        .vine-canopy {
            display: flex;
            gap: clamp(8px, 1.2vw, 14px);
            align-items: flex-start;
            padding: 10px;
            position: relative;
        }

        /* Interactive Sling Vine */
        .jungle-vine {
            width: clamp(12px, 1.5vw, 18px);
            height: clamp(70px, 16vh, 130px);
            background: linear-gradient(to bottom, #15803d, #047857);
            border-radius: 10px;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.2), inset 2px 2px 5px rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.1);
            cursor: grab;
            position: relative;
            transform-origin: top center;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s;
        }

        /* Leaf accent on the vine */
        .jungle-vine::after {
            content: '🍃';
            position: absolute;
            top: 30%;
            left: -8px;
            font-size: 14px;
            pointer-events: none;
        }

        .jungle-vine:hover {
            transform: scaleY(1.08);
            background: linear-gradient(to bottom, #22c55e, #15803d);
        }

        .jungle-vine:active {
            cursor: grabbing;
            transform: scaleY(1.2) translateY(10px);
        }

        /* Pulled/Activated Vine State */
        .jungle-vine.pulled {
            background: linear-gradient(to bottom, #f59e0b, #d97706);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.7);
        }

        .jungle-vine.pulled::after {
            content: '🌸';
        }

        /* Input Controls */
        input[type="text"] {
            width: clamp(70px, 8vw, 90px);
            height: clamp(55px, 6.5vw, 70px);
            font-size: 30px;
            font-weight: 500;
            text-align: center;
            border: 4px solid #f59e0b;
            border-radius: 18px;
            background: #ffffff;
            color: #2f4f4f;
            outline: none;
            box-shadow: 0 6px 0 #d97706, 0 10px 15px rgba(0,0,0,0.05);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        input[type="text"]:focus {
            transform: translateY(-4px);
            border-color: #fbbf24;
            box-shadow: 0 10px 0 #d97706, 0 0 20px rgba(245, 158, 11, 0.4);
        }

        input[type="text"]:disabled {
            background-color: #f0fdf4;
            border-color: #10b981;
            color: #047857;
            box-shadow: 0 6px 0 #059669;
            cursor: not-allowed;
            transform: none;
        }

        /* Operators (+ and =) */
        .operator {
            font-size: clamp(3rem, 5vw, 4.5rem);
            font-weight: 500;
            color: #059669;
            text-shadow: 0 2px 0 #ffffff;
            flex-shrink: 0;
        }

        /* Corner Navigation Layout */
        .bottom-controls {
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 1vh 2vw 2vh 2vw;
            z-index: 20;
            flex-shrink: 0;
        }

        .left-control { justify-self: start; }
        .center-control { justify-self: center; }
        .right-control { justify-self: end; }

        /* Strict Button Sizing Rules (Laptop: 20px, Monitor: 30px) */
        .nav-btn, .submit-btn, .replay-btn {
            font-weight: 500; border: none; cursor: pointer; transition: all 0.1s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 20px;  min-width:178px;height:45px; border-radius: 40px;
        }

        @media screen and (min-width: 1600px) {
            .nav-btn, .submit-btn {
                font-size: 30px; padding: 15px 45px; border-radius: 50px;
            }
        }


        /* =========================================================
           MONITOR / LARGE-SCREEN LAYOUT
           The monitor gets a dedicated composition:
           header -> large game area -> bottom controls.
           This prevents the equation from looking tiny in the
           middle of a large empty screen.
        ========================================================= */
        @media screen and (min-width: 1600px) {
            body {
                padding: 1vh 2vw;
                justify-content: flex-start;
            }

            header {
                width: 100%;
                margin-bottom: 0;
                flex: 0 0 auto;
            }

            h1 {
                font-size: 30px;
                margin-bottom: 4px;
            }

            .instruction {
                font-size: 25px;
            }

            .game-stage {
                width: 96%;
                max-width: 1750px;
                height: 69vh;
                flex: 0 0 69vh;
                min-height: 0;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .equation-row {
                width: 100%;
                height: 100%;
                max-height: none;
                gap: clamp(45px, 4vw, 80px);
                align-items: center;
                justify-content: center;
            }

            .vine-group {
                gap: clamp(22px, 2vw, 34px);
            }

            .vine-canopy {
                gap: clamp(10px, 1.2vw, 20px);
                padding: 14px;
                align-items: flex-start;
            }

            .jungle-vine {
                width: clamp(22px, 1.5vw, 30px);
                height: clamp(210px, 27vh, 285px);
                border-radius: 11px;
            }

            .jungle-vine::after {
                font-size: clamp(18px, 1.2vw, 24px);
                left: -12px;
            }

            input[type="text"] {
                width: clamp(115px, 7vw, 140px);
                height: clamp(85px, 9vh, 105px);
                font-size: clamp(40px, 3vw, 52px);
                border-width: 4px;
                border-radius: 22px;
                box-shadow: 0 8px 0 #d97706, 0 12px 18px rgba(0,0,0,0.05);
            }

            input[type="text"]:focus {
                box-shadow: 0 12px 0 #d97706, 0 0 24px rgba(245, 158, 11, 0.4);
            }

            input[type="text"]:disabled {
                box-shadow: 0 8px 0 #059669;
            }

            .operator {
                font-size: clamp(5rem, 6vw, 7rem);
            }

            .bottom-controls {
                width: 96%;
                max-width: 1750px;
                height: 11vh;
                padding: 1vh 0 1.5vh;
                flex: 0 0 11vh;
            }

            .nav-btn, .submit-btn {
                font-size: 30px;
                padding: 15px 45px;
                min-width: 178px;
                height: 58px;
                border-radius: 50px;
            }
        }

        /* Specific Button Colors & 3D Shadows */
        .nav-btn.prev { background: #64748b; color: #ffffff; box-shadow: 0 8px 0 #475569; }
        .nav-btn.prev:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #475569; }

        .nav-btn.next { background: #f97316; color: #ffffff; box-shadow: 0 8px 0 #c2410c; }
        .nav-btn.next:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #c2410c; }

        .submit-btn { background: #10b981; color: #ffffff; box-shadow: 0 8px 0 #059669; }
        .submit-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #059669; }

        .replay-btn { background: #0ea5e9; color: white; box-shadow: 0 8px 0 #0284c7; margin-top: 20px; }
        .replay-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #0284c7; }

        .nav-btn:disabled, .submit-btn:disabled {
            background: #cbd5e1; box-shadow: 0 8px 0 #94a3b8; color: #f8fafc; cursor: not-allowed; opacity: 0.8;
        }

        /* Modal Overlay & Custom Popup Design */
        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
           
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100;
        }
        .popup-overlay.active { opacity: 1; pointer-events: auto; }

        .popup-card {
            position: relative; width: 90%; max-width: 520px; padding: 40px 30px;
            border-radius: 36px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transform: scale(0.8); transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #ffffff;
        }

        .popup-card::before, .popup-card::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
        .popup-card::before { width: 220px; height: 220px; top: -60px; right: -50px; }
        .popup-card::after { width: 180px; height: 180px; bottom: -70px; left: -40px; }

        .popup-card.correct { background: #edfbf4; border: 6px solid #00c885; }
        .popup-card.correct::before, .popup-card.correct::after { background: rgba(162, 245, 209, 0.45); }
        .popup-card.correct .popup-title { color: #00a86b; text-shadow: none; }
        .popup-card.correct .popup-subtitle { color: #2e7d5b; text-shadow: none; }

        .popup-card.wrong { background: #fff0f2; border: 6px solid #ff6b7a; }
        .popup-card.wrong::before, .popup-card.wrong::after { background: rgba(255, 196, 203, 0.45); }
        .popup-card.wrong .popup-title { color: #d33847; text-shadow: none; }
        .popup-card.wrong .popup-subtitle { color: #a33b45; text-shadow: none; }

        .popup-card.complete { background: #f0f3ff; border: 6px solid #6c5ce7; }
        .popup-card.complete::before, .popup-card.complete::after { background: rgba(162, 155, 254, 0.35); }
        .popup-card.complete .popup-title { color: #6c5ce7; text-shadow: none; }
        .popup-card.complete .popup-subtitle { color: #4834d4; text-shadow: none; }

        .popup-overlay.active .popup-card { transform: scale(1); }
        .popup-icon { font-size: 4.8rem; margin-bottom: 12px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.1)); }
        .popup-title { font-size: 3rem; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.5px; }
        .popup-subtitle { font-size: 1.4rem; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #333; }

        @media screen and (max-width: 768px) {
            .equation-row { flex-direction: column; max-height: none; gap: 10px; }
            .operator { transform: rotate(90deg); margin: -5px 0; }
            .jungle-vine { height: 55px; }
        }

        /* Exact same confetti effect */
        #confettiContainer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 9999;
        }

        .confetti-piece {
            position: absolute;
            width: 9px;
            height: 14px;
            border-radius: 2px;
            opacity: 0;
            animation: pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
            will-change: transform, opacity;
        }

        .final-confetti-piece {
            width: 10px;
            height: 16px;
            animation-duration: 2300ms;
        }

        .final-confetti-piece:nth-child(3n) {
            border-radius: 50%;
        }

        .final-confetti-piece:nth-child(4n) {
            width: 7px;
            height: 19px;
            border-radius: 1px;
        }

        .final-confetti-piece:nth-child(5n) {
            width: 13px;
            height: 8px;
            border-radius: 2px;
        }

        @keyframes pageConfetti {
            0% {
                opacity: 1;
                transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
            }
            55% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(0.72);
            }
        }

        .popup-card.complete {
            box-shadow:
                0 20px 45px rgba(108, 92, 231, 0.18),
                0 0 0 8px rgba(162, 155, 254, 0.12);
        }

        .popup-card.complete .replay-btn {
            margin-top: 12px;
        }

        .popup-card.complete .popup-icon {
            animation: finalTrophyBounce 1.2s ease-in-out infinite;
        }

        @keyframes finalTrophyBounce {
            0%, 100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            50% {
                transform: translateY(-5px) rotate(-4deg) scale(1.06);
            }
        }

    
/* ===== LESSON 3 HEADINGS: normal weight (400), no bold ===== */
header h1,
header h2,
header h3,
header p,
header .instruction,
header .instruction-text,
.heading h1,
.heading h2,
.heading p {
    font-weight: 400 !important;
}
header h1 *,
header h2 *,
header h3 *,
header p *,
header .instruction *,
header .instruction-text *,
.heading h1 *,
.heading h2 *,
.heading p * {
    font-weight: 400 !important;
}

/* ===== LESSON 3: Play Again only on final popup (20px) ===== */
.popup-card .replay-btn,
.popup-card #playAgainBtn {
    display: none !important;
}
.popup-card.complete .replay-btn,
.popup-card.complete #playAgainBtn {
    display: inline-flex !important;
    margin-top: 12px !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 40px !important;
    background: #0984e3 !important;
    color: #ffffff !important;
    font-size: 20px !important;
    font-weight: 600 !important;
    cursor: pointer;
    box-shadow: 0 6px 0 #0975c7 !important;
    z-index: 5;
    min-width: 178px !important;
    width: 178px !important;
    height: 45px !important;
    align-items: center;
    justify-content: center;
    transition: all 0.1s ease;
}
.popup-card.complete .replay-btn:active,
.popup-card.complete #playAgainBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #0975c7 !important;
}
</style>
</head>
<body>

    <header>
        <h1>Count the lines, write the number and find the sum</h1>
        <p class="instruction">Pull the <span>lines</span> to count, then fill in all the boxes!</p>
    </header>

    <main class="game-stage" id="stage">
        </main>

    <div class="bottom-controls">
        <div class="left-control">
            <button class="nav-btn prev" id="prevBtn" onclick="navigate(-1)" disabled>PREV</button>
        </div>
        <div class="center-control">
            <button class="submit-btn" id="submitBtn" onclick="checkAnswers()" disabled>SUBMIT</button>
        </div>
        <div class="right-control">
            <button class="nav-btn next" id="nextBtn" onclick="navigate(1)">NEXT</button>
        </div>
    </div>

    <div id="confettiContainer"></div>

    <div class="popup-overlay" id="popup">
        <div class="popup-card" id="popupCard">
            <div class="popup-icon" id="popupIcon">⭐</div>
            <h2 class="popup-title" id="popupTitle">Amazing!</h2>
            <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
            <button class="replay-btn" id="playAgainBtn" style="display: none;" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Exact Data extracted from image - NO NAMING (a, b, c removed, strict order maintained)
        const quizData = [
            { c1: 3, c2: 4, ans: 7 },
            { c1: 8, c2: 2, ans: 10 },
            { c1: 4, c2: 15, ans: 19 }
        ];

        // Track user inputs & status across questions permanently
        let quizState = Array.from({ length: quizData.length }, () => ({
            isSolved: false,
            v1: '',
            v2: '',
            v3: ''
        }));

        let currentIndex = 0;
        let popupTimer = null;
        let finalTimer = null;
        let audioCtx = null;

        const stageEl = document.getElementById('stage');
        const submitBtn = document.getElementById('submitBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');

        // Bouncy Jungle Audio Engine
        function playTone(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2); 
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'twang') {
                    // Vine Boing Sound
                    osc.type = 'sine'; osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(650, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                }
            } catch(e) { console.log('Audio error:', e); }
        }

        function speak(t) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(t);
                msg.lang = "en-US"; msg.volume = 0.8; msg.rate = 1; msg.pitch = 1.2;
                speechSynthesis.speak(msg);
            }
        }

        function renderVineCanopy(count) {
            let html = '<div class="vine-canopy">';
            for (let i = 0; i < count; i++) {
                html += `<div class="jungle-vine"></div>`;
            }
            html += '</div>';
            return html;
        }

        function loadQuestion() {
            const q = quizData[currentIndex];
            const state = quizState[currentIndex];

            stageEl.innerHTML = `
                <div class="equation-row">
                    <div class="vine-group">
                        <input type="text" id="inp1" inputmode="numeric" maxlength="2" value="${state.v1}">
                        ${renderVineCanopy(q.c1)}
                    </div>
                    <div class="operator">+</div>
                    <div class="vine-group">
                        <input type="text" id="inp2" inputmode="numeric" maxlength="2" value="${state.v2}">
                        ${renderVineCanopy(q.c2)}
                    </div>
                    <div class="operator">=</div>
                    <input type="text" id="inp3" inputmode="numeric" maxlength="2" value="${state.v3}">
                </div>
            `;

            const inp1 = document.getElementById('inp1');
            const inp2 = document.getElementById('inp2');
            const inp3 = document.getElementById('inp3');

            // Bind Vine Pulling Mechanics
            document.querySelectorAll('.jungle-vine').forEach(vine => {
                vine.addEventListener('click', function() {
                    this.classList.toggle('pulled');
                    playTone('twang');
                });
            });

            // Bind Inputs
            [inp1, inp2, inp3].forEach((inp, idx) => {
                inp.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    if (idx === 0) state.v1 = e.target.value;
                    if (idx === 1) state.v2 = e.target.value;
                    if (idx === 2) state.v3 = e.target.value;
                    checkSubmitState();
                });

                if (state.isSolved) {
                    inp.disabled = true;
                }
            });

            if (state.isSolved) {
                document.querySelectorAll('.jungle-vine').forEach(v => v.classList.add('pulled'));
            }

            checkSubmitState();

            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === quizData.length - 1) || !state.isSolved;
        }

        function checkSubmitState() {
            const state = quizState[currentIndex];
            const allFilled = state.v1.trim() !== '' && state.v2.trim() !== '' && state.v3.trim() !== '';
            submitBtn.disabled = state.isSolved || !allFilled;
        }

        function navigate(dir) {
            currentIndex += dir;
            loadQuestion();
        }

        function checkAnswers() {
            const q = quizData[currentIndex];
            const state = quizState[currentIndex];

            const v1Val = parseInt(state.v1);
            const v2Val = parseInt(state.v2);
            const v3Val = parseInt(state.v3);

            if (v1Val !== q.c1 || v2Val !== q.c2 || v3Val !== q.ans) {
                // Wrong answer: automatically clear all entered answers.
                state.v1 = '';
                state.v2 = '';
                state.v3 = '';

                document.getElementById('inp1').value = '';
                document.getElementById('inp2').value = '';
                document.getElementById('inp3').value = '';

                showPopup('wrong', '😟', 'Oops!', 'Count the jungle lines carefully and check your numbers!', false);
                playTone('wrong');
                speak("Try again.");
                checkSubmitState();
                document.getElementById('inp1').focus();
                return;
            }

            // SUCCESS!
            state.isSolved = true;
            document.getElementById('inp1').disabled = true;
            document.getElementById('inp2').disabled = true;
            document.getElementById('inp3').disabled = true;
            submitBtn.disabled = true;

            // Highlight all vines
            document.querySelectorAll('.jungle-vine').forEach(v => v.classList.add('pulled'));

            if (currentIndex === quizData.length - 1) {
                // LAST QUESTION: Correct popup + small confetti first.
                clearTimeout(popupTimer);
                clearTimeout(finalTimer);

                showSmallConfetti(false);
                showPopup('correct', '🌟', 'Amazing!', 'You got it exactly right! ✨', false);
                clearTimeout(popupTimer);
                popupTimer = null;

                playTone('correct');
                speak("Correct");

                // Then show the Final popup + large confetti.
                finalTimer = setTimeout(() => {
                    closePopup();
                    showSmallConfetti(true);
                    showPopup('complete', '🏆', "Congratulations!", "Fantastic job! You solved all questions! 🎉", true);
                   
                }, 1800);
            } else {
                nextBtn.disabled = false;
                showSmallConfetti(false);
                showPopup('correct', '🌟', 'Amazing!', 'You got it exactly right! ✨', false);
                playTone('correct');
                speak("Correct");
            }
        }

        function showSmallConfetti(isFinal = false) {
            const confettiContainer = document.getElementById('confettiContainer');
            if (!confettiContainer) return;

            confettiContainer.innerHTML = '';

            const count = isFinal ? 95 : 42;

            const colors = [
                '#00b894',
                '#e67e22',
                '#6c5ce7',
                '#0984e3',
                '#fdcb6e',
                '#ff6b7a',
                '#00cec9',
                '#a29bfe'
            ];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('span');

                piece.className =
                    isFinal
                        ? 'confetti-piece final-confetti-piece'
                        : 'confetti-piece';

                const startX = Math.random() * 100;
                const startY = -8 + Math.random() * 10;

                const drift =
                    (Math.random() * 520 - 260) *
                    (isFinal ? 1.15 : 0.9);

                const fall =
                    window.innerHeight *
                    (0.82 + Math.random() * 0.48);

                const rotation =
                    Math.random() * 1400 - 700;

                piece.style.left = startX + '%';
                piece.style.top = startY + '%';

                piece.style.setProperty('--x', drift + 'px');
                piece.style.setProperty('--y', fall + 'px');
                piece.style.setProperty('--r', rotation + 'deg');

                piece.style.background =
                    colors[Math.floor(Math.random() * colors.length)];

                piece.style.animationDelay =
                    (Math.random() * (isFinal ? 500 : 220)) + 'ms';

                confettiContainer.appendChild(piece);

                setTimeout(
                    () => piece.remove(),
                    isFinal ? 2900 : 2050
                );
            }
        }

        function showPopup(status, icon, title, subtitle, isFinal = false) {
            const popup = document.getElementById('popup');
            const card = document.getElementById('popupCard');

            card.className = `popup-card ${status}`;
            document.getElementById('popupIcon').innerText = icon;
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupSubtitle').innerText = subtitle;

            playAgainBtn.style.display = isFinal ? 'inline-block' : 'none';
            popup.classList.add('active');

            if (!isFinal) {
                clearTimeout(popupTimer);
                popupTimer = setTimeout(() => closePopup(), 2000);
            }
        }

        function closePopup() { 
            document.getElementById('popup').classList.remove('active'); 
        }

        function restartGame() {
            clearTimeout(popupTimer);
            clearTimeout(finalTimer);
            const confettiContainer = document.getElementById('confettiContainer');
            if (confettiContainer) confettiContainer.innerHTML = '';
            closePopup();
            quizState = Array.from({ length: quizData.length }, () => ({
                isSolved: false,
                v1: '',
                v2: '',
                v3: ''
            }));
            currentIndex = 0;
            loadQuestion();
        }

        window.onload = () => {
            loadQuestion();
        };
    </script>
</body>
</html>
