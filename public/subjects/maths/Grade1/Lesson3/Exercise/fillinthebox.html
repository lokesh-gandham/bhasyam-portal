<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel 3D Addition Game - Single Line</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
        }

        body {
            /* Beautiful Pastel Gradient Background */
            
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            overflow: hidden; /* Prevents ANY scrolling */
            color: #2c3e50;
        }

        header {
            text-align: center;
            margin-top: 15px;
            z-index: 10;
        }

        h2 {
            font-size: 22px;
            color: #2f4f4f;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .instruction {
            font-size: 1.4rem;
            color: #475569;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.65);
            padding: 8px 25px;
            border-radius: 30px;
            border: 2px solid #ffffff;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Main Playground */
        .game-stage {
            width: 100%;
            max-width: 1300px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px; 
        }

        .slide-item {
            display: none;
            width: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .slide-item.active {
            display: flex;
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Equation Layout - FORCED IN ONE LINE */
        .equation-board {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2%; /* Responsive gap */
            width: 100%;
            flex-wrap: nowrap; /* Strictly prevents wrapping to next line */
        }

        /* Group columns shrink and grow dynamically */
        .group-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            flex: 1; /* Allows columns to share space equally */
            min-width: 0; /* CRITICAL: allows flex children to shrink below their content size */
        }

        .group-col.result-col {
            flex: 1.2; /* Makes the result card slightly wider automatically */
        }

        /* 3D Glass Tile Design - Responsive Size */
        .holo-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            border: 4px solid #ffffff;
            border-radius: 30px;
            width: 100%; /* Takes full width of its flexible column */
            aspect-ratio: 4 / 3; /* Automatically maintains perfect shape without fixed height */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08), inset 0 0 15px rgba(255,255,255,0.8);
            transition: transform 0.1s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            cursor: crosshair;
            padding: 5%;
        }

        /* The single grouped image */
        .group-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures images scale beautifully inside the card */
            transform: translateZ(40px);
            filter: drop-shadow(0 12px 15px rgba(0,0,0,0.15));
            pointer-events: none;
        }

        /* Success Animation */
        .holo-card.success-pulse {
            animation: pulseGlow 1.5s infinite alternate;
            border-color: #10b981;
            background: rgba(236, 253, 245, 0.7);
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2), inset 0 0 15px rgba(255,255,255,0.8); }
            100% { box-shadow: 0 15px 35px rgba(16, 185, 129, 0.5), inset 0 0 25px rgba(16, 185, 129, 0.2); }
        }

        /* Operators */
        .operator {
            font-size: clamp(2rem, 4vw, 5rem); /* Responsive font size */
            color: #2c3e50;
            text-shadow: 0 5px 0 #ffffff, 0 10px 15px rgba(0,0,0,0.1);
            transform: translateY(-40px); 
            flex-shrink: 0; /* Prevents operators from squishing */
        }

        /* Input Controls */
        input[type="text"] {
            width: clamp(60px, 8vw, 80px); /* Responsive width */
            height: clamp(60px, 8vw, 80px); /* Responsive height */
            font-size: clamp(1.8rem, 3vw, 2.8rem);
            text-align: center;
            text-transform: uppercase;
            border: 5px solid #e67e22;
            border-radius: 20px;
            background: #ffffff;
            color: #2d3436;
            outline: none;
            box-shadow: 0 8px 0 #d35400, 0 15px 20px rgba(0,0,0,0.15);
            transition: all 0.2s;
            z-index: 3;
        }

        input[type="text"]:focus {
            transform: translateY(-4px);
            border-color: #f39c12;
            box-shadow: 0 12px 0 #d35400, 0 20px 25px rgba(0,0,0,0.2);
        }

        input[type="text"]:disabled {
            background-color: #f1f2f6;
            border-color: #00b894;
            color: #00b894;
            box-shadow: 0 8px 0 #008f72;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer & Buttons */
        footer {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            z-index: 10;
        }

        .nav-btn {
            background: #e67e22;
            color: #ffffff;
            border: none;
           width:178px;min-width:178px;height:45px;
            font-size: clamp(16px, 2vw, 20px);
            font-weight: 500;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #d35400;
            transition: all 0.1s ease;
        }

        .nav-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d35400;
        }

        .nav-btn:disabled {
            background: #b2bec3;
            box-shadow: 0 6px 0 #636e72;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .check-btn {
            background: #00b894;
            box-shadow: 0 6px 0 #008f72;
        }

        .check-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 #008f72;
        }

        .replay-btn {
            background: #0984e3;
            box-shadow: 0 6px 0 #0975c7;
            margin-top: 20px;
            z-index: 5;
        }

        .replay-btn:active {
            box-shadow: 0 2px 0 #0975c7;
        }

        @media screen and (min-width: 1400px) {
            h2 { font-size: 30px; }
            .nav-btn { width: 200px; min-width: 200px; height: 60px; }
        }

        /* Modal Overlay & Custom Popup Design */
        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
           
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100;
        }
        .popup-overlay.active { opacity: 1; pointer-events: auto; }
        
        .popup-card {
            position: relative; width: 90%; max-width: 520px; padding: 40px 30px;
            border-radius: 36px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: scale(0.8); transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .popup-card::before, .popup-card::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
        .popup-card::before { width: 220px; height: 220px; top: -60px; right: -50px; }
        .popup-card::after { width: 180px; height: 180px; bottom: -70px; left: -40px; }

        .popup-card.correct { background: #edfbf4; border: 6px solid #00c885; }
        .popup-card.correct::before, .popup-card.correct::after { background: rgba(162, 245, 209, 0.45); }
        .popup-card.correct .popup-title { color: #00a86b; text-shadow: none; }
        .popup-card.correct .popup-subtitle { color: #2e7d5b; text-shadow: none; }

        .popup-card.wrong { background: #fff0f2; border: 6px solid #ff6b7a; }
        .popup-card.wrong::before, .popup-card.wrong::after { background: rgba(255, 196, 203, 0.45); }
        .popup-card.wrong .popup-title { color: #d33847; text-shadow: none; }
        .popup-card.wrong .popup-subtitle { color: #a33b45; text-shadow: none; }

        .popup-card.complete { background: #f0f3ff; border: 6px solid #6c5ce7; }
        .popup-card.complete::before, .popup-card.complete::after { background: rgba(162, 155, 254, 0.35); }
        .popup-card.complete .popup-title { color: #6c5ce7; text-shadow: none;}
        .popup-card.complete .popup-subtitle { color: #4834d4; text-shadow: none;}

        .popup-overlay.active .popup-card { transform: scale(1); }
        .popup-icon { font-size: 4.8rem; margin-bottom: 12px; z-index: 2; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.1)); }
        .popup-title { font-size: 3rem; font-weight: 600; margin-bottom: 8px; z-index: 2; letter-spacing: -0.5px; }
        .popup-subtitle { font-size: 1.4rem; font-weight: 500; z-index: 2; display: flex; align-items: center; gap: 8px; }


        /* Exact same page confetti effect */
        #confettiContainer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 90;
        }

        .confetti-piece {
            position: absolute;
            width: 9px;
            height: 14px;
            border-radius: 2px;
            opacity: 0;
            animation: pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
            will-change: transform, opacity;
        }

        .final-confetti-piece {
            width: 10px;
            height: 16px;
            animation-duration: 2300ms;
        }

        .final-confetti-piece:nth-child(3n) {
            border-radius: 50%;
        }

        .final-confetti-piece:nth-child(4n) {
            width: 7px;
            height: 19px;
            border-radius: 1px;
        }

        .final-confetti-piece:nth-child(5n) {
            width: 13px;
            height: 8px;
            border-radius: 2px;
        }

        @keyframes pageConfetti {
            0% {
                opacity: 1;
                transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
            }
            55% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(0.72);
            }
        }

        .popup-card.complete {
            box-shadow:
                0 20px 45px rgba(108, 92, 231, 0.18),
                0 0 0 8px rgba(162, 155, 254, 0.12);
        }

        .popup-card.complete .replay-btn {
            margin-top: 12px;
        }

        .popup-card.complete .popup-icon {
            animation: finalTrophyBounce 1.2s ease-in-out infinite;
        }

        @keyframes finalTrophyBounce {
            0%, 100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            50% {
                transform: translateY(-5px) rotate(-4deg) scale(1.06);
            }
        }

    
/* ===== LESSON 3 HEADINGS: normal weight (400), no bold ===== */
header h1,
header h2,
header h3,
header p,
header .instruction,
header .instruction-text,
.heading h1,
.heading h2,
.heading p {
    font-weight: 400 !important;
}
header h1 *,
header h2 *,
header h3 *,
header p *,
header .instruction *,
header .instruction-text *,
.heading h1 *,
.heading h2 *,
.heading p * {
    font-weight: 400 !important;
}

/* ===== LESSON 3: Play Again only on final popup (20px) ===== */
.popup-card .replay-btn,
.popup-card #playAgainBtn {
    display: none !important;
}
.popup-card.complete .replay-btn,
.popup-card.complete #playAgainBtn {
    display: inline-flex !important;
    margin-top: 12px !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 40px !important;
    background: #0984e3 !important;
    color: #ffffff !important;
    font-size: 20px !important;
    font-weight: 600 !important;
    cursor: pointer;
    box-shadow: 0 6px 0 #0975c7 !important;
    z-index: 5;
    min-width: 178px !important;
    width: 178px !important;
    height: 45px !important;
    align-items: center;
    justify-content: center;
    transition: all 0.1s ease;
}
.popup-card.complete .replay-btn:active,
.popup-card.complete #playAgainBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #0975c7 !important;
}
</style>
</head>
<body>

    <div id="confettiContainer"></div>

    <header>
        <h2>Count and fill in the boxes</h2>
       
    </header>

    <main class="game-stage">
        
        <div class="slide-item active" data-q="0">
            <div class="equation-board">
                
                <div class="group-col">
                    <div class="holo-card">
                        <img src="../images/q1-left.png" alt="5 Boys" class="group-image">
                    </div>
                    <input type="text" inputmode="numeric" maxlength="2" data-target="5" class="input-box">
                </div>
                
                <div class="operator">+</div>
                
                <div class="group-col">
                    <div class="holo-card">
                        <img src="../images/q1-middle.png" alt="3 Boys" class="group-image">
                    </div>
                    <input type="text" inputmode="numeric" maxlength="2" data-target="3" class="input-box">
                </div>
                
                <div class="operator">=</div>
                
                <div class="group-col result-col">
                    <div class="holo-card">
                        <img src="../images/q1-right.png" alt="8 Boys" class="group-image">
                    </div>
                    <input type="text" inputmode="numeric" maxlength="2" data-target="8" class="input-box">
                </div>
                
            </div>
        </div>

        <div class="slide-item" data-q="1">
            <div class="equation-board">
                <div class="group-col">
                    <div class="holo-card">
                        <img src="../images/q2-left.png" alt="6 Elephants" class="group-image">
                    </div>
                    <input type="text" inputmode="numeric" maxlength="2" data-target="6" class="input-box">
                </div>
                <div class="operator">+</div>
                <div class="group-col">
                    <div class="holo-card">
                        <img src="../images/q2-middle.png" alt="9 Elephants" class="group-image">
                    </div>
                    <input type="text" inputmode="numeric" maxlength="2" data-target="9" class="input-box">
                </div>
                <div class="operator">=</div>
                <div class="group-col result-col">
                    <div class="holo-card">
                        <img src="../images/q2-right.png" alt="15 Elephants" class="group-image">
                    </div>
                    <input type="text" inputmode="numeric" maxlength="2" data-target="15" class="input-box">
                </div>
            </div>
        </div>

        <div class="slide-item" data-q="2">
            <div class="equation-board">
                <div class="group-col">
                    <div class="holo-card">
                        <img src="../images/q3-left.png" alt="4 Flowers" class="group-image">
                    </div>
                    <input type="text" inputmode="numeric" maxlength="2" data-target="4" class="input-box">
                </div>
                <div class="operator">+</div>
                <div class="group-col">
                    <div class="holo-card">
                        <img src="../images/q3-middle.png" alt="6 Flowers" class="group-image">
                    </div>
                    <input type="text" inputmode="numeric" maxlength="2" data-target="6" class="input-box">
                </div>
                <div class="operator">=</div>
                <div class="group-col result-col">
                    <div class="holo-card">
                        <img src="../images/q3-right.png" alt="10 Flowers" class="group-image">
                    </div>
                    <input type="text" inputmode="numeric" maxlength="2" data-target="10" class="input-box">
                </div>
            </div>
        </div>

    </main>

    <footer>
        <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>PREV</button>
        <button class="nav-btn check-btn" id="submitBtn" onclick="checkAnswers()" disabled>SUBMIT</button>
        <button class="nav-btn" id="nextBtn" onclick="navigate(1)" disabled>NEXT</button>
    </footer>

    <div class="popup-overlay" id="popup">
        <div class="popup-card" id="popupCard">
            <div class="popup-icon" id="popupIcon">⭐</div>
            <h2 class="popup-title" id="popupTitle">Amazing!</h2>
            <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
            <button class="nav-btn replay-btn" id="playAgainBtn" style="display: none;" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        let quizState = Array.from({ length: 3 }, () => ({
            inputs: ['', '', ''],
            isUnlocked: false
        }));

        let currentIndex = 0;
        let popupTimer = null;

        const slides = document.querySelectorAll('.slide-item');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');

        // 3D Glass Tile Tilt Effect
        document.querySelectorAll('.holo-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -15; 
                const rotateY = ((x - centerX) / centerX) * 15;

                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.03, 1.03, 1.03)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            });
        });

        // Audio & Voice Engine
        function speak(t) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(t);
                msg.lang = "en-US";
                msg.volume = 0.8;
                msg.rate = 1;
                msg.pitch = 1.2;
                speechSynthesis.speak(msg);
            }
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playAudioTone(isCorrect) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isCorrect) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2); 
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            }
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // Setup Inputs
        function bindEvents() {
            slides.forEach((slide, sIdx) => {
                const inputs = slide.querySelectorAll('.input-box');
                inputs.forEach((input, iIdx) => {
                    input.addEventListener('input', (e) => {
                        e.target.value = e.target.value.replace(/[^0-9]/g, ''); 
                        quizState[sIdx].inputs[iIdx] = e.target.value;
                        updateNavButtons();

                        // Automatically move to the next box after entering an answer.
                        if (e.target.value.length > 0 && iIdx < inputs.length - 1) {
                            inputs[iIdx + 1].focus();
                        }
                    });
                });
            });
        }
        bindEvents();

        function navigate(dir) {
            slides[currentIndex].classList.remove('active');
            currentIndex += dir;
            slides[currentIndex].classList.add('active');
            restoreCurrentSlideState();
            updateNavButtons();
            focusFirstEmptyInput();
        }

        function restoreCurrentSlideState() {
            const activeSlide = slides[currentIndex];
            const inputs = activeSlide.querySelectorAll('.input-box');
            const savedState = quizState[currentIndex];

            inputs.forEach((input, i) => {
                input.value = savedState.inputs[i];
                input.disabled = savedState.isUnlocked;
            });
        }

        function focusFirstEmptyInput() {
            const activeSlide = slides[currentIndex];
            const inputs = activeSlide.querySelectorAll('.input-box');
            const firstEmpty = Array.from(inputs).find(input => !input.value.trim() && !input.disabled);
            if (firstEmpty) {
                setTimeout(() => firstEmpty.focus(), 50);
            }
        }

        function updateNavButtons() {
            prevBtn.disabled = currentIndex === 0;
            const isLastQuestion = currentIndex === slides.length - 1;
            const isUnlocked = quizState[currentIndex].isUnlocked;

            nextBtn.disabled = isLastQuestion || !isUnlocked;

            const activeSlide = slides[currentIndex];
            const inputs = activeSlide.querySelectorAll('.input-box');
            const allFilled = Array.from(inputs).every(inp => inp.value.trim() !== '');
            
            submitBtn.disabled = isUnlocked || !allFilled;
        }


        function showSmallConfetti(isFinal = false) {
            const confettiContainer = document.getElementById('confettiContainer');
            if (!confettiContainer) return;

            confettiContainer.innerHTML = '';

            const count = isFinal ? 95 : 42;

            const colors = [
                '#00b894',
                '#e67e22',
                '#6c5ce7',
                '#0984e3',
                '#fdcb6e',
                '#ff6b7a',
                '#00cec9',
                '#a29bfe'
            ];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('span');

                piece.className =
                    isFinal
                        ? 'confetti-piece final-confetti-piece'
                        : 'confetti-piece';

                const startX = Math.random() * 100;
                const startY = -8 + Math.random() * 10;

                const drift =
                    (Math.random() * 520 - 260) *
                    (isFinal ? 1.15 : 0.9);

                const fall =
                    window.innerHeight *
                    (0.82 + Math.random() * 0.48);

                const rotation =
                    Math.random() * 1400 - 700;

                piece.style.left = startX + '%';
                piece.style.top = startY + '%';

                piece.style.setProperty('--x', drift + 'px');
                piece.style.setProperty('--y', fall + 'px');
                piece.style.setProperty('--r', rotation + 'deg');

                piece.style.background =
                    colors[Math.floor(Math.random() * colors.length)];

                piece.style.animationDelay =
                    (Math.random() * (isFinal ? 500 : 220)) + 'ms';

                confettiContainer.appendChild(piece);

                setTimeout(
                    () => piece.remove(),
                    isFinal ? 2900 : 2050
                );
            }
        }

        function checkAnswers() {
            const activeSlide = slides[currentIndex];
            const inputs = activeSlide.querySelectorAll('.input-box');
            const cards = activeSlide.querySelectorAll('.holo-card');
            let allCorrect = true;

            inputs.forEach(input => {
                if (input.value.trim() !== input.dataset.target) {
                    allCorrect = false;
                }
            });

            if (allCorrect) {
                quizState[currentIndex].isUnlocked = true;

                cards.forEach(card => card.classList.add('success-pulse'));
                inputs.forEach(input => input.disabled = true);

                // Always show the normal Correct popup first.
                showPopup('correct', '🌟', 'Amazing!', 'You got it exactly right! ✨', false);
                playAudioTone(true);
                speak("Correct");
                showSmallConfetti(false);

                // On the last question, show the normal Correct popup first,
                // then the final popup with the larger exact same confetti.
                if (currentIndex === slides.length - 1) {
                    setTimeout(() => {
                        closePopup();
                        showSmallConfetti(true);
                        showPopup('complete', '🏆', 'Congratulations!', 'Fantastic job! You solved all questions! 🎉', true);
                    }, 1800);
                }
                updateNavButtons();
            } else {
                showPopup('wrong', '😟', 'Keep Going!', 'Count carefully and try again! 🌈', false);
                playAudioTone(false);
                speak("Try again.");
                resetCurrentInputs();
            }
        }

        function resetCurrentInputs() {
            const activeSlide = slides[currentIndex];
            const inputs = activeSlide.querySelectorAll('.input-box');

            inputs.forEach((input, i) => {
                input.value = '';
                quizState[currentIndex].inputs[i] = '';
            });
            updateNavButtons();
        }

        function showPopup(status, icon, title, subtitle, isFinal = false) {
            const popup = document.getElementById('popup');
            const card = document.getElementById('popupCard');

            card.className = `popup-card ${status}${isFinal ? ' complete' : ''}`;
            document.getElementById('popupIcon').innerText = icon;
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupSubtitle').innerText = subtitle;

            playAgainBtn.style.display = isFinal ? 'inline-block' : 'none';
            popup.classList.add('active');

            clearTimeout(popupTimer);
            if (!isFinal) {
                popupTimer = setTimeout(() => { closePopup(); }, 1800);
            }
        }

        function closePopup() {
            document.getElementById('popup').classList.remove('active');
        }

        function restartGame() {
            closePopup();
            const confettiContainer = document.getElementById('confettiContainer');
            if (confettiContainer) confettiContainer.innerHTML = '';
            quizState = Array.from({ length: 3 }, () => ({ inputs: ['', '', ''], isUnlocked: false }));

            slides[currentIndex].classList.remove('active');
            currentIndex = 0;
            slides[currentIndex].classList.add('active');

            slides.forEach((slide) => {
                const inputs = slide.querySelectorAll('.input-box');
                const cards = slide.querySelectorAll('.holo-card');
                
                inputs.forEach(inp => { inp.value = ''; inp.disabled = false; });
                cards.forEach(card => card.classList.remove('success-pulse'));
            });

            updateNavButtons();
            focusFirstEmptyInput();
        }

        updateNavButtons();
        focusFirstEmptyInput();
    </script>
</body>
</html>
