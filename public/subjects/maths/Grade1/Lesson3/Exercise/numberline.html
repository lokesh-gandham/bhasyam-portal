<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Line Adventure Quiz</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Livvic',sans-serif;
}

html,body{
    width:100%;
    height:100%;
}

body{
    min-height:100svh;
    overflow:hidden;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
    padding:10px 15px;
    color:#2c3e50;
}

/* =========================
   HEADER
========================= */

header{
    width:100%;
    text-align:center;
    padding-top:2px;
}

header h2{
    font-size:22px;
    font-weight:600;
    color:#2c3e50;
}

.instruction{
    margin-top:3px;
    font-size: 20px;
    font-weight:400;
    color:#666;
}

/* =========================
   MAIN GAME AREA
========================= */

.game-stage{
    width:min(100%,1250px);
    min-height:0;
    min-width:0;
    height:auto;
    margin:0 auto;
    display:flex;
    align-items:stretch;
    justify-content:center;
    position:relative;
    overflow:visible;
}

.slide-item{
    display:none;
    width:100%;
    height:100%;
    min-height:0;
    align-items:center;
    justify-content:center;
}

.slide-item.active{
    display:flex;
}

/* =========================
   GAME LAYOUT
========================= */

.game-content{
    width:min(100%,1280px);
    height:100%;
    min-height:0;
    position:relative;
    z-index:1;

    display:grid;
    grid-template-rows:auto auto minmax(0,1fr);
    align-items:start;
    justify-items:center;

    padding:clamp(8px,1.8vh,22px)
            clamp(14px,2.5vw,28px)
            0;
}

/* =========================
   EQUATION
========================= */

.equation-zone{
    position:relative;
    z-index:2;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:clamp(9px,2vw,18px);
    margin-top:0;
}

.number-chip{
    min-width:clamp(54px,7vw,78px);
    height:clamp(54px,7vw,78px);

    border-radius:22px;
    background:#fff;

    display:grid;
    place-items:center;

    font-size:clamp(1.5rem,3.3vw,2.45rem);
    font-weight:400;
    color:#2c3e50;

    box-shadow:
        0 8px 0 #dce5ec,
        0 12px 18px rgba(44,62,80,.10);
     
}

.number-chip.start{
    border:3px solid #74b9ff;
}

.number-chip.add{
    border:3px solid #a29bfe;
}

.operator{
    font-size:clamp(1.5rem,3vw,2.25rem);
    font-weight:400;
    color:#667;
}

.answer-slot{
    width:clamp(72px,9vw,102px);
    height:clamp(54px,7vw,78px);

    border-radius:20px;
    border:3px dashed #e67e22;
    background:#fffaf3;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(1.35rem,3vw,2.3rem);
    font-weight:400;
    color:#e67e22;

    transition:.25s ease;
}

.answer-slot.filled{
    border-style:solid;
    background:#fff;
    color:#2c3e50;
}

/* =========================
   MISSION
========================= */

.mission-text{
    position:relative;
    z-index:2;

    text-align:center;

    margin-top:clamp(10px,1.8vh,20px);

    font-size:clamp(.92rem,1.55vw,1.15rem);
    color:#52616b;
    font-weight:400;
   
}

.mission-text strong{
    color:#e67e22;
    font-weight:400;
}

.instruction strong{
    font-weight:400;
}

/* =========================
   NUMBER TRACK
========================= */

.track-zone{
    position:relative;
    z-index:2;

    width:100%;
    min-height:0;
    height:100%;

    margin-top:clamp(8px,1.5vh,18px);
    padding:0 0 clamp(4px,1vh,12px);

    display:flex;
    align-items:center;
    justify-content:center;
    overflow:visible;
    
}

.number-track{
    width:94%;
    max-width:980px;

    position:relative;

    padding-top:88px;

    user-select:none;
    
}

/* =========================
   ROAD
========================= */

.track-road{
    height:18px;
    width:100%;

    background:linear-gradient(
        180deg,
        #576574,
        #34495e
    );

    border-radius:12px;

    box-shadow:
        0 7px 0 rgba(44,62,80,.14);

    position:relative;
     margin-top: 80px;
}

.track-road::before{
    content:'';

    position:absolute;

    left:8px;
    right:8px;
    top:7px;

    border-top:3px dashed rgba(255,255,255,.55);
}

/* =========================
   NUMBER STOPS
========================= */

.stops{
    position:absolute;

    width:100%;
    left:0;
    bottom:-18px;

    display:flex;
    justify-content:space-between;
   

}

.stop{
    width:32px;

    text-align:center;

    position:relative;

    color:#52616b;

    font-size:clamp(.62rem,1vw,.86rem);
    font-weight:400;

    cursor:pointer;

    transform:translateX(-50%);

    outline:none;
    border:none;
    background:transparent;

    padding-top:24px;
   
}

.stop:first-child{
    transform:translateX(0);
}

.stop:last-child{
    transform:translateX(-100%);
}

.stop::before{
    content:'';

    position:absolute;

    top:-10px;
    left:50%;

    transform:translateX(-50%);

    width:20px;
    height:20px;

    border-radius:50%;

    background:#fff;

    border:4px solid #95a5a6;

    box-shadow:
        0 3px 0 rgba(0,0,0,.10);

    transition:.2s ease;
}

.stop:hover::before,
.stop:focus::before{
    border-color:#74b9ff;

    transform:
        translateX(-50%)
        scale(1.15);
}

.stop.start-stop::before{
    border-color:#0984e3;
}

.stop.selected::before{
    border-color:#e67e22;
    background:#fff4df;

    transform:
        translateX(-50%)
        scale(1.22);
}

.stop.correct-stop::before{
    border-color:#00b894;
    background:#dffaf0;
}

.stop.wrong-stop::before{
    border-color:#ff6b7a;
    background:#fff0f2;
}

/* =========================
   ROCKET / EXPLORER
========================= */

.explorer{
    position:absolute;

    left:0;
    bottom:0;

    width:64px;
    height:64px;

    display:grid;
    place-items:center;

    font-size:42px;

    transform:translateX(-50%);

    transition:
        left .75s cubic-bezier(.22,1,.36,1),
        transform .35s ease;

    z-index:5;

    filter:
        drop-shadow(
            0 7px 5px rgba(44,62,80,.18)
        );
        
       
}

.explorer.start-position{
    transform:
        translateX(-50%)
        translateY(-8px);
}

.explorer.moving{
    animation:bob .5s infinite alternate;
}

@keyframes bob{
    from{
        transform:
            translateX(-50%)
            translateY(-8px)
            rotate(-5deg);
    }

    to{
        transform:
            translateX(-50%)
            translateY(-16px)
            rotate(5deg);
    }
}

/* =========================
   JUMP BUBBLES
========================= */

.jump-bubbles{
    position:absolute;

    left:0;
    right:0;

    top:42px;

    display:flex;
    justify-content:center;

    gap:8px;

    pointer-events:none;
}

.jump{
    width:30px;
    height:30px;

    border-radius:50%;

    display:grid;
    place-items:center;

    font-size:.76rem;
    font-weight:400;

    color:#fff;

    background:#a29bfe;

    box-shadow:
        0 4px 0 #8177dc;

    opacity:.3;

    transform:scale(.8);

    transition:.25s ease;
}

.jump.active{
    opacity:1;

    transform:scale(1);

    background:#00b894;

    box-shadow:
        0 4px 0 #008f72;
}

/* =========================
   TRACK LEGEND
========================= */

.track-legend{
    position:absolute;

    left:50%;

    transform:translateX(-50%);

    top:0;

    display:flex;
    align-items:center;

    gap:8px;

    background:rgba(255,255,255,.78);

    padding:7px 14px;

    border-radius:30px;

    box-shadow:
        0 4px 12px rgba(44,62,80,.08);

    color:#5c6770;

    font-size:clamp(.72rem,1vw,.9rem);
    font-weight:400;

    white-space:nowrap;

    margin-top:0;
    
}

.track-legend i{
    color:#e67e22;
}

/* =========================
   FOOTER
========================= */

footer{
    position:relative;
    z-index:30;
    pointer-events:auto;

    width:min(100%,1100px);

    min-width:0;

    margin:0 auto;

    display:grid;

    grid-template-columns:
        178px
        178px
        178px;

    justify-content:space-between;

    align-items:center;

    padding:4px 0 6px;
}

.nav-btn{
    position:relative;
    z-index:31;
    background:#e67e22;

    color:#fff;

    border:none;

    min-width:178px;
    height:45px;

    font-size:20px;
    font-weight:400;

    border-radius:40px;

    cursor:pointer;

    box-shadow:
        0 6px 0 #d35400;

    transition:all .1s ease;
    margin-top: -20px;

}

.nav-btn:active:not(:disabled){
    transform:translateY(4px);

    box-shadow:
        0 2px 0 #d35400;
}

.nav-btn:disabled{
    background:#b2bec3;

    box-shadow:
        0 6px 0 #636e72;

    cursor:not-allowed;

    opacity:.7;
}

.check-btn{
    background:#00b894;

    box-shadow:
        0 6px 0 #008f72;
}

.check-btn:active:not(:disabled){
    box-shadow:
        0 2px 0 #008f72;
}

.replay-btn{
    background:#0984e3;

    box-shadow:
        0 6px 0 #0975c7;

    margin-top:20px;

    z-index:5;
}

.replay-btn:active{
    box-shadow:
        0 2px 0 #0975c7;
}

/* =========================
   POPUP
========================= */

.popup-overlay{
    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100vh;

  
    display:flex;

    justify-content:center;
    align-items:center;

    opacity:0;

    pointer-events:none;

    transition:opacity .3s ease;

    z-index:100;
}

.popup-overlay.active{
    opacity:1;

    pointer-events:auto;
}

.popup-card{
    position:relative;

    width:90%;
    max-width:520px;

    padding:40px 30px;

    border-radius:36px;

    text-align:center;

    box-shadow:
        0 20px 40px rgba(0,0,0,.1);

    transform:scale(.8);

    transition:
        transform .35s
        cubic-bezier(.175,.885,.32,1.275);

    overflow:hidden;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;
}

.popup-card::before,
.popup-card::after{
    content:'';

    position:absolute;

    border-radius:50%;

    pointer-events:none;
}

.popup-card::before{
    width:220px;
    height:220px;

    top:-60px;
    right:-50px;
}

.popup-card::after{
    width:180px;
    height:180px;

    bottom:-70px;
    left:-40px;
}

.popup-card.correct{
    background:#edfbf4;

    border:6px solid #00c885;
}

.popup-card.correct::before,
.popup-card.correct::after{
    background:rgba(162,245,209,.45);
}

.popup-card.correct .popup-title{
    color:#00a86b;
}

.popup-card.correct .popup-subtitle{
    color:#2e7d5b;
}

.popup-card.wrong{
    background:#fff0f2;

    border:6px solid #ff6b7a;
}

.popup-card.wrong::before,
.popup-card.wrong::after{
    background:rgba(255,196,203,.45);
}

.popup-card.wrong .popup-title{
    color:#d33847;
}

.popup-card.wrong .popup-subtitle{
    color:#a33b45;
}

.popup-card.complete{
    background:#f0f3ff;

    border:6px solid #6c5ce7;
}

.popup-card.complete::before,
.popup-card.complete::after{
    background:rgba(162,155,254,.35);
}

.popup-card.complete .popup-title{
    color:#6c5ce7;
}

.popup-card.complete .popup-subtitle{
    color:#4834d4;
}

.popup-overlay.active .popup-card{
    transform:scale(1);
}

.popup-icon{
    font-size:4.8rem;

    margin-bottom:12px;

    z-index:2;

    line-height:1;

    filter:
        drop-shadow(
            0 6px 10px rgba(0,0,0,.1)
        );
}

.popup-title{
    font-size:3rem;

    font-weight:600;

    margin-bottom:8px;

    z-index:2;

    letter-spacing:-.5px;
}

.popup-subtitle{
    font-size:1.4rem;

    font-weight:500;

    z-index:2;

    display:flex;

    align-items:center;

    gap:8px;
}

/* =========================
   MONITOR RESPONSIVE
========================= */

@media screen and (min-width:1400px){

    body{
        padding:clamp(8px,1vh,14px) clamp(12px,1.2vw,20px);
    }

    header{
        padding-top:clamp(2px,.5vh,6px);
    }

    header h2{
        font-size:30px;
    }

    .instruction{
        font-size:clamp(1rem,1.15vw,1.2rem);
        margin-top:4px;
    }

    .game-stage{
        width:100%;
        height:100%;
        margin:0 auto;
    }

    .slide-item{
        height:100%;
    }

    .game-content{
        width:min(100%,1500px);
        height:100%;
        grid-template-rows:auto auto minmax(0,1fr);
        padding:
            clamp(8px,1.2vh,18px)
            clamp(18px,2vw,34px)
            0;
    }

    .equation-zone{
        gap:clamp(14px,1.6vw,26px);
    }

    .number-chip{
        min-width:clamp(78px,5.2vw,104px);
        height:clamp(78px,5.2vw,104px);
        font-size:clamp(2.2rem,2.6vw,2.9rem);
    }

    .answer-slot{
        width:clamp(96px,6vw,122px);
        height:clamp(78px,5.2vw,104px);
        font-size:clamp(2rem,2.5vw,2.8rem);
    }

    .operator{
        font-size:clamp(2.3rem,2.8vw,3rem);
    }

    .mission-text{
        margin-top:clamp(10px,1.5vh,20px);
        font-size:clamp(1rem,1.3vw,1.3rem);
    }

    .track-zone{
        margin-top:clamp(8px,1.5vh,18px);
        height:100%;
        min-height:0;
        padding:0 0 6px;
        align-items:center;
    }

    .number-track{
        width:min(94vw,1450px);
        max-width:none;
        padding-top:clamp(72px,8vh,94px);
    }

    .track-road{
        margin-top:clamp(56px,6vh,80px);
    }

    .jump{
        width:clamp(30px,2vw,34px);
        height:clamp(30px,2vw,34px);
    }

    .explorer{
        width:clamp(62px,4vw,70px);
        height:clamp(62px,4vw,70px);
        font-size:clamp(42px,2.8vw,46px);
    }

    .stop::before{
        width:clamp(22px,1.7vw,28px);
        height:clamp(22px,1.7vw,28px);
    }

    footer{
        width:min(100%,1500px);
        grid-template-columns:clamp(178px,12vw,205px) clamp(178px,12vw,205px) clamp(178px,12vw,205px);
        padding:4px 0 8px;
    }

    .nav-btn{
        min-width:clamp(178px,12vw,205px);
        height:clamp(45px,5vh,54px);
        font-size:clamp(20px,1.35vw,24px);
        margin-top:0;
    }
}

/* EXACT SAME CONFETTI */
#confettiContainer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 200;
}
.confetti-piece {
    position: absolute;
    width: 9px;
    height: 14px;
    border-radius: 2px;
    opacity: 0;
    animation: pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
    will-change: transform, opacity;
}
.final-confetti-piece {
    width: 10px;
    height: 16px;
    animation-duration: 2300ms;
}
.final-confetti-piece:nth-child(3n) { border-radius: 50%; }
.final-confetti-piece:nth-child(4n) {
    width: 7px;
    height: 19px;
    border-radius: 1px;
}
.final-confetti-piece:nth-child(5n) {
    width: 13px;
    height: 8px;
    border-radius: 2px;
}
@keyframes pageConfetti {
    0% {
        opacity: 1;
        transform: translate3d(0,0,0) rotate(0deg) scale(1);
    }
    55% { opacity: 1; }
    100% {
        opacity: 0;
        transform: translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72);
    }
}
.popup-card.complete {
    box-shadow:
        0 20px 45px rgba(108,92,231,.18),
        0 0 0 8px rgba(162,155,254,.12);
}
.popup-card.complete .replay-btn { margin-top: 12px; }
.popup-card.complete .popup-icon {
    animation: finalTrophyBounce 1.2s ease-in-out infinite;
}
@keyframes finalTrophyBounce {
    0%,100% { transform: translateY(0) rotate(0deg) scale(1); }
    50% { transform: translateY(-5px) rotate(-4deg) scale(1.06); }
}


/* ===== LESSON 3 HEADINGS: normal weight (400), no bold ===== */
header h1,
header h2,
header h3,
header p,
header .instruction,
header .instruction-text,
.heading h1,
.heading h2,
.heading p {
    font-weight: 400 !important;
}
header h1 *,
header h2 *,
header h3 *,
header p *,
header .instruction *,
header .instruction-text *,
.heading h1 *,
.heading h2 *,
.heading p * {
    font-weight: 400 !important;
}

/* ===== Use the empty space: drop the equation and its description down =====
   The number track sits low on the page, leaving a wide gap under the
   equation. Push the equation block down into that space so the question
   reads closer to the middle of the screen. */
.equation-zone {
    margin-top: clamp(4px, 11vh, 110px);
}
.mission-text {
    margin-top: clamp(6px, 1.6vh, 20px);
}

/* ===== LESSON 3: Play Again only on final popup (20px) ===== */
.popup-card .replay-btn,
.popup-card #playAgainBtn {
    display: none !important;
}
.popup-card.complete .replay-btn,
.popup-card.complete #playAgainBtn {
    display: inline-flex !important;
    margin-top: 12px !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 40px !important;
    background: #0984e3 !important;
    color: #ffffff !important;
    font-size: 20px !important;
    font-weight: 600 !important;
    cursor: pointer;
    box-shadow: 0 6px 0 #0975c7 !important;
    z-index: 5;
    min-width: 178px !important;
    width: 178px !important;
    height: 45px !important;
    align-items: center;
    justify-content: center;
    transition: all 0.1s ease;
}
.popup-card.complete .replay-btn:active,
.popup-card.complete #playAgainBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #0975c7 !important;
}
</style>
</head>

<body>

<header>

    <h2>
        Number Line Adventure
    </h2>

    <p class="instruction">
        Choose the <strong>landing number</strong>
        after completing all the jumps.
    </p>

</header>

<main
    class="game-stage"
    id="gameStage">
</main>

<footer>

    <button
        class="nav-btn"
        id="prevBtn"
        onclick="navigate(-1)"
        disabled>
        PREV
    </button>

    <button
        class="nav-btn check-btn"
        id="submitBtn"
        onclick="checkAnswer()"
        disabled>
        SUBMIT
    </button>

    <button
        class="nav-btn"
        id="nextBtn"
        onclick="navigate(1)"
        disabled>
        NEXT
    </button>

</footer>

<div id="confettiContainer"></div>

<!-- RESULT POPUP -->

<div
    class="popup-overlay"
    id="popup">

    <div
        class="popup-card"
        id="popupCard">

        <div
            class="popup-icon"
            id="popupIcon">
            ⭐
        </div>

        <h2
            class="popup-title"
            id="popupTitle">
            Amazing!
        </h2>

        <p
            class="popup-subtitle"
            id="popupSubtitle">
            You got it right! ✨
        </p>

        <button
            class="nav-btn replay-btn"
            id="playAgainBtn"
            style="display:none;"
            onclick="restartGame()">
            Play Again
        </button>

    </div>

</div>

<script>

/* =====================================
   QUESTION DATA
   4 QUESTIONS
===================================== */

const questions = [

    {
        a:6,
        b:3,
        max:10,
        mission:
            "Start at 6 and make 3 jumps forward.",
        emoji:"🚀"
    },

    {
        a:8,
        b:2,
        max:10,
        mission:
            "Start at 8 and make 2 jumps forward.",
        emoji:"🚀"
    },

    {
        a:13,
        b:5,
        max:20,
        mission:
            "Start at 13 and make 5 jumps forward.",
        emoji:"🚀"
    },

    {
        a:11,
        b:4,
        max:20,
        mission:
            "Start at 11 and make 4 jumps forward.",
        emoji:"🚀"
    }

];

/* =====================================
   GAME STATE
===================================== */

let currentIndex = 0;

let quizState =
    questions.map(() => ({
        selected:null,
        unlocked:false
    }));

let popupTimer = null;

/* =====================================
   VOICE
===================================== */

function speak(t){

    speechSynthesis.cancel();

    const msg =
        new SpeechSynthesisUtterance(t);

    msg.lang = "en-US";
    msg.volume = 0.8;
    msg.rate = 1;
    msg.pitch = 1;

    speechSynthesis.speak(msg);
}

/* =====================================
   AUDIO
===================================== */

const audioCtx =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

function playAudioTone(isCorrect){

    if(audioCtx.state === 'suspended'){
        audioCtx.resume();
    }

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if(isCorrect){

        osc.type = 'sine';

        osc.frequency.setValueAtTime(
            587.33,
            audioCtx.currentTime
        );

        osc.frequency.exponentialRampToValueAtTime(
            880,
            audioCtx.currentTime + 0.2
        );

        gain.gain.setValueAtTime(
            0.2,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + 0.3
        );

    }else{

        osc.type = 'sawtooth';

        osc.frequency.setValueAtTime(
            200,
            audioCtx.currentTime
        );

        osc.frequency.linearRampToValueAtTime(
            120,
            audioCtx.currentTime + 0.2
        );

        gain.gain.setValueAtTime(
            0.2,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + 0.25
        );
    }

    osc.start();

    osc.stop(
        audioCtx.currentTime + 0.3
    );
}


/* EXACT SAME CONFETTI FUNCTION */
function showSmallConfetti(isFinal = false) {
    const confettiContainer = document.getElementById('confettiContainer');
    if (!confettiContainer) return;

    confettiContainer.innerHTML = '';

    const count = isFinal ? 95 : 42;

    const colors = [
        '#00b894','#e67e22','#6c5ce7','#0984e3',
        '#fdcb6e','#ff6b7a','#00cec9','#a29bfe'
    ];

    for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');

        piece.className = isFinal
            ? 'confetti-piece final-confetti-piece'
            : 'confetti-piece';

        const startX = Math.random() * 100;
        const startY = -8 + Math.random() * 10;
        const drift = (Math.random() * 520 - 260) * (isFinal ? 1.15 : 0.9);
        const fall = window.innerHeight * (0.82 + Math.random() * 0.48);
        const rotation = Math.random() * 1400 - 700;

        piece.style.left = startX + '%';
        piece.style.top = startY + '%';
        piece.style.setProperty('--x', drift + 'px');
        piece.style.setProperty('--y', fall + 'px');
        piece.style.setProperty('--r', rotation + 'deg');
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = (Math.random() * (isFinal ? 500 : 220)) + 'ms';

        confettiContainer.appendChild(piece);

        setTimeout(() => piece.remove(), isFinal ? 2900 : 2050);
    }
}


/* =====================================
   RENDER GAME
===================================== */

function renderGame(){

    const q =
        questions[currentIndex];

    const answer =
        q.a + q.b;

    const state =
        quizState[currentIndex];

    /* NUMBER STOPS */

    const stops =
        Array.from(
            {length:q.max + 1},
            (_,n) => {

                const classes = [

                    'stop',

                    n === q.a
                        ? 'start-stop'
                        : '',

                    state.selected === n
                        ? 'selected'
                        : '',

                    state.unlocked &&
                    n === answer
                        ? 'correct-stop'
                        : ''

                ]
                .filter(Boolean)
                .join(' ');

                return `
                    <button
                        class="${classes}"
                        data-number="${n}"
                        onclick="selectStop(${n})">
                        ${n}
                    </button>
                `;
            }
        ).join('');

    /* JUMP BUBBLES */

    const jumps =
        Array.from(
            {length:q.b},
            (_,i) => {

                const active =
                    state.selected !== null &&
                    state.selected === answer
                        ? 'active'
                        : '';

                return `
                    <span class="jump ${active}">
                        ${i+1}
                    </span>
                `;
            }
        ).join('');

    const selectedText =
        state.selected === null
            ? '?'
            : state.selected;

    const selectedClass =
        state.selected === null
            ? ''
            : 'filled';

    const explorerLeft =
        (q.a / q.max) * 100;

    document.getElementById(
        'gameStage'
    ).innerHTML = `

        <section class="slide-item active">

            <div class="game-content">

                <div class="equation-zone">

                    <div class="number-chip start">
                        ${q.a}
                    </div>

                    <div class="operator">
                        +
                    </div>

                    <div class="number-chip add">
                        ${q.b}
                    </div>

                    <div class="operator">
                        =
                    </div>

                    <div
                        class="answer-slot ${selectedClass}"
                        id="answerSlot">
                        ${selectedText}
                    </div>

                </div>

                <p class="mission-text">
                    Start at
                    <strong>${q.a}</strong>,
                    make
                    <strong>${q.b}</strong>
                    jumps forward,
                    and choose where the rocket lands!
                </p>

                <div class="track-zone">

                    <div class="number-track">

                        <div class="track-legend">

                            <i class="fa-solid fa-hand-pointer"></i>

                            Click the number where you land

                        </div>

                        <div class="jump-bubbles">
                            ${jumps}
                        </div>

                        <div
                            class="explorer start-position"
                            id="explorer"
                            style="left:${explorerLeft}%">

                            ${q.emoji}

                        </div>

                        <div class="track-road"></div>

                        <div class="stops">
                            ${stops}
                        </div>

                    </div>

                </div>

            </div>

        </section>
    `;

    updateNavButtons();
}

/* =====================================
   SELECT NUMBER
===================================== */

function selectStop(number){

    const state =
        quizState[currentIndex];

    if(state.unlocked){
        return;
    }

    const q =
        questions[currentIndex];

    state.selected =
        number;

    renderGame();

    const explorer =
        document.getElementById(
            'explorer'
        );

    const targetLeft =
        (number / q.max) * 100;

    explorer.classList.add(
        'moving'
    );

    requestAnimationFrame(() => {

        explorer.style.left =
            targetLeft + '%';

    });

    setTimeout(() => {

        explorer.classList.remove(
            'moving'
        );

    },760);
}

/* =====================================
   NAVIGATION
===================================== */

function navigate(dir){

    const newIndex =
        currentIndex + dir;

    if(
        newIndex < 0 ||
        newIndex >= questions.length
    ){
        return;
    }

    currentIndex =
        newIndex;

    renderGame();
}

/* =====================================
   NAV BUTTONS
===================================== */

function updateNavButtons(){

    const state =
        quizState[currentIndex];

    document.getElementById(
        'prevBtn'
    ).disabled =
        currentIndex === 0;

    document.getElementById(
        'nextBtn'
    ).disabled =
        currentIndex === questions.length - 1 ||
        !state.unlocked;

    document.getElementById(
        'submitBtn'
    ).disabled =
        state.unlocked ||
        state.selected === null;
}

/* =====================================
   CHECK ANSWER
===================================== */

function checkAnswer(){

    const q =
        questions[currentIndex];

    const state =
        quizState[currentIndex];

    const answer =
        q.a + q.b;

    /* CORRECT */

    if(state.selected === answer){

        state.unlocked = true;

        renderGame();

        if(
            currentIndex ===
            questions.length - 1
        ){

            /*
             * Final question:
             * show the normal Correct popup
             * before the completion popup.
             */

            showSmallConfetti(false);

            showPopup(
                'correct',
                '🌟',
                'Amazing!',
                'You got it right! ✨',
                false
            );

            playAudioTone(true);

            speak("Correct");

            setTimeout(() => {

                closePopup();

                showSmallConfetti(true);

                showPopup(
                    'complete',
                    '🏆',
                    "Congratulations!","Fantastic job! You solved all questions! 🎉",
                    true
                );

             

            },1800);

        }else{

            showPopup(
                'correct',
                '🌟',
                'Amazing!',
                'You got it right! ✨',
                false
            );

            playAudioTone(true);

            speak("Correct");

            showSmallConfetti(false);
        }

        updateNavButtons();

    }

    /* WRONG */

    else{

        const wrongButton =
            document.querySelector(
                `.stop[data-number="${state.selected}"]`
            );

        if(wrongButton){

            wrongButton.classList.add(
                'wrong-stop'
            );
        }

        playAudioTone(false);

        speak("Wrong");

        setTimeout(() => {

            state.selected = null;

            renderGame();

            showPopup(
                'wrong',
                '😟',
                'Keep Going!',
                'Try again, you can do it! 🌈',
                false
            );

        },280);
    }
}

/* =====================================
   POPUP
===================================== */

function showPopup(
    status,
    icon,
    title,
    subtitle,
    isFinal=false
){

    const popup =
        document.getElementById(
            'popup'
        );

    const card =
        document.getElementById(
            'popupCard'
        );

    const playAgainBtn =
        document.getElementById(
            'playAgainBtn'
        );

    card.className =
        `popup-card ${status}${isFinal ? ' complete' : ''}`;

    document.getElementById(
        'popupIcon'
    ).innerText =
        icon;

    document.getElementById(
        'popupTitle'
    ).innerText =
        title;

    document.getElementById(
        'popupSubtitle'
    ).innerText =
        subtitle;

    playAgainBtn.style.display =
        isFinal
            ? 'inline-block'
            : 'none';

    popup.classList.add(
        'active'
    );

    clearTimeout(
        popupTimer
    );

    if(!isFinal){

        popupTimer =
            setTimeout(
                closePopup,
                1800
            );
    }
}

/* =====================================
   CLOSE POPUP
===================================== */

function closePopup(){

    document.getElementById(
        'popup'
    ).classList.remove(
        'active'
    );
}

/* =====================================
   RESTART
===================================== */

function restartGame(){

    closePopup();

    const confettiContainer = document.getElementById('confettiContainer');
    if (confettiContainer) {
        confettiContainer.innerHTML = '';
    }

    currentIndex = 0;

    quizState =
        questions.map(() => ({
            selected:null,
            unlocked:false
        }));

    renderGame();
}

/* =====================================
   START GAME
===================================== */

renderGame();

</script>
