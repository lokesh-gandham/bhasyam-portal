<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line Frog Hopper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
        }

        body {
            background: linear-gradient(to bottom, #e0f2fe 0%, #bae6fd 40%, #a7f3d0 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2vh 2vw;
            overflow: hidden; 
            color: #1e293b;
        }

        header {
            text-align: center;
            z-index: 10;
            flex-shrink: 0;
            margin-bottom: 2vh;
        }

        h1 {
            color: #0f172a;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(255,255,255,0.8);
            margin-bottom: 10px;
        }

        @media screen and (max-width: 1599px) { h1 { font-size: 22px; } }
        @media screen and (min-width: 1600px) { h1 { font-size: 30px; } }

        .instruction {
            font-size: clamp(14px, 1.5vw, 18px);
            color: #334155;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: inline-block;
        }
        
        .instruction span { color: #10b981; font-weight: 900; }

        .game-stage {
            width: 100%;
            max-width: 1200px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            min-height: 0;
            gap: 4vh;
        }

        .equation-area {
            position: relative;
            z-index: 30; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.6);
            padding: 20px 40px;
            border-radius: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 4px solid #ffffff;
        }

        .eq-num { font-size: clamp(3rem, 5vw, 4.5rem); font-weight: 900; color: #3b82f6; text-shadow: 0 3px 0 #ffffff; }
        .eq-op { font-size: clamp(2.5rem, 4vw, 4rem); font-weight: 900; color: #64748b; }
        .eq-add { color: #ef4444; }

        input[type="text"] {
            width: clamp(70px, 8vw, 90px);
            height: clamp(60px, 7vw, 75px);
            font-size: clamp(2rem, 3vw, 2.8rem);
            font-weight: 900;
            text-align: center;
            border: 4px solid #f59e0b;
            border-radius: 16px;
            background: #ffffff;
            color: #2d3436;
            outline: none;
            box-shadow: 0 6px 0 #d97706, 0 10px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        input[type="text"]:focus { transform: translateY(-4px); border-color: #fbbf24; box-shadow: 0 10px 0 #d97706; }
        input[type="text"]:disabled { background-color: #f1f2f6; border-color: #cbd5e1; box-shadow: 0 6px 0 #94a3b8; cursor: not-allowed; transform: none; color: #10b981; }

        .number-line-container {
            width: 100%; position: relative; padding: 60px 0 20px 0; z-index: 5;
        }

        .line-track {
            position: absolute; bottom: 35px; left: 2%; right: 2%;
            height: 6px; background: #0284c7; border-radius: 3px; z-index: 1;
        }

        .line-track::after { content: ''; position: absolute; right: -10px; top: -7px; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 15px solid #0284c7; }
        .line-track::before { content: ''; position: absolute; left: -10px; top: -7px; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-right: 15px solid #0284c7; }

        .track-wrapper { position: relative; width: 96%; margin: 0 auto; }
        .lily-pads { display: flex; justify-content: space-between; align-items: flex-end; position: relative; z-index: 2; width: 100%; }
        .pad-group { display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; }
        .pad-mark { width: 4px; height: 20px; background: #0284c7; border-radius: 2px; }
        .pad-number {
            font-size: clamp(1rem, 1.5vw, 1.4rem); font-weight: 900; color: #0f172a;
            background: #ffffff; width: 30px; height: 30px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 50%; border: 2px solid #38bdf8; box-shadow: 0 3px 0 #0284c7;
        }

        .frog {
            position: absolute; font-size: clamp(2.5rem, 4vw, 3.5rem);
            bottom: 40px; transform: translateX(-50%);
            z-index: 10; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
            left: 0; 
        }

        .frog-move { transition: left 0.3s linear; }

        .frog.jumping { animation: arcJump 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        @keyframes arcJump { 0% { bottom: 40px; } 50% { bottom: 90px; } 100% { bottom: 40px; } }

        .nav-buttons-container {
            position: absolute; width: 100%; max-width: 1200px;
            display: flex; justify-content: space-between;
            top: 50%; transform: translateY(-50%);
            pointer-events: none; padding: 0 10px; z-index: 1;
        }

        .action-area {
            width: 100%; display: flex; justify-content: center;
            padding: 10px 0; z-index: 20; flex-shrink: 0;
        }
        
        .nav-btn, .submit-btn, .hop-btn, .replay-btn {
            font-weight: 900; border: none; cursor: pointer; transition: all 0.1s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 20px; padding: 10px 30px; border-radius: 30px;
        }

        @media screen and (min-width: 1600px) {
            .nav-btn, .submit-btn, .hop-btn {
                font-size: 30px; padding: 15px 45px; border-radius: 45px;
            }
        }

        .nav-btn { background: #e67e22; color: #ffffff; box-shadow: 0 6px 0 #d35400; pointer-events: auto; }
        .nav-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #d35400; }
        
        .submit-btn { background: #00b894; color: #ffffff; box-shadow: 0 8px 0 #008f72; }
        .submit-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #008f72; }

        .hop-btn { background: #10b981; color: white; box-shadow: 0 6px 0 #059669; }
        .hop-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #059669; }

        .replay-btn { background: #0984e3; color: white; box-shadow: 0 6px 0 #0975c7; margin-top: 20px; z-index: 5; pointer-events: auto; }
        .replay-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0975c7; }

        .nav-btn:disabled, .hop-btn:disabled, .submit-btn:disabled { background: #94a3b8; box-shadow: 0 6px 0 #64748b; cursor: not-allowed; opacity: 0.8; }

        /* EXACT Modal Overlay & Custom Popup Design from Reference */
        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100;
        }
        .popup-overlay.active { opacity: 1; pointer-events: auto; }

        .popup-card {
            position: relative; width: 90%; max-width: 520px; padding: 40px 30px;
            border-radius: 36px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transform: scale(0.8); transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .popup-card::before, .popup-card::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
        .popup-card::before { width: 220px; height: 220px; top: -60px; right: -50px; }
        .popup-card::after { width: 180px; height: 180px; bottom: -70px; left: -40px; }

        .popup-card.correct { background: #edfbf4; border: 6px solid #00c885; }
        .popup-card.correct::before, .popup-card.correct::after { background: rgba(162, 245, 209, 0.45); }
        .popup-card.correct .popup-title { color: #00a86b; text-shadow: none; }
        .popup-card.correct .popup-subtitle { color: #2e7d5b; text-shadow: none; }

        .popup-card.wrong { background: #fff0f2; border: 6px solid #ff6b7a; }
        .popup-card.wrong::before, .popup-card.wrong::after { background: rgba(255, 196, 203, 0.45); }
        .popup-card.wrong .popup-title { color: #d33847; text-shadow: none; }
        .popup-card.wrong .popup-subtitle { color: #a33b45; text-shadow: none; }

        .popup-card.complete { background: #f0f3ff; border: 6px solid #6c5ce7; }
        .popup-card.complete::before, .popup-card.complete::after { background: rgba(162, 155, 254, 0.35); }
        .popup-card.complete .popup-title { color: #6c5ce7; text-shadow: none; }
        .popup-card.complete .popup-subtitle { color: #4834d4; text-shadow: none; }

        .popup-overlay.active .popup-card { transform: scale(1); }
        .popup-icon { font-size: 4.8rem; margin-bottom: 12px; z-index: 2; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.1)); }
        .popup-title { font-size: 3rem; font-weight: 900; margin-bottom: 8px; z-index: 2; letter-spacing: -0.5px; }
        .popup-subtitle { font-size: 1.4rem; font-weight: 700; z-index: 2; display: flex; align-items: center; gap: 8px; }

        @media screen and (max-width: 768px) {
            .pad-number { width: 20px; height: 20px; font-size: 0.8rem; }
            .eq-num { font-size: 2rem; }
            .equation-area { padding: 10px 20px; }
        }
    
/* ===== LESSON 3 HEADINGS: normal weight (400), no bold ===== */
header h1,
header h2,
header h3,
header p,
header .instruction,
header .instruction-text,
.heading h1,
.heading h2,
.heading p {
    font-weight: 400 !important;
}
header h1 *,
header h2 *,
header h3 *,
header p *,
header .instruction *,
header .instruction-text *,
.heading h1 *,
.heading h2 *,
.heading p * {
    font-weight: 400 !important;
}

/* ===== LESSON 3: Play Again only on final popup (20px) ===== */
.popup-card .replay-btn,
.popup-card #playAgainBtn {
    display: none !important;
}
.popup-card.complete .replay-btn,
.popup-card.complete #playAgainBtn {
    display: inline-flex !important;
    margin-top: 12px !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 40px !important;
    background: #0984e3 !important;
    color: #ffffff !important;
    font-size: 20px !important;
    font-weight: 600 !important;
    cursor: pointer;
    box-shadow: 0 6px 0 #0975c7 !important;
    z-index: 5;
    min-width: 178px !important;
    width: 178px !important;
    height: 45px !important;
    align-items: center;
    justify-content: center;
    transition: all 0.1s ease;
}
.popup-card.complete .replay-btn:active,
.popup-card.complete #playAgainBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #0975c7 !important;
}
</style>
</head>
<body>

    <header>
        <h1>Add using a number line.</h1>
        <p class="instruction"><span>Click HOP</span> to jump the frog forward, then type where he lands!</p>
    </header>

    <main class="game-stage">
        <div class="equation-area">
            <span class="eq-num" id="start-num">6</span>
            <span class="eq-op">+</span>
            <span class="eq-num eq-add" id="add-num">3</span>
            
            <button class="hop-btn" id="hop-btn" onclick="hopFrog()">HOP! (3 left)</button>
            
            <span class="eq-op">=</span>
            <input type="text" id="final-input" inputmode="numeric" maxlength="2" disabled class="input-box">
        </div>

        <div class="number-line-container">
            <div class="line-track"></div>
            <div class="track-wrapper">
                <div class="frog" id="frog">🐸</div>
                <div class="lily-pads" id="lily-pads-container"></div>
            </div>
        </div>

        <div class="nav-buttons-container">
            <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>PREV</button>
            <button class="nav-btn" id="nextBtn" onclick="navigate(1)">NEXT</button>
        </div>
    </main>

    <div class="action-area">
        <button class="submit-btn" id="submitBtn" onclick="checkAnswers()" disabled>SUBMIT</button>
    </div>

    <div class="popup-overlay" id="popup">
        <div class="popup-card" id="popupCard">
            <div class="popup-icon" id="popupIcon">⭐</div>
            <h2 class="popup-title" id="popupTitle">Amazing!</h2>
            <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
            <button class="replay-btn" id="playAgainBtn" style="display: none;" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Quiz Configuration
        const questions = [
            { start: 6, add: 3, maxLine: 10 },
            { start: 8, add: 2, maxLine: 10 },
            { start: 13, add: 5, maxLine: 20 },
            { start: 11, add: 4, maxLine: 20 }
        ];

        // State Array to permanently store user progress and answers
        let quizState = Array.from({ length: questions.length }, () => ({
            isSolved: false,
            userAnswer: ''
        }));

        let currentIndex = 0;
        let currentFrogPos = 0;
        let hopsTaken = 0;
        let isAnimating = false;
        let popupTimer = null;
        let audioCtx = null;

        const inputEl = document.getElementById('final-input');
        const submitBtn = document.getElementById('submitBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const hopBtn = document.getElementById('hop-btn');
        const frog = document.getElementById('frog');
        const padContainer = document.getElementById('lily-pads-container');

        // Robust Audio Engine (Lazy loaded to prevent browser blocking)
        function playTone(type) {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2); 
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'hop') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch(e) { console.log('Audio error:', e); }
        }

        function speak(t) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(t);
                msg.lang = "en-US"; msg.volume = 0.8; msg.rate = 1; msg.pitch = 1.2;
                speechSynthesis.speak(msg);
            }
        }

        function loadQuestion() {
            const q = questions[currentIndex];
            const state = quizState[currentIndex];
            
            document.getElementById('start-num').innerText = q.start;
            document.getElementById('add-num').innerText = q.add;
            
            // Build the dynamic number line
            padContainer.innerHTML = '';
            for (let i = 0; i <= q.maxLine; i++) {
                const pad = document.createElement('div');
                pad.className = 'pad-group';
                pad.innerHTML = `<div class="pad-mark"></div><div class="pad-number">${i}</div>`;
                padContainer.appendChild(pad);
            }

            // Restore from state logic
            if (state.isSolved) {
                // If question is already solved, lock everything and jump to end
                currentFrogPos = q.start + q.add;
                hopsTaken = q.add;
                
                inputEl.value = state.userAnswer;
                inputEl.disabled = true;
                submitBtn.disabled = true;
            } else {
                // Fresh state
                currentFrogPos = q.start;
                hopsTaken = 0;
                
                inputEl.value = '';
                inputEl.disabled = true; 
                submitBtn.disabled = true;
            }

            updateHopButton();

            // Render frog position
            frog.classList.remove('frog-move'); // Remove animation to snap instantly
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    snapFrogToPosition(currentFrogPos);
                    setTimeout(() => frog.classList.add('frog-move'), 50); // Restore animation for hopping
                });
            });

            document.getElementById('prevBtn').disabled = (currentIndex === 0);
            document.getElementById('nextBtn').disabled = (currentIndex === questions.length - 1);
        }

        function snapFrogToPosition(pos) {
            const pads = padContainer.querySelectorAll('.pad-group');
            if(pads[pos]) {
                const padCenter = pads[pos].offsetLeft + (pads[pos].offsetWidth / 2);
                frog.style.left = `${padCenter}px`;
            }
        }

        window.addEventListener('resize', () => {
            frog.classList.remove('frog-move');
            snapFrogToPosition(currentFrogPos);
            setTimeout(() => frog.classList.add('frog-move'), 50);
        });

        // The core HOP action
        function hopFrog() {
            if (isAnimating) return;
            const q = questions[currentIndex];
            if (hopsTaken >= q.add) return;

            isAnimating = true;
            hopsTaken++;
            currentFrogPos++;

            updateHopButton();
            playTone('hop');

            snapFrogToPosition(currentFrogPos);
            frog.classList.add('jumping');
            
            setTimeout(() => {
                frog.classList.remove('jumping');
                isAnimating = false;

                if (hopsTaken === q.add && !quizState[currentIndex].isSolved) {
                    inputEl.disabled = false;
                    inputEl.focus();
                }
            }, 300); 
        }

        function updateHopButton() {
            const q = questions[currentIndex];
            const state = quizState[currentIndex];
            const left = q.add - hopsTaken;
            
            if (state.isSolved || left === 0) {
                hopBtn.disabled = true;
                hopBtn.innerHTML = '<i class="fas fa-check"></i> DONE';
            } else {
                hopBtn.disabled = false;
                hopBtn.innerHTML = `HOP! (${left} left)`;
            }
        }

        inputEl.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, ''); 
            submitBtn.disabled = e.target.value.trim() === '';
        });

        function navigate(dir) {
            currentIndex += dir;
            loadQuestion();
        }

        function checkAnswers() {
            const q = questions[currentIndex];
            const targetAns = q.start + q.add;
            const userAns = parseInt(inputEl.value);

            if (userAns !== targetAns) {
                showPopup('wrong', '😟', 'Oops!', 'Check your math and try again!', false);
                playTone('wrong');
                speak("Check your math and try again.");
                inputEl.value = '';
                submitBtn.disabled = true;
                return;
            }

            // SUCCESS! Lock state permanently.
            quizState[currentIndex].isSolved = true;
            quizState[currentIndex].userAnswer = inputEl.value;

            inputEl.disabled = true;
            submitBtn.disabled = true;
            
            if (currentIndex === questions.length - 1) {
                showPopup('complete', '🏆', 'Level Cleared!', 'You are a Number Line Pro! 🎉', true);
                playTone('correct');
                speak("Correct! Fantastic job!");
            } else {
                showPopup('correct', '🌟', 'Amazing!', 'You got it exactly right! ✨', false);
                playTone('correct');
                speak("Correct");
                
                setTimeout(() => { navigate(1); }, 2000);
            }
        }

        function showPopup(status, icon, title, subtitle, isFinal = false) {
            const popup = document.getElementById('popup');
            const card = document.getElementById('popupCard');

            card.className = `popup-card ${status}`;
            document.getElementById('popupIcon').innerText = icon;
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupSubtitle').innerText = subtitle;

            playAgainBtn.style.display = isFinal ? 'inline-block' : 'none';
            popup.classList.add('active');

            clearTimeout(popupTimer);
            if (!isFinal) {
                popupTimer = setTimeout(() => { closePopup(); }, 2000);
            }
        }

        function closePopup() { document.getElementById('popup').classList.remove('active'); }

        function restartGame() {
            closePopup();
            // Wipe the saved state
            quizState = Array.from({ length: questions.length }, () => ({
                isSolved: false,
                userAnswer: ''
            }));
            currentIndex = 0;
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
