<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade1_Leson3</title>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:'Livvic',sans-serif}
body{background:#fbf8eb;color:#29434a;overflow-x:hidden}
body.quiz-open{overflow:hidden}button{font-family:inherit}
.app{min-height:100vh;padding:24px 0 34px;position:relative;background:
radial-gradient(circle at 7% 10%,rgba(255,198,91,.18) 0 105px,transparent 106px),
radial-gradient(circle at 95% 14%,rgba(96,190,255,.15) 0 120px,transparent 121px),
radial-gradient(circle at 85% 90%,rgba(107,214,134,.14) 0 130px,transparent 131px),#fbf8eb}
.home{width:min(1480px,95vw);margin:auto;position:relative;z-index:1}
.hero{text-align:center;margin-bottom:24px}.eyebrow{display:inline-flex;gap:9px;align-items:center;padding:8px 18px;border-radius:999px;background:#fff;border:1px solid #eee2ca;color:#68747d;font-weight:900;font-size:13px;box-shadow:0 8px 20px rgba(86,72,42,.07)}
.eyebrow i{color:#f0a415}.hero h1{font-size:clamp(31px,3.2vw,48px);line-height:1.05;margin-top:10px;font-weight:900;letter-spacing:-1px}.hero h1 span{color:#ed7194}
.cards{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:20px}
.game-card{--accent:#e96d91;--soft:#fff0f4;position:relative;border:0;border-radius:28px;background:#fff;padding:15px;min-height:292px;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 14px 32px rgba(75,67,50,.10),inset 0 0 0 1px rgba(232,225,210,.8);transition:.25s ease}
.game-card:before{content:"";position:absolute;width:155px;height:155px;border-radius:50%;right:-54px;top:-60px;background:var(--soft)}
.game-card:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;left:-25px;bottom:-27px;background:var(--soft);opacity:.7}
.game-card:hover{transform:translateY(-8px) rotate(-.25deg);box-shadow:0 25px 42px rgba(75,67,50,.16)}
.game-card:active{transform:translateY(-2px)}
.card-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.card-number{width:40px;height:34px;display:grid;place-items:center;border-radius:12px;background:var(--soft);color:var(--accent);font-size:13px;font-weight:900}
.card-icon{width:49px;height:49px;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:20px;box-shadow:0 9px 18px rgba(0,0,0,.11)}
.art{height:126px;margin:10px 0;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--soft),#fff);border:1px solid rgba(255,255,255,.9)}
.art:before{content:"";position:absolute;width:135px;height:135px;border-radius:50%;left:-60px;bottom:-85px;background:#fff;opacity:.7}
.visual{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
.card-title{font-size:21px;line-height:1.08;font-weight:900;color:#344e55;position:relative;z-index:2}.card-sub{font-size:13px;color:#7c8a90;margin-top:5px;font-weight:600;position:relative;z-index:2}
.play-row{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.7px;position:relative;z-index:2}.play-circle{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff}.game-card:hover .play-circle{transform:translateX(5px) scale(1.07)}
.theme-pink{--accent:#e96d91;--soft:#fff0f4}.theme-blue{--accent:#4387c9;--soft:#edf6ff}.theme-green{--accent:#35ad6b;--soft:#e9f8ef}.theme-teal{--accent:#259c99;--soft:#e8faf8}.theme-purple{--accent:#7a5bc1;--soft:#f1edff}.theme-orange{--accent:#ed9913;--soft:#fff5df}.theme-indigo{--accent:#5068bd;--soft:#edf0ff}.theme-sky{--accent:#3885b1;--soft:#eaf7fc}.theme-rose{--accent:#cf6681;--soft:#fff0f4}

/* playful activity illustrations */
.math-scene{gap:16px;font-weight:900;font-size:42px;color:var(--accent)}.math-bubble{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:#fff;box-shadow:0 7px 15px rgba(0,0,0,.08)}
.box-scene{gap:13px}.answer-box{width:52px;height:52px;border:3px dashed var(--accent);border-radius:14px;display:grid;place-items:center;font-size:25px;font-weight:900;color:var(--accent);background:#fff}.number-chip{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:900}
.balloon-scene{align-items:flex-end;gap:12px;padding-bottom:18px}.balloon{width:39px;height:49px;border-radius:50% 50% 48% 48%;background:var(--accent);position:relative;box-shadow:inset -7px -7px 0 rgba(0,0,0,.08)}.balloon:after{content:"";position:absolute;left:19px;top:47px;width:1px;height:30px;background:#7d8790}.balloon:nth-child(2){transform:translateY(-18px) scale(.85);opacity:.8}.balloon:nth-child(3){transform:translateY(-5px) scale(1.08)}
.line-scene{flex-direction:column;gap:10px}.number-line{width:78%;height:4px;border-radius:9px;background:var(--accent);position:relative}.number-line:before{content:"0   1   2   3   4   5";position:absolute;top:10px;left:0;right:0;font-size:12px;letter-spacing:12px;font-weight:900;color:var(--accent);white-space:nowrap}.marker{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--accent);position:absolute;top:-7px;left:56%}
.abacus-scene{gap:10px}.abacus{width:165px;height:88px;border:7px solid var(--accent);border-radius:15px;padding:10px;display:flex;flex-direction:column;justify-content:space-around;background:#fff}.rod{height:4px;background:#9baab0;position:relative}.bead{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--accent);top:-9px}.rod .bead:nth-child(1){left:20px}.rod .bead:nth-child(2){left:57px}.rod .bead:nth-child(3){left:100px}
.draw-beads{gap:8px}.string{width:170px;height:5px;border-radius:10px;background:#9aaab0;position:relative}.draw-beads .bead{top:-11px}.draw-beads .bead:nth-child(1){left:30px}.draw-beads .bead:nth-child(2){left:70px}.draw-beads .bead:nth-child(3){left:115px}.pencil{font-size:38px;transform:rotate(-25deg)}
.blank-scene{flex-direction:column;gap:13px}.blank-row{display:flex;align-items:center;gap:8px;font-size:25px;font-weight:900;color:var(--accent)}.blank{width:42px;height:30px;border-bottom:4px dashed var(--accent)}
.lines-scene{gap:12px;align-items:flex-end}.vine{width:9px;border-radius:20px;background:var(--accent);position:relative}.vine:after{content:"🍃";position:absolute;font-size:18px;top:-12px;left:-5px}.vine:nth-child(1){height:42px}.vine:nth-child(2){height:74px}.vine:nth-child(3){height:57px}.count-badge{position:absolute;right:24px;top:20px;background:#fff;color:var(--accent);padding:7px 10px;border-radius:12px;font-size:13px;font-weight:900}
.required-scene{gap:12px}.missing-num{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:3px dashed var(--accent);font-size:30px;font-weight:900;color:var(--accent);background:#fff}.eq{font-size:30px;font-weight:900;color:#7c8a90}

.game-view{display:none;position:fixed;inset:0;z-index:9999;width:100%;height:100vh;background:#fbf8eb;overflow:hidden}.game-view.show{display:block}.game-topbar{position:absolute;top:14px;left:14px;z-index:10001}.back-btn{
  position:relative;
  border:0;
  cursor:pointer;
  min-width:112px;
  height:40px;
  padding:0 16px 0 10px;
  border-radius:16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  overflow:hidden;
  background:rgba(255,255,255,.94);
  color:#355158;
  font-family:"Livvic",sans-serif;
  font-size:13px;
  font-weight:500;
  letter-spacing:.1px;
  box-shadow:0 6px 16px rgba(75,67,50,.11),inset 0 0 0 1px rgba(225,220,207,.9);
  transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
}
.back-btn::before{
  content:"";
  position:absolute;
  width:58px;
  height:58px;
  left:-25px;
  top:-20px;
  border-radius:50%;
  background:rgba(233,247,244,.9);
  pointer-events:none;
}
.back-btn i{
  position:relative;
  z-index:1;
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:#355158;
  color:#fff;
  font-size:13px;
  box-shadow:0 4px 9px rgba(53,81,88,.18);
  transition:transform .2s ease;
}
.back-btn span{
  position:relative;
  z-index:1;
}
.back-btn:hover{
  background:#fff;
  transform:translateY(-2px);
  box-shadow:0 10px 22px rgba(75,67,50,.15),inset 0 0 0 1px rgba(215,210,198,.95);
}
.back-btn:hover i{transform:translateX(-2px)}
.back-btn:active{
  transform:translateY(0);
  box-shadow:0 5px 12px rgba(75,67,50,.13);
}
.back-btn:focus-visible{
  outline:3px solid rgba(53,81,88,.2);
  outline-offset:3px;
}.current-title{display:none}#contentFrame{width:100%;height:100vh;border:0;display:block;background:#fbf8eb}
@media(max-width:980px){.cards{grid-template-columns:repeat(2,minmax(240px,1fr))}}@media(max-width:620px){.home{width:94vw}.cards{grid-template-columns:1fr;gap:14px}.hero h1{font-size:31px}.game-card{min-height:275px}.back-btn{
  min-width:102px;
  height:38px;
  padding:0 14px 0 9px;
  border-radius:15px
}
.back-btn i{
  width:27px;
  height:27px;
  border-radius:9px
}}

/* ===== INNOVATIVE PLAYFUL GAME TILE DESIGN ===== */
.cards{
  grid-template-columns:repeat(3,minmax(270px,1fr));
  gap:24px;
  perspective:1200px;
}
.game-card{
  --accent:#e96d91;--soft:#fff0f4;
  min-height:330px;
  padding:0 0 16px;
  border-radius:32px;
  background:linear-gradient(180deg,#fff 0%,#fffdf8 100%);
  border:3px solid rgba(255,255,255,.9);
  box-shadow:
    0 12px 0 color-mix(in srgb,var(--accent) 22%,#fff),
    0 22px 38px rgba(62,55,45,.13),
    inset 0 0 0 1px rgba(50,50,50,.04);
  overflow:hidden;
  isolation:isolate;
  transform-style:preserve-3d;
}
.game-card:before{
  width:190px;height:190px;right:-65px;top:-75px;
  background:radial-gradient(circle,var(--soft) 0 50%,transparent 51%);
  opacity:1;
  z-index:-1;
}
.game-card:after{
  content:"✦  ✦  ✦";
  width:auto;height:auto;left:auto;bottom:auto;right:18px;top:76px;
  background:none;color:var(--accent);font-size:13px;letter-spacing:5px;
  opacity:.35;transform:rotate(-10deg);z-index:0;
}
.game-card:hover{
  transform:translateY(-12px) rotateX(3deg) rotateY(-2deg);
  box-shadow:
    0 14px 0 color-mix(in srgb,var(--accent) 24%,#fff),
    0 34px 48px rgba(62,55,45,.19),
    inset 0 0 0 1px rgba(50,50,50,.04);
}
.card-top{
  padding:15px 17px 0;
}
.card-number{
  width:54px;height:30px;border-radius:0 0 13px 13px;
  background:var(--accent);color:#fff;
  font-size:12px;letter-spacing:1px;
  box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 65%,#fff);
}
.card-icon{
  width:58px;height:58px;border-radius:20px;
  transform:rotate(5deg);
  border:3px solid #fff;
  box-shadow:0 8px 0 color-mix(in srgb,var(--accent) 58%,#fff),0 13px 22px rgba(0,0,0,.11);
}
.game-card:nth-child(even) .card-icon{transform:rotate(-5deg)}
.art{
  height:152px;
  margin:6px 14px 0;
  border-radius:28px 28px 22px 22px;
  border:0;
  background:
    radial-gradient(circle at 15% 22%,rgba(255,255,255,.8) 0 7px,transparent 8px),
    radial-gradient(circle at 82% 30%,rgba(255,255,255,.65) 0 10px,transparent 11px),
    linear-gradient(135deg,var(--soft),rgba(255,255,255,.7));
  box-shadow:inset 0 -9px 0 rgba(255,255,255,.42);
}
.art:before{
  width:170px;height:80px;left:-35px;bottom:-43px;
  background:#fff;border-radius:50% 50% 0 0;
  opacity:.58;
}
.visual{transform:translateZ(18px)}
.card-title{
  margin:15px 18px 0;
  font-size:23px;
  letter-spacing:-.6px;
}
.card-sub{
  margin:5px 18px 0;
  font-size:13px;
  min-height:18px;
}
.play-row{
  margin:12px 18px 0;
  padding:10px 0 0;
  border-top:2px dashed color-mix(in srgb,var(--accent) 20%,#fff);
}
.play-circle{
  width:43px;height:43px;
  border:3px solid #fff;
  box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 55%,#fff),0 10px 16px rgba(0,0,0,.09);
}
.game-card:hover .card-icon{animation:iconBounce .65s ease both}
.game-card:hover .play-circle{transform:translateX(6px) rotate(-12deg) scale(1.08)}
@keyframes iconBounce{
  0%,100%{translate:0 0}
  40%{translate:0 -7px}
  70%{translate:0 2px}
}
@media(max-width:980px){.cards{grid-template-columns:repeat(2,minmax(240px,1fr));gap:20px}}
@media(max-width:620px){.cards{grid-template-columns:1fr}.game-card{min-height:320px}}

/* ===== COMPACT MULTI-COLOR CARD OVERRIDES ===== */
.cards{gap:18px}
.game-card{
  min-height:302px;
  padding:0 0 13px;
  border-radius:28px;
}
.card-top{padding:12px 15px 0}
.card-icon{width:52px;height:52px;border-radius:18px;font-size:18px}
.card-number{width:48px;height:28px;font-size:11px}
.art{height:134px;margin:5px 12px 0;border-radius:24px 24px 18px 18px}
.card-title{margin:11px 16px 0;font-size:21px}
.card-sub{margin:4px 16px 0;font-size:12px}
.play-row{margin:8px 16px 0;padding-top:8px}
.play-circle{width:38px;height:38px}

/* clearly different colors for every activity */
.game-card:nth-child(1){--accent:#e96d91;--soft:#fff0f4}
.game-card:nth-child(2){--accent:#3486d3;--soft:#eaf5ff}
.game-card:nth-child(3){--accent:#37a96b;--soft:#e8f8ef}
.game-card:nth-child(4){--accent:#12a6a6;--soft:#e6fbfa}
.game-card:nth-child(5){--accent:#7656c7;--soft:#f1edff}
.game-card:nth-child(6){--accent:#e99a18;--soft:#fff4dc}
.game-card:nth-child(7){--accent:#5268c7;--soft:#edf0ff}
.game-card:nth-child(8){--accent:#1995bd;--soft:#e8f8fd}
.game-card:nth-child(9){--accent:#dc6c62;--soft:#fff0ed}

@media(max-width:980px){.cards{gap:16px}.game-card{min-height:298px}}
@media(max-width:620px){.game-card{min-height:295px}}
</style>
</head>
<body>
<div class="app"><main class="home">
<header class="hero"><div class="eyebrow"><i class="fa-solid fa-star"></i> FUN LEARNING ACTIVITIES <i class="fa-solid fa-star"></i></div><h1>Choose an <span>Adventure!</span></h1></header>
<section class="cards">
<button class="game-card theme-pink" onclick="openIsland(0,'Addition')"><div class="card-top"><div class="card-number">01</div><div class="card-icon"><i class="fa-solid fa-plus"></i></div></div><div class="art"><div class="visual math-scene"><span class="math-bubble">2</span><b>+</b><span class="math-bubble">3</span><b>=</b><span>?</span></div></div><div class="card-title">Addition</div><div class="card-sub">Add numbers and solve the sum</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-blue" onclick="openIsland(1,'Fill in the Box')"><div class="card-top"><div class="card-number">02</div><div class="card-icon"><i class="fa-solid fa-square-pen"></i></div></div><div class="art"><div class="visual box-scene"><span class="number-chip">4</span><span class="number-chip">+</span><span class="number-chip">2</span><span class="answer-box">?</span></div></div><div class="card-title">Fill in the Box</div><div class="card-sub">Find the missing answer</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-green" onclick="openIsland(2,'Draw Balloon')"><div class="card-top"><div class="card-number">03</div><div class="card-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div></div><div class="art"><div class="visual balloon-scene"><span class="balloon"></span><span class="balloon"></span><span class="balloon"></span></div></div><div class="card-title">Draw Balloon</div><div class="card-sub">A fun balloon drawing challenge</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-teal" onclick="openIsland(3,'Number Line')"><div class="card-top"><div class="card-number">04</div><div class="card-icon"><i class="fa-solid fa-arrow-right-long"></i></div></div><div class="art"><div class="visual line-scene"><div class="number-line"><span class="marker"></span></div></div></div><div class="card-title">Number Line</div><div class="card-sub">Jump along numbers to solve</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-purple" onclick="openIsland(4,'Abacus Sum')"><div class="card-top"><div class="card-number">05</div><div class="card-icon"><i class="fa-solid fa-calculator"></i></div></div><div class="art"><div class="visual abacus-scene"><div class="abacus"><div class="rod"><span class="bead"></span><span class="bead"></span></div><div class="rod"><span class="bead"></span><span class="bead"></span><span class="bead"></span></div><div class="rod"><span class="bead"></span></div></div></div></div><div class="card-title">Abacus Sum</div><div class="card-sub">Count beads and solve the sum</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-orange" onclick="openIsland(5,'Draw Beads')"><div class="card-top"><div class="card-number">06</div><div class="card-icon"><i class="fa-solid fa-pen-ruler"></i></div></div><div class="art"><div class="visual draw-beads"><span class="pencil">✏️</span><div class="string"><span class="bead"></span><span class="bead"></span><span class="bead"></span></div></div></div><div class="card-title">Draw Beads</div><div class="card-sub">Create and count colorful beads</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-indigo" onclick="openIsland(6,'Fill in the Blanks')"><div class="card-top"><div class="card-number">07</div><div class="card-icon"><i class="fa-solid fa-pencil"></i></div></div><div class="art"><div class="visual blank-scene"><div class="blank-row">3 + <span class="blank"></span> = 8</div><div class="blank-row"><span class="blank"></span> + 2 = 7</div></div></div><div class="card-title">Fill in the Blanks</div><div class="card-sub">Complete every missing number</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-sky" onclick="openIsland(7,'Count Lines')"><div class="card-top"><div class="card-number">08</div><div class="card-icon"><i class="fa-solid fa-bars-staggered"></i></div></div><div class="art"><span class="count-badge">COUNT!</span><div class="visual lines-scene"><span class="vine"></span><span class="vine"></span><span class="vine"></span></div></div><div class="card-title">Count Lines</div><div class="card-sub">Count the lines and answer</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-rose" onclick="openIsland(8,'Number Required')"><div class="card-top"><div class="card-number">09</div><div class="card-icon"><i class="fa-solid fa-question"></i></div></div><div class="art"><div class="visual required-scene"><span class="eq">5 +</span><span class="missing-num">?</span><span class="eq">= 9</span></div></div><div class="card-title">Number Required</div><div class="card-sub">Find which number is needed</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
</section></main></div>
<div class="game-view" id="gameView"><div class="game-topbar"><button class="back-btn" onclick="goHome()" aria-label="Go to Home" title="Home"><i class="fa-solid fa-house"></i><span>Home</span></button><div class="current-title" id="currentTitle">Activity</div></div><iframe id="contentFrame" src="" title="Learning Activity"></iframe></div>
<script>
const frame=document.getElementById('contentFrame');const gameView=document.getElementById('gameView');const currentTitle=document.getElementById('currentTitle');
const pages=['./exercise/addition.html','./exercise/fillinthebox.html','./exercise/drawballon.html','./exercise/numberline.html','./exercise/abacus_sum.html','./exercise/drawbeads.html','./exercise/fillintheblanks.html','./exercise/countlines.html','./exercise/number_required.html'];
function openIsland(index,title,updateUrl=true){
    if(index < 0 || index >= pages.length) return;
    currentTitle.textContent=title; frame.src=pages[index]; gameView.classList.add('show'); document.body.classList.add('quiz-open');
    if(updateUrl) history.replaceState({activity:index},'',window.location.pathname+window.location.search+'#activity='+index);
    window.scrollTo({top:0,behavior:'instant'});
}
function goHome(){
    gameView.classList.remove('show'); document.body.classList.remove('quiz-open'); frame.src='';
    history.replaceState(null,'',window.location.pathname+window.location.search); window.scrollTo({top:0,behavior:'instant'});
}
function restoreActivityFromUrl(){
    const match=window.location.hash.match(/^#activity=(\d+)$/); if(!match) return;
    const index=Number(match[1]);
    if(index>=0 && index<pages.length){ const cards=document.querySelectorAll('.game-card'); const title=cards[index]?cards[index].querySelector('.card-title').textContent:'Activity'; openIsland(index,title,false); }
    else history.replaceState(null,'',window.location.pathname+window.location.search);
}
restoreActivityFromUrl();
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&gameView.classList.contains('show'))goHome();});
</script>
</body></html>
