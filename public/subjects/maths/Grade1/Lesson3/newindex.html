<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Number Quest — Math Games for Kids</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
   <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root{
  --bg:#F3F6FB;
  --ink:#232946;
  --ink-soft:#5A6284;
  --white:#fff;

  --red:#F68D9A;
  --red-light:#FFE3E1;

 --green:#63CDAF;
  --green-light:#D9F7ED;

  --purple:#A895ED;
  --purple-light:#ECE7FF;

  --yellow:#FFC145;

  /* Fluid page spacing */
  --page-x:clamp(18px, 4vw, 75px);

  --gap:clamp(16px, 2vw, 34px);
  font-family: 'Livvic';
}


/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after{
  box-sizing:border-box;
  font-family: "Livvic";
}

html{
  width:100%;
  min-height:100%;
  scroll-behavior:smooth;
}

body{
  width:100%;
  min-height:100vh;

  margin:0;
  padding:0;

  overflow-x:hidden;

  background-color:var(--bg);

  background-image:radial-gradient(
    circle,
    #E2E8F4 1.4px,
    transparent 1.4px
  );

  background-size:26px 26px;

  color:var(--ink);

 
}

h1,
h2,
h3,
h4{
  margin:0;
  
}

p{
  margin:0;
}

button{
 
  border:0;
  cursor:pointer;
}


/* =========================================================
   FULL WIDTH CONTAINER

   IMPORTANT:
   No max-width here.
   This allows the UI to fill 1920px, 2560px, etc.
========================================================= */

.wrap{
  width:100%;
  max-width:none;

  margin:0;

  padding-left:var(--page-x);
  padding-right:var(--page-x);
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  width:100%;

  min-height:70px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  padding-top:clamp(14px, 2vw, 28px);
}

.brand{
  display:flex;

  align-items:center;

  gap:clamp(9px, 1vw, 14px);

  min-width:0;
}

.brand .mark{
  width:clamp(40px, 3.5vw, 58px);
  height:clamp(40px, 3.5vw, 58px);

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:16px;

  background:linear-gradient(
    145deg,
    #FFC145,
    #FF994C
  );

  font-size:clamp(19px, 2vw, 27px);

  transform:rotate(-6deg);

  box-shadow:
    0 7px 16px rgba(255,150,60,.32);
}

.brand span{
  font-size:clamp(
    17px,
    1.5vw,
    24px
  );

  font-weight:400;

  white-space:nowrap;
}

.score-pill{
  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:
    clamp(7px, 1vw, 11px)
    clamp(12px, 1.5vw, 20px);

  border-radius:999px;

  background:#fff;

  color:var(--ink-soft);

  font-size:clamp(
    11px,
    1vw,
    15px
  );

  font-weight:800;

  white-space:nowrap;

  box-shadow:
    0 5px 13px rgba(35,41,70,.07);
}


/* =========================================================
   HERO
========================================================= */

.hero{
  width:100%;

  text-align:center;

  padding-top:clamp(
    30px,
    4vw,
    65px
  );

  padding-bottom:clamp(
    18px,
    2.5vw,
    35px
  );
}

.hero h1{
  font-size:clamp(
    34px,
    4vw,
    64px
  );

  line-height:1.02;

  letter-spacing:-.5px;
  font-weight: 400;
}

.hero p{
  width:100%;

  max-width:760px;

  margin:
    13px auto
    0;

  color:var(--ink-soft);

  font-size:clamp(
    14px,
    1.25vw,
    19px
  );

  line-height:1.5;

  font-weight:600;
}


/* =========================================================
   JOURNEY
========================================================= */

.journey{
  width:100%;

  padding-top:clamp(
    20px,
    2vw,
    35px
  );

  padding-bottom:clamp(
    45px,
    5vw,
    85px
  );
}


/* =========================================================
   THREE CARDS

   Always fills the available screen width.
========================================================= */

#worldsContainer{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap:var(--gap);

  align-items:stretch;
}

.world-row{
  width:100%;
  min-width:0;
}


/* =========================================================
   WORLD CARD
========================================================= */

.world-card{
  width:100%;
  min-width:0;

  min-height:clamp(
    300px,
    20vw,
    300px
  );

  padding:
    clamp(42px, 4vw, 58px)
    clamp(20px, 2.5vw, 42px)
    clamp(25px, 2.5vw, 35px);

  position:relative;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  background:#fff;

  cursor:pointer;

  box-shadow:
    0 14px 32px rgba(35,41,70,.10);

  border-radius:
    38% 62% 58% 42% /
    46% 40% 60% 54%;

  transition:
    transform .22s ease,
    box-shadow .22s ease;
}

.world-row:nth-child(even) .world-card{
  border-radius:
    62% 38% 42% 58% /
    40% 46% 54% 60%;
}

.world-card:hover{
  transform:translateY(-7px);

  box-shadow:
    0 22px 42px rgba(35,41,70,.16);
}


/* =========================================================
   NUMBER
========================================================= */

.world-num{
  position:absolute;

  top:clamp(-14px, -1vw, -8px);
  left:clamp(-8px, -0.7vw, -4px);

  width:clamp(
    42px,
    3.5vw,
    58px
  );

  height:clamp(
    42px,
    3.5vw,
    58px
  );

  border-radius:50%;

  border:3px solid #fff;

  display:flex;

  align-items:center;

  justify-content:center;

  background:var(--yellow);

  color:#5A3C00;


  font-size:clamp(
    18px,
    1.6vw,
    25px
  );

  font-weight:800;

  box-shadow:
    0 7px 15px rgba(0,0,0,.14);
}


/* =========================================================
   CENTER ICON
========================================================= */

.world-icon{
  width:clamp(
    66px,
    6vw,
    96px
  );

  height:clamp(
    66px,
    6vw,
    96px
  );

  margin:
    0
    auto
    clamp(7px, 1vw, 12px);

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:clamp(
    18px,
    2vw,
    28px
  );

  font-size:clamp(
    32px,
    3.2vw,
    50px
  );
}

.world-card.w1 .world-icon{
  background:var(--red-light);
}

.world-card.w2 .world-icon{
  background:var(--green-light);
}

.world-card.w3 .world-icon{
  background:var(--purple-light);
}


/* =========================================================
   GAMES BELOW ICON
========================================================= */

.world-games{
  display:inline-flex;

  align-items:center;

  justify-content:center;

  margin:
    0
    auto
    clamp(5px, .8vw, 9px);

  padding:
    5px
    13px;

  border-radius:999px;

  background:#F3F5FA;

  color:var(--ink-soft);

  font-size:clamp(
    11px,
    1vw,
    14px
  );

  font-weight:800;

  white-space:nowrap;
}


/* =========================================================
   TITLE
========================================================= */

.world-card h3{
  width:100%;

  margin-bottom:7px;

  font-size:clamp(
    23px,
    2.1vw,
    32px
  );

  line-height:1.08;
  font-weight: 400;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.world-card p.desc{
  width:100%;

  max-width:390px;

  min-height:44px;

  margin:0 auto;

  color:var(--ink-soft);

  font-size:clamp(
    13px,
    1.15vw,
    17px
  );

  line-height:1.45;

  font-weight:400;
  /* display: none; */
}


/* =========================================================
   BOTTOM BUTTON AREA
========================================================= */

.world-meta{
  width:100%;

  margin-top:auto;

  padding-top:clamp(
    17px,
    2vw,
    28px
  );

  display:flex;

  align-items:center;

  justify-content:center;
}


/* =========================================================
   EXPLORE BUTTON
========================================================= */

.go-btn{
  min-width:clamp(
    110px,
    10vw,
    155px
  );

  display:inline-flex;

  align-items:center;

  justify-content:center;

  padding:
    clamp(9px, 1vw, 13px)
    clamp(18px, 2vw, 28px);

  border-radius:999px;

  color:#fff;

  font-size:clamp(
    12px,
    1.1vw,
    16px
  );

  font-weight:400;

  white-space:nowrap;
}

.world-card.w1 .go-btn{
  background:var(--red);
}

.world-card.w2 .go-btn{
  background:var(--green);
}

.world-card.w3 .go-btn{
  background:var(--purple);
}


/* =========================================================
   CATEGORY VIEW
========================================================= */

#categoryView{
  display:none;

  width:100%;

  padding-bottom:80px;
}

.back-btn{
  display:inline-flex;

  align-items:center;

  justify-content:center;

  margin:
    18px
    0
    25px;

  padding:
    15px
    22px;

  border-radius:999px;

  background:#fff;

  color:var(--ink);
 font-family: "Livvic";
  font-size:18px;

  font-weight:500;

  box-shadow:
    0 5px 12px rgba(35,41,70,.08);
}


/* =========================================================
   CATEGORY BANNER
========================================================= */

.cat-banner{
  position:relative;

  width:100%;

  overflow:hidden;

  display:flex;

  align-items:center;

  gap:20px;

  padding:clamp(
    22px,
    3vw,
    38px
  );

  margin-bottom:clamp(
    20px,
    2.5vw,
    32px
  );

  border-radius:28px;

  color:#fff;
}

.cat-banner .blob{
  position:absolute;

  width:280px;
  height:280px;

  right:-90px;
  top:-90px;

  border-radius:50%;

  background:rgba(255,255,255,.14);
}

.cat-banner .icon{
  width:clamp(
    60px,
    5vw,
    82px
  );

  height:clamp(
    60px,
    5vw,
    82px
  );

  flex-shrink:0;

  border-radius:22px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:rgba(255,255,255,.2);

  font-size:clamp(
    29px,
    3vw,
    42px
  );
}

.cat-banner h2{
  font-size:clamp(
    23px,
    2.3vw,
    34px
  );
  font-weight: 500;
}

.cat-banner p{
  margin-top:5px;

  font-size:clamp(
    12px,
    1.15vw,
    16px
  );

  font-weight:400;

  opacity:.94;
}


/* =========================================================
   GAME GRID
========================================================= */

.game-grid{
  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3, minmax(0,1fr));

  gap:var(--gap);
}

.game-card{
  position:relative;

  min-width:0;

  background:#fff;

  padding:
    clamp(38px, 3.5vw, 52px)
    clamp(16px, 2vw, 30px)
    clamp(20px, 2vw, 28px);

  text-align:center;

  clip-path:polygon(
    24px 0,
    100% 0,
    100% calc(100% - 24px),
    calc(100% - 24px) 100%,
    0 100%,
    0 24px
  );

  box-shadow:
    0 12px 24px rgba(35,41,70,.10);
}

.game-num{
  position:absolute;

  top:12px;
  left:15px;

  color:var(--ink-soft);

 

  font-size:13px;

  font-weight:800;

  opacity:.65;
}

.game-medal{
  width:clamp(
    58px,
    5vw,
    76px
  );

  height:clamp(
    58px,
    5vw,
    76px
  );

  margin:
    0
    auto
    14px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:clamp(
    28px,
    2.8vw,
    38px
  );

  color:#fff;

  border:4px solid #fff;

  box-shadow:
    0 8px 16px rgba(0,0,0,.14);
}

.game-card h4{
  margin-bottom:7px;

  font-size:clamp(
    22px,
    2.5vw,
    27px
  );
  font-weight: 400;
}

.game-card p{
  min-height:38px;

  margin-bottom:17px;

  color:var(--ink-soft);

  font-size:clamp(
    15px,
    2vw,
    18px
  );

  font-weight:400;
}

.start-btn{
  width:30%;

  padding:
    10px
    15px;

  border-radius:999px;

  color:#fff;

  font-size:clamp(
    17px,
    1.3vw,
    20px
  );

  font-weight:400;
}


/* =========================================================
   QUIZ IFRAME
========================================================= */

#quizView{
  display:none;

  position:fixed;

  inset:0;

  width:100vw;

  height:100dvh;

  min-height:100vh;

  background:#fff;

  z-index:9999;

  overflow:hidden;
}

#quizFrame{
  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  border:0;

  display:block;

  background:#fff;
}


/* =========================================================
   ONLY HOME BUTTON
========================================================= */

.quiz-home-btn{
  position:fixed;

  top:max(
    12px,
    env(safe-area-inset-top)
  );

  left:max(
    12px,
    env(safe-area-inset-left)
  );

  z-index:10001;

  width:clamp(
    44px,
    3.5vw,
    58px
  );

  height:clamp(
    44px,
    3.5vw,
    58px
  );

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#232946;

  color:#fff;

  font-size:clamp(
    19px,
    2vw,
    28px
  );

  box-shadow:
    0 7px 18px rgba(0,0,0,.22);
}


/* =========================================================
   LARGE MONITOR
========================================================= */

@media(min-width:1600px){

  :root{
    --page-x:clamp(
      40px,
      4vw,
      85px
    );

    --gap:clamp(
      25px,
      2vw,
      45px
    );
  }
  .world-card{
    width:80%;
    margin: auto;
  }

}


/* =========================================================
   4K / VERY LARGE MONITOR
========================================================= */

@media(min-width:2400px){

  :root{
    --page-x:clamp(
      60px,
      5vw,
      120px
    );

    --gap:45px;
  }

  .world-card{
    min-height:400px;
  }

}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:850px){

  :root{
    --page-x:22px;
    --gap:20px;
  }

  #worldsContainer{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .world-row:last-child{
    grid-column:1 / -1;

    width:calc(50% - 10px);

    margin-left:auto;
    margin-right:auto;
  }

  .game-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:620px){

  :root{
    --page-x:15px;
    --gap:20px;
  }

  .topbar{
    min-height:55px;

    gap:10px;
  }

  .brand .mark{
    border-radius:12px;
  }

  .brand span{
    font-size:16px;
  }

  .score-pill{
    max-width:145px;

    overflow:hidden;

    text-overflow:ellipsis;
  }

  .hero{
    padding-top:27px;
  }

  .hero h1{
    font-size:34px;
  }

  .hero p{
    font-size:13.5px;
  }

  #worldsContainer{
    grid-template-columns:1fr;
  }

  .world-row:last-child{
    grid-column:auto;

    width:100%;
  }

  .world-card{
    min-height:300px;

    padding:
      42px
      20px
      25px;
  }

  .game-grid{
    grid-template-columns:1fr;
  }

  .cat-banner{
    gap:14px;

    padding:20px;

    border-radius:23px;
  }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width:390px){

  :root{
    --page-x:12px;
  }

  .brand span{
    font-size:14px;
  }

  .score-pill{
    max-width:110px;

    padding:
      6px
      8px;

    font-size:9px;
  }

  .hero h1{
    font-size:29px;
  }

  .hero p{
    font-size:12.5px;
  }

  .world-card{
    min-height:290px;

    padding-left:17px;
    padding-right:17px;
  }

}


/* =========================================================
   LANDSCAPE MOBILE
========================================================= */

@media(
  max-height:500px
) and (
  orientation:landscape
){

  .hero{
    padding-top:15px;
    padding-bottom:10px;
  }

  .world-card{
    min-height:270px;
  }

}


/* =========================================================
   TOUCH DEVICES
========================================================= */

@media(hover:none){

  .world-card:hover{
    transform:none;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  html{
    scroll-behavior:auto;
  }

  *,
  *::before,
  *::after{
    transition:none !important;
  }

}

</style>
</head>


<body>


<!-- =======================================================
     MAIN PAGE
======================================================= -->

<div class="wrap">


  <!-- TOP BAR -->

  <div class="topbar">

    <div class="brand">

      <div class="mark">
        🔢
      </div>

      <span>
        Math Adventure
      </span>

    </div>


    <div class="score-pill">
      ⭐ 9 Activities to explore
    </div>

  </div>


  <!-- =====================================================
       HOME
  ====================================================== -->

  <div id="homeView">

    <section class="hero">

      <h1>
      Choose an Activity, Start the Quest
      </h1>

      <!-- <p>
        Nine bite-sized math games, sorted into three worlds.
        Clear a world one game at a time.
      </p> -->

    </section>


    <section class="journey">

      <div id="worldsContainer"></div>

  </div>


  <!-- =====================================================

</div>

     QUIZ IFRAME
======================================================= -->

<div id="quizView">

  <!-- ONLY HOME BUTTON -->

  <button
    type="button"

    onclick="returnToHome()"
    aria-label="Home"

    🏠
  </button>


  <iframe
    id="quizFrame"
    src="about:blank"
    title="Math Quiz"
    allowfullscreen
  ></iframe>

</div>



<script>

/* =========================================================
   DATA
========================================================= */
const DATA = [

  {

      },

      {

  {

    games:[
      {

      },

      {

/* =========================================================
   ELEMENTS
========================================================= */

const worldsContainer =
  document.getElementById('worldsContainer');

const homeView =
  document.getElementById('homeView');

const categoryView =
  document.getElementById('categoryView');

const catBanner =
  document.getElementById('catBanner');

const catGrid =
  document.getElementById('catGrid');

const quizView =
  document.getElementById('quizView');

const quizFrame =
  document.getElementById('quizFrame');


/* =========================================================
   RENDER WORLDS
========================================================= */

function renderWorlds(){

  worldsContainer.innerHTML = DATA.map(
    (world,index) => `

      <div class="world-row">

        <div
          class="world-card ${world.key}"
          onclick="openWorld('${world.id}')"
          role="button"
          tabindex="0"
          onkeydown="
            if(event.key==='Enter' || event.key===' '){
              event.preventDefault();
              openWorld('${world.id}');
            }
          "
        >

          <div class="world-num">
            ${index + 1}
          </div>


          <!-- CENTER ICON -->

          <div class="world-icon">
            ${world.icon}
          </div>


          <!-- GAMES BELOW ICON -->

          <div class="world-games">
            ${world.games.length} games
          </div>


          <!-- TITLE -->

          <h3>
            ${world.name}
          </h3>


          <!-- DESCRIPTION -->

          <p class="desc">
            ${world.desc}
          </p>


          <!-- CENTER EXPLORE -->

          <div class="world-meta">

            <span class="go-btn">
             EXPLORE ACTIVITIES
            </span>

          </div>

        </div>

      </div>

    `
  ).join('');

}


/* =========================================================
   OPEN WORLD
========================================================= */

function openWorld(id){
currentWorldId = id;
  const world =
    DATA.find(
      item => item.id === id
    );

  if(!world){
    return;
  }

  /* Only category banner + Play button colors are changed */
  const pastel = {
    w1:{banner:'#F3C9D3', text:'#5C4D54', button:'#EFCBD5'},
    w2:{banner:'#CDE8D8', text:'#4E5D54', button:'#D2EBDD'},
    w3:{banner:'#D9D1F2', text:'#564F66', button:'#DDD6F2'}
  }[world.id];


  catBanner.innerHTML = `

    <div
      class="cat-banner"
      style="background:${pastel.banner};color:${pastel.text}"
    >

      <div class="blob"></div>

      <div class="icon">
        ${world.icon}
      </div>

      <div>

        <h2>
          ${world.name}
        </h2>

        <p>
          ${world.desc}
        </p>

      </div>

    </div>

  `;


  catGrid.innerHTML = world.games.map(
    (game,index) => `

      <div class="game-card">

        <span class="game-num">
          ${String(index + 1).padStart(2,'0')}
        </span>


        <div
          class="game-medal"
          style="background:${world.color}"
        >
          ${game.icon}
        </div>


        <h4>
          ${game.title}
        </h4>


        <p>
          ${game.desc}
        </p>


        <button
          type="button"
          class="start-btn"
          style="background:${pastel.button};color:${pastel.text}"
          onclick="startGame('${escapeJs(game.url)}')"
        >
           Play  ▶
        </button>

      </div>

    `
  ).join('');


  homeView.style.display='none';

  categoryView.style.display='block';


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* =========================================================
   START GAME
========================================================= */
let currentWorldId = null;
function startGame(url){

  if(!url){
    return;
  }

  quizFrame.src=url;

  homeView.style.display='none';

  categoryView.style.display='none';

  quizView.style.display='block';

  document.body.style.overflow='hidden';

}


/* =========================================================
   HOME FROM QUIZ
========================================================= */

function returnToHome(){

  // Stop the current iframe game
  quizFrame.src='about:blank';

  // Hide quiz screen
  quizView.style.display='none';

  // If user came from a category, return to that category
  if(currentWorldId){

    categoryView.style.display='block';
    homeView.style.display='none';

    // Rebuild the same category cards
    openWorld(currentWorldId);

  }else{

    // Fallback: show main 3 cards
    categoryView.style.display='none';
    homeView.style.display='block';

  }

  document.body.style.overflow='';

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}

/* =========================================================
   BACK TO WORLDS
========================================================= */

function showHome(){

  categoryView.style.display='none';

  homeView.style.display='block';

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* =========================================================
   ESCAPE URL
========================================================= */

function escapeJs(value){

  return String(value)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/\n/g,'\\n')
    .replace(/\r/g,'\\r');

}


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
  'keydown',
  function(event){

    if(
      event.key === 'Escape' &&
      quizView.style.display === 'block'
    ){

      returnToHome();

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

renderWorlds();

</script>

</body>
</html>
