<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numberland — Choose an Activity</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#20284a;
  --muted:#667096;
  --page:#f5f8fd;
  --white:#fff;
  --shadow:0 14px 32px rgba(46,55,91,.10);
  --pink:#f47f91;
  --pink-soft:#f8cbd5;
  --green:#61cbb0;
  --green-soft:#cceee2;
  --purple:#9b86e9;
  --purple-soft:#ddd4f8;
  --yellow:#ffbf45;
  --line:#e7ebf4;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:"Livvic",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10px 10px, rgba(104,126,177,.12) 1.5px, transparent 1.7px) 0 0/34px 34px,
    var(--page);
  overflow-x:hidden;
}

button{
  font:inherit;
}

button:focus-visible{
  outline:4px solid rgba(255,191,69,.55);
  outline-offset:4px;
}

.wrap{
  width:min(1510px, calc(100% - 72px));
  margin:0 auto;
  padding:28px 0 52px;
}

/* =========================================================
   HOME / ACTIVITY SELECTION
   ========================================================= */

#homePage{
  display:block;
}

.home-title{
  margin:22px 0 100px;
  text-align:center;
  font-size:clamp(42px,4.2vw,68px);
  line-height:1.05;
  font-weight:400;
  letter-spacing:-1.8px;
  color:#20284a;
}

.home-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:42px;
  align-items:start;
}

.activity-wrap{
  position:relative;
  min-width:0;
  padding-top:0;
}

.activity-number{
  position:absolute;
  z-index:5;
  top:-16px;
  left:-14px;
  width:54px;
  height:54px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--yellow);
  color:#5d4210;
  border:4px solid #fff;
  box-shadow:0 7px 18px rgba(52,60,91,.18);
  font-size:27px;
  font-weight:800;
}

.activity-card{
  width:100%;
  aspect-ratio:1/1;
  min-height:430px;
  border:0;
  border-radius:50%;
  background:#fff;
  box-shadow:var(--shadow);
  padding:62px 52px 48px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
  transition:transform .18s ease, box-shadow .18s ease;
  overflow:hidden;
}

.activity-card:hover{
  transform:translateY(-6px);
  box-shadow:0 22px 42px rgba(46,55,91,.15);
}

.activity-card:active{
  transform:translateY(-2px);
}

.activity-icon{
  width:98px;
  height:98px;
  border-radius:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 0 16px;
  font-size:57px;
  line-height:1;
}

.activity-wrap[data-pack="1"] .activity-icon{
  background:#ffe0e1;
}

.activity-wrap[data-pack="2"] .activity-icon{
  background:#d8f5ed;
}

.activity-wrap[data-pack="3"] .activity-icon{
  background:#e8e0ff;
}

.activity-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:101px;
  min-height:34px;
  padding:5px 16px;
  border-radius:999px;
  background:#f1f4fa;
  color:#526085;
  font-size:16px;
  font-weight:500;
  margin-bottom:13px;
}

.activity-card h2{
  margin:0 0 10px;
  font-size:clamp(26px,2.2vw,34px);
  line-height:1.05;
  font-weight:400;
  letter-spacing:-.4px;
}

.activity-card p{
  max-width:390px;
  min-height:50px;
  margin:0 auto 27px;
  color:#59678e;
  font-size:clamp(16px,1.35vw,20px);
  line-height:1.42;
}

.explore-btn{
  margin-top:auto;
  min-width:230px;
  min-height:55px;
  padding:20px 26px;
  border:0;
  border-radius:999px;
  color:#fff;
  font-size:17px;
  font-weight:500;
  cursor:pointer;
  text-align: center;
  transition:transform .15s ease, filter .15s ease;
}

.activity-wrap[data-pack="1"] .explore-btn{background:var(--pink)}
.activity-wrap[data-pack="2"] .explore-btn{background:var(--green)}
.activity-wrap[data-pack="3"] .explore-btn{background:var(--purple)}

.activity-card:hover .explore-btn{
  transform:translateY(-1px);
  filter:brightness(1.03);
}

/* =========================================================
   PACK PAGE
   ========================================================= */

#packView{
  display:none;
}

.pack-topbar{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  margin:0 0 33px;
}

#backBtn{
  border:0;
  min-width:110px;
  min-height:46px;
  padding:0 30px;
  border-radius:999px;
  background:#fff;
  color:#17203f;
  box-shadow:0 9px 24px rgba(46,55,91,.13);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-size:18px;
  font-weight:500;
  transition:transform .15s ease, box-shadow .15s ease;
}

#backBtn:hover{
  transform:translateY(-2px);
  box-shadow:0 13px 28px rgba(46,55,91,.16);
}

.pack-banner{
  position:relative;
  min-height:180px;
  margin-bottom:42px;
  padding:34px 48px;
  border-radius:34px;
  overflow:hidden;
  display:flex;
  align-items:center;
  border:0;
}

.pack-banner::after{
  content:"";
  position:absolute;
  width:430px;
  height:430px;
  right:-205px;
  top:-165px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
}

.pack-banner-inner{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:25px;
}

.pack-banner-icon{
  width:82px;
  height:82px;
  flex:0 0 82px;
  border-radius:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.27);
  font-size:49px;
  line-height:1;
}

.pack-banner h2{
  margin:0 0 7px;
  font-size:clamp(34px,3.2vw,52px);
  line-height:1;
  font-weight:500;
  letter-spacing:-1px;
}

.pack-banner p{
  margin:0;
  font-size:clamp(17px,1.4vw,21px);
  line-height:1.4;
}

.quiz-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:30px;
}

.quiz-card{
  position:relative;
  min-width:0;
  min-height:370px;
  padding:18px 20px 30px;
  background:#fff;
  border:0;
  border-radius:0;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 30px),calc(100% - 30px) 100%,0 100%);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  cursor:pointer;
  transition:transform .17s ease, box-shadow .17s ease;
}

.quiz-card:hover{
  transform:translateY(-5px);
  box-shadow:0 20px 38px rgba(46,55,91,.14);
}

.quiz-number{
  align-self:flex-start;
  color:#8d97b3;
  font-size:18px;
  line-height:1;
  font-weight:500;
  margin:0 0 24px;
}

.quiz-icon{
  width:82px;
  height:82px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:43px;
  line-height:1;
  border:4px solid #fff;
  box-shadow:0 8px 19px rgba(45,53,84,.18);
  margin-bottom:23px;
}

.quiz-card h3{
  margin:0 0 9px;
  font-size:clamp(25px,2vw,34px);
  line-height:1.05;
  font-weight:400;
  letter-spacing:-.5px;
}

.quiz-card p{
  margin:0 auto 24px;
  color:#56648b;
  font-size:clamp(16px,1.3vw,20px);
  line-height:1.4;
  max-width:390px;
}

.play-btn{
  margin-top:auto;
  min-width:123px;
  min-height:55px;
  padding:0 25px;
  border:0;
  border-radius:999px;
  color:#31405e;
  cursor:pointer;
  font-size:18px;
  font-weight:400;
  transition:transform .15s ease, filter .15s ease;
}

.play-btn:hover{
  transform:translateY(-2px);
  filter:brightness(.99);
}

/* Pack colors */
.pack-pink .pack-banner{background:#cfe7d9}
.pack-pink .pack-banner{background:#d9bdf0}
.pack-green .pack-banner{background:#cbe9dc}
.pack-purple .pack-banner{background:#ddd3f5}

.pack-pink .quiz-icon{background:#9a86e8}
.pack-green .quiz-icon{background:#5fcdb1}
.pack-purple .quiz-icon{background:#9b86e9}

.pack-pink .play-btn{background:#dccff5}
.pack-green .play-btn{background:#cbe9dc}
.pack-purple .play-btn{background:#f1c6d1}

/* =========================================================
   QUIZ MODAL
   ========================================================= */

#quizModal{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  width:100vw;
  height:100dvh;
  background:#fff;
  overflow:hidden;
}

#quizModal.open{
  display:block;
}

#quizFrame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  margin:0;
  padding:0;
  display:block;
}

#quizHomeBtn{
  position:absolute;
  top:14px;
  left:14px;
  z-index:100000;
  min-width:105px;
  height:48px;
  padding:0 18px;
  border:3px solid #fff;
  border-radius:999px;
  background:#fff;
  color:#20284a;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(42,34,65,.20);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (min-width:1600px){
  .wrap{
    width:min(1540px,calc(100% - 90px));
    padding-top:25px;
  }

  .home-title{
    margin-top:24px;
    margin-bottom:122px;
    font-size:64px;
  }

  .home-grid{
    gap:50px;
  }

  .activity-card{
    min-height:455px;
    padding:64px 58px 50px;
  }

  .activity-icon{
    width:100px;
    height:100px;
    font-size:58px;
  }

  .activity-card h2{
    font-size:35px;
  }

  .activity-card p{
    font-size:19px;
  }

  .explore-btn{
    min-width:230px;
    min-height:57px;
  }

  .pack-banner{
    min-height:180px;
  }

  .quiz-grid{
    gap:34px;
  }

  .quiz-card{
    min-height:370px;
  }
}

@media (max-width:1250px){
  .wrap{
    width:min(1120px,calc(100% - 42px));
  }

  .home-grid{
    gap:28px;
  }

  .activity-card{
    min-height:360px;
    padding:48px 35px 36px;
  }

  .activity-icon{
    width:82px;
    height:82px;
    font-size:48px;
    border-radius:22px;
  }

  .activity-card h2{
    font-size:29px;
  }

  .activity-card p{
    font-size:17px;
  }

  .explore-btn{
    min-width:190px;
    min-height:50px;
  }

  .quiz-grid{
    gap:22px;
  }
}

@media (max-width:900px){
  .wrap{
    width:calc(100% - 28px);
    padding:18px 0 36px;
  }

  .home-title{
    margin:15px 0 34px;
    font-size:42px;
  }

  .home-grid{
    grid-template-columns:1fr;
    max-width:620px;
    margin:0 auto;
    gap:32px;
  }

  .activity-card{
    min-height:0;
    aspect-ratio:1.45/1;
    border-radius:45%;
    padding:45px 70px 35px;
  }

  .activity-number{
    left:2px;
  }

  .quiz-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .pack-banner{
    min-height:160px;
    padding:28px 30px;
  }

  .pack-banner-icon{
    width:70px;
    height:70px;
    flex-basis:70px;
    font-size:40px;
  }

  .quiz-card{
    min-height:350px;
  }
}

@media (max-width:600px){
  .wrap{
    width:calc(100% - 18px);
    padding:12px 0 28px;
  }

  .home-title{
    margin:12px 10px 30px;
    font-size:34px;
    letter-spacing:-.7px;
  }

  .home-grid{
    gap:24px;
  }

  .activity-number{
    top:-8px;
    left:5px;
    width:47px;
    height:47px;
    font-size:22px;
  }

  .activity-card{
    aspect-ratio:1/1;
    border-radius:50%;
    padding:46px 34px 36px;
  }

  .activity-icon{
    width:76px;
    height:76px;
    font-size:44px;
    margin-bottom:13px;
  }

  .activity-count{
    min-height:30px;
    font-size:14px;
    margin-bottom:11px;
  }

  .activity-card h2{
    font-size:25px;
  }

  .activity-card p{
    font-size:15px;
    min-height:0;
    margin-bottom:20px;
  }

  .explore-btn{
    min-width:190px;
    min-height:49px;
    font-size:15px;
  }

  .pack-topbar{
    margin-bottom:18px;
  }

  #backBtn{
    min-width:130px;
    min-height:52px;
    font-size:17px;
    padding:0 22px;
  }

  .pack-banner{
    min-height:150px;
    padding:22px;
    border-radius:25px;
    margin-bottom:25px;
  }

  .pack-banner-inner{
    gap:15px;
  }

  .pack-banner-icon{
    width:58px;
    height:58px;
    flex-basis:58px;
    border-radius:18px;
    font-size:32px;
  }

  .pack-banner h2{
    font-size:31px;
  }

  .pack-banner p{
    font-size:14px;
  }

  .quiz-grid{
    grid-template-columns:1fr;
    gap:18px;
  }

  .quiz-card{
    min-height:320px;
    padding:17px 18px 28px;
  }

  .quiz-number{
    margin-bottom:18px;
  }

  .quiz-icon{
    width:72px;
    height:72px;
    font-size:37px;
    margin-bottom:18px;
  }

  .quiz-card h3{
    font-size:26px;
  }

  .quiz-card p{
    font-size:15px;
  }

  #quizHomeBtn{
    top:8px;
    left:8px;
    height:43px;
    min-width:92px;
    padding:0 13px;
    font-size:14px;
  }
}

@media (max-height:800px) and (min-width:901px){
  .wrap{
    padding-top:16px;
  }

  .home-title{
    margin:8px 0 54px;
    font-size:52px;
  }

  .activity-card{
    min-height:390px;
    padding-top:50px;
  }

  .activity-icon{
    width:84px;
    height:84px;
    font-size:48px;
  }

  .activity-card p{
    margin-bottom:18px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- HOME -->
  <main id="homePage">
    <h1 class="home-title">Choose an Activity, Start the Quest</h1>
    <section class="home-grid" id="home"></section>
  </main>

  <!-- PACK VIEW -->
  <main id="packView">
    <div class="pack-topbar">
      <button id="backBtn" type="button" onclick="showHome()">🏠 <span>Home</span></button>
    </div>

    <section class="pack-banner" id="packBanner"></section>
    <section class="quiz-grid" id="quizGrid"></section>
  </main>

</div>

<!-- FULL SCREEN QUIZ -->
<div id="quizModal" aria-hidden="true">
  <button id="quizHomeBtn" type="button" onclick="closeQuiz()">
    <span>🏠</span> Home
  </button>
  <iframe id="quizFrame" title="Numberland Quiz" src="about:blank" allow="fullscreen"></iframe>
</div>

<script>
/*
  The activity names, descriptions and visual grouping below match
  the supplied reference designs.
*/
const packs = [
  {
    id:1,
    title:"Number Ninjas",
    emoji:"➕",
    color:"#F47F91",
    soft:"#F8CBD5",
    blurb:"Sharpen your arithmetic with quick number puzzles.",
    quizzes:[
      {
        title:"Addition",
        desc:"Add numbers and solve the sum",
        emoji:"➕",
        icon:"➕"
      },
      {
        title:"Fill in the Box",
        desc:"Find the missing answer",
        emoji:"🧩",
        icon:"🧩"
      },
      {
        title:"Fill in the Blanks",
        desc:"Complete every missing number",
        emoji:"📝",
        icon:"✏️"
      }
    ]
  },
  {
    id:2,
    title:"Counting Cove",
    emoji:"🧮",
    color:"#61CBB0",
    soft:"#CCEEE2",
    blurb:"Count, click, and jump your way through numbers.",
    quizzes:[
      {
        title:"Number Line",
        desc:"Jump along numbers to solve",
        emoji:"🔢",
        icon:"🔢"
      },
      {
        title:"Abacus Sum",
        desc:"Count beads and solve the sum",
        emoji:"🧮",
        icon:"🧮"
      },
      {
        title:"Count Lines",
        desc:"Count the lines and answer",
        emoji:"📊",
        icon:"📊"
      }
    ]
  },
  {
    id:3,
    title:"Creative Corner",
    emoji:"🎨",
    color:"#9B86E9",
    soft:"#DDD4F8",
    blurb:"Draw, doodle, and discover numbers along the way.",
    quizzes:[
      {
        title:"Draw Balloon",
        desc:"A fun balloon drawing challenge",
        emoji:"🎈✏️",
        icon:"🎈"
      },
      {
        title:"Draw Beads",
        desc:"Create and count colorful beads",
        emoji:"🟢",
        icon:"🟢"
      },
      {
        title:"Number Required",
        desc:"Find which number is needed",
        emoji:"❓",
        icon:"❓"
      }
    ]
  }
];

const homeEl = document.getElementById("home");
const homePage = document.getElementById("homePage");
const packView = document.getElementById("packView");
const packBanner = document.getElementById("packBanner");
const quizGrid = document.getElementById("quizGrid");

function renderHome(){
  homeEl.innerHTML = packs.map(p => `
    <div class="activity-wrap" data-pack="${p.id}">
      <span class="activity-number">${p.id}</span>

      <button class="activity-card" type="button" onclick="openPack(${p.id})">
        <span class="activity-icon" aria-hidden="true">${p.emoji}</span>

        <span class="activity-count">${p.quizzes.length} games</span>

        <h2>${p.title}</h2>

        <p>${p.blurb}</p>

        <span class="explore-btn">EXPLORE ACTIVITIES</span>
      </button>
    </div>
  `).join("");
}

const packTheme = {
  1:{
    className:"pack-pink",
    banner:"#f1c9d4",
    bannerText:"#4f596f",
    iconBg:"#f8dce3",
    card:"#ffffff",
    icon:"#9b86e9",
    play:"#e7d9f5",
    playText:"#47516b"
  },
  2:{
    className:"pack-green",
    banner:"#cce9db",
    bannerText:"#4e5d57",
    iconBg:"#d9f3e9",
    card:"#ffffff",
    icon:"#61cbb0",
    play:"#d4eee3",
    playText:"#4e625c"
  },
  3:{
    className:"pack-purple",
    banner:"#d9d0f1",
    bannerText:"#4f5870",
    iconBg:"#e9e2fa",
    card:"#ffffff",
    icon:"#9b86e9",
    play:"#ddd3f3",
    playText:"#51566d"
  }
};

function openPack(id){
  const pack = packs.find(p => p.id === id);
  if(!pack) return;

  const theme = packTheme[id];

  homePage.style.display = "none";
  packView.style.display = "block";

  packBanner.className = "pack-banner " + theme.className;
  packBanner.style.background = theme.banner;
  packBanner.style.color = theme.bannerText;

  packBanner.innerHTML = `
    <div class="pack-banner-inner">
      <div class="pack-banner-icon"
           style="background:${theme.iconBg}">
        ${pack.emoji}
      </div>

      <div>
        <h2>${pack.title}</h2>
        <p>${pack.blurb}</p>
      </div>
    </div>
  `;

  quizGrid.innerHTML = pack.quizzes.map((q,i) => `
    <article class="quiz-card"
             role="button"
             tabindex="0"
             onclick="startQuiz('${escapeJs(q.title)}')"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();startQuiz('${escapeJs(q.title)}')}">

      <div class="quiz-number">${String(i+1).padStart(2,"0")}</div>

      <div class="quiz-icon"
           style="background:${theme.icon}">
        ${q.icon}
      </div>

      <h3>${q.title}</h3>

      <p>${q.desc}</p>

      <button class="play-btn"
              type="button"
              style="background:${theme.play};color:${theme.playText}"
              onclick="event.stopPropagation();startQuiz('${escapeJs(q.title)}')">
        Play ▶
      </button>
    </article>
  `).join("");

  window.scrollTo({top:0,left:0,behavior:"instant"});
}

function escapeJs(value){
  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}

function showHome(){
  closeQuiz();
  packView.style.display = "none";
  homePage.style.display = "block";
  window.scrollTo({top:0,left:0,behavior:"instant"});
}

/*
  Keep the quiz iframe behavior. Update only these paths if your
  exercise filenames are different in your project.
*/
function getQuizUrl(title){
  const known = {
   

    
     "Addition":"./Exercise/addition.html",
    "Fill in the Box":"./Exercise/fillinthebox.html",
    "Fill in the Blanks":"./Exercise/fillintheblanks.html",

    "Number Line":"./Exercise/numberline.html",
    "Abacus Sum":"./Exercise/abacus_sum.html",
    "Count Lines":"./Exercise/countlines.html",

    "Draw Balloon":"./Exercise/drawballon.html",
    "Draw Beads":"./Exercise/drawbeads.html",
    "Number Required":"./Exercise/number_required.html"
  };

  return known[title] || (
    "./exercise/" +
    title.toLowerCase()
      .replace(/&/g,"and")
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-+|-+$/g,"") +
    ".html"
  );
}

function startQuiz(title){
  const modal = document.getElementById("quizModal");
  const frame = document.getElementById("quizFrame");

  frame.src = getQuizUrl(title);
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
}

function closeQuiz(){
  const modal = document.getElementById("quizModal");
  const frame = document.getElementById("quizFrame");

  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
  frame.src = "about:blank";
  document.body.style.overflow = "";
}

document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    closeQuiz();
  }
});

renderHome();
</script>
