<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Energy Pod Subtraction</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Livvic', sans-serif;
}

body {
    /* Soft Light Pastel Background - NO CARDS */
    background: linear-gradient(135deg, #fefce8 0%, #f0fdf4 50%, #e0f2fe 100%);
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 2vh 2vw;
    overflow: hidden; /* STRICTLY Prevents Scrolling */
    color: #1e293b;
}

header {
    text-align: center;
    z-index: 10;
    flex-shrink: 0;
    margin-bottom: 1vh;
}

h1 {
    color: #2f4f4f;
    font-weight: 400;
    text-shadow: 0 2px 0 #ffffff;
    margin-bottom: 6px;
    font-size: 22px;
}

@media screen and (max-width: 1599px) { h1 { font-size: 22px; } }
@media screen and (min-width: 1600px) { h1 { font-size: 30px; } }

.instruction-badge {
    font-size: clamp(20px, 1.5vw, 22px);
    color: #2f4f4f;
    font-weight: 500;
    
    display: inline-block;
}

/* =========================
   GAME PLAYGROUND
========================= */
.game-stage {
    width: 100%;
    max-width: 1100px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 5;
    min-height: 0;
    position: relative;
    gap: 15px;
}

.equation-board {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(15px, 2.5vw, 35px);
    width: 100%;
    max-width: 950px;
}

/* =========================
   ROD-FREE ENERGY PODS (NO OVERLAPPING)
========================= */
.pod-machine {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.pods-container {
    display: flex;
    gap: clamp(12px, 2vw, 24px);
    align-items: flex-end;
    padding: 12px;
    background: rgba(255, 255, 255, 0.6);
    border: 4px solid #ffffff;
    border-radius: 24px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
}

.vertical-pod {
    display: flex;
    flex-direction: column-reverse; /* Stacks orbs from bottom up cleanly */
    gap: 4px;
    padding: 6px;
    width: clamp(36px, 4.5vw, 50px);
    min-height: clamp(160px, 28vh, 230px);
    background: rgba(241, 245, 249, 0.7);
    border: 3px solid #cbd5e1;
    border-radius: 20px;
    justify-content: flex-start;
    align-items: center;
}

/* Energy Orbs */
.energy-orb {
    width: clamp(26px, 3.2vw, 38px);
    height: clamp(20px, 2.2vw, 26px);
    border-radius: 12px;
    cursor: pointer;
    box-shadow: inset -3px -3px 6px rgba(0,0,0,0.2), inset 3px 3px 6px rgba(255,255,255,0.7), 0 3px 5px rgba(0,0,0,0.1);
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    z-index: 5;
    flex-shrink: 0;
}

.tens-orb { background: linear-gradient(135deg, #4ade80, #16a34a); } /* Exact Green */
.ones-orb { background: linear-gradient(135deg, #38bdf8, #0284c7); } /* Exact Blue */

.energy-orb:hover {
    transform: scale(1.15);
}

/* Labels (T & O) */
.pod-labels {
    display: flex;
    gap: clamp(12px, 2vw, 24px);
}

.label-tag {
    font-size: clamp(0.9rem, 1.2vw, 1.1rem);
    font-weight: 900;
    color: #ffffff;
    background: #0ea5e9;
    width: 36px;
    height: 26px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 6px;
    box-shadow: 0 3px 0 #0284c7;
}

/* =========================
   EQUATION INPUTS & OPERATORS
========================= */
.operator {
    font-size: clamp(3rem, 5vw, 4.5rem);
    font-weight: 400;
    color: #64748b;
    text-shadow: 0 3px 0 #ffffff;
    flex-shrink: 0;
    margin-bottom: 0;
    line-height: 1;
}

.equation-inputs {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 2vw, 25px);
    margin-top: 5px;
}

input[type="text"] {
    width: clamp(70px, 8vw, 90px);
    height: clamp(55px, 6.5vw, 70px);
    font-size: clamp(2rem, 3vw, 2.8rem);
    font-weight: 400;
    text-align: center;
    border: 4px solid #f59e0b;
    border-radius: 18px;
    background: #ffffff;
    color: #0f172a;
    outline: none;
    box-shadow: 0 6px 0 #d97706, 0 10px 15px rgba(0,0,0,0.05);
    transition: all 0.2s;
    flex-shrink: 0;
}

input[type="text"]:focus {
    transform: translateY(-4px);
    border-color: #fbbf24;
    box-shadow: 0 10px 0 #d97706, 0 0 20px rgba(245, 158, 11, 0.4);
}

input[type="text"]:disabled {
    background-color: #f1f2f6;
    border-color: #10b981;
    color: #059669;
    box-shadow: 0 6px 0 #059669;
    cursor: not-allowed;
    transform: none;
}

/* =========================
   CORNER NAVIGATION CONTROLS
========================= */
.bottom-controls {
    width: 100%;
    max-width: 1400px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 1vh 2vw 2vh 2vw;
    z-index: 20;
    flex-shrink: 0;
}

.left-control { justify-self: start; }
.center-control { justify-self: center; }
.right-control { justify-self: end; }

/* Strict Button Sizing Rules (Laptop: 20px, Monitor: 30px) */
.nav-btn, .submit-btn, .replay-btn {
    font-weight: 500; border: none; cursor: pointer; transition: all 0.1s ease;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 20px;  min-width:178px;height:45px; border-radius: 40px;
}

@media screen and (min-width: 1600px) {
    h1 {
        font-size: 30px;
    }
    .nav-btn, .submit-btn, .replay-btn {
        width: 200px;
        min-width: 200px;
        height: 60px;
        font-size: 30px;
        padding: 0;
        border-radius: 50px;
    }
}

.nav-btn.prev { background: #64748b; color: #ffffff; box-shadow: 0 8px 0 #475569; }
.nav-btn.prev:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #475569; }

.nav-btn.next { background: #f97316; color: #ffffff; box-shadow: 0 8px 0 #c2410c; }
.nav-btn.next:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #c2410c; }

.submit-btn { background: #10b981; color: #ffffff; box-shadow: 0 8px 0 #059669; }
.submit-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #059669; }

.replay-btn { background: #0ea5e9; color: white; box-shadow: 0 8px 0 #0284c7; margin-top: 20px; }
.replay-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #0284c7; }

.nav-btn:disabled, .submit-btn:disabled {
    background: #cbd5e1; box-shadow: 0 8px 0 #94a3b8; color: #f8fafc; cursor: not-allowed; opacity: 0.8;
}

/* =========================
   REFERENCE POPUP DESIGN
========================= */
.popup-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
   
    display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100;
}
.popup-overlay.active { opacity: 1; pointer-events: auto; }

.popup-card {
    position: relative; width: 90%; max-width: 520px; padding: 40px 30px;
    border-radius: 36px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    transform: scale(0.8); transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #ffffff;
}

.popup-card::before, .popup-card::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
.popup-card::before { width: 220px; height: 220px; top: -60px; right: -50px; }
.popup-card::after { width: 180px; height: 180px; bottom: -70px; left: -40px; }

.popup-card.correct { background: #edfbf4; border: 6px solid #00c885; }
.popup-card.correct::before, .popup-card.correct::after { background: rgba(162, 245, 209, 0.45); }
.popup-card.correct .popup-title { color: #00a86b; }
.popup-card.correct .popup-subtitle { color: #2e7d5b; }

.popup-card.wrong { background: #fff0f2; border: 6px solid #ff6b7a; }
.popup-card.wrong::before, .popup-card.wrong::after { background: rgba(255, 196, 203, 0.45); }
.popup-card.wrong .popup-title { color: #d33847; }
.popup-card.wrong .popup-subtitle { color: #a33b45; }

.popup-card.complete { background: #f0f3ff; border: 6px solid #6c5ce7; }
.popup-card.complete::before, .popup-card.complete::after { background: rgba(162, 155, 254, 0.35); }
.popup-card.complete .popup-title { color: #6c5ce7; }
.popup-card.complete .popup-subtitle { color: #4834d4; }

.popup-overlay.active .popup-card { transform: scale(1); }
.popup-icon { font-size: 4.8rem; margin-bottom: 12px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.1)); }
.popup-title { font-size: 3rem; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.5px; }
.popup-subtitle { font-size: 1.4rem; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #333; }

@media screen and (max-width: 768px) {
    .equation-board { flex-direction: column; gap: 10px; }
    .operator { transform: rotate(90deg); margin-bottom: 0; }
    input[type="text"] { width: 60px; height: 50px; font-size: 1.8rem; }
}

/* ===== EXACT SAME CONFETTI ===== */
#confettiContainer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:2000;
}
.confetti-piece{
    position:absolute;
    width:9px;
    height:14px;
    border-radius:2px;
    opacity:0;
    animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
    will-change:transform,opacity;
}
.final-confetti-piece{
    width:10px;
    height:16px;
    animation-duration:2300ms;
}
.final-confetti-piece:nth-child(3n){border-radius:50%}
.final-confetti-piece:nth-child(4n){width:7px;height:19px;border-radius:1px}
.final-confetti-piece:nth-child(5n){width:13px;height:8px;border-radius:2px}
@keyframes pageConfetti{
    0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg) scale(1)}
    55%{opacity:1}
    100%{opacity:0;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72)}
}

</style>
</head>

<body>
<div id="confettiContainer"></div>

<header>
    <h1>Subtract the following on an abacus</h1>
    <div class="instruction-badge">Count the energy orbs carefully and enter the answer!</div>
</header>

<main class="game-stage" id="stage">
    <!-- Injected via JavaScript -->
</main>

<div class="bottom-controls">
    <div class="left-control">
        <button class="nav-btn prev" id="prevBtn" onclick="navigate(-1)" disabled>PREV</button>
    </div>
    <div class="center-control">
        <button class="submit-btn" id="submitBtn" onclick="checkAnswers()" disabled>SUBMIT</button>
    </div>
    <div class="right-control">
        <button class="nav-btn next" id="nextBtn" onclick="navigate(1)" disabled>NEXT</button>
    </div>
</div>

<!-- Result Popup Overlay -->
<div class="popup-overlay" id="popup">
    <div class="popup-card" id="popupCard">
        <div class="popup-icon" id="popupIcon">⭐</div>
        <h2 class="popup-title" id="popupTitle">Amazing!</h2>
        <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
        <button class="replay-btn" id="playAgainBtn" style="display: none;" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
/* ==========================================
   QUIZ DATA (Exact Match to Worksheet)
========================================== */
const quizData = [
    {
        // a) 14 - 1 = 13
        groups: [
            { t: 1, o: 4, showT: true },
            { t: 0, o: 1, showT: false },
            { t: 1, o: 3, showT: true }
        ],
        v1: 14, v2: 1, v3: 13
    },
    {
        // b) 13 - 2 = 11
        groups: [
            { t: 1, o: 3, showT: true },
            { t: 0, o: 2, showT: false },
            { t: 1, o: 1, showT: true }
        ],
        v1: 13, v2: 2, v3: 11
    },
    {
        // c) 15 - 4 = 11
        groups: [
            { t: 1, o: 5, showT: true },
            { t: 0, o: 4, showT: false },
            { t: 1, o: 1, showT: true }
        ],
        v1: 15, v2: 4, v3: 11
    },
    {
        // d) 17 - 13 = 4
        groups: [
            { t: 1, o: 7, showT: true },
            { t: 1, o: 3, showT: true },
            { t: 0, o: 4, showT: true }
        ],
        v1: 17, v2: 13, v3: 4
    }
];

let quizState = Array.from({ length: quizData.length }, () => ({
    isSolved: false,
    inp1: '',
    inp2: '',
    inp3: '',
    targetLockedOrbs: [] // Stores IDs of target-locked orbs
}));

let currentIndex = 0;
let popupTimer = null;
let audioCtx = null;

const stageEl = document.getElementById("stage");
const submitBtn = document.getElementById("submitBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const playAgainBtn = document.getElementById("playAgainBtn");

/* ==========================================
   AUDIO SYNTHESIZER
========================================== */
function playTone(type) {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "correct") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === "wrong") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    } catch (error) {
        console.log("Audio error:", error);
    }
}

function speak(text) {
    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = "en-US";
        msg.volume = 0.8;
        msg.rate = 1;
        msg.pitch = 1.2;
        speechSynthesis.speak(msg);
    }
}

/* ==========================================
   LOAD QUESTION
========================================== */
function renderPodMachineHTML(groupData, groupIdx) {
    const state = quizState[currentIndex];
    let html = `<div class="pod-machine">`;
    html += `<div class="pods-container">`;

    // Tens Pod
    if (groupData.showT) {
        html += `<div class="vertical-pod">`;
        for (let i = 0; i < groupData.t; i++) {
            const orbId = `orb-${groupIdx}-t-${i}`;
            const isLocked = state.targetLockedOrbs.includes(orbId);
            html += `<div class="energy-orb tens-orb ${isLocked ? 'target-locked' : ''}" data-id="${orbId}"></div>`;
        }
        html += `</div>`;
    }

    // Ones Pod
    html += `<div class="vertical-pod">`;
    for (let i = 0; i < groupData.o; i++) {
        const orbId = `orb-${groupIdx}-o-${i}`;
        const isLocked = state.targetLockedOrbs.includes(orbId);
        html += `<div class="energy-orb ones-orb ${isLocked ? 'target-locked' : ''}" data-id="${orbId}"></div>`;
    }
    html += `</div>`;

    html += `</div>`; // Close pods-container

    // Labels
    html += `<div class="pod-labels">`;
    if (groupData.showT) html += `<div class="label-tag">T</div>`;
    html += `<div class="label-tag">O</div>`;
    html += `</div>`;

    html += `</div>`; // Close pod-machine
    return html;
}

function loadQuestion() {
    const q = quizData[currentIndex];
    const state = quizState[currentIndex];

    stageEl.innerHTML = `
        <div class="equation-board">
            ${renderPodMachineHTML(q.groups[0], 0)}
            <div class="operator">−</div>
            ${renderPodMachineHTML(q.groups[1], 1)}
            <div class="operator">=</div>
            ${renderPodMachineHTML(q.groups[2], 2)}
        </div>

        <div class="equation-inputs">
            <input type="text" id="inp1" inputmode="numeric" maxlength="2" value="${state.inp1}">
            <span class="operator">−</span>
            <input type="text" id="inp2" inputmode="numeric" maxlength="2" value="${state.inp2}">
            <span class="operator">=</span>
            <input type="text" id="inp3" inputmode="numeric" maxlength="2" value="${state.inp3}">
        </div>
    `;

    const inp1 = document.getElementById("inp1");
    const inp2 = document.getElementById("inp2");
    const inp3 = document.getElementById("inp3");

    // Input Listeners
    [inp1, inp2, inp3].forEach((inp, idx) => {
        inp.addEventListener("input", (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, "");
            if (idx === 0) state.inp1 = e.target.value;
            if (idx === 1) state.inp2 = e.target.value;
            if (idx === 2) state.inp3 = e.target.value;
            checkSubmitState();
        });

        if (state.isSolved) {
            inp.disabled = true;
        }
    });

    checkSubmitState();

    prevBtn.disabled = (currentIndex === 0);
    nextBtn.disabled = (!state.isSolved || currentIndex === quizData.length - 1);
}

function checkSubmitState() {
    const state = quizState[currentIndex];
    const allFilled = state.inp1.trim() !== "" && state.inp2.trim() !== "" && state.inp3.trim() !== "";
    submitBtn.disabled = state.isSolved || !allFilled;
}

function navigate(direction) {
    const state = quizState[currentIndex];

    if (direction === 1 && !state.isSolved) {
        return;
    }

    currentIndex += direction;

    if (currentIndex < 0) currentIndex = 0;
    if (currentIndex > quizData.length - 1) currentIndex = quizData.length - 1;

    loadQuestion();
}

function checkAnswers() {
    const q = quizData[currentIndex];
    const state = quizState[currentIndex];

    const v1Val = parseInt(state.inp1);
    const v2Val = parseInt(state.inp2);
    const v3Val = parseInt(state.inp3);

    /* WRONG ANSWER - AUTO RESET BUG FIX INCLUDED */
    if (v1Val !== q.v1 || v2Val !== q.v2 || v3Val !== q.v3) {
        showPopup("wrong", "😟", "Keep Going!", "Count the energy orbs carefully and try again! 🌈", false);
        playTone("wrong");
        speak("Wrong");

        // Reset inputs and unlock target rings
        state.inp1 = "";
        state.inp2 = "";
        state.inp3 = "";
        state.targetLockedOrbs = [];

        document.getElementById("inp1").value = "";
        document.getElementById("inp2").value = "";
        document.getElementById("inp3").value = "";

        document.querySelectorAll('.energy-orb').forEach(orb => {
            orb.classList.remove('target-locked');
        });

        checkSubmitState();
        return;
    }

    /* CORRECT ANSWER */
    state.isSolved = true;

    document.getElementById("inp1").disabled = true;
    document.getElementById("inp2").disabled = true;
    document.getElementById("inp3").disabled = true;
    submitBtn.disabled = true;

    playTone("correct");
    speak("Correct");
    showSmallConfetti(false);

    if (currentIndex === quizData.length - 1) {
        nextBtn.disabled = true;
        showPopup("correct", "🌟", "Amazing!", "You got it right! ✨", false);

        clearTimeout(popupTimer);
        popupTimer = setTimeout(() => {
            closePopup();
            showSmallConfetti(true);
            showPopup("complete", "🏆", "Congratulations!", "Fantastic job! You solved all questions! 🎉", true);
        }, 1800);
    } else {
        nextBtn.disabled = false;
        showPopup("correct", "🌟", "Amazing!", "You got it right! ✨", false);
    }
}


function showSmallConfetti(isFinal=false){
    const confettiContainer=document.getElementById("confettiContainer");
    if(!confettiContainer)return;
    const count=isFinal?95:42;
    const colors=["#00b894","#e67e22","#6c5ce7","#0984e3","#fdcb6e","#ff6b7a","#00cec9","#a29bfe"];
    for(let i=0;i<count;i++){
        const piece=document.createElement("span");
        piece.className=isFinal?"confetti-piece final-confetti-piece":"confetti-piece";
        piece.style.left=(Math.random()*100)+"%";
        piece.style.top=(-8+Math.random()*10)+"%";
        piece.style.setProperty("--x",((Math.random()*520-260)*(isFinal?1.15:.9))+"px");
        piece.style.setProperty("--y",(window.innerHeight*(.82+Math.random()*.48))+"px");
        piece.style.setProperty("--r",(Math.random()*1400-700)+"deg");
        piece.style.background=colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDelay=(Math.random()*(isFinal?500:220))+"ms";
        confettiContainer.appendChild(piece);
        setTimeout(()=>piece.remove(),isFinal?2900:2050);
    }
}

function showPopup(status, icon, title, subtitle, isFinal = false) {
    const popup = document.getElementById("popup");
    const card = document.getElementById("popupCard");

    card.className = `popup-card ${status}`;
    document.getElementById("popupIcon").innerText = icon;
    document.getElementById("popupTitle").innerText = title;
    document.getElementById("popupSubtitle").innerText = subtitle;

    playAgainBtn.style.display = isFinal ? "inline-block" : "none";
    popup.classList.add("active");

    clearTimeout(popupTimer);
    if (!isFinal) {
        popupTimer = setTimeout(closePopup, 1800);
    }
}

function closePopup() {
    document.getElementById("popup").classList.remove("active");
}

function restartGame() {
    closePopup();
    const confettiContainer=document.getElementById("confettiContainer");
    if(confettiContainer) confettiContainer.innerHTML="";
    quizState = Array.from({ length: quizData.length }, () => ({
        isSolved: false,
        inp1: '',
        inp2: '',
        inp3: '',
        targetLockedOrbs: []
    }));
    currentIndex = 0;
    loadQuestion();
}

window.onload = function() {
    loadQuestion();
};
</script>
