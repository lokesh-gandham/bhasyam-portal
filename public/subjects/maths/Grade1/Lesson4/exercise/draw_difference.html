<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Count and Draw the Difference</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif
    }

    :root {
      --ink: #34495e;
      --orange: #e67e22;
      --orange-dark: #d35400;
      --green: #00b894;
      --green-dark: #008f72;
      --line: #efb07b;
      --cream: #fffdf6;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;

      color: var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 18px;
    }

    .game-stage {
      width: 100%;
      max-width: 1120px;
      height: calc(100vh - 100px);
      margin: auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-item {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }

    .slide-item.active {
      display: flex
    }

    .worksheet {
      width: 100%;
      max-width: 1040px;
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1.15fr;
      gap: 22px;
      align-items: center;
      justify-content: center;
    }

    .visual-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px
    }

    .object-box {
      width: 100%;
      height: 310px;
      background: rgba(255, 255, 255, .46);
      border: 2px solid #efb07b;
      border-radius: 9px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .items-grid {
      width: 100%;
      height: 100%;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 11px;
    }

    .game-item {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s ease;
      filter: drop-shadow(0 3px 4px rgba(52, 73, 94, .12));
    }

    .game-item img {
      width: 100%;
      height: 100%;
      object-fit: contain
    }

    .answer-box .items-grid {
      align-content: center
    }

    .operator {
      font-size: 2rem;
      font-weight: 500;
      color: #697680;
      line-height: 1;
    }

    .count-line {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 1.45rem;
      font-weight: 500;
      color: #52606a;
    }

    .count-input {
      width: 64px;
      height: 44px;
      border: 2px solid #efb07b;
      border-radius: 6px;
      background: #fff;
      text-align: center;
      font-size: 1.45rem;
      font-weight: 500;
      color: #34495e;
      outline: none;
    }

    .count-input:focus {
      border-color: #00b894;
      box-shadow: 0 0 0 3px rgba(0, 184, 148, .12)
    }

    .count-input[readonly] {
      background: #fffdf9
    }

    /* Remove native number input spinner arrows (Draw/Undo buttons already cover increment/decrement) */
    .count-input::-webkit-outer-spin-button,
    .count-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .count-input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .draw-tools {
      display: flex;
      gap: 9px;
      margin-top: 2px
    }

    .draw-btn {
      width: 80px;
      height: 40px;
      border: none;
      border-radius: 20px;
      /* padding: 8px 16px; */
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      background: #c9ffef;
      color: #00745c;
      box-shadow: 0 3px 0 #b8e5d8;
    }

    .draw-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b8e5d8
    }

    .draw-btn.undo {
      background: #ffdfcb;
      color: #a54607;
      box-shadow: 0 3px 0 #f2c6a8
    }

    .pop-in {
      animation: popIn .25s cubic-bezier(.175, .885, .32, 1.275)
    }

    @keyframes popIn {
      0% {
        transform: scale(0);
        opacity: 0
      }

      100% {
        transform: scale(1);
        opacity: 1
      }
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translate(-50%, -15px);
      padding: 10px 20px;
      border-radius: 24px;
      font-weight: 500;
      background: #fff0f2;
      color: #d33847;
      border: 2px solid #ffb3bd;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    footer {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      margin: auto;
    }

    /* Exact Heavy & Light navigation button styling */
    .nav-btn {
      background: #e67e22;
      color: #ffffff;
      border: none;
      min-width: 178px;
      height: 45px;
      font-size: 20px;
      font-weight: 500;
      border-radius: 40px;
      cursor: pointer;
      text-transform: none;
      box-shadow: 0 6px 0 #d35400;
      transition: all .1s ease;
    }

    .nav-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d35400
    }

    .nav-btn:disabled {
      background: #b2bec3;
      box-shadow: 0 6px 0 #636e72;
      cursor: not-allowed;
      opacity: .7;
    }

    .check-btn {
      background: #00b894;
      box-shadow: 0 6px 0 #008f72
    }

    .check-btn:active:not(:disabled) {
      box-shadow: 0 2px 0 #008f72
    }

    .replay-btn {
      background: #0984e3;
      box-shadow: 0 6px 0 #0975c7;
      margin-top: 20px;
      z-index: 5
    }

    .replay-btn:active {
      box-shadow: 0 2px 0 #0975c7
    }

    /* Exact Heavy & Light popup styling */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
      z-index: 100;
    }

    .popup-overlay.active {
      opacity: 1;
      pointer-events: auto
    }

    .popup-card {
      position: relative;
      width: 90%;
      max-width: 520px;
      padding: 40px 30px;
      border-radius: 36px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .1);
      transform: scale(.8);
      transition: transform .35s cubic-bezier(.175, .885, .32, 1.275);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .popup-card::before,
    .popup-card::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none
    }

    .popup-card::before {
      width: 220px;
      height: 220px;
      top: -60px;
      right: -50px
    }

    .popup-card::after {
      width: 180px;
      height: 180px;
      bottom: -70px;
      left: -40px
    }

    .popup-card.correct {
      background: #edfbf4;
      border: 6px solid #00c885
    }

    .popup-card.correct::before,
    .popup-card.correct::after {
      background: rgba(162, 245, 209, .45)
    }

    .popup-card.correct .popup-title {
      color: #00a86b
    }

    .popup-card.correct .popup-subtitle {
      color: #2e7d5b
    }

    .popup-card.wrong {
      background: #fff0f2;
      border: 6px solid #ff6b7a
    }

    .popup-card.wrong::before,
    .popup-card.wrong::after {
      background: rgba(255, 196, 203, .45)
    }

    .popup-card.wrong .popup-title {
      color: #d33847
    }

    .popup-card.wrong .popup-subtitle {
      color: #a33b45
    }

    .popup-card.complete {
      background: #f0f3ff;
      border: 6px solid #6c5ce7
    }

    .popup-card.complete::before,
    .popup-card.complete::after {
      background: rgba(162, 155, 254, .35)
    }

    .popup-card.complete .popup-title {
      color: #6c5ce7
    }

    .popup-card.complete .popup-subtitle {
      color: #4834d4
    }

    .popup-overlay.active .popup-card {
      transform: scale(1)
    }

    .popup-icon {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 12px;
      z-index: 2;
      /* background: #fff; */
      color: #00b894;
      /* box-shadow: 0 6px 10px rgba(0, 0, 0, .08) */
    }

    .popup-card.wrong .popup-icon {
      color: #ff6b7a
    }

    .popup-card.complete .popup-icon {
      color: #6c5ce7
    }

    .popup-title {
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 8px;
      z-index: 2;
      letter-spacing: -.5px
    }

    .popup-subtitle {
      font-size: 1.4rem;
      font-weight: 500;
      z-index: 2
    }

    @media screen and (min-width:1500px) {
      .title-text h1 {
        font-size: 30px !important
      }

      .title-text p {
        font-size: 25px !important
      }

      .nav-btn {
        width: 200px;
        min-width: 200px;
        height: 60px;
        padding: 0;
        font-size: 25px;
      }

      .draw-btn {
        width: 120px;
        height: 55px;
        border: none;
        border-radius: 20px;
        /* padding: 8px 16px; */
        font-size: 22px;
        font-weight: 500;
        cursor: pointer;
        background: #c9ffef;
        color: #00745c;
        box-shadow: 0 3px 0 #b8e5d8;
      }
    }

    @media(max-width:850px) {
      body {
        padding: 8px;
        overflow: auto
      }

      .game-stage {
        height: auto;
        min-height: calc(100vh - 90px);
        padding: 15px 0
      }

      .worksheet {
        grid-template-columns: 1fr;
        gap: 10px;
        max-width: 520px
      }

      .operator {
        font-size: 1.3rem
      }

      .operator::after {
        content: ''
      }

      .object-box {
        height: 190px
      }

      .game-item {
        width: 38px;
        height: 38px
      }

      .visual-group {
        gap: 7px
      }

      .draw-tools {
        margin-bottom: 4px
      }

      footer {
        position: sticky;
        bottom: 0;
        background: rgba(255, 253, 246, .85);
        padding: 10px 0
      }

      .nav-btn {
        font-size: 15px;
        padding: 9px 20px
      }
    }

    /* ================= PLAYFUL GAME WORLD ================= */

    body::before,
    body::after {
      content: '';
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
    }

    body::before {
      width: 210px;
      height: 210px;
      left: -95px;
      bottom: 8%;
      background: rgba(255, 188, 104, .13);
      border: 18px solid rgba(255, 255, 255, .32);
    }

    body::after {
      width: 160px;
      height: 160px;
      right: -55px;
      top: 42%;

    }

    .game-header {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 70px;
      padding: 8px 4px;
    }

    .title-cluster {
      display: flex;
      align-items: center;
      gap: 13px
    }

    .title-orb {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: linear-gradient(145deg, #ffd166, #f5a623);
      border: 3px solid rgba(255, 255, 255, .9);
      box-shadow: 0 6px 0 #e39a19, 0 10px 22px rgba(226, 145, 26, .18);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 1.45rem;
      transform: rotate(-4deg);
    }

    .title-text h1 {
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      color: #2f4f4f;
      letter-spacing: -.7px;
    }

    .title-text p {
      margin-top: 5px;
      font-size: 20px;
      font-weight: 400;
      color: #2f4f4f
    }

    .mission-pill {
      min-width: 172px;
      padding: 10px 15px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .7);
      border: 2px solid #bde8da;
      box-shadow: 0 5px 0 #ccece2;
      text-align: center;
    }

    .mission-pill .mini {
      display: block;
      font-size: .67rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #00a884
    }

    .mission-pill strong {
      font-size: 1rem;
      color: #41525d
    }

    .game-stage {
      height: calc(100vh - 178px);
      min-height: 360px;
      align-items: stretch;
    }

    .slide-item {
      align-items: stretch
    }

    .worksheet {
      position: relative;
      max-width: 1080px;
      height: 100%;
      grid-template-columns: minmax(150px, 1fr) 34px minmax(150px, 1fr) 34px minmax(175px, 1.1fr);
      gap: 14px;
      padding: 26px 20px 14px;
      border-radius: 30px;
      background: rgba(255, 255, 255, .48);
      border: 2px solid rgba(255, 255, 255, .82);
      box-shadow: 0 15px 40px rgba(73, 100, 91, .10), inset 0 1px 0 #fff;
      margin-top: -10px;
    }

    .worksheet::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 23px;
      border: 1px dashed rgba(230, 126, 34, .30);
      pointer-events: none;
    }

    .question-banner {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      white-space: nowrap;
      background: #34495e;
      color: #fff;
      border: 3px solid #fff;
      box-shadow: 0 5px 0 #263845, 0 9px 16px rgba(52, 73, 94, .15);
      border-radius: 18px;
      padding: 7px 20px;
      font-size: .88rem;
      font-weight: 900;
    }

    .visual-group {
      position: relative;
      z-index: 1;
      gap: 9px;
      min-width: 0
    }

    .object-box {
      height: min(100%, 300px);
      min-height: 220px;
      position: relative;
      overflow: hidden;
      padding: 16px 13px 12px;
      border: 2px solid #efb07b;
      border-radius: 24px;
      background:
        linear-gradient(rgba(255, 255, 255, .68), rgba(255, 255, 255, .52)),
        repeating-linear-gradient(135deg, transparent 0 13px, rgba(239, 176, 123, .08) 14px 15px);
      box-shadow: 0 7px 0 rgba(222, 145, 80, .16), inset 0 2px 0 #fff;
    }

    .object-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;

    }

    .object-box::after {
      content: 'Count';
      position: absolute;
      top: 8px;
      left: 13px;
      color: #c96f25;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .8px;
      line-height: 1.1;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .8);
    }

    .answer-box {
      border-color: #76cbb8;
      background:
        linear-gradient(rgba(246, 255, 252, .76), rgba(255, 255, 255, .58)),
        repeating-linear-gradient(135deg, transparent 0 13px, rgba(0, 184, 148, .06) 14px 15px);
      box-shadow: 0 7px 0 rgba(0, 143, 114, .12), inset 0 2px 0 #fff;
    }

    .answer-box::after {
      content: 'Draw the difference';
      color: #007f6b;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .5px;
      line-height: 1.1;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .8);
    }

    .items-grid {
      padding-top: 23px;
      gap: 7px 9px
    }

    .game-item {
      width: clamp(30px, 3.7vw, 46px);
      height: clamp(30px, 3.7vw, 46px)
    }

    .game-item:hover {
      transform: translateY(-3px) rotate(-4deg)
    }

    .operator {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      color: #e67e22;
      border: 2px solid #f3c498;
      box-shadow: 0 4px 0 #efd6bd;
      font-size: 1.55rem;
    }

    .visual-group:last-child .operator {
      color: #00b894
    }

    .count-line {
      gap: 8px
    }

    .count-input {
      width: 68px;
      height: 40px;
      border-radius: 13px;
      box-shadow: 0 4px 0 rgba(239, 176, 123, .18);
    }

    .draw-tools {
      padding: 5px 7px;
      background: rgba(255, 255, 255, .65);
      border: 1px solid #d7eee8;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(0, 143, 114, .08);
    }

    .draw-btn {
      border-radius: 14px;
      padding: 7px 13px
    }

    footer {
      position: relative;
      z-index: 5
    }



    /* ================= FINAL LAYOUT OVERRIDES ================= */
    /* No outer card/container */
    .game-header {
      margin: 10px auto 0;
      padding: 0 4px;
      justify-content: flex-start;
    }

    .mission-pill {
      display: none !important;
    }

    .game-stage {
      height: calc(100vh - 170px);
      margin-top: 8px;
    }

    .worksheet {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 24px 20px 10px !important;
    }

    .worksheet::before {
      display: none !important;
    }

    /* All three boxes stay exactly the same size */
    .visual-group {
      width: 100%;
      min-width: 0;
    }

    .object-box,
    .answer-box {
      width: 100% !important;
      height: 300px !important;
      min-height: 300px !important;
      max-height: 300px !important;
    }

    /* Keep equal columns for the 3 visual areas */
    .worksheet {
      grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr) 34px minmax(0, 1fr) !important;
    }

    @media screen and (min-width:1600px) {
      .game-header {
        margin-top: 30px;
      }

      .game-stage {
        height: calc(100vh - 185px);
      }

      .object-box,
      .answer-box {
        height: 320px !important;
        min-height: 320px !important;
        max-height: 320px !important;
      }
    }

    @media(max-width:850px) {
      .game-header {
        margin-top: 12px;
      }

      .worksheet {
        grid-template-columns: 1fr !important;
        padding: 28px 8px 10px !important;
      }

      .object-box,
      .answer-box {
        height: 220px !important;
        min-height: 220px !important;
        max-height: 220px !important;
      }
    }


    /* ================= CENTERED TOP HEADING ================= */
    .game-header {
      width: 100% !important;
      max-width: none !important;
      position: relative !important;
      margin: 10px 0 0 !important;
      padding: 0 !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
    }

    .title-cluster {
      justify-content: center !important;
      align-items: center !important;
    }

    .title-text {
      text-align: center !important;
    }

    .title-text h1 {
      font-weight: 400 !important;
    }

    .title-text p {
      font-weight: 400 !important;
    }

    @media screen and (min-width:1600px) {
      .game-header {
        margin-top: 30px !important;
      }
    }


    /* ================= CLEAR BOX LABELS ================= */
    @media screen and (min-width:851px) {

      .object-box::after,
      .answer-box::after {
        font-size: .84rem;
        font-weight: 700;
      }
    }

    @media screen and (min-width:1600px) {

      .object-box::after,
      .answer-box::after {
        font-size: .92rem;
        font-weight: 700;
      }
    }

    /* ================= USER REQUESTED RESPONSIVE FIXES ================= */

    /* All three visual boxes have exactly the same height */
    .object-box,
    .answer-box {
      height: 300px !important;
      min-height: 300px !important;
      max-height: 300px !important;
    }

    /* Operators are regular weight, not bold */
    .operator {
      font-weight: 400 !important;
    }

    /* Draw and Undo buttons use medium weight */
    .draw-btn {
      font-weight: 500 !important;
    }

    /* Sentence case: only the first letter of each intended label is capitalized */

    @media screen and (min-width: 1600px) {
      .worksheet {
        grid-template-columns: minmax(0, 1fr) 50px minmax(0, 1fr) 50px minmax(0, 1fr) !important;
        width: min(1500px, 92vw) !important;
      }

      .object-box,
      .answer-box {
        height: 370px !important;
        min-height: 370px !important;
        max-height: 370px !important;
      }

      .game-item {
        width: clamp(42px, 4vw, 62px) !important;
        height: clamp(42px, 4vw, 62px) !important;
      }

      .items-grid {
        gap: 12px 16px !important;
        padding-top: 30px !important;
      }

      .operator {
        width: 42px !important;
        height: 42px !important;
        font-size: 2rem !important;
        font-weight: 400 !important;
      }

      .count-input {
        width: 82px !important;
        height: 48px !important;
      }

      .draw-btn {
        font-weight: 500 !important;
      }
    }

    /* FINAL ALIGNMENT FIX — all three boxes exactly aligned and equal */
    @media screen and (min-width: 851px) {
      .worksheet {
        grid-template-columns: minmax(0, 1fr) 50px minmax(0, 1fr) 50px minmax(0, 1fr) !important;
        align-items: start !important;
      }

      .visual-group {
        width: 100% !important;
        min-width: 0 !important;
        align-items: center !important;
      }

      .object-box,
      .answer-box {
        width: 100% !important;
        height: 285px !important;
        min-height: 285px !important;
        max-height: 285px !important;
      }

      .operator {
        margin-top: 143px !important;
        font-weight: 400 !important;
      }
    }

    @media screen and (min-width: 1600px) {
      .worksheet {
        width: min(1700px, 94vw) !important;
        grid-template-columns: minmax(0, 1fr) 50px minmax(0, 1fr) 50px minmax(0, 1fr) !important;
        align-items: start !important;
      }

      .object-box,
      .answer-box {
        height: 370px !important;
        min-height: 370px !important;
        max-height: 370px !important;
      }

      .operator {
        margin-top: 168px !important;
        font-weight: 400 !important;
      }
    }

    /* Final responsive centering and monitor sizing */
    .game-stage {
      flex: 1 1 auto;
      height: auto !important;
      min-height: 0;
      width: 100%;
      max-width: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    footer {
      flex: 0 0 auto;
    }

    @media screen and (min-width: 1600px) {
      .game-stage {
        width: 100%;
        max-width: none;
        align-items: center !important;
        justify-content: center !important;
      }

      .worksheet {
        width: min(1700px, 94vw) !important;
        max-width: none !important;
        grid-template-columns: minmax(0, 1fr) 55px minmax(0, 1fr) 55px minmax(0, 1fr) !important;
        align-items: start !important;
      }

      .object-box,
      .answer-box {
        width: 100% !important;
        height: 370px !important;
        min-height: 370px !important;
        max-height: 370px !important;
      }

      .game-item {
        width: 56px !important;
        height: 56px !important;
      }

      .items-grid {
        gap: 14px 20px !important;
      }

      .operator {
        margin-top: 168px !important;
        font-weight: 400 !important;
      }
    }

    /* ================= EXACT SAME CONFETTI ================= */
    #confettiContainer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 200;
    }

    .confetti-piece {
      position: absolute;
      width: 9px;
      height: 14px;
      border-radius: 2px;
      opacity: 0;
      animation: pageConfetti 1700ms cubic-bezier(.16, .72, .3, 1) forwards;
      will-change: transform, opacity;
    }

    .final-confetti-piece {
      width: 10px;
      height: 16px;
      animation-duration: 2300ms;
    }

    .final-confetti-piece:nth-child(3n) {
      border-radius: 50%;
    }

    .final-confetti-piece:nth-child(4n) {
      width: 7px;
      height: 19px;
      border-radius: 1px;
    }

    .final-confetti-piece:nth-child(5n) {
      width: 13px;
      height: 8px;
      border-radius: 2px;
    }

    @keyframes pageConfetti {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      }

      55% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(0.72);
      }
    }

    .popup-card.complete {
      box-shadow:
        0 20px 45px rgba(108, 92, 231, 0.18),
        0 0 0 8px rgba(162, 155, 254, 0.12);
    }

    .popup-card.complete .replay-btn {
      margin-top: 12px;
    }

    .popup-card.complete .popup-icon {
      animation: finalTrophyBounce 1.2s ease-in-out infinite;
    }

    @keyframes finalTrophyBounce {

      0%,
      100% {
        transform: translateY(0) rotate(0deg) scale(1);
      }

      50% {
        transform: translateY(-5px) rotate(-4deg) scale(1.06);
      }
    }
  </style>
</head>

<body>

  <div id="toast" class="toast"></div>

  <header class="game-header">
    <div class="title-cluster">

      <div class="title-text">
        <h1>Count &amp; draw challenge!</h1>
        <p>Count both groups, find the difference, then build the answer.</p>
      </div>
    </div>
  </header>

  <main class="game-stage" id="gameStage"></main>

  <footer>
    <button class="nav-btn" id="prevBtn" disabled>PREV</button>
    <button class="nav-btn check-btn" id="submitBtn" disabled>SUBMIT</button>
    <button class="nav-btn" id="nextBtn" disabled>NEXT</button>
  </footer>

  <div id="confettiContainer"></div>

  <div class="popup-overlay" id="popup">
    <div class="popup-card" id="popupCard">
      <div class="popup-icon" id="popupIcon"></div>
      <h2 class="popup-title" id="popupTitle">Amazing!</h2>
      <p class="popup-subtitle" id="popupSubtitle">You got it right!</p>
      <button class="nav-btn replay-btn" id="playAgainBtn" style="display:none">Play Again</button>
    </div>
  </div>

  <script>
    /*
      IMAGE PATHS
      Replace these paths with the exact image paths from your organization document if required.
      No emoji or generated SVG is used for the learning objects.
    */
    const quizItems = [
      { label: 'a)', title: 'Balloons', countA: 20, countB: 8, image: '../images/balloon.png' },
      { label: 'b)', title: 'Kites', countA: 10, countB: 7, image: '../images/kite.png' },
      { label: 'c)', title: 'Leaves', countA: 9, countB: 4, image: '../images/leaf.png' },
      { label: 'd)', title: 'Beach Balls', countA: 13, countB: 6, image: '../images/beach-ball.png' }
    ];

    let currentIndex = 0;
    let states = quizItems.map(() => ({ drawn: 0, value: '', unlocked: false }));
    let popupTimer = null;

    const stage = document.getElementById('gameStage');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const popup = document.getElementById('popup');
    const popupCard = document.getElementById('popupCard');
    const popupIcon = document.getElementById('popupIcon');
    const popupTitle = document.getElementById('popupTitle');
    const popupSubtitle = document.getElementById('popupSubtitle');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const toast = document.getElementById('toast');

    function itemHTML(image, alt, extra = '') {
      return `<div class="game-item ${extra}"><img src="${image}" alt="${alt}"></div>`;
    }

    function renderQuestion() {
      const q = quizItems[currentIndex];
      const s = states[currentIndex];

      stage.innerHTML = `
    <section class="slide-item active">
      <div class="worksheet">
        <div class="visual-group">
          <div class="object-box"><div class="items-grid" id="boxA"></div></div>
          <div class="count-line"><input class="count-input" value="${q.countA}" readonly aria-label="First count"></div>
        </div>

        <div class="operator">−</div>

        <div class="visual-group">
          <div class="object-box"><div class="items-grid" id="boxB"></div></div>
          <div class="count-line"><input class="count-input" value="${q.countB}" readonly aria-label="Second count"></div>
        </div>

        <div class="operator">=</div>

        <div class="visual-group">
          <div class="object-box answer-box"><div class="items-grid" id="boxC"></div></div>
          <div class="count-line">
            <input type="number" min="0" max="99" class="count-input" id="answerInput"
              value="${s.value}" ${s.unlocked ? 'disabled' : ''} aria-label="Difference answer">
          </div>
          <div class="draw-tools">
            <button class="draw-btn" id="addBtn" ${s.unlocked ? 'disabled' : ''}>Draw</button>
            <button class="draw-btn undo" id="undoBtn" ${s.unlocked ? 'disabled' : ''}>Undo</button>
          </div>
        </div>
      </div>
    </section>`;

      const boxA = document.getElementById('boxA');
      const boxB = document.getElementById('boxB');
      const boxC = document.getElementById('boxC');

      for (let i = 0; i < q.countA; i++) boxA.insertAdjacentHTML('beforeend', itemHTML(q.image, q.title));
      for (let i = 0; i < q.countB; i++) boxB.insertAdjacentHTML('beforeend', itemHTML(q.image, q.title));
      for (let i = 0; i < s.drawn; i++) boxC.insertAdjacentHTML('beforeend', itemHTML(q.image, q.title));

      document.getElementById('addBtn').addEventListener('click', addVisual);
      document.getElementById('undoBtn').addEventListener('click', removeVisual);

      document.getElementById('answerInput').addEventListener('input', e => {
        if (states[currentIndex].unlocked) return;
        let value = Math.max(0, parseInt(e.target.value, 10) || 0);
        states[currentIndex].value = e.target.value === '' ? '' : value;
        syncVisuals(value);
        updateSubmitState();
      });

      updateNavButtons();
      updateSubmitState();
    }

    function syncVisuals(target) {
      const q = quizItems[currentIndex];
      const boxC = document.getElementById('boxC');
      states[currentIndex].drawn = target;
      boxC.innerHTML = '';
      for (let i = 0; i < target; i++) boxC.insertAdjacentHTML('beforeend', itemHTML(q.image, q.title, 'pop-in'));
    }

    function addVisual() {
      const s = states[currentIndex];
      if (s.unlocked) return;
      s.drawn++;
      s.value = s.drawn;
      document.getElementById('answerInput').value = s.drawn;
      syncVisuals(s.drawn);
      updateSubmitState();
    }

    function removeVisual() {
      const s = states[currentIndex];
      if (s.unlocked || s.drawn <= 0) return;
      s.drawn--;
      s.value = s.drawn || '';
      document.getElementById('answerInput').value = s.value;
      syncVisuals(s.drawn);
      updateSubmitState();
    }

    function updateNavButtons() {
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === quizItems.length - 1 || !states[currentIndex].unlocked;
    }

    function updateSubmitState() {
      const s = states[currentIndex];
      const answerInput = document.getElementById('answerInput');
      const isEmpty = !answerInput || answerInput.value === '';
      submitBtn.disabled = s.unlocked || isEmpty;
    }

    function speak(t) {
      if (!("speechSynthesis" in window)) return;

      speechSynthesis.cancel();

      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-US";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;

      speechSynthesis.speak(msg);
    }


    function showSmallConfetti(isFinal = false) {
      const confettiContainer = document.getElementById('confettiContainer');
      if (!confettiContainer) return;

      confettiContainer.innerHTML = '';

      const count = isFinal ? 95 : 42;

      const colors = [
        '#00b894',
        '#e67e22',
        '#6c5ce7',
        '#0984e3',
        '#fdcb6e',
        '#ff6b7a',
        '#00cec9',
        '#a29bfe'
      ];

      for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');

        piece.className =
          isFinal
            ? 'confetti-piece final-confetti-piece'
            : 'confetti-piece';

        const startX = Math.random() * 100;
        const startY = -8 + Math.random() * 10;

        const drift =
          (Math.random() * 520 - 260) *
          (isFinal ? 1.15 : 0.9);

        const fall =
          window.innerHeight *
          (0.82 + Math.random() * 0.48);

        const rotation =
          Math.random() * 1400 - 700;

        piece.style.left = startX + '%';
        piece.style.top = startY + '%';

        piece.style.setProperty('--x', drift + 'px');
        piece.style.setProperty('--y', fall + 'px');
        piece.style.setProperty('--r', rotation + 'deg');

        piece.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        piece.style.animationDelay =
          (Math.random() * (isFinal ? 500 : 220)) + 'ms';

        confettiContainer.appendChild(piece);

        setTimeout(
          () => piece.remove(),
          isFinal ? 2900 : 2050
        );
      }
    }


    const audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    function playAudioTone(isCorrect) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (isCorrect) {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      }

      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function showPopup(status, icon, title, subtitle, isFinal = false) {
      const popup = document.getElementById("popup");
      const card = document.getElementById("popupCard");
      card.className = `popup-card ${status}${isFinal ? " complete" : ""}`;
      document.getElementById("popupIcon").textContent = icon;
      document.getElementById("popupTitle").textContent = title;
      document.getElementById("popupSubtitle").textContent = subtitle;
      playAgainBtn.style.display = isFinal ? "inline-block" : "none";
      popup.classList.add("active");
      if (!isFinal) {
        clearTimeout(popupTimer);
        popupTimer = setTimeout(closePopup, 1800);
      }
    }

    function closePopup() { popup.classList.remove('active'); }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function checkAnswer() {
      const q = quizItems[currentIndex];
      const s = states[currentIndex];
      const correct = q.countA - q.countB;
      const answer = parseInt(document.getElementById('answerInput').value, 10);

      if (answer === correct && s.drawn === correct) {
        s.unlocked = true;
        speak("Correct!");
        playAudioTone(true);
        document.getElementById('answerInput').disabled = true;
        document.getElementById('addBtn').disabled = true;
        document.getElementById('undoBtn').disabled = true;

        showSmallConfetti(false);

        if (currentIndex === quizItems.length - 1) {
          showPopup('correct', '🌟', 'Amazing!', 'You got it right!', false);

          clearTimeout(popupTimer);
          popupTimer = setTimeout(() => {
            closePopup();
            showSmallConfetti(true);
            showPopup("complete", "🏆", "Congratulations!", "Fantastic job! You solved all questions! 🎉", true);

          }, 1800);
        } else {
          showPopup('correct', '🌟', 'Amazing!', 'You got it right!', false);
        }
        updateNavButtons();
        updateSubmitState();
      } else {
        speak("Try again");
        playAudioTone(false);
        showPopup('wrong', '😟', 'Keep Going!', 'Count carefully and try again.', false);
        s.drawn = 0; s.value = '';
        document.getElementById('answerInput').value = '';
        syncVisuals(0);
        updateSubmitState();
      }
    }

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); }
    });
    nextBtn.addEventListener('click', () => {
      if (currentIndex < quizItems.length - 1 && states[currentIndex].unlocked) {
        currentIndex++; renderQuestion();
      }
    });
    submitBtn.addEventListener('click', checkAnswer);
    playAgainBtn.addEventListener('click', () => {
      closePopup();
      states = quizItems.map(() => ({ drawn: 0, value: '', unlocked: false }));
      currentIndex = 0; renderQuestion();
    });

    renderQuestion();
  </script>
</body>

</html>
