<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero Shield Subtraction Defense Game</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Livvic', sans-serif;
}

body {
    /* Soft Light Pastel Sky Background - NO CARDS */
   
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 2vh 2vw;
    overflow: hidden; /* STRICTLY Prevents Scrolling */
    color: #1e293b;
}

header {
    text-align: center;
    z-index: 10;
    flex-shrink: 0;
    margin-bottom: 1vh;
}

h1 {
    color: #0f172a;
    font-weight: 400;
    text-shadow: 0 2px 0 #ffffff;
    margin-bottom: 6px;
    font-size: 24px;
}

@media screen and (max-width: 1599px) { h1 { font-size: 22px; } }
@media screen and (min-width: 1600px) { h1 { font-size: 30px; } }

.instruction-badge {
    font-size: clamp(20px, 1.5vw, 25px);
    color: #2f4f4f;
    font-weight: 500;
    
    display: inline-block;
     font-size: 20px;
}

/* =========================
   GAME PLAYGROUND – RESPONSIVE TWO SIDE LAYOUT
========================= */
.game-stage {
    width: min(96vw, 1500px);
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    position: relative;
    overflow: hidden;
}

.question-board {
    width: min(92%, 1500px);
    height: min(62vh, 520px);
    max-height: 100%;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.85fr);
    align-items: stretch;
    gap: clamp(18px, 2.5vw, 36px);
    padding: clamp(16px, 1.8vw, 28px);
    border-radius: 42px;
    background: rgba(255,255,255,0.72);
    border: 7px solid rgba(147,197,253,0.55);
    box-shadow:
        0 12px 0 rgba(125, 178, 216, 0.24),
        0 18px 36px rgba(30, 80, 120, 0.08);
    overflow: hidden;
}

/* LEFT: Question */
.question-panel {
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px 12px;
}

.question-title {
    font-size: clamp(2rem, 4.2vw, 4rem);
    line-height: 1.08;
    font-weight: 600;
    color: #29426d;
    letter-spacing: 0.5px;
    margin-bottom: clamp(18px, 3vh, 32px);
}

.equation-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 1.5vw, 22px);
    flex-wrap: nowrap;
}

.eq-text {
    font-size: clamp(2.8rem, 5.1vw, 5.2rem);
    font-weight: 500;
    color: #2f4f4f;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 3px 0 rgba(255,255,255,0.9);
}

.zero-shield-btn {
    min-width: clamp(56px, 7vw, 96px);
    height: clamp(60px, 7vw, 86px);
    padding: 0 8px;
    font-size: clamp(2.8rem, 4.4vw, 4.6rem);
    font-weight: 500;
    color: #2f4f4f;
    background: transparent;
    border: none;
    box-shadow: none;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: default;
    user-select: none;
}

.zero-shield-btn:active {
    transform: none;
    box-shadow: none;
}

input[type="text"] {
    width: clamp(150px, 19vw, 300px);
    height: clamp(62px, 6.5vw, 86px);
    font-size: clamp(2.2rem, 4vw, 4.2rem);
    font-weight: 500;
    text-align: center;
    letter-spacing: 8px;
    border: 5px solid #5d9bd1;
    border-radius: 26px;
    background: #ffffff;
    color: #2f4f4f;
    outline: none;
    box-shadow: 0 8px 0 #b9d4e8, inset 0 -3px 0 rgba(93,155,209,0.08);
    transition: all 0.2s;
    flex: 0 1 auto;
}

input[type="text"]::placeholder {
    color: #5d9bd1;
    opacity: 0.95;
    letter-spacing: 10px;
}

input[type="text"]:focus {
    transform: translateY(-3px);
    border-color: #3b82c4;
    box-shadow: 0 10px 0 #b9d4e8, 0 0 20px rgba(93,155,209,0.28);
}

input[type="text"]:disabled {
    background-color: #f1f2f6;
    border-color: #10b981;
    color: #059669;
    box-shadow: 0 7px 0 #059669;
    cursor: not-allowed;
    transform: none;
    letter-spacing: 0;
}

/* RIGHT: one relevant image, strictly contained inside card */
.visual-panel {
    min-width: 0;
    min-height: 0;
    height: 100%;
    border-radius: 36px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(
        180deg,
        rgba(125,190,222,0.92) 0%,
        rgba(180,220,220,0.78) 58%,
        rgba(143,205,111,0.86) 100%
    );
}

.visual-panel::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 38%);
    pointer-events: none;
}

.question-image {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 0;
    max-height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 1;
    padding: 8px;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,0.12));
}

.image-fallback {
    font-size: 18px;
    font-weight: 600;
    color: #29426d;
    text-align: center;
    padding: 20px;
}

/* Medium laptop */
@media screen and (max-width: 1200px) {
    .question-board {
        width: 94%;
        height: min(58vh, 460px);
        grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
        gap: 18px;
    }

    .equation-row {
        gap: 10px;
    }

    input[type="text"] {
        width: clamp(130px, 18vw, 230px);
    }
}

/* Tablet / Mobile */
@media screen and (max-width: 768px) {
    body {
        padding: 1vh 2vw;
    }

    .game-stage {
        width: 96vw;
        overflow: hidden;
    }

    .question-board {
        width: 96%;
        height: min(66vh, 520px);
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 12px;
        padding: 12px;
        border-width: 5px;
        border-radius: 28px;
    }

    .equation-row {
        gap: 7px;
    }

    .eq-text {
        font-size: clamp(2rem, 10vw, 3.2rem);
    }

    .zero-shield-btn {
        min-width: 42px;
        height: 54px;
        font-size: 2.4rem;
        padding: 0;
    }

    input[type="text"] {
        width: 110px;
        height: 58px;
        font-size: 2rem;
        border-radius: 16px;
    }

    .visual-panel {
        border-radius: 22px;
    }

    .question-image {
        padding: 5px;
    }
}

/* =========================
   CORNER NAVIGATION CONTROLS
========================= */
.bottom-controls {
    width: 100%;
    max-width: 1400px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0.8vh 2vw 1.5vh 2vw;
    z-index: 20;
    flex-shrink: 0;
}

.left-control { justify-self: start; }
.center-control { justify-self: center; }
.right-control { justify-self: end; }

/* Strict Button Sizing Rules (Laptop: 20px, Monitor: 30px) */
.nav-btn, .submit-btn, .replay-btn {
    font-weight: 600; border: none; cursor: pointer; transition: all 0.1s ease;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 20px;  min-width:178px;height:45px; border-radius: 40px;
}

@media screen and (min-width: 1600px) {
    h1 {
        font-size: 30px;
    }
    .nav-btn, .submit-btn, .replay-btn {
        width: 200px;
        min-width: 200px;
        height: 60px;
        font-size: 30px;
        padding: 0;
        border-radius: 50px;
    }
}

.nav-btn.prev { background: #64748b; color: #ffffff; box-shadow: 0 8px 0 #475569; }
.nav-btn.prev:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #475569; }

.nav-btn.next { background: #f97316; color: #ffffff; box-shadow: 0 8px 0 #c2410c; }
.nav-btn.next:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #c2410c; }

.submit-btn { background: #10b981; color: #ffffff; box-shadow: 0 8px 0 #059669; }
.submit-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #059669; }

.replay-btn { background: #0ea5e9; color: white; box-shadow: 0 8px 0 #0284c7; margin-top: 20px; }
.replay-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #0284c7; }

.nav-btn:disabled, .submit-btn:disabled {
    background: #cbd5e1; box-shadow: 0 8px 0 #94a3b8; color: #f8fafc; cursor: not-allowed; opacity: 0.8;
}

/* =========================
   REFERENCE POPUP DESIGN
========================= */
.popup-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
   
    display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100;
}
.popup-overlay.active { opacity: 1; pointer-events: auto; }

.popup-card {
    position: relative; width: 90%; max-width: 520px; padding: 40px 30px;
    border-radius: 36px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    transform: scale(0.8); transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #ffffff;
}

.popup-card::before, .popup-card::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
.popup-card::before { width: 220px; height: 220px; top: -60px; right: -50px; }
.popup-card::after { width: 180px; height: 180px; bottom: -70px; left: -40px; }

.popup-card.correct { background: #edfbf4; border: 6px solid #00c885; }
.popup-card.correct::before, .popup-card.correct::after { background: rgba(162, 245, 209, 0.45); }
.popup-card.correct .popup-title { color: #00a86b; }
.popup-card.correct .popup-subtitle { color: #2e7d5b; }

.popup-card.wrong { background: #fff0f2; border: 6px solid #ff6b7a; }
.popup-card.wrong::before, .popup-card.wrong::after { background: rgba(255, 196, 203, 0.45); }
.popup-card.wrong .popup-title { color: #d33847; }
.popup-card.wrong .popup-subtitle { color: #a33b45; }

.popup-card.complete { background: #f0f3ff; border: 6px solid #6c5ce7; }
.popup-card.complete::before, .popup-card.complete::after { background: rgba(162, 155, 254, 0.35); }
.popup-card.complete .popup-title { color: #6c5ce7; }
.popup-card.complete .popup-subtitle { color: #4834d4; }

.popup-overlay.active .popup-card { transform: scale(1); }
.popup-icon { font-size: 4.8rem; margin-bottom: 12px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.1)); }
.popup-title { font-size: 3rem; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.5px; }
.popup-subtitle { font-size: 1.4rem; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #333; }

@media screen and (max-width: 768px) {
    .eq-text { font-size: 2rem; }
    input[type="text"] { width: 60px; height: 50px; font-size: 1.8rem; }
}
/* EXACT SAME CONFETTI EFFECT */
#confettiContainer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 200;
}
.confetti-piece {
    position: absolute;
    width: 9px;
    height: 14px;
    border-radius: 2px;
    opacity: 0;
    animation: pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
    will-change: transform, opacity;
}
.final-confetti-piece { width: 10px; height: 16px; animation-duration: 2300ms; }
.final-confetti-piece:nth-child(3n) { border-radius: 50%; }
.final-confetti-piece:nth-child(4n) { width: 7px; height: 19px; border-radius: 1px; }
.final-confetti-piece:nth-child(5n) { width: 13px; height: 8px; border-radius: 2px; }
@keyframes pageConfetti {
    0% { opacity: 1; transform: translate3d(0,0,0) rotate(0deg) scale(1); }
    55% { opacity: 1; }
    100% { opacity: 0; transform: translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72); }
}
.popup-card.complete {
    box-shadow: 0 20px 45px rgba(108,92,231,.18), 0 0 0 8px rgba(162,155,254,.12);
}
.popup-card.complete .replay-btn { margin-top: 12px; }
.popup-card.complete .popup-icon { animation: finalTrophyBounce 1.2s ease-in-out infinite; }
@keyframes finalTrophyBounce {
    0%,100% { transform: translateY(0) rotate(0deg) scale(1); }
    50% { transform: translateY(-5px) rotate(-4deg) scale(1.06); }
}

/* Exact question sizing: ALL equation parts + answer input */
.eq-text, .zero-shield-btn, input[type="text"] {
    font-size: 30px !important;
    color: #2f4f4f !important;
}

@media screen and (min-width: 1600px) {
    .eq-text, .zero-shield-btn, input[type="text"] {
        font-size: 40px !important;
        color: #2f4f4f !important;
    }
}
</style>
</head>

<body>
<div id="confettiContainer"></div>

<header>
    <h1>Find the difference and fill in the boxes.</h1>
    <div class="instruction-badge">Tap the 0 Shield to activate defense, then solve!</div>
</header>

<main class="game-stage" id="stage">
    </main>

<div class="bottom-controls">
    <div class="left-control">
        <button class="nav-btn prev" id="prevBtn" onclick="navigate(-1)" disabled>PREV</button>
    </div>
    <div class="center-control">
        <button class="submit-btn" id="submitBtn" onclick="checkAnswers()" disabled>SUBMIT</button>
    </div>
    <div class="right-control">
        <button class="nav-btn next" id="nextBtn" onclick="navigate(1)" disabled>NEXT</button>
    </div>
</div>

<div class="popup-overlay" id="popup">
    <div class="popup-card" id="popupCard">
        <div class="popup-icon" id="popupIcon">⭐</div>
        <h2 class="popup-title" id="popupTitle">Amazing!</h2>
        <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
        <button class="replay-btn" id="playAgainBtn" style="display: none;" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
/* ==========================================
   QUIZ DATA (Strict Match to Image Questions)
========================================== */
const quizData = [
    { label: "a)", num: 8,  targetAns: 8,  image: "../images/kid1.png" },
    { label: "b)", num: 7,  targetAns: 7,  image: "../images/kid2.png" },
    { label: "c)", num: 14, targetAns: 14, image: "../images/kid3.png" },
    { label: "d)", num: 12, targetAns: 12, image: "../images/kid4.png" },
    { label: "e)", num: 19, targetAns: 19, image: "../images/kid5.png" },
    { label: "f)", num: 10, targetAns: 10, image: "../images/kid6.png" }
];

let quizState = Array.from({ length: quizData.length }, () => ({
    isSolved: false,
    userAns: ""
}));

let currentIndex = 0;
let popupTimer = null;
let finalTimer = null;
let audioCtx = null;

const stageEl = document.getElementById("stage");
const submitBtn = document.getElementById("submitBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const playAgainBtn = document.getElementById("playAgainBtn");

function showSmallConfetti(isFinal = false) {
    const confettiContainer = document.getElementById('confettiContainer');
    if (!confettiContainer) return;
    confettiContainer.innerHTML = '';
    const count = isFinal ? 95 : 42;
    const colors = ['#00b894','#e67e22','#6c5ce7','#0984e3','#fdcb6e','#ff6b7a','#00cec9','#a29bfe'];
    for (let i=0;i<count;i++) {
        const piece=document.createElement('span');
        piece.className=isFinal?'confetti-piece final-confetti-piece':'confetti-piece';
        const startX=Math.random()*100, startY=-8+Math.random()*10;
        const drift=(Math.random()*520-260)*(isFinal?1.15:.9);
        const fall=window.innerHeight*(.82+Math.random()*.48);
        const rotation=Math.random()*1400-700;
        piece.style.left=startX+'%'; piece.style.top=startY+'%';
        piece.style.setProperty('--x',drift+'px'); piece.style.setProperty('--y',fall+'px'); piece.style.setProperty('--r',rotation+'deg');
        piece.style.background=colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDelay=(Math.random()*(isFinal?500:220))+'ms';
        confettiContainer.appendChild(piece);
        setTimeout(()=>piece.remove(),isFinal?2900:2050);
    }
}

/* ==========================================
   AUDIO SYNTHESIZER
========================================== */
function playTone(type) {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "correct") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === "wrong") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === "boing") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }
    } catch (error) {
        console.log("Audio error:", error);
    }
}

function speak(text) {
    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = "en-US";
        msg.volume = 0.8;
        msg.rate = 1;
        msg.pitch = 1.2;
        speechSynthesis.speak(msg);
    }
}

/* ==========================================
   LOAD QUESTION
========================================== */
function loadQuestion() {
    const q = quizData[currentIndex];
    const state = quizState[currentIndex];

    // Reference-style layout:
    // LEFT = question/equation
    // RIGHT = one large relevant image using the image path from quizData.
    const questionHTML = `
        <div class="question-board">
            <section class="question-panel">
                <div class="equation-row">
                    <span class="eq-text">${q.num}</span>
                    <span class="eq-text">−</span>
                    <div class="zero-shield-btn" id="shieldBtn">0</div>
                    <span class="eq-text">=</span>
                    <input
                        type="text"
                        id="finalInput"
                        inputmode="numeric"
                        maxlength="2"
                        value="${state.userAns}"
                        placeholder="__"
                        aria-label="Enter your answer"
                    >
                </div>
            </section>

            <section class="visual-panel">
                <img
                    src="${q.image}"
                    class="question-image"
                    alt="Relevant question illustration"
                    onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=&quot;image-fallback&quot;>Add your relevant image path in quizData.</div>';"
                >
            </section>
        </div>
    `;

    stageEl.innerHTML = questionHTML;

    const inputEl = document.getElementById("finalInput");
    const shieldBtn = document.getElementById("shieldBtn");

    // Keep the same sound/voice functionality.
    shieldBtn.addEventListener('click', function() {
        playTone("boing");
        speak("Subtracting zero leaves the number unchanged.");
    });

    // Answer Input Listener
    inputEl.addEventListener("input", function(e) {
        e.target.value = e.target.value.replace(/[^0-9]/g, "");
        state.userAns = e.target.value;
        checkSubmitState();
    });

    if (state.isSolved) {
        inputEl.disabled = true;
    }

    checkSubmitState();

    prevBtn.disabled = (currentIndex === 0);
    nextBtn.disabled = (!state.isSolved || currentIndex === quizData.length - 1);
}

function checkSubmitState() {
    const state = quizState[currentIndex];
    submitBtn.disabled = state.isSolved || state.userAns.trim() === "";
}

function navigate(direction) {
    const state = quizState[currentIndex];

    if (direction === 1 && !state.isSolved) {
        return;
    }

    currentIndex += direction;

    if (currentIndex < 0) currentIndex = 0;
    if (currentIndex > quizData.length - 1) currentIndex = quizData.length - 1;

    loadQuestion();
}

function checkAnswers() {
    const q = quizData[currentIndex];
    const state = quizState[currentIndex];
    const userAnsVal = parseInt(state.userAns);

    /* WRONG ANSWER CHECK */
    if (userAnsVal !== q.targetAns) {
        showPopup("wrong", "😟", "Keep Going!", "Subtracting 0 leaves all the snacks! 🌈", false);
        playTone("wrong");
        speak("Wrong");

        state.userAns = "";
        const inputEl = document.getElementById("finalInput");
        if (inputEl) inputEl.value = "";

        checkSubmitState();
        return;
    }

    /* CORRECT ANSWER */
    state.isSolved = true;

    const inputEl = document.getElementById("finalInput");
    if (inputEl) inputEl.disabled = true;
    submitBtn.disabled = true;

    playTone("correct");

    if (currentIndex === quizData.length - 1) {
        nextBtn.disabled = true;
        clearTimeout(finalTimer);

        // Last question: show the normal Correct popup first.
        showSmallConfetti(false);
        showPopup("correct", "🌟", "Amazing!", "You got it right! ✨", false);
        speak("Correct");

        clearTimeout(popupTimer);
        finalTimer = setTimeout(() => {
            closePopup();
            showSmallConfetti(true);
            showPopup("complete", "🏆", "Congratulations!", "Fantastic job! You solved all questions! 🎉", true);
        }, 1800);
    } else {
        nextBtn.disabled = false;
        showSmallConfetti(false);
        showPopup("correct", "🌟", "Amazing!", "You got it right! ✨", false);
        speak("Correct");
    }
}

function showPopup(status, icon, title, subtitle, isFinal = false) {
    const popup = document.getElementById("popup");
    const card = document.getElementById("popupCard");

    card.className = `popup-card ${status}${isFinal ? " complete" : ""}`;
    document.getElementById("popupIcon").innerText = icon;
    document.getElementById("popupTitle").innerText = title;
    document.getElementById("popupSubtitle").innerText = subtitle;

    playAgainBtn.style.display = isFinal ? "inline-block" : "none";
    popup.classList.add("active");

    if (!isFinal) {
        clearTimeout(popupTimer);
        popupTimer = setTimeout(closePopup, 1800);
    }
}

function closePopup() {
    document.getElementById("popup").classList.remove("active");
}

function restartGame() {
    clearTimeout(popupTimer);
    clearTimeout(finalTimer);
    const confettiContainer = document.getElementById("confettiContainer");
    if (confettiContainer) confettiContainer.innerHTML = "";
    closePopup();
    quizState = Array.from({ length: quizData.length }, () => ({
        isSolved: false,
        userAns: ""
    }));    
    currentIndex = 0;
    loadQuestion();
}

window.onload = function() {
    loadQuestion();
};
</script>
