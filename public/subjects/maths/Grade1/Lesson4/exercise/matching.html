<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700;900&display=swap" rel="stylesheet">

    <title>Match Accordingly</title>

    <style>
        /* =====================================
   RESET
===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', sans-serif;
            font-weight: 400;
        }

        body {
            min-height: 100vh;
            font-family: 'Livvic', sans-serif;
            overflow: hidden;
            color: #293241;


        }


        /* =====================================
   TOP HEADER
===================================== */

        .top-header {

            height: 88px;

            position: relative;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            z-index: 20;
        }


        /* HOME */

        .home-btn {

            position: absolute;

            left: 25px;

            top: 20px;

            width: 58px;
            height: 58px;

            border: none;

            border-radius: 50%;

            background: #f4f8f7;

            color: #40515c;

            font-size: 28px;

            cursor: pointer;

            box-shadow:
                0 7px 18px rgba(54, 90, 100, .18);

            transition: .2s ease;
        }

        .home-btn:hover {
            transform: translateY(-3px);
        }


        /* HEADING */

        .question-heading {

            /* background:rgba(255,255,255,.72);

    border:2px solid rgba(255,255,255,.75);

    border-radius:18px;

    padding:14px 32px; */

            display: flex;

            align-items: center;
            font-size: 22px;
            font-weight: 400;
            gap: 13px;

            /* box-shadow:
        0 8px 22px rgba(57,93,105,.14); */
        }


        .question-number {

            width: 42px;
            height: 42px;

            border-radius: 13px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(135deg, #ffbd62, #ec9037);

            color: white;

            font-size: 22px;

            font-weight: 500;

            box-shadow:
                0 5px 0 #d97a27;
        }


        .question-heading span {

            font-size: 30px;

            font-weight: 400;

            color: #2f4f4f;
        }


        /* =====================================
   GAME BOARD
===================================== */

        .game-board {

            width: 100%;

            height: calc(100vh - 88px);

            padding: 12px 5% 25px;

            position: relative;

            display: grid;

            grid-template-columns:
                minmax(360px, 460px) 1fr minmax(360px, 460px);

            gap: 55px;

            align-items: center;
        }


        /* =====================================
   CONNECTION SVG
===================================== */

        .connection-svg {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 3;
        }


        .match-line-glow {
            fill: none;
            stroke: #8b5cf6;
            stroke-width: 18;
            stroke-linecap: round;
            opacity: .18;
            filter: blur(5px);
        }

        .match-line-outline {
            fill: none;
            stroke: #ffffff;
            stroke-width: 12;
            stroke-linecap: round;
            opacity: .95;
        }

        .match-line {
            fill: none;
            stroke: #6c5ce7;
            stroke-width: 7;
            stroke-linecap: round;
            stroke-dasharray: 2 15;
            filter: drop-shadow(0 3px 5px rgba(80, 40, 20, .28));
            animation: lineFlow .65s linear infinite;
        }

        .match-line-core {
            fill: none;
            stroke: #ffbe3d;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 2 15;
            animation: lineFlow .65s linear infinite reverse;
        }

        @keyframes lineFlow {
            to {
                stroke-dashoffset: -34;
            }
        }

        /* =====================================
   LEFT / RIGHT COLUMNS
===================================== */

        .left-zone,
        .right-zone {

            display: flex;

            flex-direction: column;

            justify-content: center;

            gap: 22px;

            position: relative;

            z-index: 5;
        }


        /* =====================================
   LEFT GAME CARDS
===================================== */

        .math-card {

            height: 128px;

            border-radius: 25px;

            display: flex;

            align-items: center;

            padding: 12px 22px 12px 16px;

            position: relative;

            cursor: pointer;

            border: 4px solid rgba(255, 255, 255, .72);

            box-shadow:
                0 10px 0 rgba(48, 88, 102, .15),
                0 15px 25px rgba(40, 75, 90, .12);

            transition: .22s ease;

            overflow: visible;

            user-select: none;
        }


        /* CARD COLORS */

        .math-card:nth-child(1) {

            background:
                linear-gradient(135deg, #ddd7f4, #c9c1e7);
        }

        .math-card:nth-child(2) {

            background:
                linear-gradient(135deg, #efffb1, #d6f276);
        }

        .math-card:nth-child(3) {

            background:
                linear-gradient(135deg, #c7e7f4, #9fd2e7);
        }


        /* HOVER */

        .math-card:hover:not(.matched) {

            transform:
                translateY(-4px) scale(1.015);
        }


        /* ACTIVE */

        .math-card.active {

            transform:
                translateX(7px) scale(1.02);

            box-shadow:
                0 0 0 5px rgba(255, 255, 255, .32),
                0 10px 0 rgba(48, 88, 102, .15),
                0 20px 30px rgba(40, 75, 90, .20);
        }


        /* MATCHED */

        .math-card.matched {

            opacity: .68;

            cursor: default;

            filter: saturate(.8);
        }


        /* =====================================
   NUMBER BADGE
===================================== */

        .level-badge {

            width: 54px;
            height: 54px;

            min-width: 54px;

            border-radius: 17px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: white;

            font-size: 22px;

            font-weight: 600;

            margin-right: 18px;

            box-shadow:
                inset 0 3px 7px rgba(255, 255, 255, .28),
                0 6px 0 rgba(0, 0, 0, .10);
        }


        .math-card:nth-child(1) .level-badge {

            background:
                linear-gradient(135deg, #785bd0, #4c379e);
        }


        .math-card:nth-child(2) .level-badge {

            background:
                linear-gradient(135deg, #67b522, #3f870c);
        }


        .math-card:nth-child(3) .level-badge {

            background:
                linear-gradient(135deg, #4e9bd0, #2870a7);
        }


        /* =====================================
   QUESTION TEXT
===================================== */

        .math-content {

            flex: 1;
        }


        .math-question {

            font-size: 22px;

            font-weight: 500;

            color: #2f4f4f;

            letter-spacing: .5px;
        }


        /* =====================================
   LEFT IMAGE
===================================== */

        .math-image-wrap {

            width: 92px;
            height: 92px;

            min-width: 92px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-left: 12px;
        }


        .math-image {

            width: 100%;
            height: 100%;

            object-fit: contain;

            filter:
                drop-shadow(0 7px 7px rgba(40, 60, 70, .18));

            pointer-events: none;
        }


        /* =====================================
   LEFT NODE
===================================== */

        .left-node {

            position: absolute;

            width: 42px;
            height: 42px;

            right: -25px;

            top: 50%;

            transform: translateY(-50%);

            background: #ffffff;

            border-radius: 50%;

            border: 6px solid #edf2f3;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, .17);

            z-index: 8;
        }


        .math-card:nth-child(1) .left-node {
            outline: 5px solid #7055bf;
        }

        .math-card:nth-child(2) .left-node {
            outline: 5px solid #61a91c;
        }

        .math-card:nth-child(3) .left-node {
            outline: 5px solid #438dc0;
        }


        /* =====================================
   RIGHT ANSWER BOX
===================================== */

        .answer-card {

            height: 128px;

            border-radius: 25px;

            background:
                linear-gradient(135deg, #fffdf6, #fff6dc);

            border: 4px solid #ffe8a4;

            box-shadow:
                0 10px 0 rgba(115, 90, 35, .12),
                0 15px 25px rgba(40, 75, 90, .12);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 15px 45px;

            position: relative;

            cursor: pointer;

            transition: .22s ease;

            user-select: none;
        }


        .answer-card:hover:not(.matched) {

            transform:
                translateY(-4px) scale(1.015);
        }


        /* ACTIVE TARGET */

        .answer-card.target {

            border-color: #f5a623;

            box-shadow:
                0 0 0 5px rgba(255, 255, 255, .30),
                0 10px 0 rgba(115, 90, 35, .12),
                0 20px 30px rgba(40, 75, 90, .18);
        }


        /* MATCHED */

        .answer-card.matched {

            cursor: default;

            opacity: .7;

            background:
                linear-gradient(135deg, #f1fff3, #e2f6e2);

            border-color: #9bd893;
        }


        /* ANSWER TEXT ONLY */

        .answer-text {

            font-size: 22px;

            font-weight: 500;

            text-align: center;

            color: #2f4f4f;

            line-height: 1.3;
        }


        /* =====================================
   RIGHT NODE
===================================== */

        .right-node {

            position: absolute;

            width: 42px;
            height: 42px;

            left: -25px;

            top: 50%;

            transform: translateY(-50%);

            background: #ffffff;

            border-radius: 50%;

            border: 6px solid #f1f2ee;

            outline: 5px solid #efa01b;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, .17);
        }


        /* =====================================
   MATCH TICK
===================================== */

        .match-tick {

            position: absolute;

            width: 30px;
            height: 30px;

            right: 14px;
            top: 13px;

            border-radius: 50%;

            display: none;

            align-items: center;
            justify-content: center;

            background: #65bb73;

            color: white;

            font-weight: bold;

            font-size: 17px;
        }


        .matched .match-tick {
            display: flex;
        }


        /* =====================================
   WRONG SHAKE
===================================== */

        .shake {
            animation: shake .4s ease;
        }


        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            50% {
                transform: translateX(8px);
            }

            75% {
                transform: translateX(-5px);
            }
        }


        /* =========================
           POPUP OVERLAY
        ========================= */

        .popup-overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;



            display: flex;

            justify-content: center;
            align-items: center;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.3s ease;

            z-index: 100;
        }


        .popup-overlay.active {

            opacity: 1;

            pointer-events: auto;
        }


        .popup-card {

            position: relative;

            width: 90%;
            max-width: 520px;

            padding:
                40px 30px;

            border-radius: 36px;

            text-align: center;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.1);

            transform:
                scale(0.8);

            transition:
                transform 0.35s cubic-bezier(0.175,
                    0.885,
                    0.32,
                    1.275);

            overflow: hidden;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }

        @keyframes finalTrophyBounce {

            0%,
            100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }

            50% {
                transform: translateY(-5px) rotate(-4deg) scale(1.06);
            }
        }

        .popup-card::before,
        .popup-card::after {

            content: '';

            position: absolute;

            border-radius: 50%;

            pointer-events: none;
        }


        .popup-card::before {

            width: 220px;
            height: 220px;

            top: -60px;
            right: -50px;
        }


        .popup-card::after {

            width: 180px;
            height: 180px;

            bottom: -70px;
            left: -40px;
        }


        /* Correct */

        .popup-card.correct {

            background: #edfbf4;

            border:
                6px solid #00c885;
        }


        .popup-card.correct::before,
        .popup-card.correct::after {

            background:
                rgba(162, 245, 209, 0.45);
        }


        .popup-card.correct .popup-title {

            color: #00a86b;
        }


        .popup-card.correct .popup-subtitle {

            color: #2e7d5b;
        }


        /* Wrong */

        .popup-card.wrong {

            background: #fff0f2;

            border:
                6px solid #ff6b7a;
        }


        .popup-card.wrong::before,
        .popup-card.wrong::after {

            background:
                rgba(255, 196, 203, 0.45);
        }


        .popup-card.wrong .popup-title {

            color: #d33847;
        }


        .popup-card.wrong .popup-subtitle {

            color: #a33b45;
        }


        /* Complete */

        .popup-card.complete {

            background: #f0f3ff;

            border:
                6px solid #6c5ce7;
        }


        .popup-card.complete::before,
        .popup-card.complete::after {

            background:
                rgba(162, 155, 254, 0.35);
        }


        .popup-card.complete .popup-title {

            color: #6c5ce7;
        }


        .popup-card.complete .popup-subtitle {

            color: #4834d4;
        }


        .popup-overlay.active .popup-card {

            transform:
                scale(1);
        }


        .popup-card.complete {
            background: #f0f3ff;
            border: 6px solid #6c5ce7;
        }


        .popup-icon {

            font-size: 4.8rem;

            margin-bottom: 12px;

            z-index: 2;

            line-height: 1;

            filter:
                drop-shadow(0 6px 10px rgba(0, 0, 0, 0.1));
        }


        .popup-title {

            font-size: 3rem;

            font-weight: 600;

            margin-bottom: 8px;

            z-index: 2;

            letter-spacing: -0.5px;
        }


        .popup-subtitle {

            font-size: 1.4rem;

            font-weight: 500;

            z-index: 2;

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .popup-card.complete .popup-icon {
            animation: finalTrophyBounce 1.2s ease-in-out infinite;
        }

        @keyframes finalTrophyBounce {

            0%,
            100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }

            50% {
                transform: translateY(-5px) rotate(-4deg) scale(1.06);
            }
        }




        /* PLAY AGAIN - SAME AS COSMIC ENERGY POD REFERENCE */
        .replay-btn {
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 20px;
            min-width: 178px;
            height: 45px;
            border-radius: 40px;
            background: #0ea5e9;
            color: #ffffff;
            box-shadow: 0 8px 0 #0284c7;
            margin-top: 20px;
            padding: 0 24px;
        }

        .replay-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #0284c7;
        }

        @media screen and (min-width: 1600px) {
            .replay-btn {
                width: 200px;
                min-width: 200px;
                height: 60px;
                font-size: 30px;
                padding: 0;
                border-radius: 50px;
            }

            .math-card {

                height: 128px;
            }
        }


        /* =====================================
   RESPONSIVE
===================================== */

        @media(max-width:1050px) {

            body {
                overflow: auto;
            }

            .game-board {

                height: auto;

                min-height: calc(100vh - 88px);

                grid-template-columns: 1fr;

                gap: 22px;

                padding: 15px 25px 35px;
            }

            .connection-svg {
                display: none;
            }

            .left-zone,
            .right-zone {
                gap: 16px;
            }

            .right-zone {
                margin-top: 10px;
            }

            .math-card,
            .answer-card {
                max-width: 600px;
                width: 100%;
                margin: auto;
            }

            .left-node,
            .right-node {
                display: none;
            }
        }


        @media(max-width:600px) {

            .top-header {

                height: 78px;
            }

            .home-btn {

                left: 12px;

                top: 13px;

                width: 48px;
                height: 48px;

                font-size: 22px;
            }

            .question-heading {

                padding: 10px 16px;
            }

            .question-heading span {

                font-size: 16px;
            }

            .question-number {

                width: 34px;
                height: 34px;

                font-size: 17px;
            }

            .game-board {

                padding: 12px 14px 30px;
            }

            .math-card,
            .answer-card {

                height: 110px;

                border-radius: 20px;
            }

            .math-question,
            .answer-text {

                font-size: 20px;
            }

            .math-image-wrap {

                width: 70px;
                height: 70px;

                min-width: 70px;
            }

            .level-badge {

                width: 45px;
                height: 45px;

                min-width: 45px;

                font-size: 18px;

                margin-right: 12px;
            }

            .popup-title {
                font-size: 2.2rem;
            }

            .popup-subtitle {
                font-size: 1.1rem;
            }
        }

        @media screen and (min-width:1600px) {
            .top-header {
                height: 100px;
            }

            .question-heading {
                font-size: 30px;
                padding: 14px 32px;
            }

            .question-heading span {
                font-size: 30px;
            }

            .question-number {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }

            .game-board {
                width: min(1600px, 94vw);
                margin: 0 auto;
                height: calc(100vh - 100px);
                padding: 18px 2vw 30px;
                grid-template-columns: minmax(380px, 1fr) minmax(120px, 180px) minmax(380px, 1fr);
                gap: clamp(35px, 4vw, 75px);
            }

            .left-zone,
            .right-zone {
                width: 100%;
                gap: clamp(18px, 1.5vw, 28px);
            }

            .question-heading span{
                font-size: 40px;
            }

             .math-card,.answer-card{
                width: 100%;
                height: 180px;
             }

            .math-question,
            .answer-text {
                font-size: 26px;
            }

            .level-badge {
                width: 58px;
                height: 58px;
                min-width: 58px;
                font-size: 24px;
            }
        }


        /* CONFETTI - added only, no game functionality changed */
        #confettiContainer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 200;
        }

        .confetti-piece {
            position: absolute;
            width: 9px;
            height: 14px;
            border-radius: 2px;
            opacity: 0;
            animation: pageConfetti 1700ms cubic-bezier(.16, .72, .3, 1) forwards;
            will-change: transform, opacity;
        }

        .final-confetti-piece {
            width: 10px;
            height: 16px;
            animation-duration: 2300ms;
        }

        .final-confetti-piece:nth-child(3n) {
            border-radius: 50%;
        }

        .final-confetti-piece:nth-child(4n) {
            width: 7px;
            height: 19px;
            border-radius: 1px;
        }

        .final-confetti-piece:nth-child(5n) {
            width: 13px;
            height: 8px;
            border-radius: 2px;
        }

        @keyframes pageConfetti {
            0% {
                opacity: 1;
                transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
            }

            55% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(0.72);
            }
        }
    </style>
</head>


<body>


    <!-- =====================================
     HEADER
===================================== -->

    <div class="top-header">



        <div class="question-heading">


            <span>
                Match accordingly
            </span>

        </div>

    </div>



    <!-- =====================================
     GAME BOARD
===================================== -->

    <div class="game-board" id="gameBoard">


        <!-- CONNECTION SVG -->

        <svg class="connection-svg" id="connectionSvg">
        </svg>



        <!-- =================================
         LEFT QUESTIONS
    ================================= -->

        <div class="left-zone">


            <!-- QUESTION 1 -->

            <div class="math-card" data-answer="zero">

                <div class="level-badge">
                    a
                </div>


                <div class="math-content">

                    <div class="math-question">
                        20 − 20
                    </div>

                </div>


                <!-- CHANGE PATH -->

                <div class="math-image-wrap">

                    <img src="../images/twenty.png" class="math-image" alt="Zero">

                </div>


                <div class="left-node"></div>

                <div class="match-tick">
                    ✓
                </div>

            </div>



            <!-- QUESTION 2 -->

            <div class="math-card" data-answer="before">

                <div class="level-badge">
                    b
                </div>


                <div class="math-content">

                    <div class="math-question">
                        19 − 1
                    </div>

                </div>


                <!-- CHANGE PATH -->

                <div class="math-image-wrap">

                    <img src="../images/before_number.png" class="math-image" alt="Before Number">

                </div>


                <div class="left-node"></div>

                <div class="match-tick">
                    ✓
                </div>

            </div>



            <!-- QUESTION 3 -->

            <div class="math-card" data-answer="itself">

                <div class="level-badge">
                    c
                </div>


                <div class="math-content">

                    <div class="math-question">
                        12 − 0
                    </div>

                </div>


                <!-- CHANGE PATH -->

                <div class="math-image-wrap">

                    <img src="../images/number_itself.png" class="math-image" alt="Number Itself">

                </div>


                <div class="left-node"></div>

                <div class="match-tick">
                    ✓
                </div>

            </div>


        </div>



        <!-- =================================
         EMPTY CENTER SPACE
         NO CIRCLE / NO DESIGN
    ================================= -->

        <div></div>



        <!-- =================================
         RIGHT ANSWERS
    ================================= -->

        <div class="right-zone">


            <!-- NUMBER ITSELF -->

            <div class="answer-card" data-answer="itself">

                <div class="right-node"></div>

                <div class="answer-text">
                    Number itself
                </div>

                <div class="match-tick">
                    ✓
                </div>

            </div>



            <!-- ZERO -->

            <div class="answer-card" data-answer="zero">

                <div class="right-node"></div>

                <div class="answer-text">
                    Zero
                </div>

                <div class="match-tick">
                    ✓
                </div>

            </div>



            <!-- BEFORE NUMBER -->

            <div class="answer-card" data-answer="before">

                <div class="right-node"></div>

                <div class="answer-text">
                    Before number
                </div>

                <div class="match-tick">
                    ✓
                </div>

            </div>


        </div>


    </div>



    <!-- =====================================
     HEAVY & LIGHT STYLE FINAL POPUP
===================================== -->

    <div class="popup-overlay" id="popup">

        <div class="popup-card" id="popupCard">

            <div class="popup-icon" id="popupIcon">

                ⭐

            </div>


            <h2 class="popup-title" id="popupTitle">

                Amazing!

            </h2>


            <p class="popup-subtitle" id="popupSubtitle">

                You got it right! ✨

            </p>


            <button class="replay-btn" id="playAgainBtn" onclick="restartGame()">

                Play Again

            </button>

        </div>

    </div>



    <script>


        /* =====================================
           GAME ELEMENTS
        ===================================== */

        const mathCards =
            document.querySelectorAll(".math-card");

        const answerCards =
            document.querySelectorAll(".answer-card");

        const gameBoard =
            document.getElementById("gameBoard");

        const svg =
            document.getElementById("connectionSvg");

        const playAgainBtn =
            document.getElementById("playAgainBtn");


        let selectedCard = null;

        let completedMatches = 0;


        /* =====================================
           SPEECH FEEDBACK
        ===================================== */

        function speak(t) {

            speechSynthesis.cancel();

            const msg = new SpeechSynthesisUtterance(t);

            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;

            speechSynthesis.speak(msg);
        }


        /* =====================================
           SELECT QUESTION
        ===================================== */

        mathCards.forEach(card => {

            card.addEventListener("click", () => {

                if (
                    card.classList.contains("matched")
                ) {
                    return;
                }


                mathCards.forEach(item => {

                    if (
                        !item.classList.contains("matched")
                    ) {
                        item.classList.remove("active");
                    }

                });


                selectedCard = card;

                selectedCard.classList.add("active");


                answerCards.forEach(answer => {

                    if (
                        !answer.classList.contains("matched")
                    ) {

                        answer.classList.add("target");

                    }

                });

            });

        });


        /* =====================================
           SELECT ANSWER
        ===================================== */

       mathCards.forEach(card => {
    card.addEventListener("click", () => {

        if (card.classList.contains("matched")) return;

        // Remove active from other left cards
        mathCards.forEach(item => {
            item.classList.remove("active");
            item.style.border = "";
            item.style.boxShadow = "";
        });

        // Keep clicked left card active
        selectedCard = card;
        selectedCard.classList.add("active");

        // Green highlight
        selectedCard.style.border = "4px solid #00b894";
        selectedCard.style.boxShadow =
            "0 0 0 5px rgba(0,184,148,.25), " +
            "0 10px 0 rgba(48,88,102,.15), " +
            "0 20px 30px rgba(40,75,90,.20)";

        // Activate all available answers
        answerCards.forEach(answer => {
            if (!answer.classList.contains("matched")) {
                answer.classList.add("target");
            }
        });
    });
});


answerCards.forEach(answer => {
    answer.addEventListener("click", () => {

        if (!selectedCard) return;
        if (answer.classList.contains("matched")) return;

        const selectedAnswer = selectedCard.dataset.answer;
        const targetAnswer = answer.dataset.answer;

        if (selectedAnswer === targetAnswer) {

            speak("Correct!");
            showSmallConfetti(false);

            selectedCard.classList.remove("active");
            selectedCard.style.border = "";
            selectedCard.style.boxShadow = "";

            selectedCard.classList.add("matched");

            answer.classList.remove("target");
            answer.classList.add("matched");

            answerCards.forEach(item => {
                item.classList.remove("target");
            });

            drawConnection(selectedCard, answer);

            selectedCard = null;
            completedMatches++;

            if (completedMatches === 3) {
                setTimeout(() => {
                    showSmallConfetti(true);
                    showFinalPopup();
                }, 600);
            }

        } else {

            speak("Try again!");

            // Keep LEFT card active after wrong answer
            if (selectedCard) {
                selectedCard.classList.add("active");

                selectedCard.style.border = "4px solid #00b894";
                selectedCard.style.boxShadow =
                    "0 0 0 5px rgba(0,184,148,.25), " +
                    "0 10px 0 rgba(48,88,102,.15), " +
                    "0 20px 30px rgba(40,75,90,.20)";
            }

            // Shake wrong answer only
            answer.classList.add("shake");

            setTimeout(() => {

                answer.classList.remove("shake");

                // IMPORTANT:
                // Do NOT set selectedCard = null
                // Do NOT remove active

                if (selectedCard) {
                    selectedCard.classList.add("active");

                    selectedCard.style.border = "4px solid #00b894";
                    selectedCard.style.boxShadow =
                        "0 0 0 5px rgba(0,184,148,.25), " +
                        "0 10px 0 rgba(48,88,102,.15), " +
                        "0 20px 30px rgba(40,75,90,.20)";
                }

                // Allow another answer immediately
                answerCards.forEach(item => {
                    if (!item.classList.contains("matched")) {
                        item.classList.add("target");
                    }
                });

            }, 450);
        }
    });
});


        /* =====================================
           DRAW MATCH CONNECTION
        ===================================== */

        function drawConnection(
            leftCard,
            rightCard
        ) {

            if (
                window.innerWidth <= 1050
            ) {
                return;
            }


            const boardRect =
                gameBoard.getBoundingClientRect();


            const leftNode =
                leftCard.querySelector(".left-node");

            const rightNode =
                rightCard.querySelector(".right-node");


            const leftRect =
                leftNode.getBoundingClientRect();

            const rightRect =
                rightNode.getBoundingClientRect();


            const x1 =
                leftRect.left -
                boardRect.left +
                leftRect.width / 2;


            const y1 =
                leftRect.top -
                boardRect.top +
                leftRect.height / 2;


            const x2 =
                rightRect.left -
                boardRect.left +
                rightRect.width / 2;


            const y2 =
                rightRect.top -
                boardRect.top +
                rightRect.height / 2;


            const middleX =
                (x1 + x2) / 2;


            const pathData =
                `M ${x1} ${y1}
         C ${middleX} ${y1},
         ${middleX} ${y2},
         ${x2} ${y2}`;


            /* WHITE OUTLINE */

            const outline =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );


            outline.setAttribute(
                "d",
                pathData
            );

            outline.setAttribute(
                "class",
                "match-line-outline"
            );


            const glow = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "path"
            );

            glow.setAttribute("d", pathData);
            glow.setAttribute("class", "match-line-glow");
            svg.appendChild(glow);

            svg.appendChild(outline);


            /* GAMING ENERGY DOT TRAIL */

            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );


            line.setAttribute(
                "d",
                pathData
            );

            line.setAttribute(
                "class",
                "match-line"
            );


            svg.appendChild(line);

            const core =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );

            core.setAttribute("d", pathData);
            core.setAttribute("class", "match-line-core");
            svg.appendChild(core);

        }


        /* =====================================
           FINAL POPUP
        ===================================== */

        function showFinalPopup() {

            const popup =
                document.getElementById("popup");

            const card =
                document.getElementById("popupCard");


            card.className =
                "popup-card complete";


            document
                .getElementById("popupIcon")
                .innerText = "🏆";


            document
                .getElementById("popupTitle")
                .innerText = "Congratulations!";


            document
                .getElementById("popupSubtitle")
                .innerText =
                "Fantastic job! You solved all questions! 🎉";


            playAgainBtn.style.display =
                "inline-block";


            popup.classList.add("active");

        }


        /* =====================================
           RESTART GAME
        ===================================== */

        function restartGame() {

            const confettiContainer = document.getElementById("confettiContainer");
            if (confettiContainer) confettiContainer.innerHTML = "";

            document
                .getElementById("popup")
                .classList
                .remove("active");


            selectedCard = null;

            completedMatches = 0;


            svg.innerHTML = "";


            mathCards.forEach(card => {

                card.classList.remove(
                    "active",
                    "matched",
                    "shake"
                );

            });


            answerCards.forEach(card => {

                card.classList.remove(
                    "target",
                    "matched",
                    "shake"
                );

            });

        }


        /* =====================================
           REDRAW CONNECTIONS
        ===================================== */

        window.addEventListener(
            "resize",
            () => {

                svg.innerHTML = "";


                if (
                    window.innerWidth <= 1050
                ) {
                    return;
                }


                mathCards.forEach(card => {

                    if (
                        card.classList.contains("matched")
                    ) {

                        const answerValue =
                            card.dataset.answer;


                        const answer =
                            document.querySelector(
                                `.answer-card.matched[data-answer="${answerValue}"]`
                            );


                        if (answer) {

                            drawConnection(
                                card,
                                answer
                            );

                        }

                    }

                });

            }
        );


        /* CONFETTI - added only, no existing functionality changed */
        function showSmallConfetti(isFinal = false) {
            const confettiContainer = document.getElementById('confettiContainer');
            if (!confettiContainer) return;

            confettiContainer.innerHTML = '';

            const count = isFinal ? 95 : 42;

            const colors = [
                '#00b894',
                '#e67e22',
                '#6c5ce7',
                '#0984e3',
                '#fdcb6e',
                '#ff6b7a',
                '#00cec9',
                '#a29bfe'
            ];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('span');

                piece.className =
                    isFinal
                        ? 'confetti-piece final-confetti-piece'
                        : 'confetti-piece';

                const startX = Math.random() * 100;
                const startY = -8 + Math.random() * 10;

                const drift =
                    (Math.random() * 520 - 260) *
                    (isFinal ? 1.15 : 0.9);

                const fall =
                    window.innerHeight *
                    (0.82 + Math.random() * 0.48);

                const rotation =
                    Math.random() * 1400 - 700;

                piece.style.left = startX + '%';
                piece.style.top = startY + '%';

                piece.style.setProperty('--x', drift + 'px');
                piece.style.setProperty('--y', fall + 'px');
                piece.style.setProperty('--r', rotation + 'deg');

                piece.style.background =
                    colors[Math.floor(Math.random() * colors.length)];

                piece.style.animationDelay =
                    (Math.random() * (isFinal ? 500 : 220)) + 'ms';

                confettiContainer.appendChild(piece);

                setTimeout(
                    () => piece.remove(),
                    isFinal ? 2900 : 2050
                );
            }
        }

    </script>


    <div id="confettiContainer"></div>

</body>

</html>
