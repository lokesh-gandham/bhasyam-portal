<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Dart Pop Arcade</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Livvic', sans-serif;
}

body {
    /* Soft Pastel Background */
   
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 2vh 2vw;
    overflow: hidden; /* STRICTLY Prevents Scrolling */
    color: #1e293b;
}

header {
    text-align: center;
    z-index: 10;
    flex-shrink: 0;
    margin-bottom: 1vh;
}

/* Question Header with strict font-weight: 600 requirement */
h1 {
    color: #0f172a;
    font-weight: 400;
    text-shadow: 0 2px 0 #ffffff;
    margin-bottom: 6px;
    font-size: 22px;
}

@media screen and (max-width: 1599px) { h1 { font-size: 22px; } }
@media screen and (min-width: 1600px) { h1 { font-size: 30px; } }

.instruction-badge {
    
    color: #2f4f4f;
    font-weight: 500;
   
    display: inline-block;
    font-size: 20px;
}

/* =========================
   GAME PLAYGROUND
========================= */
.game-stage {
    width: 100%;
    max-width: 1100px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 5;
    min-height: 0;
    position: relative;
    gap: 15px;
}

/* Glass Dart Chamber */
.dart-chamber-board {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vw, 50px);
    width: 100%;
    max-width: 950px;
}

/* Big Image Display Box */
.big-image-card {
    width: clamp(120px, 15vw, 170px);
    height: clamp(140px, 18vh, 190px);
    background: rgba(255, 255, 255, 0.85);
    border: 5px solid #38bdf8;
    border-radius: 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 12px 25px rgba(56, 189, 248, 0.2);
    padding: 10px;
    position: relative;
}

.big-balloon-img {
    width: 85%;
    height: 85%;
    object-fit: contain;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15));
}

.badge-tag {
    position: absolute;
    bottom: -14px;
    background: #f97316;
    color: white;
    font-weight: 900;
    font-size: clamp(1rem, 1.4vw, 1.2rem);
    padding: 4px 16px;
    border-radius: 12px;
    box-shadow: 0 4px 0 #c2410c;
}
/* Interactive Balloon Vault Chute - Static Responsive Box */
.vault-chute {
    width: clamp(420px, 52vw, 720px);
    height: clamp(240px, 38vh, 360px);

    background: rgba(255, 255, 255, 0.6);
    border: 4px solid #ffffff;
    border-radius: 28px;
    padding: 18px;

    overflow-y: auto;
    overflow-x: hidden;

    box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
}

/* Inner balloon area */
.balloon-grid {
    width: 100%;
    min-height: 100%;

    display: flex;
    flex-wrap: wrap;

    justify-content: center;
    align-content: center;

    gap: 10px;
}
.mini-balloon-wrapper {
    width: clamp(38px, 4.2vw, 50px);
    height: clamp(46px, 5vw, 62px);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.mini-balloon-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.mini-balloon-wrapper.popped {
    transform: scale(0.2);
    opacity: 0.15;
    filter: grayscale(100%);
}

.mini-balloon-wrapper.popped::after {
    content: '💥';
    position: absolute;
    font-size: 24px;
    animation: popEffect 0.3s forwards;
}

@keyframes popEffect {
    0% { transform: scale(0); }
    50% { transform: scale(1.4); }
    100% { transform: scale(1); opacity: 0.8; }
}

/* =========================
   EQUATION INPUTS & OPERATORS
========================= */
.equation-inputs {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 2vw, 25px);
    margin-top: 10px;
}

.eq-num {
    font-size: clamp(2.5rem, 4vw, 3.8rem);
    font-weight: 500;
    color: #0f172a;
    text-shadow: 0 3px 0 #ffffff;
}

/* Dart Launcher Trigger */
.dart-launch-btn {
    padding: 10px 24px;
    font-size: clamp(1.2rem, 2vw, 1.8rem);
    font-weight: 500;
    color: #ffffff;
    background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
    border: none;
    border-radius: 20px;
    box-shadow: 0 6px 0 #991b1b, 0 8px 15px rgba(239, 68, 68, 0.3);
    cursor: pointer;
    user-select: none;
    transition: all 0.1s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.dart-launch-btn:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #991b1b;
}

.dart-launch-btn:disabled {
    background: #cbd5e1;
    box-shadow: 0 6px 0 #94a3b8;
    color: #94a3b8;
    cursor: not-allowed;
    transform: none;
}

input[type="text"] {
    width: clamp(75px, 9vw, 100px);
    height: clamp(55px, 6.5vw, 70px);
    font-size: clamp(2rem, 3vw, 2.8rem);
    font-weight: 500;
    text-align: center;
    border: 4px solid #f59e0b;
    border-radius: 18px;
    background: #ffffff;
    color: #0f172a;
    outline: none;
    box-shadow: 0 6px 0 #d97706, 0 10px 15px rgba(0,0,0,0.05);
    transition: all 0.2s;
    flex-shrink: 0;
}

input[type="text"]:focus {
    transform: translateY(-4px);
    border-color: #fbbf24;
    box-shadow: 0 10px 0 #d97706, 0 0 20px rgba(245, 158, 11, 0.4);
}

input[type="text"]:disabled {
    background-color: #f1f2f6;
    border-color: #10b981;
    color: #059669;
    box-shadow: 0 6px 0 #059669;
    cursor: not-allowed;
    transform: none;
}

/* =========================
   CORNER NAVIGATION CONTROLS
========================= */
.bottom-controls {
    width: 100%;
    max-width: 1400px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 1vh 2vw 2vh 2vw;
    z-index: 20;
    flex-shrink: 0;
}

.left-control { justify-self: start; }
.center-control { justify-self: center; }
.right-control { justify-self: end; }

/* Strict Button Sizing Rules (Laptop: 20px, Monitor: 30px) */
.nav-btn, .submit-btn, .replay-btn {
    font-weight: 600; border: none; cursor: pointer; transition: all 0.1s ease;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 20px;min-width:178px;height:45px; border-radius: 40px;
}

@media screen and (min-width: 1600px) {
    h1 {
        font-size: 30px;
    }
    .nav-btn, .submit-btn, .replay-btn {
        width: 200px;
        min-width: 200px;
        height: 60px;
        font-size: 30px;
        padding: 0;
        border-radius: 50px;
    }
}

.nav-btn.prev { background: #64748b; color: #ffffff; box-shadow: 0 8px 0 #475569; }
.nav-btn.prev:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #475569; }

.nav-btn.next { background: #f97316; color: #ffffff; box-shadow: 0 8px 0 #c2410c; }
.nav-btn.next:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #c2410c; }

.submit-btn { background: #10b981; color: #ffffff; box-shadow: 0 8px 0 #059669; }
.submit-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 #059669; }

.replay-btn { background: #0ea5e9; color: white; box-shadow: 0 8px 0 #0284c7; margin-top: 20px; }
.replay-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #0284c7; }

.nav-btn:disabled, .submit-btn:disabled {
    background: #cbd5e1; box-shadow: 0 8px 0 #94a3b8; color: #f8fafc; cursor: not-allowed; opacity: 0.8;
}

/* =========================
   REFERENCE POPUP DESIGN
========================= */
.popup-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    
    display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100;
}
.popup-overlay.active { opacity: 1; pointer-events: auto; }

.popup-card {
    position: relative; width: 90%; max-width: 520px; padding: 40px 30px;
    border-radius: 36px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    transform: scale(0.8); transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #ffffff;
}

.popup-card::before, .popup-card::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
.popup-card::before { width: 220px; height: 220px; top: -60px; right: -50px; }
.popup-card::after { width: 180px; height: 180px; bottom: -70px; left: -40px; }

.popup-card.correct { background: #edfbf4; border: 6px solid #00c885; }
.popup-card.correct::before, .popup-card.correct::after { background: rgba(162, 245, 209, 0.45); }
.popup-card.correct .popup-title { color: #00a86b; }
.popup-card.correct .popup-subtitle { color: #2e7d5b; }

.popup-card.wrong { background: #fff0f2; border: 6px solid #ff6b7a; }
.popup-card.wrong::before, .popup-card.wrong::after { background: rgba(255, 196, 203, 0.45); }
.popup-card.wrong .popup-title { color: #d33847; }
.popup-card.wrong .popup-subtitle { color: #a33b45; }

.popup-card.complete { background: #f0f3ff; border: 6px solid #6c5ce7; }
.popup-card.complete::before, .popup-card.complete::after { background: rgba(162, 155, 254, 0.35); }
.popup-card.complete .popup-title { color: #6c5ce7; }
.popup-card.complete .popup-subtitle { color: #4834d4; }

.popup-overlay.active .popup-card { transform: scale(1); }
.popup-icon { font-size: 4.8rem; margin-bottom: 12px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.1)); }
.popup-title { font-size: 3rem; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.5px; }
.popup-subtitle { font-size: 1.4rem; font-weight: 500; display: flex; align-items: center; gap: 8px; color: #333; }

@media screen and (max-width: 768px) {
    .dart-chamber-board { flex-direction: column; gap: 10px; }
    input[type="text"] { width: 60px; height: 50px; font-size: 1.8rem; }
}

/* =========================
   EXACT SAME CONFETTI EFFECT
========================= */
#confettiContainer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 200;
}

.confetti-piece {
    position: absolute;
    width: 9px;
    height: 14px;
    border-radius: 2px;
    opacity: 0;
    animation: pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
    will-change: transform, opacity;
}

.final-confetti-piece {
    width: 10px;
    height: 16px;
    animation-duration: 2300ms;
}

.final-confetti-piece:nth-child(3n) {
    border-radius: 50%;
}

.final-confetti-piece:nth-child(4n) {
    width: 7px;
    height: 19px;
    border-radius: 1px;
}

.final-confetti-piece:nth-child(5n) {
    width: 13px;
    height: 8px;
    border-radius: 2px;
}

@keyframes pageConfetti {
    0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
    }
    55% {
        opacity: 1;
    }
    100% {
        opacity: 0;
        transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(0.72);
    }
}

.popup-card.complete {
    box-shadow:
        0 20px 45px rgba(108, 92, 231, 0.18),
        0 0 0 8px rgba(162, 155, 254, 0.12);
}

.popup-card.complete .replay-btn {
    margin-top: 12px;
}

.popup-card.complete .popup-icon {
    animation: finalTrophyBounce 1.2s ease-in-out infinite;
}

@keyframes finalTrophyBounce {
    0%, 100% {
        transform: translateY(0) rotate(0deg) scale(1);
    }
    50% {
        transform: translateY(-5px) rotate(-4deg) scale(1.06);
    }
}


/* Exact question sizing: laptop 30px, monitor 40px.
   Applies to 4, -, = and the answer input. No bold. */
.eq-num,
input[type="text"] {
    font-size: 30px !important;
    font-weight: 400 !important;
    color: #2f4f4f !important;
}

@media screen and (min-width: 1500px) {
    .eq-num,
    input[type="text"] {
        font-size: 40px !important;
        font-weight: 400 !important;
        color: #2f4f4f !important;
    }

    /* Larger monitor presentation */
    .game-stage {
        max-width: 1500px;
    }

    .dart-chamber-board {
        max-width: 1350px;
        gap: 70px;
    }

    .big-image-card {
        width: 240px;
        height: 270px;
    }

    .big-balloon-img {
        width: 92%;
        height: 92%;
    }

    .vault-chute {
        width: min(800px, 58vw);
        height: 400px;
    }

    .mini-balloon-wrapper {
        width: 62px;
        height: 74px;
    }

    .balloon-grid {
        gap: 14px;
    }
}

</style>
</head>

<body>

<div id="confettiContainer"></div>

<header>
    <h1>Complete the boxes</h1>
    <div class="instruction-badge">Tap SUBTRACT 1 to pop a ball, then enter the answer!</div>
</header>

<main class="game-stage" id="stage">
    </main>

<div class="bottom-controls">
    <div class="left-control">
        <button class="nav-btn prev" id="prevBtn" onclick="navigate(-1)" disabled>PREV</button>
    </div>
    <div class="center-control">
        <button class="submit-btn" id="submitBtn" onclick="checkAnswers()" disabled>SUBMIT</button>
    </div>
    <div class="right-control">
        <button class="nav-btn next" id="nextBtn" onclick="navigate(1)" disabled>NEXT</button>
    </div>
</div>

<div class="popup-overlay" id="popup">
    <div class="popup-card" id="popupCard">
        <div class="popup-icon" id="popupIcon">⭐</div>
        <h2 class="popup-title" id="popupTitle">Amazing!</h2>
        <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
        <button class="replay-btn" id="playAgainBtn" style="display: none;" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
/* ==========================================
   QUIZ DATA (Strict Match to Worksheet)
========================================== */
const quizData = [
    { label: "a)", num: 4, targetAns: 3, image: "../images/beach-ball.png" },
    { label: "b)", num: 9, targetAns: 8, image: "../images/beach-ball.png" },
    { label: "c)", num: 10, targetAns: 9, image: "../images/beach-ball.png" },
    { label: "d)", num: 15, targetAns: 14, image: "../images/beach-ball.png" },
    { label: "e)", num: 13, targetAns: 12, image: "../images/beach-ball.png" }
];

let quizState = Array.from({ length: quizData.length }, () => ({
    isSolved: false,
    userAns: "",
    isPopped: false
}));

let currentIndex = 0;
let popupTimer = null;
let finalTimer = null;
let audioCtx = null;

const stageEl = document.getElementById("stage");
const submitBtn = document.getElementById("submitBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const playAgainBtn = document.getElementById("playAgainBtn");

/* ==========================================
   AUDIO SYNTHESIZER
========================================== */
function playTone(type) {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "correct") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === "wrong") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === "pop") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(850, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
    } catch (error) {
        console.log("Audio error:", error);
    }
}

function speak(text) {
    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = "en-US";
        msg.volume = 0.8;
        msg.rate = 1;
        msg.pitch = 1.2;
        speechSynthesis.speak(msg);
    }
}


function showSmallConfetti(isFinal = false) {
    const confettiContainer = document.getElementById('confettiContainer');
    if (!confettiContainer) return;

    confettiContainer.innerHTML = '';

    const count = isFinal ? 95 : 42;

    const colors = [
        '#00b894',
        '#e67e22',
        '#6c5ce7',
        '#0984e3',
        '#fdcb6e',
        '#ff6b7a',
        '#00cec9',
        '#a29bfe'
    ];

    for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');

        piece.className =
            isFinal
                ? 'confetti-piece final-confetti-piece'
                : 'confetti-piece';

        const startX = Math.random() * 100;
        const startY = -8 + Math.random() * 10;

        const drift =
            (Math.random() * 520 - 260) *
            (isFinal ? 1.15 : 0.9);

        const fall =
            window.innerHeight *
            (0.82 + Math.random() * 0.48);

        const rotation =
            Math.random() * 1400 - 700;

        piece.style.left = startX + '%';
        piece.style.top = startY + '%';

        piece.style.setProperty('--x', drift + 'px');
        piece.style.setProperty('--y', fall + 'px');
        piece.style.setProperty('--r', rotation + 'deg');

        piece.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        piece.style.animationDelay =
            (Math.random() * (isFinal ? 500 : 220)) + 'ms';

        confettiContainer.appendChild(piece);

        setTimeout(
            () => piece.remove(),
            isFinal ? 2900 : 2050
        );
    }
}

/* ==========================================
   LOAD QUESTION
========================================== */
function loadQuestion() {
    const q = quizData[currentIndex];
    const state = quizState[currentIndex];

    // Build Vault Balloons
    let miniBalloonsHTML = '';
    for (let i = 0; i < q.num; i++) {
        const isPoppedItem = state.isPopped && (i === q.num - 1);
        miniBalloonsHTML += `
            <div class="mini-balloon-wrapper ${isPoppedItem ? 'popped' : ''}">
                <img src="${q.image}" class="mini-balloon-img" alt="Balloon">
            </div>
        `;
    }

    stageEl.innerHTML = `
        <div class="dart-chamber-board">
            <div class="big-image-card">
                <img src="${q.image}" class="big-balloon-img" alt="Balloon Target">
                <div class="badge-tag">${q.label}</div>
            </div>

         <div class="vault-chute">
    <div class="balloon-grid">
        ${miniBalloonsHTML}
    </div>
</div>
        </div>

        <div class="equation-inputs">
            <span class="eq-num">${q.num}</span>
            <span class="eq-num">−</span>
            <button class="dart-launch-btn" id="dartBtn" ${state.isPopped || state.isSolved ? 'disabled' : ''}>
                🎯 SUBTRACT 1
            </button>
            <span class="eq-num">=</span>
            <input type="text" id="finalInput" inputmode="numeric" maxlength="2" value="${state.userAns}">
        </div>
    `;

    const inputEl = document.getElementById("finalInput");
    const dartBtn = document.getElementById("dartBtn");

    // Dart Launch Interaction - Single-Use Disable
    dartBtn.addEventListener('click', function() {
        if (state.isPopped || state.isSolved) return;
        state.isPopped = true;
        playTone("pop");
        loadQuestion();
    });

    // Answer Input Listener
    inputEl.addEventListener("input", function(e) {
        e.target.value = e.target.value.replace(/[^0-9]/g, "");
        state.userAns = e.target.value;
        checkSubmitState();
    });

    if (state.isSolved) {
        inputEl.disabled = true;
    }

    checkSubmitState();

    prevBtn.disabled = (currentIndex === 0);
    nextBtn.disabled = (!state.isSolved || currentIndex === quizData.length - 1);
}

function checkSubmitState() {
    const state = quizState[currentIndex];
    // The answer can be submitted only after SUBTRACT 1 has been clicked.
    submitBtn.disabled =
        state.isSolved ||
        !state.isPopped ||
        state.userAns.trim() === "";
}

function navigate(direction) {
    const state = quizState[currentIndex];

    if (direction === 1 && !state.isSolved) {
        return;
    }

    currentIndex += direction;

    if (currentIndex < 0) currentIndex = 0;
    if (currentIndex > quizData.length - 1) currentIndex = quizData.length - 1;

    loadQuestion();
}

function checkAnswers() {
    const q = quizData[currentIndex];
    const state = quizState[currentIndex];
    const userAnsVal = parseInt(state.userAns);

    /* WRONG ANSWER CHECK */
    if (userAnsVal !== q.targetAns) {
        showPopup("wrong", "😟", "Keep Going!", "Subtracting 1 gives the number just before! 🌈", false);
        playTone("wrong");
        speak("Wrong");

        // Clear answer and restore popped balloon + re-enable button
        state.userAns = "";
        state.isPopped = false;

        loadQuestion();
        return;
    }

    /* CORRECT ANSWER */
    state.isSolved = true;
    state.isPopped = true;

    loadQuestion();

    const inputEl = document.getElementById("finalInput");
    if (inputEl) inputEl.disabled = true;
    submitBtn.disabled = true;

    playTone("correct");

    if (currentIndex === quizData.length - 1) {
        nextBtn.disabled = true;

        // Last question: show the normal Correct popup first.
        showSmallConfetti(false);
        showPopup("correct", "🌟", "Amazing!", "You got it right! ✨", false);
        speak("Correct");

        clearTimeout(finalTimer);
        clearTimeout(popupTimer);

        // Then show the Final popup with the larger confetti.
        finalTimer = setTimeout(() => {
            closePopup();
            showSmallConfetti(true);
            showPopup(
                "complete",
                "🏆",
                "Congratulations!",
                "Fantastic job! You solved all questions! 🎉",
                true
            );
            
        }, 1800);
    } else {
        nextBtn.disabled = false;
        showSmallConfetti(false);
        showPopup("correct", "🌟", "Amazing!", "You got it right! ✨", false);
        speak("Correct");
    }
}

function showPopup(status, icon, title, subtitle, isFinal = false) {
    const popup = document.getElementById("popup");
    const card = document.getElementById("popupCard");

    card.className = `popup-card ${status}${isFinal ? " complete" : ""}`;
    document.getElementById("popupIcon").innerText = icon;
    document.getElementById("popupTitle").innerText = title;
    document.getElementById("popupSubtitle").innerText = subtitle;

    playAgainBtn.style.display = isFinal ? "inline-block" : "none";
    popup.classList.add("active");

    if (!isFinal) {
        clearTimeout(popupTimer);
        popupTimer = setTimeout(closePopup, 1800);
    }
}

function closePopup() {
    document.getElementById("popup").classList.remove("active");
}

function restartGame() {
    clearTimeout(popupTimer);
    clearTimeout(finalTimer);

    const confettiContainer = document.getElementById("confettiContainer");
    if (confettiContainer) confettiContainer.innerHTML = "";

    closePopup();

    quizState = Array.from({ length: quizData.length }, () => ({
        isSolved: false,
        userAns: "",
        isPopped: false
    }));

    currentIndex = 0;
    loadQuestion();
}

window.onload = function() {
    loadQuestion();
};
</script>
