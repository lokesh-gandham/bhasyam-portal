<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Pop Subtraction</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
        }

        /* Vibrant Gaming Background */
        body {
            /* background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); */
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            text-align: center;
            margin-top: 10px;
        }

        /* 🎮 PLAYFUL GAMING HEADING STYLES 🎮 */
        h1 {
            font-weight: 400;
            text-transform: none;
            color: #2f4f4f;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: none;
            transform: none;
            animation: none;
            font-size: 22px;
        }

        @keyframes pulseText {
            0% { transform: skew(-2deg) scale(1); }
            100% { transform: skew(-2deg) scale(1.05); }
        }

        /* Default / Tablet size */
        h1 { font-size: 20px; }

        /* Laptop Size (1024px to 1599px) */
        @media screen and (min-width: 1024px) {
            h1 { font-size: 22px; }
        }

        /* Monitor Size (1600px and up) */
        @media screen and (min-width: 1600px) {
            h1 { font-size: 30px; }
        }

        .instruction {
            font-size: 20px;
            color: #2d3436;
            font-weight: 500;
        
        }

        /* Game Board (Glassmorphism) */
        .game-stage {
            width: 100%;
            max-width: 1300px;
            height: 65vh;
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        .slide-item {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .slide-item.active {
            display: flex;
        }

        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Visual Items Container */
        .visual-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            height: 70%;
            padding: 10px;
        }

        /* Clear instruction so children know exactly how many items to cross out */
        .cross-hint {
            flex-basis: 100%;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 500;
            color: #2f4f4f;
            margin-bottom: 8px;
            animation: hintPulse 1.8s ease-in-out infinite;
        }

        .cross-hint strong {
            color: #e84393;
            font-size: 1.3rem;
        }

        .cross-hint.done {
            color: #168f7a;
            animation: none;
        }

        @keyframes hintPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* Interactive "Click to pop" items */
        .item-bubble {
            width: 98px;
            height: 98px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1), inset 0 -4px 10px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            animation: floatItem 3s ease-in-out infinite;
        }

        .item-bubble:nth-child(even) { animation-delay: 0.5s; }
        .item-bubble:nth-child(3n) { animation-delay: 1s; }

        @keyframes floatItem {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .item-bubble img {
            max-width: 78%;
            max-height: 78%;
            object-fit: contain;
            transition: all 0.3s ease;
        }

        .item-bubble:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 20px rgba(0,0,0,0.15);
            animation-play-state: paused;
        }

        /* Popped/Subtracted State */
        .item-bubble.popped {
            background: #e0e0e0;
            box-shadow: none;
            transform: scale(0.9);
            animation: none;
        }

        .item-bubble.popped img {
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .item-bubble.popped::after {
            content: '\f00d'; /* FontAwesome X mark */
            font-family: 'Font Awesome 6 Free';
            font-weight: 600;
            position: absolute;
            font-size: 3rem;
            color: #ff7675;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            animation: stamp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes stamp {
            0% { transform: scale(3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Equation Area */
        .equation-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: transparent;
            padding: 15px 20px;
            border: none;
            border-radius: 0;
            box-shadow: none;
            height: 25%;
           
        }

        .eq-text {
            font-size: 3.5rem;
            font-weight: 500;
            color: #2f4f4f;
            line-height: 1;
            text-shadow: none;
             margin-top: 40px;
        }

        .eq-operator {
            color: #e84393;
            font-weight: 500;
        }

        /* Input Control */
        input[type="text"] {
            width: 60px;
            height: 60px;
            font-size: 3rem;
            font-weight: 500;
            text-align: center;
            border: 4px dashed #0984e3;
            border-radius: 20px;
            background: #f1f2f6;
            color: #0984e3;
            outline: none;
            transition: all 0.2s ease;
            margin-top: 40px;
        }

        input[type="text"]:focus {
            border-style: solid;
            background: #ffffff;
            box-shadow: 0 10px 20px rgba(9, 132, 227, 0.2);
            transform: scale(1.05);
        }

        input[type="text"]:disabled {
            background-color: #e8f8f5;
            border-color: #00b894;
            border-style: solid;
            color: #00b894;
            cursor: not-allowed;
            transform: none;
        }

        /* Exact Match Navigation & Buttons */
        footer {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .nav-btn {
            background: #e67e22;
            color: #ffffff;
            border: none;
           min-width:178px;height:45px;
            font-size: 20px;
            font-weight: 500;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #d35400;
            transition: all 0.1s ease;
        }

        .nav-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d35400;
        }

        .nav-btn:disabled {
            background: #b2bec3;
            box-shadow: 0 6px 0 #636e72;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .check-btn {
            background: #00b894;
            box-shadow: 0 6px 0 #008f72;
        }

        .check-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 #008f72;
        }

        .replay-btn {
            background: #0984e3;
            box-shadow: 0 6px 0 #0975c7;
            margin-top: 20px;
            z-index: 5;
        }

        .replay-btn:active {
            box-shadow: 0 2px 0 #0975c7;
        }

        @media screen and (min-width: 1600px) {
            h1 { font-size: 30px; }
            .nav-btn {
                width: 200px;
                min-width: 200px;
                height: 60px;
                font-size: 30px;
                padding: 0;
                border-radius: 50px;
            }
            footer {
                width: min(1100px, 94vw);
                margin-left: auto;
                margin-right: auto;
            }
        }

        /* Exact Match Popup Design */
        .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
           
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100;
        }
        .popup-overlay.active { opacity: 1; pointer-events: auto; }
        
        .popup-card {
            position: relative; width: 90%; max-width: 520px; padding: 40px 30px;
            border-radius: 36px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transform: scale(0.8); transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .popup-card::before, .popup-card::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
        .popup-card::before { width: 220px; height: 220px; top: -60px; right: -50px; }
        .popup-card::after { width: 180px; height: 180px; bottom: -70px; left: -40px; }
        
        .popup-card.correct { background: #edfbf4; border: 6px solid #00c885; }
        .popup-card.correct::before, .popup-card.correct::after { background: rgba(162, 245, 209, 0.45); }
        .popup-card.correct .popup-title { color: #00a86b; }
        .popup-card.correct .popup-subtitle { color: #2e7d5b; }
        
        .popup-card.wrong { background: #fff0f2; border: 6px solid #ff6b7a; }
        .popup-card.wrong::before, .popup-card.wrong::after { background: rgba(255, 196, 203, 0.45); }
        .popup-card.wrong .popup-title { color: #d33847; }
        .popup-card.wrong .popup-subtitle { color: #a33b45; }
        
        .popup-card.complete { background: #f0f3ff; border: 6px solid #6c5ce7; }
        .popup-card.complete::before, .popup-card.complete::after { background: rgba(162, 155, 254, 0.35); }
        .popup-card.complete .popup-title { color: #6c5ce7; }
        .popup-card.complete .popup-subtitle { color: #4834d4; }
        
        .popup-overlay.active .popup-card { transform: scale(1); }
        .popup-icon { font-size: 4.8rem; margin-bottom: 12px; z-index: 2; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.1)); }
        .popup-title { font-size: 3rem; font-weight: 600; margin-bottom: 8px; z-index: 2; letter-spacing: -0.5px; }
        .popup-subtitle { font-size: 1.4rem; font-weight: 500; z-index: 2; display: flex; align-items: center; gap: 8px; }

    
/* ===== Exact requested responsive sizing ===== */
/* Laptop: question + answer = 30px, normal weight */
.eq-text,
.ans-input {
    font-size: 30px !important;
    font-weight: 400 !important;
    color: #2f4f4f !important;
}

/* Laptop instruction = 20px */
.instruction {
    font-size: 20px !important;
    font-weight: 400 !important;
}

/* ===== Monitor: 40px question/input, 25px instruction ===== */
@media screen and (min-width: 1500px) {
    .eq-text,
    .ans-input {
        font-size: 40px !important;
        font-weight: 400 !important;
        color: #2f4f4f !important;
    }

    .instruction {
        font-size: 25px !important;
        font-weight: 400 !important;
    }

    /* Better monitor composition: enlarge the visual area and bubbles
       without letting the equation/footer get pushed off-screen. */
    .game-stage {
        width: min(1400px, 94vw);
        max-width: 1400px;
        height: 68vh;
        padding: 10px 30px;
    }

    .visual-area {
        height: 74%;
        gap: 24px;
        padding: 12px 20px;
    }

    .item-bubble {
        width: 125px;
        height: 125px;
    }

    .item-bubble img {
        max-width: 80%;
        max-height: 80%;
    }

    .cross-hint {
        font-size: 22px;
        margin-bottom: 10px;
    }

    .cross-hint strong {
        font-size: 25px;
    }

    .equation-area {
        height: 24%;
        gap: 26px;
        padding: 10px 20px;
    }

    .ans-input {
        width: 82px;
        height: 72px;
        border-radius: 18px;
    }

    footer {
        width: min(1200px, 94vw);
    }

    .nav-btn {
        min-width: 200px;
        height: 60px;
        font-size: 30px;
    }
}

/* Extra-wide monitors: scale visuals a little more */
@media screen and (min-width: 1800px) {
    .game-stage {
        width: min(1550px, 94vw);
        max-width: 1550px;
    }

    .visual-area {
        gap: 30px;
    }

    .item-bubble {
        width: 140px;
        height: 140px;
    }
}


        /* ===== EXACT SAME CONFETTI EFFECT ===== */
        #confettiContainer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 200; }
        .confetti-piece { position: absolute; width: 9px; height: 14px; border-radius: 2px; opacity: 0; animation: pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards; will-change: transform, opacity; }
        .final-confetti-piece { width: 10px; height: 16px; animation-duration: 2300ms; }
        .final-confetti-piece:nth-child(3n) { border-radius: 50%; }
        .final-confetti-piece:nth-child(4n) { width: 7px; height: 19px; border-radius: 1px; }
        .final-confetti-piece:nth-child(5n) { width: 13px; height: 8px; border-radius: 2px; }
        @keyframes pageConfetti {
            0% { opacity: 1; transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
            55% { opacity: 1; }
            100% { opacity: 0; transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(0.72); }
        }

    </style>
</head>
<body>
    <div id="confettiContainer"></div>

    <header>
        <h1>👾 Subtract the following! 🚀</h1>
        <p class="instruction">💡 Tip: Tap the items to cross them out!</p>
    </header>

    <main class="game-stage">
        <div class="slide-item active" data-q="0">
            <div class="visual-area" id="area-0"></div>
            <div class="equation-area">
                <span class="eq-text">6</span>
                <span class="eq-text eq-operator">-</span>
                <span class="eq-text">1</span>
                <span class="eq-text eq-operator">=</span>
                <input type="text" class="ans-input" maxlength="2" data-idx="0">
            </div>
        </div>

        <div class="slide-item" data-q="1">
            <div class="visual-area" id="area-1"></div>
            <div class="equation-area">
                <span class="eq-text">8</span>
                <span class="eq-text eq-operator">-</span>
                <span class="eq-text">4</span>
                <span class="eq-text eq-operator">=</span>
                <input type="text" class="ans-input" maxlength="2" data-idx="1">
            </div>
        </div>

        <div class="slide-item" data-q="2">
            <div class="visual-area" id="area-2"></div>
            <div class="equation-area">
                <span class="eq-text">9</span>
                <span class="eq-text eq-operator">-</span>
                <span class="eq-text">2</span>
                <span class="eq-text eq-operator">=</span>
                <input type="text" class="ans-input" maxlength="2" data-idx="2">
            </div>
        </div>

        <div class="slide-item" data-q="3">
            <div class="visual-area" id="area-3"></div>
            <div class="equation-area">
                <span class="eq-text">10</span>
                <span class="eq-text eq-operator">-</span>
                <span class="eq-text">8</span>
                <span class="eq-text eq-operator">=</span>
                <input type="text" class="ans-input" maxlength="2" data-idx="3">
            </div>
        </div>

        <div class="slide-item" data-q="4">
            <div class="visual-area" id="area-4"></div>
            <div class="equation-area">
                <span class="eq-text">12</span>
                <span class="eq-text eq-operator">-</span>
                <span class="eq-text">6</span>
                <span class="eq-text eq-operator">=</span>
                <input type="text" class="ans-input" maxlength="2" data-idx="4">
            </div>
        </div>
    </main>

    <footer>
        <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>PREV</button>
        <button class="nav-btn check-btn" id="submitBtn" onclick="checkAnswers()" disabled>SUBMIT</button>
        <button class="nav-btn" id="nextBtn" onclick="navigate(1)" disabled>NEXT</button>
    </footer>

    <div class="popup-overlay" id="popup">
        <div class="popup-card" id="popupCard">
            <div class="popup-icon" id="popupIcon">⭐</div>
            <h2 class="popup-title" id="popupTitle">Amazing!</h2>
            <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
            <button class="nav-btn replay-btn" id="playAgainBtn" style="display: none;" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const quizData = [
            { total: 6, subtract: 1, ans: "5", img: "../images/ladybug.png" },
            { total: 8, subtract: 4, ans: "4", img: "../images/blueberry.png" },
            { total: 9, subtract: 2, ans: "7", img: "../images/bell.png" },
            { total: 10, subtract: 8, ans: "2", img: "../images/fish.png" },
            { total: 12, subtract: 6, ans: "6", img: "../images/squirrel.png" }
        ];

        let quizState = Array.from({ length: 5 }, () => ({
            inputValue: '',
            isUnlocked: false
        }));

        let currentIndex = 0;
        let popupTimer = null;

        const slides = document.querySelectorAll('.slide-item');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');

        function initializeVisuals() {
            quizData.forEach((data, index) => {
                const area = document.getElementById(`area-${index}`);
                area.innerHTML = '';

                const hint = document.createElement('div');
                hint.className = 'cross-hint';
                hint.innerHTML = `👆 Cross out <strong>${data.subtract}</strong> item${data.subtract > 1 ? 's' : ''}!`;
                area.appendChild(hint);

                for (let i = 0; i < data.total; i++) {
                    const bubble = document.createElement('div');
                    bubble.className = 'item-bubble';
                    bubble.innerHTML = `<img src="${data.img}" alt="Item">`;

                    bubble.onclick = function() {
                        if (quizState[index].isUnlocked) return;

                        const poppedCount = area.querySelectorAll('.item-bubble.popped').length;

                        // Allow a crossed item to be restored
                        if (this.classList.contains('popped')) {
                            this.classList.remove('popped');
                            const newCount = poppedCount - 1;
                            hint.classList.remove('done');
                            hint.innerHTML = `👆 Cross out <strong>${data.subtract - newCount}</strong> more item${data.subtract - newCount > 1 ? 's' : ''}!`;
                            playPopSound();
                            return;
                        }

                        // Children can only cross out the exact subtraction number
                        if (poppedCount < data.subtract) {
                            this.classList.add('popped');
                            const newCount = poppedCount + 1;
                            playPopSound();

                            if (newCount === data.subtract) {
                                hint.classList.add('done');
                                hint.innerHTML = `✅ Great! You crossed out <strong>${data.subtract}</strong>. Now count what is left!`;
                            } else {
                                hint.innerHTML = `👆 Cross out <strong>${data.subtract - newCount}</strong> more item${data.subtract - newCount > 1 ? 's' : ''}!`;
                            }
                        }
                    };

                    area.appendChild(bubble);
                }
            });
        }
        initializeVisuals();

        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-US"; msg.volume = 0.8; msg.rate = 1; msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playPopSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playAudioTone(isCorrect) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (isCorrect) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2); 
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            }
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        document.querySelectorAll('.ans-input').forEach(input => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                quizState[currentIndex].inputValue = e.target.value;
                updateNavButtons();
            });
        });

        function navigate(dir) {
            slides[currentIndex].classList.remove('active');
            currentIndex += dir;
            slides[currentIndex].classList.add('active');
            
            const currentInput = slides[currentIndex].querySelector('.ans-input');
            currentInput.value = quizState[currentIndex].inputValue;
            currentInput.disabled = quizState[currentIndex].isUnlocked;
            if(!quizState[currentIndex].isUnlocked) currentInput.focus();
            
            updateNavButtons();
        }

        function updateNavButtons() {
            prevBtn.disabled = currentIndex === 0;
            const isLastQuestion = currentIndex === slides.length - 1;
            const isUnlocked = quizState[currentIndex].isUnlocked;

            nextBtn.disabled = isLastQuestion || !isUnlocked;
            
            const hasInput = quizState[currentIndex].inputValue.length > 0;
            submitBtn.disabled = isUnlocked || !hasInput;
        }

        // Manual crossing is optional. After a correct answer, this
        // automatically crosses any remaining items needed for the subtraction.
        function completeCrossOut(index) {
            const area = document.getElementById(`area-${index}`);
            const data = quizData[index];
            const bubbles = [...area.querySelectorAll('.item-bubble')];
            const poppedCount = bubbles.filter(b => b.classList.contains('popped')).length;
            const remaining = Math.max(0, data.subtract - poppedCount);

            if (remaining > 0) {
                bubbles.filter(b => !b.classList.contains('popped'))
                    .slice(0, remaining)
                    .forEach((bubble, i) => {
                        setTimeout(() => {
                            bubble.classList.add('popped');
                            playPopSound();
                        }, i * 180);
                    });
            }

            const hint = area.querySelector('.cross-hint');
            if (hint) {
                hint.classList.add('done');
                hint.innerHTML = `✅ ${data.subtract} item${data.subtract > 1 ? 's' : ''} crossed out! <strong>${data.total - data.subtract}</strong> left!`;
            }
        }

        function checkAnswers() {
            const userAns = quizState[currentIndex].inputValue.trim();
            const correctAns = quizData[currentIndex].ans;

            if (userAns === correctAns) {
                // Keep manual crossing, but automatically finish any missing
                // cross-outs after the child gives the correct answer.
                completeCrossOut(currentIndex);

                quizState[currentIndex].isUnlocked = true;

                const input = slides[currentIndex].querySelector('.ans-input');
                input.disabled = true;

                if (currentIndex === slides.length - 1) {
                    showPopup('correct', '🌟', 'Amazing!', 'You got it right! ✨', false);
                    playAudioTone(true); speak("Correct");
                    showSmallConfetti(false);

                    clearTimeout(popupTimer);
                    popupTimer = setTimeout(() => {
                        closePopup();
                        showSmallConfetti(true);
                        showPopup("complete", "🏆","Congratulations!", "Fantastic job! You solved all questions! 🎉", true);
                    }, 1800);

                } else {
                    showPopup('correct', '🌟', 'Amazing!', 'You got it right! ✨', false);
                    playAudioTone(true); speak("Correct");
                    showSmallConfetti(false);
                }
            } else {
                showPopup('wrong', '😟', 'Keep Going!', 'Count the items carefully and try again! 🌈', false);
                playAudioTone(false); speak("Wrong");

                const input = slides[currentIndex].querySelector('.ans-input');
                input.value = '';
                quizState[currentIndex].inputValue = '';
            }
            updateNavButtons();
        }


        /* ===== EXACT SAME CONFETTI EFFECT ===== */
        function showSmallConfetti(isFinal = false) {
            const confettiContainer = document.getElementById('confettiContainer');
            if (!confettiContainer) return;
            confettiContainer.innerHTML = '';
            const count = isFinal ? 95 : 42;
            const colors = ['#00b894','#e67e22','#6c5ce7','#0984e3','#fdcb6e','#ff6b7a','#00cec9','#a29bfe'];
            for (let i = 0; i < count; i++) {
                const piece = document.createElement('span');
                piece.className = isFinal ? 'confetti-piece final-confetti-piece' : 'confetti-piece';
                const startX = Math.random() * 100;
                const startY = -8 + Math.random() * 10;
                const drift = (Math.random() * 520 - 260) * (isFinal ? 1.15 : 0.9);
                const fall = window.innerHeight * (0.82 + Math.random() * 0.48);
                const rotation = Math.random() * 1400 - 700;
                piece.style.left = startX + '%';
                piece.style.top = startY + '%';
                piece.style.setProperty('--x', drift + 'px');
                piece.style.setProperty('--y', fall + 'px');
                piece.style.setProperty('--r', rotation + 'deg');
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = (Math.random() * (isFinal ? 500 : 220)) + 'ms';
                confettiContainer.appendChild(piece);
                setTimeout(() => piece.remove(), isFinal ? 2900 : 2050);
            }
        }

        function showPopup(status, icon, title, subtitle, isFinal = false) {
            const popup = document.getElementById('popup');
            const card = document.getElementById('popupCard');
            card.className = `popup-card ${status}`;
            document.getElementById('popupIcon').innerText = icon;
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupSubtitle').innerText = subtitle;
            playAgainBtn.style.display = isFinal ? 'inline-block' : 'none';
            popup.classList.add('active');
            if (!isFinal) {
                clearTimeout(popupTimer);
                const popupDuration = status === 'wrong' ? 1200 : 1800;
                popupTimer = setTimeout(closePopup, popupDuration);
            }
        }

        function closePopup() {
            document.getElementById('popup').classList.remove('active');
        }

        function resetCrossHints() {
            quizData.forEach((data, index) => {
                const area = document.getElementById(`area-${index}`);
                const hint = area?.querySelector('.cross-hint');
                if (!hint) return;

                hint.classList.remove('done');
                hint.innerHTML = `👆 Cross out <strong>${data.subtract}</strong> item${data.subtract > 1 ? 's' : ''}!`;
            });
        }

        function restartGame() {
            closePopup();
            clearTimeout(popupTimer);

            const confettiContainer = document.getElementById('confettiContainer');
            if (confettiContainer) confettiContainer.innerHTML = '';
            quizState = Array.from({ length: slides.length }, () => ({ inputValue: '', isUnlocked: false }));
            
            slides[currentIndex].classList.remove('active');
            currentIndex = 0;
            slides[currentIndex].classList.add('active');
            
            document.querySelectorAll('.ans-input').forEach(inp => {
                inp.value = '';
                inp.disabled = false;
            });
            document.querySelectorAll('.item-bubble').forEach(b => {
                b.classList.remove('popped');
            });
            resetCrossHints();
            
            updateNavButtons();
        }

        window.onload = () => {
            updateNavButtons();
            setTimeout(() => {
                slides[0].querySelector('.ans-input').focus();
            }, 500);
        };
    </script>
</body>
</html>
