<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Vertical Subtraction</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
        }

        /* 🌸 Beautiful Soft Pastel Background */
        body {

            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-top: 10px;
        }

        /* 🎮 PLAYFUL GAMING HEADING STYLES */
        h1 {
            font-size: 22px;
            font-weight: 400;
            color: #2f4f4f;
            margin-bottom: 8px;


        }

        @keyframes gentleBounce {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-5px);
            }
        }


        @media screen and (min-width: 1024px) {
            h1 {
                font-size: 22px;
            }
        }

        @media screen and (min-width: 1600px) {
            h1 {
                font-size: 30px;
            }
        }

        .instruction {
            font-size: 20px;
            color: #666;
            font-weight: 500;


        }

        /* Game Board */
        .game-stage {
            width: min(100%, 1500px);
            max-width: 1500px;
            height: clamp(430px, 64vh, 620px);
            min-height: 0;
            flex-shrink: 1;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 4px solid #ffffff;
            border-radius: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            display: flex;
            position: relative;
            padding: clamp(16px, 1.5vw, 25px);
            overflow: hidden;
        }

        .slide-item {
            display: none;
            width: 100%;
            height: 100%;
            min-height: 0;
            justify-content: space-between;
            align-items: stretch;
            animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            gap: 25px;
        }

        .slide-item.active {
            display: flex;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* 🧮 Vertical Math Column - REDESIGNED & RESPONSIVE */
        .math-column {
            width: 180px;
            flex-shrink: 0;
            display: flex;
            align-items: stretch;
            justify-content: center;
        }

        /* ✨ Attractive question card */
        .math-terminal {
            width: 100%;
            background:
                linear-gradient(#ffffff, #ffffff) padding-box,
                linear-gradient(145deg, #ffc4d8, #ffdca8, #bdebd9) border-box;
            border: 4px solid transparent;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 14px 30px rgba(120, 90, 110, 0.16);
            overflow: hidden;
            position: relative;
        }

        .math-terminal::after {
            content: '✨';
            position: absolute;
            right: 12px;
            top: 7px;
            font-size: 1rem;
            opacity: .75;
            pointer-events: none;
        }

        .terminal-header {
            width: 100%;
            background: linear-gradient(135deg, #fff3c9, #ffe3d2);
            color: #765f5a;
            font-size: 1.05rem;
            font-weight: 400;
            letter-spacing: .7px;
            text-align: center;
            padding: 13px 8px;
            border-bottom: 3px solid #ffe2e8;
            text-transform: uppercase;
        }

        .terminal-row {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            font-weight: 500;
            color: #4f555a;
            padding: 15px 0;
            position: relative;
            border-bottom: 3px solid #ffe2e8;
            background: linear-gradient(90deg, rgba(255, 255, 255, .98), rgba(255, 250, 252, .92));
        }

        .minus-sign {
            position: absolute;
            left: 20px;
            /* Safely tucked inside the box */
            color: #ffb7b2;
            /* Soft pastel color */
            font-size: 3.5rem;
            font-weight: 500;
        }

        /* Input Control */
        input[type="text"] {
            width: 100%;
            flex-grow: 1;
            min-height: 90px;
            font-size: 3.5rem;
            font-weight: 500;
            text-align: center;
            border: none;
            background: linear-gradient(135deg, #fff8fa, #ffffff);
            color: #ff7f78;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            background: #fff9f9;
            box-shadow: inset 0 5px 10px rgba(255, 139, 133, 0.1);
        }

        input[type="text"]:disabled {
            background-color: #f1f8f5;
            color: #00b894;
            cursor: not-allowed;
        }

        /* 🎒 Play Area (Field vs Take Away Box) */
        .play-area {
            flex: 1 1 0;
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) minmax(0, 0.72fr);
            gap: clamp(14px, 2vh, 20px);
        }

        .field-zone {
            min-height: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 12% 20%, rgba(255, 255, 255, .75) 0 2px, transparent 3px),
                linear-gradient(135deg, rgba(214, 246, 234, .72), rgba(239, 252, 247, .82));
            border: 4px dashed #a9dfcf;
            border-radius: 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 16px;
            padding: 42px 18px 18px;
            position: relative;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 8px 20px rgba(91, 157, 135, .08);
        }

        /* Label sits ON the top border, exactly like the marked reference */
        .field-label {
            position: absolute;
            top: -19px;
            left: 26px;
            background: linear-gradient(135deg, #ffffff, #effaf6);
            color: #5f9f8b;
            font-weight: 500;
            font-size: 1.12rem;
            letter-spacing: .4px;
            padding: 8px 21px;
            border-radius: 18px;
            border: 2px solid rgba(169, 223, 207, .65);
            box-shadow: 0 7px 16px rgba(74, 126, 109, .12);
            text-transform: uppercase;
            z-index: 3;
            line-height: 1;
        }

        .basket-zone {
            min-height: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 88% 75%, rgba(255, 255, 255, .7) 0 2px, transparent 3px),
                linear-gradient(135deg, rgba(255, 235, 221, .86), rgba(255, 247, 239, .9));
            border: 4px dashed #ffcda8;
            border-radius: 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 16px;
            padding: 42px 18px 18px;
            position: relative;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 8px 20px rgba(180, 121, 75, .07);
        }

        /* Label sits ON the top border */
        .basket-label {
            position: absolute;
            top: -19px;
            left: 26px;
            background: linear-gradient(135deg, #ffffff, #fff7f0);
            color: #df8b52;
            font-weight: 500;
            font-size: 1.12rem;
            letter-spacing: .4px;
            padding: 8px 21px;
            border-radius: 18px;
            border: 2px solid rgba(255, 205, 168, .7);
            box-shadow: 0 7px 16px rgba(167, 102, 52, .12);
            text-transform: uppercase;
            z-index: 3;
            line-height: 1;
        }

        /* Interactive Items */
        .draggable-item {
            width: clamp(58px, 5.2vw, 78px);
            height: clamp(58px, 5.2vw, 78px);
            background: linear-gradient(145deg, #ffffff, #f7fbfa);
            border: 2px solid rgba(255, 255, 255, .95);
            border-radius: 21px;
            box-shadow: 0 8px 18px rgba(52, 77, 71, 0.11), inset 0 1px 0 #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .draggable-item::before {
            content: '';
            position: absolute;
            width: 26px;
            height: 8px;
            border-radius: 50%;
            top: 7px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, .9);
            pointer-events: none;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }
        }

        .draggable-item:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .draggable-item img {
            max-width: 70%;
            max-height: 70%;
            object-fit: contain;
        }

        /* Exact Match Navigation & Buttons */
        footer {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .nav-btn {
            background: #e67e22;
            color: #ffffff;
            border: none;
            min-width: 178px;
            height: 45px;
            font-size: 20px;
            font-weight: 500;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #d35400;
            transition: all 0.1s ease;
        }

        .nav-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d35400;
        }

        .nav-btn:disabled {
            background: #b2bec3;
            box-shadow: 0 6px 0 #636e72;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .check-btn {
            background: #00b894;
            box-shadow: 0 6px 0 #008f72;
        }

        .check-btn:active:not(:disabled) {
            box-shadow: 0 2px 0 #008f72;
        }

        .replay-btn {
            background: #0984e3;
            box-shadow: 0 6px 0 #0975c7;
            margin-top: 20px;
            z-index: 5;
        }

        .replay-btn:active {
            box-shadow: 0 2px 0 #0975c7;
        }

        @media screen and (min-width: 1600px) {
            h1 {
                font-size: 30px;
            }

            .game-stage {
                width: min(1500px, 94vw);
                max-width: 1500px;
            }

            .slide-item {
                gap: clamp(30px, 2.5vw, 45px);
            }

            .math-column {
                width: 210px;
            }

            footer {
                width: min(1100px, 94vw);
                margin-left: auto;
                margin-right: auto;
            }

            .nav-btn {
                width: 200px;
                min-width: 200px;
                height: 60px;
                padding: 0;
                font-size: 30px;
                border-radius: 50px;
            }
        }

        /* Keep the complete game visible without an inner scrollbar */
        @media screen and (max-height: 820px) and (min-width: 769px) {
            body {
                padding: 8px 15px;
            }

            header {
                margin-top: 0;
            }

            .instruction {
                padding: 6px 22px;
            }

            .game-stage {
                height: clamp(390px, 62vh, 520px);
            }

            .terminal-row {
                font-size: clamp(3rem, 5vw, 4rem);
                padding: 8px 0;
            }

            input[type="text"] {
                min-height: 68px;
                font-size: 3rem;
            }

            .terminal-header {
                padding: 8px;
            }

            .field-zone,
            .basket-zone {
                gap: 10px;
                padding: 34px 12px 12px;
            }

            .draggable-item {
                width: 62px;
                height: 62px;
                border-radius: 18px;
            }
        }

        /* Mobile / tablet responsiveness */
        @media screen and (max-width: 900px) {
            body {
                height: auto;
                min-height: 100dvh;
                justify-content: flex-start;
                gap: 14px;
                padding: 10px;
            }

            .game-stage {
                height: auto;
                min-height: 0;
                overflow: visible;
                padding: 16px;
            }

            .slide-item {
                flex-direction: column;
                align-items: center;
                height: auto;
                min-height: 0;
                gap: 16px;
            }

            .math-column {
                width: min(100%, 340px);
                flex-shrink: 0;
            }

            .play-area {
                width: 100%;
                display: flex;
                min-height: 0;
                gap: 16px;
            }

            .field-zone,
            .basket-zone {
                flex: none;
                min-height: 190px;
                overflow: visible;
                padding: 40px 12px 16px;
                gap: 12px;
            }

            footer {
                padding: 4px 0 10px;
                gap: 10px;
            }

            .nav-btn {
                padding: 10px 18px;
                font-size: 16px;
            }
        }

        @media screen and (max-width: 520px) {
            h1 {
                font-size: 22px;
            }

            .instruction {
                font-size: .92rem;
                padding: 8px 14px;
                line-height: 1.35;
            }

            .game-stage {
                border-radius: 25px;
                padding: 12px;
            }

            .terminal-row {
                font-size: 3.2rem;
            }

            input[type="text"] {
                min-height: 76px;
                font-size: 3rem;
            }

            .field-label,
            .basket-label {
                left: 16px;
                font-size: .95rem;
                padding: 7px 15px;
            }

            .draggable-item {
                width: 58px;
                height: 58px;
                border-radius: 17px;
            }

            footer {
                width: 100%;
            }

            .nav-btn {
                padding: 10px 14px;
                font-size: 14px;
            }
        }


        /* ===== Updated board design: reference-style layout ===== */
        .math-column {
            width: 210px;
        }

        .math-terminal {
            border-radius: 30px;
            background:
                linear-gradient(#ffffff, #ffffff) padding-box,
                linear-gradient(180deg, #ffb6cb 0%, #ffd39a 50%, #9edfcf 100%) border-box;
            border-width: 4px;
        }

        /* O = Ones */
        .terminal-header {
            width: 100%;
            min-height: 86px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff9d7, #fff0ad);
            color: #25292d;
            font-size: 2.7rem;
            font-weight: 500;
            letter-spacing: 0;
            text-transform: none;
            padding: 0;
            border-bottom: 3px solid #f4e8e8;
        }

        .terminal-row {
            min-height: 122px;
            font-size: clamp(3.5rem, 4.6vw, 4.8rem);
            font-weight: 500;
            padding: 8px 0;
            background: rgba(255, 255, 255, .82);
        }

        .minus-sign {
            left: 22px;
            font-size: 3.1rem;
            font-weight: 500;
        }

        input[type="text"] {
            min-height: 104px;
            font-size: 4rem;
            font-weight: 500;
            background: linear-gradient(135deg, #fff8fa, #ffffff);
        }

        .play-area {
            grid-template-rows: minmax(0, 1.12fr) minmax(0, .72fr);
            gap: 34px;
            padding-top: 8px;
        }

        .field-zone,
        .basket-zone {
            border-radius: 32px;
            padding: 56px 24px 22px;
            gap: clamp(18px, 2.1vw, 34px);
        }

        .field-zone {
            background:
                radial-gradient(circle at 14% 18%, rgba(255, 255, 255, .85) 0 2px, transparent 3px),
                linear-gradient(135deg, rgba(223, 248, 239, .82), rgba(238, 251, 247, .88));
            border-color: #9bd9c9;
        }

        .basket-zone {
            background:
                radial-gradient(circle at 92% 72%, rgba(255, 255, 255, .82) 0 2px, transparent 3px),
                linear-gradient(135deg, rgba(255, 238, 224, .90), rgba(255, 249, 244, .94));
            border-color: #ffbf95;
        }

        /* Labels centered on the dashed top border */
        .field-label,
        .basket-label {
            top: -29px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            border-radius: 22px;
            padding: 11px 30px 11px 78px;
            font-size: clamp(1rem, 1.55vw, 1.32rem);
            line-height: 1.15;
            box-shadow: 0 8px 18px rgba(60, 80, 75, .12);
        }

        .field-label {
            color: #28745f;
            border-color: #a7ddd0;
            background: linear-gradient(135deg, #ffffff, #effaf6);
        }

        .basket-label {
            color: #d46e24;
            border-color: #ffc49c;
            background: linear-gradient(135deg, #ffffff, #fff7f1);
        }

        .field-label::before,
        .basket-label::before {
            content: 'O';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #222;
            font-size: 2rem;
            font-weight: 600;
            background: #fff4b5;
            border: 2px solid #f2d47a;
            box-shadow: 0 3px 8px rgba(160, 120, 40, .15);
        }

        .field-label::after,
        .basket-label::after {
            content: '✦';
            margin-left: 12px;
            font-size: 1.25em;
        }

        /* Remove the white image card completely: image only */
        .draggable-item {
            width: clamp(82px, 6.8vw, 112px);
            height: clamp(82px, 6.8vw, 112px);
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            overflow: visible;
        }

        .draggable-item::before {
            display: none;
        }

        .draggable-item:hover {
            transform: translateY(-6px) scale(1.08);
            box-shadow: none;
        }

        .draggable-item img {
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            object-fit: contain;
            filter: drop-shadow(0 7px 7px rgba(32, 75, 72, .14));
        }

        @media screen and (max-height: 820px) and (min-width: 769px) {
            .math-column {
                width: 190px;
            }

            .terminal-header {
                min-height: 62px;
                font-size: 2.2rem;
            }

            .terminal-row {
                min-height: 92px;
            }

            input[type="text"] {
                min-height: 78px;
            }

            .play-area {
                gap: 26px;
            }

            .field-zone,
            .basket-zone {
                padding-top: 46px;
                gap: 18px;
            }

            .draggable-item {
                width: clamp(70px, 5.8vw, 92px);
                height: clamp(70px, 5.8vw, 92px);
            }
        }

        @media screen and (max-width: 900px) {
            .math-column {
                width: min(100%, 260px);
            }

            .field-label,
            .basket-label {
                left: 50%;
                padding: 9px 20px 9px 65px;
            }

            .field-label::before,
            .basket-label::before {
                width: 42px;
                height: 42px;
                left: 9px;
                font-size: 1.7rem;
            }

            .draggable-item {
                width: 76px;
                height: 76px;
            }
        }

        @media screen and (max-width: 520px) {
            .terminal-header {
                min-height: 64px;
                font-size: 2.1rem;
            }

            .field-zone,
            .basket-zone {
                padding: 46px 12px 16px;
                gap: 14px;
            }

            .field-label,
            .basket-label {
                font-size: .9rem;
            }

            .draggable-item {
                width: 64px;
                height: 64px;
            }
        }



        /* ===== EXACT SAME CONFETTI EFFECT ===== */
        #confettiContainer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 200;
        }

        .confetti-piece {
            position: absolute;
            width: 9px;
            height: 14px;
            border-radius: 2px;
            opacity: 0;
            animation: pageConfetti 1700ms cubic-bezier(.16, .72, .3, 1) forwards;
            will-change: transform, opacity;
        }

        .final-confetti-piece {
            width: 10px;
            height: 16px;
            animation-duration: 2300ms;
        }

        .final-confetti-piece:nth-child(3n) {
            border-radius: 50%;
        }

        .final-confetti-piece:nth-child(4n) {
            width: 7px;
            height: 19px;
            border-radius: 1px;
        }

        .final-confetti-piece:nth-child(5n) {
            width: 13px;
            height: 8px;
            border-radius: 2px;
        }

        @keyframes pageConfetti {
            0% {
                opacity: 1;
                transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
            }

            55% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translate3d(var(--x), var(--y), 0) rotate(var(--r)) scale(0.72);
            }
        }

        /* Exact Match Popup Design */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-card {
            position: relative;
            width: 90%;
            max-width: 520px;
            padding: 40px 30px;
            border-radius: 36px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            transform: scale(0.8);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .popup-card::before,
        .popup-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .popup-card::before {
            width: 220px;
            height: 220px;
            top: -60px;
            right: -50px;
        }

        .popup-card::after {
            width: 180px;
            height: 180px;
            bottom: -70px;
            left: -40px;
        }

        .popup-card.correct {
            background: #edfbf4;
            border: 6px solid #00c885;
        }

        .popup-card.correct::before,
        .popup-card.correct::after {
            background: rgba(162, 245, 209, 0.45);
        }

        .popup-card.correct .popup-title {
            color: #00a86b;
        }

        .popup-card.correct .popup-subtitle {
            color: #2e7d5b;
        }

        .popup-card.wrong {
            background: #fff0f2;
            border: 6px solid #ff6b7a;
        }

        .popup-card.wrong::before,
        .popup-card.wrong::after {
            background: rgba(255, 196, 203, 0.45);
        }

        .popup-card.wrong .popup-title {
            color: #d33847;
        }

        .popup-card.wrong .popup-subtitle {
            color: #a33b45;
        }

        .popup-card.complete {
            background: #f0f3ff;
            border: 6px solid #6c5ce7;
        }

        .popup-card.complete::before,
        .popup-card.complete::after {
            background: rgba(162, 155, 254, 0.35);
        }

        .popup-card.complete .popup-title {
            color: #6c5ce7;
        }

        .popup-card.complete .popup-subtitle {
            color: #4834d4;
        }

        .popup-overlay.active .popup-card {
            transform: scale(1);
        }

        .popup-icon {
            font-size: 4.8rem;
            margin-bottom: 12px;
            z-index: 2;
            line-height: 1;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.1));
        }

        .popup-title {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 8px;
            z-index: 2;
            letter-spacing: -0.5px;
        }

        .popup-subtitle {
            font-size: 1.4rem;
            font-weight: 500;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== Compact visible zone labels ===== */
        .field-zone,
        .basket-zone {
            overflow: visible !important;
            border-width: 3px;
        }

        .field-label,
        .basket-label {
            top: -18px !important;
            left: 50% !important;
            transform: translateX(-50%);
            z-index: 20 !important;
            font-size: clamp(.82rem, 1.15vw, 1rem) !important;
            font-weight: 800;
            padding: 6px 16px 6px 52px !important;
            border-radius: 16px !important;
            line-height: 1 !important;
            box-shadow: 0 4px 10px rgba(60, 80, 75, .10) !important;
        }

        .field-label::before,
        .basket-label::before {
            left: 7px !important;
            width: 34px !important;
            height: 34px !important;
            font-size: 1.45rem !important;
            border-width: 1.5px !important;
        }

        .field-label::after,
        .basket-label::after {
            margin-left: 7px !important;
            font-size: 1em !important;
        }

        @media screen and (max-width: 700px) {

            .field-label,
            .basket-label {
                top: -15px !important;
                font-size: .78rem !important;
                padding: 5px 12px 5px 46px !important;
            }

            .field-label::before,
            .basket-label::before {
                width: 30px !important;
                height: 30px !important;
                left: 6px !important;
                font-size: 1.25rem !important;
            }
        }


        /* ===== Requested final typography ===== */
        .eq-text,
        .ans-input {
            font-size: 30px !important;
            font-weight: 400 !important;
            color: #2f4f4f !important;
        }

        .instruction {
            font-size: 20px !important;
            font-weight: 400 !important;
        }

        /* Main Group: no box, weight 500 */
        .field-label {
            font-weight: 500 !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* ===== Monitor responsive ===== */
        @media screen and (min-width: 1500px) {

            .eq-text,
            .ans-input {
                font-size: 40px !important;
                font-weight: 400 !important;
                color: #2f4f4f !important;
            }

            .instruction {
                font-size: 25px !important;
                font-weight: 400 !important;
            }

            .game-stage {
                max-width: 1400px;
                height: 68vh;
            }

            .visual-area {
                height: 74%;
                gap: 28px;
                padding: 18px 30px;
            }

            .item-bubble {
                width: 130px;
                height: 130px;
            }

            .item-bubble img {
                max-width: 82%;
                max-height: 82%;
            }

            .equation-area {
                height: 24%;
                gap: 24px;
            }

            .ans-input {
                width: 90px;
                height: 78px;
            }
        }

        @media screen and (min-width: 1800px) {
            .game-stage {
                max-width: 1550px;
            }

            .visual-area {
                gap: 36px;
            }

            .item-bubble {
                width: 145px;
                height: 145px;
            }
        }
    </style>

    <style>
        /* ===== Requested question + answer font sizes ===== */
        .terminal-row,
        .ans-input {
            font-size: 30px !important;
            font-weight: 400 !important;
            color: #2f4f4f !important;
        }

        @media screen and (min-width: 1500px) {

            .terminal-row,
            .ans-input {
                font-size: 40px !important;
                font-weight: 400 !important;
                color: #2f4f4f !important;
            }
        }
    </style>


    <style>
        /* ===== Make Main Group and Take Away Box look exactly the same ===== */
        .field-label,
        .basket-label {
            font-weight: 500 !important;
            border: 2px solid rgba(169, 223, 207, .65) !important;
            box-shadow: 0 7px 16px rgba(74, 126, 109, .12) !important;
            color: #5f9f8b !important;
            background: linear-gradient(135deg, #ffffff, #effaf6) !important;
        }
    </style>

</head>

<body>

    <div id="confettiContainer"></div>

    <header>
        <h1>🎨 Find the difference! ✨</h1>
        <p class="instruction">💡 Tip: Tap the items to pack them into the "Take Away Box", then count what's left!</p>
    </header>

    <main class="game-stage" id="gameStage">
    </main>

    <footer>
        <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>PREV</button>
        <button class="nav-btn check-btn" id="submitBtn" onclick="checkAnswers()" disabled>SUBMIT</button>
        <button class="nav-btn" id="nextBtn" onclick="navigate(1)" disabled>NEXT</button>
    </footer>

    <div class="popup-overlay" id="popup">
        <div class="popup-card" id="popupCard">
            <div class="popup-icon" id="popupIcon">⭐</div>
            <h2 class="popup-title" id="popupTitle">Amazing!</h2>
            <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
            <button class="nav-btn replay-btn" id="playAgainBtn" style="display: none;" onclick="restartGame()">Play
                Again</button>
        </div>
    </div>

    <script>
        // Data derived directly from the worksheet
        const quizData = [
            { top: 9, bottom: 5, ans: "4", img: "../images/butterfly.png" }, // a)
            { top: 6, bottom: 3, ans: "3", img: "../images/rubiks.png" },    // b)
            { top: 9, bottom: 4, ans: "5", img: "../images/ant.png" },       // c)
            { top: 3, bottom: 1, ans: "2", img: "../images/pizza.png" }      // d)
        ];

        let quizState = Array.from({ length: quizData.length }, () => ({
            inputValue: '',
            isUnlocked: false
        }));

        let currentIndex = 0;
        let popupTimer = null;
        let slides = [];

        const gameStage = document.getElementById('gameStage');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');

        // Dynamic Initialization
        function initializeGame() {
            gameStage.innerHTML = '';

            quizData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = `slide-item ${index === 0 ? 'active' : ''}`;
                slide.dataset.q = index;

                // 1. Math Terminal Column - Now completely safe from cutoff
                const terminal = `
                    <div class="math-column">
                        <div class="math-terminal">
                            <div class="terminal-header">O</div>
                            <div class="terminal-row">${data.top}</div>
                            <div class="terminal-row">
                                <span class="minus-sign">-</span>
                                ${data.bottom}
                            </div>
                            <input type="text" class="ans-input" maxlength="1" data-idx="${index}">
                        </div>
                    </div>
                `;

                // 2. Play Area (Field + Basket)
                const playArea = document.createElement('div');
                playArea.className = 'play-area';

                const fieldZone = document.createElement('div');
                fieldZone.className = 'field-zone';
                fieldZone.id = `field-${index}`;
                fieldZone.innerHTML = `<span class="field-label">Main Group</span>`;

                const basketZone = document.createElement('div');
                basketZone.className = 'basket-zone';
                basketZone.id = `basket-${index}`;
                basketZone.innerHTML = `<span class="basket-label">Take Away Box</span>`;

                // Populate initial items in the field
                for (let i = 0; i < data.top; i++) {
                    const item = document.createElement('div');
                    item.className = 'draggable-item';
                    item.innerHTML = `<img src="${data.img}" alt="Item">`;

                    item.onclick = function () { moveItem(this, index); };
                    fieldZone.appendChild(item);
                }

                playArea.appendChild(fieldZone);
                playArea.appendChild(basketZone);

                slide.innerHTML = terminal;
                slide.appendChild(playArea);
                gameStage.appendChild(slide);
            });

            slides = document.querySelectorAll('.slide-item');
            setupInputListeners();
        }

        // Moving items between zones
        function moveItem(element, index) {
            if (quizState[index].isUnlocked) return;

            const field = document.getElementById(`field-${index}`);
            const basket = document.getElementById(`basket-${index}`);

            if (element.parentElement === field) {
                basket.appendChild(element);
                playMoveSound(false);
            } else {
                field.appendChild(element);
                playMoveSound(true);
            }
        }

        function setupInputListeners() {
            document.querySelectorAll('.ans-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    quizState[currentIndex].inputValue = e.target.value;
                    updateNavButtons();
                });
            });
        }

        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-US"; msg.volume = 0.8; msg.rate = 1; msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playMoveSound(isReturning) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            osc.type = 'sine';
            if (isReturning) {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
            } else {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            }

            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playAudioTone(isCorrect) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (isCorrect) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            }
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function navigate(dir) {
            slides[currentIndex].classList.remove('active');
            currentIndex += dir;
            slides[currentIndex].classList.add('active');

            const currentInput = slides[currentIndex].querySelector('.ans-input');
            currentInput.value = quizState[currentIndex].inputValue;
            currentInput.disabled = quizState[currentIndex].isUnlocked;

            if (!quizState[currentIndex].isUnlocked) {
                setTimeout(() => currentInput.focus(), 100);
            }

            updateNavButtons();
        }

        function updateNavButtons() {
            prevBtn.disabled = currentIndex === 0;
            const isLastQuestion = currentIndex === slides.length - 1;
            const isUnlocked = quizState[currentIndex].isUnlocked;

            nextBtn.disabled = isLastQuestion || !isUnlocked;

            const hasInput = quizState[currentIndex].inputValue.length > 0;
            submitBtn.disabled = isUnlocked || !hasInput;
        }


        function showSmallConfetti(isFinal = false) {
            const confettiContainer = document.getElementById('confettiContainer');
            if (!confettiContainer) return;

            confettiContainer.innerHTML = '';

            const count = isFinal ? 95 : 42;
            const colors = [
                '#00b894', '#e67e22', '#6c5ce7', '#0984e3',
                '#fdcb6e', '#ff6b7a', '#00cec9', '#a29bfe'
            ];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('span');
                piece.className = isFinal
                    ? 'confetti-piece final-confetti-piece'
                    : 'confetti-piece';

                const startX = Math.random() * 100;
                const startY = -8 + Math.random() * 10;
                const drift = (Math.random() * 520 - 260) * (isFinal ? 1.15 : 0.9);
                const fall = window.innerHeight * (0.82 + Math.random() * 0.48);
                const rotation = Math.random() * 1400 - 700;

                piece.style.left = startX + '%';
                piece.style.top = startY + '%';
                piece.style.setProperty('--x', drift + 'px');
                piece.style.setProperty('--y', fall + 'px');
                piece.style.setProperty('--r', rotation + 'deg');
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = (Math.random() * (isFinal ? 500 : 220)) + 'ms';

                confettiContainer.appendChild(piece);
                setTimeout(() => piece.remove(), isFinal ? 2900 : 2050);
            }
        }

        function checkAnswers() {
            const userAns = quizState[currentIndex].inputValue.trim();
            const data = quizData[currentIndex];
            const correctAns = data.ans;

            // A question is correct only when BOTH the take-away action
            // and the remaining-number answer are correct.
            const basket = document.getElementById(`basket-${currentIndex}`);
            const field = document.getElementById(`field-${currentIndex}`);
            const basketCount = basket.querySelectorAll('.draggable-item').length;
            const fieldCount = field.querySelectorAll('.draggable-item').length;

            const isCorrect =
                userAns === correctAns &&
                basketCount === data.bottom &&
                fieldCount === Number(correctAns);

            if (isCorrect) {
                quizState[currentIndex].isUnlocked = true;

                const input = slides[currentIndex].querySelector('.ans-input');
                input.disabled = true;

                if (currentIndex === slides.length - 1) {
                    showPopup('correct', '🌟', 'Amazing!', 'You got it right! ✨', false);
                    playAudioTone(true);
                    speak("Correct");
                    showSmallConfetti(false);

                    clearTimeout(popupTimer);
                    popupTimer = setTimeout(() => {
                        closePopup();
                        showSmallConfetti(true);
                        showPopup('complete', '🏆', 'Congratulations!', 'Fantastic job! You solved them all! 🎉', true);
                    }, 1800);

                } else {
                    showPopup('correct', '🌟', 'Amazing!', 'You got it right! ✨', false);
                    playAudioTone(true);
                    speak("Correct");
                    showSmallConfetti(false);
                }
            } else {
                let message = 'Count the items carefully and try again! 🌈';

                if (basketCount !== data.bottom) {
                    message = `Move exactly ${data.bottom} item${data.bottom === 1 ? '' : 's'} into the Take Away Box, then try again!`;
                } else if (userAns !== correctAns || fieldCount !== Number(correctAns)) {
                    message = 'Count what is left in the Main Group and try again! 🌈';
                }

                showPopup('wrong', '😟', 'Keep Going!', message, false);
                playAudioTone(false);
                speak("Wrong");

                const input = slides[currentIndex].querySelector('.ans-input');
                input.value = '';
                quizState[currentIndex].inputValue = '';
            }

            updateNavButtons();
        }

        function showPopup(status, icon, title, subtitle, isFinal = false) {
            const popup = document.getElementById('popup');
            const card = document.getElementById('popupCard');
            card.className = `popup-card ${status}`;
            document.getElementById('popupIcon').innerText = icon;
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupSubtitle').innerText = subtitle;
            playAgainBtn.style.display = isFinal ? 'inline-block' : 'none';
            popup.classList.add('active');
            if (!isFinal) {
                clearTimeout(popupTimer);
                popupTimer = setTimeout(closePopup, 1800);
            }
        }

        function closePopup() { document.getElementById('popup').classList.remove('active'); }

        function restartGame() {
            closePopup();
            const confettiContainer = document.getElementById('confettiContainer');
            if (confettiContainer) confettiContainer.innerHTML = '';
            quizState = Array.from({ length: quizData.length }, () => ({ inputValue: '', isUnlocked: false }));
            currentIndex = 0;
            initializeGame();
            updateNavButtons();
        }

        window.onload = () => {
            initializeGame();
            updateNavButtons();
            setTimeout(() => { slides[0].querySelector('.ans-input').focus(); }, 500);
        };
    </script>
</body>

</html>
