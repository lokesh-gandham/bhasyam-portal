<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Number Quest — Learning Path</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700;900&display=swap" rel="stylesheet">


<style>

:root{
  --bg:#f6f9fd;
  --paper:#ffffff;

  --ink:#243451;
  --ink-soft:#687791;

  --line:#e7edf5;

  --w1:#D96F6F;
  --w1-light:#ffcdc9;

  --w2:#3AA0A8;
  --w2-light:#c3f6fd;

  --w3:#7562C4;
  --w3-light:#beb2fa;

  --page-x:clamp(14px,3.5vw,70px);
  --gap:clamp(16px,2vw,30px);
}


/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{

  font-family:'Livvic';

  color:var(--ink);

  background-color:var(--bg);

  /*
    Clean subtle dotted background
  */

  background-image:
    radial-gradient(
      rgba(92,116,153,.12) 1px,
      transparent 1px
    );

  background-size:28px 28px;

  overflow-x:hidden;
}

h1,
h2,
h3,
h4{
  font-family:'Livvic';
  margin:0;
  color:var(--ink);
}

button{
  font-family:inherit;
}


/* =========================
   MAIN WRAPPER
========================= */

.wrap{

  width:100%;

  max-width:none;

  margin:0 auto;

  padding-left:var(--page-x);
  padding-right:var(--page-x);
}


/* =========================
   TOP BAR
========================= */

.topbar{

  width:100%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding-top:clamp(16px,2vw,30px);
 
  padding-bottom:clamp(8px,1vw,15px);
  display: none;
}

.brand{

  display:flex;

  align-items:center;

  gap:12px;
}

.brand .mark{

  width:clamp(40px,3.3vw,55px);

  height:clamp(40px,3.3vw,55px);

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:15px;

  background:#ff9d45;

  color:white;

  font-size:clamp(19px,1.6vw,27px);

  box-shadow:
    0 7px 16px rgba(255,157,69,.22);
}

.brand span{

 

  font-size:clamp(16px,1.35vw,21px);

  font-weight:400;

  color:var(--ink);
}

.score-pill{

  padding:
    10px
    17px;

  border-radius:999px;

  background:#fff;

  border:1px solid var(--line);

  color:var(--ink-soft);

  font-size:clamp(11px,1vw,14px);

  font-weight:600;

  box-shadow:
    0 5px 16px rgba(36,52,81,.06);
}


/* =========================
   HERO
========================= */

.hero{

  text-align:center;

  padding-top:clamp(35px,5vw,75px);

  padding-bottom:clamp(25px,3vw,45px);
}

.hero h1{

  font-size:
    clamp(
      32px,
      4vw,
      62px
    );

  line-height:1.08;

  letter-spacing:-1px;

  color:#22314f;
  font-weight: 400;
}

.hero .rule{

  width:55px;

  height:5px;

  border-radius:99px;

  background:#ff8c68;

  margin:
    18px
    auto;
}

.hero p{

  max-width:650px;

  margin:0 auto;

  color:var(--ink-soft);

  font-size:
    clamp(
      13px,
      1.1vw,
      17px
    );

  line-height:1.6;
}


/* =========================
   WORLD GRID
========================= */

.world-grid{

  width:100%;

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:var(--gap);

  padding-bottom:
    clamp(40px,5vw,80px);
}


/* =========================
   WORLD CARD
========================= */

.world-card{

  position:relative;

  min-width:0;

  background:#fff;

  border:1px solid #e8edf5;

  border-radius:26px;

  overflow:hidden;

  cursor:pointer;

  box-shadow:
    0 8px 24px rgba(36,52,81,.07);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.world-card:hover{

  transform:translateY(-5px);

  box-shadow:
    0 16px 32px rgba(36,52,81,.11);
}


/* =========================
   WORLD TOP
========================= */

.world-top{

  height:
    clamp(
      135px,
      13vw,
      205px
    );

  display:flex;

  align-items:center;

  justify-content:center;

  position:relative;
}

.world-card.w1 .world-top{
  background:var(--w1-light);
}

.world-card.w2 .world-top{
  background:var(--w2-light);
}

.world-card.w3 .world-top{
  background:var(--w3-light);
}


/* =========================
   WORLD ICON
========================= */

.icon-circle{

  width:
    clamp(
      62px,
      5.5vw,
      86px
    );

  height:
    clamp(
      62px,
      5.5vw,
      86px
    );

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:22px;

  background:#fff;

  font-size:
    clamp(
      29px,
      2.5vw,
      42px
    );

  box-shadow:
    0 8px 20px rgba(36,52,81,.10);
}


/* =========================
   NUMBER
========================= */

.num-badge{

  position:absolute;

  top:14px;

  left:15px;

  width:
    clamp(
      31px,
      2.5vw,
      42px
    );

  height:
    clamp(
      31px,
      2.5vw,
      42px
    );

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:#fff;

  color:var(--ink);

  border:1px solid #e4eaf3;


  font-weight:700;

  font-size:
    clamp(
      12px,
      1vw,
      16px
    );

  box-shadow:
    0 5px 12px rgba(36,52,81,.08);
}


/* =========================
   WORLD BODY
========================= */

.world-body{

  padding:
    clamp(20px,2vw,30px);

  text-align:center;
}

.world-body h3{

  font-size:
    clamp(
      22px,
      3.6vw,
      32px
    );

  margin-bottom:8px;
  font-weight: 500;
}

.world-body p{

  color:var(--ink-soft);

  font-size:
    clamp(
      15px,
      1vw,
      20px
    );

  line-height:1.55;

  min-height:45px;

  margin-bottom:20px;
}


/* =========================
   WORLD META
========================= */

.world-meta{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:16px;
}

.game-count{

  color:var(--ink-soft);

  font-size:
    clamp(
      15px,
      .95vw,
      18px
    );

  font-weight:500;
}


/* =========================
   EXPLORE
========================= */

.go-btn{

  padding:
    10px
    19px;

  border-radius:999px;

  color:#fff;

  font-size:
    clamp(
      15px,
      .95vw,
      18px
    );

  font-weight:400;
}

.world-card.w1 .go-btn{
  background:var(--w1);
}

.world-card.w2 .go-btn{
  background:var(--w2);
}

.world-card.w3 .go-btn{
  background:var(--w3);
}


/* =========================
   CATEGORY
========================= */

#categoryView{

  display:none;

  width:100%;

  padding-bottom:70px;
}


/* =========================
   BACK
========================= */

.back-link{

  display:inline-flex;
  align-items:center;
      min-height: 46px;
    padding: 0 18px;

        border-radius: 999px;
  font-size:1rem;
  border: 3px solid #fff;
  background: #fff;
  color: #26324a; 
  font-weight: 600;
 box-shadow: 0 5px 0 rgba(0, 0, 0, .08), 0 10px 20px rgba(35, 53, 77, .14);
 margin-bottom: 8px;
 margin-top: 8px;
}

.back-link:hover{
  color:var(--ink);
}


/* =========================
   CATEGORY BANNER
========================= */

.cat-banner{
  width:100%;
  min-height:clamp(190px,14vw,300px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:clamp(20px,3vw,42px);
  padding:clamp(24px,3vw,44px);
  margin-bottom:32px;
  border-radius:30px;
  overflow:hidden;
  position:relative;
  color:#4f5365;
  border:1px solid rgba(255,255,255,.75);
  box-shadow:
    0 10px 25px rgba(60,70,100,.08),
    inset 0 1px 0 rgba(255,255,255,.8);
  isolation:isolate;
}

.cat-banner::before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  left:-95px;
  bottom:-150px;
  border-radius:50%;
  background:rgba(255,255,255,.30);
  z-index:-1;
}

.cat-banner::after{
  content:"";
  position:absolute;
  width:360px;
  height:360px;
  right:-145px;
  top:-190px;
  border-radius:50%;
  background:rgba(255,255,255,.28);
  z-index:-1;
}

.cat-banner.pastel-w1{
  background:linear-gradient(135deg,#f8dfe5 0%,#f4d4dc 55%,#f0cbd5 100%) !important;
  border-color:#e9cbd3;
}

.cat-banner.pastel-w2{
  background:linear-gradient(135deg,#e0f3ef 0%,#d5ece7 55%,#cce6e0 100%) !important;
  border-color:#c5dfd9;
}

.cat-banner.pastel-w3{
  background:linear-gradient(135deg,#ebe6f8 0%,#e2dbf3 55%,#d9d0ed 100%) !important;
  border-color:#d2c9e7;
}

.banner-copy{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:clamp(16px,2vw,24px);
  flex:1;
  min-width:0;
}

.cat-banner .icon{
  width:clamp(62px,5.5vw,88px);
  height:clamp(62px,5.5vw,88px);
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:24px;
  background:rgba(255,255,255,.62);
  border:1px solid rgba(255,255,255,.85);
  font-size:clamp(30px,2.7vw,44px);
  box-shadow:0 8px 18px rgba(70,75,100,.08);
}

.cat-banner h2{
  color:#4b4d5c;
  font-size:clamp(24px,2.4vw,40px);
  font-weight:600;
  letter-spacing:.3px;
}

.cat-banner p{
  color:#676a79;
  margin-top:8px;
  font-size:clamp(16px,1vw,20px);
  line-height:1.5;
  opacity:1;
}

.cat-banner-image{
  width:clamp(170px,21vw,340px);
  height:clamp(140px,16vw,250px);
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:3;
}

.cat-banner-image img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 10px 14px rgba(70,75,95,.12));
}


/* =========================
   GAME GRID
========================= */

.game-grid{

  width:100%;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:var(--gap);
}


/* =========================
   GAME CARD
========================= */

.game-card{

  min-width:0;

  background:#fff;

  border:1px solid #e8edf5;

  border-radius:22px;

  overflow:hidden;

  box-shadow:
    0 7px 20px rgba(36,52,81,.06);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.game-card:hover{

  transform:translateY(-4px);

  box-shadow:
    0 14px 28px rgba(36,52,81,.10);
}


/* =========================
   GAME TOP
========================= */

.game-top{

  height:
    clamp(
      100px,
      9vw,
      145px
    );

  display:flex;

  align-items:center;

  justify-content:center;

  position:relative;
}

.game-medal{

  width:
    clamp(
      53px,
      4.5vw,
      70px
    );

  height:
    clamp(
      53px,
      4.5vw,
      70px
    );

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:#fff;

  font-size:
    clamp(
      24px,
      2vw,
      34px
    );

  box-shadow:
    0 7px 15px rgba(36,52,81,.12);
}


/* =========================
   GAME BODY
========================= */

.game-body{

  padding:
    18px
    18px
    22px;

  text-align:center;
}

.game-card h4{

  font-size:
    clamp(
      23px,
      3.2vw,
      28px
    );

  margin-bottom:7px;
  font-weight: 500;
}

.game-card p{

  min-height:38px;

  margin-bottom:17px;

  color:var(--ink-soft);

  font-size:
    clamp(
      15px,
      2.9vw,
      20px
    );

  line-height:1.45;
}


/* =========================
   START
========================= */

.start-btn{

  width:50%;

  padding:
    10px
    14px;

  border-radius:999px;

  color:#fff;

  font-weight:500;

  font-size:
    clamp(
      18px,
      .9vw,
      22px
    );
}



/* =========================
   SOFT PASTEL INNER GAME CARDS
========================= */

.game-card{
  background:#fff;
  border:1px solid #e7dfe5;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 7px 20px rgba(60,70,100,.055);
  transition:transform .2s ease, box-shadow .2s ease;
}

.game-card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 28px rgba(60,70,100,.09);
}

/* World 1 — soft rose */
.game-card.pastel-w1{
  background:#fff8fa;
  border-color:#ecd5dc;
}

.game-card.pastel-w1 .game-top{
  background:linear-gradient(135deg,#fbecef,#f5dfe5) !important;
  border-bottom:1px solid #eed7de;
}

/* World 2 — soft mint */
.game-card.pastel-w2{
  background:#f7fcfa;
  border-color:#d2e7e0;
}

.game-card.pastel-w2 .game-top{
  background:linear-gradient(135deg,#e9f7f3,#dcefe9) !important;
  border-bottom:1px solid #d5e9e2;
}

/* World 3 — soft lavender */
.game-card.pastel-w3{
  background:#faf9fd;
  border-color:#ded7ec;
}

.game-card.pastel-w3 .game-top{
  background:linear-gradient(135deg,#f0ecfa,#e5def3) !important;
  border-bottom:1px solid #e0d8ed;
}

/* Soft number badge */
.game-card .num-badge{
  background:rgba(255,255,255,.78);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 4px 10px rgba(60,70,100,.07);
}

/* Soft medal */
.game-card.pastel-w1 .game-medal{
  background:#fffafb;
  box-shadow:0 7px 15px rgba(125,80,95,.10);
}

.game-card.pastel-w2 .game-medal{
  background:#fbfefd;
  box-shadow:0 7px 15px rgba(70,110,100,.10);
}

.game-card.pastel-w3 .game-medal{
  background:#fcfbff;
  box-shadow:0 7px 15px rgba(90,75,120,.10);
}

/* Pastel play buttons */
.game-card.pastel-w1 .start-btn{
  background:#edcbd5 !important;
  border:1px solid #dfb8c4;
  color:#5d4c53;
}

.game-card.pastel-w2 .start-btn{
  background:#cfe7df !important;
  border:1px solid #b9d8ce;
  color:#4b5e58;
}

.game-card.pastel-w3 .start-btn{
  background:#d9d1eb !important;
  border:1px solid #c5badc;
  color:#554e65;
}

.game-card .start-btn{
  box-shadow:0 4px 10px rgba(60,70,100,.07);
  transition:transform .18s ease, box-shadow .18s ease;
}

.game-card .start-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 14px rgba(60,70,100,.10);
}

/* =========================
   QUIZ FULL SCREEN
========================= */

#quizView{

  display:none;

  position:fixed;

  inset:0;

  width:100vw;

  height:100vh;

  height:100dvh;

  z-index:999999;

  background:#fff;

  overflow:hidden;
}

#quizFrame{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  border:0;

  margin:0;

  padding:0;

  display:block;

  background:#fff;
}


/* =========================
   ONLY HOME BUTTON
========================= */

.quiz-home-btn{

  position:fixed;

  top:
    max(
      10px,
      env(safe-area-inset-top)
    );

  left:
    max(
      10px,
      env(safe-area-inset-left)
    );

  width:
    clamp(
      44px,
      3.4vw,
      58px
    );

  height:
    clamp(
      44px,
      3.4vw,
      58px
    );

  display:flex;

  align-items:center;

  justify-content:center;

  padding:0;

  border:1px solid #e4eaf2;

  border-radius:14px;

  background:#fff;

  color:var(--ink);

  font-size:
    clamp(
      21px,
      1.8vw,
      29px
    );

  z-index:2147483647;

  box-shadow:
    0 5px 18px rgba(36,52,81,.18);
}


/* =========================
   LARGE DESKTOP
========================= */

@media(min-width:1400px){

  .world-grid,
  .game-grid{
    gap:30px;
  }

}


/* =========================
   1920+
========================= */

@media(min-width:1800px){

  :root{
    --page-x:4vw;
  }

  .hero{
    padding-top:65px;
  }

  .world-top{
    height:220px;
  }

  .cat-banner{
    min-height:260px;
  }

}


/* =========================
   TABLET
========================= */

@media(max-width:1050px){

  :root{
    --page-x:24px;
  }

  .game-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .cat-banner-image{
    width:220px;
    height:170px;
  }
}


/* =========================
   SMALL TABLET
========================= */

@media(max-width:820px){

  .world-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .world-card:last-child{
    grid-column:1/-1;
    width:calc(50% - 10px);
    margin:auto;
  }
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  :root{
    --page-x:15px;
    --gap:17px;
  }

  .topbar{
    padding-top:14px;
  }

  .score-pill{
    padding:8px 12px;
  }

  .hero{
    padding-top:30px;
  }

  .hero h1{
    font-size:32px;
  }

  .world-grid{
    grid-template-columns:1fr;
    gap:20px;
  }

  .world-card:last-child{
    width:100%;
  }

  .world-top{
    height:135px;
  }

  .world-body{
    padding:20px;
  }

  .cat-banner{

    flex-direction:column;

    align-items:stretch;

    gap:8px;

    padding:20px;

    border-radius:22px;
  }

  .banner-copy{
    gap:13px;
  }

  .cat-banner .icon{
    width:58px;
    height:58px;
    font-size:28px;
    border-radius:17px;
  }

  .cat-banner h2{
    font-size:23px;
  }

  .cat-banner p{
    font-size:12px;
  }

  .cat-banner-image{

    width:100%;

    height:135px;

    margin-top:3px;
  }

  .cat-banner-image img{
    max-width:220px;
  }

  .game-grid{
    grid-template-columns:1fr;
  }

  .game-top{
    height:105px;
  }

  .quiz-home-btn{
    width:46px;
    height:46px;
    left:10px;
    top:10px;
    border-radius:12px;
  }
}


/* =========================
   SMALL PHONE
========================= */

@media(max-width:380px){

  :root{
    --page-x:12px;
  }

  .brand span{
    font-size:14px;
  }

  .score-pill{
    font-size:9px;
  }

  .hero h1{
    font-size:29px;
  }

  .cat-banner-image{
    height:115px;
  }
}


/* =========================
   LANDSCAPE PHONE
========================= */

@media(
  max-height:500px
) and (
  orientation:landscape
){

  .hero{
    padding-top:15px;
    padding-bottom:10px;
  }

  .world-top{
    height:105px;
  }

}


/* =========================
   NO ANIMATION
========================= */

@media(prefers-reduced-motion:reduce){

  *{
    transition:none !important;
    animation:none !important;
  }

}
</style>
</head>


<body>


<!-- =======================================================
     MAIN PAGE
======================================================= -->

<div class="wrap">


  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <div class="topbar">

    <div class="brand">

      <div class="mark">
        🔢
      </div>

      <span>
        Math Adventure
      </span>

    </div>


    <div class="score-pill">
      12 Activities · 3 topics
    </div>

  </div>


  <!-- =====================================================
       HOME VIEW
  ====================================================== -->

  <div id="homeView">

    <div class="hero">

      <h1>
        What do you want to practice?
      </h1>

      <div class="rule"></div>

      <p>
        Pick a topic below. Each one holds four short games
        you can finish in a few minutes.
      </p>

    </div>


    <div
      class="world-grid"
      id="worldsContainer"
    ></div>

  </div>


  <!-- =====================================================
       CATEGORY VIEW
  ====================================================== -->

  <div id="categoryView">

    <button
      type="button"
      class="back-link"
      onclick="showHome()"
    >
      🏠 Home
    </button>


    <div id="catBanner"></div>


    <div
      id="catGrid"
      class="game-grid"
    ></div>

  </div>

</div>



<!-- =======================================================
     FULL SCREEN QUIZ IFRAME
======================================================= -->

<div id="quizView">


  <!-- ONLY ONE HOME BUTTON -->

  <button
    type="button"
    class="quiz-home-btn"
    onclick="returnToHome()"
    aria-label="Home"
    title="Home"
  >
    🏠
  </button>


  <!-- QUIZ -->

  <iframe
    id="quizFrame"
    title="Number Quest Quiz"
    src="about:blank"
    allow="fullscreen"
  ></iframe>

</div>



<script>

/* =========================================================
   DATA
========================================================= */

const DATA = [

  /* =======================================================
     WORLD 1
  ======================================================= */

  {
    id:'w1',

    key:'w1',

    name:'Subtraction Squad',

    icon:'➖',

    desc:
      'Take numbers away and land on the right answer.',

    color:'var(--w1)',

    /*
      RIGHT SIDE CATEGORY IMAGE

      Change this path if your image has another filename.
    */

    image:
      './images/subimg.png',

    games:[

      {
        icon:'➖',

        title:'Substraction',

        desc:
          'Take away numbers and solve',

        /*
          QUIZ FILE
        */

        url:
          './exercise/substarction.html'
      },

      {
        icon:'➗',

        title:'Difference',

        desc:
          'Find the difference between numbers',

        url:
          './exercise/difference.html'
      },

      {
        icon:'🔽',

        title:'Substraction Game',

        desc:
          'Take away and find the answer',

        url:
          './exercise/substract_game.html'
      },

      {
        icon:'📉',

        title:'Vertical Difference',

        desc:
          'Solve subtraction in vertical form',

        url:
          './exercise/vertical_difference.html'
      }

    ]
  },


  /* =======================================================
     WORLD 2
  ======================================================= */

  {
    id:'w2',

    key:'w2',

    name:'Fill & Find',

    icon:'🧩',

    desc:
      'Spot the missing number and complete the puzzle.',

    color:'var(--w2)',

    /*
      RIGHT SIDE CATEGORY IMAGE
    */

    image:
      './images/fill-and-find.png',

    games:[

      {
        icon:'🧩',

        title:'Fill in the Box',

        desc:
          'Find the missing answer',

        url:
          './exercise/fillinthebox.html'
      },

      {
        icon:'🔢',

        title:'Number Line',

        desc:
          'Jump along numbers to solve',

        url:
          './exercise/numberline.html'
      },

      {
        icon:'📝',

        title:'Fill in the Blanks',

        desc:
          'Complete every missing number',

        url:
          './exercise/fillintheblanks.html'
      },

      {
        icon:'✍️',

        title:'One Fill in the Blanks',

        desc:
          'Complete the missing number',

        url:
          './exercise/one_fillintheblanks.html'
      }

    ]
  },


  /* =======================================================
     WORLD 3
  ======================================================= */

  {
    id:'w3',

    key:'w3',

    name:'Draw & Discover',

    icon:'🎨',

    desc:
      'Draw, count beads, and match your way to the answer.',

    color:'var(--w3)',

    /*
      RIGHT SIDE CATEGORY IMAGE
    */

    image:
      './images/draw-and-discover.png',

    games:[

      {
        icon:'🖍️',

        title:'Draw Difference',

        desc:
          'Find and draw the difference',

        url:
          './exercise/draw_difference.html'
      },

      {
        icon:'🧮',

        title:'Abacus Subtraction',

        desc:
          'Use beads to subtract numbers',

        url:
          './exercise/abacus_sub.html'
      },

      {
        icon:'📿',

        title:'Draw Beads',

        desc:
          'Create and count colorful beads',

        url:
          './exercise/drawbeads.html'
      },

      {
        icon:'🔗',

        title:'Matching Game',

        desc:
          'Match the correct numbers together',

        url:
          './exercise/matching.html'
      }

    ]
  }

];


/* =========================================================
   ELEMENTS
========================================================= */

const worldsContainer =
  document.getElementById(
    'worldsContainer'
  );

const homeView =
  document.getElementById(
    'homeView'
  );

const categoryView =
  document.getElementById(
    'categoryView'
  );

const catBanner =
  document.getElementById(
    'catBanner'
  );

const catGrid =
  document.getElementById(
    'catGrid'
  );

const quizView =
  document.getElementById(
    'quizView'
  );

const quizFrame =
  document.getElementById(
    'quizFrame'
  );


/* =========================================================
   RENDER HOME TOPIC CARDS
========================================================= */

function renderWorlds(){

  worldsContainer.innerHTML =

    DATA.map(
      (world,index) => `

        <div
          class="world-card ${world.key}"
          onclick="openWorld('${world.id}')"
          role="button"
          tabindex="0"
          onkeydown="
            if(event.key === 'Enter' ||
               event.key === ' '){

              event.preventDefault();

              openWorld('${world.id}');
            }
          "
        >

          <!-- TOP -->

          <div class="world-top">

            <div class="num-badge">
              ${index + 1}
            </div>

            <div class="icon-circle">
              ${world.icon}
            </div>

          </div>


          <!-- BODY -->

          <div class="world-body">

            <h3>
              ${world.name}
            </h3>

            <p>
              ${world.desc}
            </p>


            <div class="world-meta">

              <span class="game-count">
                ${world.games.length} games
              </span>

              <span class="go-btn">
                EXPLORE ACTIVITIES →
              </span>

            </div>

          </div>

        </div>

      `
    ).join('');

}


/* =========================================================
   OPEN TOPIC
========================================================= */
let currentWorldId = null;
function openWorld(id){
currentWorldId = id;
  const world =
    DATA.find(
      item => item.id === id
    );


  if(!world){
    return;
  }


  /* =======================================================
     CATEGORY BANNER WITH RIGHT IMAGE
  ======================================================= */

  catBanner.innerHTML = `

    <div
      class="cat-banner pastel-${world.key}"
    >

      <div class="banner-copy">

        <div class="icon">
          ${world.icon}
        </div>


        <div>

          <h2>
            ${world.name}
          </h2>

          <p>
            ${world.desc}
          </p>

        </div>

      </div>


      <!-- RIGHT SIDE IMAGE -->

      <div class="cat-banner-image">

        <img
          src="${world.image}"
          alt="${world.name}"
        >

      </div>

    </div>

  `;


  /* =======================================================
     GAME CARDS
  ======================================================= */

  catGrid.innerHTML =

    world.games.map(
      (game,index) => `

        <div class="game-card pastel-${world.key}">

          <div
            class="game-top"
          >

            <div class="num-badge">
              ${index + 1}
            </div>


            <div class="game-medal">
              ${game.icon}
            </div>

          </div>


          <div class="game-body">

            <h4>
              ${game.title}
            </h4>


            <p>
              ${game.desc}
            </p>


            <button
              type="button"
              class="start-btn"
              style="background:${world.color}"
              onclick="
                startGame('${escapeJs(game.url)}')
              "
            >
              Play ▶
            </button>

          </div>

        </div>

      `
    ).join('');


  /* =======================================================
     SHOW CATEGORY
  ======================================================= */

  homeView.style.display =
    'none';

  categoryView.style.display =
    'block';


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* =========================================================
   START GAME IN FULL SCREEN IFRAME
========================================================= */

function startGame(url){

  if(!url){
    return;
  }


  /* Load quiz */

  quizFrame.src = url;


  /* Hide normal page */

  homeView.style.display =
    'none';

  categoryView.style.display =
    'none';


  /* Show iframe */

  quizView.style.display =
    'block';


  /* Prevent background scrolling */

  document.body.style.overflow =
    'hidden';


  /* Start from top */

  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   HOME BUTTON FROM QUIZ
========================================================= */

/* =========================================================
   HOME BUTTON FROM QUIZ
   Returns to the SAME category where the game was opened
========================================================= */

function returnToHome(){

  // Stop the current iframe game
  quizFrame.src = 'about:blank';

  // Hide iframe
  quizView.style.display = 'none';

  // Restore scrolling
  document.body.style.overflow = '';

  /*
     If the user opened a category before playing,
     return to that exact category.
  */
  if(currentWorldId){

    // This rebuilds the same category cards
    openWorld(currentWorldId);

  }else{

    // Fallback: show main 3 topic cards
    categoryView.style.display = 'none';
    homeView.style.display = 'block';

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });

  }

}


/* =========================================================
   BACK TO TOPICS
========================================================= */

function showHome(){

  /*
    If quiz happens to be open,
    close it first.
  */

  quizFrame.src =
    'about:blank';

  quizView.style.display =
    'none';


  categoryView.style.display =
    'none';

  homeView.style.display =
    'block';


  document.body.style.overflow =
    '';


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* =========================================================
   ESCAPE SPECIAL CHARACTERS
========================================================= */

function escapeJs(value){

  return String(value)

    .replace(
      /\\/g,
      '\\\\'
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /\n/g,
      '\\n'
    )

    .replace(
      /\r/g,
      '\\r'
    );

}


/* =========================================================
   ESC KEY = HOME
========================================================= */

document.addEventListener(
  'keydown',
  function(event){

    if(
      event.key === 'Escape' &&
      quizView.style.display === 'block'
    ){

      returnToHome();

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

renderWorlds();

</script>

</body>
</html>
