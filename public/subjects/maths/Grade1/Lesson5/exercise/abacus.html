<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Abacus Number Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Livvic',sans-serif}
html,body{width:100%;height:100%}
body{
 overflow:hidden;color:#40535a;
 
}
.game{width:100%;height:100%;min-height:620px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;position:relative;overflow:hidden}


header{padding:9px 18px 0;text-align:center;position:relative;z-index:2}
h1{font-size:22px;font-weight:400;color:#2f4f4f;line-height:1.25}
.instruction{
 width:max-content;max-width:92%;margin:8px auto 0;padding:7px 20px;
 border-radius:24px;background:rgba(255,255,255,.48);
 font-size:20px;color:#5d6b70;position:relative;z-index:2
}

.game-stage{position:relative;z-index:2;width:min(1120px,94vw);margin:auto;display:grid;
 grid-template-columns:minmax(300px,1fr) minmax(330px,1.05fr);gap:clamp(35px,7vw,110px);
 align-items:center;padding:10px 0;min-height:0}

/* GAME ABACUS */
.abacus-world{position:relative;display:flex;justify-content:center;align-items:center;min-height:410px}
.abacus-world:before{
 content:"";position:absolute;width:min(470px,94%);height:330px;border-radius:45% 55% 48% 52%;
 border:2px dashed rgba(87,111,137,.18);transform:rotate(-3deg)
}
.abacus{width:min(470px,100%);height:340px;position:relative;z-index:1;padding:34px 48px 42px;
 display:flex;justify-content:space-around;align-items:flex-end}
.abacus-top,.abacus-bottom{
 position:absolute;left:16px;right:16px;height:28px;border-radius:18px;
 background:linear-gradient(180deg,#e6b77d,#c98a55);border:2px solid rgba(132,88,55,.15);
 box-shadow:0 7px 0 rgba(117,75,45,.13)
}
.abacus-top{top:12px}.abacus-bottom{bottom:10px}
.rod-group{height:250px;width:105px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
.rod-label{font-size:16px;letter-spacing:1px;color:#77543d;margin-bottom:8px}
.rod{
 width:10px;height:205px;border-radius:10px;background:linear-gradient(90deg,#70665f,#b4a69d,#70665f);
 display:flex;flex-direction:column-reverse;align-items:center;padding-bottom:6px;gap:2px;
 box-shadow:inset 2px 0 rgba(255,255,255,.4);position:relative
}
.rod:after{content:"";position:absolute;bottom:-16px;width:46px;height:15px;border-radius:12px;background:#c98a55}
.bead{
 width:42px;height:18px;border-radius:50%;cursor:pointer;position:relative;
 transition:transform .12s,filter .12s,background .12s;
 box-shadow:inset 0 4px 5px rgba(255,255,255,.5),0 2px 2px rgba(0,0,0,.15)
}
.bead.ten{background:#c7e8e0;border:2px solid #78b7a9}
.bead.one{background:#cce4f4;border:2px solid #7aa8c5}
.bead:hover{transform:scale(1.12)}
.bead.counted.ten{background:#35a989;border-color:#237d67;filter:drop-shadow(0 0 7px rgba(53,169,137,.4))}
.bead.counted.one{background:#398fc1;border-color:#216c98;filter:drop-shadow(0 0 7px rgba(57,143,193,.35))}
.bead.counted:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:white;font-size:11px}
.count-chip{
 position:absolute;bottom:-36px;left:50%;transform:translateX(-50%);white-space:nowrap;
 padding:7px 14px;border-radius:18px;background:rgba(255,255,255,.72);
 font-size:14px;color:#617177;border:1px solid rgba(255,255,255,.8)
}

/* ANSWER MISSION */
.mission{min-height:380px;display:flex;flex-direction:column;justify-content:center;position:relative}
.mission-title{font-size:30px;font-weight:700;color:#2f4f4f;text-align:center;margin-bottom:10px}
.mission-sub{font-size:16px;color:#68787d;text-align:center;margin-bottom:20px}
.answer-orbit{
 position:relative;padding:30px 22px 24px;border-radius:46px;
 background:
  radial-gradient(circle at 10% 14%,rgba(255,205,112,.32) 0 5px,transparent 6px),
  radial-gradient(circle at 88% 18%,rgba(112,190,210,.28) 0 7px,transparent 8px),
  radial-gradient(circle at 83% 84%,rgba(181,137,203,.24) 0 5px,transparent 6px),
  radial-gradient(circle at 17% 88%,rgba(118,195,163,.22) 0 6px,transparent 7px),
  rgba(255,255,255,.28);
 border:1px solid rgba(255,255,255,.72);
 box-shadow:0 14px 35px rgba(74,91,104,.08);
}
.answer-orbit:before{
 content:"✦";position:absolute;right:24px;top:16px;
 font-size:18px;color:rgba(232,145,73,.55)
}
.answer-block{position:relative;margin-bottom:17px}
.answer-label{font-size:14px;letter-spacing:1.2px;color:#6a7b7e;margin:0 0 8px 10px}
.number-deck,.name-deck{display:flex;justify-content:center;gap:12px}
.game-btn,.name-card{
 border:2px solid transparent;background:rgba(255,255,255,.86);cursor:pointer;
 color:#40535a;box-shadow:0 7px 0 rgba(83,94,111,.10),0 11px 18px rgba(61,69,85,.06);
 transition:.15s transform,.15s border-color,.15s box-shadow
}
.game-btn{
 min-width:84px;padding:12px 18px;border-radius:22px;font-size:23px;
 position:relative;overflow:hidden
}
.game-btn:before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;left:12px;top:9px;background:rgba(255,205,112,.45)}
.name-card{
 flex:1;min-height:60px;padding:10px 9px;border-radius:20px;font-size:18px;
 display:flex;align-items:center;justify-content:center;text-align:center;position:relative
}
.name-card:after{content:"✦";position:absolute;right:10px;bottom:7px;font-size:10px;color:rgba(125,107,198,.35)}
.game-btn:hover,.name-card:hover{transform:translateY(-3px)}
.game-btn.selected{border-color:#e98749;box-shadow:0 0 0 4px rgba(233,135,73,.16),0 7px 0 rgba(83,94,111,.10)}
.name-card.selected{border-color:#7d6bc6;box-shadow:0 0 0 4px rgba(125,107,198,.14),0 7px 0 rgba(83,94,111,.10)}
.name-card.locked{pointer-events:none;opacity:.45}
.mission.locked .game-btn,.mission.locked .name-card{pointer-events:none}

/* EXACT HEAVY/LIGHT STYLE NAV */
.navigation{
 width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
 padding:16px clamp(25px,4vw,70px) 24px;position:relative;z-index:5;gap:20px
}
.nav-btn{
 width:178px;height:45px;min-width:178px;padding:0;border:none;border-radius:35px;background:#e67e22;color:white;
 font-size:20px;cursor:pointer;box-shadow:0 6px #d35400;transition:.1s;
 line-height:45px;
 margin-bottom: 30px;
}
.nav-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px #d35400}
.nav-btn:disabled{background:#b2bec3;box-shadow:0 6px #7f8c8d;cursor:not-allowed}
#prevBtn{justify-self:start}#nextBtn{justify-self:end}
.submit-btn{background:#00b894;box-shadow:0 6px #008f72}
.submit-btn:active:not(:disabled){box-shadow:0 2px #008f72}

/* EXACT Number Name Quest popup */
.replay-btn{
  background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%);
  box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22);
  width:185px;min-width:185px;height:46px;padding:0 20px;margin-top:14px;
  font-size:22px;line-height:46px;border-radius:23px;
  border:2px solid rgba(255,255,255,.35);letter-spacing:.2px;
  transition:transform .12s ease,box-shadow .12s ease;
}
.replay-btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26)}
.replay-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18)}

.popup-overlay{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:.3s;z-index:100}
.popup-overlay.active{opacity:1;pointer-events:auto}
.popup-card{position:relative;width:520px;height:300px;max-width:calc(100vw - 30px);padding:30px;border-radius:36px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.1);transform:scale(.8);transition:.35s cubic-bezier(.175,.885,.32,1.275);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.popup-card:before,.popup-card:after{content:'';position:absolute;border-radius:50%;pointer-events:none}
.popup-card:before{width:220px;height:220px;top:-60px;right:-50px}
.popup-card:after{width:180px;height:180px;bottom:-70px;left:-40px}
.popup-card.correct{background:#edfbf4;border:6px solid #00c885}
.popup-card.correct:before,.popup-card.correct:after{background:rgba(162,245,209,.45)}
.popup-card.correct .popup-title{color:#00a86b}
.popup-card.correct .popup-subtitle{color:#2e7d5b}
.popup-card.wrong{background:#fff0f2;border:6px solid #ff6b7a}
.popup-card.wrong:before,.popup-card.wrong:after{background:rgba(255,196,203,.45)}
.popup-card.wrong .popup-title{color:#d33847}
.popup-card.wrong .popup-subtitle{color:#a33b45}
.popup-card.complete{background:#f0f3ff;border:6px solid #6c5ce7}
.popup-card.complete:before,.popup-card.complete:after{background:rgba(162,155,254,.35)}
.popup-card.complete .popup-title{color:#6c5ce7}
.popup-card.complete .popup-subtitle{color:#4834d4}
.popup-overlay.active .popup-card{transform:scale(1)}
.popup-icon{font-size:4.8rem;margin-bottom:12px;z-index:2;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.1))}
.popup-title{font-size:3rem;font-weight:600;margin-bottom:8px;z-index:2}
.popup-subtitle{font-size:1.4rem;z-index:2}
.popup-card.complete{box-shadow:0 20px 45px rgba(108,92,231,.18),0 0 0 8px rgba(162,155,254,.12)}
.popup-card.complete .replay-btn{margin-top:14px}
.popup-card.complete .popup-icon{animation:finalTrophyBounce 1.2s ease-in-out infinite}
@keyframes finalTrophyBounce{
  0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
  50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}

@media(min-width:1600px){
 h1{font-size:30px}
 .instruction{font-size:22px}
 .game-stage{width:min(1500px,94vw);grid-template-columns:minmax(520px,1fr) minmax(500px,1fr);gap:70px}
 .abacus-world{min-height:440px}
 .abacus{width:500px;height:360px}
 .mission{min-height:400px}
 .navigation{width:min(1400px,94vw);margin-left:auto;margin-right:auto;padding-left:0;padding-right:0}
 .nav-btn{width:200px;min-width:200px;height:60px;padding:0;font-size:30px;border-radius:50px;line-height:60px}
}
@media(max-width:760px){
 body{overflow:auto}.game{height:auto;min-height:100vh}
 .game-stage{grid-template-columns:1fr;gap:10px;padding:10px 0}.abacus-world{min-height:330px}.abacus{transform:scale(.84)}
 .mission{min-height:auto}.navigation{padding:12px;grid-template-columns:1fr auto 1fr}.nav-btn{min-width:92px;font-size:15px;padding:10px}
 .name-card{font-size:14px}.instruction{font-size:15px;text-align:center}.mission-title{font-size:25px}
}

/* ===== CONFETTI (same as other lessons) ===== */
#confettiContainer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:200}
.confetti-piece{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;will-change:transform,opacity}
.final-confetti-piece{width:10px;height:16px;animation-duration:2300ms}
.final-confetti-piece:nth-child(3n){border-radius:50%}
.final-confetti-piece:nth-child(4n){width:7px;height:19px;border-radius:1px}
.final-confetti-piece:nth-child(5n){width:13px;height:8px;border-radius:2px}
@keyframes pageConfetti{0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg) scale(1)}55%{opacity:1}100%{opacity:0;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72)}}

/* ===== CHAPTER 5: UNIFIED FINAL POPUP ===== */
.popup-overlay{
    position:fixed !important;
    inset:0 !important;
    display:flex !important;
    justify-content:center !important;
    align-items:center !important;
    background:transparent !important;
    opacity:0 !important;
    pointer-events:none !important;
    transition:opacity .3s ease,background .3s ease !important;
    z-index:1000 !important;
}
.popup-overlay.active{
    opacity:1 !important;
    pointer-events:auto !important;
    background:transparent !important;
}
.popup-overlay.active .popup-card{transform:scale(1) !important}
.popup-overlay .popup-card{
    position:relative !important;
    width:520px !important;
    height:300px !important;
    max-width:calc(100vw - 30px) !important;

    transition:transform .35s cubic-bezier(.175,.885,.32,1.275) !important;
    overflow:hidden !important;
    display:flex !important;
    flex-direction:column !important;
    align-items:center !important;
    justify-content:center !important;
    margin:0 !important;
}
.popup-overlay .popup-card::before,
.popup-overlay .popup-card::after{
    content:'' !important;
    position:absolute !important;
    border-radius:50% !important;
    pointer-events:none !important;
}
.popup-overlay .popup-card::before{width:220px !important;height:220px !important;top:-60px !important;right:-50px !important}
.popup-overlay .popup-card::after{width:180px !important;height:180px !important;bottom:-70px !important;left:-40px !important}
.popup-overlay .popup-card.correct{background:#edfbf4 !important;border:6px solid #00c885 !important}
.popup-overlay .popup-card.correct::before,
.popup-overlay .popup-card.correct::after{background:rgba(162,245,209,.45) !important}
.popup-overlay .popup-card.correct .popup-title{color:#00a86b !important}
.popup-overlay .popup-card.correct .popup-subtitle{color:#2e7d5b !important}
.popup-overlay .popup-card.wrong{background:#fff0f2 !important;border:6px solid #ff6b7a !important}
.popup-overlay .popup-card.wrong::before,
.popup-overlay .popup-card.wrong::after{background:rgba(255,196,203,.45) !important}
.popup-overlay .popup-card.wrong .popup-title{color:#d33847 !important}
.popup-overlay .popup-card.wrong .popup-subtitle{color:#a33b45 !important}
.popup-overlay .popup-card.complete{
    background:#f0f3ff !important;
    border:6px solid #6c5ce7 !important;
    box-shadow:0 20px 45px rgba(108,92,231,.18),0 0 0 8px rgba(162,155,254,.12) !important;
}
.popup-overlay .popup-card.complete::before,
.popup-overlay .popup-card.complete::after{background:rgba(162,155,254,.35) !important}
.popup-overlay .popup-card.complete .popup-title{color:#6c5ce7 !important}
.popup-overlay .popup-card.complete .popup-subtitle{color:#4834d4 !important}
.popup-overlay .popup-icon{
    font-size:4.8rem !important;
    margin:0 0 12px !important;
    padding:0 !important;
    height:auto !important;
    width:auto !important;
    line-height:1 !important;
    z-index:2 !important;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.1)) !important;
    position:relative !important;
}
.popup-overlay .popup-title,
.popup-overlay h2.popup-title{
    font-size:3rem !important;
    font-weight:600 !important;
    margin:0 0 8px !important;
    padding:0 !important;
    height:auto !important;
    line-height:1.15 !important;
    z-index:2 !important;
    position:relative !important;
}
.popup-overlay .popup-subtitle,
.popup-overlay p.popup-subtitle{
    font-size:1.4rem !important;
    font-weight:500 !important;
    margin:0 !important;
    padding:0 !important;
    height:auto !important;
    line-height:1.35 !important;
    z-index:2 !important;
    text-align:center !important;
    position:relative !important;
}
.popup-overlay .replay-btn,
.popup-overlay #playAgainBtn,
.popup-overlay .replay{
    background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%) !important;
    box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22) !important;
    width:185px !important;
    min-width:185px !important;
    height:46px !important;
    padding:0 20px !important;
    margin-top:14px !important;
    font-size:22px !important;
    font-weight:600 !important;
    line-height:46px !important;
    border-radius:23px !important;
    border:2px solid rgba(255,255,255,.35) !important;
    letter-spacing:.2px !important;
    color:#fff !important;
    cursor:pointer !important;
    z-index:2 !important;
    font-family:'Livvic',sans-serif !important;
    transition:transform .12s ease,box-shadow .12s ease !important;
}
.popup-overlay .replay-btn:hover,
.popup-overlay #playAgainBtn:hover,
.popup-overlay .replay:hover{
    transform:translateY(-2px) !important;
    box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26) !important;
}
.popup-overlay .replay-btn:active,
.popup-overlay #playAgainBtn:active,
.popup-overlay .replay:active{
    transform:translateY(3px) !important;
    box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18) !important;
}
.popup-overlay .popup-card.complete .popup-icon{
    animation:ch5FinalTrophyBounce 1.2s ease-in-out infinite !important;
}
@keyframes ch5FinalTrophyBounce{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}
@media (max-width:520px){
    .popup-overlay .popup-card{
        width:calc(100vw - 24px) !important;
        height:auto !important;
        min-height:260px !important;
        padding:24px 18px !important;
    }
    .popup-overlay .popup-title,
    .popup-overlay h2.popup-title{font-size:2.2rem !important}
    .popup-overlay .popup-subtitle,
    .popup-overlay p.popup-subtitle{font-size:1.1rem !important}
    .popup-overlay .popup-icon{font-size:3.6rem !important}
}

</style>
</head>
<body>
<div id="confettiContainer"></div>
<div class="game">
<header><h1>Write the number represented on the abacus. Write its number name.</h1></header>
<div class="instruction">Tap each bead to count it, then choose the correct number and number name.</div>

<main class="game-stage">
 <section class="abacus-world">
  <div class="abacus">
   <div class="abacus-top"></div><div class="abacus-bottom"></div>
   <div class="rod-group"><div class="rod-label">TENS</div><div class="rod" id="tensRod"></div><div class="count-chip" id="tensCount">0 / 0 counted</div></div>
   <div class="rod-group"><div class="rod-label">ONES</div><div class="rod" id="onesRod"></div><div class="count-chip" id="onesCount">0 / 0 counted</div></div>
  </div>
 </section>

 <section class="mission" id="mission">
  <div class="answer-orbit">
   <div class="answer-block"><div class="answer-label">CHOOSE THE NUMBER</div><div class="number-deck" id="numberDeck"></div></div>
   <div class="answer-block"><div class="answer-label">CHOOSE THE NUMBER NAME</div><div class="name-deck" id="nameDeck"></div></div>
  </div>
 </section>
</main>

<footer class="navigation">
 <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">PREV</button>
 <button class="nav-btn submit-btn" id="submitBtn" onclick="checkAnswer()">SUBMIT</button>
 <button class="nav-btn" id="nextBtn" onclick="navigate(1)">NEXT</button>
</footer>
</div>

<div class="popup-overlay" id="popup"><div class="popup-card" id="popupCard">
 <div class="popup-icon" id="popupIcon">🌟</div><h2 class="popup-title" id="popupTitle">Amazing!</h2>
 <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
 <button class="nav-btn replay-btn" id="playAgainBtn" style="display:none" onclick="restartGame()">Play Again</button>
</div></div>

<script>
const quizData=[
 {tens:9,ones:3,num:93,name:'Ninety Three',numChoices:[93,39,90],nameChoices:['Ninety Three','Thirty Nine','Ninety']},
 {tens:7,ones:6,num:76,name:'Seventy Six',numChoices:[67,76,70],nameChoices:['Sixty Seven','Seventy Six','Seventy']}
];

let currentIndex=0, paused=false, timer=null;
let states=quizData.map(()=>({countedT:[],countedO:[],number:null,name:null,done:false}));

function speak(text){
 if(!('speechSynthesis' in window))return;
 speechSynthesis.cancel();
 const msg=new SpeechSynthesisUtterance(text);
 msg.lang='en-US';msg.volume=.8;msg.rate=1;msg.pitch=1;
 speechSynthesis.speak(msg);
}

function makeBeads(rodId,count,type){
 const rod=document.getElementById(rodId), state=states[currentIndex];
 const key=type==='t'?'countedT':'countedO';
 rod.innerHTML='';
 for(let i=0;i<count;i++){
  const b=document.createElement('div');
  b.className=`bead ${type==='t'?'ten':'one'} ${state[key][i]?'counted':''}`;
  b.addEventListener('click',()=>{
   if(paused||state.done)return;
   state[key][i]=!state[key][i];
   b.classList.toggle('counted',state[key][i]);
   updateCounts();
  });
  rod.appendChild(b);
 }
}

function updateCounts(){
 const q=quizData[currentIndex],s=states[currentIndex];
 const tc=s.countedT.filter(Boolean).length, oc=s.countedO.filter(Boolean).length;
 document.getElementById('tensCount').textContent=`${tc} / ${q.tens} counted`;
 document.getElementById('onesCount').textContent=`${oc} / ${q.ones} counted`;
 updateNav();
}

function canSubmit(s,q){
 const allCounted=s.countedT.every(Boolean)&&s.countedO.every(Boolean);
 return allCounted&&s.number!=null&&s.name!=null;
}

function renderOptions(){
 const q=quizData[currentIndex],s=states[currentIndex];
 numberDeck.innerHTML='';nameDeck.innerHTML='';
 q.numChoices.forEach(v=>{
  const b=document.createElement('button');b.type='button';
  b.className='game-btn'+(s.number===v?' selected':'');b.textContent=v;
  b.onclick=()=>{if(s.done||paused)return;s.number=v;renderOptions()};
  numberDeck.appendChild(b);
 });
 q.nameChoices.forEach(v=>{
  const b=document.createElement('button');b.type='button';
  b.className='name-card'+(s.name===v?' selected':'')+(s.done?' locked':'');b.textContent=v.toLowerCase().replace(/^./,c=>c.toUpperCase());
  b.onclick=()=>{if(s.done||paused)return;s.name=v;renderOptions()};
  nameDeck.appendChild(b);
 });
 updateNav();
}

function updateNav(){
 const s=states[currentIndex];
 const q=quizData[currentIndex];
 prevBtn.disabled=currentIndex===0;
 nextBtn.disabled=currentIndex===quizData.length-1||!s.done;
 submitBtn.disabled=s.done||!canSubmit(s,q);
 mission.classList.toggle('locked',s.done);
}

function loadQuestion(){
 paused=false;
 const q=quizData[currentIndex],s=states[currentIndex];
 if(s.countedT.length!==q.tens)s.countedT=Array(q.tens).fill(false);
 if(s.countedO.length!==q.ones)s.countedO=Array(q.ones).fill(false);
 makeBeads('tensRod',q.tens,'t');makeBeads('onesRod',q.ones,'o');
 updateCounts();renderOptions();updateNav();
}

function checkAnswer(){
 const q=quizData[currentIndex],s=states[currentIndex];
 if(paused||s.done)return;
 const allCounted=s.countedT.every(Boolean)&&s.countedO.every(Boolean);
 const correct=allCounted&&s.number===q.num&&s.name===q.name;
 if(correct){
  paused=true;s.done=true;speak('Correct');updateNav();
  showPopup('correct','🌟','Amazing!','You got it right!',false);
  if(currentIndex===quizData.length-1){
   setTimeout(()=>{
    showPopup('complete','🏆','Congratulations!','Fantastic job! You solved all questions! 🎉',true);
   },1800);
  }else{setTimeout(()=>paused=false,300)}
 }else{
  paused=true;
  speak('Wrong');
  mission.animate(
   [{transform:'translateX(0)'},{transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'translateX(0)'}],
   {duration:350}
  );

  setTimeout(()=>{
   const message = !allCounted
     ? 'Tap every bead first, then try again!'
     : 'Try again, you can do it!';

   showPopup('wrong','😟','Keep Going!',message,false);

   // After the Wrong popup disappears, reset every temporary choice:
   // selected number, selected number name, and counted beads.
   setTimeout(()=>{
     const resetState = states[currentIndex];
     if(!resetState.done){
       resetState.number=null;
       resetState.name=null;
       resetState.countedT=Array(quizData[currentIndex].tens).fill(false);
       resetState.countedO=Array(quizData[currentIndex].ones).fill(false);

       makeBeads('tensRod',quizData[currentIndex].tens,'t');
       makeBeads('onesRod',quizData[currentIndex].ones,'o');
       updateCounts();
       renderOptions();
       paused=false;
     }
   },1500);
  },350);
 }
}


function showSmallConfetti(isFinal=false){const c=document.getElementById('confettiContainer');if(!c)return;c.innerHTML='';const count=isFinal?95:42,colors=['#00b894','#e67e22','#6c5ce7','#0984e3','#fdcb6e','#ff6b7a','#00cec9','#a29bfe'];for(let i=0;i<count;i++){const p=document.createElement('span');p.className=isFinal?'confetti-piece final-confetti-piece':'confetti-piece';p.style.left=(Math.random()*100)+'%';p.style.top=(-8+Math.random()*10)+'%';p.style.setProperty('--x',((Math.random()*520-260)*(isFinal?1.15:.9))+'px');p.style.setProperty('--y',(window.innerHeight*(.82+Math.random()*.48))+'px');p.style.setProperty('--r',(Math.random()*1400-700)+'deg');p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDelay=(Math.random()*(isFinal?500:220))+'ms';c.appendChild(p);setTimeout(()=>p.remove(),isFinal?2900:2050)}}
function clearConfetti(){const c=document.getElementById('confettiContainer');if(c)c.innerHTML='';}

function showPopup(type,icon,title,text,final){
    /* confetti, same as other lessons */
    if(final || type === 'complete'){ showSmallConfetti(true); }
    else if(type === 'correct'){ showSmallConfetti(false); }

 clearTimeout(timer);
 popupCard.className='popup-card '+type;
 popupIcon.textContent=icon;
 popupTitle.textContent=title;
 popupSubtitle.textContent=text;
 playAgainBtn.style.display=final?'inline-block':'none';
 popup.classList.add('active');

 // Correct and Wrong messages close automatically.
 if(!final){
   const delay = type==='wrong' ? 1500 : 1800;
   timer=setTimeout(()=>{
     popup.classList.remove('active');
   },delay);
 }
}
function closePopup(){
 clearTimeout(timer);
 popup.classList.remove('active');
}
function navigate(dir){
 if(paused)return;
 const next=currentIndex+dir;
 if(next<0||next>=quizData.length)return;
 if(dir>0&&!states[currentIndex].done)return;
 currentIndex=next;loadQuestion();
}
function restartGame(){
 clearTimeout(timer);closePopup();currentIndex=0;paused=false;
 states=quizData.map(()=>({countedT:[],countedO:[],number:null,name:null,done:false}));
 loadQuestion();
}
window.addEventListener('load',loadQuestion);
</script>
</body>
</html>
