<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Number Car Challenge</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Livvic", sans-serif;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            color: #40535a;

          

        }


        /* =========================
           MAIN PAGE
        ========================= */

        .game {

            width: 100%;
            height: 100vh;
            height: 100dvh;

            min-height: 520px;

            display: grid;

            grid-template-rows:
                auto
                minmax(0, 1fr)
                auto;

            position: relative;

            overflow: hidden;

        }



        /* =========================
           HOME
        ========================= */

        .home-btn {

            position: absolute;

            top: 14px;
            left: 20px;

            width: 72px;
            height: 72px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255,255,255,.75);

            color: #40535a;

            font-size: 26px;

            cursor: pointer;

            z-index: 50;

            box-shadow:
                0 10px 20px
                rgba(60,80,95,.14),

                inset 0 2px 2px
                rgba(255,255,255,.9);

            transition: .2s;

        }


        .home-btn:hover {

            transform:
                translateY(-3px);

        }


        /* =========================
           HEADER
        ========================= */

        header {

            text-align: center;

            padding:
                8px
                110px
                5px;

            position: relative;

            z-index: 10;

        }


        p{

            font-size: 22px;

            /* font-weight: 600; */

            color: #2f4f4f;

            line-height: 1.3;

        }


        .instruction {

            width: fit-content;

            max-width: 90%;

            margin:
                7px auto 0;

            padding:
                7px
                24px;

            border-radius: 30px;

            background:
                rgba(255,255,255,.52);

            border:
                1px solid
                rgba(255,255,255,.9);

            box-shadow:
                0 8px 20px
                rgba(80,95,120,.07);

            font-size: 20px;

            font-weight: 500;

            color: #5d6b70;

        }


        /* =========================
           GAME STAGE
        ========================= */

        .game-stage {

            width:
                min(1450px, 96vw);

            min-height: 0;

            margin: 0 auto;

            position: relative;

            display: grid;

            grid-template-rows:
                auto
                minmax(0, 1fr);

            overflow: hidden;

        }


        /* =========================
           QUESTION
        ========================= */

        .question-area {

            width: 100%;

            text-align: center;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding-top: 2px;

            position: relative;

            z-index: 10;

        }


        .question-number {

            display: flex;

            align-items: center;
            justify-content: center;

            width: 42px;
            height: 42px;

            border-radius: 50%;

            margin-bottom: 5px;

            background: #fff3d9;

            color: #d17a18;

            font-size: 20px;

            font-weight: 500;

            box-shadow:
                0 6px 0
                rgba(160,110,40,.10);

        }


        .question-text {

            max-width: 1100px;

            padding:
                0 20px;

            font-size:30px;
            font-weight:400;

          

            line-height: 1.3;

            color: #38515d;

        }


        /* =========================
           PROGRESS
        ========================= */

        .progress {

            position: absolute;

            right: 2%;
            top: 8px;

            padding:
                9px
                16px;

            border-radius: 22px;

            background:
                rgba(255,255,255,.58);

            font-size: 15px;

        

            color: #65777d;

            z-index: 20;

        }


        /* =========================
           CAR SECTION
        ========================= */

        .car-section {

            min-height: 0;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            padding-bottom: 8px;

        }


        /* =========================
           ROAD
        ========================= */

        .road {

            position: absolute;

            width:
                min(
                    1350px,
                    90vw
                );

            height:
                clamp(
                    90px,
                    13vh,
                    130px
                );

            bottom: 10%;

            border-radius:
                80px
                80px
                35px
                35px;

            background:

                linear-gradient(
                    to bottom,
                    #68747d,
                    #4b565e
                );

            box-shadow:

                inset
                0 8px 16px
                rgba(255,255,255,.08),

                inset
                0 -10px 15px
                rgba(0,0,0,.16),

                0 12px 0
                rgba(60,70,80,.08);

            overflow: hidden;

            z-index: 1;

        }


        .road::before {

            content: "";

            position: absolute;

            left: 8%;
            right: 8%;

            top: 52%;

            height: 6px;

            border-radius: 20px;

            background:

                repeating-linear-gradient(

                    to right,

                    #ffe18c
                    0 60px,

                    transparent
                    60px 115px

                );

        }


        /* =========================
           EXACT CAR IMAGE
        ========================= */

        .car-zone {

            width:
                clamp(
                    500px,
                    58vw,
                    850px
                );

            aspect-ratio:
                1681 / 907;

            position: relative;

            z-index: 5;

            flex-shrink: 1;

        }


        .car-image {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: contain;

            object-position: center;

            pointer-events: none;

            user-select: none;

        }


        /* =========================
           CAR WINDOW OVERLAYS

           FIXED NUMBERS ARE NOT
           RENDERED HERE.

           YOUR CAR IMAGE ALREADY
           CONTAINS THEM.
        ========================= */

        .car-windows {

            position: absolute;

            inset: 0;

            pointer-events: none;

        }


        .car-window {

            position: absolute;

            pointer-events: auto;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;
            line-height: 1;
            vertical-align: middle;

            border-radius: 16px;

            background:
                rgba(219,239,247,.12);

            color: #25343c;

            font-size: 40px;

            font-weight: 400;

            border:
                3px solid
                rgba(72,126,155,.65);

            outline: none;

            font-family:
                "Livvic",
                sans-serif;

            padding: 0;

            transition: .18s;

        }


        .car-window:focus {

            border-color: #f18a27;

            background:
                rgba(255,255,255,.18);

            box-shadow:

                0 0 0 5px
                rgba(241,138,39,.18);

        }


        .car-window.correct-input {

            border-color: #00b894;

            background:
                rgba(233,251,244,.25);

        }


        .car-window.wrong-input {

            border-color: #ff6b7a;

            background:
                rgba(255,240,242,.25);

        }

.car-window,
.window,
.window-box {
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
}
        /* =========================
           EXACT CAR WINDOW POSITIONS
        ========================= */

        .slot-1 {

            left: 7.5%;
            top: 10.5%;

            width: 20.5%;
            height: 28%;

        }


        .slot-2 {

            left: 30.5%;
            top: 10.5%;

            width: 18.3%;
            height: 28%;

        }


        .slot-3 {

            left: 51.7%;
            top: 10.5%;

            width: 22.5%;
            height: 28%;

        }


        /* =========================
           NAVIGATION
        ========================= */

        .navigation {

            width: 100%;

            display: grid;

            grid-template-columns:
                1fr
                auto
                1fr;

            align-items: center;

            padding:
                8px
                clamp(25px,4vw,70px)
                20px;

            position: relative;

            z-index: 40;

        }


        .nav-btn {

            width: 178px;

            height: 45px;

            border: none;

            border-radius: 35px;

            background: #e67e22;

            color: white;

            font-size: 20px;

            font-weight: 500;

            cursor: pointer;

            box-shadow:
                0 6px
                #d35400;

            transition: .1s;

        }


        .nav-btn:active:not(:disabled) {

            transform:
                translateY(4px);

            box-shadow:
                0 2px
                #d35400;

        }


        .nav-btn:disabled {

            background: #b2bec3;

            box-shadow:
                0 6px
                #7f8c8d;

            cursor: not-allowed;

        }


        #prevBtn {

            justify-self: start;

        }


        #nextBtn {

            justify-self: end;

        }


        .submit-btn {

            background: #00b894;

            box-shadow:
                0 6px
                #008f72;

        }


        .submit-btn:active:not(:disabled) {

            box-shadow:
                0 2px
                #008f72;

        }


        .replay-btn{
            background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%);
            box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22);
            width:185px;min-width:185px;height:46px;padding:0 20px;margin-top:14px;
            font-size:22px;font-weight:600;line-height:46px;border-radius:23px;
            border:2px solid rgba(255,255,255,.35);letter-spacing:.2px;
            transition:transform .12s ease,box-shadow .12s ease;
        }
        .replay-btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26)}
        .replay-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18)}

        /* =========================
           EXACT HEAVY & LIGHT POPUP
        ========================= */

        .popup-overlay{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:.3s;z-index:100}
.popup-overlay.active{opacity:1;pointer-events:auto}
.popup-card{position:relative;width:520px;height:300px;max-width:calc(100vw - 30px);padding:30px;border-radius:36px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.1);transform:scale(.8);transition:.35s cubic-bezier(.175,.885,.32,1.275);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.popup-card:before,.popup-card:after{content:'';position:absolute;border-radius:50%;pointer-events:none}
.popup-card:before{width:220px;height:220px;top:-60px;right:-50px}.popup-card:after{width:180px;height:180px;bottom:-70px;left:-40px}
.popup-card.correct{background:#edfbf4;border:6px solid #00c885}.popup-card.correct:before,.popup-card.correct:after{background:rgba(162,245,209,.45)}
.popup-card.correct .popup-title{color:#00a86b}.popup-card.correct .popup-subtitle{color:#2e7d5b}
.popup-card.wrong{background:#fff0f2;border:6px solid #ff6b7a}.popup-card.wrong:before,.popup-card.wrong:after{background:rgba(255,196,203,.45)}
.popup-card.wrong .popup-title{color:#d33847}.popup-card.wrong .popup-subtitle{color:#a33b45}
.popup-card.complete{background:#f0f3ff;border:6px solid #6c5ce7}.popup-card.complete:before,.popup-card.complete:after{background:rgba(162,155,254,.35)}
.popup-card.complete .popup-title{color:#6c5ce7}.popup-card.complete .popup-subtitle{color:#4834d4}
.popup-overlay.active .popup-card{transform:scale(1)}
.popup-icon{font-size:4.8rem;margin-bottom:12px;z-index:2;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.1))}.popup-title{font-size:3rem;font-weight:600;margin-bottom:8px;z-index:2}.popup-subtitle{font-size:1.4rem;font-weight:500;z-index:2}

        /* =========================
           LARGE MONITOR
        ========================= */

        @media (min-width: 1600px) {

            p {

                font-size: 30px;

            }


            .instruction {

                font-size: 25px;

            }


            .car-zone {

                width:
                    clamp(
                        600px,
                        54vw,
                        950px

            }

            .car-window {
                font-size: 50px;
            }


            .road {

                height:

                        100px,
                        13vh,
                        145px

            }

        }


        /* =========================
           SHORT LAPTOP
        ========================= */

        @media
        (max-height: 720px)
        and
        (min-width: 761px) {

            header {

                padding-top: 4px;

            }


            .instruction {

            }


            .question-number {

                height: 36px;

                font-size: 17px;

                margin-bottom: 3px;

            }


            .question-text {

                    clamp(

                        1.8vw,

            }


            .car-zone {

                    clamp(
                        450px,
                        50vw,
                        720px
                    );

            }


            .road {

                height:
                    clamp(
                        75px,
                        12vh,
                        105px
                    );

                bottom: 8%;

            }


            .navigation {

                padding-top: 5px;

                padding-bottom: 12px;

            }

        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 760px) {

            body {

                overflow-y: auto;

            }


            .game {

                height: auto;

                min-height: 100vh;

                overflow: visible;

            }


            header {

                padding:
                    12px
                    65px
                    8px;

            }


            p {

                font-size: 18px;

            }


            .instruction {

                font-size: 14px;

                padding:
                    8px
                    15px;

            }


            .home-btn {

                width: 52px;
                height: 52px;

                left: 10px;
                top: 10px;

                font-size: 20px;

            }


            .game-stage {

                min-height: 520px;

                overflow: visible;

            }


            .question-text {

                font-size: 22px;

            }


            .question-number {

                width: 34px;
                height: 34px;

                font-size: 16px;

            }


            .car-section {

                min-height: 390px;

            }


            .car-zone {

                width:
                    min(
                        90vw,
                        650px
                    );

            }

            .car-window {
                font-size: clamp(18px, 4.5vw, 34px);
            }


            .road {

                width: 94vw;

                height: 90px;

                bottom: 12%;

            }


            .progress {

                display: none;

            }


            .navigation {

                padding:
                    10px
                    12px
                    18px;

            }


            .nav-btn {

                width: 120px;

                height: 42px;

                font-size: 15px;

            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .game-stage {

                min-height: 450px;

            }


            .question-text {

                font-size: 19px;

            }


            .instruction {

                max-width: 95%;

                font-size: 12px;

            }


            .car-section {

                min-height: 300px;

            }


            .car-zone {

                width: 96vw;

            }


            .road {

                width: 98vw;

                height: 70px;

            }


            .car-window {

                border-width: 2px;

                border-radius: 8px;

            }


            .navigation {

                padding-left: 8px;

                padding-right: 8px;

            }


            .nav-btn {

                width: 88px;

                height: 40px;

                font-size: 13px;

            }

        }
li {

}

/* EXACT SAME CONFETTI */
#confettiContainer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:2000;
}
.confetti-piece{
    position:absolute;
    width:9px;
    height:14px;
    border-radius:2px;
    opacity:0;
    animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
    will-change:transform,opacity;
}
.final-confetti-piece{
    width:10px;
    height:16px;
    animation-duration:2300ms;
}
.final-confetti-piece:nth-child(3n){border-radius:50%;}
.final-confetti-piece:nth-child(4n){width:7px;height:19px;border-radius:1px;}
.final-confetti-piece:nth-child(5n){width:13px;height:8px;border-radius:2px;}
@keyframes pageConfetti{
    0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg) scale(1);}
    55%{opacity:1;}
    100%{opacity:0;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72);}
}
.popup-card.complete{
    box-shadow:0 20px 45px rgba(108,92,231,.18),0 0 0 8px rgba(162,155,254,.12);
}
.popup-card.complete .replay-btn{margin-top:14px;}
.popup-card.complete .popup-icon{animation:finalTrophyBounce 1.2s ease-in-out infinite;}
@keyframes finalTrophyBounce{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1);}
    50%{transform:translateY(-5px) rotate(-4deg) scale(1.06);}
}

.popup-overlay .replay-btn:hover,
.popup-overlay #playAgainBtn:hover,
.popup-overlay .replay:hover{
    transform:translateY(-2px) !important;
    box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26) !important;
}
.popup-overlay .replay-btn:active,
.popup-overlay #playAgainBtn:active,
.popup-overlay .replay:active{
    transform:translateY(3px) !important;
    box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18) !important;
}
.popup-overlay .popup-card.complete .popup-icon{
    animation:ch5FinalTrophyBounce 1.2s ease-in-out infinite !important;
}
@keyframes ch5FinalTrophyBounce{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}
@media (max-width:520px){
    .popup-overlay .popup-card{
        width:calc(100vw - 24px) !important;
        height:auto !important;
        min-height:260px !important;
        padding:24px 18px !important;
    }
    .popup-overlay .popup-title,
    .popup-overlay h2.popup-title{font-size:2.2rem !important}
    .popup-overlay .popup-subtitle,
    .popup-overlay p.popup-subtitle{font-size:1.1rem !important}
    .popup-overlay .popup-icon{font-size:3.6rem !important}
}

</style>

</head>


<body>


<div class="game">


  


    <header>

        <p>
            Write what comes before, after and in between the given numbers.
        </p>


        <div class="instruction">
            🏁 Fill the missing numbers directly inside the car windows!
        </div>

    </header>


    <main class="game-stage">


        <div class="question-area">
<div
                class="question-text"
                id="questionText"
            ></div>

        </div>
<div class="car-section">


            <div class="road"></div>


            <div class="car-zone">

                <img
                    id="carImage"
                    class="car-image"
                    src=""
                    alt="Number learning car"
                >


                <div
                    id="carWindows"
                    class="car-windows"
                ></div>

            </div>


        </div>


    </main>


    <footer class="navigation">


        <button
            class="nav-btn"
            id="prevBtn"
            onclick="previousQuestion()"
        >
            PREV
        </button>


        <button
            class="nav-btn submit-btn"
            id="submitBtn"
            onclick="checkAnswer()"
        >
            SUBMIT
        </button>


        <button
            class="nav-btn"
            id="nextBtn"
            onclick="nextQuestion()"
        >
            NEXT
        </button>


    </footer>


</div>


<div id="confettiContainer"></div>

<div
    class="popup-overlay"
    id="popup"
>

    <div
        class="popup-card"
        id="popupCard"
    >

        <div
            class="popup-icon"
            id="popupIcon"
        >
            🌟
        </div>


        <h2 class="popup-title" id="popupTitle">
            Amazing!
        </h2>


        <p class="popup-subtitle" id="popupText">
            You got it right!
        </p>


        <button
            class="nav-btn replay-btn"
            id="playAgain"
            onclick="restartGame()"
            style="display:none"
        >
            Play Again
        </button>

    </div>

</div>


<script>


/* =========================
   QUESTIONS

   PUT YOUR EXACT 9 CAR
   IMAGE PATHS HERE.

   Fixed numbers must already
   be visible inside each image.
========================= */

const questions = [

    {
        image: "../images/car1.1.png",

        question:
            "Complete the next two numbers after 63.",

        values: [
            {
                value: "63",
                type: "fixed"
            },
            {
                value: "64",
                type: "input"
            },
            {
                value: "65",
                type: "input"
            }
        ]
    },


    {
        image: "../images/car2.2.png",

        question:
            "Write the number before 27 and the number after 27.",

        values: [
            {
                value: "26",
                type: "input"
            },
            {
                value: "27",
                type: "fixed"
            },
            {
                value: "28",
                type: "input"
            }
        ]
    },


    {
        image: "../images/car3.1.png",

        question:
            "Write the number that comes between 69 and 71.",

        values: [
            {
                value: "69",
                type: "fixed"
            },
            {
                value: "70",
                type: "input"
            },
            {
                value: "71",
                type: "fixed"
            }
        ]
    },


    {
        image: "../images/car4.1.png",

        question:
            "Complete the two numbers before 89.",

        values: [
            {
                value: "87",
                type: "input"
            },
            {
                value: "88",
                type: "input"
            },
            {
                value: "89",
                type: "fixed"
            }
        ]
    },


    {
        image: "../images/car5.1.png",

        question:
            "Complete the next two numbers after 76.",

        values: [
            {
                value: "76",
                type: "fixed"
            },
            {
                value: "77",
                type: "input"
            },
            {
                value: "78",
                type: "input"
            }
        ]
    },


    {
        image: "../images/car6.1.png",

        question:
            "Write the number that comes between 39 and 41.",

        values: [
            {
                value: "39",
                type: "fixed"
            },
            {
                value: "40",
                type: "input"
            },
            {
                value: "41",
                type: "fixed"
            }
        ]
    },


    {
        image: "../images/car7.1.png",

        question:
            "Complete the next two numbers after 45.",

        values: [
            {
                value: "45",
                type: "fixed"
            },
            {
                value: "46",
                type: "input"
            },
            {
                value: "47",
                type: "input"
            }
        ]
    },


    {
        image: "../images/car8.1.png",

        question:
            "Write the number before 54 and the number after 54.",

        values: [
            {
                value: "53",
                type: "input"
            },
            {
                value: "54",
                type: "fixed"
            },
            {
                value: "55",
                type: "input"
            }
        ]
    },


    {
        image: "../images/car9.1.png",

        question:
            "Write the number that comes between 97 and 99.",

        values: [
            {
                value: "97",
                type: "fixed"
            },
            {
                value: "98",
                type: "input"
            },
            {
                value: "99",
                type: "fixed"
            }
        ]
    }

];



let currentQuestion = 0;

let savedAnswers =
    questions.map(() => []);

let completedQuestions =
    questions.map(() => false);

let popupTimer = null;

let cameFromPrev = false;



const questionText =
    document.getElementById("questionText");
const carWindows =
    document.getElementById("carWindows");

const carImage =
    document.getElementById("carImage");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const submitBtn =
    document.getElementById("submitBtn");

const popup =
    document.getElementById("popup");

const popupCard =
    document.getElementById("popupCard");

const popupIcon =
    document.getElementById("popupIcon");

const popupTitle =
    document.getElementById("popupTitle");

const popupText =
    document.getElementById("popupText");

const playAgain =
    document.getElementById("playAgain");



function loadQuestion() {

    const data =
        questions[currentQuestion];
questionText.textContent =
        data.question;


    carImage.src =
        data.image;


    carWindows.innerHTML =
        "";


    /*
       IMPORTANT:

       Fixed numbers are already
       inside your exact car image.

       Therefore only INPUT boxes
       are created here.
    */

    data.values.forEach(
        (item, index) => {

            if (item.type !== "input") {
                return;
            }


            const input =
                document.createElement("input");


            input.type =
                "text";


            input.inputMode =
                "numeric";


            input.maxLength =
                "3";


            input.className =
                `car-window slot-${index + 1}`;


            input.dataset.index =
                index;


            input.value =
                savedAnswers[currentQuestion][index]
                || "";


            input.setAttribute(
                "aria-label",
                "Enter missing number"
            );


            input.addEventListener(
                "input",

                function() {

                    this.value =
                        this.value.replace(
                            /\D/g,
                            ""
                        );


                    savedAnswers[currentQuestion][index] =
                        this.value;


                    completedQuestions[currentQuestion] =
                        false;


                    this.classList.remove(
                        "correct-input",
                        "wrong-input"
                    );


                    cameFromPrev =
                        false;


                    updateButtons();

                }

            );


            input.addEventListener(
                "keydown",

                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        checkAnswer();

                    }

                }

            );


            carWindows.appendChild(
                input
            );

        }
    );


    updateButtons();

}



function updateButtons() {

    prevBtn.disabled =
        currentQuestion === 0;


    nextBtn.disabled =

        currentQuestion ===
        questions.length - 1

        ||

        !completedQuestions[
            currentQuestion
        ];


    const inputs =
        carWindows.querySelectorAll(
            "input"
        );


    const allFilled =
        [...inputs].every(
            input =>
                input.value.trim() !== ""
        );


    submitBtn.disabled =

        cameFromPrev

        ||

        !allFilled;

}



function checkAnswer() {

    const data =
        questions[currentQuestion];


    const inputs =
        carWindows.querySelectorAll(
            "input"
        );


    let correct = true;


    inputs.forEach(
        input => {

            const index =
                Number(
                    input.dataset.index
                );


            const expected =
                data.values[index].value;


            input.classList.remove(
                "correct-input",
                "wrong-input"
            );


            if (
                input.value.trim() ===
                expected
            ) {

                input.classList.add(
                    "correct-input"
                );

            }

            else {

                correct = false;

                input.classList.add(
                    "wrong-input"
                );

            }

        }
    );


    if (correct) {

        completedQuestions[
            currentQuestion
        ] = true;


        speakFeedback("Correct");
        showSmallConfetti(false);


        updateButtons();


        if (
            currentQuestion ===
            questions.length - 1
        ) {

            // Show the normal success popup first on the last question.
            showPopup(
                "correct",
                "🌟",
                "Amazing!",
                "You got it right! ✨"
            );

            // After the success popup finishes, show the final popup.
            clearTimeout(popupTimer);
            popupTimer = setTimeout(() => {
                showFinalPopup();
                showSmallConfetti(true);
            }, 1800);

        }

        else {

            showPopup(
                "correct",
                "🌟",
                "Amazing!",
                "You got it right! ✨"
            );

        }

    }

    else {

        completedQuestions[
            currentQuestion
        ] = false;

        inputs.forEach(input => {
            const index = Number(input.dataset.index);
            savedAnswers[currentQuestion][index] = "";
            input.value = "";
            input.classList.remove("wrong-input");
        });

        speakFeedback("Wrong");

        updateButtons();

        showPopup(

            "wrong",

            "💪",

            "Try Again!",

            "Check the numbers and try once more."

        );

    }

}



function showSmallConfetti(isFinal = false) {
    const confettiContainer = document.getElementById("confettiContainer");
    if (!confettiContainer) return;

    confettiContainer.innerHTML = "";

    const count = isFinal ? 95 : 42;
    const colors = [
        "#00b894","#e67e22","#6c5ce7","#0984e3",
        "#fdcb6e","#ff6b7a","#00cec9","#a29bfe"
    ];

    for (let i = 0; i < count; i++) {
        const piece = document.createElement("span");
        piece.className = isFinal
            ? "confetti-piece final-confetti-piece"
            : "confetti-piece";

        const startX = Math.random() * 100;
        const startY = -8 + Math.random() * 10;
        const drift = (Math.random() * 520 - 260) * (isFinal ? 1.15 : 0.9);
        const fall = window.innerHeight * (0.82 + Math.random() * 0.48);
        const rotation = Math.random() * 1400 - 700;

        piece.style.left = startX + "%";
        piece.style.top = startY + "%";
        piece.style.setProperty("--x", drift + "px");
        piece.style.setProperty("--y", fall + "px");
        piece.style.setProperty("--r", rotation + "deg");
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = (Math.random() * (isFinal ? 500 : 220)) + "ms";

        confettiContainer.appendChild(piece);
        setTimeout(() => piece.remove(), isFinal ? 2900 : 2050);
    }
}

function showPopup(
    type,
    icon,
    title,
    message
) {

    clearTimeout(
        popupTimer
    );


    popupCard.className =
        `popup-card ${type}`;


    popupIcon.textContent =
        icon;


    popupTitle.textContent =
        title;


    popupText.textContent =
        message;


    playAgain.style.display =
        "none";


    popup.classList.add(
        "active"
    );


    popupTimer =
        setTimeout(

            closePopup,

            1800

        );

}



function closePopup() {

    popup.classList.remove(
        "active"
    );

}



function showFinalPopup() {

    clearTimeout(
        popupTimer
    );


    popupCard.className =
        "popup-card complete";


    popupIcon.textContent =
        "🏆";


    popupTitle.textContent =
        "Congratulations!";


    popupText.textContent =
        "Fantastic job! You solved all questions! 🎉";


    playAgain.style.display =
        "inline-block";


    popup.classList.add(
        "active"
    );

}



function previousQuestion() {

    if (
        currentQuestion === 0
    ) {
        return;
    }


    currentQuestion--;


    cameFromPrev =
        true;


    loadQuestion();

}



function nextQuestion() {

    if (

        currentQuestion >=
        questions.length - 1

    ) {
        return;
    }


    if (

        !completedQuestions[
            currentQuestion
        ]

    ) {
        return;
    }


    currentQuestion++;


    cameFromPrev =
        false;


    loadQuestion();

}



function speakFeedback(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";
    speech.rate = 0.9;
    speech.pitch = 1;
    speech.volume = 1;

    window.speechSynthesis.speak(speech);

}


function speakQuestion() {

    if (
        !(
            "speechSynthesis"
            in
            window
        )
    ) {
        return;
    }


    window
        .speechSynthesis
        .cancel();


    const speech =
        new SpeechSynthesisUtterance(

            questions[
                currentQuestion
            ].question

        );


    speech.lang =
        "en-US";


    speech.rate =
        0.9;


    speech.pitch =
        1;


    speech.volume =
        1;


    window
        .speechSynthesis
        .speak(
            speech
        );

}



function restartGame() {

    currentQuestion =
        0;


    savedAnswers =
        questions.map(
            () => []
        );


    completedQuestions =
        questions.map(
            () => false
        );


    cameFromPrev =
        false;


    popup.classList.remove(
        "active"
    );

    const confettiContainer = document.getElementById("confettiContainer");
    if (confettiContainer) confettiContainer.innerHTML = "";

    loadQuestion();

}



function goHome() {

    window.location.href =
        "../index.html";

}



window.addEventListener(

    "load",

    function() {

        loadQuestion();

    }

);


</script>


</body>

</html>
