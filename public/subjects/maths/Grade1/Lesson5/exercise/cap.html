<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smallest Number Cap</title>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Livvic',sans-serif;
}
html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}
body{
    background:#eef0f7;
}
.quiz-page{
    width:100vw;
    height:100vh;
    min-height:560px;
    position:relative;
    overflow:hidden;
   
}
.home-btn{
    position:absolute;
    top:18px;
    left:18px;
    width:84px;
    height:84px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.72);
    color:#405365;
    font-size:34px;
    cursor:pointer;
    box-shadow:
        0 8px 22px rgba(45,60,70,.12);
    z-index:30;
    transition:.2s;
}
.home-btn:hover{
    transform:scale(1.05);
}
.main-heading{
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    width:min(85%,1200px);
    text-align:center;
    font-size:22px;
    font-weight:400;
    line-height:1.3;
    color:#2f4f4f;
    z-index:10;
}
.instruction{
    position:absolute;
    top:66px;
    left:50%;
    transform:translateX(-50%);
    width:min(88%,1000px);
    text-align:center;
    font-size:20px;
    font-weight:200;
    color:#405365;
    z-index:10;
}
.game-area{
    position:absolute;
    top:120px;
    bottom:80px;
    left:0;
    right:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(40px,7vw,120px);
    padding:0 7vw;
}
.cap-section{
    width:min(48vw,720px);
    height:min(60vh,520px);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}
.scanner-circle{
    position:absolute;
    width:min(43vw,570px);
    height:min(43vw,570px);
   
    border-radius:50%;
    animation:scannerPulse 3s ease-in-out infinite;
}
@keyframes scannerPulse{
    50%{
        transform:scale(1.03);
        opacity:.7;
    }
}
.cap-container{
    width:min(46vw,650px);
    max-height:500px;
    aspect-ratio:1.45 / 1;
    position:relative;
    z-index:2;
}
.cap-svg{
    width:100%;
    height:100%;
    overflow:visible;
    filter:
        drop-shadow(
            0 14px 15px rgba(45,60,70,.18)
        );
}
.cap-part{
    fill:#fffefb;
    stroke:#151515;
    stroke-width:4;
    transition:
        fill .45s ease,
        filter .45s ease;
}
.cap-part.correct-area{
    fill:#9be77a;
    filter:
        drop-shadow(
            0 0 12px rgba(72,185,91,.35)
        );
}
.cap-number{
    font-size:30px;
    font-weight:600;
    fill:#2f4f4f;
    pointer-events:none;
    transition:
        fill .4s ease;
}
.cap-number.correct-number{
    fill:#087132;
}
.scan-line{
    position:absolute;
    left:10%;
    right:10%;
    top:50%;
    height:4px;
    border-radius:20px;
    opacity:0;
    background:
        linear-gradient(
            90deg,
            transparent,
            #55ce75,
            transparent
        );
    box-shadow:
        0 0 18px #55ce75;
    pointer-events:none;
}
.cap-container.scanning .scan-line{
    animation:scanCap .9s ease-in-out 2;
}
@keyframes scanCap{
    0%{
        top:15%;
        opacity:0;
    }
    25%,
    75%{
        opacity:1;
    }
    100%{
        top:85%;
        opacity:0;
    }
}
.question-label{
    position:absolute;
    left:5%;
    top:15%;
    font-size:40px;
    font-weight:500;
    color:#111;
}
.scanner-panel{
    width:min(31vw,470px);
    min-width:330px;
    padding:26px 28px 24px;
    border-radius:34px;
    background:
        rgba(255,255,255,.58);
    border:
        1px solid rgba(255,255,255,.85);
    box-shadow:
        0 15px 35px rgba(55,70,90,.10);
    text-align:center;
    z-index:5;
}
.panel-title{
    font-size:22px;
    font-weight:400;
    letter-spacing:1.5px;
    color:#2f4f4f;
    margin-bottom:20px;
}
.number-grid{
    display:grid;
    grid-template-columns:
        1fr 1fr;
    gap:18px;
}
.number-btn{
    height:82px;
    border:
        2px solid #78909a;
    border-radius:23px;
    background:
        rgba(249,251,252,.92);
    color:#405365;
    font-size:22px;
    font-weight:500;
    cursor:pointer;
    box-shadow:
        0 8px 0 rgba(80,100,110,.14);
    transition:.18s;
}
.number-btn:hover:not(:disabled){
    transform:
        translateY(-3px);
}
.number-btn.selected{
    background:#dbe8eb;
    border-color:#405365;
}
.number-btn.correct{
    background:#91df75;
    border-color:#238f50;
    color:#087132;
    box-shadow:
        0 8px 0 #238f50;
}
.number-btn.wrong{
    background:#f46a6d;
    border-color:#c83d42;
    color:white;
    box-shadow:
        0 8px 0 #b83237;
}
.number-btn:disabled{
    cursor:default;
}
.panel-hint{
    margin-top:22px;
    font-size:18px;
    line-height:1.35;
    font-weight:600;
    color:#60717a;
}
.bottom-nav{position:absolute;left:0;right:0;bottom:20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(38px,4vw,75px);z-index:20}
.nav-btn{width:178px;height:45px;min-width:178px;padding:0;border:none;border-radius:35px;background:#e67e22;color:#fff;font-size:20px;font-weight:500;cursor:pointer;box-shadow:0 6px #d35400;transition:.1s;line-height:45px}
.nav-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px #d35400}
.nav-btn:disabled{background:#b2bec3;box-shadow:0 6px #7f8c8d;cursor:not-allowed}
#prevBtn{justify-self:start}#nextBtn{justify-self:end}
.submit-btn{background:#00b894;box-shadow:0 6px #008f72}
.submit-btn:active:not(:disabled){box-shadow:0 2px #008f72}
/* EXACT NUMBER NAME QUEST POPUP */
.popup-overlay{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:100;
}
.popup-overlay.active{opacity:1;pointer-events:auto}

.popup-card{
    position:relative;
    width:520px;
    height:300px;
    max-width:calc(100vw - 30px);
    padding:30px;
    border-radius:36px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.1);
    transform:scale(.8);
    transition:.35s cubic-bezier(.175,.885,.32,1.275);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.popup-card:before,
.popup-card:after{
    content:'';
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}
.popup-card:before{
    width:220px;
    height:220px;
    top:-60px;
    right:-50px;
}
.popup-card:after{
    width:180px;
    height:180px;
    bottom:-70px;
    left:-40px;
}

.popup-card.correct{
    background:#edfbf4;
    border:6px solid #00c885;
}
.popup-card.correct:before,
.popup-card.correct:after{
    background:rgba(162,245,209,.45);
}
.popup-card.correct .popup-title{color:#00a86b}
.popup-card.correct .popup-subtitle{color:#2e7d5b}

.popup-card.wrong{
    background:#fff0f2;
    border:6px solid #ff6b7a;
}
.popup-card.wrong:before,
.popup-card.wrong:after{
    background:rgba(255,196,203,.45);
}
.popup-card.wrong .popup-title{color:#d33847}
.popup-card.wrong .popup-subtitle{color:#a33b45}

.popup-card.complete{
    background:#f0f3ff;
    border:6px solid #6c5ce7;
}
.popup-card.complete:before,
.popup-card.complete:after{
    background:rgba(162,155,254,.35);
}
.popup-card.complete .popup-title{color:#6c5ce7}
.popup-card.complete .popup-subtitle{color:#4834d4}

.popup-overlay.active .popup-card{transform:scale(1)}

.popup-icon{
    font-size:4.8rem;
    margin-bottom:12px;
    z-index:2;
    line-height:1;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.1));
}
.popup-title{
    font-size:3rem;
    font-weight:600;
    margin-bottom:8px;
    z-index:2;
}
.popup-subtitle{
    font-size:1.4rem;
    font-weight:500;
    z-index:2;
}

/* EXACT NUMBER NAME QUEST PLAY AGAIN */
.replay-btn{
    background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%) !important;
    box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22) !important;
    width:185px !important;
    min-width:185px !important;
    height:46px !important;
    padding:0 20px !important;
    margin-top:14px !important;
    font-size:22px !important;
    font-weight:600 !important;
    line-height:46px !important;
    border-radius:23px !important;
    border:2px solid rgba(255,255,255,.35) !important;
    letter-spacing:.2px;
    transition:transform .12s ease,box-shadow .12s ease;
    color:#fff;
}
.replay-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26) !important;
}
.replay-btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18) !important;
}

/* EXACT FINAL POPUP FINISH */
.popup-card.complete{
    box-shadow:
        0 20px 45px rgba(108,92,231,.18),
        0 0 0 8px rgba(162,155,254,.12);
}
.popup-card.complete .replay-btn{margin-top:14px !important}
.popup-card.complete .popup-icon{
    animation:finalTrophyBounce 1.2s ease-in-out infinite;
}
@keyframes finalTrophyBounce{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}

@media(min-width:1500px){
    .main-heading{
        font-size:30px;
    }
    .instruction{
        font-size:25px;
    }
    .game-area{
        max-width:1700px;
        margin:0 auto;
        padding:0 40px;
        gap:70px;
    }
    .cap-section{
        width:min(50vw,760px);
    }
    .cap-container{
        width:min(42vw,600px);
        max-height:460px;
    }
    .scanner-circle{
        width:min(40vw,540px);
        height:min(40vw,540px);
    }
    .scanner-panel{
        width:min(30vw,450px);
        min-width:0;
    }
    .bottom-nav{
        padding:0 70px;
    }
    .nav-btn{
        width:200px;
        min-width:200px;
        height:60px;
        padding:0;
        font-size:30px;
        border-radius:50px;
        line-height:60px;
    }
}
@media(max-width:1200px){
    .game-area{
        gap:35px;
        padding:0 4vw;
    }
    .cap-section{
        width:50vw;
    }
    .scanner-panel{
        min-width:300px;
        padding:22px;
    }
    .number-btn{
        height:70px;
        font-size:30px;
    }
}
@media(max-height:720px) and (min-width:761px){
    .main-heading{
        top:5px;
    }
    .instruction{
        top:48px;
        font-size:18px;
    }
    .game-area{
        top:85px;
        bottom:72px;
    }
    .cap-section{
        height:52vh;
    }
    .cap-container{
        max-height:390px;
    }
    .scanner-panel{
        padding:18px;
    }
    .number-btn{
        height:62px;
    }
    .panel-hint{
        margin-top:15px;
        font-size:16px;
    }
}
@media(max-width:760px){
    html,
    body{
        overflow:auto;
    }
    .quiz-page{
        height:auto;
        min-height:100vh;
        padding-bottom:95px;
    }
    .home-btn{
        width:58px;
        height:58px;
        font-size:24px;
        top:10px;
        left:10px;
    }
    .main-heading{
        position:relative;
        top:auto;
        left:auto;
        transform:none;
        width:80%;
        margin:
            12px auto 0;
        font-size:18px;
    }
    .instruction{
        position:relative;
        top:auto;
        left:auto;
        transform:none;
        width:90%;
        margin:
            14px auto 10px;
        font-size:16px;
    }
    .game-area{
        position:relative;
        top:auto;
        bottom:auto;
        flex-direction:column;
        padding:
            15px 12px 25px;
        gap:22px;
    }
    .cap-section{
        width:95vw;
        height:380px;
    }
    .cap-container{
        width:94vw;
    }
    .scanner-circle{
        width:90vw;
        height:340px;
    }
    .scanner-panel{
        width:94vw;
        min-width:0;
    }
    .bottom-nav{
        position:fixed;
        bottom:10px;
        padding:0 8px;
    }
    .nav-btn{
        width:30vw;
        max-width:178px;
        height:43px;
        font-size:16px;
    }
    .popup-card{
        min-height:330px;
        padding:
            50px 20px 35px;
    }
    .popup-card h2{
        font-size:32px;
    }
    .popup-card p{
        font-size:19px;
    }
}

/* EXACT SAME CONFETTI */
#confettiContainer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2000}
.confetti-piece{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;will-change:transform,opacity}
.final-confetti-piece{width:10px;height:16px;animation-duration:2300ms}
.final-confetti-piece:nth-child(3n){border-radius:50%}
.final-confetti-piece:nth-child(4n){width:7px;height:19px;border-radius:1px}
.final-confetti-piece:nth-child(5n){width:13px;height:8px;border-radius:2px}
@keyframes pageConfetti{0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg) scale(1)}55%{opacity:1}100%{opacity:0;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72)}}
.popup-card.complete{box-shadow:0 20px 45px rgba(108,92,231,.18),0 0 0 8px rgba(162,155,254,.12)}
.popup-card.complete .replay-btn{margin-top:12px}
.popup-card.complete .popup-icon{animation:finalTrophyBounce 1.2s ease-in-out infinite}
@keyframes finalTrophyBounce{0%,100%{transform:translateY(0) rotate(0deg) scale(1)}50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}}

    }
    .popup-overlay .popup-title,
    .popup-overlay h2.popup-title{font-size:2.2rem !important}
    .popup-overlay .popup-subtitle,
    .popup-overlay p.popup-subtitle{font-size:1.1rem !important}
    .popup-overlay .popup-icon{font-size:3.6rem !important}
}

</style>
</head>
<body>
<div class="quiz-page">
   
    </button>
    <div class="main-heading">

<div

<div class="popup-overlay" id="popupOverlay">
    <div class="popup-card" id="popupCard">
        <div class="popup-icon" id="popupIcon">⭐</div>
        <h2 class="popup-title" id="popupTitle">Amazing!</h2>
        <p class="popup-subtitle" id="popupMessage">You got it right! ✨</p>
        <button class="nav-btn replay-btn" id="playAgainBtn" style="display:none" onclick="restartGame()">Play Again</button>
    </div>

<script>
const questions = [
    {
        numbers:[12,21,31,13],
        answer:12,
        correctPart:0
    },
    {
        numbers:[67,54,76,45],
        answer:45,
        correctPart:2
    },
    {
        numbers:[79,97,19,99],
        answer:19,
        correctPart:3
    }
];
let currentQuestion = 0;
let selectedAnswer = null;
let solved = false;
const questionState = questions.map(() => ({ solved:false }));
let popupTimer = null;
const numberGrid = document.getElementById("numberGrid");
const submitBtn = document.getElementById("submitBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const questionLetter = document.getElementById("questionLetter");
const capContainer = document.getElementById("capContainer");
const popupOverlay = document.getElementById("popupOverlay");
const popupCard = document.getElementById("popupCard");
const popupIcon = document.getElementById("popupIcon");
const popupTitle = document.getElementById("popupTitle");
const popupMessage = document.getElementById("popupMessage");
const playAgainBtn = document.getElementById("playAgainBtn");
const capNumberElements = [
    document.getElementById("num0"),
    document.getElementById("num1"),
    document.getElementById("num2"),
    document.getElementById("num3")
];

function showSmallConfetti(isFinal=false){
    const confettiContainer=document.getElementById("confettiContainer");
    if(!confettiContainer)return;
    confettiContainer.innerHTML="";
    const count=isFinal?95:42;
    const colors=["#00b894","#e67e22","#6c5ce7","#0984e3","#fdcb6e","#ff6b7a","#00cec9","#a29bfe"];
    for(let i=0;i<count;i++){
        const piece=document.createElement("span");
        piece.className=isFinal?"confetti-piece final-confetti-piece":"confetti-piece";
        const startX=Math.random()*100;
        const startY=-8+Math.random()*10;
        const drift=(Math.random()*520-260)*(isFinal?1.15:.9);
        const fall=window.innerHeight*(.82+Math.random()*.48);
        const rotation=Math.random()*1400-700;
        piece.style.left=startX+"%"; piece.style.top=startY+"%";
        piece.style.setProperty("--x",drift+"px"); piece.style.setProperty("--y",fall+"px"); piece.style.setProperty("--r",rotation+"deg");
        piece.style.background=colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDelay=(Math.random()*(isFinal?500:220))+"ms";
        confettiContainer.appendChild(piece);
        setTimeout(()=>piece.remove(),isFinal?2900:2050);
    }
}

function speak(text){
    if(!("speechSynthesis" in window)){
        return;
    }
    speechSynthesis.cancel();
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    speech.rate = 0.95;
    speech.pitch = 1;
    speech.volume = 1;
    speechSynthesis.speak(speech);
}
function playTone(isCorrect){
    const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;
    if(!AudioContextClass){
        return;
    }
    const context = new AudioContextClass();
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    oscillator.connect(gain);
    gain.connect(context.destination);
    if(isCorrect){
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(
            600,
            context.currentTime
        );
        oscillator.frequency.exponentialRampToValueAtTime(
            900,
            context.currentTime + .25
        );
    }else{
        oscillator.type = "sawtooth";
        oscillator.frequency.setValueAtTime(
            200,
            context.currentTime
        );
        oscillator.frequency.linearRampToValueAtTime(
            120,
            context.currentTime + .25
        );
    }
    gain.gain.setValueAtTime(
        .18,
        context.currentTime
    );
    gain.gain.exponentialRampToValueAtTime(
        .01,
        context.currentTime + .3
    );
    oscillator.start();
    oscillator.stop(
        context.currentTime + .32
    );
}
function renderQuestion(){
    const question = questions[currentQuestion];
    const state = questionState[currentQuestion];
    selectedAnswer = null;
    solved = state.solved;
    document.querySelectorAll(".cap-part").forEach(part => part.classList.remove("correct-area"));
    document.querySelectorAll(".cap-number").forEach(number => number.classList.remove("correct-number"));
    capContainer.classList.remove("scanning");
    capNumberElements[0].textContent = question.numbers[0];
    capNumberElements[1].textContent = question.numbers[1];
    capNumberElements[2].textContent = question.numbers[3];
    capNumberElements[3].textContent = question.numbers[2];
    numberGrid.innerHTML = "";
    question.numbers.forEach(number => {
        const button = document.createElement("button");
        button.className = "number-btn";
        button.textContent = number;
        button.addEventListener("click", () => selectNumber(number,button));
        numberGrid.appendChild(button);
    });
    if(state.solved){
        const buttons = [...document.querySelectorAll(".number-btn")];
        buttons.forEach(button => button.disabled = true);
        const correctButton = buttons.find(button => Number(button.textContent) === question.answer);
        if(correctButton) correctButton.classList.add("correct");
        const correctPart = document.getElementById("part" + question.correctPart);
        if(correctPart) correctPart.classList.add("correct-area");
        const map = [0,1,2,3];
        capNumberElements[map[question.correctPart]].classList.add("correct-number");
    }
    prevBtn.disabled = currentQuestion === 0;
    submitBtn.disabled = state.solved;
    nextBtn.disabled = !state.solved || currentQuestion === questions.length - 1;
}
function selectNumber(number,button){
    if(solved){
        return;
    }
    selectedAnswer =
    number;
    document
    .querySelectorAll(".number-btn")
    .forEach(item => {
        item.classList.remove(
            "selected"
        );
    });
    button.classList.add(
        "selected"
    );
    submitBtn.disabled = false;
}
function checkAnswer(){
    if(selectedAnswer === null){
        return;
    }
    const question = questions[currentQuestion];
    const selectedButton =
    [...document.querySelectorAll(".number-btn")]
    .find(button => {
        return Number(
            button.textContent
        ) === selectedAnswer;
    });
    if(selectedAnswer === question.answer){
        correctAnswer();
    }else{
        wrongAnswer(
            selectedButton
        );
    }
}
function correctAnswer(){
    const question = questions[currentQuestion];
    solved = true;
    questionState[currentQuestion].solved = true;
    const buttons =
    document.querySelectorAll(
        ".number-btn"
    );
    buttons.forEach(button => {
        button.disabled = true;
    });
    const correctButton =
    [...buttons].find(button => {
        return Number(
            button.textContent
        ) === question.answer;
    });
    correctButton.classList.remove(
        "selected"
    );
    correctButton.classList.add(
        "correct"
    );
    submitBtn.disabled = true;
    nextBtn.disabled = currentQuestion === questions.length - 1;
    const correctPart =
    document.getElementById(
        "part" + question.correctPart
    );
    correctPart.classList.add(
        "correct-area"
    );
    let correctNumberElement;
    if(question.correctPart === 0){
        correctNumberElement =
        capNumberElements[0];
    }
    else if(question.correctPart === 1){
        correctNumberElement =
        capNumberElements[1];
    }
    else if(question.correctPart === 2){
        correctNumberElement =
        capNumberElements[2];
    }
    else{
        correctNumberElement =
        capNumberElements[3];
    }
    correctNumberElement.classList.add(
        "correct-number"
    );
    capContainer.classList.add(
        "scanning"
    );
    playTone(true);
    speak(
        "Correct!"
    );
    showSmallConfetti(false);
    setTimeout(() => {
        if(
            currentQuestion ===
            questions.length - 1
        ){
            showFinalPopup();
            setTimeout(() => showSmallConfetti(true),350);
        }
        else{
            showCorrectPopup();
        }
    },900);
}
function wrongAnswer(button){
    button.classList.remove(
        "selected"
    );
    button.classList.add(
        "wrong"
    );
    playTone(false);
    speak(
        "Try again"
    );
    showWrongPopup();
    setTimeout(() => {
        button.classList.remove(
            "wrong"
        );
        selectedAnswer = null;
        submitBtn.disabled = true;
    },700);
}
function showPopup(status,icon,title,message,isFinal=false){
    clearTimeout(popupTimer);
    popupCard.className = `popup-card ${status}`;
    popupIcon.textContent = icon;
    popupTitle.textContent = title;
    popupMessage.textContent = message;
    playAgainBtn.style.display = isFinal ? "inline-block" : "none";
    popupOverlay.classList.add("active");
    if(!isFinal){
        popupTimer = setTimeout(() => popupOverlay.classList.remove("active"), 1800);
    }
}
function showCorrectPopup(){
    showPopup("correct","🌟","Amazing!","You got it right! ✨",false);
}
function showWrongPopup(){
    showPopup("wrong","😟","Keep Going!","Try again, you can do it! 🌈",false);
}
function showFinalPopup(){
    showPopup("complete","🏆","Congratulations!","Fantastic job! You solved all questions! 🎉",true);
}
function nextQuestion(){
    if(!questionState[currentQuestion].solved){
        return;
    }
    if(
        currentQuestion >=
        questions.length - 1
    ){
        return;
    }
    currentQuestion++;
    renderQuestion();
}
function previousQuestion(){
    if(currentQuestion === 0){
        return;
    }
    currentQuestion--;
    renderQuestion();
}
function restartGame(){
    popupOverlay.classList.remove(
        "active"
    );
    clearTimeout(popupTimer);
    const confettiContainer=document.getElementById("confettiContainer");
    if(confettiContainer) confettiContainer.innerHTML="";
    questionState.forEach(state => state.solved = false);
    currentQuestion = 0;
    selectedAnswer = null;
    solved = false;
    renderQuestion();
}
function goHome(){
    window.location.href =
    "../index.html";
}
renderQuestion();
</script>
