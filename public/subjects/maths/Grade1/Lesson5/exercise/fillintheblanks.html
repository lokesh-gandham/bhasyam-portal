<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Number Formation Quest</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Livvic',sans-serif;
}

:root{
  --ink:#2f4f4f;
  --orange:#e67e22;
  --orange-dark:#d35400;
  --green:#00b894;
  --green-dark:#008f72;
  --blue:#5b9bd5;
}

/* ===============================
   PAGE
================================ */

body{
  height:100vh;
  min-height:100vh;
  width:100vw;
  overflow:hidden;
  color:var(--ink);


  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;

  padding:8px 16px 10px;
}

/* Background decoration */



/* ===============================
   HOME BUTTON
================================ */

.home-btn{
  position:fixed;
  top:12px;
  left:18px;

  width:62px;
  height:62px;

  border:none;
  border-radius:50%;

  background:rgba(255,255,255,.82);
  color:#2f4f4f;

  font-size:26px;

  box-shadow:
    0 8px 22px rgba(0,0,0,.10);

  z-index:30;
  cursor:pointer;
}


/* ===============================
   HEADER
================================ */

header{
  text-align:center;
  position:relative;
  z-index:5;
}

h1{
  font-size:22px;
  font-weight:400;
  color:#2f4f4f;
  line-height:1.2;
  margin:5px 0 8px;
}

.instruction{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  max-width:94vw;

  padding:7px 24px;

  border-radius:999px;

  font-size:20px;
  font-weight:200;

  color:#55656d;
}


/* ===============================
   MAIN GAME AREA
================================ */

.game-stage{
  width:min(1500px,96vw);
  min-height:0;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
  z-index:2;

  overflow:auto;
  padding:10px 0;
}

.quest-shell{
  width:100%;
  height:100%;
  min-height:0;

  display:grid;

  grid-template-columns:
    minmax(0,1.45fr)
    minmax(300px,.75fr);

  gap:clamp(18px,3vw,40px);

  align-items:center;
}


/* ===============================
   QUESTION PANEL
================================ */

.build-zone{
  min-height:0;

  padding:clamp(18px,2.4vw,34px);

  border-radius:34px;

  background:
    rgba(255,255,255,.70);

  border:
    3px solid rgba(255,255,255,.92);

  box-shadow:
    0 14px 0 rgba(125,151,177,.15),
    0 20px 40px rgba(41,66,109,.08);

  position:relative;
  overflow:hidden;
}


/* ===============================
   QUESTION
================================ */

.question-row{
  margin-top:12px;

  font-size:
    30px;

  line-height:1.35;

  

  color:#2f4f4f;

  text-align:left;
}

.question-letter{
  display:inline-flex;

  width:42px;
  height:42px;

  border-radius:50%;

  align-items:center;
  justify-content:center;

  margin-right:10px;

  background:#fff3d6;

  color:#d87915;

  font-weight:500;

  box-shadow:
    0 5px 0 rgba(216,121,21,.18);
}


/* ===============================
   TENS / ONES
================================ */

.place-track{
  margin:28px 0 22px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:18px;
}

.place-card{
  min-height:112px;

  border-radius:26px;

  padding:14px;

  display:flex;
  align-items:center;

  gap:14px;

  border:
    3px solid rgba(255,255,255,.95);

  box-shadow:
    0 8px 0 rgba(41,66,109,.10);
}

.place-card.tens{
  background:
    linear-gradient(
      135deg,
      #dff3ff,
      #dcecff
    );
}

.place-card.ones{
  background:
    linear-gradient(
      135deg,
      #fff0d8,
      #fff8e8
    );
}

.place-label{
  font-size:16px;
  font-weight:500;

  letter-spacing:2px;

  color:#52636c;
}

.digit-orb{
  width:70px;
  height:70px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  flex:0 0 auto;

  font-size:38px;
  font-weight:500;

  color:white;

  box-shadow:
    0 8px 0 rgba(0,0,0,.12);
}

.tens .digit-orb{
  background:
    linear-gradient(
      145deg,
      #4d97d9,
      #376fae
    );
}

.ones .digit-orb{
  background:
    linear-gradient(
      145deg,
      #ffb463,
      #ee8730
    );
}


/* ===============================
   ANSWERS
================================ */

.answer-stack{
  display:grid;
  gap:16px;
}

.answer-line{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    178px;

  gap:16px;

  align-items:center;

  padding:14px 16px;

  border-radius:22px;

  background:
    rgba(247,250,252,.82);

  border:
    2px solid rgba(116,145,166,.15);
}

.answer-label{
  font-size:
    clamp(18px,1.65vw,23px);

  font-weight:600;

  color:#40535c;
}

.answer-input{
  width:178px;
  height:45px;

  border-radius:12px;

  border:
    2px solid #f2a45e;

  background:white;

  color:#2f4f4f;

  font-size:22px;
  font-weight:500;

  text-align:center;

  outline:none;

  padding:0 10px;

  transition:.18s ease;
    position: relative;
  z-index: 20;
  pointer-events: auto;
}

.answer-input:focus{
  transform:translateY(-2px);

  border-color:#e67e22;

  box-shadow:
    0 5px 0 rgba(230,126,34,.18);
}

.answer-input.locked{
  border-color:#00b894;

  background:#effcf7;

  color:#008f72;

  box-shadow:
    0 5px 0 rgba(0,184,148,.20);
}

.answer-input:disabled{
  cursor:not-allowed;
  opacity:1;
}


/* ===============================
   IMAGE PANEL
================================ */

.visual-zone{
  min-height:0;
  height:70%;

  border-radius:36px;

  padding:20px;

  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      155deg,
      rgba(214,240,235,.95),
      rgba(239,247,255,.92)
    );

  border:
    3px solid rgba(255,255,255,.95);

  box-shadow:
    0 14px 0 rgba(125,151,177,.12),
    0 20px 40px rgba(41,66,109,.07);

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;
}


.visual-image{
  width:100%;

  max-height:290px;

  object-fit:contain;

  position:relative;

  z-index:2;

  display:none;
}

.visual-image.loaded{
  display:block;
}


/* ===============================
   IMAGE FALLBACK
================================ */

.fallback-illustration{
  position:relative;

  z-index:2;

  width:250px;
  height:250px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

  align-items:center;
}

.fallback-digit{
  height:108px;

  border-radius:28px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:58px;
  font-weight:500;

  color:white;

  box-shadow:
    0 10px 0 rgba(41,66,109,.12);
}

.fallback-digit:first-child{
  background:
    linear-gradient(
      145deg,
      #4d97d9,
      #376fae
    );
}

.fallback-digit:last-child{
  background:
    linear-gradient(
      145deg,
      #ffb463,
      #ee8730
    );
}

.visual-caption{
  position:relative;

  z-index:2;

  margin-top:16px;

  font-size:18px;

  font-weight:500;

  text-align:center;

  color:#52636c;
}


/* ===============================
   BOTTOM CONTROLS
================================ */

.bottom-controls{
  width:min(96vw,1500px);

  display:grid;

  grid-template-columns:
    1fr auto 1fr;

  align-items:center;

  padding:8px 0 10px;

  gap:20px;

  position:relative;

  z-index:50;

  flex-shrink:0;
}

.left-control{
  justify-self:start;
}

.center-control{
  justify-self:center;
}

.right-control{
  justify-self:end;
}


/* ===============================
   BUTTONS
================================ */

.nav-btn,
.submit-btn,
.replay-btn{
  width:178px;
  height:45px;

  min-width:178px;

  padding:0;

  border:none;

  border-radius:28px;

  color:white;

  font-size:20px;

  font-weight:500;

  cursor:pointer;

  transition:.12s ease;

  font-family:'Livvic',sans-serif;

  line-height:45px;
}

.nav-btn.prev{
  background:#b2bec3;

  box-shadow:
    0 6px 0 #636e72;
}

.nav-btn.next{
  background:#e67e22;

  box-shadow:
    0 6px 0 #d35400;
}

.submit-btn{
  background:#00b894;

  box-shadow:
    0 6px 0 #008f72;
}

 .replay-btn{
  background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%);
  box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22);
  width:185px;min-width:185px;height:46px;padding:0 20px;margin-top:14px;
  font-size:22px;font-weight:600;line-height:46px;border-radius:23px;
  border:2px solid rgba(255,255,255,.35);letter-spacing:.2px;
  transition:transform .12s ease,box-shadow .12s ease;
}
.replay-btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26)}
.replay-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18)}

.nav-btn:active:not(:disabled),
.submit-btn:active:not(:disabled),
.replay-btn:active{
  transform:translateY(4px);
}

.nav-btn:disabled,
.submit-btn:disabled{
  background:#b2bec3;

  box-shadow:
    0 6px 0 #636e72;

  opacity:.7;

  cursor:not-allowed;
}


/* ===============================
   POPUP
================================ */


/* EXACT SAME CONFETTI */
#confettiContainer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2000;}
.confetti-piece{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;will-change:transform,opacity;}
.final-confetti-piece{width:10px;height:16px;animation-duration:2300ms;}
.final-confetti-piece:nth-child(3n){border-radius:50%;}
.final-confetti-piece:nth-child(4n){width:7px;height:19px;border-radius:1px;}
.final-confetti-piece:nth-child(5n){width:13px;height:8px;border-radius:2px;}
@keyframes pageConfetti{
0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg) scale(1);}
55%{opacity:1;}
100%{opacity:0;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72);}
}

.popup-overlay{
  position:fixed;

  inset:0;


  display:flex;

  justify-content:center;
  align-items:center;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .3s ease;

  z-index:100;
}

.popup-overlay.active{
  opacity:1;
  pointer-events:auto;
}

.popup-card{
  position:relative;

  width:520px;

  height:300px;

  max-width:calc(100vw - 30px);

  padding:30px;

  border-radius:36px;

  text-align:center;

  box-shadow:
    0 20px 40px rgba(0,0,0,.1);

  transform:scale(.8);

  transition:
    transform .35s cubic-bezier(
      .175,.885,.32,1.275
    );

  overflow:hidden;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;
}

.popup-card:before,
.popup-card:after{
  content:"";

  position:absolute;

  border-radius:50%;

  pointer-events:none;
}

.popup-card:before{
  width:220px;
  height:220px;

  top:-60px;
  right:-50px;
}

.popup-card:after{
  width:180px;
  height:180px;

  bottom:-70px;
  left:-40px;
}


/* CORRECT */

.popup-card.correct{
  background:#edfbf4;

  border:
    6px solid #00c885;
}

.popup-card.correct:before,
.popup-card.correct:after{
  background:
    rgba(162,245,209,.45);
}

.popup-card.correct .popup-title{
  color:#00a86b;
}

.popup-card.correct .popup-subtitle{
  color:#2e7d5b;
}


/* WRONG */

.popup-card.wrong{
  background:#fff0f2;

  border:
    6px solid #ff6b7a;
}

.popup-card.wrong:before,
.popup-card.wrong:after{
  background:
    rgba(255,196,203,.45);
}

.popup-card.wrong .popup-title{
  color:#d33847;
}

.popup-card.wrong .popup-subtitle{
  color:#a33b45;
}


/* COMPLETE */

.popup-card.complete{
  background:#f0f3ff;

  border:
    6px solid #6c5ce7;
}

.popup-card.complete:before,
.popup-card.complete:after{
  background:
    rgba(162,155,254,.35);
}

.popup-card.complete .popup-title{
  color:#6c5ce7;
}

.popup-card.complete .popup-subtitle{
  color:#4834d4;
}

.popup-overlay.active .popup-card{
  transform:scale(1);
}

.popup-icon{
  font-size:4.8rem;

  margin-bottom:12px;

  z-index:2;

  line-height:1;

  filter:
    drop-shadow(
      0 6px 10px rgba(0,0,0,.1)
    );
}

.popup-title{
  font-size:3rem;

  font-weight:600;

  margin-bottom:8px;

  z-index:2;
}

.popup-subtitle{
  font-size:1.4rem;

  font-weight:500;

  z-index:2;

  display:flex;

  align-items:center;
  justify-content:center;
}


/* EXACT NUMBER NAME QUEST FINAL POPUP */
.popup-card.complete{
  box-shadow:
    0 20px 45px rgba(108,92,231,.18),
    0 0 0 8px rgba(162,155,254,.12);
}
.popup-card.complete .replay-btn{margin-top:14px}
.popup-card.complete .popup-icon{
  animation:finalTrophyBounce 1.2s ease-in-out infinite;
}
@keyframes finalTrophyBounce{
  0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
  50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}

/* ===============================
   LARGE MONITOR
================================ */

@media(min-width:1600px){

  h1{
    font-size:30px;
  }

  .instruction{
    font-size:25px;
  }

}


/* ===============================
   SHORT LAPTOP HEIGHT
================================ */

@media(max-height:850px) and (min-width:851px){

  header h1{
    margin:2px 0 5px;
  }

  .instruction{
    padding:5px 20px;
  }

  .game-stage{
    padding:6px 0;
  }

  .build-zone{
    padding:18px 24px;
  }

  .place-track{
    margin:16px 0;
  }

  .place-card{
    min-height:90px;
  }

  .digit-orb{
    width:60px;
    height:60px;

    font-size:34px;
  }

  .answer-stack{
    gap:10px;
  }

  .answer-line{
    padding:9px 14px;
  }

  .visual-zone{
    padding:15px;
  }

  .visual-image{
    max-height:190px;
  }

  .bottom-controls{
    padding:5px 0 8px;
  }

}


/* ===============================
   TABLET / MOBILE
================================ */

@media(max-width:850px){

  body{
    height:auto;
    min-height:100vh;
    overflow:auto;

    display:flex;
    flex-direction:column;
  }

  .home-btn{
    width:48px;
    height:48px;

    font-size:20px;
  }

  .game-stage{
    width:100%;

    overflow:visible;
  }

  .quest-shell{
    height:auto;

    grid-template-columns:1fr;
  }

  .visual-zone{
    min-height:230px;
  }

  .build-zone{
    min-height:auto;
  }

  .place-track{
    gap:10px;
  }

  .answer-line{
    grid-template-columns:1fr;
  }

  .answer-input{
    width:100%;
  }

  .bottom-controls{
    position:sticky;

    bottom:0;

    background:
      rgba(255,255,255,.78);

    backdrop-filter:
      blur(8px);
  }

}


@media(max-width:560px){

  body{
    padding:8px;
  }

  h1{
    font-size:19px;
    padding:0 50px;
  }

  .instruction{
    font-size:15px;

    padding:7px 12px;

    border-radius:20px;
  }

  .place-track{
    grid-template-columns:1fr;
  }

  .digit-orb{
    width:58px;
    height:58px;

    font-size:32px;
  }

  .place-label{
    font-size:12px;
  }

  .bottom-controls{
    gap:6px;
  }

  .nav-btn,
  .submit-btn,
  .replay-btn{
    width:30vw;

    min-width:0;

    height:42px;

    font-size:15px;

    line-height:42px;
  }

  .popup-title{
    font-size:2.4rem;
  }

}


.question-row b{
  font-weight:500;
}

@media screen and (min-width:1600px){
  h1{font-size:30px;}
  .instruction{font-size:22px;}
  .game-stage{width:min(1700px,94vw);padding:10px 0;}
  .quest-shell{
    grid-template-columns:minmax(0,1.45fr) minmax(480px,.75fr);
    gap:55px;
  }
  .build-zone{padding:28px 34px;}
  .visual-zone{height:78%;padding:24px;}
  .question-row{font-size:30px;}
  .bottom-controls{
    width:min(1500px,94vw);
    margin-left:auto;
    margin-right:auto;
  }
  .nav-btn,.submit-btn,.replay-btn{
    width:200px;
    min-width:200px;
    height:60px;
    padding:0;
    font-size:30px;
    border-radius:50px;
    line-height:60px;
  }
}

/* ===== CHAPTER 5: UNIFIED FINAL POPUP ===== */
.popup-overlay{
    position:fixed !important;
    inset:0 !important;
    display:flex !important;
    justify-content:center !important;
    align-items:center !important;
    background:transparent !important;
    opacity:0 !important;
    pointer-events:none !important;
    transition:opacity .3s ease,background .3s ease !important;
    z-index:1000 !important;
}
.popup-overlay.active{
    opacity:1 !important;
    pointer-events:auto !important;
    background:transparent !important;
}
.popup-overlay.active .popup-card{transform:scale(1) !important}
.popup-overlay .popup-card{
    position:relative !important;
    width:520px !important;
    height:300px !important;
    max-width:calc(100vw - 30px) !important;
    padding:30px !important;
    border-radius:36px !important;
    text-align:center !important;
    transform:scale(.8) !important;
    transition:transform .35s cubic-bezier(.175,.885,.32,1.275) !important;
    overflow:hidden !important;
    display:flex !important;
    flex-direction:column !important;
    align-items:center !important;
    justify-content:center !important;
    margin:0 !important;
}
.popup-overlay .popup-card::before,
.popup-overlay .popup-card::after{
    content:'' !important;
    position:absolute !important;
    border-radius:50% !important;
    pointer-events:none !important;
}
.popup-overlay .popup-card::before{width:220px !important;height:220px !important;top:-60px !important;right:-50px !important}
.popup-overlay .popup-card::after{width:180px !important;height:180px !important;bottom:-70px !important;left:-40px !important}
.popup-overlay .popup-card.correct{background:#edfbf4 !important;border:6px solid #00c885 !important}
.popup-overlay .popup-card.correct::before,
.popup-overlay .popup-card.correct::after{background:rgba(162,245,209,.45) !important}
.popup-overlay .popup-card.correct .popup-title{color:#00a86b !important}
.popup-overlay .popup-card.correct .popup-subtitle{color:#2e7d5b !important}
.popup-overlay .popup-card.wrong{background:#fff0f2 !important;border:6px solid #ff6b7a !important}
.popup-overlay .popup-card.wrong::before,
.popup-overlay .popup-card.wrong::after{background:rgba(255,196,203,.45) !important}
.popup-overlay .popup-card.wrong .popup-title{color:#d33847 !important}
.popup-overlay .popup-card.wrong .popup-subtitle{color:#a33b45 !important}
.popup-overlay .popup-card.complete{
    background:#f0f3ff !important;
    border:6px solid #6c5ce7 !important;
    box-shadow:0 20px 45px rgba(108,92,231,.18),0 0 0 8px rgba(162,155,254,.12) !important;
}
.popup-overlay .popup-card.complete::before,
.popup-overlay .popup-card.complete::after{background:rgba(162,155,254,.35) !important}
.popup-overlay .popup-card.complete .popup-title{color:#6c5ce7 !important}
.popup-overlay .popup-card.complete .popup-subtitle{color:#4834d4 !important}
.popup-overlay .popup-icon{
    font-size:4.8rem !important;
    margin:0 0 12px !important;
    padding:0 !important;
    height:auto !important;
    width:auto !important;
    line-height:1 !important;
    z-index:2 !important;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.1)) !important;
    position:relative !important;
}
.popup-overlay .popup-title,
.popup-overlay h2.popup-title{
    font-size:3rem !important;
    font-weight:600 !important;
    margin:0 0 8px !important;
    padding:0 !important;
    height:auto !important;
    line-height:1.15 !important;
    z-index:2 !important;
    position:relative !important;
}
.popup-overlay .popup-subtitle,
.popup-overlay p.popup-subtitle{
    font-size:1.4rem !important;
    font-weight:500 !important;
    margin:0 !important;
    padding:0 !important;
    height:auto !important;
    line-height:1.35 !important;
    z-index:2 !important;
    text-align:center !important;
    position:relative !important;
}
.popup-overlay .replay-btn,
.popup-overlay #playAgainBtn,
.popup-overlay .replay{
    background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%) !important;
    box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22) !important;
    width:185px !important;
    min-width:185px !important;
    height:46px !important;
    padding:0 20px !important;
    margin-top:14px !important;
    font-size:22px !important;
    font-weight:600 !important;
    line-height:46px !important;
    border-radius:23px !important;
    border:2px solid rgba(255,255,255,.35) !important;
    letter-spacing:.2px !important;
    color:#fff !important;
    cursor:pointer !important;
    z-index:2 !important;
    font-family:'Livvic',sans-serif !important;
    transition:transform .12s ease,box-shadow .12s ease !important;
}
.popup-overlay .replay-btn:hover,
.popup-overlay #playAgainBtn:hover,
.popup-overlay .replay:hover{
    transform:translateY(-2px) !important;
    box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26) !important;
}
.popup-overlay .replay-btn:active,
.popup-overlay #playAgainBtn:active,
.popup-overlay .replay:active{
    transform:translateY(3px) !important;
    box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18) !important;
}
.popup-overlay .popup-card.complete .popup-icon{
    animation:ch5FinalTrophyBounce 1.2s ease-in-out infinite !important;
}
@keyframes ch5FinalTrophyBounce{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}
@media (max-width:520px){
    .popup-overlay .popup-card{
        width:calc(100vw - 24px) !important;
        height:auto !important;
        min-height:260px !important;
        padding:24px 18px !important;
    }
    .popup-overlay .popup-title,
    .popup-overlay h2.popup-title{font-size:2.2rem !important}
    .popup-overlay .popup-subtitle,
    .popup-overlay p.popup-subtitle{font-size:1.1rem !important}
    .popup-overlay .popup-icon{font-size:3.6rem !important}
}

</style>
</head>


<body>



<header>

  <h1>
    Write the number formed and write its number name
  </h1>

  <div class="instruction">
    <i class="fa-solid fa-wand-magic-sparkles"></i>
    Build the number from Tens and Ones, then fill both answer boxes.
  </div>

</header>


<main class="game-stage">

  <section
    class="quest-shell"
    id="questShell">
  </section>

</main>


<!-- BOTTOM BUTTONS -->

<div class="bottom-controls">

  <div class="left-control">

    <button
      class="nav-btn prev"
      id="prevBtn"
      onclick="navigate(-1)">
      PREV
    </button>

  </div>


  <div class="center-control">

    <button
      class="submit-btn"
      id="submitBtn"
      onclick="checkAnswers()"
      disabled>
      SUBMIT
    </button>

  </div>


  <div class="right-control">

    <button
      class="nav-btn next"
      id="nextBtn"
      onclick="navigate(1)"
      disabled>
      NEXT
    </button>

  </div>

</div>


<!-- POPUP -->

<div id="confettiContainer"></div>

<div
  class="popup-overlay"
  id="popup">

  <div
    class="popup-card"
    id="popupCard">

    <div
      class="popup-icon"
      id="popupIcon">
      🌟
    </div>

    <h2
      class="popup-title"
      id="popupTitle">
      Amazing!
    </h2>

    <p
      class="popup-subtitle"
      id="popupSubtitle">
      You got it right! ✨
    </p>

    <button
      class="replay-btn"
      id="playAgainBtn"
      style="display:none"
      onclick="restartGame()">
      Play Again
    </button>

  </div>

</div>


<script>

/* ===============================
   QUESTIONS
================================ */


/* EXACT SAME CONFETTI */
function showSmallConfetti(isFinal=false){
    const confettiContainer=document.getElementById('confettiContainer');
    if(!confettiContainer)return;
    confettiContainer.innerHTML='';
    const count=isFinal?95:42;
    const colors=['#00b894','#e67e22','#6c5ce7','#0984e3','#fdcb6e','#ff6b7a','#00cec9','#a29bfe'];
    for(let i=0;i<count;i++){
        const piece=document.createElement('span');
        piece.className=isFinal?'confetti-piece final-confetti-piece':'confetti-piece';
        const startX=Math.random()*100;
        const startY=-8+Math.random()*10;
        const drift=(Math.random()*520-260)*(isFinal?1.15:.9);
        const fall=window.innerHeight*(.82+Math.random()*.48);
        const rotation=Math.random()*1400-700;
        piece.style.left=startX+'%';
        piece.style.top=startY+'%';
        piece.style.setProperty('--x',drift+'px');
        piece.style.setProperty('--y',fall+'px');
        piece.style.setProperty('--r',rotation+'deg');
        piece.style.background=colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDelay=(Math.random()*(isFinal?500:220))+'ms';
        confettiContainer.appendChild(piece);
        setTimeout(()=>piece.remove(),isFinal?2900:2050);
    }
}

const quizData = [

  {
    label:"a)",
    tens:3,
    ones:8,

    number:"38",

    name:"Thirty Eight",

    image:"../images/kid1.1.png"
  },

  {
    label:"b)",
    tens:6,
    ones:1,

    number:"61",

    name:"Sixty One",

    image:"../images/number-61.png"
  },

  {
    label:"c)",
    tens:4,
    ones:0,

    number:"40",

    name:"Forty",

    image:"../images/number-40.png"
  }

];

let currentIndex = 0;

let popupTimer = null;
let finalPopupTimer = null;

let audioCtx = null;

let cameFromPrev = false;


/* ===============================
   SAVE ANSWERS
================================ */

let quizState = quizData.map(() => ({

  number:"",
  name:"",

  solved:false

}));


const shell =
  document.getElementById("questShell");

const submitBtn =
  document.getElementById("submitBtn");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const playAgainBtn =
  document.getElementById("playAgainBtn");


/* ===============================
   NORMALIZE TEXT
================================ */

function normalizeText(value){

  return value
    .trim()
    .replace(/\s+/g," ")
    .toLowerCase();

}


/* ===============================
   CORRECT / WRONG SOUND
================================ */

function playAudioTone(correct){

  try{

    if(!audioCtx){

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(audioCtx.state === "suspended"){

      audioCtx.resume();

    }


    const osc =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();


    osc.connect(gain);

    gain.connect(
      audioCtx.destination
    );


    if(correct){

      osc.type = "sine";

      osc.frequency.setValueAtTime(
        587.33,
        audioCtx.currentTime
      );

      osc.frequency.exponentialRampToValueAtTime(
        880,
        audioCtx.currentTime + .2
      );

      gain.gain.setValueAtTime(
        .2,
        audioCtx.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        .01,
        audioCtx.currentTime + .3
      );

    }

    else{

      osc.type = "sawtooth";

      osc.frequency.setValueAtTime(
        200,
        audioCtx.currentTime
      );

      osc.frequency.linearRampToValueAtTime(
        120,
        audioCtx.currentTime + .2
      );

      gain.gain.setValueAtTime(
        .2,
        audioCtx.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        .01,
        audioCtx.currentTime + .25
      );

    }


    osc.start();

    osc.stop(
      audioCtx.currentTime + .3
    );

  }

  catch(e){}

}


/* ===============================
   VOICE
================================ */

function speak(text){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const msg =
      new SpeechSynthesisUtterance(text);

    msg.lang = "en-US";

    msg.volume = .8;

    msg.rate = 1;

    msg.pitch = 1.2;

    speechSynthesis.speak(msg);

  }

}


/* ===============================
   RENDER QUESTION
================================ */

function renderQuestion(){

  const q =
    quizData[currentIndex];

  const state =
    quizState[currentIndex];


  shell.innerHTML = `

    <section class="build-zone">


      <div class="question-row">

        <span class="question-letter">
          ${q.label}
        </span>

        Face value of
        <b>${q.tens}</b>
        in tens place is
        <b>${q.tens}</b>,
        and
        <b>${q.ones}</b>
        in ones place is
        <b>${q.ones}</b>.

      </div>



      <div class="place-track">


        <div class="place-card tens">

          <div class="digit-orb">
            ${q.tens}
          </div>

          <div>

            <div class="place-label">
              TENS
            </div>

            <div
              style="
              margin-top:6px;
              font-weight:600">

              First digit

            </div>

          </div>

        </div>



        <div class="place-card ones">

          <div class="digit-orb">
            ${q.ones}
          </div>

          <div>

            <div class="place-label">
              ONES
            </div>

            <div
              style="
              margin-top:6px;
              font-weight:600">

              Second digit

            </div>

          </div>

        </div>


      </div>



      <div class="answer-stack">


        <div class="answer-line">

          <div class="answer-label">

            The number formed is

          </div>


          <input

            class="
            answer-input
            ${state.solved ? 'locked' : ''}"

            id="numberInput"

            inputmode="numeric"

            maxlength="2"

            value="${state.number}"

            ${state.solved ? 'disabled' : ''}

            aria-label="Enter number"

          >

        </div>



        <div class="answer-line">

          <div class="answer-label">

            It is read as

          </div>


          <input

            class="
            answer-input
            ${state.solved ? 'locked' : ''}"

            id="nameInput"

            value="${state.name}"

            ${state.solved ? 'disabled' : ''}

            aria-label="Enter number name"

          >

        </div>


      </div>


    </section>



    <aside class="visual-zone">


      <img

        class="visual-image"

        id="questionImage"

        src="${q.image}"

        alt="Number formation illustration"

      >



      <div
        class="fallback-illustration"
        id="fallback">


        <div class="fallback-digit">

          ${q.tens}

        </div>


        <div class="fallback-digit">

          ${q.ones}

        </div>


      </div>





    </aside>

  `;


  const image =
    document.getElementById("questionImage");

  const fallback =
    document.getElementById("fallback");


  image.onload = () => {

    image.classList.add("loaded");

    fallback.style.display = "none";

  };


  image.onerror = () => {

    image.style.display = "none";

  };


  const numberInput =
    document.getElementById("numberInput");

  const nameInput =
    document.getElementById("nameInput");


  if(!state.solved){


    numberInput.addEventListener(
  "input",
  () => {

    cameFromPrev = false;
          numberInput.value.replace(
            /[^0-9]/g,
            ""
          );

        state.number =
          numberInput.value;

        updateSubmit();

      }
    );


nameInput.addEventListener("input",()=>{

  cameFromPrev = false;

  nameInput.value = nameInput.value
    .replace(/[^a-zA-Z\s]/g,"")
    .replace(/^([a-z])/, (letter) => letter.toUpperCase());

  state.name = nameInput.value;
  updateSubmit();
});
  }


  prevBtn.disabled =
    currentIndex === 0;


  nextBtn.disabled =
    !state.solved ||
    currentIndex === quizData.length - 1;


  updateSubmit();

}


/* ===============================
   SUBMIT ENABLE / DISABLE
================================ */

function updateSubmit(){

  const state =
    quizState[currentIndex];

  submitBtn.disabled =
    cameFromPrev ||
    state.solved ||
    !state.number.trim() ||
    !state.name.trim();

}


/* ===============================
   NAVIGATION
================================ */

function navigate(direction){

  if(
    direction === 1 &&
    !quizState[currentIndex].solved
  ){
    return;
  }

  cameFromPrev = direction === -1;

  currentIndex =
    Math.max(
      0,
      Math.min(
        quizData.length - 1,
        currentIndex + direction
      )
    );

  renderQuestion();

  // SUBMIT should never work immediately after PREV
  if(direction === -1){
    submitBtn.disabled = true;
  }

}


/* ===============================
   CHECK ANSWERS
================================ */

function checkAnswers(){

  const q =
    quizData[currentIndex];

  const state =
    quizState[currentIndex];


  const numberCorrect =

    state.number.trim() ===
    q.number;


  const nameCorrect =

    normalizeText(state.name) ===
    normalizeText(q.name);


  /* CORRECT */

  if(numberCorrect && nameCorrect){


    state.solved = true;


    document
      .getElementById("numberInput")
      .disabled = true;


    document
      .getElementById("nameInput")
      .disabled = true;


    document
      .getElementById("numberInput")
      .classList.add("locked");


    document
      .getElementById("nameInput")
      .classList.add("locked");


    submitBtn.disabled = true;


    nextBtn.disabled =
      currentIndex === quizData.length - 1;


    playAudioTone(true);

    showSmallConfetti(false);


    /* Always show the normal success popup first. */
    showPopup(

      "correct",

      "🌟",

      "Amazing!",

      "You got it right! ✨",

      false

    );

    speak("Correct");

    /* On the last question, show the final popup only after
       the normal success popup has been visible for 1.8 seconds. */
    if(
      currentIndex ===
      quizData.length - 1
    ){

      nextBtn.disabled = true;

      clearTimeout(popupTimer);
      clearTimeout(finalPopupTimer);

      finalPopupTimer = setTimeout(()=>{

        closePopup();
        showSmallConfetti(true);

        showPopup(

          "complete",

          "🏆",

          "Congratulations!",

          "Fantastic job! You solved all questions! 🎉",

          true

        );

      }, 1800);

    }

  }


  /* WRONG */

  else{


    state.number = "";

    state.name = "";


    document
      .getElementById("numberInput")
      .value = "";


    document
      .getElementById("nameInput")
      .value = "";


    submitBtn.disabled = true;


    playAudioTone(false);


    showPopup(

      "wrong",

      "😟",

      "Keep Going!",

      "Try again, you can do it! 🌈",

      false

    );


    speak("Wrong");

  }

}


/* ===============================
   SHOW POPUP
================================ */

function showPopup(
  status,
  icon,
  title,
  subtitle,
  isFinal = false
){

  const popup =
    document.getElementById("popup");


  const card =
    document.getElementById("popupCard");


  card.className =
    `popup-card ${status}`;


  document
    .getElementById("popupIcon")
    .innerText = icon;


  document
    .getElementById("popupTitle")
    .innerText = title;


  document
    .getElementById("popupSubtitle")
    .innerText = subtitle;


  playAgainBtn.style.display =
    isFinal
      ? "inline-block"
      : "none";


  popup.classList.add("active");


  if(!isFinal){
    clearTimeout(popupTimer);
  }


  if(!isFinal){

    popupTimer =
      setTimeout(
        closePopup,
        1800
      );

  }

}


/* ===============================
   CLOSE POPUP
================================ */

function closePopup(){

  document
    .getElementById("popup")
    .classList.remove("active");

}


/* ===============================
   RESTART GAME
================================ */

function restartGame(){

  closePopup();


  currentIndex = 0;

  const confettiContainer=document.getElementById("confettiContainer");
  if(confettiContainer) confettiContainer.innerHTML='';


  quizState =
    quizData.map(() => ({

      number:"",

      name:"",

      solved:false

    }));


  renderQuestion();

}


/* ===============================
   START
================================ */

window.addEventListener(
  "load",
  renderQuestion
);

</script>

</body>
</html>

/* FINAL POPUP BUTTON — exact Number Name Quest size at every screen size */

  margin-top:14px !important;
  font-size:22px !important;
  font-weight:600 !important;
  line-height:46px !important;
  border-radius:23px !important;
  border:2px solid rgba(255,255,255,.35) !important;
  background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%) !important;
  box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22) !important;
}
.popup-card.complete .popup-icon{
  font-size:4.8rem !important;
  margin-bottom:12px !important;
}
.popup-card.complete .popup-title{
  font-size:3rem !important;
  font-weight:600 !important;
  margin-bottom:8px !important;
}
.popup-card.complete .popup-subtitle{
  font-size:1.4rem !important;
  font-weight:500 !important;
}
</style>
