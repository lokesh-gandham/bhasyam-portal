<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greater & Smaller Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Livvic',sans-serif;
}

html,body{
    width:100%;
    height:100%;
    min-height:100%;
    overflow:hidden;
   
    color:#40535a;
}

.game{
    width:100%;
    height:100dvh;
    min-height:0;
    position:relative;
    overflow:hidden;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
}

.game:before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.42;
  
}

.blob{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    opacity:.48;
    filter:none;
}


.star{
    position:absolute;
    font-size:clamp(22px,2vw,30px);
    color:#7aaeb8;
    opacity:.38;
    pointer-events:none;
    animation:float 4s ease-in-out infinite;
}
.s1{left:8%;top:35%}
.s2{right:11%;top:42%;animation-delay:-2s}
.s3{left:22%;bottom:18%;animation-delay:-1s}

@keyframes float{
    50%{transform:translateY(-12px) rotate(12deg)}
}

header{
    position:relative;
    z-index:2;
    text-align:center;
    padding:clamp(8px,1.5vh,16px) 20px clamp(2px,.5vh,4px);
    flex-shrink:0;
}

h1{
    display:inline-block;
    max-width:min(1100px,92vw);
    padding:clamp(7px,1vh,10px) clamp(18px,2vw,26px);

   
    color:#2f4f4f;
    font-size:clamp(22px,1.55vw,30px);
    font-weight:400;
    line-height:1.35;
}

.game-stage{
    width:min(1260px,94vw);
    min-width:0;
    min-height:0;
    height:100%;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:2;
}

.play-zone{
    width:100%;
    min-height:0;
    padding:clamp(10px,2.5vh,45px) 30px clamp(8px,1.8vh,32px);
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.selector{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-bottom:clamp(10px,2vh,24px);
    flex-shrink:0;
}

.tool{
    min-width:190px;
    height:58px;
    border:2px solid rgba(129,193,205,.28);
    border-radius:18px;
    background:rgba(255,255,255,.88);
    color:#596970;
    font-size:18px;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 7px 0 rgba(69,92,101,.12),0 12px 24px rgba(77,106,115,.09);
    transition:.15s;
}

.tool:hover{
    transform:translateY(-3px);
    filter:none;
}
.tool:active{
    transform:translateY(4px);
    box-shadow:0 3px 0 rgba(69,92,101,.12);
}
.tool i{
    font-style:normal;
    font-size:28px;
    margin-right:8px;
}

.tick-tool.active{
    background:linear-gradient(145deg,#e7fbf1,#bdeedb);
    border-color:#00b894;
    color:#008b69;
    box-shadow:0 0 0 5px rgba(0,184,148,.12),0 7px 0 rgba(0,139,105,.22);
}
.cross-tool.active{
    background:linear-gradient(145deg,#fff3f4,#ffd7dc);
    border-color:#ff6b7a;
    color:#cf3e4b;
    box-shadow:0 0 0 5px rgba(255,107,122,.12),0 7px 0 rgba(207,62,75,.18);
}

.ice-runway{
    width:min(1120px,100%);
    height:clamp(260px,42vh,350px);
    min-height:0;
    margin:auto;
    border-radius:32px;
    padding:clamp(18px,2.5vh,30px) 32px clamp(16px,2.3vh,28px);
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:clamp(12px,1.5vw,22px);
    align-items:end;
    position:relative;
    background:linear-gradient(145deg,rgba(255,255,255,.84),rgba(218,244,247,.90)),#d9f2f5;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 18px 38px rgba(63,115,130,.14);
    border:2px solid rgba(129,193,205,.38);
}

.ice-runway:before{
    content:"CHOOSE YOUR TARGETS";
    position:absolute;
    left:24px;
    top:14px;
    font-size:12px;
    letter-spacing:4px;
    font-weight:900;
    color:#4f9aa8;
    opacity:.9;
}
.ice-runway:after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:30px;
    pointer-events:none;
    background:linear-gradient(110deg,transparent 0 42%,rgba(255,255,255,.36) 42% 46%,transparent 46% 100%);
}

.station{
    height:clamp(185px,29vh,255px);
    min-width:0;
    border:2px solid rgba(129,193,205,.28);
    border-radius:24px;
    background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(225,245,247,.88));
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    cursor:pointer;
    transition:.18s;
    outline:none;
    box-shadow:inset 0 1px rgba(255,255,255,.95),0 8px 0 rgba(94,147,158,.18);
}

.station:hover{
    transform:translateY(-8px);
    border-color:#79bdca;
    box-shadow:0 0 22px rgba(80,160,180,.16),0 12px 0 rgba(94,147,158,.18);
}
.station:focus-visible{
    outline:3px solid #6ab6c7;
    outline-offset:4px;
}
.station:disabled{
    cursor:default;
    opacity:1;
}

.penguin-wrap{
    width:clamp(105px,11vw,165px);
    height:clamp(105px,18vh,165px);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:1;
    min-height:0;
}

.penguin-img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    filter:drop-shadow(0 8px 0 rgba(57,91,103,.12));
}

.number-chip{
    width:calc(100% - 18px);
    min-height:clamp(48px,6vh,58px);
    padding:7px 10px;
    border-radius:16px;
    margin:0 9px 10px;
    background:linear-gradient(145deg,#f7ffff,#cde7eb);
    border:2px solid rgba(255,255,255,.75);
    box-shadow:0 5px 0 rgba(76,110,121,.16);
    color:#40535a;
    font-size:clamp(18px,1.45vw,24px);
    font-weight:500;
    text-align:center;
    display:grid;
    place-items:center;
    line-height:1.15;
}

.stamp{
    position:absolute;
    top:-12px;
    right:-8px;
    width:62px;
    height:62px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#fff;
    font-size:42px;
    font-weight:600;
    opacity:0;
    transform:scale(.35) rotate(-25deg);
    transition:.22s;
    z-index:5;
    box-shadow:0 7px 16px rgba(63,85,95,.16);
    pointer-events:none;
}
.station.mark-tick{
    border-color:#00c885;
    background:linear-gradient(180deg,#effcf5,#c8f1df);
}
.station.mark-cross{
    border-color:#ff7584;
    background:linear-gradient(180deg,#fff5f6,#ffdfe3);
}
.station.mark-tick .stamp{
    opacity:1;
    transform:scale(1) rotate(-8deg);
    color:#00a86b;
    border:4px solid #00c885;
}
.station.mark-cross .stamp{
    opacity:1;
    transform:scale(1) rotate(8deg);
    color:#d33847;
    border:4px solid #ff6b7a;
}
.station.mark-tick .stamp:before{content:"✓"}
.station.mark-cross .stamp:before{content:"×"}
.station.mark-tick .penguin-wrap{transform:rotate(-3deg) scale(1.04)}
.station.mark-cross .penguin-wrap{transform:rotate(3deg) scale(.98);opacity:.88}

/* Navigation */
.navigation{
    width:100%;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:10px clamp(25px,4vw,70px) clamp(18px,3vh,34px);
    position:relative;
    z-index:20;
    flex-shrink:0;
}

.nav-btn{
    width:178px;
    height:45px;
    padding:0;
    border:none;
    border-radius:35px;
    background:#e67e22;
    color:#fff;
    font-size:20px;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 6px #d35400;
    transition:.1s;
}
.nav-btn:active:not(:disabled){
    transform:translateY(4px);
    box-shadow:0 2px #d35400;
}
.nav-btn:disabled{
    background:#b2bec3;
    box-shadow:0 6px #7f8c8d;
    cursor:not-allowed;
}
#prevBtn{justify-self:start}
#nextBtn{justify-self:end}
.submit-btn{
    background:#00b894;
    box-shadow:0 6px #008f72;
}
.submit-btn:active:not(:disabled){
    box-shadow:0 2px #008f72;
}

/* EXACT SAME CONFETTI */
#confettiContainer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2000}
.confetti-piece{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;will-change:transform,opacity}
.final-confetti-piece{width:10px;height:16px;animation-duration:2300ms}
.final-confetti-piece:nth-child(3n){border-radius:50%}
.final-confetti-piece:nth-child(4n){width:7px;height:19px;border-radius:1px}
.final-confetti-piece:nth-child(5n){width:13px;height:8px;border-radius:2px}
@keyframes pageConfetti{0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg) scale(1)}55%{opacity:1}100%{opacity:0;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72)}}
.popup-card.complete{box-shadow:0 20px 45px rgba(108,92,231,.18),0 0 0 8px rgba(162,155,254,.12)}
.popup-card.complete .replay-btn{margin-top:12px}
.popup-card.complete .popup-icon{animation:finalTrophyBounce 1.2s ease-in-out infinite}
@keyframes finalTrophyBounce{0%,100%{transform:translateY(0) rotate(0deg) scale(1)}50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}}

/* EXACT NUMBER NAME QUEST POPUP */
.popup-overlay{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:100;
}
.popup-overlay.active{opacity:1;pointer-events:auto}

.popup-card{
    position:relative;
    width:520px;
    height:300px;
    max-width:calc(100vw - 30px);
    padding:30px;
    border-radius:36px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.1);
    transform:scale(.8);
    transition:.35s cubic-bezier(.175,.885,.32,1.275);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.popup-card:before,.popup-card:after{
    content:'';
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}
.popup-card:before{
    width:220px;
    height:220px;
    top:-60px;
    right:-50px;
}
.popup-card:after{
    width:180px;
    height:180px;
    bottom:-70px;
    left:-40px;
}

.popup-card.correct{
    background:#edfbf4;
    border:6px solid #00c885;
}
.popup-card.correct:before,.popup-card.correct:after{
    background:rgba(162,245,209,.45);
}
.popup-card.correct .popup-title{color:#00a86b}
.popup-card.correct .popup-subtitle{color:#2e7d5b}

.popup-card.wrong{
    background:#fff0f2;
    border:6px solid #ff6b7a;
}
.popup-card.wrong:before,.popup-card.wrong:after{
    background:rgba(255,196,203,.45);
}
.popup-card.wrong .popup-title{color:#d33847}
.popup-card.wrong .popup-subtitle{color:#a33b45}

.popup-card.complete{
    background:#f0f3ff;
    border:6px solid #6c5ce7;
}
.popup-card.complete:before,.popup-card.complete:after{
    background:rgba(162,155,254,.35);
}
.popup-card.complete .popup-title{color:#6c5ce7}
.popup-card.complete .popup-subtitle{color:#4834d4}

.popup-overlay.active .popup-card{transform:scale(1)}

.popup-icon{
    font-size:4.8rem;
    margin-bottom:12px;
    z-index:2;
    line-height:1;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.1));
}
.popup-title{
    font-size:3rem;
    font-weight:600;
    margin-bottom:8px;
    z-index:2;
}
.popup-subtitle{
    font-size:1.4rem;
    font-weight:500;
    z-index:2;
}

/* EXACT NUMBER NAME QUEST PLAY AGAIN BUTTON */
.replay-btn{
    background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%) !important;
    box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22) !important;
    width:185px !important;
    min-width:185px !important;
    height:46px !important;
    padding:0 20px !important;
    margin-top:14px !important;
    font-size:22px !important;
    font-weight:600 !important;
    line-height:46px !important;
    border-radius:23px !important;
    border:2px solid rgba(255,255,255,.35) !important;
    letter-spacing:.2px;
    transition:transform .12s ease,box-shadow .12s ease;
    color:#fff;
    cursor:pointer;
}
.replay-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26) !important;
}
.replay-btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18) !important;
}

.popup-card.complete{
    box-shadow:
        0 20px 45px rgba(108,92,231,.18),
        0 0 0 8px rgba(162,155,254,.12);
}
.popup-card.complete .replay-btn{margin-top:14px !important}
.popup-card.complete .popup-icon{
    animation:finalTrophyBounce 1.2s ease-in-out infinite;
}
@keyframes finalTrophyBounce{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}

/* Lock exact popup values against existing desktop/mobile rules */
.popup-card{
    width:520px !important;
    height:300px !important;
    max-width:calc(100vw - 30px) !important;
    padding:30px !important;
    border-radius:36px !important;
}
.popup-icon{
    font-size:4.8rem !important;
    margin-bottom:12px !important;
}
.popup-title{
    font-size:3rem !important;
    font-weight:600 !important;
    margin-bottom:8px !important;
}
.popup-subtitle{
    font-size:1.4rem !important;
    font-weight:500 !important;
}
.popup-card.complete{
    background:#f0f3ff !important;
    border:6px solid #6c5ce7 !important;
}
.popup-card.complete:before,.popup-card.complete:after{
    background:rgba(162,155,254,.35) !important;
}
.popup-card.complete .popup-title{color:#6c5ce7 !important}
.popup-card.complete .popup-subtitle{color:#4834d4 !important}


@media screen and (min-width:801px) and (max-height:850px){
    h1{font-size:22px}
    .play-zone{padding-top:6px;padding-bottom:6px}
    .selector{margin-bottom:10px}
    .tool{height:50px}
    .ice-runway{
        height:280px;
        padding:22px 28px 20px;
        gap:14px;
    }
    .station{height:185px}
    .penguin-wrap{width:105px;height:105px}
    .number-chip{
        min-height:48px;
        margin-bottom:8px;
        font-size:20px;
    }
}




@media screen and (min-width:1600px) and (min-height:851px){
    h1{font-size:30px}
    .game-stage{
        width:min(1550px,94vw);
    }
    .play-zone{
        padding:12px 0 18px;
    }
    .selector{
        margin-bottom:18px;
    }
    .ice-runway{
        width:min(1320px,100%);
        height:350px;
        gap:22px;
        padding:30px 34px 28px;
    }
    .station{
        height:245px;
    }
    .penguin-wrap{
        width:160px;
        height:160px;
    }
    .number-chip{
        font-size:24px;
        min-width:150px;
    }
    .navigation{
        padding:10px 70px 24px;
    }
    .nav-btn{
        width:200px;
        min-width:200px;
        height:60px;
        padding:0;
        font-size:30px;
        border-radius:50px;
        line-height:60px;
    }
}


    /* Tablet / mobile */
@media screen and (max-width:800px){
    html,body{overflow:auto}
    .game{
        height:auto;
        min-height:100dvh;
        overflow:visible;
        grid-template-rows:auto auto auto;
    }
    header{padding:14px 12px 4px}
    h1{
        font-size:18px;
        max-width:96vw;
    }
    .game-stage{
        width:97vw;
        height:auto;
        min-height:560px;
    }
    .play-zone{
        padding:40px 8px 20px;
        justify-content:center;
    }
    .selector{
        gap:8px;
        margin-bottom:20px;
    }
    .tool{
        min-width:135px;
        height:50px;
        font-size:15px;
    }
    .tool i{font-size:23px}
    .ice-runway{
        height:auto;
        min-height:480px;
        grid-template-columns:repeat(2,1fr);
        gap:15px;
        padding:25px 12px 20px;
        border-radius:30px;
    }
    .ice-runway:after{border-radius:30px}
    .station{height:190px}
    .penguin-wrap{width:115px;height:115px}
    .number-chip{
        min-width:110px;
        font-size:17px;
    }
    .ice-runway:before{
        left:14px;
        letter-spacing:2px;
    }
    .navigation{
        padding:10px 10px 28px;
    }
    .nav-btn{
        width:105px;
        font-size:15px;
    }
}

    padding:0 !important;
    height:auto !important;
    line-height:1.35 !important;
    z-index:2 !important;
    text-align:center !important;
    position:relative !important;
}
.popup-overlay .replay-btn,
.popup-overlay #playAgainBtn,
.popup-overlay .replay{
    background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%) !important;
    box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22) !important;
    width:185px !important;
    min-width:185px !important;
    height:46px !important;
    padding:0 20px !important;
    margin-top:14px !important;
    font-size:22px !important;
    font-weight:600 !important;
    line-height:46px !important;
    border-radius:23px !important;
    border:2px solid rgba(255,255,255,.35) !important;
    letter-spacing:.2px !important;
    color:#fff !important;
    cursor:pointer !important;
    z-index:2 !important;
    font-family:'Livvic',sans-serif !important;
    transition:transform .12s ease,box-shadow .12s ease !important;
}
.popup-overlay .replay-btn:hover,
.popup-overlay #playAgainBtn:hover,
.popup-overlay .replay:hover{
    transform:translateY(-2px) !important;
    box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26) !important;
}
.popup-overlay .replay-btn:active,
.popup-overlay #playAgainBtn:active,
.popup-overlay .replay:active{
    transform:translateY(3px) !important;
    box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18) !important;
}
.popup-overlay .popup-card.complete .popup-icon{
    animation:ch5FinalTrophyBounce 1.2s ease-in-out infinite !important;
}
@keyframes ch5FinalTrophyBounce{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}
@media (max-width:520px){
    .popup-overlay .popup-card{
        width:calc(100vw - 24px) !important;
        height:auto !important;
        min-height:260px !important;
        padding:24px 18px !important;
    }
    .popup-overlay .popup-title,
    .popup-overlay h2.popup-title{font-size:2.2rem !important}
    .popup-overlay .popup-subtitle,
    .popup-overlay p.popup-subtitle{font-size:1.1rem !important}
    .popup-overlay .popup-icon{font-size:3.6rem !important}
}

</style>
</head>
<body>
<div class="game">
    <div class="blob one"></div><div class="blob two"></div><div class="blob three"></div>
    <div class="star s1">✦</div><div class="star s2">✦</div><div class="star s3">✦</div>

    <header>
        <h1>Tick (✓) the greater one and cross (×) the smaller one in each of the following</h1>
    </header>

    <main class="game-stage">

        <section class="play-zone">
            <div class="selector">
                <button class="tool tick-tool active" id="tickTool" type="button" onclick="setTool('tick')"><i>✓</i> GREATER</button>
                <button class="tool cross-tool" id="crossTool" type="button" onclick="setTool('cross')"><i>×</i> SMALLER</button>
            </div>

            <div class="ice-runway" id="iceRunway"></div>
        </section>
    </main>

    <footer class="navigation">
        <button class="nav-btn" id="prevBtn" onclick="previousQuestion()">PREV</button>
        <button class="nav-btn submit-btn" id="submitBtn" onclick="checkAnswer()">SUBMIT</button>
        <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">NEXT</button>
    </footer>
</div>

<div id="confettiContainer"></div>\n<div class="popup-overlay" id="popup">
    <div class="popup-card" id="popupCard">
        <div class="popup-icon" id="popupIcon">🌟</div>
        <h2 class="popup-title" id="popupTitle">Amazing!</h2>
        <p class="popup-subtitle" id="popupText">You got it right! ✨</p>
        <button class="nav-btn replay-btn" id="playAgain" onclick="restartGame()" style="display:none">Play Again</button>
    </div>
</div>

<script>
/*
 IMPORTANT IMAGE PATH:
 Replace this with your actual penguin image location if your project uses another folder.
*/
const FALLBACK_IMAGE_PATH = "../image/penguin.png";

const questions = [
    {
        values:[
            {display:"Ninety one",value:90,image:"../images/question1_1.png"},
            {display:"Nineteen",value:19,image:"../images/question1_2.png"},
            {display:"Nine",value:9,image:"../images/question1_3.png"},
            {display:"Ninety",value:90,image:"../images/question1_4.png"}
        ]
    },
    {
        values:[
            {display:"Sixty five",value:65,image:"../images/question2_1.png"},
            {display:"Seventy five",value:75,image:"../images/question2_2.png"},
            {display:"Eight five",value:85,image:"../images/question2_3.png"},
            {display:"Fifty seven",value:57,image:"../images/question2_4.png"}
        ]
    }
];



let currentQuestion=0;
let activeTool="tick";
let answers=questions.map(()=>Array(4).fill(""));
let completedQuestions=questions.map(()=>false);
let reviewMode=false;
let popupTimer=null;

const iceRunway=document.getElementById("iceRunway");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const submitBtn=document.getElementById("submitBtn");
const tickTool=document.getElementById("tickTool");
const crossTool=document.getElementById("crossTool");
const popup=document.getElementById("popup");
const popupCard=document.getElementById("popupCard");
const popupIcon=document.getElementById("popupIcon");
const popupTitle=document.getElementById("popupTitle");
const popupText=document.getElementById("popupText");
const playAgain=document.getElementById("playAgain");

function setTool(tool){
    activeTool=tool;
    tickTool.classList.toggle("active",tool==="tick");
    crossTool.classList.toggle("active",tool==="cross");
}

function loadQuestion(){
    const data=questions[currentQuestion];
    iceRunway.innerHTML="";

    data.values.forEach((item,index)=>{
        const station=document.createElement("button");
        station.type="button";
        station.className="station";
        station.setAttribute("aria-label",item.display);

        const saved=answers[currentQuestion][index];
        if(saved) station.classList.add(`mark-${saved}`);

        station.innerHTML=`
            <div class="stamp"></div>
            <div class="penguin-wrap">
                <img class="penguin-img" src="${item.image}" alt="Game character" onerror="this.onerror=null;this.src=FALLBACK_IMAGE_PATH">
            </div>
            <div class="number-chip">${item.display}</div>
        `;
        if(completedQuestions[currentQuestion] || reviewMode) station.disabled=true;
        station.addEventListener("click",()=>markStation(index));
        iceRunway.appendChild(station);
    });
    updateButtons();
}

function markStation(index){
    if(completedQuestions[currentQuestion]) return;
    const row=answers[currentQuestion];
    const existing=row.indexOf(activeTool);

    if(existing!==-1 && existing!==index) row[existing]="";
    row[index]=row[index]===activeTool ? "" : activeTool;

    completedQuestions[currentQuestion]=false;
    loadQuestion();
}

function updateButtons(){
    prevBtn.disabled=currentQuestion===0;
    nextBtn.disabled=currentQuestion===questions.length-1 || !completedQuestions[currentQuestion];
    submitBtn.disabled=reviewMode || !(answers[currentQuestion].includes("tick") && answers[currentQuestion].includes("cross"));
}


function speak(t) {
    speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(t);

    msg.lang = "en-US";

    msg.volume = 0.25;

    msg.rate = 1;

    msg.pitch = 1;

    speechSynthesis.speak(msg);
}

/* Reference correct / wrong sounds */
function playCorrectSound(){
    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContextClass) return;

    const context = new AudioContextClass();

    const play = () => {
        const oscillator = context.createOscillator();
        const gain = context.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
            523,
            context.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            784,
            context.currentTime + .18
        );

        gain.gain.setValueAtTime(
            .15,
            context.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            context.currentTime + .35
        );

        oscillator.connect(gain);
        gain.connect(context.destination);

        oscillator.start();
        oscillator.stop(context.currentTime + .35);

        oscillator.addEventListener("ended", () => context.close().catch(() => {}));
    };

    if(context.state === "suspended"){
        context.resume().then(play).catch(() => context.close().catch(() => {}));
    }else{
        play();
    }
}

function playWrongSound(){
    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContextClass) return;

    const context = new AudioContextClass();

    const play = () => {
        const oscillator = context.createOscillator();
        const gain = context.createGain();

        oscillator.type = "sawtooth";

        oscillator.frequency.setValueAtTime(
            180,
            context.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            90,
            context.currentTime + .25
        );

        gain.gain.setValueAtTime(
            .10,
            context.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            context.currentTime + .3
        );

        oscillator.connect(gain);
        gain.connect(context.destination);

        oscillator.start();
        oscillator.stop(context.currentTime + .3);

        oscillator.addEventListener("ended", () => context.close().catch(() => {}));
    };

    if(context.state === "suspended"){
        context.resume().then(play).catch(() => context.close().catch(() => {}));
    }else{
        play();
    }
}

function showSmallConfetti(isFinal=false){
    const confettiContainer=document.getElementById("confettiContainer");
    if(!confettiContainer)return;
    confettiContainer.innerHTML="";
    const count=isFinal?95:42;
    const colors=["#00b894","#e67e22","#6c5ce7","#0984e3","#fdcb6e","#ff6b7a","#00cec9","#a29bfe"];
    for(let i=0;i<count;i++){
        const piece=document.createElement("span");
        piece.className=isFinal?"confetti-piece final-confetti-piece":"confetti-piece";
        const startX=Math.random()*100,startY=-8+Math.random()*10;
        const drift=(Math.random()*520-260)*(isFinal?1.15:.9);
        const fall=window.innerHeight*(.82+Math.random()*.48);
        const rotation=Math.random()*1400-700;
        piece.style.left=startX+"%"; piece.style.top=startY+"%";
        piece.style.setProperty("--x",drift+"px"); piece.style.setProperty("--y",fall+"px"); piece.style.setProperty("--r",rotation+"deg");
        piece.style.background=colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDelay=(Math.random()*(isFinal?500:220))+"ms";
        confettiContainer.appendChild(piece);
        setTimeout(()=>piece.remove(),isFinal?2900:2050);
    }
}

function checkAnswer(){
    const values=questions[currentQuestion].values.map(item=>item.value);
    const greatest=Math.max(...values);
    const smallest=Math.min(...values);
    const tickIndex=answers[currentQuestion].indexOf("tick");
    const crossIndex=answers[currentQuestion].indexOf("cross");

    const correct=
        tickIndex!==-1 &&
        crossIndex!==-1 &&
        values[tickIndex]===greatest &&
        values[crossIndex]===smallest;

    if(correct){
        completedQuestions[currentQuestion]=true;
        updateButtons();

        if(currentQuestion===questions.length-1){
            playCorrectSound();
            speak("Correct!");
            showSmallConfetti(false);

            // Show the same success popup first, then the final popup.
            showPopup("correct","🌟","Amazing!","You got it right! ✨");
            setTimeout(()=>{
                showFinalPopup();
                showSmallConfetti(true);
            },1800);
        }else{
            playCorrectSound();
            speak("Correct!");
            showSmallConfetti(false);
            showPopup("correct","🌟","Amazing!","You got it right! ✨");
        }
    }else{
        completedQuestions[currentQuestion]=false;
        updateButtons();
        playWrongSound();
        speak("Try again!");
        showPopup("wrong","😟","Keep Going!","Try again, you can do it! 🌈");
    }
}

function showPopup(type,icon,title,message){
    clearTimeout(popupTimer);
    popupCard.className=`popup-card ${type}`;
    popupIcon.textContent=icon;
    popupTitle.textContent=title;
    popupText.textContent=message;
    playAgain.style.display="none";
    popup.classList.add("active");
    popupTimer=setTimeout(closePopup,1800);
}
function closePopup(){popup.classList.remove("active")}

function showFinalPopup(){
    clearTimeout(popupTimer);
    popupCard.className="popup-card complete";
    popupIcon.textContent="🏆";
    popupTitle.textContent="Congratulations!";
    popupText.textContent="Fantastic job! You solved all questions! 🎉";
    playAgain.style.display="inline-block";
    popup.classList.add("active");
}

function previousQuestion(){
    if(currentQuestion===0)return;
    currentQuestion--;
    reviewMode=true;
    loadQuestion();
}
function nextQuestion(){
    if(currentQuestion>=questions.length-1 || !completedQuestions[currentQuestion])return;
    currentQuestion++;
    reviewMode=false;
    loadQuestion();
}
function restartGame(){
    currentQuestion=0;
    reviewMode=false;
    activeTool="tick";
    answers=questions.map(()=>Array(4).fill(""));
    completedQuestions=questions.map(()=>false);
    popup.classList.remove("active");
    clearTimeout(popupTimer);
    const confettiContainer=document.getElementById("confettiContainer");
    if(confettiContainer)confettiContainer.innerHTML="";
    setTool("tick");
    loadQuestion();
}
loadQuestion();
</script>
</body>
</html>
