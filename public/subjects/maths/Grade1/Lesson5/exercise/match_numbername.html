<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">

<title>Match the Number Kites</title>

<style>

/* =========================================
   GLOBAL
========================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Livvic", sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
   background:

        linear-gradient(
            180deg,
            #b9ddec 0%,
            #9fd0e2 56%,
            #a6cf48 56%,
            #94bf39 100%
        );

    box-shadow:
        0 10px 30px rgba(50,90,110,.12);
    color:#344454;
    overflow-x:hidden;
}


/* =========================================
   MAIN PAGE
========================================= */

.game{
    width:min(1500px,96vw);
    margin:auto;
    padding:18px 10px 25px;
}


/* =========================================
   HEADING - NO BOX / NO BORDER
========================================= */

.title-board{
    text-align:left;
    margin-bottom:16px;
}

.title-board p{
    font-size:clamp(22px,2vw,30px);
    /* font-weight:600; */
    color:#2f4f4f;
    line-height:1.25;
    text-align: center;
}


/* =========================================
   GAME AREA
========================================= */

.game-field{

    position:relative;

    width:100%;

    min-height:720px;

    overflow:hidden;

    border-radius:24px;

    

}


/* =========================================
   LIGHT CLOUDS
========================================= */

.cloud{

    position:absolute;

    background:rgba(255,255,255,.45);

    border-radius:50%;

    filter:blur(1px);

}

.cloud1{
    width:110px;
    height:35px;
    top:85px;
    left:28%;
}

.cloud2{
    width:90px;
    height:30px;
    top:140px;
    right:16%;
}

.cloud3{
    width:70px;
    height:25px;
    top:220px;
    left:7%;
}

.instruction{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    width:max-content;
    max-width:90%;
    text-align:center;
    font-size:clamp(16px,1.5vw,22px);
    font-weight:500;
    color:#405365;
    z-index:10;

    border:1.5px solid rgba(64,83,101,.22);
    background: wheat;
    border-radius:12px;
    padding:8px 18px;
}


/* =========================================
   KITE AREA
========================================= */

.kite-area{

    position:absolute;

    top:60px;

    left:0;

    width:100%;

    height:420px;

}


/* =========================================
   KITE CARD
========================================= */

.kite-card{

    position:absolute;

    width:150px;

    min-height:180px;

    display:flex;

    flex-direction:column;

    align-items:center;

    text-align:center;

}


/* Plain text only */

.word-label{

    font-family:Georgia, serif;

    font-size:clamp(16px,1.5vw,23px);

    font-weight:400;

    color:#263946;

    line-height:1.1;

    margin-bottom:2px;

    background:transparent;

    border:none;

    box-shadow:none;

}


/* =========================================
   KITE IMAGE
========================================= */

.kite{

    width:125px;

    height:135px;

    object-fit:contain;

    cursor:grab;

    user-select:none;

    transition:
        transform .25s,
        filter .4s;

    /*
       START BLACK / WHITE
    */

    filter:
        grayscale(1)
        brightness(1.25)
        contrast(.9);

}


.kite:hover{

    transform:
        scale(1.08)
        rotate(-2deg);

}


.matched-number{
    display:none;
    min-width:38px;
    height:38px;
    padding:0 9px;
    margin-top:-65px;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,.95);
    color:#344454;
    font-family:Georgia,serif;
    font-size:22px;
    font-weight:500;
    box-shadow:0 3px 8px rgba(0,0,0,.10);
}
.kite.matched ~ .matched-number{
    display:flex;
}

.kite.dragging{

    opacity:.55;

    transform:scale(1.12);

}


/* =========================================
   CORRECT = COLOUR KITE
========================================= */

.kite.matched{

    cursor:default;

    animation:kiteFly .7s ease infinite alternate;

}


@keyframes kiteFly{

    from{

        transform:
            translateY(0)
            rotate(-3deg);

    }

    to{

        transform:
            translateY(-8px)
            rotate(3deg);

    }

}



/* =========================================
   SCATTERED KITE POSITIONS
========================================= */


/* Row 1 */

.kite-card:nth-child(1){

    left:2%;

    top:0;

}


.kite-card:nth-child(2){

    left:20%;

    top:38px;

}


.kite-card:nth-child(3){

    left:42%;

    top:12px;

}


.kite-card:nth-child(4){

    left:68%;

    top:45px;

}


.kite-card:nth-child(5){

    right:3%;

    top:0;

}


/* Row 2 */

.kite-card:nth-child(6){

    left:6%;

    top:190px;

}


.kite-card:nth-child(7){

    left:24%;

    top:190px;

}


.kite-card:nth-child(8){

    left:42%;

    top:175px;

}


.kite-card:nth-child(9){

    left:65%;

    top:190px;

}


.kite-card:nth-child(10){

    right:4%;

    top:185px;

}



/* =========================================
   CHILDREN AREA
========================================= */

.kids-area{

    position:absolute;

    left:0;

    bottom:20px;

    width:100%;

    height:210px;

}


/* =========================================
   CHILD CARD
========================================= */

.kid-card{

    position:absolute;

    width:110px;

    height:190px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-end;

    border-radius:20px;

    transition:.25s;

}


.kid-card.drag-over{

    transform:translateY(-10px) scale(1.05);

}


.kid-card.correct-zone{

    animation:kidSuccess .8s ease;

}


@keyframes kidSuccess{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.12);
    }

    100%{
        transform:scale(1);
    }

}


/* =========================================
   CHILD IMAGE
========================================= */

.kid-img{

    width:100px;

    height:140px;

    object-fit:contain;

    pointer-events:none;

}


/* =========================================
   NUMBER
========================================= */

.number-badge{

    margin-top:-8px;

    min-width:42px;

    height:42px;

    padding:0 8px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(255,255,255,.9);

    color:#4c5962;

    font-family:Georgia,serif;

    font-size:23px;

    font-weight:500;

    box-shadow:
        0 3px 8px rgba(0,0,0,.08);

}


/* =========================================
   SCATTERED CHILD POSITIONS
========================================= */

.kid-card:nth-child(1){

    left:2%;

    bottom:15px;

}


.kid-card:nth-child(2){

    left:10%;

    bottom:2px;

}


.kid-card:nth-child(3){

    left:21%;

    bottom:22px;

}


.kid-card:nth-child(4){

    left:32%;

    bottom:0;

}


.kid-card:nth-child(5){

    left:44%;

    bottom:18px;

}


.kid-card:nth-child(6){

    left:56%;

    bottom:5px;

}


.kid-card:nth-child(7){

    left:66%;

    bottom:24px;

}


.kid-card:nth-child(8){

    left:76%;

    bottom:3px;

}


.kid-card:nth-child(9){

    left:85%;

    bottom:22px;

}


.kid-card:nth-child(10){

    right:1%;

    bottom:0;

}



/* =========================================
   EXACT HEAVY & LIGHT POPUP
========================================= */

.popup-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
   
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    z-index:1000;
}

.popup-overlay.active{
    opacity:1;
    pointer-events:auto;
}

.popup-overlay.active .popup-card{
    transform:scale(1);
}

.popup-card{
    position:relative;
    width:90%;
    max-width:520px;
    padding:40px 30px;
    border-radius:36px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.1);
    transform:scale(.8);
    transition:transform .35s cubic-bezier(.175,.885,.32,1.275);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#fff;
}

.popup-card::before,
.popup-card::after{
    content:'';
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}

.popup-card::before{
    width:220px;
    height:220px;
    top:-60px;
    right:-50px;
}

.popup-card::after{
    width:180px;
    height:180px;
    bottom:-70px;
    left:-40px;
}

.popup-card.correct{
    background:#edfbf4;
    border:6px solid #00c885;
}

.popup-card.correct::before,
.popup-card.correct::after{
    background:rgba(162,245,209,.45);
}

.popup-card.correct .popup-title{
    color:#00a86b;
}

.popup-card.correct .popup-subtitle{
    color:#2e7d5b;
}

.popup-card.wrong{
    background:#fff0f2;
    border:6px solid #ff6b7a;
}

.popup-card.wrong::before,
.popup-card.wrong::after{
    background:rgba(255,196,203,.45);
}

.popup-card.wrong .popup-title{
    color:#d33847;
}

.popup-card.wrong .popup-subtitle{
    color:#a33b45;
}

.popup-card.complete{
    background:#f0f3ff;
    border:6px solid #6c5ce7;
}

.popup-card.complete::before,
.popup-card.complete::after{
    background:rgba(162,155,254,.35);
}

.popup-card.complete .popup-title{
    color:#6c5ce7;
}

.popup-card.complete .popup-subtitle{
    color:#4834d4;
}

.popup-icon{
    position:relative;
    z-index:5;
    font-size:72px;
    line-height:1;
    margin-bottom:14px;
}

.popup-title{
    position:relative;
    z-index:5;
    margin:0;
    font-size:clamp(28px,4vw,42px);
    font-weight:600;
}

.popup-subtitle{
    position:relative;
    z-index:5;
    margin:10px 0 0;
    font-size:clamp(17px,2vw,22px);
    font-weight:500;
}

.replay-btn{
    position:relative;
    z-index:5;
    border:none;
    border-radius:45px;
    padding:14px 42px;
    margin-top:22px;
    background:#0984e3;
    color:white;
    font-size:20px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 0 #0975c7;
    display:none;
}

.replay-btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #0975c7;
}

/* ===== CHAPTER 5: STANDARD FINAL POPUP (matching.html) ===== */
.popup-card{
    width:520px !important;
    height:300px !important;
    max-width:calc(100vw - 30px) !important;
    padding:30px !important;
}
.popup-icon{
    font-size:4.8rem !important;
    margin-bottom:12px !important;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.1));
}
.popup-title{
    font-size:3rem !important;
    margin-bottom:8px !important;
}
.popup-subtitle{
    font-size:1.4rem !important;
    margin:0 !important;
}
.popup-card.complete{
    box-shadow:0 20px 45px rgba(108,92,231,.18),0 0 0 8px rgba(162,155,254,.12);
}
.popup-card.complete .replay-btn{
    margin-top:14px;
    background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%);
    box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22);
    width:185px;
    min-width:185px;
    height:46px;
    padding:0 20px;
    font-size:22px;
    font-weight:600;
    line-height:46px;
    border-radius:23px;
    border:2px solid rgba(255,255,255,.35);
    letter-spacing:.2px;
}
.popup-card.complete .replay-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26);
}
.popup-card.complete .replay-btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18);
}
.popup-card.complete .popup-icon{
    animation:finalTrophyBounce 1.2s ease-in-out infinite;
}
@keyframes finalTrophyBounce{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}


/* =========================================
   RESPONSIVE - FIT LAPTOP SCREEN WITHOUT PAGE SCROLL
========================================= */

/* Desktop / laptop: the complete game stays inside the viewport */
@media (min-width: 751px){

    html, body{
        height:100%;
        overflow:hidden;
    }

    .game{
        width:min(1700px,96vw);
        height:100vh;
        min-height:0;
        padding:10px 8px 12px;
        display:flex;
        flex-direction:column;
    }

    .title-board{
        flex:0 0 auto;
        margin-bottom:8px;
        padding-left:8px;
    }

    .title-board p{
        font-size:clamp(22px,1.8vw,30px);
        line-height:1.15;
    }

    .game-field{
        flex:1 1 auto;
        min-height:0;
        height:auto;
        border-radius:22px;
    }

    .instruction{
        top:14px;
        font-size:clamp(16px,1.35vw,22px);
    }

    .kite-area{
        top:50px;
        height:56%;
    }

    .kids-area{
        bottom:8px;
        height:31%;
    }

    .kite-card{
        width:clamp(92px,8.5vw,150px);
        min-height:clamp(130px,16vw,180px);
    }

    .word-label{
        font-size:clamp(15px,1.25vw,22px);
    }

    .kite{
        width:clamp(76px,7.2vw,125px);
        height:clamp(86px,8vw,135px);
    }

    .kite-string{
        height:clamp(28px,3vw,45px);
        margin-top:-10px;
    }

    .kid-card{
        width:clamp(66px,7vw,110px);
        height:100%;
        max-height:160px;
    }

    .kid-img{
        width:clamp(58px,6.5vw,100px);
        height:clamp(78px,9vw,140px);
    }

    .number-badge{
        min-width:clamp(34px,3vw,42px);
        height:clamp(34px,3vw,42px);
        font-size:clamp(17px,1.5vw,23px);
        margin-top:-5px;
    }
}

/* Large monitors */
@media (min-width:1600px){
    .game{
        width:min(1800px,94vw);
        padding:16px 12px 24px;
    }
    .title-board p{font-size:30px;}
    .game-field{
        min-height:0;
        height:calc(100vh - 125px);
    }
    .kite-area{top:58px;height:60%;}
    .kids-area{bottom:16px;height:28%;}
    .kite-card{width:150px;min-height:200px;}
    .kite{width:125px;height:135px;}
    .word-label{font-size:22px;margin-bottom:8px;}
    .kid-card{width:110px;max-height:170px;}
    .kid-img{width:100px;height:140px;}
    .number-badge{min-width:42px;height:42px;font-size:23px;}
    .matched-number{min-width:44px;height:44px;font-size:24px;margin-top:-52px;}
    .kite-card:nth-child(1){top:0;}
    .kite-card:nth-child(2){top:24px;}
    .kite-card:nth-child(3){top:8px;}
    .kite-card:nth-child(4){top:30px;}
    .kite-card:nth-child(5){top:0;}
    .kite-card:nth-child(6){top:248px;}
    .kite-card:nth-child(7){top:248px;}
    .kite-card:nth-child(8){top:236px;}
    .kite-card:nth-child(9){top:248px;}

/* Smaller laptops/tablets: use a compact layout, not a taller page */
@media (min-width:751px) and (max-width:1100px){

    .game{
        width:98vw;
        padding:7px 5px 8px;
    }

    .title-board p{
        font-size:22px;
    }

    .kite-area{
        top:46px;
        height:58%;
    }

    .kids-area{
        height:29%;
        bottom:5px;
    }

    .instruction{
        top:10px;
        font-size:16px;
    }

    .kite-card{
        width:86px;
        min-height:118px;
    }

    .kite{
        width:72px;
        height:80px;
    }

    .kite-string{
        height:24px;
    }

    .word-label{
        font-size:14px;
    }

    .kid-card{
        width:58px;
        max-height:125px;
    }

    .kid-img{
        width:54px;
        height:72px;
    }

    .number-badge{
        min-width:31px;
        height:31px;
        font-size:16px;
    }
}

/* Phones: scrolling is allowed because a 10-kite game cannot
   physically fit in one short phone viewport without becoming unusable */
@media(max-width:750px){

    html, body{
        height:auto;
        overflow-x:hidden;
        overflow-y:auto;
    }

    .game{
        width:100%;
        height:auto;
        padding:8px;
    }

    .title-board{
        margin-bottom:8px;
    }

    .title-board p{
        font-size:20px;
        line-height:1.25;
    }

    .game-field{
        min-height:1180px;
        border-radius:18px;
    }

    .instruction{
        top:12px;
        width:92%;
        font-size:14px;
    }

    .kite-area{
        top:52px;
        height:690px;
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        grid-template-rows:repeat(5,minmax(0,1fr));
        place-items:center;
        padding:5px 8px;
    }

    .kite-card{
        position:relative !important;
        left:auto !important;
        right:auto !important;
        top:auto !important;
        width:130px;
        min-height:125px;
        transform:none !important;
    }

    .kite{
        width:90px;
        height:92px;
    }

    .kite-string{
        height:25px;
    }

    .word-label{
        font-size:16px;
    }

    .kids-area{
        position:absolute;
        left:0;
        bottom:10px;

        height:430px;

        grid-template-columns:repeat(2,minmax(0,1fr));
        grid-template-rows:repeat(5,minmax(0,1fr));
        place-items:center;
        padding:5px;

    .kid-card{
        position:relative !important;
        left:auto !important;
        right:auto !important;
        bottom:auto !important;
        width:90px;
        height:82px;
        margin:auto;
        transform:none !important;
    }

    .kid-img{
        width:62px;
        height:75px;
    }

    .number-badge{
        min-width:32px;
        height:32px;
        font-size:17px;
    }
}


/* ===== CONFETTI (same as other lessons) ===== */
#confettiContainer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:200}
.confetti-piece{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;will-change:transform,opacity}
.final-confetti-piece{width:10px;height:16px;animation-duration:2300ms}
.final-confetti-piece:nth-child(3n){border-radius:50%}
.final-confetti-piece:nth-child(4n){width:7px;height:19px;border-radius:1px}
.final-confetti-piece:nth-child(5n){width:13px;height:8px;border-radius:2px}
@keyframes pageConfetti{0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg) scale(1)}55%{opacity:1}100%{opacity:0;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72)}}

.popup-overlay{
    position:fixed !important;
    inset:0 !important;
    display:flex !important;
    justify-content:center !important;
    align-items:center !important;
    background:transparent !important;
    opacity:0 !important;
    pointer-events:none !important;

    position:relative !important;

    height:300px !important;
    max-width:calc(100vw - 30px) !important;
    padding:30px !important;
    border-radius:36px !important;
    text-align:center !important;
    transform:scale(.8) !important;

    display:flex !important;
    flex-direction:column !important;
    align-items:center !important;
    justify-content:center !important;
    margin:0 !important;
}
.popup-overlay .popup-card::before,
.popup-overlay .popup-card::after{
    content:'' !important;
    position:absolute !important;
    border-radius:50% !important;
    pointer-events:none !important;
}
.popup-overlay .popup-card::before{width:220px !important;height:220px !important;top:-60px !important;right:-50px !important}
.popup-overlay .popup-card::after{width:180px !important;height:180px !important;bottom:-70px !important;left:-40px !important}
.popup-overlay .popup-card.correct{background:#edfbf4 !important;border:6px solid #00c885 !important}

}
.popup-overlay .popup-card.complete .popup-icon{
    animation:ch5FinalTrophyBounce 1.2s ease-in-out infinite !important;
}
@keyframes ch5FinalTrophyBounce{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}
@media (max-width:520px){
    .popup-overlay .popup-card{
        width:calc(100vw - 24px) !important;
        height:auto !important;
        min-height:260px !important;
        padding:24px 18px !important;
    }
    .popup-overlay .popup-title,
    .popup-overlay h2.popup-title{font-size:2.2rem !important}
    .popup-overlay .popup-subtitle,
    .popup-overlay p.popup-subtitle{font-size:1.1rem !important}
    .popup-overlay .popup-icon{font-size:3.6rem !important}
}

</style>

</head>

<body>
<div id="confettiContainer"></div>


<div class="game">


    <!-- HEADING -->

    <div class="title-board">

        <p>
            Match the number name with the number and colour the kites.
        </p>

    </div>


    <!-- GAME -->

    <div class="game-field">


        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>


        <div class="instruction">

            Drag each kite to the child with the correct number!

        </div>


        <!-- KITES -->

        <div
            class="kite-area"
            id="kiteArea">
        </div>


        <!-- CHILDREN -->

        <div
            class="kids-area"
            id="kidsArea">
        </div>


    </div>


</div>




<!-- =========================================
     EXACT HEAVY & LIGHT POPUP
========================================= -->

<div class="popup-overlay" id="popup">
    <div class="popup-card" id="popupCard">
        <div class="popup-icon" id="popupIcon">🌟</div>
        <h2 class="popup-title" id="popupTitle">Amazing!</h2>
        <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
        <button class="replay-btn" id="playAgainBtn" style="display:none" onclick="restartGame()">
            Play Again
        </button>
    </div>
</div>


<script>


/* =========================================
   IMAGE PATHS
========================================= */

const ASSETS = {


    /* KITES */

    kite22:"../images/kite.png",

    kite24:"../images/kite.png",

    kite30:"../images/kite.png",

    kite31:"../images/kite.png",

    kite32:"../images/kite.png",

    kite35:"../images/kite.png",

    kite37:"../images/kite.png",

    kite38:"../images/kite.png",

    kite39:"../images/kite.png",

    kite40:"../images/kite.png",



    /* KIDS */

    kid1:"../images/kid.png",

    kid2:"../images/kid2.png",

    kid3:"../images/kid3.png",

    kid4:"../images/kid4.png",

    kid5:"../images/kid5.png",

    kid6:"../images/kid2.png",

    kid7:"../images/kid.png",

    kid8:"../images/kid3.png",

    kid9:"../images/kid4.png",

    kid10:"../images/kid5.png"

};


/* =========================================
   YOUR SPEAK FUNCTION
========================================= */

function speak(t) {

    speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(t);

    msg.lang = "en-US";

    msg.volume = 0.25;

    msg.rate = 1;

    msg.pitch = 1;

    speechSynthesis.speak(msg);

}


/* =========================================
   GAME DATA
========================================= */

const questions = [

    {
        number:22,
        word:"Twenty two",
        kite:"kite22",
        kid:"kid1"
    },

    {
        number:24,
        word:"Twenty four",
        kite:"kite24",
        kid:"kid2"
    },

    {
        number:30,
        word:"Thirty",
        kite:"kite30",
        kid:"kid3"
    },

    {
        number:31,
        word:"Thirty one",
        kite:"kite31",
        kid:"kid4"
    },

    {
        number:32,
        word:"Thirty two",
        kite:"kite32",
        kid:"kid5"
    },

    {
        number:35,
        word:"Thirty five",
        kite:"kite35",
        kid:"kid6"
    },

    {
        number:37,
        word:"Thirty seven",
        kite:"kite37",
        kid:"kid7"
    },

    {
        number:38,
        word:"Thirty eight",
        kite:"kite38",
        kid:"kid8"
    },

    {
        number:39,
        word:"Thirty nine",
        kite:"kite39",
        kid:"kid9"
    },

    {
        number:40,
        word:"Forty",
        kite:"kite40",
        kid:"kid10"
    }

];


let draggedKite = null;

let matchedNumbers = new Set();



/* =========================================
   SHUFFLE
========================================= */

function shuffle(array){

    const newArray = [...array];

    for(
        let i = newArray.length - 1;
        i > 0;
        i--
    ){

        const j = Math.floor(
            Math.random() * (i + 1)
        );

        [
            newArray[i],
            newArray[j]

        ] = [

            newArray[j],
            newArray[i]

        ];

    }

    return newArray;

}



/* =========================================
   RENDER GAME
========================================= */

function renderGame(){


    const kiteArea =
        document.getElementById("kiteArea");


    const kidsArea =
        document.getElementById("kidsArea");


    kiteArea.innerHTML = "";

    kidsArea.innerHTML = "";


    const shuffledKites =
        shuffle(questions);


    const shuffledKids =
        shuffle(questions);



    /* CREATE KITES */

    shuffledKites.forEach(item => {


        const card =
            document.createElement("div");


        card.className =
            "kite-card";


        card.innerHTML = `

            <div class="word-label">

                ${item.word}

            </div>


            <img

                src="${ASSETS[item.kite]}"

                class="kite"

                draggable="true"

                data-number="${item.number}"

                alt="${item.word}"

            >


            <div class="kite-string"></div>

            <div class="matched-number">${item.number}</div>

        `;


        kiteArea.appendChild(card);


    });



    /* CREATE CHILDREN */

    shuffledKids.forEach(item => {


        const child =
            document.createElement("div");


        child.className =
            "kid-card";


        child.dataset.number =
            item.number;


        child.innerHTML = `

            <img

                src="${ASSETS[item.kid]}"

                class="kid-img"

                alt="Child"

            >


            <div class="number-badge">

                ${item.number}

            </div>

        `;


        kidsArea.appendChild(child);


    });


    setupDragDrop();

}



/* =========================================
   DRAG AND DROP
========================================= */

function setupDragDrop(){


    const kites =
        document.querySelectorAll(".kite");


    const children =
        document.querySelectorAll(".kid-card");



    /* START DRAG */

    kites.forEach(kite => {


        kite.addEventListener(
            "dragstart",
            function(){


                if(
                    this.classList.contains(
                        "matched"
                    )
                ){

                    return;

                }


                draggedKite =
                    this;


                setTimeout(() => {

                    this.classList.add(
                        "dragging"
                    );

                },0);


            }
        );



        /* END DRAG */

        kite.addEventListener(
            "dragend",
            function(){


                this.classList.remove(
                    "dragging"
                );


                draggedKite =
                    null;


                children.forEach(child => {

                    child.classList.remove(
                        "drag-over"
                    );

                });


            }
        );


    });



    /* CHILD DROP ZONES */

    children.forEach(child => {


        child.addEventListener(
            "dragover",
            function(e){

                e.preventDefault();


                if(
                    !this.classList.contains(
                        "matched-child"
                    )
                ){

                    this.classList.add(
                        "drag-over"
                    );

                }


            }
        );



        child.addEventListener(
            "dragleave",
            function(){

                this.classList.remove(
                    "drag-over"
                );

            }
        );



        child.addEventListener(
            "drop",
            function(e){

                e.preventDefault();


                this.classList.remove(
                    "drag-over"
                );


                if(!draggedKite){

                    return;

                }


                const kiteNumber =
                    Number(
                        draggedKite.dataset.number
                    );


                const childNumber =
                    Number(
                        this.dataset.number
                    );



                /* CORRECT */

                if(
                    kiteNumber === childNumber
                ){

                    correctMatch(
                        draggedKite,
                        this,
                        kiteNumber
                    );

                }



                /* WRONG */

                else{

                    wrongMatch();

                }


            }
        );


    });


}




/* =========================================
   EXACT HEAVY & LIGHT SOUND
========================================= */

const audioCtx =
    new (window.AudioContext || window.webkitAudioContext)();

function playAudioTone(isCorrect){

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if(isCorrect){

        osc.type = "sine";

        osc.frequency.setValueAtTime(
            587.33,
            audioCtx.currentTime
        );

        osc.frequency.exponentialRampToValueAtTime(
            880,
            audioCtx.currentTime + 0.2
        );

        gain.gain.setValueAtTime(
            0.2,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + 0.3
        );

    }else{

        osc.type = "sawtooth";

        osc.frequency.setValueAtTime(
            200,
            audioCtx.currentTime
        );

        osc.frequency.linearRampToValueAtTime(
            120,
            audioCtx.currentTime + 0.2
        );

        gain.gain.setValueAtTime(
            0.2,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + 0.25
        );
    }

    osc.start();
    osc.stop(audioCtx.currentTime + (isCorrect ? 0.32 : 0.27));
}


/* =========================================
   DIFFERENT KITE COLOURS
========================================= */

const kiteColours = {
    22:"sepia(.85) saturate(7) hue-rotate(310deg) brightness(1.05)",
    24:"sepia(.9) saturate(8) hue-rotate(5deg) brightness(1.08)",
    30:"sepia(.9) saturate(7) hue-rotate(65deg) brightness(1.05)",
    31:"sepia(.8) saturate(7) hue-rotate(115deg) brightness(1.05)",
    32:"sepia(.9) saturate(8) hue-rotate(170deg) brightness(1.05)",
    35:"sepia(.85) saturate(8) hue-rotate(205deg) brightness(1.08)",
    37:"sepia(.9) saturate(8) hue-rotate(245deg) brightness(1.08)",
    38:"sepia(.9) saturate(7) hue-rotate(285deg) brightness(1.05)",
    39:"sepia(.9) saturate(8) hue-rotate(335deg) brightness(1.06)",
    40:"sepia(.8) saturate(6) hue-rotate(40deg) brightness(1.1)"
};


/* =========================================
   CORRECT MATCH
========================================= */

function correctMatch(kite, child, number){

    if(matchedNumbers.has(number)){
        return;
    }

    matchedNumbers.add(number);

    kite.classList.add("matched");
    kite.style.filter = kiteColours[number] || "saturate(5)";
    kite.draggable = false;

    child.classList.add("correct-zone");
    child.classList.add("matched-child");

    playAudioTone(true);
    speak("Correct");

    createStars(child);

    const isFinal =
        matchedNumbers.size === questions.length;

    if(isFinal){

        setTimeout(() => {

            showPopup(
                "complete",
                "🏆",
                "Congratulations!",
                "Fantastic job! You solved all questions! 🎉",
                true
            );

          

        }, 450);

    }else{

        showPopup(
            "correct",
            "🌟",
            "Amazing!",
            "You got it right! ✨",
            false
        );
    }

    setTimeout(() => {
        child.classList.remove("correct-zone");
    }, 900);
}


/* =========================================
   WRONG MATCH
========================================= */

function wrongMatch(){

    playAudioTone(false);
    speak("Wrong");

    showPopup(
        "wrong",
        "😟",
        "Keep Going!",
        "Try again, you can do it! 🌈",
        false
    );
}


/* =========================================
   EXACT HEAVY & LIGHT POPUP LOGIC
========================================= */

let popupTimer = null;


function showSmallConfetti(isFinal=false){const c=document.getElementById('confettiContainer');if(!c)return;c.innerHTML='';const count=isFinal?95:42,colors=['#00b894','#e67e22','#6c5ce7','#0984e3','#fdcb6e','#ff6b7a','#00cec9','#a29bfe'];for(let i=0;i<count;i++){const p=document.createElement('span');p.className=isFinal?'confetti-piece final-confetti-piece':'confetti-piece';p.style.left=(Math.random()*100)+'%';p.style.top=(-8+Math.random()*10)+'%';p.style.setProperty('--x',((Math.random()*520-260)*(isFinal?1.15:.9))+'px');p.style.setProperty('--y',(window.innerHeight*(.82+Math.random()*.48))+'px');p.style.setProperty('--r',(Math.random()*1400-700)+'deg');p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDelay=(Math.random()*(isFinal?500:220))+'ms';c.appendChild(p);setTimeout(()=>p.remove(),isFinal?2900:2050)}}
function clearConfetti(){const c=document.getElementById('confettiContainer');if(c)c.innerHTML='';}

function showPopup(
    status,
    icon,
    title,
    subtitle,
    isFinal = false
){
    /* confetti, same as other lessons */
    if(isFinal || status === 'complete'){ showSmallConfetti(true); }
    else if(status === 'correct'){ showSmallConfetti(false); }


    const popup =
        document.getElementById("popup");

    const card =
        document.getElementById("popupCard");

    const playAgainBtn =
        document.getElementById("playAgainBtn");

    card.className =
        `popup-card ${status}`;

    document.getElementById("popupIcon").innerText =
        icon;

    document.getElementById("popupTitle").innerText =
        title;

    document.getElementById("popupSubtitle").innerText =
        subtitle;

    playAgainBtn.style.display =
        isFinal ? "inline-block" : "none";

    popup.classList.add("active");

    clearTimeout(popupTimer);

    if(!isFinal){
        popupTimer = setTimeout(
            closePopup,
            1800
        );
    }
}

function closePopup(){

    document
        .getElementById("popup")
        .classList.remove("active");
}

function restartGame(){

    clearTimeout(popupTimer);

    closePopup();

    matchedNumbers.clear();

    draggedKite = null;

    renderGame();
}


/* =========================================
   STAR EFFECT
========================================= */


function createStars(parent){


    for(
        let i = 0;
        i < 7;
        i++
    ){


        const star =
            document.createElement("div");


        star.textContent = "✦";


        star.style.position =
            "absolute";


        star.style.left =
            (
                20 +
                Math.random() * 60
            ) + "%";


        star.style.top =
            (
                20 +
                Math.random() * 45
            ) + "%";


        star.style.fontSize =
            (
                18 +
                Math.random() * 10
            ) + "px";


        star.style.color =
            "#ffffff";


        star.style.fontWeight =
            "bold";


        star.style.pointerEvents =
            "none";


        star.style.zIndex =
            "30";


        star.style.transition =
            "all .9s ease";


        parent.appendChild(star);



        requestAnimationFrame(() => {


            star.style.transform =
                "translateY(-65px) rotate(180deg)";


            star.style.opacity =
                "0";


        });



        setTimeout(() => {

            star.remove();

        },900);


    }


}



/* =========================================
   START GAME
========================================= */

renderGame();


</script>

</body>
</html>
