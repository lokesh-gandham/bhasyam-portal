<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Lock Matching</title>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Livvic',sans-serif;
    user-select:none;
}

body{
    background:#fbf8eb;
    min-height:100vh;
    width:100%;
    overflow:hidden;
    color:#2f4f4f;
}

/* =========================
   HEADER
========================= */
header{
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 20px 0;
    position:relative;
    z-index:5;
}

h2{
    font-size:22px;
    line-height:1.2;
    color:#2f4f4f;
    font-weight:500;
    text-align:center;
}

/* =========================
   MATCHING AREA
========================= */
.game-stage{
    position:relative;
    width:min(980px,94vw);
    height:calc(100vh - 50px);
    margin:0 auto;
    overflow:hidden;
}

.match-board{
    position:relative;
    width:100%;
    height:100%;
}

/* SVG is behind the items but above the board */
#connectionSvg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:2;
    overflow:visible;
}

.connection-line{
    fill:none;
    stroke:#f58545;
    stroke-width:3.5;
    stroke-linecap:round;
    stroke-dasharray:7 5;
    filter:drop-shadow(0 2px 1px rgba(245,133,69,.12));
    animation:drawLine .35s ease-out;
}

@keyframes drawLine{
    from{
        stroke-dasharray:0 1000;
        opacity:.2;
    }
    to{
        stroke-dasharray:7 5;
        opacity:1;
    }
}
.left-column,
.right-column{
    position:absolute;
    top:18px;
    bottom:8px;
    width:40%;
    display:flex;
    flex-direction:column;
    justify-content:space-around;
    z-index:3;
}

/* LEFT SIDE */
.left-column{
    left:10%;
}

/* RIGHT SIDE */
.right-column{
    right:0%;
}

/* One row = one lock/key pair */
.match-item{
    position:relative;
    height:78px;
    display:flex;
    align-items:center;
}

/* =========================
   LEFT LOCK
========================= */
.lock-item{
    justify-content:flex-start;
    padding-left:12px;
}

.question-label{
    width:38px;
    font-size:20px;
    color:#222;
    font-weight:400;
}

.lock-wrap{
    width:112px;
    height:72px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.lock-image{
    width:92px;
    height:72px;
    object-fit:contain;
    display:block;
    cursor:pointer;
    transition:transform .16s ease,filter .16s ease;
    position:relative;
    z-index:4;
}

.lock-image:hover{
    transform:scale(1.05);
}

.lock-item.selected .lock-image{
    transform:scale(1.08);
    filter:drop-shadow(0 0 7px rgba(245,133,69,.7));
}

/* orange connection dot */
.connect-dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#f58545;
    border:2px solid #fff;
    box-shadow:0 0 0 1px #f58545;
    position:absolute;
    z-index:6;
    cursor:pointer;
}

.left-dot{
    right:-3px;
    top:50%;
    transform:translateY(-50%);
}

/* =========================
   RIGHT KEY + NAME
========================= */
.key-item{
    justify-content:flex-start;
    padding-left:0;
}

.key-wrap{
    width:72px;
    height:72px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.key-image{
    width:62px;
    height:65px;
    object-fit:contain;
    display:block;
    cursor:pointer;
    transition:transform .16s ease,filter .16s ease;
    position:relative;
    z-index:4;
}

.key-image:hover{
    transform:scale(1.05);
}

.key-item.selected .key-image{
    transform:scale(1.08);
    filter:drop-shadow(0 0 7px rgba(245,133,69,.7));
}

.right-dot{
    left:-2px;
    top:50%;
    transform:translateY(-50%);
}

/* exact reference-card colours */
.name-card{
    width:185px;
    min-height:44px;
    margin-left:18px;
    padding:8px 16px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#221e1f;
    font-size:20px;
    line-height:1.05;
    font-weight:400;
    text-align:center;
    cursor:pointer;
    transition:transform .16s ease,opacity .16s ease,box-shadow .16s ease;
    position:relative;
    z-index:4;
}

/* Colours sampled from the supplied reference image */
.key-item:nth-child(odd) .name-card{
    background:#f58545;
}

.key-item:nth-child(even) .name-card{
    background:#fecd32;
}

.key-item:hover .name-card{
    transform:translateY(-2px);
    box-shadow:0 4px 8px rgba(0,0,0,.08);
}

.key-item.selected .name-card{
    box-shadow:0 0 0 3px rgba(245,133,69,.35);
}

/* Correctly matched items */
.match-item.matched .connect-dot{
    background:#f58545;
    box-shadow:0 0 0 2px #fff,0 0 0 3px #f58545;
}

.match-item.matched .lock-image,
.match-item.matched .key-image{
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.12));
}

/* =========================
   POPUP — KEPT SAME AS ORIGINAL
========================= */
.popup-overlay{
    position:fixed !important;
    inset:0 !important;
    display:flex !important;
    justify-content:center !important;
    align-items:center !important;
    background:transparent !important;
    opacity:0 !important;
    pointer-events:none !important;
    transition:opacity .3s ease,background .3s ease !important;
    z-index:1000 !important;
}

.popup-overlay.active{
    opacity:1 !important;
    pointer-events:auto !important;
    background:transparent !important;
}

.popup-overlay.active .popup-card{
    transform:scale(1) !important;
}

.popup-overlay .popup-card{
    position:relative !important;
    width:520px !important;
    height:300px !important;
    max-width:calc(100vw - 30px) !important;
    padding:30px !important;
    border-radius:36px !important;
    text-align:center !important;
    box-shadow:0 20px 40px rgba(0,0,0,.1);
    transform:scale(.8) !important;
    transition:transform .35s cubic-bezier(.175,.885,.32,1.275) !important;
    overflow:hidden !important;
    display:flex !important;
    flex-direction:column !important;
    align-items:center !important;
    justify-content:center !important;
    margin:0 !important;
}

.popup-overlay .popup-card::before,
.popup-overlay .popup-card::after{
    content:'' !important;
    position:absolute !important;
    border-radius:50% !important;
    pointer-events:none !important;
}

.popup-overlay .popup-card::before{
    width:220px !important;
    height:220px !important;
    top:-60px !important;
    right:-50px !important;
}

.popup-overlay .popup-card::after{
    width:180px !important;
    height:180px !important;
    bottom:-70px !important;
    left:-40px !important;
}

.popup-overlay .popup-card.correct{
    background:#edfbf4 !important;
    border:6px solid #00c885 !important;
}

.popup-overlay .popup-card.correct::before,
.popup-overlay .popup-card.correct::after{
    background:rgba(162,245,209,.45) !important;
}

.popup-overlay .popup-card.correct .popup-title{
    color:#00a86b !important;
}

.popup-overlay .popup-card.correct .popup-subtitle{
    color:#2e7d5b !important;
}

.popup-overlay .popup-card.wrong{
    background:#fff0f2 !important;
    border:6px solid #ff6b7a !important;
}

.popup-overlay .popup-card.wrong::before,
.popup-overlay .popup-card.wrong::after{
    background:rgba(255,196,203,.45) !important;
}

.popup-overlay .popup-card.wrong .popup-title{
    color:#d33847 !important;
}

.popup-overlay .popup-card.wrong .popup-subtitle{
    color:#a33b45 !important;
}

.popup-overlay .popup-card.complete{
    background:#f0f3ff !important;
    border:6px solid #6c5ce7 !important;
    box-shadow:0 20px 45px rgba(108,92,231,.18),0 0 0 8px rgba(162,155,254,.12) !important;
}

.popup-overlay .popup-card.complete::before,
.popup-overlay .popup-card.complete::after{
    background:rgba(162,155,254,.35) !important;
}

.popup-overlay .popup-card.complete .popup-title{
    color:#6c5ce7 !important;
}

.popup-overlay .popup-card.complete .popup-subtitle{
    color:#4834d4 !important;
}

.popup-overlay .popup-icon{
    font-size:4.8rem !important;
    margin:0 0 12px !important;
    padding:0 !important;
    height:auto !important;
    width:auto !important;
    line-height:1 !important;
    z-index:2 !important;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.1)) !important;
    position:relative !important;
}

.popup-overlay .popup-title,
.popup-overlay h2.popup-title{
    font-size:3rem !important;
    font-weight:600 !important;
    margin:0 0 8px !important;
    padding:0 !important;
    height:auto !important;
    line-height:1.15 !important;
    z-index:2 !important;
    position:relative !important;
}

.popup-overlay .popup-subtitle,
.popup-overlay p.popup-subtitle{
    font-size:1.4rem !important;
    font-weight:500 !important;
    margin:0 !important;
    padding:0 !important;
    height:auto !important;
    line-height:1.35 !important;
    z-index:2 !important;
    text-align:center !important;
    position:relative !important;
}

.popup-overlay .replay-btn{
    background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%) !important;
    box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22) !important;
    width:185px !important;
    min-width:185px !important;
    height:46px !important;
    padding:0 20px !important;
    margin-top:14px !important;
    font-size:22px !important;
    font-weight:600 !important;
    line-height:46px !important;
    border-radius:23px !important;
    border:2px solid rgba(255,255,255,.35) !important;
    letter-spacing:.2px !important;
    color:#fff !important;
    cursor:pointer !important;
    z-index:2 !important;
    font-family:'Livvic',sans-serif !important;
    transition:transform .12s ease,box-shadow .12s ease !important;
}

.popup-overlay .replay-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26) !important;
}

.popup-overlay .replay-btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18) !important;
}

.popup-overlay .popup-card.complete .popup-icon{
    animation:finalTrophyBounce 1.2s ease-in-out infinite !important;
}

@keyframes finalTrophyBounce{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}

/* =========================
   CONFETTI — SAME BEHAVIOUR
========================= */
#confettiContainer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1100;
}

.confetti-piece{
    position:absolute;
    width:9px;
    height:14px;
    border-radius:2px;
    opacity:0;
    animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;
    will-change:transform,opacity;
}

.final-confetti-piece{
    width:10px;
    height:16px;
    animation-duration:2300ms;
}

.final-confetti-piece:nth-child(3n){border-radius:50%}
.final-confetti-piece:nth-child(4n){width:7px;height:19px;border-radius:1px}
.final-confetti-piece:nth-child(5n){width:13px;height:8px;border-radius:2px}

@keyframes pageConfetti{
    0%{
        opacity:1;
        transform:translate3d(0,0,0) rotate(0deg) scale(1)
    }
    55%{opacity:1}
    100%{
        opacity:0;
        transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72)
    }
}

/* =========================
   LARGE MONITORS
========================= */
@media screen and (min-width:1600px){
    header{
        height:95px;
    }

    h2{
        font-size:30px;
    }

    .game-stage{
        width:min(1350px,94vw);
        height:calc(100vh - 110px);
    }

    .left-column,
    .right-column{
        top:18px;
        bottom:12px;
    }

    .match-item{
        height:100px;
    }

    .question-label{
        width:48px;
        font-size:26px;
    }

    .lock-wrap{
        width:145px;
        height:92px;
    }

    .lock-image{
        width:120px;
        height:90px;
    }

    .connect-dot{
        width:15px;
        height:15px;
    }

    .key-wrap{
        width:90px;
        height:90px;
    }

    .key-image{
        width:76px;
        height:88px;
    }

    .name-card{
        width:250px;
        min-height:58px;
        margin-left:24px;
        padding:10px 20px;
        font-size:28px;
        border-radius:13px;
    }

    .connection-line{
        stroke-width:4;
        stroke-dasharray:9 6;
    }
}

</style>
</head>

<body>

<header>
    <h2>Match each number lock to its number name key</h2>
</header>

<main class="game-stage">
    <div class="match-board">

        <!-- Lines are drawn here -->
        <svg id="connectionSvg" aria-hidden="true"></svg>

        <!-- LEFT: NUMBER LOCKS -->
        <section class="left-column" id="leftColumn" aria-label="Number locks"></section>

        <!-- RIGHT: NUMBER NAME KEYS -->
        <section class="right-column" id="rightColumn" aria-label="Number name keys"></section>

    </div>
</main>

<div id="confettiContainer"></div>

<!-- Same popup structure and behaviour -->
<div class="popup-overlay" id="popup">
    <div class="popup-card" id="popupCard">
        <div class="popup-icon" id="popupIcon">🌟</div>
        <h2 class="popup-title" id="popupTitle">Amazing!</h2>
        <p class="popup-subtitle" id="popupSubtitle">You got it right! ✨</p>
        <button class="replay-btn" id="playAgainBtn" style="display:none" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
/* ============================================================
   IMAGE PATHS
   ------------------------------------------------------------
   Change ONLY these paths if your project stores the images
   in another folder.

   Left side = number-lock images
   Right side = coloured-key images
============================================================ */

const IMAGE_BASE = '../images/';

const quizData = [
    {
        num:53,
        name:'Fifty three',
        lockImage: IMAGE_BASE + 'lock-53.png',
        keyImage: IMAGE_BASE + 'key-yellow.png'
    },
    {
        num:38,
        name:'Thirty eight',
        lockImage: IMAGE_BASE + 'lock-38.png',
        keyImage: IMAGE_BASE + 'key-blue.png'
    },
    {
        num:51,
        name:'Fifty one',
        lockImage: IMAGE_BASE + 'lock-51.png',
        keyImage: IMAGE_BASE + 'key-red.png'
    },
    {
        num:50,
        name:'Fifty',
        lockImage: IMAGE_BASE + 'lock-50.png',
        keyImage: IMAGE_BASE + 'key-darkred.png'
    },
    {
        num:42,
        name:'Forty two',
        lockImage: IMAGE_BASE + 'lock-42.png',
        keyImage: IMAGE_BASE + 'key-pink.png'
    },
    {
        num:57,
        name:'Fifty seven',
        lockImage: IMAGE_BASE + 'lock-57.png',
        keyImage: IMAGE_BASE + 'key-blue2.png'
    },
    {
        num:29,
        name:'Twenty nine',
        lockImage: IMAGE_BASE + 'lock-29.png',
        keyImage: IMAGE_BASE + 'key-mint.png'
    }
];

/* ============================================================
   GAME STATE
============================================================ */

let selectedLock = null;
let selectedKey = null;
let matchedPairs = [];
let popupTimer = null;

/* Keep the same audio behaviour as the original */
const audioCtx =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

/* ============================================================
   SOUND
============================================================ */

function playAudioTone(isCorrect){
    if(audioCtx.state === 'suspended'){
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if(isCorrect){
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(
            880,
            audioCtx.currentTime + 0.2
        );
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + 0.3
        );
    }else{
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(
            120,
            audioCtx.currentTime + 0.2
        );
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + 0.25
        );
    }

    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

function speak(text){
    if(!('speechSynthesis' in window)) return;

    speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'en-US';
    msg.volume = .8;
    msg.rate = 1;
    msg.pitch = 1;

    speechSynthesis.speak(msg);
}

/* ============================================================
   SHUFFLE
============================================================ */

function shuffled(array){
    return [...array].sort(() => Math.random() - 0.5);
}

/* ============================================================
   BUILD GAME
============================================================ */

function loadGame(){
    selectedLock = null;
    selectedKey = null;
    matchedPairs = [];

    const left = document.getElementById('leftColumn');
    const right = document.getElementById('rightColumn');

    left.innerHTML = '';
    right.innerHTML = '';

    /*
       LEFT SIDE
       Fixed order: 53, 38, 51, 50, 42, 57, 29
    */
    quizData.forEach((item, index) => {

        const row = document.createElement('div');
        row.className = 'match-item lock-item';
        row.dataset.num = item.num;

    const lockWrap = document.createElement('div');
        lockWrap.className = 'lock-wrap';

        const lockImg = document.createElement('img');
        lockImg.className = 'lock-image';
        lockImg.src = item.lockImage;
        lockImg.alt = 'Number lock ' + item.num;
        lockImg.draggable = false;

        const dot = document.createElement('span');
        dot.className = 'connect-dot left-dot';
        dot.dataset.num = item.num;
        dot.title = 'Select lock';

        lockImg.addEventListener('click', () => selectLock(item.num));
        dot.addEventListener('click', () => selectLock(item.num));

        lockWrap.appendChild(lockImg);
        lockWrap.appendChild(dot);

      row.appendChild(lockWrap);

        left.appendChild(row);
    });

    /*
       RIGHT SIDE
       Shuffled order, just like the reference image.
    */
    shuffled(quizData).forEach(item => {

        const row = document.createElement('div');
        row.className = 'match-item key-item';
        row.dataset.num = item.num;

        const keyWrap = document.createElement('div');
        keyWrap.className = 'key-wrap';

        const dot = document.createElement('span');
        dot.className = 'connect-dot right-dot';
        dot.dataset.num = item.num;
        dot.title = 'Select key';

        const keyImg = document.createElement('img');
        keyImg.className = 'key-image';
        keyImg.src = item.keyImage;
        keyImg.alt = item.name + ' key';
        keyImg.draggable = false;

        const nameCard = document.createElement('div');
        nameCard.className = 'name-card';
        nameCard.textContent = item.name;

        dot.addEventListener('click', () => selectKey(item.num));
        keyImg.addEventListener('click', () => selectKey(item.num));
        nameCard.addEventListener('click', () => selectKey(item.num));

        keyWrap.appendChild(dot);
        keyWrap.appendChild(keyImg);

        row.appendChild(keyWrap);
        row.appendChild(nameCard);

        right.appendChild(row);
    });

    requestAnimationFrame(redrawLines);
}

/* ============================================================
   SELECTION
============================================================ */

function selectLock(num){

    /* Already matched locks cannot be selected again */
    if(matchedPairs.some(pair => pair.num === num)){
        return;
    }

    clearTemporarySelection();

    selectedLock = num;

    const row = document.querySelector(
        '.lock-item[data-num="' + num + '"]'
    );

    if(row){
        row.classList.add('selected');
    }

    /*
       If a key was already selected, compare immediately.
    */
    if(selectedKey !== null){
        compareSelection();
    }
}

function selectKey(num){

    /* Already matched keys cannot be selected again */
    if(matchedPairs.some(pair => pair.num === num)){
        return;
    }

    clearTemporarySelection();

    selectedKey = num;

    const row = document.querySelector(
        '.key-item[data-num="' + num + '"]'
    );

    if(row){
        row.classList.add('selected');
    }

    /*
       If a lock was already selected, compare immediately.
    */
    if(selectedLock !== null){
        compareSelection();
    }
}

function clearTemporarySelection(){

    document
        .querySelectorAll('.lock-item.selected,.key-item.selected')
        .forEach(el => el.classList.remove('selected'));
}

/* ============================================================
   CHECK MATCH
============================================================ */

function compareSelection(){

    if(selectedLock === null || selectedKey === null){
        return;
    }

    const lockNum = selectedLock;
    const keyNum = selectedKey;

    if(lockNum === keyNum){

        /* Correct */
        matchedPairs.push({
            num:lockNum
        });

        playAudioTone(true);
        speak('Correct');

        markMatched(lockNum);
        drawAllLines();

        selectedLock = null;
        selectedKey = null;

        const final =
            matchedPairs.length === quizData.length;

        if(final){

            /*
               Same original behaviour:
               Correct popup first, then final popup.
            */
            showPopup(
                'correct',
                '🌟',
                'Amazing!',
                'You got it right! ✨',
                false
            );

            showSmallConfetti(false);

            clearTimeout(popupTimer);

            popupTimer = setTimeout(() => {

                showPopup(
                    'complete',
                    '🏆',
                    'Congratulations!',
                    'Fantastic job! You solved all questions! 🎉',
                    true
                );

                showSmallConfetti(true);

            },1800);

        }else{

            showPopup(
                'correct',
                '🌟',
                'Amazing!',
                'You got it right! ✨',
                false
            );

            showSmallConfetti(false);
        }

    }else{

        /* Wrong */
        playAudioTone(false);
        speak('Try again');

        showPopup(
            'wrong',
            '😟',
            'Keep Going!',
            'Try again, you can do it! 🌈',
            false
        );

        selectedLock = null;
        selectedKey = null;
    }
}

/* ============================================================
   MARK MATCHED
============================================================ */

function markMatched(num){

    const lockRow = document.querySelector(
        '.lock-item[data-num="' + num + '"]'
    );

    const keyRow = document.querySelector(
        '.key-item[data-num="' + num + '"]'
    );

    if(lockRow){
        lockRow.classList.remove('selected');
        lockRow.classList.add('matched');
    }

    if(keyRow){
        keyRow.classList.remove('selected');
        keyRow.classList.add('matched');
    }
}

/* ============================================================
   DRAW LINES
============================================================ */

function getDotCenter(dot){

    const board =
        document.querySelector('.match-board');

    const boardRect =
        board.getBoundingClientRect();

    const dotRect =
        dot.getBoundingClientRect();

    return {
        x: dotRect.left + dotRect.width / 2 - boardRect.left,
        y: dotRect.top + dotRect.height / 2 - boardRect.top
    };
}

function drawAllLines(){

    const svg =
        document.getElementById('connectionSvg');

    const board =
        document.querySelector('.match-board');

    const boardRect =
        board.getBoundingClientRect();

    svg.setAttribute('viewBox',
        '0 0 ' +
        boardRect.width +
        ' ' +
        boardRect.height
    );

    svg.innerHTML = '';

    matchedPairs.forEach(pair => {

        const leftDot = document.querySelector(
            '.left-dot[data-num="' + pair.num + '"]'
        );

        const rightDot = document.querySelector(
            '.right-dot[data-num="' + pair.num + '"]'
        );

        if(!leftDot || !rightDot){
            return;
        }

        const start = getDotCenter(leftDot);
        const end = getDotCenter(rightDot);

        /*
           Smooth curved line:
           left dot -> centre -> right dot
        */
        const distance = Math.abs(end.x - start.x);
        const curve = Math.max(45, distance * .35);

        const path = document.createElementNS(
            'http://www.w3.org/2000/svg',
            'path'
        );

        path.setAttribute(
            'd',
            `M ${start.x} ${start.y}
             C ${start.x + curve} ${start.y},
               ${end.x - curve} ${end.y},
               ${end.x} ${end.y}`
        );

        path.setAttribute('class','connection-line');

        svg.appendChild(path);
    });
}

function redrawLines(){
    requestAnimationFrame(drawAllLines);
}

/* Keep lines aligned if the browser is resized */
window.addEventListener('resize', redrawLines);

/* ============================================================
   CONFETTI — SAME AS ORIGINAL
============================================================ */

function showSmallConfetti(isFinal=false){

    const c =
        document.getElementById('confettiContainer');

    if(!c) return;

    c.innerHTML = '';

    const count = isFinal ? 95 : 42;

    const colors = [
        '#00b894',
        '#e67e22',
        '#6c5ce7',
        '#0984e3',
        '#fdcb6e',
        '#ff6b7a',
        '#00cec9',
        '#a29bfe'
    ];

    for(let i=0;i<count;i++){

        const p =
            document.createElement('span');

        p.className =
            isFinal
            ? 'confetti-piece final-confetti-piece'
            : 'confetti-piece';

        p.style.left =
            (Math.random()*100) + '%';

        p.style.top =
            (-8 + Math.random()*10) + '%';

        p.style.setProperty(
            '--x',
            ((Math.random()*520-260) *
            (isFinal ? 1.15 : .9)) + 'px'
        );

        p.style.setProperty(
            '--y',
            (window.innerHeight *
            (.82 + Math.random()*.48)) + 'px'
        );

        p.style.setProperty(
            '--r',
            (Math.random()*1400-700) + 'deg'
        );

        p.style.background =
            colors[Math.floor(Math.random()*colors.length)];

        p.style.animationDelay =
            (Math.random() *
            (isFinal ? 500 : 220)) + 'ms';

        c.appendChild(p);

        setTimeout(
            () => p.remove(),
            isFinal ? 2900 : 2050
        );
    }
}

/* ============================================================
   POPUP — SAME BEHAVIOUR AS ORIGINAL
============================================================ */

function showPopup(
    status,
    icon,
    title,
    subtitle,
    isFinal=false
){

    const card =
        document.getElementById('popupCard');

    card.className =
        'popup-card ' + status;

    document.getElementById('popupIcon').innerText =
        icon;

    document.getElementById('popupTitle').innerText =
        title;

    document.getElementById('popupSubtitle').innerText =
        subtitle;

    document.getElementById('playAgainBtn').style.display =
        isFinal ? 'inline-block' : 'none';

    document.getElementById('popup').classList.add('active');

    clearTimeout(popupTimer);

    if(!isFinal){
        popupTimer = setTimeout(closePopup,1800);
    }
}

function closePopup(){
    document
        .getElementById('popup')
        .classList.remove('active');
}

/* ============================================================
   RESTART
============================================================ */

function restartGame(){

    clearTimeout(popupTimer);

    closePopup();

    const c =
        document.getElementById('confettiContainer');

    if(c){
        c.innerHTML = '';
    }

    loadGame();
}

/* ============================================================
   START
============================================================ */

loadGame();
