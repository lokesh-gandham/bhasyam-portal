<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Place Value Space Mission</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================
   GLOBAL
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Livvic',sans-serif;
}

:root{
    --ink:#2f4f4f;
    --orange:#e67e22;
    --orange-dark:#d35400;
    --green:#00b894;
    --green-dark:#008f72;
    --blue:#4d86b8;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    color:var(--ink);


    display:grid;
    grid-template-rows:auto 1fr auto;

    padding:10px 18px;
}


/* =========================================
   HOME
========================================= */

.home-btn{
    position:fixed;

    top:14px;
    left:22px;

    width:62px;
    height:62px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.85);

    color:var(--ink);

    font-size:27px;

    cursor:pointer;

    box-shadow:0 8px 20px rgba(0,0,0,.10);

    z-index:100;
}


/* =========================================
   HEADER
========================================= */

header{
    text-align:center;
    position:relative;
    z-index:5;
}

h1{
    font-size:clamp(22px,2vw,30px);
    font-weight:400;
    color:var(--ink);

    margin-bottom:8px;
}

.instruction{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    padding:8px 25px;

    max-width:94vw;

    border-radius:999px;

    background:rgba(255,255,255,.68);

    border:2px solid rgba(255,255,255,.9);

    box-shadow:0 8px 20px rgba(60,80,110,.08);

    font-size:clamp(20px,1.5vw,25px);
    font-weight:500;

    color:#52636c;
}


/* =========================================
   MAIN GAME AREA
========================================= */

.game-stage{
    width:min(1500px,96vw);

    height:95%;

    margin:auto;

    min-height:0;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    overflow:hidden;
}


/* =========================================
   SPACE MISSION WORLD
========================================= */

.space-world{

    width:100%;
    height:100%;

    min-height:0;

    position:relative;

    display:grid;

    grid-template-columns:
        minmax(260px,.85fr)
        minmax(300px,1.1fr)
        minmax(260px,.9fr);

    align-items:center;

    gap:clamp(18px,3vw,45px);

    padding:14px 25px;

    border-radius:42px;

    background:rgba(255,255,255,.54);

    border:3px solid rgba(255,255,255,.9);


    overflow:hidden;
}


/* STARS */

.star{
    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#f6b93b;

    box-shadow:0 0 12px rgba(246,185,59,.7);

    animation:twinkle 2s infinite alternate;
}

.star.s1{
    top:14%;
    left:8%;
}

.star.s2{
    top:25%;
    right:8%;
}

.star.s3{
    bottom:18%;
    left:18%;
}

.star.s4{
    bottom:12%;
    right:24%;
}

@keyframes twinkle{

    from{
        transform:scale(.7);
        opacity:.5;
    }

    to{
        transform:scale(1.4);
        opacity:1;
    }

}


/* =========================================
   LEFT MISSION PANEL
========================================= */

.mission-info{

    height:auto;

    min-height:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    gap:20px;

    position:relative;

    z-index:2;
}


.mission-badge{

    display:flex;

    align-items:center;

    gap:12px;

    font-size:17px;

    font-weight:500;

    letter-spacing:3px;

    color:#80623c;
}

.badge-icon{

    width:48px;
    height:48px;

    display:grid;
    place-items:center;

    border-radius:16px;

    background:#fff2d6;

    color:#d87915;

    font-size:24px;

    box-shadow:0 6px 0 rgba(216,121,21,.14);
}


/* QUESTION */

.question-display{

    font-size:30px;
    font-weight:400;

   

    line-height:1.42;

    color:var(--ink);

    padding:20px;

    border-radius:24px;

    background:rgba(255,255,255,.55);

    border-left:6px solid var(--orange);

    box-shadow:0 10px 25px rgba(50,70,100,.06);
}


/* VOICE */

.voice-btn{

    width:55px;
    height:55px;

    border:none;

    border-radius:50%;

    background:#e7f7f3;

    color:var(--green-dark);

    font-size:24px;

    cursor:pointer;

    box-shadow:0 7px 0 rgba(0,143,114,.15);
}


/* =========================================
   CENTER ROCKET AREA
========================================= */

.launch-zone{

    height:100%;

    min-height:0;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    z-index:3;
}


/* ORBIT */

.orbit{

    position:absolute;

    width:min(420px,90%);

    aspect-ratio:1;

    border:3px dashed rgba(77,134,184,.20);

    border-radius:50%;

    animation:rotateOrbit 22s linear infinite;
}

@keyframes rotateOrbit{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* ROCKET */

.rocket{

    position:relative;

    z-index:3;

    width:min(330px,80%);

    min-height:320px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}


/* ROCKET BODY */

.rocket-body{

    width:220px;

    height:220px;

    border-radius:50% 50% 44% 44%;

    background:

        linear-gradient(
            145deg,
            #ffffff,
            #dcecf5
        );

    border:7px solid white;

    box-shadow:
        0 14px 0 rgba(70,90,120,.12),
        inset 0 0 25px rgba(77,134,184,.08);

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    position:relative;
}


/* WINDOW */

.rocket-window{

    width:78px;

    height:120px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            #5b9bd5,
            #356b9f
        );

    display:grid;

    place-items:center;

    color:white;

    font-size:56px;

    font-weight:500;

    box-shadow:
        0 9px 0 rgba(30,70,110,.14);
}


/* SECOND DIGIT */

.rocket-digit{

    font-size:55px;

    font-weight:500;

    color:var(--ink);
}


/* ROCKET FIRE */

.fire{

    width:100px;

    height:55px;

    margin-top:-4px;

    background:
        linear-gradient(
            to bottom,
            #ffb463,
            #f39c12,
            transparent
        );

    clip-path:
        polygon(
            15% 0,
            85% 0,
            70% 100%,
            50% 75%,
            30% 100%
        );

    filter:
        drop-shadow(
            0 10px 15px rgba(243,156,18,.25)
        );
}


/* ROCKET LABEL */

.launch-label{

    margin-top:8px;

    padding:8px 20px;

    border-radius:999px;

    background:rgba(0,184,148,.12);

    color:var(--green-dark);

    font-size:16px;

    font-weight:500;

    letter-spacing:2px;
}


/* =========================================
   RIGHT MISSION CONTROL
========================================= */

.mission-control{

    height:auto;

    min-height:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    gap:16px;

    position:relative;

    z-index:2;
}


.control-title{

    font-size:18px;

    font-weight:500;

    letter-spacing:3px;

    color:#80623c;

    text-align:center;

    margin-bottom:5px;
}


/* ANSWER CONSOLE */

.answer-console{

    position:relative;

    padding:18px;

    border-radius:24px;

    background:

        linear-gradient(
            145deg,
            rgba(231,244,255,.92),
            rgba(255,250,238,.92)
        );

    border:3px solid rgba(255,255,255,.9);

    box-shadow:
        0 10px 0 rgba(70,90,120,.10);

    transition:.2s ease;
}

.answer-console:hover{

    transform:translateY(-2px);
}


/* DIGIT LABEL */

.console-top{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:12px;
}


.digit-chip{

    width:48px;
    height:48px;

    border-radius:14px;

    display:grid;

    place-items:center;

    background:
        linear-gradient(
            145deg,
            #5b9bd5,
            #376fae
        );

    color:white;

    font-size:25px;

    font-weight:500;

    box-shadow:0 6px 0 rgba(41,66,109,.12);
}


.console-text{

    font-size:18px;

    font-weight:500;

    color:#40535c;
}


/* INPUT */

.answer-input{

    width:100%;

    height:58px;

    border-radius:15px;

    border:2px solid #f2a45e;

    background:white;

    outline:none;

    color:var(--ink);

    font-size:25px;

    font-weight:500;

    text-align:center;

    transition:.2s ease;
}


.answer-input:focus{

    transform:translateY(-2px);

    border-color:var(--orange);

    box-shadow:
        0 6px 0 rgba(230,126,34,.15);
}


.answer-input.locked{

    border-color:var(--green);

    background:#effcf7;

    color:var(--green-dark);

    box-shadow:
        0 6px 0 rgba(0,184,148,.18);
}


.answer-input:disabled{

    cursor:not-allowed;

    opacity:1;
}


/* =========================================
   BOTTOM BUTTONS
========================================= */

.bottom-controls{

    width:min(96vw,1500px);

    display:grid;

    grid-template-columns:1fr auto 1fr;

    align-items:center;

    gap:20px;

    padding:10px 0;

    position:relative;

    z-index:20;
}


.left-control{
    justify-self:start;
}

.center-control{
    justify-self:center;
}

.right-control{
    justify-self:end;
}


/* SAME BUTTON SIZE */

.nav-btn,
.submit-btn,
.replay-btn{

    width:178px;

    min-width:178px;

    height:45px;

    border:none;

    border-radius:28px;

    color:white;

    font-family:'Livvic',sans-serif;

    font-size:20px;

    font-weight:500;

    cursor:pointer;

    transition:.12s ease;

    line-height:45px;
}


.nav-btn.prev{

    background:#b2bec3;

    box-shadow:0 6px 0 #636e72;
}


.nav-btn.next{

    background:#e67e22;

    box-shadow:0 6px 0 #d35400;
}


.submit-btn{

    background:#00b894;

    box-shadow:0 6px 0 #008f72;
}


.replay-btn{

    background:#0984e3;

    box-shadow:0 6px 0 #0975c7;

    margin-top:20px;
}


.nav-btn:active:not(:disabled),
.submit-btn:active:not(:disabled),
.replay-btn:active{

    transform:translateY(4px);
}


.nav-btn:disabled,
.submit-btn:disabled{

    background:#b2bec3;

    box-shadow:0 6px 0 #636e72;

    opacity:.7;

    cursor:not-allowed;
}


/* =========================================
   EXACT STYLE POPUP
========================================= */

.popup-overlay{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    opacity:0;

    pointer-events:none;

    transition:opacity .3s ease;

    z-index:1000;
}


.popup-overlay.active{

    opacity:1;

    pointer-events:auto;
}


/* SAME FINAL POPUP AS NUMBER NAME QUEST */
.popup-card{
    position:relative;
    width:520px;
    height:300px;
    max-width:calc(100vw - 30px);
    padding:30px;
    border-radius:36px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,.1);
    transform:scale(.8);
    transition:.35s cubic-bezier(.175,.885,.32,1.275);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.popup-card::before,
.popup-card::after{
    content:"";
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}

.popup-card::before{
    width:220px;
    height:220px;
    top:-60px;
    right:-50px;
}

.popup-card::after{
    width:180px;
    height:180px;
    bottom:-70px;
    left:-40px;
}

/* CORRECT */
.popup-card.correct{
    background:#edfbf4;
    border:6px solid #00c885;
}

.popup-card.correct::before,
.popup-card.correct::after{
    background:rgba(162,245,209,.45);
}

.popup-card.correct .popup-title{
    color:#00a86b;
}

.popup-card.correct .popup-subtitle{
    color:#2e7d5b;
}

/* WRONG */
.popup-card.wrong{
    background:#fff0f2;
    border:6px solid #ff6b7a;
}

.popup-card.wrong::before,
.popup-card.wrong::after{
    background:rgba(255,196,203,.45);
}

.popup-card.wrong .popup-title{
    color:#d33847;
}

.popup-card.wrong .popup-subtitle{
    color:#a33b45;
}

/* FINAL */
.popup-card.complete{
    background:#f0f3ff;
    border:6px solid #6c5ce7;
}

.popup-card.complete::before,
.popup-card.complete::after{
    background:rgba(162,155,254,.35);
}

.popup-card.complete .popup-title{
    color:#6c5ce7;
}

.popup-card.complete .popup-subtitle{
    color:#4834d4;
}

.popup-overlay.active .popup-card{
    transform:scale(1);
}

.popup-icon{
    font-size:4.8rem;
    margin-bottom:12px;
    z-index:2;
    line-height:1;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.1));
}

.popup-title{
    font-size:3rem;
    font-weight:600;
    margin-bottom:8px;
    z-index:2;
}

.popup-subtitle{
    font-size:1.4rem;
    font-weight:500;
    z-index:2;
}

/* EXACT FINAL POPUP FINISH */
.popup-card.complete{
    box-shadow:
        0 20px 45px rgba(108,92,231,.18),
        0 0 0 8px rgba(162,155,254,.12);
}

.popup-card.complete .replay-btn{
    margin-top:14px;
}

.popup-card.complete .popup-icon{
    animation:finalTrophyBounce 1.2s ease-in-out infinite;
}

@keyframes finalTrophyBounce{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}

/* EXACT NUMBER NAME QUEST PLAY AGAIN BUTTON */
.replay-btn{
    background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%);
    box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22);
    width:185px;
    min-width:185px;
    height:46px;
    padding:0 20px;
    margin-top:14px;
    font-size:22px;
    font-weight:600;
    line-height:46px;
    border-radius:23px;
    border:2px solid rgba(255,255,255,.35);
    letter-spacing:.2px;
    transition:transform .12s ease,box-shadow .12s ease;
}

.replay-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26);
}

.replay-btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18);
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-height:850px) and (min-width:901px){

    .space-world{
        padding:14px 22px;
    }

    .rocket{
        min-height:250px;
    }

    .rocket-body{
        width:185px;
        height:185px;
    }

    .rocket-window{
        height:100px;
        width:65px;
        font-size:48px;
    }

    .rocket-digit{
        font-size:60px;
    }

    .mission-info,
    .mission-control{
        gap:12px;
    }

    .answer-console{
        padding:12px;
    }

    .answer-input{
        height:48px;
    }

    .question-display{
        padding:14px;
    }

}


@media(max-width:1200px) and (min-width:951px){

    .space-world{
        grid-template-columns:minmax(235px,.9fr) minmax(270px,1fr) minmax(235px,.9fr);
        gap:18px;
        padding:16px 18px;
    }

    .question-display{
        font-size:30px;
        padding:16px;
    }

    .rocket{
        width:min(270px,100%);
        min-height:260px;
    }

    .rocket-body{
        width:180px;
        height:180px;
    }

    .rocket-window{
        width:62px;
        height:98px;
        font-size:46px;
    }

    .rocket-digit{
        font-size:58px;
    }

    .answer-console{
        padding:13px;
        border-radius:20px;
    }

    .answer-input{
        height:50px;
    }

    .console-text{
        font-size:16px;
    }
}


@media(max-width:950px){

    body{

        height:auto;

        overflow:auto;

        display:flex;

        flex-direction:column;
    }

    .space-world{

        height:auto;

        grid-template-columns:1fr;

        grid-template-areas:
            "question"
            "rocket"
            "answers";

        padding:25px;
    }

    .mission-info{ grid-area:question; }
    .launch-zone{ grid-area:rocket; }
    .mission-control{ grid-area:answers; }

    .game-stage{

        height:auto;

        overflow:visible;
    }

    .mission-info,
    .mission-control{

        height:auto;
    }

    .launch-zone{

        min-height:380px;
    }

    .bottom-controls{

        position:sticky;

        bottom:0;

        background:rgba(255,255,255,.8);

        backdrop-filter:blur(10px);
    }

}


@media(max-width:620px){

    body{
        padding:8px;
    }

    .home-btn{

        width:48px;
        height:48px;

        font-size:21px;

        top:8px;
        left:8px;
    }

    h1{

        font-size:19px;

        padding:0 48px;
    }

    .instruction{

        font-size:15px;

        padding:8px 14px;

        border-radius:20px;
    }

    .space-world{

        padding:16px;

        border-radius:28px;
    }

    .question-display{

        font-size:22px;
    }

    .rocket-body{

        width:175px;

        height:175px;
    }

    .rocket-window{

        width:60px;

        height:95px;

        font-size:45px;
    }

    .rocket-digit{

        font-size:56px;
    }

    .bottom-controls{

        gap:6px;
    }

    .nav-btn,
    .submit-btn{

        width:110px;

        min-width:110px;

        font-size:16px;
    }

    .popup-title{

        font-size:2.3rem;
    }

    .popup-subtitle{

        font-size:1.1rem;
    }

}


@media screen and (min-width:1600px){
    h1{
        font-size:30px;
    }
    .game-stage{
        width:min(1700px,94vw);
        margin-left:auto;
        margin-right:auto;
    }
    .space-world{
        grid-template-columns:minmax(360px,.95fr) minmax(420px,1.1fr) minmax(360px,.95fr);
        gap:50px;
        padding:24px 36px;
    }
    .question-display{
        font-size:40px;
        font-weight:400;
        text-align:center;
        padding:24px;
    }
    .bottom-controls{
        width:min(1500px,94vw);
        margin-left:auto;
        margin-right:auto;
    }
    .nav-btn,.submit-btn,.replay-btn{
        width:200px;
        min-width:200px;
        height:60px;
        padding:0;
        font-size:30px;
        border-radius:50px;
        line-height:60px;
    }
}

/* FINAL POPUP MUST STAY EXACT AT ALL DESKTOP SIZES */
.popup-card.complete .replay-btn{
    width:185px !important;
    min-width:185px !important;
    height:46px !important;
    padding:0 20px !important;
    margin-top:14px !important;
    font-size:22px !important;
    font-weight:600 !important;
    line-height:46px !important;
    border-radius:23px !important;
    border:2px solid rgba(255,255,255,.35) !important;
    background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%) !important;
    box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22) !important;
}

.popup-card.complete .popup-icon{
    font-size:4.8rem !important;
    margin-bottom:12px !important;
}

.popup-card.complete .popup-title{
    font-size:3rem !important;
    font-weight:600 !important;
    margin-bottom:8px !important;
}

.popup-card.complete .popup-subtitle{
    font-size:1.4rem !important;
    font-weight:500 !important;
}


/* ===== CONFETTI (same as other lessons) ===== */
#confettiContainer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:200}
.confetti-piece{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;will-change:transform,opacity}
.final-confetti-piece{width:10px;height:16px;animation-duration:2300ms}
.final-confetti-piece:nth-child(3n){border-radius:50%}
.final-confetti-piece:nth-child(4n){width:7px;height:19px;border-radius:1px}
.final-confetti-piece:nth-child(5n){width:13px;height:8px;border-radius:2px}
@keyframes pageConfetti{0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg) scale(1)}55%{opacity:1}100%{opacity:0;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72)}}

/* ===== CHAPTER 5: UNIFIED FINAL POPUP ===== */
.popup-overlay{
    position:fixed !important;
    inset:0 !important;
    display:flex !important;
    justify-content:center !important;
    align-items:center !important;
    background:transparent !important;
    opacity:0 !important;
    pointer-events:none !important;
    transition:opacity .3s ease,background .3s ease !important;
    z-index:1000 !important;
}
.popup-overlay.active{
    opacity:1 !important;
    pointer-events:auto !important;
    background:transparent !important;
}
.popup-overlay.active .popup-card{transform:scale(1) !important}
.popup-overlay .popup-card{
    position:relative !important;
    width:520px !important;
    height:300px !important;
    max-width:calc(100vw - 30px) !important;
    padding:30px !important;
    border-radius:36px !important;
    text-align:center !important;
    transform:scale(.8) !important;
    transition:transform .35s cubic-bezier(.175,.885,.32,1.275) !important;
    overflow:hidden !important;
    display:flex !important;
    flex-direction:column !important;
    align-items:center !important;
    justify-content:center !important;
    margin:0 !important;
}
.popup-overlay .popup-card::before,
.popup-overlay .popup-card::after{
    content:'' !important;
    position:absolute !important;
    border-radius:50% !important;
    pointer-events:none !important;
}
.popup-overlay .popup-card::before{width:220px !important;height:220px !important;top:-60px !important;right:-50px !important}
.popup-overlay .popup-card::after{width:180px !important;height:180px !important;bottom:-70px !important;left:-40px !important}
.popup-overlay .popup-card.correct{background:#edfbf4 !important;border:6px solid #00c885 !important}
.popup-overlay .popup-card.correct::before,
.popup-overlay .popup-card.correct::after{background:rgba(162,245,209,.45) !important}
.popup-overlay .popup-card.correct .popup-title{color:#00a86b !important}
.popup-overlay .popup-card.correct .popup-subtitle{color:#2e7d5b !important}
.popup-overlay .popup-card.wrong{background:#fff0f2 !important;border:6px solid #ff6b7a !important}
.popup-overlay .popup-card.wrong::before,
.popup-overlay .popup-card.wrong::after{background:rgba(255,196,203,.45) !important}
.popup-overlay .popup-card.wrong .popup-title{color:#d33847 !important}
.popup-overlay .popup-card.wrong .popup-subtitle{color:#a33b45 !important}
.popup-overlay .popup-card.complete{
    background:#f0f3ff !important;
    border:6px solid #6c5ce7 !important;
    box-shadow:0 20px 45px rgba(108,92,231,.18),0 0 0 8px rgba(162,155,254,.12) !important;
}
.popup-overlay .popup-card.complete::before,
.popup-overlay .popup-card.complete::after{background:rgba(162,155,254,.35) !important}
.popup-overlay .popup-card.complete .popup-title{color:#6c5ce7 !important}
.popup-overlay .popup-card.complete .popup-subtitle{color:#4834d4 !important}
.popup-overlay .popup-icon{
    font-size:4.8rem !important;
    margin:0 0 12px !important;
    padding:0 !important;
    height:auto !important;
    width:auto !important;
    line-height:1 !important;
    z-index:2 !important;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.1)) !important;
    position:relative !important;
}
.popup-overlay .popup-title,
.popup-overlay h2.popup-title{
    font-size:3rem !important;
    font-weight:600 !important;
    margin:0 0 8px !important;
    padding:0 !important;
    height:auto !important;
    line-height:1.15 !important;
    z-index:2 !important;
    position:relative !important;
}
.popup-overlay .popup-subtitle,
.popup-overlay p.popup-subtitle{
    font-size:1.4rem !important;
    font-weight:500 !important;
    margin:0 !important;
    padding:0 !important;
    height:auto !important;
    line-height:1.35 !important;
    z-index:2 !important;
    text-align:center !important;
    position:relative !important;
}
.popup-overlay .replay-btn,
.popup-overlay #playAgainBtn,
.popup-overlay .replay{
    background:linear-gradient(180deg,#1599ed 0%,#0984e3 100%) !important;
    box-shadow:0 5px 0 #0874bd,0 8px 16px rgba(9,132,227,.22) !important;
    width:185px !important;
    min-width:185px !important;
    height:46px !important;
    padding:0 20px !important;
    margin-top:14px !important;
    font-size:22px !important;
    font-weight:600 !important;
    line-height:46px !important;
    border-radius:23px !important;
    border:2px solid rgba(255,255,255,.35) !important;
    letter-spacing:.2px !important;
    color:#fff !important;
    cursor:pointer !important;
    z-index:2 !important;
    font-family:'Livvic',sans-serif !important;
    transition:transform .12s ease,box-shadow .12s ease !important;
}
.popup-overlay .replay-btn:hover,
.popup-overlay #playAgainBtn:hover,
.popup-overlay .replay:hover{
    transform:translateY(-2px) !important;
    box-shadow:0 7px 0 #0874bd,0 11px 20px rgba(9,132,227,.26) !important;
}
.popup-overlay .replay-btn:active,
.popup-overlay #playAgainBtn:active,
.popup-overlay .replay:active{
    transform:translateY(3px) !important;
    box-shadow:0 2px 0 #0874bd,0 4px 8px rgba(9,132,227,.18) !important;
}
.popup-overlay .popup-card.complete .popup-icon{
    animation:ch5FinalTrophyBounce 1.2s ease-in-out infinite !important;
}
@keyframes ch5FinalTrophyBounce{
    0%,100%{transform:translateY(0) rotate(0deg) scale(1)}
    50%{transform:translateY(-5px) rotate(-4deg) scale(1.06)}
}
@media (max-width:520px){
    .popup-overlay .popup-card{
        width:calc(100vw - 24px) !important;
        height:auto !important;
        min-height:260px !important;
        padding:24px 18px !important;
    }
    .popup-overlay .popup-title,
    .popup-overlay h2.popup-title{font-size:2.2rem !important}
    .popup-overlay .popup-subtitle,
    .popup-overlay p.popup-subtitle{font-size:1.1rem !important}
    .popup-overlay .popup-icon{font-size:3.6rem !important}
}

</style>
</head>


<body>
<div id="confettiContainer"></div>


<!-- HOME -->




<!-- HEADER -->

<header>

    <h1>
        Write the place value of all the digits
    </h1>

   

</header>



<!-- GAME -->

<main class="game-stage">

    <section class="space-world">


        <div class="star s1"></div>
        <div class="star s2"></div>
        <div class="star s3"></div>
        <div class="star s4"></div>


        <!-- LEFT -->

        <section class="mission-info">

            <div
                id="questionText"
                class="question-display">
            </div>


        </section>



        <!-- CENTER ROCKET -->

        <section class="launch-zone">

            <div class="orbit"></div>


            <div class="rocket">


                <div class="rocket-body">

                    <div
                        id="digitWindow"
                        class="rocket-window">

                        2

                    </div>


                    <div
                        id="secondDigit"
                        class="rocket-digit">

                        5

                    </div>

                </div>


                <div class="fire"></div>


                <div class="launch-label">

                    NUMBER READY

                </div>

            </div>

        </section>



        <!-- RIGHT -->

        <section class="mission-control">


            <div class="control-title">

                MISSION CONTROL

            </div>


            <div id="answerZone"></div>


        </section>


    </section>

</main>



<!-- BUTTONS -->

<div class="bottom-controls">


    <div class="left-control">

        <button
            id="prevBtn"
            class="nav-btn prev"
            onclick="previousQuestion()">

            PREV

        </button>

    </div>


    <div class="center-control">

        <button
            id="submitBtn"
            class="submit-btn"
            onclick="checkAnswer()"
            disabled>

            SUBMIT

        </button>

    </div>


    <div class="right-control">

        <button
            id="nextBtn"
            class="nav-btn next"
            onclick="nextQuestion()"
            disabled>

            NEXT

        </button>

    </div>


</div>



<!-- POPUP -->

<div
    id="popup"
    class="popup-overlay">


    <div
        id="popupCard"
        class="popup-card correct">


        <div
            id="popupIcon"
            class="popup-icon">

            🌟

        </div>


        <div
            id="popupTitle"
            class="popup-title">

            Amazing!

        </div>


        <div
            id="popupSubtitle"
            class="popup-subtitle">

            You got it right! ✨

        </div>


        <button
            id="playAgainBtn"
            class="replay-btn"
            onclick="restartGame()"
            style="display:none">

            Play Again

        </button>


    </div>

</div>



<script>


/* =========================================
   QUESTIONS
========================================= */

const questions = [ 
 
    { 
        number:"25", 
        question:"25 - The place value of 2 is ____ and the place value of 5 is ____.", 
        digits:["2","5"], 
        answers:["20","5"] 
    }, 
 
    { 
        number:"30", 
        question:"30 - The place value of 3 is ____ and the place value of 0 is ____.", 
        digits:["3","0"], 
        answers:["30","0"] 
    }, 
 
    { 
        number:"9", 
        question:"9 - The place value of 9 is ____.", 
        digits:["9"], 
        answers:["9"] 
    },

    { 
        number:"6", 
        question:"The face value of 6 in tens place is 6 and the place value of 5 is ____.", 
        digits:["5"], 
        answers:["5"] 
    },

    { 
        number:"90", 
        question:"The place value of 9 is 90 and the face value of 0 in ones place is ____.", 
        digits:["0"], 
        answers:["0"] 
    }
 
];


/* =========================================
   STATE
========================================= */

let currentQuestion = 0;

let savedAnswers =
questions.map(() => ({
    values:[],
    locked:[]
}));

let popupTimer = null;
let finalPopupTimer = null;


/* =========================================
   ELEMENTS
========================================= */

const questionText =
document.getElementById("questionText");

const answerZone =
document.getElementById("answerZone");

const submitBtn =
document.getElementById("submitBtn");

const prevBtn =
document.getElementById("prevBtn");

const nextBtn =
document.getElementById("nextBtn");

const digitWindow =
document.getElementById("digitWindow");

const secondDigit =
document.getElementById("secondDigit");

/* =========================================
   INPUT CHECK
========================================= */

function allInputsFilled(){

    const inputs =
    [...document.querySelectorAll(".answer-input")];

    return (
        inputs.length > 0 &&
        inputs.every(
            input =>
            input.value.trim() !== ""
        )
    );

}

function isQuestionAnswered(index){

    const q = questions[index];
    const state = savedAnswers[index];

    if(!Array.isArray(state.locked)){
        return false;
    }

    return q.answers.every(
        (_, i) => state.locked[i]
    );

}


/* =========================================
   SUBMIT STATE
========================================= */

function updateSubmit(){

    const state =
    savedAnswers[currentQuestion];

    const inputs =
    [...document.querySelectorAll(".answer-input")];

    const allCorrectlyLocked =
    inputs.length > 0 &&
    inputs.every(
        (_,i) => state.locked[i]
    );

    submitBtn.disabled =
    allCorrectlyLocked ||
    !allInputsFilled();

}


/* =========================================
   LOAD QUESTION
========================================= */

function loadQuestion(index){

    currentQuestion = index;

    const q =
    questions[index];

    const state =
    savedAnswers[index];


    /* QUESTION */

    questionText.textContent =
    q.question;


    /* ROCKET DIGITS */

    digitWindow.textContent =
    q.digits[0] || "";


    if(q.digits.length > 1){

        secondDigit.style.display = "block";

        secondDigit.textContent =
        q.digits[1];

    }

    else{

        secondDigit.style.display = "none";

    }


    /* ANSWERS */

    answerZone.innerHTML = "";


    q.answers.forEach(
        function(answer,i){


            const consoleBox =
            document.createElement("div");

            consoleBox.className =
            "answer-console";


            const top =
            document.createElement("div");

            top.className =
            "console-top";


            top.innerHTML = `

                <div class="digit-chip">

                    ${q.digits[i]}

                </div>

                <div class="console-text">

                    Enter place value

                </div>

            `;


            const input =
            document.createElement("input");

            input.type = "text";

            input.inputMode = "numeric";

            input.className =
            "answer-input";

            input.placeholder = "?";

            input.value =
            state.values[i] || "";


            /* LOCK CORRECT ANSWER */

            if(state.locked[i]){

                input.disabled = true;

                input.classList.add(
                    "locked"
                );

            }


            input.addEventListener(
                "input",
                function(){

                    this.value =
                    this.value.replace(
                        /[^0-9]/g,
                        ""
                    );


                    savedAnswers[currentQuestion]
                    .values[i] =
                    this.value;


                    updateSubmit();

                }
            );


            consoleBox.appendChild(top);

            consoleBox.appendChild(input);

            answerZone.appendChild(consoleBox);

        }
    );


    /* BUTTONS */

    prevBtn.disabled =
    currentQuestion === 0;


    nextBtn.disabled =
    !isQuestionAnswered(currentQuestion) ||
    currentQuestion ===
    questions.length - 1;


    updateSubmit();

}


function checkAnswer(){

    const q =
    questions[currentQuestion];

    const inputs =
    [...document.querySelectorAll(".answer-input")];

    const state =
    savedAnswers[currentQuestion];

    let newlyCorrect = false;
    let wrongFound = false;

    inputs.forEach(function(input,index){

        /* Already correct → keep locked */
        if(state.locked[index]){
            input.disabled = true;
            return;
        }

        const userAnswer =
        input.value.trim();

        const correctAnswer =
        q.answers[index];

        if(userAnswer === correctAnswer){

            /* LOCK THIS CORRECT INPUT */
            state.values[index] =
            userAnswer;

            state.locked[index] = true;

            input.disabled = true;
            input.classList.add("locked");

            newlyCorrect = true;

        }else{

            /* WRONG INPUT */
            wrongFound = true;

            input.value = "";
            state.values[index] = "";

        }

    });


    /* ALL ANSWERS CORRECT */
    const allCorrect =
    q.answers.every(
        (_,index) =>
        state.locked[index]
    );


    if(allCorrect){

        state.locked =
        q.answers.map(() => true);

        submitBtn.disabled = true;

        nextBtn.disabled =
        currentQuestion ===
        questions.length - 1;

        if(
            currentQuestion ===
            questions.length - 1
        ){

            /* Last question: correct popup first, then final popup */
            clearTimeout(popupTimer);
            clearTimeout(finalPopupTimer);

            showPopup(
                "correct",
                "🌟",
                "Amazing!",
                "You got it right! ✨",
                false
            );
            showSmallConfetti(false);

            clearTimeout(popupTimer);

            popupTimer = setTimeout(function(){
                showPopup(
                    "complete",
                    "🏆",
                    "Congratulations!",
                    "Fantastic job! You solved all questions! 🎉",
                    true
                );
                showSmallConfetti(true);
            }, 1800);

        }else{

            showPopup(
                "correct",
                "🌟",
                "Amazing!",
                "You got it right! ✨",
                false
            );

        }

        playAudioTone(true);
        speak("Correct!");

        return;
    }


    /* AT LEAST ONE ANSWER WAS CORRECT */
    if(newlyCorrect){

        showPopup(
            "correct",
            "🌟",
            "Correct!",
            "One answer is correct! Try the other one. ✨",
            false
        );

        playAudioTone(true);
        speak("Correct! Try the other answer.");

    }


    /* WRONG ANSWER */
    else if(wrongFound){

        showPopup(
            "wrong",
            "😟",
            "Keep Going!",
            "Try the remaining answer again! 🌈",
            false
        );

        playAudioTone(false);
        speak("Try again.");

    }

    updateSubmit();

}

/* =========================================
   PREVIOUS
========================================= */

function previousQuestion(){

    if(currentQuestion <= 0) return;

    loadQuestion(
        currentQuestion - 1
    );

}


/* =========================================
   NEXT
========================================= */

function nextQuestion(){

    if(
        !savedAnswers[currentQuestion]
        .locked
    ) return;


    if(
        currentQuestion >=
        questions.length - 1
    ) return;


    loadQuestion(
        currentQuestion + 1
    );

}


/* =========================================
   POPUP
========================================= */


function showSmallConfetti(isFinal=false){const c=document.getElementById('confettiContainer');if(!c)return;c.innerHTML='';const count=isFinal?95:42,colors=['#00b894','#e67e22','#6c5ce7','#0984e3','#fdcb6e','#ff6b7a','#00cec9','#a29bfe'];for(let i=0;i<count;i++){const p=document.createElement('span');p.className=isFinal?'confetti-piece final-confetti-piece':'confetti-piece';p.style.left=(Math.random()*100)+'%';p.style.top=(-8+Math.random()*10)+'%';p.style.setProperty('--x',((Math.random()*520-260)*(isFinal?1.15:.9))+'px');p.style.setProperty('--y',(window.innerHeight*(.82+Math.random()*.48))+'px');p.style.setProperty('--r',(Math.random()*1400-700)+'deg');p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDelay=(Math.random()*(isFinal?500:220))+'ms';c.appendChild(p);setTimeout(()=>p.remove(),isFinal?2900:2050)}}
function clearConfetti(){const c=document.getElementById('confettiContainer');if(c)c.innerHTML='';}

function showPopup(
    status,
    icon,
    title,
    subtitle,
    isFinal = false
){
    /* confetti, same as other lessons */
    if(isFinal || status === 'complete'){ showSmallConfetti(true); }
    else if(status === 'correct'){ showSmallConfetti(false); }


    const popup =
    document.getElementById("popup");


    const card =
    document.getElementById("popupCard");


    const playAgainBtn =
    document.getElementById(
        "playAgainBtn"
    );


    card.className =
    `popup-card ${status}`;


    document.getElementById(
        "popupIcon"
    ).textContent =
    icon;


    document.getElementById(
        "popupTitle"
    ).textContent =
    title;


    document.getElementById(
        "popupSubtitle"
    ).textContent =
    subtitle;


    if(isFinal){

        playAgainBtn.style.display =
        "inline-block";

    }

    else{

        playAgainBtn.style.display =
        "none";

    }


    popup.classList.add(
        "active"
    );


    clearTimeout(popupTimer);


    if(!isFinal){

        popupTimer =
        setTimeout(

            closePopup,

            1800

        );

    }

}


/* =========================================
   CLOSE POPUP
========================================= */

function closePopup(){

    document
    .getElementById("popup")
    .classList.remove("active");

}


/* =========================================
   RESTART
========================================= */

function restartGame(){

    clearTimeout(popupTimer);
    clearTimeout(finalPopupTimer);
    closePopup();


    savedAnswers =
    questions.map(() => ({

        values:[],

        locked:[]

    }));


    currentQuestion = 0;


    loadQuestion(0);

}


/* =========================================
   VOICE
========================================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ) return;


    speechSynthesis.cancel();


    const message =
    new SpeechSynthesisUtterance(text);


    message.lang = "en-US";

    message.volume = .8;

    message.rate = 1;

    message.pitch = 1;


    speechSynthesis.speak(
        message
    );

}


function speakQuestion(){

    speak(

        questions[currentQuestion]
        .question

    );

}


/* =========================================
   SOUND EFFECT
========================================= */

function playAudioTone(isCorrect){

    try{

        const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


        const audioCtx =
        new AudioContextClass();


        const oscillator =
        audioCtx.createOscillator();


        const gain =
        audioCtx.createGain();


        oscillator.connect(gain);

        gain.connect(
            audioCtx.destination
        );


        if(isCorrect){

            oscillator.type = "sine";


            oscillator.frequency
            .setValueAtTime(

                587.33,

                audioCtx.currentTime

            );


            oscillator.frequency
            .exponentialRampToValueAtTime(

                880,

                audioCtx.currentTime + .2

            );


            gain.gain.setValueAtTime(

                .2,

                audioCtx.currentTime

            );


            gain.gain
            .exponentialRampToValueAtTime(

                .01,

                audioCtx.currentTime + .3

            );

        }

        else{

            oscillator.type =
            "sawtooth";


            oscillator.frequency
            .setValueAtTime(

                200,

                audioCtx.currentTime

            );


            oscillator.frequency
            .linearRampToValueAtTime(

                120,

                audioCtx.currentTime + .2

            );


            gain.gain.setValueAtTime(

                .15,

                audioCtx.currentTime

            );


            gain.gain
            .exponentialRampToValueAtTime(

                .01,

                audioCtx.currentTime + .25

            );

        }


        oscillator.start();


        oscillator.stop(

            audioCtx.currentTime + .3

        );

    }

    catch(error){

        console.log(error);

    }

}


/* =========================================
   HOME
========================================= */

function goHome(){

    window.location.href =
    "../index.html";

}


/* =========================================
   INITIAL LOAD
========================================= */

loadQuestion(0);


</script>

</body>
