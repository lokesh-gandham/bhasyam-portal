<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Compare Numbers</title>


<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Livvic',sans-serif}

:root{
  --ink:#2f4f4f;
  --orange:#e67e22;
  --orange-dark:#d35400;
  --green:#00b894;
  --green-dark:#008f72;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  
  color:var(--ink);
}

.game{
  height:100dvh;
  min-height:100dvh;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  overflow:hidden;
  position:relative;
}

.home-btn{
  position:fixed;
  top:16px;
  left:18px;
  width:76px;
  height:76px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.75);
  color:#405762;
  font-size:28px;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(40,70,80,.12);
  z-index:20;
}

header{
  text-align:center;
  padding:12px 100px 4px;
}

h1{
  font-size:22px;
  font-weight:400;
  color:#2f4f4f;
}

.instruction{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:8px;
  padding:8px 28px;
  border-radius:30px;
  
  color:#566873;
  font-size:20px;
  font-weight:200;
}

.stage{
  width:min(94vw,1450px);
  height:100%;
  margin:auto;
  min-height:0;
  display:grid;
  grid-template-columns:1fr minmax(240px,320px) 1fr;
  align-items:center;
  gap:clamp(20px,4vw,70px);
  position:relative;
}

.stage::before{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:50%;
  height:2px;
  background:linear-gradient(90deg,transparent,rgba(67,92,103,.18),transparent);
}

.portal{
  width:min(100%,330px);
  aspect-ratio:1;
  justify-self:center;
  position:relative;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 28%,rgba(255,255,255,.95),rgba(222,236,243,.85) 38%,rgba(156,191,207,.65) 100%);
  border:8px solid rgba(255,255,255,.88);
  box-shadow:
    0 18px 0 rgba(50,76,90,.10),
    inset 0 0 0 4px rgba(73,123,147,.24);
  
}

.portal.right{
  animation-delay:.6s;
}

.portal::before,
.portal::after{
  content:"";
  position:absolute;
  border-radius:50%;
}

.portal::before{
  inset:13px;
  border:2px dashed rgba(56,105,128,.28);
}

.portal::after{
  width:18px;
  height:18px;
  background:#ffc94f;
  top:13%;
  right:20%;
  box-shadow:-160px 120px 0 #7cd5f0;
}

.number{
  position:relative;
  z-index:2;
  font-size: clamp(55px, 7vw, 110px);
  
  color:#2f4f4f;
  line-height:1;
 
  font-weight: normal;
}

.number-tag{
  position:absolute;
  bottom:-24px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  padding:5px 22px;
  border-radius:40px;
  background:rgba(255,255,255,.76);
  color:#50636e;
  font-size:16px;
  font-weight:500;
  
}

.center-zone{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  z-index:5;
}

.battle-core{
  width:min(29vw,300px);
  min-width:240px;
  aspect-ratio:1;
  border-radius:50%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  background:
    radial-gradient(circle at 50% 35%,#fffdf8,#fff0bd 58%,#f3c95f 100%);
  border:9px solid rgba(255,255,255,.82);
  box-shadow:
    0 16px 0 rgba(173,122,39,.13),
    inset 0 8px 18px rgba(255,255,255,.7);
}

.battle-core::before{
  content:"";
  position:absolute;
  inset:22px;
  border-radius:50%;
  border:2px dashed rgba(174,120,34,.32);
}

.core-title{
  position:absolute;
  top:17%;
  font-size:18px;
  font-weight:600;
  letter-spacing:2px;
  color:#765424;
  z-index:2;
}

.symbols{
  display:flex;
  gap:14px;
  position:relative;
  z-index:3;
  margin-top:22px;
}

.symbol-btn{
  width:70px;
  height:70px;
  border:none;
  border-radius:50%;
  background:#f7f8fa;
  color:#465963;
  font-size:42px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 9px 0 rgba(95,112,120,.17);
  transition:.15s ease;
}

.symbol-btn:hover{
  transform:translateY(-4px);
}

.symbol-btn:active{
  transform:translateY(5px);
  box-shadow:0 3px 0 rgba(95,112,120,.17);
}

.symbol-btn.selected{
  background:#ff6675;
  color:white;
  box-shadow:0 9px 0 #b93e4b;
}

.selected-symbol{
  height:34px;
  margin-top:14px;
  font-size:15px;
  font-weight:700;
  color:#745d37;
}

.navigation{
  width:min(96vw,1500px);
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:10px 0 18px;
  margin:auto;
  gap:20px;
}

#prevBtn{justify-self:start}
#nextBtn{justify-self:end}

.nav-btn,
.submit-btn,
.replay-btn{
  width:178px;
  height:45px;
  min-width:178px;
  padding:0;
  border:none;
  border-radius:28px;
  color:white;
  font-size:20px;
  font-weight:600;
  cursor:pointer;
  transition:.12s ease;
  font-family:'Livvic',sans-serif;
}

.nav-btn.prev{
  background:#b2bec3;
  box-shadow:0 6px 0 #636e72;
}

.nav-btn.next{
  background:#e67e22;
  box-shadow:0 6px 0 #d35400;
}

.submit-btn{
  background:#00b894;
  box-shadow:0 6px 0 #008f72;
}

.nav-btn:active:not(:disabled),
.submit-btn:active:not(:disabled),
.replay-btn:active{
  transform:translateY(4px);
}

.nav-btn.next:active:not(:disabled){
  box-shadow:0 2px 0 #d35400;
}

.submit-btn:active:not(:disabled){
  box-shadow:0 2px 0 #008f72;
}

.nav-btn:disabled,
.submit-btn:disabled{
  background:#b2bec3;
  box-shadow:0 6px 0 #7f8c8d;
  cursor:not-allowed;
  opacity:.7;
}

#confettiContainer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:200}.confetti-piece{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:pageConfetti 1700ms cubic-bezier(.16,.72,.3,1) forwards;will-change:transform,opacity}.final-confetti-piece{width:10px;height:16px;animation-duration:2300ms}.final-confetti-piece:nth-child(3n){border-radius:50%}.final-confetti-piece:nth-child(4n){width:7px;height:19px;border-radius:1px}.final-confetti-piece:nth-child(5n){width:13px;height:8px;border-radius:2px}@keyframes pageConfetti{0%{opacity:1;transform:translate3d(0,0,0) rotate(0deg) scale(1)}55%{opacity:1}100%{opacity:0;transform:translate3d(var(--x),var(--y),0) rotate(var(--r)) scale(.72)}}
.popup-overlay{
  position:fixed;
  inset:0;
  
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease;
  z-index:100;
}

.popup-overlay.active{
  opacity:1;
  pointer-events:auto;
}

.popup-card{
  position:relative;
  width:90%;
  max-width:520px;
  padding:40px 30px;
  border-radius:36px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.1);
  transform:scale(.8);
  transition:transform .35s cubic-bezier(.175,.885,.32,1.275);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.popup-card::before,
.popup-card::after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}

.popup-card::before{
  width:220px;
  height:220px;
  top:-60px;
  right:-50px;
}

.popup-card::after{
  width:180px;
  height:180px;
  bottom:-70px;
  left:-40px;
}

.popup-card.correct{
  background:#edfbf4;
  border:6px solid #00c885;
}

.popup-card.correct::before,
.popup-card.correct::after{
  background:rgba(162,245,209,.45);
}

.popup-card.correct .popup-title{color:#00a86b}
.popup-card.correct .popup-subtitle{color:#2e7d5b}

.popup-card.wrong{
  background:#fff0f2;
  border:6px solid #ff6b7a;
}

.popup-card.wrong::before,
.popup-card.wrong::after{
  background:rgba(255,196,203,.45);
}

.popup-card.wrong .popup-title{color:#d33847}
.popup-card.wrong .popup-subtitle{color:#a33b45}

.popup-card.complete{
  background:#f0f3ff;
  border:6px solid #6c5ce7;
}

.popup-card.complete::before,
.popup-card.complete::after{
  background:rgba(162,155,254,.35);
}

.popup-card.complete .popup-title{color:#6c5ce7}
.popup-card.complete .popup-subtitle{color:#4834d4}

.popup-overlay.active .popup-card{
  transform:scale(1);
}

.popup-icon{
  font-size:4.8rem;
  margin-bottom:12px;
  z-index:2;
  line-height:1;
}

.popup-title{
  font-size:3rem;
  font-weight:600;
  margin-bottom:8px;
  z-index:2;
}

.popup-subtitle{
  font-size:1.4rem;
  font-weight:500;
  z-index:2;
}

.replay-btn{
  background:#0984e3;
  box-shadow:0 6px 0 #0975c7;
  margin-top:20px;
  position:relative;
  z-index:5;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

@media(min-width:1600px){
  h1{font-size:30px}
  .instruction{font-size:25px}
  .nav-btn,.submit-btn,.replay-btn{
    width:200px;
    height:60px;
    min-width:200px;
    font-size:30px;
    padding:0;
    border-radius:50px;
  }
}

@media(max-height:800px) and (min-width:900px){
  .portal{width:min(25vw,270px)}
  .battle-core{min-width:220px;width:min(25vw,270px)}

  .navigation{padding-bottom:12px}
}

@media(max-width:900px){
  html,body{overflow:auto}

  .game{
    height:auto;
    min-height:100dvh;
    overflow:visible;
  }

  .stage{
    min-height:580px;
    grid-template-columns:1fr;
    gap:55px;
    padding:60px 0;
  }

  .stage::before{
    top:50%;
    left:50%;
    right:auto;
    width:2px;
    height:75%;
    transform:translateX(-50%);
  }

  .portal{
    width:220px;
  }

  .center-zone{
    order:-1;
  }

  .battle-core{
    width:240px;
  }

  .navigation{
    position:sticky;
    bottom:0;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(8px);
    padding:12px;
  }
}

@media(max-width:620px){
  .home-btn{
    width:50px;
    height:50px;
    font-size:20px;
    top:8px;
    left:8px;
  }

  header{
    padding:10px 58px 4px;
  }

  h1{
    font-size:18px;
  }

  .instruction{
    font-size:14px;
    padding:7px 14px;
  }

  .stage{
    min-height:540px;
    gap:40px;
  }

  .portal{
    width:170px;
  }

  .number{
    font-size:50px;
  }

  .battle-core{
    min-width:200px;
    width:200px;
  }

  .symbol-btn{
    width:55px;
    height:55px;
    font-size:32px;
  }

  .symbols{
    gap:9px;
  }

  .core-title{
    font-size:13px;
  }

  .navigation{
    gap:8px;
  }

  .nav-btn,
  .submit-btn{
    width:105px;
    min-width:105px;
    font-size:16px;
  }

  .popup-title{
    font-size:2.3rem;
  }

  .popup-subtitle{
    font-size:1.1rem;
  }
}

}

}

<body>

<div class="game">


<header>
<h1>Compare the numbers and put the appropriate symbol</h1>
<div class="instruction">🎮 Select the symbol that wins the number battle!</div>
</header>

<main class="stage">

<div class="portal left">
<div id="leftNumber" class="number">23</div>
<div class="number-tag">Left number</div>
</div>

<div class="center-zone">
<div class="battle-core">


<div class="symbols">
<button class="symbol-btn" data-symbol="<">&lt;</button>
<button class="symbol-btn" data-symbol="=">=</button>
<button class="symbol-btn" data-symbol=">">&gt;</button>
</div>
</div>

<div id="selectedSymbol" class="selected-symbol">Choose one symbol</div>
</div>

<div class="portal right">
<div id="rightNumber" class="number">24</div>
<div class="number-tag">Right number</div>
</div>

</main>

<div class="navigation">
<button id="prevBtn" class="nav-btn prev" onclick="previousQuestion()" disabled>PREV</button>
<button id="submitBtn" class="submit-btn" onclick="checkAnswer()" disabled>SUBMIT</button>
<button id="nextBtn" class="nav-btn next" onclick="nextQuestion()" disabled>NEXT</button>
</div>

</div>

<div id="confettiContainer"></div>

<div id="popup" class="popup-overlay">
<div id="popupCard" class="popup-card correct">
<div id="popupIcon" class="popup-icon">🌟</div>
<div id="popupTitle" class="popup-title">Amazing!</div>
<div id="popupSubtitle" class="popup-subtitle">You got it right! ✨</div>
<button id="playAgainBtn" class="replay-btn" onclick="restartGame()" style="display:none">Play Again</button>
</div>
</div>

<script>
const questions=[
{left:23,right:24,answer:"<"},
{left:58,right:52,answer:">"},
{left:81,right:86,answer:"<"},
{left:35,right:37,answer:"<"},
{left:49,right:41,answer:">"},
{left:67,right:67,answer:"="}
];

let currentQuestion=0;
let selectedSymbol="";
let states=questions.map(()=>({selected:"",locked:false}));
let popupTimer;

const leftNumber=document.getElementById("leftNumber");
const rightNumber=document.getElementById("rightNumber");
const selectedText=document.getElementById("selectedSymbol");
const submitBtn=document.getElementById("submitBtn");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const symbolButtons=[...document.querySelectorAll(".symbol-btn")];

symbolButtons.forEach(button=>{
button.addEventListener("click",()=>{
if(states[currentQuestion].locked)return;
selectedSymbol=button.dataset.symbol;
states[currentQuestion].selected=selectedSymbol;

symbolButtons.forEach(btn=>{
btn.classList.toggle("selected",btn.dataset.symbol===selectedSymbol);
});

selectedText.textContent=`Selected: ${selectedSymbol}`;
submitBtn.disabled=false;
});
});

function loadQuestion(index){
currentQuestion=index;
const q=questions[index];
const state=states[index];

leftNumber.textContent=q.left;
rightNumber.textContent=q.right;
selectedSymbol=state.selected;

symbolButtons.forEach(btn=>{
btn.classList.toggle("selected",btn.dataset.symbol===selectedSymbol);
});

selectedText.textContent=selectedSymbol
?`Selected: ${selectedSymbol}`
:"Choose one symbol";

submitBtn.disabled=state.locked||!selectedSymbol;
prevBtn.disabled=currentQuestion===0;
nextBtn.disabled=currentQuestion===questions.length-1||!state.locked;
}

function checkAnswer(){
const q=questions[currentQuestion];
const state=states[currentQuestion];

if(!selectedSymbol||state.locked)return;

if(selectedSymbol===q.answer){
state.locked=true;
submitBtn.disabled=true;
nextBtn.disabled=currentQuestion===questions.length-1;

playTone(true);
speak("Correct");

if(currentQuestion===questions.length-1){
showPopup(
"correct",
"🌟",
"Amazing!",
"You got it right! ✨",
false
);
showSmallConfetti(false);
clearTimeout(popupTimer);
popupTimer=setTimeout(()=>{
showPopup(
"complete",
"🏆",
"Congratulations!",
"Fantastic job! You solved all questions! 🎉",
true
);
showSmallConfetti(true);
},1800);
}else{
showPopup(
"correct",
"🌟",
"Amazing!",
"You got it right! ✨"
);
}
}else{
playTone(false);
speak("Wrong");
showPopup(
"wrong",
"😟",
"Keep Going!",
"Try again, you can do it! 🌈"
);
}
}

function nextQuestion(){
if(!states[currentQuestion].locked)return;
if(currentQuestion<questions.length-1){
loadQuestion(currentQuestion+1);
}
}

function previousQuestion(){
if(currentQuestion>0){
loadQuestion(currentQuestion-1);
}
}

function clearConfetti(){const c=document.getElementById("confettiContainer");if(c)c.innerHTML="";}
function showSmallConfetti(isFinal=false){const c=document.getElementById("confettiContainer");if(!c)return;c.innerHTML="";const count=isFinal?95:42;const colors=["#00b894","#e67e22","#6c5ce7","#0984e3","#fdcb6e","#ff6b7a","#00cec9","#a29bfe"];for(let i=0;i<count;i++){const p=document.createElement("span");p.className=isFinal?"confetti-piece final-confetti-piece":"confetti-piece";p.style.left=Math.random()*100+"%";p.style.top=(-8+Math.random()*10)+"%";p.style.setProperty("--x",((Math.random()*520-260)*(isFinal?1.15:.9))+"px");p.style.setProperty("--y",window.innerHeight*(.82+Math.random()*.48)+"px");p.style.setProperty("--r",(Math.random()*1400-700)+"deg");p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDelay=(Math.random()*(isFinal?500:220))+"ms";c.appendChild(p);setTimeout(()=>p.remove(),isFinal?2900:2050)}}

function showPopup(status,icon,title,subtitle,isFinal=false){
    /* confetti, same as other lessons */
    if(isFinal || status === 'complete'){ showSmallConfetti(true); }
    else if(status === 'correct'){ showSmallConfetti(false); }

const popup=document.getElementById("popup");
const card=document.getElementById("popupCard");

clearTimeout(popupTimer);

card.className=`popup-card ${status}`;
document.getElementById("popupIcon").textContent=icon;
document.getElementById("popupTitle").textContent=title;
document.getElementById("popupSubtitle").textContent=subtitle;
document.getElementById("playAgainBtn").style.display=isFinal?"inline-block":"none";

popup.classList.add("active");

if(!isFinal){
popupTimer=setTimeout(closePopup,1800);
}
}

function closePopup(){
document.getElementById("popup").classList.remove("active");
}

function restartGame(){
    clearConfetti();

closePopup();
states=questions.map(()=>({selected:"",locked:false}));
selectedSymbol="";
loadQuestion(0);
}

function speak(text){
if(!("speechSynthesis" in window))return;

window.speechSynthesis.cancel();

const utterance=new SpeechSynthesisUtterance(text);
utterance.rate=.95;
utterance.pitch=1;
utterance.lang="en-US";

window.speechSynthesis.speak(utterance);
}

function playTone(correct){
try{
const AudioContext=window.AudioContext||window.webkitAudioContext;
const ctx=new AudioContext();
const oscillator=ctx.createOscillator();
const gain=ctx.createGain();

oscillator.connect(gain);
gain.connect(ctx.destination);

oscillator.frequency.value=correct?680:220;
gain.gain.setValueAtTime(.08,ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.35);

oscillator.start();
oscillator.stop(ctx.currentTime+.35);
}catch(e){}
}

function goHome(){
window.location.href="../index.html";
}

loadQuestion(0);
</script>

</body>
</html>
