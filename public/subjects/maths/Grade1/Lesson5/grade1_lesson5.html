.card-title{font-size:21px;line-height:1.08;font-weight:900;color:#344e55;position:relative;z-index:2}.card-sub{font-size:13px;color:#7c8a90;margin-top:5px;font-weight:600;position:relative;z-index:2}
.play-row{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.7px;position:relative;z-index:2}.play-circle{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff}.game-card:hover .play-circle{transform:translateX(5px) scale(1.07)}
.theme-pink{--accent:#e96d91;--soft:#fff0f4}.theme-blue{--accent:#4387c9;--soft:#edf6ff}.theme-green{--accent:#35ad6b;--soft:#e9f8ef}.theme-teal{--accent:#259c99;--soft:#e8faf8}.theme-purple{--accent:#7a5bc1;--soft:#f1edff}.theme-orange{--accent:#ed9913;--soft:#fff5df}.theme-indigo{--accent:#5068bd;--soft:#edf0ff}.theme-sky{--accent:#3885b1;--soft:#eaf7fc}.theme-rose{--accent:#cf6681;--soft:#fff0f4}

/* playful activity illustrations */
.math-scene{gap:16px;font-weight:900;font-size:42px;color:var(--accent)}.math-bubble{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:#fff;box-shadow:0 7px 15px rgba(0,0,0,.08)}
.box-scene{gap:13px}.answer-box{width:52px;height:52px;border:3px dashed var(--accent);border-radius:14px;display:grid;place-items:center;font-size:25px;font-weight:900;color:var(--accent);background:#fff}.number-chip{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:900}
.balloon-scene{align-items:flex-end;gap:12px;padding-bottom:18px}.balloon{width:39px;height:49px;border-radius:50% 50% 48% 48%;background:var(--accent);position:relative;box-shadow:inset -7px -7px 0 rgba(0,0,0,.08)}.balloon:after{content:"";position:absolute;left:19px;top:47px;width:1px;height:30px;background:#7d8790}.balloon:nth-child(2){transform:translateY(-18px) scale(.85);opacity:.8}.balloon:nth-child(3){transform:translateY(-5px) scale(1.08)}
.line-scene{flex-direction:column;gap:10px}.number-line{width:78%;height:4px;border-radius:9px;background:var(--accent);position:relative}.number-line:before{content:"0   1   2   3   4   5";position:absolute;top:10px;left:0;right:0;font-size:12px;letter-spacing:12px;font-weight:900;color:var(--accent);white-space:nowrap}.marker{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--accent);position:absolute;top:-7px;left:56%}
.abacus-scene{gap:10px}.abacus{width:165px;height:88px;border:7px solid var(--accent);border-radius:15px;padding:10px;display:flex;flex-direction:column;justify-content:space-around;background:#fff}.rod{height:4px;background:#9baab0;position:relative}.bead{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--accent);top:-9px}.rod .bead:nth-child(1){left:20px}.rod .bead:nth-child(2){left:57px}.rod .bead:nth-child(3){left:100px}
.draw-beads{gap:8px}.string{width:170px;height:5px;border-radius:10px;background:#9aaab0;position:relative}.draw-beads .bead{top:-11px}.draw-beads .bead:nth-child(1){left:30px}.draw-beads .bead:nth-child(2){left:70px}.draw-beads .bead:nth-child(3){left:115px}.pencil{font-size:38px;transform:rotate(-25deg)}
.blank-scene{flex-direction:column;gap:13px}.blank-row{display:flex;align-items:center;gap:8px;font-size:25px;font-weight:900;color:var(--accent)}.blank{width:42px;height:30px;border-bottom:4px dashed var(--accent)}
.lines-scene{gap:12px;align-items:flex-end}.vine{width:9px;border-radius:20px;background:var(--accent);position:relative}.vine:after{content:"🍃";position:absolute;font-size:18px;top:-12px;left:-5px}.vine:nth-child(1){height:42px}.vine:nth-child(2){height:74px}.vine:nth-child(3){height:57px}.count-badge{position:absolute;right:24px;top:20px;background:#fff;color:var(--accent);padding:7px 10px;border-radius:12px;font-size:13px;font-weight:900}
.required-scene{gap:12px}.missing-num{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:3px dashed var(--accent);font-size:30px;font-weight:900;color:var(--accent);background:#fff}.eq{font-size:30px;font-weight:900;color:#7c8a90}

.game-view{display:none;position:fixed;inset:0;z-index:9999;width:100%;height:100vh;background:#fbf8eb;overflow:hidden}.game-view.show{display:block}.game-topbar{position:absolute;top:14px;left:14px;z-index:10001}.back-btn{

}
.back-btn:hover i{transform:translateX(-2px)}

}
.back-btn:focus-visible{

}.current-title{display:none}#contentFrame{width:100%;height:100vh;border:0;display:block;background:#fbf8eb}

/* ===== ADVENTURE PASS CARD DESIGN ===== */
.cards{
  grid-template-columns:repeat(4,minmax(220px,1fr));
  gap:18px;
  align-items:stretch;
}
.game-card{
  --accent:#e96d91;--soft:#fff0f4;
  min-height:278px;padding:0;border:0;border-radius:22px;
  background:#fff;overflow:hidden;isolation:isolate;
  box-shadow:0 14px 30px rgba(54,65,69,.11);
  transition:transform .28s ease,box-shadow .28s ease;
}
.game-card:before{
  content:"";position:absolute;inset:0 0 auto;height:9px;width:auto;
  background:var(--accent);border-radius:22px 22px 0 0;z-index:3;
}
.game-card:after{display:none}
.game-card:hover{
  transform:translateY(-9px);
  box-shadow:0 24px 42px rgba(54,65,69,.18);
}
.card-top{
  height:52px;padding:13px 14px 0;align-items:flex-start;
}
.card-number{
  width:auto;height:auto;padding:7px 11px;border-radius:999px;
  background:var(--soft);color:var(--accent);font-size:11px;
  letter-spacing:.8px;
}
.card-icon{
  width:48px;height:48px;margin-top:-3px;border-radius:14px;
  background:#fff;color:var(--accent);font-size:20px;
  border:2px solid var(--soft);
  box-shadow:0 7px 16px rgba(54,65,69,.09);
}
.art{
  height:108px;margin:4px 12px 0;border-radius:17px;
  background:var(--soft);border:1px solid rgba(255,255,255,.9);

}
.art:before{
  content:"";position:absolute;width:70px;height:70px;right:-18px;bottom:-28px;

}
.visual{transform:none}
.card-title{
  margin:11px 15px 0;font-size:19px;letter-spacing:-.4px;
}
.card-sub{
  margin:3px 15px 0;font-size:11px;min-height:15px;
}
.play-row{
  margin:7px 15px 0;padding:8px 0 0;
  border-top:1px solid color-mix(in srgb,var(--accent) 16%,#fff);
}
.play-circle{
  width:36px;height:36px;border-radius:11px;background:var(--accent);
  box-shadow:none;
}
.game-card:hover .play-circle{transform:translateX(4px)}
/* Each card gets its own color */
.game-card:nth-child(1){--accent:#e96d91;--soft:#fff0f4}
.game-card:nth-child(2){--accent:#3486d3;--soft:#eaf5ff}
.game-card:nth-child(3){--accent:#37a96b;--soft:#e8f8ef}

.game-card:nth-child(7){--accent:#5268c7;--soft:#edf0ff}

.game-card:nth-child(9){--accent:#dc6c62;--soft:#fff0ed}

.game-card:nth-child(11){--accent:#9b4eb2;--soft:#f8ecfb}

.game-card:nth-child(13){--accent:#d66a36;--soft:#fff0e8}
.game-card:nth-child(14){--accent:#5a79b8;--soft:#edf3ff}

/* New activity illustrations */
.match-scene{gap:13px}
.match-column{display:flex;flex-direction:column;gap:9px}
.match-dot{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
.match-link{width:56px;height:3px;background:var(--accent);transform:rotate(-18deg);border-radius:10px;opacity:.7}

.subtract-scene{gap:11px;font-size:31px;font-weight:900;color:var(--accent)}
.subtract-chip{width:45px;height:45px;border-radius:13px;background:#fff;display:grid;place-items:center;box-shadow:0 5px 12px rgba(0,0,0,.07)}
.vertical-scene{flex-direction:column;gap:1px;font-size:26px;font-weight:900;color:var(--accent);line-height:1}

@media(max-width:1250px){.cards{grid-template-columns:repeat(3,minmax(220px,1fr));gap:18px}}

/* ===== ACTIVITY-SPECIFIC ILLUSTRATIONS ===== */
.name-match-scene,.pair-scene{gap:12px}
.num-name-box{padding:9px 13px;border-radius:12px;background:#fff;color:var(--accent);font-weight:900;font-size:18px;box-shadow:0 5px 12px rgba(0,0,0,.07)}

.word-label{padding:12px 16px;background:#fff;border:2px dashed var(--accent);border-radius:13px;color:var(--accent);font-weight:900;font-size:15px}
.two-pair{display:flex;flex-direction:column;gap:10px}.pair-row{display:flex;align-items:center;gap:12px}.pair-node{min-width:38px;height:30px;padding:0 9px;border-radius:9px;display:grid;place-items:center;background:#fff;color:var(--accent);font-size:12px;font-weight:900}.pair-line{width:62px;height:3px;border-radius:9px;background:var(--accent)}
.face-scene{gap:9px}.face-digit{width:48px;height:58px;border-radius:13px;background:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;color:#829097}.face-digit.highlight{background:var(--accent);color:#fff;transform:translateY(-4px)}.face-caption{position:absolute;bottom:10px;font-size:11px;font-weight:900;color:var(--accent)}
.fill-scene{flex-direction:column;gap:10px}.fill-equation{font-size:25px;font-weight:900;color:var(--accent);display:flex;align-items:center;gap:7px}.fill-slot{width:36px;height:30px;border-bottom:4px dashed var(--accent)}
.place-scene{gap:9px}.place-box{width:62px;height:62px;border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--accent);font-weight:900;box-shadow:0 5px 12px rgba(0,0,0,.06)}.place-box b{font-size:25px;line-height:1}.place-box small{font-size:9px;letter-spacing:.5px}
.before-scene{flex-direction:column;gap:12px}.sequence{display:flex;align-items:center;gap:8px}.seq-num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--accent);font-weight:900}.seq-mid{border:3px dashed var(--accent);background:transparent;font-size:19px}

.petal-scene{position:relative;width:120px;height:90px}.petal{position:absolute;width:37px;height:48px;border-radius:50% 50% 50% 50%;background:var(--accent);left:42px;top:20px;transform-origin:18px 25px}.petal:nth-child(1){transform:rotate(0deg) translateY(-20px)}.petal:nth-child(2){transform:rotate(72deg) translateY(-20px)}.petal:nth-child(3){transform:rotate(144deg) translateY(-20px)}.petal:nth-child(4){transform:rotate(216deg) translateY(-20px)}.petal:nth-child(5){transform:rotate(288deg) translateY(-20px)}.petal-center{position:absolute;left:42px;top:27px;width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--accent);font-size:16px;font-weight:900;z-index:2}

<body>
<div class="app"><main class="home">
<header class="hero"><div class="eyebrow"><i class="fa-solid fa-star"></i> FUN LEARNING ACTIVITIES <i class="fa-solid fa-star"></i></div><h1>Choose an <span>Adventure!</span></h1></header>
<section class="cards">
<button class="game-card theme-pink" onclick="openIsland(0,'Match Number & Name')"><div class="card-top"><div class="card-number">01 · PLAY</div><div class="card-icon"><i class="fa-solid fa-plus"></i></div></div><div class="art"><div class="visual name-match-scene"><div class="num-name-box">7</div><div class="match-arrows">↔</div><div class="name-card">SEVEN</div></div></div><div class="card-title">Match Number & Name</div><div class="card-sub">Match each number with its correct name</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>
<button class="game-card theme-blue" onclick="openIsland(1,'Matching')"><div class="card-top"><div class="card-number">02 · PLAY</div><div class="card-icon"><i class="fa-solid fa-square-pen"></i></div></div><div class="art"><div class="visual pair-scene"><div class="two-pair"><div class="pair-row"><span class="pair-node">3</span><span class="pair-line"></span><span class="pair-node">THREE</span></div><div class="pair-row"><span class="pair-node">5</span><span class="pair-line"></span><span class="pair-node">FIVE</span></div></div></div></div><div class="card-title">Matching</div><div class="card-sub">Match the correct items together</div><div class="play-row"><span>START PLAYING</span><span class="play-circle"><i class="fa-solid fa-arrow-right"></i></span></div></button>

<div class="game-view" id="gameView"><div class="game-topbar"><button class="back-btn" onclick="goHome()" aria-label="Go to Home" title="Home"><i class="fa-solid fa-house"></i><span>Home</span></button><div class="current-title" id="currentTitle">Activity</div></div><iframe id="contentFrame" src="" title="Learning Activity"></iframe></div>
<script>
const frame=document.getElementById('contentFrame');const gameView=document.getElementById('gameView');const currentTitle=document.getElementById('currentTitle');
const pages=['./exercise/match_numbername.html','./exercise/matching.html','./exercise/numbername.html','./exercise/matching_two.html','./exercise/abacus.html','./exercise/drawbeads.html','./exercise/facevalue.html','./exercise/fillintheblanks.html','./exercise/placevalue.html','./exercise/before_after_btwn.html','./exercise/symbol.html','./exercise/petal.html','./exercise/cap.html','./exercise/greater_smaller.html'];
function openIsland(index,title,updateUrl=true){
    if(index < 0 || index >= pages.length) return;
    currentTitle.textContent=title;
    frame.src=pages[index];
    gameView.classList.add('show');
    document.body.classList.add('quiz-open');
    if(updateUrl){
        history.replaceState({activity:index},'',window.location.pathname+window.location.search+'#activity='+index);
    }
    window.scrollTo({top:0,behavior:'instant'});
}
function goHome(){
    gameView.classList.remove('show');
    document.body.classList.remove('quiz-open');
    frame.src='';
    history.replaceState(null,'',window.location.pathname+window.location.search);
    window.scrollTo({top:0,behavior:'instant'});
}
function restoreActivityFromUrl(){
    const match=window.location.hash.match(/^#activity=(\d+)$/);
    if(!match) return;
    const index=Number(match[1]);
    if(index>=0 && index<pages.length){
        const cards=document.querySelectorAll('.game-card');
        const title=cards[index]?cards[index].querySelector('.card-title').textContent:'Activity';
        openIsland(index,title,false);
    }else{
        history.replaceState(null,'',window.location.pathname+window.location.search);
    }
}
restoreActivityFromUrl();
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&gameView.classList.contains('show'))goHome();});
</script>
