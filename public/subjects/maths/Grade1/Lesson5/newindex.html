<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Quest — Math Games for Kids</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f6fb;
  --ink:#232946;
  --ink-soft:#5a6284;
  --paper:#fff;
  --sun:#ffc145;

  --w1:#A9CFE7;
  --w1-dark:#86B7D4;
  --w1-light:#E5F2F9;

  --w2:#A8D5BA;
  --w2-dark:#8CBD9F;
  --w2-light:#E8F5EC;

  --w3:#C2B6E8;
  --w3-dark:#A99AD2;
  --w3-light:#F0ECF8;

  --w4:#F1D39B;
  --w4-dark:#D9B778;
  --w4-light:#FBF2DE;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-width:0;
  min-height:100%;
}

body{
  /* background:linear-gradient(180deg,#cdefff 0%,#e6f6ff 45%,#fffcf3 100%); */
  background: white;
  color:var(--ink);
  font-family:"Livvic",sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

h1,h2,h3,h4{
  font-family:"Livvic",sans-serif;
  margin:0;
}

.wrap{
  width:min(1120px,calc(100% - 32px));
  margin:0 auto;
  position:relative;
  z-index:2;
}

/* Background */
.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}

.cloud{
  position:absolute;
  background:#fff;
  opacity:.55;
  border-radius:999px;
  filter:blur(2px);
}

/* .balloon{
  position:absolute;
  width:48px;
  height:60px;
  border-radius:999px;
  opacity:.75;
  animation:float 8s ease-in-out infinite;
}

.balloon:after{
  content:"";
  position:absolute;
  top:100%;
  left:50%;
  width:1px;
  height:65px;
  background:rgba(35,41,70,.18);
} */

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-18px)}
}

/* Header */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:22px 0 8px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-mark{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(145deg,#ffc145,#ff9a4d);
  box-shadow:0 7px 15px rgba(255,150,60,.28);
  font-size:23px;
}

.brand-name{
  font-size:21px;
  font-weight:400;
}

.score{
  background:#fff;
  border-radius:999px;
  padding:9px 16px;
  box-shadow:0 5px 13px rgba(35,41,70,.08);
  color:var(--ink-soft);
  font-size:14px;
  font-weight:500;
}

/* Home */
#homeView{
  display:block;
}

.hero{
  text-align:center;
  padding:clamp(24px,3vw,52px) 0 clamp(22px,2.5vw,38px);
}

.hero h1{
  font-size:clamp(34px,3.6vw,58px);
  line-height:1.05;
  font-weight: 400;
}

.hero p{
  width:min(720px,90%);
  max-width:720px;
  margin:14px auto 0;
  color:var(--ink-soft);
  font-size:clamp(14px,1.25vw,19px);
  font-weight:500;
  line-height:1.5;
}

/* FOUR STARTING CARDS
   4 cards remain in one row on large screens, including 1920px monitors. */
.world-grid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:clamp(18px,1.6vw,34px);
  padding:10px 0 clamp(55px,5vw,90px);
}

.world-card{
  width:100%;
  min-width:0;
  min-height:clamp(230px,18vw,310px);
  border-radius:clamp(24px,2vw,34px);
  background:#fff;
  padding:clamp(20px,2vw,34px) clamp(15px,1.5vw,28px);
  text-align:center;
  position:relative;
  box-shadow:0 14px 30px rgba(35,41,70,.11);
  border:4px solid transparent;
  transition:transform .2s ease,box-shadow .2s ease;
  cursor:pointer;
}

.world-card:hover{
  transform:translateY(-7px);
  box-shadow:0 21px 35px rgba(35,41,70,.17);
}

.world-card.w1{border-color:var(--w1-light)}
.world-card.w2{border-color:var(--w2-light)}
.world-card.w3{border-color:var(--w3-light)}
.world-card.w4{border-color:var(--w4-light)}

.world-number{
  position:absolute;
  top:clamp(-12px,-.7vw,-8px);
  left:clamp(-12px,-.7vw,-8px);
  width:clamp(38px,3vw,48px);
  height:clamp(38px,3vw,48px);
  display:grid;
  place-items:center;
  border-radius:999px;
  background:var(--sun);
  color:#5a3c00;
  border:3px solid #fff;
  box-shadow:0 5px 12px rgba(0,0,0,.15);
  font-family:"Livvic",sans-serif;
  font-size:clamp(16px,1.25vw,21px);
  font-weight:400;
}

.world-icon{
  width:clamp(62px,5vw,88px);
  height:clamp(62px,5vw,88px);
  margin:5px auto clamp(10px,1vw,16px);
  border-radius:clamp(18px,1.5vw,24px);
  display:grid;
  place-items:center;
  font-size:clamp(30px,2.4vw,42px);
}

.w1 .world-icon{background:var(--w1-light)}
.w2 .world-icon{background:var(--w2-light)}
.w3 .world-icon{background:var(--w3-light)}
.w4 .world-icon{background:var(--w4-light)}

.world-card h3{
  font-size:clamp(20px,3.65vw,25px);
  line-height:1.15;
  font-weight: 400;
}

.world-card p{
  margin:8px auto 14px;
  min-height:44px;
  max-width:250px;
  color:var(--ink-soft);
  font-size:clamp(13px,1vw,18px);
  font-weight:500;
  line-height:1.4;
}

.world-games{
  display:inline-block;
  padding:7px 14px;
  border-radius:999px;
  background:#f4f6fa;
  color:var(--ink-soft);
  font-size:clamp(14px,.9vw,18px);
  font-weight:400;
  position: absolute;
  right: 5px;
  top:5px;
}

/* Explore button on the 4 starting cards */
.explore-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:14px;
  padding:10px 18px;
  border-radius:999px;
  font-size:clamp(12px,1vw,15px);
  font-weight:500;
  white-space:nowrap;
  box-shadow:0 6px 14px rgba(35,41,70,.12);
}

/* Slightly stronger than the card border color */
.world-card.w1 .explore-btn{background:#DCEEF7;color:#4E6F82}
.world-card.w2 .explore-btn{background:#DCEFE2;color:#4F705B}
.world-card.w3 .explore-btn{background:#E7E0F4;color:#665A7D}
.world-card.w4 .explore-btn{background:#F8E9C9;color:#806A3F}

/* Category */
#categoryView{
  display:none;
  padding-bottom:clamp(55px,5vw,90px);
}

.category-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin:clamp(15px,1.5vw,25px) 0;
}

.back-btn{
  background:#fff;
  color:var(--ink);
  padding:11px 18px;
  border-radius:999px;
  box-shadow:0 5px 13px rgba(35,41,70,.08);
  font-weight:500;
  box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px, rgba(10, 37, 64, 0.35) 0px -2px 6px 0px inset;
}

.banner{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  gap:clamp(14px,1.5vw,24px);
  padding:clamp(20px,2vw,32px);
  margin-bottom:clamp(24px,2.5vw,36px);
  border-radius:clamp(22px,2vw,32px);
  color:#fff;
  box-shadow:0 12px 25px rgba(35,41,70,.1);
}

.banner-icon{
  width:clamp(58px,5vw,82px);
  height:clamp(58px,5vw,82px);
  flex:0 0 clamp(58px,5vw,82px);
  display:grid;
  place-items:center;
  border-radius:clamp(17px,1.5vw,23px);
  background:rgba(255,255,255,.22);
  font-size:clamp(28px,2.5vw,40px);
}

.banner h2{
  font-size:clamp(23px,2.2vw,34px);
  font-weight: 500;
}

.banner p{
  margin:5px 0 0;
  font-size:clamp(12px,1.05vw,16px);
  font-weight:500;
  opacity:.94;
}

.game-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:clamp(24px,2.2vw,40px);
}

.game-card{
  min-width:0;
  min-height:clamp(175px,14vw,230px);
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:clamp(22px,1.8vw,30px) 16px 32px;
  border-radius:clamp(22px,1.8vw,30px);
  background:#fff;
  box-shadow:0 12px 24px rgba(35,41,70,.1);
  text-align:center;
  cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease;
}

.game-card:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 30px rgba(35,41,70,.16);
}

.game-number{
  position:absolute;
  top:10px;
  left:10px;
  width:clamp(29px,2.1vw,36px);
  height:clamp(29px,2.1vw,36px);
  display:grid;
  place-items:center;
  border-radius:999px;
  color:#fff;
  font-size:clamp(12px,1vw,14px);
  font-weight:400;
}

.game-icon{
  width:clamp(54px,4.2vw,70px);
  height:clamp(54px,4.2vw,70px);
  display:grid;
  place-items:center;
  margin-bottom:11px;
  border-radius:clamp(17px,1.5vw,21px);
  color:#fff;
  font-size:clamp(25px,2.2vw,34px);
  box-shadow:0 7px 13px rgba(0,0,0,.13);
}

.game-card h4{
  font-size:clamp(20px,1.15vw,17px);
  line-height:1.25;
  font-weight: 400;
}

.play-btn{
  position:absolute;
  bottom:-17px;
  min-width:92px;
  height:42px;
  padding:0 16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:3px solid #fff;
  border-radius:999px;
  color:#fff;
  box-shadow:0 7px 15px rgba(0,0,0,.2);
  font-size:18px;
  font-weight:400;
  white-space:nowrap;
}

/* Responsive desktop/tablet */
@media (max-width:1200px){
  .wrap{
    width:min(1100px,calc(100% - 40px));
  }

  .world-grid,
  .game-grid{
    gap:20px;
  }
}

/* Tablet */
@media (max-width:850px){
  .world-grid,
  .game-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .world-card{
    min-height:235px;
  }
}

/* Mobile */
@media (max-width:560px){
  .wrap{
    width:calc(100% - 22px);
  }

  .topbar{
    padding-top:14px;
  }

  .brand-name{
    font-size:18px;
  }

  .score{
    padding:7px 10px;
    font-size:11px;
  }

  .hero{
    padding:23px 0 20px;
  }

  .hero p{
    width:96%;
    font-size:14px;
  }

  .world-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
  }

  .world-card{
    min-height:215px;
    padding:19px 9px;
    border-radius:22px;
  }

  .world-icon{
    width:58px;
    height:58px;
    border-radius:17px;
    font-size:28px;
  }

  .world-card h3{
    font-size:17px;
  }

  .world-card p{
    font-size:10.5px;
    min-height:47px;
  }

  .world-games{
    font-size:10.5px;
    padding:6px 10px;
  }

  .banner{
    padding:17px;
    border-radius:21px;
  }

  .banner-icon{
    width:54px;
    height:54px;
    flex-basis:54px;
    font-size:27px;
  }

  .banner h2{
    font-size:22px;
  }

  .banner p{
    font-size:11.5px;
  }

  .game-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:22px 11px;
  }

  .game-card{
    min-height:170px;
    padding:20px 7px 28px;
  }

  .game-card h4{
    font-size:12.5px;
  }
}

/* Very small phones */
@media (max-width:370px){
  .brand-name{
    font-size:16px;
  }

  .score{
    display:none;
  }

  .world-grid,
  .game-grid{
    grid-template-columns:1fr;
  }

  .world-card{
    min-height:205px;
  }
}

/* Landscape phones */
@media (max-height:520px) and (orientation:landscape){
  .hero{
    padding:15px 0;
  }

  .world-card{
    min-height:185px;
  }

  .world-icon{
    width:50px;
    height:50px;
    margin-bottom:7px;
  }

  .world-card p{
    min-height:auto;
    margin:5px auto 8px;
  }
}

/* Full-screen game player */
#playerView{
  display:none;
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  min-height:100vh;
  z-index:1000;
  background:#fff;
  overflow:hidden;
}

#playerView.show{
  display:block;
}

#gameFrame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  display:block;
  border:0;
  margin:0;
  padding:0;
  background:#fff;
}

.home-btn{
  position:fixed;
  z-index:1100;
  top:max(14px,env(safe-area-inset-top));
  left:max(14px,env(safe-area-inset-left));
  width:clamp(44px,3.2vw,52px);
  height:clamp(44px,3.2vw,52px);
  display:grid;
  place-items:center;
  border-radius:999px;
  background:#fff;
  color:var(--ink);
  box-shadow:0 8px 22px rgba(0,0,0,.25);
  font-size:clamp(19px,1.5vw,23px);
  transition:transform .15s ease;
}

.home-btn:hover{
  transform:scale(1.08);
}

@media(max-width:560px){
  .home-btn{
    top:max(10px,env(safe-area-inset-top));
    left:max(10px,env(safe-area-inset-left));
    width:46px;
    height:46px;
  }
}
/* Large monitors: 1600px - 1920px */
@media (min-width: 1600px) and (max-width: 1920px) {

  .wrap {
    width: min(1500px, calc(100% - 80px));
    margin: 0 auto;
  }

  .topbar {
    padding-top: 28px;
  }

  .brand-name {
    font-size: 24px;
  }

  .hero {
    padding: 45px 0 35px;
  }

  .hero h1 {
    font-size: 58px;
  }

  .hero p {
    max-width: 760px;
    font-size: 19px;
  }

  /* 4 cards in one row */
  .world-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 30px;
    width: 100%;
  }

  .world-card {
    min-height: 400px;
    padding: 60px 25px;
    border-radius: 32px;
  }

  .world-icon {
    width: 88px;
    height: 88px;
    font-size: 42px;
    border-radius: 24px;
    margin-bottom: 18px;
  }

  .world-card h3 {
    font-size: 25px;
  }

  .world-card p {
    max-width: 270px;
    font-size: 15px;
  }

  .world-number {
    width: 48px;
    height: 48px;
    font-size: 21px;
  }

  /* Game cards */
  .game-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 30px;
  }

  .game-card {
    min-height: 300px;
    padding: 30px 20px 35px;
    border-radius: 30px;
  }

  .game-icon {
    width: 100px;
    height: 100px;
    font-size: 54px;
    border-radius: 21px;
  }

  .game-card h4 {
    font-size: 25px;
  }

  .game-number {
    width: 36px;
    height: 36px;
    font-size: 14px;
  }

  .play-btn {
    min-width: 96px;
    height: 44px;
    padding: 0 18px;
  }

  /* Full-screen game */
  #playerView {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }

  #gameFrame {
    width: 100%;
    height: 100%;
  }

  .home-btn {
    width: 52px;
    height: 52px;
    top: 18px;
    left: 18px;
    font-size: 23px;
  }
}
/* No title, no other iframe overlay */

/* NEW SOFT PASTEL PALETTE */
.banner{color:#4f5963;border:1px solid rgba(90,100,110,.10);box-shadow:0 12px 25px rgba(70,80,90,.08);}
.banner h2{color:#46515c;}
.banner p{color:#68737d;opacity:1;}
.banner-icon{background:rgba(255,255,255,.55);}

.banner.pastel-w1{background:linear-gradient(135deg,#EAF5FA 0%,#D7EAF5 100%);border-color:#C8DFEC;}
.banner.pastel-w2{background:linear-gradient(135deg,#EEF8F1 0%,#DCEEE2 100%);border-color:#CFE3D5;}
.banner.pastel-w3{background:linear-gradient(135deg,#F4F1FA 0%,#E7E1F2 100%);border-color:#DDD4EA;}
.banner.pastel-w4{background:linear-gradient(135deg,#FFF8E9 0%,#F7E9CC 100%);border-color:#EADDBF;}

.game-card{border:1px solid #e7e9ec;box-shadow:0 10px 22px rgba(70,80,90,.07);}
.game-card.pastel-w1{background:#F8FCFE;border-color:#D6E7F0;}
.game-card.pastel-w2{background:#F9FCF9;border-color:#D8E9DC;}
.game-card.pastel-w3{background:#FBFAFE;border-color:#E0D9EA;}
.game-card.pastel-w4{background:#FFFDF8;border-color:#EDE1C9;}
.game-card.pastel-w1 .game-icon{background:#DCEEF7!important;color:#52748A;box-shadow:none;}
.game-card.pastel-w2 .game-icon{background:#DCEFE2!important;color:#58745F;box-shadow:none;}
.game-card.pastel-w3 .game-icon{background:#E7E0F4!important;color:#6C6080;box-shadow:none;}
.game-card.pastel-w4 .game-icon{background:#F8E9C9!important;color:#806A3F;box-shadow:none;}
.game-card.pastel-w1 .game-number,.game-card.pastel-w1 .play-btn{background:#C9E3F0!important;color:#4E6F82;}
.game-card.pastel-w2 .game-number,.game-card.pastel-w2 .play-btn{background:#CDE6D5!important;color:#4F705B;}
.game-card.pastel-w3 .game-number,.game-card.pastel-w3 .play-btn{background:#D9D0EA!important;color:#665A7D;}
.game-card.pastel-w4 .game-number,.game-card.pastel-w4 .play-btn{background:#F0DDB7!important;color:#806A3F;}
.game-card.pastel-w1 .play-btn,.game-card.pastel-w2 .play-btn,.game-card.pastel-w3 .play-btn,.game-card.pastel-w4 .play-btn{border-color:#fff;box-shadow:0 6px 12px rgba(70,80,90,.12);}

</style>
</head>

<body>

<div class="background" aria-hidden="true">
  <div class="cloud" style="width:180px;height:55px;left:-40px;top:8%;"></div>
  <div class="cloud" style="width:140px;height:45px;right:-25px;top:23%;"></div>
  <div class="cloud" style="width:160px;height:50px;left:-50px;bottom:15%;"></div>

  <div class="balloon" style="left:4%;top:20%;background:#A9CFE7;"></div>
  <div class="balloon" style="right:4%;top:13%;background:#A8D5BA;animation-delay:-2s;"></div>
  <div class="balloon" style="left:7%;bottom:10%;background:#C2B6E8;animation-delay:-4s;"></div>
  <div class="balloon" style="right:8%;bottom:16%;background:#F1D39B;animation-delay:-1s;"></div>
</div>

<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🔢</div>
      <div class="brand-name">Math Adventure</div>
    </div>
    <div class="score">⭐ 14 Activities to explore</div>
  </header>

  <!-- HOME -->
  <main id="homeView">

    <section class="hero">
      <h1>Choose an Activity, Start the Quest</h1>
      <!-- <p>
        Fourteen bite-sized math games, sorted into four worlds.
        Choose a world and start learning!
      </p> -->
    </section>

    <!-- EXACTLY 4 STARTING CARDS -->
    <section id="worldsContainer" class="world-grid"></section>

  </main>

  <!-- CATEGORY -->
  <section id="categoryView">

    <div class="category-top">
      <button class="back-btn" type="button" onclick="showHome()">
        🏠 Home
      </button>
    </div>

    <div id="catBanner"></div>

    <div id="catGrid" class="game-grid"></div>

  </section>

</div>

<!-- GAME IFRAME -->
<div id="playerView">

  <!-- ONLY EXTRA ELEMENT OVER THE IFRAME -->
  <button
    class="home-btn"
    type="button"
    onclick="goHome()"
    aria-label="Home"
    title="Home">
    🏠
  </button>

  <iframe
    id="gameFrame"
    title="Math game"
    allowfullscreen>
  </iframe>

</div>

<script>
"use strict";

/*
  ============================================================
  EDIT GAME URLS HERE
  ============================================================

  Put the real HTML file path in each url.

  Example:
  url: "./exercise/match_numbername.html"

  If your exercise files are inside the same folder:
  url: "match-number-name.html"

  If they are inside ../exercises/:
  url: "./exercise/match_numbername.html"
*/

const DATA = [
  {
    id:"w1",
    key:"w1",
    name:"Match & Name",
    icon:"🏷️",
    desc:"Match numbers with their names and matching pairs.",
    color:"var(--w1)",
    games:[
      {
        icon:"🔗",
        title:"Match Number & Name",
        url:"./exercise/match_numbername.html"
      },
      {
        icon:"🧷",
        title:"Matching",
        url:"./exercise/matching.html"
      },
      {
        icon:"🔤",
        title:"Number Name",
        url:"./exercise/numbername.html"
      },
      {
        icon:"🧩",
        title:"Matching Two",
        url:"./exercise/matching_two.html"
      }
    ]
  },

  {
    id:"w2",
    key:"w2",
    name:"Number Values",
    icon:"🧮",
    desc:"Explore what each digit and number is really worth.",
    color:"var(--w2)",
    games:[
      {
        icon:"🧮",
        title:"Abacus",
        url:"./exercise/abacus.html"
      },
      {
        icon:"🔟",
        title:"Face Value",
        url:"./exercise/facevalue.html"
      },
      {
        icon:"🏛️",
        title:"Place Value",
        url:"./exercise/placevalue.html"
      },
      {
        icon:"📝",
        title:"Fill in the Blanks",
        url:"./exercise/fillintheblanks.html"
      }
    ]
  },

  {
    id:"w3",
    key:"w3",
    name:"Compare Numbers",
    icon:"⚖️",
    desc:"Decide which number is bigger, smaller, or in between.",
    color:"var(--w3)",
    games:[
      {
        icon:"↔️",
        title:"Before, After & Between",
        url:"./exercise/before_after_btwn.html"
      },
      {
        icon:"🔣",
        title:"Correct Symbols",
        url:"./exercise/symbol.html"
      },
      {
        icon:"1️─2️",
        title:"Greater & Smaller",
        url:"./exercise/greater_smaller.html"
      }
    ]
  },

  {
    id:"w4",
    key:"w4",
    name:"Creative Play",
    icon:"🎨",
    desc:"Draw, decorate, and play with numbers your own way.",
    color:"var(--w4)",
    games:[
      {
        icon:"📿",
        title:"Draw Beads",
        url:"./exercise/drawbeads.html"
      },
      {
        icon:"🌸",
        title:"Petal",
        url:"./exercise/petal.html"
      },
      {
        icon:"🧢",
        title:"Cap",
        url:"./exercise/cap.html"
      }
    ]
  }
];

const worldsContainer = document.getElementById("worldsContainer");
const homeView = document.getElementById("homeView");
const categoryView = document.getElementById("categoryView");
const catBanner = document.getElementById("catBanner");
const catGrid = document.getElementById("catGrid");
const playerView = document.getElementById("playerView");
const gameFrame = document.getElementById("gameFrame");

function renderWorlds(){

  worldsContainer.innerHTML = DATA.map((world,index) => {

    return `
      <article
        class="world-card ${world.key}"
        onclick="openWorld('${world.id}')"
        tabindex="0"
        role="button"
        aria-label="Open ${escapeHtml(world.name)}">

        <div class="world-number">${index + 1}</div>

        <div class="world-icon">${world.icon}</div>

        <h3>${escapeHtml(world.name)}</h3>

        <p>${escapeHtml(world.desc)}</p>

        <span class="world-games">
          ${world.games.length} games
        </span>

        <span class="explore-btn">
          EXPLORE ACTIVITIES →
        </span>

      </article>
    `;

  }).join("");

  document.querySelectorAll(".world-card").forEach(card => {

    card.addEventListener("keydown",event => {

      if(event.key === "Enter" || event.key === " "){

        event.preventDefault();
        card.click();

      }

    });

  });
}

let currentWorldId = null;
let currentGameIndex = null;

function openWorld(id){

  const world = DATA.find(item => item.id === id);

  if(!world) return;

  currentWorldId = id;

  catBanner.innerHTML = `
    <div
      class="banner"
      style="background:${world.color}">

      <div class="banner-icon">
        ${world.icon}
      </div>

      <div>
        <h2>${escapeHtml(world.name)}</h2>
        <p>${escapeHtml(world.desc)}</p>
      </div>

    </div>
  `;

  catGrid.innerHTML = world.games.map((game,index) => {

    return `
      <article
        class="game-card"
        onclick="openGame('${world.id}',${index})"
        role="button"
        tabindex="0">

        <div
          class="game-number"
          style="background:${world.color}">
          ${index + 1}
        </div>

        <div
          class="game-icon"
          style="background:${world.color}">
          ${game.icon}
        </div>

        <h4>${escapeHtml(game.title)}</h4>

        <button
          class="play-btn"
          type="button"
          style="background:${world.color}"
          onclick="event.stopPropagation();openGame('${world.id}',${index})"
          aria-label="Play ${escapeHtml(game.title)}">
          Play ▶
        </button>

      </article>
    `;

  }).join("");

  document.querySelectorAll(".game-card").forEach(card => {

    card.addEventListener("keydown",event => {

      if(event.key === "Enter" || event.key === " "){

        event.preventDefault();
        card.click();

      }

    });

  });

  homeView.style.display = "none";
  categoryView.style.display = "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function showHome(){
  /*
    Back to the 4 starting cards.
    This is only used by the category "Back to worlds" button.
  */
  currentWorldId = null;
  currentGameIndex = null;

  categoryView.style.display = "none";
  homeView.style.display = "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function openGame(worldId,gameIndex){

  const world = DATA.find(item => item.id === worldId);

  if(!world) return;

  const game = world.games[gameIndex];

  if(!game) return;

  if(!game.url || game.url.trim() === ""){

    alert(
      "This game does not have a URL yet. " +
      "Please add the correct HTML file path in DATA."
    );

    return;
  }

  /*
    Remember exactly which world/card was opened.
    The Home button will return to this same card's game list.
  */
  currentWorldId = worldId;
  currentGameIndex = gameIndex;

  gameFrame.src = game.url;

  playerView.classList.add("show");

  document.body.style.overflow = "hidden";
}

function goHome(){

  /*
    Close the iframe and return to the SAME WORLD CARD
    that launched the game, not the first/home page.
  */
  playerView.classList.remove("show");

  gameFrame.src = "about:blank";

  document.body.style.overflow = "";

  if(currentWorldId){
    openWorld(currentWorldId);
  }else{
    showHome();
  }
}

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* Start page */
renderWorlds();

/*
  Browser back button support.
*/
window.addEventListener("popstate",function(){

  if(playerView.classList.contains("show")){
    goHome();
  }else if(categoryView.style.display === "block"){
    showHome();
  }

});
</script>

</body>
</html>
