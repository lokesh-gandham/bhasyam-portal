<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Maths Fun - Activities</title>

    <style>
        * {
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
            background:
                radial-gradient(circle at 8% 15%, #fff 0 2px, transparent 3px),
                radial-gradient(circle at 92% 18%, #fff 0 3px, transparent 4px),
                linear-gradient(135deg, #fff9e9, #fffdf5 48%, #fff5dc);
            color: #172d4a;
        }


        .app {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            padding: clamp(6px, 1vh, 14px) clamp(10px, 1.5vw, 24px);
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 0 0 auto;
            height: clamp(58px, 9vh, 88px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .math-icons {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .math-icons span {
            position: absolute;
            font-weight: 900;
            opacity: .85;
            user-select: none;
        }

        .math-icons .plus {
            left: 6%;
            top: 0;
            font-size: clamp(25px, 3vw, 45px);
            color: #26a9df;
            transform: rotate(-10deg)
        }

        .math-icons .star {
            left: 15%;
            top: 8px;
            font-size: clamp(23px, 2.8vw, 40px);
            color: #f6b52e
        }

        .math-icons .minus {
            right: 17%;
            top: 5px;
            font-size: clamp(24px, 2.8vw, 40px);
            color: #ef7092
        }

        .math-icons .times {
            right: 6%;
            top: 0;
            font-size: clamp(27px, 3vw, 45px);
            color: #72c54a
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(30px, 3.7vw, 54px);
            line-height: .9;
            font-weight: 900;
            color: #173b67;
            text-shadow: 0 2px 0 #fff;
        }

        .hero p {
            margin: 5px 0 0;
            font-size: clamp(11px, 1vw, 16px);
            color: #815b9a;
            font-weight: 700;
        }

        .cards {
            flex: 1 1 auto;
            min-height: 0;
            width: min(1500px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            grid-template-rows: repeat(4, minmax(0, 1fr));
            gap: clamp(6px, .8vw, 12px);
            overflow: hidden;
        }

        .card {
            min-width: 0;
            min-height: 0;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, .96);
            border: 2px solid var(--border);
            border-radius: clamp(13px, 1.1vw, 20px);
            padding: clamp(5px, .55vw, 9px);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            align-items: center;
            box-shadow: 0 4px 10px rgba(68, 55, 25, .09);
            transition: transform .16s ease, box-shadow .16s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(68, 55, 25, .14);
        }

        .badge {
            position: absolute;
            left: 6px;
            top: 6px;
            width: clamp(25px, 2vw, 34px);
            height: clamp(25px, 2vw, 34px);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent);
            color: #fff;
            font-size: clamp(12px, 1vw, 17px);
            font-weight: 900;
            box-shadow: 0 2px 0 rgba(0, 0, 0, .13);
            z-index: 3;
        }

        .card h2 {
            width: 100%;
            min-height: 0;
            height: clamp(29px, 4vh, 43px);
            margin: 0;
            padding: 0 4px 0 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: clamp(11px, 1vw, 16px);
            line-height: 1.05;
            font-weight: 900;
            color: #202b38;
            overflow: hidden;
        }

        .visual {
            min-height: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0;
        }

        .visual>* {
            max-width: 92%;
            max-height: 90%;
        }

        .play {
            justify-self: center;
            align-self: end;
            width: min(118px, 72%);
            height: clamp(23px, 2.7vh, 32px);
            margin-top: 2px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(145deg, var(--accent2), var(--accent));
            color: #fff;
            font-size: clamp(10px, .85vw, 14px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 75%, #000);
            transition: transform .15s ease;
            padding: 0;
        }

        .play:hover {
            transform: scale(1.04)
        }

        .play:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 75%, #000)
        }

        .apple {
            font-size: clamp(22px, 2.5vw, 42px);
            filter: drop-shadow(0 2px 1px #0002);
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(3px, .45vw, 7px);
            width: 100%;
            min-width: 0;
        }

        .num {
            min-width: clamp(27px, 2.4vw, 42px);
            height: clamp(27px, 2.4vw, 42px);
            padding: 2px;
            border-radius: 7px;
            border: 2px solid #dfb56a;
            background: #fffaf0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(12px, 1.35vw, 21px);
            line-height: 1;
            font-weight: 900;
            white-space: nowrap;
        }

        .small {
            font-size: clamp(9px, .8vw, 13px);
            font-weight: 900;
        }

        .answer {
            width: clamp(25px, 2.5vw, 40px);
            height: clamp(20px, 2vw, 34px);
            border: 2px solid #ef9b55;
            border-radius: 6px;
            background: #fff;
        }

        .bowl {
            width: clamp(40px, 4vw, 65px);
            height: clamp(27px, 2.7vw, 43px);
            border: 2px solid #cf9141;
            border-radius: 4px 4px 25px 25px;
            background: linear-gradient(#ffd779, #f3ae43);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(8px, .75vw, 12px);
            font-weight: 900;
        }

        .abacus {
            width: 78%;
            max-width: 150px;
            padding: 4px 8px;
            border: 2px solid #c9904e;
            border-radius: 8px;
            background: #f8dfac;
        }

        .rod {
            height: 4px;
            margin: 4px 0;
            border-radius: 8px;
            background: #8c6949;
            position: relative;
        }

        .bead {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: clamp(12px, 1.2vw, 19px);
            height: clamp(12px, 1.2vw, 19px);
            border-radius: 50%;
            background: #ef6c79;
            border: 1px solid #c94e5b;
        }

        .match {
            display: flex;
            width: 75%;
            justify-content: space-between;
            font-size: clamp(11px, 1vw, 16px);
            line-height: 1.25;
            font-weight: 900;
        }

        .match div {
            display: flex;
            flex-direction: column;
            gap: 2px
        }

        .bars {
            display: flex;
            align-items: end;
            justify-content: center;
            gap: clamp(4px, .7vw, 10px);
            height: 85%;
        }

        .bar {
            width: clamp(16px, 1.8vw, 28px);
            border-radius: 7px 7px 3px 3px;
            background: #7cc5ed;
            border: 2px solid #438dbd;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 2px;
            font-size: clamp(9px, .75vw, 12px);
            font-weight: 900;
        }

        .symbol {
            font-size: clamp(20px, 2.2vw, 35px);
            line-height: 1;
            font-weight: 900;
        }

        .dotgrid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            width: 65%;
            max-width: 100px;
        }

        .dot {
            aspect-ratio: 1;
            border-radius: 50%;
            background: #9b72dc;
            border: 1px solid #7251b1;
        }

        .pencil {
            font-size: clamp(24px, 2.5vw, 40px);
        }

        .palette {
            display: flex;
            gap: 3px;
            font-size: clamp(18px, 2vw, 30px);
        }

        .cards .card:nth-child(n+19) h2 {
            font-size: clamp(10px, .9vw, 14px);
        }

        @media(max-width:1050px) {
            .cards {
                grid-template-columns: repeat(5, minmax(0, 1fr));
                grid-template-rows: repeat(5, minmax(0, 1fr));
            }

            .hero {
                height: 65px
            }
        }

        @media(max-width:720px) {
            .app {
                padding: 4px 6px
            }

            .hero {
                height: 52px
            }

            .hero h1 {
                font-size: 27px
            }

            .hero p {
                display: none
            }

            .math-icons {
                display: none
            }

            .cards {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                grid-template-rows: repeat(7, minmax(0, 1fr));
                gap: 5px;
            }

            .card {
                padding: 4px;
                border-width: 1.5px;
                border-radius: 11px;
            }

            .badge {
                left: 4px;
                top: 4px;
                width: 22px;
                height: 22px;
                border-radius: 6px;
                font-size: 10px;
            }

            .card h2 {
                height: 27px;
                padding-left: 24px;
                font-size: 8px;
                line-height: 1.02;
            }

            .visual>* {
                max-width: 88%;
                max-height: 85%
            }

            .num {
                min-width: 24px;
                height: 24px;
                border-radius: 5px;
                font-size: 10px;
            }

            .symbol {
                font-size: 18px
            }

            .match {
                font-size: 8px
            }

            .bowl {
                width: 35px;
                height: 23px;
                font-size: 7px
            }

            .abacus {
                padding: 3px 5px
            }

            .rod {
                height: 3px;
                margin: 3px 0
            }

            .bead {
                width: 10px;
                height: 10px
            }

            .play {
                width: min(90px, 70%);
                height: 22px;
                font-size: 8px
            }
        }

        @media(max-width:430px) {
            .hero {
                height: 42px
            }

            .hero h1 {
                font-size: 21px
            }

            .cards {
                gap: 3px
            }

            .card {
                padding: 3px
            }

            .card h2 {
                height: 24px;
                font-size: 7px;
                padding-left: 22px
            }

            .badge {
                width: 19px;
                height: 19px;
                font-size: 9px
            }

            .play {
                height: 20px;
                font-size: 7px
            }

            .num {
                min-width: 21px;
                height: 21px;
                font-size: 9px
            }
        }

        /* ===== Iframe overlay for exercises ===== */
        .exercise-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: #fffdf5;
            z-index: 1000;
            display: none;
        }

        .exercise-overlay.open {
            display: block;
        }

        .exercise-overlay iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* Floating home button lives ON TOP of the iframe, not on the home page */
        .home-btn {
            position: fixed;
            top: clamp(8px, 1.5vh, 18px);
            left: clamp(8px, 1.5vw, 18px);
            width: clamp(34px, 6vw, 58px);
            height: clamp(34px, 6vw, 58px);
            border-radius: 50%;
            border: 0;
            background: linear-gradient(145deg, #ff9a42, #f47721);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(16px, 2.6vw, 30px);
            cursor: pointer;
            box-shadow: 0 3px 0 #c9600f, 0 6px 10px rgba(0, 0, 0, .18);
            z-index: 1001;
            transition: transform .15s ease;
            user-select: none;
            padding: 0;
        }

        .home-btn:hover {
            transform: scale(1.06);
        }

        .home-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #c9600f, 0 3px 6px rgba(0, 0, 0, .18);
        }
    </style>
</head>

<body>
    <div class="app" id="homeApp">

        <header class="hero">
            <div class="math-icons">
                <span class="plus">+</span>
                <span class="star">★</span>
                <span class="minus">−</span>
                <span class="times">×</span>
            </div>
            <h1>Maths Fun</h1>
            <!-- <p>Learn • Practice • Grow</p> -->
        </header>

        <main class="cards" id="cards"></main>

    </div>

    <!-- Exercise opens here, inside an iframe, with its own home button on top -->
    <div class="exercise-overlay" id="exerciseOverlay">
        <button class="home-btn" id="homeBtn" title="Home" onclick="closeActivity()">🏠</button>
        <iframe id="exerciseFrame" src="" title="Activity"></iframe>
    </div>

    <script>
        const activities = [
            ["Join Dots", "🦋"],
            ["Number Form", "3  4  7"],
            ["Sort Numbers", "🥣"],
            ["Match Pairs", "↔"],
            ["Abacus Scale", "abacus"],
            ["Draw Beads", "abacus-empty"],
            ["Number Names", "ONE"],
            ["Before Number", "before"],
            ["After Number", "after"],
            ["Between Number", "between"],
            ["Number Compare", "<"],
            ["Biggest Number", "⬆"],
            ["Smallest Number", "⬇"],
            ["Even Or Odd", "E / O"],
            ["Even Numbers", "24  37  58"],
            ["Odd Numbers", "25  46  71"],
            ["Colour Picture", "🎨"],
            ["Height Order", "height"],
            ["Fill Boxes", "□ + 7 = 15"],
            ["Sum Difference", "+  −"],
            ["Addition Facts", "3 + 4 = 7"]
        ];

        const colors = [
            ["#7654b5", "#9473d1", "#d8c9ee"],
            ["#f47721", "#ff9a42", "#ffd5b6"],
            ["#2aa5d8", "#48bde9", "#c5ebf7"],
            ["#70b938", "#8dd154", "#d9efc7"],
            ["#ef5d86", "#f27aa0", "#f8d0dc"],
            ["#2c9fca", "#54c1e0", "#c9edf6"],
            ["#a35bb4", "#bc77c8", "#e7c9ec"],
            ["#f47721", "#ff9a42", "#ffd5b6"],
            ["#2aa5d8", "#48bde9", "#c5ebf7"],
            ["#70b938", "#8dd154", "#d9efc7"],
            ["#ef5d86", "#f27aa0", "#f8d0dc"],
            ["#2c9fca", "#54c1e0", "#c9edf6"],
            ["#a35bb4", "#bc77c8", "#e7c9ec"],
            ["#f47721", "#ff9a42", "#ffd5b6"],
            ["#2aa5d8", "#48bde9", "#c9edf6"],
            ["#70b938", "#8dd154", "#d9efc7"],
            ["#ef5d86", "#f27aa0", "#f8d0dc"],
            ["#2c9fca", "#54c1e0", "#c9edf6"],
            ["#a35bb4", "#bc77c8", "#e7c9ec"],
            ["#f47721", "#ff9a42", "#ffd5b6"],
            ["#2aa5d8", "#48bde9", "#c9edf6"]
        ];

        function visual(type, index) {
            if (type === "abacus" || type === "abacus-empty") {
                let rows = "";
                for (let r = 0; r < 3; r++) {
                    rows += `<div class="rod">${type === "abacus"
                        ? [22, 32, 42].map(x => `<span class="bead" style="left:${x + r * 3}%"></span>`).join("")
                        : ""
                        }</div>`;
                }
                return `<div class="abacus">${rows}</div>`;
            }

            if (index === 0) return `<div class="row" style="font-size:clamp(18px,1.5vw,26px);font-weight:900">51 • 52 • 53 • … • 100</div><div class="apple">🦋</div>`;
            if (index === 1) return `<div class="row"><div class="num">3</div><div class="num">4</div><div class="num">7</div></div>`;
            if (index === 2) return `<div class="row"><div class="bowl">Tens</div><div class="bowl">Ones</div></div>`;
            if (index === 3) return `<div class="match"><div>7 + 3<br>9 − 4<br>6 + 2</div><div>8<br>10<br>5</div></div>`;
            if (index === 6) return `<div class="row"><div class="num">ONE</div><div class="num">TWO</div><div class="num">THREE</div></div>`;
            if (index === 7) return `<div class="row"><div class="num"><span class="answer"></span></div><div class="num">400</div></div>`;
            if (index === 8) return `<div class="row"><div class="num">399</div><div class="symbol">→</div><div class="num"><span class="answer"></span></div></div>`;
            if (index === 9) return `<div class="row"><div class="num">423</div><div class="num"><span class="answer"></span></div><div class="num">425</div></div>`;
            if (index === 10) return `<div class="row"><div class="num">45</div><div class="symbol">?</div><div class="num">54</div></div>`;
            if (index === 11) return `<div class="row"><div class="num">23</div><div class="symbol">⬆</div><div class="num">32</div></div>`;
            if (index === 12) return `<div class="row"><div class="num">23</div><div class="symbol">⬇</div><div class="num">32</div></div>`;
            if (index === 13) return `<div class="row"><div class="num">576</div><div class="small">☐ E<br>☐ O</div></div>`;
            if (index === 14 || index === 15) return `<div class="row"><div class="circle num">24</div><div class="circle num">37</div><div class="circle num">58</div></div>`;
            if (index === 16) return `<div class="palette">🍎 🌿 🟡</div>`;
            if (index === 17) return `<div class="bars"><div class="bar" style="height:45%">A</div><div class="bar" style="height:72%">B</div><div class="bar" style="height:58%">C</div><div class="bar" style="height:88%">D</div></div>`;
            if (index === 18) return `<div class="row"><div class="num">23</div><div class="symbol">+</div><div class="num">□</div><div class="symbol">=</div><div class="num">30</div></div>`;
            if (index === 19) return `<div class="row"><div class="fact num">34 + 12</div><div class="fact num">56 − 21</div></div>`;
            if (index === 20) return `<div class="row"><div class="fact num">3 + 4 = 7</div></div>`;
            return `<div class="symbol">${type}</div>`;
        }

        const cards = document.getElementById("cards");

        activities.forEach((item, i) => {
            const c = colors[i];
            const card = document.createElement("article");
            card.className = "card";
            card.style.setProperty("--accent", c[0]);
            card.style.setProperty("--accent2", c[1]);
            card.style.setProperty("--border", c[2]);

            card.innerHTML = `
        <div class="badge">${i + 1}</div>
        <h2>${item[0]}</h2>
        <div class="visual">${visual(item[1], i)}</div>
        <button class="play" onclick="openActivity(${i + 1})">
            ▶ Play
        </button>
    `;
            cards.appendChild(card);
        });

        const activityFiles = {
            1: "exercises/dots2.html",
            2: "exercises/NumbersFormed.html",
            3: "exercises/sorting.html",
            4: "exercises/match.html",
            5: "exercises/5.html",
            6: "exercises/6.html",
            7: "exercises/7.html",
            8: "exercises/8.html",
            9: "exercises/9.html",
            10: "exercises/10.html",
            11: "exercises/11.html",
            12: "exercises/12.html",
            13: "exercises/13.html",
            14: "exercises/14.html",
            15: "exercises/15.html",
            16: "exercises/16.html",
            17: "exercises/17.html",
            18: "exercises/height_order_game_updated.html",
            19: "exercises/19.html",
            20: "exercises/20.html",
            21: "exercises/21.html"
        };

        const overlay = document.getElementById("exerciseOverlay");
        const frame = document.getElementById("exerciseFrame");
        const homeApp = document.getElementById("homeApp");

        function openActivity(n) {
            if (!activityFiles[n]) return;
            frame.src = activityFiles[n];
            overlay.classList.add("open");
            homeApp.style.display = "none";
        }

        function closeActivity() {
            overlay.classList.remove("open");
            frame.src = "";
            homeApp.style.display = "flex";
        }
    </script>
</body>

</html>
