<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Connect the Dots — Beaver</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f7f7f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    body {
      padding: 8px;
    }

    .game-card {
      width: min(100%, 900px);
      margin: auto;
      background: #fff;
      border: 1px solid #e5e5e2;
      border-radius: 18px;
      padding: 18px 16px 16px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, .04);
    }

    .header {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr) 110px;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }

    .header button,
    #counter {
      height: 46px;
      border-radius: 10px;
      font-size: 16px;
    }

    .header button {
      border: 0;
      background: #0d9d4e;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .12);
    }

    .header button:active {
      transform: translateY(1px);
    }

    #counter {
      display: grid;
      place-items: center;
      background: #0d9d4e;
      color: #fff;
      font-weight: bold;
    }

    .instruction {
      min-height: 46px;
      display: grid;
      place-items: center;
      padding: 8px 14px;
      border: 2px solid #b8dfbd;
      border-radius: 10px;
      background: #eef9ee;
      color: #26764a;
      font-size: 16px;
      text-align: center;
    }

    .puzzle {
      width: 100%;
      border: 1px solid #ededed;
      border-radius: 12px;
      overflow: hidden;
      line-height: 0;
    }

    #svg {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
      user-select: none;
    }

    .target {
      fill: transparent;
      stroke: transparent;
      pointer-events: all;
      cursor: pointer;
    }

    .target.done {
      pointer-events: none;
    }

    #lines line {
      stroke: #111;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .tip {
      width: max-content;
      max-width: 100%;
      margin: 14px auto 0;
      padding: 9px 15px;
      border: 2px solid #c5e6c8;
      border-radius: 9px;
      background: #eef9ee;
      color: #26764a;
      font-size: 14px;
      text-align: center;
    }

    #success {
      display: none;
      position: fixed;
      inset: 0;
      place-items: center;
      background: rgba(255, 255, 255, .5);
      z-index: 5;
    }

    #success.show {
      display: grid;
    }

    .success-card {
      background: #fff;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 24px 30px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .18);
    }

    .success-card b {
      display: block;
      font-size: 36px;
      margin-bottom: 5px;
    }

    .success-card button {
      margin-top: 16px;
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      background: #0d9d4e;
      color: #fff;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      body {
        padding: 4px;
      }

      .game-card {
        padding: 10px 8px 12px;
        border-radius: 12px;
      }

      .header {
        grid-template-columns: 78px minmax(0, 1fr) 78px;
        gap: 7px;
        margin-bottom: 9px;
      }

      .header button,
      #counter,
      .instruction {
        height: 40px;
        min-height: 40px;
        font-size: 12px;
      }

      .instruction {
        padding: 4px 6px;
        line-height: 1.15;
      }

      .puzzle {
        border-radius: 8px;
      }

      .tip {
        margin-top: 9px;
        padding: 7px 9px;
        font-size: 11px;
      }
    }
  </style>
</head>

  <script>
    const P = { "51": [360.5, 55.7], "52": [369.1, 80.4], "53": [380.5, 91.4], "54": [396.8, 116.9], "55": [411.2, 78.3], "56": [462.1, 28.2], "57": [542.6, 4.7], "58": [579.8, 69.7], "59": [566.7, 127.8], "60": [534.7, 83.8], "61": [471.7, 107.5], "62": [418.0, 147.0], "63": [436.1, 178.6], "64": [447.7, 214.4], "65": [443.5, 248.7], "66": [416.0, 279.7], "67": [449.4, 308.2], "68": [477.2, 329.1], "69": [497.8, 357.1], "70": [525.3, 347.0], "71": [527.1, 360.7], "72": [549.2, 372.5], "73": [532.4, 388.8], "74": [532.8, 412.3], "75": [506.7, 407.5], "76": [492.4, 449.8], "77": [432.0, 472.0], "78": [390.5, 473.5], "79": [364.7, 471.8], "80": [336.0, 445.0], "81": [301.0, 423.0], "82": [287.6, 384.1], "83": [279.1, 360.2], "84": [289.0, 338.8], "85": [304.1, 320.6], "86": [299.6, 289.2], "87": [250.3, 265.9], "88": [229.4, 229.1], "89": [233.4, 184.8], "90": [263.3, 140.9], "91": [312.4, 100.8], "92": [281.6, 68.7], "93": [247.6, 87.9], "94": [195.5, 125.7], "95": [137.0, 126.6], "96": [143.2, 78.0], "97": [213.1, 36.4], "98": [265.4, 30.6], "99": [305.1, 46.0], "100": [328.5, 93.8] };
    const START = 51, END = 100, HIT = 16;
    const svg = document.getElementById('svg');
    const lines = document.getElementById('lines');
    const targets = document.getElementById('targets');
    const counter = document.getElementById('counter');
    const instruction = document.getElementById('instruction');
    const success = document.getElementById('success');

    let next = START, previous = null;

    function el(tag, attrs) {
      const x = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const k in attrs) x.setAttribute(k, attrs[k]);
      return x;
    }

    function draw(a, b) {
      lines.appendChild(el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1] }));
    }

    function refresh() {
      if (next > END) {
        counter.textContent = '100 / 100';
        instruction.textContent = 'All done — great job!';
      } else {
        counter.textContent = next + ' / 100';
        instruction.textContent = 'Find and tap dot number ' + next;
      }
    }

    function connect(n) {
      if (n !== next || next > END) return;
      const p = P[String(n)];
      if (previous) draw(previous, p);
      previous = p;
      const t = document.querySelector('[data-n="' + n + '"]');
      if (t) t.classList.add('done');
      next++;
      refresh();
      if (next > END) success.classList.add('show');
    }

    function build() {
      for (let n = START; n <= END; n++) {
        const p = P[String(n)];
        const t = el('circle', { class: 'target', cx: p[0], cy: p[1], r: HIT, 'data-n': n });
        t.addEventListener('pointerdown', function (e) { e.preventDefault(); connect(n); });
        targets.appendChild(t);
      }
    }

    function reset() {
      next = START;
      previous = null;
      lines.innerHTML = '';
      document.querySelectorAll('.target').forEach(function (t) { t.classList.remove('done'); });
      success.classList.remove('show');
      refresh();
    }

    document.getElementById('reset').addEventListener('click', reset);
    document.getElementById('again').addEventListener('click', reset);

    build();
    refresh();
  </script>
