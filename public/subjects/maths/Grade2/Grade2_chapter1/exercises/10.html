<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Before → Fruits</title>

  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../assets/css/reuse.css">

  <style>
    /* =========================================================
   RESET
   ========================================================= */
    * {
      box-sizing: border-box;
      font-family: "Livvic", sans-serif;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8F4FF;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body,
    .quiz-card {
      cursor: default !important;
    }

    button,
    button *,
    .fruit-option,
    .fruit-option * {
      cursor: pointer !important;
    }

    button:disabled,
    button:disabled *,
    .fruit-option:disabled,
    .fruit-option:disabled * {
      cursor: default !important;
    }

    /* =========================================================
   QUIZ CARD
   ========================================================= */
    .quiz-card {
      width: 100%;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(18px, 3vh, 35px) clamp(15px, 4vw, 60px);
      overflow: hidden;
      /* background-color: #208344; */
    }

    /* =========================================================
   TITLE
   ========================================================= */
    .heading {
      margin: 0;
      width: 100%;
      text-align: center;
      font-size: 30px;
      line-height: 1.25;
      color: #2f2f2f;
      margin-top: -20px;
    }

    /* =========================================================
   MAIN CONTENT
   ========================================================= */
    .content-row {
      width: 100%;
      max-width: 1120px;
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: clamp(10px, 1.5vh, 18px);
      min-height: 0;
      padding: clamp(10px, 1.5vh, 18px) 0 0;
    }

    /* Q label sits at the left-top of the question visual */
    .question-heading {
      width: 100%;
      height: 0;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 10;
      display: block;
      margin: 0;
      padding: 0;
      flex: 0 0 auto;
    }

    .qlabel {
      position: absolute;
      left: 0;
      top: 0;
      margin: 0;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.1;
      color: #2f2f2f;
    }

    /* =========================================================
   QUESTION VISUAL — GUAVA + APPLE + ORANGE
   ========================================================= */
    .question-visual {
      width: 100%;
      max-width: 1120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 4vw, 70px);
      margin: clamp(34px, 4vh, 48px) 0 0;
      flex: 0 0 auto;
    }

    .fruit-question {
      position: relative;
      width: clamp(180px, 21vw, 310px);
      height: clamp(190px, 24vw, 330px);
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;

    }

    .fruit-question img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .fruit-question .fruit-number {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;

      font-size: clamp(38px, 4.7vw, 64px);
      font-weight: 400;
      line-height: 1;
      color: #fff !important;

      text-shadow:
        0 2px 0 rgba(255, 255, 255, .6),
        0 2px 6px rgba(0, 0, 0, .12);

      pointer-events: none;
    }

    .fruit-question.answer-fruit .fruit-number {
      display: none;
    }

    .fruit-question.answer-fruit.revealed .fruit-number {
      display: block;
      color: #208344;
      animation: answerPop .42s cubic-bezier(.2, .9, .25, 1.25);
    }

    @keyframes answerPop {
      0% {
        transform: translate(-50%, -50%) scale(.55);
        opacity: 0
      }

      70% {
        transform: translate(-50%, -50%) scale(1.08);
        opacity: 1
      }

      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1
      }
    }

    .fruit-question.answer-fruit.miss-flash {
      animation: fruitShake .42s ease;
    }

    @keyframes fruitShake {

      0%,
      100% {
        transform: translateX(0)
      }

      20% {
        transform: translateX(-6px)
      }

      40% {
        transform: translateX(6px)
      }

      60% {
        transform: translateX(-4px)
      }

      80% {
        transform: translateX(4px)
      }
    }

    /* =========================================================
   OPTIONS — 3 APPLES, NO BOXES
   ========================================================= */
    .archery-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .options-row {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(25px, 7vw, 90px);
      margin-top: clamp(4px, 1vh, 14px);
    }

    .fruit-option {
      position: relative;
      width: clamp(150px, 16vw, 230px);
      height: clamp(170px, 19vw, 250px);

      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        transform .2s ease,
        filter .2s ease,
        opacity .25s ease;

      animation: fruitFloat 2.8s ease-in-out infinite;
    }

    .fruit-option:nth-child(1) {
      animation-delay: 0s
    }

    .fruit-option:nth-child(2) {
      animation-delay: .35s
    }

    .fruit-option:nth-child(3) {
      animation-delay: .7s
    }

    .fruit-option img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      transition: transform .2s ease, filter .2s ease;
    }

    .fruit-option .fruit-number {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;

      font-size: clamp(28px, 3.2vw, 42px);
      font-weight: 400;
      line-height: 1;
      color: #fff !important;

      text-shadow:
        0 2px 0 rgba(255, 255, 255, .6),
        0 2px 6px rgba(0, 0, 0, .12);

      pointer-events: none;
    }

    .fruit-option:hover:not(:disabled) {
      transform: translateY(-9px) scale(1.05);
    }

    .fruit-option:hover:not(:disabled) img {
      transform: scale(1.035);
    }

    .fruit-option:hover:not(:disabled) .fruit-number {
      transform: translate(-50%, -50%) scale(1.08);
      color: #6d4ca3;
    }

    .fruit-option:active:not(:disabled) {
      transform: translateY(2px) scale(.97);
    }

    @keyframes fruitFloat {

      0%,
      100% {
        transform: translateY(0) rotate(-1deg)
      }

      50% {
        transform: translateY(-9px) rotate(1deg)
      }
    }

    /* Correct option: lock + highlight */
    .fruit-option.correct-hit {
      animation: correctFruit .65s ease forwards;
      pointer-events: none;
      z-index: 5;
    }

    .fruit-option.correct-hit::after {
      content: "✓";
      position: absolute;
      right: 5%;
      top: 5%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #55c878;
      color: #fff;
      font-size: 23px;
      font-weight: 800;
      box-shadow: 0 3px 8px rgba(50, 130, 80, .28);
      z-index: 6;
      animation: checkPop .35s ease;
    }

    @keyframes correctFruit {
      0% {
        transform: scale(1)
      }

      45% {
        transform: scale(1.12) translateY(-8px)
      }

      100% {
        transform: scale(1.06) translateY(-5px)
      }
    }

    @keyframes checkPop {
      0% {
        transform: scale(0)
      }

      75% {
        transform: scale(1.15)
      }

      100% {
        transform: scale(1)
      }
    }

    /* =========================================================
   WRONG ANSWER — APPLE SLICES
   Uses the SAME apple.png image twice as clipped slices.
   ========================================================= */
    .fruit-option.slicing {
      animation: none;
      pointer-events: none;
    }

    .fruit-option.slicing>img {
      opacity: 0;
    }

    .fruit-option.slicing .fruit-number {
      opacity: 0;
    }

    .fruit-option.slicing::before,
    .fruit-option.slicing::after {
      content: "";
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background-image: url('../assets/images/apple.png');
      background-repeat: no-repeat;
      background-size: 200% 100%;
      background-position: center;
      background-color: transparent;
      z-index: 3;
      pointer-events: none;
    }

    .fruit-option.slicing::before {
      left: 0;
      clip-path: polygon(0 0, 100% 0, 94% 18%, 100% 35%,
          91% 51%, 100% 68%, 92% 84%, 100% 100%, 0 100%);
      animation: sliceLeft .5s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    .fruit-option.slicing::after {
      right: 0;
      background-position: right center;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%,
          8% 84%, 0 68%, 9% 51%, 0 35%, 6% 18%);
      animation: sliceRight .5s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    @keyframes sliceLeft {
      0% {
        transform: translateX(0) rotate(0);
        opacity: 1
      }

      100% {
        transform: translateX(-42px) rotate(-12deg);
        opacity: 0
      }
    }

    @keyframes sliceRight {
      0% {
        transform: translateX(0) rotate(0);
        opacity: 1
      }

      100% {
        transform: translateX(42px) rotate(12deg);
        opacity: 0
      }
    }

    .fruit-option.faded {
      opacity: 0;
      pointer-events: none;
    }

    /* Keep flying-arrow HTML because existing functionality uses it. */
    .flying-arrow {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transform: translate(0, 0) rotate(0deg);
    }

    .flying-arrow.active {
      opacity: 1;
      transition: transform .32s cubic-bezier(.35, .9, .4, 1);
    }

    .flying-arrow img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      transform: translate(-50%, -50%);
    }

    .flying-arrow .flying-number {
      position: absolute;
      transform: translate(-50%, -140%);
      font-size: 16px;
      font-weight: 700;
      color: #302b3b;
      background: #fff;
      border-radius: 8px;
      padding: 1px 6px;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .15);
    }

    /* =========================================================
   NAV — unchanged
   ========================================================= */
    /* =========================================================
   NAV  (unchanged)
   ========================================================= */

    .nav {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      position: relative;
      top: 13px;
      flex: 0 0 auto;
      gap: 420px;
    }

    .nav button {
  position: relative;
  min-width: 132px;
  height: 50px;
  padding: 0 22px;

  border: 4px solid #ffffff;
  border-radius: 18px;

  font-family: 'Livvic', sans-serif;
  font-size: 18px;
  font-weight: 700;

  color: #ffffff;
  cursor: pointer;

  box-shadow:
    0 6px 0 rgba(0, 0, 0, 0.18),
    0 9px 14px rgba(0, 0, 0, 0.15);

  transition: all 0.15s ease;
}

.nav button {
  padding: 10px 25px;
  border: none;
  border-radius: 15px;
  font-size: clamp(17px, 1.5vw, 20px);
  cursor: pointer;
  color: #fff;
  font-weight: 500;
  transition: 0.15s;
}

.prev {
  background: linear-gradient(180deg, #ff8fb3 0%, #f0447c 100%);
}

/* NEXT BUTTON */
.next {
  background: linear-gradient(180deg, #55d9f5 0%, #009dcc 100%);
}

/* Hover */
.nav button:not(:disabled):hover {
  transform: translateY(-3px);
  box-shadow:
    0 9px 0 rgba(0, 0, 0, 0.18),
    0 13px 18px rgba(0, 0, 0, 0.16);
}

/* Click */
.nav button:not(:disabled):active {
  transform: translateY(4px);
  box-shadow:
    0 2px 0 rgba(0, 0, 0, 0.18),
    0 4px 8px rgba(0, 0, 0, 0.12);
}

/* Disabled */
.nav button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow:
    0 4px 0 rgba(0, 0, 0, 0.12);
}

/* Arrow */
.prev,
.next {
  letter-spacing: 0.3px;
}



    /* =========================================================
   RESPONSIVE — fruit layout only
   ========================================================= */
    @media (min-width:1024px) and (max-width:1365px) {
      .quiz-card {
        padding: 22px 35px;
      }

      .heading {
        font-size: 27px
      }

      .content-row {
        max-width: 900px;
        gap: 12px;
        padding-top: 10px;
      }

      .question-heading {

      }

      }

      .question-visual {
        max-width: 900px;
        gap: 20px;

      }

      .fruit-question {

      }

      .fruit-question .fruit-number {
        top: 48%;
        font-size: clamp(34px, 4vw, 50px);
      }

      .options-row {
        gap: clamp(18px, 4vw, 45px);

      }

      .fruit-option {
        width: clamp(125px, 15vw, 165px);
        height: clamp(145px, 18vw, 190px);
      }

      .fruit-option .fruit-number {
        font-size: clamp(23px, 2.8vw, 30px);
      }

      .nav {
        margin-top: 8px;

      }

      .nav button {

      }
    }

    @media (min-width:1366px) {
      .quiz-card {
        padding: 28px 50px;
      }

      .heading {

      }

      .content-row {
        max-width: 1120px;
        gap: 16px;
        padding-top: 12px;
      }

      .qlabel {
        left: 0;
        top: 0;
        font-size: 42px;
      }

      .question-visual {
        max-width: 1050px;
        gap: 40px;
        margin-top: -14px;

      }

      .fruit-question {

      }

      .fruit-question .fruit-number {

      }

      }

      }

      }

      }
    }

    @media (min-width:1600px) {
      .quiz-card {
        padding: 30px 70px 5px;
      }

      .heading {

        margin-top: -18px
      }

      .content-row {
        max-width: 1280px;
        gap: 18px;
        padding-top: 16px;
      }

      .qlabel {
        left: 0;
        top: 0;
        font-size: 48px;
      }

      .question-visual {
        max-width: 1180px;
        gap: 55px;
      }

      .fruit-question {
        width: 330px;

      }

      .fruit-question .fruit-number {
        font-size: 64px;
      }

      .options-row {
        gap: 90px;
        margin-top: 4px;
      }

      }

      }
    }

    /* Mobile: one question per screen, centered fruit group, 3 options in one row */
    @media (max-width:768px) {

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .quiz-card {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        padding: 14px 12px 10px;
        overflow: hidden;

      }

      .heading {
        width: 100%;
        text-align: center;
        font-size: 19px;

      }

        width: 100%;
        max-width: 430px;
        flex: 1;

      }

      }

      }

      .fruit-question {

      }

      }

    @media (max-width:480px) {

        padding: 10px 8px;
      }

      }

      .content-row {

        gap: 7px;
        padding: 4px 0;
      }

        font-size: 21px;
      }

      .question-visual {
        max-width: 315px;
        gap: 2px;
        margin: 26px 0 0;
      }

        width: clamp(82px, 29vw, 100px);
        height: clamp(96px, 34vw, 120px);
      }

      }

        gap: 2px;
        margin-top: 2px;
      }

      }
    }

    /* =========================================================
   INDIVIDUAL NUMBER POSITIONS (fully separate, one rule per fruit)
   Every fruit PNG has its own shape/weight, so each number below
   has its own independent top/left — edit any one of these
   without touching the others. All 6 positions you can see on
   screen (guava, middle apple, orange, option 1, option 2,
   option 3) are listed separately here.
   ========================================================= */

    /* 2) MIDDLE APPLE — revealed answer number */
    #targetNumber {
      top: 55%;
      left: 50%;
    }

    /* 3) ORANGE — right "context" fruit number */
    #contextNumber {
      top: 52%;
      left: 50%;
    }

    /* 4) OPTION 1 — first apple in the options row */
    .options-row .fruit-option:nth-child(1) .fruit-number {
      top: 56%;
      left: 50%;
    }

    /* 5) OPTION 2 — second apple in the options row */
    .options-row .fruit-option:nth-child(2) .fruit-number {
      top: 56%;
      left: 50%;
    }

    /* 6) OPTION 3 — third apple in the options row */
    .options-row .fruit-option:nth-child(3) .fruit-number {
      top: 56%;
      left: 50%;
    }

    /* =========================================================
       GUAVA NUMBER — STANDALONE / SEPARATE STYLE
       This is its own isolated block, kept apart from every
       other number's styling on purpose. Edit ONLY the two
       values below (top / left) to move just the guava's
       number — nothing else in the file is affected by this.
       ========================================================= */
    #givenNumber {
      top: 55%;
      left: 42%;
    }
  /* =========================================================
   LARGE MONITORS
   On a tall screen everything piled up against the top of the
   window with a large empty band underneath. Centre the card
   contents instead. Laptops are shorter than this and are
   left exactly as they were.
   ========================================================= */
@media (min-height:800px){

  .quiz-card{
    justify-content:center;
  }

  /* the row grows to fill the card, so its contents also have to be
     centred or they stay pinned to the top of that space */
  .content-row{
    justify-content:center;
    padding-top:0;
  }
}

</style>

<body>

  <div class="quiz-card" id="quizCard">

    <div class="topbar">
      <button class="icon-flat" style="display: none;" id="homeBtn" title="Home" aria-label="Home">🏠</button>

      <p class="heading" id="heading">
        Write the number that comes between the given numbers.
      </p>

      <button class="icon-flat" id="hintBtn" title="Hint" aria-label="Hint">💡</button>
    </div>

    <div class="content-row">

      <!-- QUESTION HEADER -->
      <div class="question-heading">
        <span class="qlabel" id="qLabel">Q1.</span>
      </div>

      <!-- QUESTION VISUAL: guava + blank apple + orange -->
      <!-- QUESTION VISUAL: LEFT NUMBER + BLANK APPLE + RIGHT NUMBER -->
      <div class="question-visual">

        <!-- LEFT FRUIT -->
        <div class="fruit-question given-fruit" id="givenFruit">
          <img src="../assets/images/guava.png" alt="">
          <span class="fruit-number" id="givenNumber">9</span>
        </div>

        <!-- MIDDLE ANSWER FRUIT -->
        <div class="fruit-question answer-fruit" id="targetCircle">
          <img src="../assets/images/apple.png" alt="">
          <span class="fruit-number" id="targetNumber"></span>
        </div>

        <!-- RIGHT FRUIT -->
        <div class="fruit-question context-fruit" id="contextFruit">
          <img src="../assets/images/orange.png" alt="">
          <span class="fruit-number" id="contextNumber">11</span>
        </div>

      </div>

      <!-- OPTIONS: three apple images -->
      <div class="archery-area">
        <div class="options-row" id="optionsRow">
          <!-- injected by JS -->
        </div>
      </div>

    </div>

    <div class="nav">
      <button class="prev" id="prevBtn" disabled>← Prev</button>
      <button class="next" id="nextBtn" disabled>Next →</button>
    </div>

    <!-- FLYING ARROW -->
    <div class="flying-arrow" id="flyingArrow" aria-hidden="true" style="display:none;">
      <img src="/assets/images/arrow.png" alt="">
      <span class="flying-number" id="flyingNumber"></span>
    </div>

  </div>

  <div class="hint-overlay" id="hintOverlay" aria-live="polite">
    <div class="hint-box">
      <h3>Hint</h3>
      <p id="hintText">Look at the number in the balloon and choose the number that comes just after it.</p>
      <button class="popup-btn" id="closeHintBtn">Got it!</button>
    </div>
  </div>

  <!-- =========================================================
     POPUPS  (unchanged)
     ========================================================= -->

  <div id="answerPopup" class="popup">
    <div class="popup-content">
      <div class="popup-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <div id="finalPopup">
    <div class="finalpopup-box">
      <h2 class="final-heading">🎉 Amazing Job!</h2>
      <p id="finalScore"></p>
      <div id="stars">⭐⭐⭐</div>
      <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
    </div>
  </div>

  <!-- SOUNDS -->
  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>


  <script>

    /* =========================================================
       QUESTION DATA
       Source data: second reference image.
       "Before" means the answer is one less than the given number.
       ========================================================= */

    const QUESTIONS = [
      {
        left: 9,
        right: 11,
        answer: 10,
        options: [10, 8, 12]
      },
      {
        left: 67,
        right: 69,
        answer: 68,
        options: [67, 68, 70]
      },
      {
        left: 81,
        right: 83,
        answer: 82,
        options: [80, 82, 84]
      },
      {
        left: 49,
        right: 51,
        answer: 50,
        options: [48, 50, 52]
      },
      {
        left: 36,
        right: 38,
        answer: 37,
        options: [37, 35, 39]
      },
      {
        left: 90,
        right: 92,
        answer: 91,
        options: [89, 91, 93]
      }
    ];

    const LABELS = ["Q1.", "Q2.", "Q3.", "Q4.", "Q5.", "Q6."];

    /* =========================================================
       STATE
       ========================================================= */

    const total = QUESTIONS.length;
    let current = 0;
    let shooting = false;

    const state = QUESTIONS.map(() => ({
      answered: false,
      wrongPicks: []
    }));


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const quizCard = document.getElementById("quizCard");
    const qLabel = document.getElementById("qLabel");
    const targetCircle = document.getElementById("targetCircle");
    const targetNumber = document.getElementById("targetNumber");
    const givenNumber = document.getElementById("givenNumber");
    const optionsRow = document.getElementById("optionsRow");
    const flyingArrow = document.getElementById("flyingArrow");
    const flyingNumber = document.getElementById("flyingNumber");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const contextNumber = document.getElementById("contextNumber");

    const correctSound = document.getElementById("correctSound");
    const wrongSound = document.getElementById("wrongSound");
    const homeBtn = document.getElementById("homeBtn");
    const hintBtn = document.getElementById("hintBtn");
    const hintOverlay = document.getElementById("hintOverlay");
    const closeHintBtn = document.getElementById("closeHintBtn");
    const hintText = document.getElementById("hintText");

    /* =========================================================
       RENDER QUESTION
       ========================================================= */
    function renderQuestion() {

      const q = QUESTIONS[current];
      const st = state[current];

      qLabel.textContent = LABELS[current] || `Q${current + 1}.`;

      // Show both numbers
      givenNumber.textContent = q.left;
      contextNumber.textContent = q.right;

      targetCircle.classList.remove("revealed", "miss-flash");

      targetNumber.textContent =
        st.answered ? q.answer : "";

      if (st.answered) {
        targetCircle.classList.add("revealed");
      }

      optionsRow.innerHTML = "";

      q.options.forEach((value) => {

        const btn = document.createElement("button");

        btn.className = "fruit-option";
        btn.type = "button";
        btn.dataset.value = String(value);

        const img = document.createElement("img");
        img.src = "../assets/images/apple.png";
        img.alt = "";

        btn.appendChild(img);

        const label = document.createElement("span");
        label.className = "fruit-number";
        label.textContent = value;

        btn.appendChild(label);

        if (st.answered) {

          btn.disabled = true;

          if (value === q.answer) {
            btn.classList.add("correct-hit");
          } else {
            btn.classList.add("faded");
          }

        } else if (st.wrongPicks.includes(value)) {

          btn.disabled = true;
          btn.classList.add("faded");

        } else {

          btn.addEventListener(
            "click",
            () => handleFruitPick(btn, value)
          );
        }

        optionsRow.appendChild(btn);
      });

      prevBtn.disabled = current === 0;
      nextBtn.disabled =
        !st.answered || current === total - 1;
    }

    /* =========================================================
       EXISTING ARROW HELPERS KEPT
       ========================================================= */

    function localCenter(el) {
      const stageRect = quizCard.getBoundingClientRect();
      const scale = stageRect.width / quizCard.offsetWidth || 1;
      const rect = el.getBoundingClientRect();

      return {
        x: (rect.left - stageRect.left + rect.width / 2) / scale,
        y: (rect.top - stageRect.top + rect.height / 2) / scale
      };
    }

    function fireArrowAt(optionEl, targetEl, value, onDone) {

      const from = localCenter(optionEl);
      const to = localCenter(targetEl);

      const angle =
        Math.atan2(to.y - from.y, to.x - from.x) *
        (180 / Math.PI) + 90;

      flyingNumber.textContent = value;

      flyingArrow.style.transition = "none";
      flyingArrow.style.transform =
        `translate(${from.x}px, ${from.y}px) rotate(${angle}deg)`;

      flyingArrow.classList.add("active");

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {

          flyingArrow.style.transition =
            "transform .32s cubic-bezier(.35,.9,.4,1)";

          flyingArrow.style.transform =
            `translate(${to.x}px, ${to.y}px) rotate(${angle}deg)`;
        });
      });

      setTimeout(() => {
        flyingArrow.classList.remove("active");
        onDone();
      }, 340);
    }

    /* =========================================================
       FRUIT PICK
       ========================================================= */

    function handleFruitPick(optionEl, value) {

      const st = state[current];

      if (st.answered || shooting) return;

      const q = QUESTIONS[current];

      shooting = true;

      /* Prevent double taps while popup/result is shown */
      optionsRow.querySelectorAll(".fruit-option").forEach((b) => {
        b.disabled = true;
      });

      if (value === q.answer) {

        st.answered = true;

        /* Lock + highlight correct apple */
        optionEl.classList.add("correct-hit");

        targetNumber.textContent = q.answer;
        targetCircle.classList.add("revealed");

        optionsRow.querySelectorAll(".fruit-option").forEach((b) => {

          if (b !== optionEl) {
            b.disabled = true;
            b.classList.add("faded");
          }

        });

        correctSound.currentTime = 0;
        correctSound.play().catch(() => { });

        speak("correct");
        showPopup(true);
        fireConfetti();

        nextBtn.disabled = current === total - 1;

        shooting = false;

        if (current === total - 1) {

          setTimeout(() => {
            fireBigConfetti();
            showFinal();
          }, 1100);

        }

      } else {

        st.wrongPicks.push(value);

        wrongSound.currentTime = 0;
        wrongSound.play().catch(() => { });

        targetCircle.classList.add("miss-flash");

        speak("wrong");
        showPopup(false);

        /* Wrong apple gets sliced instead of simply disappearing */
        optionEl.classList.add("slicing");

        setTimeout(() => {

          targetCircle.classList.remove("miss-flash");

          optionEl.disabled = true;

          optionsRow.querySelectorAll(".fruit-option").forEach((b) => {

            if (
              !st.wrongPicks.includes(Number(b.dataset.value)) &&
              !st.answered
            ) {
              b.disabled = false;
            }

          });

          shooting = false;

        }, 520);
      }
    }

    /* =========================================================
       POPUP — unchanged
       ========================================================= */

    function showPopup(isCorrect) {

      const popup = document.getElementById("answerPopup");
      const icon = document.getElementById("popupIcon");
      const title = document.getElementById("popupTitle");
      const msg = document.getElementById("popupMsg");

      popup.className = "popup " + (isCorrect ? "correct" : "wrong");
      popup.style.display = "flex";

      if (isCorrect) {
        icon.textContent = "🎉";
        title.textContent = "Correct!";
        msg.textContent = "Great job!";
      } else {
        icon.textContent = "❌";
        title.textContent = "Try Again!";
        msg.textContent = "That's not quite right.";
      }

      clearTimeout(showPopup._t);

      showPopup._t = setTimeout(() => {
        popup.style.display = "none";
      }, 1100);
    }

    /* =========================================================
       FINAL — unchanged
       ========================================================= */

    function showFinal() {

      const finalPopup = document.getElementById("finalPopup");

      finalPopup.style.display = "flex";

      document.getElementById("finalScore").textContent =
        `${total} / ${total} Completed`;

      document.getElementById("stars").textContent = "⭐⭐⭐";
    }

    /* =========================================================
       CONFETTI — unchanged
       ========================================================= */

    function fireConfetti() {

      if (!window.confetti) return;

      confetti({
        particleCount: 24,
        spread: 55,
        startVelocity: 26,
        origin: { x: .5, y: .4 },
        colors: ["#e6473f", "#3a6fd8", "#f7b733", "#8bba8a", "#c9a8e0"]
      });
    }

    function fireBigConfetti() {

      if (!window.confetti) return;

      const end = Date.now() + 1800;

      (function frame() {

        confetti({
          particleCount: 6,
          angle: 60,
          spread: 55,
          origin: { x: 0 }
        });

        confetti({
          particleCount: 6,
          angle: 120,
          spread: 55,
          origin: { x: 1 }
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }

      })();
    }

    /* ===== SPEAK ===== */

    function speak(t) {

      speechSynthesis.cancel();

      const msg = new SpeechSynthesisUtterance(t);

      msg.lang = "en-UK";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;

      speechSynthesis.speak(msg);
    }

    /* =========================================================
       NAV — unchanged
       ========================================================= */

    prevBtn.addEventListener("click", () => {

      if (current === 0) return;

      current--;

      renderQuestion();
    });

    nextBtn.addEventListener("click", () => {

      if (nextBtn.disabled) return;

      if (current < total - 1) {

        current++;

        renderQuestion();
      }
    });

    homeBtn.addEventListener("click", () => {
      window.location.href = "../Grade2_chapter1.html";
    });

    hintBtn.addEventListener("click", () => {

      hintText.textContent =
        `Look at ${QUESTIONS[current].left} and ${QUESTIONS[current].right}. The answer is the number between them.`;

      hintOverlay.classList.add("show");
    });

    closeHintBtn.addEventListener("click", () => {
      hintOverlay.classList.remove("show");
    });

    hintOverlay.addEventListener("click", (event) => {

      if (event.target === hintOverlay) {
        hintOverlay.classList.remove("show");
      }

    });

    /* =========================================================
       INITIALIZE
       ========================================================= */

    renderQuestion();

  </script>

</body>

</html>
