<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Between → Clouds &amp; Balloons</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="../assets/css/reuse.css">

<style>
/* =========================================================
   RESET
   ========================================================= */
*{
  box-sizing:border-box;
  font-family:"Livvic",sans-serif;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#F8F4FF;
  touch-action:none;
  overscroll-behavior:none;
  user-select:none;
  -webkit-user-select:none;
  cursor:default;
}

button{ cursor:pointer; }
button:disabled{ cursor:default; }

/* =========================================================
   SIZES — everything scales from these values.
   They follow screen width AND height, so the game fills a
   big monitor and shrinks on laptops/phones with no scroll.
   --cloud : cloud width
   --star  : star width/height
   --o     : balloon width
   ========================================================= */
:root{
  --cloud: min(30vh, 24vw);
  --star:  min(28vh, 20vw);
  --o:     min(17vh, 13vw);
  --num:   #1d2a6b;
}

/* =========================================================
   PAGE LAYOUT
   ========================================================= */
.quiz-card{
  width:100%;
  height:100vh;
  height:100dvh;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:clamp(10px,2.5vh,34px) clamp(12px,4vw,70px) clamp(8px,2vh,24px);
  overflow:hidden;
}

.heading{
  margin:0;
  width:100%;
  text-align:center;
  font-size:clamp(17px,2.3vw,44px);
  line-height:1.25;
  color:#2f2f2f;
}

.content-row{
  width:100%;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-evenly;
}

.qlabel{ display:none; }

.art{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  pointer-events:none;
}

/* =========================================================
   QUESTION VISUAL — cloud · star · cloud
   ========================================================= */
.question-visual{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:calc(var(--star) * .28);
  flex:0 0 auto;
}

.cloud{
  position:relative;
  width:var(--cloud);
  aspect-ratio:200/130;
  flex:0 0 auto;
  animation:cloudDrift 5s ease-in-out infinite;
}
.cloud.right-cloud{ animation-delay:-2.5s; }

@keyframes cloudDrift{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(calc(var(--cloud) * -.025)); }
}

.cloud .cloud-number{
  position:absolute;
  left:0;
  right:0;
  top:30%;
  height:55%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:calc(var(--cloud) * .2);
  font-weight:800;
  color:var(--num);
  line-height:1;
}

.star{
  position:relative;
  width:var(--star);
  aspect-ratio:1;
  flex:0 0 auto;
}

/* "?" — replaced by the answer when correct */
.star .star-mark{
  position:absolute;
  left:0;
  right:0;
  top:56%;
  height:30%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:calc(var(--star) * .24);
  font-weight:800;
  color:#f7851e;
  line-height:1;
  text-shadow:0 2px 0 rgba(255,255,255,.7);
}

/* ---------- middle slot: star → cloud on correct answer ----------
   The slot is always as wide as a cloud, so nothing around it
   moves when the star turns into a cloud. */
.middle-slot{
  position:relative;
  width:var(--cloud);
  height:max(var(--star), calc(var(--cloud) * .65));
  flex:0 0 auto;
}

.middle-slot .star,
.middle-slot .answer-cloud{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

/* answer cloud is hidden until the right balloon is picked */
.middle-slot .answer-cloud{
  opacity:0;
  visibility:hidden;
  animation:none;
}

.middle-slot.revealed .star{
  animation:starOut .35s ease forwards;
}

.middle-slot.revealed .answer-cloud{
  visibility:visible;
  animation:cloudIn .55s .25s cubic-bezier(.2,.9,.25,1.25) forwards;
}

.answer-cloud .cloud-number{ color:#1f7a3f; }

/* when a solved question is opened again (Prev/Next), skip the animation */
.middle-slot.revealed.no-anim .star{ animation:none; opacity:0; visibility:hidden; }
.middle-slot.revealed.no-anim .answer-cloud{ animation:none; opacity:1; }

@keyframes starOut{
  0%{ transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1; }
  40%{ transform:translate(-50%,-50%) scale(1.12) rotate(-10deg); opacity:1; }
  100%{ transform:translate(-50%,-50%) scale(0) rotate(40deg); opacity:0; visibility:hidden; }
}

@keyframes cloudIn{
  0%{ transform:translate(-50%,-50%) scale(.3); opacity:0; }
  70%{ transform:translate(-50%,-50%) scale(1.1); opacity:1; }
  100%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
}

.middle-slot.miss-flash{ animation:starShake .42s ease; }

@keyframes starShake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-7px); }
  40%{ transform:translateX(7px); }
  60%{ transform:translateX(-4px); }
  80%{ transform:translateX(4px); }
}

/* =========================================================
   OPTIONS — hot-air balloons
   ========================================================= */
.options-row{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:calc(var(--o) * .75);
  flex:0 0 auto;
}

.balloon{
  position:relative;
  width:var(--o);
  aspect-ratio:120/170;
  padding:0;
  margin:0;
  border:0;
  background:transparent;
  flex:0 0 auto;
  animation:balloonFloat 3s ease-in-out infinite;
  transition:filter .2s ease;
}
.balloon:nth-child(2){ animation-delay:.4s; }
.balloon:nth-child(3){ animation-delay:.8s; }

.balloon.pink { --b-dark:#f06292; --b-light:#fcc8da; }
.balloon.blue { --b-dark:#3f8ee8; --b-light:#bcdcff; }
.balloon.green{ --b-dark:#3fbf6f; --b-light:#c2f0d3; }

.balloon:hover:not(:disabled){ filter:brightness(1.06) drop-shadow(0 6px 10px rgba(40,60,120,.18)); }

/* number in the white circle */
.balloon .balloon-number{
  position:absolute;
  left:0;
  right:0;
  top:24.7%;
  height:28.2%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:calc(var(--o) * .26);
  font-weight:800;
  color:var(--num);
  line-height:1;
}

@keyframes balloonFloat{
  0%,100%{ transform:translateY(0) rotate(-1.5deg); }
  50%{ transform:translateY(calc(var(--o) * -.07)) rotate(1.5deg); }
}

/* correct pick: rises a little, green tick */
.balloon.correct-hit{
  animation:correctRise .7s ease forwards;
  pointer-events:none;
  z-index:5;
}
.balloon.correct-hit .balloon-number{ color:#208344; }

.balloon.correct-hit::after{
  content:"✓";
  position:absolute;
  right:-4%;
  top:4%;
  width:calc(var(--o) * .26);
  height:calc(var(--o) * .26);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#55c878;
  color:#fff;
  font-size:calc(var(--o) * .16);
  font-weight:800;
  box-shadow:0 3px 8px rgba(50,130,80,.28);
  animation:checkPop .35s ease;
}

@keyframes correctRise{
  0%{ transform:translateY(0) scale(1); }
  50%{ transform:translateY(calc(var(--o) * -.14)) scale(1.1); }
  100%{ transform:translateY(calc(var(--o) * -.08)) scale(1.05); }
}

@keyframes checkPop{
  0%{ transform:scale(0); }
  75%{ transform:scale(1.15); }
  100%{ transform:scale(1); }
}

/* wrong pick: shakes, then floats away (space is kept) */
.balloon.fly-away{
  pointer-events:none;
  animation:flyAway .9s ease-in forwards;
}

@keyframes flyAway{
  0%{ transform:translateX(0); opacity:1; }
  15%{ transform:translateX(-6px); }
  30%{ transform:translateX(6px); }
  45%{ transform:translateX(0) translateY(0); opacity:1; }
  100%{ transform:translateY(-60vh) rotate(8deg); opacity:0; }
}

.balloon.faded{
  opacity:0;
  pointer-events:none;
  animation:none;
}

/* =========================================================
   NAV
   ========================================================= */
.nav{
  width:100%;
  max-width:1400px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex:0 0 auto;
  padding:0 clamp(0px,4vw,120px);
}

.nav button{
  min-width:clamp(96px,9vw,180px);
  height:clamp(40px,5.5vh,62px);
  padding:0 clamp(12px,1.5vw,28px);
  border:none;
  border-radius:15px;
  font-size:clamp(14px,1.3vw,24px);
  font-weight:500;
  color:#fff;
  letter-spacing:.3px;
  box-shadow:0 6px 0 rgba(0,0,0,.18), 0 9px 14px rgba(0,0,0,.15);
  transition:all .15s ease;
}

.prev{ background:linear-gradient(180deg,#ff8fb3 0%,#f0447c 100%); }
.next{ background:linear-gradient(180deg,#55d9f5 0%,#009dcc 100%); }

.nav button:not(:disabled):hover{
  transform:translateY(-3px);
  box-shadow:0 9px 0 rgba(0,0,0,.18), 0 13px 18px rgba(0,0,0,.16);
}
.nav button:not(:disabled):active{
  transform:translateY(4px);
  box-shadow:0 2px 0 rgba(0,0,0,.18), 0 4px 8px rgba(0,0,0,.12);
}
.nav button:disabled{
  opacity:.45;
  box-shadow:0 4px 0 rgba(0,0,0,.12);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

/* Phones / tablets in portrait: width is the limit */
@media (max-width:820px) and (orientation:portrait){
  :root{
    --cloud: min(32vw, 20vh);
    --star:  min(25vw, 16vh);
    --o:     min(23vw, 14vh);
  }
  .question-visual{ gap:calc(var(--star) * .08); }
  .options-row{ gap:calc(var(--o) * .25); }
  .nav{ padding:0; justify-content:center; gap:14px; }
}

/* Phones turned sideways (short screens) */
@media (max-height:500px) and (orientation:landscape){
  :root{
    --cloud: min(30vh, 18vw);
    --star:  min(27vh, 15vw);
    --o:     min(16vh, 10vw);
  }
  .quiz-card{ padding:6px 12px; }
  .heading{ font-size:16px; }
}

/* Big monitors: a little more room for everything */
@media (min-width:1600px) and (min-height:850px){
  :root{
    --cloud: min(31vh, 23vw);
    --star:  min(29vh, 19vw);
    --o:     min(18vh, 12vw);
  }
}
</style>
</head>

<body>

<!-- ===================== SHARED ARTWORK ===================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="cloudBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f4ff"/>
      <stop offset="100%" stop-color="#94cdf6"/>
    </linearGradient>
    <linearGradient id="cloudPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e6ff"/>
      <stop offset="100%" stop-color="#cc9ff1"/>
    </linearGradient>
    <linearGradient id="cloudGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6fbec"/>
      <stop offset="100%" stop-color="#8fdcab"/>
    </linearGradient>
    <linearGradient id="starFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="100%" stop-color="#ffcf4a"/>
    </linearGradient>
    <clipPath id="envelopeClip">
      <path d="M60 4 C25 4 4 30 4 62 C4 92 30 112 46 126 L74 126 C90 112 116 92 116 62 C116 30 95 4 60 4 Z"/>
    </clipPath>

    <!-- Cloud shape (fill set per use) -->
    <symbol id="cloudShape" viewBox="0 0 200 130">
      <path d="M44 116 C16 116 4 96 14 78 C2 58 22 34 46 42 C52 18 84 8 104 26 C120 6 156 12 160 40 C184 36 200 58 190 78 C200 98 184 118 160 116 Z"
            style="fill:var(--cloud-fill);stroke:var(--cloud-edge);stroke-width:2"/>
      <path d="M40 58 C44 46 58 42 68 46" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".85"/>
      <ellipse cx="116" cy="34" rx="12" ry="5" fill="#ffffff" opacity=".7" transform="rotate(-18 116 34)"/>
    </symbol>

    <!-- Smiling star -->
    <symbol id="starShape" viewBox="0 0 200 200">
      <!-- sparkles -->
      <g stroke="#f5b82e" stroke-width="4" stroke-linecap="round">
        <line x1="42" y1="20" x2="52" y2="34"/>
        <line x1="24" y1="44" x2="38" y2="50"/>
        <line x1="158" y1="20" x2="148" y2="34"/>
        <line x1="176" y1="44" x2="162" y2="50"/>
      </g>
      <!-- star body (thick same-colour stroke rounds the points) -->
      <polygon points="100,16 128.2,69.2 187.5,79.6 145.7,122.8 154.1,182.4 100,156 45.9,182.4 54.3,122.8 12.5,79.6 71.8,69.2"
               fill="url(#starFill)" stroke="#ffd24d" stroke-width="16" stroke-linejoin="round"/>
      <!-- stitched edge -->
      <polygon points="100,16 128.2,69.2 187.5,79.6 145.7,122.8 154.1,182.4 100,156 45.9,182.4 54.3,122.8 12.5,79.6 71.8,69.2"
               fill="none" stroke="#e9a73a" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round"
               transform="translate(100 108) scale(.86) translate(-100 -108)"/>
      <!-- face -->
      <circle cx="84" cy="88" r="7" fill="#3b2a1a"/>
      <circle cx="116" cy="88" r="7" fill="#3b2a1a"/>
      <circle cx="86.5" cy="85.5" r="2.4" fill="#fff"/>
      <circle cx="118.5" cy="85.5" r="2.4" fill="#fff"/>
      <ellipse cx="72" cy="100" rx="8" ry="4.5" fill="#ff9fae" opacity=".8"/>
      <ellipse cx="128" cy="100" rx="8" ry="4.5" fill="#ff9fae" opacity=".8"/>
      <path d="M92 98 Q100 106 108 98" fill="none" stroke="#3b2a1a" stroke-width="3" stroke-linecap="round"/>
    </symbol>

    <!-- Hot-air balloon (colours come from --b-dark / --b-light) -->
    <symbol id="balloonShape" viewBox="0 0 120 170">
      <g clip-path="url(#envelopeClip)">
        <rect x="0" y="0" width="120" height="130" style="fill:var(--b-dark)"/>
        <ellipse cx="60" cy="62" rx="42" ry="64" style="fill:var(--b-light)"/>
        <ellipse cx="60" cy="62" rx="26" ry="64" style="fill:var(--b-dark)"/>
        <ellipse cx="60" cy="62" rx="10" ry="64" style="fill:var(--b-light)"/>
        <ellipse cx="34" cy="34" rx="10" ry="18" fill="#ffffff" opacity=".35" transform="rotate(20 34 34)"/>
      </g>
      <path d="M60 4 C25 4 4 30 4 62 C4 92 30 112 46 126 L74 126 C90 112 116 92 116 62 C116 30 95 4 60 4 Z"
            fill="none" stroke="rgba(0,0,0,.12)" stroke-width="1.5"/>
      <!-- white label -->
      <circle cx="60" cy="66" r="24" fill="#ffffff" stroke="rgba(0,0,0,.08)" stroke-width="1.5"/>
      <!-- band + ropes -->
      <rect x="45" y="123" width="30" height="6" rx="2" style="fill:var(--b-dark)"/>
      <g stroke="#8a5a2b" stroke-width="1.6">
        <line x1="48" y1="129" x2="50" y2="147"/>
        <line x1="72" y1="129" x2="70" y2="147"/>
        <line x1="60" y1="129" x2="60" y2="147"/>
      </g>
      <!-- basket -->
      <rect x="45" y="146" width="30" height="20" rx="3" fill="#c98a45" stroke="#8a5a2b" stroke-width="1.6"/>
      <rect x="43" y="144" width="34" height="5" rx="2" fill="#a86d31"/>
      <g stroke="#8a5a2b" stroke-width="1" opacity=".7">
        <line x1="52" y1="150" x2="52" y2="165"/>
        <line x1="60" y1="150" x2="60" y2="165"/>
        <line x1="68" y1="150" x2="68" y2="165"/>
        <line x1="46" y1="157" x2="74" y2="157"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="quiz-card" id="quizCard">

  <div class="topbar">
    <button class="icon-flat" style="display:none;" id="homeBtn" title="Home" aria-label="Home">🏠</button>

    <p class="heading" id="heading">
      Write the number that comes between the given numbers.
    </p>

    <button class="icon-flat" id="hintBtn" title="Hint" aria-label="Hint">💡</button>
  </div>

  <div class="content-row">

    <span class="qlabel" id="qLabel">Q1.</span>

    <!-- QUESTION: cloud · star (?) · cloud -->
    <div class="question-visual">

      <div class="cloud left-cloud" style="--cloud-fill:url(#cloudBlue);--cloud-edge:#a9d6f5;">
        <svg class="art" viewBox="0 0 200 130" aria-hidden="true"><use href="#cloudShape"/></svg>
        <span class="cloud-number" id="givenNumber">9</span>
      </div>

      <div class="middle-slot" id="targetCircle">

        <!-- shown before the answer -->
        <div class="star">
          <svg class="art" viewBox="0 0 200 200" aria-hidden="true"><use href="#starShape"/></svg>
          <span class="star-mark">?</span>
        </div>

        <!-- shown after the correct answer -->
        <div class="cloud answer-cloud" style="--cloud-fill:url(#cloudGreen);--cloud-edge:#9fe0b6;">
          <svg class="art" viewBox="0 0 200 130" aria-hidden="true"><use href="#cloudShape"/></svg>
          <span class="cloud-number" id="targetNumber"></span>
        </div>

      </div>

      <div class="cloud right-cloud" style="--cloud-fill:url(#cloudPurple);--cloud-edge:#dbb7f5;">
        <svg class="art" viewBox="0 0 200 130" aria-hidden="true"><use href="#cloudShape"/></svg>
        <span class="cloud-number" id="contextNumber">11</span>
      </div>

    </div>

    <!-- OPTIONS: hot-air balloons -->
    <div class="options-row" id="optionsRow">
      <!-- injected by JS -->
    </div>

  </div>

  <div class="nav">
    <button class="prev" id="prevBtn" disabled>← Prev</button>
    <button class="next" id="nextBtn" disabled>Next →</button>
  </div>

</div>

<div class="hint-overlay" id="hintOverlay" aria-live="polite">
  <div class="hint-box">
    <h3>Hint</h3>
    <p id="hintText">Look at the two numbers in the clouds and choose the number that comes between them.</p>
    <button class="popup-btn" id="closeHintBtn">Got it!</button>
  </div>
</div>

<!-- POPUPS -->
<div id="answerPopup" class="popup">
  <div class="popup-content">
    <div class="popup-icon" id="popupIcon"></div>
    <h3 id="popupTitle"></h3>
    <p id="popupMsg"></p>
  </div>
</div>

<div id="finalPopup">
  <div class="finalpopup-box">
    <h2 class="final-heading">🎉 Amazing Job!</h2>
    <p id="finalScore"></p>
    <div id="stars">⭐⭐⭐</div>
    <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
  </div>
</div>

<!-- SOUNDS -->
<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
/* =========================================================
   QUESTION DATA
   ========================================================= */
const QUESTIONS = [
  { left:9,  right:11, answer:10, options:[10,8,12] },
  { left:67, right:69, answer:68, options:[67,68,70] },
  { left:81, right:83, answer:82, options:[80,82,84] },
  { left:49, right:51, answer:50, options:[48,50,52] },
  { left:36, right:38, answer:37, options:[37,35,39] },
  { left:90, right:92, answer:91, options:[89,91,93] }
];

const BALLOON_COLORS = ["pink","blue","green"];

/* =========================================================
   STATE
   ========================================================= */
const total = QUESTIONS.length;
let current = 0;
let busy = false;
const state = QUESTIONS.map(() => ({ answered:false, wrongPicks:[] }));

/* =========================================================
   ELEMENTS
   ========================================================= */
const qLabel        = document.getElementById("qLabel");
const targetCircle  = document.getElementById("targetCircle");
const targetNumber  = document.getElementById("targetNumber");
const givenNumber   = document.getElementById("givenNumber");
const contextNumber = document.getElementById("contextNumber");
const optionsRow    = document.getElementById("optionsRow");
const prevBtn       = document.getElementById("prevBtn");
const nextBtn       = document.getElementById("nextBtn");
const correctSound  = document.getElementById("correctSound");
const wrongSound    = document.getElementById("wrongSound");
const homeBtn       = document.getElementById("homeBtn");
const hintBtn       = document.getElementById("hintBtn");
const hintOverlay   = document.getElementById("hintOverlay");
const closeHintBtn  = document.getElementById("closeHintBtn");
const hintText      = document.getElementById("hintText");

/* =========================================================
   RENDER
   ========================================================= */
function makeBalloon(value, index){
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "balloon " + BALLOON_COLORS[index % BALLOON_COLORS.length];
  btn.dataset.value = String(value);
  btn.setAttribute("aria-label", String(value));
  btn.innerHTML =
    '<svg class="art" viewBox="0 0 120 170" aria-hidden="true"><use href="#balloonShape"/></svg>' +
    '<span class="balloon-number">' + value + '</span>';
  return btn;
}

function renderQuestion(){
  const q  = QUESTIONS[current];
  const st = state[current];

  qLabel.textContent = `Q${current + 1}.`;
  givenNumber.textContent   = q.left;
  contextNumber.textContent = q.right;

  /* star with "?" until the right balloon is picked,
     then a cloud with the answer */
  targetCircle.classList.remove("revealed","miss-flash","no-anim");
  targetNumber.textContent = st.answered ? q.answer : "";
  if(st.answered) targetCircle.classList.add("revealed","no-anim");

  optionsRow.innerHTML = "";

  q.options.forEach((value, i) => {
    const btn = makeBalloon(value, i);

    if(st.answered){
      btn.disabled = true;
      btn.classList.add(value === q.answer ? "correct-hit" : "faded");
    }else if(st.wrongPicks.includes(value)){
      btn.disabled = true;
      btn.classList.add("faded");
    }else{
      btn.addEventListener("click", () => handlePick(btn, value));
    }

    optionsRow.appendChild(btn);
  });

  prevBtn.disabled = current === 0;
  nextBtn.disabled = !st.answered || current === total - 1;
}

/* =========================================================
   ANSWER
   ========================================================= */
function handlePick(optionEl, value){
  const st = state[current];
  if(st.answered || busy) return;

  const q = QUESTIONS[current];
  busy = true;

  optionsRow.querySelectorAll(".balloon").forEach(b => b.disabled = true);

  if(value === q.answer){
    st.answered = true;

    optionEl.classList.add("correct-hit");

    /* the star turns into a cloud showing the answer */
    targetNumber.textContent = q.answer;
    targetCircle.classList.remove("no-anim");
    targetCircle.classList.add("revealed");

    optionsRow.querySelectorAll(".balloon").forEach(b => {
      if(b !== optionEl) b.classList.add("fly-away");
    });

    correctSound.currentTime = 0;
    correctSound.play().catch(() => {});
    speak("correct");
    showPopup(true);
    fireConfetti();

    nextBtn.disabled = current === total - 1;
    busy = false;

    if(current === total - 1){
      setTimeout(() => { fireBigConfetti(); showFinal(); }, 1100);
    }

  }else{
    st.wrongPicks.push(value);

    wrongSound.currentTime = 0;
    wrongSound.play().catch(() => {});
    targetCircle.classList.add("miss-flash");
    speak("Try again");
    showPopup(false);

    /* wrong balloon shakes and floats away */
    optionEl.classList.add("fly-away");

    setTimeout(() => {
      targetCircle.classList.remove("miss-flash");

      optionsRow.querySelectorAll(".balloon").forEach(b => {
        if(!st.wrongPicks.includes(Number(b.dataset.value))) b.disabled = false;
      });

      busy = false;
    }, 600);
  }
}

/* =========================================================
   POPUPS
   ========================================================= */
function showPopup(isCorrect){
  const popup = document.getElementById("answerPopup");
  popup.className = "popup " + (isCorrect ? "correct" : "wrong");
  popup.style.display = "flex";

  document.getElementById("popupIcon").textContent  = isCorrect ? "🎉" : "❌";
  document.getElementById("popupTitle").textContent = isCorrect ? "Correct!" : "Try Again!";
  document.getElementById("popupMsg").textContent   = isCorrect ? "Great job!" : "That's not quite right.";

  clearTimeout(showPopup._t);
  showPopup._t = setTimeout(() => { popup.style.display = "none"; }, 1100);
}

function showFinal(){
  document.getElementById("finalPopup").style.display = "flex";
  document.getElementById("finalScore").textContent = `${total} / ${total} Completed`;
  document.getElementById("stars").textContent = "⭐⭐⭐";
}

/* =========================================================
   CONFETTI
   ========================================================= */
function fireConfetti(){
  if(!window.confetti) return;
  confetti({
    particleCount:24, spread:55, startVelocity:26,
    origin:{ x:.5, y:.35 },
    colors:["#e6473f","#3a6fd8","#f7b733","#8bba8a","#c9a8e0"]
  });
}

function fireBigConfetti(){
  if(!window.confetti) return;
  const end = Date.now() + 1800;
  (function frame(){
    confetti({ particleCount:6, angle:60,  spread:55, origin:{ x:0 } });
    confetti({ particleCount:6, angle:120, spread:55, origin:{ x:1 } });
    if(Date.now() < end) requestAnimationFrame(frame);
  })();
}

/* =========================================================
   SPEAK
   ========================================================= */
function speak(t){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-US";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

/* =========================================================
   NAV + HINT
   ========================================================= */
prevBtn.addEventListener("click", () => {
  if(current === 0) return;
  current--;
  renderQuestion();
});

nextBtn.addEventListener("click", () => {
  if(nextBtn.disabled) return;
  if(current < total - 1){
    current++;
    renderQuestion();
  }
});

homeBtn.addEventListener("click", () => {
  window.location.href = "../Grade2_chapter1.html";
});

hintBtn.addEventListener("click", () => {
  const q = QUESTIONS[current];
  hintText.textContent = `Look at ${q.left} and ${q.right}. The answer is the number between them.`;
  hintOverlay.classList.add("show");
});

closeHintBtn.addEventListener("click", () => hintOverlay.classList.remove("show"));

hintOverlay.addEventListener("click", e => {
  if(e.target === hintOverlay) hintOverlay.classList.remove("show");
});

/* =========================================================
   START
   ========================================================= */
renderQuestion();
</script>
