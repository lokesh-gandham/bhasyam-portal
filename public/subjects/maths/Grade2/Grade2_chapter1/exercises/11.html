<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose the Correct Symbol — Train</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="../assets/css/reuse.css">

<style>
/* =========================================================
   RESET
   ========================================================= */
*{
  box-sizing:border-box;
  font-family:"Livvic",sans-serif;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#F8F4FF;
  touch-action:none;
  overscroll-behavior:none;
  user-select:none;
  -webkit-user-select:none;
  cursor:default;
}

button{ cursor:pointer; }
button:disabled{ cursor:default; }

/* =========================================================
   SIZES — everything scales from these two values
   --w : width of one wagon
   --o : size of one symbol button
   They follow screen width AND height, so the game fills a
   big monitor and shrinks on laptops/phones with no scroll.
   ========================================================= */
:root{
  --w: min(34vh, 27vw);
  --o: min(16vh, 11vw);
  --num:#1d2a6b;
}

/* =========================================================
   PAGE LAYOUT
   ========================================================= */
.quiz-card{
  width:100%;
  height:100vh;
  height:100dvh;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:clamp(10px,2.5vh,34px) clamp(12px,4vw,70px) clamp(8px,2vh,24px);
  overflow:hidden;
}

.heading{
  margin:0;
  width:100%;
  text-align:center;
  font-size:clamp(17px,2.3vw,44px);
  line-height:1.25;
  color:#2f2f2f;
}

.content-row{
  width:100%;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-evenly;
}

.qlabel{ display:none; }

.art{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  pointer-events:none;
}

/* =========================================================
   QUESTION VISUAL — TRAIN
   ========================================================= */
.train{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  flex:0 0 auto;
  isolation:isolate;
}

/* railway track under the wheels */
.train::after{
  content:"";
  position:absolute;
  left:-6%;
  right:-6%;
  bottom:calc(var(--w) * -.03);
  height:calc(var(--w) * .07);
  z-index:-1;
  background:
    linear-gradient(#8d7b6a,#8d7b6a) 0 22% / 100% 12% no-repeat,
    linear-gradient(#8d7b6a,#8d7b6a) 0 78% / 100% 12% no-repeat,
    repeating-linear-gradient(90deg,
      #a8794b 0,
      #a8794b calc(var(--w) * .035),
      transparent calc(var(--w) * .035),
      transparent calc(var(--w) * .1));
  border-radius:3px;
}

.wagon{
  position:relative;
  width:var(--w);
  aspect-ratio:220/170;
  flex:0 0 auto;
  z-index:1;
}

/* hook between wagons, at axle height */
.coupler{
  width:calc(var(--w) * .07);
  height:calc(var(--w) * .035);
  margin-bottom:calc(var(--w) * .17);
  background:#3d3d3d;
  border-radius:3px;
  flex:0 0 auto;
  z-index:0;
}

/* number on the white label of the wagon */
.wagon .wagon-number{
  position:absolute;
  left:21.8%;
  width:56.4%;
  top:49.4%;
  height:28.2%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:calc(var(--w) * .17);
  font-weight:800;
  color:var(--num);
  line-height:1;
  z-index:2;
}

/* text answers like "6 tens 4 ones": smaller, two lines, fits the label */
.wagon .wagon-number.long-text{
  flex-direction:column;
  font-size:calc(var(--w) * .085);
  line-height:1.1;
  gap:calc(var(--w) * .006);
  text-align:center;
  white-space:nowrap;
}

/* middle wagon: "?" then the chosen symbol */
.mid-wagon .answer-mark{
  position:absolute;
  left:12%;
  width:76%;
  top:47%;
  height:33%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:calc(var(--w) * .24);
  font-weight:800;
  color:#e0457b;
  line-height:1;
  z-index:2;
}

.mid-wagon.revealed .answer-mark{
  color:var(--num);
  animation:answerPop .45s cubic-bezier(.2,.9,.25,1.25);
}

@keyframes answerPop{
  0%{ transform:scale(.4); opacity:0; }
  70%{ transform:scale(1.15); opacity:1; }
  100%{ transform:scale(1); opacity:1; }
}

.mid-wagon.miss-flash{ animation:wagonShake .42s ease; }

@keyframes wagonShake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-6px); }
  40%{ transform:translateX(6px); }
  60%{ transform:translateX(-4px); }
  80%{ transform:translateX(4px); }
}

/* correct answer: the whole train chugs */
.train.go .wagon,
.train.go .coupler{
  animation:chug .9s ease-in-out;
}

@keyframes chug{
  0%,100%{ transform:translate(0,0); }
  20%{ transform:translate(calc(var(--w) * .03), calc(var(--w) * -.015)); }
  40%{ transform:translate(calc(var(--w) * .05), 0); }
  60%{ transform:translate(calc(var(--w) * .03), calc(var(--w) * -.015)); }
  80%{ transform:translate(calc(var(--w) * .01), 0); }
}

/* =========================================================
   OPTIONS — glossy symbol buttons
   ========================================================= */
.options-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:calc(var(--o) * .45);
  flex:0 0 auto;
}

.sym-btn{
  position:relative;
  width:var(--o);
  height:calc(var(--o) * .86);
  padding:0;
  margin:0;
  border:calc(var(--o) * .035) solid rgba(255,255,255,.85);
  border-radius:calc(var(--o) * .2);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:calc(var(--o) * .5);
  font-weight:800;
  line-height:1;
  text-shadow:0 3px 0 rgba(0,0,0,.18);
  overflow:hidden;
  transition:transform .15s ease, box-shadow .15s ease, opacity .25s ease;
}

/* shine on the top half */
.sym-btn::before{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:5%;
  height:42%;
  border-radius:calc(var(--o) * .14) calc(var(--o) * .14) 50% 50% / calc(var(--o) * .14) calc(var(--o) * .14) 30% 30%;
  background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.08));
  pointer-events:none;
}

.sym-btn span{ position:relative; z-index:1; }

.sym-lt{
  background:linear-gradient(180deg,#4ddc7a 0%,#18a24a 100%);
  box-shadow:0 calc(var(--o) * .06) 0 #0f7a35, 0 calc(var(--o) * .1) calc(var(--o) * .14) rgba(0,0,0,.2);
}
.sym-gt{
  background:linear-gradient(180deg,#c07bf5 0%,#7d3bd8 100%);
  box-shadow:0 calc(var(--o) * .06) 0 #5b25a8, 0 calc(var(--o) * .1) calc(var(--o) * .14) rgba(0,0,0,.2);
}
.sym-eq{
  background:linear-gradient(180deg,#ffbd4a 0%,#f27a12 100%);
  box-shadow:0 calc(var(--o) * .06) 0 #c55a05, 0 calc(var(--o) * .1) calc(var(--o) * .14) rgba(0,0,0,.2);
}

.sym-btn:hover:not(:disabled){ transform:translateY(-4px); }
.sym-btn:active:not(:disabled){ transform:translateY(3px); }

/* correct pick */
.sym-btn.correct-hit{
  animation:correctPop .6s ease forwards;
  pointer-events:none;
  overflow:visible;
  z-index:5;
}

.sym-btn.correct-hit::after{
  content:"✓";
  position:absolute;
  right:-14%;
  top:-18%;
  width:calc(var(--o) * .3);
  height:calc(var(--o) * .3);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#55c878;
  border:2px solid #fff;
  color:#fff;
  font-size:calc(var(--o) * .18);
  text-shadow:none;
  box-shadow:0 3px 8px rgba(50,130,80,.28);
  animation:checkPop .35s ease;
}

@keyframes correctPop{
  0%{ transform:scale(1); }
  45%{ transform:scale(1.12) translateY(-6px); }
  100%{ transform:scale(1.06) translateY(-4px); }
}

@keyframes checkPop{
  0%{ transform:scale(0); }
  75%{ transform:scale(1.15); }
  100%{ transform:scale(1); }
}

/* wrong pick shakes */
.sym-btn.wrong-try{ animation:wagonShake .42s ease; }

.sym-btn.faded{
  opacity:.25;
  pointer-events:none;
}

/* =========================================================
   NAV
   ========================================================= */
.nav{
  width:100%;
  max-width:1400px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex:0 0 auto;
  padding:0 clamp(0px,4vw,120px);
}

.nav button{
  min-width:clamp(96px,9vw,180px);
  height:clamp(40px,5.5vh,62px);
  padding:0 clamp(12px,1.5vw,28px);
  border:none;
  border-radius:15px;
  font-size:clamp(14px,1.3vw,24px);
  font-weight:500;
  color:#fff;
  letter-spacing:.3px;
  box-shadow:0 6px 0 rgba(0,0,0,.18), 0 9px 14px rgba(0,0,0,.15);
  transition:all .15s ease;
}

.prev{ background:linear-gradient(180deg,#ff8fb3 0%,#f0447c 100%); }
.next{ background:linear-gradient(180deg,#55d9f5 0%,#009dcc 100%); }

.nav button:not(:disabled):hover{
  transform:translateY(-3px);
  box-shadow:0 9px 0 rgba(0,0,0,.18), 0 13px 18px rgba(0,0,0,.16);
}
.nav button:not(:disabled):active{
  transform:translateY(4px);
  box-shadow:0 2px 0 rgba(0,0,0,.18), 0 4px 8px rgba(0,0,0,.12);
}
.nav button:disabled{
  opacity:.45;
  box-shadow:0 4px 0 rgba(0,0,0,.12);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

/* Phones / tablets in portrait: width is the limit */
@media (max-width:820px) and (orientation:portrait){
  :root{
    --w: min(29vw, 22vh);
    --o: min(22vw, 12vh);
  }
  .nav{ padding:0; justify-content:center; gap:14px; }
}

/* Phones turned sideways (short screens) */
@media (max-height:500px) and (orientation:landscape){
  :root{
    --w: min(40vh, 24vw);
    --o: min(20vh, 10vw);
  }
  .quiz-card{ padding:6px 12px; }
  .heading{ font-size:16px; }
}

/* Big monitors: a little more room */
@media (min-width:1600px) and (min-height:850px){
  :root{
    --w: min(36vh, 27vw);
    --o: min(17vh, 10vw);
  }
}
</style>
</head>

<body>

<!-- ===================== SHARED ARTWORK ===================== -->

      <polygon points="190,95 193.5,103 202,103.5 195.5,109 197.5,117.5 190,113 182.5,117.5 184.5,109 178,103.5 186.5,103" fill="#ffd93b" stroke="#e9b21f" stroke-width="1"/>

<div class="quiz-card" id="quizCard">

  <div class="topbar">
    <button class="icon-flat" id="homeBtn" style="display:none;" title="Home" aria-label="Home">🏠</button>

    <p class="heading" id="heading">
      Choose the correct symbol.
    </p>

    <button class="icon-flat" id="hintBtn" title="Hint" aria-label="Hint">💡</button>
  </div>

  <div class="content-row">

    <span class="qlabel" id="qLabel">Q1.</span>

    <!-- QUESTION: red wagon · ? wagon · blue wagon -->
    <div class="train" id="train">

      <div class="wagon" id="givenFruit" style="--car:#ef3b3b;--car-dark:#c62828;">
        <svg class="art" viewBox="0 0 220 170" aria-hidden="true">
          <use href="#boy"/>
          <use href="#wagonSide"/>
        </svg>
        <span class="wagon-number" id="givenNumber">99</span>
      </div>

      <div class="coupler"></div>

      <div class="wagon mid-wagon" id="targetCircle">
        <svg class="art" viewBox="0 0 220 170" aria-hidden="true"><use href="#wagonMid"/></svg>
        <span class="answer-mark" id="answerMark">?</span>
      </div>

      <div class="coupler"></div>

      <div class="wagon" id="contextFruit" style="--car:#2f8fe8;--car-dark:#1c6cc0;">
        <svg class="art" viewBox="0 0 220 170" aria-hidden="true">
          <use href="#girl"/>
          <use href="#wagonSide"/>
        </svg>
        <span class="wagon-number" id="contextNumber">19</span>
      </div>

    </div>

    <!-- OPTIONS: < > = -->
    <div class="options-row" id="optionsRow">
      <!-- injected by JS -->
    </div>

  </div>

  <div class="nav">
    <button class="prev" id="prevBtn" disabled>← Prev</button>
    <button class="next" id="nextBtn" disabled>Next →</button>

</div>

  <div class="hint-box">
    <h3>Hint</h3>
    <p id="hintText">Compare the two numbers, then tap &lt;, &gt; or = to complete the sentence.</p>
    <button class="popup-btn" id="closeHintBtn">Got it!</button>

<!-- POPUPS -->

</div>

<script>
/* =========================================================
   QUESTION DATA
   ========================================================= */
const QUESTIONS = [
  { left:99, right:19, answer:">" },
  { left:80, right:89, answer:"<" },
  { left:57, right:75, answer:"<" },
  { left:17, right:7,  answer:">" },
  { left:64, right:"6 tens 4 ones", answer:"=" },
  { left:39, right:93, answer:"<" },
  { left:51, right:15, answer:">" },
  { left:48, right:"4 tens 8 ones", answer:"=" },
  { left:23, right:33, answer:"<" },
  { left:71, right:70, answer:">" }
];

const SYMBOLS = [
  { value:"<", cls:"sym-lt", label:"less than" },
  { value:">", cls:"sym-gt", label:"greater than" },
  { value:"=", cls:"sym-eq", label:"equal to" }
];

/* =========================================================
   STATE
   ========================================================= */
const total = QUESTIONS.length;
let current = 0;
let busy = false;
const state = QUESTIONS.map(() => ({ answered:false }));

/* =========================================================
   ELEMENTS
   ========================================================= */
const qLabel        = document.getElementById("qLabel");
const train         = document.getElementById("train");
const targetCircle  = document.getElementById("targetCircle");
const answerMark    = document.getElementById("answerMark");
const givenNumber   = document.getElementById("givenNumber");
const contextNumber = document.getElementById("contextNumber");
const optionsRow    = document.getElementById("optionsRow");
const prevBtn       = document.getElementById("prevBtn");
const nextBtn       = document.getElementById("nextBtn");
const correctSound  = document.getElementById("correctSound");
const wrongSound    = document.getElementById("wrongSound");
const homeBtn       = document.getElementById("homeBtn");
const hintBtn       = document.getElementById("hintBtn");
const hintOverlay   = document.getElementById("hintOverlay");
const closeHintBtn  = document.getElementById("closeHintBtn");
const hintText      = document.getElementById("hintText");

/* =========================================================
   RENDER
   ========================================================= */
/* Shows a number normally, or text like "6 tens 4 ones" on two lines */
function setWagonValue(el, value){
  const text = String(value);
  const isLong = text.length > 3;

  el.classList.toggle("long-text", isLong);

  if(isLong){
    /* split "6 tens 4 ones" into "6 tens" + "4 ones" */
    const parts = text.match(/^(\d+\s*tens?)\s+(.+)$/i);
    el.innerHTML = parts
      ? `<span>${parts[1]}</span><span>${parts[2]}</span>`
      : text;
  }else{
    el.textContent = text;
  }
}

function renderQuestion(){
  const q  = QUESTIONS[current];
  const st = state[current];

  qLabel.textContent = `Q${current + 1}.`;
  setWagonValue(givenNumber,   q.left);
  setWagonValue(contextNumber, q.right);

  /* middle wagon shows "?" until the right symbol is picked */
  train.classList.remove("go");
  targetCircle.classList.remove("revealed","miss-flash");
  answerMark.textContent = st.answered ? q.answer : "?";
  if(st.answered) targetCircle.classList.add("revealed");

  optionsRow.innerHTML = "";

  SYMBOLS.forEach(({ value, cls, label }) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "sym-btn " + cls;
    btn.dataset.value = value;
    btn.setAttribute("aria-label", label);
    btn.innerHTML = "<span>" + value + "</span>";

    if(st.answered){
      btn.disabled = true;
      btn.classList.add(value === q.answer ? "correct-hit" : "faded");
    }else{
      btn.addEventListener("click", () => handleSymbolPick(btn, value));
    }

    optionsRow.appendChild(btn);
  });

  prevBtn.disabled = current === 0;
  nextBtn.disabled = !st.answered || current === total - 1;
}

/* =========================================================
   ANSWER
   ========================================================= */
function handleSymbolPick(optionEl, value){
  const st = state[current];
  if(st.answered || busy) return;

  const q = QUESTIONS[current];
  busy = true;

  optionsRow.querySelectorAll(".sym-btn").forEach(b => b.disabled = true);

  if(value === q.answer){
    st.answered = true;

    optionEl.classList.add("correct-hit");

    /* "?" becomes the symbol and the train chugs */
    answerMark.textContent = q.answer;
    targetCircle.classList.add("revealed");
    train.classList.remove("go");
    void train.offsetWidth;
    train.classList.add("go");

    optionsRow.querySelectorAll(".sym-btn").forEach(b => {
      if(b !== optionEl) b.classList.add("faded");
    });

    correctSound.currentTime = 0;
    correctSound.play().catch(() => {});
    speak("correct");
    showPopup(true);
    fireConfetti();

    nextBtn.disabled = current === total - 1;
    busy = false;

    if(current === total - 1){
      setTimeout(() => { fireBigConfetti(); showFinal(); }, 1100);
    }

  }else{
    wrongSound.currentTime = 0;
    wrongSound.play().catch(() => {});
    targetCircle.classList.add("miss-flash");
    speak("Try again");
    showPopup(false);

    optionEl.classList.add("wrong-try");

    setTimeout(() => {
      targetCircle.classList.remove("miss-flash");
      optionEl.classList.remove("wrong-try");
      optionsRow.querySelectorAll(".sym-btn").forEach(b => { b.disabled = false; });
      busy = false;
    }, 520);
  }
}

/* =========================================================
   POPUPS
   ========================================================= */
function showPopup(isCorrect){
  const popup = document.getElementById("answerPopup");
  popup.className = "popup " + (isCorrect ? "correct" : "wrong");
  popup.style.display = "flex";

  document.getElementById("popupIcon").textContent  = isCorrect ? "🎉" : "❌";
  document.getElementById("popupTitle").textContent = isCorrect ? "Correct!" : "Try Again!";
  document.getElementById("popupMsg").textContent   = isCorrect ? "Great job!" : "That's not quite right.";

  clearTimeout(showPopup._t);
  showPopup._t = setTimeout(() => { popup.style.display = "none"; }, 1100);
}

function showFinal(){
  document.getElementById("finalPopup").style.display = "flex";
  document.getElementById("finalScore").textContent = `${total} / ${total} Completed`;
  document.getElementById("stars").textContent = "⭐⭐⭐";
}

/* =========================================================
   CONFETTI
   ========================================================= */
function fireConfetti(){
  if(!window.confetti) return;
  confetti({
    particleCount:24, spread:55, startVelocity:26,
    origin:{ x:.5, y:.35 },
    colors:["#e6473f","#3a6fd8","#f7b733","#8bba8a","#c9a8e0"]
  });
}

function fireBigConfetti(){
  if(!window.confetti) return;
  const end = Date.now() + 1800;
  (function frame(){
    confetti({ particleCount:6, angle:60,  spread:55, origin:{ x:0 } });
    confetti({ particleCount:6, angle:120, spread:55, origin:{ x:1 } });
    if(Date.now() < end) requestAnimationFrame(frame);
  })();
}

/* =========================================================
   SPEAK
   ========================================================= */
function speak(t){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-US";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

/* =========================================================
   NAV + HINT
   ========================================================= */
prevBtn.addEventListener("click", () => {
  if(current === 0) return;
  current--;
  renderQuestion();
});

nextBtn.addEventListener("click", () => {
  if(nextBtn.disabled) return;
  if(current < total - 1){
    current++;
    renderQuestion();
  }
});

homeBtn.addEventListener("click", () => {
  window.location.href = "../Grade2_chapter1.html";
});

hintBtn.addEventListener("click", () => {
  const q = QUESTIONS[current];
  hintText.textContent = `Compare ${q.left} and ${q.right}. Tap <, > or = to complete the sentence.`;
  hintOverlay.classList.add("show");
});

closeHintBtn.addEventListener("click", () => hintOverlay.classList.remove("show"));

hintOverlay.addEventListener("click", e => {
  if(e.target === hintOverlay) hintOverlay.classList.remove("show");
});

/* =========================================================
   START
   ========================================================= */
renderQuestion();
</script>
