<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose the Correct Symbol — Race Cars</title>

  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../assets/css/reuse.css">

  <style>
    /* =========================================================
   RESET
   ========================================================= */
    * {
      box-sizing: border-box;
      font-family: "Livvic", sans-serif;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8F4FF;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body,
    .quiz-card {
      cursor: default !important;
    }

    button,
    button *,
    .fruit-option,
    .fruit-option * {
      cursor: pointer !important;
    }

    button:disabled,
    button:disabled *,
    .fruit-option:disabled,
    .fruit-option:disabled * {
      cursor: default !important;
    }

    /* =========================================================
   QUIZ CARD
   ========================================================= */
    .quiz-card {
      width: 100%;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(18px, 3vh, 35px) clamp(15px, 4vw, 60px);
      overflow: hidden;
      /* background-color: #208344; */
    }

    /* =========================================================
   TITLE
   ========================================================= */
    .heading {
      margin: 0;
      width: 100%;
      text-align: center;
      font-size: 30px;
      line-height: 1.25;
      color: #2f2f2f;
      margin-top: -20px;
    }

    /* =========================================================
   MAIN CONTENT
   ========================================================= */
    .content-row {
      width: 100%;
      max-width: 1120px;
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: clamp(10px, 1.5vh, 18px);
      min-height: 0;
      padding: clamp(10px, 1.5vh, 18px) 0 0;
    }

    /* Q label sits at the left-top of the question visual */
    .question-heading {
      width: 100%;
      height: 0;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 10;
      display: block;
      margin: 0;
      padding: 0;
      flex: 0 0 auto;
    }

    .qlabel {
      position: absolute;
      left: 0;
      top: 0;
      margin: 0;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.1;
      color: #2f2f2f;
    }

    /* =========================================================
   QUESTION VISUAL — RED CAR + ANSWER BOX + BLUE CAR
   ========================================================= */
    .question-visual {
      width: 100%;
      max-width: 1120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 4vw, 70px);
      margin: clamp(34px, 4vh, 48px) 0 0;
      flex: 0 0 auto;
    }

    .fruit-question {
      position: relative;
      width: 200px !important;
      height: 200px !important;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;

    }

    .fruit-question img {
      width: 100%;
      height: 100%;

      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .fruit-question .fruit-number {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;

      font-size: clamp(40px, 2.3vw, 80px);
      /* font-weight:700; */
      line-height: 1;
      color: #fff !important;

      text-shadow:
        0 2px 0 rgba(255, 255, 255, .6),
        0 2px 6px rgba(0, 0, 0, .12);

      pointer-events: none;
    }

    /* Number badge sits on the car like a race number */
    .fruit-question .fruit-number {
      background: #fff;
      color: #2f2f2f !important;
      text-shadow: none;
      border-radius: 50%;
      width: clamp(52px, 5.8vw, 82px);
      height: clamp(52px, 5.8vw, 82px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid rgba(0, 0, 0, .08);
      box-shadow: 0 4px 8px rgba(0, 0, 0, .15);
      font-size: clamp(40px, 2.3vw, 80px);
    }

    /* Answer box (question mark / chosen symbol) */
    .fruit-question.answer-fruit {
      background: #fff7ec;
      border: 4px dashed #f2b8c6;
      border-radius: 26px;
      box-shadow: 0 12px 22px rgba(80, 40, 110, .12);
    }

    .fruit-question.answer-fruit::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: clamp(-20px, -2.2vw, -14px);
      transform: translateX(-50%);
      width: 66%;
      height: clamp(10px, 1.4vw, 18px);
      background: #8b6cc4;
      border-radius: 8px;
      z-index: -1;
    }

    .answer-mark {
      font-size: clamp(46px, 5.6vw, 72px);
      font-weight: 400;
      color: #e0507a;
      line-height: 1;
    }

    .fruit-question.answer-fruit .fruit-number {
      display: none;
      background: transparent;
      border: 0;
      box-shadow: none;
      width: auto;
      height: auto;
      border-radius: 0;
      font-size: clamp(50px, 6.2vw, 78px);
    }

    .fruit-question.answer-fruit.revealed .answer-mark {
      display: none;
    }

    .fruit-question.answer-fruit.revealed .fruit-number {
      display: block;
      color: #208344 !important;
      animation: answerPop .42s cubic-bezier(.2, .9, .25, 1.25);
    }

    @keyframes answerPop {
      0% {
        transform: translate(-50%, -50%) scale(.55);
        opacity: 0
      }

      70% {
        transform: translate(-50%, -50%) scale(1.08);
        opacity: 1
      }

      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1
      }
    }

    .fruit-question.answer-fruit.miss-flash {
      animation: fruitShake .42s ease;
    }

    @keyframes fruitShake {

      0%,
      100% {
        transform: translateX(0)
      }

      20% {
        transform: translateX(-6px)
      }

      40% {
        transform: translateX(6px)
      }

      60% {
        transform: translateX(-4px)
      }

      80% {
        transform: translateX(4px)
      }
    }

    /* Correct-side car drives forward toward the finish line */
    .fruit-question.given-fruit.car-forward {
      transition: transform .6s cubic-bezier(.3, .85, .3, 1.05);
      transform: translateX(clamp(14px, 3vw, 26px));
    }

    .fruit-question.context-fruit.car-forward {
      transition: transform .6s cubic-bezier(.3, .85, .3, 1.05);
      transform: translateX(clamp(-26px, -3vw, -14px));
    }

    /* =========================================================
   OPTIONS — 3 SYMBOL TILES, NO BOXES
   ========================================================= */
    .archery-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .options-row {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(25px, 7vw, 90px);
      /* margin-top:clamp(4px,1vh,14px); */
      margin-top: 30px !important;
    }

    .fruit-option {
      position: relative;
      width: 200px;
      height: 150px !important;

      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        transform .2s ease,
        filter .2s ease,
        opacity .25s ease;

      animation: fruitFloat 2.8s ease-in-out infinite;
    }

    .fruit-option:nth-child(1) {
      animation-delay: 0s
    }

    .fruit-option:nth-child(2) {
      animation-delay: .35s
    }

    .fruit-option:nth-child(3) {
      animation-delay: .7s
    }

    .fruit-option img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      transition: transform .2s ease, filter .2s ease;
    }

    /* Symbol tile fills the same footprint the apple image used to */
    .symbol-tile {
      width: 100%;
      height: 100%;
      border-radius: clamp(16px, 2.2vw, 28px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(40px, 6vw, 66px);
      font-weight: 400;
      color: #fff;
      line-height: 1;
      box-shadow:
        0 6px 0 rgba(0, 0, 0, .12),
        0 10px 16px rgba(0, 0, 0, .15);
      transition: transform .2s ease, filter .2s ease;
      pointer-events: none;
    }

    .sym-lt {
      background: #54b06a;
    }

    .sym-gt {
      background: #8b5fd1;
    }

    .sym-eq {
      background: #f2a63e;
    }

    .fruit-option .fruit-number {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;

      font-size: clamp(28px, 3.2vw, 42px);
      font-weight: 400;
      line-height: 1;
      color: #fff !important;

      text-shadow:
        0 2px 0 rgba(255, 255, 255, .6),
        0 2px 6px rgba(0, 0, 0, .12);

      pointer-events: none;
    }

    .fruit-option:hover:not(:disabled) .symbol-tile {
      transform: scale(1.035);
    }

    .fruit-option:hover:not(:disabled) {
      transform: translateY(-9px) scale(1.05);
    }

    .fruit-option:active:not(:disabled) {
      transform: translateY(2px) scale(.97);
    }

    @keyframes fruitFloat {

      0%,
      100% {
        transform: translateY(0) rotate(-1deg)
      }

      50% {
        transform: translateY(-9px) rotate(1deg)
      }
    }

    /* Correct option: lock + highlight */
    .fruit-option.correct-hit {
      animation: correctFruit .65s ease forwards;
      pointer-events: none;
      z-index: 5;
    }

    .fruit-option.correct-hit::after {
      content: "✓";
      position: absolute;
      right: 5%;
      top: 5%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #55c878;
      color: #fff;
      font-size: 23px;
      font-weight: 800;
      box-shadow: 0 3px 8px rgba(50, 130, 80, .28);
      z-index: 6;
      animation: checkPop .35s ease;
    }

    @keyframes correctFruit {
      0% {
        transform: scale(1)
      }

      45% {
        transform: scale(1.12) translateY(-8px)
      }

      100% {
        transform: scale(1.06) translateY(-5px)
      }
    }

    @keyframes checkPop {
      0% {
        transform: scale(0)
      }

      75% {
        transform: scale(1.15)
      }

      100% {
        transform: scale(1)
      }
    }

    /* Wrong pick: shake the tile, it does not lock into the answer box */
    .fruit-option.wrong-try {
      animation: fruitShake .42s ease;
    }

    .fruit-option.faded {
      opacity: 0;
      pointer-events: none;
    }

    /* Keep flying-arrow HTML because existing functionality uses it. */
    .flying-arrow {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transform: translate(0, 0) rotate(0deg);
    }

    .flying-arrow.active {
      opacity: 1;
      transition: transform .32s cubic-bezier(.35, .9, .4, 1);
    }

    .flying-arrow img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      transform: translate(-50%, -50%);
    }

    .flying-arrow .flying-number {
      position: absolute;
      transform: translate(-50%, -140%);
      font-size: 16px;
      font-weight: 700;
      color: #302b3b;
      background: #fff;
      border-radius: 8px;
      padding: 1px 6px;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .15);
    }

    /* =========================================================
   NAV — unchanged
   ========================================================= */
    /* =========================================================
   NAV  (unchanged)
   ========================================================= */

    .nav button {
      position: relative;
      min-width: 132px;
      height: 50px;
      padding: 0 22px;

      border: 4px solid #ffffff;
      border-radius: 18px;

      font-family: 'Livvic', sans-serif;
      font-size: 18px;
      font-weight: 700;

      color: #ffffff;
      cursor: pointer;

      box-shadow:
        0 6px 0 rgba(0, 0, 0, 0.18),
        0 9px 14px rgba(0, 0, 0, 0.15);

      transition: all 0.15s ease;
    }

    .nav button {
      padding: 10px 25px;
      border: none;
      border-radius: 15px;
      font-size: clamp(17px, 1.5vw, 20px);
      cursor: pointer;
      color: #fff;
      font-weight: 500;
      transition: 0.15s;
    }

    .prev {
      background: linear-gradient(180deg, #ff8fb3 0%, #f0447c 100%);
    }

    /* NEXT BUTTON */
    .next {
      background: linear-gradient(180deg, #55d9f5 0%, #009dcc 100%);
    }

    /* Hover */
    .nav button:not(:disabled):hover {
      transform: translateY(-3px);
      box-shadow:
        0 9px 0 rgba(0, 0, 0, 0.18),
        0 13px 18px rgba(0, 0, 0, 0.16);
    }

    /* Click */
    .nav button:not(:disabled):active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 rgba(0, 0, 0, 0.18),
        0 4px 8px rgba(0, 0, 0, 0.12);
    }

    /* Disabled */
    .nav button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow:
        0 4px 0 rgba(0, 0, 0, 0.12);
    }

    /* Arrow */
    .prev,
    .next {
      letter-spacing: 0.3px;
    }



    /* =========================================================
   RESPONSIVE — fruit layout only
   ========================================================= */
    @media (min-width:1024px) and (max-width:1365px) {
      .quiz-card {
        padding: 22px 35px;
      }

      .heading {
        font-size: 27px
      }

      .content-row {
        max-width: 900px;
        gap: 12px;
        padding-top: 10px;
      }

      .question-heading {
        height: 0;
      }

      .qlabel {
        left: 0;
        top: 0;
        font-size: 34px;
      }

      .question-visual {
        max-width: 900px;
        gap: 20px;
        margin-top: 12px;
        transform: translateY(-8px);
      }

      .fruit-question {
        width: clamp(140px, 17vw, 200px);
        height: clamp(150px, 19vw, 200px);
      }

      .fruit-question .fruit-number {
        top: 48%;
        width: clamp(44px, 4.6vw, 62px);
        height: clamp(44px, 4.6vw, 62px);
        font-size: clamp(40px, 2.3vw, 80px);
      }

      #givenFruit .fruit-number {
        left: 42%;
      }

      #contextFruit .fruit-number {
        left: 58%;
      }

      .options-row {
        gap: clamp(18px, 4vw, 45px);
        margin-top: -10px;
        transform: translateY(-8px);
      }

      .fruit-option {
        width: clamp(118px, 14vw, 155px);
        height: clamp(135px, 16vw, 175px);
      }

      .fruit-option .fruit-number {
        font-size: clamp(23px, 2.8vw, 30px);
      }

      .nav {
        margin-top: 8px;
        padding-bottom: 8px;
        gap: 100px;
      }

      .nav button {
        min-width: 145px;
        height: 52px;
        padding: 10px 25px;
        font-size: 19px;
      }
    }

    @media (min-width:1366px) {
      .quiz-card {
        padding: 28px 50px;
      }

      .heading {
        font-size: 30px
      }

      .content-row {
        max-width: 1120px;
        gap: 16px;
        padding-top: 12px;
      }

      .qlabel {
        left: 0;
        top: 0;
        font-size: 42px;
      }

      .question-visual {
        max-width: 1050px;
        gap: 40px;
        margin-top: -14px;
        transform: translateY(-10px);
      }

      .fruit-question {
        width: 240px;
        height: 250px;

      }

      .fruit-question .fruit-number {
        top: 48%;
        width: 58px;
        height: 58px;
        font-size: 26px;
      }

      #givenFruit .fruit-number {
        left: 42%;
      }

      #contextFruit .fruit-number {
        left: 58%;
      }

      .options-row {
        gap: 70px;
        margin-top: 20px;
      }

      .fruit-option {
        width: 170px;
        height: 190px;
      }

      .fruit-option .fruit-number {
        font-size: 31px;
      }

      .nav {
        margin-top: 10px;
        padding-bottom: 10px;
        gap: 120px;
      }

      .nav button {
        min-width: 155px;
        height: 55px;
        padding: 11px 28px;
        font-size: 20px;
      }
    }

    @media (min-width:1600px) {
      .quiz-card {
        padding: 30px 70px 5px;
      }

      .heading {
        font-size: 42px;
        margin-top: -18px
      }

      .content-row {
        max-width: 1280px;
        gap: 18px;
        padding-top: 16px;
      }

      .qlabel {
        left: 0;
        top: 0;
        font-size: 48px;
      }

      .question-visual {
        max-width: 1180px;
        gap: 55px;
      }

      .fruit-question {
        width: 330px;
        height: 340px;
      }

      .fruit-question .fruit-number {
        font-size: 64px;
      }

      .options-row {
        gap: 90px;
        margin-top: 4px;
      }

      .fruit-option {
        width: 220px;
        height: 250px;
      }

      .fruit-option .fruit-number {
        font-size: 36px;
      }
    }

    /* Mobile: one question per screen, centered fruit group, 3 options in one row */
    @media (max-width:768px) {

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .quiz-card {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        padding: 14px 12px 10px;
        overflow: hidden;
        background: #fff;
      }

      .heading {
        width: 100%;
        text-align: center;
        font-size: 19px;
        line-height: 1.25;
        margin: 0;
        flex: 0 0 auto;
      }

      .content-row {
        width: 100%;
        max-width: 430px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 8px 0;
        min-height: 0;
      }

      .question-heading {
        width: 100%;
        height: 0;
        position: absolute;
        left: 0;
        top: 0;
      }

      .qlabel {
        left: 0;
        top: 0;
        font-size: 24px;
        line-height: 1.1;
      }

      .question-visual {
        width: 100%;
        max-width: 430px;
        gap: 6px;
        justify-content: center;
        margin: 28px 0 0;
      }

      .fruit-question {
        width: clamp(100px, 28vw, 140px);
        height: clamp(115px, 32vw, 160px);
      }

      .fruit-question .fruit-number {
        font-size: clamp(22px, 6vw, 30px);
      }

      .options-row {
        width: 100%;
        gap: clamp(2px, 2vw, 10px);
        justify-content: center;
        align-items: flex-end;
        margin-top: 4px;
      }

      .fruit-question.answer-fruit {
        width: 200px;
        height: 210px;
      }

      /* Three option boxes */
      .fruit-option {
        width: 145px;
        height: 165px;
      }

      .fruit-option .fruit-number {
        font-size: clamp(17px, 5vw, 23px);
      }

      .fruit-option.correct-hit::after {
        width: 25px;
        height: 25px;
        font-size: 17px;
      }
    }

    @media (max-width:480px) {
      .quiz-card {
        padding: 10px 8px;
      }

      .heading {
        font-size: 16px;
      }

      .content-row {
        max-width: 330px;
        gap: 7px;
        padding: 4px 0;
      }

      .qlabel {
        font-size: 21px;
      }

      .question-visual {
        max-width: 315px;
        gap: 2px;
        margin: 26px 0 0;
      }

      .fruit-question {
        width: clamp(82px, 29vw, 100px);
        height: clamp(96px, 34vw, 120px);
      }

      .fruit-question .fruit-number {
        font-size: 18px;
      }

      .options-row {
        gap: 2px;
        margin-top: 2px;
      }

      .fruit-option {
        width: clamp(70px, 28vw, 86px);
        height: clamp(84px, 34vw, 104px);
      }

      .fruit-option .fruit-number {
        font-size: 15px;
      }
    }
  /* =========================================================
   LARGE MONITORS
   The race-number badge kept the small 1366px circle while the
   1600px block grew the font, so the digits spilled out of it and
   read as bare white text on the car. Size the badge with the font,
   and centre the whole card in the tall window instead of letting
   everything pile up against the top.
   ========================================================= */
@media (min-width:1600px){

  .fruit-question .fruit-number{
    width:100px;
    height:100px;
    font-size:46px;
    background:#fff;
    color:#2f2f2f !important;
    border:5px solid rgba(0,0,0,.12);
    box-shadow:0 5px 12px rgba(0,0,0,.20);
  }

  .fruit-option .fruit-number{
    font-size:40px;
  }
}

@media (min-height:800px){

  .quiz-card{
    justify-content:center;
  }

  /* the row grows to fill the card, so its contents also have to be
     centred or they stay pinned to the top of that space */
  .content-row{
    justify-content:center;
    padding-top:0;
  }
}

</style>
</head>

<body>

  <div class="quiz-card" id="quizCard">

    <div class="topbar">
      <button class="icon-flat" id="homeBtn" style="display: none;" title="Home" aria-label="Home">🏠</button>

      <p class="heading" id="heading">
        Choose the correct symbol.
      </p>

      <button class="icon-flat" id="hintBtn" title="Hint" aria-label="Hint">💡</button>
    </div>

    <div class="content-row">

      <!-- QUESTION HEADER -->
      <div class="question-heading">
        <span class="qlabel" id="qLabel">Q1.</span>
      </div>

      <!-- QUESTION VISUAL: RED CAR + ANSWER BOX + BLUE CAR -->
      <div class="question-visual">

        <!-- LEFT CAR -->
        <div class="fruit-question given-fruit" id="givenFruit">
          <img src="../assets/images/redcar.png" alt="">
          <span class="fruit-number" id="givenNumber">45</span>
        </div>

        <!-- MIDDLE ANSWER BOX -->
        <div class="fruit-question answer-fruit" id="targetCircle">
          <span class="answer-mark" id="answerMark">?</span>
          <span class="fruit-number" id="targetNumber"></span>
        </div>

        <!-- RIGHT CAR -->
        <div class="fruit-question context-fruit" id="contextFruit">
          <img src="../assets/images/bluecar.png" alt="">
          <span class="fruit-number" id="contextNumber">32</span>
        </div>

      </div>

      <!-- OPTIONS: <, >, = symbol tiles -->
      <div class="archery-area">
        <div class="options-row" id="optionsRow">
          <!-- injected by JS -->
        </div>
      </div>

    </div>

    <div class="nav">
      <button class="prev" id="prevBtn" disabled>← Prev</button>
      <button class="next" id="nextBtn" disabled>Next →</button>
    </div>

    <!-- FLYING ARROW -->
    <div class="flying-arrow" id="flyingArrow" aria-hidden="true" style="display:none;">
      <img src="/assets/images/arrow.png" alt="">
      <span class="flying-number" id="flyingNumber"></span>
    </div>

  </div>

  <div class="hint-overlay" id="hintOverlay" aria-live="polite">
    <div class="hint-box">
      <h3>Hint</h3>
      <p id="hintText">Compare the two numbers, then tap < ,> or = to complete the sentence.</p>
      <button class="popup-btn" id="closeHintBtn">Got it!</button>
    </div>
  </div>

  <!-- =========================================================
     POPUPS  (unchanged)
     ========================================================= -->

  <div id="answerPopup" class="popup">
    <div class="popup-content">
      <div class="popup-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <div id="finalPopup">
    <div class="finalpopup-box">
      <h2 class="final-heading">🎉 Amazing Job!</h2>
      <p id="finalScore"></p>
      <div id="stars">⭐⭐⭐</div>
      <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
    </div>
  </div>

  <!-- SOUNDS -->
  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>


  <script>

    /* =========================================================
       QUESTION DATA
       Source data: second reference image ("Compare the following (>, < or =)").
       Note: "6 tens 4 ones" = 64 and "4 tens 8 ones" = 48 are shown as their
       numeric value on the car badge.
       ========================================================= */

    const QUESTIONS = [
      { left: 99, right: 19, answer: ">" }, // a) 99 > 19
      { left: 80, right: 89, answer: "<" }, // b) 80 < 89
      { left: 57, right: 75, answer: "<" }, // c) 57 < 75
      { left: 17, right: 7, answer: ">" }, // d) 17 > 7
      { left: 64, right: 64, answer: "=" }, // e) 64 = 6 tens 4 ones
      { left: 39, right: 93, answer: "<" }, // f) 39 < 93
      { left: 51, right: 15, answer: ">" }, // g) 51 > 15
      { left: 48, right: 48, answer: "=" }, // h) 48 = 4 tens 8 ones
      { left: 23, right: 33, answer: "<" }, // i) 23 < 33
      { left: 71, right: 70, answer: ">" }  // j) 71 > 70
    ];

    const SYMBOLS = [
      { value: "<", cls: "sym-lt" },
      { value: ">", cls: "sym-gt" },
      { value: "=", cls: "sym-eq" }
    ];

    const LABELS = ["Q1.", "Q2.", "Q3.", "Q4.", "Q5.", "Q6.", "Q7.", "Q8.", "Q9.", "Q10."];

    /* =========================================================
       STATE
       ========================================================= */

    const total = QUESTIONS.length;
    let current = 0;
    let shooting = false;

    const state = QUESTIONS.map(() => ({
      answered: false
    }));


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const quizCard = document.getElementById("quizCard");
    const qLabel = document.getElementById("qLabel");
    const targetCircle = document.getElementById("targetCircle");
    const targetNumber = document.getElementById("targetNumber");
    const answerMark = document.getElementById("answerMark");
    const givenFruit = document.getElementById("givenFruit");
    const contextFruit = document.getElementById("contextFruit");
    const givenNumber = document.getElementById("givenNumber");
    const optionsRow = document.getElementById("optionsRow");
    const flyingArrow = document.getElementById("flyingArrow");
    const flyingNumber = document.getElementById("flyingNumber");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const contextNumber = document.getElementById("contextNumber");

    const correctSound = document.getElementById("correctSound");
    const wrongSound = document.getElementById("wrongSound");
    const homeBtn = document.getElementById("homeBtn");
    const hintBtn = document.getElementById("hintBtn");
    const hintOverlay = document.getElementById("hintOverlay");
    const closeHintBtn = document.getElementById("closeHintBtn");
    const hintText = document.getElementById("hintText");

    /* =========================================================
       RENDER QUESTION
       ========================================================= */
    function renderQuestion() {

      const q = QUESTIONS[current];
      const st = state[current];

      qLabel.textContent = LABELS[current] || `Q${current + 1}.`;

      // Show both numbers on the cars
      givenNumber.textContent = q.left;
      contextNumber.textContent = q.right;

      targetCircle.classList.remove("revealed", "miss-flash");
      givenFruit.classList.remove("car-forward");
      contextFruit.classList.remove("car-forward");

      targetNumber.textContent =
        st.answered ? q.answer : "";

      if (st.answered) {
        targetCircle.classList.add("revealed");
        applyCarMovement(q.answer);
      }

      optionsRow.innerHTML = "";

      SYMBOLS.forEach(({ value, cls }) => {

        const btn = document.createElement("button");

        btn.className = "fruit-option";
        btn.type = "button";
        btn.dataset.value = value;

        const tile = document.createElement("div");
        tile.className = "symbol-tile " + cls;
        tile.textContent = value;

        btn.appendChild(tile);

        if (st.answered) {

          btn.disabled = true;

          if (value === q.answer) {
            btn.classList.add("correct-hit");
          } else {
            btn.classList.add("faded");
          }

        } else {

          btn.addEventListener(
            "click",
            () => handleSymbolPick(btn, value)
          );
        }

        optionsRow.appendChild(btn);
      });

      prevBtn.disabled = current === 0;
      nextBtn.disabled =
        !st.answered || current === total - 1;
    }

    /* Correct-side car(s) roll forward toward the finish line */
    function applyCarMovement(answer) {

      if (answer === ">") {
        givenFruit.classList.add("car-forward");
      } else if (answer === "<") {
        contextFruit.classList.add("car-forward");
      } else {
        givenFruit.classList.add("car-forward");
        contextFruit.classList.add("car-forward");
      }
    }

    /* =========================================================
       EXISTING ARROW HELPERS KEPT
       ========================================================= */

    function localCenter(el) {
      const stageRect = quizCard.getBoundingClientRect();
      const scale = stageRect.width / quizCard.offsetWidth || 1;
      const rect = el.getBoundingClientRect();

      return {
        x: (rect.left - stageRect.left + rect.width / 2) / scale,
        y: (rect.top - stageRect.top + rect.height / 2) / scale
      };
    }

    function fireArrowAt(optionEl, targetEl, value, onDone) {

      const from = localCenter(optionEl);
      const to = localCenter(targetEl);

      const angle =
        Math.atan2(to.y - from.y, to.x - from.x) *
        (180 / Math.PI) + 90;

      flyingNumber.textContent = value;

      flyingArrow.style.transition = "none";
      flyingArrow.style.transform =
        `translate(${from.x}px, ${from.y}px) rotate(${angle}deg)`;

      flyingArrow.classList.add("active");

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {

          flyingArrow.style.transition =
            "transform .32s cubic-bezier(.35,.9,.4,1)";

          flyingArrow.style.transform =
            `translate(${to.x}px, ${to.y}px) rotate(${angle}deg)`;
        });
      });

      setTimeout(() => {
        flyingArrow.classList.remove("active");
        onDone();
      }, 340);
    }

    /* =========================================================
       SYMBOL PICK
       ========================================================= */

    function handleSymbolPick(optionEl, value) {

      const st = state[current];

      if (st.answered || shooting) return;

      const q = QUESTIONS[current];

      shooting = true;

      /* Prevent double taps while popup/result is shown */
      optionsRow.querySelectorAll(".fruit-option").forEach((b) => {
        b.disabled = true;
      });

      if (value === q.answer) {

        st.answered = true;

        /* Lock + highlight correct symbol */
        optionEl.classList.add("correct-hit");

        targetNumber.textContent = q.answer;
        targetCircle.classList.add("revealed");
        applyCarMovement(q.answer);

        optionsRow.querySelectorAll(".fruit-option").forEach((b) => {

          if (b !== optionEl) {
            b.disabled = true;
            b.classList.add("faded");
          }

        });

        correctSound.currentTime = 0;
        correctSound.play().catch(() => { });

        speak("correct");
        showPopup(true);
        fireConfetti();

        nextBtn.disabled = current === total - 1;

        shooting = false;

        if (current === total - 1) {

          setTimeout(() => {
            fireBigConfetti();
            showFinal();
          }, 1100);

        }

      } else {

        wrongSound.currentTime = 0;
        wrongSound.play().catch(() => { });

        targetCircle.classList.add("miss-flash");

        speak("wrong");
        showPopup(false);

        /* Wrong symbol shakes and never locks into the answer box */
        optionEl.classList.add("wrong-try");

        setTimeout(() => {

          targetCircle.classList.remove("miss-flash");
          optionEl.classList.remove("wrong-try");

          optionsRow.querySelectorAll(".fruit-option").forEach((b) => {
            if (!st.answered) {
              b.disabled = false;
            }
          });

          shooting = false;

        }, 520);
      }
    }

    /* =========================================================
       POPUP — unchanged
       ========================================================= */

    function showPopup(isCorrect) {

      const popup = document.getElementById("answerPopup");
      const icon = document.getElementById("popupIcon");
      const title = document.getElementById("popupTitle");
      const msg = document.getElementById("popupMsg");

      popup.className = "popup " + (isCorrect ? "correct" : "wrong");
      popup.style.display = "flex";

      if (isCorrect) {
        icon.textContent = "🎉";
        title.textContent = "Correct!";
        msg.textContent = "Great job!";
      } else {
        icon.textContent = "❌";
        title.textContent = "Try Again!";
        msg.textContent = "That's not quite right.";
      }

      clearTimeout(showPopup._t);

      showPopup._t = setTimeout(() => {
        popup.style.display = "none";
      }, 1100);
    }

    /* =========================================================
       FINAL — unchanged
       ========================================================= */

    function showFinal() {

      const finalPopup = document.getElementById("finalPopup");

      finalPopup.style.display = "flex";

      document.getElementById("finalScore").textContent =
        `${total} / ${total} Completed`;

      document.getElementById("stars").textContent = "⭐⭐⭐";
    }

    /* =========================================================
       CONFETTI — unchanged
       ========================================================= */

    function fireConfetti() {

      if (!window.confetti) return;

      confetti({
        particleCount: 24,
        spread: 55,
        startVelocity: 26,
        origin: { x: .5, y: .4 },
        colors: ["#e6473f", "#3a6fd8", "#f7b733", "#8bba8a", "#c9a8e0"]
      });
    }

    function fireBigConfetti() {

      if (!window.confetti) return;

      const end = Date.now() + 1800;

      (function frame() {

        confetti({
          particleCount: 6,
          angle: 60,
          spread: 55,
          origin: { x: 0 }
        });

        confetti({
          particleCount: 6,
          angle: 120,
          spread: 55,
          origin: { x: 1 }
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }

      })();
    }

    /* ===== SPEAK ===== */

    function speak(t) {

      speechSynthesis.cancel();

      const msg = new SpeechSynthesisUtterance(t);

      msg.lang = "en-UK";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;

      speechSynthesis.speak(msg);
    }

    /* =========================================================
       NAV — unchanged
       ========================================================= */

    prevBtn.addEventListener("click", () => {

      if (current === 0) return;

      current--;

      renderQuestion();
    });

    nextBtn.addEventListener("click", () => {

      if (nextBtn.disabled) return;

      if (current < total - 1) {

        current++;

        renderQuestion();
      }
    });

    homeBtn.addEventListener("click", () => {
      window.location.href = "../Grade2_chapter1.html";
    });

    hintBtn.addEventListener("click", () => {

      const q = QUESTIONS[current];

      hintText.textContent =
        `Compare ${q.left} and ${q.right}. Tap < , > or = to complete the sentence.`;

      hintOverlay.classList.add("show");
    });

    closeHintBtn.addEventListener("click", () => {
      hintOverlay.classList.remove("show");
    });

    hintOverlay.addEventListener("click", (event) => {

      if (event.target === hintOverlay) {
        hintOverlay.classList.remove("show");
      }

    });

    /* =========================================================
       INITIALIZE
       ========================================================= */

    renderQuestion();

  </script>

</body>

</html>
