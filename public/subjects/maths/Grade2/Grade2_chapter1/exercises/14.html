<style>

/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;

html,
body{
  margin:0;

/* =========================================================
   QUIZ CARD
   ========================================================= */

.quiz-card{
  width:100%;
  height:100vh;
  position:relative;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
    clamp(18px,3vh,35px)
    clamp(15px,4vw,60px);

  overflow:hidden;
  /* background:#302b3b */
}


/* =========================================================
   TITLE
   ========================================================= */

.heading{
  margin:0;
  width:100%;

  text-align:center;

  font-size:30px;
  line-height:1.25;

  color:#2f2f2f;
  margin-top: -20px;
}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.content-row{
  width:100%;
  max-width:700px;

  /* flex:1 1 auto; */
  min-height:0;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:clamp(12px,2vh,24px);

  overflow:hidden;
}


/* =========================================================
   QUESTION — Q1. EIGHT SAME LINE
   ========================================================= */

.question-heading{
  width:100%;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  gap:10px;
  margin-top: 22px;
  font-size:30px;

  flex:0 0 auto;
}

.qlabel{
  margin:0;

  font-size:clamp(23px,3vw,34px);
  line-height:1.2;

  color:#2f2f2f;
}

.question-text{
  margin:0;
  margin-top:6px;

  font-size:30px;
  line-height:1.2;

  color:#2f2f2f;

  text-align:center;
}


/* =========================================================
   IMAGE
   ========================================================= */

.image-wrap{
  width:100%;
  max-width:400px;

  display:flex;
  justify-content:center;
  align-items:center;

  margin-top:8px;

  flex:0 1 auto;
  min-height:0;
}

.image-placeholder{
  width:100%;
  height:100%;
  max-height:100%;

  aspect-ratio:1 / 1.15;

  display:flex;
  align-items:center;
  justify-content:center;

  background:transparent;
  border:none;
  box-shadow:none;

  overflow:hidden;
}

.image-placeholder img{
  width:100%;
  height:100%;

  object-fit:contain;

  border:none;
  border-radius:0;
}


/* =========================================================
   ANSWER AREA — BELOW IMAGE
   ========================================================= */

.answer-area{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;

  gap:10px;

  flex:0 0 auto;
  min-height:48px;
}


/* =========================================================
   ANSWER ROW
   ========================================================= */

.answer-row{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:14px;

  width:100%;
}


/* =========================================================
   OPTION BUTTONS
   ========================================================= */

.option-btn{
  min-width:120px;
  height:48px;
  /* padding:0 24px; */
  /* flex:0 0 auto; */
  margin-top: -10px;

  border:3px solid #ffffff;
  border-radius:12px;
  background:#ffffff;

  color:#302b3b;
  font-size:18px;
  font-weight:600;

  box-shadow:
    0 3px 0 #d9cdf3,
    0 6px 12px rgba(80,60,120,.12);

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    border-color .15s ease,
    background .15s ease;
}

.option-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 5px 0 #d9cdf3,
    0 8px 14px rgba(80,60,120,.14);
}

.option-btn:active{
  transform:translateY(2px);
  box-shadow:
    0 1px 0 #d9cdf3,
    0 3px 7px rgba(80,60,120,.12);
}

.option-btn.correct{
  border-color:#39b765;
  background:#effff3;
  color:#208344;
}

.option-btn.wrong{
  border-color:#ed6175;
  background:#fff1f3;
}

.option-btn:disabled{
  opacity:1;
}

.option-btn.wrong-shake{
  animation:shake .42s ease;
}

@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-7px);}
  40%{transform:translateX(7px);}
  60%{transform:translateX(-5px);}
  80%{transform:translateX(5px);}
}


/* =========================================================
   PREV / NEXT NAVIGATION
   Self-contained styles (do NOT depend on reuse.css) so
   the buttons always render even if reuse.css is missing
   or its .prev/.next classes are named differently.
   ========================================================= */

.nav{
  width:100%;
  flex:0 0 auto;

  display:flex;
  justify-content:center;
  align-items:center;
  gap:40px;

  margin-top:14px;
  padding:0 10px;
}

.home-btn{

  left:14px;

  width:46px;
  height:46px;
  border:3px solid #ffffff;
  border-radius:50px;
  background:linear-gradient(145deg,#8b6fe0,#6f42c1);
  color:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:100;
  box-shadow:
    0 4px 0 #4f2e93,
    0 6px 10px rgba(79,46,147,0.22);
  transition:all .15s ease;
  display: none;
}

.home-btn:hover{
  transform:translateY(-3px) scale(1.06);
}

.home-btn:active{
  transform:translateY(2px) scale(.96);
  box-shadow:0 2px 0 #4f2e93;
}

.home-btn i{
  font-size:21px;
  line-height:1;
}

<body>
  <button class="home-btn" id="homeBtn" aria-label="Home" title="Home"
    onclick="window.location.href='../Grade2_chapter1.html'">
  <i class="fa-solid fa-house"></i>
</button>

<div class="quiz-card">

  <!-- TITLE -->
  <p class="heading" id="heading">
    Count and tick (✓) whether even or odd.
  </p>


  <div class="content-row">

    <!-- QUESTION -->
    <div class="question-heading">

      <span class="qlabel" id="qLabel">
        Q1.
      </span>

      <span class="question-text" id="questionText">
        Eight
      </span>

    </div>


    <!-- IMAGE -->
    <div class="image-wrap">

      <div class="image-placeholder">

        <img
          src="https://via.placeholder.com/280x336/e8e0f0/7a6a9a?text=Number+Line"
          alt="Number visual"
          id="questionImage"
        >

      </div>

    </div>


    <!-- ANSWER -->
    <div class="answer-area">
      <div class="answer-row">
        <button class="option-btn" data-answer="Even">Even</button>
        <button class="option-btn" data-answer="Odd">Odd</button>
      </div>
    </div>

  </div>

  <!-- PREV / NEXT -->
  <div class="nav">
    <button class="prev" id="prevBtn" type="button">← Prev</button>

  </div>

<!-- =========================================================
     CORRECT / WRONG POPUP
     ========================================================= -->

<div id="answerPopup" class="popup">

  <div class="popup-content">

    <div
      class="popup-icon"
      id="popupIcon">
    </div>

    <h3 id="popupTitle"></h3>

    <p id="popupMsg"></p>

  </div>

</div>


<!-- =========================================================
     FINAL POPUP
     ========================================================= -->

<div id="finalPopup">

  <div class="finalpopup-box">

    <h2 class="final-heading">
      🎉 Amazing Job!
    </h2>

    <p id="finalScore"></p>

    <div id="stars">
      ⭐⭐⭐
    </div>

    <button
      onclick="location.reload()"
      class="playAgain-btn">
      Play Again
    </button>

  </div>

</div>


<!-- SOUNDS -->

<audio
  id="correctSound"
  src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3">
</audio>

<audio
  id="wrongSound"
  src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3">
</audio>


<script>

/* =========================================================
   QUESTION DATA
   ========================================================= */

const QUESTIONS = [
  {
    name: "Pears",
    answer: "Odd",
    image: "../assets/images/pears.png"
  },
  {
    name: "Pencils",
    answer: "Odd",
    image: "../assets/images/pencils.png"
  },
  {
    name: "Popsicles",
    answer: "Even",
    image: "../assets/images/icecream.png"
  }
];


/* =========================================================
   STATE
   ========================================================= */

const total = QUESTIONS.length;

let current = 0;

const state = QUESTIONS.map(() => ({
  answered:false
}));


/* =========================================================
   ELEMENTS
   ========================================================= */

const qLabel =
  document.getElementById("qLabel");

const questionText =
  document.getElementById("questionText");

const optionButtons =
  document.querySelectorAll(".option-btn");

const questionImage =
  document.getElementById("questionImage");

const correctSound =
  document.getElementById("correctSound");

const wrongSound =
  document.getElementById("wrongSound");


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

  const q = QUESTIONS[current];
  const st = state[current];

  qLabel.textContent = `Q${current + 1}.`;
  questionText.textContent = q.name;
  questionImage.src = q.image;

  optionButtons.forEach(btn => {
    btn.disabled = st.answered;
    btn.classList.remove("correct", "wrong", "wrong-shake");

    if(st.answered && btn.dataset.answer === q.answer){
      btn.classList.add("correct");
    }
  });
}


/* =========================================================
   OPTION SELECTION
   ========================================================= */

function handleOption(answer){

  const st = state[current];

  if(st.answered) return;

  const q = QUESTIONS[current];

  const selectedButton =
    [...optionButtons].find(
      btn => btn.dataset.answer === answer
    );

  if(answer === q.answer){

    st.answered = true;

    optionButtons.forEach(btn => {
      btn.disabled = true;
    });

    if(selectedButton){
      selectedButton.classList.add("correct");
    }

    correctSound.currentTime = 0;
    correctSound.play().catch(() => {});

    speak("correct");
    showPopup(true);
    fireConfetti();

  // Do not automatically move to the next question
updateNavigation();

if(current === total - 1){
  setTimeout(() => {
    fireBigConfetti();
    showFinal();
  },1100);
}

  }else{

    wrongSound.currentTime = 0;
    wrongSound.play().catch(() => {});

    speak("wrong");

    if(selectedButton){

      selectedButton.classList.add("wrong", "wrong-shake");

      setTimeout(() => {
        selectedButton.classList.remove("wrong", "wrong-shake");
      },500);

    }

    showPopup(false);
  }

}


/* =========================================================
   POPUP
   ========================================================= */

function speak(t) {
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-UK";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

function showPopup(isCorrect){

  const popup =
    document.getElementById(
      "answerPopup"
    );

  const icon =
    document.getElementById(
      "popupIcon"
    );

  const title =
    document.getElementById(
      "popupTitle"
    );

  const msg =
    document.getElementById(
      "popupMsg"
    );


  popup.className =
    "popup " +
    (isCorrect ? "correct" : "wrong");

  popup.style.display =
    "flex";


  if(isCorrect){

    icon.textContent = "🎉";

    title.textContent =
      "Correct!";

    msg.textContent =
      "Great job!";

  }else{

    icon.textContent = "❌";

    title.textContent =
      "Try Again!";

    msg.textContent =
      "That's not quite right.";

  }


  clearTimeout(
    showPopup._t
  );

  showPopup._t =
    setTimeout(() => {

      popup.style.display =
        "none";

    },1100);

}


/* =========================================================
   FINAL
   ========================================================= */

function showFinal(){

  const finalPopup =
    document.getElementById(
      "finalPopup"
    );

  finalPopup.style.display =
    "flex";

  document.getElementById(
    "finalScore"
  ).textContent =
    `${total} / ${total} Completed`;

  /* Always 3 stars */
  document.getElementById(
    "stars"
  ).textContent =
    "⭐⭐⭐";

}


/* =========================================================
   CONFETTI
   ========================================================= */

function fireConfetti(){

  if(!window.confetti) return;

  confetti({

    particleCount:24,

    spread:55,

    startVelocity:26,

    origin:{
      x:.5,
      y:.4
    },

    colors:[
      "#e6473f",
      "#3a6fd8",
      "#f7b733",
      "#8bba8a",
      "#c9a8e0"
    ]

  });

}


function fireBigConfetti(){

  if(!window.confetti) return;

  const end =
    Date.now() + 1800;

  (function frame(){

    confetti({

      particleCount:6,

      angle:60,

      spread:55,

      origin:{
        x:0
      }

    });

    confetti({

      particleCount:6,

      angle:120,

      spread:55,

      origin:{
        x:1
      }

    });

    if(Date.now() < end){

      requestAnimationFrame(frame);

    }

  })();

}


/* =========================================================
   EVENTS
   ========================================================= */

optionButtons.forEach(btn => {

  btn.addEventListener(
    "click",
    () => handleOption(btn.dataset.answer)
  );

});

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const homeBtn = document.getElementById("homeBtn");

homeBtn.addEventListener("click", () => {
  window.location.href = "../Grade2_chapter1.html";
});

function updateNavigation(){

  // Prev disabled on first AND last question
  prevBtn.disabled =
    current === 0 || current === total - 1;

  // Next disabled until answered and on last question
  nextBtn.disabled =
    !state[current].answered || current === total - 1;
}

nextBtn.addEventListener("click", () => {

  if(current < total - 1){

    current++;
    renderQuestion();
    updateNavigation();

  }

});


/* =========================================================
   INITIALIZE
   ========================================================= */

renderQuestion();
updateNavigation();

</script>

</body>
