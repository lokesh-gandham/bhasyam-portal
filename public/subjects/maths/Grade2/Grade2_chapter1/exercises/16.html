/* =========================================================
   QUIZ CARD
   ========================================================= */

.quiz-card{

/* =========================================================

.topbar {

.icon-flat {

.content-row{

.question-heading{

  margin:0;

}

/* =========================================================
   QUESTION TEXT
   ========================================================= */

.question-text{
  display:none;
  font-size:clamp(24px,3vw,38px);

  text-align:center;

  padding:0 10px;
  flex:0 0 auto;

/* =========================================================
   OPTIONS — 4 BALLOONS
   ========================================================= */

.archery-area{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex:0 0 auto;
}

.options-row{
  width:100%;
  max-width:760px;
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  align-items:end;
  justify-items:center;
  gap:clamp(26px,2.8vw,44px);
  cursor: pointer !important;
}

.arrow-option{
  position:relative;

  width:clamp(120px,17vw,190px);
  height:clamp(150px,22vw,240px);

  padding:0;
  margin:0;
  cursor: pointer !important;

  border:0;
  border-radius:0;

  background:transparent;
  box-shadow:none;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:
    transform .2s ease,
    filter .2s ease,
    opacity .25s ease;

  animation:balloonFloat 2.8s ease-in-out infinite;
}

.arrow-option:nth-child(1){ animation-delay:0s; }
.arrow-option:nth-child(2){ animation-delay:.25s; }
.arrow-option:nth-child(3){ animation-delay:.5s; }
.arrow-option:nth-child(4){ animation-delay:.75s; }

.arrow-option::before{
  content:"";
  position:absolute;
  inset:0;

  -webkit-mask-image:url('/assets/images/balloon.png');
  mask-image:url('/assets/images/balloon.png');
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
  -webkit-mask-position:center;
  mask-position:center;
  -webkit-mask-size:100% 100%;
  mask-size:100% 100%;

  background-color:#BEEFC9;

  z-index:0;

  transition:
    background-color .2s ease,
    transform .2s ease;
}

/* 4 different pastel colors */
.arrow-option:nth-child(1)::before{
  background-color:#BEEFC9; /* mint */
}
.arrow-option:nth-child(2)::before{
  background-color:#F9C9DE; /* pink */
}
.arrow-option:nth-child(3)::before{
  background-color:#FCEAAE; /* yellow */
}
.arrow-option:nth-child(4)::before{
  background-color:#C9D9F8; /* periwinkle */
}

.arrow-option .arrow-number{
  position:relative;
  z-index:2;

  display:flex;
  align-items:center;
  justify-content:center;

  width:64%;
  min-height:40%;

  border-radius:0;

  background:transparent;

  color:#4a3f6b;

  font-size:clamp(24px,3vw,34px);
  font-weight:700;
  line-height:1;

  transform:translateY(-20%);

  text-shadow:
    0 2px 0 rgba(255,255,255,.55),
    0 2px 6px rgba(0,0,0,.10);

  transition:
    transform .2s ease,
    color .2s ease;
}

.arrow-option img{
  display:none;
}

.arrow-option:hover:not(:disabled){
  transform:translateY(-9px) scale(1.05);
}

.arrow-option:hover:not(:disabled)::before{
  transform:scale(1.035);
}

.arrow-option:hover:not(:disabled) .arrow-number{
  transform:translateY(-20%) scale(1.08);
  color:#6d4ca3;
}

.arrow-option:active:not(:disabled){
  transform:translateY(2px) scale(.97);
}

.arrow-option.correct-hit{
  animation:correctBalloon .65s ease forwards;
  pointer-events:none;
  z-index:5;
}

.arrow-option.correct-hit::after{
  content:"✓";
  position:absolute;
  right:5%;
  top:5%;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#55c878;
  color:#fff;
  font-size:23px;
  font-weight:800;
  box-shadow:0 3px 8px rgba(50,130,80,.28);
  z-index:5;
  animation:checkPop .35s ease;
}

@keyframes correctBalloon{
  0%{transform:scale(1);}
  45%{transform:scale(1.12) translateY(-8px);}
  100%{transform:scale(1.06) translateY(-5px);}
}

@keyframes checkPop{
  0%{transform:scale(0);}
  75%{transform:scale(1.15);}
  100%{transform:scale(1);}
}

.arrow-option.faded{
  opacity:0;
  pointer-events:none;
  animation:wrongDisappear .35s ease forwards;
}

@keyframes wrongDisappear{
  0%{
    opacity:1;
    transform:scale(1);
  }
  100%{
    opacity:0;
    transform:scale(.55) translateY(-14px);
  }
}

.arrow-option.shot{
  animation:wrongDisappear .35s ease forwards;
}

@keyframes balloonFloat{
  0%,100%{
    transform:translateY(0) rotate(-1deg);
  }
  50%{
    transform:translateY(-9px) rotate(1deg);
  }
}

/* =========================================================
   FLYING ARROW
   ========================================================= */

.flying-arrow{
  position:absolute;
  left:0;
  top:0;
  width:0;
  height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:50;
  opacity:0;
  transform:translate(0,0) rotate(0deg);
}

.flying-arrow.active{
  opacity:1;
  transition:transform .32s cubic-bezier(.35,.9,.4,1);
}

.flying-arrow img{
  width:40px;
  height:40px;
  object-fit:contain;
  transform:translate(-50%,-50%);
}

.flying-arrow .flying-number{
  position:absolute;

  font-weight:700;

  background:#ffffff;

/* =========================================================
   ODD NUMBERS — WOODEN SLATE OVERRIDES
   ========================================================= */

/* Never scroll on any screen. */
html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden !important;
  overscroll-behavior:none;
}

.quiz-card{
  width:100%;
  height:100dvh;
  min-height:0;
  overflow:hidden !important;
}

/* Pencil clip-art cursor for the entire template. */
html, body, .quiz-card, .quiz-card *,
button, button *, a, input, select, textarea, [role="button"]{
  cursor:default !important;
}

/* Content stays compact and centered rather than leaving large empty areas. */
.content-row{
  width:100%;
  max-width:1500px;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(8px,1.5vh,18px);
  padding:0;
  transform:none !important;
}

.question-heading{
  width:100%;
  margin:0;
  flex:0 0 auto;
}

.archery-area{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0;
  flex:0 0 auto;
}

/* Seven slates in ONE horizontal row. */
.options-row{
  width:100%;
  max-width:1500px;
  display:flex !important;
  flex-direction:row;
  flex-wrap:nowrap !important;
  justify-content:center;
  align-items:center;
  gap:clamp(8px,1.5vw,28px);
  padding:0;
  margin:0;
  overflow:visible;
}

/* Wooden-framed chalkboard/slate. Fixed size on desktop; never flex-shrinks. */
.arrow-option{
  position:relative;
  box-sizing:border-box;
  width:190px !important;
  height:145px !important;
  min-width:190px !important;
  max-width:190px !important;
  min-height:145px !important;
  max-height:145px !important;
  flex:0 0 190px !important;

  padding:10px !important;
  margin:0;
  border:0 !important;
  border-radius:2px !important;

  background:
    repeating-linear-gradient(
      90deg,
      #8d5438 0px,
      #b87855 3px,
      #9b5f42 6px,
      #c18462 9px,
      #8f563b 12px
    ) !important;

  box-shadow:
    0 5px 10px rgba(55,35,20,.22),
    inset 0 0 0 2px rgba(232,178,143,.65),
    inset 0 0 0 5px rgba(105,58,38,.55) !important;

  display:flex !important;
  align-items:center;
  justify-content:center;
  overflow:visible;
  transition:transform .2s ease, filter .2s ease;
  animation:none;
}

/* Inner black/green chalkboard surface. */
.arrow-option::before{
  content:"";
  position:absolute;
  inset:9px;

  background:
    radial-gradient(
      ellipse at 35% 25%,
      rgba(255,255,255,.035),
      transparent 42%
    ),
    linear-gradient(
      145deg,
      #151a11 0%,
      #10140d 55%,
      #0b0e09 100%
    );

  border:2px solid #68412f;
  border-radius:1px;

  box-shadow:
    inset 4px 4px 8px rgba(0,0,0,.55),
    inset -2px -2px 5px rgba(0,0,0,.45);

  z-index:0;
  transform:none !important;
  mask-image:none !important;
  -webkit-mask-image:none !important;
}

/* Remove the old balloon image completely. */
.arrow-option img{

</div>

<div id="finalPopup">
  <div class="finalpopup-box">
    <h2 class="final-heading">🎉 Amazing Job!</h2>
    <p id="finalScore"></p>
    <div id="stars">⭐⭐⭐</div>
    <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
  </div>
</div>

<!-- SOUNDS -->
<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>

/* =========================================================
   QUESTION DATA — from image
   ========================================================= */

const QUESTIONS = [
  {
    label: "Q1.",
    text: "Circle the odd numbers.",
    options: [8, 55, 21, 36, 49, 70, 27],
    answer: [55, 21, 49, 27]
  },
  {
    label: "Q2.",
    text: "Circle the odd numbers.",
    options: [19, 72, 87, 51, 63, 44, 38],
    answer: [19, 87, 51, 63]
  },
  {
    label: "Q3.",
    text: "Circle the odd numbers.",
    options: [25, 66, 99, 88, 35, 22, 40],
    answer: [25, 99, 35]
  }
];

const LABELS = ["Q1.", "Q2.", "Q3."];

/* =========================================================
   STATE
   ========================================================= */

const total = QUESTIONS.length;
let current = 0;
let shooting = false;
const state = QUESTIONS.map(() => ({
  answered: false,
  wrongPicks: [],
  selected: []
}));

/* =========================================================
   ELEMENTS
   ========================================================= */

const quizCard     = document.getElementById("quizCard");
const qLabel       = document.getElementById("qLabel");
const questionText = document.getElementById("questionText");
const optionsRow   = document.getElementById("optionsRow");
const flyingArrow  = document.getElementById("flyingArrow");
const flyingNumber = document.getElementById("flyingNumber");
const prevBtn      = document.getElementById("prevBtn");
const nextBtn      = document.getElementById("nextBtn");

const correctSound = document.getElementById("correctSound");
const wrongSound   = document.getElementById("wrongSound");
const homeBtn      = document.getElementById("homeBtn");
const hintBtn      = document.getElementById("hintBtn");
const hintOverlay  = document.getElementById("hintOverlay");
const closeHintBtn = document.getElementById("closeHintBtn");
const hintText     = document.getElementById("hintText");

/* =========================================================
   RENDER QUESTION
   ========================================================= */
   function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-UK";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

function renderQuestion(){

  const q  = QUESTIONS[current];
  const st = state[current];
  const answers = Array.isArray(q.answer) ? q.answer : [q.answer];

  qLabel.textContent = LABELS[current] || `Q${current + 1}.`;
  questionText.textContent = q.text;

  optionsRow.innerHTML = "";

  q.options.forEach((value) => {

    const btn = document.createElement("button");
    btn.className = "arrow-option";
    btn.type = "button";
    btn.dataset.value = String(value);

    const img = document.createElement("img");
    img.src = "";
    img.alt = "";
    btn.appendChild(img);

    const label = document.createElement("span");
    label.className = "arrow-number";
    label.textContent = value;
    btn.appendChild(label);

    if(st.answered){
      btn.disabled = true;
      if(answers.includes(value)){
        btn.classList.add("correct-hit");
      }else{
        btn.classList.add("faded");
      }
    }else if(st.wrongPicks.includes(value)){
      btn.disabled = true;
      btn.classList.add("faded");
    }else if(st.selected.includes(value)){
      btn.disabled = true;
      btn.classList.add("correct-hit");
    }else{
      btn.addEventListener("click", () => handleShoot(btn, value));
    }

    optionsRow.appendChild(btn);
  });

  prevBtn.disabled = current === 0;
  nextBtn.disabled = !st.answered || current === total - 1;
}

function localCenter(el){
  const stageRect = quizCard.getBoundingClientRect();
  const scale = stageRect.width / quizCard.offsetWidth || 1;
  const rect  = el.getBoundingClientRect();
  return {
    x: (rect.left - stageRect.left + rect.width / 2) / scale,
    y: (rect.top  - stageRect.top  + rect.height / 2) / scale
  };
}

function fireArrowAt(optionEl, targetEl, value, onDone){
  const from = localCenter(optionEl);
  const to   = localCenter(targetEl);
  const angle = Math.atan2(to.y - from.y, to.x - from.x) * (180 / Math.PI) + 90;

  flyingNumber.textContent = value;

  flyingArrow.style.display = "flex";
  flyingArrow.style.transition = "none";
  flyingArrow.style.transform  = `translate(${from.x}px, ${from.y}px) rotate(${angle}deg)`;
  flyingArrow.classList.add("active");

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      flyingArrow.style.transition = "transform .32s cubic-bezier(.35,.9,.4,1)";
      flyingArrow.style.transform  = `translate(${to.x}px, ${to.y}px) rotate(${angle}deg)`;
    });
  });

  setTimeout(() => {
    flyingArrow.classList.remove("active");
    flyingArrow.style.display = "none";
    onDone();
  },340);
}

function handleShoot(optionEl, value){

  const st = state[current];
  if(st.answered || shooting) return;

  const q = QUESTIONS[current];
  const answers = Array.isArray(q.answer) ? q.answer : [q.answer];
  shooting = true;

  optionsRow.querySelectorAll(".arrow-option").forEach((b) => {
    b.disabled = true;
  });

  if(answers.includes(value)){

    st.selected.push(value);

    optionEl.classList.remove("shot");
    optionEl.classList.add("correct-hit");

    correctSound.currentTime = 0;
    correctSound.play().catch(() => {});
    speak("correct");
    showPopup(true);
    fireConfetti();

    const allAnswered = answers.every((answer) => st.selected.includes(answer));

    if(allAnswered){
      st.answered = true;

      optionsRow.querySelectorAll(".arrow-option").forEach((b) => {
        const num = Number(b.dataset.value);
        if(!answers.includes(num) || !st.selected.includes(num)){
          b.disabled = true;
          b.classList.add("faded");
        }
      });

      nextBtn.disabled = current === total - 1;
      shooting = false;

      if(current === total - 1){
        setTimeout(() => {
          fireBigConfetti();
          showFinal();
        },1100);
      }
    }else{
      setTimeout(() => {
        optionsRow.querySelectorAll(".arrow-option").forEach((b) => {
          const num = Number(b.dataset.value);
          if(!st.selected.includes(num) && !st.wrongPicks.includes(num)){
            b.disabled = false;
          }
        });
        shooting = false;
      },500);
    }

  }else{

    st.wrongPicks.push(value);

    wrongSound.currentTime = 0;
    wrongSound.play().catch(() => {});
    speak("wrong");
    showPopup(false);

    setTimeout(() => {

      optionEl.classList.add("faded");
      optionEl.disabled = true;

      optionsRow.querySelectorAll(".arrow-option").forEach((b) => {
        const num = Number(b.dataset.value);
        if(!st.wrongPicks.includes(num) && !st.selected.includes(num) && !st.answered){
          b.disabled = false;
        }
      });

      shooting = false;

    },500);
  }
}

/* =========================================================
   POPUP
   ========================================================= */

function showPopup(isCorrect){
  const popup = document.getElementById("answerPopup");
  const icon  = document.getElementById("popupIcon");
  const title = document.getElementById("popupTitle");
  const msg   = document.getElementById("popupMsg");

  popup.className = "popup " + (isCorrect ? "correct" : "wrong");
  popup.style.display = "flex";

  if(isCorrect){
    icon.textContent = "🎉";
    title.textContent = "Correct!";
    msg.textContent = "Great job!";
  }else{
    icon.textContent = "❌";
    title.textContent = "Try Again!";
    msg.textContent = "That's not an odd number. Try again!";
  }

  clearTimeout(showPopup._t);
  showPopup._t = setTimeout(() => {
    popup.style.display = "none";
  },1100);
}

/* =========================================================
   FINAL
   ========================================================= */

function showFinal(){
  const finalPopup = document.getElementById("finalPopup");
  finalPopup.style.display = "flex";
  document.getElementById("finalScore").textContent = `${total} / ${total} Completed`;
  document.getElementById("stars").textContent = "⭐⭐⭐";
}

/* =========================================================
   CONFETTI
   ========================================================= */

function fireConfetti(){
  if(!window.confetti) return;
  confetti({
    particleCount:24,
    spread:55,
    startVelocity:26,
    origin:{ x:.5, y:.4 },
    colors:["#e6473f","#3a6fd8","#f7b733","#8bba8a","#c9a8e0"]
  });
}

function fireBigConfetti(){
  if(!window.confetti) return;
  const end = Date.now() + 1800;
  (function frame(){
    confetti({ particleCount:6, angle:60,  spread:55, origin:{ x:0 } });
    confetti({ particleCount:6, angle:120, spread:55, origin:{ x:1 } });
    if(Date.now() < end){ requestAnimationFrame(frame); }
  })();
}

/* =========================================================
   NAV
   ========================================================= */

prevBtn.addEventListener("click", () => {
  if(current === 0) return;
  current--;
  renderQuestion();
});

nextBtn.addEventListener("click", () => {
  if(nextBtn.disabled) return;
  if(current < total - 1){
    current++;
    renderQuestion();
  }
});

homeBtn.addEventListener("click", () => {
  window.location.href = "../Grade2_chapter1.html";
});

hintBtn.addEventListener("click", () => {
  hintText.textContent = `Look at all the numbers. Odd numbers end in 1, 3, 5, 7, or 9.`;
  hintOverlay.classList.add("show");
});

closeHintBtn.addEventListener("click", () => {
  hintOverlay.classList.remove("show");
});

hintOverlay.addEventListener("click", (event) => {
  if(event.target === hintOverlay) {
    hintOverlay.classList.remove("show");
  }
});

/* =========================================================
   INITIALIZE
   ========================================================= */

renderQuestion();

</script>

</body>
</html>
