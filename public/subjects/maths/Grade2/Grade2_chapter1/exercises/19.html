<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fill in the boxes</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="../assets/css/reuse.css">

<style>
*{
  box-sizing:border-box;
  font-family:"Livvic",sans-serif;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  overscroll-behavior:none;
  user-select:none;
  -webkit-user-select:none;
}

body{
  min-height:100dvh;
}

.quiz-card{
  width:100%;
  height:100dvh;
  min-height:0;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:
    clamp(6px,1.5vh,22px)
    clamp(8px,2.5vw,50px)
    clamp(5px,1vh,14px);
  overflow:hidden;
  background:#F8F4FF;
}

.topbar{
  width:100%;
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  min-height:clamp(28px,5vh,48px);
}

.icon-flat{
  background:transparent;
  border:0;
  font-size:clamp(20px,2.2vw,32px);
  line-height:1;
  padding:2px 6px;
  cursor:pointer;
  flex:0 0 auto;
  transition:transform .2s ease;
}

.icon-flat:hover{transform:scale(1.1);}

.topbar-right{
  display:flex;
  align-items:center;
}

.heading{
  width:100%;
  margin:clamp(2px,1vh,10px) 0 0;
  text-align:center;
  color:#2f2f2f;
  font-size:clamp(17px,2.1vw,34px);
  line-height:1.15;
  flex:0 0 auto;
}

.content-row{
  width:100%;
  max-width:1500px;
  min-height:0;
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(4px,1.2vh,16px);
}

.question-heading{
  width:100%;
  display:flex;
  align-items:baseline;
  justify-content:center;
  flex-wrap:wrap;
  gap:clamp(4px,.7vw,9px);
  flex:0 0 auto;
  margin:0;
  text-align:center;
}

.qlabel,.question-text{
  margin:0;
  color:#2f2f2f;
}

.qlabel{
  font-size:clamp(18px,2.2vw,34px);
}

.question-text{
  font-size:clamp(17px,2.1vw,32px);
}

.equation-board{
  width:100%;
  max-width:1450px;
  min-height:0;
  flex:1 1 auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  justify-content:center;
  column-gap:clamp(5px,2vw,30px);
  padding:clamp(2px,1vh,12px) 0;
}

.visual-group{
  min-width:0;
  min-height:0;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(5px,1vh,14px);
}

.pictures{
  width:100%;
  max-width:min(32vw,500px);
  min-height:0;
  flex:1 1 auto;
  display:flex;
  flex-wrap:wrap;
  align-content:center;
  justify-content:center;
  align-items:center;
  gap:clamp(4px,1vw,16px);
  overflow:hidden;
}

.picture{
  width:clamp(50px,8vw,140px);
  height:clamp(50px,12vh,124px);
  object-fit:contain;
  display:block;
  flex:0 0 auto;
  pointer-events:none;
  -webkit-user-drag:none;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.08));
}

.picture.small{
  width:clamp(44px,7vw,124px);
  height:clamp(44px,10.5vh,128px);
}

.operator{
  flex:0 0 auto;
  color:#2f2f2f;
  font-size:clamp(22px,3vw,42px);
  line-height:1;
  margin-top:-2px;
}

.answer-wrap{
  width:clamp(58px,8vw,112px);
  height:clamp(38px,7vh,62px);
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
}

.answer-input{
  width:100%;
  height:100%;
  border:2px solid #ff8a3d;
  border-radius:7px;
  background:#fff;
  color:#2f2f2f;
  outline:none;
  text-align:center;
  font-size:clamp(20px,2.4vw,34px);
  font-weight:500;
  line-height:1;
  padding:4px 8px;
  user-select:text;
  -webkit-user-select:text;
  touch-action:auto;
}

.answer-input:focus{
  border-color:#ff8a3d;
  box-shadow:0 0 0 2px rgba(255,138,61,.12);
}

.answer-input.correct{
  border:3px solid #35c759;
  background:#f4fff6;
  color:#237a37;
}

.answer-input.wrong{
  border-color:#e6473f;
  animation:shake .28s ease;
}

.answer-input:disabled{
  opacity:1;
  cursor:default;
  -webkit-text-fill-color:#237a37;
}

/* The answer box is typed like the others; it only turns
   green once the child enters the correct total. */
.answer-input.result{
  font-weight:700;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  75%{transform:translateX(5px)}
}

.nav{
  width:100%;
  flex:0 0 auto;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:clamp(8px,2vw,26px);
  padding:3px 0 0;
}

/* Keep popups usable on every screen size. */
.hint-overlay,
#finalPopup{
  position:fixed !important;
  inset:0 !important;
  width:100vw !important;
  height:100dvh !important;
  padding:clamp(12px,4vw,40px) !important;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.hint-overlay.show,
#finalPopup{
  /* JS controls finalPopup display; hint uses .show */
}

.hint-box,
.finalpopup-box{
  width:min(92vw,520px);
  max-height:90dvh;
  overflow:auto;
  padding:clamp(18px,4vw,34px);
  border-radius:clamp(12px,2vw,22px);
}

@media (max-width:700px){
  .quiz-card{
    padding-left:clamp(5px,2vw,14px);
    padding-right:clamp(5px,2vw,14px);
  }

  .equation-board{
    column-gap:clamp(3px,1.5vw,10px);
  }

  .pictures{
    max-width:min(30vw,250px);
    gap:clamp(3px,1.2vw,9px);
  }

  .picture{
    width:clamp(38px,11vw,78px);
    height:clamp(38px,12vh,82px);
  }

  .picture.small{
    width:clamp(34px,10vw,70px);
    height:clamp(34px,10vh,74px);
  }

  .answer-wrap{
    width:clamp(50px,14vw,78px);
    height:clamp(36px,6.5vh,52px);
  }

  .answer-input{
    font-size:clamp(18px,5vw,27px);
    padding:2px 4px;
  }
}

@media (max-width:420px){
  .heading{font-size:clamp(15px,4.5vw,19px);}
  .qlabel{font-size:clamp(16px,5vw,21px);}
  .question-text{font-size:clamp(15px,4.5vw,19px);}

  .equation-board{
    column-gap:2px;
  }

  .pictures{
    max-width:28vw;
    gap:2px;
  }

  .picture{
    width:clamp(27px,9vw,48px);
    height:clamp(27px,8vh,50px);
  }

  .picture.small{
    width:clamp(24px,8vw,43px);
    height:clamp(24px,7vh,45px);
  }

  .operator{
    font-size:clamp(18px,6vw,27px);
  }

  .answer-wrap{
    width:clamp(43px,14vw,60px);
    height:clamp(32px,6vh,44px);
  }

  .answer-input{
    font-size:clamp(16px,5.5vw,22px);
  }
}

/* Short landscape phones/tablets: prioritize fitting vertically. */
@media (max-height:650px) and (orientation:landscape){
  .quiz-card{
    padding-top:3px;
    padding-bottom:2px;
  }

  .topbar{min-height:24px;}
  .heading{margin-top:0;}
  .content-row{gap:2px;}
  .equation-board{padding:0;}
  .pictures{gap:2px;}

  .picture{
    width:clamp(30px,7vw,72px);
    height:clamp(30px,11vh,74px);
  }

  .picture.small{
    width:clamp(27px,6.5vw,66px);
    height:clamp(27px,10vh,68px);
  }

  .answer-wrap{
    height:clamp(30px,8vh,48px);
  }

  .nav{padding-top:1px;}
}

/* Very large screens: prevent content from becoming tiny. */
@media (min-width:1600px) and (min-height:800px){
  .content-row{max-width:1650px;}
  .equation-board{max-width:1600px;}
  .picture{
    width:clamp(72px,10vw,90px);
    height:clamp(72px,10vh,100px);
  }
  .picture.small{
    width:clamp(72px,10vw,90px);
    height:clamp(72px,10vh,100px);
  }
}
</style>
</head>

<body>

<div class="quiz-card" id="quizCard">

  <div class="topbar">
    <button class="icon-flat" id="homeBtn" style="visibility: hidden;" title="Home" aria-label="Home">🏠</button>

    <div class="topbar-right">
      <button class="icon-flat" id="hintBtn" title="Hint" aria-label="Hint">💡</button>
    </div>
  </div>

  <p class="heading"> Fill in the boxes.</p>

  <div class="content-row">

    <div class="question-heading">
      <span class="qlabel" id="qLabel">Q1.</span>
      <span class="question-text" id="questionText">Add the numbers.</span>
    </div>

    <div class="equation-board" id="equationBoard"></div>

  </div>

  <div class="nav">
    <button class="prev" id="prevBtn" disabled>← Prev</button>
    <button class="next" id="nextBtn" disabled>Next →</button>
  </div>

</div>

<div class="hint-overlay" id="hintOverlay" aria-live="polite">
  <div class="hint-box">
    <h3>Hint</h3>
    <p id="hintText">Count the pictures in each group and fill in the boxes.</p>
    <button class="popup-btn" id="closeHintBtn">Got it!</button>
  </div>
</div>

<!-- POPUPS — supplied by reuse.css -->
<div id="answerPopup" class="popup">
  <div class="popup-content">
    <div class="popup-icon" id="popupIcon"></div>
    <h3 id="popupTitle"></h3>
    <p id="popupMsg"></p>
  </div>
</div>

<div id="finalPopup">
  <div class="finalpopup-box">
    <h2 class="final-heading">🎉 Amazing Job!</h2>
    <p id="finalScore"></p>
    <div id="stars">⭐⭐⭐</div>
    <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
/* =========================================================
   IMAGE ASSETS
   Replace only these filenames if your project uses
   different asset names.
   ========================================================= */

const IMG_SRC = {
  balloon:"../assets/images/ballon.png",
  frog:"../assets/images/frog.png",
  apple:"../assets/images/apple.png",
   icecream:"../assets/images/ice-cream.png"
};

/* =========================================================
   QUESTION DATA — EXACT COUNTS FROM THE PROVIDED IMAGE
   Q1: 3 + 3 = 6
   Q2: 4 + 3 = 7
   Q3: 10 - 6 = 4
   ========================================================= */

const QUESTIONS = [
  {
    label:"Q1.",
    text:"Add the numbers.",
    operation:"+",
    left:3,
    right:3,
    answer:6,
    image:IMG_SRC.balloon,
    alt:"Balloon",
    hint:"Count the 3 balloons in each group. Add them together."
  },
  {
    label:"Q2.",
    text:"Add the numbers.",
    operation:"+",
    left:7,
    right:6,
    answer:13,
    image:IMG_SRC.frog,
    alt:"Frog",
    hint:"Count the 4 frogs and the 3 frogs. Add them together."
  },
  {
    label:"Q3.",
    text:"Subtract the numbers.",
    operation:"−",
    left:10,
    right:6,
    answer:4,
    image:IMG_SRC.apple,
    alt:"Apple",
    hint:"There are 10 apples. Take away 6 apples. Count what is left."
  },
  {
  label:"Q4.",
  text:"Subtract the numbers.",
  operation:"−",
  left:7,
  right:3,
  answer:4,
  image:IMG_SRC.icecream,
  alt:"Ice cream",
  hint:"There are 7 ice creams. Take away 3 ice creams. Count what is left."
}
];

const total = QUESTIONS.length;
let current = 0;

/*
  first = whether the first input is locked
  second = whether the second input is locked
  answered = whole question completed
*/
const state = QUESTIONS.map(() => ({
  first:false,
  second:false,
  third:false,
  answered:false
}));

const qLabel = document.getElementById("qLabel");
const questionText = document.getElementById("questionText");
const equationBoard = document.getElementById("equationBoard");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

const homeBtn = document.getElementById("homeBtn");
const hintBtn = document.getElementById("hintBtn");
const hintOverlay = document.getElementById("hintOverlay");
const closeHintBtn = document.getElementById("closeHintBtn");
const hintText = document.getElementById("hintText");

function speak(text){
  if(!window.speechSynthesis) return;

  speechSynthesis.cancel();

  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-UK";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;

  speechSynthesis.speak(msg);
}

function showPopup(isCorrect,titleOverride,msgOverride){
  const popup = document.getElementById("answerPopup");
  const icon = document.getElementById("popupIcon");
  const title = document.getElementById("popupTitle");
  const msg = document.getElementById("popupMsg");

  popup.className = "popup " + (isCorrect ? "correct" : "wrong");
  popup.style.display = "flex";

  if(isCorrect){
    icon.textContent = "🎉";
    title.textContent = titleOverride || "Correct!";
    msg.textContent = msgOverride || "Great job!";
  }else{
    icon.textContent = "❌";
    title.textContent = titleOverride || "Try Again!";
    msg.textContent = msgOverride || "Check your answer.";
  }

  clearTimeout(showPopup._t);

  showPopup._t = setTimeout(() => {
    popup.style.display = "none";
  },1100);
}

function fireConfetti(){
  if(!window.confetti) return;

  confetti({
    particleCount:24,
    spread:55,
    startVelocity:26,
    origin:{x:.5,y:.4},
    colors:["#e6473f","#3a6fd8","#f7b733","#8bba8a","#c9a8e0"]
  });
}

function fireBigConfetti(){
  if(!window.confetti) return;

  const end = Date.now() + 1800;

  (function frame(){
    confetti({
      particleCount:6,
      angle:60,
      spread:55,
      origin:{x:0}
    });

    confetti({
      particleCount:6,
      angle:120,
      spread:55,
      origin:{x:1}
    });

    if(Date.now() < end){
      requestAnimationFrame(frame);
    }
  })();
}

function makePictures(container,count,imageSrc,alt,isSmall=false){
  for(let i=0;i<count;i++){
    const img = document.createElement("img");

    img.className = "picture" + (isSmall ? " small" : "");
    img.src = imageSrc;
    img.alt = alt;
    img.draggable = false;

    container.appendChild(img);
  }
}

function createGroup(count,q,isSmall=false){
  const group = document.createElement("div");
  group.className = "visual-group";

  const pictures = document.createElement("div");
  pictures.className = "pictures";

  makePictures(
    pictures,
    count,
    q.image,
    q.alt,
    isSmall
  );

  const answerWrap = document.createElement("div");
  answerWrap.className = "answer-wrap";

  group.appendChild(pictures);
  group.appendChild(answerWrap);

  return {
    group,
    answerWrap
  };
}

function createInput(index,expected,locked,value){
  const input = document.createElement("input");

  input.className = "answer-input";
  input.type = "text";
  input.inputMode = "numeric";
  input.autocomplete = "off";
  input.maxLength = 2;
  const stateKey = ["first","second","third"][index];
  const labels = ["First number","Second number","Answer"];

  input.setAttribute("aria-label",labels[index]);

  if(index === 2){
    input.classList.add("result");
  }

  if(value !== undefined && value !== null){
    input.value = value;
  }

  if(locked){
    input.disabled = true;
    input.classList.add("correct");
  }

 function validateInput(){
  if(input.disabled) return;

  input.value = input.value.replace(/\D/g,"").slice(0,2);

  if(input.value === "") return;

  const typed = input.value;
  const expectedText = String(expected);

  // Allow first digit when the answer has 2 digits, e.g. "10"
  if(expectedText.length > 1 && typed.length < expectedText.length){
    input.classList.remove("wrong");
    return;
  }

  const number = Number(typed);

  if(number === expected){
    input.classList.remove("wrong");
    input.classList.add("correct");
    input.disabled = true;

    state[current][stateKey] = true;

    // Answer box celebration is handled once in updateQuestionState
    if(index !== 2){
      correctSound.currentTime = 0;
      correctSound.play().catch(() => {});

      speak("Correct!");
      showPopup(true,"Correct!","That number is correct.");
    }

    updateQuestionState();

  }else{
    input.classList.remove("wrong");
    void input.offsetWidth;
    input.classList.add("wrong");

    wrongSound.currentTime = 0;
    wrongSound.play().catch(() => {});

    speak("Try again.");
    showPopup(
      false,
      "Try Again!",
      index === 2 ? "Add the two numbers again." : "Count the pictures again."
    );

    setTimeout(() => {
      if(!input.disabled){
        input.classList.remove("wrong");
        input.select();
      }
    },350);
  }
}

input.addEventListener("input",validateInput);

input.addEventListener("keydown",event => {
  if(event.key === "Enter"){
    event.preventDefault();
    validateInput();
    input.blur();
  }
});

  return input;
}

function renderQuestion(){
  const q = QUESTIONS[current];
  const st = state[current];

  qLabel.textContent = q.label;
  questionText.textContent = q.text;

  equationBoard.innerHTML = "";

  const left = createGroup(q.left,q,false);
  const right = createGroup(q.right,q,q.right >= 6);

  const result = document.createElement("div");
  result.className = "visual-group";

  const resultPictures = document.createElement("div");
  resultPictures.className = "pictures";

  /* The result group visually matches the source image. */
  makePictures(
    resultPictures,
    q.answer,
    q.image,
    q.alt,
    q.answer >= 6
  );

  const resultWrap = document.createElement("div");
  resultWrap.className = "answer-wrap";

  const firstInput = createInput(
    0,
    q.left,
    st.first,
    st.first ? q.left : ""
  );

  const secondInput = createInput(
    1,
    q.right,
    st.second,
    st.second ? q.right : ""
  );

  left.answerWrap.appendChild(firstInput);
  right.answerWrap.appendChild(secondInput);

  const resultInput = createInput(
    2,
    q.answer,
    st.third,
    st.third ? q.answer : ""
  );

  resultWrap.appendChild(resultInput);
  result.appendChild(resultPictures);
  result.appendChild(resultWrap);

  const plus1 = document.createElement("div");
  plus1.className = "operator";
  plus1.textContent = q.operation;

  const equals = document.createElement("div");
  equals.className = "operator";
  equals.textContent = "=";

  equationBoard.appendChild(left.group);
  equationBoard.appendChild(plus1);
  equationBoard.appendChild(right.group);
  equationBoard.appendChild(equals);
  equationBoard.appendChild(result);

  updateQuestionState();
}

function updateQuestionState(){
  const q = QUESTIONS[current];
  const st = state[current];

  if(st.first && st.second && st.third && !st.answered){
    st.answered = true;

    /*
      All three boxes are typed by the child. Celebrate only
      after the answer box is also correct.
    */
    setTimeout(() => {
      renderQuestion();

      correctSound.currentTime = 0;
      correctSound.play().catch(() => {});

      speak("Correct!");
      showPopup(true,"Correct!","The answer is " + q.answer + ".");
      fireConfetti();

      nextBtn.disabled = current === total - 1;

      if(current === total - 1){
        setTimeout(() => {
          fireBigConfetti();
          showFinal();
        },1100);
      }
    },250);

    return;
  }

  prevBtn.disabled = current === 0;
  nextBtn.disabled = !st.answered || current === total - 1;
}

function showFinal(){
  const finalPopup = document.getElementById("finalPopup");

  finalPopup.style.display = "flex";

  document.getElementById("finalScore").textContent =
    `${total} / ${total} Completed`;

  document.getElementById("stars").textContent = "⭐⭐⭐";
}

prevBtn.addEventListener("click",() => {
  if(current === 0) return;

  current--;
  renderQuestion();
});

nextBtn.addEventListener("click",() => {
  if(nextBtn.disabled) return;

  if(current < total - 1){
    current++;
    renderQuestion();
  }
});

homeBtn.addEventListener("click",() => {
  window.location.href = "../Grade2_chapter1.html";
});

hintBtn.addEventListener("click",() => {
  hintText.textContent = QUESTIONS[current].hint;
  hintOverlay.classList.add("show");
  hintOverlay.style.display = "flex";
});

closeHintBtn.addEventListener("click",() => {
  hintOverlay.classList.remove("show");
  hintOverlay.style.display = "none";
});

hintOverlay.addEventListener("click",event => {
  if(event.target === hintOverlay){
    hintOverlay.classList.remove("show");
  hintOverlay.style.display = "none";
  }
});

renderQuestion();
</script>

</body>
</html>
