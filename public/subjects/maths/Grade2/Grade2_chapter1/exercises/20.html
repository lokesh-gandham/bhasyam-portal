/* =========================================================

<script>
/* =========================================================
   TEACHER MASCOT IMAGES
   Replace only these filenames if your project uses
   different asset names.
   ========================================================= */

const TEACHER_POINT = "../assets/images/teacher.png";
const TEACHER_CLAP  = "../assets/images/teacherclap.png";

/* =========================================================
   QUESTION DATA — EXACT VALUES FROM THE PROVIDED IMAGE
   a) 5 + 0 = ▢        -> 5   (sum)
   b) 9 − ▢ = 9        -> 0   (difference)
   c) ▢ + 0 = 10       -> 10  (sum)
   d) 1 + 12 = ▢       -> 13  (sum)
   e) ▢ − 15 = 0       -> 15  (difference)
   f) 17 − ▢ = 16      -> 1   (difference)
   ========================================================= */

const QUESTIONS = [
  { label:"Q1.", left:5,  op:"+", right:0,  result:5,  blank:"result", distractors:[0,6],  hint:"5 plus 0 is still 5. Drag the 5 into the box." },
  { label:"Q2.", left:9,  op:"−", right:0,  result:9,  blank:"right",  distractors:[9,1],  hint:"9 minus what number leaves 9? Drag the 0 into the box." },
  { label:"Q3.", left:10, op:"+", right:0,  result:10, blank:"left",   distractors:[0,9],  hint:"What number plus 0 makes 10? Drag the 10 into the box." },
  { label:"Q4.", left:1,  op:"+", right:12, result:13, blank:"result", distractors:[11,12],hint:"Add 1 and 12 together. Drag the total into the box." },
  { label:"Q5.", left:15, op:"−", right:15, result:0,  blank:"left",   distractors:[0,16], hint:"What number minus 15 leaves 0? Drag the 15 into the box." },
  { label:"Q6.", left:17, op:"−", right:1,  result:16, blank:"right",  distractors:[0,17], hint:"17 minus what number leaves 16? Drag the 1 into the box." }
];

const total = QUESTIONS.length;
let current = 0;

const state = QUESTIONS.map(() => ({ answered:false }));

const qLabel = document.getElementById("qLabel");
const questionText = document.getElementById("questionText");
const equationBoard = document.getElementById("equationBoard");
const optionsRow = document.getElementById("optionsRow");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

const homeBtn = document.getElementById("homeBtn");
const hintBtn = document.getElementById("hintBtn");
const hintOverlay = document.getElementById("hintOverlay");
const closeHintBtn = document.getElementById("closeHintBtn");
const hintText = document.getElementById("hintText");

const teacherImg = document.getElementById("teacherImg");

function expectedValue(q){
  if(q.blank === "left") return q.left;
  if(q.blank === "right") return q.right;
  return q.result;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function speak(text){
  if(!window.speechSynthesis) return;

  speechSynthesis.cancel();

  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-UK";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;

  speechSynthesis.speak(msg);
}

function showPopup(isCorrect,titleOverride,msgOverride){
  const popup = document.getElementById("answerPopup");
  const icon = document.getElementById("popupIcon");
  const title = document.getElementById("popupTitle");
  const msg = document.getElementById("popupMsg");

  popup.className = "popup " + (isCorrect ? "correct" : "wrong");
  popup.style.display = "flex";

  if(isCorrect){
    icon.textContent = "🎉";
    title.textContent = titleOverride || "Correct!";
    msg.textContent = msgOverride || "Great job!";
  }else{
    icon.textContent = "❌";
    title.textContent = titleOverride || "Try Again!";
    msg.textContent = msgOverride || "Check your answer.";
  }

  clearTimeout(showPopup._t);

  showPopup._t = setTimeout(() => {
    popup.style.display = "none";
  },1100);
}

function fireConfetti(){
  if(!window.confetti) return;

  confetti({
    particleCount:24,
    spread:55,
    startVelocity:26,
    origin:{x:.5,y:.4},
    colors:["#e6473f","#3a6fd8","#f7b733","#8bba8a","#c9a8e0"]
  });
}

function fireBigConfetti(){
  if(!window.confetti) return;

  const end = Date.now() + 1800;

  (function frame(){
    confetti({
      particleCount:6,
      angle:60,
      spread:55,
      origin:{x:0}
    });

    confetti({
      particleCount:6,
      angle:120,
      spread:55,
      origin:{x:1}
    });

    if(Date.now() < end){
      requestAnimationFrame(frame);
    }
  })();
}

/* ---- teacher reactions ---- */

function teacherShakeHead(){
  teacherImg.classList.remove("pop");
  void teacherImg.offsetWidth;
  teacherImg.classList.add("shake");

  setTimeout(() => {
    teacherImg.classList.remove("shake");
  },500);
}

function teacherClap(){
  teacherImg.classList.remove("shake");
  teacherImg.src = TEACHER_CLAP;
  void teacherImg.offsetWidth;
  teacherImg.classList.add("pop");
}

function teacherReset(){
  teacherImg.classList.remove("pop","shake");
  teacherImg.src = TEACHER_POINT;
}

/* ---- equation rendering ---- */

function makeNumTerm(value){
  const wrap = document.createElement("div");
  wrap.className = "term";

  const num = document.createElement("div");
  num.className = "term-num";
  num.textContent = value;

  wrap.appendChild(num);
  return wrap;
}

function makeDropzoneTerm(filledValue){
  const wrap = document.createElement("div");
  wrap.className = "term";

  const zone = document.createElement("div");
  zone.className = "dropzone";
  zone.id = "dropZone";

  if(filledValue !== undefined && filledValue !== null){
    zone.classList.add("filled");
    zone.textContent = filledValue;
  }

  wrap.appendChild(zone);
  return wrap;
}

function rectsOverlap(a,b){
  return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
}

function attachDrag(chip,value,expected,dropZone){
  let dragging = false;
  let startX = 0;
  let startY = 0;

  function onPointerDown(event){
    if(chip.disabled === true || chip.classList.contains("used")) return;

    dragging = true;
    startX = event.clientX;
    startY = event.clientY;

    chip.classList.add("dragging");
    chip.setPointerCapture(event.pointerId);
  }

  function onPointerMove(event){
    if(!dragging) return;

    const dx = event.clientX - startX;
    const dy = event.clientY - startY;

    chip.style.transform = `translate(${dx}px,${dy}px)`;

    const chipRect = chip.getBoundingClientRect();
    const zoneRect = dropZone.getBoundingClientRect();

    if(rectsOverlap(chipRect,zoneRect)){
      dropZone.classList.add("drag-over");
    }else{
      dropZone.classList.remove("drag-over");
    }
  }

  function onPointerUp(event){
    if(!dragging) return;

    dragging = false;
    chip.classList.remove("dragging");
    dropZone.classList.remove("drag-over");

    const chipRect = chip.getBoundingClientRect();
    const zoneRect = dropZone.getBoundingClientRect();
    const dropped = rectsOverlap(chipRect,zoneRect);

    if(!dropped){
      chip.style.transition = "transform .25s ease";
      chip.style.transform = "translate(0,0)";
      setTimeout(() => { chip.style.transition = ""; },260);
      return;
    }

    if(value === expected){
      chip.classList.add("correct","used");
      state[current].answered = true;

      correctSound.currentTime = 0;
      correctSound.play().catch(() => {});

      speak("Correct!");
      showPopup(true,"Correct!","The missing number is " + expected + ".");
      fireConfetti();
      teacherClap();

      Array.from(optionsRow.querySelectorAll(".option-chip")).forEach(c => {
        c.disabled = true;
      });

      setTimeout(() => {
       renderQuestion(false);

        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === total - 1;

        if(current === total - 1){
          setTimeout(() => {
            fireBigConfetti();
            showFinal();
          },900);
        }
      },450);

    }else{
      chip.style.transition = "transform .25s ease";
      chip.style.transform = "translate(0,0)";
      chip.classList.add("wrong");
      dropZone.classList.add("wrong-flash");

      wrongSound.currentTime = 0;
      wrongSound.play().catch(() => {});

      speak("Try again.");
      showPopup(false,"Try Again!","Look at the equation again.");
      teacherShakeHead();

      setTimeout(() => {
        chip.classList.remove("wrong");
        chip.style.transition = "";
        dropZone.classList.remove("wrong-flash");
      },400);
    }
  }

  chip.addEventListener("pointerdown",onPointerDown);
  chip.addEventListener("pointermove",onPointerMove);
  chip.addEventListener("pointerup",onPointerUp);
  chip.addEventListener("pointercancel",onPointerUp);
}

function renderQuestion(resetTeacher = true){
  const q = QUESTIONS[current];
  const st = state[current];
  const expected = expectedValue(q);

  qLabel.textContent = q.label;
  questionText.textContent = q.op === "+" ? "Find the sum." : "Find the difference.";

  equationBoard.innerHTML = "";

  const leftTerm = q.blank === "left"
    ? makeDropzoneTerm(st.answered ? q.left : undefined)
    : makeNumTerm(q.left);

  const rightTerm = q.blank === "right"
    ? makeDropzoneTerm(st.answered ? q.right : undefined)
    : makeNumTerm(q.right);

  const resultTerm = q.blank === "result"
    ? makeDropzoneTerm(st.answered ? q.result : undefined)
    : makeNumTerm(q.result);

  const opSign = document.createElement("div");
  opSign.className = "operator";
  opSign.textContent = q.op;

  const equalsSign = document.createElement("div");
  equalsSign.className = "operator";
  equalsSign.textContent = "=";

  equationBoard.appendChild(leftTerm);
  equationBoard.appendChild(opSign);
  equationBoard.appendChild(rightTerm);
  equationBoard.appendChild(equalsSign);
  equationBoard.appendChild(resultTerm);

  optionsRow.innerHTML = "";

  if(!st.answered){
    const dropZone = equationBoard.querySelector("#dropZone");
    const choices = shuffle([expected, ...q.distractors]);

    choices.forEach(value => {
      const chip = document.createElement("div");
      chip.className = "option-chip";
      chip.textContent = value;
      optionsRow.appendChild(chip);

      attachDrag(chip,value,expected,dropZone);
    });
  }

 if(resetTeacher){
  teacherReset();
}

  prevBtn.disabled = current === 0;
  nextBtn.disabled = !st.answered || current === total - 1;
}

function showFinal(){
  const finalPopup = document.getElementById("finalPopup");

  finalPopup.style.display = "flex";

  document.getElementById("finalScore").textContent =
    `${total} / ${total} Completed`;

  document.getElementById("stars").textContent = "⭐⭐⭐";
}

prevBtn.addEventListener("click",() => {
  if(current === 0) return;

  current--;
  renderQuestion();
});

nextBtn.addEventListener("click",() => {
  if(nextBtn.disabled) return;

  if(current < total - 1){
    current++;
    renderQuestion();
  }
});

homeBtn.addEventListener("click",() => {
  window.location.href = "../Grade2_chapter1.html";
});

hintBtn.addEventListener("click",() => {
  hintText.textContent = QUESTIONS[current].hint;
  hintOverlay.classList.add("show");
});

closeHintBtn.addEventListener("click",() => {
  hintOverlay.classList.remove("show");
});

hintOverlay.addEventListener("click",event => {
  if(event.target === hintOverlay){
    hintOverlay.classList.remove("show");
  }
});

renderQuestion();
</script>
