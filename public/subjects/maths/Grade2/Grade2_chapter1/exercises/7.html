<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Names → Numerals</title>

  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../assets/css/reuse.css">

  <style>
    /* =========================================================
   RESET
   ========================================================= */

    * {
      box-sizing: border-box;
      font-family: "Livvic", sans-serif;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fffaf2;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body,
    .quiz-card,
    .quiz-card * {
      cursor: default !important;
    }

    .home-btn {
      position: absolute;
      left: 14px;
      top: 18px;
      width: 46px;
      height: 46px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      background: linear-gradient(145deg, #8b6fe0, #6f42c1);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer !important;
      z-index: 100;
      box-shadow:
        0 4px 0 #4f2e93,
        0 6px 10px rgba(79, 46, 147, 0.22);
      transition: all .15s ease;
      display: none;
    }

    .home-btn:hover {
      transform: translateY(-3px) scale(1.06);
    }

    .home-btn:active {
      transform: translateY(2px) scale(.96);
      box-shadow: 0 2px 0 #4f2e93;
    }

    .home-btn i {
      font-size: 21px;
      line-height: 1;
    }




    /* =========================================================
   QUIZ CARD
   ========================================================= */

    .quiz-card {
      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding:
        clamp(18px, 3vh, 35px) clamp(15px, 4vw, 60px);

      overflow: hidden;
    }


    /* =========================================================
   TITLE
   ========================================================= */

    .heading {
      margin: 0;
      width: 100%;

      text-align: center;

      font-size: 30px;
      line-height: 1.25;
      /* font-weight:700; */

      color: #2f2f2f;
      margin-top: -20px;
    }


    /* =========================================================
   MAIN CONTENT
   ========================================================= */

    .content-row {
      width: 100%;
      max-width: 700px;

      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: clamp(12px, 2vh, 24px);

      min-height: 0;
    }


    /* =========================================================
   QUESTION — Q1. EIGHT SAME LINE
   ========================================================= */

    .question-heading {
      width: 100%;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      gap: 10px;
      margin-top: 22px;
      font-size: 30px;

      flex: 0 0 auto;
    }

    .qlabel {
      margin: 0;

      font-size: clamp(23px, 3vw, 34px);
      line-height: 1.2;

      /* font-weight:800; */
      color: #2f2f2f;
    }

    .question-text {
      margin: 0;
      margin-top: 6px;

      font-size: 30px;
      line-height: 1.2;

      /* font-weight:700; */
      color: #2f2f2f;

      text-align: center;
    }


    /* =========================================================
   IMAGE
   ========================================================= */

    .image-wrap {
      width: 100%;
      max-width: 330px;

      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 8px;

      flex: 0 0 auto;
    }

    .image-placeholder {
      width: 100%;

      aspect-ratio: 1 / 1.15;

      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      border: none;
      box-shadow: none;

      overflow: hidden;
    }

    .image-placeholder img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      border: none;
      border-radius: 0;
    }



    /* =========================================================
   ANSWER AREA — BELOW IMAGE
   ========================================================= */

    .answer-area {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 10px;

      flex: 0 0 auto;
    }


    /* =========================================================
   ANSWER ROW
   ========================================================= */

    .answer-row {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 14px;

      width: 100%;
    }


    /* =========================================================
   INPUT
   ========================================================= */

    .answer-input {
      width: 220px;
      height: 58px;

      padding: 0 18px;

      border: 4px solid #b79af0;
      border-radius: 18px;

      background: #ffffff;

      text-align: center;

      font-size: 26px;
      /* font-weight:700; */

      color: #302b3b;

      outline: none;

      box-shadow:
        0 5px 0 #d9cdf3,
        0 8px 16px rgba(80, 60, 120, .12);



      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }

    .answer-input::placeholder {
      color: #b8afc5;
      font-size: 17px;
      font-weight: 500;
    }

    .answer-input:focus {
      border-color: #8d6bd1;

      transform: scale(1.03);

      box-shadow:
        0 5px 0 #c8b6ed,
        0 0 0 5px rgba(141, 107, 209, .12),
        0 10px 20px rgba(80, 60, 120, .15);
    }


    /* =========================================================
   SUBMIT BUTTON
   ========================================================= */

    .submit-btn {
      height: 58px;
      min-width: 125px;

      padding: 0 24px;

      border: 4px solid #ffffff;
      border-radius: 18px;

      background:
        linear-gradient(180deg,
          #7bea91 0%,
          #35b957 100%);

      color: #ffffff;

      font-size: 18px;
      font-weight: 400;

      box-shadow:
        0 6px 0 #299044,
        0 9px 15px rgba(35, 130, 65, .18);

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .quiz-card .submit-btn,
    .quiz-card .submit-btn:hover,
    .quiz-card .submit-btn:active {
      cursor: pointer !important;
    }

    .submit-btn:hover {
      transform: translateY(-3px);

      box-shadow:
        0 9px 0 #299044,
        0 13px 20px rgba(35, 130, 65, .20);
    }

    .submit-btn:active {
      transform: translateY(3px);

      box-shadow:
        0 2px 0 #299044,
        0 5px 10px rgba(35, 130, 65, .16);
    }

    .submit-btn:disabled {
      opacity: .5;
    }


    /* =========================================================
   CORRECT / WRONG INPUT
   ========================================================= */

    .answer-input.correct {
      border-color: #39b765;
      background: #effff3;
      color: #208344;
    }

    .answer-input.wrong {
      border-color: #ed6175;
      background: #fff1f3;
    }


    .nav {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 40px;

      position: relative;
      top: 10px;

      flex: 0 0 auto;
      gap: 420px;
    }

    .nav button {
      position: relative;
      min-width: 132px;
      height: 50px;
      padding: 0 22px;

      border: 4px solid #ffffff;
      border-radius: 18px;

      font-family: 'Livvic', sans-serif;
      font-size: 18px;
      font-weight: 700;

      color: #ffffff;
      cursor: pointer;

      box-shadow:
        0 6px 0 rgba(0, 0, 0, 0.18),
        0 9px 14px rgba(0, 0, 0, 0.15);

      transition: all 0.15s ease;
    }

    .nav button {
      padding: 10px 25px;
      border: none;
      border-radius: 15px;
      font-size: clamp(17px, 1.5vw, 20px);
      cursor: pointer;
      color: #fff;
      font-weight: 500;
      transition: 0.15s;
    }

    .prev {
      background: linear-gradient(180deg, #ff8fb3 0%, #f0447c 100%);
    }

    /* NEXT BUTTON */
    .next {
      background: linear-gradient(180deg, #55d9f5 0%, #009dcc 100%);
    }

    /* Hover */
    .nav button:not(:disabled):hover {
      transform: translateY(-3px);
      box-shadow:
        0 9px 0 rgba(0, 0, 0, 0.18),
        0 13px 18px rgba(0, 0, 0, 0.16);
    }

    /* Click */
    .nav button:not(:disabled):active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 rgba(0, 0, 0, 0.18),
        0 4px 8px rgba(0, 0, 0, 0.12);
    }

    /* Disabled */
    .nav button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow:
        0 4px 0 rgba(0, 0, 0, 0.12);
    }

    /* Arrow */
    .prev,
    .next {
      letter-spacing: 0.3px;
    }



    /* =========================================================
   LAPTOP
   ========================================================= */

    @media (min-width:1024px) and (max-width:1365px) {

      .quiz-card {
        padding: 22px 35px;
      }

      .heading {
        font-size: 27px;
      }

      .content-row {
        max-width: 620px;
        gap: 14px;
      }

      .question-heading {
        gap: 12px;
      }

      .qlabel,
      .question-text {
        font-size: 30px;
      }

      .image-wrap {
        max-width: 280px;
      }

      .answer-label {
        font-size: 21px;
      }

      .answer-input {
        width: 210px;
        height: 56px;
        font-size: 25px;
      }

      .submit-btn {
        height: 56px;
        font-size: 18px;
      }

      .nav {
        margin-top: 8px;
        padding-bottom: 8px;
        gap: 20px;
      }

      .nav button {
        min-width: 145px;
        height: 52px;
        padding: 10px 25px;
        font-size: 19px;
      }
    }


    /* =========================================================
   DESKTOP
   ========================================================= */

    @media (min-width:1366px) {

      .quiz-card {
        padding: 28px 50px;
      }

      .heading {
        font-size: 30px;
      }

      .content-row {
        max-width: 700px;
        gap: 18px;
      }

      .qlabel,
      .question-text {
        font-size: 30px;
      }

      .image-wrap {
        max-width: 320px;
      }

      .answer-label {
        font-size: 23px;
      }

      .answer-input {
        width: 230px;
        height: 62px;
        font-size: 28px;
      }

      .submit-btn {
        height: 62px;
        min-width: 135px;
        font-size: 20px;
      }

      .nav {
        margin-top: 10px;
        padding-bottom: 10px;
        gap: 24px;
        top: 30px;
      }

      .nav button {
        min-width: 155px;
        height: 55px;
        padding: 11px 28px;
        font-size: 20px;
      }
    }


    /* =========================================================
   MOBILE
   ========================================================= */

    @media (max-width:768px) {

      .quiz-card {
        padding: 16px 14px;
      }

      .heading {
        font-size: 19px;
      }

      .content-row {
        max-width: 100%;
        gap: 12px;
      }

      .qlabel,
      .question-text {
        font-size: 30px;
      }

      .image-wrap {
        max-width: 220px;
      }

      .answer-label {
        font-size: 19px;
      }

      .answer-row {
        gap: 10px;
      }

      .answer-input {
        width: 150px;
        height: 48px;
        font-size: 21px;
      }

      .submit-btn {
        height: 48px;
        min-width: 100px;
        padding: 0 16px;
        font-size: 16px;
      }

      .finalpopup-box {
        padding: 22px 18px;
      }

      .final-heading {
        font-size: 27px;
      }

      #finalScore {
        font-size: 20px;
      }

      #stars {
        font-size: 34px;
      }
    }


    @media (max-width:480px) {

      .heading {
        font-size: 16px;
      }

      .content-row {
        gap: 9px;
      }

      .qlabel,
      .question-text {
        font-size: 21px;
      }

      .image-wrap {
        max-width: 165px;
      }

      .answer-label {
        font-size: 17px;
      }

      .answer-input {
        width: 125px;
        height: 43px;
        font-size: 19px;
      }

      .submit-btn {
        height: 43px;
        min-width: 88px;
        padding: 0 12px;
        font-size: 14px;
      }
    }

    /* =========================================================
   LARGE DESKTOP — 1600px+
   ========================================================= */

    @media (min-width:1600px) {
      .home-btn {
        width: 65px;
        height: 65px;
        left: 18px;
        top: 18px;
        font-size: 26px;
      }

      .quiz-card {
        padding: 30px 70px 5px;
      }

      /* TITLE */
      .heading {
        font-size: 42px;
        margin-top: -18px;
      }

      /* MAIN MIDDLE CONTENT */
      .content-row {
        width: 100%;
        max-width: 1000px;
        gap: 24px;
      }

      /* Move question slightly DOWN */
      .question-heading {
        margin-top: 25px;
      }

      /* Decrease question image */
      .image-wrap {
        max-width: 380px;
        margin-top: 0;
      }

      .qlabel,
      .question-text {
        font-size: 46px;
      }


      /* ANSWER */
      .answer-area {
        gap: 16px;
      }

      .answer-row {
        gap: 22px;
      }

      .answer-input {
        width: 330px;
        height: 78px;
        font-size: 34px;
        border-radius: 22px;
      }

      .answer-input::placeholder {
        font-size: 22px;
      }

      /* SUBMIT */
      .submit-btn {
        min-width: 175px;
        height: 78px;
        padding: 0 32px;
        font-size: 24px;
        border-radius: 22px;
      }

      /* PREV / NEXT */
      .nav {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;

        gap: 80px;

        position: relative;
        top: -40px;

        flex: 0 0 auto;
      }

      .nav button {
        min-width: 175px;
        height: 60px;
        font-size: 22px;
        border-radius: 19px;
      }
    }
  </style>
</head>


<body>

  <div class="quiz-card">

    <button class="home-btn" id="homeBtn" aria-label="Home" title="Home"
      onclick="window.location.href='../Grade2_chapter1.html'">
      <i class="fa-solid fa-house"></i>
    </button>
    <!-- TITLE -->
    <p class="heading" id="heading">
      Write the numbers for the following number names.
    </p>


    <div class="content-row">

      <!-- QUESTION -->
      <div class="question-heading">

        <span class="qlabel" id="qLabel">
          Q1.
        </span>

        <span class="question-text" id="questionText">
          Eight
        </span>

      </div>


      <!-- IMAGE -->
      <div class="image-wrap">

        <div class="image-placeholder">

          <img src="https://via.placeholder.com/280x336/e8e0f0/7a6a9a?text=Number+Line" alt="Number visual"
            id="questionImage">

        </div>

      </div>


      <!-- ANSWER -->
      <div class="answer-area">

        <div class="answer-row">

          <input type="text" class="answer-input" id="answerInput" placeholder="Type number..." inputmode="numeric"
            autocomplete="off">

          <button class="submit-btn" id="submitBtn">
            Submit
          </button>

        </div>

      </div>

    </div>
    <div class="nav">
      <button class="prev" id="prevBtn" disabled>← Prev</button>
      <button class="next" id="nextBtn" disabled>Next →</button>
    </div>

  </div>


  <!-- =========================================================
     CORRECT / WRONG POPUP
     ========================================================= -->

  <div id="answerPopup" class="popup">

    <div class="popup-content">

      <div class="popup-icon" id="popupIcon">
      </div>

      <h3 id="popupTitle"></h3>

      <p id="popupMsg"></p>

    </div>

  </div>


  <!-- =========================================================
     FINAL POPUP
     ========================================================= -->

  <div id="finalPopup">

    <div class="finalpopup-box">

      <h2 class="final-heading">
        🎉 Amazing Job!
      </h2>

      <p id="finalScore"></p>

      <div id="stars">
        ⭐⭐⭐
      </div>

      <button onclick="location.reload()" class="playAgain-btn">
        Play Again
      </button>

    </div>

  </div>


  <!-- SOUNDS -->

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3">
  </audio>

  <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3">
  </audio>


  <script>

    /* =========================================================
       QUESTION DATA
       ========================================================= */

    const QUESTIONS = [
      {
        name: "Eight",
        answer: "8",
        image: "../assets/images/8.png"
      },
      {
        name: "Twenty three",
        answer: "23",
        image: "../assets/images/23.png"
      },
      {
        name: "Twelve",
        answer: "12",
        image: "../assets/images/12.png"
      },
      {
        name: "Sixty five",
        answer: "65",
        image: "../assets/images/65.png"
      },
      {
        name: "Fifty four",
        answer: "54",
        image: "../assets/images/54.png"
      },
      {
        name: "Ninety",
        answer: "90",
        image: "../assets/images/90.png"
      },
      {
        name: "Seventy",
        answer: "70",
        image: "../assets/images/seventy.png"
      },
      {
        name: "Thirty seven",
        answer: "37",
        image: "../assets/images/37.png"
      },
      {
        name: "Forty one",
        answer: "41",
        image: "../assets/images/41.png"
      },
      {
        name: "Eighty eight",
        answer: "88",
        image: "../assets/images/88.png"
      }
    ];


    /* =========================================================
       STATE
       ========================================================= */

    const total = QUESTIONS.length;

    let current = 0;

    const state = QUESTIONS.map(() => ({
      answered: false
    }));


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const qLabel =
      document.getElementById("qLabel");

    const questionText =
      document.getElementById("questionText");

    const answerInput =
      document.getElementById("answerInput");

    const submitBtn =
      document.getElementById("submitBtn");

    const questionImage =
      document.getElementById("questionImage");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const correctSound =
      document.getElementById("correctSound");

    const wrongSound =
      document.getElementById("wrongSound");


    /* =========================================================
       RENDER QUESTION
       ========================================================= */

    function renderQuestion() {

      const q = QUESTIONS[current];

      const st = state[current];

      qLabel.textContent =
        `Q${current + 1}.`;

      questionText.textContent =
        q.name;

      questionImage.src = q.image;

      answerInput.value = "";

      answerInput.disabled =
        st.answered;

      submitBtn.disabled =
        st.answered;

      answerInput.classList.remove(
        "correct",
        "wrong",
        "wrong-shake"
      );

      if (st.answered) {

        answerInput.value =
          q.answer;

        answerInput.classList.add(
          "correct"
        );

      }

      updateNav();

    }


    /* Prev is available from the second question on. Next only opens
       once the current question has been answered correctly, so the
       child moves on when they choose to, not automatically. */
    function updateNav() {

      prevBtn.disabled =
        current === 0;

      nextBtn.disabled =
        !state[current].answered ||
        current === total - 1;

    }


    /* =========================================================
       SUBMIT
       ========================================================= */

    function handleSubmit() {

      const st = state[current];

      if (st.answered) return;

      const q = QUESTIONS[current];

      const userAnswer =
        answerInput.value.trim();

      if (userAnswer === "") {

        answerInput.classList.add(
          "wrong-shake"
        );

        setTimeout(() => {

          answerInput.classList.remove(
            "wrong-shake"
          );

        }, 420);

        return;
      }


      const isCorrect =
        userAnswer === q.answer;


      if (isCorrect) {

        st.answered = true;

        answerInput.classList.remove(
          "wrong",
          "wrong-shake"
        );

        answerInput.classList.add(
          "correct"
        );

        answerInput.disabled = true;

        submitBtn.disabled = true;

        correctSound.currentTime = 0;

        correctSound
          .play()
          .catch(() => { });

        speak("correct");
        showPopup(true);

        fireConfetti();


        /* The child stays on this question until they press Next. */
        updateNav();

        if (current === total - 1) {

          setTimeout(() => {

            fireBigConfetti();

            showFinal();

          }, 1100);

        }


      } else {

        wrongSound.currentTime = 0;

        wrongSound
          .play()
          .catch(() => { });

        speak("wrong");

        answerInput.classList.add(
          "wrong",
          "wrong-shake"
        );

        showPopup(false);

        setTimeout(() => {

          answerInput.classList.remove(
            "wrong",
            "wrong-shake"
          );

          answerInput.value = "";

          answerInput.focus();

        }, 500);

      }

    }


    /* =========================================================
       POPUP
       ========================================================= */

    function speak(t) {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-UK";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }

    function showPopup(isCorrect) {

      const popup =
        document.getElementById(
          "answerPopup"
        );

      const icon =
        document.getElementById(
          "popupIcon"
        );

      const title =
        document.getElementById(
          "popupTitle"
        );

      const msg =
        document.getElementById(
          "popupMsg"
        );


      popup.className =
        "popup " +
        (isCorrect ? "correct" : "wrong");

      popup.style.display =
        "flex";


      if (isCorrect) {

        icon.textContent = "🎉";

        title.textContent =
          "Correct!";

        msg.textContent =
          "Great job!";

      } else {

        icon.textContent = "❌";

        title.textContent =
          "Try Again!";

        msg.textContent =
          "That's not quite right.";

      }


      clearTimeout(
        showPopup._t
      );

      showPopup._t =
        setTimeout(() => {

          popup.style.display =
            "none";

        }, 1100);

    }


    /* =========================================================
       FINAL
       ========================================================= */

    function showFinal() {

      const finalPopup =
        document.getElementById(
          "finalPopup"
        );

      finalPopup.style.display =
        "flex";

      document.getElementById(
        "finalScore"
      ).textContent =
        `${total} / ${total} Completed`;

      /* Always 3 stars */
      document.getElementById(
        "stars"
      ).textContent =
        "⭐⭐⭐";

    }


    /* =========================================================
       CONFETTI
       ========================================================= */

    function fireConfetti() {

      if (!window.confetti) return;

      confetti({

        particleCount: 24,

        spread: 55,

        startVelocity: 26,

        origin: {
          x: .5,
          y: .4
        },

        colors: [
          "#e6473f",
          "#3a6fd8",
          "#f7b733",
          "#8bba8a",
          "#c9a8e0"
        ]

      });

    }


    function fireBigConfetti() {

      if (!window.confetti) return;

      const end =
        Date.now() + 1800;

      (function frame() {

        confetti({

          particleCount: 6,

          angle: 60,

          spread: 55,

          origin: {
            x: 0
          }

        });

        confetti({

          particleCount: 6,

          angle: 120,

          spread: 55,

          origin: {
            x: 1
          }

        });

        if (Date.now() < end) {

          requestAnimationFrame(frame);

        }

      })();

    }


    /* =========================================================
       EVENTS
       ========================================================= */

    submitBtn.addEventListener(
      "click",
      handleSubmit
    );


    answerInput.addEventListener(
      "keydown",
      (e) => {

        if (e.key === "Enter") {

          e.preventDefault();

          handleSubmit();

        }

      }
    );


    /* =========================================================
       INITIALIZE
       ========================================================= */

    prevBtn.addEventListener("click", () => {

      if (current === 0) return;

      current--;

      renderQuestion();

    });


    nextBtn.addEventListener("click", () => {

      if (nextBtn.disabled) return;

      if (current < total - 1) {

        current++;

        renderQuestion();

        answerInput.focus();

      }

    });


    renderQuestion();

    answerInput.focus();

  </script>

</body>

</html>
