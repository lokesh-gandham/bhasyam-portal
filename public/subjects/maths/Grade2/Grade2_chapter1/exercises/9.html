<style>

/* =========================================================
   RESET  (unchanged)
   ========================================================= */

*{
  box-sizing:border-box;
  font-family:"Livvic",sans-serif;
}
html,
body,
.quiz-card,
.quiz-card *{
  cursor:default !important;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#F8F4FF;
  touch-action:none;
  overscroll-behavior:none;
  user-select:none;
  -webkit-user-select:none;
}
html,
body,
.quiz-card,
.quiz-card *{
  cursor:default !important;
}

/* =========================================================
   QUIZ CARD  (position:relative, flex column)
   ========================================================= */

.quiz-card{
  width:100%;
  height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:
    clamp(18px,3vh,35px)
    clamp(15px,4vw,60px);
  overflow:hidden;
}

/* =========================================================
   TITLE  (unchanged)
   ========================================================= */

.heading{
  margin:0;
  width:100%;
  text-align:center;
  font-size:30px;
  line-height:1.25;
  color:#2f2f2f;
  margin-top: -20px;
}

/* =========================================================
   MAIN CONTENT — centered balloon quiz
   ========================================================= */

.content-row{
  width:100%;
  max-width:900px;
  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;

  gap:clamp(8px,1.5vh,18px);
  min-height:0;
  padding:clamp(6px,1vh,14px) 0 0;
}

/* =========================================================
   QUESTION HEADER
   ========================================================= */

.question-heading{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  margin:0;
  padding-left:clamp(10px,2vw,22px);
  font-size:30px;
  flex:0 0 auto;
}

.qlabel{
  margin:0;
  font-size:clamp(30px,3.3vw,46px);
  line-height:1.1;
  color:#2f2f2f;
}

/* =========================================================
   QUESTION VISUAL — TWO BALLOONS
   ========================================================= */

.question-visual{
  width:100%;
  max-width:760px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:clamp(32px,6vw,78px);

  margin:-6px 0 0;
  flex:0 0 auto;
}

.number-circle{
  position:relative;

  width:clamp(170px,23vw,250px);
  height:clamp(210px,27vw,300px);

  flex:0 0 auto;

  border:0;
  border-radius:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:transparent;
  box-shadow:none;

  font-size:clamp(42px,5.6vw,64px);
  font-weight:400;
  color:#302b3b;
}
/* Clickable elements */
button,
button *,
.arrow-option,
.arrow-option *{
  cursor:pointer !important;
}

/* Disabled buttons should not show pointer */
button:disabled,
button:disabled *,
.arrow-option:disabled,
.arrow-option:disabled *{
  cursor:default !important;
}

/* Balloon artwork is transparent, so it's recolored here using
   mask-image (the PNG's alpha shape) + a solid background-color,
   rather than filter/hue-rotate — this works no matter what
   color (or no color) the source PNG has. */
.number-circle::before{
  content:"";
  position:absolute;
  inset:0;

  -webkit-mask-image:url('../assets/images/balloon.png');
  mask-image:url('../assets/images/balloon.png');
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
  -webkit-mask-position:center;
  mask-position:center;
  -webkit-mask-size:100% 100%;
  mask-size:100% 100%;

  background-color:#AEE2FF;

  z-index:0;
}

.number-circle .circle-number{
  position:relative;
  z-index:2;

  display:flex;
  align-items:center;
  justify-content:center;

  width:62%;
  height:50%;
  border-radius:0;

  background:transparent;

  color:#4a3f6b;

  /* shifts the number up out of the bottom knot area and into
     the round body of the balloon, where it reads as centered */
  transform:translateY(-20%);

  text-shadow:
    0 2px 0 rgba(255,255,255,.55),
    0 2px 6px rgba(0,0,0,.10);
}

.number-circle > img{
  position:absolute;
  inset:0;
  z-index:1;
  display:block;
  width:100%;
  height:100%;
  object-fit:fill;
  pointer-events:none;
  opacity:.82;
  filter:sepia(.2) saturate(1.25) hue-rotate(145deg) brightness(1.08);
}

.target-circle > img{
  filter:sepia(.18) saturate(1.2) hue-rotate(145deg) brightness(1.1);
}

/* Question balloons stay the SAME pastel color across every
   question — this single rule is the only place that sets it. */
.given-circle::before,
.target-circle::before{
  background-color:#AEE2FF;
}

.number-circle.target-circle .circle-number{
  display:none;
  min-width:64%;
  height:auto;
  min-height:40%;
  background:transparent;
}

.number-circle.target-circle.revealed::before{
  background-color:#BFF3D0;
}

.number-circle.target-circle.revealed .circle-number{
  display:flex;
  color:#208344;
  animation:answerPop .42s cubic-bezier(.2,.9,.25,1.25);
}

@keyframes answerPop{
  0%{transform:translateY(-20%) scale(.55); opacity:0;}
  70%{transform:translateY(-20%) scale(1.08); opacity:1;}
  100%{transform:translateY(-20%) scale(1); opacity:1;}
}

.number-circle.target-circle.miss-flash{
  animation:targetShake .42s ease;
}

@keyframes targetShake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-6px); }
  40%{ transform:translateX(6px); }
  60%{ transform:translateX(-4px); }
  80%{ transform:translateX(4px); }
}

/* =========================================================
   OPTIONS — 3 BALLOONS, NO BOXES
   ========================================================= */

.archery-area{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex:0 0 auto;
}

.options-row{
  width:100%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:clamp(30px,7vw,90px);
  cursor: pointer !important;
}

.arrow-option{
  position:relative;

  width:clamp(120px,14vw,180px);
  height:clamp(150px,18vw,220px);

  padding:0;
  margin:0;
  cursor: pointer !important;

  border:0;
  border-radius:0;

  background:transparent;
  box-shadow:none;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:
    transform .2s ease,
    filter .2s ease,
    opacity .25s ease;

  animation:balloonFloat 2.8s ease-in-out infinite;
}

.arrow-option:nth-child(1){ animation-delay:0s; }
.arrow-option:nth-child(2){ animation-delay:.35s; }
.arrow-option:nth-child(3){ animation-delay:.7s; }

/* Same transparent-PNG recoloring approach as the question
   balloons, applied per-option so each one gets its own tone. */
.arrow-option::before{
  content:"";
  position:absolute;
  inset:0;

  -webkit-mask-image:url('../assets/images/balloon.png');
  mask-image:url('../assets/images/balloon.png');
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
  -webkit-mask-position:center;
  mask-position:center;
  -webkit-mask-size:100% 100%;
  mask-size:100% 100%;

  background-color:#BEEFC9;

  z-index:0;

  transition:
    background-color .2s ease,
    transform .2s ease;
}

/* Option balloons change color while question balloons stay fixed —
   pastel palette, one tone per option position */
.arrow-option:nth-child(1)::before{
  background-color:#BEEFC9; /* pastel green */
}

.arrow-option:nth-child(2)::before{
  background-color:#F9C9DE; /* pastel pink */
}

.arrow-option:nth-child(3)::before{
  background-color:#FCEAAE; /* pastel yellow */
}

.arrow-option .arrow-number{
  position:relative;
  z-index:2;

  display:flex;
  align-items:center;
  justify-content:center;

  width:64%;
  min-height:40%;

  border-radius:0;

  background:transparent;

  color:#4a3f6b;

  font-size:clamp(28px,3.2vw,36px);
  font-weight:400;
  line-height:1;

  /* shifts the number up into the round body of the balloon,
     same fix as the question balloons above */
  transform:translateY(-20%);

  text-shadow:
    0 2px 0 rgba(255,255,255,.55),
    0 2px 6px rgba(0,0,0,.10);

  transition:
    transform .2s ease,
    color .2s ease;
}

/* Keep the balloon image visible as a fallback for browsers that do not
   render the CSS mask. */
.arrow-option img{
  position:absolute;
  inset:0;
  z-index:1;
  display:block;
  width:100%;
  height:100%;
  object-fit:fill;
  pointer-events:none;
  opacity:.82;
}

.arrow-option:nth-child(1) img{
  filter:sepia(.28) saturate(1.15) hue-rotate(55deg) brightness(1.08);
}

.arrow-option:nth-child(2) img{
  filter:sepia(.18) saturate(1.25) hue-rotate(290deg) brightness(1.08);
}

.arrow-option:nth-child(3) img{
  filter:sepia(.3) saturate(1.1) hue-rotate(5deg) brightness(1.1);
}

/* Hover */
.arrow-option:hover:not(:disabled){
  transform:translateY(-9px) scale(1.05);
}

.arrow-option:hover:not(:disabled)::before{
  transform:scale(1.035);
}

.arrow-option:hover:not(:disabled) .arrow-number{
  transform:translateY(-20%) scale(1.08);
  color:#6d4ca3;
}

/* Press */
.arrow-option:active:not(:disabled){
  transform:translateY(2px) scale(.97);
}

/* Correct option locks and highlights */
.arrow-option.correct-hit{
  animation:correctBalloon .65s ease forwards;
  pointer-events:none;
  z-index:5;
}

.arrow-option.correct-hit::after{
  content:"✓";

  position:absolute;
  right:5%;
  top:5%;

  width:34px;
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#55c878;
  color:#fff;

  font-size:23px;
  font-weight:800;

  box-shadow:0 3px 8px rgba(50,130,80,.28);

  z-index:5;

  animation:checkPop .35s ease;
}

@keyframes correctBalloon{
  0%{transform:scale(1);}
  45%{transform:scale(1.12) translateY(-8px);}
  100%{transform:scale(1.06) translateY(-5px);}
}

@keyframes checkPop{
  0%{transform:scale(0);}
  75%{transform:scale(1.15);}
  100%{transform:scale(1);}
}

/* Wrong option disappears */
.arrow-option.faded{
  opacity:0;
  pointer-events:none;
  animation:wrongDisappear .35s ease forwards;
}

@keyframes wrongDisappear{
  0%{
    opacity:1;
    transform:scale(1);
  }
  100%{
    opacity:0;
    transform:scale(.55) translateY(-14px);
  }
}

.arrow-option.shot{
  animation:wrongDisappear .35s ease forwards;
}

/* Balloon floating animation */
@keyframes balloonFloat{
  0%,100%{
    transform:translateY(0) rotate(-1deg);
  }
  50%{
    transform:translateY(-9px) rotate(1deg);
  }
}

.flying-arrow {
  position: fixed;
  left: 0;
  top: 0;
  width: 56px;
  height: 56px;
  z-index: 9999;
  pointer-events: none;
  display: none;
}

.flying-arrow.active {
  display: block;
}

.flying-arrow img {
  width: 56px;
  height: 56px;
  object-fit: contain;
  display: block;
}

.flying-number {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  pointer-events: none;
}

/* =========================================================
   NAV  (unchanged)
   ========================================================= */

.nav {
  width: 100%;

  justify-content: center;
  align-items: center;

  }

  /* Exactly 3 balloons in one row on mobile */
  .options-row{
    width:100%;
    display:flex;
    flex-wrap:nowrap;
    justify-content:center;
    align-items:flex-end;
    gap:clamp(4px,2.5vw,12px);
  }

  .arrow-option{
    width:clamp(82px,25vw,105px);
    height:clamp(102px,31vw,130px);
    flex:0 0 auto;
  }

  .arrow-option .arrow-number{
    width:64%;
    min-height:40%;
    font-size:clamp(18px,5vw,23px);
    border-radius:0;
    background:transparent;
    text-shadow:
      0 2px 0 rgba(255,255,255,.5),
      0 2px 5px rgba(0,0,0,.10);
  }

  .arrow-option.correct-hit::after{
    width:25px;
    height:25px;
    font-size:17px;
  }

  /* Keep imported nav appearance; only its existing HTML is used. */
}

@media (max-width:480px){

  .quiz-card{
    padding:10px 8px;
  }

  .content-row{
    max-width:300px;
    gap:8px;
    padding:4px 0;
  }

  .qlabel{
    font-size:21px;
  }

  .question-visual{
    max-width:270px;
    gap:8px;
    margin-top:-2px;
  }

  .number-circle{
    width:88px;
    height:108px;
    font-size:20px;
  }

  .number-circle .circle-number{
    width:62%;
    height:52%;
    font-size:18px;
  }

  .options-row{
    gap:5px;
  }

  .arrow-option{
    width:clamp(74px,24vw,90px);
    height:clamp(94px,30vw,112px);
  }

  .arrow-option .arrow-number{
    font-size:15px;
  }
}


/* =========================================================
   BALLOON-ONLY NUMBERS
   Numbers sit directly on the balloon artwork.
   No option cards / white number boxes.
   ========================================================= */

.number-circle .circle-number,
.arrow-option .arrow-number{
  background:transparent !important;
  border:0 !important;
  border-radius:0 !important;
  box-shadow:none !important;
  color:#4a3f6b !important;
  text-shadow:
    0 2px 0 rgba(255,255,255,.55),
    0 2px 6px rgba(0,0,0,.10);
}

.number-circle.target-circle .circle-number{
  background:transparent !important;
}

.number-circle.target-circle.revealed .circle-number{
  color:#208344 !important;
}

.arrow-option{
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;
}

/* =========================================================
   PASTEL BALLOONS — DRAWN IN CSS

   The balloons used to be a very pale PNG tinted through a CSS
   mask. Not every browser paints that mask, and where it does not
   the balloons came out plain white (or vanished entirely). They
   are now drawn with gradients and border-radius, so the pastel
   colour is always there, on every browser.
   ========================================================= */

.number-circle > img,
.arrow-option img{
  display:none;
}

.number-circle,
.arrow-option{
  overflow:visible;
}

/* balloon body */
.number-circle::before,
.arrow-option::before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  transform:translateX(-50%);

  width:86%;
  height:76%;

  /* egg shape: rounder at the top, tapering to the knot */
  border-radius:50% 50% 47% 47% / 56% 56% 44% 44%;

  /* mask is no longer used — clear it in case it is still inherited */
  -webkit-mask-image:none;
  mask-image:none;

  box-shadow:
    0 10px 18px rgba(80,40,110,.12),
    inset -10px -14px 26px rgba(0,0,0,.06);

  z-index:0;
}

/* knot + string, drawn under the body */
.number-circle::after,
.arrow-option::after{
  content:"";
  position:absolute;
  left:50%;
  top:74%;
  transform:translateX(-50%);

  width:10%;
  height:8%;

  border-radius:40% 40% 45% 45%;

  background:inherit;
  opacity:.75;

  z-index:0;
}

/* --- question balloons: one fixed pastel blue --- */
.given-circle::before,
.target-circle::before,
.number-circle::before{
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.92) 0%, rgba(255,255,255,0) 45%),
    linear-gradient(160deg, #CFEBFF 0%, #9FD6F7 100%);
}

.number-circle::after{ background:#9FD6F7; }

/* answered target turns pastel green */
.number-circle.target-circle.revealed::before{
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.92) 0%, rgba(255,255,255,0) 45%),
    linear-gradient(160deg, #D8FBE4 0%, #96E4B2 100%);
}

.number-circle.target-circle.revealed::after{ background:#96E4B2; }

/* --- option balloons: green / pink / yellow --- */
.arrow-option:nth-child(1)::before{
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.92) 0%, rgba(255,255,255,0) 45%),
    linear-gradient(160deg, #D6F5DD 0%, #8FDCA6 100%);
}
.arrow-option:nth-child(1)::after{ background:#8FDCA6; }

.arrow-option:nth-child(2)::before{
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.92) 0%, rgba(255,255,255,0) 45%),
    linear-gradient(160deg, #FFDCEA 0%, #F7A8C8 100%);
}
.arrow-option:nth-child(2)::after{ background:#F7A8C8; }

.arrow-option:nth-child(3)::before{
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.92) 0%, rgba(255,255,255,0) 45%),
    linear-gradient(160deg, #FFF1C2 0%, #F7D470 100%);
}
.arrow-option:nth-child(3)::after{ background:#F7D470; }

/* the numbers ride on the balloon body */
.number-circle .circle-number,
.arrow-option .arrow-number{
  z-index:2;
  transform:translateY(-14%);
}

/* =========================================================
   LARGE MONITORS
   On a wide screen the balloons — the option ones especially —
   looked tiny and stranded in the middle of the page. Scale them
   up and open the spacing out. Laptops are narrower than this
   and keep exactly the sizes they had.
   ========================================================= */

@media (min-width:1600px){

  .content-row{
    max-width:960px;
    gap:16px;
    padding-top:16px;
  }

  .question-visual{
    max-width:820px;
    gap:60px;
    margin-bottom:24px;
  }

  .number-circle{
    width:265px;
    height:325px;
    font-size:54px;
  }

  .options-row{
    gap:70px;
  }

  .arrow-option{
    width:215px;
    height:265px;
  }

  .arrow-option .arrow-number{
    font-size:36px;
  }
}

/* No hover movement on the balloons — they stay put when the pointer
   is over them. No !important here on purpose: the gentle float
   animation still drives the transform, so nothing jumps on hover. */
.arrow-option:hover:not(:disabled){
  transform:none;
}

.arrow-option:hover:not(:disabled)::before{
  transform:translateX(-50%);
}

.arrow-option:hover:not(:disabled)::after{
  transform:translateX(-50%);
}

.arrow-option:hover:not(:disabled) .arrow-number{
  transform:translateY(-14%);
}

</style>
</head>

<body>

<div class="quiz-card" id="quizCard">

  <div class="topbar">
    <button class="icon-flat" style="display: none;" id="homeBtn" title="Home" aria-label="Home">🏠</button>

    <p class="heading" id="heading">
      Write the number that comes after the given numbers.
    </p>

    <button class="icon-flat" id="hintBtn" title="Hint" aria-label="Hint">💡</button>
  </div>

  <div class="content-row">

      <!-- QUESTION HEADER -->
    <div class="question-heading">
      <span class="qlabel" id="qLabel">Q1.</span>
    </div>

    <!-- QUESTION VISUAL: given balloon + blank answer balloon -->
    <div class="question-visual">

      <div class="number-circle given-circle" id="givenCircle">
        <img src="../assets/images/balloon.png" alt="">
        <span class="circle-number" id="givenNumber">18</span>
      </div>

      <div class="number-circle target-circle" id="targetCircle">
        <img src="../assets/images/balloon.png" alt="">
        <span class="circle-number" id="targetNumber"></span>
      </div>

    </div>

    <!-- OPTIONS: three answer balloons -->
    <div class="archery-area">
      <div class="options-row" id="optionsRow">
        <!-- injected by JS -->
      </div>
    </div>

  </div>

  <div class="nav">
    <button class="prev" id="prevBtn" disabled>← Prev</button>
    <button class="next" id="nextBtn" disabled>Next →</button>
  </div>

  <!-- FLYING ARROW -->
<div class="flying-arrow" id="flyingArrow" aria-hidden="true">
    <img src="../assets/images/arrow.png" alt="">
    <span class="flying-number" id="flyingNumber"></span>
  </div>

</div>

<div class="hint-overlay" id="hintOverlay" aria-live="polite">
  <div class="hint-box">
    <h3>Hint</h3>
    <p id="hintText">Look at the number in the balloon and choose the number that comes just after it.</p>
    <button class="popup-btn" id="closeHintBtn">Got it!</button>
  </div>
</div>

<!-- =========================================================
     POPUPS  (unchanged)
     ========================================================= -->

<div id="answerPopup" class="popup">
  <div class="popup-content">
    <div class="popup-icon" id="popupIcon"></div>
    <h3 id="popupTitle"></h3>
    <p id="popupMsg"></p>
  </div>
</div>

<div id="finalPopup">
  <div class="finalpopup-box">
    <h2 class="final-heading">🎉 Amazing Job!</h2>
    <p id="finalScore"></p>
    <div id="stars">⭐⭐⭐</div>
    <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
  </div>
</div>

<!-- SOUNDS -->
<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>

/* =========================================================
   QUESTION DATA
   ========================================================= */

const QUESTIONS = [
  { given:18, answer:19,  options:[19,17,28] },
  { given:23, answer:24,  options:[34,24,22] },
  { given:44, answer:45,  options:[54,43,45] },
  { given:76, answer:77,  options:[77,67,75] },
  { given:59, answer:60,  options:[69,60,58] },
  { given:99, answer:100, options:[90,98,100] }
];

const LABELS = ["Q1.","Q2.","Q3.","Q4.","Q5.","Q6."];

/* =========================================================
   STATE
   ========================================================= */

const total = QUESTIONS.length;
let current = 0;
let shooting = false;
const state = QUESTIONS.map(() => ({
  answered:false,
  wrongPicks:[]
}));

/* =========================================================
   ELEMENTS
   ========================================================= */

const quizCard     = document.getElementById("quizCard");
const qLabel       = document.getElementById("qLabel");
const targetCircle = document.getElementById("targetCircle");
const targetNumber = document.getElementById("targetNumber");
const givenNumber  = document.getElementById("givenNumber");
const optionsRow   = document.getElementById("optionsRow");
const flyingArrow  = document.getElementById("flyingArrow");
const flyingNumber = document.getElementById("flyingNumber");
const prevBtn      = document.getElementById("prevBtn");
const nextBtn      = document.getElementById("nextBtn");

const correctSound = document.getElementById("correctSound");
const wrongSound   = document.getElementById("wrongSound");
const homeBtn      = document.getElementById("homeBtn");
const hintBtn      = document.getElementById("hintBtn");
const hintOverlay  = document.getElementById("hintOverlay");
const closeHintBtn = document.getElementById("closeHintBtn");
const hintText     = document.getElementById("hintText");

/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

  const q  = QUESTIONS[current];
  const st = state[current];

  qLabel.textContent = LABELS[current] || `Q${current + 1}.`;
  givenNumber.textContent = q.given;

  targetCircle.classList.remove("revealed","miss-flash");
  targetNumber.textContent = st.answered ? q.answer : "";

  if(st.answered){
    targetCircle.classList.add("revealed");
  }

  optionsRow.innerHTML = "";

  q.options.forEach((value) => {

    const btn = document.createElement("button");
    btn.className = "arrow-option";
    btn.type = "button";
    btn.dataset.value = String(value);

    /* Keep the existing image HTML structure, but the balloon is
       rendered by CSS from ../assets/images/balloon.png. */
    const img = document.createElement("img");
    img.src = "../assets/images/balloon.png";
    img.alt = "";
    btn.appendChild(img);

    const label = document.createElement("span");
    label.className = "arrow-number";
    label.textContent = value;
    btn.appendChild(label);

    if(st.answered){
      btn.disabled = true;

      if(value === q.answer){
        btn.classList.add("correct-hit");
      }else{
        btn.classList.add("faded");
      }

    }else if(st.wrongPicks.includes(value)){
      btn.disabled = true;
      btn.classList.add("faded");

    }else{
      btn.addEventListener("click", () => handleShoot(btn, value));
    }

    optionsRow.appendChild(btn);
  });

  prevBtn.disabled = current === 0;
  nextBtn.disabled = !st.answered || current === total - 1;
}

function localCenter(el){
  const stageRect = quizCard.getBoundingClientRect();
  const scale = stageRect.width / quizCard.offsetWidth || 1;
  const rect  = el.getBoundingClientRect();
  return {
    x: (rect.left - stageRect.left + rect.width / 2) / scale,
    y: (rect.top  - stageRect.top  + rect.height / 2) / scale
  };
}

function fireArrowAt(optionEl, targetEl, value, onDone){
  const from = localCenter(optionEl);
  const to   = localCenter(targetEl);
  const angle = Math.atan2(to.y - from.y, to.x - from.x) * (180 / Math.PI) + 90;

  flyingNumber.textContent = value;

  flyingArrow.style.transition = "none";
  flyingArrow.style.transform  = `translate(${from.x}px, ${from.y}px) rotate(${angle}deg)`;
  flyingArrow.classList.add("active");

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      flyingArrow.style.transition = "transform .32s cubic-bezier(.35,.9,.4,1)";
      flyingArrow.style.transform  = `translate(${to.x}px, ${to.y}px) rotate(${angle}deg)`;
    });
  });

  setTimeout(() => {
    flyingArrow.classList.remove("active");
    onDone();
  },340);
}

function handleShoot(optionEl, value){

  const st = state[current];
  if(st.answered || shooting) return;

  const q = QUESTIONS[current];
  shooting = true;

  /* Prevent double taps while the result is being shown */
  optionsRow.querySelectorAll(".arrow-option").forEach((b) => {
    b.disabled = true;
  });

  if(value === q.answer){

    st.answered = true;

    /* Lock + highlight the selected correct balloon */
    optionEl.classList.remove("shot");
    optionEl.classList.add("correct-hit");

    targetNumber.textContent = q.answer;
    targetCircle.classList.add("revealed");

    optionsRow.querySelectorAll(".arrow-option").forEach((b) => {
      if(b !== optionEl){
        b.disabled = true;
        b.classList.add("faded");
      }
    });

    correctSound.currentTime = 0;
    correctSound.play().catch(() => {});
    speak("correct")
    showPopup(true);
    fireConfetti();

    /* Next becomes available only after the correct answer */
    nextBtn.disabled = current === total - 1;

    shooting = false;

    /* On the last question, the final popup is shown after
       the existing navigation flow reaches the end. */
    if(current === total - 1){
      setTimeout(() => {
        fireBigConfetti();
        showFinal();
      },1100);
    }

  }else{

    st.wrongPicks.push(value);

    wrongSound.currentTime = 0;
    wrongSound.play().catch(() => {});

    targetCircle.classList.add("miss-flash");
    speak("wrong");
    showPopup(false);

    /* Wrong balloon disappears; remaining balloons become usable */
    setTimeout(() => {

      targetCircle.classList.remove("miss-flash");

      optionEl.classList.add("faded");
      optionEl.disabled = true;

      optionsRow.querySelectorAll(".arrow-option").forEach((b) => {

        if(!st.wrongPicks.includes(Number(b.dataset.value)) && !st.answered){
          b.disabled = false;
        }

      });

      shooting = false;

    },500);
  }
}

/* =========================================================
   POPUP  (unchanged)
   ========================================================= */

function showPopup(isCorrect){
  const popup = document.getElementById("answerPopup");
  const icon  = document.getElementById("popupIcon");
  const title = document.getElementById("popupTitle");
  const msg   = document.getElementById("popupMsg");

  popup.className = "popup " + (isCorrect ? "correct" : "wrong");
  popup.style.display = "flex";

  if(isCorrect){
    icon.textContent = "🎉";
    title.textContent = "Correct!";
    msg.textContent = "Great job!";
  }else{
    icon.textContent = "❌";
    title.textContent = "Try Again!";
    msg.textContent = "That's not quite right.";
  }

  clearTimeout(showPopup._t);
  showPopup._t = setTimeout(() => {
    popup.style.display = "none";
  },1100);
}

/* =========================================================
   FINAL  (unchanged)
   ========================================================= */

function showFinal(){
  const finalPopup = document.getElementById("finalPopup");
  finalPopup.style.display = "flex";
  document.getElementById("finalScore").textContent = `${total} / ${total} Completed`;
  document.getElementById("stars").textContent = "⭐⭐⭐";
}

/* =========================================================
   CONFETTI  (unchanged)
   ========================================================= */

function fireConfetti(){
  if(!window.confetti) return;
  confetti({
    particleCount:24,
    spread:55,
    startVelocity:26,
    origin:{ x:.5, y:.4 },
    colors:["#e6473f","#3a6fd8","#f7b733","#8bba8a","#c9a8e0"]
  });
}

function fireBigConfetti(){
  if(!window.confetti) return;
  const end = Date.now() + 1800;
  (function frame(){
    confetti({ particleCount:6, angle:60,  spread:55, origin:{ x:0 } });
    confetti({ particleCount:6, angle:120, spread:55, origin:{ x:1 } });
    if(Date.now() < end){ requestAnimationFrame(frame); }
  })();
}
// ===== SPEAK =====
function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-UK";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

/* =========================================================
   NAV  (unchanged)
   ========================================================= */

prevBtn.addEventListener("click", () => {
  if(current === 0) return;
  current--;
  renderQuestion();
});

nextBtn.addEventListener("click", () => {
  if(nextBtn.disabled) return;
  if(current < total - 1){
    current++;
    renderQuestion();
  }
});

homeBtn.addEventListener("click", () => {
  window.location.href = "../Grade2_chapter1.html";
});

hintBtn.addEventListener("click", () => {
  hintText.textContent = `Look at ${QUESTIONS[current].given}. The answer is the number right after it.`;
  hintOverlay.classList.add("show");
});

closeHintBtn.addEventListener("click", () => {
  hintOverlay.classList.remove("show");
});

hintOverlay.addEventListener("click", (event) => {
  if(event.target === hintOverlay) {
    hintOverlay.classList.remove("show");
  }
});

/* =========================================================
   INITIALIZE
   ========================================================= */

renderQuestion();

</script>

</body>
</html>
