<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number After</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="../assets/css/reuse.css">

<style>

/* =========================================================
   RESET
   ========================================================= */
*{
  box-sizing:border-box;
  font-family:"Livvic",sans-serif;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#F8F4FF;
  touch-action:none;
  overscroll-behavior:none;
  user-select:none;
  -webkit-user-select:none;
  cursor:default;
}

button{ cursor:pointer; }
button:disabled{ cursor:default; }

/* =========================================================
   SIZES — everything scales from these two values
   --q : width of one question circle
   --o : width of one option circle
   Both follow the screen (width AND height), so the game
   fills a laptop, a big monitor or a phone without scrolling.
   ========================================================= */
:root{
  --q: min(25vh, 19vw);
  --o: min(19vh, 14vw);
  --ring:#33bff0;
  --ring-dark:#1a9fd6;
  --band:#fde3c0;
}

/* =========================================================
   PAGE LAYOUT
   ========================================================= */
.quiz-card{
  width:100%;
  height:100vh;
  height:100dvh;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding: clamp(10px,2.5vh,34px) clamp(12px,4vw,70px) clamp(8px,2vh,24px);
  overflow:hidden;
}

.heading{
  margin:0;
  width:100%;
  text-align:center;
  font-size:clamp(17px, 2.3vw, 44px);
  line-height:1.25;
  color:#2f2f2f;
}

.content-row{
  width:100%;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-evenly;
}

.qlabel{ display:none; }

/* =========================================================
   CIRCLE UNIT (cap + blue ring) — used by question AND options
   ========================================================= */
.unit-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  color:var(--ring);              /* ring colour (currentColor) */
  transition:color .3s ease;
  z-index:1;
}

/* number sits in the middle of the ring
   (ring centre is at 84/132 of the unit height) */
.unit-number{
  position:absolute;
  left:0;
  right:0;
  top:44%;
  height:52%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#2f2f2f;
  line-height:1;
  z-index:2;
}

/* =========================================================
   QUESTION VISUAL
   ========================================================= */
.question-visual{
  --gap: calc(var(--q) * .16);
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  gap:var(--gap);
  flex:0 0 auto;
}

/* peach band joining the two circles */
.question-visual::before{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:calc(var(--q) * .64);
  width:calc(var(--q) + var(--gap));
  height:calc(var(--q) * .40);
  background:var(--band);
  z-index:0;
}

.number-circle{
  position:relative;
  width:var(--q);
  height:calc(var(--q) * 1.32);
  flex:0 0 auto;
  font-size:calc(var(--q) * .30);
  z-index:1;
}

.target-circle .unit-number{ visibility:hidden; }

.target-circle.revealed .unit-svg{ color:#4fcf7a; }

.target-circle.revealed .unit-number{
  visibility:visible;
  color:#208344;
  animation:answerPop .42s cubic-bezier(.2,.9,.25,1.25);
}

@keyframes answerPop{
  0%{ transform:scale(.4); opacity:0; }
  70%{ transform:scale(1.12); opacity:1; }
  100%{ transform:scale(1); opacity:1; }
}

.target-circle.miss-flash{ animation:targetShake .42s ease; }
.target-circle.miss-flash .unit-svg{ color:#ff6b7a; }

@keyframes targetShake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-6px); }
  40%{ transform:translateX(6px); }
  60%{ transform:translateX(-4px); }
  80%{ transform:translateX(4px); }
}

/* =========================================================
   OPTIONS — same circle design
   ========================================================= */
.options-row{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:calc(var(--o) * .45);
  flex:0 0 auto;
}

.arrow-option{
  position:relative;
  width:var(--o);
  height:calc(var(--o) * 1.32);
  padding:0;
  margin:0;
  border:0;
  background:transparent;
  flex:0 0 auto;
  font-size:calc(var(--o) * .30);
  transition:transform .2s ease, opacity .25s ease;
  animation:optionFloat 2.8s ease-in-out infinite;
}

.arrow-option:nth-child(2){ animation-delay:.35s; }
.arrow-option:nth-child(3){ animation-delay:.7s; }

.arrow-option:hover:not(:disabled) .unit-svg{ color:var(--ring-dark); }

.arrow-option:active:not(:disabled){ transform:scale(.96); }

@keyframes optionFloat{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(calc(var(--o) * -.05)); }
}

/* correct pick */
.arrow-option.correct-hit{
  animation:correctPop .6s ease forwards;
  pointer-events:none;
  z-index:5;
}
.arrow-option.correct-hit .unit-svg{ color:#4fcf7a; }
.arrow-option.correct-hit .unit-number{ color:#208344; }

.arrow-option.correct-hit::after{
  content:"✓";
  position:absolute;
  right:-6%;
  top:26%;
  width:calc(var(--o) * .24);
  height:calc(var(--o) * .24);
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#55c878;
  color:#fff;
  font-size:calc(var(--o) * .15);
  font-weight:800;
  box-shadow:0 3px 8px rgba(50,130,80,.28);
  z-index:5;
  animation:checkPop .35s ease;
}

@keyframes correctPop{
  0%{ transform:scale(1); }
  45%{ transform:scale(1.1) translateY(-6px); }
  100%{ transform:scale(1.05) translateY(-4px); }
}

@keyframes checkPop{
  0%{ transform:scale(0); }
  75%{ transform:scale(1.15); }
  100%{ transform:scale(1); }
}

/* wrong pick disappears (space is kept so nothing jumps) */
.arrow-option.faded{
  pointer-events:none;
  animation:wrongDisappear .35s ease forwards;
}

@keyframes wrongDisappear{
  0%{ opacity:1; transform:scale(1); }
  100%{ opacity:.5; transform:scale(1) translateY(-4px);  }
}

/* =========================================================
   NAV
   ========================================================= */
.nav{
  width:100%;
  max-width:1400px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex:0 0 auto;
  padding:0 clamp(0px,4vw,120px);
}

.nav button{
  min-width:clamp(90px, 9vw, 180px);
  height:clamp(38px, 5.5vh, 62px);
  font-size:clamp(13px, 1.3vw, 24px);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

/* Phones / tablets in portrait: width is the limit */
@media (max-width:768px) and (orientation:portrait){
  :root{
    --q: min(36vw, 21vh);
    --o: min(25vw, 16vh);
  }
  .options-row{ gap:calc(var(--o) * .22); }
  .nav{ padding:0; justify-content:center; gap:14px; }
}

/* Short landscape screens (phones turned sideways) */
@media (max-height:500px) and (orientation:landscape){
  :root{
    --q: min(24vh, 16vw);
    --o: min(19vh, 13vw);
  }
  .quiz-card{ padding:6px 12px; }
  .heading{ font-size:16px; }
}

/* Big monitors: let everything grow a little more */
@media (min-width:1600px) and (min-height:850px){
  :root{
    --q: min(27vh, 19vw);
    --o: min(20vh, 14vw);
  }
}

</style>
</head>

<body>

<!-- Shared artwork: orange cap + white circle with blue ring -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="capRing" viewBox="0 0 100 132">
      <!-- cap -->
      <rect x="41" y="2" width="18" height="8" rx="1.5" fill="#f7941d"/>
      <polygon points="39,10 61,10 66,21 34,21" fill="#fbc063"/>
      <rect x="33" y="21" width="34" height="2" fill="#fde3a7"/>
      <polygon points="31,23 69,23 77,38 23,38" fill="#f7941d"/>
      <!-- ring -->
      <circle cx="50" cy="84" r="40" fill="#ffffff" stroke="currentColor" stroke-width="12"/>
      <circle cx="50" cy="84" r="46" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="1"/>
      <circle cx="50" cy="84" r="34" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="1"/>
    </symbol>
  </defs>
</svg>

<div class="quiz-card" id="quizCard">

  <div class="topbar">
    <button class="icon-flat" style="display:none;" id="homeBtn" title="Home" aria-label="Home">🏠</button>

    <p class="heading" id="heading">
      Write the number that comes after the given numbers.
    </p>

    <button class="icon-flat" id="hintBtn" title="Hint" aria-label="Hint">💡</button>
  </div>

  <div class="content-row">

    <span class="qlabel" id="qLabel">Q1.</span>

    <!-- QUESTION: given number + blank circle -->
    <div class="question-visual">

      <div class="number-circle given-circle" id="givenCircle">
        <svg class="unit-svg" viewBox="0 0 100 132" aria-hidden="true"><use href="#capRing"/></svg>
        <span class="unit-number" id="givenNumber">18</span>
      </div>

      <div class="number-circle target-circle" id="targetCircle">
        <svg class="unit-svg" viewBox="0 0 100 132" aria-hidden="true"><use href="#capRing"/></svg>
        <span class="unit-number" id="targetNumber"></span>
      </div>

    </div>

    <!-- OPTIONS -->
    <div class="options-row" id="optionsRow">
      <!-- injected by JS -->
    </div>

  </div>

  <div class="nav">
    <button class="prev" id="prevBtn" disabled>← Prev</button>
    <button class="next" id="nextBtn" disabled>Next →</button>
  </div>

</div>

<div class="hint-overlay" id="hintOverlay" aria-live="polite">
  <div class="hint-box">
    <h3>Hint</h3>
    <p id="hintText">Look at the number in the circle and choose the number that comes just after it.</p>
    <button class="popup-btn" id="closeHintBtn">Got it!</button>
  </div>
</div>

<!-- POPUPS -->
<div id="answerPopup" class="popup">
  <div class="popup-content">
    <div class="popup-icon" id="popupIcon"></div>
    <h3 id="popupTitle"></h3>
    <p id="popupMsg"></p>
  </div>
</div>

<div id="finalPopup">
  <div class="finalpopup-box">
    <h2 class="final-heading">🎉 Amazing Job!</h2>
    <p id="finalScore"></p>
    <div id="stars">⭐⭐⭐</div>
    <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
  </div>
</div>

<!-- SOUNDS -->
<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>

/* =========================================================
   QUESTION DATA
   ========================================================= */
const QUESTIONS = [
  { given:18, answer:19,  options:[19,17,28] },
  { given:23, answer:24,  options:[34,24,22] },
  { given:44, answer:45,  options:[54,43,45] },
  { given:76, answer:77,  options:[77,67,75] },
  { given:59, answer:60,  options:[69,60,58] },
  { given:99, answer:100, options:[90,98,100] }
];

/* =========================================================
   STATE
   ========================================================= */
const total = QUESTIONS.length;
let current = 0;
let busy = false;
const state = QUESTIONS.map(() => ({ answered:false, wrongPicks:[] }));

/* =========================================================
   ELEMENTS
   ========================================================= */
const qLabel       = document.getElementById("qLabel");
const targetCircle = document.getElementById("targetCircle");
const targetNumber = document.getElementById("targetNumber");
const givenNumber  = document.getElementById("givenNumber");
const optionsRow   = document.getElementById("optionsRow");
const prevBtn      = document.getElementById("prevBtn");
const nextBtn      = document.getElementById("nextBtn");
const correctSound = document.getElementById("correctSound");
const wrongSound   = document.getElementById("wrongSound");
const homeBtn      = document.getElementById("homeBtn");
const hintBtn      = document.getElementById("hintBtn");
const hintOverlay  = document.getElementById("hintOverlay");
const closeHintBtn = document.getElementById("closeHintBtn");
const hintText     = document.getElementById("hintText");

/* =========================================================
   RENDER
   ========================================================= */
function makeOption(value){
  const btn = document.createElement("button");
  btn.className = "arrow-option";
  btn.type = "button";
  btn.dataset.value = String(value);
  btn.setAttribute("aria-label", String(value));
  btn.innerHTML =
    '<svg class="unit-svg" viewBox="0 0 100 132" aria-hidden="true"><use href="#capRing"/></svg>' +
    '<span class="unit-number">' + value + '</span>';
  return btn;
}

function renderQuestion(){
  const q  = QUESTIONS[current];
  const st = state[current];

  qLabel.textContent = `Q${current + 1}.`;
  givenNumber.textContent = q.given;

  /* second circle stays blank until the right answer is picked */
  targetCircle.classList.remove("revealed","miss-flash");
  targetNumber.textContent = st.answered ? q.answer : "";
  if(st.answered) targetCircle.classList.add("revealed");

  optionsRow.innerHTML = "";

  q.options.forEach(value => {
    const btn = makeOption(value);

    if(st.answered){
      btn.disabled = true;
      btn.classList.add(value === q.answer ? "correct-hit" : "faded");
    }else if(st.wrongPicks.includes(value)){
      btn.disabled = true;
      btn.classList.add("faded");
    }else{
      btn.addEventListener("click", () => handlePick(btn, value));
    }

    optionsRow.appendChild(btn);
  });

  prevBtn.disabled = current === 0;
  nextBtn.disabled = !st.answered || current === total - 1;
}

/* =========================================================
   ANSWER
   ========================================================= */
function handlePick(optionEl, value){
  const st = state[current];
  if(st.answered || busy) return;

  const q = QUESTIONS[current];
  busy = true;

  optionsRow.querySelectorAll(".arrow-option").forEach(b => b.disabled = true);

  if(value === q.answer){
    st.answered = true;

    optionEl.classList.add("correct-hit");

    /* fill the blank circle */
    targetNumber.textContent = q.answer;
    targetCircle.classList.add("revealed");

    optionsRow.querySelectorAll(".arrow-option").forEach(b => {
      if(b !== optionEl) b.classList.add("faded");
    });

    correctSound.currentTime = 0;
    correctSound.play().catch(() => {});
    speak("correct");
    showPopup(true);
    fireConfetti();

    nextBtn.disabled = current === total - 1;
    busy = false;

    if(current === total - 1){
      setTimeout(() => { fireBigConfetti(); showFinal(); }, 1100);
    }

  }else{
    st.wrongPicks.push(value);

    wrongSound.currentTime = 0;
    wrongSound.play().catch(() => {});
    targetCircle.classList.add("miss-flash");
    speak("Try again");
    showPopup(false);

    setTimeout(() => {
      targetCircle.classList.remove("miss-flash");
      optionEl.classList.add("faded");

      optionsRow.querySelectorAll(".arrow-option").forEach(b => {
        if(!st.wrongPicks.includes(Number(b.dataset.value))) b.disabled = false;
      });

      busy = false;
    }, 500);
  }
}

/* =========================================================
   POPUPS
   ========================================================= */
function showPopup(isCorrect){
  const popup = document.getElementById("answerPopup");
  popup.className = "popup " + (isCorrect ? "correct" : "wrong");
  popup.style.display = "flex";

  document.getElementById("popupIcon").textContent  = isCorrect ? "🎉" : "❌";
  document.getElementById("popupTitle").textContent = isCorrect ? "Correct!" : "Try Again!";
  document.getElementById("popupMsg").textContent   = isCorrect ? "Great job!" : "That's not quite right.";

  clearTimeout(showPopup._t);
  showPopup._t = setTimeout(() => { popup.style.display = "none"; }, 1100);
}

function showFinal(){
  document.getElementById("finalPopup").style.display = "flex";
  document.getElementById("finalScore").textContent = `${total} / ${total} Completed`;
  document.getElementById("stars").textContent = "⭐⭐⭐";
}

/* =========================================================
   CONFETTI
   ========================================================= */
function fireConfetti(){
  if(!window.confetti) return;
  confetti({
    particleCount:24, spread:55, startVelocity:26,
    origin:{ x:.5, y:.4 },
    colors:["#e6473f","#3a6fd8","#f7b733","#8bba8a","#c9a8e0"]
  });
}

function fireBigConfetti(){
  if(!window.confetti) return;
  const end = Date.now() + 1800;
  (function frame(){
    confetti({ particleCount:6, angle:60,  spread:55, origin:{ x:0 } });
    confetti({ particleCount:6, angle:120, spread:55, origin:{ x:1 } });
    if(Date.now() < end) requestAnimationFrame(frame);
  })();
}

/* =========================================================
   SPEAK
   ========================================================= */
function speak(t){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-US";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

/* =========================================================
   NAV + HINT
   ========================================================= */
prevBtn.addEventListener("click", () => {
  if(current === 0) return;
  current--;
  renderQuestion();
});

nextBtn.addEventListener("click", () => {
  if(nextBtn.disabled) return;
  if(current < total - 1){
    current++;
    renderQuestion();
  }
});

homeBtn.addEventListener("click", () => {
  window.location.href = "../Grade2_chapter1.html";
});

hintBtn.addEventListener("click", () => {
  hintText.textContent = `Look at ${QUESTIONS[current].given}. The answer is the number right after it.`;
  hintOverlay.classList.add("show");
});

closeHintBtn.addEventListener("click", () => hintOverlay.classList.remove("show"));

hintOverlay.addEventListener("click", e => {
  if(e.target === hintOverlay) hintOverlay.classList.remove("show");
});

/* =========================================================
   START
   ========================================================= */
renderQuestion();

</script>

</body>
</html>
