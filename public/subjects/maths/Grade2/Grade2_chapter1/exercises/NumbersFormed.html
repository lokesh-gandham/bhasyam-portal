<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Write the Number Formed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* =========================================================
   NUMBER TOWN — base-ten block place value quiz
   Light pastel palette, no enclosing "card" — every piece
   (tens box, ones box, each answer tile, buttons) reads as
   its own separate shape on an open pastel background.
   ========================================================= */

    :root {
      --ink: #4a4266;
      --ink-soft: #8078a0;

      --bg-a: #fffaf0;
      --bg-b: #f0f9ff;
      --bg-c: #f7f3ff;

      --tens: #7fb8e8;
      --tens-deep: #5b97cf;
      --tens-tint: #eef7ff;

      --ones: #7fd9ae;
      --ones-deep: #4fb884;
      --ones-tint: #eefcf5;

      --coral: #ffab91;
      --coral-deep: #f28a6b;

      --sky: #8fe1f2;
      --sky-deep: #4fbcd6;

      --gold: #ffd97a;
      --purple: #c3b2f2;
      --purple-deep: #9c85e0;

      --wrong: #ff9caa;
      --wrong-deep: #e56e80;

      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    .quiz-card,
    .quiz-card * {
      cursor: default !important;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      margin: 0;
      min-height: 100vh;
      height: 100%;
      font-family: "Livvic", sans-serif;
      font-weight: 400;
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: calc(8px + env(safe-area-inset-top, 0px)) 10px calc(14px + env(safe-area-inset-bottom, 0px));
      position: relative;

    }

    /* ===== TOP BAR (home / hint) ===== */
    .topbar {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: 48px;
      right: 48px;
      width: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5000;
      padding: 0;
      pointer-events: none;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      pointer-events: auto;
    }

    .icon-flat {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 3px solid #ffffff;
      border-radius: 50%;
      font-size: 24px;
      line-height: 1;
      cursor: pointer !important;
      pointer-events: auto;
      box-shadow: 0 5px 0 rgba(0, 0, 0, .10), 0 7px 14px rgba(0, 0, 0, .10);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    #homeBtn {
      background: linear-gradient(180deg, var(--coral) 0%, var(--coral-deep) 100%);
    }

    #hintBtn {
      background: linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%);
    }

    .icon-flat:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 0 rgba(0, 0, 0, .10), 0 12px 18px rgba(0, 0, 0, .10);
    }

    .icon-flat:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .10), 0 4px 8px rgba(0, 0, 0, .08);
    }

    @media (min-width:769px) {
      .topbar {
        top: calc(14px + env(safe-area-inset-top, 0px));
        left: 18px;
        right: 18px;
      }

      .icon-flat {
        width: 56px;
        height: 56px;
        font-size: 27px;
      }
    }

    /* ===== HINT POPUP ===== */
    .hint-overlay {
      position: fixed;
      inset: 0;
      background: rgba(74, 66, 102, .30);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .hint-overlay.show {
      display: flex;
    }

    .hint-box {
      width: min(90%, 420px);
      background: #fff;
      border-radius: 26px;
      padding: 26px 24px;
      text-align: center;
      box-shadow: 0 12px 0 rgba(74, 66, 102, .08), 0 20px 40px rgba(74, 66, 102, .14);
      border: 4px solid var(--sky);
    }

    .hint-box h3 {
      margin: 0 0 8px;
      font-family: "Livvic", sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--sky-deep);
    }

    .hint-box p {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
    }

    .popup-btn {
      border: none;
      border-radius: 14px;
      padding: 11px 26px;
      font-size: 17px;
      font-family: "Livvic", sans-serif;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%);
      cursor: pointer !important;
      box-shadow: 0 5px 0 rgba(0, 0, 0, .12);
    }

    /* ===== CONTENT AREA (no enclosing card — just a layout width) ===== */
    .quiz-card {
      position: relative;
      z-index: 1;
      width: min(990px, calc(100vw - 36px));
      max-width: 100%;
      padding: 18px 16px 14px;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* ===== HEADING / PROGRESS ===== */
    .heading-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 4px 0 clamp(4px, 1vh, 10px);
    }

    .heading-badge {
      font-size: 30px;
      flex-shrink: 0;
    }

    .heading {
      margin: 0;
      text-align: center;
      font-family: "Livvic", sans-serif;
      font-size: clamp(28px, 2vw, 32px);
      font-weight: 400;
      color: var(--ink);
    }

    .progress {
      display: inline-block;
      margin: 0 auto 8px;
      text-align: center;
      font-family: "Livvic", sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: #2f4f4f;
      background: #f3edff;
      padding: 5px 16px;
      border-radius: 999px;
      line-height: 1.2;
      visibility: hidden;
    }

    .progress-wrap {
      display: flex;
      justify-content: center;
    }

    /* ===== VISUAL AREA — the two colored boxes are the "separate" pieces ===== */
    .visuals {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 22px;
    }

    .visual-card {
      flex: 1 1 0;
      border-radius: 26px;
      padding: clamp(10px, 1.8vh, 18px) 12px clamp(8px, 1.4vh, 16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: clamp(150px, 24vh, 215px);
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(74, 66, 102, .08);
      box-shadow: 0 8px 20px rgb(0 0 0 / 11%);
    }

    .tens-card {
      background: var(--tens-tint);
    }

    .ones-card {
      background: var(--ones-tint);
    }

    .group-tag {
      font-weight: 400;
      font-size: 14px;
      letter-spacing: .2px;
      padding: 4px 14px;
      border-radius: 999px;
      color: #fff;
      align-self: center;
    }

    .tens-card .group-tag {
      background: linear-gradient(180deg, var(--tens) 0%, var(--tens-deep) 100%);
    }

    .ones-card .group-tag {
      background: linear-gradient(180deg, var(--ones) 0%, var(--ones-deep) 100%);
    }

    .bundles,
    .ones-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      align-content: center;
      min-height: 74px;
      padding: 6px 0;
    }

    /* --- Tens: a rod of 10 connected cubes, base-ten block style --- */
    .ten-rod {
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      padding: 3px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .6);
      box-shadow: 0 2px 5px rgba(91, 151, 207, .20);
      flex-shrink: 0;
    }

    .ten-rod .cube {
      width: clamp(20px, 3.4vw, 28px);
      height: clamp(6px, 1.1vh, 9px);
      border-radius: 3px;
      background: linear-gradient(180deg, #bfe0f7 0%, var(--tens) 55%, var(--tens-deep) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 -1px 0 rgba(0, 0, 0, .08);
    }

    /* --- Ones: single rounded cubes --- */
    .one-cube {
      width: clamp(30px, 5vw, 44px);
      height: clamp(30px, 5vw, 44px);
      border-radius: 11px;
      flex-shrink: 0;
      background: linear-gradient(160deg, #c3f0da 0%, var(--ones) 55%, var(--ones-deep) 100%);
      box-shadow: 0 4px 8px rgba(79, 184, 132, .22), inset 0 -3px 0 rgba(0, 0, 0, .08), inset 0 2px 0 rgba(255, 255, 255, .4);
    }

    .ones-wrap.large-one .one-cube {
      width: clamp(42px, 7vw, 60px);
      height: clamp(42px, 7vw, 60px);
      border-radius: 14px;
    }

    .visual-label {
      margin: 12px 0 0;
      font-family: "Livvic", sans-serif;
      font-size: 30px;
      font-weight: 600;
      color: var(--ink-soft);
      text-align: center;
    }

    .tens-card .visual-label {
      color: #2f4f4f;
      font-weight: 400;
    }

    .ones-card .visual-label {
      color: #2f4f4f;
      font-weight: 400;
    }

    /* ===== ARROW ===== */
    .arrow-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: clamp(6px, 1.6vh, 18px) 0;
    }

    .arrow-shape {
      width: clamp(38px, 4.4vw, 52px);
      height: clamp(30px, 4.6vh, 42px);
      position: relative;
    }

    .arrow-shape::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--purple) 0%, var(--purple-deep) 100%);
      clip-path: polygon(0% 30%, 55% 30%, 55% 0%, 100% 50%, 55% 100%, 55% 70%, 0% 70%);
      filter: drop-shadow(0 4px 6px rgba(156, 133, 224, .30));
      animation: nudge 1.6s ease-in-out infinite;
    }

    @keyframes nudge {

      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(4px);
      }
    }

    /* ===== ANSWERS — each tile is its own separate shape ===== */
    .answers {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      margin-top: 4px;
      width: 100%;
    }

    .answer-tile {
      position: relative;
      width: clamp(120px, 16vw, 140px);
      height: clamp(120px, 16vw, 140px);
      aspect-ratio: 1/1;
      cursor: pointer !important;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      font-family: "Livvic", sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: var(--ink);
      transition: transform .16s ease, box-shadow .16s ease, background-color .25s ease, border-color .25s ease;
    }

    /* same size for every question — no later-questions override */

    /* toy-block coloring: each option in the row gets its own pastel */
    .answer-tile:nth-child(3n+1) {
      background: var(--tens-tint);
      border: 3px solid #bfe1f7;
      box-shadow: 0 7px 0 #bfe1f7, 0 11px 18px rgba(74, 66, 102, .08);
    }

    .answer-tile:nth-child(3n+2) {
      background: #fff1ea;
      border: 3px solid #ffcdb3;
      box-shadow: 0 7px 0 #ffcdb3, 0 11px 18px rgba(74, 66, 102, .08);
    }

    .answer-tile:nth-child(3n+3) {
      background: #fff8e6;
      border: 3px solid #ffe4a3;
      box-shadow: 0 7px 0 #ffe4a3, 0 11px 18px rgba(74, 66, 102, .08);
    }

    .answer-tile:hover:not(.locked):not(.disabled-all) {
      transform: translateY(-4px);
    }

    .answer-tile:active:not(.locked):not(.disabled-all) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .08), 0 4px 8px rgba(74, 66, 102, .08) !important;
    }

    .answer-tile.correct {
      background: var(--ones-tint);
      border-color: var(--ones);
      color: var(--ones-deep);
      box-shadow: 0 7px 0 var(--ones-deep), 0 12px 24px rgba(79, 184, 132, .24) !important;
      animation: correctPop .5s cubic-bezier(.34, 1.56, .64, 1);
    }

    .answer-tile.locked {
      cursor: not-allowed !important;
    }

    .answer-tile.disabled-all {
      pointer-events: none;
    }

    .answer-tile.shake {
      animation: shake .45s ease;
      border-color: var(--wrong);
      background: #fff3f4;
      box-shadow: 0 7px 0 var(--wrong-deep), 0 11px 18px rgba(229, 110, 128, .20) !important;
    }

    @keyframes correctPop {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes shake {
      20% {
        transform: translateX(-8px);
      }

      40% {
        transform: translateX(8px);
      }

      60% {
        transform: translateX(-6px);
      }

      80% {
        transform: translateX(6px);
      }

      100% {
        transform: translateX(0);
      }
    }

    /* sparkles around correct tile */
    .sparkle {
      position: absolute;
      font-size: 16px;
      pointer-events: none;
      z-index: 5;
      animation: sparklePop .7s ease forwards;
    }

    @keyframes sparklePop {
      0% {
        opacity: 0;
        transform: scale(0) translateY(0);
      }

      30% {
        opacity: 1;
        transform: scale(1) translateY(-6px);
      }

      100% {
        opacity: 0;
        transform: scale(.6) translateY(-26px);
      }
    }

    /* ===== NAV — separate pill buttons on the open background ===== */
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: clamp(10px, 2.2vh, 22px);
    }

    .nav button {
      min-width: 132px;
      padding: 10px 25px;
      border: none;
      border-radius: 15px;
      font-family: "Livvic", sans-serif;
      font-size: clamp(17px, 1.5vw, 20px);
      font-weight: 600;
      color: #fff;
      cursor: pointer !important;
      box-shadow: 0 6px 0 rgba(0, 0, 0, .10), 0 9px 14px rgba(0, 0, 0, .10);
      transition: all .15s ease;
    }

    .prev {
      background: linear-gradient(180deg, var(--coral) 0%, var(--coral-deep) 100%);
    }

    .next {
      background: linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%);
    }

    .nav button:not(:disabled):hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 0 rgba(0, 0, 0, .10), 0 13px 18px rgba(0, 0, 0, .12);
    }

    .nav button:not(:disabled):active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .10), 0 4px 8px rgba(0, 0, 0, .08);
    }

    .nav button:disabled {
      opacity: .45;
      cursor: not-allowed !important;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .08);
    }

    /* ===== CORRECT / WRONG POPUP ===== */
    .popup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .popup-content {
      position: relative;
      width: min(400px, 88%);
      padding: 32px 35px 28px;
      text-align: center;
      border: 5px solid #ffffff;
      border-radius: 28px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, .10), 0 18px 35px rgba(0, 0, 0, .14);
      animation: gamingPopup .45s cubic-bezier(.34, 1.56, .64, 1);
      overflow: hidden;
    }

    .popup.correct .popup-content {
      background: linear-gradient(180deg, #e2f9ea 0%, #a7e8c1 100%);
      box-shadow: 0 8px 0 var(--ones-deep), 0 18px 35px rgba(79, 184, 132, .20);
    }

    .popup.wrong .popup-content {
      background: linear-gradient(180deg, #ffe3e6 0%, #ffb6bf 100%);
      box-shadow: 0 8px 0 var(--wrong-deep), 0 18px 35px rgba(229, 110, 128, .20);
    }

    .popup-icon {
      font-size: 68px;
      line-height: 1;
      margin-bottom: 12px;
      filter: drop-shadow(0 5px 4px rgba(0, 0, 0, .12));
      animation: gamingIcon .6s cubic-bezier(.34, 1.56, .64, 1);
    }

    .popup-content h3 {
      margin: 5px 0 10px;
      font-family: "Livvic", sans-serif;
      font-size: 34px;
      font-weight: 700;
      color: var(--ones-deep);
    }

    .popup.wrong .popup-content h3 {
      color: var(--wrong-deep);
    }

    .popup-content p {
      display: inline-block;
      margin: 0;
      padding: 8px 18px;
      border-radius: 30px;
      background: rgba(255, 255, 255, .75);
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
    }

    @keyframes gamingPopup {
      0% {
        opacity: 0;
        transform: scale(.55) rotate(-5deg);
      }

      60% {
        opacity: 1;
        transform: scale(1.08) rotate(2deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes gamingIcon {
      0% {
        transform: scale(0) rotate(-20deg);
      }

      50% {
        transform: scale(1.25) rotate(10deg);
      }

      75% {
        transform: scale(.9) rotate(-5deg);
      }

      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    /* ===== FINAL POPUP ===== */
    #finalPopup {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }

    .finalpopup-box {
      position: relative;
      width: min(470px, 90%);
      padding: 34px 38px 32px;
      text-align: center;
      background: linear-gradient(180deg, #ece3ff 0%, #cabdf5 100%);
      border: 5px solid #ffffff;
      border-radius: 30px;
      box-shadow: 0 9px 0 var(--purple-deep), 0 22px 45px rgba(156, 133, 224, .25);
      animation: finalGamingPopup .6s cubic-bezier(.34, 1.56, .64, 1);
      overflow: hidden;
    }

    .finalpopup-box::before {
      content: "✨";
      position: absolute;
      top: 18px;
      left: 22px;
      font-size: 28px;
      animation: sparkleFloat 1.5s ease-in-out infinite;
    }

    .finalpopup-box::after {
      content: "⭐";
      position: absolute;
      top: 24px;
      right: 22px;
      font-size: 25px;
      animation: sparkleFloat 1.8s ease-in-out infinite;
    }

    .final-heading {
      position: relative;
      z-index: 2;
      margin: 4px 0 14px;
      font-family: "Livvic", sans-serif;
      font-size: 38px;
      font-weight: 700;
      color: #5a4a8a;
    }

    #finalScore {
      display: inline-block;
      margin: 5px 0 12px;
      padding: 10px 28px;
      border-radius: 25px;
      background: rgba(255, 255, 255, .9);
      border: 3px solid #ffffff;
      font-family: "Livvic", sans-serif;
      font-size: 27px;
      font-weight: 700;
      color: var(--purple-deep);
    }

    #stars {
      margin: 8px 0 18px;
      font-size: 48px;
      line-height: 1;
      letter-spacing: 8px;
      filter: drop-shadow(0 5px 4px rgba(120, 80, 20, .22));
      animation: starsBounce .7s .25s both cubic-bezier(.34, 1.56, .64, 1);
    }

    .playAgain-btn {
      min-width: 190px;
      padding: 13px 32px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(180deg, #9fe8ae 0%, #63c982 100%);
      font-family: "Livvic", sans-serif;
      font-size: 21px;
      font-weight: 700;
      color: #1e5c36;
      cursor: pointer !important;
      box-shadow: 0 6px 0 #4fa869, 0 10px 18px rgba(79, 168, 105, .20);
      transition: all .15s ease;
    }

    .playAgain-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 0 #4fa869, 0 15px 22px rgba(79, 168, 105, .24);
    }

    .playAgain-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #4fa869, 0 5px 10px rgba(79, 168, 105, .18);
    }

    @keyframes finalGamingPopup {
      0% {
        opacity: 0;
        transform: scale(.55) rotate(-6deg);
      }

      55% {
        opacity: 1;
        transform: scale(1.08) rotate(2deg);
      }

      75% {
        transform: scale(.97) rotate(-1deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes starsBounce {
      0% {
        opacity: 0;
        transform: scale(0);
      }

      60% {
        opacity: 1;
        transform: scale(1.25) rotate(5deg);
      }

      80% {
        transform: scale(.92);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes sparkleFloat {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-7px) rotate(12deg);
      }
    }

    /* ===== RESPONSIVE (mirrors original breakpoints, original-scale font sizes) ===== */
    @media (min-width:1024px) and (max-width:1399px) {
      body {
        padding: 18px 10px;
      }

      .quiz-card {
        width: min(900px, calc(100vw - 46px));
        padding: 12px 18px 10px;
      }

      .heading {
        font-size: 31px;
      }

    @media (max-width:768px) {

      .ones-wrap {

      .final-heading {

      #stars {

    @media (max-width:480px) {

      }

      }

      }

      .popup-content p {
        font-size: 14px;
      }

      .finalpopup-box {
        padding: 16px 14px;
        max-width: 290px;
      }

      .final-heading {
        font-size: 22px;
      }

      #finalScore {
        font-size: 18px;
      }

      #stars {

        letter-spacing: 4px;

    @media (max-width:360px) {

        padding: 4px;
      }

    }

    @media (min-width:1600px) {
      .quiz-card {
        width: 1400px;
        max-width: 1400px;
        padding: 24px 30px 18px;
        gap: 20px;
      }

      .progress{
        display: none;
      }

      .heading {
        font-size: 44px;
      }

      .visual-card {
        min-height: 210px;
        padding: 28px 22px 22px;
      }

      .visual-label {
        font-size: 40px;
        margin-top: 14px;
      }

      .answers {
        gap: 34px;
      }

      .answer-tile {
        width: 160px;
        height: 160px;
        font-size: 38px;
      }

      .nav button {
        font-size: 24px;
        padding: 14px 36px;
      }

      .popup-content {
        padding: 36px 48px;
        max-width: 460px;
      }

      .popup-icon {
        font-size: 80px;
      }

      .popup-content h3 {
        font-size: 40px;
      }

      .popup-content p {
        font-size: 26px;
      }

      .finalpopup-box {
        padding: 40px 52px;
        max-width: 500px;
      }

      .final-heading {
        font-size: 44px;
      }

      #finalScore {
        font-size: 32px;
      }

      #stars {
        font-size: 56px;
        letter-spacing: 10px;
      }

      .playAgain-btn {
        padding: 16px 44px;
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <button class="icon-flat" id="homeBtn" style="visibility: hidden;" title="Home" aria-label="Home">🏠</button>
    <div class="topbar-right">
      <button class="icon-flat" id="hintBtn" title="Hint" aria-label="Hint">💡</button>
    </div>
  </div>

  <div class="quiz-card">

    <div class="heading-row">
      <span class="heading-badge">🔢</span>
      <p class="heading" id="heading">Write the Number Formed</p>
    </div>
    <div class="progress-wrap">
      <div class="progress" id="progress">Question 1 of 6</div>
    </div>

    <div class="visuals">
      <div class="visual-card tens-card">
        <span class="group-tag">TENS</span>
        <div class="bundles" id="bundlesContainer"></div>
        <p class="visual-label" id="tensLabel"></p>
      </div>

      <div class="visual-card ones-card">
        <span class="group-tag">ONES</span>
        <div class="ones-wrap" id="onesContainer"></div>
        <p class="visual-label" id="onesLabel"></p>
      </div>
    </div>

    <div class="arrow-wrap">
      <div class="arrow-shape"></div>
    </div>

    <div class="answers" id="answersContainer"></div>

    <div class="nav">
      <button class="prev" id="prevBtn" disabled>← Prev</button>
      <button class="next" id="nextBtn" disabled>Next →</button>
    </div>

  </div>

  <!-- HINT POPUP -->
  <div class="hint-overlay" id="hintOverlay" aria-live="polite">
    <div class="hint-box">
      <h3>💡 Hint</h3>
      <p id="hintText">Count the objects from left to right, then tap the right one.</p>
      <button class="popup-btn" id="closeHintBtn">Got it!</button>
    </div>
  </div>

  <!-- CORRECT / WRONG POPUP -->
  <div id="answerPopup" class="popup">
    <div class="popup-content">
      <div class="popup-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <!-- FINAL POPUP -->
  <div id="finalPopup">
    <div class="finalpopup-box">
      <h2 class="final-heading">🎉 Amazing Job!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div><br>
      <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
    </div>
  </div>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

  <script>
    // ===== QUESTION DATA (matches the worksheet: a-f) =====
    const quizData = [
      { tens: 2, ones: 4, answer: 24, options: [23, 25, 24], answered: false }, // a) 2 tens 4 ones
      { tens: 6, ones: 0, answer: 60, options: [59, 60, 61], answered: false }, // b) 6 tens
      { tens: 1, ones: 8, answer: 18, options: [18, 17, 19], answered: false }, // c) 1 ten 8 ones
      { tens: 9, ones: 1, answer: 91, options: [91, 90, 92], answered: false }, // d) 9 tens 1 one
      { tens: 8, ones: 3, answer: 83, options: [82, 83, 84], answered: false }, // e) 8 tens 3 ones
      { tens: 7, ones: 2, answer: 72, options: [71, 73, 72], answered: false }, // f) 7 tens 2 ones
    ];

    let index = 0;
    let score = 0;

    // ===== DOM =====
    const progressEl = document.getElementById("progress");
    const bundlesContainer = document.getElementById("bundlesContainer");
    const onesContainer = document.getElementById("onesContainer");
    const tensLabel = document.getElementById("tensLabel");
    const onesLabel = document.getElementById("onesLabel");
    const answersContainer = document.getElementById("answersContainer");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const correctSound = document.getElementById("correctSound");
    const wrongSound = document.getElementById("wrongSound");

    // ===== SOUND =====
    function playSound(audio) {
      audio.currentTime = 0;
      audio.play().catch(() => { });
    }
    function speak(t) {
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-US";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }

    // ===== CONFETTI =====
    function fireConfettiAt(el) {
      if (window.innerWidth < 769 || !window.confetti) return;
      const rect = el.getBoundingClientRect();
      confetti({
        particleCount: 26,
        spread: 55,
        startVelocity: 28,
        origin: {
          x: (rect.left + rect.width / 2) / window.innerWidth,
          y: (rect.top + rect.height / 2) / window.innerHeight,
        },
        colors: ["#7fb8e8", "#7fd9ae", "#ffab91", "#ffd97a", "#c3b2f2"],
      });
    }

    function fireBigConfetti() {
      if (window.innerWidth < 769 || !window.confetti) return;
      const duration = 2000;
      const end = Date.now() + duration;
      (function frame() {
        confetti({ particleCount: 6, angle: 60, spread: 55, origin: { x: 0 } });
        confetti({ particleCount: 6, angle: 120, spread: 55, origin: { x: 1 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    // ===== SPARKLES (only around the correct option) =====
    function spawnSparkles(el) {
      const icons = ["✨", "⭐", "🌟"];
      const count = 3;
      for (let i = 0; i < count; i++) {
        const s = document.createElement("span");
        s.className = "sparkle";
        s.textContent = icons[Math.floor(Math.random() * icons.length)];
        const angle = (i / count) * Math.PI * 2;
        const radius = 60;
        s.style.left = `calc(50% + ${Math.cos(angle) * radius}px)`;
        s.style.top = `calc(50% + ${Math.sin(angle) * radius}px)`;
        s.style.animationDelay = `${i * 0.04}s`;
        el.appendChild(s);
        setTimeout(() => s.remove(), 750);
      }
    }

    // ===== BUILD VISUALS (base-ten blocks, drawn with CSS — no image files needed) =====
    function createBundle() {
      const rod = document.createElement("div");
      rod.className = "ten-rod";
      for (let i = 0; i < 10; i++) {
        const cube = document.createElement("div");
        cube.className = "cube";
        rod.appendChild(cube);
      }
      return rod;
    }

    function createOneBar() {
      const cube = document.createElement("div");
      cube.className = "one-cube";
      return cube;
    }

    function renderVisuals(q) {
      // ===== TENS =====
      bundlesContainer.innerHTML = "";
      for (let i = 0; i < q.tens; i++) {
        bundlesContainer.appendChild(createBundle());
      }

      // ===== ONES =====
      onesContainer.innerHTML = "";
      onesContainer.classList.toggle("large-one", q.tens > 5);
      for (let i = 0; i < q.ones; i++) {
        onesContainer.appendChild(createOneBar());
      }

      tensLabel.textContent = `There are ${q.tens} ten${q.tens === 1 ? "" : "s"}`;
      onesLabel.textContent = `There are ${q.ones} one${q.ones === 1 ? "" : "s"}`;
    }

    // ===== BUILD ANSWER OPTIONS (friendly number tiles) =====
    function createOption(value) {
      const opt = document.createElement("div");
      opt.className = "answer-tile";
      opt.dataset.value = value;
      opt.textContent = value;

      opt.addEventListener("click", () => selectAnswer(value, opt));
      return opt;
    }

    function renderAnswers(q) {
      answersContainer.innerHTML = "";
      answersContainer.classList.toggle("later-questions", index >= 3);
      q.options.forEach((value) => {
        const opt = createOption(value);
        if (q.answered) {
          opt.classList.add("disabled-all");
          if (value === q.answer) {
            opt.classList.add("correct", "locked");
          }
        }
        answersContainer.appendChild(opt);
      });
    }

    // ===== LOAD QUESTION =====
    function loadQuestion() {
      const q = quizData[index];

      progressEl.textContent = `Question ${index + 1} of ${quizData.length}`;
      renderVisuals(q);
      renderAnswers(q);

      prevBtn.disabled = index === 0;
      nextBtn.disabled = !q.answered;

      const isLast = index === quizData.length - 1;
      nextBtn.textContent = isLast ? "Finish" : "Next →";
    }

    // ===== ANSWER LOGIC =====
    function selectAnswer(value, el) {
      const q = quizData[index];
      if (q.answered) return;

      if (value === q.answer) {
        q.answered = true;
        score++;

        el.classList.add("correct", "locked");
        document.querySelectorAll(".answer-tile").forEach((o) => o.classList.add("disabled-all"));

        spawnSparkles(el);
        speak("correct");
        // playSound(correctSound);
        showPopup(true, q);
        nextBtn.disabled = false;

        const isLast = index === quizData.length - 1;
        if (isLast) {
          setTimeout(() => {
            fireBigConfetti();
            showFinal();
          }, 1600);
        } else {
          fireConfettiAt(el);
        }
      } else {
        el.classList.add("shake");
        setTimeout(() => el.classList.remove("shake"), 450);
        speak("Try again");
        // playSound(wrongSound);
        showPopup(false, q);
      }
    }

    // ===== NAVIGATION =====
    prevBtn.onclick = () => {
      if (index === 0) return;
      index--;
      loadQuestion();
    };

    nextBtn.onclick = () => {
      const q = quizData[index];
      if (!q.answered) return;

      const isLast = index === quizData.length - 1;
      if (isLast) {
        showFinal();
        return;
      }
      index++;
      loadQuestion();
    };

    // ===== POPUPS =====
    function showPopup(isCorrect, q) {
      const popup = document.getElementById("answerPopup");
      const icon = document.getElementById("popupIcon");
      const title = document.getElementById("popupTitle");
      const msg = document.getElementById("popupMsg");

      popup.className = "popup " + (isCorrect ? "correct" : "wrong");
      popup.style.display = "flex";

      if (isCorrect) {
        icon.textContent = "🎉";
        title.textContent = "Correct!";
        msg.textContent = `${q.tens} tens and ${q.ones} ones make ${q.answer}.`;
      } else {
        icon.textContent = "❌";
        title.textContent = "Try Again!";
        msg.textContent = "Think about the tens and ones.";
      }

      setTimeout(() => {
        popup.style.display = "none";
      }, 1200);
    }

    function showFinal() {
      const finalPopup = document.getElementById("finalPopup");
      finalPopup.style.display = "flex";

      const total = quizData.length;
      document.getElementById("finalScore").textContent = `${score} / ${total} Correct`;

      const starCount = Math.max(1, Math.round((score / total) * 3));
      document.getElementById("stars").textContent = "⭐".repeat(starCount);
    }

    // ===== HOME / HINT =====
    const homeBtn = document.getElementById("homeBtn");
    const hintBtn = document.getElementById("hintBtn");
    const hintOverlay = document.getElementById("hintOverlay");
    const closeHintBtn = document.getElementById("closeHintBtn");
    const hintText = document.getElementById("hintText");

    homeBtn.addEventListener("click", () => {
      window.location.href = "../Grade2_chapter1.html";
    });

    hintBtn.addEventListener("click", () => {
      hintText.textContent = "Look at the tens and ones shown above, then choose the number they form.";
      hintOverlay.classList.add("show");
    });

    closeHintBtn.addEventListener("click", () => {
      hintOverlay.classList.remove("show");
    });

    hintOverlay.addEventListener("click", (event) => {
      if (event.target === hintOverlay) {
        hintOverlay.classList.remove("show");
      }
    });

    // ===== START =====
    loadQuestion();
  </script>

</body>

</html>
