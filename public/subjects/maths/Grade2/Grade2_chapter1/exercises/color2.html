<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colour the Image → Balloons, Penguins & Rabbits</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="../assets/css/reuse.css">

<style>

/* =========================================================
   BASE — RESET
   ========================================================= */

*{
  box-sizing:border-box;
  font-family:"Livvic";
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:none;
  overscroll-behavior:none;
  user-select:none;
  -webkit-user-select:none;
}

html,
body,
.quiz-card,
.quiz-card *{
  cursor:default !important;
}

/* =========================================================
   BASE — QUIZ CARD
   ========================================================= */

.quiz-card{
  width:100%;
  height:100dvh;
  min-height:0;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:clamp(12px,2.4vh,26px) clamp(14px,3.6vw,50px);
  overflow:hidden;
  background:#F8F4FF;
 
  transition:background-color .35s ease;
}

.quiz-card.bg-yellow{
  background:#FEFAE8;
}

.quiz-card.bg-pink{
  background:#FDF4F8;
}

/* =========================================================
   BASE — TOPBAR
   ========================================================= */

.topbar{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex:0 0 auto;
  padding:0 4px 4px 4px;
  gap:8px;
}

.icon-flat{
  background:transparent;
  border:none;
  font-size:26px;
  line-height:1;
  padding:0 6px;
  cursor:pointer;
  transition:transform .2s ease;
  color:#2f2f2f;
  flex:0 0 auto;
}
.icon-flat:hover{
  transform:scale(1.15);
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
  flex:0 0 auto;
}

/* =========================================================
   BASE — HEADING
   ========================================================= */

.heading{
  margin:0;
  width:100%;
  text-align:center;
  font-size:30px;
  /* font-weight:700; */
  line-height:1.25;
  color:#2f2f2f;
}

/* =========================================================
   BASE — CONTENT ROW
   ========================================================= */

.content-row{
  width:100%;
  max-width:1500px;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(10px,2vh,26px);
  padding:0;
}

/* =========================================================
   BASE — QUESTION HEADER
   ========================================================= */

.question-heading{
  width:100%;
  max-width:900px;
  display:flex;
  align-items:baseline;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:0;
  flex:0 0 auto;
  text-align:center;
}

.qlabel{
  margin:0;
  font-size:30px;
  /* font-weight:800; */
  color:#2f2f2f;
}

.question-text{
  margin:0;
  font-size:30px;
  /* font-weight:600; */
  color:#2f2f2f;
}

.color-instruction{
  margin:0;
  width:100%;
  text-align:center;
  font-size:clamp(13px,1.6vw,18px);
  font-weight:500;
  color:#6b6b6b;
}

/* =========================================================
   BASE — IDENTIFY GRID (object selection)
   ========================================================= */

.archery-area{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:1 1 auto;
  min-height:0;
}

.options-row{
  width:100%;
  max-width:1400px;
  display:grid;
  grid-auto-rows:1fr;
  align-items:center;
  justify-items:center;
  column-gap:clamp(8px,2vw,20px);
  row-gap:clamp(10px,2.4vh,22px);
  padding:0;
  margin:0;
}

.options-row.items-8{
  grid-template-columns:repeat(4, minmax(0,1fr));
}

.options-row.items-10{
  grid-template-columns:repeat(5, minmax(0,1fr));
}

.object-btn{
  position:relative;
  width:100%;
  max-width:110px;
  aspect-ratio:2 / 3;
  padding:0;
  margin:0;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:transform .2s ease, opacity .25s ease, filter .2s ease;
}

.object-btn img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  pointer-events:none;
  -webkit-user-drag:none;
}

.object-btn:hover:not(:disabled){
  transform:translateY(-4px) scale(1.06);
}

.object-btn:active:not(:disabled){
  transform:translateY(1px) scale(.97);
}

.object-btn.wrong-pick{
  opacity:.32;
  filter:grayscale(.6);
  animation:objectShake .4s ease;
}

.object-btn.identified{
  outline:4px solid #4CAF50;
  outline-offset:3px;
  border-radius:16px;
}

.object-btn.identified::after{
  content:"✓";
  position:absolute;
  top:-10px;
  right:-6px;
  width:26px;
  height:26px;
  border-radius:50%;
  background:#4CAF50;
  color:#fff;
  font-weight:800;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}

@keyframes objectShake{
  0%,100%{ transform:translateX(0); }
  25%{ transform:translateX(-6px); }
  50%{ transform:translateX(6px); }
  75%{ transform:translateX(-3px); }
}

/* =========================================================
   BASE — COLOURING STAGE
   ========================================================= */

.coloring-stage{
  width:100%;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(12px,2.4vh,26px);
}

.canvas-group{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:clamp(14px,3vw,32px);
  flex:0 0 auto;
}

.color-canvas-wrap{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.color-canvas{
  display:block;
  height:clamp(140px,34dvh,260px);
  width:auto;
  aspect-ratio:2 / 3;
  border-radius:14px;
  background:#ffffff;
  box-shadow:0 4px 16px rgba(0,0,0,.10);
  touch-action:none;
}

.color-canvas-wrap.instance-done .color-canvas{
  box-shadow:0 0 0 4px #4CAF50, 0 4px 16px rgba(0,0,0,.10);
}

.instance-check{
  position:absolute;
  top:-10px;
  right:-10px;
  width:30px;
  height:30px;
  border-radius:50%;
  background:#4CAF50;
  color:#fff;
  font-weight:800;
  font-size:16px;
  display:none;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}

.color-canvas-wrap.instance-done .instance-check{
  display:flex;
}

.palette-panel{
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:clamp(10px,2.4vw,18px);
  flex:0 0 auto;
  padding:6px;
}

.swatch{
  width:clamp(38px,7vw,52px);
  height:clamp(38px,7vw,52px);
  border-radius:50%;
  border:3px solid #ffffff;
  box-shadow:0 0 0 2px rgba(0,0,0,.15), 0 3px 8px rgba(0,0,0,.18);
  flex:0 0 auto;
  touch-action:none;
  transition:transform .15s ease;
}

.swatch[data-color="white"]{ background:#FFFFFF; }
.swatch[data-color="black"]{ background:#2f2f2f; }
.swatch[data-color="orange"]{ background:#FF8C1A; }
.swatch[data-color="red"]{ background:#E8433D; }

.swatch.dragging-source{
  opacity:.35;
}

.swatch.selected-color{
  transform:scale(1.14);
  box-shadow:0 0 0 3px #2f2f2f, 0 4px 10px rgba(0,0,0,.22);
}

.swatch-ghost{
  position:fixed;
  top:0;
  left:0;
  width:56px;
  height:56px;
  border-radius:50%;
  border:3px solid #ffffff;
  box-shadow:0 0 0 2px rgba(0,0,0,.18), 0 6px 16px rgba(0,0,0,.28);
  pointer-events:none;
  z-index:999;
  transform:translate(-50%,-50%) scale(1.05);
}

/* =========================================================
   MEDIA — 481px and up (small tablets)
   ========================================================= */

@media (min-width:481px){
  .options-row{
    row-gap:clamp(12px,2.6vh,26px);
    column-gap:clamp(10px,2.2vw,24px);
  }
  .object-btn{
    max-width:130px;
  }
}

/* =========================================================
   MEDIA — 769px and up (laptop): explicit 2 rows x 5 columns,
   palette moves to the right side of the colouring canvas
   ========================================================= */

@media (min-width:769px){
  .quiz-card{
    padding:clamp(16px,2.6vh,30px) clamp(24px,3.2vw,60px);
  }
  .heading{
    font-size:clamp(20px,2vw,28px);
  }
  .question-text{
    font-size:clamp(22px,2vw,32px);
  }
  .qlabel{
    font-size:clamp(24px,2vw,36px);
  }
  .color-instruction{
    font-size:clamp(15px,1.4vw,19px);
  }
  .options-row.items-8{
    grid-template-columns:repeat(4, minmax(0,1fr));
  }
  .options-row.items-10{
    grid-template-columns:repeat(5, minmax(0,1fr));
  }
  .options-row{
    row-gap:clamp(16px,3vh,32px);
    column-gap:clamp(16px,2.4vw,32px);
  }
  .object-btn{
    max-width:150px;
  }
  .coloring-stage{
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:clamp(24px,4vw,60px);
  }
  .color-canvas{
    height:clamp(220px,46dvh,360px);
  }
  .palette-panel{
    flex-direction:column;
    gap:clamp(14px,2vh,24px);
  }
}

/* =========================================================
   MEDIA — 1200px and up (desktop): single row for every set
   ========================================================= */

@media (min-width:1200px){
  .content-row{
    gap:clamp(16px,2.6vh,32px);
  }
  .options-row.items-8{
    grid-template-columns:repeat(8, minmax(0,1fr));
  }
  .options-row.items-10{
    grid-template-columns:repeat(10, minmax(0,1fr));
  }
  .options-row{
    row-gap:0;
    column-gap:clamp(14px,1.6vw,30px);
  }
  .object-btn{
    max-width:135px;
  }
  .color-canvas{
    height:clamp(260px,50dvh,420px);
  }
  .swatch{
    width:clamp(46px,3vw,58px);
    height:clamp(46px,3vw,58px);
  }
}

/* =========================================================
   MEDIA — 1600px and up (large desktop)
   ========================================================= */

@media (min-width:1600px){
  .quiz-card{
    padding:28px 70px 10px;
  }
  .heading{
    font-size:30px;
  }
  .qlabel{
    font-size:40px;
  }
  .question-text{
    font-size:34px;
  }
  .options-row{
    column-gap:34px;
  }
  .object-btn{
    max-width:160px;
  }
  
  .color-canvas{
    height:520px;
  }

  .swatch{
    width:62px;
    height:62px;
  }
}

/* =========================================================
   MEDIA — very short screens (any width): keep it compact
   ========================================================= */

@media (max-height:640px){
  .quiz-card{
    padding-top:6px;
    padding-bottom:4px;
  }
  .content-row{
    gap:8px;
  }
  .options-row{
    row-gap:8px;
  }
  .object-btn{
    max-width:95px;
  }
  .coloring-stage{
    gap:8px;
  }
  .color-canvas{
    height:clamp(110px,30dvh,170px);
  }
  .swatch{
    width:clamp(32px,6vw,42px);
    height:clamp(32px,6vw,42px);
  }
}

</style>
</head>

<body>

<div class="quiz-card" id="quizCard">

  <div class="topbar">
    <button class="icon-flat" id="homeBtn" title="Home" style="display: none;" aria-label="Home">🏠</button>

    <div class="topbar-right">
      <button class="icon-flat" id="hintBtn" title="Hint" aria-label="Hint">💡</button>
    </div>
  </div>

  <p class="heading" id="heading">
Colour the image as per the given instructions.
  </p>

  <div class="content-row">

    <div class="question-heading">
      <span class="qlabel" id="qLabel">Q1.</span>
      <span class="question-text" id="questionText">Colour the 5th balloon.</span>
    </div>

    <p class="color-instruction" id="colorInstruction"></p>

    <div class="archery-area" id="archeryArea">
      <div class="options-row" id="optionsRow">
        <!-- identify grid injected by JS -->
      </div>
    </div>

  </div>

  <div class="nav">
    <button class="prev" id="prevBtn" disabled>← Prev</button>
    <button class="next" id="nextBtn" disabled>Next →</button>
  </div>

</div>

<div class="hint-overlay" id="hintOverlay" aria-live="polite">
  <div class="hint-box">
    <h3>Hint</h3>
    <p id="hintText">Count the objects from left to right, then tap the right one.</p>
    <button class="popup-btn" id="closeHintBtn">Got it!</button>
  </div>
</div>

<!-- POPUPS -->
<div id="answerPopup" class="popup">
  <div class="popup-content">
    <div class="popup-icon" id="popupIcon"></div>
    <h3 id="popupTitle"></h3>
    <p id="popupMsg"></p>
  </div>
</div>

<div id="finalPopup">
  <div class="finalpopup-box">
    <h2 class="final-heading">🎉 Amazing Job!</h2>
    <p id="finalScore"></p>
    <div id="stars">⭐⭐⭐</div>
    <button onclick="location.reload()" class="playAgain-btn">Play Again</button>
  </div>
</div>

<!-- SOUNDS -->
<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>

/* =========================================================
   ARTWORK — real PNG paths (single flattened outline art)
   All three images share the same natural pixel size.
   ========================================================= */

const IMG_SRC = {
  balloon:"../assets/images/balloon2.png",
  penguin:"../assets/images/penguin.png",
  rabbit:"../assets/images/rabbit.png"
};

const NATURAL_W = 1024;
const NATURAL_H = 1536;

/* =========================================================
   COLOURABLE REGIONS — found by sampling the real artwork.
   Each region is a single interior "seed" point (in the
   image's natural pixel space) that sits inside one
   flood-fillable connected white area of that PNG.
   ========================================================= */

const REGIONS_BY_ICON = {

  balloon:[
    { id:"body", seed:[523,457], required:"any", label:"Balloon" }
  ],

  penguin:[
    { id:"head",    seed:[512,300],  required:"black",  label:"Body" },
    { id:"wingL",   seed:[200,900],  required:"black",  label:"Body" },
    { id:"wingR",   seed:[824,900],  required:"black",  label:"Body" },
    { id:"legL",    seed:[306,1446], required:"black",  label:"Leg" },
    { id:"legR",    seed:[705,1446], required:"black",  label:"Leg" },
    { id:"stomach", seed:[506,1046], required:"white",  label:"Tummy" },
    { id:"nose",    seed:[511,510],  required:"orange", label:"Nose" }
  ],

 rabbit:[
  { id:"body",   seed:[531,939], required:"orange", label:"Body" },
  { id:"leftEar",  seed:[250,250], required:"orange", label:"Left ear" },
  { id:"rightEar", seed:[775,250], required:"orange", label:"Right ear" },
  { id:"tail",     seed:[845,1140], required:"orange", label:"Tail" },
  { id:"tongue", seed:[504,899], required:"red",  label:"Tongue" },
  { id:"nose",   seed:[512,760], required:"black", label:"Nose" }
]


};

const COLOR_INSTRUCTION = {
  balloon:"Drag any colour onto the balloon.",
  penguin:"Drag black onto the body & legs, white onto the tummy, and orange onto the nose.",
  rabbit:"Colour the tongue red and the nose black."
};

/* =========================================================
   PALETTE
   ========================================================= */

const PALETTE = [
  { name:"white",  hex:"#FFFFFF" },
  { name:"black",  hex:"#2f2f2f" },
  { name:"orange", hex:"#FF8C1A" },
  { name:"red",    hex:"#E8433D" }
];

function hexToRgb(hex){
  const n = parseInt(hex.replace("#",""),16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}

/* =========================================================
   QUESTION DATA
   ========================================================= */

const QUESTIONS = [
  {
    label:"Q1.",
    text:"Colour the 5th balloon.",
    icon:"balloon",
    count:8,
    answer:[5],
    bg:""
  },
  {
    label:"Q2.",
    text:"Colour the 6th and 9th penguins.",
    icon:"penguin",
    count:10,
    answer:[6,9],
    bg:"bg-yellow"
  },
  {
    label:"Q3.",
    text:"Colour the 7th and 10th rabbits.",
    icon:"rabbit",
    count:10,
    answer:[7,10],
    bg:""
  }
];

/* =========================================================
   STATE
   ========================================================= */

const total = QUESTIONS.length;
let current = 0;

const state = QUESTIONS.map(() => ({
  phase:"identify",      // "identify" | "coloring" | "done"
  identified:[],         // ordinal positions correctly tapped
  wrongPicks:[],
  instances:{},           // ordinal -> { regions:[...], allDone, dataURL }
  answered:false
}));

/* =========================================================
   ELEMENTS
   ========================================================= */

const quizCard         = document.getElementById("quizCard");
const qLabel           = document.getElementById("qLabel");
const questionText     = document.getElementById("questionText");
const colorInstruction = document.getElementById("colorInstruction");
const archeryArea      = document.getElementById("archeryArea");
const optionsRow       = document.getElementById("optionsRow");
const prevBtn          = document.getElementById("prevBtn");
const nextBtn          = document.getElementById("nextBtn");

const correctSound = document.getElementById("correctSound");
const wrongSound   = document.getElementById("wrongSound");
const homeBtn      = document.getElementById("homeBtn");
const hintBtn      = document.getElementById("hintBtn");
const hintOverlay  = document.getElementById("hintOverlay");
const closeHintBtn = document.getElementById("closeHintBtn");
const hintText     = document.getElementById("hintText");

/* =========================================================
   HELPERS
   ========================================================= */

function speak(t){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-UK";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

function ordinal(n){
  const s = ["th","st","nd","rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

  const q  = QUESTIONS[current];
  const st = state[current];

  qLabel.textContent = q.label;
  questionText.textContent = q.text;
  colorInstruction.textContent = st.phase !== "identify" ? COLOR_INSTRUCTION[q.icon] : "";

  quizCard.classList.remove("bg-yellow","bg-pink");
  if(q.bg) quizCard.classList.add(q.bg);

  if(st.phase === "identify"){
    renderIdentifyGrid(q, st);
  }else{
    renderColoringStage(q, st);
  }

  prevBtn.disabled = current === 0;
  nextBtn.disabled = !st.answered || current === total - 1;
}

/* =========================================================
   PHASE 1 — IDENTIFY GRID
   ========================================================= */

function renderIdentifyGrid(q, st){

  archeryArea.innerHTML = "";
  const row = document.createElement("div");
  row.className = "options-row " + (q.count === 8 ? "items-8" : "items-10");
  row.id = "optionsRow";

  for(let i = 1; i <= q.count; i++){

    const btn = document.createElement("button");
    btn.className = "object-btn";
    btn.type = "button";
    btn.dataset.pos = String(i);
    btn.setAttribute("aria-label", `${ordinal(i)} ${q.icon}`);

    const img = document.createElement("img");
    img.src = IMG_SRC[q.icon];
    img.alt = `${q.icon} ${i}`;
    img.draggable = false;
    btn.appendChild(img);

    if(st.identified.includes(i)){
      btn.disabled = true;
      btn.classList.add("identified");
    }else if(st.wrongPicks.includes(i)){
      btn.disabled = true;
      btn.classList.add("wrong-pick");
    }else{
      btn.addEventListener("click", () => handleIdentifyPick(btn, i, q, st));
    }

    row.appendChild(btn);
  }

  archeryArea.appendChild(row);
}

function handleIdentifyPick(btn, pos, q, st){

  if(st.identified.includes(pos) || st.wrongPicks.includes(pos)) return;

  if(q.answer.includes(pos)){

    st.identified.push(pos);
    btn.classList.add("identified");
    btn.disabled = true;

    correctSound.currentTime = 0;
    correctSound.play().catch(() => {});
    speak("correct");
    showPopup(true, "Found it!", "Now let's colour it in.");
    fireConfetti();

    if(st.identified.length === q.answer.length){
      setTimeout(() => beginColoringStage(q, st), 650);
    }

  }else{

    st.wrongPicks.push(pos);
    btn.classList.add("wrong-pick");
    btn.disabled = true;

    wrongSound.currentTime = 0;
    wrongSound.play().catch(() => {});
    speak("try again");
    showPopup(false);
  }
}

/* =========================================================
   PHASE 2 — COLOURING STAGE
   ========================================================= */

function beginColoringStage(q, st){
  clearTimeout(showPopup._t);
  document.getElementById("answerPopup").style.display = "none";
  st.phase = "coloring";
  renderQuestion();
}

function renderColoringStage(q, st){

  colorInstruction.textContent = COLOR_INSTRUCTION[q.icon];

  archeryArea.innerHTML = "";

  const stage = document.createElement("div");
  stage.className = "coloring-stage";

  const canvasGroup = document.createElement("div");
  canvasGroup.className = "canvas-group";

  const positions = st.identified.length ? st.identified : q.answer.slice();

  positions.forEach((pos) => {
    const wrap = document.createElement("div");
    wrap.className = "color-canvas-wrap";

    const canvas = document.createElement("canvas");
    canvas.className = "color-canvas";
    canvas.id = `canvas_${current}_${pos}`;
    wrap.appendChild(canvas);

    const check = document.createElement("div");
    check.className = "instance-check";
    check.textContent = "✓";
    wrap.appendChild(check);

    canvasGroup.appendChild(wrap);

    setupColoringInstance(canvas, wrap, q, st, pos);
    canvas.addEventListener("click", (event) => {
      if(!activeColorName) return;
      handleColorDrop(canvas, activeColorName, event.clientX, event.clientY);
    });
  });

  const palette = document.createElement("div");
  palette.className = "palette-panel";

  PALETTE.forEach((c) => {
    const sw = document.createElement("div");
    sw.className = "swatch";
    sw.dataset.color = c.name;
    sw.setAttribute("role","button");
    sw.setAttribute("aria-label", `${c.name} colour`);
    sw.addEventListener("click", () => {
      activeColorName = c.name;
      document.querySelectorAll(".swatch").forEach((item) => {
        item.classList.toggle("selected-color", item === sw);
      });
    });
    attachSwatchDrag(sw, c);
    palette.appendChild(sw);
  });

  stage.appendChild(canvasGroup);
  stage.appendChild(palette);
  archeryArea.appendChild(stage);
}

/* ---------- build one flood-fillable canvas instance ---------- */

function setupColoringInstance(canvas, wrap, q, st, pos){

  const regionDefs = REGIONS_BY_ICON[q.icon];

  const instance = st.instances[pos] || {
    regions: regionDefs.map(r => ({ ...r, completed:false })),
    allDone:false,
    dataURL:null
  };
  st.instances[pos] = instance;

  canvas.width = NATURAL_W;
  canvas.height = NATURAL_H;
  const ctx = canvas.getContext("2d", { willReadFrequently:true });

  if(instance.dataURL){
    // previously finished — just restore the baked-in image, read only
    const img = new Image();
    img.onload = () => ctx.drawImage(img,0,0,NATURAL_W,NATURAL_H);
    img.src = instance.dataURL;
    wrap.classList.add("instance-done");
    return;
  }

  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img,0,0,NATURAL_W,NATURAL_H);
    const imageData = ctx.getImageData(0,0,NATURAL_W,NATURAL_H);
    canvas._paint = { ctx, imageData, instance, q, st, pos, wrap };
  };
  img.src = IMG_SRC[q.icon];
}

/* ---------- flood fill core ---------- */

function floodFillCanvas(paint, startX, startY, colorName){

  const { ctx, imageData, instance } = paint;
  const w = imageData.width, h = imageData.height;
  const data = imageData.data;

  const si = (startY * w + startX) * 4;
  if(data[si+3] < 200) return null;

  const tR = data[si], tG = data[si+1], tB = data[si+2];

  const fillRGB = hexToRgb(
    PALETTE.find(c => c.name === colorName).hex
  );

  const tolerance = 42;
  const toleranceSq = tolerance * tolerance * 3;

  const matched = new Set();
  const pixels = [];
  const stack = [[startX,startY]];
  const visited = new Uint8Array(w*h);

  // FIRST: find the complete region WITHOUT changing its colour
  while(stack.length){

    const [x,y] = stack.pop();

    if(x < 0 || x >= w || y < 0 || y >= h) continue;

    const vi = y*w + x;

    if(visited[vi]) continue;

    const di = vi*4;

    if(data[di+3] < 200) continue;

    const dr = data[di]-tR;
    const dg = data[di+1]-tG;
    const db = data[di+2]-tB;

    if((dr*dr + dg*dg + db*db) > toleranceSq) continue;

    visited[vi] = 1;

    pixels.push(di);

    instance.regions.forEach(r => {
      const dx = x - r.seed[0];
      const dy = y - r.seed[1];

      if(dx*dx + dy*dy <= 16){
        matched.add(r.id);
      }
    });

    stack.push(
      [x+1,y],
      [x-1,y],
      [x,y+1],
      [x,y-1]
    );
  }
  // after building `matched`, before the wrong-check:
if(matched.size === 0){
  return { matched, applied:false }; // no registered region here — reject the fill
}

  // Check whether this colour is allowed BEFORE painting
  let wrong = false;

  matched.forEach(id => {
    const region = instance.regions.find(r => r.id === id);

    if(region && region.required !== "any" && region.required !== colorName){
      wrong = true;
    }
  });

  // Wrong colour → DO NOT MODIFY THE IMAGE
  if(wrong){
    return {
      matched,
      applied:false
    };
  }

  // Correct colour → now actually paint
  pixels.forEach(di => {
    data[di]   = fillRGB.r;
    data[di+1] = fillRGB.g;
    data[di+2] = fillRGB.b;
    data[di+3] = 255;
  });

  ctx.putImageData(imageData,0,0);

  return {
    matched,
    applied:true
  };
}
function handleColorDrop(canvas, colorName, clientX, clientY){
  const paint = canvas._paint;
  if(!paint || paint.instance.allDone) return;

  const rect = canvas.getBoundingClientRect();
  const nx = Math.max(0, Math.min(NATURAL_W - 1,
    Math.round((clientX - rect.left) / rect.width * NATURAL_W)));
  const ny = Math.max(0, Math.min(NATURAL_H - 1,
    Math.round((clientY - rect.top) / rect.height * NATURAL_H)));

  const result = floodFillCanvas(paint, nx, ny, colorName);

  if(!result || !result.matched || result.matched.size === 0) return;

  const matched = result.matched;

  if(!result.applied){
    clearSelectedColor();
    wrongSound.currentTime = 0;
    wrongSound.play().catch(() => {});
    speak("try again");
    showPopup(false, "Not quite!", "That's the wrong colour for that part.");
    return;
  }

    let anyWrong = false;
    let newlyCompleted = false;

    matched.forEach(id => {
      const region = paint.instance.regions.find(r => r.id === id);
      if(!region) return;
      const wasCompleted = region.completed;
      const isCorrect = region.required === "any" || region.required === colorName;
      region.completed = isCorrect;
      if(isCorrect && !wasCompleted) newlyCompleted = true;
      if(!isCorrect) anyWrong = true;
    });

    if(anyWrong){
      wrongSound.currentTime = 0;
      wrongSound.play().catch(() => {});
      speak("try again");
      showPopup(false, "Not quite!", "That's the wrong colour for that part.");
    }else if(newlyCompleted){
      correctSound.currentTime = 0;
      correctSound.play().catch(() => {});
      speak("correct");
      fireConfetti();
    }

  checkInstanceCompletion(paint);
}

function clearSelectedColor(){
  activeColorName = null;
  document.querySelectorAll(".swatch.selected-color").forEach((swatch) => {
    swatch.classList.remove("selected-color");
  });
}

function checkInstanceCompletion(paint){

  const { instance, q, st, pos, wrap } = paint;
  if(instance.allDone) return;

  const allGood = instance.regions.every(r => r.completed);
  if(!allGood) return;

  instance.allDone = true;
  instance.dataURL = paint.ctx.canvas.toDataURL("image/png");
  wrap.classList.add("instance-done");

  showPopup(true, "Perfect colouring!", "Great job!");

  const positions = st.identified.length ? st.identified : q.answer.slice();
  const everyInstanceDone = positions.every(p => st.instances[p] && st.instances[p].allDone);

  if(everyInstanceDone){
    st.answered = true;
    st.phase = "done";
    nextBtn.disabled = current === total - 1;

    if(current === total - 1){
      setTimeout(() => {
        fireBigConfetti();
        showFinal();
      },1100);
    }
  }
}

/* =========================================================
   POINTER-BASED DRAG AND DROP (works for mouse + touch)
   ========================================================= */

let activeGhost = null;
let activeDrag = null;
let activeColorName = null;

function attachSwatchDrag(swatchEl, colorDef){

  swatchEl.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    swatchEl.classList.add("dragging-source");

    activeGhost = document.createElement("div");
    activeGhost.className = "swatch-ghost";
    activeGhost.style.background = colorDef.hex;
    activeGhost.style.left = e.clientX + "px";
    activeGhost.style.top = e.clientY + "px";
    document.body.appendChild(activeGhost);

    activeDrag = { colorName: colorDef.name };

    window.addEventListener("pointermove", onDragMove);
    window.addEventListener("pointerup", onDragEnd, { once:true });
    window.addEventListener("pointercancel", onDragEnd, { once:true });

    function onDragMove(ev){
      if(activeGhost){
        activeGhost.style.left = ev.clientX + "px";
        activeGhost.style.top = ev.clientY + "px";
      }
    }

    function onDragEnd(ev){
      window.removeEventListener("pointermove", onDragMove);
      swatchEl.classList.remove("dragging-source");
      if(activeGhost){ activeGhost.remove(); activeGhost = null; }

      const clientX = ev.clientX ?? e.clientX;
        const clientY = ev.clientY ?? e.clientY;
        const canvas = [...document.querySelectorAll(".color-canvas")].find(c => {
  const r = c.getBoundingClientRect();
  return (
    clientX >= r.left &&
    clientX <= r.right &&
    clientY >= r.top &&
    clientY <= r.bottom
  );
});

      if(canvas){
        handleColorDrop(canvas, activeDrag.colorName, clientX, clientY);
      }
      activeDrag = null;
    }
  });
}

/* =========================================================
   POPUP
   ========================================================= */

function showPopup(isCorrect, titleOverride, msgOverride){
  const popup = document.getElementById("answerPopup");
  const icon  = document.getElementById("popupIcon");
  const title = document.getElementById("popupTitle");
  const msg   = document.getElementById("popupMsg");

  popup.className = "popup " + (isCorrect ? "correct" : "wrong");
  popup.style.display = "flex";

  if(isCorrect){
    icon.textContent = "🎉";
    title.textContent = titleOverride || "Correct!";
    msg.textContent = msgOverride || "Great job!";
  }else{
    icon.textContent = "❌";
    title.textContent = titleOverride || "Try Again!";
    msg.textContent = msgOverride || "That's not the right one. Try again!";
  }

  clearTimeout(showPopup._t);
  showPopup._t = setTimeout(() => {
    popup.style.display = "none";
  },1100);
}

/* =========================================================
   FINAL
   ========================================================= */

function showFinal(){
  const finalPopup = document.getElementById("finalPopup");
  finalPopup.style.display = "flex";
  document.getElementById("finalScore").textContent = `${total} / ${total} Completed`;
  document.getElementById("stars").textContent = "⭐⭐⭐";
}

/* =========================================================
   CONFETTI
   ========================================================= */

function fireConfetti(){
  if(!window.confetti) return;
  confetti({
    particleCount:24,
    spread:55,
    startVelocity:26,
    origin:{ x:.5, y:.4 },
    colors:["#e6473f","#3a6fd8","#f7b733","#8bba8a","#c9a8e0"]
  });
}

function fireBigConfetti(){
  if(!window.confetti) return;
  const end = Date.now() + 1800;
  (function frame(){
    confetti({ particleCount:6, angle:60,  spread:55, origin:{ x:0 } });
    confetti({ particleCount:6, angle:120, spread:55, origin:{ x:1 } });
    if(Date.now() < end){ requestAnimationFrame(frame); }
  })();
}

/* =========================================================
   NAV
   ========================================================= */

prevBtn.addEventListener("click", () => {
  if(current === 0) return;
  current--;
  renderQuestion();
});

nextBtn.addEventListener("click", () => {
  if(nextBtn.disabled) return;
  if(current < total - 1){
    current++;
    renderQuestion();
  }
});

homeBtn.addEventListener("click", () => {
  window.location.href = "../Grade2_chapter1.html";
});

hintBtn.addEventListener("click", () => {
  const q  = QUESTIONS[current];
  const st = state[current];

  if(st.phase === "identify"){
    hintText.textContent = `Count the ${q.icon}s from left to right, then tap the ${q.answer.map(ordinal).join(" and ")} one${q.answer.length > 1 ? "s" : ""}.`;
  }else{
    hintText.textContent = COLOR_INSTRUCTION[q.icon];
  }

  hintOverlay.classList.add("show");
});

closeHintBtn.addEventListener("click", () => {
  hintOverlay.classList.remove("show");
});

hintOverlay.addEventListener("click", (event) => {
  if(event.target === hintOverlay){
    hintOverlay.classList.remove("show");
  }
});

/* =========================================================
   INITIALIZE
   ========================================================= */

renderQuestion();
