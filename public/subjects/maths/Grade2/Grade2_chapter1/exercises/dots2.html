<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Connect the Dots & Color — Rabbit</title>
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f6f8fb;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033
    }

    body {
      padding: 10px
    }

    .game-card {
      width: min(100%, 920px);
      margin: auto;
      background: #fff;
      border: 1px solid #e6eaf0;
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 8px 30px rgba(23, 32, 51, .08)
    }

    .header {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 104px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px
    }

    .header button,
    #counter {
      height: 42px;
      border: 0;
      border-radius: 12px;
      font-size: 14px
    }

    .header button {
      background: #1778f2;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(23, 120, 242, .2)
    }

    #counter {
      display: grid;
      place-items: center;
      background: #edf4ff;
      color: #1766c8;
      font-weight: 700
    }

    .instruction {
      min-height: 42px;
      display: grid;
      place-items: center;
      padding: 6px 10px;
      border: 2px solid #cfe1ff;
      border-radius: 12px;
      background: #f3f8ff;
      color: #245b9f;
      font-size: 15px;
      text-align: center
    }

    .progress-wrap {
      margin: 0 2px 10px
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #526078;
      margin-bottom: 5px
    }

    .progress {
      height: 9px;
      background: #edf0f4;
      border-radius: 99px;
      overflow: hidden
    }

    .progress i {
      display: block;
      height: 100%;
      width: 0;
      background: #31a866;
      border-radius: 99px;
      transition: width .25s ease
    }

    .puzzle {
      width: 100%;
      border: 1px solid #e8ebef;
      border-radius: 14px;
      overflow: hidden;
      line-height: 0;
      background: #fff;
      position: relative
    }

    #svg {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
      user-select: none
    }

    #lines line {
      stroke: #111;
      stroke-width: 2;
      stroke-linecap: round
    }

    .target {
      fill: transparent;
      stroke: transparent;
      pointer-events: all;
      cursor: default
    }

    .target.active {
      fill: rgba(23, 120, 242, .16);
      stroke: #1778f2;
      stroke-width: 2.4;
      animation: pulse 1s infinite
    }

    .target.done {
      pointer-events: none
    }

    /* Home button styles */
    .home-btn {
      background-color: #245b9f;
      border-radius: 50px;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
      transition: transform 0.2s ease;
      line-height: 1;
      display: none;
    }

    .home-btn:hover {
      transform: scale(1.15);
    }

    .home-btn:active {
      transform: scale(0.95);
    }

    @keyframes pulse {
      50% {
        r: 11
      }
    }

    .stage {
      display: none
    }

    .stage.show {
      display: block
    }

    .tip {
      width: max-content;
      max-width: 100%;
      margin: 9px auto 0;
      padding: 7px 11px;
      border: 1px solid #dce8f8;
      border-radius: 10px;
      background: #f7fbff;
      color: #53677f;
      font-size: 12px;
      text-align: center
    }

    .color-panel {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #e5eaf1;
      border-radius: 14px;
      background: #fbfcfe
    }

    .palette {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center
    }

    .swatch {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 2px solid #fff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .16);
      cursor: grab;
      touch-action: none;
      position: relative
    }

    .swatch:active {
      cursor: grabbing;
      transform: scale(.96)
    }

    .swatch.selected {
      outline: 3px solid #1778f2;
      outline-offset: 2px
    }

    .swatch span {
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translate(-50%, 3px);
      font-size: 9px;
      color: #596579;
      white-space: nowrap
    }

    #colorSvg {
      display: block;
      width: 100%;
      height: auto;
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    .color-zone {
      fill: transparent;
      stroke: transparent;
      pointer-events: all;
      cursor: crosshair
    }

    .fill-shape {
      display: none;
      pointer-events: none
    }

    .fill-shape.filled {
      display: block
    }

    #colorSvg .fill-shape {
      stroke: none
    }

    .legend {
      text-align: center;
      font-size: 12px;
      color: #657287;
      margin-top: 6px
    }

    .result-stage {
      display: none;
      width: 100%;
      text-align: center;
      padding: 8px 0;
    }

    .result-stage.show {
      display: block;
    }

    /* .result-stage img {
      display: block;
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      margin: 0 auto;
    } */
.result-stage img {
  display: block;
  width: 100vw;
  height: 100vh;
  max-width: none;
  max-height: none;
  object-fit: contain;
  margin: 0 auto;
  position: relative;
  left: 50%;
  transform: translateX(-50%);
}

    .name-card {
      padding: 20px;
      text-align: center
    }

    .name-card h2 {
      margin: 0 0 8px;
      font-size: 24px
    }

    .name-card p {
      margin: 0 0 14px;
      color: #657287;
      font-size: 14px
    }

    .name-row {
      display: flex;
      gap: 8px;
      justify-content: center
    }

    .name-row input {
      width: min(320px, 70vw);
      height: 44px;
      border: 2px solid #dbe2ec;
      border-radius: 11px;
      padding: 0 12px;
      font-size: 16px;
      outline: none
    }

    .name-row input:focus {
      border-color: #1778f2
    }

    .name-row button {
      height: 44px;
      border: 0;
      border-radius: 11px;
      padding: 0 18px;
      background: #1778f2;
      color: #fff;
      font-weight: 700;
      cursor: pointer
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      padding: 11px 16px;
      border-radius: 12px;
      background: #172033;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      transition: .2s;
      box-shadow: 0 8px 25px rgba(0, 0, 0, .18)
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    .question-stage {
      display: none;
      margin-top: 14px;
      padding: 18px 10px 8px;
      text-align: center;
    }

    .question-stage.show {
      display: block;
    }

    .question-text {
      margin: 0;
      font-size: 22px;
      color: #172033;
      line-height: 1.5;
    }

    .question-answer {
      width: min(210px, 55vw);
      height: 34px;
      border: 0;
      border-bottom: 2px solid #f0a36b;
      outline: none;
      background: transparent;
      font-size: 20px;
      text-align: center;
      color: #172033;
      padding: 0 4px;
      vertical-align: middle;
    }

    .question-answer:focus {
      border-bottom-color: #1778f2;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      place-items: center;
      background: rgba(17, 24, 39, .42);
      z-index: 30;
      padding: 16px
    }

    .modal.show {
      display: grid
    }

    .modal-card {
      width: min(92vw, 390px);
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 18px 55px rgba(0, 0, 0, .22);
      animation: pop .2s ease
    }

    .modal-icon {
      font-size: 42px;
      line-height: 1;
      margin-bottom: 7px
    }

    .modal-card h3 {
      margin: 0 0 6px;
      font-size: 22px
    }

    .modal-card p {
      margin: 0;
      color: #657287;
      font-size: 14px;
      line-height: 1.4
    }

    .modal-card button {
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      background: #1778f2;
      color: #fff;
      font-weight: 700;
      cursor: pointer
    }

    @keyframes pop {
      from {
        transform: scale(.94);
        opacity: .5
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    @media(max-width:600px) {
      body {
        padding: 4px
      }

      .game-card {
        padding: 9px;
        border-radius: 13px
      }

      .header {
        grid-template-columns: 68px minmax(0, 1fr) 78px;
        gap: 6px
      }

      .header button,
      #counter,
      .instruction {
        height: 38px;
        min-height: 38px;
        font-size: 11px
      }

      .instruction {
        padding: 4px;
        line-height: 1.1
      }

      .progress-wrap {
        margin-bottom: 7px
      }

      .puzzle {
        border-radius: 9px
      }

      .swatch {
        width: 36px;
        height: 36px;
        border-radius: 10px
      }

      .tip {
        font-size: 10px;
        padding: 6px 8px
      }

      .name-card {
        padding: 14px
      }

      .name-card h2 {
        font-size: 20px
      }

      .name-row input,
      .name-row button {
        height: 40px;
        font-size: 14px
      }
      .question-stage {
        padding-top: 12px;
      }

      .question-text {
        font-size: 18px;
      }

      .question-answer {
        width: 150px;
        font-size: 17px;
      }
    }
  </style>
</head>

    const P = { "51": [350.5, 93.8], "52": [369.1, 80.4], "53": [380.5, 91.4], "54": [396.8, 116.9], "55": [411.2, 78.3], "56": [462.1, 28.2], "57": [542.6, 4.7], "58": [579.8, 69.7], "59": [566.7, 127.8], "60": [534.7, 83.8], "61": [471.7, 107.5], "62": [418, 147], "63": [436.1, 178.6], "64": [447.7, 214.4], "65": [443.5, 248.7], "66": [416, 279.7], "67": [449.4, 308.2], "68": [477.2, 329.1], "69": [497.8, 357.1], "70": [516.8, 347.0], "71": [527.1, 360.7], "72": [549.2, 372.5], "73": [532.4, 388.8], "74": [532.8, 412.3], "75": [506.7, 407.5], "76": [492.4, 449.8], "77": [432, 472], "78": [390.5, 473.5], "79": [364.7, 471.8], "80": [333, 455], "81": [301, 423], "82": [287.6, 384.1], "83": [279.1, 360.2], "84": [289, 338.8], "85": [304.1, 320.6], "86": [299.6, 289.2], "87": [250.3, 265.9], "88": [229.4, 229.1], "89": [233.4, 184.8], "90": [263.3, 140.9], "91": [312.4, 100.8], "92": [281.6, 68.7], "93": [247.6, 87.9], "94": [195.5, 125.7], "95": [137, 126.6], "96": [143.2, 78], "97": [213.1, 36.4], "98": [265.4, 30.6], "99": [305.1, 46], "100": [328.5, 93.8] };
    const expected = {
      head: "#eadfca", body: "#eadfca", leftarm: "#eadfca", rightarm: "#eadfca", leftleg: "#eadfca", rightleg: "#eadfca",
      leftear: "#eadfca", rightear: "#eadfca", innerleft: "#f3a39a", innerright: "#f3a39a", nose: "#f5a49d",
      muzzle: "#f7efe3", eyeL: "#171717", eyeR: "#171717", teeth: "#ffffff", carrot: "#f28b24", leaves: "#63b52f"
    };
    const partNames = { head: "head", body: "body", leftarm: "left arm", rightarm: "right arm", leftleg: "left foot", rightleg: "right foot", leftear: "left ear", rightear: "right ear", innerleft: "left ear inner", innerright: "right ear inner", nose: "nose", muzzle: "muzzle", eyeL: "left eye", eyeR: "right eye", teeth: "teeth", carrot: "carrot", leaves: "leaves" };
    const parts = Object.keys(expected);
    const svg = document.getElementById("svg"), lines = document.getElementById("lines"), targets = document.getElementById("targets");
    const dotStage = document.getElementById("dotStage"), colorStage = document.getElementById("colorStage"), colorControls = document.getElementById("colorControls"), nameStage = document.getElementById("nameStage"), questionStage = document.getElementById("questionStage"), questionAnswer = document.getElementById("questionAnswer");
    const instruction = document.getElementById("instruction"), counter = document.getElementById("counter"), progressBar = document.getElementById("progressBar"), progressPct = document.getElementById("progressPct");
    const colorSvg = document.getElementById("colorSvg"), colorCounter = document.getElementById("colorCounter"), colorProgressBar = document.getElementById("colorProgressBar"), colorProgressLabel = document.getElementById("colorProgressLabel"), colorPct = document.getElementById("colorPct");
    let next = 51, previous = null, selectedColor = null, colored = new Set(), dragColor = null;

    function el(tag, attrs) { const x = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) x.setAttribute(k, attrs[k]); return x }
    function draw(a, b) { lines.appendChild(el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1] })) }
    function refreshDots() {
      const done = next - 51, total = 50, pct = Math.round(done / total * 100);
      progressBar.style.width = pct + "%"; progressPct.textContent = pct + "%";
      if (next > 100) { counter.textContent = "100 / 100"; instruction.textContent = "Great! Now color the rabbit."; }
      else { counter.textContent = next + " / 100"; instruction.textContent = "Find and tap dot number " + next }
      document.querySelectorAll(".target").forEach(t => t.classList.toggle("active", Number(t.dataset.n) === next));
    }
    function connect(n) {
      if (n !== next) return;
      const p = P[String(n)]; if (previous) draw(previous, p); previous = p;
      const t = document.querySelector('[data-n="' + n + '"]'); if (t) t.classList.add("done");
      next++; refreshDots();
      if (next > 100) setTimeout(startColorStage, 350);
    }
    function buildDots() {
      for (let n = 51; n <= 100; n++) {
        const p = P[String(n)], t = el("circle", { class: "target", cx: p[0], cy: p[1], r: 9, "data-n": n });
        t.addEventListener("pointerdown", e => { e.preventDefault(); connect(n) }); targets.appendChild(t);
      }
    }
    function startColorStage() {
      showModal("🎉", "Dots connected!", "Great job!", "Continue");

      setTimeout(() => {
        document.getElementById("modal").classList.remove("show");
        dotStage.classList.remove("show");
        document.getElementById("puzzle").style.display = "none";
        document.getElementById("resultStage").classList.add("show");

        // Show the question 5 seconds after the completed image appears.
        setTimeout(() => {
          questionStage.classList.add("show");
          questionAnswer.value = "";
          questionAnswer.focus();
        }, 5000);
      }, 1000);
    }
    function updateColorProgress() {
      const done = colored.size, total = parts.length, pct = Math.round(done / total * 100);
      colorCounter.textContent = done + " / " + total; colorProgressBar.style.width = pct + "%"; colorPct.textContent = pct + "%";
      colorProgressLabel.textContent = done === total ? "All colors complete!" : "Colors left: " + (total - done);
    }
    function showToast(msg, ok) {
      const t = document.getElementById("toast"); t.textContent = msg; t.style.background = ok ? "#1f8a4c" : "#c43b3b"; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1300);
      beep(ok);
    }
    function beep(ok) {
      try { const C = window.AudioContext || window.webkitAudioContext, ctx = new C(), o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = ok ? 720 : 180; o.type = "sine"; g.gain.value = .045; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + (ok ? .12 : .16)) } catch (e) { }
    }
    function showModal(icon, title, text, button = "Continue") {
      document.getElementById("modalIcon").textContent = icon; document.getElementById("modalTitle").textContent = title; document.getElementById("modalText").textContent = text; document.getElementById("modalBtn").textContent = button; document.getElementById("modal").classList.add("show");
    }
    document.getElementById("modalBtn").addEventListener("click", () => document.getElementById("modal").classList.remove("show"));

    function applyColor(part, color) {
      if (colored.has(part)) return;
      const correct = expected[part].toLowerCase() === color.toLowerCase();
      if (!correct) { showToast("Wrong color — try again!", false); return }
      const fill = document.getElementById("fill-" + part); if (fill) { fill.setAttribute("fill", color); fill.classList.add("filled") }
      colored.add(part); document.querySelector('[data-part="' + part + '"]')?.classList.add("done"); updateColorProgress();
      showToast("Correct! " + partNames[part] + " colored.", true);
      if (colored.size === parts.length) setTimeout(() => { colorStage.classList.remove("show"); colorControls.classList.remove("show"); nameStage.classList.add("show"); document.getElementById("animalName").focus(); }, 600);
    }

    document.querySelectorAll(".swatch").forEach(sw => {
      sw.addEventListener("pointerdown", e => { e.preventDefault(); selectedColor = sw.dataset.color; dragColor = sw.dataset.color; document.querySelectorAll(".swatch").forEach(x => x.classList.remove("selected")); sw.classList.add("selected"); });
      sw.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", sw.dataset.color); dragColor = sw.dataset.color });
    });
    document.querySelectorAll(".color-zone").forEach(zone => {
      zone.addEventListener("pointerup", e => { e.preventDefault(); applyColor(zone.dataset.part, dragColor || selectedColor) });
      zone.addEventListener("click", () => applyColor(zone.dataset.part, selectedColor));
      zone.addEventListener("dragover", e => e.preventDefault());
      zone.addEventListener("drop", e => { e.preventDefault(); applyColor(zone.dataset.part, e.dataTransfer.getData("text/plain") || dragColor || selectedColor) });
    });
    document.getElementById("backDots").addEventListener("click", () => location.reload());

    function checkQuestionAnswer() {
      const value = questionAnswer.value.trim().toLowerCase();

      if (value === "rabbit" || value === "a rabbit") {
        beep(true);
        questionStage.classList.remove("show");

        showModal(
          "🏆",
          "Activity Complete!",
          "Excellent! You connected all the dots and answered the question correctly.",
          "Play again"
        );

        document.getElementById("modalBtn").onclick = () => location.reload();
      } else {
        beep(false);
        showToast("Try again!", false);
        questionAnswer.focus();
        questionAnswer.select();
      }
    }

    questionAnswer.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        checkQuestionAnswer();
      }
    });

    document.getElementById("backDots").addEventListener("click", () => location.reload());

    document.getElementById("checkName").addEventListener("click", checkName);
    document.getElementById("animalName").addEventListener("keydown", e => { if (e.key === "Enter") checkName() });
    function checkName() {
      const value = document.getElementById("animalName").value.trim().toLowerCase();
      if (value === "rabbit" || value === "a rabbit") {
        beep(true); showModal("🏆", "Activity Complete!", "Excellent! You connected all the dots, colored the rabbit correctly, and named the animal.", "Play again");
        document.getElementById("modalBtn").onclick = () => location.reload();
      } else {
        beep(false); showModal("❌", "Try again", "That is not the correct animal name. Look carefully at your picture.", "Try again");
        document.getElementById("modalBtn").onclick = () => document.getElementById("modal").classList.remove("show");
      }
    }

    function reset() {
      next = 51; previous = null; lines.innerHTML = ""; colored = new Set(); selectedColor = null; dragColor = null;
      document.querySelectorAll(".target").forEach(t => t.classList.remove("done", "active"));
      document.querySelectorAll(".fill-shape").forEach(f => f.classList.remove("filled"));
      dotStage.classList.add("show"); colorStage.classList.remove("show"); colorControls.classList.remove("show"); nameStage.classList.remove("show"); questionStage.classList.remove("show"); questionAnswer.value = "";
      colorSvg.style.display = "none"; targets.style.display = "block"; document.getElementById("puzzle").style.display = "block"; document.getElementById("resultStage").classList.remove("show"); document.getElementById("modal").classList.remove("show"); document.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
      refreshDots(); updateColorProgress();
    }
    document.getElementById("reset").addEventListener("click", reset);
    buildDots(); refreshDots(); updateColorProgress();
    // Home button functionality
    document.getElementById("homeBtn").addEventListener("click", function () {
      window.location.href = "../Grade2_chapter1.html";
    });
    document.getElementById("homeBtn2").addEventListener("click", function () {
      window.location.href = "../Grade2_chapter1.html";
    });
  </script>
</body>

</html>
