
 <!doctype html>
 <html lang="en">
 <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
   <title>Connect the Dots & Paint — Bunny</title>
   <style>
     :root {
       --ink: #43372f;
       --line: #5b4a3f;
       --paper: #fffdf7;
       --blue: #2f9bff;
       --green: #35c26a;
       --pink: #ff7aa8;
       --yellow: #ffc93c;
       --shadow: 0 6px 0 rgba(0, 0, 0, .12);
     }
     * {
       box-sizing: border-box;
       -webkit-tap-highlight-color: transparent
     }
     html,
     body {
       margin: 0;
       min-height: 100%;
       font-family: "Comic Sans MS", "Chalkboard SE", "Baloo 2", "Trebuchet MS", Verdana, sans-serif;
       color: var(--ink);
       background: linear-gradient(180deg, #bfe8ff 0%, #d8f3ff 40%, #eaffe6 100%);
       background-attachment: fixed;
       overscroll-behavior: none;
     }
     body {
       padding: 8px
     }
     .card {
       width: min(100%, 940px);
       margin: 0 auto;
       background: #fff;
       border: 4px solid #fff;
       border-radius: 26px;
       padding: 10px 12px 14px;
       box-shadow: 0 12px 34px rgba(37, 68, 99, .18)
     }
     /* ---------- top bar ---------- */
     .topbar {
       display: flex;
       align-items: center;
       gap: 8px;
       margin-bottom: 8px
     }
     .icon-btn {
       width: 50px;
       height: 50px;
       border: 0;
       border-radius: 16px;
       font-size: 24px;
       cursor: pointer;
       background: #eef3f9;
       box-shadow: var(--shadow);
       transition: transform .12s;
       display:none;
     }
     .icon-btn:active {
       transform: translateY(3px);
       box-shadow: 0 3px 0 rgba(0, 0, 0, .12)
     }
     .title {
       flex: 1;
       text-align: center;
       font-size: clamp(15px, 3.4vw, 22px);
       font-weight: 700;
       color: #2b6ea8;
       letter-spacing: .3px
     }
     /* ---------- goal strip ---------- */
     .goal {
       display: flex;
       align-items: center;
       gap: 10px;
       background: #fff8e2;
       border: 3px dashed #ffd977;
       border-radius: 18px;
       padding: 8px 12px;
       margin-bottom: 8px
     }
     .goal .say {
       font-size: clamp(14px, 3.2vw, 19px);
       font-weight: 700;
       flex: 1;
       line-height: 1.25
     }
     .bignum {
       min-width: 78px;
       height: 58px;
       padding: 0 12px;
       display: grid;
       place-items: center;
       border-radius: 16px;
       background: var(--blue);
       color: #fff;
       font-size: 30px;
       font-weight: 700;
       box-shadow: 0 5px 0 #1c7bd4;
       animation: nudge 2.4s ease-in-out infinite
     }
     @keyframes nudge {
       0%,
       88%,
       100% {
         transform: scale(1)
       }
       93% {
         transform: scale(1.09)
       }
     }
     .track {
       position: relative;
       height: 16px;
       background: #eef1f5;
       border-radius: 99px;
       margin: 0 4px 8px;
       overflow: visible
     }
     .track i {
       display: block;
       height: 100%;
       width: 0%;
       border-radius: 99px;
       background: linear-gradient(90deg, #7fe08f, #35c26a);
       transition: width .3s ease
     }
     .track b {
       position: absolute;
       top: -13px;
       left: 0;
       font-size: 22px;
       transform: translateX(-50%);
       transition: left .3s ease;
       font-weight: 400
     }
     /* ---------- picture ---------- */
     .picture {
       position: relative;
       border: 3px solid #e7edf4;
       border-radius: 20px;
       background: var(--paper);
       overflow: hidden;
       line-height: 0
     }
     #svg {
       display: block;
       width: 100%;
       height: auto;
       touch-action: none;
       user-select: none;
       -webkit-user-select: none
     }
     /* line art */
     .region {
       fill: #fffdf7;
       stroke: var(--line);
       stroke-width: 3.4;
       stroke-linejoin: round;
       stroke-linecap: round;
       transition: fill .18s ease
     }
     #details path,
     #details line,
     #details circle,
     #details ellipse {
       fill: none;
       stroke: var(--line);
       stroke-width: 3.2;
       stroke-linecap: round;
       stroke-linejoin: round;
       pointer-events: none
     }
     #details .solid {
       fill: var(--line);
       stroke: none
     }
     #details .white {
       fill: #fff;
       stroke: var(--line);
       stroke-width: 2.6
     }
     #details .blush {
       fill: #ffc2cf;
       stroke: none;
       opacity: .8
     }
     #dotLine {
       fill: none;
       stroke: #6b5a4d;
       stroke-width: 5;
       stroke-linecap: round;
       stroke-linejoin: round
     }
     /* dot stage look */
     .stage-dots .silhouette {
       visibility: hidden
     }
     .stage-dots .region,
     .stage-dots #details path,
     .stage-dots #details line,
     .stage-dots #details circle,
     .stage-dots #details ellipse {
       stroke: #cfd8e2
     }
     .stage-dots #details .solid {
       fill: #cfd8e2
     }
     .stage-dots #details .white {
       fill: #fff;
       stroke: #cfd8e2
     }
     .stage-dots #details .blush {
       opacity: 0
     }
     .stage-dots .region {
       fill: #fffdf7
     }
     /* dots */
     .hit {
       fill: transparent;
       cursor: pointer
     }
     .dot {
       fill: #b9c6d4;
       pointer-events: none
     }
     .dot.next {
       fill: var(--blue)
     }
     .dot.done {
       fill: #7a6a5c
     }
     .ring {
       fill: none;
       stroke: var(--blue);
       stroke-width: 4;
       opacity: 0;
       pointer-events: none
     }
     .ring.on {
       opacity: 1;
       animation: ping 1.3s ease-out infinite
     }
     @keyframes ping {
       0% {
         r: 14;
         opacity: .9;
         stroke-width: 5
       }
       100% {
         r: 34;
         opacity: 0;
         stroke-width: 1
       }
     }
     .lbl {
       font-family: "Trebuchet MS", Verdana, sans-serif;
       font-size: 21px;
       font-weight: 700;
       fill: #7b8a99;
       paint-order: stroke;
       stroke: #fffdf7;
       stroke-width: 5;
       stroke-linejoin: round;
       pointer-events: none;
       text-anchor: middle;
       dominant-baseline: middle
     }
     .lbl.next {
       fill: #1173de;
       font-size: 30px
     }
     .lbl.done {
       fill: #c3ccd6;
       font-size: 17px
     }
     .shake {
       animation: shake .4s
     }
     @keyframes shake {
       0%,
       100% {
         transform: translateX(0)
       }
       25% {
         transform: translateX(-5px)
       }
       75% {
         transform: translateX(5px)
       }
     }
     #hand {
       pointer-events: none;
       font-size: 34px;
       opacity: 0;
       transition: opacity .2s
     }
     #hand.on {
       opacity: 1;
       animation: bob 1s ease-in-out infinite
     }
     @keyframes bob {
       0%,
       100% {
         transform: translateY(0)
       }
       50% {
         transform: translateY(7px)
       }
     }
     /* painting */
     .painting .region {
       cursor: pointer
     }
     .region.wiggle {
       animation: wig .45s;
       transform-box: fill-box;
       transform-origin: center
     }
     @keyframes wig {
       0%,
       100% {
         transform: rotate(0)
       }
       25% {
         transform: rotate(-2.5deg)
       }
       75% {
         transform: rotate(2.5deg)
       }
     }
     /* Clear target highlight: show the exact unfinished part(s) for the selected colour. */
     .region.hintable {
       fill: var(--hint-color, #fffdf7);
       fill-opacity: .14;
       stroke: #ff9f1c;
       stroke-width: 7;
       stroke-dasharray: 9 5;
       filter: drop-shadow(0 0 7px rgba(255, 159, 28, .55));
       animation: targetPulse 1.15s ease-in-out infinite;
       transform-box: fill-box;
       transform-origin: center;
       pointer-events: auto
     }

     @keyframes targetPulse {
       0%, 100% {
         fill-opacity: .08;
         stroke-width: 5;
         filter: drop-shadow(0 0 4px rgba(255, 159, 28, .35));
       }
       50% {
         fill-opacity: .22;
         stroke-width: 8;
         filter: drop-shadow(0 0 11px rgba(255, 159, 28, .75));
       }
     }

     .painting .region.hintable {
       cursor: pointer
     }

     @keyframes glow {
       0%,
       100% {
         stroke: var(--line);
         stroke-width: 3.4
       }
       50% {
         stroke: #ffb43a;
         stroke-width: 7
       }
     }
     .region.pop {
       animation: popz .35s;
       transform-box: fill-box;
       transform-origin: center
     }
     @keyframes popz {
       50% {
         transform: scale(1.035)
       }
     }
     /* ---------- palette ---------- */
     .paintbar {
       display: none;
       margin-top: 10px
     }
     .paintbar.show {
       display: block
     }
     .palette {
       display: grid;
       grid-template-columns: repeat(6, minmax(0, 84px));
       gap: 10px;
       justify-content: center
     }
     .swatch {
       width: 100%;
       height: 78px;
       border-radius: 18px;
       border: 4px solid #fff;
       background: #fff;
       box-shadow: 0 4px 0 rgba(0, 0, 0, .13);
       cursor: pointer;
       display: grid;
       grid-template-rows: 1fr auto;
       overflow: hidden;
       padding: 0;
       transition: transform .12s
     }
     .swatch .chip {
       border-radius: 12px;
       margin: 4px 4px 0;
       border: 2px solid rgba(0, 0, 0, .08)
     }
     .swatch .nm {
       font-family: inherit;
       font-size: 12px;
       font-weight: 700;
       color: #55636f;
       padding: 3px 0 5px
     }
     .swatch:active {
       transform: translateY(3px)
     }
     .swatch.sel {
       border-color: var(--blue);
       box-shadow: 0 0 0 4px #d5ecff, 0 4px 0 rgba(0, 0, 0, .13);
       transform: translateY(-3px)
     }
     .swatch.want {
       animation: want 1s ease-in-out infinite
     }
     @keyframes want {
       0%,
       100% {
         transform: translateY(0)
       }
       50% {
         transform: translateY(-8px)
       }
     }
     .toolrow {
       display: flex;
       align-items: center;
       justify-content: center;
       gap: 8px;
       margin-top: 10px;
       flex-wrap: wrap
     }
     .pill {
       border: 0;
       border-radius: 16px;
       padding: 11px 16px;
       font-family: inherit;
       font-size: 15px;
       font-weight: 700;
       color: #fff;
       background: var(--blue);
       box-shadow: 0 5px 0 rgba(0, 0, 0, .14);
       cursor: pointer
     }
     .pill.grey {
       background: #93a3b3
     }
     .pill.green {
       background: var(--green)
     }
     .pill:active {
       transform: translateY(3px);
       box-shadow: 0 2px 0 rgba(0, 0, 0, .14)
     }
     /* ---------- quiz ---------- */
     .quiz {
       display: none;
       text-align: center;
       padding: 6px 4px 2px
     }
     .quiz.show {
       display: block
     }
     .quiz h2 {
       margin: 6px 0 12px;
       font-size: clamp(17px, 4vw, 23px)
     }
     .choices {
       display: flex;
       gap: 12px;
       justify-content: center;
       flex-wrap: wrap
     }
     .choice {
       width: 122px;
       border: 4px solid #eaf1f8;
       background: #fff;
       border-radius: 22px;
       padding: 12px 6px;
       cursor: pointer;
       font-family: inherit;
       font-size: 17px;
       font-weight: 700;
       color: #465565;
       box-shadow: 0 5px 0 rgba(0, 0, 0, .1)
     }
     .choice .em {
       display: block;
       font-size: 44px;
       line-height: 1.1
     }
     .choice:active {
       transform: translateY(3px)
     }
     /* ---------- bubble + modal + confetti ---------- */
     #bubble {
       position: fixed;
       left: 50%;
       bottom: 18px;
       transform: translate(-50%, 24px);
       opacity: 0;
       pointer-events: none;
       z-index: 40;
       max-width: 92vw;
       padding: 13px 18px;
       border-radius: 20px;
       background: #fff;
       color: var(--ink);
       border: 4px solid var(--yellow);
       font-size: 17px;
       font-weight: 700;
       box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
       transition: .2s;
       text-align: center
     }
     #bubble.show {
       opacity: 1;
       transform: translate(-50%, 0)
     }
     .modal {
       display: none;
       position: fixed;
       inset: 0;
       place-items: center;
       background: rgba(20, 40, 60, .45);
       z-index: 50;
       padding: 16px
     }
     .modal.show {
       display: grid
     }
     .modal-card {
       width: min(94vw, 400px);
       background: #fff;
       border-radius: 28px;
       padding: 26px 22px;
       text-align: center;
       box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
       animation: pop .28s ease
     }
     @keyframes pop {
       from {
         transform: scale(.9);
         opacity: 0
       }
       to {
         transform: scale(1);
         opacity: 1
       }
     }
     .modal-card .ic {
       font-size: 58px;
       line-height: 1
     }
     .modal-card h3 {
       margin: 8px 0 6px;
       font-size: 24px
     }
     .modal-card p {
       margin: 0;
       color: #6a7784;
       font-size: 16px;
       line-height: 1.45
     }
     .modal-card .row {
       display: flex;
       gap: 10px;
       justify-content: center;
       margin-top: 18px;
       flex-wrap: wrap
     }
     .spark,
     .conf {
       position: fixed;
       z-index: 45;
       pointer-events: none;
       font-size: 22px
     }
     @keyframes floatUp {
       to {
         transform: translate(var(--dx), -70px) scale(.4) rotate(var(--rot));
         opacity: 0
       }
     }
     @keyframes fall {
       to {
         transform: translateY(105vh) rotate(600deg);
         opacity: .9
       }
     }
     @media(max-width:620px) {
       body {
         padding: 4px
       }
       .card {
         padding: 8px;
         border-radius: 18px
       }
       .icon-btn {
         width: 44px;
         height: 44px;
         font-size: 21px
       }
       .bignum {
         min-width: 64px;
         height: 50px;
         font-size: 25px
       }
       .goal {
         padding: 6px 9px;
         gap: 7px
       }
       .palette {
         grid-template-columns: repeat(3, minmax(0, 108px))
       }
       .swatch {
         height: 70px
       }
       .lbl {
         font-size: 24px
       }
       .lbl.next {
         font-size: 34px
       }
       .choice {
         width: 104px
       }
     }
   </style>
 </head>
 <body>
   <main class="card">
     <div class="topbar">
       <button class="icon-btn" id="homeBtn" title="Home">🏠</button>
       <div class="title" id="title">🐰 Connect the Dots</div>
       <button class="icon-btn" id="soundBtn" title="Sound">🔊</button>
       <button class="icon-btn" id="resetBtn" title="Start again">↻</button>
     </div>
     <div class="goal">
       <div class="say" id="say">Tap the dots in order. Start with number</div>
       <div class="bignum" id="bignum">51</div>
     </div>
     <div class="track"><i id="bar"></i><b id="runner">🐰</b></div>
     <div class="picture">
       <svg id="svg" viewBox="-24 -30 676 620" preserveAspectRatio="xMidYMid meet" class="stage-dots">
         <g id="scene"></g>
         <g id="details"></g>
         <g id="lineLayer"><path id="dotLine" d=""></path></g>
         <g id="dots"></g>
         <text id="hand" x="0" y="0" text-anchor="middle">👇</text>
       </svg>
     </div>
     <section class="paintbar" id="paintbar">
       <div class="palette" id="palette"></div>
       <div class="toolrow">
         <button class="pill" id="hintBtn">💡 Hints: ON</button>
         <button class="pill grey" id="peekBtn">👀 Peek</button>
       </div>
     </section>
     <section class="quiz" id="quiz">
       <h2>Last question — which animal did you make?</h2>
       <div class="choices">
         <button class="choice" data-a="cat"><span class="em">🐱</span>Cat</button>
         <button class="choice" data-a="rabbit"><span class="em">🐰</span>Rabbit</button>
         <button class="choice" data-a="bear"><span class="em">🐻</span>Bear</button>
       </div>
     </section>
   </main>
   <div id="bubble"></div>
   <div class="modal" id="modal">
     <div class="modal-card">
       <div class="ic" id="mIc">🎉</div>
       <h3 id="mTitle">Well done!</h3>
       <p id="mText"></p>
       <div class="row" id="mRow"></div>
     </div>
   </div>
   <script>
     /* ================= data ================= */
     const P = { 51: [360.5, 55.7], 52: [369.1, 80.4], 53: [380.5, 91.4], 54: [396.8, 116.9], 55: [411.2, 78.3], 56: [462.1, 28.2], 57: [542.6, 4.7], 58: [579.8, 69.7], 59: [566.7, 127.8], 60: [534.7, 83.8], 61: [471.7, 107.5], 62: [418, 147], 63: [436.1, 178.6], 64: [447.7, 214.4], 65: [443.5, 248.7], 66: [416, 279.7], 67: [449.4, 308.2], 68: [477.2, 329.1], 69: [497.8, 357.1], 70: [517, 343], 71: [541, 351], 72: [557, 374], 73: [548, 399], 74: [525, 415], 75: [501, 410], 76: [492.4, 449.8], 77: [432, 472], 78: [390.5, 473.5], 79: [364.7, 471.8], 80: [333, 455], 81: [301, 423], 82: [287.6, 384.1], 83: [279.1, 360.2], 84: [289, 338.8], 85: [304.1, 320.6], 86: [299.6, 289.2], 87: [250.3, 265.9], 88: [229.4, 229.1], 89: [233.4, 184.8], 90: [263.3, 140.9], 91: [312.4, 100.8], 92: [281.6, 68.7], 93: [247.6, 87.9], 94: [195.5, 125.7], 95: [137, 126.6], 96: [143.2, 78], 97: [213.1, 36.4], 98: [265.4, 30.6], 99: [305.1, 46], 100: [328.5, 93.8] };
     const FIRST = 51, LAST = 100, N = LAST - FIRST + 1;
     const ORDER = Array.from({ length: N }, (_, i) => FIRST + i);
     const pts = ORDER.map(n => P[n]);
     /* smooth closed spline (Catmull-Rom -> cubic) */
     const T = 0.62;
     const segs = pts.map((_, i) => {
       const p0 = pts[(i - 1 + N) % N], p1 = pts[i], p2 = pts[(i + 1) % N], p3 = pts[(i + 2) % N];
       return {
         a: p1, b: p2,
         c1: [p1[0] + (p2[0] - p0[0]) / 6 * T, p1[1] + (p2[1] - p0[1]) / 6 * T],
         c2: [p2[0] - (p3[0] - p1[0]) / 6 * T, p2[1] - (p3[1] - p1[1]) / 6 * T]
       };
     });
     const r1 = v => Math.round(v * 10) / 10;
     const idx = n => n - FIRST;
     function arc(a, b) { const out = []; let i = idx(a); for (let k = 0; k < N; k++) { out.push(segs[i]); i = (i + 1) % N; if (ORDER[i] === b) break; } return out; }
     function curve(ranges, closers) {   // ranges: [[from,to],..]  closers: cubic control pairs joining ranges (and final close)
       let d = '';
       ranges.forEach((rg, k) => {
         const ss = arc(rg[0], rg[1]);
         if (k === 0) d += `M${r1(ss[0].a[0])} ${r1(ss[0].a[1])}`;
         else { const c = closers[k - 1]; d += `C${c[0]} ${c[1]} ${c[2]} ${c[3]} ${r1(ss[0].a[0])} ${r1(ss[0].a[1])}`; }
         ss.forEach(s => { d += `C${r1(s.c1[0])} ${r1(s.c1[1])} ${r1(s.c2[0])} ${r1(s.c2[1])} ${r1(s.b[0])} ${r1(s.b[1])}`; });
       });
       const last = closers[ranges.length - 1];
       if (last) d += `C${last[0]} ${last[1]} ${last[2]} ${last[3]} ${r1(arc(ranges[0][0], ranges[0][1])[0].a[0])} ${r1(arc(ranges[0][0], ranges[0][1])[0].a[1])}`;
       return d + 'Z';
     }
     const PATH = {
       leftEar: curve([[91, 100]], [[322, 120, 316, 122]]),
       rightEar: curve([[55, 62]], [[400, 128, 398, 96]]),
       head: curve([[86, 91], [100, 55], [62, 66]], [[316, 88, 322, 84], [430, 96, 432, 124], [398, 316, 344, 320]]),
       body: curve([[66, 86]], [[386, 292, 340, 292]]),
       tail: curve([[69, 75]], [[486, 396, 480, 370]])
     };
     /* hand drawn extras */
     const EX = {
       leftArm: "M318 320C334 336 330 364 310 379C293 392 266 393 252 382C238 371 242 349 260 339C278 329 304 306 318 320Z",
       rightArm: "M424 288C440 264 470 244 500 228C522 216 546 222 549 242C552 262 534 277 512 287C486 299 452 310 434 310Z",
       leftFoot: "M376 448C350 442 314 448 290 460C268 471 266 489 284 495C306 502 348 498 372 487C390 478 392 455 376 448Z",
       rightFoot: "M448 452C474 444 510 450 532 462C554 473 554 490 536 496C514 503 474 499 452 488C434 479 432 459 448 452Z",
       carrot: "M250 328C272 328 286 344 283 363C280 386 262 416 247 434C238 445 227 442 225 429C221 404 230 366 238 348C242 337 245 328 250 328Z",
       leaves: "M252 330C236 320 226 302 226 284C244 288 258 302 264 320ZM262 328C256 306 260 282 272 266C282 284 284 308 276 326ZM270 332C282 318 300 310 316 312C310 330 294 340 278 342Z",
       grass: "M14 552C14 508 96 480 196 474C302 468 386 470 452 474C556 481 616 508 616 552Z"
     };
     /* parts: id -> {paths, color, name, layerOrder} */

       PARTS.forEach(p => { if (!painted.has(p.id)) p.nodes.forEach(nd => { nd.style.fill = peeking ? p.c : "#fffdf7"; nd.style.opacity = peeking ? .45 : 1; }); });
       document.getElementById("peekBtn").textContent = peeking ? "👀 Hide" : "👀 Peek";
       bubble(peeking ? "This is how it should look 👀" : "Keep painting! 🎨", 1300);
     });
     function finishPaint() {
       confetti(); cheer();
       stage = "quiz";
       paintbar.classList.remove("show");
       quiz.classList.add("show");
       titleEl.textContent = "🐾 One last question";
       say.textContent = "Which animal did you make?"; bignum.textContent = "❓";
       modal("🌈", "Wonderful painting!", "Every part is coloured perfectly. Now, can you name the animal?", [{ label: "I know it! 🐾", cls: "green" }]);
     }
     document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
       if (b.dataset.a === "rabbit") {
         confetti(); cheer();
         modal("🏆", "You did it!", "You connected 50 dots, painted every part and named the rabbit. Superstar!", [
           { label: "Play again ↻", cls: "green", fn: () => location.reload() },
           { label: "🏠 Home", cls: "grey", fn: goHome }
         ]);
       } else {
         tone(300, .14, "sine", .04);
         bubble("Look at the long ears and the carrot 🥕 — try again!");
       }
     }));
     /* ================= buttons ================= */
     function goHome() { window.location.href = "../Grade2_chapter1.html"; }
     document.getElementById("homeBtn").addEventListener("click", goHome);
     document.getElementById("resetBtn").addEventListener("click", () => {
       modal("↻", "Start again?", "Your picture will be cleared and you can start from dot 51.", [
         { label: "Yes, start again", cls: "green", fn: () => location.reload() },
         { label: "No, keep going", cls: "grey" }
       ]);
     });
     document.getElementById("soundBtn").addEventListener("click", e => {
       sound = !sound; e.currentTarget.textContent = sound ? "🔊" : "🔇";
     });
     /* ================= go ================= */
     refreshDots();
     setTimeout(() => bubble("Hi! Tap dot 51 to begin 🐰", 2600), 600);
   </script>
 </body>
 </html>
