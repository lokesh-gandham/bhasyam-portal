<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17345f">
<title>Maths Fun</title>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#18365f;
  --muted:#71809a;
  --bg:#fff9e9;
  --white:#fff;
  --blue:#9CCFE3;
  --green:#A9D8A0;
  --orange:#F6B98A;
  --purple:#C5B1E8;
  --yellow:#F6D98B;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:"Livvic",Arial,sans-serif;
  background:linear-gradient(135deg,#fffdf6 0%,#fff4d7 100%);
  overflow-x:hidden;
}
button{font:inherit}
button:focus-visible{
  outline:4px solid rgba(45,169,215,.35);
  outline-offset:3px;
}
.app{
  width:min(1180px,calc(100% - 28px));
  margin:auto;
  padding:22px 0 48px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
}
.logo-mark{
  width:50px;
  height:50px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:25px;
  border-radius:16px;
  background:linear-gradient(145deg,#F6D98B,#F6B98A);
  box-shadow:0 6px 0 #D99A70;
  transform:rotate(-5deg);
}
.logo h1{
  margin:0;
  font-size:clamp(1.8rem,3vw,2.45rem);
  line-height:1;
  letter-spacing:-1.2px;
}

/* HOME HERO */
.hero{
  position:relative;
  overflow:hidden;
  margin:20px 0 25px;
  min-height:285px;
  padding:30px 34px;
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(290px,.85fr);
  align-items:center;
  gap:28px;
  border:3px solid #fff;
  border-radius:28px;
  background:#fff;
  box-shadow:0 15px 35px rgba(24,54,95,.09);
}
.hero-copy{position:relative;z-index:2}
.eyebrow{
  margin:0 0 7px;
  color:#D99A70;
  font-size:.76rem;
  font-weight:900;
  letter-spacing:.15em;
  text-transform:uppercase;
}
.hero h2{
  margin:0;
  font-size:clamp(2rem,4vw,3rem);
  line-height:1.08;
  letter-spacing:-.7px;
  font-weight: 400;
}
.hero-copy>p:last-child{
  margin:10px 0 0;
  color:var(--muted);
  font-size:1rem;
  font-weight:500;
}
.hero-image-wrap{
  position:relative;
  min-height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hero-image{
  display:block;
  width:min(100%,390px);
  height:220px;
  object-fit:cover;
  border:7px solid #fff;
  border-radius:25px;
  background:#eef8ff;
  box-shadow:0 14px 30px rgba(24,54,95,.13);
}
.hero-spark{
  position:absolute;
  z-index:3;
  color:#ffc64b;
  font-size:30px;
  text-shadow:0 2px #fff;
}
.spark-one{right:4%;top:3%}
.spark-two{left:5%;bottom:2%;font-size:21px}

/* HOME CARDS */
.section-title{margin:0 3px 14px}
.section-title h2{margin:0;font-size:2rem; font-weight: 400;}
.section-title p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:1.2rem;
  font-weight:500;
}
.category-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}
.category-card{
  --accent:var(--blue);
  --deep:#79B4C9;
  --soft:#EAF7FB;
  position:relative;
  overflow:hidden;
  min-height:250px;
  padding:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center ;
  text-align: center !important;
  gap:13px;
  border:2px solid #edf1f5;
  border-radius:22px;
  color:var(--ink);
  text-align:left;
  background:#fff;
  box-shadow:0 8px 0 rgba(126,158,178,.10),0 12px 25px rgba(24,54,95,.045);
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.category-card:before{
  content:"";
  position:absolute;
  right:-55px;
  top:-58px;
  width:150px;
  height:150px;
  border-radius:50%;
  background:var(--soft);
}
.category-card:hover{
  transform:translateY(-4px);
  border-color:var(--accent);
  box-shadow:0 11px 0 rgba(126,158,178,.12),0 18px 30px rgba(24,54,95,.07);
}
.category-card.green{--accent:var(--green);--deep:#7FB879;--soft:#EEF8EB}
.category-card.orange{--accent:var(--orange);--deep:#D99A70;--soft:#FFF3EB}
.category-card.purple{--accent:var(--purple);--deep:#A58BCE;--soft:#F5F0FC}
.category-visual{
  position:relative;
  z-index:1;
  width:76px;
  height:76px;
  flex:0 0 76px;
  display:grid;
  place-items:center;
  color:#27445B;
  font-size:1.8rem;
  font-weight:900;
  border-radius:22px;
  background:var(--accent);
  box-shadow:0 6px 0 var(--deep);
  transform:rotate(-3deg);
}
.category-card:nth-child(even) .category-visual{transform:rotate(3deg)}
.category-copy{position:relative;z-index:1}
.category-copy small{
  display:inline-block;
  padding:5px 8px;
  color:var(--accent);
  font-size:.64rem;
  font-weight:900;
  border-radius:99px;
  background:var(--soft);
}
.category-copy h3{
  margin:8px 0 5px;
  font-size:clamp(1.3rem,4vw,2rem);
  font-weight: 400;

}
.category-copy p{
  margin:0;
  color:#0d2443;
  font-size:clamp(.7rem, 3vw, 1rem);
  line-height:1.4;
  font-weight:400;
}
.open-label{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  color:var(--accent);
  font-size:clamp(.9rem,4vw,1rem);
  font-weight:500;
}

/* CATEGORY SCREEN */
.screen.hidden{display:none}
.screen{animation:fadeIn .25s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.category-header{
  --accent:var(--blue);
  display:flex;
  align-items:center;
  gap:18px;
  margin:22px 0;
  padding:22px;
  border:3px solid #fff;
  border-radius:25px;
  background:#fff;
  box-shadow:0 14px 32px rgba(24,54,95,.08);
}
.back-btn{
  
  height:50px;
  flex:0 0 auto;
     min-height: 46px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #fff;
    border-radius: 999px;
    background: #fff;
    color: #26324a;
    box-shadow: 0 5px 0 rgba(0, 0, 0, .08), 0 10px 20px rgba(35, 53, 77, .14);
  cursor:pointer;
  font-size: 1rem;
  font-weight: 500;
}
.back-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0d2443}
.category-heading-icon{
  width:68px;
  height:68px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:1.9rem;
  font-weight:900;
  border-radius:20px;
}
.category-header h2{margin:0;font-size:clamp(1.7rem,4vw,2.4rem); font-weight: 400;}
.category-header p{margin:4px 0 0;color:var(--muted);font-weight:400}
.activity-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
}
.activity-card{
  --accent:var(--blue);
  --deep:#79B4C9;
  --soft:#EAF7FB;
  min-height:305px;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  padding:18px;
  border:2px solid #edf1f5;
  border-radius:24px;
  background:#fff;
  box-shadow:0 8px 0 rgba(126,158,178,.10),0 14px 27px rgba(24,54,95,.05);
  cursor:pointer;
  transition:transform .18s ease,border-color .18s ease;
}
.activity-card:before{
  content:"";
  position:absolute;
  right:-47px;
  top:-50px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:var(--soft);
}
.activity-card:hover{transform:translateY(-5px);border-color:var(--accent)}
.card-top{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.number{
  width:41px;height:41px;
  display:grid;place-items:center;
  color:#27445B;font-size:.82rem;font-weight:900;
  border-radius:13px;
  background:var(--accent);
  box-shadow:0 5px 0 var(--deep);
}
.status{
  padding:6px 9px;
  color:var(--accent);
  font-size:.7rem;font-weight:900;
  border-radius:99px;
  background:var(--soft);
}
.game-visual{
  min-height:105px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--ink);
  font-size:1.6rem;
  font-weight:500;
}
.box{
  padding:7px 9px;
  border:2px solid var(--accent);
  border-radius:10px;
  background:var(--soft);
}
.activity-card h3{margin:3px 0 6px;font-size:clamp(1.3rem,4vw,1.8rem);font-weight: 400;}
.activity-card p{
  margin:0;
  color:var(--muted);
 font-size:clamp(.7rem,4vw,1rem);
  line-height:1.4;
  font-weight:400;
}
.start-btn{
  width:100%;
  min-height:47px;
  text-decoration:none;
  cursor:pointer;
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  border:0;
  border-radius:14px;
  color:#fff;
  font-weight:500;
  font-size:clamp(.7rem,4vw,1.3rem);
  background:var(--accent);
  box-shadow:0 5px 0 var(--deep);
}
.recommended{border-color:var(--yellow)}
.recommended:after{
  
  position:absolute;
  right:13px;
  bottom:69px;
  padding:5px 8px;
  color:#9A7A3A;
  font-size:.65rem;
  font-weight:900;
  border-radius:8px;
  background:var(--yellow);
  transform:rotate(-4deg);
}
.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  z-index:20;
  max-width:calc(100% - 30px);
  padding:13px 18px;
  color:#fff;
  font-weight:900;
  text-align:center;
  border-radius:14px;
  background:var(--ink);
  box-shadow:0 13px 30px rgba(24,54,95,.3);
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,100px);
  transition:.25s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:1050px){
  .category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .hero{
    grid-template-columns:1fr;
    min-height:0;
    padding:25px;
  }
  .hero-image-wrap{min-height:190px}
  .activity-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:610px){
  .app{width:calc(100% - 18px);padding-top:11px}
  .logo-mark{width:46px;height:46px;font-size:22px}
  .logo h1{font-size:1.75rem}
  .hero{margin-top:15px;padding:20px;border-radius:22px;gap:15px}
  .hero h2{font-size:1.85rem}
  .hero-image-wrap{min-height:145px}
  .hero-image{height:150px;border-width:5px;border-radius:18px}
  .category-grid,.activity-grid{grid-template-columns:1fr}
  .category-card{min-height:190px}
  .category-header{padding:16px;gap:11px}
  .category-heading-icon{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}

/* Quiz iframe overlay + Home button */
.quiz-frame-overlay{
  position:fixed;
  inset:0;
  z-index:2147483000;
  display:none;
  width:100vw;
  height:100vh;
  background:#fff;
}
.quiz-frame-overlay.open{display:block}
.quiz-frame{
  position:absolute;
  inset:0;
  z-index:1;
  display:block;
  width:100%;
  height:100%;
  border:0;
  margin:0;
  padding:0;
  background:#fff;
}
.quiz-frame-home{
  position:fixed !important;
  top:14px !important;
  left:14px !important;
  z-index:2147483647 !important;
  width:52px !important;
  height:52px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  border:0 !important;
  border-radius:15px !important;
  padding:0 !important;
  margin:0 !important;
  background:#fff !important;
  color:#18365f !important;
  font-size:27px !important;
  line-height:1 !important;
  cursor:pointer !important;
  box-shadow:0 5px 0 rgba(24,54,95,.18),0 8px 22px rgba(24,54,95,.16) !important;
  opacity:1 !important;
  visibility:visible !important;
  pointer-events:auto !important;
}
.quiz-frame-home:hover{transform:translateY(-2px)}
.quiz-frame-home:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 rgba(24,54,95,.18),0 5px 14px rgba(24,54,95,.12) !important;
}
@media(max-width:610px){
  .quiz-frame-home{
    top:9px !important;
    left:9px !important;
    width:45px !important;
    height:45px !important;
    border-radius:13px !important;
    font-size:24px !important;
  }
}
</style>
</head>

<body>
<div class="app">
  <!-- <header class="topbar">
    <div class="logo">
      <div class="logo-mark">✦</div>
      <h1>Maths Fun</h1>
    </div>
  </header> -->

  <main>
    <section id="homeScreen" class="screen">
      <div class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Ready to learn?</p>
          <h2>What would you like<br>to practise today?</h2>
          <p>Choose one colourful learning world below.</p>
        </div>

        <div class="hero-image-wrap">
          <img id="heroImage" class="hero-image" alt="Maths learning illustration">
          <span class="hero-spark spark-one">✦</span>
          <span class="hero-spark spark-two">✦</span>
        </div>
      </div>

      <div class="section-title">
        <h2>Choose a learning world</h2>
        <p>Each world has a small group of games.</p>
      </div>

      <div class="category-grid">
        <button class="category-card" data-category="basics" type="button">
          <span class="category-visual">123</span>
          <span class="category-copy">
            <small>7 GAMES</small>
            <h3>Learn Numbers</h3>
            <p>Count, name, build, and recognise numbers.</p>
            <span class="open-label">EXPLORE ACTIVITIES →</span>
          </span>
        </button>

        <button class="category-card green" data-category="order" type="button">
          <span class="category-visual">1↔3</span>
          <span class="category-copy">
            <small>7 GAMES</small>
            <h3>Number Order</h3>
            <p>Compare numbers and put them in order.</p>
            <span class="open-label">EXPLORE ACTIVITIES →</span>
          </span>
        </button>

        <button class="category-card orange" data-category="operations" type="button">
          <span class="category-visual">3+4</span>
          <span class="category-copy">
            <small>4 GAMES</small>
            <h3>Number Operations</h3>
            <p>Play with addition and subtraction.</p>
            <span class="open-label">EXPLORE ACTIVITIES →</span>
          </span>
        </button>

        <button class="category-card purple" data-category="visual" type="button">
          <span class="category-visual">🎨</span>
          <span class="category-copy">
            <small>3 GAMES</small>
            <h3>Play with Pictures</h3>
            <p>Learn using beads, colours, and pictures.</p>
            <span class="open-label">EXPLORE ACTIVITIES →</span>
          </span>
        </button>
      </div>
    </section>

    <section id="categoryScreen" class="screen hidden">
      <div class="category-header" id="categoryHeader">
        <button class="back-btn" id="backBtn" type="button" aria-label="Go back">🏠 Home</button>
        <div class="category-heading-icon" id="categoryIcon">123</div>
        <div>
          <h2 id="categoryTitle">Learn Numbers</h2>
          <p id="categoryDescription">Choose a game to begin.</p>
        </div>
      </div>
      <div class="activity-grid" id="activityGrid"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="quiz-frame-overlay" id="quizFrameOverlay" aria-hidden="true">
  <iframe class="quiz-frame" id="quizFrame" title="Maths quiz"></iframe>
  <button class="quiz-frame-home" id="quizFrameHome" type="button"
          aria-label="Home" title="Home">🏠</button>
</div>

<script>
'use strict';

const categories = {
  basics: {
    title:'Learn Numbers',
    icon:'123',
    description:'Count, name, build, and recognise numbers.',
    color:'#9CCFE3',
    deep:'#79B4C9',
    soft:'#EAF7FB',
    games:[
      ['1','Join the Dots','51 · 52 · 🦋','Connect numbers in the correct counting order.','./exercises/connectingDots.html'],
      ['2','Number Form','[3] [4] [7]','Build a number with the correct digits.','./exercises/NumbersFormed.html'],
      ['3','Sort Numbers','Tens | Ones','Sort digits by their place value.','./exercises/sorting.html'],
      ['4','Number Names','ONE · TWO','Match number words with numerals.','./exercises/7.html'],
      ['5','Even or Odd','576  ?','Decide whether a number is even or odd.','./exercises/14.html'],
      ['6','Even Numbers','24 · 37 · 58','Find all the even numbers.','./exercises/15.html'],
      ['7','Odd Numbers','24 · 37 · 58','Find all the odd numbers.','./exercises/16.html']
    ]
  },

  order: {
    title:'Number Order',
    icon:'1↔3',
    description:'Compare numbers and place them in the correct order.',
    color:'#A9D8A0',
    deep:'#7FB879',
    soft:'#EEF8EB',
    games:[
      ['1','Before Number','? ← 400','Find the number that comes before.','./exercises/8.html'],
      ['2','After Number','399 → ?','Find the number that comes after.','./exercises/9.html'],
      ['3','Number Between','423 · ? · 425','Complete the number sequence.','./exercises/10.html'],
      ['4','Compare Numbers','45 ? 54','Choose greater, smaller, or equal.','./exercises/11.html'],
      ['5','Biggest Number','23 ↑ 32','Choose the biggest number.','./exercises/12.html'],
      ['6','Smallest Number','23 ↓ 32','Choose the smallest number.','./exercises/13.html'],
      ['7','Height Order','▂ ▅ ▃ ▇','Order objects from shortest to tallest.','./exercises/height_order_game_updated.html']
    ]
  },

  operations: {
    title:'Number Operations',
    icon:'3+4',
    description:'Practise addition and subtraction with short games.',
    color:'#F6B98A',
    deep:'#D99A70',
    soft:'#FFF3EB',
    games:[
      ['1','Match Pairs','7 + 3 ↔ 10','Match each sum with its answer.','./exercises/match.html'],
      ['2','Fill Boxes','23 + ? = 30','Find the missing number.','./exercises/19.html'],
      ['3','Sums & Differences','34+12 · 56−21','Solve addition and subtraction.','./exercises/20.html'],
      ['4','Addition Facts','3 + 4 = 7','Build speed with addition facts.','./exercises/21.html']
    ]
  },

  visual: {
    title:'Play with Pictures',
    icon:'🎨',
    description:'Use visual objects to understand numbers.',
    color:'#C5B1E8',
    deep:'#A58BCE',
    soft:'#F5F0FC',
    games:[
      ['1','Abacus Scale','●●● ━━━','Read the beads on the abacus.','./exercises/5.html'],
      ['2','Draw Beads','━━━  ━━━','Add the correct number of beads.','./exercises/6.html'],
      ['3','Colour Picture','🍎 🌿 🍊','Use number clues to colour pictures.','./exercises/17.html']
    ]
  }
};

const home = document.getElementById('homeScreen');
const categoryScreen = document.getElementById('categoryScreen');
const grid = document.getElementById('activityGrid');
const header = document.getElementById('categoryHeader');
const title = document.getElementById('categoryTitle');
const description = document.getElementById('categoryDescription');
const icon = document.getElementById('categoryIcon');
const backBtn = document.getElementById('backBtn');
const toast = document.getElementById('toast');

let toastTimer = null;

/* Fully local hero illustration: no internet connection is required. */

const heroImage = "./assets/images/home.png";

function setRandomHeroImage(){
  const image = document.getElementById('heroImage');
  if(!image) return;

  image.src = heroImage;
}

function visualHTML(text){
  return text
    .replace(/\[(.*?)\]/g,'<span class="box">$1</span>')
    .replace(/ \| /g,' &nbsp;|&nbsp; ');
}

function showToast(message){
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function openCategory(key){
  const category = categories[key];
  if(!category) return;

  title.textContent = category.title;
  description.textContent = category.description;
  icon.textContent = category.icon;
  icon.style.background = category.color;
  header.style.setProperty('--accent', category.color);

  grid.innerHTML = category.games.map(game => `
    <article
      class="activity-card ${game[0] === '2' ? 'recommended' : ''}"
      tabindex="0"
      role="button"
      aria-label="Start ${game[1]}"
      style="--accent:${gameColor(category.color)};--deep:${category.deep};--soft:${category.soft}"
      data-game="${escapeHTML(game[1])}">
      <div class="card-top">
        <span class="number">${game[0]}</span>
        
      </div>
      <div class="game-visual">${visualHTML(game[2])}</div>
      <h3>${game[1]}</h3>
      <p>${game[3]}</p>
      <a class="start-btn" href="${game[4]}" aria-label="Start ${game[1]} quiz">Play ▶</a>
    </article>
  `).join('');

  home.classList.add('hidden');
  categoryScreen.classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});

  grid.querySelectorAll('.activity-card').forEach(card => {
    card.addEventListener('keydown', event => {
      if(event.key === 'Enter' || event.key === ' '){
        const link = card.querySelector('.start-btn');
        if(link){
          event.preventDefault();
          link.click();
        }
      }
    });
  });
}

function gameColor(value){
  return value || '#2da9d7';
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, char => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[char]));
}



document.querySelectorAll('[data-category]').forEach(button => {
  button.addEventListener('click', () => openCategory(button.dataset.category));
});

backBtn.addEventListener('click', () => {
  categoryScreen.classList.add('hidden');
  home.classList.remove('hidden');
  setRandomHeroImage();
  window.scrollTo({top:0,behavior:'smooth'});
});

setRandomHeroImage();



/* Open every quiz inside one iframe. Home is outside the iframe,
   so it is available on every quiz regardless of the quiz's own CSS. */
const quizFrameOverlay = document.getElementById('quizFrameOverlay');
const quizFrame = document.getElementById('quizFrame');
const quizFrameHome = document.getElementById('quizFrameHome');

function openQuizInFrame(url){
  if(!url || !quizFrameOverlay || !quizFrame) return;
  quizFrame.src = url;
  quizFrameOverlay.classList.add('open');
  quizFrameOverlay.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}

function closeQuizFrame(){
  if(!quizFrameOverlay || !quizFrame) return;
  quizFrame.src = 'about:blank';
  quizFrameOverlay.classList.remove('open');
  quizFrameOverlay.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}

document.addEventListener('click', function(event){
  const link = event.target.closest('.start-btn');
  if(!link) return;

  const url = link.getAttribute('href');
  if(!url || url.startsWith('#')) return;

  event.preventDefault();
  event.stopPropagation();
  openQuizInFrame(url);
}, true);

if(quizFrameHome){
  quizFrameHome.addEventListener('click', function(event){
    event.preventDefault();
    event.stopPropagation();
    closeQuizFrame();
  }, true);
}

document.addEventListener('keydown', function(event){
  if(event.key === 'Escape' &&
     quizFrameOverlay &&
     quizFrameOverlay.classList.contains('open')){
    closeQuizFrame();
  }
});
</script>
