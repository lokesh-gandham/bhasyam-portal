<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count and join the dots — Rabbit with a carrot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff; --outer:#cfcdb4; --rule:#2b2b2b; --ink:#111111;
    --frame:#d99a5b; --banner-a:#7d5a22; --banner-b:#a8842f; --badge:#2f7d32; --live:#1f7a34;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--outer); }
  body{
    font-family:"Quicksand", ui-rounded, "Segoe UI Rounded", "Nunito", system-ui, sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .sheet{ max-width:1000px; margin:0 auto; }
  .divider{ height:14px; background:var(--rule); }
  .spread{ padding:30px 0 0; }
  .card{
    position:relative; margin:0 18px; padding:0 0 24px;
    border:2px solid var(--frame); border-radius:14px; background:var(--paper); overflow:hidden;
  }
  .strip{ display:flex; align-items:stretch; gap:8px; margin:22px 0 0 14px; }
  .strip-title{
    display:flex; align-items:center;
    background:linear-gradient(180deg,var(--banner-b),var(--banner-a));
    color:#fff; font-weight:700; font-size:21px; padding:8px 22px 8px 50px;
    border-radius:6px; position:relative; box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);
  }
  .strip-num{
    display:flex; align-items:center; justify-content:center; min-width:56px; padding:4px 12px;
    background:#f4f2ea; color:#1b3c6e; font-weight:700; font-size:21px; border-radius:5px;
  }
  .steam{ display:flex; gap:2px; align-items:flex-end; }
  .steam b{
    display:flex; align-items:flex-end; justify-content:center; width:29px; height:37px;
    padding-bottom:2px; color:#fff; font-size:21px; font-weight:700; border-radius:3px;
  }
  h2.q{ font-size:25px; font-weight:700; margin:24px 0 0 26px; }

  .stage{ position:relative; margin:10px auto 0; width:min(100%,760px); }
  .stage canvas, .stage svg{ display:block; width:100%; height:auto; }
  #art{ image-rendering:auto; }
  #overlay{ position:absolute; inset:0; }
  #overlay.hidden{ display:none; }
  .dot{ fill:var(--ink); }
  .dot.held{ fill:var(--live); }
  .num{ font-family:inherit; font-size:19px; font-weight:600; fill:var(--ink); pointer-events:none; user-select:none; }
  .num.used{ fill:#8d8d8d; }
  .hit{ fill:transparent; cursor:pointer; }
  .seg{ stroke:var(--live); stroke-width:5; stroke-linecap:round; fill:none; }
  #artwrap.colouring{ cursor:crosshair; }

  .qrow{ display:flex; align-items:center; gap:16px; margin:22px 0 0 34px; font-size:23px; flex-wrap:wrap; }
  .qrow input[type=text]{
    font:inherit; font-size:21px; padding:11px 15px; width:300px;
    background:transparent; border:2px solid var(--frame); border-radius:8px; color:var(--ink);
  }
  .qrow input[type=text]:focus{ outline:3px solid var(--live); outline-offset:2px; }
  .pick{
    font:inherit; font-size:21px; padding:11px 24px; cursor:pointer;
    background:transparent; border:2px solid var(--frame); border-radius:8px; color:var(--ink);
  }
  .pick[aria-pressed="true"]{ background:var(--live); border-color:var(--live); color:#fff; }
  .pagenum{ display:flex; align-items:center; gap:10px; margin:20px 0 0 20px; }
  .pagenum span{
    display:grid; place-items:center; width:34px; height:34px; border-radius:50%;
    background:var(--badge); color:#fff; font-weight:700; font-size:15px;
  }

  .controls{
    position:sticky; bottom:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:12px 16px; background:#1d1d1d; color:#f2f2f2; font-size:14px;
  }
  .controls button{
    font:inherit; font-weight:600; padding:8px 14px; border-radius:7px; cursor:pointer;
    border:1px solid #4a4a4a; background:#2e2e2e; color:#f2f2f2; min-height:38px;
  }
  .controls button:hover{ background:#3b3b3b; }
  .controls button[aria-pressed="true"]{ background:var(--live); border-color:var(--live); }
  .controls button:focus-visible{ outline:2px solid #7cc98d; outline-offset:2px; }
  .swatches{ display:flex; gap:6px; }
  .sw{ width:28px; height:28px; border-radius:50%; border:2px solid #555; cursor:pointer; padding:0; }
  .sw[aria-pressed="true"]{ border-color:#fff; transform:scale(1.14); }
  .status{ margin-left:auto; font-weight:600; }

  @media (max-width:720px){
    .card{ margin:0 10px; }
    .strip{ flex-wrap:wrap; margin-left:10px; }
    .strip-title{ font-size:16px; padding:7px 14px 7px 40px; }
    h2.q{ font-size:18px; margin-left:12px; }
    .qrow{ font-size:17px; margin-left:12px; gap:10px; }
    .qrow input[type=text]{ width:190px; font-size:17px; }
    .status{ width:100%; margin-left:0; }
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="divider"></div>
  <div class="spread">
    <div class="card">
      <div class="strip">
        <div class="strip-title">
          <svg viewBox="0 0 40 46" width="32" height="38" aria-hidden="true" style="position:absolute;left:9px;top:-3px">
            <rect x="14" y="16" width="16" height="26" rx="6" fill="#e8a92c" stroke="#7a4a12" stroke-width="2"/>
            <rect x="16" y="2" width="12" height="20" rx="5" fill="#e8a92c" stroke="#7a4a12" stroke-width="2"/>
            <circle cx="20" cy="10" r="1.8" fill="#3a2515"/><circle cx="26" cy="10" r="1.8" fill="#3a2515"/>
            <path d="M6 30 h10 v10 H6z" fill="#c0392b" stroke="#7a4a12" stroke-width="2"/>
          </svg>
          Check what you know
        </div>
        <div class="strip-num">3.2</div>
        <div class="steam">
          <b style="background:#2f6fb5">S</b><b style="background:#3f8f45">T</b><b style="background:#c0392b">E</b><b style="background:#d7a12c">A</b><b style="background:#6b5aa8">M</b>
        </div>
      </div>

      <h2 class="q">1.&nbsp; Join the dots from 51 to 100. Then colour the picture.</h2>

      <div class="stage" id="artwrap">
        <canvas id="art"></canvas>
        <svg id="overlay" viewBox="0 0 898 838" role="img"
             aria-label="Dot-to-dot rabbit holding a carrot, fifty dots numbered 51 to 100.">
          <g id="segs"></g><g id="dots"></g><g id="nums"></g>
        </svg>
      </div>

      <div class="qrow">
        <label for="ans">I am a</label>
        <input id="ans" type="text" autocomplete="off">
      </div>
      <div class="qrow">
        <span>Do you like rabbits?</span>
        <button class="pick" id="yes" aria-pressed="false">Yes</button>
        <button class="pick" id="no" aria-pressed="false">No</button>
      </div>

      <div class="pagenum">
        <svg viewBox="0 0 46 44" width="38" height="36" aria-hidden="true">
          <rect x="14" y="12" width="18" height="26" rx="7" fill="#e8a92c" stroke="#7a4a12" stroke-width="2"/>
          <circle cx="19" cy="22" r="2" fill="#3a2515"/><circle cx="27" cy="22" r="2" fill="#3a2515"/>
          <path d="M16 6 l2 8 M30 6 l-2 8" stroke="#7a4a12" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>77</span>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="join">Join the dots for me</button>
  <button id="undo">Undo</button>
  <button id="clear">Start over</button>
  <button id="mode" aria-pressed="false">Colour mode</button>
  <div class="swatches" id="swatches"></div>
  <span class="status" id="status">Tap 51, then tap 52.</span>
</div>
<script>
(function () {
  "use strict";

  const W = 898, H = 838;
  const DOTS = {
   51:[509.5,107.5],52:[522.0,142.8],53:[538.4,159.0],54:[561.8,195.0],55:[583.4,140.3],
   56:[657.2,67.2],57:[773.8,32.7],58:[828.0,127.5],59:[809.3,212.0],60:[762.5,148.0],
   61:[670.6,182.6],62:[593.0,239.2],63:[619.2,285.9],64:[636.3,338.4],65:[630.2,387.8],
   66:[590.4,433.4],67:[638.8,474.7],68:[678.9,504.9],69:[708.5,545.5],70:[748.6,530.9],
   71:[751.6,551.3],72:[783.6,568.4],73:[759.2,591.8],74:[759.6,626.1],75:[721.8,619.2],
   76:[690.6,677.1],77:[616.0,715.8],78:[556.1,719.0],79:[519.3,714.4],80:[455.9,693.0],
   81:[424.4,644.5],82:[399.3,587.7],83:[399.4,554.0],84:[402.6,519.0],85:[410.9,491.9],
   86:[407.8,459.4],87:[349.3,413.3],88:[319.3,359.4],89:[325.0,294.8],90:[368.4,230.8],
   91:[439.5,172.7],92:[394.8,125.8],93:[345.6,153.9],94:[269.8,208.8],95:[185.0,210.4],
   96:[194.4,139.6],97:[295.6,78.6],98:[371.3,70.4],99:[428.9,92.8],100:[463.1,162.5]
  };
  const FIRST = 51, LAST = 100;

  /* label offsets measured from the printed worksheet: each pair is the
     centre of the number relative to its dot */
  const LBL = {
   51:[2.8,-14.8],52:[10.3,-15.6],53:[-9.9,14.4],54:[-14.5,12.8],55:[-11.1,-12.6],
   56:[-14.1,-11.5],57:[27.5,-7.6],58:[23.4,-8.0],59:[20.9,8.3],60:[-6.8,-15.9],
   61:[-16.9,-5.4],62:[25.7,0.5],63:[19.5,-4.9],64:[23.0,-1.0],65:[21.0,7.1],
   66:[-19.9,-4.6],67:[-11.4,17.8],68:[19.9,-9.9],69:[-14.8,8.4],70:[14.0,-10.3],
   71:[-15.3,13.3],72:[21.5,-2.0],73:[18.4,8.4],74:[17.4,16.0],75:[-17.4,2.9],76:[17.6,9.4],
   77:[12.6,10.1],78:[11.3,-25.0],79:[8.6,11.0],80:[-21.0,-13.0],81:[-14.8,5.8],
   82:[19.1,-1.4],83:[19.0,3.6],84:[18.3,4.8],85:[20.6,3.2],86:[17.5,-10.6],87:[17.8,-8.4],
   88:[17.8,-5.9],89:[-14.1,-1.3],90:[-31.9,8.9],91:[10.8,22.0],92:[7.4,21.3],
   93:[-6.0,18.1],94:[-6.5,20.9],95:[-15.0,16.8],96:[-20.0,1.3],97:[-21.8,-10.4],
   98:[7.1,-13.5],99:[8.9,-12.0],100:[14.8,14.6]
  };

  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const el = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };

  const canvas = $("art"), ctx = canvas.getContext("2d", { willReadFrequently: true });
  const overlay = $("overlay"), segsG = $("segs"), dotsG = $("dots"), numsG = $("nums");
  const status = $("status"), wrap = $("artwrap");

  /* ---------------------------------------------------------------- *
   * Dots and numbers
   * ---------------------------------------------------------------- */
  const dotEl = {}, numEl = {};
  for (let n = FIRST; n <= LAST; n++) {
    const [x, y] = DOTS[n], off = LBL[n] || [12, 4];

    const c = el("circle", { class: "dot", cx: x, cy: y, r: 6 });
    dotsG.appendChild(c); dotEl[n] = c;

    const t = el("text", {
      class: "num", x: x + off[0], y: y + off[1],
      "text-anchor": "middle", "dominant-baseline": "middle"
    });
    t.textContent = n; numsG.appendChild(t); numEl[n] = t;

    const hit = el("circle", { class: "hit", cx: x, cy: y, r: 26, tabindex: "0", role: "button" });
    hit.dataset.n = n;
    hit.setAttribute("aria-label", "Dot " + n);
    dotsG.appendChild(hit);
  }

  /* ---------------------------------------------------------------- *
   * Joining: tap one dot, tap another, a line is drawn between them
   * ---------------------------------------------------------------- */
  let drawn = [], held = null, colouring = false;

  const key = (a, b) => Math.min(a, b) + "-" + Math.max(a, b);
  const indexOfSeg = (a, b) => drawn.findIndex((s) => key(s[0], s[1]) === key(a, b));

  function nextWanted() {
    for (let n = FIRST; n < LAST; n++) if (indexOfSeg(n, n + 1) < 0) return n;
    return indexOfSeg(LAST, FIRST) < 0 ? LAST : 0;
  }

  function redraw() {
    while (segsG.firstChild) segsG.removeChild(segsG.firstChild);
    drawn.forEach(([a, b]) => segsG.appendChild(el("line", {
      class: "seg", x1: DOTS[a][0], y1: DOTS[a][1], x2: DOTS[b][0], y2: DOTS[b][1]
    })));

    for (let n = FIRST; n <= LAST; n++) {
      dotEl[n].classList.toggle("held", n === held);
      dotEl[n].setAttribute("r", n === held ? 9 : 6);
    }

    const want = nextWanted();
    if (colouring) status.textContent = "Pick a colour, then tap a part of the picture.";
    else if (held) status.textContent = "Holding " + held + ". Now tap the next dot.";
    else if (want === 0) status.textContent = "All joined. Switch to colour mode.";
    else if (want === LAST) status.textContent = "Last one: join 100 back to 51 to close the head.";
    else status.textContent = "Tap " + want + ", then tap " + (want + 1) + ".";
  }

  function tap(n) {
    if (colouring) return;
    if (held === null) { held = n; redraw(); return; }
    if (held === n) { held = null; redraw(); return; }
    const at = indexOfSeg(held, n);
    if (at >= 0) drawn.splice(at, 1); else drawn.push([held, n]);
    held = null;
    redraw();
  }

  dotsG.addEventListener("click", (e) => {
    const n = e.target.dataset && e.target.dataset.n;
    if (n) tap(+n);
  });
  dotsG.addEventListener("keydown", (e) => {
    const n = e.target.dataset && e.target.dataset.n;
    if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tap(+n); }
  });

  $("join").addEventListener("click", () => {
    drawn = [];
    for (let n = FIRST; n < LAST; n++) drawn.push([n, n + 1]);
    drawn.push([LAST, FIRST]);
    held = null; redraw();
  });
  $("undo").addEventListener("click", () => { drawn.pop(); held = null; redraw(); });
  $("clear").addEventListener("click", () => {
    drawn = []; held = null;
    if (colouring) { setMode(false); return; }
    resetCanvas(); buildBarrier(); redraw();
  });

  /* ---------------------------------------------------------------- *
   * Colouring: bake the joined lines into the bitmap, then flood fill
   * ---------------------------------------------------------------- */
  const PALETTE = ["#e8b52c", "#f28b24", "#63b52f", "#7fc4e8", "#f3a39a", "#c0398c", "#8a5a24", "#eadfca"];
  let chosen = PALETTE[0];
  const swatches = $("swatches");

  PALETTE.forEach((colour, i) => {
    const b = document.createElement("button");
    b.className = "sw";
    b.style.background = colour;
    b.setAttribute("aria-label", "Colour " + (i + 1));
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.addEventListener("click", () => {
      chosen = colour;
      [...swatches.children].forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
      if (!colouring) setMode(true);
    });
    swatches.appendChild(b);
  });

  const art = new Image(), bar = new Image();
  let ready = 0;
  const onload = () => { if (++ready === 2) { resetCanvas(); buildBarrier(); redraw(); } };

  function resetCanvas() {
    canvas.width = W; canvas.height = H;
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(art, 0, 0, W, H);
  }

  /* The barrier is the line art with its hairline gaps sealed. Fills are
     computed against it, then painted onto the visible canvas, so a colour
     runs right up to the ink instead of stopping short of it. */
  let block = null;
  const bcan = document.createElement("canvas");
  const bctx = bcan.getContext("2d", { willReadFrequently: true });

  function buildBarrier() {
    bcan.width = W; bcan.height = H;
    bctx.fillStyle = "#fff"; bctx.fillRect(0, 0, W, H);
    bctx.drawImage(bar, 0, 0, W, H);
    bctx.strokeStyle = "#000"; bctx.lineWidth = 5; bctx.lineCap = "round";
    drawn.forEach(([a, b]) => {
      bctx.beginPath();
      bctx.moveTo(DOTS[a][0], DOTS[a][1]);
      bctx.lineTo(DOTS[b][0], DOTS[b][1]);
      bctx.stroke();
    });
    const bd = bctx.getImageData(0, 0, W, H).data;
    block = new Uint8Array(W * H);
    for (let i = 0, p = 0; i < block.length; i++, p += 4) block[i] = bd[p] < 128 ? 1 : 0;
  }

  function bakeLines() {
    ctx.save();
    ctx.strokeStyle = "#111"; ctx.lineWidth = 4; ctx.lineCap = "round";
    drawn.forEach(([a, b]) => {
      ctx.beginPath();
      ctx.moveTo(DOTS[a][0], DOTS[a][1]);
      ctx.lineTo(DOTS[b][0], DOTS[b][1]);
      ctx.stroke();
    });
    ctx.restore();
  }

  function setMode(on) {
    colouring = on;
    $("mode").setAttribute("aria-pressed", String(on));
    $("mode").textContent = on ? "Back to dots" : "Colour mode";
    overlay.classList.toggle("hidden", on);
    wrap.classList.toggle("colouring", on);
    if (on) { resetCanvas(); bakeLines(); buildBarrier(); }
    held = null;
    redraw();
  }
  $("mode").addEventListener("click", () => setMode(!colouring));

  function hex(c) {
    return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  }

  /* A region bigger than this is the background leaking through an opening,
     not a part of the rabbit — the largest real region is about 15%. */
  const CAP = Math.round(0.3 * W * H);

  function fill(sx, sy, rgb) {
    if (!block) return "wait";
    if (block[sy * W + sx]) return "line";

    const seen = new Uint8Array(W * H);
    const stack = [sx, sy];
    const px = [];
    while (stack.length) {
      const y = stack.pop(), x = stack.pop();
      const idx = y * W + x;
      if (seen[idx] || block[idx]) continue;
      let left = x, right = x;
      while (left > 0 && !block[y * W + left - 1] && !seen[y * W + left - 1]) left--;
      while (right < W - 1 && !block[y * W + right + 1] && !seen[y * W + right + 1]) right++;
      for (let i = left; i <= right; i++) {
        seen[y * W + i] = 1; px.push(y * W + i);
        if (px.length > CAP) return "open";
        if (y > 0 && !block[(y - 1) * W + i] && !seen[(y - 1) * W + i]) stack.push(i, y - 1);
        if (y < H - 1 && !block[(y + 1) * W + i] && !seen[(y + 1) * W + i]) stack.push(i, y + 1);
      }
    }

    const img = ctx.getImageData(0, 0, W, H), d = img.data;
    for (const i of px) {
      const p = i * 4;
      if (d[p] < 90 && d[p + 1] < 90 && d[p + 2] < 90) continue;   // keep the ink readable
      d[p] = rgb[0]; d[p + 1] = rgb[1]; d[p + 2] = rgb[2]; d[p + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return "ok";
  }

  canvas.addEventListener("click", (e) => {
    if (!colouring) return;
    const r = canvas.getBoundingClientRect();
    const x = Math.round((e.clientX - r.left) * (W / r.width));
    const y = Math.round((e.clientY - r.top) * (H / r.height));
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const res = fill(x, y, hex(chosen));
    status.textContent =
      res === "ok"   ? "Nice. Pick another colour or another part." :
      res === "line" ? "That is a line. Tap just inside a shape." :
      res === "open" ? "That area is still open — join the last dots first." :
                       "One moment, the picture is still loading.";
  });

  /* ---------------------------------------------------------------- *
   * Answer widgets
   * ---------------------------------------------------------------- */
  const ans = $("ans");
  ans.addEventListener("input", () => {
    const v = ans.value.trim().toLowerCase();
    ans.style.borderColor = (v === "rabbit" || v === "bunny" || v === "hare") ? "#1f7a34" : "";
  });
  const yes = $("yes"), no = $("no");
  const choose = (a, b) => {
    a.setAttribute("aria-pressed", String(a.getAttribute("aria-pressed") !== "true"));
    b.setAttribute("aria-pressed", "false");
  };
  yes.addEventListener("click", () => choose(yes, no));
  no.addEventListener("click", () => choose(no, yes));

  redraw();
})();
