<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Choose the correct symbol.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Shared styles -->
    <link rel="stylesheet" href="../assets/css/reuse.css">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
    </script>


    <style>
        /* =========================================================
   BASE / RESET
   ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background-image: url("../assets/images/bg.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            font-family: "Livvic", sans-serif;

            max-width: 100vw;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
        }

        img {
            max-width: 100%;
        }


        /* =========================================================
   MAIN CONTAINER
   ========================================================= */

        .monkey-quiz {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            min-width: 0;
            min-height: 0;

            padding:
                clamp(6px, 1vh, 14px) clamp(10px, 2.5vw, 40px) clamp(4px, 1vh, 10px);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        /* =========================================================
   HOME / HINT POSITION
   Appearance remains controlled by reuse.css
   ========================================================= */

        /* =========================================================
   TOP AREA
   Home / Hint appearance is 100% from reuse.css
   ========================================================= */

        .quiz-top {
            width: 100%;
            max-width: 100%;

            flex: 0 0 auto;

            display: grid;

            grid-template-columns:
                90px minmax(0, 1fr) 90px;

            align-items: start;

            gap: 10px;
        }


        /* =========================================================
   HOME + HINT BUTTONS
   ========================================================= */

        .quiz-top>.quiz-icon-btn {
            width: 100%;
            height: 62px;

            margin: 0;
            padding: 0;

            border: 0;
            outline: none;

            background: transparent !important;

            display: flex;
            align-items: flex-start;

            position: relative;
            z-index: 100;

            cursor: pointer;

            appearance: none;
            -webkit-appearance: none;

            -webkit-tap-highlight-color: transparent;
        }


        /* =========================================================
   HOME - LEFT
   ========================================================= */

        .quiz-top>.home-btn {
            justify-content: flex-start;
        }


        /* =========================================================
   HINT - RIGHT
   ========================================================= */

        .quiz-top>.hint-btn {
            justify-content: flex-end;
        }


        /* =========================================================
   CIRCLE
   ========================================================= */

        .quiz-top>.quiz-icon-btn .quiz-icon-circle {

            width: clamp(44px, 4.2vw, 62px);
            height: clamp(44px, 4.2vw, 62px);

            min-width: clamp(44px, 4.2vw, 62px);
            min-height: clamp(44px, 4.2vw, 62px);

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            /* color: #ffffff !important; */

            font-size: clamp(19px, 1.8vw, 27px);

            line-height: 1;

            position: relative;
            z-index: 101;

            box-sizing: border-box;

            opacity: 1 !important;
            visibility: hidden;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }


        /* =========================================================
   HOME COLOR
   ========================================================= */

        .quiz-top>.home-btn .home-icon {

            background:
                linear-gradient(145deg,
                    #8b6fe0,
                    #6f42c1) !important;

            /* border: 3px solid #ffffff !important; */


        }


        /* =========================================================
   HINT COLOR
   ========================================================= */

        .quiz-top>.hint-btn .hint-icon {

            background:
                linear-gradient(145deg,
                    #ffc94d,
                    #f7a800) !important;
            /* 
    border: 3px solid #ffffff !important; */

            box-shadow:
                0 4px 0 #c17e00,
                0 7px 14px rgba(193, 126, 0, .25) !important;
        }


        /* =========================================================
   ICON
   ========================================================= */

        .quiz-top>.quiz-icon-btn .quiz-icon-circle i {

            display: inline-block !important;

            color: #ffffff !important;

            opacity: 1 !important;
            visibility: visible !important;

            line-height: 1;
        }


        /* =========================================================
   HOVER
   ========================================================= */

        .quiz-top>.quiz-icon-btn:hover .quiz-icon-circle {

            transform:
                translateY(-2px) scale(1.06);
        }


        /* =========================================================
   CLICK
   ========================================================= */

        .quiz-top>.quiz-icon-btn:active .quiz-icon-circle {

            transform:
                translateY(2px) scale(.97);
        }


        /* =========================================================
   TITLE
   ========================================================= */

        .quiz-title {
            width: 100%;
            max-width: 100%;

            margin: 0;

            text-align: center;

            font-size: 30px;

            line-height: 1.12;

            font-weight: 400;

            color: #1f2d3d;
            transform: translateY(12px);

            /*
     * Prevent long title from creating overflow.
     */
            overflow-wrap: normal;
        }



        /* =========================================================
   QUESTION AREA
   ========================================================= */

        .question-area {
            flex: 1 1 auto;

            width: 100%;
            min-width: 0;
            min-height: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            gap: clamp(12px, 2.4vh, 28px);

            padding:
                clamp(4px, 1vh, 12px) 0;
        }


        /* =========================================================
   QUESTION ROW
   ========================================================= */

        .question-row {
            width: min(920px, 96vw);
            max-width: 100%;

            min-width: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: clamp(14px, 3vw, 42px);

            flex: 0 1 auto;
        }


        /* =========================================================
   QUESTION LABEL
   ========================================================= */

        .question-label {
            flex: 0 0 auto;

            margin: 0;

            font-family: "Livvic", sans-serif;

            font-size: 30px;
            line-height: 1;

            font-weight: 400;

            color: #2f4f4f;

            transform: translateY(-8px);
        }


        /* =========================================================
   MONKEY PAIR
   ========================================================= */

        .monkey-pair {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: clamp(12px, 3.5vw, 48px);

            min-width: 0;
            margin-bottom: 20px;
        }


        /* =========================================================
   MONKEY CARD
   ========================================================= */

        .question-monkey {
            position: relative;

            width: clamp(125px,
                    min(15vw, 20vh),
                    205px);

            height: clamp(110px,
                    min(13vw, 17vh),
                    170px);

            flex: 0 1 auto;

            min-width: 0;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================================================
   MONKEY IMAGE
   ========================================================= */

        .question-monkey img {
            width: 100%;
            height: 100%;

            max-width: 100%;
            max-height: 100%;

            object-fit: contain;

            display: block;

            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;

            transform-origin: center bottom;
        }


        /* =========================================================
   NUMBER ON MONKEY
   ========================================================= */

        .monkey-number {
            position: absolute;

            left: 50%;
            top: 57%;

            transform: translate(-50%, -50%);

            width: auto;
            max-width: 88%;
            min-height: clamp(30px, 4.2vh, 52px);
            height: auto;

            padding: clamp(4px, 1vh, 9px) clamp(8px, 1.2vw, 16px);

            border: 3px solid rgba(255, 255, 255, .95);
            border-radius: 50%;

            background: rgba(255, 255, 255, .88);
            box-shadow: 0 4px 0 rgba(94, 67, 137, .2), 0 6px 12px rgba(61, 46, 92, .12);

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Livvic", sans-serif;

            font-size: clamp(22px,
                    min(2.8vw, 4vh),
                    38px);

            line-height: 1;
            white-space: nowrap;

            font-weight: 400;

            color: #1f2d3d;

            z-index: 5;

            pointer-events: none;
        }


        /* =========================================================
   SYMBOL ON MIDDLE MONKEY
   ========================================================= */

        .symbol-number {
            position: relative;

            width: 72%;
            min-height: 42%;
            height: auto;

            padding: clamp(6px, 1.2vh, 14px) clamp(12px, 1.8vw, 24px);

            border: clamp(3px, .35vw, 6px) solid #ffffff;
            border-radius: clamp(14px, 1.8vw, 26px);

            background: linear-gradient(145deg, #fff9df, #ffe59a);
            box-shadow:
                0 7px 0 #d7a936,
                0 12px 20px rgba(174, 121, 20, .25),
                inset 0 2px 0 rgba(255, 255, 255, .75);

            transform: translateY(0);

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Livvic", sans-serif;

            font-size: clamp(28px,
                    min(3.6vw, 5vh),
                    48px);

            line-height: 1;

            font-weight: 700;

            color: #f43f68;

            z-index: 5;

            pointer-events: none;
        }


        /* =========================================================
   MIDDLE ANSWER MONKEY
   ========================================================= */

        .answer-monkey {
            transform: scale(.98);

            border-radius: clamp(18px, 2vw, 30px);
            background: linear-gradient(145deg, #fffdf5, #fff1c2);
            border: 3px solid rgba(255, 211, 86, .9);
            box-shadow: 0 8px 0 #d7a936, 0 14px 24px rgba(174, 121, 20, .2);
        }

        .answer-monkey img {
            display: none;
        }


        /* =========================================================
   MONKEY FLOAT
   ========================================================= */

        .question-monkey img {
            animation: monkeyFloat 3s ease-in-out infinite;
        }

        .question-monkey:nth-child(1) img {
            animation-delay: 0s;
        }

        .question-monkey:nth-child(2) img {
            animation-delay: .45s;
        }

        .question-monkey:nth-child(3) img {
            animation-delay: .9s;
        }


        /* =========================================================
   FLOAT ANIMATION
   ========================================================= */

        @keyframes monkeyFloat {

            0% {
                transform:
                    translateY(0) rotate(0deg);
            }

            25% {
                transform:
                    translateY(-4px) rotate(-1deg);
            }

            50% {
                transform:
                    translateY(-7px) rotate(1deg);
            }

            75% {
                transform:
                    translateY(-4px) rotate(-1deg);
            }

            100% {
                transform:
                    translateY(0) rotate(0deg);
            }
        }


        /* =========================================================
   JUMP ANIMATIONS
   ========================================================= */

        .monkey-jump {
            animation:
                monkeyJump .7s cubic-bezier(.2, .8, .3, 1) !important;
        }

        @keyframes monkeyJump {

            0% {
                transform:
                    translateY(0) rotate(0deg) scale(1);
            }

            25% {
                transform:
                    translateY(-28px) rotate(-7deg) scale(1.04);
            }

            50% {
                transform:
                    translateY(-42px) rotate(6deg) scale(1.07);
            }

            75% {
                transform:
                    translateY(-18px) rotate(-3deg) scale(1.03);
            }

            100% {
                transform:
                    translateY(0) rotate(0deg) scale(1);
            }
        }


        /* =========================================================
   ANSWER POP
   ========================================================= */

        .answer-show {
            animation: answerPop .35s ease;
        }

        @keyframes answerPop {

            0% {
                opacity: 0;

                transform:
                    translateY(8px) scale(.45);
            }

            70% {
                opacity: 1;

                transform:
                    translateY(-2px) scale(1.15);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0) scale(1);
            }
        }


        /* =========================================================
   OPTIONS AREA
   ========================================================= */

        .options-area {
            width: min(900px, 96vw);
            max-width: 100%;

            min-width: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: clamp(5px, 1vh, 12px);

            flex: 0 1 auto;
        }


        /* =========================================================
   OPTIONS TITLE
   ========================================================= */

        .options-title {
            width: 100%;

            margin: 0;

            text-align: center;

            font-family: "Livvic", sans-serif;

            font-size: 17px;
            line-height: 1.1;

            font-weight: 500;

            color: #59636e;
            margin-top: 10px;
            display: none;
        }


        /* =========================================================
   OPTIONS GRID
   ========================================================= */

        .options {
            width: 100%;
            max-width: 100%;

            min-width: 0;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            align-items: center;
            justify-content: center;

            gap: clamp(12px, 4vw, 50px);
        }


        /* =========================================================
   SYMBOL OPTION BUTTON
   Completely new option design
   ========================================================= */

        .symbol-option {
            width: clamp(100px,
                    min(15vw, 17vh),
                    170px);

            height: clamp(82px,
                    min(12vw, 14vh),
                    140px);

            justify-self: center;

            border: 0;

            border-radius: 28px;

            padding: 0;

            background:
                linear-gradient(145deg,
                    #ffffff,
                    #f1ecff);

            color: #6f42c1;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Livvic", sans-serif;

            font-size: clamp(40px,
                    min(5vw, 7vh),
                    70px);

            font-weight: 400;

            line-height: 1;

            box-shadow:
                0 8px 0 #c8b9e5,
                0 12px 22px rgba(75, 50, 110, .18);

            transition:
                transform .18s ease,
                box-shadow .18s ease,
                background .18s ease;

            -webkit-tap-highlight-color: transparent;
        }


        /* =========================================================
   OPTION COLORS
   ========================================================= */

        .symbol-option:nth-child(1) {
            color: #08a878;

            background:
                linear-gradient(145deg,
                    #ffffff,
                    #e5fff6);

            box-shadow:
                0 8px 0 #83d8bd,
                0 12px 22px rgba(8, 168, 120, .18);
        }

        .symbol-option:nth-child(2) {
            color: #8954ce;

            background:
                linear-gradient(145deg,
                    #ffffff,
                    #f0e7ff);

            box-shadow:
                0 8px 0 #b99ce5,
                0 12px 22px rgba(137, 84, 206, .18);
        }

        .symbol-option:nth-child(3) {
            color: #f49a24;

            background:
                linear-gradient(145deg,
                    #ffffff,
                    #fff2dc);

            box-shadow:
                0 8px 0 #efc27c,
                0 12px 22px rgba(244, 154, 36, .18);
        }


        /* =========================================================
   OPTION HOVER
   ========================================================= */

        .symbol-option:hover {
            transform:
                translateY(-5px) scale(1.03);
        }


        /* =========================================================
   OPTION ACTIVE
   ========================================================= */

        .symbol-option:active {
            transform:
                translateY(4px) scale(.98);

            box-shadow:
                0 3px 0 #c8b9e5,
                0 6px 12px rgba(75, 50, 110, .15);
        }


        /* =========================================================
   CORRECT OPTION
   ========================================================= */

        .symbol-option.correct {
            transform: scale(1.05);

            box-shadow:
                0 0 0 5px rgba(67, 185, 75, .2),
                0 8px 0 #72bd78,
                0 14px 25px rgba(67, 185, 75, .25);
        }


        /* =========================================================
   WRONG OPTION
   ========================================================= */

        .symbol-option.wrong {
            animation:
                symbolShake .4s ease;
        }

        @keyframes symbolShake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-7px);
            }

            50% {
                transform: translateX(7px);
            }

            75% {
                transform: translateX(-5px);
            }
        }


        /* =========================================================
   LOCKED OPTION
   ========================================================= */

        .symbol-option.locked {
            pointer-events: none;
            cursor: default;
        }


        /* =========================================================
   QUESTION COMPLETION
   ========================================================= */

        .question-monkey.completed img {
            filter:
                drop-shadow(0 0 10px rgba(67, 185, 75, .45));
        }


        /* =========================================================
   BASE RESPONSIVE SAFETY
   ========================================================= */

        .question-area,
        .question-row,
        .monkey-pair,
        .options-area,
        .options {
            contain: layout;
        }


        /* =========================================================
   TABLET
   ========================================================= */

        @media (min-width: 601px) and (max-width: 900px) {

            .monkey-quiz {
                padding:
                    5px 12px 4px;
            }

            .quiz-top {
                grid-template-columns:
                    60px minmax(0, 1fr) 60px;

                gap: 8px;
            }

            .quiz-title {
                font-size: 24px;
                transform: translateY(6px);
            }

            .question-area {
                gap: 14px;
            }

            .question-row {
                width: 96%;
                gap: 12px;
            }

            .question-label {
                font-size: 28px;
                transform: translateY(-5px);
            }

            .monkey-pair {
                gap: 15px;
            }

            .question-monkey {
                width: clamp(100px,
                        15vw,
                        135px);

                height: clamp(88px,
                        13vw,
                        115px);
            }

            .monkey-number {
                font-size: 23px;
            }

            .symbol-number {
                font-size: 30px;
            }

            .options-area {
                width: 94%;
                gap: 5px;
            }

            .options-title {
                font-size: 14px;
            }

            .options {
                gap: 12px;
            }

            .symbol-option {
                width: clamp(88px,
                        15vw,
                        125px);

                height: clamp(72px,
                        12vw,
                        102px);

                border-radius: 22px;

                font-size: 48px;

                box-shadow:
                    0 6px 0 #c8b9e5,
                    0 9px 17px rgba(75, 50, 110, .16);
            }
        }


        /* =========================================================
   MOBILE
   ========================================================= */

        @media (min-width: 401px) and (max-width: 600px) {

            .monkey-quiz {
                padding:
                    4px 7px 3px;
            }

            .quiz-top {
                grid-template-columns:
                    45px minmax(0, 1fr) 45px;

                gap: 4px;
            }

            .quiz-title {
                font-size: 20px;
                transform: translateY(5px);
            }

            .question-area {
                gap: 8px;
                padding-top: 3px;
                padding-bottom: 3px;
            }

            .question-row {
                width: 100%;
                gap: 5px;
            }

            .question-label {
                font-size: 18px;
                transform: translateY(-3px);
            }

            .monkey-pair {
                gap: 5px;
            }

            .question-monkey {
                width: clamp(72px,
                        min(22vw, 13vh),
                        100px);

                height: clamp(64px,
                        min(19vw, 11vh),
                        82px);
            }

            .monkey-number {
                font-size: 17px;
            }

            .symbol-number {
                font-size: 23px;
            }

            .options-area {
                width: 100%;
                gap: 3px;
            }

            .options-title {
                font-size: 11px;
            }

            .options {
                gap: 4px;
            }

            .symbol-option {
                width: clamp(70px,
                        min(26vw, 12vh),
                        100px);

                height: clamp(58px,
                        min(21vw, 10vh),
                        80px);

                border-radius: 18px;

                font-size: clamp(34px,
                        8vw,
                        48px);

                box-shadow:
                    0 5px 0 #c8b9e5,
                    0 8px 15px rgba(75, 50, 110, .15);
            }


            /* HOME + HINT SIZE — matches the second math HTML */
            .quiz-top>.quiz-icon-btn {
                height: 43px;
            }

            .quiz-top>.quiz-icon-btn .quiz-icon-circle {
                width: 38px;
                height: 38px;

                min-width: 38px;
                min-height: 38px;

                font-size: 16px;

                border-width: 2px !important;

                box-shadow:
                    0 3px 0 rgba(0, 0, 0, .18) !important;
            }
        }


        /* =========================================================
   VERY SMALL MOBILE
   ========================================================= */

        @media (max-width: 400px) {

            .monkey-quiz {
                padding:
                    3px 5px 2px;
            }

            .quiz-top {
                grid-template-columns:
                    38px minmax(0, 1fr) 38px;

                gap: 2px;
            }

            .quiz-title {
                font-size: 15px;
                transform: translateY(3px);
            }

            .question-area {
                gap: 5px;
                padding-top: 2px;
                padding-bottom: 2px;
            }

            .question-row {
                width: 100%;
                gap: 3px;
            }

            .question-label {
                font-size: 14px;
                transform: translateY(-2px);
            }

            .monkey-pair {
                gap: 3px;
            }

            .question-monkey {
                width: clamp(60px,
                        min(22vw, 12vh),
                        78px);

                height: clamp(53px,
                        min(18vw, 10vh),
                        64px);
            }

            .monkey-number {
                font-size: 14px;
            }

            .symbol-number {
                font-size: 19px;
            }

            .options-area {
                width: 100%;
                gap: 2px;
            }

            .options-title {
                font-size: 9px;
            }

            .options {
                gap: 2px;
            }

            .symbol-option {
                width: clamp(57px,
                        25vw,
                        75px);

                height: clamp(48px,
                        20vw,
                        61px);

                border-radius: 15px;

                font-size: clamp(28px,
                        8vw,
                        40px);

                box-shadow:
                    0 4px 0 #c8b9e5,
                    0 6px 12px rgba(75, 50, 110, .14);
            }


            /* HOME + HINT SIZE — matches the second math HTML */
            .quiz-top>.quiz-icon-btn {
                height: 37px;
            }

            .quiz-top>.quiz-icon-btn .quiz-icon-circle {
                width: 34px;
                height: 34px;

                min-width: 34px;
                min-height: 34px;

                font-size: 14px;

                border-width: 2px !important;

                box-shadow:
                    0 3px 0 rgba(0, 0, 0, .18) !important;
            }
        }


        /* =========================================================
   SHORT DESKTOP / LAPTOP SCREENS
   ========================================================= */

        @media (max-height: 600px) and (min-width: 601px) {

            .monkey-quiz {
                padding-top: 3px;
                padding-bottom: 2px;
            }

            .quiz-title {
                font-size: 26px;
                transform: translateY(3px);
            }

            .question-area {
                gap: 7px;
                padding-top: 2px;
                padding-bottom: 2px;
            }

            .question-row {
                gap: 10px;
            }

            .question-monkey {
                width: clamp(100px,
                        min(13vw, 19vh),
                        145px);

                height: clamp(86px,
                        min(10.5vw, 16vh),
                        116px);
            }

            .monkey-number {
                font-size: 22px;
            }

            .symbol-number {
                font-size: 30px;
            }

            .options-area {
                gap: 3px;
            }

            .options-title {
                font-size: 12px;
            }

            .symbol-option {
                width: clamp(88px,
                        min(12vw, 17vh),
                        130px);

                height: clamp(70px,
                        min(10vw, 14vh),
                        105px);

                font-size: 48px;
            }
        }


        /* =========================================================
   LARGE DESKTOP
   ========================================================= */

        @media (min-width: 1200px) {

            .quiz-title {
                font-size: 34px;
            }

            .question-row {
                width: 1000px;
            }

            .question-label {
                font-size: 32px;
            }

            .monkey-pair {
                gap: 42px;
            }

            .question-monkey {
                width: 185px;
                height: 155px;
            }

            .monkey-number {
                font-size: 34px;
            }

            .symbol-number {
                font-size: 44px;
            }

            .options-area {
                width: 900px;
            }

            .options {
                gap: 38px;
            }

            .symbol-option {
                width: 165px;
                height: 135px;

                font-size: 66px;
            }
        }


        /* =========================================================
   VERY LARGE DESKTOP
   ========================================================= */

        @media (min-width: 1440px) {

            .quiz-title {
                font-size: 40px;
            }

            .question-row {
                width: 1250px;
            }

            .question-label {
                font-size: 40px;
            }

            .monkey-pair {
                gap: 55px;
            }

            .question-monkey {
                width: 245px;
                height: 205px;
            }

            .monkey-number {
                font-size: 44px;
            }

            .symbol-number {
                font-size: 56px;
            }

            .options-area {
                width: 1100px;
            }

            .options {
                gap: 55px;
            }

            .symbol-option {
                width: 210px;
                height: 165px;

                font-size: 78px;
            }
        }


        /* =========================================================
   EXTRA LARGE DESKTOP
   ========================================================= */

        @media (min-width: 1600px) {

            .question-row {
                width: 1450px;
                max-width: 95vw;
            }

            .question-label {
                font-size: 44px;
            }

            .monkey-pair {
                gap: 70px;
            }

            .question-monkey {
                width: 285px;
                height: 235px;
            }

            .monkey-number {
                font-size: 50px;
            }

            .symbol-number {
                font-size: 64px;
            }

            .options-area {
                width: 1250px;
                max-width: 95vw;
            }

            .options {
                gap: 75px;
            }

            .symbol-option {
                width: 240px;
                height: 190px;

                font-size: 90px;
            }
        }


        /* =========================================================
   HINT POPUP
   ========================================================= */

        .hint-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;
            background: rgba(0, 0, 0, 0.45);

            z-index: 99999;
        }

        .hint-overlay.show {
            display: flex !important;
        }

        .hint-box {
            position: relative;
            width: min(520px, 92vw);
            max-width: 100%;

            padding: 30px 28px 25px;

            background: #ffffff;
            border-radius: 24px;

            text-align: center;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);

            animation: hintPopup .25s ease-out;
        }

        .hint-box h3 {
            margin: 0 0 15px;

            font-family: "Livvic", sans-serif;
            font-size: 30px;
            line-height: 1.1;
            font-weight: 700;

            color: #f7a800;
        }

        .hint-box p {
            margin: 0 0 25px;

            font-family: "Livvic", sans-serif;
            font-size: 21px;
            line-height: 1.45;
            font-weight: 500;

            color: #2f4f4f;
        }

        .hint-close {
            border: 0;
            outline: none;

            padding: 12px 28px;

            border-radius: 14px;

            background: linear-gradient(145deg,
                    #ffc94d,
                    #f7a800);

            color: #ffffff;

            font-family: "Livvic", sans-serif;
            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 5px 0 #c17e00,
                0 8px 15px rgba(193, 126, 0, .25);

            transition: transform .15s ease;
        }

        .hint-close:hover {
            transform: translateY(-2px);
        }

        .hint-close:active {
            transform: translateY(3px);
        }

        @keyframes hintPopup {
            from {
                opacity: 0;
                transform: scale(.85) translateY(15px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @media (max-width: 600px) {
            .hint-box {
                width: 92vw;
                padding: 24px 18px 20px;
                border-radius: 20px;
            }

            .hint-box h3 {
                font-size: 24px;
            }

            .hint-box p {
                font-size: 17px;
            }

            .hint-close {
                font-size: 16px;
                padding: 10px 24px;
            }
        }


        body.hint-open {
            overflow: hidden;
        }
    </style>

</head>


<body>


    <div class="monkey-quiz">


        <!-- =====================================================
         TOP
         ===================================================== -->

        <div class="quiz-top">

            <!-- HOME -->
            <button type="button" id="homeBtn" class="quiz-icon-btn home-btn" aria-label="Home">

                <span class="quiz-icon-circle home-icon">
                    <i class="fa-solid fa-house"></i>
                </span>

            </button>


            <!-- TITLE -->
            <div>

                <h1 class="quiz-title">
                    Choose the correct symbol.
                </h1>

            </div>


            <!-- HINT -->
            <button type="button" id="hintBtn" class="quiz-icon-btn hint-btn" aria-label="Hint">

                <span class="quiz-icon-circle hint-icon">
                    <i class="fa-solid fa-lightbulb"></i>
                </span>

            </button>

        </div>


        <!-- =====================================================
         QUESTION
         ===================================================== -->

        <main class="question-area">

            <div class="question-row">

                <p class="question-label" id="questionLabel">
                    Q1.
                </p>


                <div class="monkey-pair">


                    <!-- LEFT MONKEY -->

                    <div class="question-monkey" id="leftMonkey">

                        <img src="../assets/images/monkey.png" alt="Monkey">

                        <span class="monkey-number" id="leftNumber">
                        </span>

                    </div>


                    <!-- MIDDLE MONKEY -->

                    <div class="question-monkey answer-monkey" id="middleMonkey">

                        <img src="../assets/images/monkey.png" alt="Monkey">

                        <span class="symbol-number" id="answerSymbol">
                        </span>

                    </div>


                    <!-- RIGHT MONKEY -->

                    <div class="question-monkey" id="rightMonkey">

                        <img src="../assets/images/monkey.png" alt="Monkey">

                        <span class="monkey-number" id="rightNumber">
                        </span>

                    </div>

                </div>



            </div>


            <!-- =================================================
             OPTIONS
             ================================================= -->


            <div class="options-area">

                <div class="options" id="optionsContainer">
                </div>

                 <p class="options-title">
                    Choose the correct symbol.
                </p>

            </div>

        </main>


        <!-- =====================================================
         SHARED PREV / NEXT
         ===================================================== -->

        <div class="controls">

            <button id="prevBtn" class="prev" disabled>
                <i class="fa-solid fa-circle-arrow-left"></i>
                Prev
            </button>

            <button id="nextBtn" class="next" disabled>
                Next
                <i class="fa-solid fa-circle-arrow-right"></i>
            </button>

        </div>

    </div>


    <!-- =========================================================
     HINT
     ========================================================= -->

    <div class="hint-overlay" id="hintOverlay">

        <div class="hint-box">

            <h3>
                Hint
            </h3>

            <p id="hintText"></p>

            <button class="hint-close" id="closeHintBtn">

                Got it!

            </button>

        </div>

    </div>


    <!-- =========================================================
     ANSWER POPUP
     Same popup structure
     ========================================================= -->

    <div id="answerPopup" class="kid-popup">

        <div class="kid-card">

            <div class="kid-icon" id="popupIcon">
            </div>

            <h3 id="popupTitle">
            </h3>

            <p id="popupMsg">
            </p>

        </div>

    </div>


    <!-- =========================================================
     FINAL POPUP
     Same final popup structure
     ========================================================= -->

    <div id="finalPopup">

        <div class="final-kid-box">

            <h2>
                🎉
                <span>
                    Congratulations!
                </span>
            </h2>

            <p id="finalScore"></p>

            <div id="stars">
                ⭐⭐⭐
            </div>

            <button class="playAgain-btn" onclick="location.reload()">

                Play Again

            </button>

        </div>

    </div>


    <!-- =========================================================
     SOUNDS
     ========================================================= -->

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3">
    </audio>

    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3">
    </audio>


    <script>

        /* =========================================================
           IMAGE
           Change only this path if your filename is different.
           ========================================================= */

        const MONKEY_SRC =
            "../assets/images/monkey.png";


        /* =========================================================
           QUESTIONS
           Data taken from the worksheet image
           ========================================================= */

        const QUESTIONS = [

            {
                label: "Q1.",
                left: 331,
                right: 281,
                answer: ">",

                options: [
                    "<",
                    ">",
                    "="
                ],

                hint:
                    "331 is greater than 281, so choose greater than."
            },

            {
                label: "Q2.",
                left: 800,
                right: 800,
                answer: "=",

                options: [
                    "<",
                    ">",
                    "="
                ],

                hint:
                    "800 and 800 are equal, so choose equal to."
            },

            {
                label: "Q3.",
                left: 197,
                right: 99,
                answer: ">",

                options: [
                    "<",
                    ">",
                    "="
                ],

                hint:
                    "197 is greater than 99, so choose greater than."
            },

            {
                label: "Q4.",
                left: 526,
                right: 562,
                answer: "<",

                options: [
                    "<",
                    ">",
                    "="
                ],

                hint:
                    "526 is smaller than 562, so choose less than."
            },

            {
                label: "Q5.",
                left: 606,
                right: 660,
                answer: "<",

                options: [
                    "<",
                    ">",
                    "="
                ],

                hint:
                    "606 is smaller than 660, so choose less than."
            },

            {
                label: "Q6.",
                left: 711,
                right: 117,
                answer: ">",

                options: [
                    "<",
                    ">",
                    "="
                ],

                hint:
                    "711 is greater than 117, so choose greater than."
            }

        ];

        /* =========================================================
           STATE
           ========================================================= */

        let current = 0;

        let score = 0;

        const answered =
            QUESTIONS.map(() => false);


        /* =========================================================
           ELEMENTS
           ========================================================= */

        const questionLabel =
            document.getElementById(
                "questionLabel"
            );

        const leftNumber =
            document.getElementById(
                "leftNumber"
            );

        const rightNumber =
            document.getElementById(
                "rightNumber"
            );

        const answerSymbol =
            document.getElementById(
                "answerSymbol"
            );

        const leftMonkey =
            document.getElementById(
                "leftMonkey"
            );

        const middleMonkey =
            document.getElementById(
                "middleMonkey"
            );

        const rightMonkey =
            document.getElementById(
                "rightMonkey"
            );

        const optionsContainer =
            document.getElementById(
                "optionsContainer"
            );

        const prevBtn =
            document.getElementById(
                "prevBtn"
            );

        const nextBtn =
            document.getElementById(
                "nextBtn"
            );

        const correctSound =
            document.getElementById(
                "correctSound"
            );

        const wrongSound =
            document.getElementById(
                "wrongSound"
            );


        /* =========================================================
           SOUND
           ========================================================= */

        function playSound(audio) {

            audio.currentTime = 0;

            audio.play().catch(
                () => { }
            );

        }


        /* =========================================================
           SPEECH
           ========================================================= */

        function speak(text) {

            if (!window.speechSynthesis) {
                return;
            }

            speechSynthesis.cancel();

            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );

            utterance.lang =
                "en-UK";

            utterance.volume =
                0.25;

            utterance.rate =
                1;

            speechSynthesis.speak(
                utterance
            );

        }


        /* =========================================================
           CONFETTI
           ========================================================= */

        function smallConfetti() {

            if (!window.confetti) {
                return;
            }

            confetti({

                particleCount: 35,

                spread: 65,

                origin: {
                    y: .7
                },

                scalar: .8

            });

        }


        /* =========================================================
           POPUP
           ========================================================= */

        function showPopup(correct) {

            const popup =
                document.getElementById(
                    "answerPopup"
                );

            const icon =
                document.getElementById(
                    "popupIcon"
                );

            const title =
                document.getElementById(
                    "popupTitle"
                );

            const message =
                document.getElementById(
                    "popupMsg"
                );


            popup.className =
                "kid-popup " +
                (
                    correct
                        ? "kid-correct"
                        : "kid-wrong"
                );


            popup.style.display =
                "flex";


            if (correct) {

                icon.textContent =
                    "🎉";

                title.textContent =
                    "Great Job!";

                message.textContent =
                    "You got it right!";

            } else {

                icon.textContent =
                    "🥲";

                title.textContent =
                    "Oops!";

                message.textContent =
                    "Try again!";

            }


            clearTimeout(
                showPopup.timer
            );


            showPopup.timer =
                setTimeout(
                    () => {

                        popup.style.display =
                            "none";

                    },
                    1300
                );

        }


        /* =========================================================
           REMOVE JUMP CLASSES
           ========================================================= */

        function resetMonkeyAnimation() {

            leftMonkey.classList.remove(
                "monkey-jump"
            );

            middleMonkey.classList.remove(
                "monkey-jump"
            );

            rightMonkey.classList.remove(
                "monkey-jump"
            );

        }


        /* =========================================================
           MAKE MONKEY JUMP
           ========================================================= */

        function jumpMonkeys(symbol) {

            resetMonkeyAnimation();


            void leftMonkey.offsetWidth;
            void rightMonkey.offsetWidth;


            if (symbol === ">") {

                leftMonkey.classList.add(
                    "monkey-jump"
                );

            }


            if (symbol === "<") {

                rightMonkey.classList.add(
                    "monkey-jump"
                );

            }


            if (symbol === "=") {

                leftMonkey.classList.add(
                    "monkey-jump"
                );

                rightMonkey.classList.add(
                    "monkey-jump"
                );

            }

        }


        /* =========================================================
           CREATE OPTION
           ========================================================= */

        function createOption(
            value,
            index
        ) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "symbol-option";


            button.dataset.value =
                value;


            button.textContent =
                value;


            button.setAttribute(
                "aria-label",
                `Choose ${value}`
            );


            button.addEventListener(
                "click",
                () => {

                    validateAnswer(
                        button,
                        value
                    );

                }
            );


            return button;

        }


        /* =========================================================
           RENDER QUESTION
           ========================================================= */

        function renderQuestion() {

            const question =
                QUESTIONS[current];


            questionLabel.textContent =
                question.label;


            leftNumber.textContent =
                question.left;


            rightNumber.textContent =
                question.right;


            answerSymbol.textContent =
                "";


            answerSymbol.classList.remove(
                "answer-show"
            );


            resetMonkeyAnimation();


            optionsContainer.innerHTML =
                "";


            question.options.forEach(
                (value, index) => {

                    const option =
                        createOption(
                            value,
                            index
                        );

                    optionsContainer.appendChild(
                        option
                    );

                }
            );


            /* Restore already answered question */

            if (answered[current]) {

                answerSymbol.textContent =
                    question.answer;


                answerSymbol.classList.add(
                    "answer-show"
                );


                const correctOption =
                    optionsContainer.querySelector(
                        `[data-value="${question.answer}"]`
                    );


                if (correctOption) {

                    correctOption.classList.add(
                        "correct",
                        "locked"
                    );

                }

            }


            updateNavigation();

        }


        /* =========================================================
           VALIDATE
           ========================================================= */

        function validateAnswer(
            option,
            value
        ) {

            if (
                answered[current]
            ) {
                return;
            }


            const question =
                QUESTIONS[current];


            /* =====================================================
               CORRECT
               ===================================================== */

            if (
                value ===
                question.answer
            ) {

                option.classList.add(
                    "correct",
                    "locked"
                );


                answerSymbol.textContent =
                    question.answer;


                answerSymbol.classList.remove(
                    "answer-show"
                );


                void answerSymbol.offsetWidth;


                answerSymbol.classList.add(
                    "answer-show"
                );


                answered[current] =
                    true;


                score++;


                /* Monkey movement */

                setTimeout(
                    () => {

                        jumpMonkeys(
                            question.answer
                        );

                    },
                    100
                );


                playSound(
                    correctSound
                );


                speak(
                    "Correct"
                );


                showPopup(
                    true
                );


                smallConfetti();


                updateNavigation();


                /* Final popup */

                if (
                    current ===
                    QUESTIONS.length - 1
                ) {

                    setTimeout(
                        showFinal,
                        1100
                    );

                }


                return;

            }


            /* =====================================================
               WRONG
               ===================================================== */

            option.classList.remove(
                "wrong"
            );


            void option.offsetWidth;


            option.classList.add(
                "wrong"
            );


            playSound(
                wrongSound
            );


            speak(
                "Try again"
            );


            showPopup(
                false
            );


            /* Remove wrong state */

            setTimeout(
                () => {

                    option.classList.remove(
                        "wrong"
                    );

                },
                450
            );

        }


        /* =========================================================
           NAVIGATION
           ========================================================= */

        function updateNavigation() {

            prevBtn.disabled =
                current === 0;


            nextBtn.disabled =
                !answered[current] ||
                current ===
                QUESTIONS.length - 1;

        }


        /* =========================================================
           PREVIOUS
           ========================================================= */

        prevBtn.addEventListener(
            "click",
            () => {

                if (
                    current <= 0
                ) {
                    return;
                }


                current--;


                renderQuestion();

            }
        );


        /* =========================================================
           NEXT
           ========================================================= */

        nextBtn.addEventListener(
            "click",
            () => {

                if (
                    nextBtn.disabled
                ) {
                    return;
                }


                if (
                    current <
                    QUESTIONS.length - 1
                ) {

                    current++;

                    renderQuestion();

                }

            }
        );


        /* =========================================================
           HOME
           ========================================================= */

        document
            .getElementById("homeBtn")
            .addEventListener(
                "click",
                () => {

                    window.top.location.href =
                        "../Grade2_chapter2.html";

                }
            );


        /* =========================================================
           HINT
           ========================================================= */

        const hintBtn =
            document.getElementById(
                "hintBtn"
            );

        const hintOverlay =
            document.getElementById(
                "hintOverlay"
            );

        const hintText =
            document.getElementById(
                "hintText"
            );

        const closeHintBtn =
            document.getElementById(
                "closeHintBtn"
            );


        function openHint() {
            const question = QUESTIONS[current];

            if (!question || !question.hint) {
                return;
            }

            hintText.textContent = question.hint;

            hintOverlay.classList.add("show");

            document.body.classList.add("hint-open");
        }

        function closeHint() {
            hintOverlay.classList.remove("show");
            document.body.classList.remove("hint-open");
        }

        hintBtn.addEventListener("click", openHint);

        closeHintBtn.addEventListener("click", closeHint);

        hintOverlay.addEventListener("click", (event) => {
            if (event.target === hintOverlay) {
                closeHint();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && hintOverlay.classList.contains("show")) {
                closeHint();
            }
        });


        /* =========================================================
           FINAL POPUP
           ========================================================= */

        function showFinal() {

            const finalPopup =
                document.getElementById(
                    "finalPopup"
                );


            document.getElementById(
                "finalScore"
            ).textContent =
                `Your Score: ${score} / ${QUESTIONS.length}`;


            document.getElementById(
                "stars"
            ).textContent =
                "⭐⭐⭐";


            finalPopup.style.display =
                "flex";


            if (
                window.confetti
            ) {

                confetti({

                    particleCount: 150,

                    spread: 100,

                    origin: {
                        y: .5
                    }

                });


                setTimeout(
                    () => {

                        confetti({

                            particleCount: 100,

                            spread: 70,

                            origin: {
                                y: .6
                            }

                        });

                    },
                    300
                );

            }

        }


        /* =========================================================
           INITIALIZE
           ========================================================= */

        renderQuestion();

    </script>


</body>
