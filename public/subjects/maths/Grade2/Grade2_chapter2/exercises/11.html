<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Face Value Quiz</title>

<link rel="stylesheet" href="../assets/css/reuse.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>


*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"livvic";
    font-weight:400;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
     
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background-image: url("../assets/images/bg.png");
}

.quiz-container{
    width:min(1180px,96vw);
    height:min(720px,94vh);
    padding:24px 42px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
     
}

.quiz-top{
    width:100%;
    min-height:58px;
    display:grid;
    grid-template-columns:90px minmax(0,1fr) 90px;
    align-items:start;
    gap:10px;
    flex-shrink:0;
}

/* Layout only: these do not style or replace reuse.css icons. */
.quiz-home,
.quiz-hint{
    display:flex;
    align-items:flex-start;
    flex-shrink:0;
}

.quiz-home{
    justify-content:flex-start;
    visibility: hidden !important;
}

.quiz-hint{
    justify-content:flex-end;
}

.quiz-title{
    width:100%;
    max-width:100%;
    margin:0;
    text-align:center;
    font-size:30px;
    line-height:1.12;
    font-weight:400;
    color:#1f2d3d;
    transform:translateY(12px);
}

.icon-btn{
    width:100%;
    height:62px;
    margin:0;
    padding:0;
    border:0;
    outline:none;
    background:transparent !important;
    display:flex;
    align-items:flex-start;
    position:relative;
    z-index:100;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    -webkit-tap-highlight-color:transparent;
}

.icon-circle{
    width:clamp(44px,4.2vw,62px);
    height:clamp(44px,4.2vw,62px);
    min-width:clamp(44px,4.2vw,62px);
    min-height:clamp(44px,4.2vw,62px);
    flex-shrink:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(19px,1.8vw,27px);
    line-height:1;
    position:relative;
    z-index:101;
    box-sizing:border-box;
    opacity:1 !important;
    /* visibility:visible !important; */
    transition:transform .2s ease,box-shadow .2s ease;
}

.icon-circle.home{
    position: fixed;
    top: 10px;
    left: 30px;
    background:linear-gradient(145deg,#8b6fe0,#6f42c1) !important;
    box-shadow:0 4px 0 #5a2a99,0 7px 14px rgba(111,66,193,.25) !important;
}

.icon-circle.hint{
    position: fixed;
     top: 10px;
    right: 30px;
    background:linear-gradient(145deg,#ffc94d,#f7a800) !important;
    box-shadow:0 4px 0 #c17e00,0 7px 14px rgba(193,126,0,.25) !important;
}

.icon-circle i{
    display:inline-block !important;
    color:#ffffff !important;
    opacity:1 !important;
    visibility:visible !important;
    line-height:1;
}

.icon-btn:hover .icon-circle{
    transform:translateY(-2px) scale(1.06);
}

.icon-btn:active .icon-circle{
    transform:translateY(2px) scale(.97);
}

.question-section{
    width:100%;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.question-title{
    width:100%;
    color:#2f4f4f;
    font-size:30px;
    line-height:1.15;
    font-weight:400;
    text-align:center;
    margin:0 0 22px;
}

.question-content{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
}

.digit-image{
    width:clamp(105px,12vw,150px);
    height:clamp(105px,12vw,150px);
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:30px;
    background:#fff8dc;
    border:4px solid #ead8a1;
    box-shadow:0 8px 18px rgba(0,0,0,.10);
    flex-shrink:0;
}

.digit-image img{
     width:82%;
     height:82%;
     object-fit:contain;
     display:block;
     user-select:none;
     -webkit-user-drag:none;
}

.answer-area{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    width:100%;
}

.answer-input{
    width:150px;
    height:64px;
    border:3px solid #f2a36f;
    border-radius:16px;
    background:#fffdf8;
    color:#2f4f4f;
    font-family:"livvic";
    font-size:32px;
    font-weight:700;
    text-align:center;
    outline:none;
    box-shadow:0 5px 12px rgba(0,0,0,.08);
    transition:.2s ease;
}

.answer-input:focus{
    border-color:#4aaecb;
    box-shadow:0 0 0 4px rgba(74,174,203,.16),0 6px 14px rgba(0,0,0,.08);
}

.answer-input.correct{
    border-color:#4caf50;
    background:#e6f8ec;
    color:#2e7d32;
}

.answer-input.wrong{
    border-color:#e03131;
    background:#fff5f5;
}

.submit-button{
    min-width:140px;
    height:58px;
    padding:0 24px;
    border:0;
    border-radius:30px;
    background:linear-gradient(145deg,#67c8df,#3fa8c4);
    color:#fff;
    font-family:"livvic";
    font-size:21px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 0 #2c839d,0 9px 20px rgba(63,168,196,.25);
    transition:all .18s ease;
}

.submit-button:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 8px 0 #2c839d,0 12px 25px rgba(63,168,196,.32);
}

.submit-button:active:not(:disabled){
    transform:translateY(4px);
    box-shadow:0 2px 0 #2c839d,0 7px 18px rgba(63,168,196,.25);
}

.submit-button:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

.quiz-navigation{
    width:100%;
    flex-shrink:0;
}

/* ---------------- RESPONSIVE ---------------- */

@media (min-width:1400px){
    .quiz-container{
        width:min(1350px,96vw);
        height:92vh;
        padding:34px 60px;
    }

    .quiz-top{
        min-height:68px;
        grid-template-columns:90px minmax(0,1fr) 90px;
    }

    .quiz-title{
        font-size:40px;
    }

    .question-title{
        font-size:40px;
        margin-bottom:26px;
    }

    .question-content{
        gap:24px;
    }

    .digit-image{
        width: 340px;
        height: 340px;
    }

    .answer-area{
        gap:20px;
    }

    .answer-input{
        width:250px;
        height:72px;
        font-size:36px;
    }

    .submit-button{
        min-width:155px;
        height:66px;
        font-size:24px;
    }
}

@media (max-width:1024px){
    .quiz-container{
        width:96vw;
        height:92vh;
        padding:22px 30px;
    }

    .quiz-top{
        grid-template-columns:90px minmax(0,1fr) 90px;
    }

    .question-title{
        font-size:30px;
        margin-bottom:20px;
    }

    .question-content{
        gap:16px;
    }

    .answer-input{
        width:125px;
        height:58px;
        font-size:29px;
    }

    .submit-button{
        min-width:120px;
        height:54px;
        font-size:19px;
    }
}

@media (max-width:900px){
    .quiz-container{
        width:96vw;
        height:92vh;
        padding:18px 20px;
    }

    .quiz-top{
        min-height:50px;
    }

    .question-title{
        font-size:30px;
        margin-bottom:17px;
    }

    .question-content{
        gap:14px;
    }

    .answer-area{
        gap:12px;
    }

    .answer-input{
        width:112px;
        height:54px;
        font-size:27px;
    }

    .submit-button{
        min-width:108px;
        height:50px;
        font-size:18px;
    }
}

@media (max-width:768px){
    .quiz-container{
        width:96vw;
        height:94vh;
        padding:12px 15px;
    }

    .quiz-top{
        min-height:46px;
        grid-template-columns:70px minmax(0,1fr) 70px;
    }

    .icon-circle{
        width:clamp(40px,3.8vw,55px);
        height:clamp(40px,3.8vw,55px);
        min-width:clamp(40px,3.8vw,55px);
        min-height:clamp(40px,3.8vw,55px);
        font-size:clamp(16px,1.6vw,24px);
    }

    .question-title{
        font-size:30px;
        line-height:1.15;
        margin-bottom:14px;
    }

    .question-content{
        gap:12px;
    }

    .answer-area{
        gap:10px;
    }

    .answer-input{
        width:95px;
        height:48px;
        font-size:24px;
        border-width:2px;
    }

    .submit-button{
        min-width:96px;
        height:46px;
        padding:0 16px;
        font-size:16px;
    }
}

@media (max-width:480px){
    .quiz-container{
        width:100vw;
        height:96vh;
        padding:8px 10px;
    }

    .quiz-top{
        min-height:40px;
    }

    .question-title{
        font-size:22px;
        line-height:1.15;
        margin-bottom:12px;
    }

    .question-content{
        gap:10px;
    }

    .digit-image{
        border-radius:20px;
        border-width:3px;
    }

    .answer-area{
        gap:8px;
    }

    .answer-input{
        width:78px;
        height:42px;
        font-size:21px;
        border-radius:11px;
    }

    .submit-button{
        min-width:82px;
        height:40px;
        padding:0 12px;
        font-size:14px;
        border-radius:22px;
    }
}

/* ---------------- HINT POPUP ---------------- */
#hintPopup{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(31,45,61,.42);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
}

#hintPopup.show{
    display:flex;
    animation:hintFadeIn .2s ease;
}

.hint-kid-card{
    width:min(520px,92vw);
    padding:30px 32px 28px;
    border-radius:28px;
    background:#fffdf8;
    border:4px solid #ffc94d;
    box-shadow:0 12px 35px rgba(0,0,0,.22);
    text-align:center;
    animation:hintPopIn .25s ease;
}

.hint-kid-icon{
    width:72px;
    height:72px;
    margin:0 auto 14px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#ffc94d,#f7a800);
    box-shadow:0 5px 0 #c17e00,0 8px 18px rgba(193,126,0,.22);
    color:#fff;
    font-size:34px;
}

.hint-kid-card h3{
    margin:0 0 10px;
    color:#2f4f4f;
    font-size:30px;
    line-height:1.15;
    font-weight:700;
}

.hint-kid-card p{
    margin:0 auto 22px;
    max-width:430px;
    color:#4a5b66;
    font-size:21px;
    line-height:1.45;
    font-weight:400;
}

.hint-close-btn{
    min-width:120px;
    height:48px;
    padding:0 22px;
    border:0;
    border-radius:25px;
    background:linear-gradient(145deg,#67c8df,#3fa8c4);
    color:#fff;
    font-family:"livvic";
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 5px 0 #2c839d;
    transition:.18s ease;
}

.hint-close-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 0 #2c839d;
}

.hint-close-btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #2c839d;
}

@keyframes hintFadeIn{
    from{opacity:0}
    to{opacity:1}
}

@keyframes hintPopIn{
    from{opacity:0;transform:scale(.88) translateY(10px)}
    to{opacity:1;transform:scale(1) translateY(0)}
}

@media (max-width:480px){
    .hint-kid-card{
        width:94vw;
        padding:24px 18px 22px;
        border-radius:22px;
    }

    .hint-kid-icon{
        width:60px;
        height:60px;
        font-size:28px;
    }

    .hint-kid-card h3{
        font-size:24px;
    }

    .hint-kid-card p{
        font-size:17px;
        margin-bottom:18px;
    }

    .hint-close-btn{
        min-width:105px;
        height:44px;
        font-size:16px;
    }
}

</style>
</head>

<body>

<div class="quiz-container">

    <div class="quiz-top">
        <div class="quiz-home">
            <button class="icon-btn" type="button" id="homeButton" aria-label="Home">
                <span class="icon-circle home">
                    <i class="fa-solid fa-house"></i>
                </span>
            </button>
        </div>

        <div>
            <h1 class="quiz-title">
                Write face value of given digits
            </h1>
        </div>

        <div class="quiz-hint">
            <button class="icon-btn" type="button" id="hintButton" aria-label="Hint">
                <span class="icon-circle hint">
                    <i class="fa-solid fa-lightbulb"></i>
                </span>
            </button>
        </div>
    </div>

    <div class="question-section">
        <div id="questionTitle" class="question-title"></div>

        <div class="question-content">
            <div id="digitVisual" class="digit-image" aria-label="Question digit">
                <img id="digitImage" alt="Question digit">
            </div>

            <div class="answer-area">
                <input
                    id="answerInput"
                    class="answer-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="2"
                    autocomplete="off"
                    aria-label="Answer"
                >
                <button id="submitButton" class="submit-button" type="button">Submit</button>
            </div>
        </div>
    </div>

    <div class="controls quiz-navigation">
        <button id="previousButton" class="prev" type="button">
            <i class="fa-solid fa-circle-arrow-left"></i> Prev
        </button>

        <button id="nextButton" class="next" type="button">
            Next <i class="fa-solid fa-circle-arrow-right"></i>
        </button>
    </div>
</div>

<div id="answerPopup" class="kid-popup">
    <div class="kid-card">
        <div class="kid-icon" id="popupIcon"></div>
        <h3 id="popupTitle"></h3>
        <p id="popupMsg"></p>
    </div>
</div>


<div id="hintPopup" role="dialog" aria-modal="true" aria-labelledby="hintPopupTitle">
    <div class="hint-kid-card">
        <div class="hint-kid-icon">
            <i class="fa-solid fa-lightbulb"></i>
        </div>
        <h3 id="hintPopupTitle">Hint</h3>
        <p id="hintPopupMsg"></p>
        <button id="hintCloseButton" class="hint-close-btn" type="button">Got it</button>
    </div>
</div>

<div id="finalPopup">
    <div class="final-kid-box">
        <h2>🎉 Congratulations!</h2>
        <p id="finalScore"></p>
        <div id="stars"></div>
        <button class="playAgain-btn" type="button" onclick="location.reload()">Play Again</button>
    </div>
</div>

<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const quizData = [
    {
        question: "7 in 867 is",
        digit: "7",
        image: "../assets/images/think.png",
        answer: "7",
        hint: "The face value of a digit is the digit itself."
    },
    {
        question: "1 in 412 is",
        digit: "1",
        image: "../assets/images/think.png",
        answer: "1",
        hint: "The face value of a digit is the digit itself."
    },
    {
        question: "9 in 980 is",
        digit: "9",
        image: "../assets/images/think.png",
        answer: "9",
        hint: "The face value of a digit is the digit itself."
    }
];

let currentQuestionIndex = 0;
let quizScore = 0;
let answeredQuestions = Array(quizData.length).fill(false);
let storedAnswers = Array(quizData.length).fill("");

const questionTitle = document.getElementById("questionTitle");
const digitImage = document.getElementById("digitImage");
const answerInput = document.getElementById("answerInput");
const submitButton = document.getElementById("submitButton");
const nextButton = document.getElementById("nextButton");
const previousButton = document.getElementById("previousButton");
const hintButton = document.getElementById("hintButton");
const homeButton = document.getElementById("homeButton");

const hintPopup = document.getElementById("hintPopup");
const hintPopupMsg = document.getElementById("hintPopupMsg");
const hintCloseButton = document.getElementById("hintCloseButton");

function speak(text){
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "en-US";
    msg.volume = 0.25;
    msg.rate = 1;
    msg.pitch = 1;
    speechSynthesis.speak(msg);
}

function smallConfetti(){
    if (typeof confetti !== "function") return;
    confetti({
        particleCount:35,
        spread:70,
        origin:{y:0.7},
        scalar:0.8
    });
}

function showPopup(isCorrect){
    const popup = document.getElementById("answerPopup");
    const icon = document.getElementById("popupIcon");
    const title = document.getElementById("popupTitle");
    const msg = document.getElementById("popupMsg");

    popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
    popup.style.display = "flex";

    if(isCorrect){
        icon.textContent = "🎉";
        title.textContent = "Great Job!";
        msg.textContent = "You got it right!";
    }else{
        icon.textContent = "🥲";
        title.textContent = "Oops!";
        msg.textContent = "Try again, you can do it!";
    }

    setTimeout(() => {
        popup.style.display = "none";
    }, 1400);
}

function showFinal(){
    const popup = document.getElementById("finalPopup");
    document.getElementById("finalScore").textContent =
        `Your Score: ${quizScore} / ${quizData.length}`;
    document.getElementById("stars").textContent = "⭐".repeat(quizScore);
    popup.style.display = "flex";

    if(typeof confetti === "function"){
        confetti({
            particleCount:150,
            spread:100,
            origin:{y:0.5}
        });

        setTimeout(() => {
            confetti({
                particleCount:100,
                spread:70,
                origin:{y:0.6}
            });
        }, 300);
    }
}

function resetInputState(){
    answerInput.value = "";
    answerInput.disabled = false;
    answerInput.classList.remove("correct","wrong");
    submitButton.disabled = false;
}

function renderQuestion(){
    const question = quizData[currentQuestionIndex];

    questionTitle.textContent = `Q${currentQuestionIndex + 1}. ${question.question}`;
    digitImage.src = question.image;
    digitImage.alt = `Digit ${question.digit}`;

    answerInput.classList.remove("correct","wrong");

    if(answeredQuestions[currentQuestionIndex]){
        answerInput.value = storedAnswers[currentQuestionIndex];
        answerInput.classList.add("correct");
        answerInput.disabled = true;
        submitButton.disabled = true;
        nextButton.disabled = false;
    }else{
        resetInputState();
        nextButton.disabled = true;
    }

    previousButton.disabled = currentQuestionIndex === 0;
}

function checkAnswer(){
    if(answeredQuestions[currentQuestionIndex]) return;

    const guess = answerInput.value.trim();

    if(!guess){
        answerInput.focus();
        return;
    }

    if(guess === quizData[currentQuestionIndex].answer){
        quizScore++;
        answeredQuestions[currentQuestionIndex] = true;
        storedAnswers[currentQuestionIndex] = guess;

        answerInput.classList.remove("wrong");
        answerInput.classList.add("correct");
        answerInput.disabled = true;
        submitButton.disabled = true;
        nextButton.disabled = false;

        showPopup(true);
        speak("Correct");
        smallConfetti();

        if(currentQuestionIndex === quizData.length - 1){
            setTimeout(showFinal, 1600);
        }
    }else{
        answerInput.classList.remove("correct");
        answerInput.classList.add("wrong");

        showPopup(false);
        speak("Try again");

        setTimeout(() => {
            answerInput.value = "";
            answerInput.classList.remove("wrong");
            answerInput.focus();
        }, 800);
    }
}

submitButton.addEventListener("click", checkAnswer);

answerInput.addEventListener("keydown", (event) => {
    if(event.key === "Enter"){
        event.preventDefault();
        checkAnswer();
    }
});

answerInput.addEventListener("input", () => {
    answerInput.value = answerInput.value.replace(/[^0-9]/g, "").slice(0, 2);
});

nextButton.addEventListener("click", () => {
    if(currentQuestionIndex < quizData.length - 1){
        currentQuestionIndex++;
        renderQuestion();
    }
});

previousButton.addEventListener("click", () => {
    if(currentQuestionIndex > 0){
        currentQuestionIndex--;
        renderQuestion();
    }
});

function showHint(){
    const question = quizData[currentQuestionIndex];

    // Hint is displayed in a popup only.
    // No speech / text-to-speech is used here.
    hintPopupMsg.textContent = question.hint;
    hintPopup.classList.add("show");
    hintCloseButton.focus();
}

function closeHint(){
    hintPopup.classList.remove("show");
}

hintButton.addEventListener("click", showHint);
hintCloseButton.addEventListener("click", closeHint);

hintPopup.addEventListener("click", (event) => {
    if(event.target === hintPopup){
        closeHint();
    }
});

document.addEventListener("keydown", (event) => {
    if(event.key === "Escape" && hintPopup.classList.contains("show")){
        closeHint();
    }
});

homeButton.addEventListener("click", () => {
    window.top.location.href =
    "../Grade2_chapter2.html";
});

renderQuestion();
</script>

</body>
</html>
