<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Place Value Quiz</title>

<link rel="stylesheet" href="../assets/css/reuse.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

@font-face{
    font-family:"CCSYBold";
    src:url("../CCSYBOLD.TTF") format("truetype");
    font-weight:normal;
    font-style:normal;
}

@font-face{
    font-family:"livvic";
    src:url("../CCSYNTRO.TTF") format("truetype");
    font-weight:400;
    font-style:normal;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"livvic";
    font-weight:400;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background-image:url("../assets/images/bg.png");
}

/* ================= MAIN ================= */

.quiz-container{
    width:min(1180px,96vw);
    height:min(720px,94vh);
    padding:20px 42px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* ================= TOP ================= */

.quiz-top{
    width:100%;
    min-height:58px;
    display:grid;
    grid-template-columns:90px minmax(0,1fr) 90px;
    align-items:start;
    gap:10px;
    flex-shrink:0;
}

/* Home / Hint */

.quiz-home,
.quiz-hint{
    display:flex;
    align-items:flex-start;
    flex-shrink:0;
}

.quiz-home{
    justify-content:flex-start;
}

.quiz-hint{
    justify-content:flex-end;
}

.icon-btn{
    width:100%;
    height:62px;
    margin:0;
    padding:0;
    border:0;
    outline:none;
    background:transparent !important;
    display:flex;
    align-items:flex-start;
    position:relative;
    z-index:100;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    -webkit-tap-highlight-color:transparent;
}

.icon-circle{
    width:clamp(44px,4.2vw,62px);
    height:clamp(44px,4.2vw,62px);
    min-width:clamp(44px,4.2vw,62px);
    min-height:clamp(44px,4.2vw,62px);
    flex-shrink:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(19px,1.8vw,27px);
    line-height:1;
    position:relative;
    z-index:101;
    box-sizing:border-box;
    opacity:1 !important;
    visibility:visible !important;
    transition:transform .2s ease,box-shadow .2s ease;
}

.icon-circle.home{
position: fixed;
top: 10px;
left: 15px;
    background:linear-gradient(145deg,#8b6fe0,#6f42c1) !important;
    box-shadow:0 4px 0 #5a2a99,0 7px 14px rgba(111,66,193,.25) !important;
}

.icon-circle.hint{
    position: fixed;
top: 10px;
right: 15px;
    background:linear-gradient(145deg,#ffc94d,#f7a800) !important;
    box-shadow:0 4px 0 #c17e00,0 7px 14px rgba(193,126,0,.25) !important;
}

.icon-circle i{
    display:inline-block !important;
    color:#fff !important;
    opacity:1 !important;
    visibility:visible !important;
    line-height:1;
}

.icon-btn:hover .icon-circle{
    transform:translateY(-2px) scale(1.06);
}

.icon-btn:active .icon-circle{
    transform:translateY(2px) scale(.97);
}

/* ================= TITLE ================= */

.quiz-title{
    width:100%;
    max-width:100%;
    margin:0;
    text-align:center;
    font-size:30px;
    line-height:1.12;
    font-weight:400;
    color:#1f2d3d;
    transform:translateY(10px);
    margin-top:-20px;
}

/* ================= QUESTION ================= */

.question-section{
    width:100%;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.question-header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    flex-wrap:nowrap;
    margin:0;
}

.question-title, .question-number-box .target-digit, .question-number-box .plain-digit {
    color:#2f4f4f;
    font-size:30px;
    line-height:1.15;
    font-weight:500;
    text-align:left;
    margin:0;
    white-space:nowrap;
}

.question-content{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
}

/* ================= QUESTION NUMBER ================= */

.question-number-box{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:50px;
    font-size:clamp(28px,3vw,42px);
    line-height:1;
    color:#202020;
    letter-spacing:.5px;
    white-space:nowrap;
}

.question-number-box .plain-digit{
    color:#202020;
}

.question-number-box .target-digit{
    color:#e33434;
    text-decoration:underline;
    text-decoration-thickness:3px;
    text-underline-offset:5px;
    font-weight:700;
}

/* =========================================================
   QUESTION IMAGE BOX
   ========================================================= */

.question-image-box{
    width:min(420px,80vw);
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:4px auto 4px;
    border-radius:20px;
    background:#fff;
    border:3px solid #f2c27b;
    box-shadow:0 6px 15px rgba(0,0,0,.10);
    overflow:hidden;
    flex-shrink:0;
}

.question-image-box img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* ================= ANSWER ================= */

.answer-area{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    width:100%;
}

.answer-input{
    width:150px;
    height:60px;
    border:3px solid #f2a36f;
    border-radius:16px;
    background:#fffdf8;
    color:#2f4f4f;
    font-family:"livvic";
    font-size:30px;
    font-weight:700;
    text-align:center;
    outline:none;
    box-shadow:0 5px 12px rgba(0,0,0,.08);
    transition:.2s ease;
}

.answer-input:focus{
    border-color:#4aaecb;
    box-shadow:0 0 0 4px rgba(74,174,203,.16),
               0 6px 14px rgba(0,0,0,.08);
}

.answer-input.correct{
    border-color:#4caf50;
    background:#e6f8ec;
    color:#2e7d32;
}

.answer-input.wrong{
    border-color:#e03131;
    background:#fff5f5;
}

/* ================= SUBMIT ================= */

.submit-button{
    min-width:140px;
    height:56px;
    padding:0 24px;
    border:0;
    border-radius:30px;
    background:linear-gradient(145deg,#67c8df,#3fa8c4);
    color:#fff;
    font-family:"livvic";
    font-size:20px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 0 #2c839d,
               0 9px 20px rgba(63,168,196,.25);
    transition:all .18s ease;
}

.submit-button:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 8px 0 #2c839d,
               0 12px 25px rgba(63,168,196,.32);
}

.submit-button:active:not(:disabled){
    transform:translateY(4px);
    box-shadow:0 2px 0 #2c839d,
               0 7px 18px rgba(63,168,196,.25);
}

.submit-button:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

/* ================= NAVIGATION ================= */

.quiz-navigation{
    width:100%;
    flex-shrink:0;
}

.controls button{
    margin-top:50px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (min-width:1100px){

    .quiz-container{
        width:min(1300px,96vw);
        height:92vh;
        padding:28px 60px;
    }

    .quiz-top{
        min-height:68px;
        grid-template-columns:90px minmax(0,1fr) 90px;
    }

    .quiz-title{
        font-size:34px;
    }

    .question-header{
        gap:14px;
        margin-top:30px;
    }

    .question-title, .question-number-box .target-digit, .question-number-box .plain-digit {
        font-size:30px;
    }

    .question-content{
        gap:12px;
    }

    .question-image-box{
        width:min(460px,75vw);
        height:220px;
    }

    .answer-input{
        width:170px;
        height:68px;
        font-size:34px;
    }

    .submit-button{
        min-width:155px;
        height:62px;
        font-size:23px;
    }

    .controls button{
        position:relative;
        top:20px;
    }
}

/* ================= 1024 ================= */

@media (max-width:1024px){

    .quiz-container{
        width:96vw;
        height:92vh;
        padding:20px 30px;
    }

    .quiz-top{
        grid-template-columns:80px minmax(0,1fr) 80px;
        min-height:56px;
    }

    .quiz-title{
        font-size:27px;
    }

    .question-header{
        gap:12px;
    }

    .question-title, .question-number-box .target-digit, .question-number-box .plain-digit {
        font-size:30px;
    }

    .question-content{
        gap:9px;
    }

    .question-image-box{
        width:min(390px,70vw);
        height:190px;
    }

    .answer-input{
        width:125px;
        height:56px;
        font-size:28px;
    }

    .submit-button{
        min-width:120px;
        height:52px;
        font-size:19px;
    }
}

@media (min-width:1440px){
        .question-title,.question-number-box .target-digit, .question-number-box .plain-digit {
        font-size:40px;
    }
}

/* ================= 900 ================= */

@media (max-width:900px){

    .quiz-container{
        width:96vw;
        height:92vh;
        padding:16px 20px;
    }

    .quiz-top{
        min-height:50px;
        grid-template-columns:60px minmax(0,1fr) 60px;
    }

    .icon-btn{
        height:50px;
    }

    .icon-circle{
        width:44px;
        height:44px;
        min-width:44px;
        min-height:44px;
        font-size:18px;
    }

    .quiz-title{
        font-size:24px;
    }

    .question-header{
        gap:10px;
    }

    .question-title, .question-number-box .target-digit {
        font-size:30px;
    }

    .question-content{
        gap:8px;
    }

    .question-number-box{
        font-size:32px;
        min-height:42px;
    }

    .question-image-box{
        width:min(350px,75vw);
        height:170px;
    }

    .answer-area{
        gap:12px;
    }

    .answer-input{
        width:112px;
        height:52px;
        font-size:26px;
    }

    .submit-button{
        min-width:108px;
        height:48px;
        font-size:18px;
    }
}

/* ================= 768 ================= */

@media (max-width:768px){

    .quiz-container{
        width:96vw;
        height:94vh;
        padding:10px 15px;
    }

    .quiz-top{
        min-height:46px;
        grid-template-columns:55px minmax(0,1fr) 55px;
    }

    .icon-btn{
        height:46px;
    }

    .icon-circle{
        width:40px;
        height:40px;
        min-width:40px;
        min-height:40px;
        font-size:17px;
    }

    .quiz-title{
        font-size:21px;
    }

    .question-header{
        gap:8px;
    }

    .question-title{
        font-size:27px;
    }

    .question-content{
        gap:7px;
    }

    .question-number-box{
        font-size:28px;
        min-height:36px;
    }

    .question-image-box{
        width:min(320px,78vw);
        height:150px;
        border-radius:17px;
    }

    .answer-area{
        gap:10px;
    }

    .answer-input{
        width:95px;
        height:46px;
        font-size:23px;
        border-width:2px;
    }

    .submit-button{
        min-width:96px;
        height:44px;
        font-size:16px;
    }
}

/* ================= 480 ================= */

@media (max-width:480px){

    .quiz-container{
        width:100vw;
        height:96vh;
        padding:7px 10px;
    }

    .quiz-top{
        min-height:40px;
        grid-template-columns:40px minmax(0,1fr) 40px;
        gap:2px;
    }

    .icon-btn{
        height:40px;
    }

    .icon-circle{
        width:34px;
        height:34px;
        min-width:34px;
        min-height:34px;
        font-size:14px;
    }

    .quiz-title{
        font-size:16px;
        transform:translateY(7px);
    }

    .question-header{
        gap:6px;
    }

    .question-title{
        font-size:20px;
        line-height:1.1;
    }

    .question-content{
        gap:5px;
    }

    .question-number-box{
        font-size:23px;
        min-height:30px;
    }

    .question-number-box .target-digit{
        text-decoration-thickness:2px;
        text-underline-offset:3px;
    }

    .question-image-box{
        width:min(280px,82vw);
        height:125px;
        border-radius:14px;
        border-width:2px;
        margin:2px auto 3px;
    }

    .answer-area{
        gap:8px;
    }

    .answer-input{
        width:78px;
        height:40px;
        font-size:20px;
        border-radius:10px;
    }

    .submit-button{
        min-width:82px;
        height:38px;
        padding:0 11px;
        font-size:14px;
        border-radius:21px;
    }
}

/* =========================================================
   HINT POPUP
   ========================================================= */

#hintPopup{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    /* background:rgba(0,0,0,.38); */
    z-index:9999;
}

#hintPopup.show{
    display:flex;
    animation:hintFadeIn .2s ease;
}

.hint-card{
    width:min(440px,92vw);
    padding:28px 26px 24px;
    border-radius:24px;
    background:#fff;
    border:4px solid #ffd500;
    box-shadow:0 12px 35px rgba(13, 13, 13, 0.731);
    text-align:center;
    animation:hintPop .25s ease;
}

.hint-card .hint-icon{
    width:64px;
    height:64px;
    margin:0 auto 12px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#ffc94d,#f7a800);
    color:#fff;
    font-size:30px;
    box-shadow:0 5px 0 #c17e00;
}

.hint-card h3{
    margin:0 0 10px;
    color:#2f4f4f;
    font-size:28px;
}

.hint-card p{
    margin:0;
    color:#4b4b4b;
    font-size:19px;
    line-height:1.45;
}

.hint-close{
    margin-top:20px;
    min-width:120px;
    height:46px;
    padding:0 22px;
    border:0;
    border-radius:24px;
    background:linear-gradient(145deg,#67c8df,#3fa8c4);
    color:#fff;
    font-family:"livvic";
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 5px 0 #2c839d;
}

.hint-close:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #2c839d;
}

@keyframes hintFadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

@keyframes hintPop{
    from{
        transform:scale(.9);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* =========================================================
   FINAL CLICK / LAYOUT FIX
   ========================================================= */

.question-content{
    position:relative;
    z-index:5;
    flex-shrink:0;
}

.question-image-box{
    position:relative;
    z-index:6;
    pointer-events:none;
}

.answer-area{
    position:relative !important;
    z-index:50 !important;
    pointer-events:auto !important;
}

.answer-input,
.submit-button{
    position:relative !important;
    z-index:51 !important;
    pointer-events:auto !important;
}

</style>
</head>

<body>

<div class="quiz-container">

    <!-- ================= TOP ================= -->

    <div class="quiz-top">

        <div class="quiz-home">
            <button class="icon-btn" type="button" id="homeButton" aria-label="Home">
                <span class="icon-circle home">
                    <i class="fa-solid fa-house"></i>
                </span>
            </button>
        </div>

        <div class="quiz-title">
            What is the place value of the underlined digit?
        </div>

        <div class="quiz-hint">
            <button class="icon-btn" type="button" id="hintButton" aria-label="Hint">
                <span class="icon-circle hint">
                    <i class="fa-solid fa-lightbulb"></i>
                </span>
            </button>
        </div>

    </div>


    <!-- ================= QUESTION ================= -->

    <div class="question-section">

        <div class="question-header">

            <div id="questionTitle" class="question-title"></div>

            <div id="questionNumber"
                 class="question-number-box"
                 aria-label="Question number">
            </div>

        </div>


        <div class="question-content">

            <!-- IMAGE BOX BELOW QUESTION -->

            <div class="question-image-box">
                <img id="questionImage"
                     src=""
                     alt="Question image">
            </div>


            <!-- ANSWER -->

            <div class="answer-area">

                <input
                    id="answerInput"
                    class="answer-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="3"
                    autocomplete="off"
                    aria-label="Place value answer">

                <button
                    id="submitButton"
                    class="submit-button"
                    type="button">
                    Submit
                </button>

            </div>

        </div>

    </div>


    <!-- ================= NAVIGATION ================= -->

    <div class="controls quiz-navigation">

        <button id="previousButton" class="prev" type="button">
            <i class="fa-solid fa-circle-arrow-left"></i>
            Prev
        </button>

        <button id="nextButton" class="next" type="button">
            Next
            <i class="fa-solid fa-circle-arrow-right"></i>
        </button>

    </div>

</div>


<!-- ================= ANSWER POPUP ================= -->

<div id="answerPopup" class="kid-popup">

    <div class="kid-card">

        <div class="kid-icon" id="popupIcon"></div>

        <h3 id="popupTitle"></h3>

        <p id="popupMsg"></p>

    </div>

</div>


<!-- ================= HINT POPUP ================= -->

<div id="hintPopup"
     role="dialog"
     aria-modal="true"
     aria-labelledby="hintPopupTitle">

    <div class="hint-card">

        <div class="hint-icon">
            <i class="fa-solid fa-lightbulb"></i>
        </div>

        <h3 id="hintPopupTitle">
            How to Play
        </h3>

        <p>
            Look at the underlined digit. Count the beads in that place
            on the abacus to find its place value.
        </p>

        <button
            id="hintCloseButton"
            class="hint-close"
            type="button">
            Got it
        </button>

    </div>

</div>


<!-- ================= FINAL POPUP ================= -->

<div id="finalPopup">

    <div class="final-kid-box">

        <h2>🎉 Congratulations!</h2>

        <p id="finalScore"></p>

        <div id="stars"></div>

        <button
            class="playAgain-btn"
            type="button"
            onclick="location.reload()">
            Play Again
        </button>

    </div>

</div>


<!-- ================= SOUNDS ================= -->

<audio
    id="correctSound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3">
</audio>

<audio
    id="wrongSound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3">
</audio>


<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* =========================================================
   QUIZ DATA
   ========================================================= */

const quizData = [

    {
        number:"783",
        digit:"8",
        answer:"80",
        image:"../assets/images/ab1.png",
        hint:"Look at the underlined digit and use the abacus to find its place value."
    },

    {
        number:"529",
        digit:"5",
        answer:"500",
        image:"../assets/images/ab2.png",
        hint:"Look at the underlined digit and use the abacus to find its place value."
    },

    {
        number:"162",
        digit:"2",
        answer:"2",
        image:"../assets/images/ab3.png",
        hint:"Look at the underlined digit and use the abacus to find its place value."
    }

];
function speak(text) {

    if (
        !window.speechSynthesis
    ) {
        return;
    }


    speechSynthesis.cancel();


    const message =
        new SpeechSynthesisUtterance(
            text
        );


    message.lang =
        "en-UK";


    message.volume =
        0.25;


    message.rate =
        1;


    message.pitch =
        1;


    speechSynthesis.speak(
        message
    );

}

/* =========================================================
   VARIABLES
   ========================================================= */

let currentQuestionIndex = 0;

let quizScore = 0;

const answeredQuestions =
    Array(quizData.length).fill(false);

const storedAnswers =
    Array(quizData.length).fill("");


/* =========================================================
   ELEMENTS
   ========================================================= */

const questionTitle =
    document.getElementById("questionTitle");

const questionNumber =
    document.getElementById("questionNumber");

const questionImage =
    document.getElementById("questionImage");

const answerInput =
    document.getElementById("answerInput");

const submitButton =
    document.getElementById("submitButton");

const nextButton =
    document.getElementById("nextButton");

const previousButton =
    document.getElementById("previousButton");

const hintButton =
    document.getElementById("hintButton");

const homeButton =
    document.getElementById("homeButton");


/* =========================================================
   CONFETTI
   ========================================================= */

function smallConfetti(){

    if(typeof confetti !== "function"){
        return;
    }

    confetti({
        particleCount:35,
        spread:70,
        origin:{y:.7},
        scalar:.8
    });

}


/* =========================================================
   ANSWER POPUP
   ========================================================= */

function showPopup(isCorrect){

    const popup =
        document.getElementById("answerPopup");

    const icon =
        document.getElementById("popupIcon");

    const title =
        document.getElementById("popupTitle");

    const msg =
        document.getElementById("popupMsg");


    popup.className =
        "kid-popup " +
        (isCorrect ? "kid-correct" : "kid-wrong");

    popup.style.display = "flex";


    if(isCorrect){

        icon.textContent = "🎉";

        title.textContent = "Great Job!";

        msg.textContent = "You got it right!";

    }else{

        icon.textContent = "🥲";

        title.textContent = "Oops!";

        msg.textContent =
            "Try again, you can do it!";

    }


    setTimeout(() => {

        popup.style.display = "none";

    },1400);

}


/* =========================================================
   FINAL POPUP
   ========================================================= */

function showFinal(){

    const popup =
        document.getElementById("finalPopup");


    document.getElementById("finalScore").textContent =
        `Your Score: ${quizScore} / ${quizData.length}`;


    document.getElementById("stars").textContent =
        "⭐".repeat(quizScore);


    popup.style.display = "flex";


    if(typeof confetti === "function"){

        confetti({

            particleCount:150,

            spread:100,

            origin:{y:.5}

        });


        setTimeout(() => {

            confetti({

                particleCount:100,

                spread:70,

                origin:{y:.6}

            });

        },300);

    }

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

    const question =
        quizData[currentQuestionIndex];


    /* Question number */

    questionTitle.textContent =
        `Q${currentQuestionIndex + 1}.`;


    /* Number with underlined digit */

    questionNumber.innerHTML = "";


    [...question.number].forEach(ch => {

        const span =
            document.createElement("span");


        span.className =
            ch === question.digit
                ? "target-digit"
                : "plain-digit";


        span.textContent = ch;


        questionNumber.appendChild(span);

    });


    /* =====================================================
       QUESTION IMAGE
       ===================================================== */

    questionImage.src =
        question.image;

    questionImage.alt =
        `Question ${currentQuestionIndex + 1} image`;


    /* Answer state */

    answerInput.classList.remove(
        "correct",
        "wrong"
    );


    if(answeredQuestions[currentQuestionIndex]){

        answerInput.value =
            storedAnswers[currentQuestionIndex];

        answerInput.classList.add("correct");

        answerInput.disabled = true;

        submitButton.disabled = true;

        nextButton.disabled = false;

    }else{

        answerInput.value = "";

        answerInput.disabled = false;

        submitButton.disabled = false;

        nextButton.disabled = true;

    }


    previousButton.disabled =
        currentQuestionIndex === 0;

}


/* =========================================================
   CHECK ANSWER
   ========================================================= */

function checkAnswer(){

    if(answeredQuestions[currentQuestionIndex]){
        return;
    }


    const guess =
        answerInput.value.trim();


    if(!guess){

        answerInput.focus();

        return;

    }


    if(
        guess ===
        quizData[currentQuestionIndex].answer
    ){

        quizScore++;

        answeredQuestions[currentQuestionIndex] =
            true;

        storedAnswers[currentQuestionIndex] =
            guess;


        answerInput.classList.remove("wrong");

        answerInput.classList.add("correct");

        answerInput.disabled = true;

        submitButton.disabled = true;

        nextButton.disabled = false;

        speak("correct");
        showPopup(true);

        smallConfetti();


        /* Final question */

        if(
            currentQuestionIndex ===
            quizData.length - 1
        ){

            setTimeout(
                showFinal,
                1600
            );

        }

    }else{

        answerInput.classList.remove("correct");

        answerInput.classList.add("wrong");

         speak("Try again");
        showPopup(false);


        setTimeout(() => {

            answerInput.value = "";

            answerInput.classList.remove("wrong");

            answerInput.focus();

        },800);

    }

}


/* =========================================================
   SUBMIT CLICK
   ========================================================= */

submitButton.addEventListener(
    "click",
    checkAnswer
);


/* =========================================================
   ENTER KEY
   ========================================================= */

answerInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            checkAnswer();

        }

    }
);


/* =========================================================
   ONLY NUMBERS
   ========================================================= */

answerInput.addEventListener(
    "input",
    () => {

        answerInput.value =
            answerInput.value
                .replace(/[^0-9]/g,"")
                .slice(0,3);

    }
);


/* =========================================================
   NEXT BUTTON
   ========================================================= */

nextButton.addEventListener(
    "click",
    () => {

        if(
            currentQuestionIndex <
            quizData.length - 1
        ){

            currentQuestionIndex++;

            renderQuestion();

        }

    }
);


/* =========================================================
   PREVIOUS BUTTON
   ========================================================= */

previousButton.addEventListener(
    "click",
    () => {

        if(currentQuestionIndex > 0){

            currentQuestionIndex--;

            renderQuestion();

        }

    }
);


/* =========================================================
   HINT POPUP
   ========================================================= */

const hintPopup =
    document.getElementById("hintPopup");

const hintCloseButton =
    document.getElementById("hintCloseButton");


function openHint(){

    hintPopup.classList.add("show");

    hintCloseButton.focus();

}


function closeHint(){

    hintPopup.classList.remove("show");

    hintButton.focus();

}


hintButton.addEventListener(
    "click",
    openHint
);


hintCloseButton.addEventListener(
    "click",
    closeHint
);


hintPopup.addEventListener(
    "click",
    event => {

        if(event.target === hintPopup){

            closeHint();

        }

    }
);


/* =========================================================
   ESCAPE CLOSE HINT
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape" &&
            hintPopup.classList.contains("show")
        ){

            closeHint();

        }

    }
);


/* =========================================================
   HOME
   ========================================================= */

homeButton.addEventListener(
    "click",
    () => {

        window.top.location.href =
            "../Grade2_chapter2.html";

    }
);


/* =========================================================
   INITIAL LOAD
   ========================================================= */

renderQuestion();

</script>

</body>
</html>
