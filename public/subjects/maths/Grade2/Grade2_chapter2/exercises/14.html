<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Place Value Quiz</title>

<link rel="stylesheet" href="../assets/css/reuse.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* =======================================================
   BASE STYLES
   ======================================================= */

@font-face{
    font-family:"CCSYBold";
    src:url("../CCSYBOLD.TTF") format("truetype");
    font-weight:normal;
    font-style:normal;
}

@font-face{
    font-family:"livvic";
    src:url("../CCSYNTRO.TTF") format("truetype");
    font-weight:400;
    font-style:normal;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"livvic";
    font-weight:400;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background-image:url("../assets/images/bg.png");
    background-size:cover;
    background-position:center;
}

/* =======================================================
   MAIN CONTAINER
   ======================================================= */

.quiz-container{
    width:min(1550px,98vw);
    height:min(780px,96vh);
    padding:20px 50px 12px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* =======================================================
   TOP BAR
   ======================================================= */

.quiz-top{
    width:100%;
    min-height:58px;
    display:grid;
    grid-template-columns:90px minmax(0,1fr) 90px;
    align-items:start;
    gap:10px;
    flex-shrink:0;
}

.quiz-home,
.quiz-hint{
    display:flex;
    align-items:flex-start;
    flex-shrink:0;
}

.quiz-home{
    justify-content:flex-start;
}

.quiz-hint{
    justify-content:flex-end;
}

.icon-btn{
    width:100%;
    height:62px;
    margin:0;
    padding:0;
    border:0;
    outline:none;
    background:transparent !important;
    display:flex;
    align-items:flex-start;
    position:relative;
    z-index:100;
    cursor:pointer;
    pointer-events:auto;
    appearance:none;
    -webkit-appearance:none;
    -webkit-tap-highlight-color:transparent;
}

.icon-circle{
    width:clamp(44px,4.2vw,62px);
    height:clamp(44px,4.2vw,62px);
    min-width:clamp(44px,4.2vw,62px);
    min-height:clamp(44px,4.2vw,62px);
    flex-shrink:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(19px,1.8vw,27px);
    line-height:1;
    position:relative;
    z-index:101;
    box-sizing:border-box;
    opacity:1 !important;
    visibility:visible !important;
    pointer-events:auto;
    transition:transform .2s ease,box-shadow .2s ease;
}

.icon-circle.home{
    background:linear-gradient(145deg,#8b6fe0,#6f42c1) !important;
    box-shadow:
        0 4px 0 #5a2a99,
        0 7px 14px rgba(111,66,193,.25) !important;
}

.icon-circle.hint{
    background:linear-gradient(145deg,#ffc94d,#f7a800) !important;
    box-shadow:
        0 4px 0 #c17e00,
        0 7px 14px rgba(193,126,0,.25) !important;
}

.icon-circle i{
    display:inline-block !important;
    color:#fff !important;
    opacity:1 !important;
    visibility:visible !important;
    line-height:1;
}

.icon-btn:hover .icon-circle{
    transform:translateY(-2px) scale(1.06);
}

.icon-btn:active .icon-circle{
    transform:translateY(2px) scale(.97);
}

/* =======================================================
   TITLE
   ======================================================= */

.quiz-title{
    width:100%;
    max-width:100%;
    margin:0;
    text-align:center;
    font-size:30px;
    line-height:1.12;
    font-weight:400;
    color:#1f2d3d;
    transform:translateY(-4px);
}

/* =======================================================
   QUESTION AREA
   ======================================================= */

.question-section{
    width:100%;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding-top:2px;
}

/*
   Q1. stays glued to the left edge of the question text.
   justify-content:flex-start (instead of center) keeps
   "Q1." beside "Write..." on the first line, and because
   question-title has flex:0 0 auto + question-text wraps
   inside the remaining space, any second line still starts
   under the question text (not re-centered under Q1).
*/

.question-header{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    flex-direction:row;
    align-items:flex-start;
    justify-content:flex-start;
    gap:10px 12px;
    margin:0;
    flex-shrink:0;
    min-width:0;
    line-height:1.1;
}

.question-title{
    flex:0 0 auto;
    color:#2f4f4f;
    font-size:30px;
    line-height:1.1;
    font-weight:500;
    text-align:left;
    margin:0;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
}

.question-text{
    flex:1 1 560px;
    width:auto;
    max-width:1200px;
    min-width:0;
    padding:0;
    border-radius:0;
    text-align:left;
    color:#252525;
    font-size:30px;
    line-height:1.25;
    white-space:normal;
    overflow:visible;
    text-overflow:clip;
    overflow-wrap:break-word;
    display:inline-flex;
    align-items:center;
}

.question-content{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:24px;
    min-height:0;
}

/* =======================================================
   ANSWER AREA
   ======================================================= */

.answer-area{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    flex-shrink:0;
    margin-top:-4px;
    margin-bottom:0;
    transform:none;
}

.answer-input{
    width:150px;
    height:60px;
    border:3px solid #f2a36f;
    border-radius:18px;
    background:linear-gradient(180deg,#fffefb,#fff5eb);
    color:#2f4f4f;
    font-family:"livvic";
    font-size:30px;
    font-weight:700;
    text-align:center;
    outline:none;
    box-shadow:
        0 8px 16px rgba(244,132,65,.12),
        inset 0 0 0 1px rgba(255,255,255,.8);
    transition:all .2s ease;
}

.answer-input:focus{
    border-color:#4aaecb;
    box-shadow:
        0 0 0 4px rgba(74,174,203,.16),
        0 6px 14px rgba(0,0,0,.08);
}

.answer-input.correct{
    border-color:#4caf50;
    background:#e6f8ec;
    color:#2e7d32;
}

.answer-input.wrong{
    border-color:#e03131;
    background:#fff5f5;
}

.submit-button{
    min-width:140px;
    height:56px;
    padding:0 24px;
    border:0;
    border-radius:30px;
    background:linear-gradient(145deg,#b9dff0,#8ec9df);
    color:#fff;
    font-family:"livvic";
    font-size:20px;
    font-weight:700;
    cursor:pointer;
    box-shadow:
        0 8px 0 #63a9c1,
        0 12px 22px rgba(99,169,193,.28);
    transition:all .18s ease;
    letter-spacing:.3px;
}

.submit-button:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:
        0 8px 0 #63a9c1,
        0 12px 25px rgba(99,169,193,.32);
}

.submit-button:active:not(:disabled){
    transform:translateY(4px);
    box-shadow:
        0 2px 0 #63a9c1,
        0 7px 18px rgba(99,169,193,.25);
}

.submit-button:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

.hint-overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.25);
    z-index:3000;
    padding:20px;
}

.hint-overlay.show{
    display:flex;
}

.hint-box{
    width:min(420px,calc(100vw - 32px));
    background:#fff;
    border-radius:24px;
    padding:26px 28px;
    text-align:center;
    box-shadow:0 12px 35px rgba(0,0,0,.18);
    animation:hintPop .35s ease;
}

@keyframes hintPop{
    from{
        opacity:0;
        transform:scale(.9);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.hint-box h3{
    margin:0 0 10px;
    font-size:clamp(24px,3vw,32px);
    font-weight:700;
    color:#e08e00;
}

.hint-box p{
    margin:0;
    font-size:clamp(16px,1.6vw,21px);
    line-height:1.45;
    color:#1f2d3d;
}

.hint-close{
    margin-top:18px;
    min-width:110px;
    height:44px;
    border:0;
    border-radius:24px;
    background:linear-gradient(145deg,#ffc94d,#f7a800);
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 0 #c17e00;
}

.hint-close:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #c17e00;
}

.question-image-wrap{
    width:100%;
    height:280px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    min-height:0;
    overflow:hidden;
    margin-top:-4px;
}

.question-image{
    display:block;
    width:auto;
    height:100%;
    max-width:85%;
    object-fit:contain;
}

/* =======================================================
   NAVIGATION
   (kept here so Prev/Next always have breathing room and
   never sit directly under the answer/submit row)
   ======================================================= */

.quiz-navigation{
    width:100%;
    flex-shrink:0;
    margin-top:14px;
}

.controls{
    margin-top:0;
}

.controls button{
    margin-top:0;
}

.prev,
.next{
    margin-bottom:0;
}

/* =======================================================
   MEDIA QUERIES
   ORDERED SMALLEST -> LARGEST
   ======================================================= */

@media (max-width:480px){

    .quiz-container{
        width:100vw;
        height:98vh;
        padding:7px 10px;
    }

    .quiz-top{
        min-height:40px;
        grid-template-columns:40px minmax(0,1fr) 40px;
        gap:2px;
    }

    .icon-btn{
        height:40px;
    }

    .icon-circle{
        width:34px;
        height:34px;
        min-width:34px;
        min-height:34px;
        font-size:14px;
    }

    .quiz-title{
        font-size:16px;
        transform:translateY(7px);
    }

    .question-section{
        gap:8px;
        padding-top:0;
    }

    .question-header{
        gap:6px;
    }

    .question-title{
        font-size:20px;
        line-height:1.1;
    }

    .question-text{
        font-size:19px;
        line-height:1.2;
        padding:7px 8px;
        border-radius:10px;
        white-space:normal;
    }

    .question-content{
        gap:14px;
    }

    .question-image-wrap{
        height:150px;
    }

    .answer-area{
        gap:8px;
    }

    .answer-input{
        width:88px;
        height:40px;
        font-size:20px;
        border-radius:10px;
        border-width:2px;
    }

    .submit-button{
        min-width:88px;
        height:38px;
        padding:0 11px;
        font-size:14px;
        border-radius:21px;
    }

    .quiz-navigation{
        margin-top:8px;
    }
}

@media (max-width:768px){

    .quiz-container{
        width:98vw;
        height:97vh;
        padding:10px 15px;
    }

    .quiz-top{
        min-height:46px;
        grid-template-columns:55px minmax(0,1fr) 55px;
    }

    .icon-btn{
        height:46px;
    }

    .icon-circle{
        width:40px;
        height:40px;
        min-width:40px;
        min-height:40px;
        font-size:17px;
    }

    .quiz-title{
        font-size:21px;
    }

    .question-section{
        gap:10px;
    }

    .question-header{
        gap:8px;
    }

    .question-title{
        font-size:27px;
    }

    .question-text{
        font-size:24px;
        padding:9px 12px;
        border-radius:14px;
        white-space:normal;
    }

    .question-content{
        gap:16px;
    }

    .question-image-wrap{
        height:190px;
    }

    .answer-area{
        gap:10px;
    }

    .answer-input{
        width:105px;
        height:46px;
        font-size:23px;
        border-width:2px;
    }

    .submit-button{
        min-width:105px;
        height:44px;
        padding:0 16px;
        font-size:16px;
    }

    .quiz-navigation{
        margin-top:10px;
    }
}

@media (max-width:900px){

    .quiz-container{
        width:98vw;
        height:96vh;
        padding:16px 20px;
    }

    .quiz-top{
        min-height:50px;
        grid-template-columns:60px minmax(0,1fr) 60px;
    }

    .icon-btn{
        height:50px;
    }

    .icon-circle{
        width:44px;
        height:44px;
        min-width:44px;
        min-height:44px;
        font-size:18px;
    }

    .quiz-title{
        font-size:24px;
    }

    .question-section{
        gap:12px;
    }

    .question-header{
        gap:10px;
    }

    .question-title{
        font-size:32px;
    }

    .question-text{
        font-size:27px;
        padding:10px 16px;
    }

    .question-content{
        gap:18px;
    }

    .question-image-wrap{
        height:210px;
    }

    .answer-area{
        gap:12px;
    }

    .answer-input{
        width:112px;
        height:52px;
        font-size:26px;
    }

    .submit-button{
        min-width:108px;
        height:48px;
        font-size:18px;
    }

    .quiz-navigation{
        margin-top:12px;
    }
}

@media (max-width:1024px){

    /*
       "Laptop" range — this is where answer/submit was
       overlapping Prev/Next. Fix: shrink the fixed-height
       image, tighten gaps, and give the nav row explicit
       clearance so it never sits under the answer row.
    */

    .quiz-container{
        width:98vw;
        height:95vh;
        padding:18px 30px 10px;
    }

    .quiz-top{
        grid-template-columns:80px minmax(0,1fr) 80px;
        min-height:56px;
    }

    .quiz-title{
        font-size:27px;
    }

    .question-section{
        gap:8px;
    }

    .question-header{
        gap:8px 10px;
    }

    .question-title{
        font-size:30px;
    }

    .question-text{
        font-size:30px;
        padding:0;
        white-space:normal;
        flex-basis:420px;
    }

    .question-content{
        gap:14px;
    }

    .question-image-wrap{
        height:190px;
        margin-top:0;
    }

    .answer-area{
        margin-top:4px;
        margin-bottom:0;
    }

    .answer-input{
        width:125px;
        height:56px;
        font-size:28px;
    }

    .submit-button{
        min-width:120px;
        height:52px;
        font-size:19px;
    }

    .quiz-navigation{
        margin-top:16px;
    }
}

@media (min-width:1440px){
      .question-header,
    .question-image-wrap,
    .question-content{
        max-width:1300px;
    }

    .quiz-container{
        width:min(1820px,98vw);
        height:94vh;
        padding:28px 60px 16px;
    }

    .quiz-top{
        width:100%;
        min-height:72px;
        grid-template-columns:104px minmax(0,1fr) 104px;
        align-items:start;
    }

    .quiz-home{
        justify-content:flex-start;
    }

    .quiz-hint{
        justify-content:flex-end;
    }

    .quiz-title{
        font-size:40px;
    }

    .question-section{
        gap:10px;
    }

    .question-header{
        gap:10px 12px;
    }

    .question-title{
        font-size:40px !important;
    }

    .question-text{
        font-size:40px;
        padding:0;
        white-space:normal;
        flex-basis:640px;
        
    }

    .question-content{
        gap:22px;
    }

    /* image intentionally larger only on desktop */
    .question-image-wrap{
        height:420px;
        margin-top:-6px;
    }

    .answer-area{
        margin-top:-4px;
        margin-bottom:0;
    }

    .answer-input{
        width:178px;
        height:72px;
        font-size:36px;
    }

    .submit-button{
        min-width:162px;
        height:64px;
        font-size:24px;
    }

    .quiz-navigation{
        margin-top:18px;
    }
}

</style>
</head>

<body>

<div class="quiz-container">

    <div class="quiz-top">

        <div class="quiz-home">
            <button
                class="icon-btn"
                type="button"
                id="homeButton"
                aria-label="Home">

                <span class="icon-circle home">
                    <i class="fa-solid fa-house"></i>
                </span>

            </button>
        </div>

        <div class="quiz-title">
            Place Value Detective
        </div>

        <div class="quiz-hint">
            <button
                class="icon-btn"
                type="button"
                id="hintButton"
                aria-label="Hint">

                <span class="icon-circle hint">
                    <i class="fa-solid fa-lightbulb"></i>
                </span>

            </button>
        </div>

    </div>


    <div class="question-section">
<div class="question-header">

    <div id="questionTitle" class="question-title"></div>

    <div id="questionText" class="question-text"></div>

</div>

<div class="question-image-wrap">
    <img
        id="questionImage"
        class="question-image"
        src="../assets/images/place-value-house-731.png"
        alt="Place value house">
</div>


        <div class="question-content">

            <div class="answer-area">

                <input
                    id="answerInput"
                    class="answer-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="3"
                    autocomplete="off"
                    aria-label="Answer">

                <button
                    id="submitButton"
                    class="submit-button"
                    type="button">
                    Submit
                </button>

            </div>

        </div>

    </div>


    <div class="controls quiz-navigation">

        <button
            id="previousButton"
            class="prev"
            type="button">

            <i class="fa-solid fa-circle-arrow-left"></i>
            Prev

        </button>

        <button
            id="nextButton"
            class="next"
            type="button">

            Next
            <i class="fa-solid fa-circle-arrow-right"></i>

        </button>

    </div>

</div>

<div id="hintOverlay" class="hint-overlay" aria-hidden="true">
    <div class="hint-box">
        <h3>Hint</h3>
        <p id="hintText"></p>
        <button id="closeHintBtn" class="hint-close" type="button">Got it!</button>
    </div>
</div>

<!-- Reused popup structure -->

<div id="answerPopup" class="kid-popup">

    <div class="kid-card">

        <div
            class="kid-icon"
            id="popupIcon">
        </div>

        <h3 id="popupTitle"></h3>

        <p id="popupMsg"></p>

    </div>

</div>


<div id="finalPopup">

    <div class="final-kid-box">

        <h2>🎉 Congratulations!</h2>

        <p id="finalScore"></p>

        <div id="stars"></div>

        <button
            class="playAgain-btn"
            type="button"
            onclick="location.reload()">

            Play Again

        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


<script>

const quizData = [
    {
        answer:"638",
        image:"../assets/images/638.png",
        hint:"Look at each digit carefully. The 6 is worth hundreds, the 3 is worth tens, and the 8 is worth ones. Put their values together to find the number."
    },

    {
        answer:"914",
        image:"../assets/images/914.png",
        hint:"Look at the place of each digit. The 9 represents hundreds, the 1 represents tens, and the 4 represents ones. Use their place values to find the number."
    }
];


let currentQuestionIndex = 0;

let quizScore = 0;


const answeredQuestions =
    Array(quizData.length).fill(false);

const storedAnswers =
    Array(quizData.length).fill("");


const questionTitle =
    document.getElementById("questionTitle");
    const questionImage =
    document.getElementById("questionImage");

const questionText =
    document.getElementById("questionText");

const answerInput =
    document.getElementById("answerInput");

const submitButton =
    document.getElementById("submitButton");

const nextButton =
    document.getElementById("nextButton");

const previousButton =
    document.getElementById("previousButton");

const hintButton =
    document.getElementById("hintButton");

const homeButton =
    document.getElementById("homeButton");


function speak(text){

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    const msg =
        new SpeechSynthesisUtterance(text);

    msg.lang = "en-UK";
    msg.volume = .25;
    msg.rate = 1;
    msg.pitch = 1;

    speechSynthesis.speak(msg);
}


function smallConfetti(){

    if(typeof confetti !== "function"){
        return;
    }

    confetti({
        particleCount:35,
        spread:70,
        origin:{y:.7},
        scalar:.8
    });

}


function showHintPopup(){
    const hintOverlay = document.getElementById("hintOverlay");
    const hintText = document.getElementById("hintText");
    const message = quizData[currentQuestionIndex].hint;

    hintText.textContent = message;
    hintOverlay.classList.add("show");
    hintOverlay.setAttribute("aria-hidden", "false");

    // speak(message);
}

function closeHintPopup(){
    const hintOverlay = document.getElementById("hintOverlay");
    if(hintOverlay){
        hintOverlay.classList.remove("show");
        hintOverlay.setAttribute("aria-hidden", "true");
    }
}

function showPopup(isCorrect){

    const popup =
        document.getElementById("answerPopup");

    const icon =
        document.getElementById("popupIcon");

    const title =
        document.getElementById("popupTitle");

    const msg =
        document.getElementById("popupMsg");


    popup.className =
        "kid-popup " +
        (isCorrect ? "kid-correct" : "kid-wrong");

    popup.style.display = "flex";


    if(isCorrect){

        icon.textContent = "🎉";

        title.textContent = "Great Job!";

        msg.textContent =
            "You got it right!";

    }else{

        icon.textContent = "🥲";

        title.textContent = "Oops!";

        msg.textContent =
            "Try again, you can do it!";

    }


    setTimeout(() => {

        popup.style.display = "none";

    },1400);

}


function showFinal(){

    const popup =
        document.getElementById("finalPopup");


    document.getElementById("finalScore").textContent =
        `Your Score: ${quizScore} / ${quizData.length}`;


    document.getElementById("stars").textContent =
        "⭐".repeat(quizScore);


    popup.style.display = "flex";


    if(typeof confetti === "function"){

        confetti({
            particleCount:150,
            spread:100,
            origin:{y:.5}
        });


        setTimeout(() => {

            confetti({
                particleCount:100,
                spread:70,
                origin:{y:.6}
            });

        },300);

    }

}


function renderQuestion(){

    const question =
        quizData[currentQuestionIndex];
        questionImage.src = question.image;


    questionTitle.textContent =
        `Q${currentQuestionIndex + 1}.`;


    if(currentQuestionIndex === 0){

        questionText.textContent =
            "Write the number formed. 6 is in hundreds place, 3 is in tens place and 8 is in ones place.";

    }else{

        questionText.textContent =
            "Write the number formed. 9 is in hundreds place, 1 is in tens place and 4 is in ones place.";

    }


    answerInput.classList.remove(
        "correct",
        "wrong"
    );


    if(answeredQuestions[currentQuestionIndex]){

        answerInput.value =
            storedAnswers[currentQuestionIndex];

        answerInput.classList.add("correct");

        answerInput.disabled = true;

        submitButton.disabled = true;

        nextButton.disabled = false;

    }else{

        answerInput.value = "";

        answerInput.disabled = false;

        submitButton.disabled = false;

        nextButton.disabled = true;

    }


    previousButton.disabled =
        currentQuestionIndex === 0;

}


function checkAnswer(){

    if(answeredQuestions[currentQuestionIndex]){
        return;
    }


    const guess =
        answerInput.value.trim();


    if(!guess){

        answerInput.focus();

        return;

    }


    if(
        guess ===
        quizData[currentQuestionIndex].answer
    ){

        quizScore++;


        answeredQuestions[currentQuestionIndex] =
            true;


        storedAnswers[currentQuestionIndex] =
            guess;


        answerInput.classList.remove("wrong");

        answerInput.classList.add("correct");

        answerInput.disabled = true;

        submitButton.disabled = true;

        nextButton.disabled = false;


        showPopup(true);

        speak("Correct");

        smallConfetti();


        if(
            currentQuestionIndex ===
            quizData.length - 1
        ){

            setTimeout(
                showFinal,
                1600
            );

        }

    }else{

        answerInput.classList.remove("correct");

        answerInput.classList.add("wrong");


        showPopup(false);

        speak("Try again");


        setTimeout(() => {

            answerInput.value = "";

            answerInput.classList.remove("wrong");

            answerInput.focus();

        },800);

    }

}


submitButton.addEventListener(
    "click",
    checkAnswer
);


answerInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            checkAnswer();

        }

    }
);


answerInput.addEventListener(
    "input",
    () => {

        answerInput.value =
            answerInput.value
                .replace(/[^0-9]/g,"")
                .slice(0,3);

    }
);


nextButton.addEventListener(
    "click",
    () => {

        if(
            currentQuestionIndex <
            quizData.length - 1
        ){

            currentQuestionIndex++;

            renderQuestion();

        }

    }
);


previousButton.addEventListener(
    "click",
    () => {

        if(currentQuestionIndex > 0){

            currentQuestionIndex--;

            renderQuestion();

        }

    }
);


hintButton.addEventListener(
    "click",
    showHintPopup
);

hintButton.addEventListener(
    "pointerdown",
    showHintPopup
);

const closeHintBtn = document.getElementById("closeHintBtn");
if(closeHintBtn){
    closeHintBtn.addEventListener("click", closeHintPopup);
}

const hintOverlay = document.getElementById("hintOverlay");
if(hintOverlay){
    hintOverlay.addEventListener("click", event => {
        if(event.target === hintOverlay){
            closeHintPopup();
        }
    });
}

homeButton.addEventListener(
    "click",
    () => {
        window.top.location.href =
    "../Grade2_chapter2.html";

    }
);


renderQuestion();

</script>

</body>
</html>
