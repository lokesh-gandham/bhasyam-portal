<style>

.question-label{flex:0 0 auto;margin:0;font-size:30px;line-height:1;font-weight:400;color:#2f4f4f;transform:translateY(-4px)}
.apple-stage{position:relative;width:clamp(135px,17vw,245px);height:clamp(135px,17vw,245px);display:flex;align-items:center;justify-content:center;flex:0 1 auto;z-index:10;touch-action:none;cursor:grab}
.apple-stage.dragging{cursor:grabbing;z-index:100}
.apple-stage img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.apple-number{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);width:48%;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,4vw,54px);line-height:1;font-weight:700;color:#1f2d3d;pointer-events:none}
.apple-stage.dragging{filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}.apple-stage.selected{transform:scale(1.05);filter:drop-shadow(0 6px 10px rgba(0,0,0,.16))}
.baskets-area{width:min(1050px,96vw);max-width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end;justify-items:center;gap:clamp(30px,12vw,150px);flex:0 1 auto}
.basket{position:relative;width:clamp(180px,22vw,310px);height:clamp(145px,18vw,245px);border:0;padding:0;background:transparent;display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .2s ease,filter .2s ease}
.basket img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.basket-label{position:absolute;left:50%;top:61%;transform:translate(-50%,-50%);font-size:clamp(22px,3vw,42px);line-height:1;font-weight:800;letter-spacing:.5px;color:#000;text-shadow:0 2px 0 rgba(0,0,0,.22);pointer-events:none}
.basket.hover-target{transform:translateY(-5px) scale(1.04);filter:drop-shadow(0 7px 10px rgba(0,0,0,.15))}
.basket.correct-target{filter:drop-shadow(0 0 12px rgba(67,185,75,.8))}
.basket.wrong-target{animation:basketShake .35s ease}
@keyframes basketShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.basket.apple-landed{transform:scale(1.03)}

.hint-close:hover{transform:translateY(-2px)}
.hint-close:active{transform:translateY(3px)}
@keyframes hintPopupIn{

}

<body>
<div class="even-odd-quiz">
<div class="quiz-top">
<button type="button" id="homeBtn" class="quiz-icon-btn home-btn" aria-label="Home"><span class="quiz-icon-circle home-icon"><i class="fa-solid fa-house"></i></span></button>
<div><h1 class="quiz-title">Sort the numbers into the even and odd baskets.</h1></div>
<button type="button" id="hintBtn" class="quiz-icon-btn hint-btn" aria-label="Hint"><span class="quiz-icon-circle hint-icon"><i class="fa-solid fa-lightbulb"></i></span></button>
</div>
<main class="question-area">
<div class="question-row">
<p class="question-label" id="questionLabel">Q1.</p>
<div class="apple-stage" id="apple" role="button" tabindex="0" aria-label="Drag the apple to the correct basket">
<img src="../assets/images/apple.png" alt="Apple">
<span class="apple-number" id="appleNumber"></span>
</div>
</div>
<p class="instruction">Drag the apple to the correct basket.</p>
<div class="baskets-area">
<button type="button" class="basket" id="evenBasket" aria-label="Even basket">
<img src="../assets/images/basket.png" alt="Even basket">
<span class="basket-label">EVEN</span>
</button>
<button type="button" class="basket" id="oddBasket" aria-label="Odd basket">
<img src="../assets/images/basket.png" alt="Odd basket">
<span class="basket-label">ODD</span>
</button>
</div>
</main>
<div class="controls">
<button id="prevBtn" class="prev" disabled> <i class="fa-solid fa-circle-arrow-left"></i>Prev</button>
<button id="nextBtn" class="next" disabled>Next <i class="fa-solid fa-circle-arrow-right"></i></button>
</div>
</div>
<div class="hint-overlay" id="hintOverlay">
<div class="hint-box">
<h3>Hint</h3>
<p id="hintText"></p>
<button class="hint-close" id="closeHintBtn">Got it!</button>
</div>
</div>
<div id="answerPopup" class="kid-popup">
<div class="kid-card">
<div class="kid-icon" id="popupIcon"></div>
<h3 id="popupTitle"></h3>
<p id="popupMsg"></p>
</div>
</div>
<div id="finalPopup">
<div class="final-kid-box">
<h2>🎉 <span>Congratulations!</span></h2>
<p id="finalScore"></p>
<div id="stars">⭐⭐⭐</div>
<button class="playAgain-btn" onclick="location.reload()">Play Again</button>
</div>
</div>
<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
<script>
const QUESTIONS=[
{label:"Q1.",number:576,answer:"E",hint:"576 ends in 6, so it is even."},
{label:"Q2.",number:801,answer:"O",hint:"801 ends in 1, so it is odd."},
{label:"Q3.",number:922,answer:"E",hint:"922 ends in 2, so it is even."},
{label:"Q4.",number:600,answer:"E",hint:"600 ends in 0, so it is even."},
{label:"Q5.",number:453,answer:"O",hint:"453 ends in 3, so it is odd."}
];
const APPLE_SRC="../assets/images/apple.png";
let current=0;
let score=0;
const answered=QUESTIONS.map(()=>false);
const questionLabel=document.getElementById("questionLabel");
const apple=document.getElementById("apple");
const appleNumber=document.getElementById("appleNumber");
const evenBasket=document.getElementById("evenBasket");
const oddBasket=document.getElementById("oddBasket");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const hintBtn=document.getElementById("hintBtn");
const hintOverlay=document.getElementById("hintOverlay");
const hintText=document.getElementById("hintText");
const closeHintBtn=document.getElementById("closeHintBtn");
let dragState=null;
function playSound(audio){audio.currentTime=0;audio.play().catch(()=>{});}
function speak(text){
if(!window.speechSynthesis)return;
speechSynthesis.cancel();
const utterance=new SpeechSynthesisUtterance(text);
utterance.lang="en-UK";
utterance.volume=.25;
utterance.rate=1;
speechSynthesis.speak(utterance);
}
function smallConfetti(){
if(!window.confetti)return;
confetti({particleCount:35,spread:65,origin:{y:.7},scalar:.8});
}
function showPopup(correct){
const popup=document.getElementById("answerPopup");
const icon=document.getElementById("popupIcon");
const title=document.getElementById("popupTitle");
const message=document.getElementById("popupMsg");
popup.className="kid-popup "+(correct?"kid-correct":"kid-wrong");
popup.style.display="flex";
if(correct){icon.textContent="🎉";title.textContent="Great Job!";message.textContent="You got it right!";}
else{icon.textContent="🥲";title.textContent="Oops!";message.textContent="Try again!";}
clearTimeout(showPopup.timer);
showPopup.timer=setTimeout(()=>{popup.style.display="none";},1300);
}
function updateNavigation(){
prevBtn.disabled=current===0;
nextBtn.disabled=!answered[current]||current===QUESTIONS.length-1;
}
function clearBasketStates(){
[evenBasket,oddBasket].forEach(b=>b.classList.remove("hover-target","correct-target","wrong-target","apple-landed"));
}
function placeAppleInBasket(basket){
const a=apple.getBoundingClientRect();
const b=basket.getBoundingClientRect();
apple.style.transform=`translate(${b.left+b.width/2-(a.left+a.width/2)}px,${b.top+b.height*.45-(a.top+a.height/2)}px) scale(.72)`;
}
function renderQuestion(){
const q=QUESTIONS[current];
questionLabel.textContent=q.label;
appleNumber.textContent=q.number;
clearBasketStates();
apple.style.transform="";
apple.style.opacity="1";
apple.style.pointerEvents=answered[current]?"none":"auto";
if(answered[current]){
const basket=q.answer==="E"?evenBasket:oddBasket;
basket.classList.add("correct-target","apple-landed");
requestAnimationFrame(()=>placeAppleInBasket(basket));
}
updateNavigation();
}
function getBasketFromPoint(x,y){
for(const basket of [evenBasket,oddBasket]){
const r=basket.getBoundingClientRect();
if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return basket;
}
return null;
}
function resetApplePosition(){
apple.style.transform="";
apple.style.opacity="1";
}
function validateDrop(basket){
if(answered[current])return;
const q=QUESTIONS[current];
const correctBasket=q.answer==="E"?evenBasket:oddBasket;
if(basket===correctBasket){
answered[current]=true;
score++;
apple.style.pointerEvents="none";
placeAppleInBasket(correctBasket);
correctBasket.classList.add("correct-target","apple-landed");
playSound(correctSound);
speak("Correct");
showPopup(true);
smallConfetti();
updateNavigation();
if(current===QUESTIONS.length-1)setTimeout(showFinal,1100);
}else{
basket.classList.remove("wrong-target");
void basket.offsetWidth;
basket.classList.add("wrong-target");
playSound(wrongSound);
speak("Try again");
showPopup(false);
setTimeout(()=>basket.classList.remove("wrong-target"),450);
resetApplePosition();
}
}
function beginDrag(event){
if(answered[current])return;
event.preventDefault();
const r=apple.getBoundingClientRect();
dragState={pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,offsetX:event.clientX-r.left,offsetY:event.clientY-r.top,moved:false};
apple.setPointerCapture(event.pointerId);
apple.classList.add("dragging");
}
function moveDrag(event){
if(!dragState||event.pointerId!==dragState.pointerId)return;
event.preventDefault();
const dx=event.clientX-dragState.startX;
const dy=event.clientY-dragState.startY;
if(Math.abs(dx)+Math.abs(dy)>5)dragState.moved=true;
apple.style.transform=`translate(${dx}px,${dy}px)`;
const target=getBasketFromPoint(event.clientX,event.clientY);
[evenBasket,oddBasket].forEach(b=>b.classList.toggle("hover-target",b===target));
}
function endDrag(event){
if(!dragState||event.pointerId!==dragState.pointerId)return;
const wasMoved=dragState.moved;
const target=getBasketFromPoint(event.clientX,event.clientY);
dragState=null;
apple.classList.remove("dragging");
[evenBasket,oddBasket].forEach(b=>b.classList.remove("hover-target"));
if(wasMoved){
apple.style.transform="";
if(target)validateDrop(target);
else resetApplePosition();
}
}
apple.addEventListener("pointerdown",beginDrag);
apple.addEventListener("pointermove",moveDrag);
apple.addEventListener("pointerup",endDrag);
apple.addEventListener("pointercancel",endDrag);
apple.addEventListener("click",()=>{
if(answered[current])return;
apple.classList.toggle("selected");
});
[evenBasket,oddBasket].forEach(basket=>{
basket.addEventListener("click",()=>validateDrop(basket));
});
apple.addEventListener("keydown",event=>{
if(answered[current])return;
if(event.key==="Enter"||event.key===" "){
event.preventDefault();
apple.classList.add("selected");
}
});
function clearSelection(){
apple.classList.remove("selected");
}
evenBasket.addEventListener("pointerenter",()=>{if(dragState)evenBasket.classList.add("hover-target")});
oddBasket.addEventListener("pointerenter",()=>{if(dragState)oddBasket.classList.add("hover-target")});
prevBtn.addEventListener("click",()=>{
if(current<=0)return;
clearSelection();
current--;
renderQuestion();
});
nextBtn.addEventListener("click",()=>{
if(nextBtn.disabled)return;
if(current<QUESTIONS.length-1){clearSelection();current++;renderQuestion();}
});
document.getElementById("homeBtn").addEventListener("click",()=>{window.location.href="../Grade2_chapter2.html";});
function openHint(){
    const question=QUESTIONS[current];

    if(!question || !question.hint){
        return;
    }

    hintText.textContent=question.hint;
    hintOverlay.classList.add("show");
    document.body.classList.add("hint-open");
}

function closeHint(){
    hintOverlay.classList.remove("show");
    document.body.classList.remove("hint-open");
}

hintBtn.addEventListener("click",openHint);

closeHintBtn.addEventListener("click",closeHint);

hintOverlay.addEventListener("click",event=>{
    if(event.target===hintOverlay){
        closeHint();
    }
});

document.addEventListener("keydown",event=>{
    if(event.key==="Escape" && hintOverlay.classList.contains("show")){
        closeHint();
    }
});
function showFinal(){
const finalPopup=document.getElementById("finalPopup");
document.getElementById("finalScore").textContent=`Your Score: ${score} / ${QUESTIONS.length}`;
document.getElementById("stars").textContent="⭐⭐⭐";
finalPopup.style.display="flex";
if(window.confetti){
confetti({particleCount:150,spread:100,origin:{y:.5}});
setTimeout(()=>confetti({particleCount:100,spread:70,origin:{y:.6}}),300);
}
}
renderQuestion();
</script>
</body>
