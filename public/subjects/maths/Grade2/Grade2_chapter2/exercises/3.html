<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Write the number represented on the abacus</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet"
      href="../assets/css/reuse.css">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


<style>

/* =========================================================
   BASE STYLES
   ========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;

    overflow:hidden;

    /* background:#fff8ed; */

    font-family:"Livvic",sans-serif;
}

body{
    user-select:none;
    -webkit-user-select:none;
}

.quiz{
    width:100%;
    height:100vh;
    height:100dvh;

    padding:
        clamp(8px,1.4vh,18px)
        clamp(14px,2.5vw,42px)
        clamp(8px,1.2vh,16px);

    display:flex;
    flex-direction:column;

    gap:clamp(6px,1vh,14px);

    overflow:hidden;

    /* background:#fff8ed; */
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
    width:100%;

    flex:0 0 auto;

    display:grid;

    grid-template-columns:
        90px
        minmax(0,1fr)
        90px;

    align-items:start;

    gap:10px;
}

.icon-btn{
    background:none;
    border:0;
    padding:0;

    display:flex;
    flex-direction:column;
    align-items:center;

    cursor:pointer;
}

.icon-circle{
    width:clamp(42px,4.2vw,62px);
    height:clamp(42px,4.2vw,62px);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:clamp(18px,1.8vw,27px);

    transition:transform .2s ease;
}

.icon-btn:hover .icon-circle{
    transform:scale(1.06);
}

.icon-circle.home{
    background:linear-gradient(
        145deg,
        #8b6fe0,
        #6f42c1
    );
    visibility: hidden;

    box-shadow:
        0 4px 0 #4f2e93;
}

.icon-circle.hint{
    background:linear-gradient(
        145deg,
        #ffc94d,
        #f7a800
    );

    box-shadow:
        0 4px 0 #c17e00;
}


/* =========================================================
   TITLE
   ========================================================= */

.title-block{
    min-width:0;

    display:flex;
    justify-content:center;
    align-items:center;
}

.title{
    margin:0;

    width:100%;

    text-align:center;

    color:#303030;

    font-size:clamp(21px,2.7vw,40px);

    line-height:1.12;

    font-weight:400;
}


/* =========================================================
   MAIN LAYOUT
   ========================================================= */

.quiz-layout{
    flex:1 1 auto;

    min-height:0;

    width:100%;

    display:grid;

    grid-template-columns:
        minmax(0,1.05fr)
        minmax(320px,.95fr);

    gap:clamp(25px,5vw,75px);

    align-items:center;

    overflow:hidden;
}


/* =========================================================
   QUESTION SIDE
   ========================================================= */

.question-side{
    width:100%;
    min-width:0;
    min-height:0;

    height:100%;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:15px;
}

.question-number{
    width:100%;

    margin:0;

    align-self:flex-start;

    color:#303030;

    font-size:clamp(21px,2.1vw,31px);

    line-height:1;

    font-weight:400;
}


/* =========================================================
   ABACUS
   ========================================================= */

.abacus{
    position:relative;

    width:min(570px,95%);

    height:clamp(270px,48vh,390px);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-end;
}


/* =========================================================
   RODS
   ========================================================= */

.rods{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:82%;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:clamp(20px,5vw,65px);

    padding:
        0
        clamp(20px,5vw,65px);
}

.rod{
    position:relative;

    width:4px;

    height:100%;

    justify-self:center;

    background:#383838;

    border-radius:5px;
}


/* =========================================================
   BEAD STACK
   ========================================================= */

.bead-stack{
    position:absolute;

    left:50%;

    transform:translateX(-50%);

    /* Keep every bead stack attached to the bottom of its rod.
       This makes the beads build upward instead of falling downward. */
    top:auto;
    bottom:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:2px;

    /* Prevent the stack from changing its direction or position
       when the number of beads is different. */
}

.bead{
    width:clamp(29px,3.2vw,43px);
    height:clamp(29px,3.2vw,43px);

    border-radius:50%;

    box-shadow:
        inset -3px -4px 5px rgba(0,0,0,.15),
        0 2px 3px rgba(0,0,0,.14);
}

.bead.hundred{
    background:
        radial-gradient(
            circle at 35% 30%,
            #ffe976 0%,
            #ffd329 50%,
            #f2ad00 100%
        );
}

.bead.ten{
    background:
        radial-gradient(
            circle at 35% 30%,
            #59d789 0%,
            #16b957 50%,
            #07963d 100%
        );
}

.bead.one{
    background:
        radial-gradient(
            circle at 35% 30%,
            #62c8ff 0%,
            #129fdf 50%,
            #087bb7 100%
        );
}


/* =========================================================
   ABACUS BASE
   ========================================================= */

.abacus-base{
    position:relative;

    width:clamp(260px,45vw,430px);

    height:clamp(46px,6vh,60px);

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    align-items:center;

    border-radius:10px;

    background:
        linear-gradient(
            180deg,
            #f6ad60 0%,
            #e98c39 100%
        );

    border:2px solid #c86e25;

    box-shadow:
        0 4px 0 #bd6b2b,
        0 7px 12px rgba(0,0,0,.12);

    color:#663d1d;

    font-size:clamp(16px,1.8vw,23px);

    font-weight:700;
}

.base-label{
    text-align:center;
}


/* =========================================================
   ANSWER AREA
   ========================================================= */

.answer-area{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:5px;
}

.answer-label{
    margin:0;

    color:#333;

    font-size:clamp(15px,1.4vw,19px);

    font-weight:700;
}

.answer-box{
    width:clamp(125px,14vw,165px);

    height:70px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:3px solid #c9a8f4;

    border-radius:13px;

    background:#fff;

    color:#58329b;

    font-size:clamp(22px,2.2vw,31px);

    font-weight:600;

    transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;
}

.answer-box.correct{
    background:#ecfff2;

    border-color:#20b957;

    color:#168044;

    transform:scale(1.03);
}

.answer-placeholder{
    letter-spacing:8px;

    color:#58329b;
}


/* =========================================================
   OPTIONS
   ========================================================= */

.options-side{
    width:100%;
    min-width:0;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:18px;
}

.options-title{
    margin:0;

    color:#303030;

    font-size:clamp(18px,1.8vw,25px);

    font-weight:600;

    text-align:center;
}

.options{
    width:min(500px,100%);

    display:flex;

    flex-direction:column;

    gap:clamp(13px,2vh,22px);
}


/* =========================================================
   DIFFERENT OPTION DESIGN
   ========================================================= */

.option{
    position:relative;

    width:100%;

    min-height:clamp(60px,7vh,76px);

    padding:
        8px
        clamp(15px,2vw,24px);

    border:0;

    border-radius:18px;

    display:flex;

    align-items:center;

    gap:15px;

    cursor:pointer;

    font-family:"Livvic",sans-serif;

    background:#fff;

    box-shadow:
        0 5px 0 rgba(0,0,0,.10),
        0 9px 16px rgba(0,0,0,.10);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.option::before{
    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:7px;

    border-radius:
        18px
        0
        0
        18px;
}

.option:hover{
    transform:translateY(-2px);

    box-shadow:
        0 7px 0 rgba(0,0,0,.10),
        0 12px 18px rgba(0,0,0,.11);
}

.option:active{
    transform:translateY(2px);

    box-shadow:
        0 2px 0 rgba(0,0,0,.10);
}


/* Option 1 */

.option.option-one{
    background:#fffaf0;
}

.option.option-one::before{
    background:#f4a900;
}

.option-one .option-number{
    background:#f4a900;
}


/* Option 2 */

.option.option-two{
    background:#f4fbff;
}

.option.option-two::before{
    background:#159bd7;
}

.option-two .option-number{
    background:#159bd7;
}


/* Option 3 */

.option.option-three{
    background:#f9f3ff;
}

.option.option-three::before{
    background:#8754c7;
}

.option-three .option-number{
    background:#8754c7;
}


.option-number{
    width:clamp(40px,4vw,52px);
    height:clamp(40px,4vw,52px);

    flex:0 0 auto;

    border-radius:14px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:clamp(17px,1.7vw,23px);

    font-weight:700;
}

.option-value{
    flex:1;

    color:#303030;

    font-size:clamp(23px,2.2vw,32px);

    font-weight:400;

    text-align:left;
}


/* =========================================================
   OPTION STATES
   ========================================================= */

.option.correct-option{
    background:#eafff1 !important;

    box-shadow:
        0 5px 0 #1c9c4c,
        0 10px 18px rgba(28,156,76,.18);

    transform:translateY(-1px);
}

.option.wrong-option{
    animation:optionShake .4s ease;
}

.option.disabled-option{
    pointer-events:none;

    opacity:.72;
}

@keyframes optionShake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-7px);
    }

    75%{
        transform:translateX(7px);
    }
}


/* =========================================================
   HINT
   ========================================================= */

.hint-overlay{
    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    z-index:3500;

    background:rgba(0,0,0,.25);
}

.hint-overlay.show{
    display:flex;
}

.hint-box{
    width:min(420px,calc(100vw - 32px));

    padding:26px 28px;

    background:#fff;

    border-radius:24px;

    text-align:center;

    box-shadow:
        0 12px 35px rgba(0,0,0,.18);
}

.hint-box h3{
    margin:0 0 10px;

    color:#e08e00;

    font-size:clamp(24px,3vw,32px);

    font-weight:700;
}

.hint-box p{
    margin:0;

    color:#1f2d3d;

    font-size:clamp(16px,1.6vw,21px);

    line-height:1.45;
}

.hint-close{
    margin-top:18px;

    min-width:110px;

    height:44px;

    border:0;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            #ffc94d,
            #f7a800
        );

    color:#fff;

    font-family:"Livvic",sans-serif;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    box-shadow:0 4px 0 #c17e00;
}


/* =========================================================
   MEDIA QUERY 1 — TABLET
   ========================================================= */

@media (max-width:900px){

    .quiz{
        padding:
            7px
            12px
            6px;

        gap:5px;
    }

    .topbar{
        grid-template-columns:
            55px
            minmax(0,1fr)
            55px;
    }

    .quiz-layout{
        grid-template-columns:
            minmax(0,1fr)
            minmax(260px,.8fr);

        gap:18px;
    }

    .question-number{
        font-size:19px;
    }

    .abacus{
        width:100%;
        height:clamp(245px,45vh,320px);
    }

    .rods{
        padding:
            0
            45px;

        gap:45px;
    }

    .bead{
        width:34px;
        height:34px;
    }

    .abacus-base{
        width:290px;
        height:45px;
    }

    .options{
        width:100%;
    }

    .option{
        min-height:55px;

        border-radius:15px;

        gap:10px;
    }

    .option-number{
        width:38px;
        height:38px;

        border-radius:11px;
    }

    .option-value{
        font-size:21px;
    }

}


/* =========================================================
   MEDIA QUERY 2 — MOBILE
   ========================================================= */

@media (max-width:600px){

    .quiz{
        padding:
            5px
            8px
            4px;

        gap:3px;
    }

    .topbar{
        grid-template-columns:
            45px
            minmax(0,1fr)
            45px;
    }

    .icon-circle{
        width:36px;
        height:36px;

        font-size:15px;
    }

    .title{
        font-size:
            clamp(
                15px,
                4.5vw,
                21px
            );
    }

    .quiz-layout{
        grid-template-columns:1fr;

        grid-template-rows:
            minmax(0,1fr)
            auto;

        gap:4px;
    }

    .question-side{
        height:auto;

        gap:3px;
    }

    .question-number{
        font-size:16px;
    }

    .abacus{
        width:min(400px,100%);

        height:
            clamp(
                175px,
                31vh,
                230px
            );
    }

    .rods{
        height:81%;

        padding:
            0
            22%;

        gap:25px;
    }

    .rod{
        width:3px;
    }

    .bead-stack{
        top:auto;
        bottom:0;

        gap:1px;
    }

    .bead{
        width:25px;
        height:25px;
    }

    .abacus-base{
        width:205px;

        height:36px;

        font-size:14px;
    }

    .answer-label{
        font-size:12px;
    }

    .answer-box{
        width:95px;

        height:60px;

        border-width:2px;

        font-size:20px;
    }

    .options-side{
        gap:3px;
    }

    .options-title{
        display:none;
    }

    .options{
        width:min(470px,97%);

        display:grid;

        grid-template-columns:
            repeat(3,1fr);

        gap:7px;
    }

    .option{
        min-height:48px;

        padding:
            5px
            7px;

        border-radius:12px;

        gap:5px;

        justify-content:center;
    }

    .option::before{
        width:4px;

        border-radius:
            12px
            0
            0
            12px;
    }

    .option-number{
        width:28px;
        height:28px;

        border-radius:8px;

        font-size:12px;
    }

    .option-value{
        flex:0 0 auto;

        font-size:17px;
    }

}


/* =========================================================
   MEDIA QUERY 3 — VERY SMALL PHONES
   ========================================================= */

@media (max-width:400px){

    .quiz{
        padding:
            4px
            6px
            3px;

        gap:2px;
    }

    .topbar{
        grid-template-columns:
            38px
            minmax(0,1fr)
            38px;
    }

    .icon-circle{
        width:32px;
        height:32px;

        font-size:13px;
    }

    .title{
        font-size:14px;
    }

    .question-number{
        font-size:14px;
    }

    .abacus{
        height:160px;
    }

    .rods{
        padding:
            0
            24%;

        gap:20px;
    }

    .bead-stack{
        top:auto;
        bottom:0;
    }

    .bead{
        width:21px;
        height:21px;
    }

    .abacus-base{
        width:175px;

        height:31px;

        font-size:12px;
    }

    .answer-label{
        font-size:10px;
    }

    .answer-box{
        width:82px;

        height:40px;

        font-size:17px;
    }

    .options{
        gap:5px;
    }

    .option{
        min-height:40px;

        padding:
            3px
            5px;

        border-radius:9px;
    }

    .option-number{
        width:23px;
        height:23px;

        border-radius:6px;

        font-size:10px;
    }

    .option-value{
        font-size:15px;
    }

}


/* =========================================================
   MEDIA QUERY 4 — SHORT SCREENS
   ========================================================= */

@media (max-height:640px){

    .quiz{
        gap:2px;
    }

    .quiz-layout{
        gap:2px;
    }

    .question-side{
        gap:2px;
    }

    .abacus{
        height:180px;
    }

    .bead-stack{
        top:auto;
        bottom:0;
    }

    .bead{
        width:23px;
        height:23px;
    }

    .abacus-base{
        height:34px;
    }

    .answer-box{
        height:70px;
    }

    .options{
        gap:5px;
    }

    .option{
        min-height:40px;
    }

}


/* =========================================================
   MEDIA QUERY 5 — LARGE DESKTOP
   ========================================================= */

@media (min-width:1200px){

    .quiz{
        padding-left:40px;
        padding-right:40px;
    }

    .quiz-layout{
        grid-template-columns:
            minmax(0,1.1fr)
            minmax(400px,.9fr);

        gap:65px;
    }

    .abacus{
        width:610px;

        height:332px;
    }

    .rods{
        padding:
            0
            85px;

        gap:85px;
    }

    .bead{
        width:35px;
        height:35px;
    }

    .abacus-base{
        width:420px;

        height:58px;
    }

    .options{
        width:500px;
    }

    .option{
        min-height:70px;
    }

}


/* =========================================================
   MEDIA QUERY 6 — EXTRA LARGE DESKTOP
   ========================================================= */

@media (min-width:1440px){

    .title{
        font-size:40px;
    }

    .abacus{
        width:650px;

        height:330px;
    }

    .rods{
        padding:
            0
            100px;

        gap:100px;
    }

    .bead{
        width:42px;
        height:42px;
    }

    .option{
        min-height:76px;

        font-size:30px;
    }

}

</style>

</head>


<body>


<div class="quiz" id="quizCard">


    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <div class="topbar">

        <button class="icon-btn"
                id="homeBtn"
                aria-label="Home">

            <span class="icon-circle home">
                <i class="fa-solid fa-house"></i>
            </span>

        </button>


        <div class="title-block">

            <h1 class="title">
                Write the number represented on the abacus scale.
            </h1>

        </div>


        <button class="icon-btn"
                id="hintBtn"
                aria-label="Hint">

            <span class="icon-circle hint">
                <i class="fa-solid fa-lightbulb"></i>
            </span>

        </button>

    </div>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <div class="quiz-layout">


        <!-- =================================================
             ABACUS SIDE
             ================================================= -->

        <div class="question-side">

            <p class="question-number"
               id="questionNumber">
                Q1.
            </p>


            <div class="abacus">


                <!-- RODS -->

                <div class="rods">

                    <div class="rod">

                        <div class="bead-stack"
                             id="hundredsBeads">
                        </div>

                    </div>


                    <div class="rod">

                        <div class="bead-stack"
                             id="tensBeads">
                        </div>

                    </div>


                    <div class="rod">

                        <div class="bead-stack"
                             id="onesBeads">
                        </div>

                    </div>

                </div>


                <!-- BASE -->

                <div class="abacus-base">

                    <div class="base-label">
                        H
                    </div>

                    <div class="base-label">
                        T
                    </div>

                    <div class="base-label">
                        O
                    </div>

                </div>

            </div>


            <!-- ANSWER -->

            <div class="answer-area">

                <p class="answer-label">
                    Your Answer
                </p>

                <div class="answer-box"
                     id="answerBox">

                    <span class="answer-placeholder">
                        __
                    </span>

                </div>

            </div>

        </div>


        <!-- =================================================
             OPTIONS
             ================================================= -->

        <div class="options-side">

            <p class="options-title">
                Choose the number
            </p>


            <div class="options"
                 id="optionsContainer">
            </div>

        </div>

    </div>


    <!-- =====================================================
         EXISTING NAVIGATION
         ===================================================== -->

    <div class="controls">

        <button class="prev"
                id="prevBtn"
                disabled>

            <i class="fa-solid fa-circle-arrow-left"></i>
            Prev

        </button>


        <button class="next"
                id="nextBtn"
                disabled>

            Next
            <i class="fa-solid fa-circle-arrow-right"></i>

        </button>

    </div>

</div>


<!-- =========================================================
     EXISTING HINT
     ========================================================= -->

<div class="hint-overlay"
     id="hintOverlay">

    <div class="hint-box">

        <h3>
            Hint
        </h3>

        <p id="hintText"></p>

        <button class="hint-close"
                id="closeHintBtn">

            Got it!

        </button>

    </div>

</div>


<!-- =========================================================
     EXISTING POPUP
     ========================================================= -->

<div id="answerPopup"
     class="kid-popup">

    <div class="kid-card">

        <div class="kid-icon"
             id="popupIcon">
        </div>

        <h3 id="popupTitle"></h3>

        <p id="popupMsg"></p>

    </div>

</div>


<!-- =========================================================
     EXISTING FINAL POPUP
     ========================================================= -->

<div id="finalPopup">

    <div class="final-kid-box">

        <h2>
            🎉 Congratulations!
        </h2>

        <p id="finalScore"></p>

        <div id="stars"></div>

        <button class="playAgain-btn"
                onclick="location.reload()">

            Play Again

        </button>

    </div>

</div>


<audio id="correctSound"
       src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3">
</audio>

<audio id="wrongSound"
       src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3">
</audio>


<script>

/* =========================================================
   QUESTION DATA
   Taken from the SECOND IMAGE
   ========================================================= */

const QUESTIONS = [

    {
        label:"Q1.",

        hundreds:5,
        tens:7,
        ones:2,

        answer:572,

        options:[
            427,
            572,
            742
        ],

        hint:
            "Count the Hundreds, then the Tens, then the Ones. Read them from left to right."
    },


    {
        label:"Q2.",

        hundreds:8,
        tens:1,
        ones:6,

        answer:816,

        options:[
            816,
            661,
            166
        ],

        hint:
            "There are 6 Hundreds, 1 Ten and 6 Ones. Read the digits in H, T, O order."
    },


    {
        label:"Q3.",

        hundreds:7,
        tens:5,
        ones:3,

        answer:753,

        options:[
            735,
            753,
            573
        ],

        hint:
            "Count 7 Hundreds, 5 Tens and 3 Ones. Put those digits together in that order."
    }

];


const total =
    QUESTIONS.length;

let current =
    0;

let answered =
    QUESTIONS.map(() => false);


/* =========================================================
   DOM
   ========================================================= */

const questionNumber =
    document.getElementById(
        "questionNumber"
    );

const hundredsBeads =
    document.getElementById(
        "hundredsBeads"
    );

const tensBeads =
    document.getElementById(
        "tensBeads"
    );

const onesBeads =
    document.getElementById(
        "onesBeads"
    );

const optionsContainer =
    document.getElementById(
        "optionsContainer"
    );

const answerBox =
    document.getElementById(
        "answerBox"
    );

const prevBtn =
    document.getElementById(
        "prevBtn"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const homeBtn =
    document.getElementById(
        "homeBtn"
    );

const hintBtn =
    document.getElementById(
        "hintBtn"
    );

const hintOverlay =
    document.getElementById(
        "hintOverlay"
    );

const hintText =
    document.getElementById(
        "hintText"
    );

const closeHintBtn =
    document.getElementById(
        "closeHintBtn"
    );

const correctSound =
    document.getElementById(
        "correctSound"
    );

const wrongSound =
    document.getElementById(
        "wrongSound"
    );


/* =========================================================
   SPEECH
   ========================================================= */

function speak(text){

    if(!window.speechSynthesis){
        return;
    }

    speechSynthesis.cancel();

    const message =
        new SpeechSynthesisUtterance(
            text
        );

    message.lang =
        "en-UK";

    message.volume =
        0.25;

    message.rate =
        1;

    message.pitch =
        1;

    speechSynthesis.speak(
        message
    );
}


/* =========================================================
   CONFETTI
   ========================================================= */

function smallConfetti(){

    if(!window.confetti){
        return;
    }

    confetti({

        particleCount:35,

        spread:60,

        scalar:.8,

        origin:{
            y:.7
        }

    });
}


function finalConfetti(){

    if(!window.confetti){
        return;
    }

    confetti({

        particleCount:150,

        spread:100,

        origin:{
            y:.5
        }

    });

}


/* =========================================================
   POPUP
   Uses existing reuse.css popup styles
   ========================================================= */

function showPopup(
    isCorrect
){

    const popup =
        document.getElementById(
            "answerPopup"
        );

    const icon =
        document.getElementById(
            "popupIcon"
        );

    const title =
        document.getElementById(
            "popupTitle"
        );

    const message =
        document.getElementById(
            "popupMsg"
        );


    popup.className =
        "kid-popup " +
        (
            isCorrect
                ? "kid-correct"
                : "kid-wrong"
        );


    popup.style.display =
        "flex";


    if(isCorrect){

        icon.textContent =
            "🎉";

        title.textContent =
            "Great Job!";

        message.textContent =
            "You got it right!";

    }else{

        icon.textContent =
            "🥲";

        title.textContent =
            "Oops!";

        message.textContent =
            "Try again, you can do it!";

    }


    clearTimeout(
        showPopup.timer
    );


    showPopup.timer =
        setTimeout(() => {

            popup.style.display =
                "none";

        },1400);

}


/* =========================================================
   FINAL POPUP
   ========================================================= */

function showFinal(){

    const popup =
        document.getElementById(
            "finalPopup"
        );

    document.getElementById(
        "finalScore"
    ).textContent =
        `Your Score: ${total} / ${total}`;


    document.getElementById(
        "stars"
    ).textContent =
        "⭐".repeat(total);


    popup.style.display =
        "flex";


    finalConfetti();

}


/* =========================================================
   CREATE BEADS
   ========================================================= */

function createBeads(
    container,
    count,
    type
){

    container.innerHTML =
        "";


    for(
        let i = 0;
        i < count;
        i++
    ){

        const bead =
            document.createElement(
                "div"
            );


        bead.className =
            "bead " +
            type;


        container.appendChild(
            bead
        );

    }

}


/* =========================================================
   RENDER ABACUS
   ========================================================= */

function renderAbacus(q){

    createBeads(
        hundredsBeads,
        q.hundreds,
        "hundred"
    );


    createBeads(
        tensBeads,
        q.tens,
        "ten"
    );


    createBeads(
        onesBeads,
        q.ones,
        "one"
    );

}


/* =========================================================
   OPTION LETTERS
   ========================================================= */

function getOptionClass(index){

    if(index === 0){
        return "option-one";
    }

    if(index === 1){
        return "option-two";
    }

    return "option-three";

}


/* =========================================================
   RENDER OPTIONS
   ========================================================= */

function renderOptions(q){

    optionsContainer.innerHTML =
        "";


    const letters =
        ["A","B","C"];


    q.options.forEach(
        (value,index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "option " +
                getOptionClass(
                    index
                );


            button.dataset.value =
                value;


            button.innerHTML = `

                <span class="option-number">
                    ${letters[index]}
                </span>

                <span class="option-value">
                    ${value}
                </span>

            `;


            button.addEventListener(
                "click",
                () => {

                    selectAnswer(
                        button,
                        value,
                        q.answer
                    );

                }
            );


            optionsContainer.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   SELECT ANSWER
   ========================================================= */

function selectAnswer(
    button,
    value,
    correctAnswer
){

    if(
        answered[current]
    ){
        return;
    }


    /* =====================================================
       CORRECT
       ===================================================== */

    if(
        value === correctAnswer
    ){

        answered[current] =
            true;


        button.classList.add(
            "correct-option"
        );


        /*
         * Render the selected
         * number inside blank box.
         */

        answerBox.innerHTML =
            `<span>${value}</span>`;


        answerBox.classList.add(
            "correct"
        );


        /* Disable all options */

        document
            .querySelectorAll(
                ".option"
            )
            .forEach(option => {

                option.classList.add(
                    "disabled-option"
                );

            });


        correctSound.currentTime =
            0;

        correctSound
            .play()
            .catch(() => {});


        speak(
            "Correct"
        );


        showPopup(
            true
        );


        smallConfetti();


        /*
         * Only Next click moves
         * to the next question.
         */

        nextBtn.disabled =
            current >= total - 1;


        /*
         * Final popup appears
         * only after Q3 is answered.
         */

        if(
            current === total - 1
        ){

            setTimeout(
                showFinal,
                1300
            );

        }


        return;
    }


    /* =====================================================
       WRONG
       ===================================================== */

    button.classList.remove(
        "wrong-option"
    );


    void button.offsetWidth;


    button.classList.add(
        "wrong-option"
    );


    wrongSound.currentTime =
        0;

    wrongSound
        .play()
        .catch(() => {});


    speak(
        "Try again"
    );


    showPopup(
        false
    );


    setTimeout(() => {

        button.classList.remove(
            "wrong-option"
        );

    },500);

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

    const q =
        QUESTIONS[current];


    questionNumber.textContent =
        q.label;


    renderAbacus(
        q
    );


    renderOptions(
        q
    );


    /*
     * Restore answered state
     * if user goes back.
     */

    if(
        answered[current]
    ){

        answerBox.innerHTML =
            `<span>${q.answer}</span>`;


        answerBox.classList.add(
            "correct"
        );


        document
            .querySelectorAll(
                ".option"
            )
            .forEach(option => {

                option.classList.add(
                    "disabled-option"
                );


                if(
                    Number(
                        option.dataset.value
                    ) === q.answer
                ){

                    option.classList.add(
                        "correct-option"
                    );

                }

            });

    }else{

        answerBox.innerHTML =
            `
            <span class="answer-placeholder">
                __
            </span>
            `;


        answerBox.classList.remove(
            "correct"
        );

    }


    /*
     * Prev is enabled after Q1.
     */

    prevBtn.disabled =
        current === 0;


    /*
     * Next only works after
     * current question is correct.
     */

    nextBtn.disabled =
        !answered[current] ||
        current === total - 1;

}


/* =========================================================
   PREVIOUS
   ========================================================= */

prevBtn.addEventListener(
    "click",
    () => {

        if(
            current === 0
        ){
            return;
        }


        current--;

        renderQuestion();

    }
);


/* =========================================================
   NEXT
   ========================================================= */

nextBtn.addEventListener(
    "click",
    () => {

        /*
         * Do not move until
         * current question is answered.
         */

        if(
            !answered[current]
        ){
            return;
        }


        if(
            current >= total - 1
        ){
            return;
        }


        current++;

        renderQuestion();

    }
);


/* =========================================================
   HOME
   ========================================================= */

homeBtn.addEventListener(
    "click",
    () => {

       window.top.location.href =
    "../Grade2_chapter2.html";

    }
);


/* =========================================================
   HINT
   ========================================================= */

hintBtn.addEventListener(
    "click",
    () => {

        hintText.textContent =
            QUESTIONS[current].hint;


        hintOverlay.classList.add(
            "show"
        );

    }
);


closeHintBtn.addEventListener(
    "click",
    () => {

        hintOverlay.classList.remove(
            "show"
        );

    }
);


hintOverlay.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            hintOverlay
        ){

            hintOverlay.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   INITIAL LOAD
   ========================================================= */

renderQuestion();

</script>

</body>
</html>
