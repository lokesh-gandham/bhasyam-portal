/* =========================================================
   ABACUS ALIGNMENT FIX
   Keeps every bead centered exactly on its rod and keeps
   the complete bead stack above the abacus base.
   ========================================================= */

.abacus{
    position:relative;
    width:min(620px,96%);
    height:clamp(285px,48vh,390px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
}

.rods{
    position:absolute;
    inset:0 0 clamp(48px,6vh,60px);
    height:auto;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:0;
    padding:0 clamp(45px,8vw,100px);
    align-items:stretch;
}

.rod{
    position:relative;
    width:4px;
    height:100%;
    justify-self:center;
    align-self:stretch;
    background:#383838;
    border-radius:5px;
}

.bead-stack{
    position:absolute;
    left:50%;
    top:auto;
    bottom:0;
    transform:translateX(-50%);
    width:max-content;
    height:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:2px;
    overflow:visible;
}

/* The beads shrink only when a rod contains many beads.
   They remain perfectly round and stay centered on the rod. */
.bead{
    width:clamp(28px,3vw,42px);
    height:clamp(28px,3vw,42px);
    min-width:0;
    min-height:0;
    flex:0 1 auto;
    aspect-ratio:1 / 1;
    border-radius:50%;
}

/* The maximum stack is 9 beads, so keep all 9 inside the rod. */
.bead-stack:has(.bead:nth-child(9)){
    gap:1px;
}

.bead-stack:has(.bead:nth-child(9)) .bead{
    width:clamp(24px,2.45vw,35px);
    height:clamp(24px,2.45vw,35px);
}

.abacus-base{
    position:relative;
    z-index:5;
    width:min(420px,78%);
    height:clamp(46px,6vh,60px);
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    align-items:center;
}

/* Make the three labels sit exactly under the three rods. */
.abacus-base .base-label{
    text-align:center;
}

    .abacus{
        width:100%;
        height:clamp(245px,45vh,320px);
    }

    .rods{
        inset:0 0 45px;
        padding-left:45px;
        padding-right:45px;
    }

    .bead{
        width:34px;
        height:34px;
    }

    .bead-stack:has(.bead:nth-child(9)) .bead{
        width:27px;
        height:27px;
    }

    .abacus-base{
        width:290px;
        height:45px;
    }
}

/* ---------------- MOBILE ---------------- */
@media (max-width:600px){
    .abacus{
        width:min(400px,100%);
        height:clamp(180px,31vh,230px);
    }

    .rods{
        inset:0 0 36px;
        padding-left:22%;
        padding-right:22%;
        gap:0;
    }

    .rod{
        width:3px;
    }

    .bead-stack{
        top:auto;
        bottom:0;

        width:25px;
        height:25px;

        width:19px;
        height:19px;
    }

    .abacus-base{
        width:205px;
        height:36px;
    }
}

        height:160px;

        inset:0 0 31px;

<script>

/* =========================================================
   QUESTION DATA
   ========================================================= */

const QUESTIONS = [

    {
        label:"Q1.",

        hundreds:1,
        tens:4,
        ones:9,

        answer:149,

        words:[
            "one hundred forty-nine",
            "one hundred and forty-nine",
            "one hundred forty nine",
            "one hundred and forty nine"
        ],

        hint:
            "There is 1 Hundred, 4 Tens and 9 Ones. Read the digits from left to right."
    },


    {
        label:"Q2.",

        hundreds:4,
        tens:6,
        ones:3,

        answer:463,

        words:[
            "four hundred sixty-three",
            "four hundred and sixty-three",
            "four hundred sixty three",
            "four hundred and sixty three"
        ],

        hint:
            "There are 4 Hundreds, 6 Tens and 3 Ones. Read the digits from left to right."
    }

];


const total =
    QUESTIONS.length;

let current =
    0;

let answered =
    QUESTIONS.map(() => false);


/* =========================================================
   DOM
   ========================================================= */

const questionNumber =
    document.getElementById("questionNumber");

const hundredsBeads =
    document.getElementById("hundredsBeads");

const tensBeads =
    document.getElementById("tensBeads");

const onesBeads =
    document.getElementById("onesBeads");

const numberInput =
    document.getElementById("numberInput");

const wordsInput =
    document.getElementById("wordsInput");

const submitBtn =
    document.getElementById("submitBtn");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const homeBtn =
    document.getElementById("homeBtn");

const hintBtn =
    document.getElementById("hintBtn");

const hintOverlay =
    document.getElementById("hintOverlay");

const hintText =
    document.getElementById("hintText");

const closeHintBtn =
    document.getElementById("closeHintBtn");

const correctSound =
    document.getElementById("correctSound");

const wrongSound =
    document.getElementById("wrongSound");


/* =========================================================
   SPEECH
   ========================================================= */

function speak(text){

    if(!window.speechSynthesis){
        return;
    }

    speechSynthesis.cancel();

    const message =
        new SpeechSynthesisUtterance(text);

    message.lang =
        "en-UK";

    message.volume =
        0.25;

    message.rate =
        1;

    message.pitch =
        1;

    speechSynthesis.speak(message);
}


/* =========================================================
   CONFETTI
   ========================================================= */

function smallConfetti(){

    if(!window.confetti){
        return;
    }

    confetti({
        particleCount:35,
        spread:60,
        scalar:.8,
        origin:{
            y:.7
        }
    });
}


function finalConfetti(){

    if(!window.confetti){
        return;
    }

    confetti({
        particleCount:150,
        spread:100,
        origin:{
            y:.5
        }
    });

}


/* =========================================================
   EXISTING POPUP
   ========================================================= */

function showPopup(isCorrect){

    const popup =
        document.getElementById("answerPopup");

    const icon =
        document.getElementById("popupIcon");

    const title =
        document.getElementById("popupTitle");

    const message =
        document.getElementById("popupMsg");


    popup.className =
        "kid-popup " +
        (
            isCorrect
                ? "kid-correct"
                : "kid-wrong"
        );


    popup.style.display =
        "flex";


    if(isCorrect){

        icon.textContent =
            "🎉";

        title.textContent =
            "Great Job!";

        message.textContent =
            "You got it right!";

    }else{

        icon.textContent =
            "🥲";

        title.textContent =
            "Oops!";

        message.textContent =
            "Try again, you can do it!";

    }


    clearTimeout(
        showPopup.timer
    );


    showPopup.timer =
        setTimeout(() => {

            popup.style.display =
                "none";

        },1400);

}


/* =========================================================
   FINAL POPUP
   ========================================================= */

function showFinal(){

    const popup =
        document.getElementById("finalPopup");


    document.getElementById("finalScore").textContent =
        `Your Score: ${total} / ${total}`;


    document.getElementById("stars").textContent =
        "⭐".repeat(total);


    popup.style.display =
        "flex";


    finalConfetti();

}


/* =========================================================
   CREATE BEADS
   ========================================================= */

function createBeads(
    container,
    count,
    type
){

    container.innerHTML = "";


    for(
        let i = 0;
        i < count;
        i++
    ){

        const bead =
            document.createElement("div");


        bead.className =
            "bead " + type;


        container.appendChild(
            bead
        );

    }

}


/* =========================================================
   RENDER ABACUS
   ========================================================= */

function renderAbacus(q){

    createBeads(
        hundredsBeads,
        q.hundreds,
        "hundred"
    );


    createBeads(
        tensBeads,
        q.tens,
        "ten"
    );


    createBeads(
        onesBeads,
        q.ones,
        "one"
    );

}


/* =========================================================
   NORMALIZE WORD ANSWER
   ========================================================= */

function normalizeWords(value){

    return value
        .toLowerCase()
        .trim()
        .replace(/-/g," ")
        .replace(/\band\b/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   CHECK WORD ANSWER
   ========================================================= */

function isWordsCorrect(value,q){

    const userAnswer =
        normalizeWords(value);

    return q.words.some(
        answer =>
            normalizeWords(answer) === userAnswer
    );

}


/* =========================================================
   INPUT STATE
   ========================================================= */

function clearInputStates(){

    numberInput.classList.remove(
        "correct-input",
        "wrong-input",
        "edit-input"
    );

    wordsInput.classList.remove(
        "correct-input",
        "wrong-input",
        "edit-input"
    );

}


/* =========================================================
   SUBMIT BUTTON STATE

   Submit is enabled ONLY when BOTH input boxes
   contain something.

   This function NEVER checks whether answers
   are correct.
   ========================================================= */

function updateSubmitState(){

    if(answered[current]){

        submitBtn.disabled =
            true;

        return;
    }


    const numberHasValue =
        numberInput.value.trim().length > 0;

    const wordsHasValue =
        wordsInput.value.trim().length > 0;


    submitBtn.disabled =
        !(numberHasValue && wordsHasValue);

}


/* =========================================================
   CHECK ANSWERS

   Answers are checked ONLY when Submit is clicked.

   NEW BEHAVIOUR:

   1. BOTH WRONG
      → Clear BOTH inputs.

   2. NUMBER CORRECT + WORDS WRONG
      → Keep number.
      → Clear English words.
      → Keep English input editable.

   3. WORDS CORRECT + NUMBER WRONG
      → Keep English words.
      → Clear number.
      → Keep number input editable.

   4. BOTH CORRECT
      → Lock both inputs.
   ========================================================= */

function checkCompleteAnswer(){

    if(answered[current]){
        return;
    }


    const q =
        QUESTIONS[current];


    const numberValue =
        numberInput.value.trim();

    const wordsValue =
        wordsInput.value.trim();


    /*
     * Both boxes must contain an answer.
     */

    if(
        numberValue === "" ||
        wordsValue === ""
    ){

        submitBtn.disabled =
            true;

        return;
    }


    const numberCorrect =
        Number(numberValue) === q.answer;


    const wordsCorrect =
        isWordsCorrect(
            wordsValue,
            q
        );


    /* =====================================================
       BOTH CORRECT
       ===================================================== */

    if(
        numberCorrect &&
        wordsCorrect
    ){

        answered[current] =
            true;


        numberInput.classList.remove(
            "wrong-input",
            "edit-input"
        );

        numberInput.classList.add(
            "correct-input"
        );


        wordsInput.classList.remove(
            "wrong-input",
            "edit-input"
        );

        wordsInput.classList.add(
            "correct-input"
        );


        numberInput.disabled =
            true;

        wordsInput.disabled =
            true;

        submitBtn.disabled =
            true;


        correctSound.currentTime =
            0;

        correctSound
            .play()
            .catch(() => {});


        speak("Correct");

        showPopup(true);

        smallConfetti();


        nextBtn.disabled =
            current >= total - 1;


        if(
            current ===
            total - 1
        ){

            setTimeout(
                showFinal,
                1300
            );

        }


        return;
    }


    /* =====================================================
       NUMBER CORRECT
       WORDS WRONG

       KEEP:
       - Correct number

       REMOVE:
       - Wrong English answer

       The English input stays editable.
       ===================================================== */

    if(
        numberCorrect &&
        !wordsCorrect
    ){

        /* Keep correct number */
        numberInput.classList.remove(
            "wrong-input",
            "edit-input"
        );

        numberInput.classList.add(
            "correct-input"
        );

        numberInput.disabled =
            true;


        /*
         * CLEAR the wrong English answer.
         */
        wordsInput.value =
            "";


        /*
         * Keep English input editable.
         */
        wordsInput.disabled =
            false;


        wordsInput.classList.remove(
            "correct-input",
            "wrong-input",
            "edit-input"
        );

        wordsInput.classList.add(
            "edit-input"
        );


        /*
         * Submit stays disabled until
         * the learner enters a new English answer.
         */
        submitBtn.disabled =
            true;


        wrongSound.currentTime =
            0;

        wrongSound
            .play()
            .catch(() => {});


        speak("Try again");

        showPopup(false);


        wordsInput.focus();


        return;
    }


    /* =====================================================
       WORDS CORRECT
       NUMBER WRONG

       KEEP:
       - Correct English answer

       REMOVE:
       - Wrong number

       The number input stays editable.
       ===================================================== */

    if(
        !numberCorrect &&
        wordsCorrect
    ){

        /*
         * Keep correct English answer.
         */
        wordsInput.classList.remove(
            "wrong-input",
            "edit-input"
        );

        wordsInput.classList.add(
            "correct-input"
        );

        wordsInput.disabled =
            true;


        /*
         * CLEAR the wrong number.
         */
        numberInput.value =
            "";


        /*
         * Keep number input editable.
         */
        numberInput.disabled =
            false;


        numberInput.classList.remove(
            "correct-input",
            "wrong-input",
            "edit-input"
        );

        numberInput.classList.add(
            "wrong-input"
        );


        /*
         * Submit stays disabled until
         * the learner enters a new number.
         */
        submitBtn.disabled =
            true;


        wrongSound.currentTime =
            0;

        wrongSound
            .play()
            .catch(() => {});


        speak("Try again");

        showPopup(false);


        numberInput.focus();


        return;
    }


    /* =====================================================
       BOTH WRONG

       CLEAR:
       - Number input
       - English input

       Then allow the learner to start again.
       ===================================================== */

    numberInput.value =
        "";

    wordsInput.value =
        "";


    /*
     * Number input is the first input,
     * so it is enabled.
     */
    numberInput.disabled =
        false;


    /*
     * English input stays disabled until
     * a new number is entered.
     */
  wordsInput.disabled =
    false;


    numberInput.classList.remove(
        "correct-input",
        "wrong-input",
        "edit-input"
    );

    wordsInput.classList.remove(
        "correct-input",
        "wrong-input",
        "edit-input"
    );


    submitBtn.disabled =
        true;


    wrongSound.currentTime =
        0;

    wrongSound
        .play()
        .catch(() => {});


    speak("Try again");

    showPopup(false);


    numberInput.focus();

}


/* =========================================================
   NUMBER INPUT

   Does NOT check the answer.

   It:
   - accepts numbers
   - enables/disables second box
   - updates Submit button
   ========================================================= */

numberInput.addEventListener(
    "input",
    () => {

        const value =
            numberInput.value
                .replace(/\D/g,"")
                .slice(0,3);


        numberInput.value =
            value;


        /*
         * Enable English input when
         * the number has something.
         *
         * IMPORTANT:
         * If the English answer is already
         * locked as correct, do not unlock it.
         */


        /*
         * If learner edits a previously wrong
         * number, remove wrong visual state.
         */

        numberInput.classList.remove(
            "wrong-input"
        );


        /*
         * Do NOT validate here.
         */

        updateSubmitState();

    }
);


/* =========================================================
   NUMBER ENTER

   ENTER DOES NOT CHECK THE ANSWER.
   ========================================================= */

numberInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

        }

    }
);


/* =========================================================
   NUMBER BLUR

   BLUR DOES NOT CHECK THE ANSWER.
   ========================================================= */

numberInput.addEventListener(
    "blur",
    () => {

        updateSubmitState();

    }
);


/* =========================================================
   WORD INPUT

   Does NOT check the answer.
   ========================================================= */

wordsInput.addEventListener(
    "input",
    () => {

        /*
         * Allow ONLY English letters and spaces.
         * Remove numbers, hyphens and special characters.
         */
        let value =
            wordsInput.value.replace(
                /[^a-zA-Z\s]/g,
                ""
            );


        /*
         * Convert everything to lowercase.
         */
        value =
            value.toLowerCase();


        /*
         * Remove extra spaces.
         * Keep only single spaces between words.
         */
        value =
            value.replace(
                /\s+/g,
                " "
            );


        /*
         * Automatically capitalize ONLY
         * the first letter of the first word.
         *
         * Example:
         * "one hundred forty nine"
         * becomes
         * "One hundred forty nine"
         */
        if(value.length > 0){

            value =
                value.charAt(0).toUpperCase() +
                value.slice(1);

        }


        /*
         * Put the cleaned/ formatted value
         * back into the input box.
         */
        wordsInput.value =
            value;


        /*
         * If this input was previously wrong,
         * remove the wrong/edit visual state.
         */
        wordsInput.classList.remove(
            "wrong-input",
            "edit-input"
        );


        /*
         * Update Submit button.
         * This does NOT check the answer.
         */
        updateSubmitState();

    }
);


/* =========================================================
   WORD ENTER

   ENTER DOES NOT CHECK THE ANSWER.
   ========================================================= */

wordsInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

        }

    }
);


/* =========================================================
   WORD BLUR

   BLUR DOES NOT CHECK THE ANSWER.
   ========================================================= */

wordsInput.addEventListener(
    "blur",
    () => {

        updateSubmitState();

    }
);


/* =========================================================
   SUBMIT BUTTON

   THIS IS THE ONLY PLACE WHERE
   ANSWERS ARE CHECKED.
   ========================================================= */

submitBtn.addEventListener(
    "click",
    () => {

        if(answered[current]){
            return;
        }


        const numberValue =
            numberInput.value.trim();

        const wordsValue =
            wordsInput.value.trim();


        /*
         * Submit should normally already be disabled
         * when either box is empty.
         */

        if(
            numberValue === "" ||
            wordsValue === ""
        ){

            submitBtn.disabled =
                true;

            return;
        }


        /*
         * ONLY HERE do we check the answers.
         */

        checkCompleteAnswer();

    }
);


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

    const q =
        QUESTIONS[current];


    questionNumber.textContent =
        q.label;


    renderAbacus(q);


    clearInputStates();


    numberInput.disabled =
    false;

wordsInput.disabled =
    false;


    submitBtn.disabled =
        true;


    numberInput.value =
        "";

    wordsInput.value =
        "";


    /*
     * Restore answered question
     * when using Prev.
     */

    if(
        answered[current]
    ){

        numberInput.value =
            q.answer;


        wordsInput.value =
            q.words[0];


        numberInput.classList.add(
            "correct-input"
        );

        wordsInput.classList.add(
            "correct-input"
        );


        numberInput.disabled =
            true;

        wordsInput.disabled =
            true;

        submitBtn.disabled =
            true;

    }


    /*
     * Prev is available after Q1.
     */

    prevBtn.disabled =
        current === 0;


    /*
     * Next is available only after
     * the current question is fully correct.
     */

    nextBtn.disabled =
        !answered[current] ||
        current === total - 1;

}


/* =========================================================
   PREVIOUS
   ========================================================= */

prevBtn.addEventListener(
    "click",
    () => {

        if(
            current === 0
        ){

            return;
        }


        current--;

        renderQuestion();

    }
);


/* =========================================================
   NEXT
   ========================================================= */

nextBtn.addEventListener(
    "click",
    () => {

        /*
         * Do not move until both
         * answers are correct.
         */

        if(
            !answered[current]
        ){

            return;
        }


        if(
            current >= total - 1
        ){

            return;
        }


        current++;

        renderQuestion();

    }
);


/* =========================================================
   HOME
   ========================================================= */

homeBtn.addEventListener(
    "click",
    () => {

        window.location.href =
            "../Grade2_chapter2.html";

    }
);


/* =========================================================
   HINT
   ========================================================= */

hintBtn.addEventListener(
    "click",
    () => {

        hintText.textContent =
            QUESTIONS[current].hint;


        hintOverlay.classList.add(
            "show"
        );

    }
);


closeHintBtn.addEventListener(
    "click",
    () => {

        hintOverlay.classList.remove(
            "show"
        );

    }
);


hintOverlay.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            hintOverlay
        ){

            hintOverlay.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   INITIAL LOAD
   ========================================================= */

renderQuestion();

</script>


</body>
