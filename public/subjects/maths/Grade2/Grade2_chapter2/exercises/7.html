<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Write the before number of the given numbers.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Shared styles: title, home, hint, prev/next, popups, final popup -->
    <link rel="stylesheet" href="../assets/css/reuse.css">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
    </script>


    <style>
        /* =========================================================
           BASE STYLES
           ========================================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;
        }


        body {

            font-family: "Livvic", sans-serif;

            /* background: #fffdf5; */

            color: #1f2d3d;
        }


        button {

            font-family: "Livvic", sans-serif;
        }


        /* =========================================================
           MAIN QUIZ
           ========================================================= */

        .quiz {

            width: 100%;

            height: 100vh;
            height: 100dvh;

            display: flex;

            flex-direction: column;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            padding:
                clamp(7px, 1.2vh, 16px) clamp(14px, 3vw, 45px) clamp(5px, 0.8vh, 10px);
        }


        /* =========================================================
           TOP BAR
           ========================================================= */

        .topbar {
            position: relative;

            width: 100%;

            flex: 0 0 auto;

            display: grid;

            grid-template-columns:
                90px minmax(0, 1fr) 90px;

            align-items: start;

            gap: 10px;
        }


        /* =========================================================
           HOME / HINT BUTTONS
           ========================================================= */

        .icon-btn {

            width: 100%;

            border: 0;

            background: transparent;

            padding: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }


        .icon-circle {

            width:
                clamp(42px, 4.2vw, 62px);

            height:
                clamp(42px, 4.2vw, 62px);

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #fff;

            font-size:
                clamp(18px, 1.8vw, 27px);

            transition:
                transform .2s ease;
        }


        .icon-btn:hover .icon-circle {

            transform: scale(1.06);
        }


        .icon-circle.home {
            position: fixed;
            top: 10px;
            background:
                linear-gradient(145deg,
                    #8b6fe0,
                    #6f42c1);

            box-shadow:
                0 4px 0 #4f2e93;
        }


        .icon-circle.hint {
            position: fixed;
            top: 10px;
            background:
                linear-gradient(145deg,
                    #ffc94d,
                    #f7a800);

            box-shadow:
                0 4px 0 #c17e00;
        }


        /* =========================================================
           TITLE
           ========================================================= */

        .title-block {

            min-width: 0;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .title {

            width: 100%;

            margin: 0;

            text-align: center;

            color: #1f2d3d;

            font-size:
                clamp(21px, 2.7vw, 40px);

            line-height: 1.12;

            font-weight: 400;
        }


        /* =========================================================
           QUESTION AREA
           ========================================================= */

        .question-area {

            /* flex: 1 1 auto; */

            min-height: 0;

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            padding-top:
                clamp(8px, 2.2vh, 24px);

            gap:
                clamp(7px, 1.3vh, 15px);
                margin: 30px 0px 80px;
                padding-block: 10px;
        }


        /* =========================================================
           QUESTION ROW

           Q1.     APPLE        APPLE
                   248          249
           
           First apple is the answer apple.
           Second apple contains the given number.
           ========================================================= */

        .question-card {

            width:
                min(570px, 90%);

            display: flex;

            flex-direction: row;

            align-items: center;

            justify-content: center;

            gap:
                clamp(12px, 2vw, 28px);
        }


        /* =========================================================
           QUESTION LABEL
           ========================================================= */

        .question-label {

            flex: 0 0 auto;

            margin: 0;

            font-size:
                clamp(20px, 2vw, 30px);

            font-weight: 400;

            color: #1f2d3d;

            align-self: center;
        }


        /* =========================================================
           TWO QUESTION APPLES
           ========================================================= */

        .question-apples {

            display: flex;

            align-items: center;

            justify-content: center;

            gap:
                clamp(12px, 2.5vw, 36px);
        }


        .question-apple {

            position: relative;

            width:
                clamp(95px, 11vw, 150px);

            height:
                clamp(95px, 11vw, 150px);

            flex: 0 0 auto;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .question-apple img {

            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            pointer-events: none;

            user-select: none;

            -webkit-user-drag: none;
        }


        .question-number {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            padding-top:
                clamp(7px, 1vw, 14px);

            font-size:
                clamp(20px, 2.3vw, 34px);

            line-height: 1;

            font-weight: 400;

            color: #1f2d3d;

            pointer-events: none;
        }


        /* Empty answer apple */

        .empty-apple .question-number {

            color: #1f2d3d;
        }


        /* Given-number apple */

        .given-apple .question-number {

            color: #1f2d3d;
        }


        /* =========================================================
           ANSWER APPEAR ANIMATION
           ========================================================= */

        .answer-number-show {

            animation:
                answerPop .35s ease;
        }


        @keyframes answerPop {

            0% {

                opacity: 0;

                transform:
                    scale(.5);
            }

            70% {

                opacity: 1;

                transform:
                    scale(1.15);
            }

            100% {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        /* =========================================================
           OPTIONS TITLE
           ========================================================= */

        .options-title {

            margin: 0;

            font-size:
                clamp(15px, 1.4vw, 20px);

            font-weight: 500;

            color: #5b6570;

            text-align: center;
        }


        /* =========================================================
           OPTIONS
           ========================================================= */

        .options {

            width:
                min(820px, 94%);

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            align-items: center;

            justify-content: center;

            gap:
                clamp(10px, 3vw, 42px);
        }


        /* =========================================================
           APPLE OPTION
           ========================================================= */

        .apple-option {

            position: relative;

            width:
                clamp(100px, 12vw, 165px);

            aspect-ratio: 1 / 1;

            justify-self: center;

            border: 0;

            background: transparent;

            padding: 0;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            -webkit-tap-highlight-color: transparent;

            transition:
                transform .2s ease;
        }


        .apple-option img {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            pointer-events: none;

            user-select: none;

            -webkit-user-drag: none;
        }


        /* =========================================================
           NUMBER ON OPTION APPLE
           ========================================================= */

        .option-number {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            padding-top:
                clamp(8px, 1vw, 14px);

            font-size:
                clamp(18px, 2.2vw, 32px);

            line-height: 1;

            font-weight: 400;

            color: #1f2d3d;

            pointer-events: none;
        }


        /* =========================================================
           OPTION NUMBER LABEL
           ========================================================= */

        .option-label {

            position: absolute;

            bottom:
                clamp(-5px, -.5vw, -2px);

            left: 50%;

            transform:
                translateX(-50%);

            min-width:
                clamp(24px, 2.4vw, 34px);

            height:
                clamp(24px, 2.4vw, 34px);

            padding: 0 6px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #fff;

            border:
                2px solid #e9a14d;

            color: #d47722;

            font-size:
                clamp(11px, 1vw, 15px);

            font-weight: 700;

            box-shadow:
                0 2px 5px rgba(0, 0, 0, .08);

            z-index: 3;

            pointer-events: none;
        }


        /* =========================================================
           OPTION HOVER
           ========================================================= */

        .apple-option:hover {

            transform:
                translateY(-5px) scale(1.04);
        }


        /* =========================================================
           CORRECT OPTION
           ========================================================= */

        .apple-option.correct {

            transform:
                scale(1.06);
        }


        .apple-option.correct img {

            filter:
                drop-shadow(0 0 0.7rem rgba(66, 180, 75, .8));
        }


        .apple-option.correct::before {

            content: "✓";

            position: absolute;

            top: 3px;

            right: 3px;

            width:
                clamp(25px, 2.5vw, 38px);

            height:
                clamp(25px, 2.5vw, 38px);

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #43b94b;

            color: #fff;

            font-size:
                clamp(14px, 1.4vw, 21px);

            font-weight: 800;

            z-index: 5;

            box-shadow:
                0 3px 7px rgba(0, 0, 0, .15);
        }


        /* =========================================================
           WRONG OPTION
           ========================================================= */

        .apple-option.wrong {

            animation:
                appleShake .45s ease;
        }


        .apple-option.wrong img {

            filter:
                drop-shadow(0 0 0.6rem rgba(235, 65, 65, .65));
        }


        @keyframes appleShake {

            0%,
            100% {

                transform:
                    translateX(0);
            }

            25% {

                transform:
                    translateX(-8px);
            }

            50% {

                transform:
                    translateX(8px);
            }

            75% {

                transform:
                    translateX(-5px);
            }
        }


        /* =========================================================
           LOCKED OPTION
           ========================================================= */

        .apple-option.locked {

            cursor: default;

            pointer-events: none;
        }


        /* =========================================================
           HINT OVERLAY
           ========================================================= */

        .hint-overlay {

            position: fixed;

            inset: 0;

            z-index: 3500;

            display: none;

            align-items: center;

            justify-content: center;

            background:
                rgba(0, 0, 0, .25);

            padding: 20px;
        }


        .hint-overlay.show {

            display: flex;
        }


        .hint-box {

            width:
                min(420px, calc(100vw - 32px));

            padding:
                26px 28px;

            background: #fff;

            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, .18);

            animation:
                hintPop .35s ease;
        }


        .hint-box h3 {

            margin:
                0 0 10px;

            font-size:
                clamp(24px, 3vw, 32px);

            font-weight: 700;

            color: #e08e00;
        }


        .hint-box p {

            margin: 0;

            font-size:
                clamp(16px, 1.6vw, 21px);

            line-height: 1.45;

            color: #1f2d3d;
        }


        .hint-close {

            margin-top: 18px;

            min-width: 110px;

            height: 44px;

            border: none;

            border-radius: 24px;

            background:
                linear-gradient(145deg,
                    #ffc94d,
                    #f7a800);

            color: #fff;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 4px 0 #c17e00;
        }


        .hint-close:active {

            transform:
                translateY(3px);

            box-shadow:
                0 1px 0 #c17e00;
        }


        @keyframes hintPop {

            from {

                opacity: 0;

                transform:
                    scale(.85);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        /* =========================================================
           MEDIA QUERY 1
           TABLET
           ========================================================= */

        @media (min-width: 601px) and (max-width: 900px) {

            .quiz {

                padding:
                    7px 15px 5px;
            }


            .topbar {

                grid-template-columns:
                    65px minmax(0, 1fr) 65px;
            }


            .question-area {

                padding-top: 8px;

                gap: 7px;
            }


            .question-card {

                width: 80%;

                gap: 17px;
            }


            .question-label {

                font-size: 21px;
            }


            .question-apple {

                width: 105px;

                height: 105px;
            }


            .question-number {

                font-size: 23px;
            }


            .options-title {

                font-size: 14px;
            }


            .options {

                width: 88%;

                gap: 15px;
            }


            .apple-option {

                width: 105px;
            }


            .option-number {

                font-size: 22px;
            }

        }


        /* =========================================================
           MEDIA QUERY 2
           MOBILE
           ========================================================= */

        @media (min-width: 401px) and (max-width: 600px) {

            .quiz {

                padding:
                    6px 9px 4px;
            }


            .topbar {

                grid-template-columns:
                    48px minmax(0, 1fr) 48px;
            }


            .icon-circle {

                width: 38px;

                height: 38px;

                font-size: 16px;
            }


            .title {

                font-size:
                    clamp(16px, 4.3vw, 21px);
            }


            .question-area {

                padding-top: 6px;

                gap: 6px;
            }


            .question-card {

                width: 94%;

                gap: 9px;
            }


            .question-label {

                font-size: 17px;
            }


            .question-apples {

                gap: 9px;
            }


            .question-apple {

                width: 82px;

                height: 82px;
            }


            .question-number {

                font-size: 19px;
            }


            .options-title {

                font-size: 12px;
            }


            .options {

                width: 100%;

                gap: 2px;
            }


            .apple-option {

                width:
                    clamp(76px, 25vw, 105px);
            }


            .option-number {

                font-size:
                    clamp(15px, 5vw, 22px);
            }


            .option-label {

                width: 23px;

                height: 23px;

                min-width: 23px;

                font-size: 10px;
            }

        }


        /* =========================================================
           MEDIA QUERY 3
           VERY SMALL MOBILE
           ========================================================= */

        @media (max-width: 400px) {

            .quiz {

                padding:
                    5px 6px 3px;
            }


            .topbar {

                grid-template-columns:
                    40px minmax(0, 1fr) 40px;
            }


            .icon-circle {

                width: 34px;

                height: 34px;

                font-size: 14px;
            }


            .title {

                font-size: 14px;
            }


            .question-area {

                padding-top: 5px;

                gap: 5px;
            }


            .question-card {

                width: 98%;

                gap: 6px;
            }


            .question-label {

                font-size: 14px;
            }


            .question-apples {

                gap: 5px;
            }


            .question-apple {

                width: 70px;

                height: 70px;
            }


            .question-number {

                font-size: 16px;

                padding-top: 5px;
            }


            .options-title {

                font-size: 11px;
            }


            .options {

                gap: 0;
            }


            .apple-option {

                width:
                    clamp(67px, 25vw, 85px);
            }


            .option-number {

                font-size:
                    clamp(13px, 5vw, 18px);

                padding-top: 5px;
            }


            .option-label {

                width: 20px;

                height: 20px;

                min-width: 20px;

                font-size: 9px;

                border-width: 1.5px;
            }

        }


        /* =========================================================
           MEDIA QUERY 4
           SHORT SCREENS
           ========================================================= */

        @media (max-height: 520px) {

            .quiz {

                padding-top: 4px;

                padding-bottom: 3px;
            }


            .question-area {

                padding-top: 3px;

                gap: 3px;
            }


            .question-card {

                gap: 5px;
            }


            .question-apple {

                width: 65px;

                height: 65px;
            }


            .question-number {

                font-size: 16px;
            }


            .options-title {

                font-size: 11px;
            }


            .apple-option {

                width: 65px;
            }


            .option-number {

                font-size: 15px;
            }

        }


        /* =========================================================
           MEDIA QUERY 5
           LARGE DESKTOP
           ========================================================= */

        @media (min-width: 1200px) {

            .question-area {

                padding-top: 15px;

                gap: 10px;
            }


            .question-apple {

                width: 155px;

                height: 155px;
            }


            .options {

                width: 790px;
            }


            .apple-option {

                width: 155px;
            }

        }


        /* =========================================================
           MEDIA QUERY 6
           EXTRA LARGE DESKTOP
           ========================================================= */

        @media (min-width: 1440px) {

            .title {

                font-size: 40px;
            }


            .question-apple {

                width: 170px;

                height: 170px;
            }


            .question-number {

                font-size: 34px;
            }


            .apple-option {

                width: 170px;
            }


            .option-number {

                font-size: 32px;
            }
        }
    </style>

</head>


<body>


    <div class="quiz" id="quizCard">


        <!-- =====================================================
         TOP BAR
         ===================================================== -->

        <div class="topbar">


            <button class="icon-btn" id="homeBtn" aria-label="Home">

                <span class="icon-circle home">

                    <i class="fa-solid fa-house"></i>

                </span>

            </button>


            <div class="title-block">

                <h1 class="title">

                    Write the before number of the given numbers.

                </h1>

            </div>


            <button class="icon-btn" id="hintBtn" aria-label="Hint">

                <span class="icon-circle hint">

                    <i class="fa-solid fa-lightbulb"></i>

                </span>

            </button>


        </div>


        <!-- =====================================================
         QUESTION AREA
         ===================================================== -->

        <main class="question-area">


            <div class="question-card">


                <!-- Q1 / Q2 / Q3 / Q4 -->

                <p class="question-label" id="questionLabel">

                    Q1.

                </p>


                <div class="question-apples">


                    <!-- =================================================
                     FIRST APPLE
                     EMPTY BEFORE ANSWER
                     CORRECT ANSWER APPEARS HERE
                     ================================================= -->

                    <div class="question-apple empty-apple">


                        <img src="../assets/images/apple.png" alt="Answer apple">


                        <span class="question-number" id="answerNumber">
                        </span>


                    </div>


                    <!-- =================================================
                     SECOND APPLE
                     GIVEN NUMBER
                     ================================================= -->

                    <div class="question-apple given-apple">


                        <img src="../assets/images/apple.png" alt="Given number apple">


                        <span class="question-number" id="questionNumber">

                            249

                        </span>


                    </div>


                </div>


            </div>


            <p class="options-title">

                Choose the before number.

            </p>


            <!-- =====================================================
             THREE APPLE OPTIONS
             ===================================================== -->

            <div class="options" id="optionsContainer">
            </div>


        </main>


        <!-- =====================================================
         PREV / NEXT
         These use the shared reuse.css styling.
         ===================================================== -->

        <div class="controls">


            <button class="prev" id="prevBtn" disabled>

                <i class="fa-solid fa-circle-arrow-left"></i>

                Prev

            </button>


            <button class="next" id="nextBtn" disabled>

                Next

                <i class="fa-solid fa-circle-arrow-right"></i>

            </button>


        </div>


    </div>


    <!-- =========================================================
     HINT
     ========================================================= -->

    <div class="hint-overlay" id="hintOverlay">


        <div class="hint-box">


            <h3>
                Hint
            </h3>


            <p id="hintText">
            </p>


            <button class="hint-close" id="closeHintBtn">

                Got it!

            </button>


        </div>


    </div>


    <!-- =========================================================
     SAME ANSWER POPUP
     ========================================================= -->

    <div id="answerPopup" class="kid-popup">


        <div class="kid-card">


            <div class="kid-icon" id="popupIcon">
            </div>


            <h3 id="popupTitle">
            </h3>


            <p id="popupMsg">
            </p>


        </div>


    </div>


    <!-- =========================================================
     SAME FINAL POPUP
     ========================================================= -->

    <div id="finalPopup">


        <div class="final-kid-box">


            <h2>

                🎉

                <span>
                    Congratulations!
                </span>

            </h2>


            <p id="finalScore">
            </p>


            <div id="stars">
            </div>


            <button class="playAgain-btn" onclick="location.reload()">

                Play Again

            </button>


        </div>


    </div>


    <!-- =========================================================
     SOUNDS
     ========================================================= -->

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3">
    </audio>


    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3">
    </audio>


    <script>


        /* =========================================================
           APPLE IMAGE
           ========================================================= */

        const APPLE_SRC =
            "../assets/images/apple.png";


        /* =========================================================
           QUESTION DATA
           ========================================================= */

        const QUESTIONS = [

            {
                label: "Q1.",
                number: 249,
                answer: 248,

                options: [
                    248,
                    249,
                    250
                ],

                hint:
                    "Start at 249 and count one step back. The before number is 1 less."
            },


            {
                label: "Q2.",
                number: 576,
                answer: 575,

                options: [
                    574,
                    575,
                    576
                ],

                hint:
                    "Start at 576 and count one step back. The before number is 1 less."
            },


            {
                label: "Q3.",
                number: 900,
                answer: 899,

                options: [
                    899,
                    900,
                    901
                ],

                hint:
                    "Start at 900 and count one step back. The before number is 1 less."
            },


            {
                label: "Q4.",
                number: 814,
                answer: 813,

                options: [
                    812,
                    813,
                    814
                ],

                hint:
                    "Start at 814 and count one step back. The before number is 1 less."
            }

        ];


        const total =
            QUESTIONS.length;


        let current =
            0;


        let score =
            0;


        let answered =
            QUESTIONS.map(
                () => false
            );


        /* =========================================================
           DOM
           ========================================================= */

        const questionLabel =
            document.getElementById(
                "questionLabel"
            );


        const questionNumber =
            document.getElementById(
                "questionNumber"
            );


        const answerNumber =
            document.getElementById(
                "answerNumber"
            );


        const optionsContainer =
            document.getElementById(
                "optionsContainer"
            );


        const prevBtn =
            document.getElementById(
                "prevBtn"
            );


        const nextBtn =
            document.getElementById(
                "nextBtn"
            );


        const correctSound =
            document.getElementById(
                "correctSound"
            );


        const wrongSound =
            document.getElementById(
                "wrongSound"
            );


        const homeBtn =
            document.getElementById(
                "homeBtn"
            );


        const hintBtn =
            document.getElementById(
                "hintBtn"
            );


        const hintOverlay =
            document.getElementById(
                "hintOverlay"
            );


        const hintText =
            document.getElementById(
                "hintText"
            );


        const closeHintBtn =
            document.getElementById(
                "closeHintBtn"
            );


        /* =========================================================
           SPEECH
           ========================================================= */

        function speak(text) {

            if (
                !window.speechSynthesis
            ) {
                return;
            }


            speechSynthesis.cancel();


            const message =
                new SpeechSynthesisUtterance(
                    text
                );


            message.lang =
                "en-UK";


            message.volume =
                0.25;


            message.rate =
                1;


            message.pitch =
                1;


            speechSynthesis.speak(
                message
            );

        }


        /* =========================================================
           SOUND
           ========================================================= */

        function playSound(audio) {

            audio.currentTime =
                0;


            audio.play().catch(
                () => { }
            );

        }


        /* =========================================================
           CONFETTI
           ========================================================= */

        function smallConfetti() {

            if (
                !window.confetti
            ) {
                return;
            }


            confetti({

                particleCount: 40,

                spread: 65,

                origin: {
                    y: 0.7
                },

                scalar: 0.8

            });

        }


        /* =========================================================
           ANSWER POPUP
           ========================================================= */

        function showPopup(
            isCorrect
        ) {

            const popup =
                document.getElementById(
                    "answerPopup"
                );


            const icon =
                document.getElementById(
                    "popupIcon"
                );


            const title =
                document.getElementById(
                    "popupTitle"
                );


            const msg =
                document.getElementById(
                    "popupMsg"
                );


            popup.className =
                "kid-popup " +
                (
                    isCorrect
                        ? "kid-correct"
                        : "kid-wrong"
                );


            popup.style.display =
                "flex";


            if (isCorrect) {

                icon.textContent =
                    "🎉";


                title.textContent =
                    "Great Job!";


                msg.textContent =
                    "You got it right!";

            }

            else {

                icon.textContent =
                    "🥲";


                title.textContent =
                    "Oops!";


                msg.textContent =
                    "Try again, you can do it!";

            }


            clearTimeout(
                showPopup.timer
            );


            showPopup.timer =
                setTimeout(
                    () => {

                        popup.style.display =
                            "none";

                    },
                    1400
                );

        }


        /* =========================================================
           CREATE OPTION
           ========================================================= */

        function createOption(
            value,
            index
        ) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "apple-option";


            button.dataset.value =
                value;


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                APPLE_SRC;


            img.alt =
                "Apple";


            img.draggable =
                false;


            const number =
                document.createElement(
                    "span"
                );


            number.className =
                "option-number";


            number.textContent =
                value;


            const label =
                document.createElement(
                    "span"
                );


            label.className =
                "option-label";


            label.textContent =
                index + 1;


            button.appendChild(
                img
            );


            button.appendChild(
                number
            );


            button.appendChild(
                label
            );


            button.addEventListener(
                "click",
                () => {

                    validateOption(
                        button,
                        value
                    );

                }
            );


            return button;

        }


        /* =========================================================
           RENDER QUESTION
           ========================================================= */

        function renderQuestion() {

            const question =
                QUESTIONS[current];


            questionLabel.textContent =
                question.label;


            /* Given number */
            questionNumber.textContent =
                question.number;


            /* Empty answer apple */
            answerNumber.textContent =
                "";


            answerNumber.classList.remove(
                "answer-number-show"
            );


            optionsContainer.innerHTML =
                "";


            question.options.forEach(
                (
                    value,
                    index
                ) => {

                    const option =
                        createOption(
                            value,
                            index
                        );


                    optionsContainer.appendChild(
                        option
                    );

                }
            );


            /*
             * Restore the answered state
             * when returning to a question.
             */

            if (
                answered[current]
            ) {

                answerNumber.textContent =
                    question.answer;


                answerNumber.classList.add(
                    "answer-number-show"
                );


                const correctOption =
                    optionsContainer.querySelector(
                        `[data-value="${question.answer}"]`
                    );


                if (
                    correctOption
                ) {

                    correctOption.classList.add(
                        "correct",
                        "locked"
                    );

                }

            }


            updateNavigation();

        }


        /* =========================================================
           VALIDATE OPTION
           ========================================================= */

        function validateOption(
            option,
            value
        ) {

            if (
                answered[current]
            ) {
                return;
            }


            const question =
                QUESTIONS[current];


            /* =====================================================
               CORRECT ANSWER
               ===================================================== */

            if (
                value ===
                question.answer
            ) {

                option.classList.remove(
                    "wrong"
                );


                option.classList.add(
                    "correct"
                );


                option.classList.add(
                    "locked"
                );


                /*
                 * Put the correct option number
                 * inside the FIRST empty question apple.
                 */

                answerNumber.textContent =
                    question.answer;


                answerNumber.classList.remove(
                    "answer-number-show"
                );


                void answerNumber.offsetWidth;


                answerNumber.classList.add(
                    "answer-number-show"
                );


                answered[current] =
                    true;


                score++;


                playSound(
                    correctSound
                );


                speak(
                    "Correct"
                );


                showPopup(
                    true
                );


                smallConfetti();


                updateNavigation();


                /*
                 * Last question:
                 * final popup automatically.
                 */

                if (
                    current ===
                    total - 1
                ) {

                    setTimeout(
                        showFinal,
                        1100
                    );

                }


                return;

            }


            /* =====================================================
               WRONG ANSWER
               ===================================================== */

            option.classList.remove(
                "wrong"
            );


            void option.offsetWidth;


            option.classList.add(
                "wrong"
            );


            playSound(
                wrongSound
            );


            speak(
                "Try again"
            );


            showPopup(
                false
            );


            /*
             * Wrong option gets erased/reset.
             */

            setTimeout(
                () => {

                    option.classList.remove(
                        "wrong"
                    );

                },
                500
            );

        }


        /* =========================================================
           NAVIGATION
           ========================================================= */

        function updateNavigation() {

            prevBtn.disabled =
                current === 0;


            nextBtn.disabled =
                !answered[current] ||
                current === total - 1;

        }


        /* =========================================================
           PREVIOUS
           ========================================================= */

        prevBtn.addEventListener(
            "click",
            () => {

                if (
                    current === 0
                ) {
                    return;
                }


                current--;


                renderQuestion();

            }
        );


        /* =========================================================
           NEXT
           ========================================================= */

        nextBtn.addEventListener(
            "click",
            () => {

                if (
                    nextBtn.disabled
                ) {
                    return;
                }


                if (
                    current <
                    total - 1
                ) {

                    current++;


                    renderQuestion();

                }

            }
        );


        /* =========================================================
           HOME
           ========================================================= */

        homeBtn.addEventListener(
            "click",
            () => {

                window.top.location.href =
                    "../Grade2_chapter2.html";

            }
        );


        /* =========================================================
           HINT
           ========================================================= */

        hintBtn.addEventListener(
            "click",
            () => {

                hintText.textContent =
                    QUESTIONS[current].hint;


                hintOverlay.classList.add(
                    "show"
                );

            }
        );


        closeHintBtn.addEventListener(
            "click",
            () => {

                hintOverlay.classList.remove(
                    "show"
                );

            }
        );


        hintOverlay.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    hintOverlay
                ) {

                    hintOverlay.classList.remove(
                        "show"
                    );

                }

            }
        );


        /* =========================================================
           FINAL POPUP
           ========================================================= */

        function showFinal() {

            const finalPopup =
                document.getElementById(
                    "finalPopup"
                );


            document.getElementById(
                "finalScore"
            ).textContent =
                `Your Score: ${score} / ${total}`;


            /*
             * Always exactly THREE stars.
             */

            document.getElementById(
                "stars"
            ).textContent =
                "⭐⭐⭐";


            finalPopup.style.display =
                "flex";


            if (
                window.confetti
            ) {

                confetti({

                    particleCount: 150,

                    spread: 100,

                    origin: {
                        y: 0.5
                    }

                });


                setTimeout(
                    () => {

                        confetti({

                            particleCount: 100,

                            spread: 70,

                            origin: {
                                y: 0.6
                            }

                        });

                    },
                    300
                );

            }

        }


        /* =========================================================
           START
           ========================================================= */

        renderQuestion();

    </script>

</body>

</html>
