<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>Write the before number of the given numbers.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Shared styles: title, home, hint, prev/next, popups, final popup -->
    <link
        rel="stylesheet"
        href="../assets/css/reuse.css">

    <script
        src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
    </script>

<style>
    /* =========================================================
   BASE / RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;
    overscroll-behavior: none;
}

body {
     background-image: url("../assets/images/bg.png");
    /* color: #1f2d3d; */
    font-family: inherit;

    /*
     * Prevent horizontal overflow caused by
     * browser rounding / transformed elements.
     */
    max-width: 100vw;
}

button {
    font-family: inherit;
}


/* =========================================================
   MAIN PAGE
   ========================================================= */

.butterfly-quiz {
    width: 100%;
    max-width: 100vw;

    height: 100vh;
    height: 100dvh;

    min-height: 0;

    display: flex;
    flex-direction: column;

    overflow: hidden;

    padding:
        clamp(5px, 1vh, 12px)
        clamp(10px, 2.5vw, 40px)
        clamp(4px, 1vh, 10px);
}


/* =========================================================
   TOP AREA
   ========================================================= */

.quiz-top {
    width: 100%;
    max-width: 100%;

    flex: 0 0 auto;

    display: grid;

    grid-template-columns:
        70px
        minmax(0, 1fr)
        70px;

    align-items: start;

    gap: 8px;
}


/* =========================================================
   HOME / HINT POSITION
   Appearance remains controlled by reuse.css
   ========================================================= */

/* =========================================================
   TOP AREA
   Home / Hint appearance is 100% from reuse.css
   ========================================================= */

.quiz-top {
    width: 100%;
    max-width: 100%;

    flex: 0 0 auto;

    display: grid;

    grid-template-columns:
        90px
        minmax(0, 1fr)
        90px;

    align-items: start;

    gap: 10px;
}


/* =========================================================
   HOME + HINT BUTTONS
   ========================================================= */

.quiz-top > .quiz-icon-btn {
    width: 100%;
    height: 62px;

    margin: 0;
    padding: 0;

    border: 0;
    outline: none;

    background: transparent !important;

    display: flex;
    align-items: flex-start;

    position: relative;
    z-index: 100;

    cursor: pointer;

    appearance: none;
    -webkit-appearance: none;

    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   HOME - LEFT
   ========================================================= */

.quiz-top > .home-btn {
    justify-content: flex-start;
}


/* =========================================================
   HINT - RIGHT
   ========================================================= */

.quiz-top > .hint-btn {
    justify-content: flex-end;
}


/* =========================================================
   CIRCLE
   ========================================================= */

.quiz-top > .quiz-icon-btn .quiz-icon-circle {

    width: clamp(44px, 4.2vw, 62px);
    height: clamp(44px, 4.2vw, 62px);

    min-width: clamp(44px, 4.2vw, 62px);
    min-height: clamp(44px, 4.2vw, 62px);

    flex-shrink: 0;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    /* color: #ffffff !important; */

    font-size: clamp(19px, 1.8vw, 27px);

    line-height: 1;

    position: relative;
    z-index: 101;

    box-sizing: border-box;

    opacity: 1 !important;
    visibility: visible !important;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}


/* =========================================================
   HOME COLOR
   ========================================================= */

.quiz-top > .home-btn .home-icon {

    background:
        linear-gradient(
            145deg,
            #8b6fe0,
            #6f42c1
        ) !important;

    /* border: 3px solid #ffffff !important; */

   
}


/* =========================================================
   HINT COLOR
   ========================================================= */

.quiz-top > .hint-btn .hint-icon {

    background:
        linear-gradient(
            145deg,
            #ffc94d,
            #f7a800
        ) !important;
/* 
    border: 3px solid #ffffff !important; */

    box-shadow:
        0 4px 0 #c17e00,
        0 7px 14px rgba(193, 126, 0, .25) !important;
}


/* =========================================================
   ICON
   ========================================================= */

.quiz-top > .quiz-icon-btn .quiz-icon-circle i {

    display: inline-block !important;

    color: #ffffff !important;

    opacity: 1 !important;
    visibility: visible !important;

    line-height: 1;
}


/* =========================================================
   HOVER
   ========================================================= */

.quiz-top > .quiz-icon-btn:hover .quiz-icon-circle {

    transform:
        translateY(-2px)
        scale(1.06);
}


/* =========================================================
   CLICK
   ========================================================= */

.quiz-top > .quiz-icon-btn:active .quiz-icon-circle {

    transform:
        translateY(2px)
        scale(.97);
}

/* =========================================================
   TITLE
   ========================================================= */

.quiz-title {
    width: 100%;
    max-width: 100%;

    margin: 0;

    text-align: center;

    font-size:30px;

    line-height: 1.12;

    font-weight: 400;

    color: #1f2d3d;
     transform: translateY(12px);

    /*
     * Prevent long title from creating overflow.
     */
    overflow-wrap: normal;
}


/* =========================================================
   MAIN QUESTION AREA
   ========================================================= */

.question-area {
    flex: 1 1 auto;

    min-width: 0;
    min-height: 0;

    width: 100%;
    max-width: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;

    /*
     * Main vertical centering.
     */
    justify-content: center;

    overflow: hidden;

    padding:
        clamp(5px, 1vh, 15px)
        0;

    /*
     * Space between:
     * question row
     * and options
     */
    gap:
        clamp(12px, 2.5vh, 30px);
}


/* =========================================================
   QUESTION ROW
   ========================================================= */

.question-row {
    width: min(850px, 96vw);
    max-width: 100%;

    min-width: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    gap:
        clamp(12px, 3vw, 40px);

    flex: 0 1 auto;
}


/* =========================================================
   QUESTION LABEL
   ========================================================= */

.question-label {
    flex: 0 0 auto;

    margin: 0;

    font-size:30px;

    line-height: 1;

    /* font-weight: 700; */
 color: #2f4f4f;
     transform: translateY(-12px);
}


/* =========================================================
   BUTTERFLY PAIR
   ========================================================= */

.butterfly-pair {
    min-width: 0;
    max-width: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    gap:
        clamp(15px, 3.5vw, 48px);
}
/* =========================================================
   BUTTERFLY MOVING EFFECT
   Gentle floating + slight wing-like tilt
   ========================================================= */

.question-butterfly img,
.butterfly-option img {
    transform-origin: center center;

    animation:
        butterflyFloat 2.8s ease-in-out infinite;
}


/* Main question butterflies move slightly differently */

.question-butterfly:nth-child(1) img {
    animation-delay: 0s;
}

.question-butterfly:nth-child(2) img {
    animation-delay: .7s;
}


/* Answer butterflies */

.butterfly-option:nth-child(1) img {
    animation-delay: .2s;
}

.butterfly-option:nth-child(2) img {
    animation-delay: .8s;
}

.butterfly-option:nth-child(3) img {
    animation-delay: 1.4s;
}


/* =========================================================
   FLOATING BUTTERFLY ANIMATION
   ========================================================= */

@keyframes butterflyFloat {

    0% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    25% {
        transform:
            translateY(-6px)
            rotate(-2deg);
    }

    50% {
        transform:
            translateY(-10px)
            rotate(2deg);
    }

    75% {
        transform:
            translateY(-5px)
            rotate(-1.5deg);
    }

    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }
}


/* =========================================================
   MAIN QUESTION BUTTERFLY
   ========================================================= */

.question-butterfly {
    position: relative;

    /*
     * Width AND height use viewport units.
     * This prevents the butterfly from becoming
     * too tall on short screens.
     */
    width:
        clamp(
            105px,
            min(15vw, 18vh),
            205px
        );

    height:
        clamp(
            84px,
            min(12vw, 15vh),
            165px
        );

    flex: 0 1 auto;

    display: flex;

    align-items: center;
    justify-content: center;

    min-width: 0;
}

.question-butterfly img {
    width: 100%;
    height: 100%;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    display: block;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================================================
   NUMBER INSIDE QUESTION BUTTERFLY
   ========================================================= */

.question-number {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 55%;
    height: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding-top: 2px;

    font-size:
        clamp(
            18px,
            min(2.5vw, 4vh),
            35px
        );

    line-height: 1;

    font-weight: 400;

    color: #1f2d3d;

    pointer-events: none;
}


/* =========================================================
   ANSWER ANIMATION
   ========================================================= */

.answer-show {
    animation:
        answerPop .35s ease;
}

@keyframes answerPop {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.45);
    }

    70% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.12);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


/* =========================================================
   OPTIONS AREA
   ========================================================= */

.options-area {
    width: min(900px, 96vw);
    max-width: 100%;

    min-width: 0;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap:
        clamp(5px, 1.2vh, 14px);

    flex: 0 1 auto;
}


/* =========================================================
   OPTIONS TITLE
   ========================================================= */

.options-title {
    width: 100%;
    max-width: 100%;

    margin: 0;

    text-align: center;

    font-size:
        clamp(14px, 1.4vw, 19px);

    line-height: 1.1;

    color: #59636e;

    font-weight: 500;
}


/* =========================================================
   OPTIONS GRID
   ========================================================= */

.options {
    width: 100%;
    max-width: 100%;

    min-width: 0;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    align-items: center;

    justify-content: center;

    gap:
        clamp(8px, 3.5vw, 48px);
}


/* =========================================================
   OPTION BUTTERFLY
   ========================================================= */

.butterfly-option {
    position: relative;

    width:
        clamp(
            95px,
            min(14vw, 16vh),
            195px
        );

    height:
        clamp(
            76px,
            min(11.5vw, 13.5vh),
            155px
        );

    max-width: 100%;

    justify-self: center;

    border: 0;

    padding: 0;

    background: transparent;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    transition:
        transform .2s ease;

    -webkit-tap-highlight-color: transparent;
}

.butterfly-option img {
    width: 100%;
    height: 100%;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    display: block;

    pointer-events: none;

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================================================
   OPTION NUMBER
   ========================================================= */

.option-number {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 55%;
    height: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding-top: 2px;

    font-size:
        clamp(
            17px,
            min(2.3vw, 3.5vh),
            33px
        );

    line-height: 1;

    font-weight: 400;

    color: #1f2d3d;

    pointer-events: none;
}


/* =========================================================
   OPTION INDEX
   ========================================================= */

.option-index {
    position: absolute;

    left: 50%;
    bottom: 0;

    transform:
        translateX(-50%);

    width:
        clamp(22px, 2.4vw, 34px);

    height:
        clamp(22px, 2.4vw, 34px);

    min-width:
        clamp(22px, 2.4vw, 34px);

    padding: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #fff;

    border:
        2px solid #e8a05a;

    color: #d87a26;

    font-size:
        clamp(9px, 1vw, 14px);

    font-weight: 700;

    z-index: 5;

    pointer-events: none;
}


/* =========================================================
   HOVER
   ========================================================= */

.butterfly-option:hover {
    transform:
        translateY(-4px)
        scale(1.03);
}


/* =========================================================
   CORRECT
   ========================================================= */

.butterfly-option.correct {
    transform:
        scale(1.04);
}

.butterfly-option.correct img {
    filter:
        drop-shadow(
            0 0 8px
            rgba(67, 185, 75, .7)
        );
}

.butterfly-option.correct::after {
    content: "✓";

    position: absolute;

    right: 3px;
    top: 3px;

    width:
        clamp(24px, 2.5vw, 38px);

    height:
        clamp(24px, 2.5vw, 38px);

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #43b94b;

    color: #fff;

    font-size:
        clamp(13px, 1.5vw, 21px);

    font-weight: 800;

    z-index: 10;

    box-shadow:
        0 3px 7px rgba(0, 0, 0, .15);
}


/* =========================================================
   WRONG
   ========================================================= */

.butterfly-option.wrong {
    animation:
        shake .4s ease;
}

.butterfly-option.wrong img {
    filter:
        drop-shadow(
            0 0 7px
            rgba(230, 55, 55, .65)
        );
}

@keyframes shake {

    0%,
    100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-6px);
    }

    50% {
        transform: translateX(6px);
    }

    75% {
        transform: translateX(-4px);
    }
}

.butterfly-option.locked {
    pointer-events: none;

    cursor: default;
}


/* =========================================================
   HINT
   ========================================================= */

.hint-overlay {
    position: fixed;

    inset: 0;

    z-index: 5000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0, 0, 0, .25);
}

.hint-overlay.show {
    display: flex;
}

.hint-box {
    width:
        min(420px, calc(100vw - 30px));

    max-height:
        calc(100dvh - 30px);

    overflow: auto;

    padding: 25px;

    border-radius: 22px;

    background: #fff;

    text-align: center;

    box-shadow:
        0 12px 35px
        rgba(0, 0, 0, .2);
}

.hint-box h3 {
    margin:
        0 0 10px;

    font-size:
        clamp(22px, 3vw, 30px);

    color: #e49a00;
}

.hint-box p {
    margin: 0;

    font-size:
        clamp(16px, 1.7vw, 21px);

    line-height: 1.4;
}

.hint-close {
    margin-top: 18px;

    min-width: 105px;

    height: 42px;

    border: 0;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #ffc94d,
            #f6a900
        );

    color: #fff;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;
}


/* =========================================================
   MEDIA QUERY 1
   TABLET
   ========================================================= */

@media (min-width: 601px) and (max-width: 900px) {

    .butterfly-quiz {
        padding:
            5px
            12px
            4px;
    }

    .quiz-top {
        grid-template-columns:
            55px
            minmax(0, 1fr)
            55px;
    }

    .quiz-title {
        font-size: 23px;
    }

        gap: 16px;

        padding-bottom: 5px;
    }

    .question-label {
        font-size: 30px;
    }

        transform: translateY(-8px);

    .butterfly-pair {

    .question-butterfly {
        width:

        font-size: 13px;
    }

    .options {

    }

    .butterfly-option {
        width:
            clamp(
                95px,
                15vw,
                125px
            );

        height:
            clamp(
                76px,
                12.5vw,
                100px

}

                58px,

            );

            );
    }

     .quiz-top > .quiz-icon-btn {

        font-size: 14px;

        border-width: 2px !important;

        box-shadow:
            0 3px 0 rgba(0,0,0,.18) !important;
    }
}


/* =========================================================
   MEDIA QUERY 4
   SHORT SCREENS
   ========================================================= */

@media (max-height: 600px) and (min-width: 601px) {

    .butterfly-quiz {
        padding-top: 3px;
        padding-bottom: 2px;
    }

    .quiz-title {
        font-size:30px;
    }

    .question-area {
        gap: 8px;

        padding-top: 2px;
        padding-bottom: 2px;
    }

    .question-row {
        gap: 12px;
    }

    .question-butterfly {
        width:
            clamp(
                100px,
                min(13vw, 19vh),
                145px
            );

        height:
            clamp(
                80px,
                min(10.5vw, 16vh),
                116px
            );
    }

    .question-number {
        font-size: 23px;
    }

    .options-area {
        gap: 3px;
    }

    .options-title {
        font-size: 12px;
    }

    .butterfly-option {
        width:
            clamp(
                90px,
                min(12vw, 17vh),
                130px
            );

        height:
            clamp(
                72px,
                min(10vw, 14vh),
                104px
            );
    }

    .option-number {
        font-size: 21px;
    }
}


/* =========================================================
   MEDIA QUERY 5
   LARGE DESKTOP
   ========================================================= */

@media (min-width: 1200px) {

    .question-area {
        gap: 25px;

        padding-top: 10px;
        padding-bottom: 10px;
    }

    .question-row {
        width: 900px;
    }

    .question-label {
        font-size: 30px;
    }

    .butterfly-pair {
        gap: 45px;
    }

    .question-butterfly {
        width:
            clamp(
                165px,
                min(15vw, 22vh),
                190px
            );

        height:
            clamp(
                132px,
                min(12vw, 18vh),
                152px
            );
    }

    .question-number {
        font-size: 32px;
    }

    .options-area {
        width: 850px;

        gap: 10px;
    }

    .options {
        gap: 32px;
    }

    .butterfly-option {
        width:
            clamp(
                155px,
                min(14vw, 19vh),

            );

                124px,

            );
    }

    .option-number {

    }

    .option-index {

}


/* =========================================================
   MEDIA QUERY 6
   EXTRA LARGE DESKTOP
   ========================================================= */

@media (min-width: 1440px) {
    .quiz-title{
        font-size: 40px !important;
    }

    .question-row {
        width: 1200px;
    }


    .question-label {
        font-size: 40px;
    }


    .butterfly-pair {
        gap: 75px;
    }


    /* BIG QUESTION BUTTERFLIES */

    .question-butterfly {

        width: 270px;
        height: 300px;
    }


    .question-number {
        font-size: 46px;
    }


    /* BIG OPTION BUTTERFLIES */

    }


    .options {
        gap: 70px;
    }


    .butterfly-option {

        width: 235px;
        height: 188px;
    }


    .option-number {
        font-size: 42px;
    }


    .option-index {

        width: 38px;
        height: 38px;

        min-width: 38px;

        font-size: 15px;
    }
}
/* =========================================================
   1600px+ DESKTOP
   EXTRA LARGE BUTTERFLIES
   ========================================================= */

@media (min-width: 1600px) {

    /* Keep the entire worksheet inside the viewport */
    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden !important;
    }

    .butterfly-quiz {
        width: 100%;
        height: 100vh;
        height: 100dvh;

        overflow: hidden !important;

        padding:
            8px
            45px
            5px;
    }


    /* =========================
       QUESTION ROW
       ========================= */

    .question-row {
        width: 1250px;
        max-width: 95vw;

        gap: 55px;
    }

    .question-label {
        font-size: 40px;
    }


    /* =========================
       MAIN BUTTERFLIES
       ========================= */

    .butterfly-pair {
        gap: 90px;
    }

    .question-butterfly {
        width: 300px;
        height: 240px;

        flex-shrink: 0;
    }

    .question-number {
        font-size: 50px;
    }


    /* =========================
       OPTIONS
       ========================= */

    .options-area {
        width: 1300px;
        max-width: 95vw;

        gap: 10px;
    }

    .options {
        width: 100%;

        gap: 80px;
    }


    /* =========================
       OPTION BUTTERFLIES
       ========================= */

    .butterfly-option {
        width: 260px;
        height: 208px;

        flex-shrink: 0;
    }

    .option-number {
        font-size: 44px;
    }


    /* =========================
       OPTION INDEX
       ========================= */

    .option-index {
        width: 40px;
        height: 40px;
        min-width: 40px;

        font-size: 16px;
    }


    /* =========================
       TITLE
       ========================= */

    .quiz-title {
        font-size: 42px;
    }


    /* =========================
       OPTIONS TITLE
       ========================= */

    .options-title {
        font-size: 22px;
    }
}
</style>

</head>


<body>


<div class="butterfly-quiz">


    <!-- =====================================================
         TOP
         ===================================================== -->
<div class="quiz-top">

    <!-- HOME BUTTON -->
    <button
        type="button"
        id="homeBtn"
        class="quiz-icon-btn home-btn"
        aria-label="Home">

        <span class="quiz-icon-circle home-icon">
            <i class="fa-solid fa-house"></i>
        </span>

    </button>


    <!-- TITLE -->
    <div>
        <h1 class="quiz-title">
            Write the after number of the given numbers.
        </h1>
    </div>


    <!-- HINT BUTTON -->
    <button
        type="button"
        id="hintBtn"
        class="quiz-icon-btn hint-btn"
        aria-label="Hint">

        <span class="quiz-icon-circle hint-icon">
            <i class="fa-solid fa-lightbulb"></i>
        </span>

    </button>

</div>


    <!-- =====================================================
         QUESTION
         ===================================================== -->

    <main class="question-area">


        <div class="question-row">


            <!-- Q1 / Q2 / Q3 / Q4 -->

            <p
                class="question-label"
                id="questionLabel">

                Q1.

            </p>


            <div class="butterfly-pair">


                <!-- =================================================
                     FIRST BUTTERFLY
                     GIVEN NUMBER
                     ================================================= -->

                <div class="question-butterfly">


                    <img
                        src="../assets/images/butterfly.png"
                        alt="Butterfly">


                    <span
                        class="question-number"
                        id="givenNumber">
                    </span>


                </div>


                <!-- =================================================
                     SECOND BUTTERFLY
                     ANSWER APPEARS HERE
                     ================================================= -->

                <div class="question-butterfly">


                    <img
                        src="../assets/images/butterfly.png"
                        alt="Butterfly">


                    <span
                        class="question-number"
                        id="answerNumber">
                    </span>


                </div>


            </div>


        </div>


        <!-- =====================================================
             OPTIONS
             ===================================================== -->

        <div class="options-area">


            <p class="options-title">

                Choose the after number.

            </p>


            <div
                class="options"
                id="optionsContainer">
            </div>


        </div>


    </main>


    <!-- =====================================================
         SHARED PREV / NEXT
         ===================================================== -->

    <div class="controls">


        <button
            id="prevBtn"
            class="prev"
            disabled>
 <i class="fa-solid fa-circle-arrow-left"></i>
            Prev

        </button>


        <button
            id="nextBtn"
            class="next"
            disabled>

            Next
 <i class="fa-solid fa-circle-arrow-right"></i>
        </button>


    </div>


</div>


<!-- =========================================================
     HINT
     ========================================================= -->

<div
    class="hint-overlay"
    id="hintOverlay">


    <div class="hint-box">


        <h3>
            Hint
        </h3>


        <p id="hintText">
        </p>


        <button
            class="hint-close"
            id="closeHintBtn">

            Got it!

        </button>


    </div>


</div>


<!-- =========================================================
     ANSWER POPUP
     ========================================================= -->

<div
    id="answerPopup"
    class="kid-popup">


    <div class="kid-card">


        <div
            class="kid-icon"
            id="popupIcon">
        </div>


        <h3
            id="popupTitle">
        </h3>


        <p
            id="popupMsg">
        </p>


    </div>


</div>


<!-- =========================================================
     FINAL POPUP
     ========================================================= -->

<div id="finalPopup">


    <div class="final-kid-box">


        <h2>

            🎉

            <span>
                Congratulations!
            </span>

        </h2>


        <p id="finalScore">
        </p>


        <div id="stars">
            ⭐⭐⭐
        </div>


        <button
            class="playAgain-btn"
            onclick="location.reload()">

            Play Again

        </button>


    </div>


</div>


<!-- =========================================================
     SOUNDS
     ========================================================= -->

<audio
    id="correctSound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3">
</audio>


<audio
    id="wrongSound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3">
</audio>


<script>


/* =========================================================
   DATA FROM IMAGE
   ========================================================= */

const QUESTIONS = [

    {
        label: "Q1.",
        number: 138,
        answer: 139,

        options: [
            138,
            139,
            140
        ],

        hint:
            "Start at 138 and count one step forward. The after number is 1 more."
    },


    {
        label: "Q2.",
        number: 409,
        answer: 410,

        options: [
            408,
            410,
            411
        ],

        hint:
            "Start at 409 and count one step forward. The after number is 1 more."
    },


    {
        label: "Q3.",
        number: 716,
        answer: 717,

        options: [
            716,
            717,
            718
        ],

        hint:
            "Start at 716 and count one step forward. The after number is 1 more."
    },


    {
        label: "Q4.",
        number: 654,
        answer: 655,

        options: [
            653,
            654,
            655
        ],

        hint:
            "Start at 654 and count one step forward. The after number is 1 more."
    }

];


const BUTTERFLY_SRC =
    "../assets/images/butterfly.png";


let current =
    0;


let score =
    0;


const answered =
    QUESTIONS.map(
        () => false
    );


const questionLabel =
    document.getElementById(
        "questionLabel"
    );


const givenNumber =
    document.getElementById(
        "givenNumber"
    );


const answerNumber =
    document.getElementById(
        "answerNumber"
    );


const optionsContainer =
    document.getElementById(
        "optionsContainer"
    );


const prevBtn =
    document.getElementById(
        "prevBtn"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const correctSound =
    document.getElementById(
        "correctSound"
    );


const wrongSound =
    document.getElementById(
        "wrongSound"
    );


/* =========================================================
   SOUND
   ========================================================= */

function playSound(audio) {

    audio.currentTime = 0;

    audio.play().catch(
        () => {}
    );

}


/* =========================================================
   SPEECH
   ========================================================= */

function speak(text) {

    if (
        !window.speechSynthesis
    ) {
        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "en-UK";


    utterance.volume =
        0.25;


    utterance.rate =
        1;


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   SMALL CONFETTI
   ========================================================= */

function smallConfetti() {

    if (
        !window.confetti
    ) {
        return;
    }


    confetti({

        particleCount: 35,

        spread: 65,

        origin: {
            y: .7
        },

        scalar: .8

    });

}


/* =========================================================
   POPUP
   ========================================================= */

function showPopup(
    correct
) {

    const popup =
        document.getElementById(
            "answerPopup"
        );


    const icon =
        document.getElementById(
            "popupIcon"
        );


    const title =
        document.getElementById(
            "popupTitle"
        );


    const message =
        document.getElementById(
            "popupMsg"
        );


    popup.className =
        "kid-popup " +
        (
            correct
                ? "kid-correct"
                : "kid-wrong"
        );


    popup.style.display =
        "flex";


    if (correct) {

        icon.textContent =
            "🎉";

        title.textContent =
            "Great Job!";

        message.textContent =
            "You got it right!";

    }

    else {

        icon.textContent =
            "🥲";

        title.textContent =
            "Oops!";

        message.textContent =
            "Try again!";

    }


    clearTimeout(
        showPopup.timer
    );


    showPopup.timer =
        setTimeout(
            () => {

                popup.style.display =
                    "none";

            },
            1300
        );

}


/* =========================================================
   CREATE BUTTERFLY OPTION
   ========================================================= */

function createOption(
    value,
    index
) {

    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";


    button.className =
        "butterfly-option";


    button.dataset.value =
        value;


    const image =
        document.createElement(
            "img"
        );


    image.src =
        BUTTERFLY_SRC;


    image.alt =
        "Butterfly";


    image.draggable =
        false;


    const number =
        document.createElement(
            "span"
        );


    number.className =
        "option-number";


    number.textContent =
        value;


    const optionIndex =
        document.createElement(
            "span"
        );


    optionIndex.className =
        "option-index";


    optionIndex.textContent =
        index + 1;


    button.appendChild(
        image
    );


    button.appendChild(
        number
    );


    button.appendChild(
        optionIndex
    );


    button.addEventListener(
        "click",
        () => {

            validateAnswer(
                button,
                value
            );

        }
    );


    return button;

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion() {

    const question =
        QUESTIONS[current];


    questionLabel.textContent =
        question.label;


    /* First butterfly */
    givenNumber.textContent =
        question.number;


    /* Second butterfly is initially empty */
    answerNumber.textContent =
        "";


    answerNumber.classList.remove(
        "answer-show"
    );


    optionsContainer.innerHTML =
        "";


    question.options.forEach(
        (
            value,
            index
        ) => {

            const option =
                createOption(
                    value,
                    index
                );


            optionsContainer.appendChild(
                option
            );

        }
    );


    /*
     * Restore answer if this question
     * was already completed.
     */

    if (
        answered[current]
    ) {

        answerNumber.textContent =
            question.answer;


        answerNumber.classList.add(
            "answer-show"
        );


        const correctOption =
            optionsContainer.querySelector(
                `[data-value="${question.answer}"]`
            );


        if (
            correctOption
        ) {

            correctOption.classList.add(
                "correct",
                "locked"
            );

        }

    }


    updateNavigation();

}


/* =========================================================
   VALIDATE
   ========================================================= */

function validateAnswer(
    option,
    value
) {

    if (
        answered[current]
    ) {
        return;
    }


    const question =
        QUESTIONS[current];


    /* =====================================================
       CORRECT
       ===================================================== */

    if (
        value ===
        question.answer
    ) {

        option.classList.add(
            "correct",
            "locked"
        );


        /*
         * Put selected correct number
         * into SECOND butterfly.
         */

        answerNumber.textContent =
            question.answer;


        answerNumber.classList.remove(
            "answer-show"
        );


        void answerNumber.offsetWidth;


        answerNumber.classList.add(
            "answer-show"
        );


        answered[current] =
            true;


        score++;


        playSound(
            correctSound
        );


        speak(
            "Correct"
        );


        showPopup(
            true
        );


        smallConfetti();


        updateNavigation();


        /*
         * Show final popup after Q4.
         */

        if (
            current ===
            QUESTIONS.length - 1
        ) {

            setTimeout(
                showFinal,
                1100
            );

        }


        return;

    }


    /* =====================================================
       WRONG
       ===================================================== */

    option.classList.remove(
        "wrong"
    );


    void option.offsetWidth;


    option.classList.add(
        "wrong"
    );


    playSound(
        wrongSound
    );


    speak(
        "Try again"
    );


    showPopup(
        false
    );


    /*
     * Wrong option gets cleared.
     */

    setTimeout(
        () => {

            option.classList.remove(
                "wrong"
            );

        },
        450
    );

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function updateNavigation() {

    prevBtn.disabled =
        current === 0;


    nextBtn.disabled =
        !answered[current] ||
        current ===
        QUESTIONS.length - 1;

}


/* =========================================================
   PREVIOUS
   ========================================================= */

prevBtn.addEventListener(
    "click",
    () => {

        if (
            current <= 0
        ) {
            return;
        }


        current--;


        renderQuestion();

    }
);


/* =========================================================
   NEXT
   ========================================================= */

nextBtn.addEventListener(
    "click",
    () => {

        if (
            nextBtn.disabled
        ) {
            return;
        }


        if (
            current <
            QUESTIONS.length - 1
        ) {

            current++;


            renderQuestion();

        }

    }
);


/* =========================================================
   HOME
   ========================================================= */

document
    .getElementById("homeBtn")
    .addEventListener(
        "click",
        () => {

           window.top.location.href =
    "../Grade2_chapter2.html";

        }
    );


/* =========================================================
   HINT
   ========================================================= */

const hintBtn =
    document.getElementById(
        "hintBtn"
    );


const hintOverlay =
    document.getElementById(
        "hintOverlay"
    );


const hintText =
    document.getElementById(
        "hintText"
    );


const closeHintBtn =
    document.getElementById(
        "closeHintBtn"
    );


hintBtn.addEventListener(
    "click",
    () => {

        hintText.textContent =
            QUESTIONS[current].hint;


        hintOverlay.classList.add(
            "show"
        );

    }
);


closeHintBtn.addEventListener(
    "click",
    () => {

        hintOverlay.classList.remove(
            "show"
        );

    }
);


hintOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            hintOverlay
        ) {

            hintOverlay.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   FINAL POPUP
   ========================================================= */

function showFinal() {

    const finalPopup =
        document.getElementById(
            "finalPopup"
        );


    document.getElementById(
        "finalScore"
    ).textContent =
        `Your Score: ${score} / ${QUESTIONS.length}`;


    /*
     * Always exactly 3 stars.
     */

    document.getElementById(
        "stars"
    ).textContent =
        "⭐⭐⭐";


    finalPopup.style.display =
        "flex";


    if (
        window.confetti
    ) {

        confetti({

            particleCount: 150,

            spread: 100,

            origin: {
                y: .5
            }

        });


        setTimeout(
            () => {

                confetti({

                    particleCount: 100,

                    spread: 70,

                    origin: {
                        y: .6
                    }

                });

            },
            300
        );

    }

}


/* =========================================================
   INITIALIZE
   ========================================================= */

renderQuestion();

</script>


</body>

</html>
