<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:"Livvic",sans-serif;
}

body {
    background-image: url("../assets/images/bg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    font-family: "Livvic", sans-serif;

    max-width: 100vw;
    min-height: 100vh;
}
button,input{
    font:inherit;
}

.page{
    width:100%;
    height:100vh;
    height:100dvh;
    padding:clamp(8px,1.4vh,18px) clamp(14px,2.5vw,42px) clamp(10px,1.5vh,18px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* =========================
   TOP BAR — from file 2
   ========================= */

.topbar{
    width:100%;
    flex:0 0 auto;
    display:grid;
    grid-template-columns:90px minmax(0,1fr) 90px;
    align-items:start;
    gap:10px;
}

.icon-btn{
    background:none;
    border:0;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
}

.icon-circle{
    width:clamp(42px,4.2vw,62px);
    height:clamp(42px,4.2vw,62px);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:clamp(18px,1.8vw,27px);
    transition:transform .2s ease;
    visibility: hidden;
}

.icon-btn:hover .icon-circle{
    transform:scale(1.06);
}

.icon-circle.home{
    background:linear-gradient(145deg,#8b6fe0,#6f42c1);
    box-shadow:0 4px 0 #4f2e93;
    visibility: hidden !important;
}

.icon-circle.hint{
    background:linear-gradient(145deg,#ffc94d,#f7a800);
    box-shadow:0 4px 0 #c17e00;
}

.title{
    margin:0;
    width:100%;
    text-align:center;
    color:#303030;
    font-size:clamp(22px,2.7vw,40px);
    line-height:1.12;
    font-weight:400;
}

/* =========================
   INSTRUCTION
   ========================= */

.instruction{
    flex:0 0 auto;
    text-align:center;
    color:#303030;
    font-size:clamp(17px,1.7vw,24px);
    margin:clamp(8px,1.2vh,14px) 0 clamp(5px,1vh,10px);
}

/* =========================
   THREE QUESTIONS — ONE PAGE
   ========================= */

.questions{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:clamp(12px,2.5vw,42px);
    align-items:stretch;
}

.question-card{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:visible;
    padding:clamp(6px,1vw,14px);
    /* border-radius:20px; */
    /* background:rgba(255,255,255,.7); */
}

.question-label{
    width:100%;
    margin:0 0 clamp(3px,.7vh,8px);
    color:#303030;
    font-size:clamp(18px,2vw,29px);
    font-weight:400;
}

.abacus{
    position:relative;
    width:min(100%,360px);
    height:clamp(240px,43vh,370px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    overflow:visible;
}

.rods{
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:clamp(42px,6vh,58px);
    height:auto;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:clamp(14px,2.6vw,42px);
    padding:0 clamp(18px,4vw,48px);
    overflow:visible;
}

.rod{
    position:relative;
    width:3px;
    height:100%;
    justify-self:center;
    background:#595959;
    border-radius:4px;
    cursor:pointer;
    overflow:visible;
}

.rod:hover{
    background:#444;
}

.rod-line{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.bead-stack{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column-reverse;
    align-items:center;
    gap:1px;
    z-index:3;
    pointer-events:none;
    width:30px;
}

.bead{
    width:clamp(20px,2.1vw,30px);
    height:clamp(20px,2.1vw,30px);
    flex:0 0 auto;
    border-radius:50%;
    cursor:pointer;
    pointer-events:auto;
    box-shadow:inset -3px -4px 5px rgba(0,0,0,.15),0 2px 3px rgba(0,0,0,.14);
    transition:transform .12s ease,filter .12s ease;
}

.bead:hover{
    transform:scale(1.08);
    filter:brightness(1.05);
}

.bead.hundred{
    background:radial-gradient(circle at 35% 30%,#ffe976 0%,#ffd329 50%,#f2ad00 100%);
}

.bead.ten{
    background:radial-gradient(circle at 35% 30%,#59d789 0%,#16b957 50%,#07963d 100%);
}

.bead.one{
    background:radial-gradient(circle at 35% 30%,#62c8ff 0%,#129fdf 50%,#087bb7 100%);
}

.abacus-base{
    position:relative;
    z-index:5;
    width:min(92%,330px);
    height:clamp(42px,6vh,58px);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    align-items:center;
    border-radius:10px;
    background:#f1f1f1;
    border:2px solid #bdbdbd;
    box-shadow:0 3px 0 rgba(0,0,0,.12);
    color:#222;
    font-size:clamp(16px,1.8vw,23px);
    font-weight:500;
}

.base-label{
    text-align:center;
}

.target-wrap{
    margin-top:clamp(9px,1.5vh,14px);
    display:flex;
    justify-content:center;
}

.target-input{
    width:clamp(120px,12vw,155px);
    height:clamp(32px,4.5vh,44px);
    padding:2px 8px;
    text-align:center;
    border:1.5px solid #ff8b5c;
    border-radius:5px;
    background:#fff;
    color:#222;
    font-size:clamp(20px,2vw,28px);
    letter-spacing:clamp(3px,.6vw,6px);
    outline:none;
}

.target-input:focus{
    border-color:#ff8b5c;
}

.check-btn{
    margin-top:clamp(7px,1.2vh,12px);
    min-width:clamp(92px,9vw,120px);
    height:clamp(36px,4.5vh,46px);
    border:0;
    border-radius:13px;
    background:linear-gradient(145deg,#73b9ff,#4d9cf4);
    color:#fff;
    font-size:clamp(15px,1.5vw,19px);
    font-weight:600;
    cursor:pointer;
    box-shadow:0 4px 0 #377fcf;
    transition:transform .15s ease,opacity .15s ease;
}

.check-btn:hover:not(:disabled){
    transform:translateY(-2px);
}

.check-btn:active:not(:disabled){
    transform:translateY(2px);
}

.check-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}
.question-card.correct .check-btn{
    background:linear-gradient(145deg,#59d789,#16b957);
    box-shadow:0 4px 0 #0c8c42;
}

/* =========================
   SMALL HELPER
   ========================= */

.delete-note{
    flex:0 0 auto;
    text-align:center;
    color:#666;
    font-size:clamp(12px,1.2vw,16px);
    margin:clamp(4px,.7vh,8px) 0 0;
}

/* =========================
   POPUP FALLBACK / SHARED LOOK
   ========================= */

.hint-overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:3500;
    background:rgba(0,0,0,.25);
}

.hint-overlay.show{
    display:flex;
}

.hint-box{
    width:min(420px,calc(100vw - 32px));
    padding:26px 28px;
    background:#fff;
    border-radius:24px;
    text-align:center;
    box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.hint-box h3{
    margin:0 0 10px;
    color:#e08e00;
    font-size:clamp(24px,3vw,32px);
    font-weight:700;
}

.hint-box p{
    margin:0;
    color:#1f2d3d;
    font-size:clamp(16px,1.6vw,21px);
    line-height:1.45;
}

.hint-close{
    margin-top:18px;
    min-width:110px;
    height:44px;
    border:0;
    border-radius:24px;
    background:linear-gradient(145deg,#ffc94d,#f7a800);
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 0 #c17e00;
}

#answerPopup,#finalPopup{
    z-index:4000;
}

#answerPopup:not(.show),
#finalPopup:not(.show){
    /* reuse.css controls visibility when available */
}

/* ===== ROD COUNT + ABACUS RESPONSIVE FINAL ===== */
.rod-count{
    position:absolute;
    left:50%;
    top:calc(100% + 8px);
    transform:translateX(-50%);
    z-index:20;
    width:clamp(26px,2.2vw,34px);
    height:clamp(26px,2.2vw,34px);
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:linear-gradient(145deg,#ffffff,#e9edf7);
    color:#29345d;
    border:2px solid #29345d;
    box-shadow:0 3px 0 #aab2c8, 0 4px 8px rgba(0,0,0,.16);
    font-size:clamp(12px,1.1vw,16px);
    font-weight:800;
    line-height:1;
    pointer-events:none;
    opacity:1 !important;
}

.rods{
    z-index:10;
    bottom:clamp(42px,6vh,58px);
    overflow:visible;
}

.rod{
    z-index:11;
    height:100%;
    overflow:visible;
}

.bead-stack{

/* ===== DRAW-BEAD CONTROL — BEAD SHAPE ONLY ===== */
.draw-bead-zone{
    position:absolute;
    left:50%;
    top:-38px;
    transform:translateX(-50%);
    z-index:40;
    width:clamp(28px,3vw,42px);
    height:clamp(28px,3vw,42px);
    min-width:28px;
    min-height:28px;
    padding:0;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:clamp(11px,1vw,15px);
    font-weight:800;
    line-height:1;
    cursor:pointer;
    box-shadow:
        inset -3px -4px 5px rgba(0,0,0,.15),
        0 2px 3px rgba(0,0,0,.14);
    transition:transform .12s ease,filter .12s ease;
    white-space:nowrap;
    appearance:none;
    -webkit-appearance:none;
}

.draw-bead-zone::after{
    display:none;
}

.draw-bead-zone::before{
    content:attr(data-count);
}

.draw-bead-zone{
    font-size:0;
}

.draw-bead-zone:hover{
    transform:translateX(-50%) scale(1.08);
    filter:brightness(1.05);
}

.draw-bead-zone:active{
    transform:translateX(-50%) scale(.96);
}

.rod:nth-child(1) .draw-bead-zone{
    background:radial-gradient(circle at 35% 30%,#ffe976 0%,#ffd329 50%,#f2ad00 100%);
}

.rod:nth-child(2) .draw-bead-zone{
    background:radial-gradient(circle at 35% 30%,#59d789 0%,#16b957 50%,#07963d 100%);
}

.rod:nth-child(3) .draw-bead-zone{
    background:radial-gradient(circle at 35% 30%,#62c8ff 0%,#129fdf 50%,#087bb7 100%);
}

.draw-bead-zone::before{
    font-size:clamp(11px,1vw,15px);
    color:#fff;
    text-shadow:0 1px 1px rgba(0,0,0,.18);
}

        top:-34px;

}

</style>
</head>

<body>

<div class="page" id="page">

    <div class="topbar">
        <button class="icon-btn" id="homeBtn" aria-label="Home">
            <span class="icon-circle home">
                <i class="fa-solid fa-house"></i>
            </span>
        </button>

        <h1 class="title">Draw the beads according to the number.</h1>

        <button class="icon-btn" id="hintBtn" aria-label="Hint">
            <span class="icon-circle hint">
                <i class="fa-solid fa-lightbulb"></i>
            </span>
        </button>
    </div>
<main class="questions" id="questions"></main>
</div>

<!-- HINT — from file 2 -->
<div class="hint-overlay" id="hintOverlay">
    <div class="hint-box">
        <h3>Hint</h3>
        <p id="hintText"></p>
        <button class="hint-close" id="closeHintBtn">Got it!</button>
    </div>
</div>

<!-- CORRECT / WRONG POPUP — from file 2 concept -->
<div id="answerPopup" class="kid-popup">
    <div class="kid-card">
        <div class="kid-icon" id="popupIcon"></div>
        <h3 id="popupTitle"></h3>
        <p id="popupMsg"></p>
    </div>
</div>

<!-- FINAL POPUP — from file 2 -->
<div id="finalPopup">
    <div class="final-kid-box">
        <h2>🎉 Congratulations!</h2>
        <p id="finalScore"></p>
        <div id="stars"></div>
        <button class="playAgain-btn" id="playAgainBtn">Play Again</button>
    </div>
</div>

<audio id="correctSound"
       src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound"
       src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
/* =========================================================
   QUESTION DATA — taken directly from the supplied image
   a) 427 = H4 T2 O7
   b) 685 = H6 T8 O5
   c) 901 = H9 T0 O1
   ========================================================= */

const QUESTIONS = [
    { label:"a)", number:"427", hundreds:4, tens:2, ones:7 },
    { label:"b)", number:"685", hundreds:6, tens:8, ones:5 },
    { label:"c)", number:"901", hundreds:9, tens:0, ones:1 }
];

const states = QUESTIONS.map(() => ({
    counts:[0,0,0],
    checked:false
}));

const questionsContainer = document.getElementById("questions");
const hintBtn = document.getElementById("hintBtn");
const homeBtn = document.getElementById("homeBtn");
const hintOverlay = document.getElementById("hintOverlay");
const hintText = document.getElementById("hintText");
const closeHintBtn = document.getElementById("closeHintBtn");
const answerPopup = document.getElementById("answerPopup");
const popupIcon = document.getElementById("popupIcon");
const popupTitle = document.getElementById("popupTitle");
const popupMsg = document.getElementById("popupMsg");
const finalPopup = document.getElementById("finalPopup");
const finalScore = document.getElementById("finalScore");
const stars = document.getElementById("stars");
const playAgainBtn = document.getElementById("playAgainBtn");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function speak(text){
    if(!window.speechSynthesis) return;

    speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "en-UK";
    msg.volume = 0.25;
    msg.rate = 1;
    msg.pitch = 1;

    speechSynthesis.speak(msg);
}

function showAnswerPopup(isCorrect, message){
    popupIcon.textContent = isCorrect ? "🎉" : "🥲";
    popupTitle.textContent = isCorrect ? "Great Job!" : "Oops!";
    popupMsg.textContent = message;

    answerPopup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
    answerPopup.style.display = "flex";

    speak(isCorrect ? "Correct" : "try again");

    clearTimeout(showAnswerPopup.timer);
    showAnswerPopup.timer = setTimeout(() => {
        answerPopup.style.display = "none";
    }, 1400);
}

function showFinal(){
    finalScore.textContent = `Your Score: ${QUESTIONS.length} / ${QUESTIONS.length}`;
    stars.textContent = "⭐".repeat(QUESTIONS.length);
    finalPopup.style.display = "flex";

    if(window.confetti){
        confetti({
            particleCount:150,
            spread:100,
            origin:{y:.5}
        });
    }
}

function playCorrect(){
    correctSound.currentTime = 0;
    correctSound.play().catch(() => {});
}

function playWrong(){
    wrongSound.currentTime = 0;
    wrongSound.play().catch(() => {});
}

function createBead(type, questionIndex, rodIndex){
    const bead = document.createElement("div");
    bead.className = "bead " + type;
    bead.title = "Click to delete this bead";

    bead.addEventListener("click", (event) => {
        event.stopPropagation();

        if(states[questionIndex].checked) return;

        states[questionIndex].counts[rodIndex]--;

        bead.remove();

        const card = questionsContainer.querySelector(
            `.question-card[data-question="${questionIndex}"]`
        );

        updateDrawZoneCount(card, rodIndex, states[questionIndex].counts[rodIndex]);
        updateCheckButton(questionIndex);
    });

    return bead;
}

function updateDrawZoneCount(card, rodIndex, count){
    if(!card) return;

    const zone = card.querySelector(`.rod[data-rod="${rodIndex}"] .draw-bead-zone`);

    if(zone){
        zone.dataset.count = count;
    }
}

function getQuestionTotal(state){
    return state.counts.reduce((sum, value) => sum + value, 0);
}

function updateCheckButton(questionIndex){
    const state = states[questionIndex];

    const card = questionsContainer.querySelector(
        `.question-card[data-question="${questionIndex}"]`
    );

    if(!card) return;

    const checkBtn = card.querySelector(".check-btn");

    if(!checkBtn) return;

    if(state.checked){
        checkBtn.disabled = true;
        return;
    }

    checkBtn.disabled = getQuestionTotal(state) === 0;
}

function addBead(questionIndex, rodIndex){
    const state = states[questionIndex];

    if(state.checked) return;
    if(state.counts[rodIndex] >= 9) return;

    state.counts[rodIndex]++;

    const card = questionsContainer.querySelector(
        `.question-card[data-question="${questionIndex}"]`
    );

    const stack = card.querySelector(
        `.bead-stack[data-rod="${rodIndex}"]`
    );

    const types = ["hundred","ten","one"];
    stack.appendChild(createBead(types[rodIndex], questionIndex, rodIndex));

    updateDrawZoneCount(card, rodIndex, state.counts[rodIndex]);
    updateCheckButton(questionIndex);
}

function clearQuestionBeads(index){
    const state = states[index];

    const card = questionsContainer.querySelector(
        `.question-card[data-question="${index}"]`
    );

    if(!card) return;

    state.counts = [0,0,0];

    card.querySelectorAll(".bead-stack").forEach(stack => {
        stack.innerHTML = "";
    });

    card.querySelectorAll(".draw-bead-zone").forEach(zone => {
        zone.dataset.count = "0";
    });

    updateCheckButton(index);
}

function renderCard(question, index){
    const card = document.createElement("section");
    card.className = "question-card";
    card.dataset.question = index;

    card.innerHTML = `
        <p class="question-label">${question.label}</p>

        <div class="abacus">
            <div class="rods">
                <div class="rod" data-rod="0">
                    <button class="draw-bead-zone" type="button" data-count="0" aria-label="Draw bead in Hundreds">DRAW BEAD</button>
                    <div class="bead-stack" data-rod="0"></div>
                </div>

                <div class="rod" data-rod="1">
                    <button class="draw-bead-zone" type="button" data-count="0" aria-label="Draw bead in Tens">DRAW BEAD</button>
                    <div class="bead-stack" data-rod="1"></div>
                </div>

                <div class="rod" data-rod="2">
                    <button class="draw-bead-zone" type="button" data-count="0" aria-label="Draw bead in Ones">DRAW BEAD</button>
                    <div class="bead-stack" data-rod="2"></div>
                </div>
            </div>

            <div class="abacus-base">
                <div class="base-label">H</div>
                <div class="base-label">T</div>
                <div class="base-label">O</div>
            </div>
        </div>

        <div class="target-wrap">
            <input class="target-input"
                   type="text"
                   value="${question.number}"
                   readonly
                   aria-label="Target number ${question.number}">
        </div>

        <button class="check-btn" type="button" disabled>Check</button>
    `;

    card.querySelectorAll(".rod").forEach(rod => {
        const rodIndex = Number(rod.dataset.rod);

        rod.addEventListener("click", () => {
            addBead(index, rodIndex);
        });

        const drawButton = rod.querySelector(".draw-bead-zone");
        if(drawButton){
            drawButton.addEventListener("click", (event) => {
                event.stopPropagation();
                addBead(index, rodIndex);
            });
        }

    });

    card.querySelector(".check-btn").addEventListener("click", () => {
        validateQuestion(index);
    });

    return card;
}

function validateQuestion(index){
    const question = QUESTIONS[index];
    const state = states[index];

    if(state.checked) return;

    const expected = [
        question.hundreds,
        question.tens,
        question.ones
    ];

    const correct = state.counts.every(
        (value, rodIndex) => value === expected[rodIndex]
    );

    if(correct){
        state.checked = true;

        const card = questionsContainer.querySelector(
            `.question-card[data-question="${index}"]`
        );
        card.querySelector(".check-btn").disabled = true;
        card.querySelector(".check-btn").textContent = "Correct ✓";

        card.querySelectorAll(".rod").forEach(rod => {
            rod.style.cursor = "default";
        });

        playCorrect();
         if(window.confetti){
        confetti({
            particleCount:150,
            spread:100,
            origin:{y:.5}
        });
    }
        showAnswerPopup(true, "You built the number correctly!");

        if(states.every(item => item.checked)){
            setTimeout(showFinal, 1450);
        }

        return;
    }

    playWrong();

    clearQuestionBeads(index);

    showAnswerPopup(
        false,
        `Not quite. Build ${question.number} using the H, T and O rods.`
    );
}

function renderAll(){
    questionsContainer.innerHTML = "";

    QUESTIONS.forEach((question, index) => {
        questionsContainer.appendChild(renderCard(question, index));
    });
}

hintBtn.addEventListener("click", () => {
    hintText.textContent =
        "How to Play\n\n" +
        "1. Click the colored bead above H, T or O to draw a bead on that rod.\n" +
        "2. Click a bead on the rod to remove it.\n" +
        "3. Make the number shown in the box.\n" +
        "4. Press Check when you are finished.";
    hintOverlay.classList.add("show");
});

closeHintBtn.addEventListener("click", () => {
    hintOverlay.classList.remove("show");
});

hintOverlay.addEventListener("click", event => {
    if(event.target === hintOverlay){
        hintOverlay.classList.remove("show");
    }
});

homeBtn.addEventListener("click", () => {
    window.top.location.href = "../Grade2_chapter2.html";
});

playAgainBtn.addEventListener("click", () => {
    finalPopup.style.display = "none";

    states.forEach(state => {
        state.counts = [0,0,0];
        state.checked = false;
    });

    renderAll();
});

renderAll();
</script>

</body>
</html>
