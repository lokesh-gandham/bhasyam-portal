<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join the Dots 301-400 · Color Quest</title>
<style>
:root{
  --bg1:#0b0e1a;
  --bg2:#141a30;
  --accent:#00e6a8;
  --accent2:#7b5cff;
  --accent3:#00c2ff;
  --panel:#161c33;
  --panel-line:#2a3358;
  --text:#eaf0ff;
  --muted:#8b93b8;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 15% 10%, rgba(123,92,255,.25), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(0,230,168,.20), transparent 40%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
}
.page{width:min(960px,96vw);margin:18px auto}
.header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.badge{
  width:44px;height:44px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 0 18px rgba(0,230,168,.55);
}
h1{
  font-size:clamp(15px,2.2vw,23px);margin:0;flex:1;font-weight:800;letter-spacing:.3px;
  background:linear-gradient(90deg,#fff,var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent;
}
#hintBtn{
  border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:14px;
  background:linear-gradient(135deg,var(--accent2),var(--accent3));color:#fff;cursor:pointer;
  white-space:nowrap;box-shadow:0 4px 14px rgba(123,92,255,.4);letter-spacing:.3px;transition:transform .15s;
}
#hintBtn:hover{transform:translateY(-1px)}
#hintBtn.locked{background:#232a4a;color:var(--muted);box-shadow:none}
#homeBtn{
  border:1px solid rgba(0,230,168,.45);border-radius:12px;padding:10px 14px;
  background:rgba(22,28,51,.9);color:var(--text);cursor:pointer;white-space:nowrap;
  font-weight:800;font-size:14px;letter-spacing:.3px;transition:transform .15s,background .15s,border-color .15s;
}
#homeBtn:hover{transform:translateY(-1px);background:#232a4a;border-color:var(--accent)}

.board{
  position:relative;width:100%;aspect-ratio:630/736;background:#0c1024;
  border:1px solid var(--panel-line);border-radius:16px;overflow:hidden;touch-action:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.02), 0 20px 50px rgba(0,0,0,.45);
}
#dotImage{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none;opacity:.92}
#finalImage{position:absolute;inset:0;width:100%;height:100%;display:none;object-fit:contain;background:#fff;z-index:10;pointer-events:none;user-select:none}
svg{position:absolute;left:0;top:0;width:100%;height:100%}
#lines{pointer-events:none;filter:drop-shadow(0 0 3px rgba(0,230,168,.6))}
.target{fill:transparent;stroke:transparent;pointer-events:all;cursor:pointer}
.target.active{fill:rgba(0,230,168,.18)}
.target.wrong{animation:wrong .3s}
@keyframes wrong{0%{fill:rgba(255,70,90,.6)}100%{fill:transparent}}
.ring{fill:none;stroke:transparent;stroke-width:2}
.ring.active{stroke:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;stroke-width:1.5}50%{opacity:1;stroke-width:3}}
.num-bg{fill:#0c1024;fill-opacity:.88;pointer-events:none}
.num{font:700 10px 'Segoe UI',Arial,sans-serif;fill:#c9d2f5;stroke:none;pointer-events:none}
.num.active{fill:#02110c;font-size:12px}
.num-bg.active{fill:var(--accent)}
.num.special{font-size:12px;font-weight:800}
.dot{fill:#8891bd;pointer-events:none}
.dot.done{fill:var(--accent)}

.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
button.control{border:0;border-radius:12px;padding:11px 20px;font-weight:800;font-size:14px;cursor:pointer;letter-spacing:.3px;transition:transform .15s}
#reset,#playAgain{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#02110c;box-shadow:0 4px 16px rgba(0,230,168,.35)}
button.control:hover{transform:translateY(-1px)}
.counter{min-width:150px;text-align:center;padding:10px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--panel-line);font-weight:800;letter-spacing:.5px;color:var(--accent3)}
.progressWrap{width:100%;max-width:360px;height:10px;border-radius:6px;background:#1c2444;overflow:hidden;border:1px solid var(--panel-line)}
.progressBar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:width .35s ease}

.popupLayer{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(6,9,20,.72);backdrop-filter:blur(2px)}
.popupLayer.show{display:flex}
.popup{background:linear-gradient(160deg,#1a2140,#12172c);border:1px solid var(--panel-line);border-radius:18px;padding:26px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 40px rgba(0,230,168,.15);max-width:88%}
.popup .trophy{font-size:40px;margin-bottom:6px}
.popup h2{margin:0 0 8px;font-size:24px;background:linear-gradient(90deg,var(--accent),var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent}
.popup p{margin:0 0 18px;color:var(--muted)}



#hintModal{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;background:rgba(4,6,14,.72);padding:18px}
#hintModal.show{display:flex}
.hintCard{position:relative;width:min(600px,94vw);max-height:92vh;overflow:auto;background:linear-gradient(160deg,#1a2140,#12172c);border:1px solid var(--panel-line);border-radius:18px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.hintCard h2{margin:0 32px 10px;font-size:22px;color:var(--accent3)}
.hintCard p{margin:0 0 12px;line-height:1.5;color:var(--muted);font-size:14px}
.hintImage{display:block;width:100%;max-height:72vh;object-fit:contain;border:1px solid var(--panel-line);border-radius:10px}
.lockIcon{font-size:34px;margin-bottom:6px}
.closeHint{position:absolute;right:10px;top:10px;width:34px;height:34px;border:0;border-radius:50%;font-size:20px;background:#232a4a;color:var(--text);cursor:pointer}

@media(max-width:720px){
 .num{font-size:8px}
 .num.active,.num.special{font-size:10px}
}
@media(max-width:520px){
 .page{width:96vw;margin:10px auto}
 .header{gap:8px}
 h1{font-size:15px}
 #homeBtn{padding:8px 10px;font-size:12px}
 #hintBtn{padding:8px 12px;font-size:12px}
 button.control,.counter{font-size:13px;padding:9px 14px}
}
</style>
</head>

const START=301,END=400;
const SPECIAL={398:true,399:true};
const FINAL_IMAGE_PATH="../assets/images/colored_reference.png";

const svg=document.querySelector("#dotSvg");
const lines=document.querySelector("#lines");
const rings=document.querySelector("#rings");
const targets=document.querySelector("#targets");
const labels=document.querySelector("#labels");
const counter=document.querySelector("#counter");
const progressBar=document.querySelector("#progressBar");
const success=document.querySelector("#success");
const dotImage=document.querySelector("#dotImage");
const finalImage=document.querySelector("#finalImage");
const finalDone=document.querySelector("#finalDone");
let finalImageTimer=null;
const hintBtn=document.querySelector("#hintBtn");

let next=START;
let previous=null;
let dotsFinished=false;

function el(tag,a={}){
  const x=document.createElementNS("http://www.w3.org/2000/svg",tag);
  Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));
  return x;
}
function draw(a,b){ lines.appendChild(el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1]})); }
function refresh(){
  const done=Math.min(next-START,END-START+1);
  counter.textContent=next<=END?`${next} / 400`:"400 / 400";
  progressBar.style.width=(done/(END-START+1)*100)+"%";
  document.querySelectorAll(".target").forEach(t=>t.classList.toggle("active",+t.dataset.n===next));
  document.querySelectorAll(".num").forEach(t=>t.classList.toggle("active",+t.dataset.n===next));
  document.querySelectorAll(".num-bg").forEach(t=>t.classList.toggle("active",+t.dataset.n===next));
  document.querySelectorAll(".ring").forEach(t=>t.classList.toggle("active",+t.dataset.n===next));
  document.querySelectorAll(".dot").forEach(t=>t.classList.toggle("done",+t.dataset.n<next));
}
function connect(n,t){
  if(n!==next){
    t.classList.remove("wrong"); void t.offsetWidth; t.classList.add("wrong");
    return;
  }
  const p=P[n];
  if(previous)draw(previous,p);
  previous=p; next++;
  refresh();
  if(next>END){
    dotsFinished=true;
    hintBtn.classList.remove("locked");
    hintBtn.innerHTML="💡 Hint";
    success.classList.add("show");
    clearTimeout(finalImageTimer);
    finalImageTimer=setTimeout(showFinalImage,1000);
  }
}
function build(){
  for(let n=START;n<=END;n++){
    const p=P[n];
    const hit=SPECIAL[n]?17:11;
    rings.appendChild(el("circle",{class:"ring","data-n":n,cx:p[0],cy:p[1],r:hit+3}));
    const t=el("circle",{class:"target",cx:p[0],cy:p[1],r:hit,"data-n":n});
    t.addEventListener("pointerdown",e=>{e.preventDefault();connect(n,t);});
    targets.appendChild(t);
    let dx=6.5,dy=-1.5;

if(n===349){ dx=18; dy=3; }

if(n===352){ dx=6.5; dy=-9; }

if(n===353){ dx=-20; dy=7; }

if(n===397 || n===398 || n===399 || n===400){ dx=7; dy=-7; }
    const w=SPECIAL[n]?32:27;
    labels.appendChild(el("rect",{class:"num-bg","data-n":n,x:p[0]+dx-2,y:p[1]+dy-10,width:w,height:14,rx:3}));
    const text=el("text",{class:"num"+(SPECIAL[n]?" special":""),x:p[0]+dx,y:p[1]+dy,"data-n":n});
    text.textContent=n;
    labels.appendChild(text);
    labels.appendChild(el("circle",{class:"dot","data-n":n,cx:p[0],cy:p[1],r:2.8}));
  }
}
function showFinalImage(){
  success.classList.remove("show");
  dotImage.style.display="none";
  svg.style.display="none";
  finalImage.src=FINAL_IMAGE_PATH;
  finalImage.style.display="block";
  clearTimeout(finalImageTimer);
  finalImageTimer=setTimeout(()=>{
    finalDone.classList.add("show");
  },5000);
}
function reset(){
  clearTimeout(finalImageTimer);
  next=START; previous=null; dotsFinished=false;
  lines.innerHTML="";
  success.classList.remove("show");
  finalDone.classList.remove("show");
  finalImage.style.display="none";
  finalImage.removeAttribute("src");
  hintBtn.classList.add("locked");
  hintBtn.innerHTML="🔒 Hint";
  dotImage.style.display="block";
  svg.style.display="block";
  refresh();
}
document.querySelector("#reset").onclick=reset;
document.querySelector("#playAgain").onclick=reset;
document.querySelector("#homeBtn").onclick=()=>{
  window.top.location.href=new URL("../Grade2_chapter2.html",window.location.href).href;
};

const hintModal=document.querySelector("#hintModal");
document.querySelector("#hintBtn").onclick=()=>{
  document.querySelector("#lockedHint").style.display=dotsFinished?"none":"block";
  document.querySelector("#openHint").style.display=dotsFinished?"block":"none";
  hintModal.classList.add("show");
};
document.querySelector("#closeHint").onclick=()=>hintModal.classList.remove("show");
hintModal.addEventListener("pointerdown",e=>{ if(e.target===hintModal)hintModal.classList.remove("show"); });

build();
refresh();
