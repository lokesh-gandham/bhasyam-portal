<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Addition Adventure - Index</title>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family: "Livvic";}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#fafffa;
}

:root{
  --orange:#FDBA74;
  --orange-dark:#EA9A52;
  --blue:#93C5FD;
  --blue-dark:#6FA8E8;
  --pink:#F9A8D4;
  --pink-dark:#DD7DB0;
  --green:#86EFAC;
  --green-dark:#5FC987;
  --purple:#C4B5FD;
  --purple-dark:#9B88E8;
}

/* -------------------------------------------------
   FULL SCREEN RESPONSIVE SCENE
   The same 3 + 2 card composition is maintained.
-------------------------------------------------- */
.page{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  isolation:isolate;
 
}

/* sky */
.page:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-5;
  /* background:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.78) 0 3.2%,transparent 3.4%),
    radial-gradient(circle at 88% 15%,rgba(255,255,255,.72) 0 3%,transparent 3.2%),
    linear-gradient(to bottom,#39b9e8 0%,#8de1ed 38%,#7dd26d 39%,#5cbd5d 100%); */
}

/* soft distant trees */


/* clouds */
.cloud{
  position:absolute;
  z-index:-2;
  width:150px;
  height:32px;
  border-radius:40px;
  background:rgba(255,255,255,.72);
}
.cloud:before,.cloud:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:inherit;
}
.cloud:before{width:58px;height:58px;left:20px;top:-27px}
.cloud:after{width:72px;height:72px;right:12px;top:-38px}
.cloud.one{left:2%;top:11%}
.cloud.two{right:8%;top:9%;transform:scale(.7)}
.cloud.three{left:42%;top:7%;transform:scale(.48)}

/* home button */
.home{
  position:absolute;
  z-index:50;
  left:1.8%;
  top:2.5%;
  width:clamp(42px,4.4vw,70px);
  height:clamp(42px,4.4vw,70px);
  border:4px solid rgba(255,255,255,.9);
  border-radius:50%;
  background:linear-gradient(#42baf2,#1688dc);
  color:white;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 5px 0 #1268ad,
    0 9px 18px rgba(0,72,115,.25);
  transition:.18s ease;
}
.home:hover{transform:scale(1.07) translateY(-2px)}
.home:active{transform:scale(.97)}
.home svg{width:57%;height:57%}

/* title */
.header{
  position:absolute;
  z-index:20;
  left:50%;
  top:5.5%;
  transform:translateX(-50%);
  width:min(650px,55vw);
  text-align:center;
}

.title{
  display:inline-block;
  padding:clamp(10px,1.2vh,16px) clamp(28px,3.5vw,52px);
  border:3px solid #e89a2f;
  border-radius:40px;
  background:linear-gradient(135deg,#fff3c4,#ffd98a);
  box-shadow:0 8px 20px rgba(232,154,47,.18);
}

.title h1{
  color:#c96f16;
  font-size:clamp(24px,3vw,46px);
  line-height:1;
  font-weight:900;
  letter-spacing:.4px;
  white-space:nowrap;
}
.tagline{
  display:inline-block;
  margin-top:7px;
  padding:5px 17px;
  border-radius:999px;
  background:#fff5dc;
  color:#77502c;
  font-size:clamp(9px,1vw,14px);
  font-weight:900;
  box-shadow:0 4px 10px rgba(68,67,42,.15);
}



/* -------------------------------------------------
   5 CARDS
   3 on top + 2 centered below
-------------------------------------------------- */
.cards{
  position:absolute;
  z-index:10;
  left:50%;
  top:22%;
  transform:translateX(-50%);
  width:min(1450px,96vw);
  height:65%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:1fr 1fr;
  gap:clamp(16px,2vw,32px);
}

.card{
  --main:#ff9d18;
  --dark:#ca6c08;
  position:relative;
  min-width:0;
  min-height:0;
  border:5px solid var(--main);
  border-radius:29px;
  background:linear-gradient(145deg,#fffef8,#fff1ce);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.85),
    0 8px 0 var(--dark),
    0 15px 28px rgba(44,74,53,.25);
  overflow:hidden;
  cursor:pointer;
  display:flex;
  align-items:center;
  padding:clamp(10px,1.1vw,20px);
  transition:transform .18s ease,filter .18s ease;
}

.card:hover{
  transform:translateY(-7px) scale(1.015);
  filter:brightness(1.03);
}

.card:active{transform:translateY(-2px) scale(.995)}

.card:nth-child(1){
  grid-column:1 / span 2;
  grid-row:1;
  --main:var(--orange);
  --dark:var(--orange-dark);
  background:linear-gradient(145deg,#FFF8ED,#FFEAD2);
}
.card:nth-child(2){
  grid-column:3 / span 2;
  grid-row:1;
  --main:var(--blue);
  --dark:var(--blue-dark);
  background:linear-gradient(145deg,#F3FAFF,#E0F0FF);
}
.card:nth-child(3){
  grid-column:5 / span 2;
  grid-row:1;
  --main:var(--pink);
  --dark:var(--pink-dark);
  background:linear-gradient(145deg,#FFF7FB,#FCE3F0);
}
.card:nth-child(4){
  grid-column:2 / span 2;
  grid-row:2;
  --main:var(--green);
  --dark:var(--green-dark);
  background:linear-gradient(145deg,#F4FFF7,#DDF7E6);
}
.card:nth-child(5){
  grid-column:4 / span 2;
  grid-row:2;
  --main:var(--purple);
  --dark:var(--purple-dark);
  background:linear-gradient(145deg,#FAF8FF,#EAE4FF);
}

/* number bubble */
.num{
  position:absolute;
  z-index:5;
  left:-7px;
  top:-10px;
  width:clamp(42px,4vw,66px);
  height:clamp(42px,4vw,66px);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:clamp(20px,2.2vw,34px);
  font-weight:400;
  background:linear-gradient(145deg,#fff,var(--main) 34%,var(--dark));
  border:4px solid rgba(255,255,255,.8);
  box-shadow:0 5px 10px rgba(57,54,41,.25);
}

/* illustration area */
.art{
  flex:0 0 clamp(85px,9vw,145px);
  height:90%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  margin-right:clamp(7px,1vw,16px);
}

.art .emoji{
  font-size:clamp(52px,5.8vw,88px);
  line-height:1;
  filter:drop-shadow(0 7px 3px rgba(60,55,35,.18));
}

/* special art */
.math-card{
  width:clamp(90px,9vw,145px);
  padding:12px;
  border-radius:14px;
  background:#fff;
  border:4px solid #4b7db6;
  box-shadow:0 7px 0 #b3c4d7;
  transform:rotate(-4deg);
  text-align:center;
  color:#20578f;
  font-weight:1000;
  font-size:clamp(16px,1.7vw,27px);
}
.math-card small{
  display:flex;
  justify-content:center;
  gap:5px;
  margin-top:7px;
}
.math-card small b{
  width:25px;height:25px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  color:white;background:#31a8e5;font-size:14px;
}
.math-card small b:nth-child(2){background:#f39b18}
.math-card small b:nth-child(3){background:#31b963}

.puzzle{
  display:flex;align-items:center;gap:2px;
  transform:rotate(-7deg);
}
.puzzle span{
  width:clamp(43px,4.3vw,67px);
  height:clamp(43px,4.3vw,67px);
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:clamp(17px,1.8vw,28px);
  font-weight:1000;
  border-radius:12px;
  box-shadow:0 6px 0 rgba(44,67,76,.25);
}
.puzzle span:first-child{background:#ef3d59}
.puzzle span:last-child{background:#4dbd45;transform:translateY(12px) rotate(7deg)}

.equation{
  padding:12px 15px;
  border-radius:13px;
  background:#fff;
  color:#2d75bd;
  border:3px solid #e3b16d;
  box-shadow:0 6px 0 #c89556;
  transform:rotate(-5deg);
  font-size:clamp(18px,2vw,30px);
  font-weight:1000;
  white-space:nowrap;
}

/* content */
.info{
  min-width:0;
  flex:1;
  align-self:center;
  padding-top:4px;
}

.label{
  color:var(--dark);
  font-size:clamp(8px,.75vw,11px);
  font-weight:1000;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:5px;
}

.card h2{
  color:var(--dark);
  font-size:clamp(24px,1.45vw,28px);
  line-height:1.05;
 
  margin-bottom:7px;
  font-weight: 400;
}

.card p{
  color:#2f3542;
  font-size:clamp(15px,.85vw,16px);
  line-height:1.25;
  font-weight:500;
  max-width:250px;
}

.start{
  margin-top:clamp(8px,1.1vh,15px);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-width:clamp(100px,9vw,150px);
  padding:clamp(6px,.7vh,10px) 13px;
  border-radius:999px;
  background:color-mix(in srgb,var(--main) 20%,white);
  color:#3F3B46;
  border:2px solid color-mix(in srgb,var(--main) 32%,white);
  box-shadow:0 3px 8px rgba(43,36,80,.08);
  font-size:clamp(18px,1vw,23px);
  font-weight:400;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}
.start:hover{
  background:color-mix(in srgb,var(--main) 30%,white);
  color:#2F2D35;
  transform:translateY(-2px);
  box-shadow:0 5px 12px rgba(43,36,80,.11);
}
.start:active{
  transform:translateY(1px);
  box-shadow:0 2px 5px rgba(43,36,80,.08);
}
.start b{font-size:1.15em}

/* bottom landscape details */
.path{
  position:absolute;
  z-index:1;
  bottom:-10%;
  left:27%;
  width:48%;
  height:24%;
  border-radius:50%;
  background:#e8c47a;
  filter:blur(1px);
  transform:rotate(-3deg);
  opacity:.9;
}

.flower{
  position:absolute;
  z-index:2;
  bottom:4%;
  font-size:clamp(25px,3vw,45px);
  filter:drop-shadow(0 4px 2px rgba(50,70,30,.2));
}
.flower.f1{left:1%}.flower.f2{left:9%;bottom:1%}.flower.f3{right:2%;bottom:3%}

/* child decoration */
.kid{
  position:absolute;
  z-index:12;
  right:1%;
  bottom:-2%;
  font-size:clamp(70px,10vw,155px);
  filter:drop-shadow(0 9px 4px rgba(40,62,40,.25));
  transform:rotate(-2deg);
  pointer-events:none;
}

/* left sign */
.math-sign{
  position:absolute;
  z-index:8;
  left:-8px;
  bottom:4%;
  width:clamp(90px,12vw,175px);
  padding:13px 8px;
  text-align:center;
  background:linear-gradient(#ffe9a9,#d99b50);
  border:4px solid #9c5c2c;
  border-radius:9px;
  color:#70401e;
  font-size:clamp(9px,1vw,14px);
  font-weight:1000;
  line-height:1.1;
  transform:rotate(-7deg);
  box-shadow:0 6px 0 rgba(92,56,27,.25);
}

/* -------------------------------------------------
   Laptop / tablet
-------------------------------------------------- */
@media(max-width:1100px){
  .header{top:2%}
  .cards{
    top:28%;
    width:96vw;
    height:67%;
    gap:14px;
  }
  .card{border-width:4px;border-radius:23px;padding:9px}
  .art{flex-basis:70px;margin-right:7px}
  .art .emoji{font-size:47px}
  .card h2{font-size:13px}
  .card p{font-size:8px}
  .start{min-width:90px;font-size:9px}
  .math-sign{display:none}
  .kid{font-size:85px}
}

/* -------------------------------------------------
   Mobile: preserve exactly 3 top + 2 bottom layout
-------------------------------------------------- */
@media(max-width:700px){
  html,body{overflow:hidden}

  .home{
    left:8px;top:8px;
    width:42px;height:42px;border-width:3px;
  }

  .header{
    top:9px;
    width:64vw;
  }
  .title{padding:7px 16px;border-width:3px;border-radius:17px}
  .title h1{font-size:18px}
  .tagline{margin-top:4px;padding:4px 10px;font-size:7px}

  .sign{display:none}
  .cloud{display:none}

  .cards{
    top:24%;
    width:97vw;
    height:70%;
    gap:9px 6px;
  }

  .card{
    border-width:3px;
    border-radius:15px;
    padding:5px;
    box-shadow:0 5px 0 var(--dark),0 8px 15px rgba(44,74,53,.2);
  }

  .num{
    width:29px;height:29px;
    top:-7px;left:-6px;
    border-width:2px;
    font-size:13px;
  }

  .art{
    flex-basis:42px;
    margin-right:3px;
  }

  .art .emoji{font-size:29px}
  .math-card{width:54px;padding:4px;border-width:2px;font-size:10px;border-radius:6px;box-shadow:0 3px 0 #b3c4d7}
  .math-card small{margin-top:2px;gap:2px}
  .math-card small b{width:11px;height:11px;font-size:6px;border-radius:2px}
  .puzzle span{width:25px;height:25px;font-size:9px;border-radius:5px}
  .equation{padding:5px 5px;font-size:10px;border-width:2px;box-shadow:0 3px 0 #c89556;border-radius:6px}

  .label{font-size:5px;letter-spacing:.5px;margin-bottom:2px}
  .card h2{font-size:9px;margin-bottom:3px}
  .card p{font-size:6px;line-height:1.15}
  .start{
    min-width:53px;
    margin-top:4px;
    padding:3px 5px;
    gap:3px;
    border-width:2px;
    box-shadow:0 2px 0 var(--dark);
    font-size:6px;
  }

  .path{height:17%;bottom:-8%}
  .kid{font-size:65px;right:-5px;bottom:-2%}
  .flower{font-size:23px}
}

/* Very small phones */
@media(max-width:430px){
  .header{width:67vw}
  .title h1{font-size:15px}
  .tagline{font-size:6px}

  .cards{
    top:25%;
    width:98vw;
    height:68%;
    gap:7px 4px;
  }

  .card{padding:4px;border-radius:12px}
  .num{width:25px;height:25px;font-size:11px;top:-5px}
  .art{flex-basis:31px}
  .art .emoji{font-size:22px}
  .math-card{width:43px;font-size:8px;padding:3px}
  .math-card small b{width:9px;height:9px;font-size:5px}
  .puzzle span{width:20px;height:20px;font-size:7px}
  .equation{font-size:8px;padding:4px}
  .card h2{font-size:7px}
  .card p{font-size:5px}
  .label{font-size:4px}
  .start{font-size:5px;min-width:43px}
  .kid{font-size:52px}
}

/* Landscape phones with short height */
@media(max-height:520px) and (min-width:701px){
  .header{top:1%}
  .cards{top:25%;height:71%}
  .title{padding:5px 20px}
  .title h1{font-size:23px}
  .tagline{margin-top:3px;font-size:8px}
  .card{padding:7px}
  .art{flex-basis:65px}
  .art .emoji{font-size:42px}
  .card h2{font-size:12px}
  .card p{font-size:7px}
  .start{margin-top:5px}
}

.art img{
  display:block;
  width:100%;
  height:100%;
  max-width:clamp(85px,9vw,145px);
  max-height:clamp(105px,11vw,165px);
  object-fit:contain;
  object-position:center;
  filter:drop-shadow(0 7px 3px rgba(60,55,35,.16));
}

@media(max-width:1100px){
  .art img{
    max-width:70px;
    max-height:80px;
  }
}

@media(max-width:700px){
  .art img{
    max-width:42px;
    max-height:55px;
  }
}

@media(max-width:430px){
  .art img{
    max-width:31px;
    max-height:43px;
  }
}

</style>
</head>

<body>
<div class="page">



  <header class="header">
    <div class="title">
      <h1>ADDITION ADVENTURE</h1>
    </div>
    <!-- <div class="tagline">Play • Learn • Grow • Add with Fun!</div> -->
  </header>

  

  <main class="cards">

    <button class="card" data-file="./exercises/dots.html">
      <span class="num">1</span>
      <div class="art"><img src="./assets/images/b1.png" alt="Getting Started"></div>
      <div class="info">
        <!-- <div class="label">Getting Started</div> -->
        <h2>Join the Dots</h2>
        <p>Learn the basics of addition with fun examples.</p>
        <span class="start">Play <b>&#9654;</b></span>
      </div>
    </button>

    <button class="card" data-file="./exercises/3.html">
      <span class="num">2</span>
      <div class="art"><img src="./assets/images/b2.png" alt="Make a Match"></div>
      <div class="info">
        <!-- <div class="label">Make a Match</div> -->
        <h2>Find the Sum</h2>
        <p>Find the correct addition pairs.</p>
        <span class="start">Play <b>&#9654;</b></span>
      </div>
    </button>

    <button class="card" data-file="./exercises/2.html">
      <span class="num">3</span>
      <div class="art"><img src="./assets/images/b3.png" alt="Add and Choose"></div>
      <div class="info">
        <!-- <div class="label">Add & Choose</div> -->
        <h2>Fill the Boxes</h2>
        <p>Solve and pick the right answer.</p>
        <span class="start">Play <b>&#9654;</b></span>
      </div>
    </button>

    <button class="card" data-file="./exercises/matching.html">
      <span class="num">4</span>
      <div class="art"><img src="./assets/images/b4.png" alt="Add and Fill"></div>
      <div class="info">
        <!-- <div class="label">Complete</div> -->
        <h2>Matching</h2>
        <p>Complete the missing numbers.</p>
        <span class="start">Play <b>&#9654;</b></span>
      </div>
    </button>

    <button class="card" data-file="./exercises/7.html">
      <span class="num">5</span>
      <div class="art"><img src="./assets/images/b5.png" alt="Word Problems"></div>
      <div class="info">
        <!-- <div class="label">Explore</div> -->
        <h2>Number Line</h2>
        <p>Use addition to solve real-life questions.</p>
        <span class="start">Play <b>&#9654;</b></span>
      </div>
    </button>

  </main>


</div>

<script>
(function(){
  document.querySelectorAll(".card").forEach(function(card){
    card.addEventListener("click",function(){
      var file=card.getAttribute("data-file");
      if(file){
        window.location.href=new URL(file,window.location.href).href;
      }
    });
  });

  document.getElementById("homeBtn").addEventListener("click",function(){
    window.top.location.href="../Grade2_chapter2.html";
  });
})();
</script>

</body>
</html>
