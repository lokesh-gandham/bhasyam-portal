<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Count and Write</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="../assets/css/reuse.css">

    <style>
        /* =========================================================
   PAGE-SPECIFIC BASE STYLES
   Home, Hint, Next/Prev, answer popup and final popup
   are intentionally NOT styled here; they come from reuse.css.
   ========================================================= */

        * {
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: "Livvic", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #F8F4FF;
        }

        .quiz {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            padding: clamp(7px, 1.2vh, 16px) clamp(12px, 2.4vw, 38px);
            display: flex;
            flex-direction: column;
            gap: clamp(5px, 1vh, 11px);
            overflow: hidden;
        }

        .topbar {
            width: 100%;
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: 90px minmax(0, 1fr) 90px;
            align-items: start;
            gap: 10px;
        }

        .topbar .home-btn {
            justify-self: start;
        }

        .topbar .hint-btn {
            justify-self: end;
        }

        .title-block {
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            margin: 0;
            color: #1f2d3d;
            text-align: center;
            font-size: clamp(21px, 2.7vw, 40px);
            line-height: 1.12;
        }

        .icon-btn {
            width: 100%;
            max-width: 90px;
            height: 62px;
            margin: 0;
            padding: 0;
            border: 0;
            outline: none;
            background: transparent !important;
            display: flex;
            align-items: flex-start;
            position: relative;
            z-index: 100;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -webkit-tap-highlight-color: transparent;
        }

        .icon-btn .icon-circle {
            width: clamp(44px, 4.2vw, 62px);
            height: clamp(44px, 4.2vw, 62px);
            min-width: clamp(44px, 4.2vw, 62px);
            min-height: clamp(44px, 4.2vw, 62px);
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(19px, 1.8vw, 27px);
            line-height: 1;
            position: relative;
            z-index: 101;
            box-sizing: border-box;
            opacity: 1 !important;
            visibility: visible !important;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .icon-btn .icon-circle.home {
            background: #6c5ce7 !important;
            border-radius: 14px !important;
            box-shadow: 0 4px 0 #5141b5, 0 7px 14px rgba(81, 65, 181, .25) !important;
        }

        .icon-btn .icon-circle.hint {
            background: #ffb52e !important;
            border-radius: 14px !important;
            box-shadow: 0 4px 0 #d28a00, 0 7px 14px rgba(210, 138, 0, .25) !important;
        }

        .icon-btn .icon-circle i {
            display: inline-block !important;
            color: #fff !important;
            opacity: 1 !important;
            visibility: visible !important;
            line-height: 1;
        }

        .icon-btn:hover .icon-circle {
            transform: translateY(-2px) scale(1.06);
        }

        .icon-btn:active .icon-circle {
            transform: translateY(2px) scale(.97);
        }

        .quiz-layout {
            flex: 1 1 auto;
            min-height: 0;
            width: min(100%, 1500px);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-card {
            width: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: clamp(7px, 1.2vh, 15px);
            text-align: center;
        }

        .question-heading {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 9px;
            margin: 0;
            color: #1f2d3d;
            font-size: clamp(16px, 1.8vw, 25px);
            line-height: 1.15;
            font-weight: 400;
            text-align: center;
        }

        .q-number {
            font-weight: 700;
            flex: 0 0 auto;
        }

        .visual-equation {
            width: 100%;
            display: grid;
            align-items: center;
            justify-content: stretch;
            overflow: visible;
            column-gap: clamp(8px, 1vw, 20px);
        }

        .picture-group {
            min-width: 0;
            width: 100%;
            max-width: none;
            height: clamp(190px, 35vh, 350px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .objects {
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: clamp(7px, .8vw, 13px);
            overflow: hidden;
        }

        .objects.count-5,
        .objects.count-6,
        .objects.count-7,
        .objects.count-8 {
            --img-size: clamp(86px, 8.2vw, 132px);
        }

        .objects.count-12 {
            --img-size: clamp(74px, 7vw, 112px);
        }

        .objects.count-14 {
            --img-size: clamp(68px, 6.4vw, 104px);
        }

        .objects.count-17,
        .objects.count-20,
        .objects.count-24 {
            --img-size: clamp(58px, 5.7vw, 92px);
        }

        .question-card.q5 .objects.count-24 {
            max-width: 520px;
            margin-inline: auto;
        }

        .question-card.q8 {
            gap: 5px;
        }

        .question-card.q8 .objects {
            gap: 2px;
        }

        .object {
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 72px;
            position: relative;
            overflow: hidden;
        }

        .object img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .object:nth-child(2n) img {
            animation-delay: -1.4s;
        }

        .object:nth-child(3n) img {
            animation-delay: -.7s;
        }

        @keyframes objectFloat {

            0%,
            100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }

            50% {
                transform: translateY(-7px) rotate(1deg) scale(1.035);
            }
        }

        .op {
            font-size: clamp(20px, 2.6vw, 38px);
            font-weight: 500;
            color: #1f2d3d;
            line-height: 1;
        }

        .answers {
            width: 100%;
            display: grid;
            align-items: center;
            justify-content: stretch;
            column-gap: clamp(8px, 1vw, 20px);
            row-gap: clamp(8px, 1.2vh, 14px);
        }

        .answer-slot {
            width: 100%;
            max-width: none;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(4px, 0.8vw, 12px);
        }

        .total-answer-row {
            grid-column: 1 / -1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 1vw, 16px);
            padding-top: clamp(2px, 0.4vh, 6px);
        }


        .answer-box {
            width: clamp(64px, 7.5vw, 108px);
            height: clamp(46px, 6.5vh, 68px);
            border: 3px solid #ff9b4a;
            border-radius: 16px;
            background: linear-gradient(180deg, #ffffff 0%, #fffaf5 100%);
            outline: none;
            text-align: center;
            font-family: "Livvic", sans-serif;
            font-size: clamp(17px, 2vw, 28px);
            /* font-weight: 600; */
            color: #1f2d3d;
            box-shadow: 0 5px 0 rgba(255, 155, 74, .22), 0 5px 12px rgba(255, 155, 74, .12);
            transition: border-color .2s ease, box-shadow .2s ease, transform .15s ease;
        }

        .total-box {
            width: 150px !important;
            height: 100px !important;
            border-color: #4caf50;
            background: #fff;
            font-size: 40px;
        }

        .total-box:focus {
            border-color: #2e9e47;
            box-shadow: 0 0 0 4px rgba(41, 180, 76, .15), 0 5px 0 rgba(41, 180, 76, .18), 0 7px 14px rgba(41, 180, 76, .12);
        }

        .question-text {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .question-text .answer-box {
            flex: 0 0 auto;
        }

        .answer-box:focus {
            border-color: #f58a32;
            box-shadow: 0 0 0 4px rgba(255, 155, 74, .16), 0 5px 0 rgba(255, 155, 74, .22), 0 7px 14px rgba(255, 155, 74, .12);
            transform: translateY(-1px);
        }

        .answer-box.correct {
            border-color: #29b44c;
            background: #eafff0;
            color: #16753d;
            box-shadow: 0 5px 0 rgba(41, 180, 76, .18), 0 5px 12px rgba(41, 180, 76, .10);
        }

        .answer-box.wrong {
            border-color: #ff4444;
            animation: eqShake .45s ease;
        }

        .kid-card .hint-close {
            margin-top: 18px;
            min-width: 110px;
            height: 44px;
            border: 0;
            border-radius: 24px;
            background: linear-gradient(145deg, #ffc94d, #f7a800);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #c17e00;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1;
            padding: 0 18px;
        }

        .kid-card .hint-close:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #c17e00;
        }

        .kid-icon img,
        #stars img,
        .final-kid-box h2 img {
            display: block;
            width: clamp(52px, 7vw, 88px);
            height: clamp(52px, 7vw, 88px);
            object-fit: contain;
            margin: 0 auto;
        }

        #stars {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 18px 0;
            flex-wrap: wrap;
        }

        #stars img {
            width: clamp(28px, 3vw, 48px);
            height: clamp(28px, 3vw, 48px);
        }

        .final-kid-box h2 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }


        @keyframes eqShake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-5px)
            }

            75% {
                transform: translateX(5px)
            }
        }

        .controls {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>

    <style>
        /* =========================================================
   RESPONSIVE MEDIA QUERIES — ordered, no duplicate queries
   Base styles stay above all media queries.
   ========================================================= */

        @media (max-width:900px) {
            .quiz {
                padding: 7px 11px;
                gap: 5px;
            }

            .question-card.q5 .question-heading {
                transform: translateY(12px);
            }

            .topbar {
                grid-template-columns: 58px minmax(0, 1fr) 58px;
            }

            .quiz-layout {
                width: 100%;
            }

            .visual-equation {
                width: 100%;
                flex-wrap: wrap;
                justify-content: flex-start;
                align-items: center;
                row-gap: 4px;
            }

            .picture-group {
                width: 100%;
                height: clamp(145px, 28vh, 245px);
            }

            .question-card {
                gap: 7px;
            }

            .answer-slot {
                width: 100%;
                flex-basis: auto;
            }

            .total-answer-row {
                grid-column: 1 / -1;
            }

            .picture-group {
                height: clamp(135px, 28vh, 245px);
            }

            .objects {
                width: 100%;
                gap: 3px;
            }

            .object {
                width: min(var(--img-size, 66px), 78px);
                height: min(var(--img-size, 66px), 78px);
            }

            .answer-box {
                width: clamp(58px, 9.5vw, 88px);
                height: 44px;
                font-size: 18px;
            }

            .total-box {
                width: 68px;
                height: 42px;
            }

            .op {
                font-size: 23px;
            }
        }

        @media (min-width:901px) and (max-width:1439px) {
            .question-card.q5 .question-heading {
                transform: translateY(18px);
            }

            .question-card.q8 .object {
                width: 58px;
                height: 58px;
                flex-basis: 58px;
            }

            .question-card.q8 .objects {
                display: grid;
                grid-template-columns: repeat(4, 58px);
                justify-content: center;
                align-content: center;
                gap: 2px;
            }
        }

        @media (max-width:600px) {
            .quiz {
                padding: 5px 7px;
                gap: 4px;
            }

            .topbar {
                grid-template-columns: 46px minmax(0, 1fr) 46px;
                gap: 5px;
            }

            .title {
                font-size: clamp(15px, 4.5vw, 21px);
            }

            .question-card {
                gap: 5px;
            }

            .answer-slot {
                width: 100%;
                flex-basis: auto;
            }

            .total-answer-row {
                grid-column: 1 / -1;
            }

            .question-heading {
                font-size: 15px;
                gap: 6px;
            }

            .picture-group {
                width: 100%;
                height: clamp(115px, 23vh, 170px);
            }

            .objects {
                width: 100%;
                gap: 3px;
            }

            .object {
                width: min(var(--img-size, 48px), 60px);
                height: min(var(--img-size, 48px), 60px);
            }

            .op {
                font-size: 19px;
            }

            .answers {
                column-gap: clamp(6px, 1.1vw, 18px);
            }

            .answer-box {
                width: clamp(48px, 14vw, 70px);
                height: 38px;
                border-width: 2px;
                border-radius: 9px;
                font-size: 16px;
            }

            .total-box {
                width: 62px;
                height: 36px;
            }
        }

        @media (max-width:400px) {
            .quiz {
                padding: 4px 5px;
                gap: 3px;
            }

            .topbar {
                grid-template-columns: 40px minmax(0, 1fr) 40px;
            }

            .title {
                font-size: 14px;
            }

            .question-heading {
                font-size: 13px;
            }

            .answer-slot {
                width: 100%;
                flex-basis: auto;
            }

            .total-answer-row {
                grid-column: 1 / -1;
            }

            .picture-group {
                width: 100%;
                height: clamp(100px, 20vh, 135px);
            }

            .objects {
                width: 100%;
                gap: 2px;
            }

            .object {
                width: min(var(--img-size, 40px), 50px);
                height: min(var(--img-size, 40px), 50px);
            }

            .op {
                font-size: 16px;
            }

            .answer-box {
                width: 42px;
                height: 32px;
                font-size: 14px;
                border-radius: 7px;
            }

            .total-box {
                width: 54px;
                height: 32px;
            }
        }

        @media (min-width:1200px) {

            .quiz {
                padding-left: 34px;
                padding-right: 34px;
            }

            .quiz-layout {
                width: min(100%, 1500px);
            }

            .picture-group {
                height: clamp(235px, 38vh, 375px);
            }

            .objects {
                width: 100%;
                gap: 6px;
            }

            .objects.count-5,
            .objects.count-6,
            .objects.count-7,
            .objects.count-8,
            .objects.count-12,
            .objects.count-14,
            .objects.count-17,
            .objects.count-20,
            .objects.count-24 {
                --img-size: 72px;
            }

            .object {
                width: 72px;
                height: 72px;
                flex: 0 0 72px;
            }
        }

        @media (min-width:1440px) {

            .title {
                font-size: 40px;
            }

            .question-heading {
                font-size: 40px;
            }

            .picture-group {
                height: 380px;
            }

            .object {
                width: 76px;
                height: 76px;
                flex: 0 0 76px;
            }

            .answer-box {
                width: 118px;
                height: 68px;
            }

            .total-box {
                width: 150px !important;
                height: 100px !important;
            }
        }
    </style>
</head>

<body>
    <div class="quiz" id="quizCard">

        <div class="topbar">
            <button class="icon-btn home-btn" id="homeBtn" type="button" aria-label="Home">
                <span class="icon-circle home"><i class="fa-solid fa-house"></i></span>
            </button>

            <div class="title-block">
                <h1 class="title" id="titleText">Count and Write</h1>
            </div>

            <button class="icon-btn hint-btn" id="hintBtn" type="button" aria-label="Hint">
                <span class="icon-circle hint"><i class="fa-solid fa-lightbulb"></i></span>
            </button>
        </div>

        <div class="quiz-layout">
            <section class="question-card" id="questionCard"></section>
        </div>

        <!-- These controls intentionally use the existing reuse.css classes. -->
        <div class="controls">
            <button class="prev" id="prevBtn"><i class="fa-solid fa-circle-arrow-left"></i> Prev</button>
            <button class="next" id="nextBtn" disabled>Next <i class="fa-solid fa-circle-arrow-right"></i></button>
        </div>
    </div>

    <!-- One shared popup for answer feedback and hint messages -->
    <div id="singlePopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
            <button class="hint-close" id="popupCloseBtn" type="button">Close</button>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        const QUESTIONS = [

            {
                label: "Q1.", counts: [6, 6, 6], ops: ["+", "+"], answer: 18, type: "watermelon",
                hint: "Count the watermelon images in each group. Write the three counts and add them."
            },

            {
                label: "Q2.", counts: [16, 13], ops: ["+"], answer: 29, type: "rat",
                hint: "Count the rat images in the first group and the second group. Add both groups."
            },

            {
                label: "Q3.", counts: [11, 6, 8], ops: ["+", "+"], answer: 25, type: "cube",
                hint: "Count the cube images in each group. Add the three group totals."
            },

            {
                label: "Q4.", counts: [8, 5, 4, 6], ops: ["+", "+", "+"], answer: 23, type: "tomato",
                hint: "Count the tomato images in all four groups and add the four numbers."
            },

            {
                label: "Q5.", counts: [24, 1], ops: ["+"], answer: 25, type: "icecream",
                hint: "Count the ice cream images in the first group and add the one image in the middle."
            },

            {
                label: "Q6.", counts: [20, 0], ops: ["+"], answer: 20, type: "flower",
                hint: "There are 20 flower images in the first group and none in the middle group. Add them."
            },

            {
                label: "Q7.", counts: [8, 0], ops: ["+"], answer: 8, type: "kiwi",
                hint: "Start with 8 and add 0. The answer stays 8."
            },

            {
                label: "Q8.", counts: [16, 10, 10, 16], ops: ["+", "=", "+"], answer: 26, type: "pencil",
                hint: "16 + 10 = 10 + 16. Both sides have the same total: 26."
            }

        ];
        const total = QUESTIONS.length;
        let current = 0;
        const state = QUESTIONS.map(q => ({ values: Array(q.counts.length).fill(null), totalAnswer: null, done: false }));

        const questionCard = document.getElementById("questionCard");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const homeBtn = document.getElementById("homeBtn");
        const hintBtn = document.getElementById("hintBtn");
        const singlePopup = document.getElementById("singlePopup");
        const popupCloseBtn = document.getElementById("popupCloseBtn");
        const popupIcon = document.getElementById("popupIcon");
        const popupTitle = document.getElementById("popupTitle");
        const popupMsg = document.getElementById("popupMsg");
        const finalPopup = document.getElementById("finalPopup");
        const finalScore = document.getElementById("finalScore");
        const stars = document.getElementById("stars");
        const playAgainBtn = document.getElementById("playAgainBtn");

        const popupImages = {
            correct: "../assets/images/apple.png",
            wrong: "../assets/images/apple.png"
        };

        const IMAGE_PATHS = {
            orangeFruit: "../assets/images/orangeFruit.png",
            rat: "../assets/images/rat.png",
            samosa: "../assets/images/samosa.png",
            smallFly: "../assets/images/smallFly.png",
            squirrel: "../assets/images/squirrel.png",
            watermelon: "../assets/images/watermelon.png",
            tomato: "../assets/images/tomato.png",
            cube: "../assets/images/cube.png",
            icecream: "../assets/images/icecream.png",
            flower: "../assets/images/flower.png",
            kiwi: "../assets/images/kiwi.png",
            pencil: "../assets/images/pencil.png"
        };

        function speak(text) {
            if (!window.speechSynthesis) return;
            speechSynthesis.cancel();
            const message = new SpeechSynthesisUtterance(text);
            message.lang = "en-UK"; message.volume = .25; message.rate = 1; message.pitch = 1;
            speechSynthesis.speak(message);
        }

        function showPopup(isCorrect) {

            const popup = document.getElementById("singlePopup");
            const icon = document.getElementById("popupIcon");
            const title = document.getElementById("popupTitle");
            const message = document.getElementById("popupMsg");

            popup.className = "kid-popup " + (
                isCorrect ? "kid-correct" : "kid-wrong"
            );

            popupCloseBtn.style.display = "none";

            if (isCorrect) {
                icon.textContent = "🎉";
                title.textContent = "Great Job!";
                message.textContent = "You got it right!";
            } else {
                icon.textContent = "🥲";
                title.textContent = "Oops!";
                message.textContent = "Try again, you can do it!";
            }

            /* Force existing reuse.css popup to become visible */
            popup.style.setProperty("display", "flex", "important");

            clearTimeout(showPopup.timer);

            showPopup.timer = setTimeout(() => {
                popup.style.setProperty("display", "none", "important");
            }, 1400);
        }

        function smallConfetti() {
            if (window.confetti) confetti({ particleCount: 35, spread: 60, scalar: .8, origin: { y: .7 } });
        }
        function finalConfetti() {
            if (window.confetti) confetti({ particleCount: 150, spread: 100, origin: { y: .5 } });
        }

        function showFinal() {
            finalScore.textContent = `Your Score: ${total} / ${total}`;
            document.querySelector(".final-kid-box h2").textContent = "Congratulations!";
            stars.innerHTML = "⭐".repeat(total);
            finalPopup.style.display = "flex";
            finalConfetti();
        }

        function renderObjects(container, count, type) {
            container.innerHTML = "";
            container.className = "objects count-" + count;
            const src = IMAGE_PATHS[type];

            if (count === 0) return;

            for (let i = 0; i < count; i++) {
                const item = document.createElement("div");
                item.className = "object";

                const img = document.createElement("img");
                img.src = src;
                img.alt = type;
                img.draggable = false;

                item.appendChild(img);
                container.appendChild(item);
            }
        }

        function renderQuestion() {

            const q = QUESTIONS[current];
            const st = state[current];

            questionCard.innerHTML = "";
            questionCard.className = "question-card" + (q.label === "Q5." ? " q5" : "") + (q.label === "Q8." ? " q8" : "");

            const heading = document.createElement("h2");
            heading.className = "question-heading";
            heading.textContent = q.label;
            questionCard.appendChild(heading);

            const visualEquation = document.createElement("div");
            visualEquation.className = "visual-equation";
            visualEquation.style.gridTemplateColumns = Array.from({ length: q.counts.length }, () => "minmax(0,1fr)").join(" auto ");

            q.counts.forEach((count, i) => {
                const group = document.createElement("div");
                group.className = "picture-group";
                renderObjects(group, count, q.type);
                visualEquation.appendChild(group);

                if (i < q.ops.length) {
                    const op = document.createElement("span");
                    op.className = "op";
                    op.textContent = q.ops[i];
                    visualEquation.appendChild(op);
                }
            });

            questionCard.appendChild(visualEquation);

            const answersDiv = document.createElement("div");
            answersDiv.className = "answers";
            answersDiv.style.gridTemplateColumns = Array.from({ length: q.counts.length }, () => "minmax(0,1fr)").join(" auto ");

            q.counts.forEach((count, i) => {
                const slot = document.createElement("div");
                slot.className = "answer-slot";

                const input = document.createElement("input");
                input.className = "answer-box";
                input.type = "text";
                input.inputMode = "numeric";
                input.maxLength = 2;
                input.value = st.values[i] ?? "";

                if (st.values[i] !== null) {
                    input.disabled = true;
                    input.classList.add("correct");
                }

                input.addEventListener("input", () => {
                    input.value = input.value.replace(/\D/g, "").slice(0, 2);
                    if (input.value.length === String(count).length) {
                        validatePart(input, i, count);
                    }
                });

                slot.appendChild(input);
                answersDiv.appendChild(slot);

                if (i < q.ops.length) {
                    const op = document.createElement("span");
                    op.className = "op";
                    op.textContent = q.ops[i];
                    op.style.visibility = "hidden";
                    answersDiv.appendChild(op);
                }
            });

            const totalRow = document.createElement("div");
            totalRow.className = "total-answer-row";

            const totalSlot = document.createElement("div");
            totalSlot.className = "answer-slot";

            const totalInput = document.createElement("input");
            totalInput.className = "answer-box total-box";
            totalInput.type = "text";
            totalInput.inputMode = "numeric";
            totalInput.maxLength = 2;
            totalInput.placeholder = "?";
            if (st.totalAnswer !== null) {
                totalInput.value = st.totalAnswer;
                totalInput.disabled = true;
                totalInput.classList.add("correct");
            }

            totalInput.addEventListener("input", () => {
                totalInput.value = totalInput.value.replace(/\D/g, "").slice(0, 2);
                if (totalInput.value.length >= String(q.answer).length) {
                    validateTotal(totalInput, q.answer);
                }
            });

            totalSlot.appendChild(totalInput);
            totalRow.appendChild(totalSlot);
            answersDiv.appendChild(totalRow);

            questionCard.appendChild(answersDiv);

            prevBtn.disabled = current === 0;
            nextBtn.disabled = !st.done || current === total - 1;
        }
        function validatePart(input, index, expected) {

            if (input.disabled) return;

            const n = Number(input.value);

            if (n === expected) {

                state[current].values[index] = expected;

                input.disabled = true;
                input.classList.remove("wrong");
                input.classList.add("correct");
                speak("correct");
                // showPopup(true);

                const inputs = questionCard.querySelectorAll(".answer-box:not(.total-box)");
                const nextInput = inputs[index + 1];

                if (nextInput) {
                    setTimeout(() => {
                        nextInput.focus();
                    }, 300);
                } else {
                    setTimeout(() => {
                        const totalInput = questionCard.querySelector(".total-box");
                        if (totalInput) {
                            totalInput.focus();
                        }
                    }, 300);
                }

            } else if (input.value.length >= String(expected).length) {

                input.classList.remove("wrong");

                // Keep the wrong number visible while showing the error
                void input.offsetWidth;
                input.classList.add("wrong");
                speak("Try again");
                // showPopup(false);

                // Clear the input AFTER the user can see the wrong number
                setTimeout(() => {
                    input.value = "";
                    input.classList.remove("wrong");
                    input.focus();
                }, 700);
            }
        }

        function validateTotal(input, expected) {

            if (input.disabled) return;

            const n = Number(input.value);

            if (n === expected && state[current].values.every(v => v !== null)) {

                input.disabled = true;
                input.classList.remove("wrong");
                input.classList.add("correct");

                state[current].totalAnswer = expected;
                state[current].done = true;
                speak("correct");
                showPopup(true);
                smallConfetti();

                nextBtn.disabled = current === total - 1;

                if (current === total - 1) setTimeout(showFinal, 900);

            } else {

                input.classList.remove("wrong");
                void input.offsetWidth;
                input.classList.add("wrong");
                speak("Try again");
                showPopup(false);

                setTimeout(() => {
                    input.value = "";
                    input.classList.remove("wrong");
                    input.focus();
                }, 700);
            }
        }

        function checkAllParts() {
            if (state[current].values.every(v => v !== null)) {
                const totalInput = questionCard.querySelector(".answers input:last-child");
                if (totalInput) {
                    totalInput.focus();
                    totalInput.classList.remove("wrong");
                }
            }
        }

        prevBtn.addEventListener("click", () => {
            if (current > 0) {
                current--;
                renderQuestion();
            }
        });

        nextBtn.addEventListener("click", () => {
            if (!nextBtn.disabled && current < total - 1) {
                current++;
                renderQuestion();
            }
        });

        homeBtn.addEventListener("click", () => {
            window.top.location.href = "../Grade2_chapter3.html";
        });

        hintBtn.addEventListener("click", () => {
            const q = QUESTIONS[current];
            const hintImg = IMAGE_PATHS[q.type] || popupImages.correct;

            popupTitle.textContent = "Hint";
            popupMsg.textContent = q.hint;
            popupIcon.innerHTML = `<img src="${hintImg}" alt="${q.type}">`;
            popupCloseBtn.style.display = "inline-flex";
            singlePopup.className = "kid-popup kid-correct";
            singlePopup.style.display = "flex";
            clearTimeout(showPopup.timer);
        });

        popupCloseBtn.addEventListener("click", () => {
            singlePopup.style.display = "none";
            clearTimeout(showPopup.timer);
        });

        singlePopup.addEventListener("click", e => {
            if (e.target === singlePopup) {
                singlePopup.style.display = "none";
                clearTimeout(showPopup.timer);
            }
        });

        playAgainBtn.addEventListener("click", () => {
            finalPopup.style.display = "none";
            for (const s of state) {
                s.values = Array(s.values.length).fill(null);
                s.done = false;
            }
            current = 0;
            renderQuestion();
        });

        renderQuestion();
    </script>
</body>

</html>
