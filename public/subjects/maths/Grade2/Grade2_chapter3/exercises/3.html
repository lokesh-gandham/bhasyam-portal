<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fill in the boxes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/reuse.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* =========================================================
   BASE STYLES
   ========================================================= */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: "Livvic", sans-serif;
            background: #fff;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            background-color: #F8F4FF;
        }

        button {
            font-family: "Livvic", sans-serif;
        }

        .quiz {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            padding: clamp(8px, 1.4vh, 18px) clamp(14px, 2.5vw, 42px) clamp(8px, 1.2vh, 16px);
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1vh, 14px);
        }

        /* =========================================================
   HOME / HINT / TITLE
   ========================================================= */
        .topbar {
            width: 100%;
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: 90px minmax(0, 1fr) 90px;
            align-items: start;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .icon-circle {
            width: clamp(42px, 4.2vw, 62px);
            height: clamp(42px, 4.2vw, 62px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: clamp(18px, 1.8vw, 27px);
            transition: transform .2s ease;
        }

        .icon-btn .icon-circle.home {
            background: #6c5ce7 !important;
            border-radius: 14px !important;
            box-shadow: 0 4px 0 #5141b5, 0 7px 14px rgba(81, 65, 181, .25) !important;
            visibility: hidden !important;
        }

        .icon-btn .icon-circle.hint {
            background: #ffb52e !important;
            border-radius: 14px !important;
            box-shadow: 0 4px 0 #d28a00, 0 7px 14px rgba(210, 138, 0, .25) !important;
        }

        .title-block {
            min-width: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title {
            margin: 0;
            width: 100%;
            text-align: center;
            color: #303030;
            font-size: clamp(21px, 2.7vw, 40px);
            line-height: 1.12;
            font-weight: 400;
        }

        /* =========================================================
   SINGLE ACTIVITY AREA
   ========================================================= */
        .activity {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 1.6vh, 18px);
            padding: 2px 0;
        }

        .question-row {
            width: 100%;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 1.4vw, 22px);
        }

        .question-number {
            flex: 0 0 auto;
            margin: 0;
            color: #303030;
            text-align: left;
            font-size: 30px;
            line-height: 1;
        }

        .question-row .equation-wrap {
            width: auto;
            flex: 0 1 auto;
        }

        /* =========================================================
   EQUATION / ANSWER BOXES
   ========================================================= */
        .equation-wrap {
            width: min(1180px, 100%);
            min-width: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(4px, 1vh, 10px) 0;
        }

        .equation {
            max-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
            gap: clamp(7px, 1.1vw, 16px);
            white-space: nowrap;
            color: #303030;
            font-size: clamp(27px, 3.2vw, 48px);
            line-height: 1;
            font-weight: 600;
        }

        .eq-text {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .blank {
            width: clamp(68px, 7.3vw, 108px);
            height: clamp(52px, 6.4vw, 78px);
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #f19a51;
            border-radius: 12px;
            background: #fff;
            color: #5b3597;
            font-size: clamp(23px, 2.7vw, 30px);
            font-weight: 400;
            box-shadow: inset 0 0 0 2px #fff, 0 3px 8px rgba(0, 0, 0, .09);
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
        }

        .blank.active {
            border-color: #7b55c5;
            box-shadow: 0 0 0 4px rgba(123, 85, 197, .14), 0 4px 10px rgba(0, 0, 0, .10);
            transform: translateY(-2px);
        }

        .blank.filled {
            background: #ecfff2;
            border-color: #20b957;
            color: #168044;
        }

        /* =========================================================
   CALCULATOR KEYPAD
   ========================================================= */
        .calculator {
            width: min(430px, 92vw);
            padding: clamp(10px, 1.2vw, 16px);
            border: 3px solid #d7cce8;
            border-radius: 24px;
            background: #eee9f5;
            box-shadow: 0 6px 0 #cfc4df, 0 12px 22px rgba(0, 0, 0, .10);
        }

        .calculator-display {
            width: 100%;
            height: clamp(42px, 5.5vh, 58px);
            margin-bottom: clamp(8px, 1vh, 12px);
            padding: 0 16px;
            border: 2px solid #cfc4dc;
            border-radius: 13px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            color: #4b3a5f;
            font-size: clamp(20px, 2vw, 28px);
            font-weight: 400;
        }

        .keypad {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(7px, 1vw, 11px);
            padding: 0;
        }

        .key {
            min-width: 0;
            height: clamp(48px, 6.2vh, 64px);
            border: 2px solid #d2c8df;
            border-radius: 13px;
            background: linear-gradient(180deg, #ffffff 0%, #f5f1f9 100%);
            color: #34283f;
            font-size: clamp(21px, 2vw, 29px);
            font-weight: 400;
            cursor: pointer;
            box-shadow: 0 4px 0 #c9bfd6, 0 5px 10px rgba(0, 0, 0, .08);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
        }

        .key:hover {
            transform: translateY(-2px);
            background: #fff;
            box-shadow: 0 6px 0 #c9bfd6, 0 8px 12px rgba(0, 0, 0, .09);
        }

        .key:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c9bfd6;
        }

        .key.ten {
            font-size: clamp(18px, 1.7vw, 25px);
        }

        .key.zero {
            grid-column: 2;
        }

        .key.zero-full {
            grid-column: 1 / -1;
        }

        .key.selected {
            border-color: #8a61ca;
            background: #f5efff;
            color: #5c3798;
        }

        .key.disabled-key {
            opacity: .45;
            pointer-events: none;
        }

        /* =========================================================
   HINT POPUP
   ========================================================= */
        .hint-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3500;
            background: rgba(0, 0, 0, .25);
            padding: 16px;
        }

        .hint-overlay.show {
            display: flex;
        }

        .hint-box {
            width: min(420px, calc(100vw - 32px));
            padding: 26px 28px;
            background: #fff;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .18);
        }

        .hint-box h3 {
            margin: 0 0 10px;
            color: #e08e00;
            font-size: clamp(24px, 3vw, 32px);
            font-weight: 400;
        }

        .hint-box p {
            margin: 0;
            color: #1f2d3d;
            font-size: clamp(16px, 1.6vw, 21px);
            line-height: 1.45;
        }

        .hint-close {
            margin-top: 18px;
            min-width: 110px;
            height: 44px;
            border: 0;
            border-radius: 24px;
            background: linear-gradient(145deg, #ffc94d, #f7a800);
            color: #fff;
            font-family: "Livvic", sans-serif;
            font-size: 17px;
            font-weight: 400;
            cursor: pointer;
            box-shadow: 0 4px 0 #c17e00;
        }

        /* =========================================================
   MEDIA QUERY 1 — TABLET
   ========================================================= */
        @media (max-width:900px) {
            .quiz {
                padding: 7px 12px 6px;
                gap: 5px;
            }

            .topbar {
                grid-template-columns: 55px minmax(0, 1fr) 55px;
                gap: 6px;
            }

            .icon-circle {
                width: 44px;
                height: 44px;
                font-size: 17px;
            }

            .title {
                font-size: clamp(18px, 3.1vw, 27px);
            }

            .activity {
                gap: 10px;
            }

            .question-row {
                gap: 12px;
            }

            .question-number {
                font-size: 30px;
            }

            .equation {
                font-size: clamp(25px, 4vw, 38px);
                gap: 9px;
            }

            .blank {
                width: 76px;
                height: 57px;
                font-size: 28px;
            }

            .calculator {
                width: min(390px, 94%);
                padding: 10px;
            }

            .keypad {
                gap: 7px;
            }

            .key {
                height: 52px;
                font-size: 22px;
                border-radius: 12px;
            }
        }

        /* =========================================================
   MEDIA QUERY 2 — MOBILE
   ========================================================= */
        @media (max-width:600px) {
            .quiz {
                padding: 5px 8px 4px;
                gap: 3px;
            }

            .topbar {
                grid-template-columns: 42px minmax(0, 1fr) 42px;
                gap: 3px;
            }

            .icon-circle {
                width: 36px;
                height: 36px;
                font-size: 15px;
            }

            .title {
                font-size: clamp(15px, 4.5vw, 21px);
            }

            .activity {
                gap: 6px;
                padding: 0;
                justify-content: center;
            }

            .question-row {
                gap: 7px;
                align-items: center;
            }

            .question-number {
                font-size: 30px;
            }

            .equation-wrap {
                padding: 3px 0;
            }

            .equation {
                font-size: clamp(17px, 5.5vw, 25px);
                gap: 4px;
            }

            .equation.multi-box {
                font-size: clamp(15px, 4.8vw, 22px);
                gap: 3px;
            }

            .blank {
                width: 54px;
                height: 45px;
                border-width: 2px;
                border-radius: 9px;
                font-size: 21px;
            }

            .equation.multi-box .blank {
                width: 44px;
                height: 40px;
                font-size: 19px;
            }

            .calculator {
                width: min(315px, 96%);
                padding: 7px;
                border-radius: 18px;
            }

            .calculator-display {
                height: 36px;
                margin-bottom: 6px;
                font-size: 17px;
            }

            .keypad {
                gap: 5px;
            }

            .key {
                height: 42px;
                border-radius: 9px;
                font-size: 18px;
                box-shadow: 0 3px 0 #c9bfd6, 0 4px 8px rgba(0, 0, 0, .07);
            }

            .key.ten {
                font-size: 18px;
            }
        }

        /* =========================================================
   MEDIA QUERY 3 — VERY SMALL PHONES
   ========================================================= */
        @media (max-width:400px) {
            .quiz {
                padding: 4px 6px 3px;
                gap: 2px;
            }

            .topbar {
                grid-template-columns: 36px minmax(0, 1fr) 36px;
            }

            .icon-circle {
                width: 32px;
                height: 32px;
                font-size: 13px;
            }

            .title {
                font-size: 14px;
            }

            .activity {
                gap: 4px;
            }

            .question-row {
                gap: 5px;
            }

            .question-number {
                font-size: 20px;
            }

            .equation {
                font-size: clamp(15px, 5.8vw, 21px);
                gap: 3px;
            }

            .equation.multi-box {
                font-size: 15px;
                gap: 2px;
            }

            .blank {
                width: 46px;
                height: 38px;
                font-size: 18px;
                border-radius: 8px;
            }

            .equation.multi-box .blank {
                width: 38px;
                height: 34px;
                font-size: 16px;
            }

            .calculator {
                width: min(275px, 96%);
                padding: 6px;
                border-radius: 16px;
            }

            .calculator-display {
                height: 32px;
                margin-bottom: 5px;
                font-size: 15px;
            }

            .keypad {
                gap: 4px;
            }

            .key {
                height: 38px;
                border-radius: 8px;
                font-size: 16px;
            }

            .key.ten {
                font-size: 16px;
            }
        }

        /* =========================================================
   MEDIA QUERY 4 — SHORT SCREENS
   ========================================================= */
        @media (max-height:640px) {
            .quiz {
                gap: 2px;
            }

            .activity {
                gap: 4px;
            }

            .question-row {
                gap: 6px;
            }

            .question-number {
                font-size: 30px;
            }

            .equation {
                font-size: clamp(21px, 3vw, 32px);
            }

            .blank {
                width: 62px;
                height: 44px;
                font-size: 22px;
            }

            .calculator {
                padding: 6px;
            }

            .calculator-display {
                height: 32px;
                margin-bottom: 5px;
                font-size: 16px;
            }

            .keypad {
                gap: 4px;
            }

            .key {
                height: 38px;
                font-size: 17px;
            }
        }

        /* =========================================================
   MEDIA QUERY 5 — LARGE DESKTOP
   ========================================================= */
        @media (min-width:1200px) {
            .quiz {
                padding-left: 40px;
                padding-right: 40px;
            }

            .activity {
                gap: 16px;
            }

            .question-row { 
                gap: 18px;
            }

            .equation {
                font-size: 43px;
                gap: 14px;
            }

            .blank {
                width: 100px;
                height: 72px;
                font-size: 35px;
            }

            .calculator {
                width: 500px;
                padding: 14px;
            }

            .keypad {
                gap: 12px;
            }

            .key {
                height: 54px;
            }
        }

        /* =========================================================
   MEDIA QUERY 6 — EXTRA LARGE DESKTOP
   ========================================================= */
        @media (min-width:1440px) {
            .title {
                font-size: 40px;
            }

            .question-number {
                font-size: 40px;
            }

            .question-row {
                gap: 20px;
            }

            .equation {
                font-size: 48px;
                gap: 16px;
            }

            .blank {
                width: 108px;
                height: 78px;
                font-size: 40px;
            }

            .calculator {
                width: 520px;
                padding: 16px;
            }

            .keypad {
                gap: 13px;
            }

            .key {
                height: 68px;
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="quiz" id="quizCard">
        <div class="topbar">
            <button class="icon-btn" id="homeBtn" aria-label="Home">
                <span class="icon-circle home"><i class="fa-solid fa-house"></i></span>
            </button>
            <div class="title-block">
                <h1 class="title">Find the Missing Number</h1>
            </div>
            <button class="icon-btn" id="hintBtn" aria-label="Hint">
                <span class="icon-circle hint"><i class="fa-solid fa-lightbulb"></i></span>
            </button>
        </div>

        <main class="activity">
            <div class="question-row">
                <p class="question-number" id="questionNumber">Q1.</p>
                <div class="equation-wrap">
                    <div class="equation" id="equation"></div>
                </div>
            </div>
            <div class="calculator" aria-label="Calculator number choices">
                <div class="calculator-display" id="calculatorDisplay">Select a number</div>
                <div class="keypad" id="keypad" aria-label="Number keypad"></div>
            </div>
        </main>

        <div class="controls">
            <button class="prev" id="prevBtn" disabled>
                <i class="fa-solid fa-circle-arrow-left"></i> Prev
            </button>
            <button class="next" id="nextBtn" disabled>
                Next <i class="fa-solid fa-circle-arrow-right"></i>
            </button>
        </div>
    </div>

    <div class="hint-overlay" id="hintOverlay">
        <div class="hint-box">
            <h3>Hint</h3>
            <p id="hintText"></p>
            <button class="hint-close" id="closeHintBtn">Got it!</button>
        </div>
    </div>

    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        const QUESTIONS = [
    { label: "Q1.", equation: ["24", "+", "box0", "=", "24"], answers: ["0"], hint: "24 plus what number stays 24? Think about the number that adds nothing." },
    { label: "Q2.", equation: ["box0", "+", "1", "=", "70"], answers: ["69"], hint: "Find the value that makes the equation work." },
    { label: "Q3.", equation: ["56", "+", "box0", "=", "57"], answers: ["1"], hint: "What must be added to 56 to make 57?" },
    { label: "Q4.", equation: ["box0", "+", "0", "=", "89"], answers: ["89"], hint: "Adding zero does not change a number. So the box must be 89." },
    { label: "Q5.", equation: ["70", "+", "1", "=", "box0"], answers: ["71"], hint: "Add 1 to 70 to find the number in the box." },
    { label: "Q6.", equation: ["35", "+", "0", "=", "box0"], answers: ["35"], hint: "Adding zero leaves the number unchanged." },
    { label: "Q7.", equation: ["68", "+", "box0", "=", "19", "+", "box1"], answers: ["19", "68"], hint: "Choose numbers that make both sides equal: 68 + 19 = 19 + 68." },
    { label: "Q8.", equation: ["11", "+", "box0", "=", "28", "+", "box1"], answers: ["28", "11"], hint: "Choose numbers that make both sides equal: 11 + 28 = 28 + 11." },
    { label: "Q9.", equation: ["35", "+", "box0", "=", "57", "+", "box1"], answers: ["57", "35"], hint: "Choose numbers that make both sides equal: 35 + 57 = 57 + 35." },
    { label: "Q10.", equation: ["40", "+", "box0", "=", "box1", "+", "40", "=", "40"], answers: ["0", "0"], hint: "Work from left to right. The boxes must keep the total equal to 40." }
];

const total = QUESTIONS.length;
let current = 0;
let answered = QUESTIONS.map(() => false);
let values = QUESTIONS.map(q => q.answers.map(() => ""));
let boxCorrect = QUESTIONS.map(q => q.answers.map(() => false));
let activeBox = 0;

const questionNumber = document.getElementById("questionNumber");
const equation = document.getElementById("equation");
const keypad = document.getElementById("keypad");
const calculatorDisplay = document.getElementById("calculatorDisplay");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const homeBtn = document.getElementById("homeBtn");
const hintBtn = document.getElementById("hintBtn");
const hintOverlay = document.getElementById("hintOverlay");
const hintText = document.getElementById("hintText");
const closeHintBtn = document.getElementById("closeHintBtn");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function speak(text) {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const message = new SpeechSynthesisUtterance(text);
    message.lang = "en-UK"; message.volume = .25; message.rate = 1; message.pitch = 1;
    speechSynthesis.speak(message);
}
function smallConfetti() {
    if (window.confetti) confetti({ particleCount: 35, spread: 60, scalar: .8, origin: { y: .7 } });
}
function finalConfetti() {
    if (window.confetti) confetti({ particleCount: 150, spread: 100, origin: { y: .5 } });
}
function showPopup(isCorrect) {

    const popup = document.getElementById("answerPopup");
    const icon = document.getElementById("popupIcon");
    const title = document.getElementById("popupTitle");
    const message = document.getElementById("popupMsg");

    popup.className = "kid-popup " + (
        isCorrect ? "kid-correct" : "kid-wrong"
    );

    if (isCorrect) {
        icon.textContent = "🎉";
        title.textContent = "Great Job!";
        message.textContent = "You got it right!";
    } else {
        icon.textContent = "🥲";
        title.textContent = "Oops!";
        message.textContent = "Try again, you can do it!";
    }

    /* Force existing reuse.css popup to become visible */
    popup.style.setProperty("display", "flex", "important");

    clearTimeout(showPopup.timer);

    showPopup.timer = setTimeout(() => {
        popup.style.setProperty("display", "none", "important");
    }, 1400);
}
function showFinal() {
    const popup = document.getElementById("finalPopup");
    document.getElementById("finalScore").textContent = `Your Score: ${total} / ${total}`;
    document.getElementById("stars").textContent = "⭐".repeat(total);
    popup.style.display = "flex"; finalConfetti();
}

function renderEquation() {
    const q = QUESTIONS[current];
    if (calculatorDisplay) {
        calculatorDisplay.textContent = values[current][activeBox] || "—";
    }
    equation.classList.toggle("multi-box", q.answers.length > 1);
    equation.innerHTML = "";
    q.equation.forEach(part => {
        if (part.startsWith("box")) {
            const index = Number(part.replace("box", ""));
            const box = document.createElement("button");
            box.type = "button"; box.className = "blank"; box.dataset.index = index;
            box.textContent = values[current][index];
            if (boxCorrect[current][index]) box.classList.add("filled");
            else if (index === activeBox) box.classList.add("active");
            box.addEventListener("click", () => {
                if (answered[current]) return;
                activeBox = index;
                values[current][index] = "";
                boxCorrect[current][index] = false;
                renderEquation();
            });
            equation.appendChild(box);
        } else {
            const text = document.createElement("span");
            text.className = "eq-text"; text.textContent = part; equation.appendChild(text);
        }
    });

    // Keep the keypad's key-length in sync with whichever box is active.
    renderKeypad();
}

/**
 * Build the candidate numbers (as strings) for the keypad, matching the
 * digit-length of the expected answer.
 * - Single-digit answers: fixed calculator/phone-keypad order —
 *   7 8 9 / 4 5 6 / 1 2 3 / 0 (0 spans the full last row). This set
 *   naturally covers every single digit, so the correct answer is
 *   always present.
 * - Multi-digit answers: 12 shuffled same-length numbers (4 full rows of
 *   3 in the grid, no leftover partial row), always including the
 *   correct answer plus random distractors.
 */
function generateKeyOptions(expected) {
    const digitCount = expected.length;

    if (digitCount <= 1) {
        return ["7", "8", "9", "6", "5", "4", "1", "2", "3", "0"];
    }

    const options = new Set();
    options.add(expected);
    const min = Math.pow(10, digitCount - 1);
    const max = Math.pow(10, digitCount) - 1;
    while (options.size < 12) {
        const rand = Math.floor(Math.random() * (max - min + 1)) + min;
        options.add(String(rand));
    }

    const arr = Array.from(options);
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function renderKeypad() {
    const q = QUESTIONS[current];
    const idx = (activeBox >= 0 && activeBox < q.answers.length) ? activeBox : 0;
    const expected = q.answers[idx];
    const options = generateKeyOptions(expected);

    keypad.innerHTML = "";
    options.forEach(value => {
        const button = document.createElement("button");
        button.type = "button";
        let cls = "key ten";                        // same font-size for 1 and 2 digit keys
        if (value === "0") cls += " zero-full";     // 0 takes the full last row
        button.className = cls;
        button.textContent = value;
        button.setAttribute("aria-label", `Number ${value}`);
        button.addEventListener("click", () => selectNumber(value, idx));
        keypad.appendChild(button);
    });
}

function getNextEmptyBox() {
    const vals = values[current];
    return vals.findIndex(v => v === "");
}

function rejectWrongDigit(index) {
    wrongSound.currentTime = 0;
    wrongSound.play().catch(() => { });
    speak("Try again");
    showPopup(false);

    values[current][index] = "";
    boxCorrect[current][index] = false;
    activeBox = index;
    calculatorDisplay.textContent = "—";
    renderEquation();
}

function selectNumber(value, idx) {
    if (answered[current]) return;

    const q = QUESTIONS[current];
    const index = (idx !== undefined && idx !== null) ? idx : activeBox;
    const expected = q.answers[index];

    if (value !== expected) {
        rejectWrongDigit(index);
        return;
    }

    values[current][index] = value;
    boxCorrect[current][index] = true;
    calculatorDisplay.textContent = value;

    const next = getNextEmptyBox();

    if (next !== -1) {
        activeBox = next;
        renderEquation();
        return;
    }

    // All boxes for this question are filled and correct -> show popup now.
    answered[current] = true;
    activeBox = 0;
    renderEquation();

    correctSound.currentTime = 0;
    correctSound.play().catch(() => { });
    speak("Correct");
    showPopup(true);
    smallConfetti();

    nextBtn.disabled = current >= total - 1;

    if (current === total - 1) {
        setTimeout(showFinal, 1300);
    }
}

function renderQuestion() {
    const q = QUESTIONS[current];
    questionNumber.textContent = q.label;
    calculatorDisplay.textContent = values[current][activeBox] ? `Box: ${values[current][activeBox]}` : `Box ${activeBox + 1}`;
    activeBox = getNextEmptyBox();
    if (activeBox === -1) activeBox = 0;
    renderEquation();
    prevBtn.disabled = current === 0;
    nextBtn.disabled = !answered[current] || current === total - 1;
}

prevBtn.addEventListener("click", () => {
    if (current === 0) return;
    current--; renderQuestion();
});
nextBtn.addEventListener("click", () => {
    if (!answered[current] || current >= total - 1) return;
    current++; renderQuestion();
});
homeBtn.addEventListener("click", () => { window.top.location.href = "../Grade2_chapter3.html"; });
hintBtn.addEventListener("click", () => { hintText.textContent = QUESTIONS[current].hint; hintOverlay.classList.add("show"); });
closeHintBtn.addEventListener("click", () => hintOverlay.classList.remove("show"));
hintOverlay.addEventListener("click", event => { if (event.target === hintOverlay) hintOverlay.classList.remove("show"); });

renderQuestion();
    </script>
</body>
