<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Add Using Number Line</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/reuse.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Livvic', sans-serif;
            background: #f7f7f7;
        }

        .quiz {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            /* padding: 14px; */
        }

        .topbar {
            display: grid;
            grid-template-columns: 80px 1fr 80px;
            align-items: center;
        }

        .icon-btn {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 28px;
        }

        .icon-btn .icon-circle.home {
            background: #6c5ce7 !important;
            border-radius: 14px !important;
            box-shadow: 0 4px 0 #5141b5, 0 7px 14px rgba(81, 65, 181, .25) !important;
        }

        .icon-btn .icon-circle.hint {
            background: #ffb52e !important;
            border-radius: 14px !important;
            box-shadow: 0 4px 0 #d28a00, 0 7px 14px rgba(210, 138, 0, .25) !important;
        }

        .title-block {
            display: flex;
            justify-content: center;
        }

        .title {
            /* background:#8249d4; */
            /* color:#fff; */
            padding: 12px 40px;
            /* border-radius:50px; */
            font-size: 36px;
        }

        .question-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            overflow: hidden;
            padding-top: 24px;
        }

        .question-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .question-label {
            font-size: 30px;
            /* font-weight:700; */
        }

        .sum-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .box {
            width: 110px;
            height: 110px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            /* font-weight: 700; */
        }

        .start {
            background: #efe8ff;
            border: 3px dashed #b592ff;
            color: #682dc5;
        }

        .jump {
            background: #fff0f7;
            border: 3px dashed #ff7fac;
            color: #ff2f79;
        }

        .answer {
            background: #fff9e3;
            border: 3px dashed #ffc73f;
            color: #ff8515;
        }

        .sign {
            font-size: 72px;
            font-weight: 400;
        }

        .number-line-wrapper {
            width: min(1300px, 98%);
            flex: 1;
            min-height: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            overflow: hidden;
        }

        .jump-svg {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }

        .number-line {
            width: 100%;
            display: flex;
            justify-content: space-between;
            position: relative;
            padding-top: 80px;
            gap: 4px;
        }


        .number-line::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 38px;
            height: 4px;
            background: #0647aa;
        }

        .line-number {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid #2a7cf6;
            background: #fff;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            z-index: 2;
            transition: .25s;
            position: relative;
        }

        .line-number:hover {
            transform: scale(1.1);
        }

        .start-highlight {
            background: hsl(41, 100%, 50%);
            border-color: #d89503;
            color: #fff;
            transform: scale(1.18);
        }

        .start-highlight:hover {
            transform: scale(1.24);
        }

        .jump-active {
            background: #ff4375;
            color: #fff;
            border-color: #ff4375;
            transform: scale(1.15);
        }

        .number-tick {
            position: absolute;
            left: 50%;
            top: -24px;
            width: 2px;
            height: 28px;
            background: #0647aa;
            transform: translateX(-50%);
        }

        .number-text {
            position: relative;
            z-index: 2;
        }

        .correct-number {
            background: #53b94d;
            border-color: #53b94d;
            color: #fff;
        }



        @media(max-width:700px) {

            .box {
                width: 70px;
                height: 70px;
                font-size: 34px;
            }

            .sign {
                font-size: 38px;
            }

            .line-number {
                width: 25px;
                height: 25px;
                font-size: 9px;
            }

            .question-label {
                font-size: 18px;
            }

            .title {
                padding: 8px 18px;
                font-size: 18px;
            }

        }

        @media(max-width:450px) {

            .box {
                width: 55px;
                height: 55px;
                font-size: 26px;
            }

            .sign {
                font-size: 28px;
            }

            .line-number {
                width: 20px;
                height: 20px;
                font-size: 8px;
            }

        }

        /* ================= LAPTOP ================= */

        @media (min-width: 901px) and (max-width: 1366px) {

            .quiz {
                padding: 12px 24px;
            }

            .topbar {
                grid-template-columns: 90px 1fr 90px;
            }

            .title {
                padding: 11px 34px;
                font-size: 32px;
            }

            .question-area {
                gap: 18px;
                padding-top: 8px;
            }

            .question-row {
                gap: 18px;
            }

            .question-label {
                font-size: 27px;
            }

            .sum-row {
                gap: 18px;
            }

            .box {
                width: 100px;
                height: 100px;
                font-size: 62px;
            }

            .sign {
                font-size: 64px;
            }

            .number-line-wrapper {
                width: min(1180px, 96%);
                margin-left: auto;
                margin-right: auto;
            }

            .number-line {
                width: 100%;
                padding-top: 78px;
            }

            .number-line::before {
                top: 38px;
                height: 4px;
            }

            .line-number {
                width: 40px;
                height: 40px;
                font-size: 17px;
            }

            .number-tick {
                top: -24px;
                height: 28px;
                width: 2px;
            }

            .controls {
                padding-bottom: 8px;
            }
        }

        @media (min-width: 1367px) and (max-width: 1400px) {

            .quiz {
                padding: 12px 28px;
            }

            .topbar {
                grid-template-columns: 100px 1fr 100px;
            }

            .icon-btn {
                font-size: 32px;
            }

            .title {
                padding: 14px 48px;
                font-size: 40px;
            }

            .question-area {
                gap: 20px;
                padding-top: 18px;
            }

            .question-row {
                gap: 28px;
            }

            .question-label {
                font-size: 34px;
            }

            .sum-row {
                gap: 28px;
            }

            .box {
                width: 125px;
                height: 125px;
                font-size: 82px;
                border-radius: 26px;
            }

            .sign {
                font-size: 82px;
            }

            .number-line-wrapper {
                width: 100%;
                max-width: 1400px;
                margin-left: auto;
                margin-right: auto;
            }

            .jump-svg {
                width: 100%;
                height: 220px;
                top: -5px;
            }

            .number-line {
                width: 100%;
                padding-top: 88px;
            }

            .number-line::before {
                top: 42px;
                height: 5px;
            }

            .line-number {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .number-tick {
                top: -30px;
                width: 3px;
                height: 36px;
            }

            .controls {
                gap: 28px;
                padding-bottom: 12px;
            }

            .controls button {
                padding: 14px 34px;
                font-size: 20px;
            }
        }




        @media (min-width:1440px) {

            .quiz {
                padding: 16px 28px;
            }

            .topbar {
                grid-template-columns: 100px 1fr 100px;
                min-height: 76px;
            }

            .title {
                padding: 15px 48px;
                font-size: 42px;
            }

            .question-area {
                gap: 20px;
                padding-top: 26px;
            }

            .question-row {
                gap: 28px;
            }

            .question-label {
                font-size: 36px;
            }

            .sum-row {
                gap: 24px;
            }

            .box {
                width: 125px;
                height: 125px;
                font-size: 80px;
                border-radius: 27px;
            }

            .sign {
                font-size: 82px;
            }

            .number-line-wrapper {
                width: 100%;
                max-width: 1500px;
            }

            .jump-svg {
                width: 100%;
                height: 230px;
                top: -5px;
            }

            .number-line {
                width: 100%;
                padding-top: 88px;
                gap: 10px;
            }

            .number-line::before {
                top: 40px;
                height: 5px;
            }

            .line-number {
                width: 48px;
                height: 48px;
                font-size: 19px;
            }

            .number-tick {
                top: -30px;
                width: 3px;
                height: 38px;
            }

            .controls {
                gap: 28px;
                padding-bottom: 10px;
            }

            .controls button {
                padding: 14px 34px;
                font-size: 20px;
            }
        }


        /* ================= HOME / HINT / TITLE MATCH ================= */

        .topbar {
            width: 100%;
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: 90px minmax(0, 1fr) 90px;
            align-items: start;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .icon-circle {
            width: clamp(42px, 4.2vw, 62px);
            height: clamp(42px, 4.2vw, 62px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: clamp(18px, 1.8vw, 27px);
            transition: transform .2s ease;
        }

        .icon-btn:hover .icon-circle {
            transform: scale(1.06);
        }

        .icon-circle.home {
            background: linear-gradient(145deg, #8b6fe0, #6f42c1);
            box-shadow: 0 4px 0 #4f2e93;
        }

        .icon-circle.hint {
            background: linear-gradient(145deg, #ffc94d, #f7a800);
            box-shadow: 0 4px 0 #c17e00;
        }

        .title-block {
            min-width: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title {
            margin: 0;
            text-align: center;
            color: #303030;
            font-size: clamp(21px, 2.7vw, 40px);
            line-height: 1.12;
            font-weight: 400;
            background: none;
            padding: 12px 40px;
            border-radius: 0;
        }

        /* ================= HINT POPUP MATCH ================= */

        .hint-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3500;
            background: rgba(0, 0, 0, .25);
            padding: 16px;
        }

        .hint-overlay.show {
            display: flex;
        }

        .hint-box {
            width: min(420px, calc(100vw - 32px));
            padding: 26px 28px;
            background: #fff;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .18);
        }

        .hint-box h3 {
            margin: 0 0 10px;
            color: #e08e00;
            font-size: clamp(24px, 3vw, 32px);
            font-weight: 700;
        }

        .hint-box p {
            margin: 0;
            color: #1f2d3d;
            font-size: clamp(16px, 1.6vw, 21px);
            line-height: 1.45;
        }

        .hint-close {
            margin-top: 18px;
            min-width: 110px;
            height: 44px;
            border: 0;
            border-radius: 24px;
            background: linear-gradient(145deg, #ffc94d, #f7a800);
            color: #fff;
            font-family: "Livvic", sans-serif;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #c17e00;
        }
    </style>
</head>

<body>

    <div class="quiz">

        <div class="topbar">
            <button class="icon-btn" id="homeBtn" aria-label="Home">
                <span class="icon-circle home"><i class="fa-solid fa-house"></i></span>
            </button>

            <div class="title-block">
                <h1 class="title">Add using the number line</h1>
            </div>

            <button class="icon-btn" id="hintBtn" aria-label="Hint">
                <span class="icon-circle hint"><i class="fa-solid fa-lightbulb"></i></span>
            </button>
        </div>

        <main class="question-area">

            <div class="question-row">

                <p class="question-label" id="questionLabel">
                    Q1.
                </p>

                <div class="sum-row">

                    <div class="box start" id="startValue"></div>

                    <div class="sign">+</div>

                    <div class="box jump" id="jumpValue"></div>

                    <div class="sign">=</div>

                    <div class="box answer" id="answerValue">?</div>

                </div>

            </div>

            <div class="number-line-wrapper">

                <svg class="jump-svg" id="jumpSvg">
                </svg>

                <div class="number-line" id="numberLine">
                </div>

            </div>

        </main>

        <div class="controls">

            <button class="prev" id="prevBtn" disabled>
                <i class="fa-solid fa-circle-arrow-left"></i> Prev
            </button>

            <button class="next" id="nextBtn" disabled>
                Next <i class="fa-solid fa-circle-arrow-right"></i>
            </button>

        </div>

    </div>

    <div class="hint-overlay" id="hintOverlay">
        <div class="hint-box">
            <h3>Hint</h3>
            <p id="hintText"></p>
            <button class="hint-close" id="closeHintBtn">Got it!</button>
        </div>
    </div>

    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>


    <script>
        const QUESTIONS = [
            { label: "Q1.", start: 17, jump: 6, answer: 23, hint: "Start at 17 and count forward 6 jumps on the number line." },
            { label: "Q2.", start: 20, jump: 9, answer: 29, hint: "Start at 20 and count forward 9 jumps on the number line." },
            { label: "Q3.", start: 18, jump: 7, answer: 25, hint: "Start at 18 and count forward 7 jumps on the number line." },
            { label: "Q4.", start: 13, jump: 8, answer: 21, hint: "Start at 13 and count forward 8 jumps on the number line." }
        ];

        const total = QUESTIONS.length;
        let current = 0;
        let score = 0;
        let answered = QUESTIONS.map(() => false);

        const questionLabel = document.getElementById("questionLabel");
        const startValue = document.getElementById("startValue");
        const jumpValue = document.getElementById("jumpValue");
        const answerValue = document.getElementById("answerValue");
        const numberLine = document.getElementById("numberLine");
        const jumpSvg = document.getElementById("jumpSvg");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const homeBtn = document.getElementById("homeBtn");
        const hintBtn = document.getElementById("hintBtn");
        const hintOverlay = document.getElementById("hintOverlay");
        const hintText = document.getElementById("hintText");
        const closeHintBtn = document.getElementById("closeHintBtn");
        const correctSound = document.getElementById("correctSound");
        const wrongSound = document.getElementById("wrongSound");

        function speak(text) {
            if (!window.speechSynthesis) return;
            speechSynthesis.cancel();
            const message = new SpeechSynthesisUtterance(text);
            message.lang = "en-UK";
            message.volume = .25;
            message.rate = 1;
            message.pitch = 1;
            speechSynthesis.speak(message);
        }

        function smallConfetti() {
            if (window.confetti) {
                confetti({
                    particleCount: 35,
                    spread: 60,
                    scalar: .8,
                    origin: { y: .7 }
                });
            }
        }

        function finalConfetti() {
            if (window.confetti) {
                confetti({
                    particleCount: 150,
                    spread: 100,
                    origin: { y: .5 }
                });
            }
        }

        function showPopup(isCorrect) {
            const popup = document.getElementById("answerPopup");
            const icon = document.getElementById("popupIcon");
            const title = document.getElementById("popupTitle");
            const message = document.getElementById("popupMsg");

            popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");

            if (isCorrect) {
                icon.textContent = "🎉";
                title.textContent = "Great Job!";
                message.textContent = "You got it right!";
            } else {
                icon.textContent = "🥲";
                title.textContent = "Oops!";
                message.textContent = "Try again, you can do it!";
            }

            popup.style.setProperty("display", "flex", "important");

            clearTimeout(showPopup.timer);

            showPopup.timer = setTimeout(() => {
                popup.style.setProperty("display", "none", "important");
            }, 1400);
        }

        function showFinal() {
            const popup = document.getElementById("finalPopup");
            document.getElementById("finalScore").textContent = `Your Score: ${total} / ${total}`;
            document.getElementById("stars").textContent = "⭐".repeat(score);
            popup.style.display = "flex";
            finalConfetti();
        }

        function renderQuestion() {
            const q = QUESTIONS[current];

            questionLabel.textContent = q.label;
            startValue.textContent = q.start;
            jumpValue.textContent = q.jump;
            answerValue.textContent = answered[current] ? q.answer : "?";

            numberLine.innerHTML = "";
            jumpSvg.innerHTML = "";

            for (let i = 0; i <= 30; i++) {
                const btn = document.createElement("button");

                btn.type = "button";
                btn.className = "line-number";

                btn.innerHTML = `
            <span class="number-tick"></span>
            <span class="number-text">${i}</span>
        `;

                btn.dataset.value = i;

                if (i === q.start) {
                    btn.classList.add("start-highlight");
                }

                btn.onclick = () => {
                    checkAnswer(i);
                };

                numberLine.appendChild(btn);
            }

            prevBtn.disabled = current === 0;
            nextBtn.disabled = !answered[current] || current === total - 1;
        }

        function drawArc(from, to, color) {
            const svg = document.getElementById("jumpSvg");

            const fromEl = document.querySelector(`[data-value="${from}"]`);
            const toEl = document.querySelector(`[data-value="${to}"]`);
            const line = document.querySelector(".number-line");

            if (!fromEl || !toEl || !line) return;

            const svgRect = svg.getBoundingClientRect();
            const fromRect = fromEl.getBoundingClientRect();
            const toRect = toEl.getBoundingClientRect();
            const lineRect = line.getBoundingClientRect();

            const startX =
                fromRect.left - svgRect.left + fromRect.width / 2;

            const endX =
                toRect.left - svgRect.left + toRect.width / 2;

            const baseY =
                lineRect.top - svgRect.top + 42;

            const peakY = baseY - 95;

            const path = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "path"
            );

            path.setAttribute(
                "d",
                `M ${startX} ${baseY}
         Q ${(startX + endX) / 2} ${peakY}
         ${endX} ${baseY}`
            );

            path.setAttribute("fill", "none");
            path.setAttribute("stroke", color);
            path.setAttribute("stroke-width", "6");
            path.setAttribute("stroke-linecap", "round");

            svg.appendChild(path);
        }

        function animateJump(start, jump, answer) {
            let step = 0;

            const timer = setInterval(() => {
                if (step < jump) {
                    drawArc(
                        start + step,
                        start + step + 1,
                        step % 2 === 0 ? "#ff4444" : "#31c35c"
                    );

                    const element = document.querySelector(
                        `[data-value="${start + step + 1}"]`
                    );

                    if (element) {
                        element.classList.add("jump-active");
                    }

                    step++;
                } else {
                    clearInterval(timer);

                    const finalElement = document.querySelector(
                        `[data-value="${answer}"]`
                    );

                    if (finalElement) {
                        finalElement.classList.add("correct-number");
                    }

                    answerValue.textContent = answer;
                    score++;
                    answered[current] = true;

                    correctSound.currentTime = 0;
                    correctSound.play().catch(() => { });

                    speak("Correct");
                    showPopup(true);
                    smallConfetti();

                    nextBtn.disabled = current >= total - 1;

                    if (current === total - 1) {
                        setTimeout(showFinal, 1300);
                    }
                }
            }, 350);
        }

        function checkAnswer(value) {
            const q = QUESTIONS[current];

            if (answered[current]) return;

            if (value === q.answer) {
                animateJump(q.start, q.jump, q.answer);
            } else {
                wrongSound.currentTime = 0;
                wrongSound.play().catch(() => { });
                speak("Try again");
                showPopup(false);
            }
        }

        prevBtn.addEventListener("click", () => {
            if (current === 0) return;
            current--;
            renderQuestion();
        });

        nextBtn.addEventListener("click", () => {
            if (!answered[current] || current >= total - 1) return;
            current++;
            renderQuestion();
        });

        homeBtn.addEventListener("click", () => {
            window.top.location.href = "../Grade2_chapter3.html"
        });

        hintBtn.addEventListener("click", () => {
            hintText.textContent = QUESTIONS[current].hint;
            hintOverlay.classList.add("show");
        });

        closeHintBtn.addEventListener("click", () => {
            hintOverlay.classList.remove("show");
        });

        hintOverlay.addEventListener("click", event => {
            if (event.target === hintOverlay) {
                hintOverlay.classList.remove("show");
            }
        });

        renderQuestion();
    </script>
