<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fill in the Boxes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap');

        /* =========================================================
   BASE STYLES
========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Livvic", sans-serif;
            background:
                radial-gradient(circle at 8% 16%, rgba(255, 255, 255, .65) 0 30px, transparent 31px),
                radial-gradient(circle at 86% 14%, rgba(255, 255, 255, .6) 0 38px, transparent 39px),
                linear-gradient(135deg, #faf7ff 0%, #fffafb 48%, #f7fcff 100%);

            color: #332267;

            overflow: hidden;
            cursor: default;
        }

        button,
        input {
            font: inherit;
            cursor: pointer;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid rgba(108, 118, 255, .35);
            outline-offset: 3px;
        }

        .quiz-page {
            height: 100vh;
            min-height: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 22px 30px 28px;
            /* background-color:#4d9cf4; */
        }

        .quiz-page::before,
        .quiz-page::after {
            content: "";
            position: absolute;
            z-index: 0;
            pointer-events: none;
        }

        .quiz-page::before {
            width: 440px;
            height: 210px;
            left: -80px;
            bottom: -95px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffe3a3, #ffd5e3);
            transform: rotate(8deg);
        }

        .quiz-page::after {
            width: 520px;
            height: 220px;
            right: -110px;
            bottom: -105px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d9f6ff, #e2d4ff);
            transform: rotate(-8deg);
        }

        /* =========================================================
   TOP BAR  (unchanged behaviour: home / title / hint)
========================================================= */
        .top-bar {
            position: relative;
            z-index: 5;
            min-height: 100px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .title-wrap {
            text-align: center;
            padding-top: 8px;
        }

        .page-title {
            font-size: 30px;
            line-height: 1;
            color: #3d247b;
            letter-spacing: .2px;
        }

        .title-dots {
            margin: 16px auto 0;
            width: min(480px, 58vw);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .title-dots span {
            width: 11px;
            height: 6px;
            border-radius: 999px;
            display: block;
        }

        .title-dots span:nth-child(5n+1) {
            background: #ff8caf
        }

        .title-dots span:nth-child(5n+2) {
            background: #ffc76f
        }

        .title-dots span:nth-child(5n+3) {
            background: #83d7c5
        }

        .title-dots span:nth-child(5n+4) {
            background: #cbb6ff
        }

        .title-dots span:nth-child(5n) {
            background: #9fd6ff
        }

        .icon-button {
            position: absolute;
            top: 0;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* cursor:none; */
            transition: transform .18s ease, filter .18s ease;
            box-shadow: 0 7px 16px rgba(76, 56, 124, .16), inset 0 0 0 4px rgba(255, 255, 255, .9);
        }

        .icon-button,
        .icon-button:focus,
        .icon-button:focus-visible,
        .icon-button:active {
            border: none;
            outline: none;
        }

        .icon-button:hover {
            transform: translateY(-2px) scale(1.04)
        }

        .icon-button:active {
            transform: translateY(2px) scale(.98)
        }

        .home-button {
            left: 4px;
            background: linear-gradient(145deg, #b8a1ff, #8d78ef);
        }

        .hint-button {
            right: 4px;
            background: linear-gradient(145deg, #7fe4e5, #56cdd2);
        }

        /* =========================================================
   EQUATION CARD
========================================================= */
        .game-area {
            position: relative;
            z-index: 3;
            width: min(1200px, 100%);
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 38px;
            padding: 6px 24px 92px;
            min-height: 0;
        }

        .equation-card {
            position: relative;
            width: 50%;
            max-width: 1080px;
            background: rgba(255, 255, 255, .7);
            border: 2px solid #ffc9dc;
            border-radius: 26px;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 14px 30px rgba(120, 80, 150, .08);
            transform: translateY(20px);
            /* margin-bottom:-40px; */
            margin-top: 25px;
            font-weight: 400;
        }

        .equation-card.animate {
            animation: cardFloat .48s ease;
        }

        @keyframes cardFloat {
            0% {
                opacity: 0;
                transform: translateY(-12px)
            }

            100% {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .progress-pill {
            display: none;
            position: absolute;
            top: 16px;
            right: 20px;
            background: #fff;
            border: 1px solid #e7d9fb;
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 16px;
            color: #6b5c99;
            box-shadow: 0 4px 10px rgba(120, 80, 150, .08);
        }

        .equation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .eq-number {
            font-size: 52px;
            font-weight: 400;
            color: #3d247b;
        }

        .eq-symbol {
            font-size: 44px;
            font-weight: 700;
            color: #ff5f94;
        }

        .eq-symbol.equals {
            color: #30235e;
        }

        .blank-box {
            width: 118px;
            height: 100px;
            border-radius: 16px;
            border: 2px solid #ff9dbc;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: 400;
            color: #ff5f94;
            transition: transform .2s ease, background .2s ease, border-color .2s ease, color .2s ease;
        }

        .blank-box.filled {
            border-color: #86b94f;
            background: #e9f6da;
            color: #5d8d31;
        }

        .blank-box.shake {
            animation: shakeBox .38s ease;
        }

        @keyframes shakeBox {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-8px)
            }

            50% {
                transform: translateX(8px)
            }

            75% {
                transform: translateX(-6px)
            }
        }

        .question-area {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            min-height: 70px;
        }

        .question-heading {
            font-size: 30px;
            color: #3d247b;
            text-align: center;
        }

        .question-number {
            color: #ff5f94;
            /* font-weight:700; */
            margin-right: 10px;
            font-size: 30px;
        }

        /* =========================================================
   FLIP CARD
========================================================= */
        .choice-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 26px;
        }

        .flip-card {
            width: min(320px, 84vw);
            border-radius: 22px;
            overflow: hidden;
            background: linear-gradient(150deg, #a893fb, #8069ef);
            box-shadow: 0 16px 32px rgba(97, 73, 170, .28);
            perspective: 900px;
        }

        .flip-card-top {
            padding: 22px 20px 8px;
            text-align: center;
        }

        .flip-card-label {
            font-size: 19px;
            font-weight: 600;
            color: #fff;
            letter-spacing: .2px;
        }

        .flip-card-value-wrap {
            padding: 14px 20px 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flip-card-value {
            font-size: 74px;
            font-weight: 400;
            color: #fff;
            line-height: 1;
        }

        .flip-card-value.flip {
            animation: flipNumber .32s ease;
        }

        @keyframes flipNumber {
            0% {
                transform: rotateX(0deg);
                opacity: 1
            }

            45% {
                transform: rotateX(90deg);
                opacity: .3
            }

            55% {
                transform: rotateX(-90deg);
                opacity: .3
            }

            100% {
                transform: rotateX(0deg);
                opacity: 1
            }
        }

        .flip-card-button {
            width: 100%;
            border: 0;
            padding: 16px 10px;
            background: #5d4bc2;
            color: #fff;
            font-size: 19px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background .15s ease;
        }

        .flip-card-button:hover {
            background: #523fb8
        }

        .flip-card-button:active {
            background: #473690
        }

        .flip-card-button .refresh-icon {
            font-size: 19px;
            display: inline-block;
            transition: transform .3s ease;
        }

        .flip-card-button.spin .refresh-icon {
            transform: rotate(360deg);
        }

        .submit-button {
            min-width: 190px;
            min-height: 56px;
            padding: 12px 30px;
            border-radius: 16px;
            border: 0;
            background: linear-gradient(135deg, #7bc35a, #5d8d31);
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            box-shadow: 0 8px 18px rgba(93, 141, 49, .28);
            transition: transform .16s ease, filter .16s ease;
        }

        .submit-button:hover {
            transform: translateY(-2px)
        }

        .submit-button:active {
            transform: translateY(1px)
        }

        .submit-button:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================================================
   NAVIGATION  (unchanged behaviour)
========================================================= */
        .navigation {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 26px;
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: min(46vw, 600px);
            pointer-events: none;
        }

        .nav-button {
            pointer-events: auto;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: none;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .18s ease, opacity .18s ease, filter .18s ease;
            font-size: 28px;
        }

        .nav-button img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            display: block;
        }

        .prev-button {
            background: linear-gradient(145deg, #ff91af, #ff6f99)
        }

        .next-button {
            background: linear-gradient(145deg, #73b9ff, #4d9cf4)
        }

        .nav-button:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.04)
        }

        .nav-button:active:not(:disabled) {
            transform: translateY(2px) scale(.98)
        }

        .nav-button:disabled {
            opacity: .3;
            /* filter:grayscale(.2); */
            cursor: not-allowed;
        }

        .next-button:not(:disabled) {
            animation: nextButtonMove 1s ease-in-out infinite;
        }

        @keyframes nextButtonMove {

            0%,
            100% {
                transform: translateX(0) scale(1)
            }

            40% {
                transform: translateX(9px) scale(1.05)
            }

            60% {
                transform: translateX(5px) scale(1.02)
            }
        }

        .icon-button img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            display: block;
        }

        /* =========================================================
   POPUPS  (unchanged behaviour)
========================================================= */
        .popup-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .22s ease, visibility .22s ease;
        }

        .popup-icon img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            display: block;
        }

        .popup-overlay.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .popup-card {
            width: min(470px, 92vw);
            border-radius: 28px;
            background: #fffdfd;
            border: 2px solid rgba(206, 186, 240, .7);
            padding: 32px 28px 28px;
            text-align: center;
            transform: scale(.84) translateY(15px);
            transition: transform .24s ease;
        }

        .popup-overlay.show .popup-card {
            transform: scale(1) translateY(0);
        }

        .popup-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 14px;
            font-size: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-title {
            font-size: 34px;
            color: #402a75;
            margin-bottom: 10px;
        }

        .popup-message {
            font-size: 19px;
            line-height: 1.45;
            color: #5a4b78;
        }

        .popup-button {
            min-width: 150px;
            min-height: 52px;
            margin-top: 22px;
            padding: 10px 24px;
            border-radius: 16px;
            background: linear-gradient(135deg, #9b85f5, #7c68df);
            color: #fff;
            font-size: 19px;
            border: 0;
        }

        .final-card .popup-icon img {
            width: 90px;
            height: 90px;
        }

        .final-card {
            width: min(540px, 94vw);
            max-height: calc(100vh - 44px);
            overflow: auto;
            background: linear-gradient(145deg, #fffdfc, #f8f2ff);
            border-color: #e2cfff;
            padding: 38px 30px 32px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 24px 60px rgba(76, 56, 124, .22);
        }

        .final-card .popup-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
        }

        .final-card .popup-icon img {
            width: 90px;
            height: 90px;
            object-fit: contain;
        }

        .final-card .popup-title {
            margin-bottom: 10px;
        }

        .final-card .popup-message {
            max-width: 420px;
            margin: 0 auto;
        }

        .final-card .play-again-button {
            margin-top: 22px;
        }

        .final-card .popup-icon {
            font-size: 72px;
        }

        .final-card .popup-title {
            font-size: 40px;
        }

        .play-again-button {
            background: linear-gradient(135deg, #ff8eae, #8f7bf1);
        }

        /* =========================================================
   CONFETTI
========================================================= */
        .confetti-piece {
            position: fixed;
            top: -20px;
            width: 10px;
            height: 16px;
            border-radius: 3px;
            z-index: 12000;
            pointer-events: none;
            animation: confettiFall 1.55s ease-in forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(110vh) rotate(760deg);
                opacity: .3;
            }
        }

        /* =========================================================
   MOBILE / TABLET / LAPTOP
========================================================= */
        @media (max-width:600px) {
            .quiz-page {
                padding: 12px 10px 16px;
            }

            .top-bar {
                min-height: 76px
            }

            .page-title {
                font-size: 30px;
                padding-top: 5px
            }

            .title-dots {
                margin-top: 10px;
                width: 58vw;
                gap: 7px
            }

            .title-dots span {
                width: 7px;
                height: 4px
            }

            .icon-button {
                width: 52px;
                height: 52px;
                font-size: 22px
            }

            .game-area {
                gap: 22px;
                padding: 0 6px 78px
            }

            .equation-card {
                padding: 12px 18px;
                border-radius: 20px;
            }

            .progress-pill {
                font-size: 13px;
                padding: 4px 10px;
                top: 10px;
                right: 12px
            }

            .equation {
                gap: 10px
            }

            .eq-number {
                font-size: 30px
            }

            .eq-symbol {
                font-size: 26px
            }

            .blank-box {
                width: 70px;
                height: 62px;
                font-size: 26px;
                border-radius: 12px
            }

            .flip-card {
                width: min(240px, 80vw)
            }

            .flip-card-value {
                font-size: 48px
            }

            .flip-card-label {
                font-size: 15px
            }

            .flip-card-button {
                font-size: 16px;
                padding: 12px 8px
            }

            .submit-button {
                font-size: 17px;
                min-width: 150px;
                min-height: 48px
            }

            .navigation {
                bottom: 14px;
                gap: 46vw
            }

            .nav-button {
                width: 58px;
                height: 58px;
                font-size: 20px
            }

            .popup-title {
                font-size: 26px
            }

            .popup-message {
                font-size: 16px
            }
        }

        @media (min-width:601px) and (max-width:900px) {
            .quiz-page {
                padding: 16px 18px 20px;
            }

            .page-title {
                font-size: 30px
            }

            .icon-button {
                width: 64px;
                height: 64px;
                font-size: 26px
            }

            .game-area {
                gap: 28px;
                padding: 0 20px 88px
            }

            .equation-card {
                padding: 14px 26px;
            }

            .eq-number {
                font-size: 38px
            }

            .eq-symbol {
                font-size: 32px
            }

            .blank-box {
                width: 88px;
                height: 78px;
                font-size: 32px
            }

            .flip-card-value {
                font-size: 58px
            }

            .navigation {
                gap: 58vw
            }

            .nav-button {
                width: 72px;
                height: 72px
            }
        }

        @media (min-width:901px) and (max-width:1024px) {
            .quiz-page {
                padding: 18px 24px 22px;
            }

            .page-title {
                font-size: 30px
            }

            .game-area {
                gap: 32px
            }

            .game-card {
                padding: 12px 30px;
            }

            .eq-number {
                font-size: 46px
            }

            .eq-symbol {
                font-size: 40px
            }

            .blank-box {
                width: 104px;
                height: 90px;
                font-size: 40px
            }

            .navigation {
                gap: 48vw
            }
        }

        @media (min-width:901px) and (max-width:1440px) {

            .equation-card {
                padding: 5px 24px;
                height: 80px;
                margin-top: 90px;
            }

            .blank-box {
                height: 55px;
            }

            .page-title {
                font-size: 30px
            }
        }

        @media (min-width:1441px) {
            .quiz-page {
                padding: 14px 34px 18px;
            }

            .navigation {
                gap: min(52vw, 720px)
            }

            .page-title {
                font-size: 40px
            }
        }

        .flip-card {
            min-height: 260px;
        }

        .submit-button {
            min-width: 220px;
            min-height: 64px;
            padding: 14px 34px;
            font-size: 22px;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div class="quiz-page" id="quizPage">

        <div class="top-bar">
            <button class="icon-button home-button" id="homeButton" type="button" aria-label="Home" title="Home">
                <img src="../assets/images/home.png" alt="Home">
            </button>

            <div class="title-wrap">
                <div class="page-title">Fill in the boxes</div>
                <div class="title-dots" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <button class="icon-button hint-button" id="hintButton" type="button" aria-label="Hint" title="Hint">
                <img src="../assets/images/hint.png" alt="Hint">
            </button>
        </div>


        <main class="game-area">

            <div class="equation-card" id="equationCard">

                <div class="progress-pill" id="progressPill"></div>

                <div class="equation" id="equation"></div>

            </div>

            <div class="choice-area">

                <div class="flip-card">
                    <div class="flip-card-top">
                        <div class="flip-card-label">Your number</div>
                    </div>
                    <div class="flip-card-value-wrap">
                        <div class="flip-card-value" id="flipValue">0</div>
                    </div>
                    <button class="flip-card-button" id="flipButton" type="button">
                        <span class="refresh-icon">🔄</span> Flip
                    </button>
                </div>

                <button class="submit-button" id="submitButton" type="button">Submit 0</button>

            </div>

        </main>

        <div class="navigation">
            <button class="nav-button prev-button" id="prevButton" type="button" aria-label="Previous question"
                disabled>
                <img src="../assets/images/left-arrow.png" alt="Previous">
            </button>
            <button class="nav-button next-button" id="nextButton" type="button" aria-label="Next question" disabled>
                <img src="../assets/images/right-arrow.png" alt="Next">
            </button>
        </div>
    </div>

    <!-- HINT POPUP -->
    <div class="popup-overlay" id="hintOverlay" aria-hidden="true">
        <div class="popup-card">
            <div class="popup-icon">💡</div>
            <div class="popup-title">Hint</div>
            <div class="popup-message" id="hintMessage"></div>
            <button class="popup-button" id="hintCloseButton" type="button">OK</button>
        </div>
    </div>

    <!-- CORRECT POPUP -->
    <div class="popup-overlay" id="correctOverlay" aria-hidden="true">
        <div class="popup-card">
            <div class="popup-icon"><img src="../assets/images/correct.png" alt="Correct"></div>
            <div class="popup-title">Correct!</div>
            <div class="popup-message">Great job! Your answer is correct.</div>
        </div>
    </div>

    <!-- WRONG POPUP -->
    <div class="popup-overlay" id="wrongOverlay" aria-hidden="true">
        <div class="popup-card">
            <div class="popup-icon"><img src="../assets/images/wrong.png" alt="Wrong"></div>
            <div class="popup-title">Try Again</div>
            <div class="popup-message">That answer is not correct yet. Try once more.</div>
        </div>
    </div>

    <!-- FINAL POPUP -->
    <div class="popup-overlay" id="finalOverlay" aria-hidden="true">
        <div class="popup-card final-card" role="dialog" aria-modal="true" aria-labelledby="finalPopupTitle">
            <div class="popup-icon">
                <img src="../assets/images/trophy.png" alt="Trophy">
            </div>
            <div class="popup-title" id="finalPopupTitle">Activity Complete!</div>
            <div class="popup-message">You finished all the questions.</div>
            <button class="popup-button play-again-button" id="playAgainButton" type="button">
                Play Again
            </button>
        </div>
    </div>

    <script>
        /*
         * Each question stores a, b, result (the full equation),
         * and "missing" which tells us which slot is the blank box: "a" | "b" | "result"
         */
        const quizData = [

            {
                a: 76, b: 0, result: 76, missing: "result",
                correct: 76, wrong: 75,
                hint: "Click the flip and submit the correct answer."
            },

            {
                a: 45, b: null, result: 45, missing: "b",
                correct: 0, wrong: 1,
                hint: "Click the flip and submit the correct answer."
            },

            {
                a: null, b: 0, result: 63, missing: "a",
                correct: 63, wrong: 62,
                hint: "Click the flip and submit the correct answer."
            },

            {
                a: null, b: 0, result: 32, missing: "a",
                correct: 32, wrong: 31,
                hint: "Click the flip and submit the correct answer."
            },

            {
                a: 80, b: null, result: 79, missing: "b",
                correct: 1, wrong: 2,
                hint: "Click the flip and submit the correct answer."
            },

            {
                a: null, b: 1, result: 20, missing: "a",
                correct: 21, wrong: 20,
                hint: "Click the flip and submit the correct answer."
            },

            {
                a: 89, b: 0, result: 89, missing: "result",
                correct: 89, wrong: 88,
                hint: "Click the flip and submit the correct answer."
            },

            {
                a: 99, b: null, result: 98, missing: "b",
                correct: 1, wrong: 2,
                hint: "Click the flip and submit the correct answer."
            }

        ];

        function correctAnswer(q) {
            if (q.missing === "a") return q.result + q.b;
            if (q.missing === "b") return q.a - q.result;
            return q.a - q.b;
        }

        let currentQuestion = 0;
        const completed = new Array(quizData.length).fill(false);
        const savedChoice = new Array(quizData.length).fill(0);
        // const flipCounts = new Array(quizData.length).fill(0);

        // const MAX_FLIPS = 2;

        const equation = document.getElementById("equation");
        const equationCard = document.getElementById("equationCard");
        const progressPill = document.getElementById("progressPill");
        const flipValue = document.getElementById("flipValue");
        const flipButton = document.getElementById("flipButton");
        const submitButton = document.getElementById("submitButton");
        const prevButton = document.getElementById("prevButton");
        const nextButton = document.getElementById("nextButton");
        const hintButton = document.getElementById("hintButton");
        const homeButton = document.getElementById("homeButton");

        const hintOverlay = document.getElementById("hintOverlay");
        const correctOverlay = document.getElementById("correctOverlay");
        const wrongOverlay = document.getElementById("wrongOverlay");
        const finalOverlay = document.getElementById("finalOverlay");
        const hintMessage = document.getElementById("hintMessage");

        function renderEquation(q, showAnswer) {

            equation.innerHTML = "";

            const questionNumberSpan = document.createElement("span");
            questionNumberSpan.className = "question-number";
            questionNumberSpan.textContent = `Q${currentQuestion + 1}.`;
            equation.appendChild(questionNumberSpan);

            const parts = [
                { slot: "a", value: q.a },
                { slot: "op", symbol: "−" },
                { slot: "b", value: q.b },
                { slot: "eq", symbol: "=" },
                { slot: "result", value: q.result }
            ];

            parts.forEach(part => {

                if (part.slot === "op" || part.slot === "eq") {
                    const span = document.createElement("span");
                    span.className = "eq-symbol" +
                        (part.slot === "eq" ? " equals" : "");
                    span.textContent = part.symbol;
                    equation.appendChild(span);
                    return;
                }

                if (part.slot === q.missing) {

                    const box = document.createElement("div");
                    box.className = "blank-box";
                    box.id = "blankBox";
                    box.textContent = showAnswer
                        ? correctAnswer(q)
                        : "?";

                    if (showAnswer) {
                        box.classList.add("filled");
                    }

                    equation.appendChild(box);

                } else {

                    const span = document.createElement("span");
                    span.className = "eq-number";
                    span.textContent = part.value;
                    equation.appendChild(span);

                }
            });
        }

        function loadQuestion() {
            const q = quizData[currentQuestion];
            const isDone = completed[currentQuestion];

            progressPill.textContent = `${currentQuestion + 1} / ${quizData.length}`;
            renderEquation(q, isDone);

            flipValue.textContent = savedChoice[currentQuestion];
            submitButton.textContent = `Submit ${savedChoice[currentQuestion]}`;
            submitButton.disabled = isDone;

            flipButton.disabled = isDone;

            equationCard.classList.remove("animate");
            void equationCard.offsetWidth;
            equationCard.classList.add("animate");

            updateNavigation();
        }
        flipButton.addEventListener("click", () => {
            if (completed[currentQuestion]) return;

            const q = quizData[currentQuestion];

            // Only 2 options for this question
            const options = [q.correct, q.wrong];

            // Unlimited flips between the 2 options
            const value = options[Math.floor(Math.random() * options.length)];

            savedChoice[currentQuestion] = value;

            flipValue.textContent = value;

            flipValue.classList.remove("flip");
            void flipValue.offsetWidth;
            flipValue.classList.add("flip");

            flipButton.classList.remove("spin");
            void flipButton.offsetWidth;
            flipButton.classList.add("spin");

            submitButton.textContent = `Submit ${value}`;
        });

        submitButton.addEventListener("click", () => validateAnswer());


        function validateAnswer() {
            const q = quizData[currentQuestion];
            const chosen = savedChoice[currentQuestion];
            const answer = q.correct;

            if (chosen === answer) {
                completed[currentQuestion] = true;
                renderEquation(q, true);
                submitButton.disabled = true;
                flipButton.disabled = true;

                // Always show the correct popup first, including on the last question
                showPopup(correctOverlay);
                playCorrectSound();
                launchConfetti(55);

                if (currentQuestion === quizData.length - 1) {
                    // Last question: after 1600ms, close the correct popup and show final popup
                    setTimeout(() => {
                        hidePopup(correctOverlay);
                        showPopup(finalOverlay);
                        playCorrectSound();
                        launchConfetti(110);
                    }, 1600);
                } else {
                    // Other questions: close correct popup after 1500ms, but stay on this question
                    setTimeout(() => {
                        hidePopup(correctOverlay);
                    }, 1500);
                }
            } else {
                completed[currentQuestion] = false;
                const box = document.getElementById("blankBox");
                if (box) {
                    box.classList.remove("shake");
                    void box.offsetWidth;
                    box.classList.add("shake");
                }
                showPopup(wrongOverlay);
                playWrongSound();

                // Automatically close wrong popup and allow another attempt
                setTimeout(() => {
                    hidePopup(wrongOverlay);
                }, 1500);
            }

            updateNavigation();
        }

        function updateNavigation() {
            prevButton.disabled = currentQuestion === 0;
            nextButton.disabled = !completed[currentQuestion];
        }

        prevButton.addEventListener("click", () => {
            if (currentQuestion === 0) return;
            currentQuestion--;
            loadQuestion();
        });

        nextButton.addEventListener("click", () => {
            if (!completed[currentQuestion]) return;

            if (currentQuestion === quizData.length - 1) {
                return;
            }

            currentQuestion++;
            loadQuestion();
        });

        hintButton.addEventListener("click", () => {
            hintMessage.textContent = quizData[currentQuestion].hint;
            showPopup(hintOverlay);
        });

        document.getElementById("hintCloseButton").addEventListener("click", () => hidePopup(hintOverlay));

        document.getElementById("playAgainButton").addEventListener("click", () => {
            hidePopup(finalOverlay);
            currentQuestion = 0;
            completed.fill(false);
            savedChoice.fill(0);
            // flipCounts.fill(0);
            loadQuestion();
        });

        homeButton.addEventListener("click", () => {
            window.location.href = "../Grade2_chapter4.html";
        });

        function showPopup(overlay) {
            overlay.classList.add("show");
            overlay.setAttribute("aria-hidden", "false");
        }

        function hidePopup(overlay) {
            overlay.classList.remove("show");
            overlay.setAttribute("aria-hidden", "true");
        }

        [hintOverlay, correctOverlay, wrongOverlay].forEach(overlay => {
            overlay.addEventListener("click", event => {
                if (event.target === overlay) hidePopup(overlay);
            });
        });

        function launchConfetti(count) {
            const colors = ["#ff8cab", "#8a78ed", "#65cbd2", "#ffd26e", "#7BCB5A"];
            for (let i = 0; i < count; i++) {
                const piece = document.createElement("span");
                piece.className = "confetti-piece";
                piece.style.left = `${Math.random() * 100}vw`;
                piece.style.background = colors[i % colors.length];
                piece.style.animationDelay = `${Math.random() * .5}s`;
                piece.style.transform = `rotate(${Math.random() * 180}deg)`;
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 2200);
            }
        }

        function playTone(frequency, duration, type = "sine", delay = 0) {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                const ctx = new AudioContextClass();
                const oscillator = ctx.createOscillator();
                const gain = ctx.createGain();
                oscillator.type = type;
                oscillator.frequency.value = frequency;
                gain.gain.setValueAtTime(.0001, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(.12, ctx.currentTime + .02 + delay);
                gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + duration + delay);
                oscillator.connect(gain);
                gain.connect(ctx.destination);
                oscillator.start(ctx.currentTime + delay);
                oscillator.stop(ctx.currentTime + duration + delay + .02);
                oscillator.addEventListener("ended", () => ctx.close());
            } catch (error) { }
        }

        function playCorrectSound() {
            playTone(523, .18, "sine", 0);
            playTone(659, .18, "sine", .12);
            playTone(784, .26, "sine", .24);
        }

        function playWrongSound() {
            playTone(220, .22, "triangle", 0);
            playTone(174, .3, "triangle", .14);
        }

        loadQuestion();
    </script>
</body>

</html>
