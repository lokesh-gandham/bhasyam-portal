<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frog Number Line Subtraction</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap');

/* =========================================================
   BASE STYLES
========================================================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:"Livvic",sans-serif;
    background:
        radial-gradient(circle at 10% 18%,rgba(255,255,255,.8) 0 30px,transparent 31px),
        radial-gradient(circle at 90% 12%,rgba(255,255,255,.72) 0 38px,transparent 39px),
        linear-gradient(135deg,#f1e8ff 0%,#fff5f8 48%,#e9f9ff 100%);
    color:#332267;
    cursor:default;
}

button,
input{
    font:inherit;
    cursor:pointer;
}

button:focus-visible,
input:focus-visible{
    outline:3px solid rgba(108,118,255,.35);
    outline-offset:3px;
}

.quiz-page{
    width:100%;
    height:100vh;
    min-height:0;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    padding:14px 30px 18px;
}

.quiz-page::before,
.quiz-page::after{
    content:"";
    position:absolute;
    z-index:0;
    pointer-events:none;
}

.quiz-page::before{
    width:420px;
    height:180px;
    left:-100px;
    bottom:-100px;
    border-radius:50%;
    background:linear-gradient(135deg,#ffe3a3,#ffd5e3);
    transform:rotate(8deg);
}

.quiz-page::after{
    width:500px;
    height:190px;
    right:-120px;
    bottom:-100px;
    border-radius:50%;
    background:linear-gradient(135deg,#d9f6ff,#e2d4ff);
    transform:rotate(-8deg);
}

/* =========================================================
   TOP BAR
========================================================= */
.top-bar{
    position:relative;
    z-index:5;
    min-height:82px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    flex-shrink:0;
}

.title-wrap{
    text-align:center;
    padding-top:8px;
}

.page-title{
    font-size:30px;
    line-height:1;
    color:#3d247b;
    letter-spacing:.2px;
}

.title-dots{
    margin:16px auto 0;
    width:min(480px,58vw);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.title-dots span{
    width:11px;
    height:6px;
    border-radius:999px;
    display:block;
}

.title-dots span:nth-child(5n+1){background:#ff8caf}
.title-dots span:nth-child(5n+2){background:#ffc76f}
.title-dots span:nth-child(5n+3){background:#83d7c5}
.title-dots span:nth-child(5n+4){background:#cbb6ff}
.title-dots span:nth-child(5n){background:#9fd6ff}

.icon-button{
    position:absolute;
    top:0;
    width:75px;
    height:75px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .18s ease,filter .18s ease;
    box-shadow:0 7px 16px rgba(76,56,124,.16),inset 0 0 0 4px rgba(255,255,255,.9);
}

.icon-button:focus,
.icon-button:focus-visible,
.icon-button:active{
    border:0;
    outline:none;
}

.icon-button:hover{
    transform:translateY(-2px) scale(1.04);
}

.icon-button:active{
    transform:translateY(2px) scale(.98);
}

.home-button{
    left:4px;
    background:linear-gradient(145deg,#b8a1ff,#8d78ef);
}

.hint-button{
    right:4px;
    background:linear-gradient(145deg,#7fe4e5,#56cdd2);
}

.icon-button img{
    width:40px;
    height:40px;
    object-fit:contain;
    display:block;
}

/* =========================================================
   MAIN GAME AREA
========================================================= */
.game-area{
    position:relative;
    z-index:3;
    width:min(1600px,100%);
    margin:0 auto;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:6px 0 70px;
}

/* =========================================================
   EQUATION CARD
========================================================= */
.equation-card{
    width:min(1220px,92%);
    min-height:112px;
    flex-shrink:0;
    background:rgba(255,255,255,.76);
    border:2px solid #ffc9dc;
    border-radius:24px;
    padding:10px 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 14px 30px rgba(120,80,150,.08);
    transform:translateY(0);
}

.equation-card.animate{
    animation:cardFloat .45s ease;
}

@keyframes cardFloat{
    0%{opacity:0;transform:translateY(-10px)}
    100%{opacity:1;transform:translateY(0)}
}

.equation{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
}

.question-number{
    color:#ff5f94;
    font-size:30px;
    margin-right:3px;
}

.eq-number{
    font-size:30px;
    color:#3d247b;
}

.eq-symbol{
    font-size:30px;
    color:#ff5f94;
}

.eq-symbol.equals{
    color:#30235e;
}

.answer-box{
    width:110px;
    height:62px;
    border-radius:13px;
    border:2px solid #ff9dbc;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    color:#ff5f94;
    transition:transform .2s ease,background .2s ease,border-color .2s ease,color .2s ease;
}

.answer-box.filled{
    border-color:#86b94f;
    background:#e9f6da;
    color:#5d8d31;
}

.answer-box.shake{
    animation:shakeBox .38s ease;
}

@keyframes shakeBox{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    50%{transform:translateX(8px)}
    75%{transform:translateX(-6px)}
}

/* =========================================================
   NUMBER LINE
========================================================= */
.number-line-panel{
    position:relative;
    width:100%;
    flex:1;
    min-height:310px;
    max-height:520px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.number-line-wrap{
    position:relative;
    width:calc(100% - 70px);
    height:270px;
    max-width:1540px;
    min-width:0;
    --line-top:174px;
}

.number-line{
    position:absolute;
    left:0;
    right:0;
    top:var(--line-top);
    height:3px;
    background:#30235e;
    border-radius:4px;
}

.number-line::before,
.number-line::after{
    content:"";
    position:absolute;
    top:-6px;
    width:0;
    height:0;
    border-top:8px solid transparent;
    border-bottom:8px solid transparent;
}

.number-line::before{
    left:-12px;
    border-right:13px solid #30235e;
}

.number-line::after{
    right:-12px;
    border-left:13px solid #30235e;
}

.number-tick{
    position:absolute;
    top:-11px;
    width:2px;
    height:27px;
    background:#30235e;
    transform:translateX(-50%);
}

.number-label{
    position:absolute;
    z-index:20;
    top:calc(var(--line-top) + 24px);
    transform:translateX(-50%);
    min-width:18px;
    border-radius:50%;
    text-align:center;
    font-size:30px;
    font-weight:600;
    color:#30235e;
    line-height:1;
    user-select:none;
}

.number-label.clickable:active,
.number-label.clickable:focus{
    color:inherit;
    opacity:1 !important;
    visibility:visible !important;
    display:block !important;
}

.number-label.clickable:hover{
    /* color:#ff5f94; */
    transform:translateX(-50%) scale(1.16);
}

.number-label.clicked{
    z-index:100;
    top:calc(var(--line-top) + 24px) !important;
    width:34px;
    height:34px;
    min-width:34px;
    padding-top:9px;
    border-radius:50%;
    color:#fff;
    background:#ff5f94;
    opacity:1 !important;
    visibility:visible !important;
    display:block !important;
}

.number-label.clicked:hover{
    color:#fff;
    background:#ff5f94;
    transform:translateX(-50%);
}

.number-label.target{
    color:#fff;
    background:#ff5f94;
    border-radius:50%;
    width:30px;
    height:30px;
    min-width:30px;
    padding-top:7px;
    top:calc(var(--line-top) + 18px);
    transform:translateX(-50%);
    box-shadow:0 5px 12px rgba(255,95,148,.28);
}

.number-label.start{
    color:#fff;
    background:#79b94b;
    border-radius:50%;
    width:32px;
    height:32px;
    min-width:32px;
    padding-top:8px;
    top:calc(var(--line-top) + 17px);
    transform:translateX(-50%);
    box-shadow:0 5px 12px rgba(121,185,75,.3);
}

.number-label.done{
    color:#fff;
    background:#79b94b;
    border-radius:50%;
    width:30px;
    height:30px;
    min-width:30px;
    padding-top:7px;
    top:calc(var(--line-top) + 18px);
    transform:translateX(-50%);
}

/* =========================================================
   JUMP ARCS + FROG
========================================================= */
.jump-svg{
    position:absolute;
    left:0;
    right:0;
    top:0;
    width:100%;
    height:178px;
    overflow:visible;
    pointer-events:none;
    z-index:8;
}

.jump-arc{
    fill:none;
    stroke:#79b94b;
    stroke-width:3;
    stroke-dasharray:7 6;
    opacity:0;
    marker-end:url(#arrowHead);
}

.jump-arc.show{
    opacity:1;
    animation:arcIn .35s ease both;
}

@keyframes arcIn{
    from{opacity:0;stroke-dashoffset:25}
    to{opacity:1;stroke-dashoffset:0}
}

.jump-count{
    position:absolute;
    z-index:10;
    width:27px;
    height:27px;
    border-radius:50%;
    background:#ff5f94;
    color:#fff;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:translate(-50%,0) scale(.7);
    pointer-events:none;
}

.jump-count.show{
    opacity:1;
    animation:countPop .32s ease both;
}

@keyframes countPop{
    from{opacity:0;transform:translate(-50%,5px) scale(.7)}
    to{opacity:1;transform:translate(-50%,0) scale(1)}
}

.frog{
    position:absolute;
    z-index:15;
    width:96px;
    height:96px;
    object-fit:contain;
    pointer-events:none;
    transform:translate(-50%,-100%);
    transition:left .34s ease,top .34s ease,transform .34s ease;
    filter:drop-shadow(0 6px 5px rgba(50,60,30,.15));
}

.frog.jumping{
    animation:frogHop .34s ease;
}

@keyframes frogHop{
    0%{transform:translate(-50%,-100%) rotate(0)}
    45%{transform:translate(-50%,-145%) rotate(-5deg)}
    100%{transform:translate(-50%,-100%) rotate(0)}
}

.instruction{
    position:absolute;
    left:50%;
    bottom:4px;
    transform:translateX(-50%);
    font: size 30px;
    color:#6b5c99;
    text-align:center;
    white-space:nowrap;
    
}

.instruction strong{
    color:#5d8d31;
}

/* =========================================================
   NAVIGATION
========================================================= */
.navigation{
    position:absolute;
    left:0;
    right:0;
    bottom:18px;
    z-index:6;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 0;
    pointer-events:none;
}

.nav-button{
    pointer-events:auto;
    width:72px;
    height:72px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 7px 16px rgba(76,56,124,.18),inset 0 0 0 4px rgba(255,255,255,.9);
    transition:transform .18s ease,opacity .18s ease,filter .18s ease;
}

.nav-button img{
    width:48px;
    height:48px;
    object-fit:contain;
    display:block;
}

.prev-button{background:linear-gradient(145deg,#ff91af,#ff6f99)}
.next-button{background:linear-gradient(145deg,#73b9ff,#4d9cf4)}

.nav-button:hover:not(:disabled){
    transform:translateY(-3px) scale(1.04);
}

.nav-button:active:not(:disabled){
    transform:translateY(2px) scale(.98);
}

.nav-button:disabled{
    opacity:.3;
    filter:grayscale(.2);
    cursor:not-allowed;
}

.next-button:not(:disabled){
    animation:nextButtonMove 1s ease-in-out infinite;
}

@keyframes nextButtonMove{
    0%,100%{transform:translateX(0) scale(1)}
    40%{transform:translateX(9px) scale(1.05)}
    60%{transform:translateX(5px) scale(1.02)}
}

/* =========================================================
   POPUPS
========================================================= */
        .popup-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .22s ease, visibility .22s ease;
        }

        .popup-icon img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            display: block;
        }

        .popup-overlay.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .popup-card {
            width: min(470px, 92vw);
            border-radius: 28px;
            background: #fffdfd;
            border: 2px solid rgba(206, 186, 240, .7);
            padding: 32px 28px 28px;
            text-align: center;
            transform: scale(.84) translateY(15px);
            transition: transform .24s ease;
        }

        .popup-overlay.show .popup-card {
            transform: scale(1) translateY(0);
        }

        .popup-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 14px;
            font-size: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-title {
            font-size: 34px;
            color: #402a75;
            margin-bottom: 10px;
        }

        .popup-message {
            font-size: 19px;
            line-height: 1.45;
            color: #5a4b78;
        }

        .popup-button {
            min-width: 150px;
            min-height: 52px;
            margin-top: 22px;
            padding: 10px 24px;
            border-radius: 16px;
            background: linear-gradient(135deg, #9b85f5, #7c68df);
            color: #fff;
            font-size: 19px;
            border: 0;
        }

        .final-card .popup-icon img {
            width: 90px;
            height: 90px;
        }

        .final-card {
            width: min(540px, 94vw);
            max-height: calc(100vh - 44px);
            overflow: auto;
            background: linear-gradient(145deg, #fffdfc, #f8f2ff);
            border-color: #e2cfff;
            padding: 38px 30px 32px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 24px 60px rgba(76, 56, 124, .22);
        }

        .final-card .popup-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
        }

        .final-card .popup-icon img {
            width: 90px;
            height: 90px;
            object-fit: contain;
        }

        .final-card .popup-title {
            margin-bottom: 10px;
        }

        .final-card .popup-message {
            max-width: 420px;
            margin: 0 auto;
        }

        .final-card .play-again-button {
            margin-top: 22px;
        }

        .final-card .popup-icon {
            font-size: 72px;
        }

        .final-card .popup-title {
            font-size: 40px;
        }

        .play-again-button {
            background: linear-gradient(135deg, #ff8eae, #8f7bf1);
        }

        /* =========================================================
   CONFETTI
========================================================= */
.confetti-piece{
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    z-index:12000;
    pointer-events:none;
    animation:confettiFall 1.55s ease-in forwards;
}

@keyframes confettiFall{
    to{
        transform:translateY(110vh) rotate(760deg);
        opacity:.3;
    }
}

/* =========================================================
   RESPONSIVE MEDIA QUERIES

========================================================= */

    .popup-title{

    }

    }

@media (min-width:1025px) and (max-width:1440px){
    .quiz-page{
        padding:12px 28px 16px;
    }

    .top-bar{
        min-height:78px;
    }

    .page-title{
        font-size:30px;
    }

    .game-area{
        justify-content:flex-start;
        gap:8px;
        padding-top:10px;
        padding-bottom:68px;
    }

    .equation-card{
        width:min(1120px,92%);
        min-height:104px;
        margin-top:8px;
    }

    .number-line-panel{
        min-height:300px;
        transform:translateY(24px);
    }

    .jump-svg{
        height:220px;
    }

    .number-line-wrap{
        width:calc(100% - 40px);
        height:250px;
    }

    .number-label{
        top:calc(var(--line-top) + 24px);
        font-size:18px;
    }

    /* .navigation{
        padding-left:30px;
        padding-right:30px;
    } */
    .instruction{
        font-size:30px;
        margin-bottom:-30px;
    }
}

@media (min-width:1441px){
    .instruction{
        margin-bottom:-40px;
        font-size:40px !important;
    }
    .quiz-page{
        padding:12px 34px 16px;
    }
    .equation-card{
       font-size:40px;
    }

    .top-bar{
        min-height:88px;
    }

    .page-title{
        font-size:40px;
    }
    .question-number{
        font-size:40px;
    }

    .icon-button{
        width:82px;
        height:82px;
    }

    .icon-button img{
        width:59px;
        height:59px;
    }

    .game-area{
        width:min(1600px,100%);
        justify-content:center;
        gap:8px;
        padding-top:14px;
        padding-bottom:72px;
    }

    .equation-card{
        /* width:min(1320px,92%); */
        width:50%;
        height:54px;
        margin-top:12px;
    }

    .number-line-panel{
        transform:translateY(24px);
    }

    .jump-svg{
        height:1000px !important;
    }

    .number-label.start,
    .number-label.target,
    .number-label.done{
        top:calc(var(--line-top) + 18px);
    }

    .eq-number{
        font-size:40px;
    }

    .eq-symbol{
        font-size:40px;
    }

    .answer-box{
        width:118px;
        height:66px;
        font-size:40px;
    }

    .number-line-panel{
        min-height:360px;
    }

    .number-line-wrap{
        width:calc(100% - 30px);
        height:310px;
        --line-top:204px;
    }

    .number-line{
        top:var(--line-top);
    }

    .number-label{
        top:calc(var(--line-top) + 28px);
        font-size:20px;
    }

    .number-label.start,
    .number-label.target,
    .number-label.done{
        top:calc(var(--line-top) + 22px);
    }

    .frog{
        width:200px;
        height:200px;
    }

    .instruction{
        font-size:18px;
    }

    .navigation{
        bottom:16px;
        padding-left:58px;
        padding-right:58px;

    }

    .nav-button{
        width:82px;
        height:82px;
    }

    .nav-button img{
        width:55px;
        height:55px;
    }
}
.number-label {
    opacity: 1 !important;
    visibility: visible !important;
    display: block !important;
}
/* Reduce gap between Previous and Next buttons on all screens */
.navigation{
    left:6%;
    right:6%;
    padding-left:0 !important;
    padding-right:0 !important;
}
</style>
</head>

<body>
<div class="quiz-page" id="quizPage">

    <div class="top-bar">
        <button class="icon-button home-button" id="homeButton" type="button" aria-label="Home" title="Home">
            <img src="../assets/images/home.png" alt="Home">
        </button>

        <div class="title-wrap">
            <div class="page-title">Subtract the following using number line.</div>
            <div class="title-dots" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>

        <button class="icon-button hint-button" id="hintButton" type="button" aria-label="Hint" title="Hint">
            <img src="../assets/images/hint.png" alt="Hint">
        </button>
    </div>

    <main class="game-area">

        <div class="equation-card" id="equationCard">
            <div class="equation" id="equation"></div>
        </div>

        <section class="number-line-panel" aria-label="Interactive number line">
            <div class="number-line-wrap" id="numberLineWrap">
                <svg class="jump-svg" id="jumpSvg" aria-hidden="true">
                    <defs>
                        <marker id="arrowHead" markerWidth="8" markerHeight="8"
                                refX="6" refY="3" orient="auto">
                            <path d="M0,0 L6,3 L0,6 Z" fill="#79b94b"></path>
                        </marker>
                    </defs>
                </svg>

                <div class="number-line" id="numberLine"></div>
                <img class="frog" id="frog" src="../assets/images/frog.png" alt="Frog">

                <div class="instruction" id="instruction">
                    Start at <strong id="startInstruction">18</strong> and click the answer number.
                </div>
            </div>
        </section>

    </main>

    <div class="navigation">
        <button class="nav-button prev-button" id="prevButton" type="button"
                aria-label="Previous question" disabled>
            <img src="../assets/images/left-arrow.png" alt="Previous">
        </button>

        <button class="nav-button next-button" id="nextButton" type="button"
                aria-label="Next question" disabled>
            <img src="../assets/images/right-arrow.png" alt="Next">
        </button>
    </div>
</div>

<!-- HINT POPUP -->
<div class="popup-overlay" id="hintOverlay" aria-hidden="true">
    <div class="popup-card">
        <div class="popup-icon">💡</div>
        <div class="popup-title">Hint</div>
        <div class="popup-message" id="hintMessage"></div>
        <button class="popup-button" id="hintCloseButton" type="button">OK</button>
    </div>
</div>

<!-- CORRECT POPUP -->
    <div class="popup-overlay" id="correctOverlay" aria-hidden="true">
        <div class="popup-card">
            <div class="popup-icon"><img src="../assets/images/correct.png" alt="Correct"></div>
            <div class="popup-title">Correct!</div>
            <div class="popup-message">Great job! Your answer is correct.</div>
        </div>
    </div>

    <!-- WRONG POPUP -->
    <div class="popup-overlay" id="wrongOverlay" aria-hidden="true">
        <div class="popup-card">
            <div class="popup-icon"><img src="../assets/images/wrong.png" alt="Wrong"></div>
            <div class="popup-title">Try Again</div>
            <div class="popup-message">That answer is not correct yet. Try once more.</div>
        </div>
    </div>

    <!-- FINAL POPUP -->
    <div class="popup-overlay" id="finalOverlay" aria-hidden="true">
        <div class="popup-card final-card" role="dialog" aria-modal="true" aria-labelledby="finalPopupTitle">
            <div class="popup-icon">
                <img src="../assets/images/trophy.png" alt="Trophy">
            </div>
            <div class="popup-title" id="finalPopupTitle">Activity Complete!</div>
            <div class="popup-message">You finished all the questions.</div>
            <button class="popup-button play-again-button hand-target" id="playAgainButton" type="button">
                Play Again
            </button>
        </div>
    </div>

<script>
/* =========================================================
   QUIZ DATA
   Based on the five questions in the supplied reference image.
========================================================= */
const quizData = [
    {
        a:18,
        b:4,
        result:14,
        hint:"Start at 18 on the number line and count back 4 spaces, one jump at a time."
    },
    {
        a:20,
        b:7,
        result:13,
        hint:"Start at 20 on the number line and count back 7 spaces, one jump at a time."
    },
    {
        a:17,
        b:5,
        result:12,
        hint:"Start at 17 on the number line and count back 5 spaces, one jump at a time."
    },
    {
        a:23,
        b:9,
        result:14,
        hint:"Start at 23 on the number line and count back 9 spaces, one jump at a time."
    },
    {
        a:30,
        b:17,
        result:13,
        hint:"Start at 30 on the number line and count back 17 spaces, one jump at a time."
    }
];

let currentQuestion = 0;
const completed = new Array(quizData.length).fill(false);
const selectedAnswers = new Array(quizData.length).fill(null);

const equation = document.getElementById("equation");
const equationCard = document.getElementById("equationCard");
const numberLineWrap = document.getElementById("numberLineWrap");
const numberLine = document.getElementById("numberLine");
const jumpSvg = document.getElementById("jumpSvg");
const frog = document.getElementById("frog");
const instruction = document.getElementById("instruction");
const startInstruction = document.getElementById("startInstruction");

const prevButton = document.getElementById("prevButton");
const nextButton = document.getElementById("nextButton");
const hintButton = document.getElementById("hintButton");
const homeButton = document.getElementById("homeButton");

const hintOverlay = document.getElementById("hintOverlay");
const correctOverlay = document.getElementById("correctOverlay");
const wrongOverlay = document.getElementById("wrongOverlay");
const finalOverlay = document.getElementById("finalOverlay");
const hintMessage = document.getElementById("hintMessage");

function correctAnswer(q){
    return q.a - q.b;
}

function renderEquation(q, showAnswer){
    equation.innerHTML = "";

    const qNumber = document.createElement("span");
    qNumber.className = "question-number";
    qNumber.textContent = `Q${currentQuestion + 1}.`;
    equation.appendChild(qNumber);

    const a = document.createElement("span");
    a.className = "eq-number";
    a.textContent = q.a;

    const minus = document.createElement("span");
    minus.className = "eq-symbol";
    minus.textContent = "−";

    const b = document.createElement("span");
    b.className = "eq-number";
    b.textContent = q.b;

    const equals = document.createElement("span");
    equals.className = "eq-symbol equals";
    equals.textContent = "=";

    const answer = document.createElement("div");
    answer.className = "answer-box";
    answer.id = "answerBox";
    answer.textContent = showAnswer ? correctAnswer(q) : (selectedAnswers[currentQuestion] ?? "");

    if(showAnswer){
        answer.classList.add("filled");
    }

    equation.append(a, minus, b, equals, answer);
}

function getX(value){
    /* Leave half a frog of room at each end. The frog is centred on its
       number, so with 30 sitting hard against the right edge (the last
       question) half of it was cut off. Insetting the scale keeps the
       frog over the correct number and fully on screen at every size. */
    const width = numberLineWrap.clientWidth;
    const inset = Math.min((frog.offsetWidth / 2) + 6, width / 6);

    return inset + (value / 30) * (width - inset * 2);
}

function getLineY(){
    const line = numberLine.getBoundingClientRect();
    const wrap = numberLineWrap.getBoundingClientRect();
    return line.top - wrap.top;
}

function clearJumpVisuals(){
    jumpSvg.querySelectorAll(".jump-arc").forEach(el => el.remove());
    numberLineWrap.querySelectorAll(".jump-count").forEach(el => el.remove());

    numberLineWrap.querySelectorAll(".number-label").forEach(el => {
        el.classList.remove("start","target","done");
        el.classList.remove("clicked");
        el.style.opacity = "1";
        el.style.visibility = "visible";
        el.style.display = "block";
    });
}

function createNumberLine(q){
    clearJumpVisuals();

    numberLine.innerHTML = "";

    /* Ticks and labels are placed with getX so they stay lined up with
       the frog, which uses the same inset scale. */
    const lineWidth = numberLineWrap.clientWidth || 1;

    for(let n = 0; n <= 30; n++){
        const tick = document.createElement("span");
        tick.className = "number-tick";
        tick.style.left = `${(getX(n) / lineWidth) * 100}%`;
        numberLine.appendChild(tick);

        const label = document.createElement("span");
        label.className = "number-label clickable";
        label.dataset.value = n;
        label.textContent = n;
        label.style.left = `${getX(n)}px`;

        if(n === q.a){
            label.classList.add("start");
        }

        label.addEventListener("click", () => handleNumberClick(n));
        numberLineWrap.appendChild(label);
    }

    if(completed[currentQuestion]){
        const resultLabel = numberLineWrap.querySelector(
            `.number-label[data-value="${q.result}"]`
        );

        if(resultLabel){
            resultLabel.classList.add("done");
        }

        /* Restore the exact jump path and jump numbers for a completed question. */
        for(let step = 1; step <= q.b; step++){
            const from = q.a - (step - 1);
            const to = q.a - step;
            makeArc(from, to, step);
        }

        jumpSvg.querySelectorAll(".jump-arc").forEach(el => el.classList.add("show"));
        jumpSvg.querySelectorAll(".jump-count").forEach(el => el.classList.add("show"));

        positionFrog(q.result, false);
        instruction.innerHTML = `Correct! Frog jumped from <strong>${q.a}</strong> to <strong>${q.result}</strong>.`;
    }else{
        positionFrog(q.a, false);
        instruction.innerHTML =
            `Start at <strong id="startInstruction">${q.a}</strong> and click the answer number.`;
    }
}

function positionFrog(value, jumping){
    frog.style.left = `${getX(value)}px`;
    frog.style.top = `${getLineY() - 4}px`;

    if(jumping){
        frog.classList.remove("jumping");
        void frog.offsetWidth;
        frog.classList.add("jumping");
    }
}

function makeArc(from, to, stepNumber){
    const x1 = getX(from);
    const x2 = getX(to);
    const y = getLineY();
    const distance = Math.abs(x1 - x2);
    const peak = Math.max(
        window.innerWidth >= 1441 ? 145 :
        window.innerWidth >= 1025 ? 120 :
        window.innerWidth >= 601 ? 95 : 55,
        Math.min(
            window.innerWidth >= 1441 ? 205 :
            window.innerWidth >= 1025 ? 175 :
            window.innerWidth >= 601 ? 135 : 72,
            distance * 1.5
        )
    );

    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.classList.add("jump-arc");
    path.setAttribute("d",
        `M ${x1} ${y}
         C ${x1} ${y - peak},
           ${x2} ${y - peak},
           ${x2} ${y}`
    );

    jumpSvg.appendChild(path);

    const count = document.createElement("div");
    count.className = "jump-count";
    count.textContent = stepNumber;
    count.style.left = `${(x1 + x2) / 2}px`;
    count.style.top = `${y - peak - 30}px`;
    numberLineWrap.appendChild(count);

    requestAnimationFrame(() => {
        path.classList.add("show");
        count.classList.add("show");
    });
}

async function animateJumps(q){
    const target = q.result;

    frog.style.transition = "left .34s ease, top .34s ease, transform .34s ease";

    for(let step = 1; step <= q.b; step++){
        const from = q.a - (step - 1);
        const to = q.a - step;

        makeArc(from, to, step);
        positionFrog(to, true);

        await new Promise(resolve => setTimeout(resolve, 360));
    }

    const targetLabel = numberLineWrap.querySelector(
        `.number-label[data-value="${target}"]`
    );

    if(targetLabel){
        targetLabel.classList.remove("target");
        targetLabel.classList.add("done");
    }

    selectedAnswers[currentQuestion] = target;
}

function handleNumberClick(value){
    if(completed[currentQuestion]) return;

    const q = quizData[currentQuestion];

    const clickedLabel = numberLineWrap.querySelector(
        `.number-label[data-value="${value}"]`
    );

    if(clickedLabel){
        clickedLabel.classList.add("clicked");
    }

    if(value !== q.result){
        if(clickedLabel){
            setTimeout(() => {
                clickedLabel.classList.remove("clicked");
            }, 700);
        }

        selectedAnswers[currentQuestion] = value;

        const answerBox = document.getElementById("answerBox");
        answerBox.textContent = value;
        answerBox.classList.remove("shake");
        void answerBox.offsetWidth;
        answerBox.classList.add("shake");

        showPopup(wrongOverlay);
        playWrongSound();

        // Automatically close wrong popup and allow another attempt.
        setTimeout(() => {
            hidePopup(wrongOverlay);
            selectedAnswers[currentQuestion] = null;
            answerBox.textContent = "";
        }, 1500);

        return;
    }

    selectedAnswers[currentQuestion] = value;

    if(clickedLabel){
        clickedLabel.classList.remove("target");
        clickedLabel.classList.add("done");
    }

    renderEquation(q, false);

    const answerBox = document.getElementById("answerBox");
    answerBox.textContent = value;

    instruction.innerHTML =
        `Jumping back <strong>${q.b}</strong> spaces from <strong>${q.a}</strong>...`;

    animateJumps(q).then(() => {
        completed[currentQuestion] = true;
        renderEquation(q, true);

        const resultLabel = numberLineWrap.querySelector(
            `.number-label[data-value="${q.result}"]`
        );

        if(resultLabel){
            resultLabel.classList.add("clicked");
            resultLabel.classList.remove("target");
            resultLabel.classList.add("done");
        }

        instruction.innerHTML =
            `Great! <strong>${q.a} − ${q.b} = ${q.result}</strong>`;

        updateNavigation();

        // Always show the correct popup first, including on the last question.
        showPopup(correctOverlay);
        playCorrectSound();
        launchConfetti(55);

        if(currentQuestion === quizData.length - 1){
            // Last question: close correct popup, then show final popup.
            setTimeout(() => {
                hidePopup(correctOverlay);
                showPopup(finalOverlay);
                playCorrectSound();
                launchConfetti(110);
            }, 1600);
        }else{
            // Other questions: automatically close correct popup.
            setTimeout(() => {
                hidePopup(correctOverlay);
            }, 1500);
        }
    });
}

function loadQuestion(){
    const q = quizData[currentQuestion];

    renderEquation(q, completed[currentQuestion]);
    createNumberLine(q);
    updateNavigation();

    equationCard.classList.remove("animate");
    void equationCard.offsetWidth;
    equationCard.classList.add("animate");
}

function updateNavigation(){
    prevButton.disabled = currentQuestion === 0;
    nextButton.disabled = !completed[currentQuestion];
}

prevButton.addEventListener("click", () => {
    if(currentQuestion === 0) return;
    currentQuestion--;
    loadQuestion();
});

nextButton.addEventListener("click", () => {
    if(!completed[currentQuestion]) return;

    if(currentQuestion === quizData.length - 1){
        return;
    }

    currentQuestion++;
    loadQuestion();
});

hintButton.addEventListener("click", () => {
    hintMessage.textContent = quizData[currentQuestion].hint;
    showPopup(hintOverlay);
});

document.getElementById("hintCloseButton").addEventListener("click", () => {
    hidePopup(hintOverlay);
});

document.getElementById("playAgainButton").addEventListener("click", () => {
    hidePopup(finalOverlay);
    currentQuestion = 0;
    completed.fill(false);
    selectedAnswers.fill(null);
    loadQuestion();
});

 homeButton.addEventListener("click", () => {
    window.top.location.href = "../Grade2_chapter4.html";
});

function showPopup(overlay){
    overlay.classList.add("show");
    overlay.setAttribute("aria-hidden","false");
}

function hidePopup(overlay){
    overlay.classList.remove("show");
    overlay.setAttribute("aria-hidden","true");
}

[hintOverlay,correctOverlay,wrongOverlay].forEach(overlay => {
    overlay.addEventListener("click", event => {
        if(event.target === overlay) hidePopup(overlay);
    });
});

function launchConfetti(count) {
            const colors = ["#ff8cab", "#8a78ed", "#65cbd2", "#ffd26e", "#7BCB5A"];
            for (let i = 0; i < count; i++) {
                const piece = document.createElement("span");
                piece.className = "confetti-piece";
                piece.style.left = `${Math.random() * 100}vw`;
                piece.style.background = colors[i % colors.length];
                piece.style.animationDelay = `${Math.random() * .5}s`;
                piece.style.transform = `rotate(${Math.random() * 180}deg)`;
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 2200);
            }
        }

        function playTone(frequency,duration,type="sine",delay=0){
    try{
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if(!AudioContextClass) return;

        const ctx = new AudioContextClass();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.type = type;
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(.0001,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            .12,
            ctx.currentTime + .02 + delay
        );
        gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration + delay
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start(ctx.currentTime + delay);
        oscillator.stop(ctx.currentTime + duration + delay + .02);
        oscillator.addEventListener("ended",() => ctx.close());
    }catch(error){}
}

function playCorrectSound(){
    playTone(523,.18,"sine",0);
    playTone(659,.18,"sine",.12);
    playTone(784,.26,"sine",.24);
}

function playWrongSound(){
    playTone(220,.22,"triangle",0);
    playTone(174,.3,"triangle",.14);
}

window.addEventListener("resize",() => {
    const q = quizData[currentQuestion];
    createNumberLine(q);
});

loadQuestion();
</script>
