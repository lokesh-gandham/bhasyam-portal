<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subtraction with Bricks</title>

<!-- Removed reuse.css dependency -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Livvic&display=swap');

/* =========================================================
   BASE STYLES
   ========================================================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    cursor:none !important;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:"Livvic",sans-serif;
    background:
        radial-gradient(circle at 8% 16%,rgba(255,255,255,.8) 0 34px,transparent 35px),
        radial-gradient(circle at 86% 14%,rgba(255,255,255,.72) 0 44px,transparent 45px),
        linear-gradient(135deg,#f1e8ff 0%,#fff5f8 48%,#e9f9ff 100%);
    color:#332267;
    overflow-x:hidden;
}


button{
    font:inherit;
    border:0;
    background:none;
}

.quiz-page{
    width:100%;
    height:100vh;
    min-height:0;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding:16px 28px 86px;
}

.top-bar{
    position:relative;
    z-index:5;
    height:88px;
    flex:0 0 88px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
}

.title-wrap{
    text-align:center;
    padding-top:4px;
}

.page-title{
    font-size:30px;
    line-height:1;
    color:#3d247b;
}

.title-dots{
    margin:14px auto 0;
    width:min(470px,58vw);
    display:flex;
    justify-content:center;
    align-items:center;
    gap:11px;
}

.title-dots span{
    width:11px;
    height:6px;
    border-radius:999px;
    display:block;
}

.title-dots span:nth-child(5n+1){background:#ff8caf}
.title-dots span:nth-child(5n+2){background:#ffc76f}
.title-dots span:nth-child(5n+3){background:#83d7c5}
.title-dots span:nth-child(5n+4){background:#cbb6ff}
.title-dots span:nth-child(5n){background:#9fd6ff}

.icon-button{
    position:absolute;
    top:0;
    width:76px;
    height:76px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 7px 16px rgba(76,56,124,.16),inset 0 0 0 4px rgba(255,255,255,.9);
}

.home-button{
    left:2px;
    background:linear-gradient(145deg,#b8a1ff,#8d78ef);
}

.hint-button{
    right:2px;
    background:linear-gradient(145deg,#7fe4e5,#56cdd2);
}

.icon-button img{
    width:54%;
    height:54%;
    object-fit:contain;
    pointer-events:none;
}

/* =========================================================
   QUESTION
   ========================================================= */
.question-line{
    position:relative;
    z-index:4;
    flex:0 0 48px;
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding-left:14px;
}

.question-number{
    font-size:30px;
    line-height:1;
    color:#333;
}

/* =========================================================
   GAME AREA
   ========================================================= */
.game-area{
    position:relative;
    z-index:3;
    width:min(1280px,100%);
    flex:1;
    min-height:0;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
}
.abacus-value{
    margin:4px auto 0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.abacus-row{
    width:100%;
    display:grid;
    grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr) 48px minmax(0,1fr);
    align-items:center;
}

.abacus-operator{
    font-size:34px;
    color:#30235e;
    text-align:center;
    user-select:none;
}

.abacus-card{
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.abacus-board{
    width:min(330px,100%);
    height:300px;
    display:flex;
    align-items:stretch;
    justify-content:center;
    padding:8px 18px 0;
}

.rod{
    position:relative;
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.rod-line{
    position:absolute;
    top:0;
    bottom:58px;
    width:2px;
    border-radius:2px;
    background:#595959;
    pointer-events:none;
}

/* =========================================================
   BEAD STACK
   Beads fill from the BOTTOM upward: the first bead added
   sits just above the rod label, and each new bead (appended
   via appendChild in JS) stacks on top of the previous one.
   ========================================================= */
.bead-stack{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:0;
    bottom:58px;
    display:flex;
    flex-direction:column-reverse;
    align-items:center;
    justify-content:flex-start;
    gap:0;
    z-index:3;
}

.bead{
    width:24px;
    height:24px;
    border-radius:50%;
    flex:0 0 auto;
    box-shadow:0 2px 3px rgba(0,0,0,.25) inset,0 3px 6px rgba(0,0,0,.18);
}

.bead.yellow{background:radial-gradient(circle at 35% 30%,#ffe58a,#f0b429);}
.bead.green{background:radial-gradient(circle at 35% 30%,#8de6b0,#2fa968);}
.bead.blue{background:radial-gradient(circle at 35% 30%,#8fd8ff,#1f9fe0);}

.rod-label{
    position:absolute;
    bottom:20px;
    z-index:5;
    width:56px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:18px;
    color:#fff;
    font-size:17px;
    line-height:1;
    font-weight:500;
    box-shadow:0 3px 0 rgba(0,0,0,.14);
    pointer-events:none;
}

.rod-th{background:#ff3b91}
.rod-h{background:#ffc21a}
.rod-t{background:#00c86b}
.rod-o{background:#12b8ed}

.rod-count{
    position:absolute;
    right:calc(50% - 29px);
    bottom:47px;
    z-index:6;
    width:27px;
    height:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#29345d;
    color:#fff;
    border:2px solid #fff;
    font-size:13px;
    line-height:1;
    pointer-events:none;
}

.rod.clickable{
    cursor:pointer;
}



/* .rod.clickable:not(.locked):hover::after,
.rod.result-unlocked:not(.locked):hover::after{
    background:rgba(255,211,79,.13);
    box-shadow:inset 0 0 0 2px rgba(255,185,70,.35);
} */

/* .rod.clickable:not(.locked):active::after,
.rod.result-unlocked:not(.locked):active::after{
    background:rgba(131,215,197,.16);
    box-shadow:inset 0 0 0 3px rgba(86,205,210,.30);
} */

.rod.locked::after{
    animation:none;
    background:transparent;
    box-shadow:none;
}

.rod.locked .rod-count{
    background:#5d8d31;
}

.rod.result-unlocked::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    border-radius:12px;
    background:rgba(255,211,79,.06);
    box-shadow:inset 0 0 0 2px rgba(255,185,70,.16);
    animation:rodReady 1.5s ease-in-out infinite;
}

.rod.result-correct .rod-label{
    box-shadow:0 3px 0 rgba(77,137,43,.20);
}

@keyframes rodReady{
    0%,100%{box-shadow:inset 0 0 0 2px rgba(255,185,70,.08)}
    50%{box-shadow:inset 0 0 0 3px rgba(255,185,70,.27)}
}

/* =========================================================
   HAND POINTER
   ========================================================= */
.hand-pointer{
    position:fixed;
    left:0;
    top:0;
    width:62px;
    height:62px;
    object-fit:contain;
    z-index:99999;
    pointer-events:none;
    transform:translate(-10px,-8px);
    opacity:0;
    transition:opacity .12s ease;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.18));
}

.hand-pointer.show{
    opacity:1;
}

.bead-enter{
    animation:beadEnter .45s ease-out both;
    animation-delay:var(--bead-delay,0s);
}

@keyframes beadEnter{
    from{
        opacity:0;
        transform:translateY(-18px) scale(.55);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.navigation{
    position:absolute;
    left:0;
    right:0;
    bottom:26px;
    z-index:6;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:min(42vw,520px);
    pointer-events:none;
}

.nav-button{
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:auto;
    width:90px;
    height:90px;
    border-radius:50%;
    box-shadow:0 7px 16px rgba(76,56,124,.18),inset 0 0 0 4px rgba(255,255,255,.9);
    transition:transform .18s ease,opacity .18s ease,filter .18s ease;
}

.prev-button{background:linear-gradient(145deg,#ff91af,#ff6f99)}
.next-button{background:linear-gradient(145deg,#73b9ff,#4d9cf4)}

.nav-button img{
    width:52%;
    height:52%;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none;
}

.nav-button:hover:not(:disabled){
    transform:translateY(-3px) scale(1.04);
}

.nav-button:active:not(:disabled){
    transform:translateY(2px) scale(.98);
}

.nav-button:disabled{
    opacity:.3;
    filter:grayscale(.2);
    cursor:not-allowed;
}

.next-button:not(:disabled){
    animation:nextButtonMove 1s ease-in-out infinite;
}

@keyframes nextButtonMove{
    0%,100%{transform:translateX(0) scale(1)}
    40%{transform:translateX(9px) scale(1.05)}
    60%{transform:translateX(5px) scale(1.02)}
}

/* =========================================================
   POPUPS
========================================================= */
.popup-overlay{
    position:fixed;
    inset:0;
    z-index:10000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    background:rgba(45,31,80,.24);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s ease,visibility .22s ease;
}

.popup-overlay.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.popup-card{
    width:min(470px,92vw);
    padding:32px 28px 28px;
    border:2px solid rgba(206,186,240,.7);
    border-radius:28px;
    background:#fffdfd;
    text-align:center;
    box-shadow:0 22px 50px rgba(61,36,123,.22);
    transform:scale(.84) translateY(15px);
    transition:transform .24s ease;
}

.popup-overlay.show .popup-card{
    transform:scale(1) translateY(0);
}

.popup-icon{
    width:84px;
    height:84px;
    margin:0 auto 14px;
    object-fit:contain;
}

.popup-title{
    margin-bottom:10px;
    color:#402a75;
    font-size:34px;
}

.popup-message{
    color:#5a4b78;
    font-size:19px;
    line-height:1.45;
}

.popup-button{
    min-width:150px;
    min-height:52px;
    margin-top:22px;
    padding:10px 24px;
    border:0;
    border-radius:16px;
    background:linear-gradient(135deg,#9b85f5,#7c68df);
    color:#fff;
    font-size:19px;
    cursor:pointer;
}

.final-card{
    width:min(540px,94vw);
    padding:38px 30px 32px;
    background:linear-gradient(145deg,#fffdfc,#f8f2ff);
    border-color:#e2cfff;
}

.final-card .popup-title{
    font-size:40px;
}

.play-again-button{
    background:linear-gradient(135deg,#ff8eae,#8f7bf1);
}

/* =========================================================
   RESPONSIVE MEDIA QUERIES
   Ordered: mobile -> tablet -> laptop -> desktop
    Responsive navigation and popup styles
   ========================================================= */

    }

    }

<body>
<div class="quiz-page" id="quizPage">

    <div class="top-bar">
        <button class="icon-button home-button hand-target" id="homeButton" type="button" aria-label="Home" title="Home">
            <img src="../assets/images/home.png" alt="">
        </button>

        <div class="title-wrap">
            <div class="page-title">Subtraction with Beads</div>
            <div class="title-dots" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>

        <button class="icon-button hint-button hand-target" id="hintButton" type="button" aria-label="Hint" title="Hint">
            <img src="../assets/images/hint.png" alt="">
        </button>
    </div>

    <div class="question-line" id="questionLine">
        <span class="question-number" id="questionNumber">Q1.</span>
    </div>

    <main class="game-area">
        <div class="abacus-row">

            <section class="abacus-card">
                <div class="abacus-board" id="firstAbacus"></div>
                <div class="abacus-value" id="firstValue">97</div>
            </section>

            <div class="abacus-operator">−</div>

            <section class="abacus-card">
                <div class="abacus-board" id="secondAbacus"></div>
                <div class="abacus-value" id="secondValue">34</div>
            </section>

            <div class="abacus-operator">=</div>

            <section class="abacus-card result-card">
                <div class="abacus-board" id="resultAbacus"></div>
                <div class="abacus-value result-value answer-hidden" id="resultValue">?</div>
            </section>

        </div>
    </main>

    <div class="navigation">
        <button class="nav-button prev-button hand-target" id="prevButton" type="button" aria-label="Previous question" disabled>
            <img src="../assets/images/left-arrow.png" alt="">
        </button>

        <button class="nav-button next-button hand-target" id="nextButton" type="button" aria-label="Next question" disabled>
            <img src="../assets/images/right-arrow.png" alt="">
        </button>
    </div>
</div>

<img class="hand-pointer" id="handPointer" src="../assets/images/handPointer.png" alt="" aria-hidden="true">

<!-- HINT POPUP — shared popup styling comes from reuse.css -->
<div class="popup-overlay" id="hintOverlay" aria-hidden="true">
    <div class="popup-card">
        <img class="popup-icon" src="../assets/images/hint.png" alt="">
        <div class="popup-title">Hint</div>
        <div class="popup-message" id="hintMessage"></div>
        <button class="popup-button hand-target" id="hintCloseButton" type="button">OK</button>
    </div>
</div>

<!-- CORRECT POPUP -->
<div class="popup-overlay" id="correctOverlay" aria-hidden="true">
    <div class="popup-card">
        <img class="popup-icon" src="../assets/images/correct.png" alt="">
        <div class="popup-title">Correct!</div>
        <div class="popup-message">Great job! Your subtraction is correct.</div>
        <button class="popup-button hand-target" id="correctCloseButton" type="button">Continue</button>
    </div>
</div>

<!-- WRONG POPUP -->
<div class="popup-overlay" id="wrongOverlay" aria-hidden="true">
    <div class="popup-card">
        <img class="popup-icon" src="../assets/images/wrong.png" alt="">
        <div class="popup-title">Try Again</div>
        <div class="popup-message" id="wrongMessage">That answer is not correct yet. Try once more.</div>
        <button class="popup-button hand-target" id="wrongCloseButton" type="button">Try Again</button>
    </div>
</div>

<!-- FINAL POPUP -->
<div class="popup-overlay" id="finalOverlay" aria-hidden="true">
    <div class="popup-card final-card">
        <img class="popup-icon" src="../assets/images/trophy.png" alt="">
        <div class="popup-title">Activity Complete!</div>
        <div class="popup-message">You finished all the subtraction questions.</div>
        <button class="popup-button play-again-button hand-target" id="playAgainButton" type="button">Play Again</button>
    </div>
</div>

<script>
const quizData = [
    {
        first: 97,
        second: 34,
        answer: 63,
        hint: "Build 97 first and 34 next. Then build the difference.",
        places: ["T","O"]
    },
    {
        first: 275,
        second: 103,
        answer: 172,
        hint: "Build 275 and 103 using Hundreds, Tens and Ones. Then build the difference.",
        places: ["H","T","O"]
    },
    {
        first: 859,
        second: 647,
        answer: 212,
        hint: "Build 859 and 647 using Hundreds, Tens and Ones. Then build the difference.",
        places: ["H","T","O"]
    }
];

let currentQuestion = 0;
const progressState = quizData.map(() => ({
    first: null,
    second: null,
    result: null,
    firstLocked: false,
    secondLocked: false,
    resultLocked: false,
    completed: false
}));

const firstAbacus = document.getElementById("firstAbacus");
const secondAbacus = document.getElementById("secondAbacus");
const resultAbacus = document.getElementById("resultAbacus");
const firstValue = document.getElementById("firstValue");
const secondValue = document.getElementById("secondValue");
const resultValue = document.getElementById("resultValue");
const questionNumber = document.getElementById("questionNumber");

const prevButton = document.getElementById("prevButton");
const nextButton = document.getElementById("nextButton");
const hintButton = document.getElementById("hintButton");
const homeButton = document.getElementById("homeButton");
const handPointer = document.getElementById("handPointer");

const hintOverlay = document.getElementById("hintOverlay");
const correctOverlay = document.getElementById("correctOverlay");
const wrongOverlay = document.getElementById("wrongOverlay");
const finalOverlay = document.getElementById("finalOverlay");
const hintMessage = document.getElementById("hintMessage");
const wrongMessage = document.getElementById("wrongMessage");

function getDigits(number, places){
    const value = String(number).padStart(places.length,"0");
    return value.split("").map(Number);
}

function placeLabels(count){
    return count === 2 ? ["T","O"] : ["H","T","O"];
}

function beadColor(index,count){
    if(count === 2) return index === 0 ? "green" : "blue";
    return ["yellow","green","blue"][index];
}

function createRod(label,index,totalPlaces,beadCount,mode,questionIndex){
    const rod = document.createElement("div");
    rod.className = "rod";

    if(mode === "first" || mode === "second"){
        rod.classList.add("clickable");
    }

    if(mode === "result" && progressState[questionIndex].firstLocked && progressState[questionIndex].secondLocked){
        rod.classList.add("result-unlocked");
    }

    const line = document.createElement("div");
    line.className = "rod-line";

    const stack = document.createElement("div");
    stack.className = "bead-stack";

    for(let i = 0; i < beadCount; i++){
        const bead = document.createElement("span");
        bead.className = `bead bead-enter ${beadColor(index,totalPlaces)}`;
        bead.style.setProperty("--bead-delay", `${i * .07}s`);
        stack.appendChild(bead);
    }

    const labelEl = document.createElement("div");
    labelEl.className = `rod-label rod-${label.toLowerCase()}`;
    labelEl.textContent = label;

    const countEl = document.createElement("div");
    countEl.className = "rod-count";
    countEl.textContent = beadCount;
    countEl.setAttribute("aria-hidden","true");

    rod.append(line,stack,labelEl,countEl);

    return rod;
}

function createAbacus(container, number, mode, questionIndex){
    container.innerHTML = "";

    const q = quizData[questionIndex];
    const state = progressState[questionIndex];
    const labels = placeLabels(q.places.length);

    let counts = [0,0,0];

    if(mode === "first"){
        counts = state.first ? [...state.first] : new Array(labels.length).fill(0);
    }

    if(mode === "second"){
        counts = state.second ? [...state.second] : new Array(labels.length).fill(0);
    }

    if(mode === "result"){
        counts = state.result ? [...state.result] : new Array(labels.length).fill(0);
    }

    labels.forEach((label,index) => {
        const rod = createRod(
            label,
            index,
            labels.length,
            counts[index],
            mode,
            questionIndex
        );

        rod.dataset.mode = mode;
        rod.dataset.index = index;
        rod.dataset.target = String(getDigits(number,labels.length)[index] || 0);
        rod.dataset.count = String(counts[index]);

        if(Number(rod.dataset.target) === 0){
            rod.classList.add("locked");
        }

        if(
            (mode === "first" && state.firstLocked) ||
            (mode === "second" && state.secondLocked) ||
            (mode === "result" && state.resultLocked)
        ){
            rod.classList.add("locked");
        }

        if(mode === "result" && !(state.firstLocked && state.secondLocked)){
            rod.style.pointerEvents = "none";
            rod.style.opacity = ".72";
        }

        rod.addEventListener("click", () => handleRodClick(rod));

        container.appendChild(rod);
    });
}

function renderQuestion(){
    const q = quizData[currentQuestion];
    const state = progressState[currentQuestion];

    questionNumber.textContent = `Q${currentQuestion + 1}.`;

    createAbacus(firstAbacus,q.first,"first",currentQuestion);
    createAbacus(secondAbacus,q.second,"second",currentQuestion);
    createAbacus(resultAbacus,q.answer,"result",currentQuestion);

    firstValue.textContent = q.first;
    secondValue.textContent = q.second;

    if(state.firstLocked && state.secondLocked){
        resultValue.textContent = q.answer;
        resultValue.classList.remove("answer-hidden");
        resultAbacus.classList.add("active");
    }else{
        resultValue.textContent = "?";
        resultValue.classList.add("answer-hidden");
        resultAbacus.classList.remove("active");
    }

    updateNavigation();
}

function rodCounts(container){
    return [...container.querySelectorAll(".rod")].map(rod => Number(rod.dataset.count));
}

function allRodsLocked(mode){
    const q = quizData[currentQuestion];
    const state = progressState[currentQuestion];

    if(mode === "first") return state.firstLocked;
    if(mode === "second") return state.secondLocked;
    return state.resultLocked;
}

function handleRodClick(rod){
    const q = quizData[currentQuestion];
    const state = progressState[currentQuestion];

    const mode = rod.dataset.mode;
    const index = Number(rod.dataset.index);
    const target = Number(rod.dataset.target);
    const current = Number(rod.dataset.count);

    if(mode === "result" && !(state.firstLocked && state.secondLocked)){
        return;
    }

    if(rod.classList.contains("locked")){
        showWrong(`This rod is already complete. It needs exactly ${target} bead${target === 1 ? "" : "s"}.`);
        playWrongSound();
        return;
    }

    if(current >= target){
        rod.classList.add("locked");
        showWrong(`This rod needs exactly ${target} bead${target === 1 ? "" : "s"}.`);
        playWrongSound();
        return;
    }

    const nextCount = current + 1;
    rod.dataset.count = String(nextCount);

    const countEl = rod.querySelector(".rod-count");
    if(countEl) countEl.textContent = nextCount;

    const bead = document.createElement("span");
    bead.className = `bead bead-enter ${beadColor(index,q.places.length)}`;
    rod.querySelector(".bead-stack").appendChild(bead);

    if(nextCount === target){
        rod.classList.add("locked");

        if(mode === "first"){
            const counts = rodCounts(firstAbacus);
            state.first = counts;
            if(counts.every((value,i) => value === getDigits(q.first,q.places.length)[i])){
                state.firstLocked = true;
                renderQuestion();
                if(state.secondLocked){
                    unlockResult();
                }
            }
        }

        if(mode === "second"){
            const counts = rodCounts(secondAbacus);
            state.second = counts;
            if(counts.every((value,i) => value === getDigits(q.second,q.places.length)[i])){
                state.secondLocked = true;
                renderQuestion();
                if(state.firstLocked){
                    unlockResult();
                }
            }
        }

        if(mode === "result"){
            const counts = rodCounts(resultAbacus);
            state.result = counts;

            const answerDigits = getDigits(q.answer,q.places.length);
            if(counts.every((value,i) => value === answerDigits[i])){
                state.resultLocked = true;
                state.completed = true;
                renderQuestion();
                finishQuestion();
            }
        }
    }
}

function unlockResult(){
    const state = progressState[currentQuestion];
    const q = quizData[currentQuestion];

    if(!state.firstLocked || !state.secondLocked) return;

    resultValue.textContent = q.answer;
    resultValue.classList.remove("answer-hidden");
    resultAbacus.classList.add("active");

    createAbacus(resultAbacus,q.answer,"result",currentQuestion);
}

function finishQuestion(){
    updateNavigation();

    setTimeout(() => {
        if(currentQuestion === quizData.length - 1){
            showFinalFeedback();
        }else{
            showPopup(correctOverlay);
            playCorrectSound();
            launchConfetti(55);
        }
    },120);
}

function showFinalFeedback(){
    showPopup(finalOverlay);
    playCorrectSound();
    launchConfetti(110);
}

function showWrong(message){
    wrongMessage.textContent = message;
    showPopup(wrongOverlay);
}

function updateNavigation(){
    prevButton.disabled = currentQuestion === 0;
    nextButton.disabled = !progressState[currentQuestion].completed;
}

function showPopup(overlay){
    overlay.classList.add("show");
    overlay.setAttribute("aria-hidden","false");
}

function hidePopup(overlay){
    overlay.classList.remove("show");
    overlay.setAttribute("aria-hidden","true");
}

prevButton.addEventListener("click",() => {
    if(currentQuestion === 0) return;
    currentQuestion--;
    renderQuestion();
});

nextButton.addEventListener("click",() => {
    if(!progressState[currentQuestion].completed) return;

    if(currentQuestion === quizData.length - 1){
        showFinalFeedback();
        return;
    }

    currentQuestion++;
    renderQuestion();
});

hintButton.addEventListener("click",() => {
    hintMessage.textContent = quizData[currentQuestion].hint;
    showPopup(hintOverlay);
});

document.getElementById("hintCloseButton").addEventListener("click",() => {
    hidePopup(hintOverlay);
});

document.getElementById("wrongCloseButton").addEventListener("click",() => {
    hidePopup(wrongOverlay);
});

document.getElementById("correctCloseButton").addEventListener("click",() => {
    hidePopup(correctOverlay);
});

document.getElementById("playAgainButton").addEventListener("click",() => {
    hidePopup(finalOverlay);
    progressState.forEach(state => {
        state.first = null;
        state.second = null;
        state.result = null;
        state.firstLocked = false;
        state.secondLocked = false;
        state.resultLocked = false;
        state.completed = false;
    });
    currentQuestion = 0;
    renderQuestion();
});

homeButton.addEventListener("click", () => {
    window.location.href = "../Grade2_chapter4.html";
});

[hintOverlay,correctOverlay,wrongOverlay].forEach(overlay => {
    overlay.addEventListener("click",event => {
        if(event.target === overlay) hidePopup(overlay);
    });
});

function launchConfetti(count){
    const colors = ["#ff8cab","#8a78ed","#65cbd2","#ffd26e","#8fd9a8"];

    for(let i = 0; i < count; i++){
        const piece = document.createElement("span");
        piece.style.position = "fixed";
        piece.style.top = "-20px";
        piece.style.left = `${Math.random()*100}vw`;
        piece.style.width = "10px";
        piece.style.height = "16px";
        piece.style.borderRadius = "3px";
        piece.style.zIndex = "12000";
        piece.style.pointerEvents = "none";
        piece.style.background = colors[i % colors.length];
        piece.style.animation = "confettiFall 1.55s ease-in forwards";
        piece.style.animationDelay = `${Math.random()*.5}s`;
        piece.style.transform = `rotate(${Math.random()*180}deg)`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(),2200);
    }
}

function playTone(frequency,duration,type="sine",delay=0){
    try{
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if(!AudioContextClass) return;

        const ctx = new AudioContextClass();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.type = type;
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(.0001,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.02+delay);
        gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration+delay);

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start(ctx.currentTime+delay);
        oscillator.stop(ctx.currentTime+duration+delay+.02);
        oscillator.addEventListener("ended",() => ctx.close());
    }catch(error){}
}

function playCorrectSound(){
    playTone(523,.18,"sine",0);
    playTone(659,.18,"sine",.12);
    playTone(784,.26,"sine",.24);
}

function playWrongSound(){
    playTone(220,.22,"triangle",0);
    playTone(174,.3,"triangle",.14);
}

document.addEventListener("pointermove",event => {
    handPointer.style.left = `${event.clientX}px`;
    handPointer.style.top = `${event.clientY}px`;
    handPointer.classList.add("show");
});

document.addEventListener("pointerleave",() => {
    handPointer.classList.remove("show");
});

document.addEventListener("pointerdown",() => {
    handPointer.style.transform = "translate(-10px,-8px) scale(.88)";
});

document.addEventListener("pointerup",() => {
    handPointer.style.transform = "translate(-10px,-8px) scale(1)";
});

const confettiStyle = document.createElement("style");
confettiStyle.textContent = `
@keyframes confettiFall{
    to{
        transform:translateY(110vh) rotate(760deg);
        opacity:.3;
    }
}`;
document.head.appendChild(confettiStyle);

renderQuestion();
</script>
</body>
</html>
