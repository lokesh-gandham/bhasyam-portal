<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Match the Following - Kids Game</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden
    }

    body {
      font-family: "Livvic", sans-serif;
      background:
        radial-gradient(circle at 8% 16%, rgba(255, 255, 255, .8) 0 34px, transparent 35px),
        radial-gradient(circle at 86% 14%, rgba(255, 255, 255, .72) 0 44px, transparent 45px),
        linear-gradient(135deg, #f1e8ff 0%, #fff5f8 48%, #e9f9ff 100%);
      color: #332267;
      overflow: hidden;
      cursor: default;
    }

    button {
      font: inherit
    }

    .game {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      isolation: isolate
    }

    /* ---------- CLEAN SKY BACKGROUND ---------- */
    /* .sky {
      position: absolute;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, .32), transparent 30%),
        linear-gradient(180deg, #22b8f2 0%, #55d2f1 52%, #a9eaf4 100%);
    } */

    /* Clean background with soft transparent circles. */


    /* ---------- SOFT TRANSPARENT CIRCLE BACKGROUND ---------- */
    /* .soft-circles {
      position: absolute;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none
    } */

    /* .soft-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, .16);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, .10);
      animation: softFloat 14s ease-in-out infinite
    } */

    .sc1 {
      width: 90px;
      height: 90px;
      left: 7%;
      top: 20%;
      animation-delay: -1s
    }

    .sc2 {
      width: 54px;
      height: 54px;
      left: 20%;
      top: 68%;
      animation-delay: -5s
    }

    .sc3 {
      width: 72px;
      height: 72px;
      left: 36%;
      top: 27%;
      animation-delay: -9s
    }

    .sc4 {
      width: 45px;
      height: 45px;
      left: 48%;
      top: 75%;
      animation-delay: -3s
    }

    .sc5 {
      width: 105px;
      height: 105px;
      left: 62%;
      top: 17%;
      animation-delay: -7s
    }

    .sc6 {
      width: 62px;
      height: 62px;
      left: 75%;
      top: 61%;
      animation-delay: -11s
    }

    .sc7 {
      width: 40px;
      height: 40px;
      left: 88%;
      top: 25%;
      animation-delay: -4s
    }

    .sc8 {
      width: 78px;
      height: 78px;
      left: 93%;
      top: 76%;
      animation-delay: -8s
    }

    .sc9 {
      width: 48px;
      height: 48px;
      left: 42%;
      top: 48%;
      animation-delay: -13s
    }

    @keyframes softFloat {

      0%,
      100% {
        transform: translate(0, 0) scale(1)
      }

      50% {
        transform: translate(18px, -16px) scale(1.06)
      }
    }

    /* ---------- HEADER ---------- */
    .header {
      position: absolute;
      z-index: 50;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 900px;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-wrap {
      text-align: center;
      padding-top: 8px;
    }

    .page-title {
      font-size: 30px;
      line-height: 1;
      color: #3d247b;
      letter-spacing: .2px;
      font-weight: 400;
    }

    .title-dots {
      margin: 16px auto 0;
      width: min(480px, 58vw);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .title-dots span {
      width: 11px;
      height: 6px;
      border-radius: 999px;
      display: block;
    }

    .title-dots span:nth-child(5n+1) { background: #ff8caf; }
    .title-dots span:nth-child(5n+2) { background: #ffc76f; }
    .title-dots span:nth-child(5n+3) { background: #83d7c5; }
    .title-dots span:nth-child(5n+4) { background: #cbb6ff; }
    .title-dots span:nth-child(5n) { background: #9fd6ff; }

    /* ---------- TOP BUTTONS ---------- */
    .top-btn {
      position: absolute;
      z-index: 100;
      top: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 5px solid #fff;
      display: grid;
      place-items: center;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(0, 0, 0, .25), 0 10px 22px rgba(0, 0, 0, .22);
      transition: .15s
    }

    .top-btn:hover {
      transform: translateY(-4px) scale(1.03)
    }

    .top-btn:active {
      transform: translateY(5px)
    }

    .home-btn {
      left: 24px;
      background: linear-gradient(145deg, #ffbd2e, #f1780a);
      font-size: 30px;
    }

    .sound-btn {
      right: 24px;
      background: linear-gradient(145deg, #ffbd2e, #f1780a);
      font-size: 34px
    }


    /* ---------- MATCH BOARD ---------- */
    .board {
      position: absolute;
      z-index: 20;
      left: 50%;
      top: 168px;
      transform: translateX(-50%);
      width: min(90vw, 1410px);
      height: calc(100vh - 175px);
      min-height: 530px
    }

    .columns {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-around;
      align-items: flex-start
    }

    .left-col,
    .right-col {
      width: 36.5%;
      display: flex;
      flex-direction: column;
      gap: 13px
    }

    .left-col {
      padding-top: 0
    }

    .right-col {
      padding-top: 0
    }

    .card {
      position: relative;
      height: 137px;
      border-radius: 26px;
      border: 5px solid #fff;
      display: flex;
      align-items: center;
      overflow: visible;
      box-shadow: 0 7px 0 rgba(0, 0, 0, .17), 0 10px 22px rgba(0, 0, 0, .16);
      transition: transform .18s, filter .18s, box-shadow .18s;
      cursor: pointer
    }

    .card:hover {
      transform: translateY(-4px) scale(1.01);
      filter: brightness(1.04)
    }

    .left-card:nth-child(1) {
      background: linear-gradient(145deg, #f2dcff, #d5b0f6);
      border-color: #ffdfff
    }

    .left-card:nth-child(2) {
      background: linear-gradient(145deg, #edffc1, #bdf25b);
      border-color: #f5ffd5
    }

    .left-card:nth-child(3) {
      background: linear-gradient(145deg, #b8ecff, #76cfff);
      border-color: #e8fbff
    }

    .left-card:nth-child(4) {
      background: linear-gradient(145deg, #ffd0db, #ff9fb7);
      border-color: #fff0f4
    }

     .left-card:nth-child(5 ) {
      background: linear-gradient(145deg, #d0ffef, #a2e7d0);
      border-color: #f9fffd
    }

    .right-card {
      background: linear-gradient(145deg, #fffde9, #fff0c5);
      border-color: #ffd24c;
      min-height: 137px;
      height: auto;
      padding: 10px 18px 10px 16px
    }

    .right-card:hover {
      transform: translateY(-3px)
    }

    .number {
      width: 72px;
      height: 72px;
      margin-left: 20px;
      flex: 0 0 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 38px;
      border: 4px solid rgba(255, 255, 255, .7);
      box-shadow: 0 6px 0 rgba(0, 0, 0, .2)
    }

    .n1 {
      background: linear-gradient(#8e51e8, #5220b8)
    }

    .n2 {
      background: linear-gradient(#78ca23, #4a9c0f)
    }

    .n3 {
      background: linear-gradient(#2fa6ef, #1263c8)
    }

    .n4 {
      background: linear-gradient(#ef4b75, #c81949)
    }

    .n5 {
      background: linear-gradient(#17c289, #00cf8a)
    }

    .left-label, .right-text {
      font-size: clamp(22px, 2.1vw, 34px);
      margin-left: 25px;
      text-shadow: 0 3px 0 rgba(255, 255, 255, .45);
      text-align: left;
    }

    .card-visual {
      width: 92px;
      height: 92px;
      margin-left: auto;
      margin-right: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 92px
    }

    .card-visual img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 5px 2px rgba(0, 0, 0, .18))
    }

    .right-icon {
      width: 125px;
      min-width: 125px;
      height: 105px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .right-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 5px 2px rgba(0, 0, 0, .15))
    }

    .right-text, .left-label, .right-text {
      font-size: clamp(16px, 1.55vw, 27px);
      line-height: 1.18;
      text-align: left;
      flex: 1
    }

    .endpoint {
      position: absolute;
      top: 50%;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transform: translateY(-50%);
      background: #fff;
      border: 5px solid #9d5cff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .85), 0 5px 8px rgba(0, 0, 0, .22);
      z-index: 30
    }

    .left-card .endpoint {
      right: -18px
    }

    .right-card .endpoint {
      left: -18px;
      border-color: #f0a700
    }

    .left-card.selected {
      box-shadow: 0 0 0 7px rgba(255, 255, 255, .8), 0 9px 0 rgba(0, 0, 0, .18);
      transform: scale(1.025)
    }

    .left-card.matched,
    .right-card.matched {
      filter: brightness(1.08);
      cursor: default
    }

    .left-card.matched {
      animation: matchPulse .55s ease
    }

    .right-card.matched {
      animation: matchPulse .55s ease
    }

    @keyframes matchPulse {
      40% {
        transform: scale(1.04)
      }
    }

    /* ---------- WRONG PAIR: RED LIGHT BLINK ---------- */
    .left-card.wrong,
    .right-card.wrong {
      animation: wrongBlink .6s ease
    }

    @keyframes wrongBlink {

      0%,
      100% {
        box-shadow: 0 7px 0 rgba(0, 0, 0, .17), 0 10px 22px rgba(0, 0, 0, .16);
        filter: none
      }

      25%,
      75% {
        box-shadow: 0 0 0 7px rgba(224, 72, 63, .68), 0 7px 0 rgba(0, 0, 0, .17);
        filter: brightness(.94)
      }

      50% {
        box-shadow: 0 7px 0 rgba(0, 0, 0, .17), 0 10px 22px rgba(0, 0, 0, .16);
        filter: none
      }
    }

    .lines {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      overflow: visible
    }

    .line {
      fill: none;
      stroke: #fff;
      stroke-width: 10;
      stroke-linecap: round;
      filter: drop-shadow(0 3px 1px rgba(0, 0, 0, .18));
      animation: lineIn .35s ease
    }

    .lineColor {
      stroke: #ff4b3e;
      stroke-width: 5
    }

    @keyframes lineIn {
      from {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000
      }

      to {
        stroke-dashoffset: 0
      }
    }

    /* ---------- BOTTOM ---------- */
    .fullscreen {
      position: absolute;
      right: 24px;
      bottom: 24px;
      z-index: 80;
      width: 60px;
      height: 60px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(145deg, #ffbd2e, #f1780a);
      color: #fff;
      font-size: 30px;
      cursor: pointer;
      box-shadow: 0 7px 0 #c25b05
    }

    /* ---------- POPUPS ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: .25s
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto
    }

    .popup {
      position: relative;
      width: min(620px, 92vw);
      border-radius: 32px;
      border: 7px solid #fff;
      background: linear-gradient(145deg, #fffdf0, #ffeaa6);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .38), 0 8px 0 #d49c20;
      text-align: center;
      padding: 35px 28px;
      color: #4c2b15;
      transform: scale(.75) translateY(20px);
      transition: .3s
    }

    .overlay.show .popup {
      transform: scale(1) translateY(0)
    }

    .popup h2 {
      font-size: clamp(30px, 5vw, 55px);
      color: #7a3c11;
      text-shadow: 0 3px 0 #fff;
      margin-bottom: 12px
    }

    .popup p {
      font-size: clamp(18px, 2.5vw, 28px);
      line-height: 1.3
    }

    .popup-close {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: #ef5350;
      color: #fff;
      font-size: 29px;
      cursor: pointer
    }

    .popup-btn {
      margin-top: 22px;
      border: 0;
      border-radius: 25px;
      padding: 13px 30px;
      background: linear-gradient(#37d7ff, #0b8fe6);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 6px 0 #0062aa
    }

    /* progress */
    .progress-list {
      max-height: 45vh;
      overflow: auto;
      margin-top: 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .progress-item {
      padding: 10px 12px;
      border-radius: 14px;
      background: #fff8d5;
      border: 3px solid #ffc733;
      font-size: 16px;
    }

    .progress-item span {
      color: #3c9e2a
    }

    .empty {
      padding: 18px;
      background: #fff7d2;
      border-radius: 14px;
    }

    /* ---------- CONFETTI (same to same as reference) ---------- */
    .confetti-piece {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 16px;
      border-radius: 3px;
      z-index: 12000;
      pointer-events: none;
      animation: confettiFall 1.55s ease-in forwards;
    }

    @keyframes confettiFall {
      to {
        transform: translateY(110vh) rotate(760deg);
        opacity: .3;
      }
    }


    /* ---------- MATCH CHECK FLASH ---------- */
    .good {
      animation: goodFlash .7s ease
    }

    @keyframes goodFlash {
      50% {
        filter: brightness(1.22)
      }
    }

    /* ---------- RESPONSIVE: 320px TO 1920px+ ---------- */

    /* 1920px and above */
    @media (min-width:1920px) {
      .header {
        top: 24px;
        width: min(58vw, 1080px);
        height: 112px;
        border-width: 8px;
        border-radius: 30px
      }

      .page-title {
        font-size: 40px
      }

      .header:before,
      .header:after {
        font-size: 70px;
        top: 14px
      }

      .header:before {
        left: -52px
      }

      .header:after {
        right: -52px
      }

      .sound-btn {
        top: 26px;
        right: 34px;
        width: 92px;
        height: 92px;
        font-size: 40px
      }

      .board {
        top: 175px;
        width: min(90vw, 1660px);
        height: calc(100vh - 200px)
      }

      .left-col,
      .right-col {
        width: 37%;
        gap: 18px
      }

      .card {
        height: 164px;
        border-width: 6px;
        border-radius: 30px
      }

      .right-card {
        min-height: 164px;
        padding: 14px 24px 14px 20px
      }

      .number {
        width: 84px;
        height: 84px;
        flex-basis: 84px;
        margin-left: 24px;
        font-size: 44px
      }

      .left-label, .right-text {
        font-size: 38px;
        margin-left: 28px
      }

      .card-visual {
        width: 108px;
        height: 108px;
        flex-basis: 108px;
        margin-right: 24px
      }

      .right-icon {
        width: 150px;
        min-width: 150px;
        font-size: 80px
      }

      .right-text, .left-label, .right-text {
        font-size: 30px
      }

      .endpoint {
        width: 32px;
        height: 32px;
        border-width: 5px
      }

      .left-card .endpoint {
        right: -20px
      }

      .right-card .endpoint {
        left: -20px
      }

      .fullscreen {
        width: 68px;
        height: 68px;
        right: 30px;
        bottom: 28px;
        font-size: 34px
      }
    }

    /* 1600px - 1919px */
    @media (min-width:1600px) and (max-width:1919px) {
      .header {
        top: 20px;
        width: min(60vw, 980px);
        height: 102px
      }

      .page-title {
        font-size: 40px
      }

      .header:before,
      .header:after {
        font-size: 62px
      }

      .sound-btn {
        top: 22px;
        right: 28px;
        width: 86px;
        height: 86px;
        font-size: 37px
      }

      .board {
        top: 158px;
        width: min(90vw, 1510px);
        height: calc(100vh - 183px)
      }

      .left-col,
      .right-col {
        width: 36.8%;
        gap: 15px
      }

      .card {
        height: 148px
      }

      .right-card {
        min-height: 148px;
        padding: 12px 20px 12px 18px
      }

      .number {
        width: 76px;
        height: 76px;
        flex-basis: 76px;
        margin-left: 20px;
        font-size: 40px
      }

      .left-label, .right-text {
        font-size: 34px;
        margin-left: 24px
      }

      .card-visual {
        width: 96px;
        height: 96px;
        flex-basis: 96px;
        margin-right: 20px
      }

      .right-icon {
        width: 132px;
        min-width: 132px;
        font-size: 70px
      }

      .right-text, .left-label, .right-text {
        font-size: 27px
      }

      .endpoint {
        width: 30px;

      }

      .left-card .endpoint {
        right: -19px
      }

      .right-card .endpoint {
        left: -19px
      }
    }

    /* 1440px - 1599px */
    @media (min-width:1440px) and (max-width:1599px) {
      .header {
        top: 18px;

      }

      .page-title {

      }

      .header:before,
      .header:after {

      }

      .sound-btn {
        top: 20px;

      }

      .board {
        top: 178px;

      }

      .left-col,
      .right-col {

      }

      .card {

      }

      .right-card {

      }

      .number {

      }

      .left-label, .right-text {

      }

      .card-visual {
        width: 88px;

      }

      .right-icon {
        width: 120px;

      }

      }
    }

    /* 1200px - 1439px */
    @media (min-width:1200px) and (max-width:1441px) {
      .header {
        top: 10px;
        width: min(63vw, 850px);
        height: 88px;
        border-width: 6px
      }

      .page-title {
        font-size: 30px
      }

      .header:before,
      .header:after {
        font-size: 52px;
        top: 9px
      }

      .header:before {
        left: -39px
      }

      .header:after {
        right: -39px
      }

      .sound-btn {
        top: 18px;
        right: 22px;
        width: 76px;

        font-size: 31px
      }

      .board {
        top: 136px;
        width: 92vw;
        height: calc(100vh - 158px);

      }

      .left-col,
      .right-col {
        width: 36.5%;
        gap: 11px;

      }

      .card {
        height: 120px;
        border-width: 4px;
        border-radius: 23px;

      }


      .right-card {
        min-height: 120px;
        padding: 8px 14px 8px 12px
      }

      .number {
        width: 66px;

        flex-basis: 66px;

      }

      .left-label, .right-text {

      }

      .card-visual img {
        width: 100px;
        height: 100px;
        flex-basis: 78px;
        margin-right: 13px
      }

      .right-icon {
        width: 103px;
        min-width: 103px;
        font-size: 55px
      }

      .right-text, .left-label, .right-text {
        font-size: 20px
      }

      .endpoint {
        width: 26px;
        height: 26px
      }

      .left-card .endpoint {

      .right-card .endpoint {

      }

      .fullscreen {
        width: 60px;
        height: 60px;
        right: 22px;
        bottom: 22px
      }
    }

    /* ---------- COMPACT 5-QUESTION LAYOUT ---------- */
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden !important;
    }

    .game {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      height: 100dvh;
      min-height: 0;
      overflow: hidden !important;
      padding: clamp(6px, 1.2vh, 12px) clamp(8px, 1.2vw, 16px) clamp(10px, 1.5vh, 16px);
      box-sizing: border-box;
    }

    .header {
      position: relative;
      top: auto;
      left: auto;
      transform: none;
      flex-shrink: 0;
      width: 100%;
      max-width: none;
      min-width: 0;
      height: auto;
    }

    .header:before {
      left: -30px;
    }

    .header:after {
      right: -30px;
    }

    .page-title {
      font-size: 30px;
      letter-spacing: .2px;
    }

    .top-btn {
      top: clamp(7px, 1.2vh, 12px);
      width: clamp(38px, 4vw, 56px);
      height: clamp(38px, 4vw, 56px);
      border-width: 3px;
      box-shadow: 0 5px 0 rgba(0, 0, 0, .22), 0 7px 14px rgba(0, 0, 0, .16);
    }

    .home-btn {
      left: clamp(7px, 1.2vw, 16px);
      font-size: clamp(18px, 2vw, 26px);
    }

    .sound-btn {
      right: clamp(7px, 1.2vw, 16px);
      font-size: clamp(18px, 2vw, 26px);
    }

    .board {
      position: relative;
      top: auto;
      left: auto;
      transform: none;
      flex: 1 1 auto;
      width: min(96vw, 1280px);
      height: auto;
      min-height: 0;
      margin: clamp(6px, 1vh, 12px) auto 0;
    }

    .columns {
      --card-gap: clamp(4px, 0.9vh, 9px);
      gap: clamp(10px, 2vw, 28px);
      align-items: stretch;
      height: 100%;
    }

    .left-col,
    .right-col {
      width: calc(50% - clamp(5px, 1vw, 14px));
      height: 100%;
      gap: var(--card-gap);
      min-width: 0;
    }

    .card,
    .right-card {
      height: calc((100% - (4 * var(--card-gap))) / 5);
      min-height: 0 !important;
      border-radius: 17px;
      border-width: 3px;
      padding: 3px 5px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .16), 0 7px 14px rgba(0, 0, 0, .12);
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .number {
      width: clamp(30px, 3.3vw, 48px);
      height: clamp(30px, 3.3vw, 48px);
      flex: 0 0 clamp(30px, 3.3vw, 48px);
      margin-left: clamp(3px, .7vw, 9px);
      border-width: 2px;
      font-size: clamp(14px, 1.35vw, 21px);
      box-shadow: 0 3px 0 rgba(0, 0, 0, .16), inset 0 2px 0 rgba(255, 255, 255, .25);
    }

    .left-label, .right-text {
      min-width: 0;
      margin-left: clamp(6px, .9vw, 14px);
      padding-right: 3px;
      font-size: clamp(10px, 1.45vw, 20px);
      line-height: 1.06;
      overflow-wrap: anywhere;
    }

    .right-text, .left-label, .right-text {
      min-width: 0;
      padding: 0 5px;
      font-size: clamp(9px, 1.3vw, 18px);
      line-height: 1.06;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .progress-list {
      max-height: none !important;
      overflow: hidden !important;
    }

    ========================================================= */
    .final-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      box-sizing: border-box;
      background: rgba(38, 27, 70, .28);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .22s ease, visibility .22s ease;
    }

    .final-overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .final-card {
      width: min(540px, 94vw);
      max-height: calc(100vh - 44px);
      overflow: auto;
      box-sizing: border-box;
      background: linear-gradient(145deg, #fffdfc, #f8f2ff);
      border: 2px solid #e2cfff;
      border-radius: 28px;
      padding: 38px 30px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 24px 60px rgba(76, 56, 124, .22);
      transform: scale(.84) translateY(15px);
      transition: transform .24s ease;
    }

    .final-overlay.show .final-card {
      transform: scale(1) translateY(0);
    }

    .final-card .popup-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .final-card .popup-icon img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
    }

    .final-card .popup-title {
      margin: 0 0 10px;
      font-size: 40px;
      line-height: 1.15;
      color: #402a75;
    }

    .final-card .popup-message {
      max-width: 420px;
      margin: 0 auto;
      font-size: 19px;
      line-height: 1.45;
      color: #5a4b78;
    }

    .final-card .play-again-button {
      min-width: 150px;
      min-height: 52px;
      margin-top: 22px;
      padding: 10px 24px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff8eae, #8f7bf1);
      color: #fff;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      /* box-shadow: 0 5px 0 rgba(103,76,170,.25); */
    }

    .final-card .play-again-button:hover {
      filter: brightness(1.04);
    }

    @media (max-width: 600px) {
      .final-overlay {
        padding: 14px;
      }

      .final-card {
        width: min(94vw, 430px);
        max-height: calc(100vh - 28px);
        padding: 28px 20px 24px;
        border-radius: 22px;
      }

      .final-card .popup-icon {
        width: 78px;
        height: 78px;
        margin-bottom: 10px;
      }

      .final-card .popup-icon img {
        width: 70px;
        height: 70px;
      }

      .final-card .popup-title {
        font-size: 30px;
      }

      .final-card .popup-message {
        font-size: 16px;
      }

      .final-card .play-again-button {
        min-height: 48px;
        font-size: 17px;
      }
    }


    /* =========================================================
       HOME BUTTON — MATCHED TO THE FIRST REFERENCE
       Only the home button is overridden; all other UI/behavior
       remains unchanged.
    ========================================================= */
    .home-btn {
      top: 2px;
      left: 6px;
      width: 75px;
      height: 75px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(145deg, #b8a1ff, #8d78ef);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow:
        0 7px 16px rgba(76, 56, 124, .16),
        inset 0 0 0 4px rgba(255, 255, 255, .9);
      transition: transform .18s ease, filter .18s ease;
      font-size: 0;
    }

    .home-btn img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      display: block;
    }

    .home-btn:hover {
      transform: translateY(-2px) scale(1.04);
    }

    .home-btn:active {
      transform: translateY(2px) scale(.98);
    }

    .home-btn:focus,
    .home-btn:focus-visible {
      border: none;
      outline: none;
    }

    /* Mobile — same sizing/positioning as the first reference */
    @media (max-width: 600px) {
      .home-btn {
        top: 0;
        left: 4px;
        width: 52px;
        height: 52px;
      }

      .home-btn img {
        width: 36px;
        height: 36px;
      }
    }

    /* Tablet — same sizing/positioning as the first reference */
    @media (min-width: 601px) and (max-width: 900px) {
      .home-btn {
        top: 0;
        left: 4px;
        width: 64px;
        height: 64px;
      }

      .home-btn img {
        width: 44px;
        height: 44px;
      }
    }

  /* =========================================================
   Sound button removed. The element stays in the markup so the
   existing script keeps working, but it is never shown.
   ========================================================= */
.sound-btn{
  display:none !important;
}

/* =========================================================
   LARGE MONITORS
   Bigger card text on a wide screen. Laptops are narrower than
   this and keep exactly the sizes they had.
   ========================================================= */
@media (min-width:1600px){

  .left-label, .right-text {
    font-size:30px;
    /* keep long lines clear of the connector dot on the card edge */
    margin-right:34px;
  }

  .right-text{
    font-size:25px;
  }

  .number{
    font-size:36px;
  }
}

@media (min-width:1920px){

  .left-label, .right-text {
    font-size:32px;
  }

  .right-text{
    font-size:26px;
  }

  .number{
    font-size:38px;
  }
}

/* Chapter 4 heading standard — overrides legacy responsive title sizes */
@media (max-width:600px){
  .page-title{
    font-size:30px !important;
    padding-top:5px;
  }

  .title-dots{
    margin-top:10px;
    width:58vw;
    gap:7px;
  }

  .title-dots span{
    width:7px;
    height:4px;
  }
}

@media (min-width:1441px){
  .page-title{
    font-size:40px !important;
  }

  .title-dots{
    margin-top:14px;
  }
}

/* Keep match board inside viewport below the chapter-4 header */
.game .board{
  position:relative !important;
  top:auto !important;
  left:auto !important;
  transform:none !important;
  flex:1 1 auto;
  min-height:0 !important;
  height:auto !important;
}

.game .header{
  position:relative !important;
  top:auto !important;
  left:auto !important;
  transform:none !important;
}

</style>
</head>

<body>
  <div class="game" id="game">
    <div class="sky"></div>
    <div class="soft-circles" aria-hidden="true">
      <span class="soft-circle sc1"></span><span class="soft-circle sc2"></span><span class="soft-circle sc3"></span>
      <span class="soft-circle sc4"></span><span class="soft-circle sc5"></span><span class="soft-circle sc6"></span>
      <span class="soft-circle sc7"></span><span class="soft-circle sc8"></span><span class="soft-circle sc9"></span>
    </div>

    <div class="header">
      <div class="title-wrap">
        <div class="page-title">Match the Following</div>
        <div class="title-dots" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <button class="top-btn home-btn" id="homeBtn" type="button" aria-label="Home" title="Home">
      <img src="../assets/images/home.png" alt="Home">
    </button>
    <button class="top-btn sound-btn" id="soundBtn" aria-label="Sound">🔊</button>

    <main class="board" id="board">
      <svg class="lines" id="lines" aria-hidden="true"></svg>
      <div class="columns">
        <section class="left-col" id="leftCol"></section>
        <section class="right-col" id="rightCol"></section>
      </div>
    </main>
</div>

    <div class="overlay" id="progressOverlay">
      <div class="popup">
        <button class="popup-close" data-close="progressOverlay">×</button>
        <h2>📊 Progress</h2>
        <p id="progressCount">0 / 5 matched</p>
        <div class="progress-list" id="progressList"></div>
        <button class="popup-btn" data-close="progressOverlay">Close</button>
      </div>
    </div>

    <!-- FINAL POPUP - same as the corrected Fill in the Boxes popup -->
    <div class="popup-overlay final-overlay" id="finalOverlay" aria-hidden="true">
      <div class="popup-card final-card" role="dialog" aria-modal="true" aria-labelledby="finalPopupTitle">
        <div class="popup-icon">
          <img src="../assets/images/trophy.png" alt="Trophy">
        </div>
        <div class="popup-title" id="finalPopupTitle">Activity Complete!</div>
        <div class="popup-message">You finished all the questions.</div>
        <button class="popup-button play-again-button" id="playAgainButton" type="button">
          Play Again
        </button>
      </div>
    </div>
  </div>

  <script>
    const PAIRS = [
      { id: 1, left: "100 − 0", right: "Smallest 3 digit number" },
      { id: 2, left: "Difference of the smallest 3 digit number and 1 is", right: "99" },
      { id: 3, left: "999 − 999 ______ predecessor of 1", right: "Equal to" },
      { id: 4, left: "Difference of the largest 3 digit number and 1 is", right: "998" },
      { id: 5, left: "1000 − 100 ______ 100 − 1000", right: "Not equal to" }
    ];

    // Right-column order from the worksheet image.
    const RIGHT_ORDER = [4, 1, 3, 5, 2];

    const leftCol = document.getElementById("leftCol"), rightCol = document.getElementById("rightCol");
    const board = document.getElementById("board"), lines = document.getElementById("lines");
    const scoreEl = document.getElementById("score"), soundBtn = document.getElementById("soundBtn");

    let selectedLeft = null, matched = new Map(), score = 0, soundEnabled = true, audioCtx = null;

    function render() {
      leftCol.innerHTML = ""; rightCol.innerHTML = ""; lines.innerHTML = "";
      PAIRS.forEach((p, i) => {
        const card = document.createElement("button");
        card.className = "card left-card"; card.dataset.id = p.id;
        card.innerHTML = `<span class="number n${p.id}">${p.id}</span><span class="left-label">${p.left}</span><span class="endpoint"></span>`;
        card.addEventListener("click", () => selectLeft(p.id, card));
        leftCol.appendChild(card);
      });
      RIGHT_ORDER.forEach(id => {
        const p = PAIRS.find(x => x.id === id);
        const card = document.createElement("button");
        card.className = "card right-card"; card.dataset.id = p.id;
        card.innerHTML = `<span class="endpoint"></span><span class="right-text">${p.right}</span>`;
        card.addEventListener("click", () => selectRight(p.id, card));
        rightCol.appendChild(card);
      });
      redrawLines();
    }

    function selectLeft(id, card) {
      if (matched.has(id)) return;
      unlockAudio(); clickSound();
      document.querySelectorAll(".left-card.selected").forEach(x => x.classList.remove("selected"));
      selectedLeft = id; card.classList.add("selected");
    }

    function flashWrong(...cards) {
      cards.forEach(c => c.classList.add("wrong"));
      setTimeout(() => cards.forEach(c => c.classList.remove("wrong")), 600);
    }

    function selectRight(id, card) {
      if (matched.has(id)) return;
      if (selectedLeft === null) {
        playWrongSound();
        flashWrong(card);
        return;
      }
      unlockAudio(); clickSound();
      const left = document.querySelector(`.left-card[data-id="${selectedLeft}"]`);
      const right = card;
      if (selectedLeft === id) {
        matched.set(id, true); score += 10; if (scoreEl) scoreEl.textContent = score;
        left.classList.remove("selected"); left.classList.add("matched", "good");
        right.classList.add("matched", "good");
        drawLine(left, right, id);
        playCorrectSound(); launchConfetti(55);
        selectedLeft = null;
        if (matched.size === PAIRS.length) setTimeout(showFinal, 700);
      } else {
        // Wrong pair: red light blink on both cards. Keep the left
        // card selected/active so the same left option can be retried.
        playWrongSound();
        flashWrong(left, right);
      }
    }
    function drawLine(a, b, id) {
      const br = board.getBoundingClientRect(), ar = a.getBoundingClientRect(), rr = b.getBoundingClientRect();
      const x1 = ar.right - br.left - 2, y1 = ar.top - br.top + ar.height / 2;
      const x2 = rr.left - br.left + 2, y2 = rr.top - br.top + rr.height / 2;
      const dx = Math.max(50, Math.abs(x2 - x1) * .42);
      const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.dataset.id = id;
      const under = document.createElementNS("http://www.w3.org/2000/svg", "path");
      under.setAttribute("d", d); under.setAttribute("class", "line");
      const over = document.createElementNS("http://www.w3.org/2000/svg", "path");
      over.setAttribute("d", d); over.setAttribute("class", "line lineColor");
      group.append(under, over); lines.appendChild(group);
    }
    function redrawLines() {
      lines.setAttribute("width", board.clientWidth); lines.setAttribute("height", board.clientHeight);
      lines.setAttribute("viewBox", `0 0 ${board.clientWidth} ${board.clientHeight}`);
      lines.innerHTML = "";
      matched.forEach((_, id) => {
        const a = document.querySelector(`.left-card[data-id="${id}"]`), b = document.querySelector(`.right-card[data-id="${id}"]`);
        if (a && b) drawLine(a, b, id);
      });
    }
    window.addEventListener("resize", redrawLines);

    /* Final popup — same to same as reference: show popup, play the
       3-note ascending correct chime, launch a 110-piece confetti burst. */
    function showFinal() {
      const finalOverlay = document.getElementById("finalOverlay");
      finalOverlay.classList.add("show");
      finalOverlay.setAttribute("aria-hidden", "false");
      playCorrectSound();
      launchConfetti(110);
    }

    function updateProgress() {
      document.getElementById("progressCount").textContent = `${matched.size} / ${PAIRS.length} matched`;
      const list = document.getElementById("progressList");
      list.innerHTML = matched.size ? [...matched.keys()].sort((a, b) => a - b).map(id => {
        const p = PAIRS.find(x => x.id === id); return `<div class="progress-item">✓ ${p.left} → <span>${p.right}</span></div>`;
      }).join("") : `<div class="empty">Match the cards to see your progress.</div>`;
    }
    document.querySelectorAll("[data-close]").forEach(btn => btn.addEventListener("click", () => document.getElementById(btn.dataset.close).classList.remove("show")));
    document.getElementById("progressOverlay").addEventListener("click", e => { if (e.target.id === "progressOverlay") e.currentTarget.classList.remove("show") });

    document.getElementById("playAgainButton").addEventListener("click", () => {
      const finalOverlay = document.getElementById("finalOverlay");
      finalOverlay.classList.remove("show");
      finalOverlay.setAttribute("aria-hidden", "true");
      selectedLeft = null;
      matched.clear();
      score = 0;
      if (scoreEl) scoreEl.textContent = 0;
      render();
    });

    document.getElementById("homeBtn").addEventListener("click", () => {
      window.top.location.href = "../Grade2_chapter4.html";
    });
    soundBtn.addEventListener("click", () => { soundEnabled = !soundEnabled; soundBtn.textContent = soundEnabled ? "🔊" : "🔇"; if (soundEnabled) unlockAudio() });
    document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".overlay.show, .popup-overlay.show").forEach(x => x.classList.remove("show")) });

    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function tone(freq, dur, type = "sine", vol = .06, delay = 0) {
      if (!soundEnabled) return; unlockAudio(); setTimeout(() => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
      }, delay);
    }
    function clickSound() { tone(420, .07, "sine", .045) }

    /* ---------- Correct / wrong / final sound + confetti
       (same to same as reference) ---------- */
    function launchConfetti(count) {
      const colors = ["#ff8cab", "#8a78ed", "#65cbd2", "#ffd26e", "#7BCB5A"];
      for (let i = 0; i < count; i++) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = `${Math.random() * .5}s`;
        piece.style.transform = `rotate(${Math.random() * 180}deg)`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 2200);
      }
    }

    function playTone(frequency, duration, type = "sine", delay = 0) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = type;
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.12, ctx.currentTime + .02 + delay);
        gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + duration + delay);
        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start(ctx.currentTime + delay);
        oscillator.stop(ctx.currentTime + duration + delay + .02);
        oscillator.addEventListener("ended", () => ctx.close());
      } catch (error) { }
    }

    function playCorrectSound() {
      playTone(523, .18, "sine", 0);
      playTone(659, .18, "sine", .12);
      playTone(784, .26, "sine", .24);
    }

    function playWrongSound() {
      playTone(220, .22, "triangle", 0);
      playTone(174, .3, "triangle", .14);
    }

    render();
  </script>
</body>

</html>
