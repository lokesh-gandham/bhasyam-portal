<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write the addition and multiplication facts</title>

<!-- Shared Home / Hint / Next / Previous / Feedback / Final Popup styles -->
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/reuse.css">

<style>
/* =========================================================
   RESET + BASE
   Shared controls/popups intentionally come from reuse.css.
   ========================================================= */
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Livvic", sans-serif;
}

html,body {
  width:100%;
  height:100%;
  overflow:hidden;
}

body {
  font-family: "Livvic", sans-serif;
  color:#2f4f4f;
  background:#fff8e8;
  user-select:none;
}

button,input {
  font:inherit;
}

button {
  -webkit-tap-highlight-color:transparent;
}
/* Exact shared Home / Hint reference */
.icon-button{
    width:68px;
    height:68px;
    border-radius:50%;
    border:2px solid #eadff7;
    background:#fffdf7;
    box-shadow:0 4px 12px rgba(70,50,120,.15);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    transition:transform .15s ease,box-shadow .15s ease;
}
.icon-button:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 14px rgba(70,50,120,.20);
}
.icon-button img{
    width:48px;
    height:48px;
    object-fit:contain;
    display:block;
}

.icon-label{
    font-size:14px;
    line-height:1;
    font-weight:700;
}




.game-page {
  width:100%;
  height:100dvh;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding:10px 28px 12px;
}

.header {
  flex:0 0 auto;
  width:100%;
  max-width:1440px;
  margin:0 auto;
  display:grid;
  grid-template-columns:100px 1fr 100px;
  align-items:start;
}

.title {
  text-align:center;
  color:#3f2a86;
  font-size:30px;
  line-height:1.08;
  align-self: center;
}

.content {
  flex:1 1 auto;
  min-height:0;
  width:100%;
  max-width:1250px;
  margin:4px auto 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
}

.activity {
  width:100%;
  min-height:0;
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(7px,1.1vh,13px);
  padding:2px 10px 0;
}

.question-heading {
  width:100%;
  text-align:left;
  color:#2f4f4f;
  font-size:30px;
  line-height:1;
  flex:0 0 auto;
}

.visual-wrap {
  width:min(1200px,98%);
  display:flex;
  justify-content:center;
  align-items:center;
  flex:0 1 auto;
  min-height:0;
}

.question-image {
  width:min(680px,100%);
  height:min(190px,25vh);
  object-fit:contain;
  display:block;
}

.question-image.tall {
  height:min(250px,31vh);
}
.visual {
  width:100%;
  display:grid;
  grid-template-columns:repeat(var(--groups),minmax(0,1fr));
  gap:clamp(18px,3vw,56px);
  align-items:end;
  justify-items:center;
}

.visual-group {
  display:grid;
  grid-template-columns:repeat(var(--per-group),minmax(0,1fr));
  gap:clamp(2px,.55vw,7px);
  align-items:end;
  justify-items:center;
  min-width:0;
}

.visual-group img {
  width:clamp(34px,5.5vw,76px);
  height:clamp(44px,7.5vw,88px);
  object-fit:contain;
  display:block;
  user-select:none;
  pointer-events:none;
}


.facts {
  width:min(1200px,98%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(16px,2.2vh,28px);
  flex:0 0 auto;
}

.addition-row {
  width:100%;
  display:grid;
  align-items:center;
  justify-content:center;
  grid-template-columns:repeat(var(--groups),minmax(0,1fr)) auto auto;
  column-gap:clamp(18px,2.5vw,34px);
}

.add-cell {
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.add-cell .answer-input {
  width:min(100%,120px);
}

.add-cell .operator {
  position:absolute;
  left:calc(100% + clamp(3px,0.5vw,7px));
  transform:translateX(-50%);
}

.add-total {
  display:flex;
  align-items:center;
  gap:clamp(5px,0.7vw,10px);
}

.operator {
  font-size:clamp(20px,2vw,30px);
  line-height:1;
  color:#2f4f4f;
  text-align:center;
}

.answer-input {
  width:100%;
  height:clamp(44px,6vh,58px);
  border:2px solid #f0a52f;
  border-radius:12px;
  background:#fffdf7;
  color:#2f4f4f;
  text-align:center;
  outline:none;
  font-size:clamp(21px,2vw,29px);
  line-height:1;
  user-select:text;
  caret-color:#7153c1;
  transition:border-color .15s,box-shadow .15s,background .15s;
}

.answer-input:focus {
  border-color:#7153c1;
  box-shadow:0 0 0 3px rgba(113,83,193,.13);
}

.answer-input.correct {
  border-color:#4ec263;
  background:#eef9e9;
  color:#277638;
}

.answer-input.wrong {
  border-color:#ed737c;
  background:#fff0f1;
  animation:inputShake .34s ease;
}

.answer-input:disabled {
  cursor:default;
}

.fixed-total {
  min-width:70px;
  text-align:center;
  color:#2f4f4f;
  font-size:clamp(21px,2vw,29px);
  line-height:1;
}

.multiplication-row {
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(7px,1vw,13px);
  flex-wrap:nowrap;
}

.mult-input {
  width:clamp(70px,8vw,108px);
  flex:0 0 auto;
}

.times-label {
  font-size:clamp(20px,2vw,29px);
  line-height:1;
  white-space:nowrap;
}

.equals {
  font-size:clamp(20px,2vw,29px);
  line-height:1;
}

.progress {
  display:none;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex:0 0 auto;
  margin-top:1px;
}

.progress-dot {
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ddd;
}

.progress-dot.active {
  background:#7153c1;
}

.progress-dot.done {
  background:#4ec263;
}

.navigation {
  flex:0 0 auto;
  width:100%;
  max-width:1250px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding-top:2px;
  min-height:52px;
}

/* =========================================================
   NEXT / PREVIOUS NAVIGATION — exact shared reference
   ========================================================= */
.navigation{
  flex:0 0 auto;
  width:100%;
  max-width:1250px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:4px 0 0;
}

.nav-button{
  min-width:150px;
  height:50px;
  padding:0 22px;
  border:2px solid #8d73d0;
  border-radius:15px;
  background:#fff;
  color:#60449e;
  font-size:clamp(16px,1.35vw,20px);
  font-weight:800;
  cursor:pointer;
  box-shadow:0 4px 0 #d8caef;
  transition:.12s;
  margin-top:-20px !important;
}

.nav-button.next{
  background:#7153c1;
  color:#fff;
  border-color:#7153c1;
  box-shadow:0 4px 0 #4e3994;
}

.nav-button:not(:disabled):hover{
  transform:translateY(-2px);
}

.nav-button:not(:disabled):active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #d8caef;
}

.nav-button.next:not(:disabled):active{
  box-shadow:0 1px 0 #4e3994;
}

.nav-button:disabled{
  opacity:.38;
  cursor:not-allowed;
}

.confetti-piece{
  position:fixed;
  top:-24px;
  z-index:600;
  border-radius:3px;
  pointer-events:none;
  animation:confettiFall 1.6s ease-in forwards;
}

@keyframes confettiFall{
  to{
    transform:translateY(112vh) rotate(760deg);
    opacity:.25;
  }
}

@keyframes inputShake {
  0%,100% { transform:translateX(0); }
  20% { transform:translateX(-6px); }
  40% { transform:translateX(6px); }
  60% { transform:translateX(-4px); }
  80% { transform:translateX(4px); }
}

/* Exact shared Feedback / Final Popup reference */
.feedback{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    /* background:rgba(38,31,76,.35); */
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:.2s;
}
.feedback.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}
.feedback-card{
    position:relative;
    width:min(430px,90vw);
    padding:34px 26px 28px;
    text-align:center;
    border-radius:28px;
    background:linear-gradient(180deg,#ffffff 0%,#fffdf6 100%);
    border:5px solid #8d73d0;
    box-shadow:0 20px 50px rgba(43,31,90,.32),inset 0 0 0 3px rgba(255,255,255,.6);
    overflow:hidden;
}
.feedback-card::before{
    content:"";
    position:absolute;
    top:-60%;
    left:-20%;
    width:140%;
    height:140%;
    background:radial-gradient(circle,rgba(255,255,255,.55) 0%,transparent 60%);
    pointer-events:none;
}
.feedback-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:96px;
    height:96px;
    border-radius:50%;
    margin:0 auto 6px;
    background:radial-gradient(circle at 35% 30%,#ffffff,#f1eaff);
    box-shadow:0 8px 18px rgba(70,50,120,.22),inset 0 0 0 4px rgba(255,255,255,.8);
}
.feedback-emoji{
    font-size:58px;
    line-height:1;
}
.feedback-title{
    margin:8px 0 6px;
    color:#3f3278;
    font-size:32px;
    line-height:1.1;
    font-weight:900;
    letter-spacing:.3px;
}
.feedback-text{
    color:#59627a;
    font-size:18px;
    line-height:1.4;
    font-weight:600;
}
.feedback.simple-correct .feedback-card{
    border-color:#4ec263;
    box-shadow:0 20px 50px rgba(30,120,60,.32),inset 0 0 0 3px rgba(255,255,255,.6);
}
.feedback.simple-correct .feedback-badge{
    background:radial-gradient(circle at 35% 30%,#ffffff,#e4faea);
    box-shadow:0 8px 18px rgba(35,140,70,.3),inset 0 0 0 4px rgba(255,255,255,.85);
}
.feedback.simple-correct .feedback-title{color:#2a9648;}
.feedback.simple-wrong .feedback-card{
    border-color:#ed737c;
    box-shadow:0 20px 50px rgba(150,40,50,.28),inset 0 0 0 3px rgba(255,255,255,.6);
}
.feedback.simple-wrong .feedback-badge{
    background:radial-gradient(circle at 35% 30%,#ffffff,#ffe7e8);
    box-shadow:0 8px 18px rgba(200,60,70,.28),inset 0 0 0 4px rgba(255,255,255,.85);
}
.feedback.simple-wrong .feedback-title{color:#d64d58;}
.feedback.simple-hint .feedback-card{
    border-color:#f0bd45;
    box-shadow:0 20px 50px rgba(150,110,10,.25),inset 0 0 0 3px rgba(255,255,255,.6);
}
.feedback.simple-hint .feedback-badge{
    background:radial-gradient(circle at 35% 30%,#ffffff,#fff3d9);
    box-shadow:0 8px 18px rgba(190,140,10,.28),inset 0 0 0 4px rgba(255,255,255,.85);
}
.feedback.simple-hint .feedback-title{color:#a36c00;}
.feedback.final-pop .feedback-card{
    width:min(540px,92vw);
    border-color:#efc34d;
    padding:40px 30px 32px;
    box-shadow:0 24px 60px rgba(150,110,10,.32),inset 0 0 0 3px rgba(255,255,255,.6);
}
.feedback.final-pop .feedback-badge{
    width:120px;
    height:120px;
    background:radial-gradient(circle at 35% 30%,#ffffff,#fff3d9);
    box-shadow:0 10px 22px rgba(190,140,10,.3),inset 0 0 0 5px rgba(255,255,255,.85);
}
.feedback.final-pop .feedback-emoji{font-size:72px;}
.feedback.final-pop .feedback-title{font-size:40px;font-weight:400;}
.feedback.final-pop .feedback-text{font-size:20px;}
.final-score{
    display:inline-block;
    margin-top:14px;
    padding:9px 26px;
    border-radius:20px;
    background:linear-gradient(145deg,#e9fbe4,#d3f4cb);
    color:#2a9648;
    font-size:26px;
    font-weight:400;
    box-shadow:0 4px 10px rgba(40,140,60,.25),inset 0 0 0 2px rgba(255,255,255,.7);
}
.play-again{
    margin-top:22px;
    min-width:180px;
    min-height:52px;
    padding:12px 24px;
    border:0;
    border-radius:16px;
    background:linear-gradient(145deg,#8567d6,#6a4fbf);
    color:#fff;
    font-size:19px;
    font-weight:800;
    box-shadow:0 5px 0 #4e3994;
    cursor:pointer;
    transition:.12s;
}
.play-again:hover{transform:translateY(-2px);}
.play-again:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #4e3994;
}
@keyframes correctPop{
    0%{transform:scale(.55) rotate(-4deg);opacity:0}
    60%{transform:scale(1.08) rotate(2deg);opacity:1}
    100%{transform:scale(1) rotate(0);opacity:1}
}
@keyframes wrongShake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px) rotate(-1.5deg)}
    40%{transform:translateX(9px) rotate(1.5deg)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
}
@keyframes badgePulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.08)}
}
.feedback.simple-correct .feedback-card,
.feedback.final-pop .feedback-card{animation:correctPop .35s ease;}
.feedback.simple-wrong .feedback-card{animation:wrongShake .38s ease;}
.feedback.show .feedback-badge{animation:badgePulse 1.1s ease-in-out infinite;}

/* =========================================================
   RESPONSIVE MEDIA QUERIES
   Order: Mobile -> Tablet -> Laptop -> Desktop
   ========================================================= */

  .feedback-text{font-size:22px;}
  .feedback.final-pop .feedback-card{width:min(640px,62vw);padding:50px 40px 40px;}
  .feedback.final-pop .feedback-badge{width:150px;height:150px;}
  .feedback.final-pop .feedback-emoji{font-size:88px;}
  .feedback.final-pop .feedback-title{font-size:48px;}
  .feedback.final-pop .feedback-text{font-size:24px;}
  .final-score{font-size:30px;padding:11px 32px;}
  .play-again{min-width:210px;min-height:58px;font-size:22px;}
}



</style>
</head>

<body>
<div class="game-page">

  <header class="header">
    <button class="icon-button" id="homeButton" type="button" aria-label="Home">
      <img src="../assets/images/home.png" alt="Home">
      <span class="icon-label"></span>
    </button>

    <p class="title">Write the addition and multiplication facts for the following.</p>

    <button class="icon-button" id="hintButton" type="button" aria-label="Hint">
      <img src="../assets/images/hint.png" alt="Hint">
      <span class="icon-label"></span>
    </button>
  </header>

  <main class="content">
    <section class="activity" id="activity"></section>

    <div class="progress" id="progress" aria-label="Question progress"></div>

    <nav class="navigation">
      <button class="nav-button" id="prevButton" type="button" disabled>← Previous</button>
      <button class="nav-button next" id="nextButton" type="button" disabled>Next →</button>
    </nav>
  </main>
</div>

<!-- Shared feedback markup; appearance comes from reuse.css -->
<div class="feedback" id="feedback" aria-hidden="true">
  <div class="feedback-card">
    <div class="feedback-badge">
      <div class="feedback-emoji" id="feedbackEmoji">😊</div>
    </div>
    <h2 class="feedback-title" id="feedbackTitle">Correct!</h2>
    <p class="feedback-text" id="feedbackText">Great job!</p>
  </div>
</div>

<!-- Shared final popup markup; appearance comes from reuse.css -->
<div class="feedback final-pop" id="finalFeedback" aria-hidden="true">
  <div class="feedback-card">
    <div class="feedback-badge">
      <div class="feedback-emoji">🎉</div>
    </div>
    <h2 class="feedback-title">Great Job!</h2>
    <p class="feedback-text" id="finalText">You completed all 3 questions.</p>
    <div class="final-score" id="finalScore">3 / 3</div>
    <br>
    <button class="play-again" id="playAgainButton" type="button">Play Again</button>
  </div>
</div>

<script>
/* =========================================================
   DATA — exactly from the three supplied images
   Q1: 4 groups of 3 plants = 12
   Q2: 3 groups of 6 penguins = 18
   Q3: 4 groups of 4 watermelons = 16
   ========================================================= */
const baseImages = {
  plant: "../assets/images/plant.png",
  penguin: "../assets/images/penguin.png",
  watermelon: "../assets/images/watermelon.png"
};

const data = [
  {
    type: "plant",
    groups: 4,
    each: 3,
    total: 12,
    hint: "Count how many equal groups of plants you see. Then count how many plants are in one group."
  },
  {
    type: "penguin",
    groups: 3,
    each: 6,
    total: 18,
    hint: "Count how many equal groups of penguins you see. Then count how many penguins are in one group."
  },
  {
    type: "watermelon",
    groups: 4,
    each: 4,
    total: 16,
    hint: "Count how many equal groups of watermelons you see. Then count how many are in one group."
  }
];

const activity = document.getElementById("activity");
const progress = document.getElementById("progress");
const prevButton = document.getElementById("prevButton");
const nextButton = document.getElementById("nextButton");

const fb = document.getElementById("feedback");
const fe = document.getElementById("feedbackEmoji");
const ft = document.getElementById("feedbackTitle");
const fx = document.getElementById("feedbackText");

const finalFb = document.getElementById("finalFeedback");
const finalScore = document.getElementById("finalScore");
const finalText = document.getElementById("finalText");
const again = document.getElementById("playAgainButton");

let current = 0;
let states = data.map(() => ({ values: [], complete: false }));
let timer;

function speak(text) {
  try {
    speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "en-US";
    msg.volume = 0.25;
    msg.rate = 1;
    msg.pitch = 1;
    speechSynthesis.speak(msg);
  } catch(e) {}
}

function hideFeedback() {
  clearTimeout(timer);
  fb.className = "feedback";
  fb.setAttribute("aria-hidden","true");
}

function correctPopup() {
  fb.className = "feedback show simple-correct";
  fe.textContent = "😊";
  ft.textContent = "Correct!";
  fx.textContent = "Great job!";
  fb.setAttribute("aria-hidden","false");

  if (typeof launchConfetti === "function") launchConfetti(45);

  timer = setTimeout(hideFeedback,900);
}

function wrongPopup() {
  fb.className = "feedback show simple-wrong";
  fe.textContent = "😕";
  ft.textContent = "Try Again!";
  fx.textContent = "Check this box and try again.";
  fb.setAttribute("aria-hidden","false");
  speak("Try again");

  timer = setTimeout(hideFeedback,800);
}

function launchConfetti(count) {
  const colors = ["#ff8cab","#8a78ed","#65cbd2","#ffd26e","#8fd9a8","#7153c1"];

  for(let i=0;i<count;i++) {
    const piece = document.createElement("span");
    piece.className = "confetti-piece";
    piece.style.position = "fixed";
    piece.style.top = "-24px";
    piece.style.left = `${Math.random()*100}vw`;
    piece.style.width = "10px";
    piece.style.height = "16px";
    piece.style.background = colors[i % colors.length];
    piece.style.zIndex = "600";
    piece.style.pointerEvents = "none";
    piece.style.borderRadius = "3px";
    piece.style.animation = "confettiFall 1.6s ease-in forwards";
    piece.style.animationDelay = `${Math.random()*.4}s`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(),2200);
  }
}

function hintPopup() {
  if (states[current].complete) return;

  const d = data[current];
  fb.className = "feedback show simple-hint";
  fe.textContent = "💡";
  ft.textContent = "Hint";
  fx.textContent = d.hint;
  fb.setAttribute("aria-hidden","false");
  timer = setTimeout(hideFeedback,2600);
}

function getInputs() {
  return [...activity.querySelectorAll(".answer-input")];
}

function focusNextInput(currentInput) {
  const inputs = getInputs();
  const index = inputs.indexOf(currentInput);
  const next = inputs[index + 1];
  if (next && !next.disabled) {
    setTimeout(() => {
      next.focus();
      next.select();
    }, 930);
  }
}

function validateInput(input, expected) {
  if (input.disabled) return;

  const value = input.value.trim();
  if (value === "") return;

  const number = Number(value);

  if (!/^\d+$/.test(value) || !Number.isInteger(number) || number !== expected) {
    input.classList.remove("wrong");
    void input.offsetWidth;
    input.classList.add("wrong");
    wrongPopup();

    setTimeout(() => {
      input.value = "";
      input.classList.remove("wrong");
      input.focus();
    }, 820);
    return;
  }

  input.classList.remove("wrong");
  input.classList.add("correct");
  input.disabled = true;
  states[current].values[input.dataset.index] = expected;

  correctPopup();
  speak("Correct!");
  checkComplete(input);
}

function checkComplete(lastInput) {
  const inputs = getInputs();

  if (inputs.every(input => input.disabled)) {
    states[current].complete = true;
    nextButton.disabled = current === data.length - 1;

    if (current === data.length - 1) {
      setTimeout(showFinalPopup, 950);
    }
    return;
  }

  focusNextInput(lastInput);
}

function showFinalPopup() {
  hideFeedback();
  finalScore.textContent = `${data.length} / ${data.length}`;
  finalText.textContent = "You completed all 3 questions.";
  finalFb.className = "feedback final-pop show";
  finalFb.setAttribute("aria-hidden","false");
  launchConfetti(120);
  
}

function makeInput(expected,index) {
  const input = document.createElement("input");
  input.type = "text";
  input.inputMode = "numeric";
  input.pattern = "[0-9]*";
  input.className = "answer-input";
  input.dataset.index = index;
  input.autocomplete = "off";
  input.maxLength = 2;
  input.setAttribute("aria-label","Answer");

  const saved = states[current].values[index];
  if(saved !== undefined && saved !== null) {
    input.value = saved;
    input.classList.add("correct");
    input.disabled = true;
  }

  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0,2);

    if (input.value.length >= String(expected).length) {
      validateInput(input, expected);
    }
  });

  input.addEventListener("keydown", event => {
    if(event.key === "Enter") {
      event.preventDefault();
      validateInput(input, expected);
    }
  });

  input.addEventListener("blur", () => {
    if (input.value.trim() !== "") validateInput(input, expected);
  });

  return input;
}

function addAdditionEquation(container,d) {
  const row = document.createElement("div");
  row.className = "addition-row";
  row.style.setProperty("--groups", d.groups);

  for(let i=0;i<d.groups;i++){
    const cell = document.createElement("div");
    cell.className = "add-cell";

    const input = makeInput(d.each,i);
    cell.appendChild(input);

    if(i < d.groups - 1){
      const plus = document.createElement("span");
      plus.className = "operator";
      plus.textContent = "+";
      cell.appendChild(plus);
    }

    row.appendChild(cell);
  }

  const totalCluster = document.createElement("div");
  totalCluster.className = "add-total";

  const equals = document.createElement("span");
  equals.className = "operator";
  equals.textContent = "=";
  totalCluster.appendChild(equals);

  const total = document.createElement("span");
  total.className = "fixed-total";
  total.textContent = d.total;
  totalCluster.appendChild(total);

  row.appendChild(totalCluster);
  container.appendChild(row);
}

function addMultiplicationEquation(container,d) {
  const row = document.createElement("div");
  row.className = "multiplication-row";

  const a = makeInput(d.groups,d.groups + 0);
  a.classList.add("mult-input");
  row.appendChild(a);

  const times1 = document.createElement("span");
  times1.className = "times-label";
  times1.textContent = "times";
  row.appendChild(times1);

  const b = makeInput(d.each,d.groups + 1);
  b.classList.add("mult-input");
  row.appendChild(b);

  const eq1 = document.createElement("span");
  eq1.className = "equals";
  eq1.textContent = "=";
  row.appendChild(eq1);

  const c = makeInput(d.groups,d.groups + 2);
  c.classList.add("mult-input");
  row.appendChild(c);

  const times2 = document.createElement("span");
  times2.className = "times-label";
  times2.textContent = "×";
  row.appendChild(times2);

  const e = makeInput(d.each,d.groups + 3);
  e.classList.add("mult-input");
  row.appendChild(e);

  const eq2 = document.createElement("span");
  eq2.className = "equals";
  eq2.textContent = "=";
  row.appendChild(eq2);

  const total = document.createElement("span");
  total.className = "fixed-total";
  total.textContent = d.total;
  row.appendChild(total);

  container.appendChild(row);
}

function render() {
  const d = data[current];

  activity.innerHTML = "";

  const heading = document.createElement("div");
  heading.className = "question-heading";
  heading.textContent = `Q${current + 1}.`;
  activity.appendChild(heading);

  const visualWrap = document.createElement("div");
  visualWrap.className = "visual-wrap";

  const visual = document.createElement("div");
  visual.className = "visual";
  visual.style.setProperty("--groups", d.groups);
  visual.style.setProperty("--per-group", d.each);

  for (let g = 0; g < d.groups; g++) {
    const group = document.createElement("div");
    group.className = "visual-group";

    for (let i = 0; i < d.each; i++) {
      const img = document.createElement("img");
      img.src = baseImages[d.type];
      img.alt = "";
      img.draggable = false;
      group.appendChild(img);
    }

    visual.appendChild(group);
  }

  visualWrap.appendChild(visual);
  activity.appendChild(visualWrap);

  const facts = document.createElement("div");
  facts.className = "facts";

  addAdditionEquation(facts,d);
  addMultiplicationEquation(facts,d);

  activity.appendChild(facts);

  nextButton.disabled = !states[current].complete || current === data.length - 1;
  prevButton.disabled = current === 0;

  progress.innerHTML = "";
  data.forEach((_,i) => {
    const dot = document.createElement("span");
    dot.className = "progress-dot";
    if(i === current) dot.classList.add("active");
    if(states[i].complete) dot.classList.add("done");
    progress.appendChild(dot);
  });

  setTimeout(() => {
    const first = getInputs().find(input => !input.disabled);
    if (first) {
      first.focus();
      first.select();
    }
  }, 100);
}

nextButton.addEventListener("click",() => {
  if(nextButton.disabled) return;
  current++;
  render();
});

prevButton.addEventListener("click",() => {
  if(prevButton.disabled) return;
  current--;
  render();
});


document.getElementById("hintButton").addEventListener("click",hintPopup);

document.getElementById("homeButton").addEventListener("click",() => {
  window.top.location.href = "../Grade2_chapter5.html";
});

again.addEventListener("click",() => {
  current = 0;
  states = data.map(() => ({ values: [], complete:false }));
  finalFb.className = "feedback final-pop";
  finalFb.setAttribute("aria-hidden","true");
  document.querySelectorAll(".confetti-piece").forEach(el => el.remove());
  render();
});

window.addEventListener("resize",() => render());

render();

</script>
</body>
</html>
