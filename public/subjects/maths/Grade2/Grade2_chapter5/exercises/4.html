<body>
<div class="game-page">

  <header class="header">
    <button class="icon-button" id="homeButton" type="button" aria-label="Home">
      <img src="../assets/images/home.png" alt="Home">
      <span class="icon-label"></span>
    </button>

    <p class="title">Write the number of rows and numbers of objects in each row to find the product.</p>

    <button class="icon-button" id="hintButton" type="button" aria-label="Hint">
      <img src="../assets/images/hint.png" alt="Hint">
      <span class="icon-label"></span>
    </button>
  </header>

  <main class="content">
    <section class="activity" id="activity"></section>

    <div class="progress" id="progress" aria-label="Question progress"></div>

    <!-- Shared navigation: styled by reuse.css -->
    <nav class="navigation">
      <button class="nav-button" id="prevButton" type="button" disabled>← Previous</button>
      <button class="nav-button next" id="nextButton" type="button" disabled>Next →</button>
    </nav>
  </main>
</div>

<!-- Shared feedback popup: styled by reuse.css -->
<div class="feedback" id="feedback" aria-hidden="true">
  <div class="feedback-card">
    <div class="feedback-badge">
      <div class="feedback-emoji" id="feedbackEmoji">😊</div>
    </div>
    <h2 class="feedback-title" id="feedbackTitle">Correct!</h2>
    <p class="feedback-text" id="feedbackText">Great job!</p>
  </div>
</div>

<!-- Shared final popup: styled by reuse.css -->
<div class="feedback final-pop" id="finalFeedback" aria-hidden="true">
  <div class="feedback-card">
    <div class="feedback-badge">
      <div class="feedback-emoji">🎉</div>
    </div>
    <h2 class="feedback-title">Great Job!</h2>
    <p class="feedback-text" id="finalText">You completed all 2 questions.</p>
    <div class="final-score" id="finalScore">2 / 2</div>
    <br>
    <button class="play-again" id="playAgainButton" type="button">Play Again</button>
  </div>
</div>

<script>
/* =========================================================
   DATA FROM THE SUPPLIED WORKSHEET IMAGE

   Q1: 3 rows, 5 cars in each row -> 3 × 5 = 15
   Q2: 5 rows, 4 oranges in each row -> 5 × 4 = 20
   ========================================================= */

const baseImages = {
  car: "../assets/images/car.png",
  orange: "../assets/images/cookie.png"
};

const data = [
  {
    type: "car",
    rows: 3,
    each: 5,
    total: 15,
    hint: "Count how many rows you see. Then count how many objects are in one row."
  },
  {
    type: "orange",
    rows: 5,
    each: 4,
    total: 20,
    hint: "Count how many rows you see. Then count how many objects are in one row."
  }
];

const activity = document.getElementById("activity");
const progress = document.getElementById("progress");
const prevButton = document.getElementById("prevButton");
const nextButton = document.getElementById("nextButton");

const fb = document.getElementById("feedback");
const fe = document.getElementById("feedbackEmoji");
const ft = document.getElementById("feedbackTitle");
const fx = document.getElementById("feedbackText");

const finalFb = document.getElementById("finalFeedback");
const finalScore = document.getElementById("finalScore");
const finalText = document.getElementById("finalText");
const again = document.getElementById("playAgainButton");

let current = 0;
let states = data.map(() => ({ values: [], complete: false }));
let timer;

function speak(text) {
  try {
    speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "en-US";
    msg.volume = 0.25;
    msg.rate = 1;
    msg.pitch = 1;
    speechSynthesis.speak(msg);
  } catch (e) {}
}

function hideFeedback() {
  clearTimeout(timer);
  fb.className = "feedback";
  fb.setAttribute("aria-hidden", "true");
}

function correctPopup() {
  fb.className = "feedback show simple-correct";
  fe.textContent = "😊";
  ft.textContent = "Correct!";
  fx.textContent = "Great job!";
  fb.setAttribute("aria-hidden", "false");

  if (typeof launchConfetti === "function") {
    launchConfetti(45);
  }

  timer = setTimeout(hideFeedback, 900);
}

function wrongPopup() {
  fb.className = "feedback show simple-wrong";
  fe.textContent = "😕";
  ft.textContent = "Try Again!";
  fx.textContent = "Check this box and try again.";
  fb.setAttribute("aria-hidden", "false");
  speak("wrong");

  timer = setTimeout(hideFeedback, 800);
}

function launchConfetti(count) {
  const colors = [
    "#ff8cab",
    "#8a78ed",
    "#65cbd2",
    "#ffd26e",
    "#8fd9a8",
    "#7153c1"
  ];

  for (let i = 0; i < count; i++) {
    const piece = document.createElement("span");
    piece.className = "confetti-piece";
    piece.style.position = "fixed";
    piece.style.top = "-24px";
    piece.style.left = `${Math.random() * 100}vw`;
    piece.style.width = "10px";
    piece.style.height = "16px";
    piece.style.background = colors[i % colors.length];
    piece.style.zIndex = "600";
    piece.style.pointerEvents = "none";
    piece.style.borderRadius = "3px";
    piece.style.animation = "confettiFall 1.6s ease-in forwards";
    piece.style.animationDelay = `${Math.random() * .4}s`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 2200);
  }
}

function hintPopup() {
  if (states[current].complete) return;

  const d = data[current];

  fb.className = "feedback show simple-hint";
  fe.textContent = "💡";
  ft.textContent = "Hint";
  fx.textContent = d.hint;
  fb.setAttribute("aria-hidden", "false");

  timer = setTimeout(hideFeedback, 2600);
}

function getInputs() {
  return [...activity.querySelectorAll(".answer-input")];
}

function focusNextInput(currentInput) {
  const inputs = getInputs();
  const index = inputs.indexOf(currentInput);

  for (let i = index + 1; i < inputs.length; i++) {
    if (!inputs[i].disabled) {
      setTimeout(() => {
        inputs[i].focus();
        inputs[i].select();
      }, 930);
      return;
    }
  }
}

function validateInput(input, expected) {
  if (input.disabled) return;

  const value = input.value.trim();
  if (value === "") return;

  const number = Number(value);

  if (
    !/^\d+$/.test(value) ||
    !Number.isInteger(number) ||
    number !== expected
  ) {
    input.classList.remove("wrong");
    void input.offsetWidth;
    input.classList.add("wrong");

    wrongPopup();

    setTimeout(() => {
      input.value = "";
      input.classList.remove("wrong");
      input.focus();
    }, 820);

    return;
  }

  input.classList.remove("wrong");
  input.classList.add("correct");
  input.disabled = true;

  states[current].values[input.dataset.index] = expected;

  correctPopup();
  speak("Correct!");

  checkComplete(input);
}

function checkComplete(lastInput) {
  const inputs = getInputs();

  if (inputs.every(input => input.disabled)) {
    states[current].complete = true;
    nextButton.disabled = current === data.length - 1;

    if (current === data.length - 1) {
      setTimeout(showFinalPopup, 950);
    }

    return;
  }

  focusNextInput(lastInput);
}

function showFinalPopup() {
  hideFeedback();

  finalScore.textContent = `${data.length} / ${data.length}`;
  finalText.textContent = "You completed all 2 questions.";

  finalFb.className = "feedback final-pop show";
  finalFb.setAttribute("aria-hidden", "false");

  launchConfetti(120);
}

function makeInput(expected, index) {
  const input = document.createElement("input");

  input.type = "text";
  input.inputMode = "numeric";
  input.pattern = "[0-9]*";
  input.className = "answer-input";
  input.dataset.index = index;
  input.autocomplete = "off";
  input.maxLength = 2;
  input.setAttribute("aria-label", "Answer");

  const saved = states[current].values[index];

  if (saved !== undefined && saved !== null) {
    input.value = saved;
    input.classList.add("correct");
    input.disabled = true;
  }

  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0, 2);

    if (input.value.length >= String(expected).length) {
      validateInput(input, expected);
    }
  });

  input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      validateInput(input, expected);
    }
  });

  input.addEventListener("blur", () => {
    if (input.value.trim() !== "") {
      validateInput(input, expected);
    }
  });

  return input;
}

function addAnswerLine(container, d) {
  const line = document.createElement("div");
  line.className = "rows-line";

  const rowsInput = makeInput(d.rows, 0);
  line.appendChild(rowsInput);

  const rowsText = document.createElement("span");
  rowsText.className = "fact-text";
  rowsText.textContent = "rows";
  line.appendChild(rowsText);

  const eachInput = makeInput(d.each, 1);
  line.appendChild(eachInput);

  const eachText = document.createElement("span");
  eachText.className = "fact-text";
  eachText.textContent = "in each row,";
  line.appendChild(eachText);

  container.appendChild(line);

  const second = document.createElement("div");
  second.className = "rows-line second-line";

  const a = makeInput(d.rows, 2);
  second.appendChild(a);

  const times = document.createElement("span");
  times.className = "fact-text";
  times.textContent = "×";
  second.appendChild(times);

  const b = makeInput(d.each, 3);
  second.appendChild(b);

  const equals = document.createElement("span");
  equals.className = "fact-text";
  equals.textContent = "=";
  second.appendChild(equals);

  const total = document.createElement("span");
  total.className = "fact-text";
  total.textContent = d.total;
  second.appendChild(total);

  container.appendChild(second);
}

function render() {
  const d = data[current];

  activity.innerHTML = "";

  const heading = document.createElement("div");
  heading.className = "question-heading";
  heading.textContent = `Q${current + 1}.`;
  activity.appendChild(heading);

  const visualWrap = document.createElement("div");
  visualWrap.className = "visual-wrap";

  const visual = document.createElement("div");
  visual.className = "visual";

  for (let r = 0; r < d.rows; r++) {
    const row = document.createElement("div");
    row.className = "object-row";

    for (let i = 0; i < d.each; i++) {
      const img = document.createElement("img");
      img.src = baseImages[d.type];
      img.alt = "";
      img.draggable = false;
      row.appendChild(img);
    }

    visual.appendChild(row);
  }

  visualWrap.appendChild(visual);
  activity.appendChild(visualWrap);

  const facts = document.createElement("div");
  facts.className = "facts";

  addAnswerLine(facts, d);
  activity.appendChild(facts);

  nextButton.disabled =
    !states[current].complete || current === data.length - 1;

  prevButton.disabled = current === 0;

  progress.innerHTML = "";

  data.forEach((_, i) => {
    const dot = document.createElement("span");
    dot.className = "progress-dot";

    if (i === current) dot.classList.add("active");
    if (states[i].complete) dot.classList.add("done");

    progress.appendChild(dot);
  });

  setTimeout(() => {
    const first = getInputs().find(input => !input.disabled);

    if (first) {
      first.focus();
      first.select();
    }
  }, 100);
}

nextButton.addEventListener("click", () => {
  if (nextButton.disabled) return;

  current++;
  render();
});

prevButton.addEventListener("click", () => {
  if (prevButton.disabled) return;

  current--;
  render();
});

document.getElementById("hintButton").addEventListener("click", hintPopup);

document.getElementById("homeButton").addEventListener("click", () => {
 window.top.location.href = "../Grade2_chapter5.html";
});

again.addEventListener("click", () => {
  current = 0;
  states = data.map(() => ({ values: [], complete: false }));

  finalFb.className = "feedback final-pop";
  finalFb.setAttribute("aria-hidden", "true");

  document.querySelectorAll(".confetti-piece").forEach(el => el.remove());

  render();
});

render();
</script>
</body>
