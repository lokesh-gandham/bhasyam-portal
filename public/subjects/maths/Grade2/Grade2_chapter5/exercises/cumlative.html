<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Complete using the Commutative Property</title>

    <style>
        /* =========================================================
   RESET
   ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Livvic", sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "livvic";
            color: #2f4f4f;
            background: #fff8e8;
            user-select: none;
        }

        button {
            font: inherit;
        }

        /* =========================================================
   HOME / HINT BUTTONS
   ========================================================= */
        .icon-button {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 2px solid #eadff7;
            background: #fffdf7;
            box-shadow: 0 4px 12px rgba(70, 50, 120, .15);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .icon-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(70, 50, 120, .20);
        }

        .icon-button img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
        }


        /* =========================================================
   PAGE LAYOUT
   ========================================================= */
        .game-page {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px 28px 14px;
        }

        .header {
            flex: 0 0 auto;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 100px 1fr 100px;
            align-items: start;
        }

        .title {
            text-align: center;
            color: #3f2a86;
            font-size: 30px;
            line-height: 1;
            align-self: center;
        }

        .content {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            max-width: 1250px;
            margin: 6px auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* =========================================================
   COMMUTATIVE PROPERTY ACTIVITY
   ========================================================= */
        .commutative-area {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            padding: 4px 20px 2px;
            overflow: hidden;
        }

        .question-row {
            flex: 0 0 auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-height: 56px;
        }

        .question-number {
            flex: 0 0 auto;
            color: #2f4f4f;
            font-size: 30px;
            line-height: 1;
        }

        .equation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #2f4f4f;
            font-size: 30px;
            line-height: 1;
            white-space: nowrap;
        }

        .factor,
        .operator,
        .equals {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .answer-slot {
            width: 78px;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #f0a52f;
            border-radius: 11px;
            background: #fffdf7;
            color: #2f4f4f;
            cursor: pointer;
            transition: transform .12s ease, background .12s ease, border-color .12s ease;
        }

        .answer-slot.active {
            border-color: #f0a52f;
            box-shadow: 0 0 0 3px rgba(240, 165, 47, .16);
            transform: translateY(-2px);
        }

        .answer-slot.filled {
            background: #eef9e9;
            border-color: #6db36b;
            color: #397a3d;
        }

        .answer-slot.correct {
            background: #e7f8e9;
            border-color: #42a85a;
            color: #277638;
        }

        .answer-slot.incorrect {
            background: #fff0f0;
            border-color: #ed737c;
        }

        .instruction {
            flex: 0 0 auto;
            color: #59627a;
            font-size: clamp(15px, 1.3vw, 20px);
            line-height: 1.25;
            min-height: 24px;
        }

        .instruction strong {
            color: #7153c1;
        }

        /* ---------------------------------------------------------
   VISUAL MODEL — array-grid based, always scales to fit,
   never overflows regardless of the numbers involved.
   --------------------------------------------------------- */
        .visual-model {
            width: 100%;
            max-width: 1050px;
            flex: 1 1 0;
            min-height: 60px;
            max-height: 220px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr);
            align-items: stretch;
            gap: 14px;
        }

        .model-side {
            min-width: 0;
            min-height: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .model-label {
            flex: 0 0 auto;
            padding: 4px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(14px, 1.2vw, 18px);
            line-height: 1.15;
            color: #198c4d;
            background: #effbf4;
            border: 2px solid #bfead1;
            white-space: nowrap;
        }

        .model-side.switch .model-label {
            color: #e96f13;
            background: #fff8ef;
            border-color: #ffd4ad;
        }

        .array-box {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            max-width: 340px;
            padding: 6px;
            border: 2px dashed #25ad68;
            border-radius: 13px;
            display: flex;
        }

        .switch .array-box {
            border-color: #ff8617;
        }

        .array-grid {
            display: grid;
            width: 100%;
            height: 100%;
            gap: 3px;
        }

        .array-dot {
            width: 100%;
            height: 100%;
            border-radius: 35%;
            background: #14964f;
        }

        .switch .array-dot {
            background: #ff7908;
        }

        .model-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #168fe0;
            font-size: 44px;
            line-height: 1;
        }

        .choice-area {
            width: 100%;
            max-width: 820px;
            flex: 0 0 auto;
        }

        .choice-title {
            color: #2f4f4f;
            font-size: clamp(17px, 1.6vw, 24px);
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .choices {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .choice {
            min-width: 0;
            height: 52px;
            border: 2px solid #16a7e8;
            border-radius: 14px;
            background: #fff;
            color: #243f75;
            font-size: clamp(18px, 1.6vw, 25px);
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 4px 0 #bde8fa;
            transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
        }

        .choice:hover {
            transform: translateY(-2px);
        }

        .choice:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #bde8fa;
        }

        .choice.selected {
            border-color: #f0a52f;
            box-shadow: 0 4px 0 #f8c45d;
            background: #fffaf0;
        }

        .choice:disabled {
            cursor: default;
        }

        .choice.used {
            opacity: .45;
        }

        .equation-result {
            width: 100%;
            max-width: 820px;
            flex: 0 0 auto;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2f4f4f;
            font-size: clamp(19px, 1.8vw, 27px);
            line-height: 1;
        }

        .equation-result .result-number {
            color: #2a9648;
        }

        /* =========================================================
   RESPONSIVE MEDIA QUERIES
   ========================================================= */

        /* ---------- Mobile ---------- */
        @media (max-width:600px) {
            .game-page {
                padding: 5px 9px 8px;
            }

            .header {
                grid-template-columns: 52px 1fr 52px;
            }

            .icon-button {
                width: 44px;
                height: 44px;
            }

            .icon-button img {
                width: 28px;
                height: 28px;
            }

            .title {
                font-size: 30px;
            }

            .content {
                margin-top: 4px;
            }

            .commutative-area {
                padding: 2px 3px 2px;
                gap: 6px;
            }

            .question-row {
                gap: 6px;
                min-height: 40px;
            }

            .question-number {
                font-size: 30px;
            }

            .equation {
                gap: 5px;
                font-size: 30px;
            }

            .answer-slot {
                width: 52px;
                height: 34px;
                border-radius: 9px;
            }

            .instruction {
                font-size: 12px;
                min-height: 16px;
            }

            .visual-model {
                max-height: 120px;
                min-height: 44px;
                gap: 6px;
                grid-template-columns: minmax(0, 1fr) 26px minmax(0, 1fr);
            }

            .model-side {
                gap: 3px;
            }

            .model-label {
                padding: 2px 7px;
                border-radius: 7px;
                font-size: 9.5px;
            }

            .array-box {
                padding: 3px;
                border-radius: 7px;
            }

            .array-grid {
                gap: 1.5px;
            }

            .model-arrow {
                font-size: 20px;
            }

            .choice-area {
                max-width: 420px;
            }

            .choice-title {
                font-size: 14px;
                margin-bottom: 6px;
            }

            .choices {
                gap: 6px;
            }

            .choice {
                height: 38px;
                border-radius: 11px;
                font-size: 14px;
            }

            .equation-result {
                min-height: 28px;
                font-size: 16px;
            }
        }

        /* ---------- Tablet ---------- */
        @media (min-width:601px) and (max-width:900px) {
            .game-page {
                padding: 7px 16px 10px;
            }

            .header {
                grid-template-columns: 64px 1fr 64px;
            }

            .icon-button {
                width: 56px;
                height: 56px;
            }

            .content {
                margin-top: 5px;
            }

            .title {
                font-size: 30px;
            }

            .commutative-area {
                padding: 3px 8px 2px;
                gap: 8px;
            }

            .question-row {
                gap: 9px;
                min-height: 50px;
            }

            .question-number {
                font-size: 30px;
            }

            .equation {
                gap: 7px;
                font-size: 30px;
            }

            .answer-slot {
                width: 64px;
                height: 40px;
                border-radius: 9px;
            }

            .instruction {
                font-size: 15px;
            }

            .visual-model {
                max-height: 160px;
                min-height: 56px;
                grid-template-columns: minmax(0, 1fr) 36px minmax(0, 1fr);
                gap: 9px;
            }

            .model-label {
                padding: 3px 10px;
                font-size: 12.5px;
            }

            .model-arrow {
                font-size: 30px;
            }

            .choice-area {
                max-width: 560px;
            }

            .choice-title {
                font-size: 18px;
                margin-bottom: 8px;
            }

            .choices {
                gap: 9px;
            }

            .choice {
                height: 44px;
                font-size: 18px;
            }

            .equation-result {
                min-height: 34px;
                font-size: 20px;
            }
        }

        /* ---------- Laptop ---------- */
        @media (min-width:901px) and (max-width:1440px) {
            .game-page {
                padding: 8px 24px 12px;
            }

            .title {
                font-size: 30px;
            }

            .header {
                grid-template-columns: 84px 1fr 84px;
            }

            .content {
                max-width: 1150px;
            }

            .commutative-area {
                padding: 4px 20px 2px;
                gap: 10px;
            }

            .question-row {
                gap: 12px;
                min-height: 58px;
            }

            .question-number {
                font-size: 30px;
            }

            .equation {
                gap: 10px;
                font-size: 30px;
            }

            .answer-slot {
                width: 76px;
                height: 46px;
            }

            .instruction {
                font-size: 18px;
            }

            .visual-model {
                max-height: 190px;
                min-height: 70px;
                grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr);
                gap: 12px;
            }

            .model-label {
                padding: 4px 14px;
                font-size: 16px;
            }

            .model-arrow {
                font-size: 38px;
            }

            .choice-area {
                max-width: 700px;
            }

            .choice-title {
                font-size: 22px;
                margin-bottom: 10px;
            }

            .choice {
                height: 50px;
                font-size: 22px;
            }

            .equation-result {
                min-height: 42px;
                font-size: 25px;
            }
        }

        /* ---------- Desktop ---------- */
        @media (min-width:1441px) {
            .game-page {
                padding: 16px 48px 22px;
            }

            .title {
                font-size: 40px;
            }

            .header {
                max-width: 2000px;
                grid-template-columns: 120px 1fr 120px;
            }

            .content {
                max-width: 1350px;
                margin-top: 10px;
            }

            .commutative-area {
                padding: 6px 40px 4px;
                gap: 14px;
            }

            .question-row {
                gap: 16px;
                min-height: 72px;
            }

            .question-number {
                font-size: 40px;
            }

            .equation {
                gap: 13px;
                font-size: 40px;
            }

            .answer-slot {
                width: 88px;
                height: 54px;
                border-radius: 11px;
            }

            .instruction {
                font-size: 21px;
            }

            .visual-model {
                max-height: 230px;
                min-height: 90px;
                grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr);
                gap: 16px;
            }

            .model-label {
                padding: 5px 18px;
                font-size: 19px;
            }

            .model-arrow {
                font-size: 48px;
            }

            .choice-area {
                max-width: 880px;
            }

            .choice-title {
                font-size: 26px;
                margin-bottom: 14px;
            }

            .choices {
                gap: 16px;
            }

            .choice {
                height: 58px;
                border-radius: 16px;
                font-size: 27px;
            }

            .equation-result {
                min-height: 50px;
                font-size: 30px;
            }
        }

        /* =========================================================
   SHARED NAVIGATION
   ========================================================= */
        .navigation {
            flex: 0 0 auto;
            width: 100%;
            max-width: 1250px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
            padding-bottom: 6px;
            overflow: visible;
        }

        .navigation .nav-button:first-child {
            justify-self: start;
        }

        .navigation .nav-button:last-child {
            justify-self: end;
        }

        .nav-button {
            min-width: 150px;
            height: 50px;
            padding: 0 22px;
            border: 2px solid #8d73d0;
            border-radius: 15px;
            background: #fff;
            color: #60449e;
            font-size: clamp(16px, 1.35vw, 20px);
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 0 #d8caef;
            transition: .12s;
        }

        .nav-button.next {
            background: #7153c1;
            color: #fff;
            border-color: #7153c1;
            box-shadow: 0 4px 0 #4e3994;
        }

        .nav-button:not(:disabled):hover {
            transform: translateY(-2px);
        }

        .nav-button:not(:disabled):active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #d8caef;
        }

        .nav-button.next:not(:disabled):active {
            box-shadow: 0 1px 0 #4e3994;
        }

        .nav-button:disabled {
            opacity: .38;
            cursor: not-allowed;
        }

        /* Simple dot progress, shown centered above the nav row (compact, never overlapping) */
        .progress {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding-bottom: 4px;
        }

        .progress-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #d8d8d8;
        }

        .progress-dot.active {
            background: #168fe0;
        }

        .progress-dot.done {
            background: #4ec263;
        }

        /* =========================================================
   SHARED FEEDBACK POPUPS
   ========================================================= */
        .feedback {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            /* background: rgba(38, 31, 76, .35); */
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: .2s;
        }

        .feedback.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .feedback-card {
            position: relative;
            width: min(430px, 90vw);
            padding: 34px 26px 28px;
            text-align: center;
            border-radius: 28px;
            background: linear-gradient(180deg, #ffffff 0%, #fffdf6 100%);
            border: 5px solid #8d73d0;
            box-shadow: 0 20px 50px rgba(43, 31, 90, .32), inset 0 0 0 3px rgba(255, 255, 255, .6);
            overflow: hidden;
        }

        .feedback-card::before {
            content: "";
            position: absolute;
            top: -60%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, rgba(255, 255, 255, .55) 0%, transparent 60%);
            pointer-events: none;
        }

        .feedback-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 6px;
            background: radial-gradient(circle at 35% 30%, #ffffff, #f1eaff);
            box-shadow: 0 8px 18px rgba(70, 50, 120, .22), inset 0 0 0 4px rgba(255, 255, 255, .8);
        }

        .feedback-emoji {
            font-size: 58px;
            line-height: 1;
        }

        .feedback-title {
            margin: 8px 0 6px;
            color: #3f3278;
            font-size: 32px;
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: .3px;
        }

        .feedback-text {
            color: #59627a;
            font-size: 18px;
            line-height: 1.4;
            font-weight: 600;
        }

        .feedback.simple-correct .feedback-card {
            border-color: #4ec263;
            box-shadow: 0 20px 50px rgba(30, 120, 60, .32), inset 0 0 0 3px rgba(255, 255, 255, .6);
        }

        .feedback.simple-correct .feedback-badge {
            background: radial-gradient(circle at 35% 30%, #ffffff, #e4faea);
            box-shadow: 0 8px 18px rgba(35, 140, 70, .3), inset 0 0 0 4px rgba(255, 255, 255, .85);
        }

        .feedback.simple-correct .feedback-title {
            color: #2a9648;
        }

        .feedback.simple-wrong .feedback-card {
            border-color: #ed737c;
            box-shadow: 0 20px 50px rgba(150, 40, 50, .28), inset 0 0 0 3px rgba(255, 255, 255, .6);
        }

        .feedback.simple-wrong .feedback-badge {
            background: radial-gradient(circle at 35% 30%, #ffffff, #ffe7e8);
            box-shadow: 0 8px 18px rgba(200, 60, 70, .28), inset 0 0 0 4px rgba(255, 255, 255, .85);
        }

        .feedback.simple-wrong .feedback-title {
            color: #d64d58;
        }

        .feedback.simple-hint .feedback-card {
            border-color: #f0bd45;
            box-shadow: 0 20px 50px rgba(150, 110, 10, .25), inset 0 0 0 3px rgba(255, 255, 255, .6);
        }

        .feedback.simple-hint .feedback-badge {
            background: radial-gradient(circle at 35% 30%, #ffffff, #fff3d9);
            box-shadow: 0 8px 18px rgba(190, 140, 10, .28), inset 0 0 0 4px rgba(255, 255, 255, .85);
        }

        .feedback.simple-hint .feedback-title {
            color: #a36c00;
        }

        /* Final popup */
        .feedback.final-pop .feedback-card {
            width: min(540px, 92vw);
            border-color: #efc34d;
            padding: 40px 30px 32px;
            box-shadow: 0 24px 60px rgba(150, 110, 10, .32), inset 0 0 0 3px rgba(255, 255, 255, .6);
        }

        .feedback.final-pop .feedback-badge {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 35% 30%, #ffffff, #fff3d9);
            box-shadow: 0 10px 22px rgba(190, 140, 10, .3), inset 0 0 0 5px rgba(255, 255, 255, .85);
        }

        .feedback.final-pop .feedback-emoji {
            font-size: 72px;
        }

        .feedback.final-pop .feedback-title {
            font-size: 40px;
            font-weight: 400;
        }

        .feedback.final-pop .feedback-text {
            font-size: 20px;
        }

        .final-score {
            display: inline-block;
            margin-top: 14px;
            padding: 9px 26px;
            border-radius: 20px;
            background: linear-gradient(145deg, #e9fbe4, #d3f4cb);
            color: #2a9648;
            font-size: 26px;
            font-weight: 400;
            box-shadow: 0 4px 10px rgba(40, 140, 60, .25), inset 0 0 0 2px rgba(255, 255, 255, .7);
        }

        .play-again {
            margin-top: 22px;
            min-width: 180px;
            min-height: 52px;
            padding: 12px 24px;
            border: 0;
            border-radius: 16px;
            background: linear-gradient(145deg, #8567d6, #6a4fbf);
            color: #fff;
            font-size: 19px;
            font-weight: 800;
            box-shadow: 0 5px 0 #4e3994;
            cursor: pointer;
            transition: .12s;
        }

        .play-again:hover {
            transform: translateY(-2px);
        }

        .play-again:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #4e3994;
        }

        /* Popup animations */
        @keyframes correctPop {
            0% {
                transform: scale(.55) rotate(-4deg);
                opacity: 0
            }

            60% {
                transform: scale(1.08) rotate(2deg);
                opacity: 1
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1
            }
        }

        @keyframes wrongShake {

            0%,
            100% {
                transform: translateX(0)
            }

            20% {
                transform: translateX(-9px) rotate(-1.5deg)
            }

            40% {
                transform: translateX(9px) rotate(1.5deg)
            }

            60% {
                transform: translateX(-6px)
            }

            80% {
                transform: translateX(6px)
            }
        }

        @keyframes badgePulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.08)
            }
        }

        .feedback.simple-correct .feedback-card,
        .feedback.final-pop .feedback-card {
            animation: correctPop .35s ease;
        }

        .feedback.simple-wrong .feedback-card {
            animation: wrongShake .38s ease;
        }

        .feedback.show .feedback-badge {
            animation: badgePulse 1.1s ease-in-out infinite;
        }

        /* =========================================================
   SHARED CONFETTI
   ========================================================= */
        .confetti-piece {
            position: fixed;
            top: -24px;
            z-index: 600;
            border-radius: 3px;
            pointer-events: none;
            animation: confettiFall 1.6s ease-in forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(112vh) rotate(760deg);
                opacity: .25;
            }
        }

        /* =========================================================
   SHARED NAVIGATION / POPUP RESPONSIVE SIZING
   ========================================================= */
        @media (max-width:600px) {
            .navigation {
                gap: 8px;
                padding: 3px 0 2px;
            }

            .nav-button {
                min-width: 100px;
                height: 38px;
                padding: 0 10px;
                font-size: 13px;
                border-radius: 11px;
            }

            .progress {
                gap: 6px;
                padding-bottom: 2px;
            }

            .progress-dot {
                width: 7px;
                height: 7px;
            }

            .feedback-card {
                width: 90vw;
                padding: 22px 16px;
            }

            .feedback-badge {
                width: 72px;
                height: 72px;
            }

            .feedback-emoji {
                font-size: 44px;
            }

            .feedback-title {
                font-size: 24px;
            }

            .feedback-text {
                font-size: 15px;
            }

            .feedback.final-pop .feedback-badge {
                width: 88px;
                height: 88px;
            }

            .feedback.final-pop .feedback-emoji {
                font-size: 54px;
            }

            .feedback.final-pop .feedback-title {
                font-size: 28px;
            }

            .feedback.final-pop .feedback-text {
                font-size: 16px;
            }
        }

        @media (min-width:601px) and (max-width:900px) {
            .nav-button {
                min-width: 120px;
                height: 42px;
                padding: 0 14px;
                font-size: 15px;
            }
        }

        @media (min-width:901px) and (max-width:1440px) {
            .navigation {
                max-width: 1150px;
                padding: 4px 0 2px;
                transform: translateY(-7px);
            }

            .nav-button {
                min-width: 145px;
                height: 46px;
                font-size: 18px;
            }
        }

        @media (min-width:1441px) {
            .navigation {
                max-width: 1350px;
                padding: 8px 0 2px;
            }

            .nav-button {
                min-width: 190px;
                height: 58px;
                padding: 0 28px;
                border-radius: 18px;
                font-size: 22px;
            }

            .feedback-card {
                width: min(520px, 60vw);
                padding: 42px 34px 34px;
                border-radius: 32px;
            }

            .feedback-badge {
                width: 120px;
                height: 120px;
            }

            .feedback-emoji {
                font-size: 72px;
            }

            .feedback-title {
                font-size: 38px;
            }

            .feedback-text {
                font-size: 22px;
            }

            .feedback.final-pop .feedback-card {
                width: min(640px, 62vw);
                padding: 50px 40px 40px;
            }

            .feedback.final-pop .feedback-badge {
                width: 150px;
                height: 150px;
            }

            .feedback.final-pop .feedback-emoji {
                font-size: 88px;
            }

            .feedback.final-pop .feedback-title {
                font-size: 48px;
            }

            .feedback.final-pop .feedback-text {
                font-size: 24px;
            }

            .final-score {
                font-size: 30px;
                padding: 11px 32px;
            }

            .play-again {
                min-width: 210px;
                min-height: 58px;
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="game-page">

        <header class="header">
            <button class="icon-button" id="homeButton" type="button" aria-label="Home">
                <img src="../assets/images/home.png" alt="Home">
                <span class="icon-label"></span>
            </button>

            <p class="title">Complete the following using the commutative property.</p>

            <button class="icon-button" id="hintButton" type="button" aria-label="Hint">
                <img src="../assets/images/hint.png" alt="Hint">
                <span class="icon-label"></span>
            </button>
        </header>

        <main class="content">

            <section class="commutative-area" aria-label="Commutative property activity">

                <div class="question-row">
                    <div class="question-number" id="questionNumber">Q1.</div>
                    <div class="equation" id="equation"></div>
                </div>

                <div class="visual-model" id="visualModel" aria-label="Multiplication groups"></div>

                <div class="instruction" id="instruction">
                    Choose the missing number.
                </div>

                <div class="choice-area">
                    <div class="choice-title" id="choiceTitle">Choose the answer</div>
                    <div class="choices" id="choices"></div>
                </div>

                <div class="equation-result" id="equationResult" aria-live="polite"></div>

            </section>

            <nav class="navigation">
                <button class="nav-button" id="prevButton" type="button" disabled>← Previous</button>
                <div class="progress" id="progress" aria-label="Question progress"></div>
                <button class="nav-button next" id="nextButton" type="button" disabled>Next →</button>
            </nav>

        </main>
    </div>

    <!-- SIMPLE FEEDBACK POPUP -->
    <div class="feedback" id="feedback" aria-hidden="true">
        <div class="feedback-card">
            <div class="feedback-badge">
                <div class="feedback-emoji" id="feedbackEmoji">😊</div>
            </div>
            <h2 class="feedback-title" id="feedbackTitle">Correct!</h2>
            <p class="feedback-text" id="feedbackText">Great job!</p>
        </div>
    </div>

    <!-- FINAL POPUP -->
    <div class="feedback final-pop" id="finalFeedback" aria-hidden="true">
        <div class="feedback-card">
            <div class="feedback-badge">
                <div class="feedback-emoji">🎉</div>
            </div>
            <h2 class="feedback-title">Great Job!</h2>
            <p class="feedback-text">You completed all 5 questions.</p>
            <div class="final-score" id="finalScore">5 / 5</div>
            <br>
            <button class="play-again" id="playAgainButton" type="button">Play Again</button>
        </div>
    </div>

    <script>
        /*
         * Each question stores the ORIGINAL factor pair (factor1, factor2) as
         * whole numbers, independent of which cells in the equation are blanked
         * out. The visual model is always built from these two numbers, so it
         * can never end up showing the wrong (product-sized) group count.
         */
        const data = [
            {
                factor1: 2,
                factor2: 7,
                equation: ["2", "×", "7", "=", null, "=", null, "×", "2"],
                answers: ["14", "7"],
                choices: [
                    ["14", "7", "21"],
                    ["7", "14", "9"]
                ],
                clue: "The commutative property lets you swap the factors. The product stays the same."
            },
            {
                factor1: 3,
                factor2: 6,
                equation: [null, "×", "6", "=", "18", "=", null, "×", "3"],
                answers: ["3", "6"],
                choices: [
                    ["2", "3", "4"],
                    ["5", "6", "7"]
                ],
                clue: "Look at the bead models. The same two factors appear in a different order."
            },
            {
                factor1: 5,
                factor2: 4,
                equation: ["5", "×", null, "=", null, "=", "4", "×", "5"],
                answers: ["4", "20"],
                choices: [
                    ["3", "4", "6"],
                    ["18", "20", "24"]
                ],
                clue: "When you switch the factors, the product in the middle does not change."
            },
            {
                factor1: 8,
                factor2: 10,
                equation: ["8", "×", null, "=", "80", "=", "10", "×", null],
                answers: ["10", "8"],
                choices: [
                    ["8", "9", "10"],
                    ["6", "8", "12"]
                ],
                clue: "Swap the order of the factors. The product stays the same."
            },
            {
                factor1: 2,
                factor2: 9,
                equation: [null, "×", "9", "=", null, "=", null, "×", "2"],
                answers: ["2", "18", "9"],
                choices: [
                    ["2", "3", "4"],
                    ["16", "18", "20"],
                    ["7", "9", "11"]
                ],
                clue: "Use both bead models. They show the same multiplication with factors switched."
            }
        ];

        const qn = document.getElementById("questionNumber");
        const equation = document.getElementById("equation");
        const visualModel = document.getElementById("visualModel");
        const instruction = document.getElementById("instruction");
        const choiceTitle = document.getElementById("choiceTitle");
        const choices = document.getElementById("choices");
        const equationResult = document.getElementById("equationResult");
        const progress = document.getElementById("progress");

        const prev = document.getElementById("prevButton");
        const next = document.getElementById("nextButton");

        const fb = document.getElementById("feedback");
        const fe = document.getElementById("feedbackEmoji");
        const ft = document.getElementById("feedbackTitle");
        const fx = document.getElementById("feedbackText");

        const finalFb = document.getElementById("finalFeedback");
        const finalScore = document.getElementById("finalScore");
        const again = document.getElementById("playAgainButton");

        let current = 0;
        let completed = Array(data.length).fill(false);
        let selectedAnswers = data.map(() => []);
        let activeBlank = 0;
        let timer;

        function speak(text) {
            if (!("speechSynthesis" in window)) return;

            speechSynthesis.cancel();

            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;

            speechSynthesis.speak(msg);
        }

        function hide() {
            clearTimeout(timer);
            fb.className = "feedback";
            fb.setAttribute("aria-hidden", "true");
        }

        function launchConfetti(count) {
            const colors = [
                "#ff8cab",
                "#8a78ed",
                "#65cbd2",
                "#ffd26e",
                "#8fd9a8",
                "#7153c1"
            ];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement("span");

                piece.className = "confetti-piece";
                piece.style.left = `${Math.random() * 100}vw`;
                piece.style.width = "10px";
                piece.style.height = "16px";
                piece.style.background = colors[i % colors.length];
                piece.style.animationDelay = `${Math.random() * .4}s`;
                piece.style.transform = `rotate(${Math.random() * 180}deg)`;

                document.body.appendChild(piece);

                setTimeout(() => piece.remove(), 2200);
            }
        }

        function correctPopup() {
            fb.className = "feedback show simple-correct";
            fe.textContent = "😊";
            ft.textContent = "Correct!";
            fx.textContent = "Great job!";
            fb.setAttribute("aria-hidden", "false");

            launchConfetti(45);

            timer = setTimeout(hide, 900);
        }

        function wrongPopup() {
            fb.className = "feedback show simple-wrong";
            fe.textContent = "😕";
            ft.textContent = "Try Again!";
            fx.textContent = "Choose the correct answer.";
            fb.setAttribute("aria-hidden", "false");

            timer = setTimeout(hide, 650);
        }

        function hintPopup() {
            if (completed[current]) return;

            clearTimeout(timer);

            fb.className = "feedback show simple-hint";
            fe.textContent = "💡";
            ft.textContent = "Hint";
            fx.textContent = data[current].clue;
            fb.setAttribute("aria-hidden", "false");

            timer = setTimeout(hide, 2600);
        }

        /*
         * Builds one side of the visual model as a CSS grid of "dot" cells,
         * sized entirely with fr units. Because every track is 1fr, the grid
         * always fills exactly the space of its container -- it can shrink to
         * fit any number of rows/columns without ever overflowing or requiring
         * a scrollbar, no matter how large the factors are (e.g. 8 x 10).
         */
        function buildArraySide(rows, cols, extraClass) {
            const side = document.createElement("div");
            side.className = "model-side" + (extraClass ? " " + extraClass : "");

            const label = document.createElement("div");
            label.className = "model-label";
            label.textContent = `${rows} group${rows === 1 ? "" : "s"} of ${cols}`;
            side.appendChild(label);

            const box = document.createElement("div");
            box.className = "array-box";

            const grid = document.createElement("div");
            grid.className = "array-grid";
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

            for (let i = 0; i < rows * cols; i++) {
                const dot = document.createElement("span");
                dot.className = "array-dot";
                grid.appendChild(dot);
            }

            box.appendChild(grid);
            side.appendChild(box);

            return side;
        }

        function createVisualModel() {
            const q = data[current];

            visualModel.innerHTML = "";

            const left = buildArraySide(q.factor1, q.factor2);

            const arrow = document.createElement("div");
            arrow.className = "model-arrow";
            arrow.innerHTML = "<span>→</span>";

            const right = buildArraySide(q.factor2, q.factor1, "switch");

            visualModel.appendChild(left);
            visualModel.appendChild(arrow);
            visualModel.appendChild(right);
        }

        function createProgress() {
            progress.innerHTML = "";

            data.forEach((_, index) => {
                const dot = document.createElement("span");
                dot.className = "progress-dot";

                if (index === current) {
                    dot.classList.add("active");
                }

                if (completed[index]) {
                    dot.classList.add("done");
                }

                progress.appendChild(dot);
            });
        }

        function createEquation() {
            const q = data[current];
            const values = selectedAnswers[current];

            equation.innerHTML = "";

            let blankIndex = 0;

            q.equation.forEach(value => {
                if (value !== null) {
                    const span = document.createElement("span");

                    span.className =
                        value === "×" ? "operator" :
                            value === "=" ? "equals" :
                                "factor";

                    span.textContent = value;
                    equation.appendChild(span);
                    return;
                }

                const slot = document.createElement("button");
                slot.type = "button";
                slot.className = "answer-slot";
                slot.dataset.blank = blankIndex;
                slot.setAttribute("aria-label", `Missing answer ${blankIndex + 1}`);

                if (values[blankIndex]) {
                    slot.textContent = values[blankIndex];
                    slot.classList.add("filled");
                }

                if (!completed[current] && blankIndex === activeBlank) {
                    slot.classList.add("active");
                }

                slot.addEventListener("click", () => {
                    if (completed[current]) return;

                    activeBlank = Number(slot.dataset.blank);
                    createEquation();
                    createChoices();
                });

                equation.appendChild(slot);
                blankIndex++;
            });
        }

        function createChoices() {
            const q = data[current];
            const available = q.choices[activeBlank];

            choices.innerHTML = "";

            if (completed[current]) {
                choiceTitle.textContent = "Completed";
                instruction.innerHTML = `Great! <strong>${q.answers.join(" and ")}</strong>`;
                return;
            }

            choiceTitle.textContent =
                q.answers.length > 1
                    ? `Choose the missing number ${activeBlank + 1}`
                    : "Choose the answer";

            available.forEach(value => {
                const button = document.createElement("button");

                button.type = "button";
                button.className = "choice";
                button.textContent = value;

                if (selectedAnswers[current][activeBlank] === value) {
                    button.classList.add("selected");
                }

                button.addEventListener("click", () => chooseAnswer(value));

                choices.appendChild(button);
            });

            instruction.innerHTML = "Choose the missing number.";
        }

        function chooseAnswer(value) {
            if (completed[current]) return;

            const q = data[current];
            const correctAnswer = q.answers[activeBlank];

            if (value !== correctAnswer) {
                wrongPopup();
                speak("wrong");
                return;
            }

            selectedAnswers[current][activeBlank] = value;

            if (activeBlank < q.answers.length - 1) {
                activeBlank++;
                createEquation();
                createChoices();
                correctPopup();
                speak("correct");
                return;
            }

            completed[current] = true;

            createEquation();
            createChoices();
            showCompletedEquation();
            createProgress();

            prev.disabled = current === 0;
            next.disabled = current === data.length - 1;

            correctPopup();
            speak("correct");

            if (current === data.length - 1) {
                setTimeout(() => {
                    hide();

                    finalScore.textContent = `${data.length} / ${data.length}`;
                    finalFb.querySelector(".feedback-text").textContent =
                        `You completed all ${data.length} questions.`;
                    finalFb.className = "feedback final-pop show";
                    finalFb.setAttribute("aria-hidden", "false");

                    launchConfetti(120);
                }, 900);
            }
        }

        function showCompletedEquation() {
            const q = data[current];

            equationResult.innerHTML = "";

            const pieces = [];
            let answerIndex = 0;

            q.equation.forEach(value => {
                if (value === null) {
                    pieces.push(selectedAnswers[current][answerIndex]);
                    answerIndex++;
                } else {
                    pieces.push(value);
                }
            });

            const product = String(q.factor1 * q.factor2);

            pieces.forEach((piece, index) => {
                const span = document.createElement("span");

                if (piece === product) {
                    span.className = "result-number";
                }

                span.textContent = piece;
                equationResult.appendChild(span);

                if (index < pieces.length - 1) {
                    const separator = document.createElement("span");
                    separator.textContent = " ";
                    equationResult.appendChild(separator);
                }
            });

            instruction.innerHTML = `Great! <strong>${pieces.join(" ")}</strong>`;
        }

        function render() {
            activeBlank = 0;

            if (!selectedAnswers[current]) {
                selectedAnswers[current] = [];
            }

            qn.textContent = `Q${current + 1}.`;

            createEquation();
            createVisualModel();
            createChoices();
            createProgress();

            if (completed[current]) {
                showCompletedEquation();
            } else {
                equationResult.innerHTML = "";
            }

            prev.disabled = current === 0;
            next.disabled = !completed[current] || current === data.length - 1;
        }

        next.addEventListener("click", () => {
            if (next.disabled) return;

            current++;
            render();
        });

        prev.addEventListener("click", () => {
            if (prev.disabled) return;

            current--;
            render();
        });

        document.getElementById("hintButton")
            .addEventListener("click", hintPopup);

        document.getElementById("homeButton")
            .addEventListener("click", () => {
                window.top.location.href = "../Grade2_chapter5.html";
            });

        again.addEventListener("click", () => {
            current = 0;
            completed = Array(data.length).fill(false);
            selectedAnswers = data.map(() => []);
            activeBlank = 0;

            finalFb.className = "feedback final-pop";
            finalFb.setAttribute("aria-hidden", "true");

            render();
        });

        window.addEventListener("resize", () => {
            createVisualModel();
        });

        render();
    </script>
</body>

</html>
