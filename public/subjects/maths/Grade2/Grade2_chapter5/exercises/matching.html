<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Match the Following - Kids Game</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Livvic", sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Livvic", sans-serif;
    }

    body {
     font-family: "Livvic", sans-serif;
      background: #f4f0e7;
      color: #27313a;
      overflow: hidden;
    }

    button {
      font: inherit
    }

    .game {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
    }

    .header {
      position: absolute;
      z-index: 50;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(58vw, 900px);
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title {
      color: #3f2a86;
      font-size: 30px;
      letter-spacing: .5px;
      font-weight: 400;
    }

    .title span {
      color: #263b4a
    }

    .top-btn {
      position: absolute;
      z-index: 100;
      top: 18px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid #9c927f;
      background: #faf8f2;
      color: #33414b;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #d2c9ba;
      transition: .15s;
      font-size: 27px;
    }

    .top-btn:hover {
      transform: translateY(-2px)
    }

    .top-btn:active {
      transform: translateY(2px)
    }

    .home-btn {
      left: 22px
    }

    .sound-btn {
      right: 22px
    }

    /* Reference Home button */
    .icon-button {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid #eadff7;
      background: #fffdf7;
      box-shadow: 0 4px 12px rgba(70, 50, 120, .15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .icon-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(70, 50, 120, .20);
    }

    .icon-button img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      display: block;
    }


    .board {
      position: absolute;
      z-index: 20;
      left: 50%;
      top: 98px;
      transform: translateX(-50%);
      width: min(90vw, 1220px);
      height: calc(100vh - 112px);
      min-height: 0;
      overflow: visible;
    }

    .columns {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      column-gap: clamp(80px, 9vw, 130px);
    }

    .left-col,
    .right-col {
      min-width: 0;
      display: grid;
      grid-template-rows: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 0;
      border-radius: 17px;
      border: 2px solid #c8c0b3;
      display: flex;
      align-items: center;
      overflow: visible;
      box-shadow: 0 3px 0 #d5cec2;
      transition: transform .16s, box-shadow .16s, background .16s;
      cursor: pointer;
    }

    .left-card:nth-child(1),
    .left-card:nth-child(2),
    .left-card:nth-child(3),
    .left-card:nth-child(4),
    .left-card:nth-child(5),
    .left-card:nth-child(6) {
      background: #e9edf0;
    }

    .right-card:nth-child(1),
    .right-card:nth-child(2),
    .right-card:nth-child(3),
    .right-card:nth-child(4),
    .right-card:nth-child(5),
    .right-card:nth-child(6) {
      background: #eeeae2;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 0 #d0c8bb
    }

    .number {
      flex: 0 0 clamp(42px, 4.2vw, 62px);
      width: clamp(42px, 4.2vw, 62px);
      height: clamp(42px, 4.2vw, 62px);
      margin-left: clamp(10px, 1.3vw, 20px);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: #526878;
      border: 2px solid #fff;
      box-shadow: 0 3px 0 #9ba5ab;
      font-size: clamp(20px, 2.4vw, 32px);
      font-weight: 500;
    }

    .left-label,
    .right-text {
      min-width: 0;
      color: #2f4f4f;
      line-height: 1.15;
      font-size: clamp(20px, 2.2vw, 28px);
    }

    .left-label {
      flex: 1;
      margin-left: clamp(12px, 1.7vw, 24px);
      text-align: left;
      padding-right: 12px;
    }

    .right-text {
      width: 100%;
      padding: 0 clamp(18px, 2vw, 34px);
      text-align: center;
    }

    .endpoint {
      position: absolute;
      top: 50%;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      transform: translateY(-50%);
      background: #f9f7f1;
      border: 3px solid #647887;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .9), 0 2px 5px rgba(0, 0, 0, .15);
      z-index: 30;
    }

    .left-card .endpoint {
      right: -13px
    }

    .right-card .endpoint {
      left: -13px
    }

    .left-card.selected {
      background: #dde5e9;
      border-color: #526878;
      transform: scale(1.015);
      box-shadow: 0 5px 0 #bcc4c8;
    }

    .left-card.matched,
    .right-card.matched {
      background: #dfe8e2;
      border-color: #718879;
      cursor: default;
    }

    .left-card.matched .number {
      background: #718879;
      box-shadow: 0 3px 0 #a8b5ab;
    }

    .left-card.wrong,
    .right-card.wrong {
      animation: wrongCard .42s ease;
    }

    @keyframes wrongCard {

      20%,
      60% {
        transform: translateX(-7px)
      }

      40%,
      80% {
        transform: translateX(7px)
      }
    }

    .lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      overflow: visible;
    }

    .line {
      fill: none;
      stroke: #f8f6f0;
      stroke-width: 9;
      stroke-linecap: round;
    }

    .lineColor {
      stroke: #657987;
      stroke-width: 4;
      stroke-linecap: round;
      animation: lineIn .35s ease;
    }

    @keyframes lineIn {
      from {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000
      }

      to {
        stroke-dashoffset: 0
      }
    }

    .confetti {
      position: fixed;
      inset: 0;
      z-index: 4000;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -25px;
      width: 9px;
      height: 15px;
      border-radius: 2px;
      animation: confettiFall var(--t) linear var(--d) forwards;
    }

    @keyframes confettiFall {
      to {
        transform: translate(var(--x), 110vh) rotate(var(--r));
        opacity: 0;
      }
    }

    .match-confetti {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 1px;
      height: 1px;
      z-index: 4500;
      pointer-events: none;
      overflow: visible;
    }

    .match-confetti-piece {
      position: absolute;
      left: 0;
      top: 0;
      width: 11px;
      height: 17px;
      border-radius: 2px;
      opacity: 1;
      transform: translate(-50%, -50%);
      animation: centerConfetti 1.1s cubic-bezier(.15, .75, .25, 1) forwards;
    }

    @keyframes centerConfetti {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0)
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--cx)), calc(-50% + var(--cy))) rotate(var(--cr));
      }
    }

    .good {
      animation: goodFlash .55s ease
    }

    @keyframes goodFlash {
      50% {
        filter: brightness(1.08)
      }
    }

    @media (min-width:1440px) {
      .header {
        height: 76px;
        top: 14px
      }

      .top-btn {
        width: 62px;
        height: 62px;
        top: 18px
      }

      .icon-button {
        width: 62px;
        height: 62px
      }

      .icon-button img {
        width: 44px;
        height: 44px
      }

      .board {
        top: 104px;
        height: calc(100vh - 118px);
        width: min(88vw, 1220px)
      }

      .columns {
        column-gap: clamp(80px, 8vw, 130px)
      }

      .left-col,
      .right-col {
        gap: 12px
      }

      .card {
        border-radius: 19px
      }

      .title {
        font-size: 40px
      }
    }

    @media (min-width:900px) and (max-width:1439px) {
      .header {
        width: min(60vw, 820px);
        height: 68px
      }

      .title {
        font-size: 30px
      }

      .board {
        top: 94px;
        height: calc(100vh - 105px);
        width: min(92vw, 1120px)
      }

      .columns {
        column-gap: clamp(70px, 8vw, 120px)
      }

      .left-col,
      .right-col {
        gap: 9px
      }

      .number {
        margin-left: 12px;
        font-size: clamp(22px, 2.3vw, 30px);
      }

      .left-label,
      .right-text {
        font-size: clamp(22px, 2.2vw, 26px);
      }

      .left-label {
        margin-left: 15px
      }
    }

    @media (min-width:600px) and (max-width:899px) {
      .header {
        top: 10px;
        width: 60vw;
        min-width: 340px;
        height: 58px
      }

      .title {
        font-size: 30px
      }

      .top-btn {
        top: 10px;
        width: 48px;
        height: 48px;
        font-size: 22px
      }

      .icon-button {
        width: 56px;
        height: 56px
      }

      .icon-button img {
        width: 40px;
        height: 40px
      }

      .home-btn {
        left: 10px
      }

      .sound-btn {
        right: 10px
      }

      .board {
        top: 76px;
        width: 95vw;
        height: calc(100vh - 84px)
      }

      .columns {
        column-gap: clamp(55px, 8vw, 90px)
      }

      .left-col,
      .right-col {
        gap: 7px
      }

      .card {
        border-radius: 13px
      }

      .number {
        flex-basis: clamp(38px, 5vw, 48px);
        width: clamp(38px, 5vw, 48px);
        height: clamp(38px, 5vw, 48px);
        margin-left: 7px;
        font-size: clamp(18px, 2.4vw, 24px);
      }

      .left-label {
        margin-left: 8px;
        font-size: clamp(18px, 2.3vw, 22px);
        padding-right: 7px
      }

      .right-text {
        font-size: clamp(18px, 2.3vw, 22px);
        padding: 0 8px
      }

      .endpoint {
        width: 17px;
        height: 17px;
        border-width: 2px
      }

      .left-card .endpoint {
        right: -10px
      }

      .right-card .endpoint {
        left: -10px
      }
    }

    @media (max-width:599px) {
      .header {
        top: 7px;
        width: 62vw;
        min-width: 220px;
        height: 45px;
        border-radius: 12px
      }

      .title {
        font-size: 17px;
        letter-spacing: 0
      }

      .top-btn {
        top: 7px;
        width: 37px;
        height: 37px;
        font-size: 17px;
        border-width: 1.5px
      }

      .icon-button {
        width: 44px;
        height: 44px;
        border-width: 2px
      }

      .icon-button img {
        width: 28px;
        height: 28px
      }

      .home-btn {
        left: 6px
      }

      .sound-btn {
        right: 6px
      }

      .board {
        top: 60px;
        width: 96vw;
        height: calc(100vh - 66px)
      }

      .columns {
        column-gap: clamp(30px, 7vw, 55px)
      }

      .left-col,
      .right-col {
        gap: 5px
      }

      .card {
        border-radius: 10px;
        border-width: 1.5px
      }

      .number {
        flex-basis: 28px;
        width: 28px;
        height: 28px;
        margin-left: 4px;
        font-size: 14px;
        border-width: 1.5px
      }

      .left-label {
        margin-left: 5px;
        padding-right: 4px;
        font-size: clamp(13px, 3.2vw, 16px)
      }

      .right-text {
        font-size: clamp(13px, 3.2vw, 16px);
        padding: 0 4px
      }

      .endpoint {
        width: 13px;
        height: 13px;
        border-width: 1.5px
      }

      .left-card .endpoint {
        right: -8px
      }

      .right-card .endpoint {
        left: -8px
      }
    }

    @media (max-height:700px) and (min-width:600px) {
      .header {
        top: 7px;
        height: 52px
      }

      .board {
        top: 67px;
        height: calc(100dvh - 73px)
      }

      .left-col,
      .right-col {
        gap: 5px
      }

      .number {
        width: clamp(36px, 4.5vw, 44px);
        height: clamp(36px, 4.5vw, 44px);
        flex-basis: clamp(36px, 4.5vw, 44px);
        font-size: clamp(18px, 2.2vw, 22px);
      }

      .left-label,
      .right-text {
        font-size: clamp(18px, 2.1vw, 22px);
      }
    }

    /* =========================================================
   FINAL COMPLETION POPUP — reference look
   ========================================================= */
    .feedback {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      /* background: rgba(38, 31, 76, .35); */
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: .2s;
    }

    .feedback.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .feedback-card {
      position: relative;
      width: min(430px, 90vw);
      padding: 34px 26px 28px;
      text-align: center;
      border-radius: 28px;
      background: linear-gradient(180deg, #ffffff 0%, #fffdf6 100%);
      border: 5px solid #8d73d0;
      box-shadow: 0 20px 50px rgba(43, 31, 90, .32), inset 0 0 0 3px rgba(255, 255, 255, .6);
      overflow: hidden;
    }

    .feedback-card::before {
      content: "";
      position: absolute;
      top: -60%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: radial-gradient(circle, rgba(255, 255, 255, .55) 0%, transparent 60%);
      pointer-events: none;
    }

    .feedback-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 6px;
      background: radial-gradient(circle at 35% 30%, #ffffff, #fff3d9);
      box-shadow: 0 10px 22px rgba(190, 140, 10, .3), inset 0 0 0 5px rgba(255, 255, 255, .85);
    }

    .feedback-emoji {
      font-size: 72px;
      line-height: 1
    }

    .feedback-title {
      margin: 8px 0 6px;
      color: #3f3278;
      font-size: 40px;
      line-height: 1.1;
      font-weight: 900;
    }

    .feedback-text {
      color: #59627a;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 600;
    }

    .feedback.final-pop .feedback-card {
      width: min(540px, 92vw);
      border-color: #efc34d;
      padding: 40px 30px 32px;
      box-shadow: 0 24px 60px rgba(150, 110, 10, .32), inset 0 0 0 3px rgba(255, 255, 255, .6);
    }

    .feedback.final-pop .feedback-title {
      font-weight: 400;
    }

    .final-score {
      display: inline-block;
      margin-top: 14px;
      padding: 9px 26px;
      border-radius: 20px;
      background: linear-gradient(145deg, #e9fbe4, #d3f4cb);
      color: #2a9648;
      font-size: 26px;
      font-weight: 400;
      box-shadow: 0 4px 10px rgba(40, 140, 60, .25), inset 0 0 0 2px rgba(255, 255, 255, .7);
    }

    .play-again {
      margin-top: 22px;
      min-width: 180px;
      min-height: 52px;
      padding: 12px 24px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(145deg, #8567d6, #6a4fbf);
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      box-shadow: 0 5px 0 #4e3994;
      cursor: pointer;
      transition: .12s;
    }

    .play-again:hover {
      transform: translateY(-2px)
    }

    .play-again:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #4e3994
    }

    .feedback.final-pop .feedback-card {
      animation: correctPop .35s ease;
    }

    @keyframes correctPop {
      0% {
        transform: scale(.55) rotate(-4deg);
        opacity: 0
      }

      60% {
        transform: scale(1.08) rotate(2deg);
        opacity: 1
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1
      }
    }

    .feedback.show .feedback-badge {
      animation: badgePulse 1.1s ease-in-out infinite;
    }

    @keyframes badgePulse {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.08)
      }
    }

    /* Reference confetti */
    .confetti-piece {
      position: fixed;
      top: -24px;
      z-index: 600;
      border-radius: 3px;
      pointer-events: none;
      animation: confettiFall 1.6s ease-in forwards;
    }

    @keyframes confettiFall {
      to {
        transform: translateY(112vh) rotate(760deg);
        opacity: .25;
      }
    }


    @media (max-width:599px) {
      .feedback-card {
        width: 90vw;
        padding: 22px 16px
      }

      .feedback-badge {
        width: 72px;
        height: 72px
      }

      .feedback-emoji {
        font-size: 44px
      }

      .feedback-title {
        font-size: 24px
      }

      .feedback-text {
        font-size: 15px
      }

      .feedback.final-pop .feedback-badge {
        width: 88px;
        height: 88px
      }

      .feedback.final-pop .feedback-emoji {
        font-size: 54px
      }

      .feedback.final-pop .feedback-title {
        font-size: 28px
      }

      .feedback.final-pop .feedback-text {
        font-size: 16px
      }
    }

    @media (min-width:1440px) {

      .left-label,
      .right-text {
        font-size: clamp(26px, 2vw, 30px)
      }

      .number {
        font-size: clamp(26px, 2.2vw, 34px);
      }

      .feedback-card {
        width: min(520px, 60vw);
        padding: 42px 34px 34px;
        border-radius: 32px
      }

      .feedback-badge {
        width: 120px;
        height: 120px
      }

      .feedback-emoji {
        font-size: 72px
      }

      .feedback-title {
        font-size: 38px
      }

      .feedback-text {
        font-size: 22px
      }

      .feedback.final-pop .feedback-card {
        width: min(640px, 62vw);
        padding: 50px 40px 40px
      }

      .feedback.final-pop .feedback-badge {
        width: 150px;
        height: 150px
      }

      .feedback.final-pop .feedback-emoji {
        font-size: 88px
      }

      .feedback.final-pop .feedback-title {
        font-size: 48px
      }

      .feedback.final-pop .feedback-text {
        font-size: 24px
      }

      .final-score {
        font-size: 30px;
        padding: 11px 32px
      }

      .play-again {
        min-width: 210px;
        min-height: 58px;
        font-size: 22px
      }
    }
  </style>


<body>
  <div class="game" id="game">
    <div class="header">
      <div class="title"><span>MATCH</span> THE FOLLOWING</div>
    </div>

    <button class="icon-button home-btn" id="homeBtn" type="button" aria-label="Home">
      <img src="../assets/images/home.png" alt="Home">
    </button>
    <button class="top-btn sound-btn" id="soundBtn" aria-label="Sound">🔊</button>

    <main class="board" id="board">
      <svg class="lines" id="lines" aria-hidden="true"></svg>
      <div class="columns">
        <section class="left-col" id="leftCol"></section>
        <section class="right-col" id="rightCol"></section>
      </div>
    </main>

    <div class="confetti" id="confetti"></div>
  </div>



  <!-- FINAL COMPLETION POPUP -->
  <div class="feedback final-pop" id="finalFeedback" aria-hidden="true">
    <div class="feedback-card">
      <div class="feedback-badge">
        <div class="feedback-emoji">🎉</div>
      </div>
      <h2 class="feedback-title">Great Job!</h2>
      <p class="feedback-text">You matched all 6 pairs correctly.</p>
      <div class="final-score" id="finalScore">6 / 6</div>
      <br>
      <button class="play-again" id="playAgainButton" type="button">Play Again</button>
    </div>
  </div>

  <script>
    /* Exact worksheet content from the supplied image */
    const PAIRS = [
      { id: 1, left: "88", right: "11 × 8" },
      { id: 2, left: "7 × 8", right: "56" },
      { id: 3, left: "49", right: "7 × 7" },
      { id: 4, left: "6 × 9", right: "54" },
      { id: 5, left: "12 × 7", right: "84" },
      { id: 6, left: "42", right: "6 × 7" }
    ];

    /* Right-column order exactly as shown in the worksheet image */
    const RIGHT_ORDER = [6, 5, 1, 3, 4, 2];

    const leftCol = document.getElementById("leftCol");
    const rightCol = document.getElementById("rightCol");
    const board = document.getElementById("board");
    const lines = document.getElementById("lines");
    const soundBtn = document.getElementById("soundBtn");
    const finalFb = document.getElementById("finalFeedback");
    const finalScore = document.getElementById("finalScore");
    const again = document.getElementById("playAgainButton");

    let selectedLeft = null;
    let matched = new Map();
    let soundEnabled = true;
    let audioCtx = null;

    function render() {
      leftCol.innerHTML = "";
      rightCol.innerHTML = "";
      lines.innerHTML = "";

      PAIRS.forEach(p => {
        const card = document.createElement("button");
        card.className = "card left-card";
        card.dataset.id = p.id;
        card.innerHTML =
          `<span class="number">${p.id}</span>
         <span class="left-label">${p.left}</span>
         <span class="endpoint"></span>`;
        card.addEventListener("click", () => selectLeft(p.id, card));
        leftCol.appendChild(card);
      });

      RIGHT_ORDER.forEach(id => {
        const p = PAIRS.find(x => x.id === id);
        const card = document.createElement("button");
        card.className = "card right-card";
        card.dataset.id = p.id;
        card.innerHTML =
          `<span class="endpoint"></span>
         <span class="right-text">${p.right}</span>`;
        card.addEventListener("click", () => selectRight(p.id, card));
        rightCol.appendChild(card);
      });

      redrawLines();
    }

    function selectLeft(id, card) {
      if (matched.has(id)) return;
      unlockAudio();
      clickSound();

      document.querySelectorAll(".left-card.selected")
        .forEach(x => x.classList.remove("selected"));

      selectedLeft = id;
      card.classList.add("selected");
    }

    function selectRight(id, card) {
      if (matched.has(id)) {
        if (selectedLeft === null) wrongSound();
        return;
      }

      if (selectedLeft === null) {
        wrongSound();
        return;
      }

      unlockAudio();
      clickSound();

      const left = document.querySelector(
        `.left-card[data-id="${selectedLeft}"]`
      );

      if (selectedLeft === id) {
        matched.set(id, true);

        left.classList.remove("selected");
        left.classList.add("matched", "good");
        card.classList.add("matched", "good");

        drawLine(left, card, id);
        correctSound();
        speak("Correct");
        createMatchConfetti();

        selectedLeft = null;

        if (matched.size === PAIRS.length) {
          createConfetti(120);
          setTimeout(() => {
            finalScore.textContent = `${PAIRS.length} / ${PAIRS.length}`;
            finalFb.className = "feedback final-pop show";
            finalFb.setAttribute("aria-hidden", "false");
          }, 450);
        }
      } else {
        left.classList.add("wrong");
        card.classList.add("wrong");
        wrongSound();
        speak("Try again");

        setTimeout(() => {
          left.classList.remove("wrong");
          card.classList.remove("wrong");
        }, 450);
      }
    }

    function drawLine(a, b, id) {
      const br = board.getBoundingClientRect();
      const ar = a.getBoundingClientRect();
      const rr = b.getBoundingClientRect();

      const x1 = ar.right - br.left - 2;
      const y1 = ar.top - br.top + ar.height / 2;
      const x2 = rr.left - br.left + 2;
      const y2 = rr.top - br.top + rr.height / 2;

      const dx = Math.max(40, Math.abs(x2 - x1) * .42);
      const d =
        `M ${x1} ${y1}
       C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

      const group = document.createElementNS(
        "http://www.w3.org/2000/svg", "g"
      );
      group.dataset.id = id;

      const under = document.createElementNS(
        "http://www.w3.org/2000/svg", "path"
      );
      under.setAttribute("d", d);
      under.setAttribute("class", "line");

      const over = document.createElementNS(
        "http://www.w3.org/2000/svg", "path"
      );
      over.setAttribute("d", d);
      over.setAttribute("class", "line lineColor");

      group.append(under, over);
      lines.appendChild(group);
    }

    function redrawLines() {
      lines.setAttribute("width", board.clientWidth);
      lines.setAttribute("height", board.clientHeight);
      lines.setAttribute(
        "viewBox",
        `0 0 ${board.clientWidth} ${board.clientHeight}`
      );

      lines.innerHTML = "";

      matched.forEach((_, id) => {
        const a = document.querySelector(
          `.left-card[data-id="${id}"]`
        );
        const b = document.querySelector(
          `.right-card[data-id="${id}"]`
        );
        if (a && b) drawLine(a, b, id);
      });
    }

    window.addEventListener("resize", redrawLines);

    document.getElementById("homeBtn").addEventListener("click", () => {
      window.top.location.href = "../Grade2_chapter5.html";
    });

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔊" : "🔇";
      if (soundEnabled) unlockAudio();
    });

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function tone(freq, dur, type = "sine", vol = .055, delay = 0) {
      if (!soundEnabled) return;
      unlockAudio();

      setTimeout(() => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();

        o.type = type;
        o.frequency.value = freq;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(
          .001, audioCtx.currentTime + dur
        );

        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      }, delay);
    }

    function clickSound() {
      tone(420, .07, "sine", .04);
    }

    function correctSound() {
      tone(620, .12, "sine", .075);
      tone(820, .15, "sine", .065, 90);
      tone(1050, .20, "sine", .075, 180);
    }

    function wrongSound() {
      tone(180, .18, "sawtooth", .05);
      tone(110, .22, "sawtooth", .04, 100);
    }

    function speak(t) {
      if (!soundEnabled || !("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-US";
      msg.volume = .25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }

    function createMatchConfetti() {
      const old = document.getElementById("matchConfetti");
      if (old) old.remove();

      const c = document.createElement("div");
      c.id = "matchConfetti";
      c.className = "match-confetti";

      /* Muted palette to match the new UI */
      const colors = [
        "#657987", "#8b8172", "#a7b19f",
        "#c6b99f", "#465b68"
      ];

      const pieces = 55;

      for (let i = 0; i < pieces; i++) {
        const p = document.createElement("span");
        p.className = "match-confetti-piece";
        p.style.background = colors[i % colors.length];

        const angle =
          (Math.PI * 2 * i / pieces) +
          (Math.random() - .5) * .35;

        const distance = 130 + Math.random() * 250;
        const gravity = 60 + Math.random() * 130;

        p.style.setProperty(
          "--cx", Math.cos(angle) * distance + "px"
        );
        p.style.setProperty(
          "--cy",
          Math.sin(angle) * distance + gravity + "px"
        );
        p.style.setProperty(
          "--cr",
          (Math.random() * 1000 - 500) + "deg"
        );
        p.style.animationDelay =
          Math.random() * .1 + "s";

        c.appendChild(p);
      }

      document.body.appendChild(c);
      setTimeout(() => c.remove(), 1450);
    }

    function createConfetti(n) {
      const c = document.getElementById("confetti");
      c.innerHTML = "";

      const colors = [
        "#657987", "#8b8172", "#a7b19f",
        "#c6b99f", "#465b68"
      ];

      for (let i = 0; i < n; i++) {
        const p = document.createElement("span");
        p.className = "confetti-piece";
        p.style.left = Math.random() * 100 + "%";
        p.style.background = colors[i % colors.length];
        p.style.setProperty(
          "--x", (Math.random() * 480 - 240) + "px"
        );
        p.style.setProperty(
          "--r", (Math.random() * 1200 - 600) + "deg"
        );
        p.style.setProperty(
          "--t", (1.6 + Math.random() * 1.6) + "s"
        );
        p.style.setProperty(
          "--d", (Math.random() * .35) + "s"
        );
        c.appendChild(p);
      }

      setTimeout(() => c.innerHTML = "", 3800);
    }

    again.addEventListener("click", () => {
      selectedLeft = null;
      matched = new Map();
      lines.innerHTML = "";
      finalFb.className = "feedback final-pop";
      finalFb.setAttribute("aria-hidden", "true");
      document.getElementById("confetti").innerHTML = "";
      render();
    });

    render();
  </script>
</body>

</html>
