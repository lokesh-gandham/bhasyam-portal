<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Write the Product</title>

    <style>
        /* =========================================================
   RESET
   ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Livvic", sans-serif;
        }

        body {
            font-family: "Livvic", sans-serif;
            color: #2f4f4f;
            background: #fff8e8;
            user-select: none;
        }

        button {
            font: inherit;
        }

        /* =========================================================
   PAGE LAYOUT
   ========================================================= */
        .game-page {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px 28px 14px;
        }

        .header {
            flex: 0 0 auto;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 100px 1fr 100px;
            align-items: start;
        }

        .title {
            text-align: center;
            color: #3f2a86;
            font-size: 30px;
            line-height: 1;
            align-self: center;
            /* font-weight:800; */
        }

        .content {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            max-width: 1250px;
            margin: 8px auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* =========================================================
   HOME / HINT BUTTONS
   ========================================================= */
        .icon-button {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 2px solid #eadff7;
            background: #fffdf7;
            box-shadow: 0 4px 12px rgba(70, 50, 120, .15);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .icon-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(70, 50, 120, .20);
        }

        .icon-button img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
        }

        .icon-label {
            font-size: 14px;
            line-height: 1;
            font-weight: 700;
        }

        /* =========================================================
   WORD BANK
   ========================================================= */
        .word-bank {
            width: 100%;
            flex: 0 0 auto;
            padding: 10px 14px 12px;
            border-radius: 18px;
            background: #fffdf7;
            border: 2px solid #f1d995;
        }

        .word-bank-title {
            text-align: center;
            color: #4b3a93;
            font-size: clamp(18px, 1.6vw, 24px);
            line-height: 1;
            font-weight: 800;
            margin-bottom: 9px;
        }

        .words {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
        }

        .word {
            min-width: 0;
            min-height: 48px;
            padding: 7px 10px;
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: grab;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #24346f;
            font-size: clamp(15px, 1.35vw, 21px);
            line-height: 1.05;
            font-weight: 700;
            transition: transform .15s, box-shadow .15s, opacity .15s;
        }

        .word:active {
            cursor: grabbing;
        }

        .word:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(65, 50, 120, .12);
        }

        .word.selected {
            outline: 3px solid #f4c84b;
            transform: translateY(-2px);
        }

        .word.dragging {
            opacity: .45;
        }

        .word:nth-child(1) {
            background: #fff1c9;
            border-color: #f0ca64
        }

        .word:nth-child(2) {
            background: #eaf7df;
            border-color: #acd68e
        }

        .word:nth-child(3) {
            background: #e8f2ff;
            border-color: #9fc7ef
        }

        .word:nth-child(4) {
            background: #f2e8ff;
            border-color: #c8a4ea
        }

        .word:nth-child(5) {
            background: #ffe9df;
            border-color: #f2b397;
            font-size: clamp(22px, 1.8vw, 28px)
        }

        /* =========================================================
   QUESTION AREA
   ========================================================= */
        .question-area {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px 20px 4px;
        }

        .question-heading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 1150px;
            position: relative;
            top: -30px;
        }

        .question-number {
            flex: 0 0 auto;
            color: #2f4f4f;
            font-size: 30px;
            line-height: 1;
            /* font-weight:800; */
        }

        .question-text {
            width: auto;
            max-width: 1100px;
            color: #2f4f4f;
            font-size: 30px;
            line-height: 1.25;
            /* font-weight:700; */
            text-align: left;
        }

        .question-image {
            width: min(430px, 34vw);
            height: min(235px, 27vh);
            min-height: 120px;
            object-fit: contain;
            display: block;
            margin: 8px auto 7px;
            border: 0;
            background: transparent;
        }

        .drop-zone {
            width: min(330px, 42vw);
            min-height: 52px;
            padding: 8px 14px;
            border: 2px dashed #9a78d3;
            border-radius: 13px;
            background: #f7f1ff;
            color: #7654b6;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: clamp(15px, 1.4vw, 20px);
            line-height: 1.15;
            font-weight: 700;
            cursor: pointer;
            transition: .15s;
        }

        .drop-zone.drag-over {
            background: #eee2ff;
            border-color: #7047b5;
            transform: scale(1.02);
        }

        .drop-zone.filled {
            background: #eef9e9;
            border-color: #6db36b;
            border-style: solid;
            color: #397a3d;
        }

        .drop-zone.correct {
            background: #e7f8e9;
            border-color: #42a85a;
            border-style: solid;
            color: #277638;
        }

        /* =========================================================
   MULTIPLICATION ACTIVITY
   ========================================================= */
        .multiplication-area {
            gap: 8px;
        }

        .multiplication-area .question-text {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .question-answer-box {
            width: 82px;
            height: 54px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #f0a52f;
            border-radius: 14px;
            background: linear-gradient(145deg, #fffdf7, #fff4d8);
            color: #2f4f4f;
            box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .75), 0 4px 10px rgba(180, 120, 20, .16);
            font-size: 28px;
            font-weight: 400;
            line-height: 1;
        }

        .question-answer-box.has-value {
            border-color: #4ec263;
            background: linear-gradient(145deg, #f4fff1, #e3f8df);
            color: #277638;
        }

        .answer-stage {
            position: relative;
            width: min(920px, 92%);
            height: min(300px, 40vh);
            min-height: 185px;
            border: 2px solid #dfd2f2;
            border-radius: 24px;
            background: rgba(255, 255, 255, .82);
            box-shadow: 0 7px 18px rgba(70, 50, 120, .09);
            overflow: hidden;
            flex: 0 1 auto;
            pointer-events: auto;
        }

        .answer-stage::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1.5px dashed #e8ddf5;
            border-radius: 17px;
            pointer-events: none;
            z-index: 1;
        }

        #answerChoices {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        .answer-choice {
            position: absolute;
            left: 0;
            top: 0;
            min-width: 90px;
            height: 58px;
            padding: 6px 18px;
            border: 2px solid #f0ca64;
            border-radius: 12px;
            color: #24346f;
            font-size: 24px;
            line-height: 1;
            background: #fff1c9;
            box-shadow: 0 4px 10px rgba(65, 50, 120, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
            transition: box-shadow .15s, opacity .15s;
            will-change: transform;
            pointer-events: auto;
            cursor: pointer;
        }

        .answer-choice:active {
            cursor: pointer;
        }

        .answer-choice:nth-child(2) {
            background: #eaf7df;
            border-color: #acd68e
        }

        .answer-choice:nth-child(3) {
            background: #e8f2ff;
            border-color: #9fc7ef
        }

        .answer-choice:nth-child(4) {
            background: #f2e8ff;
            border-color: #c8a4ea
        }

        .answer-choice:nth-child(5) {
            background: #ffe9df;
            border-color: #f2b397
        }

        .answer-choice:hover:not(:disabled) {
            box-shadow: 0 6px 14px rgba(65, 50, 120, .18);
        }

        .answer-choice.selected {
            background: #e7f8e9 !important;
            border-color: #42a85a !important;
            color: #277638;
            box-shadow: 0 0 0 3px rgba(66, 168, 90, .18), 0 6px 14px rgba(65, 50, 120, .16);
        }

        .answer-choice.wrong {
            animation: answerShake .35s ease;
        }

        .answer-choice:disabled {
            opacity: .48;
        }

        @keyframes answerShake {

            0%,
            100% {
                margin-left: 0
            }

            20% {
                margin-left: -7px
            }

            40% {
                margin-left: 7px
            }

            60% {
                margin-left: -5px
            }

            80% {
                margin-left: 5px
            }
        }

        @media (max-width:600px) {
            .multiplication-area {
                gap: 3px;
            }

            .question-line {
                transform: translateY(-6px);
            }

            .multiplication-area {
                gap: 3px;
            }

            .multiplication-area .question-text {
                gap: 7px;
            }

            .question-answer-box {
                width: 62px;
                height: 40px;
                border-width: 2px;
                border-radius: 10px;
                font-size: 20px;
            }

            .answer-stage {
                width: 96%;
                height: min(255px, 38vh);
                min-height: 165px;
                border-radius: 18px;
            }

            .answer-choice {
                min-width: 62px;
                height: 40px;
                padding: 4px 10px;
                border-radius: 10px;
                font-size: 18px;
            }
        }

        @media (min-width:601px) and (max-width:900px) {
            .question-line {
                transform: translateY(-8px);
            }

            .multiplication-area {
                gap: 8px;
            }

            .question-answer-box {
                width: 70px;
                height: 46px;
                font-size: 23px;
            }

            .answer-stage {
                width: 94%;
                height: min(275px, 40vh);
                min-height: 180px;
            }

            .answer-choice {
                min-width: 72px;
                height: 46px;
                padding: 5px 13px;
                font-size: 20px;
            }
        }

        @media (min-width:901px) and (max-width:1440px) {
            .question-line {
                transform: translateY(-9px);
            }

            .multiplication-area {
                gap: 8px;
            }

            .question-answer-box {
                width: 78px;
                height: 52px;
                font-size: 26px;
            }

            .answer-stage {
                width: min(950px, 92%);
                height: min(285px, 39vh);
            }

            .answer-choice {
                min-width: 86px;
                height: 54px;
                font-size: 23px;
            }
        }

        @media (min-width:1441px) {
            .question-line {
                transform: translateY(-10px);
            }

            .multiplication-area {
                gap: 8px;
            }

            .question-answer-box {
                width: 96px;
                height: 66px;
                border-width: 3px;
                border-radius: 16px;
                font-size: 34px;
            }

            .answer-stage {
                width: min(1200px, 90%);
                height: min(350px, 40vh);
            }

            .answer-choice {
                min-width: 112px;
                height: 70px;
                border-radius: 16px;
                font-size: 30px;
            }
        }

        /* =========================================================
   NAVIGATION
   ========================================================= */
        .navigation {
            flex: 0 0 auto;
            width: 100%;
            max-width: 1250px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 4px 0 0;
        }

        .nav-button {
            min-width: 150px;
            height: 50px;
            padding: 0 22px;
            border: 2px solid #8d73d0;
            border-radius: 15px;
            background: #fff;
            color: #60449e;
            font-size: clamp(16px, 1.35vw, 20px);
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 0 #d8caef;
            transition: .12s;
            margin-top: -20px !important;
        }

        .nav-button.next {
            background: #7153c1;
            color: #fff;
            border-color: #7153c1;
            box-shadow: 0 4px 0 #4e3994;
        }

        .nav-button:not(:disabled):hover {
            transform: translateY(-2px);
        }

        .nav-button:not(:disabled):active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #d8caef;
        }

        .nav-button.next:not(:disabled):active {
            box-shadow: 0 1px 0 #4e3994;
        }

        .nav-button:disabled {
            opacity: .38;
            cursor: not-allowed;
        }

        /* =========================================================
   FEEDBACK POPUPS — game style
   ========================================================= */
        .feedback {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            /* background: rgba(38, 31, 76, .35); */
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: .2s;
        }

        .feedback.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .feedback-card {
            position: relative;
            width: min(430px, 90vw);
            padding: 34px 26px 28px;
            text-align: center;
            border-radius: 28px;
            background: linear-gradient(180deg, #ffffff 0%, #fffdf6 100%);
            border: 5px solid #8d73d0;
            box-shadow: 0 20px 50px rgba(43, 31, 90, .32), inset 0 0 0 3px rgba(255, 255, 255, .6);
            overflow: hidden;
        }

        .feedback-card::before {
            content: "";
            position: absolute;
            top: -60%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, rgba(255, 255, 255, .55) 0%, transparent 60%);
            pointer-events: none;
        }

        .feedback-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 6px;
            background: radial-gradient(circle at 35% 30%, #ffffff, #f1eaff);
            box-shadow: 0 8px 18px rgba(70, 50, 120, .22), inset 0 0 0 4px rgba(255, 255, 255, .8);
        }

        .feedback-emoji {
            font-size: 58px;
            line-height: 1;
        }

        .feedback-title {
            margin: 8px 0 6px;
            color: #3f3278;
            font-size: 32px;
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: .3px;
        }

        .feedback-text {
            color: #59627a;
            font-size: 18px;
            line-height: 1.4;
            font-weight: 600;
        }

        .feedback.simple-correct .feedback-card {
            border-color: #4ec263;
            box-shadow: 0 20px 50px rgba(30, 120, 60, .32), inset 0 0 0 3px rgba(255, 255, 255, .6);
        }

        .feedback.simple-correct .feedback-badge {
            background: radial-gradient(circle at 35% 30%, #ffffff, #e4faea);
            box-shadow: 0 8px 18px rgba(35, 140, 70, .3), inset 0 0 0 4px rgba(255, 255, 255, .85);
        }

        .feedback.simple-correct .feedback-title {
            color: #2a9648;
        }

        .feedback.simple-wrong .feedback-card {
            border-color: #ed737c;
            box-shadow: 0 20px 50px rgba(150, 40, 50, .28), inset 0 0 0 3px rgba(255, 255, 255, .6);
        }

        .feedback.simple-wrong .feedback-badge {
            background: radial-gradient(circle at 35% 30%, #ffffff, #ffe7e8);
            box-shadow: 0 8px 18px rgba(200, 60, 70, .28), inset 0 0 0 4px rgba(255, 255, 255, .85);
        }

        .feedback.simple-wrong .feedback-title {
            color: #d64d58;
        }

        .feedback.simple-hint .feedback-card {
            border-color: #f0bd45;
            box-shadow: 0 20px 50px rgba(150, 110, 10, .25), inset 0 0 0 3px rgba(255, 255, 255, .6);
        }

        .feedback.simple-hint .feedback-badge {
            background: radial-gradient(circle at 35% 30%, #ffffff, #fff3d9);
            box-shadow: 0 8px 18px rgba(190, 140, 10, .28), inset 0 0 0 4px rgba(255, 255, 255, .85);
        }

        .feedback.simple-hint .feedback-title {
            color: #a36c00;
        }

        /* Final popup */
        .feedback.final-pop .feedback-card {
            width: min(540px, 92vw);
            border-color: #efc34d;
            padding: 40px 30px 32px;
            box-shadow: 0 24px 60px rgba(150, 110, 10, .32), inset 0 0 0 3px rgba(255, 255, 255, .6);
        }

        .feedback.final-pop .feedback-badge {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 35% 30%, #ffffff, #fff3d9);
            box-shadow: 0 10px 22px rgba(190, 140, 10, .3), inset 0 0 0 5px rgba(255, 255, 255, .85);
        }

        .feedback.final-pop .feedback-emoji {
            font-size: 72px;
        }

        .feedback.final-pop .feedback-title {
            font-size: 40px;
            font-weight: 400;
        }

        .feedback.final-pop .feedback-text {
            font-size: 20px;
        }

        .final-score {
            display: inline-block;
            margin-top: 14px;
            padding: 9px 26px;
            border-radius: 20px;
            background: linear-gradient(145deg, #e9fbe4, #d3f4cb);
            color: #2a9648;
            font-size: 26px;
            font-weight: 400;
            box-shadow: 0 4px 10px rgba(40, 140, 60, .25), inset 0 0 0 2px rgba(255, 255, 255, .7);
        }

        .play-again {
            margin-top: 22px;
            min-width: 180px;
            min-height: 52px;
            padding: 12px 24px;
            border: 0;
            border-radius: 16px;
            background: linear-gradient(145deg, #8567d6, #6a4fbf);
            color: #fff;
            font-size: 19px;
            font-weight: 800;
            box-shadow: 0 5px 0 #4e3994;
            cursor: pointer;
            transition: .12s;
        }

        .play-again:hover {
            transform: translateY(-2px);
        }

        .play-again:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #4e3994;
        }

        /* Popup animations */
        @keyframes correctPop {
            0% {
                transform: scale(.55) rotate(-4deg);
                opacity: 0
            }

            60% {
                transform: scale(1.08) rotate(2deg);
                opacity: 1
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1
            }
        }

        @keyframes wrongShake {

            0%,
            100% {
                transform: translateX(0)
            }

            20% {
                transform: translateX(-9px) rotate(-1.5deg)
            }

            40% {
                transform: translateX(9px) rotate(1.5deg)
            }

            60% {
                transform: translateX(-6px)
            }

            80% {
                transform: translateX(6px)
            }
        }

        @keyframes badgePulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.08)
            }
        }

        .feedback.simple-correct .feedback-card,
        .feedback.final-pop .feedback-card {
            animation: correctPop .35s ease;
        }

        .feedback.simple-wrong .feedback-card {
            animation: wrongShake .38s ease;
        }

        .feedback.show .feedback-badge {
            animation: badgePulse 1.1s ease-in-out infinite;
        }

        /* =========================================================
   CONFETTI
   ========================================================= */
        .confetti-piece {
            position: fixed;
            top: -24px;
            z-index: 600;
            border-radius: 3px;
            pointer-events: none;
            animation: confettiFall 1.6s ease-in forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(112vh) rotate(760deg);
                opacity: .25;
            }
        }

        /* =========================================================
   RESPONSIVE MEDIA QUERIES
   Ordered: mobile -> tablet -> laptop -> desktop
   ========================================================= */

        /* ---------- Mobile ---------- */
        @media (max-width:600px) {
            .game-page {
                padding: 5px 9px 8px;
            }

            .header {
                grid-template-columns: 58px 1fr 58px;
            }

            .icon-button {
                width: 52px;
                height: 52px;
            }

            .icon-button img {
                width: 36px;
                height: 36px;
            }

            .icon-label {
                font-size: 10px;
            }

            .title {
                font-size: 30px;
            }

            .content {
                margin-top: 5px;
            }

            .word-bank {
                padding: 7px 5px 8px;
            }

            .word-bank-title {
                font-size: 16px;
                margin-bottom: 6px;
            }

            .words {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 5px;
            }

            .word {
                min-height: 37px;
                padding: 5px 3px;
                font-size: 12px;
            }

            .word:nth-child(5) {
                font-size: 18px;
            }

            .question-area {
                padding: 4px 3px 2px;
            }

            .question-number {
                font-size: 28px;
                margin-bottom: 4px;
            }

            .question-text {
                font-size: 28px;
                line-height: 1.22;
            }

            .question-image {
                width: min(260px, 72vw);
                height: min(155px, 24vh);
                min-height: 75px;
                margin: 4px auto;
            }

            .drop-zone {

<body>
    <div class="game-page">

        <header class="header">
            <button class="icon-button" id="homeButton" type="button" aria-label="Home">
                <img src="../assets/images/home.png" alt="Home">
                <span class="icon-label"></span>
            </button>

            <p class="title">Write the Product</p>

            <button class="icon-button" id="hintButton" type="button" aria-label="Hint">
                <img src="../assets/images/hint.png" alt="Hint">
                <span class="icon-label"></span>
            </button>
        </header>

        <main class="content">

            <section class="question-area multiplication-area">
                <div class="question-heading">
                    <div class="question-number" id="questionNumber">Q1.</div>
                    <div class="question-text" id="questionText">
                        <span id="partA"></span>
                        <span>×</span>
                        <span id="partB"></span>
                        <span>=</span>
                        <span id="partProduct"></span>
                    </div>
                </div>

                <div class="answer-stage" id="answerStage" aria-label="Moving answer choices"></div>
            </section>

            <nav class="navigation">
                <button class="nav-button" id="prevButton" type="button" disabled>← Previous</button>
                <button class="nav-button next" id="nextButton" type="button" disabled>Next →</button>
            </nav>

        </main>
    </div>

    <!-- SIMPLE FEEDBACK POPUP (correct / wrong / hint) -->
    <div class="feedback" id="feedback" aria-hidden="true">
        <div class="feedback-card">
            <div class="feedback-badge">
                <div class="feedback-emoji" id="feedbackEmoji">😊</div>
            </div>
            <h2 class="feedback-title" id="feedbackTitle">Correct!</h2>
            <p class="feedback-text" id="feedbackText">Great job!</p>
        </div>
    </div>

    <!-- FINAL POPUP -->
    <div class="feedback final-pop" id="finalFeedback" aria-hidden="true">
        <div class="feedback-card">
            <div class="feedback-badge">
                <div class="feedback-emoji">🎉</div>
            </div>
            <h2 class="feedback-title">Great Job!</h2>
            <p class="feedback-text">You completed all 24 questions.</p>
            <div class="final-score" id="finalScore">24 / 24</div>
            <br>
            <button class="play-again" id="playAgainButton" type="button">Play Again</button>
        </div>
    </div>

    <script>
        // NOTE: each item can optionally include a "blank" field to control
        // where the missing box appears in the equation:
        //   blank: "a"       -> [ ? ] × b = product   (blank is the first factor)
        //   blank: "b"       -> a × [ ? ] = product    (blank is the second factor)
        //   blank: "product" -> a × b = [ ? ]          (default, same as before)
        const data = [
            { a: 2, b: 1, answer: 2 },

            { a: 8, b: 0, answer: 0 },

            { a: 8, b: 1, answer: 8, blank: "a" },

            { a: 7, b: 0, answer: 0, blank: "b" },

            { a: 5, b: 1, answer: 5, blank: "b" },

            { a: 0, b: 1, answer: 0, blank: "b" },

            { a: 9, b: 1, answer: 9, blank: "b" },

            { a: 10, b: 1, answer: 10, blank: "a" },
        ]


        const qn = document.getElementById("questionNumber");
        const qt = document.getElementById("questionText");
        const partA = document.getElementById("partA");
        const partB = document.getElementById("partB");
        const partProduct = document.getElementById("partProduct");
        const prev = document.getElementById("prevButton");
        const next = document.getElementById("nextButton");
        const fb = document.getElementById("feedback");
        const fe = document.getElementById("feedbackEmoji");
        const ft = document.getElementById("feedbackTitle");
        const fx = document.getElementById("feedbackText");
        const finalFb = document.getElementById("finalFeedback");
        const finalScore = document.getElementById("finalScore");
        const again = document.getElementById("playAgainButton");
        const stage = document.getElementById("answerStage");

        // Single shared answer box element — moved into whichever slot
        // (partA / partB / partProduct) is the blank for the current question.
        const questionAnswer = document.createElement("span");
        questionAnswer.className = "question-answer-box";
        questionAnswer.id = "questionAnswer";
        questionAnswer.setAttribute("aria-label", "Selected answer");

        let current = 0;
        let completed = Array(data.length).fill(false);
        let answers = Array(data.length).fill(null);
        let timer;
        let movingChoices = [];
        let animationFrame = null;
        let currentCorrect = null;
        let currentAnyCorrect = false; // true when any choice is valid (e.g. 0 × ? = 0)

        function speak(t) {
            try {
                speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(t);
                msg.lang = "en-US";
                msg.volume = 0.25;
                msg.rate = 1;
                msg.pitch = 1;
                speechSynthesis.speak(msg);
            } catch (e) { }
        }

        function stopChoices() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            movingChoices = [];
        }

        function makeChoices(answer) {
            const offsets = [-1, 1, -2, 2];
            const choices = [answer];

            offsets.forEach(offset => {
                let value = answer + offset;
                if (value <= 0) value = answer + Math.abs(offset) + 1;
                if (!choices.includes(value)) choices.push(value);
            });

            return [answer, ...choices.filter(value => value !== answer).sort(() => Math.random() - .5)];
        }

        function render() {
            stopChoices();

            const d = data[current];
            const blankPos = d.blank || "product"; // "a" | "b" | "product"

            currentCorrect = blankPos === "a" ? d.a : (blankPos === "b" ? d.b : d.answer);

            // If the visible (non-blank) factor is 0, ANY number in the blank
            // still makes the equation true (anything × 0 = 0), so every
            // choice should be accepted as correct.
            currentAnyCorrect =
                (blankPos === "a" && d.b === 0) ||
                (blankPos === "b" && d.a === 0);

            qn.textContent = `Q${current + 1}.`;

            partA.textContent = "";
            partB.textContent = "";
            partProduct.textContent = "";

            if (blankPos === "a") {
                partA.appendChild(questionAnswer);
                partB.textContent = d.b;
                partProduct.textContent = d.answer;
            } else if (blankPos === "b") {
                partA.textContent = d.a;
                partB.appendChild(questionAnswer);
                partProduct.textContent = d.answer;
            } else {
                partA.textContent = d.a;
                partB.textContent = d.b;
                partProduct.appendChild(questionAnswer);
            }

            questionAnswer.textContent = answers[current] ?? "";
            questionAnswer.classList.toggle("has-value", answers[current] != null);

            prev.disabled = current === 0;
            next.disabled = !completed[current] || current === data.length - 1;

            stage.innerHTML = "";

            const choices = makeChoices(currentCorrect);
            const stageWidth = stage.clientWidth;
            const stageHeight = stage.clientHeight;

            choices.forEach((value, index) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "answer-choice";
                button.textContent = value;

                if (answers[current] === value && completed[current]) {
                    button.classList.add("selected");
                    button.disabled = true;
                }

                button.addEventListener("click", () => validate(value, button));
                stage.appendChild(button);

                const w = button.offsetWidth;
                const h = button.offsetHeight;

                const angle = (Math.PI * 2 * index / choices.length) - Math.PI / 2;
                const radiusX = Math.max(35, (stageWidth - w) * .31);
                const radiusY = Math.max(25, (stageHeight - h) * .28);

                const x = Math.max(4, Math.min(stageWidth - w - 4, stageWidth / 2 + Math.cos(angle) * radiusX - w / 2));
                const y = Math.max(4, Math.min(stageHeight - h - 4, stageHeight / 2 + Math.sin(angle) * radiusY - h / 2));

                movingChoices.push({
                    el: button,
                    x: x,
                    y: y,
                    vx: (index % 2 ? -1 : 1) * (0.72 + index * .10),
                    vy: (index % 2 ? 1 : -1) * (0.58 + (index % 3) * .08),
                    w: w,
                    h: h
                });
            });

            animateChoices();
        }

        function animateChoices() {
            const loop = () => {
                if (!movingChoices.length) return;

                const sw = stage.clientWidth;
                const sh = stage.clientHeight;

                movingChoices.forEach(item => {
                    if (item.el.disabled) return;

                    item.x += item.vx;
                    item.y += item.vy;

                    const maxX = Math.max(4, sw - item.w - 4);
                    const maxY = Math.max(4, sh - item.h - 4);

                    if (item.x <= 4) {
                        item.x = 4;
                        item.vx = Math.abs(item.vx);
                    }
                    if (item.x >= maxX) {
                        item.x = maxX;
                        item.vx = -Math.abs(item.vx);
                    }
                    if (item.y <= 4) {
                        item.y = 4;
                        item.vy = Math.abs(item.vy);
                    }
                    if (item.y >= maxY) {
                        item.y = maxY;
                        item.vy = -Math.abs(item.vy);
                    }

                    item.el.style.transform = `translate3d(${item.x}px,${item.y}px,0)`;
                });

                animationFrame = requestAnimationFrame(loop);
            };

            animationFrame = requestAnimationFrame(loop);
        }

        function hide() {
            clearTimeout(timer);
            fb.className = "feedback";
            fb.setAttribute("aria-hidden", "true");
        }

        function launchConfetti(count) {
            const colors = ["#ff8cab", "#8a78ed", "#65cbd2", "#ffd26e", "#8fd9a8", "#7153c1"];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement("span");
                piece.className = "confetti-piece";
                piece.style.left = `${Math.random() * 100}vw`;
                piece.style.width = "10px";
                piece.style.height = "16px";
                piece.style.background = colors[i % colors.length];
                piece.style.animationDelay = `${Math.random() * .4}s`;
                piece.style.transform = `rotate(${Math.random() * 180}deg)`;
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 2200);
            }
        }

        function correctPopup() {
            fb.className = "feedback show simple-correct";
            fe.textContent = "😊";
            ft.textContent = "Correct!";
            fx.textContent = "Great job!";
            fb.setAttribute("aria-hidden", "false");
            launchConfetti(45);
            timer = setTimeout(hide, 900);
        }

        function wrongPopup() {
            fb.className = "feedback show simple-wrong";
            fe.textContent = "😕";
            ft.textContent = "Try Again!";
            fx.textContent = "Choose the correct answer.";
            fb.setAttribute("aria-hidden", "false");
            timer = setTimeout(hide, 650);
        }

        function hintPopup() {
            if (completed[current]) return;

            const d = data[current];
            fb.className = "feedback show simple-hint";
            fe.textContent = "💡";
            ft.textContent = "Hint";
            fx.textContent = currentAnyCorrect
                ? "Multiplying any number by 0 always gives 0 — any number works here!"
                : `${d.a} groups of ${d.b}, or ${d.b} groups of ${d.a}.`;
            fb.setAttribute("aria-hidden", "false");
            timer = setTimeout(hide, 2600);
        }

        function validate(value, button) {
            if (completed[current]) return;

            questionAnswer.textContent = value;
            questionAnswer.classList.add("has-value");

            const isCorrect = currentAnyCorrect || value === currentCorrect;

            if (!isCorrect) {
                button.classList.remove("wrong");
                void button.offsetWidth;
                button.classList.add("wrong");
                speak("wrong");
                wrongPopup();
                setTimeout(() => {
                    if (!completed[current]) {
                        questionAnswer.textContent = "";
                        questionAnswer.classList.remove("has-value");
                    }
                }, 650);
                return;
            }

            completed[current] = true;
            answers[current] = value;

            movingChoices.forEach(item => {
                item.el.disabled = true;
            });

            button.classList.add("selected");

            prev.disabled = current === 0;
            next.disabled = current === data.length - 1;

            speak("correct");
            correctPopup();

            if (current === data.length - 1) {
                setTimeout(() => {
                    hide();
                    finalScore.textContent = `${data.length} / ${data.length}`;
                    finalFb.querySelector(".feedback-text").textContent =
                        `You completed all ${data.length} questions.`;
                    finalFb.className = "feedback final-pop show";
                    finalFb.setAttribute("aria-hidden", "false");
                    launchConfetti(120);
                }, 900);
            }
        }

        next.addEventListener("click", () => {
            if (next.disabled) return;
            current++;
            render();
        });

        prev.addEventListener("click", () => {
            if (prev.disabled) return;
            current--;
            render();
        });

        document.getElementById("hintButton").addEventListener("click", hintPopup);

        document.getElementById("homeButton").addEventListener("click", () => {
            window.top.location.href = "../Grade2_chapter5.html";
        });

        again.addEventListener("click", () => {
            current = 0;
            completed = Array(data.length).fill(false);
            answers = Array(data.length).fill(null);
            finalFb.className = "feedback final-pop";
            finalFb.setAttribute("aria-hidden", "true");
            render();
        });

        window.addEventListener("resize", () => {
            if (stage.offsetParent !== null) render();
        });

        render();
    </script>
</body>
