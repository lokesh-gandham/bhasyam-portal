<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Use the Number Line to Find the Product</title>

    <style>
        /* =========================================================
   RESET
   ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Livvic", sans-serif;
        }

        body {
            font-family: "Livvic", sans-serif;
            color: #2f4f4f;
            background: #fff8e8;
            user-select: none;
        }

        button {
            font: inherit;
        }

        /* =========================================================
   PAGE LAYOUT
   ========================================================= */
        .game-page {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px 28px 14px;
        }

        .header {
            flex: 0 0 auto;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 100px 1fr 100px;
            align-items: start;
        }

        .title {
            text-align: center;
            color: #3f2a86;
            font-size: 30px;
            line-height: 1;
            align-self: center;
            /* font-weight:800; */
        }

        .content {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            max-width: 1250px;
            margin: 8px auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* =========================================================
   HOME / HINT BUTTONS
   ========================================================= */
        .icon-button {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 2px solid #eadff7;
            background: #fffdf7;
            box-shadow: 0 4px 12px rgba(70, 50, 120, .15);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .icon-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(70, 50, 120, .20);
        }

        .icon-button img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
        }

        .icon-label {
            font-size: 14px;
            line-height: 1;
            font-weight: 700;
        }

        /* =========================================================
   WORD BANK
   ========================================================= */
        .word-bank {
            width: 100%;
            flex: 0 0 auto;
            padding: 10px 14px 12px;
            border-radius: 18px;
            background: #fffdf7;
            border: 2px solid #f1d995;
        }

        .word-bank-title {
            text-align: center;
            color: #4b3a93;
            font-size: clamp(18px, 1.6vw, 24px);
            line-height: 1;
            font-weight: 800;
            margin-bottom: 9px;
        }

        .words {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
        }

        .word {
            min-width: 0;
            min-height: 48px;
            padding: 7px 10px;
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: grab;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #24346f;
            font-size: clamp(15px, 1.35vw, 21px);
            line-height: 1.05;
            font-weight: 700;
            transition: transform .15s, box-shadow .15s, opacity .15s;
        }

        .word:active {
            cursor: grabbing;
        }

        .word:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(65, 50, 120, .12);
        }

        .word.selected {
            outline: 3px solid #f4c84b;
            transform: translateY(-2px);
        }

        .word.dragging {
            opacity: .45;
        }

        .word:nth-child(1) {
            background: #fff1c9;
            border-color: #f0ca64
        }

        .word:nth-child(2) {
            background: #eaf7df;
            border-color: #acd68e
        }

        .word:nth-child(3) {
            background: #e8f2ff;
            border-color: #9fc7ef
        }

        .word:nth-child(4) {
            background: #f2e8ff;
            border-color: #c8a4ea
        }

        .word:nth-child(5) {
            background: #ffe9df;
            border-color: #f2b397;
            font-size: clamp(22px, 1.8vw, 28px)
        }

        /* =========================================================
   QUESTION AREA
   ========================================================= */
        .question-area {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px 20px 4px;
        }

        .question-heading {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 1150px;
        }

        .question-number {
            flex: 0 0 auto;
            color: #2f4f4f;
            font-size: clamp(22px, 2vw, 31px);
            line-height: 1;
            /* font-weight:800; */
        }

        .question-text {
            width: auto;
            max-width: 1100px;
            color: #2f4f4f;
            font-size: 30px;
            line-height: 1.25;
            /* font-weight:700; */
            text-align: left;
        }

        .question-image {
            width: min(430px, 34vw);
            height: min(235px, 27vh);
            min-height: 120px;
            object-fit: contain;
            display: block;
            margin: 8px auto 7px;
            border: 0;
            background: transparent;
        }

        .drop-zone {
            width: min(330px, 42vw);
            min-height: 52px;
            padding: 8px 14px;
            border: 2px dashed #9a78d3;
            border-radius: 13px;
            background: #f7f1ff;
            color: #7654b6;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: clamp(15px, 1.4vw, 20px);
            line-height: 1.15;
            font-weight: 700;
            cursor: pointer;
            transition: .15s;
        }

        .drop-zone.drag-over {
            background: #eee2ff;
            border-color: #7047b5;
            transform: scale(1.02);
        }

        .drop-zone.filled {
            background: #eef9e9;
            border-color: #6db36b;
            border-style: solid;
            color: #397a3d;
        }

        .drop-zone.correct {
            background: #e7f8e9;
            border-color: #42a85a;
            border-style: solid;
            color: #277638;
        }


        /* =========================================================
   NUMBER LINE ACTIVITY
   Uses the existing activity theme; no separate theme added.
   ========================================================= */
        .number-line-area {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 20px 4px;
            overflow: hidden;
        }

        .number-line-question {
            width: 100%;
            max-width: 1250px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: #2f4f4f;
            margin-bottom: 12px;
            transform: translateY(-45px);
            font-size: 30px;
        }

        .number-line-question .q-number {
            font-size: 30px;
            line-height: 1;
        }

        .number-line-question .equation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: clamp(28px, 2.8vw, 42px);
            line-height: 1;
        }

        .number-line-question .answer {
            width: 86px;
            height: 52px;
            border: 2px solid #f0a52f;
            border-radius: 11px;
            background: #fffdf7;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2f4f4f;
        }

        .number-line-question .answer.filled {
            background: #eef9e9;
            border-color: #6db36b;
            color: #397a3d;
        }

        .number-line-wrap {
            position: relative;
            width: min(1180px, 100%);
            height: 250px;
            flex: 0 0 auto;
        }

        .number-line {
            position: absolute;
            left: 12px;
            right: 12px;
            top: 138px;
            height: 3px;
            background: #2f4f4f;
            border-radius: 4px;
        }

        .number-line::before,
        .number-line::after {
            content: "";
            position: absolute;
            top: -7px;
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
        }

        .number-line::before {
            left: -10px;
            border-right: 12px solid #2f4f4f;
        }

        .number-line::after {
            right: -10px;
            border-left: 12px solid #2f4f4f;
        }

        .number-tick {
            position: absolute;
            top: -10px;
            width: 2px;
            height: 25px;
            background: #2f4f4f;
            transform: translateX(-50%);
        }

        .number-label {
            position: absolute;
            top: 160px;
            transform: translateX(-50%);
            min-width: 18px;
            text-align: center;
            color: #2f4f4f;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            z-index: 20;
            transition: transform .12s ease;

            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: 50%;
            background: #39c2bb;
            color: #fff;
            padding-top: 7px;
        }

        .number-label:hover {
            transform: translateX(-50%) scale(1.15);
        }

        .number-label.start,
        .number-label.target,
        .number-label.done,
        .number-label.selected {
            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: 50%;
            color: #fff;
            padding-top: 7px;
            top: 156px;
        }

        .number-label.start {
            background: #f4c84b;
            color: #2f4f4f;
        }

        .number-label.target {
            background: #39c2bb;
            color: #fff;
        }

        .number-label.done {
            background: #4ec263;
        }

        .number-label.selected {
            background: #f0a52f;
        }

        .jump-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 145px;
            overflow: visible;
            pointer-events: none;
            z-index: 8;
        }

        .jump-arc {
            fill: none;
            stroke: #7153c1;
            stroke-width: 3;
            stroke-dasharray: 7 6;
            opacity: 0;
            marker-end: url(#numberArrowHead);
        }

        .jump-arc.show {
            opacity: 1;
            animation: lineArcIn .3s ease both;
        }

        @keyframes lineArcIn {
            from {
                opacity: 0;
                stroke-dashoffset: 24
            }

            to {
                opacity: 1;
                stroke-dashoffset: 0
            }
        }

        .jump-count {
            position: absolute;
            z-index: 10;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #f0a52f;
            color: #fff;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translate(-50%, 0) scale(.7);
            pointer-events: none;
        }

        .jump-count.show {
            opacity: 1;
            animation: jumpCountPop .28s ease both;
        }

        @keyframes jumpCountPop {
            from {
                opacity: 0;
                transform: translate(-50%, 5px) scale(.7)
            }

            to {
                opacity: 1;
                transform: translate(-50%, 0) scale(1)
            }
        }

        .frog {
            position: absolute;
            z-index: 15;
            width: 64px;
            height: 64px;
            object-fit: contain;
            pointer-events: none;
            transform: translate(-50%, -100%);
            transition: left .32s ease, top .32s ease, transform .32s ease;
        }

        .frog.jumping {
            animation: frogHopLine .32s ease;
        }

        @keyframes frogHopLine {
            0% {
                transform: translate(-50%, -100%) rotate(0)
            }

            45% {
                transform: translate(-50%, -145%) rotate(-5deg)
            }

            100% {
                transform: translate(-50%, -100%) rotate(0)
            }
        }

        .number-line-instruction {
            margin-top: 6px;
            color: #59627a;
            font-size: clamp(17px, 1.5vw, 23px);
            line-height: 1.25;
            text-align: center;
        }

        .number-line-instruction strong {
            color: #7153c1;
        }

        /* ---------- Number-line responsive sizing ---------- */
        @media (max-width:600px) {
            .number-line-area {
                padding: 4px 3px 2px;
            }

            .number-line-question {
                gap: 7px;
                margin-bottom: 3px;
            }

            .number-line-question .q-number {
                font-size: 30px;
            }

            .number-line-question .equation {
                gap: 7px;
                font-size: 25px;
            }

            .number-line-question .answer {
                width: 66px;
                height: 42px;
                border-radius: 9px;
            }

            .number-line-wrap {
                width: calc(100% - 16px);
                height: 175px;
            }

            .number-line {
                top: 95px;
                left: 7px;
                right: 7px;
            }

            .number-tick {
                top: -8px;
                height: 20px;
            }

            .number-label {
                top: 116px;
                font-size: 9px;
                min-width: 12px;
            }

            .number-label.start,
            .number-label.target,
            .number-label.done,
            .number-label.selected {
                width: 21px;
                height: 21px;
                min-width: 21px;
                top: 112px;
                padding-top: 5px;
                font-size: 9px;
            }

            .jump-svg {
                height: 100px;
            }

            .jump-count {
                width: 19px;
                height: 19px;
                font-size: 10px;
            }

            .frog {
                width: 45px;
                height: 45px;
            }

            .number-line-instruction {
                font-size: 15px;
                margin-top: 4px;
            }
        }

        @media (min-width:601px) and (max-width:900px) {
            .number-line-area {
                padding: 4px 8px 2px;
            }

            .number-line-question {
                margin-bottom: 7px;
            }

            .number-line-question .equation {
                font-size: 30px;
            }

            .number-line-wrap {
                width: calc(100% - 20px);
                height: 205px;
            }

            .number-line {
                top: 115px;
            }

            .number-label {
                top: 137px;
                font-size: 11px;
            }

            .number-label.start,
            .number-label.target,
            .number-label.done,
            .number-label.selected {
                top: 133px;
                width: 24px;
                height: 24px;
                min-width: 24px;
                padding-top: 6px;
                font-size: 10px;
            }

            .jump-svg {
                height: 120px;
            }

            .frog {
                width: 52px;
                height: 52px;
            }

            .number-line-instruction {
                font-size: 18px;
            }
        }

        @media (min-width:901px) and (max-width:1440px) {
            .number-line-area {
                padding: 10px 20px 4px;
            }

            .number-line-question {
                margin-bottom: 10px;
                font-size: 30px;
            }

            .number-line-question .equation {
                font-size: 30px;
            }

            .number-line-wrap {
                width: calc(100% - 10px);
                height: 235px;
            }

            .number-line {
                top: 128px;
            }

            .number-label {
                top: 150px;
                font-size: 13px;
            }

            .number-label.start,
            .number-label.target,
            .number-label.done,
            .number-label.selected {
                top: 146px;
                width: 28px;
                height: 28px;
                min-width: 28px;
                padding-top: 7px;
                font-size: 12px;
            }

            .jump-svg {
                height: 138px;
            }

            .frog {
                width: 60px;
                height: 60px;
            }

            .number-line-instruction {
                font-size: 21px;
            }
        }

        @media (min-width:1441px) {
            .number-line-area {
                padding: 22px 40px 10px;
            }

            .number-line-question {
                margin-bottom: 16px;
                font-size: 40px;
            }

            .number-line-question .q-number {
                font-size: 40x;
            }

            .number-line-question .equation {
                font-size: 44px;
            }

            .number-line-question .answer {
                width: 96px;
                height: 58px;
            }

            .number-line-wrap {
                width: min(1650px, 100%);
                height: 300px;
            }

            .number-line {
                top: 170px;
            }

            .number-tick {
                top: -11px;
                height: 28px;
            }

            .number-label {
                top: 198px;
                font-size: 17px;
            }

            .number-label.start,
            .number-label.target,
            .number-label.done,
            .number-label.selected {
                top: 194px;
                width: 34px;
                height: 34px;
                min-width: 34px;
                padding-top: 8px;
                font-size: 14px;
            }

            .jump-svg {
                height: 180px;
            }

            .frog {
                width: 100px;
                height: 100px;
            }

            .number-line-instruction {
                font-size: 24px;
            }
        }

        /* =========================================================
   NAVIGATION
   ========================================================= */
        .navigation {
            flex: 0 0 auto;
            width: 100%;
            max-width: 1250px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 4px 0 0;
        }

        .nav-button {
            min-width: 150px;
            height: 50px;
            padding: 0 22px;
            border: 2px solid #8d73d0;
            border-radius: 15px;
            background: #fff;
            color: #60449e;
            font-size: clamp(16px, 1.35vw, 20px);
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 0 #d8caef;
            transition: .12s;
            margin-top: -20px !important;
        }

        .nav-button.next {
            background: #7153c1;
            color: #fff;
            border-color: #7153c1;
            box-shadow: 0 4px 0 #4e3994;
        }

        .nav-button:not(:disabled):hover {
            transform: translateY(-2px);
        }

        .nav-button:not(:disabled):active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #d8caef;
        }

        .nav-button.next:not(:disabled):active {
            box-shadow: 0 1px 0 #4e3994;
        }

        .nav-button:disabled {
            opacity: .38;
            cursor: not-allowed;
        }

        /* =========================================================
   FEEDBACK POPUPS — game style
   ========================================================= */
        .feedback {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            /* background: rgba(38, 31, 76, .35); */
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: .2s;
        }

        .feedback.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .feedback-card {
            position: relative;
            width: min(430px, 90vw);
            padding: 34px 26px 28px;
            text-align: center;
            border-radius: 28px;
            background: linear-gradient(180deg, #ffffff 0%, #fffdf6 100%);
            border: 5px solid #8d73d0;
            box-shadow: 0 20px 50px rgba(43, 31, 90, .32), inset 0 0 0 3px rgba(255, 255, 255, .6);
            overflow: hidden;
        }

        .feedback-card::before {
            content: "";
            position: absolute;
            top: -60%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, rgba(255, 255, 255, .55) 0%, transparent 60%);
            pointer-events: none;
        }

        .feedback-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 6px;
            background: radial-gradient(circle at 35% 30%, #ffffff, #f1eaff);
            box-shadow: 0 8px 18px rgba(70, 50, 120, .22), inset 0 0 0 4px rgba(255, 255, 255, .8);
        }

        .feedback-emoji {
            font-size: 58px;
            line-height: 1;
        }

        .feedback-title {
            margin: 8px 0 6px;
            color: #3f3278;
            font-size: 32px;
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: .3px;
        }

        .feedback-text {
            color: #59627a;
            font-size: 18px;
            line-height: 1.4;
            font-weight: 600;
        }

        .feedback.simple-correct .feedback-card {
            border-color: #4ec263;
            box-shadow: 0 20px 50px rgba(30, 120, 60, .32), inset 0 0 0 3px rgba(255, 255, 255, .6);
        }

        .feedback.simple-correct .feedback-badge {
            background: radial-gradient(circle at 35% 30%, #ffffff, #e4faea);
            box-shadow: 0 8px 18px rgba(35, 140, 70, .3), inset 0 0 0 4px rgba(255, 255, 255, .85);
        }

        .feedback.simple-correct .feedback-title {
            color: #2a9648;
        }

        .feedback.simple-wrong .feedback-card {
            border-color: #ed737c;
            box-shadow: 0 20px 50px rgba(150, 40, 50, .28), inset 0 0 0 3px rgba(255, 255, 255, .6);
        }

        .feedback.simple-wrong .feedback-badge {
            background: radial-gradient(circle at 35% 30%, #ffffff, #ffe7e8);
            box-shadow: 0 8px 18px rgba(200, 60, 70, .28), inset 0 0 0 4px rgba(255, 255, 255, .85);
        }

        .feedback.simple-wrong .feedback-title {
            color: #d64d58;
        }

        .feedback.simple-hint .feedback-card {
            border-color: #f0bd45;
            box-shadow: 0 20px 50px rgba(150, 110, 10, .25), inset 0 0 0 3px rgba(255, 255, 255, .6);
        }

        .feedback.simple-hint .feedback-badge {
            background: radial-gradient(circle at 35% 30%, #ffffff, #fff3d9);
            box-shadow: 0 8px 18px rgba(190, 140, 10, .28), inset 0 0 0 4px rgba(255, 255, 255, .85);
        }

        .feedback.simple-hint .feedback-title {
            color: #a36c00;
        }

        /* Final popup */
        .feedback.final-pop .feedback-card {
            width: min(540px, 92vw);
            border-color: #efc34d;
            padding: 40px 30px 32px;
            box-shadow: 0 24px 60px rgba(150, 110, 10, .32), inset 0 0 0 3px rgba(255, 255, 255, .6);
        }

        .feedback.final-pop .feedback-badge {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 35% 30%, #ffffff, #fff3d9);

        /* Popup animations */
        @keyframes correctPop {
            0% {
                transform: scale(.55) rotate(-4deg);
                opacity: 0
            }

            60% {
                transform: scale(1.08) rotate(2deg);
                opacity: 1
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1
            }
        }

        @keyframes wrongShake {

            0%,
            100% {
                transform: translateX(0)
            }

            20% {
                transform: translateX(-9px) rotate(-1.5deg)
            }

            40% {
                transform: translateX(9px) rotate(1.5deg)
            }

            60% {
                transform: translateX(-6px)

            80% {

        @keyframes badgePulse {

                transform: scale(1)
            }

            50% {

            }
        }

        .feedback.simple-correct .feedback-card,

        .feedback.simple-wrong .feedback-card {

<body>
    <div class="game-page">

        <header class="header">
            <button class="icon-button" id="homeButton" type="button" aria-label="Home">
                <img src="../assets/images/home.png" alt="Home">
                <span class="icon-label"></span>
            </button>

            <p class="title">Product Using the Number Line</p>

            <button class="icon-button" id="hintButton" type="button" aria-label="Hint">
                <img src="../assets/images/hint.png" alt="Hint">
                <span class="icon-label"></span>
            </button>
        </header>

        <main class="content">

            <section class="number-line-area" aria-label="Multiplication number line activity">
                <div class="number-line-question">
                    <div class="q-number" id="questionNumber">Q1.</div>
                    <div class="equation">
                        <span id="factorA">8</span>
                        <span>×</span>
                        <span id="factorB">2</span>
                        <span>=</span>
                        <div class="answer" id="answerBox"></div>
                    </div>
                </div>

                <div class="number-line-wrap" id="numberLineWrap">
                    <svg class="jump-svg" id="jumpSvg" aria-hidden="true">
                        <defs>
                            <marker id="numberArrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3"
                                orient="auto">
                                <path d="M0,0 L6,3 L0,6 Z" fill="#7153c1"></path>
                            </marker>
                        </defs>
                    </svg>

                    <div class="number-line" id="numberLine"></div>
                    <img class="frog" id="frog" src="../assets/images/frog.png" alt="Frog">
                </div>

                <div class="number-line-instruction" id="instruction">
                    Start at <strong>0</strong> and click the answer number.
                </div>
            </section>

            <nav class="navigation">
                <button class="nav-button" id="prevButton" type="button" disabled>← Previous</button>
                <button class="nav-button next" id="nextButton" type="button" disabled>Next →</button>
            </nav>

        </main>
    </div>

    <!-- SIMPLE FEEDBACK POPUP (correct / wrong / hint) -->
    <div class="feedback" id="feedback" aria-hidden="true">
        <div class="feedback-card">
            <div class="feedback-badge">
                <div class="feedback-emoji" id="feedbackEmoji">😊</div>
            </div>
            <h2 class="feedback-title" id="feedbackTitle">Correct!</h2>
            <p class="feedback-text" id="feedbackText">Great job!</p>
        </div>
    </div>

    <!-- FINAL POPUP -->
    <div class="feedback final-pop" id="finalFeedback" aria-hidden="true">
        <div class="feedback-card">
            <div class="feedback-badge">
                <div class="feedback-emoji">🎉</div>
            </div>
            <h2 class="feedback-title">Great Job!</h2>
            <p class="feedback-text">You completed all 5 questions.</p>
            <div class="final-score" id="finalScore">5 / 5</div>
            <br>
            <button class="play-again" id="playAgainButton" type="button">Play Again</button>
        </div>
    </div>

    <script>
        const data = [
            { a: 8, b: 2, result: 16, clue: "Start at 0. Make equal jumps on the number line — one jump for each group." },
            { a: 3, b: 5, result: 15, clue: "Start at 0. Each jump should be the same size. Count how many jumps you make." },
            { a: 4, b: 6, result: 24, clue: "Start at 0. Use the number line to show equal groups with repeated jumps." },
            { a: 7, b: 3, result: 21, clue: "Start at 0. Jump the same distance each time until you have made enough groups." }
        ];

        const qn = document.getElementById("questionNumber");
        const factorA = document.getElementById("factorA");
        const factorB = document.getElementById("factorB");
        const answerBox = document.getElementById("answerBox");
        const numberLineWrap = document.getElementById("numberLineWrap");
        const numberLine = document.getElementById("numberLine");
        const jumpSvg = document.getElementById("jumpSvg");
        const frog = document.getElementById("frog");
        const instruction = document.getElementById("instruction");

        const prev = document.getElementById("prevButton");
        const next = document.getElementById("nextButton");
        const fb = document.getElementById("feedback");
        const fe = document.getElementById("feedbackEmoji");
        const ft = document.getElementById("feedbackTitle");
        const fx = document.getElementById("feedbackText");
        const finalFb = document.getElementById("finalFeedback");
        const finalScore = document.getElementById("finalScore");
        const again = document.getElementById("playAgainButton");

        let current = 0;
        let completed = Array(data.length).fill(false);
        let answers = Array(data.length).fill("");
        let jumpAnimToken = 0;
        let timer;

        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function hide() {
            clearTimeout(timer);
            fb.className = "feedback";
            fb.setAttribute("aria-hidden", "true");
        }

        function launchConfetti(count) {
            const colors = ["#ff8cab", "#8a78ed", "#65cbd2", "#ffd26e", "#8fd9a8", "#7153c1"];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement("span");
                piece.className = "confetti-piece";
                piece.style.left = `${Math.random() * 100}vw`;
                piece.style.width = "10px";
                piece.style.height = "16px";
                piece.style.background = colors[i % colors.length];
                piece.style.animationDelay = `${Math.random() * .4}s`;
                piece.style.transform = `rotate(${Math.random() * 180}deg)`;
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 2200);
            }
        }

        function correctPopup() {
            fb.className = "feedback show simple-correct";
            fe.textContent = "😊";
            ft.textContent = "Correct!";
            fx.textContent = "Great job!";
            fb.setAttribute("aria-hidden", "false");
            launchConfetti(45);
            timer = setTimeout(hide, 900);
        }

        function wrongPopup() {
            fb.className = "feedback show simple-wrong";
            fe.textContent = "😕";
            ft.textContent = "Try Again!";
            fx.textContent = "Choose the correct answer.";
            fb.setAttribute("aria-hidden", "false");
            timer = setTimeout(hide, 650);
        }

        function hintPopup() {
            clearTimeout(timer);
            fb.className = "feedback show simple-hint";
            fe.textContent = "💡";
            ft.textContent = "Hint";
            fx.textContent = data[current].clue;
            fb.setAttribute("aria-hidden", "false");
            timer = setTimeout(hide, 2600);
        }

        function getX(value) {
            const width = numberLineWrap.clientWidth;
            const usable = width - 24;
            return 12 + (value / 30) * usable;
        }

        function getLineY() {
            const line = numberLine.getBoundingClientRect();
            const wrap = numberLineWrap.getBoundingClientRect();
            return line.top - wrap.top;
        }

        function clearVisuals() {
            jumpSvg.querySelectorAll(".jump-arc").forEach(el => el.remove());
            numberLineWrap.querySelectorAll(".number-label, .jump-count").forEach(el => el.remove());
        }

        function drawJumpArcs(q) {
            for (let step = 1; step <= q.b; step++) {
                const from = (step - 1) * q.a;
                const to = step * q.a;
                makeArc(from, to, step);
            }
        }

        function restoreCompletedState(q) {
            const savedAnswer = answers[current] || q.result;

            answerBox.textContent = savedAnswer;
            answerBox.classList.add("filled");
            instruction.innerHTML =
                `Great! <strong>${q.a} × ${q.b} = ${q.result}</strong>`;

            drawJumpArcs(q);
            positionFrog(q.result, false);

            const resultLabel = numberLineWrap.querySelector(
                `.number-label[data-value="${q.result}"]`
            );

            if (resultLabel) {
                resultLabel.classList.add("done");
            }
        }

        function applyQuestionState(q) {
            if (completed[current]) {
                restoreCompletedState(q);
                return;
            }

            const savedAnswer = answers[current];
            answerBox.textContent = savedAnswer === "" ? "" : savedAnswer;
            answerBox.classList.toggle("filled", savedAnswer !== "");
            instruction.innerHTML =
                `Start at <strong>0</strong> and click the answer number.`;
            positionFrog(0, false);
        }

        function createNumberLine(q) {
            jumpAnimToken++;
            clearVisuals();
            numberLine.innerHTML = "";
            frog.classList.remove("jumping");

            for (let n = 0; n <= 30; n++) {
                const tick = document.createElement("span");
                tick.className = "number-tick";
                tick.style.left = `${(n / 30) * 100}%`;
                numberLine.appendChild(tick);

                const label = document.createElement("span");
                label.className = "number-label";
                label.dataset.value = n;
                label.textContent = n;
                label.style.left = `${(n / 30) * 100}%`;

                if (n === 0) label.classList.add("start");

                label.addEventListener("click", () => handleNumberClick(n));
                numberLineWrap.appendChild(label);
            }

            requestAnimationFrame(() => {
                applyQuestionState(q);
            });
        }

        function positionFrog(value, jumping) {
            frog.style.left = `${getX(value)}px`;
            frog.style.top = `${getLineY() - 4}px`;

            if (jumping) {
                frog.classList.remove("jumping");
                void frog.offsetWidth;
                frog.classList.add("jumping");
            }
        }

        function makeArc(from, to, stepNumber) {
            const x1 = getX(from);
            const x2 = getX(to);
            const y = getLineY();
            const distance = Math.abs(x2 - x1);

            const peak = Math.max(
                window.innerWidth >= 1441 ? 115 :
                    window.innerWidth >= 901 ? 90 :
                        window.innerWidth >= 601 ? 70 : 42,
                Math.min(
                    window.innerWidth >= 1441 ? 165 :
                        window.innerWidth >= 901 ? 135 :
                            window.innerWidth >= 601 ? 105 : 62,
                    distance * 1.35
                )
            );

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.classList.add("jump-arc");
            path.setAttribute("d",
                `M ${x1} ${y}
         C ${x1} ${y - peak},
           ${x2} ${y - peak},
           ${x2} ${y}`
            );
            jumpSvg.appendChild(path);

            const count = document.createElement("div");
            count.className = "jump-count";
            count.textContent = stepNumber;
            count.style.left = `${(x1 + x2) / 2}px`;
            count.style.top = `${y - peak - 27}px`;
            numberLineWrap.appendChild(count);

            requestAnimationFrame(() => {
                path.classList.add("show");
                count.classList.add("show");
            });
        }

        async function animateJumps(q, token) {
            for (let step = 1; step <= q.b; step++) {
                if (token !== jumpAnimToken) return;

                const from = (step - 1) * q.a;
                const to = step * q.a;

                makeArc(from, to, step);
                positionFrog(to, true);

                await new Promise(resolve => setTimeout(resolve, 340));
            }

            if (token !== jumpAnimToken) return;

            const targetLabel = numberLineWrap.querySelector(
                `.number-label[data-value="${q.result}"]`
            );

            if (targetLabel) {
                targetLabel.classList.remove("target");
                targetLabel.classList.add("done");
            }
        }

        function handleNumberClick(value) {
            if (completed[current]) return;

            const q = data[current];
            const clickedLabel = numberLineWrap.querySelector(
                `.number-label[data-value="${value}"]`
            );

            if (clickedLabel) {
                numberLineWrap.querySelectorAll(".number-label.selected")
                    .forEach(el => el.classList.remove("selected"));
                clickedLabel.classList.add("selected");
            }

            if (value !== q.result) {
                answers[current] = "";
                answerBox.textContent = "";
                answerBox.classList.remove("filled");
                wrongPopup();
                speak("wrong");

                setTimeout(() => {
                    if (clickedLabel) clickedLabel.classList.remove("selected");
                }, 650);
                return;
            }

            answers[current] = value;
            answerBox.textContent = value;
            answerBox.classList.add("filled");

            if (clickedLabel) {
                clickedLabel.classList.remove("selected", "target");
                clickedLabel.classList.add("done");
            }

            instruction.innerHTML =
                `Making <strong>${q.b}</strong> jumps of <strong>${q.a}</strong>...`;

            const questionIndex = current;
            const token = jumpAnimToken;

            animateJumps(q, token).then(() => {
                if (questionIndex !== current || token !== jumpAnimToken) return;

                completed[current] = true;

                const resultLabel = numberLineWrap.querySelector(
                    `.number-label[data-value="${q.result}"]`
                );

                if (resultLabel) {
                    resultLabel.classList.remove("target", "selected");
                    resultLabel.classList.add("done");
                }

                instruction.innerHTML =
                    `Great! <strong>${q.a} × ${q.b} = ${q.result}</strong>`;

                updateNavigation();

                speak("correct");
                correctPopup();

                if (current === data.length - 1) {
                    setTimeout(() => {
                        hide();
                        finalScore.textContent = "4 / 4";
                        finalFb.className = "feedback final-pop show";
                        finalFb.setAttribute("aria-hidden", "false");
                        launchConfetti(120);
                    }, 900);
                }
            });
        }

        function updateNavigation() {
            prev.disabled = current === 0;
            next.disabled = !completed[current] || current === data.length - 1;
        }

        function render() {
            const q = data[current];

            qn.textContent = `Q${current + 1}.`;
            factorA.textContent = q.a;
            factorB.textContent = q.b;

            selected = null;
            createNumberLine(q);
            updateNavigation();
        }

        function resetGame() {
            clearTimeout(timer);
            hide();
            speechSynthesis.cancel();
            document.querySelectorAll(".confetti-piece").forEach(el => el.remove());
            jumpAnimToken++;

            current = 0;
            completed = Array(data.length).fill(false);
            answers = Array(data.length).fill("");
            selected = null;

            finalFb.className = "feedback final-pop";
            finalFb.setAttribute("aria-hidden", "true");

            answerBox.textContent = "";
            answerBox.classList.remove("filled");
            instruction.innerHTML =
                `Start at <strong>0</strong> and click the answer number.`;

            render();
        }

        let selected = null;

        next.addEventListener("click", () => {
            if (!next.disabled) {
                current++;
                render();
            }
        });

        prev.addEventListener("click", () => {
            if (!prev.disabled) {
                current--;
                render();
            }
        });

        document.getElementById("hintButton").addEventListener("click", hintPopup);

        document.getElementById("homeButton").addEventListener("click", () => {
            window.top.location.href = "../Grade2_chapter5.html";
        });

        again.addEventListener("click", resetGame);

        window.addEventListener("resize", () => {
            createNumberLine(data[current]);
        });

        render();
    </script>
</body>

</html>
