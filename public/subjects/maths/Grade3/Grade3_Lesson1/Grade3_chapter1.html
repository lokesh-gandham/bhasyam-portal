<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Math Marvels · Kids Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="../assets/shared/quiz-ui.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      height: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    body {
      font-weight: 600;
      color: #2c2344;
      min-height: 100%;
      background: radial-gradient(circle at 10% 15%, #fef3e8 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, #e7f0ff 0%, transparent 40%),
        radial-gradient(circle at 85% 90%, #e0fff0 0%, transparent 40%),
        radial-gradient(circle at 12% 88%, #ffe7f0 0%, transparent 40%),
        #f5f2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 2.5vw, 30px);
      position: relative;
    }

    .page {
      width: 100%;
      max-width: 1280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(20px, 2.8vw, 32px);
    }

    /* ----- HEADER : two-line "Kids Learning" + "Math Playground" ----- */
    .title-block {
      text-align: center;
      line-height: 1.1;
    }

    .title-block .kids {
      font-size: 60px;
      font-weight: 600;
      color: #3300be;
      background-clip: text;
      letter-spacing: 2px;
      text-shadow: 0 8px 18px rgba(90, 40, 180, 0.12);
      display: block;
      margin-bottom: 10px;
    }

    .title-block .math {
      font-size: 35px;
      font-weight: 600;
      color: #ff7f9f;
      background: linear-gradient(135deg, #ff7f9f 0%, #ff4d7a 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
      display: block;
      margin-top: -6px;
      text-shadow: 0 6px 14px rgba(255, 80, 120, 0.2);
    }

    .title-block .math i {
      -webkit-text-fill-color: initial;
      color: #fbbf24;
      font-size: 0.8em;
      margin: 0 4px;
    }

    /* ----- stage: arrows & viewport ----- */
    .stage {
      width: 100%;
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.6vw, 24px);
    }

    .arrow {
      flex: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #ffffffdd;
      backdrop-filter: blur(4px);
      color: #4f2f9c;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 22px -10px rgba(70, 30, 150, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.4);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background 0.2s, visibility 0s;
    }

    /* hide arrows on first/last page while keeping layout stable */
    .arrow.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .arrow:hover {
      background: linear-gradient(145deg, #a77aff, #6a33d0);
      color: #fff;
      transform: scale(1.12) translateY(-2px);
      box-shadow: 0 18px 28px -10px #582fbb, 0 0 0 2px rgba(255, 255, 255, 0.5);
    }

    .arrow:active {
      transform: scale(0.94);
    }

    .viewport {
      flex: 1;
      min-width: 0;
      padding: 8px 0;
    }

    .track {
      display: flex;
      justify-content: center;
      gap: clamp(16px, 2vw, 28px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .track.swap {
      opacity: 0;
      transform: scale(0.96) translateY(6px);
    }

    /* ----- 3D CARD – 4 fixed colors, repeating pattern, soft 3D + cut effect ----- */
    .card {
      --bg: #fcf6ff;
      --mid: #bb9aff;
      --dark: #7d4be0;
      flex: 0 0 calc((100% - (var(--items, 4) - 1) * 24px) / var(--items, 4));
      max-width: 290px;
      min-width: 160px;
      background: var(--bg);
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 30px -12px rgba(60, 30, 120, 0.25),
        0 6px 12px -6px rgba(0, 0, 0, 0.05),
        inset 0 -2px 0 rgba(255, 255, 255, 0.5);
      transform: perspective(1200px) rotateX(2deg) rotateY(0deg) translateZ(0);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.3s ease,
        margin-top 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.7);
      position: relative;
    }

    /* 3D lift + cut-out illusion on hover */
    .card:hover {
      transform: perspective(1200px) rotateX(0deg) rotateY(4deg) translateZ(18px) translateY(-10px);
      box-shadow: 0 40px 50px -20px rgba(70, 30, 150, 0.45),
        0 10px 20px -10px rgba(0, 0, 0, 0.1),
        inset 0 -2px 0 rgba(255, 255, 255, 0.8);
      border-color: rgba(255, 255, 255, 0.9);
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 32px;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
      opacity: 0.6;
      transition: opacity 0.3s;
    }

    .card:hover::after {
      opacity: 1;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7), 0 0 0 2px rgba(160, 120, 255, 0.15);
    }

    .card-head {
      position: relative;
      height: 118px;
      background: linear-gradient(145deg, var(--mid), var(--dark));
      display: flex;
      justify-content: center;
      flex: none;
      border-bottom: 2px solid rgba(255, 255, 255, 0.5);
    }

    .lvl {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(4px);
      color: var(--dark);
      font-size: 16px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 30px;
      box-shadow: 0 4px 8px -3px rgba(0, 0, 0, 0.1);
      letter-spacing: 0.3px;
    }

    .avatar {
      position: absolute;
      bottom: -30px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid #fff;
      box-shadow: 0 12px 20px -10px rgba(40, 10, 80, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: var(--dark);
      transition: transform 0.2s ease;
    }

    .card:hover .avatar {
      transform: scale(1.05) rotate(-3deg);
    }

    .card-body {
      padding: 46px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      flex: 1;
      background: var(--bg);
    }

    .card-body h3 {
      font-size: 20px;
      font-weight: 500;
      color: #1f173a;
      line-height: 1.3;
      min-height: 2.6em;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.2px;
    }

    .card-body .tag {
      font-weight: 800;
      font-size: 12px;
      color: var(--dark);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(2px);
      padding: 4px 14px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .btn-row {
      width: 100%;
      margin-top: auto;
      padding-top: 14px;
    }

    .play-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-align: center;
      font-size: 17px;
      font-weight: 400;
      text-decoration: none;
      color: #fff;
      padding: 14px 10px;
      border-radius: 60px;
      background: linear-gradient(145deg, var(--mid), var(--dark));
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .play-btn i {
      font-size: 15px;
    }

    .play-btn:hover {
      transform: translateY(-4px) scale(1.02);
    }

    .play-btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* ----- footer: modern dots + page count ----- */
    .nav-info {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #ffffffdd;
      backdrop-filter: blur(6px);
      padding: 12px 28px;
      border-radius: 80px;
      box-shadow: 0 16px 28px -14px rgba(55, 30, 110, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .page-count {
      font-weight: 700;
      font-size: 16px;
      color: #4f2f9c;
      white-space: nowrap;
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 40px;
      background: #d6cbf5;
      cursor: pointer;
      border: none;
      padding: 0;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
    }

    .dot:hover {
      background: #b9a3f0;
      transform: scale(1.2);
    }

    .dot.active {
      width: 38px;
      background: linear-gradient(135deg, #9f77f0, #6a33d0);
      box-shadow: 0 6px 14px -4px #6a33d0, 0 0 0 2px rgba(255, 255, 255, 0.3);
    }

    /* ===== Quiz overlay (iframe + home/back button) ===== */
    .quiz-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      z-index: 1000;
      display: none;
    }

    .quiz-overlay.active {
      display: block;
    }

    .quiz-iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: linear-gradient(180deg, #fffcf2 0%, #fffbea 100%);
    }

    /* positioned absolute relative to the body/viewport, on the right side */
    .quiz-home-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #a77aff, #6a33d0);
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1001;
      box-shadow: 0 12px 22px -10px rgba(70, 30, 150, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.5);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .quiz-home-btn:hover {
      transform: scale(1.1) translateY(-2px);
      box-shadow: 0 18px 28px -10px #582fbb, 0 0 0 2px rgba(255, 255, 255, 0.6);
    }

    .quiz-home-btn:active {
      transform: scale(0.94);
    }

    @media (max-width: 640px) {
      .quiz-home-btn {
        top: 12px;
        right: 12px;
        width: 46px;
        height: 46px;
        font-size: 18px;
      }
    }

    /* responsiveness */
    @media (max-width: 900px) {
      .arrow {
        width: 46px;
        height: 46px;
        font-size: 17px;
      }
    }

    @media (max-width: 640px) {
      body {
        align-items: flex-start;
      }

      .arrow {
        width: 40px;
        height: 40px;
        font-size: 14px;
      }

      .nav-info {
        padding: 10px 16px;
        gap: 12px;
      }

      .title-block .kids {
        font-size: 32px;
      }

      .title-block .math {
        font-size: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .card,
      .arrow,
      .track {
        transition: none;
      }

      .card:hover {
        transform: none;
      }
    }


    /* =========================================================
   1920px MONITOR / LARGE DESKTOP
   ========================================================= */
    @media (min-width: 1600px) {

      body {
        padding: 30px 50px;
      }

      .page {
        width: min(92vw, 1680px);
        max-width: 1680px;
        gap: 34px;
      }

      /* Bigger heading on large monitors */
      .title-block .kids {
        font-size: 72px;
        letter-spacing: 2px;
        margin-bottom: 8px;
      }

      .title-block .math {
        font-size: 42px;
        letter-spacing: 1px;
      }

      /* Stage uses more available screen width */
      .stage {
        width: 100%;
        gap: 30px;
      }

      /* Larger navigation arrows */
      .arrow {
        width: 64px;
        height: 64px;
        font-size: 23px;
      }

      /* More space between cards */
      .track {
        gap: 28px;
      }

      /* Larger cards */
      .card {
        max-width: 360px;
        min-width: 220px;
        border-radius: 34px;
      }

      .card-head {
        height: 140px;
      }

      .lvl {
        top: 14px;
        right: 14px;
        font-size: 18px;
        padding: 5px 14px;
      }

      .avatar {
        width: 86px;
        height: 86px;
        bottom: -36px;
        font-size: 38px;
        border-width: 5px;
      }

      .card-body {
        padding: 54px 20px 24px;
        gap: 8px;
      }

      .card-body h3 {
        font-size: 23px;
        min-height: 2.6em;
      }

      .card-body .tag {
        font-size: 13px;
        padding: 5px 16px;
      }

      .btn-row {
        padding-top: 18px;
      }

      .play-btn {
        font-size: 19px;
        padding: 16px 12px;
      }

      .play-btn i {
        font-size: 17px;
      }

      /* Bottom navigation */
      .nav-info {
        padding: 14px 30px;
        gap: 22px;
      }

      .page-count {
        font-size: 18px;
      }

      .dots {
        gap: 11px;
      }

      .dot {
        width: 15px;
        height: 15px;
      }

      .dot.active {
        width: 42px;
      }
    }

    /* =========================================================
   EXACT 1920px MONITOR OPTIMIZATION
   ========================================================= */
    @media (min-width: 1900px) {

      body {
        padding: 35px 60px;
      }

      .page {
        width: 1740px;
        max-width: 1740px;
        gap: 38px;
      }

      .title-block .kids {
        font-size: 78px;
      }

      .title-block .math {
        font-size: 46px;
      }

      .stage {
        gap: 34px;
      }

      .arrow {
        width: 68px;
        height: 68px;
        font-size: 25px;
      }

      .track {
        gap: 30px;
      }

      .card {
        max-width: 390px;
        min-width: 250px;
        border-radius: 36px;
      }

      .card-head {
        height: 150px;
      }

      .avatar {
        width: 92px;
        height: 92px;
        bottom: -39px;
        font-size: 40px;
      }

      .card-body {
        padding: 58px 22px 26px;
      }

      .card-body h3 {
        font-size: 25px;
      }

      .card-body .tag {
        font-size: 14px;
      }

      .play-btn {
        font-size: 20px;
        padding: 17px 14px;
      }

      .nav-info {
        padding: 15px 32px;
      }

      .page-count {
        font-size: 19px;
      }
    }
  </style>
  <link rel="stylesheet" href="../shared/grade3-chapter1.css">
</head>

<body>
  <div class="page">

    <!-- header: two-line "Kids Learning" + "Math Playground" -->
    <div class="title-block">
      <span class="kids">Kids Learning</span>
      <span class="math">Math Playground</span>
    </div>

    <div class="stage">
      <button class="arrow left" id="prevBtn" aria-label="Previous games">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div class="viewport">
        <div class="track" id="track"></div>
      </div>
      <button class="arrow right" id="nextBtn" aria-label="Next games">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <div class="nav-info">
      <span class="page-count" id="pageCount">Page 1 of 7</span>
      <div class="dots" id="dots"></div>
    </div>

  </div>

  <!-- Quiz overlay: opens the clicked game in an iframe over the whole page -->
  <div class="quiz-overlay" id="quizOverlay">
    <button class="quiz-home-btn" id="quizHomeBtn" aria-label="Back to home">
      <i class="fa-solid fa-house"></i>
    </button>
    <iframe class="quiz-iframe" id="quizFrame" title="Quiz" src="about:blank"></iframe>
  </div>

  <script>
    const games = [
      { icon: 'fa-puzzle-piece', title: 'Join the Dots', tag: 'Puzzle Game', href: './exercises/map.html' },
      { icon: 'fa-circle-dot', title: 'Draw Abacus Beads', tag: 'Abacus Game', href: './exercises/abacus.html' },
      { icon: 'fa-scale-balanced', title: 'Correct Symbols', tag: 'Compare Numbers', href: './exercises/correct-symbols.html' },
      { icon: 'fa-cubes-stacked', title: 'Build the Number', tag: 'Base Ten Blocks', href: './exercises/base-ten.html' },
      { icon: 'fa-eye', title: 'Read the Abacus', tag: 'Abacus & Number Names', href: './exercises/abacus-number.html' },
      { icon: 'fa-pencil', title: 'Build the Abacus', tag: 'Abacus Practice', href: './exercises/build-abacus.html' },
      { icon: 'fa-calculator', title: 'Numbers & Even Odd', tag: 'Number Practice', href: './exercises/numeration.html' },
      { icon: 'fa-circle-half-stroke', title: 'Even or Odd', tag: 'Number Sense', href: './exercises/even-odd.html' },
      { icon: 'fa-hashtag', title: 'Form Numbers', tag: 'Number Builder', href: './exercises/form-numbers.html' },
      { icon: 'fa-less-than', title: 'Less Than', tag: 'Number Comparison', href: './exercises/less-than.html' },
      { icon: 'fa-arrow-up', title: 'Find the Greater Number', tag: 'Number Comparison', href: './exercises/greater-than.html' },
      { icon: 'fa-arrows-up-down', title: 'Predecessor & Successor', tag: 'Number Sense', href: './exercises/predecessor-successor.html' },
      { icon: 'fa-list-check', title: 'Place & Face Value', tag: 'MCQ Quiz', href: './exercises/mcq.html' },
      { icon: 'fa-calculator', title: 'Standard Form', tag: 'Number Builder', href: './exercises/standard-form.html' },
      { icon: 'fa-table-cells', title: 'Number Formed', tag: 'Place Value', href: './exercises/build-number.html' },
      { icon: 'fa-scale-balanced', title: 'Compare Numbers', tag: 'Number Comparison', href: './exercises/compare-numbers.html' },
      { icon: 'fa-ranking-star', title: 'Greatest & Smallest', tag: 'Number Ordering', href: './exercises/greatest-smallest.html' },
      { icon: 'fa-shuffle', title: 'Arrange the Digits', tag: 'Number Builder', href: './exercises/smallest-greatest.html' },
      { icon: 'fa-arrows-to-circle', title: 'Round to Nearest Ten', tag: 'Rounding', href: './exercises/round-nearest-ten.html' },
      { icon: 'fa-pen-to-square', title: 'Write Roman Numerals', tag: 'Roman Numerals', href: './exercises/roman-numerals.html' },
      { icon: 'fa-right-left', title: 'Roman to Number', tag: 'Roman Numerals', href: './exercises/roman-to-number.html' },
      { icon: 'fa-clock', title: 'Read the Clock', tag: 'Time Telling', href: './exercises/read-clock.html' },
      { icon: 'fa-scale-balanced', title: 'Compare Roman Numerals', tag: 'Roman Numerals', href: './exercises/compare-roman-numerals.html' },
      { icon: 'fa-eraser', title: 'Before After Roman', tag: 'Number Sense', href: './exercises/before-after-roman.html' },
    ];

    // 4 fixed color sets – repeat pattern every 4 cards
    const fixedThemes = [
      ['#faf0ff', '#bb9aff', '#7d4be0'],
      ['#fef6e6', '#ffbe6e', '#d98c2e'],
      ['#ebfaff', '#7fc9ff', '#2f8ed9'],
      ['#f3fce8', '#a5d88a', '#4f9d3a'],
    ];

    const track = document.getElementById('track');
    const dotsBox = document.getElementById('dots');
    const pageCountEl = document.getElementById('pageCount');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const quizOverlay = document.getElementById('quizOverlay');
    const quizFrame = document.getElementById('quizFrame');
    const quizHomeBtn = document.getElementById('quizHomeBtn');

    let itemsPerView = 4;
    let currentPage = 0;

    function computeItemsPerView() {
      const w = window.innerWidth;
      if (w >= 1400) return 4;
      if (w >= 1100) return 4;
      if (w >= 860) return 3;
      if (w >= 600) return 2;
      return 1;
    }

    function totalPages() {
      return Math.ceil(games.length / itemsPerView);
    }

    function cardHtml(game, indexInAll) {
      // cycle through 4 fixed themes
      const theme = fixedThemes[indexInAll % 4];
      return `
      <article class="card" style="--bg:${theme[0]};--mid:${theme[1]};--dark:${theme[2]}">
        <div class="card-head">
          <span class="lvl">#${indexInAll + 1}</span>
          <span class="avatar"><i class="fa-solid ${game.icon}"></i></span>
        </div>
        <div class="card-body">
          <h3>${game.title}</h3>
          <span class="tag">${game.tag}</span>
          <div class="btn-row">
            <a class="play-btn" href="${game.href}" data-href="${game.href}">Play <i class="fa-solid fa-play"></i></a>
          </div>
        </div>
      </article>`;
    }

    function renderDots() {
      const pages = totalPages();
      dotsBox.innerHTML = '';
      for (let i = 0; i < pages; i++) {
        const b = document.createElement('button');
        b.className = 'dot' + (i === currentPage ? ' active' : '');
        b.setAttribute('aria-label', 'Go to page ' + (i + 1));
        b.addEventListener('click', () => goToPage(i));
        dotsBox.appendChild(b);
      }
    }

    function renderTrack() {
      track.style.setProperty('--items', itemsPerView);
      const start = currentPage * itemsPerView;
      const slice = games.slice(start, start + itemsPerView);
      track.innerHTML = slice.map((g, i) => cardHtml(g, start + i)).join('');
    }

    // show/hide the prev/next arrows on the first/last page
    function updateArrows() {
      const pages = totalPages();
      prevBtn.classList.toggle('is-hidden', currentPage === 0);
      nextBtn.classList.toggle('is-hidden', currentPage >= pages - 1);
    }

    function render(withTransition) {
      const pages = totalPages();
      pageCountEl.textContent = `Page ${currentPage + 1} of ${pages}`;
      updateArrows();
      if (!withTransition) {
        renderTrack();
        renderDots();
        return;
      }
      track.classList.add('swap');
      setTimeout(() => {
        renderTrack();
        renderDots();
        track.classList.remove('swap');
      }, 200);
    }

    function goToPage(i) {
      const pages = totalPages();
      // clamp instead of wrap, since the arrows are hidden at the boundaries
      if (i < 0 || i >= pages) return;
      currentPage = i;
      render(true);
    }

    // ----- Quiz overlay: open a game in an iframe, come back to the same page -----
    function openQuiz(href) {
      quizFrame.src = href;
      quizOverlay.classList.add('active');
    }

    function closeQuiz() {
      quizOverlay.classList.remove('active');
      quizFrame.src = 'about:blank';
      // currentPage was never changed while the quiz was open,
      // so the grid is still showing the exact page the quiz was opened from.
    }

    // event delegation: catches Play buttons even after the track re-renders
    track.addEventListener('click', (e) => {
      const btn = e.target.closest('.play-btn');
      if (!btn) return;
      e.preventDefault();
      openQuiz(btn.dataset.href);
    });

    quizHomeBtn.addEventListener('click', closeQuiz);

    document.getElementById('nextBtn').addEventListener('click', () => goToPage(currentPage + 1));
    document.getElementById('prevBtn').addEventListener('click', () => goToPage(currentPage - 1));

    document.addEventListener('keydown', (e) => {
      if (quizOverlay.classList.contains('active')) {
        if (e.key === 'Escape') closeQuiz();
        return;
      }
      if (e.key === 'ArrowRight') goToPage(currentPage + 1);
      if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const newItems = computeItemsPerView();
        if (newItems !== itemsPerView) {
          const firstVisibleIndex = currentPage * itemsPerView;
          itemsPerView = newItems;
          currentPage = Math.floor(firstVisibleIndex / itemsPerView);
          render(false);
        }
      }, 120);
    });

    itemsPerView = computeItemsPerView();
    render(false);
  </script>
</body>

</html>
