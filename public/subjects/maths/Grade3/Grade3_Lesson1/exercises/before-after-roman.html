<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roman Numeral Before After Between</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1060px;
      min-height: 610px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* =========================================
       HEADING
    ========================================= */

    .quiz-heading {
      text-align: center;
      margin-bottom: 24px;
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #12265d;
      font-size: 29px;
      line-height: 1.1;
      font-weight: 800;
    }

    .heading-icon {
      font-size: 27px;
      animation: wiggle 2.5s ease-in-out infinite;
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-6deg) scale(1);
      }

      50% {
        transform: rotate(6deg) scale(1.08);
      }
    }

    /* =========================================
       QUESTION AREA
       No card design
    ========================================= */

    .question-stage {
      width: min(900px, 100%);
      min-height: 350px;
      margin: 0 auto;
      padding: 10px 40px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .question-stage:before {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      left: -125px;
      top: -115px;
      border-radius: 50%;
      background: #fff4df;
      pointer-events: none;
    }

    .question-stage:after {
      content: "";
      position: absolute;
      width: 250px;
      height: 130px;
      right: -125px;
      bottom: -75px;
      border-radius: 50%;
      background: #eef6ff;
      pointer-events: none;
    }

    /* =========================================
       QUESTION TITLE
    ========================================= */

    .question-line {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      position: relative;
      z-index: 3;
      margin-bottom: 38px;
    }

    .question-letter {
      font-size: 35px;
      color: #172b55;
      font-weight: 800;
    }

    .question-title {
      font-size: 27px;
      color: #5c6980;
      font-weight: 700;
    }

    /* =========================================
       QUESTION CONTENT
    ========================================= */

    .question-content {
      position: relative;
      z-index: 3;
      width: min(780px, 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .number-sequence {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 90px;
    }

    .roman-number {
      color: #172b55;
      font-size: 35px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* =========================================
       BIGGER DROP BOX
    ========================================= */

    .drop-zone {
      width: 132px;
      height: 62px;
      border: 3px dashed #8d98a8;
      border-radius: 14px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #172b55;
      font-size: 28px;
      font-weight: 800;
      position: relative;
      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }

    .drop-zone::before,
    .drop-zone::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d8dee6;
    }

    .drop-zone::before {
      left: 9px;
      top: 9px;
    }

    .drop-zone::after {
      right: 9px;
      bottom: 9px;
    }

    .drop-zone.empty {
      background:
        radial-gradient(circle, #e7ebf0 1.5px, transparent 1.5px);
      background-size: 10px 10px;
    }

    .drop-zone.empty::before,
    .drop-zone.empty::after {
      opacity: .7;
    }

    .drop-zone.drag-over {
      transform: scale(1.08);
      border-color: #6f7fe8;
      border-style: solid;
      background: #f3f4ff;
      box-shadow:
        0 0 0 5px rgba(111, 127, 232, .12),
        0 7px 0 #d8dcf4;
    }

    .drop-zone.filled {
      border-style: solid;
      border-color: #62a66d;
      background: #f4fbf5;
      color: #397447;
      box-shadow:
        0 6px 0 #c7dfcb,
        0 8px 16px rgba(70, 130, 80, .12);
      animation: dropPop .35s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes dropPop {
      from {
        transform: scale(.72);
        opacity: .5;
      }

      70% {
        transform: scale(1.08);
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* =========================================
       OPTION LABEL
    ========================================= */

    .options-title {
      position: relative;
      z-index: 3;
      margin-top: 34px;
      margin-bottom: 13px;
      color: #7a8495;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    /* =========================================
       NEW OPTION DESIGN
       PLAYFUL INDEPENDENT BUTTONS
    ========================================= */

    .drag-options {
      position: relative;
      z-index: 5;
      width: min(560px, 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .drag-option {
      height: 70px;
      border: 3px solid #d9dde4;
      border-radius: 14px 26px 14px 26px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #273653;
      background: #fff;

      font-size: 30px;
      font-weight: 900;
      line-height: 1;

      cursor: grab;
      user-select: none;
      -webkit-user-select: none;

      position: relative;
      overflow: hidden;

      box-shadow:
        0 5px 0 #cbd0d8,
        0 9px 14px rgba(37, 48, 68, .08);

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease,
        border-color .18s ease;
    }

    /* Small decorative top highlight */
    .drag-option::before {
      content: "";
      position: absolute;
      top: 7px;
      left: 14px;
      width: 34px;
      height: 6px;
      border-radius: 999px;
      background: #e5e8ed;
      pointer-events: none;
    }

    /* Small decorative dot */
    .drag-option::after {
      content: "•";
      position: absolute;
      right: 12px;
      bottom: 5px;
      font-size: 18px;
      color: #d7dce3;
      pointer-events: none;
    }

    /* Soft cream */
    .drag-option:nth-child(1) {
      background: #fff8e8;
      border-color: #f1d58d;
      box-shadow:
        0 5px 0 #ddc27c,
        0 9px 14px rgba(190, 155, 60, .10);
    }

    /* Soft mint */
    .drag-option:nth-child(2) {
      background: #eef9f2;
      border-color: #a9d5b4;
      box-shadow:
        0 5px 0 #8dbd99,
        0 9px 14px rgba(70, 140, 85, .10);
    }

    /* Soft lavender */
    .drag-option:nth-child(3) {
      background: #f4efff;
      border-color: #c8b8ed;
      box-shadow:
        0 5px 0 #ad9bd8,
        0 9px 14px rgba(110, 80, 170, .10);
    }

    .drag-option:hover:not(:disabled) {
      transform: translateY(-5px) rotate(-1deg);

      box-shadow:
        0 8px 0 #cbd0d8,
        0 13px 18px rgba(37, 48, 68, .12);
    }

    .drag-option:nth-child(2):hover:not(:disabled) {
      transform: translateY(-5px) rotate(1deg);
    }

    .drag-option:nth-child(3):hover:not(:disabled) {
      transform: translateY(-5px) rotate(-1deg);
    }

    .drag-option:active:not(:disabled) {
      cursor: grabbing;
      transform: translateY(3px) !important;
      box-shadow:
        0 2px 0 #cbd0d8,
        0 4px 7px rgba(37, 48, 68, .08);
    }

    .drag-option:disabled {
      cursor: default;
    }

    /* =========================================
       CORRECT OPTION
    ========================================= */

    .drag-option.correct {
      background: #e9f8ec !important;
      border-color: #62a66d !important;
      color: #347342 !important;

      box-shadow:
        0 6px 0 #82b58a,
        0 0 22px rgba(75, 180, 90, .25) !important;

      animation:
        correctGood .45s cubic-bezier(.175, .885, .32, 1.275) !important;
    }

    @keyframes correctGood {
      0% {
        transform: scale(.94);
      }

      65% {
        transform: scale(1.07);
      }

      100% {
        transform: scale(1);
      }
    }

    /* =========================================
       WRONG OPTION
    ========================================= */

    .drag-option.wrong {
      background: #fff0ef !important;
      border-color: #e38c86 !important;
      color: #b84c46 !important;

      box-shadow:
        0 6px 0 #d99a95 !important;

      animation:
        wrongGoodBlink .72s ease-in-out 2 !important;
    }

    @keyframes wrongGoodBlink {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      20% {
        opacity: .35;
        transform: scale(.98);
      }

      40% {
        opacity: 1;
        transform: scale(1.04);
      }

      60% {
        opacity: .35;
        transform: scale(.98);
      }

      80% {
        opacity: 1;
        transform: scale(1.02);
      }
    }

    /* =========================================
       NAVIGATION
       SAME AS REFERENCE
    ========================================= */

    .nav {
      width: 100%;
      margin: 22px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      position: relative;
      z-index: 5;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition:
        transform .15s ease,
        opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    .progress {
      min-width: 52px;
      text-align: center;
      color: #12265d;
      font-size: 14px;
      font-weight: 800;
    }

    /* =========================================
       EMOJI POPUP
       SAME AS REFERENCE
    ========================================= */

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    /* =========================================
       FINAL POPUP
       SAME AS REFERENCE
    ========================================= */

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    /* =========================================
       RESPONSIVE
       SAME BREAKPOINTS AS REFERENCE
    ========================================= */

    @media(max-width:768px) {

      body {
        padding: 10px 14px;
      }

      .quiz-wrap {
        min-height: 520px;
      }

      .quiz-heading {
        margin-bottom: 18px;
      }

      .quiz-heading h1 {
        font-size: 25px;
      }

      .question-stage {
        min-height: 430px;
        padding: 24px 24px 26px;
      }

      .question-line {
        margin-bottom: 30px;
      }

      .question-letter {
        font-size: 32px;
      }

      .question-title {
        font-size: 23px;
      }

      .number-sequence {
        gap: 13px;
      }

      .roman-number {
        font-size: 30px;
      }

      .drop-zone {
        width: 112px;
        height: 56px;
        font-size: 25px;
        border-radius: 13px;
      }

      .options-title {
        margin-top: 29px;
      }

      .drag-options {
        gap: 11px;
      }

      .drag-option {
        height: 72px;

        border-radius: 13px 22px 13px 22px;
      }

      /* SAME NAV */

      .nav {
        gap: 10px;
        margin-top: 18px;
      }

      .nav button {

    }

    @media(max-width:480px) {

      .quiz-heading h1 {
        font-size: 22px;
      }

      .heading-icon {
        font-size: 22px;
      }

      .question-stage {
        min-height: 400px;
        padding: 20px 12px 22px;
      }

      .question-line {
        gap: 9px;
        margin-bottom: 25px;
      }

      .question-letter {
        font-size: 27px;
      }

      .question-title {
        font-size: 20px;
      }

      .number-sequence {
        gap: 6px;
      }

      .roman-number {
        font-size: 24px;
      }

      .drop-zone {
        width: 86px;
        height: 48px;
        font-size: 21px;
        border-radius: 10px;
      }

      .options-title {
        margin-top: 25px;
        margin-bottom: 11px;
        font-size: 13px;
      }

      .drag-options {
        gap: 7px;
      }

      .drag-option {
        height: 58px;
        font-size: 24px;
        border-radius: 10px 17px 10px 17px;
      }

      /* SAME NAV */

      .nav {
        gap: 8px;
        margin-top: 15px;
      }

      .nav button {
        min-width: 82px;
        padding: 8px 13px;
        font-size: 12px;
      }

      .progress {
        min-width: 45px;
        font-size: 12px;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .emoji-pop,
      .final-modal,
      .heading-icon,
      .drag-option,
      .drop-zone {
        animation: none !important;
      }
    }
  </style>

<body>

  <main class="quiz-wrap">

    <header class="quiz-heading">
      <h1>
        <span class="heading-icon">🔢</span>
        Write the before/after/between Roman numerals for the following.
      </h1>
    </header>

    <section id="quiz"></section>

    <nav class="nav" aria-label="Question navigation">

      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i>
        Prev
      </button>

      <span class="progress" id="progress">
        1 / 3
      </span>

      <button id="nextBtn" disabled>
        Next
        <i class="fa-solid fa-chevron-right"></i>
      </button>

    </nav>

  </main>


  <script>
    (() => {

      /* =========================================
         QUESTIONS
      ========================================= */

      const QUESTIONS = [

        {
          id: "a",
          type: "before",
          left: "",
          right: "XL",
          answer: "XXXIX",
          options: [
            "XXXIX",
            "XLI",
            "XXXVIII"
          ]
        },

        {
          id: "b",
          type: "after",
          left: "XIII",
          right: "",
          answer: "XIV",
          options: [
            "XII",
            "XIV",
            "XV"
          ]
        },

        {
          id: "c",
          type: "between",
          left: "XXIX",
          right: "XXXI",
          answer: "XXX",
          options: [
            "XXVIII",
            "XXX",
            "XXXII"
          ]
        }

      ];


      let currentPage = 0;
      let audioCtx = null;


      QUESTIONS.forEach(q => {
        q.solved = false;
        q.selected = "";
      });


      const quiz =
        document.getElementById("quiz");

      const prevBtn =
        document.getElementById("prevBtn");

      const nextBtn =
        document.getElementById("nextBtn");

      const progress =
        document.getElementById("progress");


      /* =========================================
         AUDIO
         SAME AS REFERENCE
      ========================================= */

      function getCtx() {

        if (!audioCtx) {

          audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

        }

        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        return audioCtx;
      }


      function beep(
        freq,
        duration,
        type = "sine"
      ) {

        try {

          const ctx = getCtx();

          const osc =
            ctx.createOscillator();

          const gain =
            ctx.createGain();


          osc.type = type;
          osc.frequency.value = freq;

          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(
            .15,
            ctx.currentTime
          );

          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          osc.start();

          osc.stop(
            ctx.currentTime + duration / 1000
          );

        } catch (e) { }
      }


      const sound = {

        correct() {

          beep(660, 110);

          setTimeout(() => {
            beep(880, 160);
          }, 110);

        },

        wrong() {

          beep(
            180,
            220,
            "sawtooth"
          );

        },

        finish() {

          [523, 659, 784, 1047]
            .forEach((f, i) => {

              setTimeout(() => {
                beep(f, 150);
              }, i * 130);

            });

        }

      };


      /* =========================================
         CONFETTI
         SAME AS REFERENCE
      ========================================= */

      function burstConfetti(el) {

        const r =
          el.getBoundingClientRect();

        if (typeof confetti === "function") {

          confetti({

            particleCount: 34,

            spread: 70,

            startVelocity: 22,

            origin: {

              x:
                (r.left + r.width / 2)
                / innerWidth,

              y:
                (r.top + r.height / 2)
                / innerHeight

            },

            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]

          });

        }

      }


      /* =========================================
         EMOJI FEEDBACK
      ========================================= */

      function showEmoji(text) {

        const e =
          document.createElement("div");

        e.className =
          "emoji-pop";

        e.textContent =
          text;

        document.body.appendChild(e);

        setTimeout(() => {
          e.remove();
        }, 1600);

      }


      /* =========================================
         FINAL POPUP
         SAME AS REFERENCE
      ========================================= */

      function showFinalPopup() {

        sound.finish();


        const overlay =
          document.createElement("div");

        const modal =
          document.createElement("div");


        overlay.className =
          "final-overlay";

        modal.className =
          "final-modal";


        modal.innerHTML = `
          <span class="icon-big">🎉</span>

          <h2>All Done!</h2>

          <p>
            Amazing! You got them all right!
          </p>

          <button class="btn-playagain">
            <i class="fa-solid fa-rotate-right"></i>
            Play again
          </button>
        `;


        overlay.appendChild(modal);

        document.body.appendChild(
          overlay
        );


        setTimeout(
          () => burstConfetti(modal),
          80
        );

        setTimeout(
          () => burstConfetti(modal),
          350
        );

        setTimeout(
          () => burstConfetti(modal),
          650
        );


        modal
          .querySelector(".btn-playagain")
          .addEventListener(
            "click",
            () => {

              QUESTIONS.forEach(q => {

                q.solved = false;
                q.selected = "";

              });


              currentPage = 0;

              overlay.remove();

              render();

            }
          );

      }


      /* =========================================
         ANSWER CHECK
      ========================================= */

      function checkAnswer(button) {

        const q =
          QUESTIONS[currentPage];


        if (q.solved) {
          return;
        }


        const value =
          button.dataset.value;


        const allOptions =
          document.querySelectorAll(
            ".drag-option"
          );


        const dropZone =
          document.querySelector(
            ".drop-zone"
          );


        allOptions.forEach(option => {

          option.classList.remove(
            "wrong",
            "correct",
            "selected"
          );

        });


        /* =====================================
           CORRECT
        ===================================== */

        if (value === q.answer) {

          q.solved = true;
          q.selected = value;


          button.classList.add(
            "correct"
          );


          allOptions.forEach(option => {
            option.disabled = true;
          });


          dropZone.textContent =
            value;


          dropZone.classList.remove(
            "empty"
          );


          dropZone.classList.add(
            "filled"
          );


          sound.correct();

          burstConfetti(button);

          showEmoji("🥳");

          updateNav();


          if (
            QUESTIONS.every(
              x => x.solved
            )
          ) {

            setTimeout(
              showFinalPopup,
              900
            );

          }


        }

        /* =====================================
           WRONG
        ===================================== */

        else {

          button.classList.add(
            "wrong"
          );


          sound.wrong();

          showEmoji("😔");


          setTimeout(() => {

            button.classList.remove(
              "wrong"
            );

          }, 850);

        }

      }


      /* =========================================
         DRAG AND DROP
      ========================================= */

      function setupDragDrop() {

        const options =
          document.querySelectorAll(
            ".drag-option"
          );


        const dropZone =
          document.querySelector(
            ".drop-zone"
          );


        options.forEach(option => {


          /* Desktop drag */

          option.addEventListener(
            "dragstart",
            e => {

              if (
                QUESTIONS[currentPage].solved
              ) {

                e.preventDefault();
                return;

              }


              option.classList.add(
                "selected"
              );


              e.dataTransfer.setData(
                "text/plain",
                option.dataset.value
              );


              e.dataTransfer.effectAllowed =
                "move";

            }
          );


          option.addEventListener(
            "dragend",
            () => {

              option.classList.remove(
                "selected"
              );

            }
          );


          /* Tap / click support */

          option.addEventListener(
            "click",
            () => {

              if (
                QUESTIONS[currentPage].solved
              ) {
                return;
              }

              checkAnswer(option);

            }
          );

        });


        /* Drag over drop box */

        dropZone.addEventListener(
          "dragover",
          e => {

            if (
              QUESTIONS[currentPage].solved
            ) {
              return;
            }


            e.preventDefault();

            dropZone.classList.add(
              "drag-over"
            );


            e.dataTransfer.dropEffect =
              "move";

          }
        );


        /* Leave drop box */

        dropZone.addEventListener(
          "dragleave",
          () => {

            dropZone.classList.remove(
              "drag-over"
            );

          }
        );


        /* Drop */

        dropZone.addEventListener(
          "drop",
          e => {

            e.preventDefault();


            dropZone.classList.remove(
              "drag-over"
            );


            if (
              QUESTIONS[currentPage].solved
            ) {
              return;
            }


            const value =
              e.dataTransfer.getData(
                "text/plain"
              );


            const matchingOption =
              [...options].find(
                option =>
                  option.dataset.value ===
                  value
              );


            if (matchingOption) {
              checkAnswer(
                matchingOption
              );
            }

          }
        );

      }


      /* =========================================
         RENDER QUESTION
      ========================================= */

      function render() {

        const q =
          QUESTIONS[currentPage];


        const title =
          q.type === "before"
            ? "Write the number before"
            : q.type === "after"
              ? "Write the number after"
              : "Write the number between";


        const sequenceHTML = `

          ${q.left
            ? `
                <span class="roman-number">
                  ${q.left}
                </span>
              `
            : ""
          }


          <div class="
            drop-zone
            ${q.solved
            ? "filled"
            : "empty"}
          ">
            ${q.solved
            ? q.answer
            : ""}
          </div>


          ${q.right
            ? `
                <span class="roman-number">
                  ${q.right}
                </span>
              `
            : ""
          }

        `;


        quiz.innerHTML = `

          <article class="question-stage">

            <div class="question-line">

              <span class="question-letter">
                ${q.id})
              </span>

              <span class="question-title">
                ${title}
              </span>

            </div>


            <div class="question-content">

              <div class="number-sequence">
                ${sequenceHTML}
              </div>

            </div>


            <div class="options-title">
              Drag or tap the correct Roman numeral
            </div>


            <div class="drag-options">

              ${q.options
            .map(option => `

                  <button
                    class="
                      drag-option
                      ${q.solved &&
                option === q.answer
                ? "correct"
                : ""
              }
                    "
                    draggable="${!q.solved}"
                    data-value="${option}"
                    ${q.solved
                ? "disabled"
                : ""}
                    aria-label="
                      Roman numeral ${option}
                    "
                  >

                    <span>
                      ${option}
                    </span>

                  </button>

                `)
            .join("")}

            </div>

          </article>

        `;


        setupDragDrop();

        updateNav();

      }


      /* =========================================
         NAVIGATION
      ========================================= */

      function updateNav() {

        prevBtn.disabled =
          currentPage === 0;


        nextBtn.disabled =
          !QUESTIONS[currentPage].solved;


        progress.textContent =
          `${currentPage + 1} / ${QUESTIONS.length}`;

      }


      /* =========================================
         PREVIOUS
      ========================================= */

      prevBtn.addEventListener(
        "click",
        () => {

          if (currentPage > 0) {

            currentPage--;

            render();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          }

        }
      );


      /* =========================================
         NEXT
      ========================================= */

      nextBtn.addEventListener(
        "click",
        () => {

          if (
            !QUESTIONS[currentPage].solved
          ) {
            return;
          }


          if (
            currentPage <
            QUESTIONS.length - 1
          ) {

            currentPage++;

            render();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          }

          else {

            showFinalPopup();

          }

        }
      );


      /* =========================================
         START
      ========================================= */

      render();

    })();
  </script>

  <script src="../../shared/quiz-ui.js"></script>
</body>
