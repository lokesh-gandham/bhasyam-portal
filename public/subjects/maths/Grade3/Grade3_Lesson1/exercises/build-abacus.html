<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draw the beads · Abacus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
    <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
    <script src="../assets/shared/quiz-ui.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
            font-weight: 400;
        }

        body {
            min-height: 100vh;
            padding: 20px 20px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .wrap {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 11px;
            text-align: center;
            flex-wrap: wrap;
        }

        .title-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 19px;
            background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0) 42%), #a855f7;
            box-shadow: 0 6px 14px -4px rgba(168, 85, 247, .6);
            flex-shrink: 0;
        }

        .topbar h1 {
            font-size: 22px;
            color: #2d3250;
            font-weight: 800;
            letter-spacing: -0.2px;
        }

        .card-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 70px;
        }

        .qcard {
            background: #ffffff;
            border-radius: 32px;
            padding: 10;
            box-shadow: 0 20px 42px -18px rgba(45, 50, 80, .32), 0 0 0 7px color-mix(in srgb, var(--qc, #a855f7) 10%, transparent);
            border: 4px solid var(--qc, #a855f7);
            position: relative;
            transition: border-color .3s, box-shadow .3s;
            width: 100%;
            opacity: 0;
            transform: translateY(16px);
            animation: rise .45s cubic-bezier(.34, 1.56, .64, 1) forwards;
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .qcard.solved {
            border-color: #4caf50;
            box-shadow: 0 20px 42px -18px rgba(76, 175, 80, .32), 0 0 0 7px rgba(76, 175, 80, .10);
        }

        .qcard.solved .pole-btn {
            pointer-events: none;
            opacity: .5;
        }

        .qcard.solved .beads {
            pointer-events: none;
        }

        .qhead {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .qbadge {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #fff;
            font-size: 18px;
            background: var(--qc, #a855f7);
            box-shadow: 0 4px 10px -3px var(--qc, #a855f7);
        }

        .qhead .qtext {
            font-weight: 700;
            color: #5b6480;
            font-size: 17px;
            margin-left: auto;
        }

        .qhead .qnum {
            font-weight: 800;
            font-size: 30px;
            color: #2d3250;
            letter-spacing: 1px;
        }

        .abacus {
            display: flex;
            justify-content: center;
            margin: 8px 0 6px;
        }

        .poles {
            position: relative;
            display: flex;
            gap: 22px;
            padding: 0 6px 10px;
        }

        .pole-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 68px;
            position: relative;
            z-index: 1;
        }

        .track {
            position: relative;
            width: 100%;
            height: clamp(150px, 26vh, 200px);
        }

        .wire {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: #c7cdda;
            z-index: 0;
        }

        .beads {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            cursor: pointer;
            height: 100%;
            justify-content: flex-start;
        }

        .bead {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-bottom: -3px;
            box-shadow: inset -3px -3px 5px rgba(0, 0, 0, .2), inset 2px 2px 4px rgba(255, 255, 255, .6), 0 1px 4px rgba(0, 0, 0, .15);
            animation: dropIn .2s ease;
        }

        @keyframes dropIn {
            from {
                transform: translateY(-14px) scale(.6);
                opacity: 0;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .bead.th {
            background: #ff4fa3;
        }

        .bead.h {
            background: #ffc400;
        }

        .bead.t {
            background: #4ecb5c;
        }

        .bead.o {
            background: #29b6f6;
        }

        .pole-btn {
            border: none;
            cursor: pointer;
            width: 62px;
            height: 46px;
            margin-top: 6px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 17px;
            color: #fff;
            background: var(--bc, #9aa2b8);
            position: relative;
            z-index: 2;
            box-shadow: 0 4px 0 -1px color-mix(in srgb, var(--bc, #9aa2b8) 65%, black),
                0 7px 12px -6px color-mix(in srgb, var(--bc, #9aa2b8) 75%, transparent);
            transition: transform .12s, box-shadow .2s, filter .2s;

        }

        .pole-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .pole-btn:active {
            transform: translateY(1px) scale(.94);
        }

        .pole-btn.th {
            --bc: #ff4fa3;
        }

        .pole-btn.h {
            --bc: #ffc400;
        }

        .pole-btn.t {
            --bc: #4ecb5c;
        }

        .pole-btn.o {
            --bc: #29b6f6;
        }

        .pole-btn.touched {
            transform: scale(1.06);
            box-shadow: 0 4px 0 -1px color-mix(in srgb, var(--bc) 65%, black), 0 8px 14px -8px var(--bc), 0 0 0 4px color-mix(in srgb, var(--bc) 35%, transparent);
        }

        .pole-btn.maxed {
            animation: shakeBtn .3s ease;
        }

        @keyframes shakeBtn {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        .count-badge {
            position: absolute;
            top: -12px;
            right: -4px;
            min-width: 26px;
            height: 26px;
            padding: 0 6px;
            border-radius: 999px;
            background: #2d3250;
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .3), 0 0 0 2px #fff;
            transition: transform .15s;
        }

        .count-badge.show {
            transform: scale(1.15);
        }

        .undo-tip {
            text-align: center;
            font-size: 13px;
            color: #b2b8c8;
            font-weight: 600;
            margin-top: 6px;
            margin-bottom: 10px;
            display: none;
        }

        .name-field {
            margin-top: 8px;
        }

        .name-field label {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: .4px;
            text-transform: uppercase;
            color: var(--qc, #a855f7);
            display: block;
            margin-bottom: 5px;

        }

        .name-field input {
            width: 100%;
            border: 3px solid #e7ebf3;
            border-radius: 16px;
            padding: 14px 18px;
            font-size: 19px;
            font-weight: 700;
            color: #2d3250;
            outline: none;
            background: #fbfcfe;
            transition: border-color .2s, box-shadow .2s;

        }

        .name-field input:focus {
            border-color: var(--qc, #a855f7);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--qc, #a855f7) 18%, transparent);
        }

        .name-field input.wrong {
            border-color: #ef5675;
            background: #fff1f4;
        }

        .name-field input.correct {
            border-color: #4caf50;
            background: #eefbef;
        }

        .qfoot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-top: 10px;
        }

        .check-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-check {
            border: none;
            cursor: pointer;
            padding: 12px 28px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 17px;
            color: #fff;
            background: var(--qc, #a855f7);
            box-shadow: 0 5px 0 -1px color-mix(in srgb, var(--qc, #a855f7) 70%, black),
                0 8px 14px -8px var(--qc, #a855f7);
            transition: transform .15s, opacity .2s;
            opacity: 0.4;
            pointer-events: none;

        }

        .btn-check.active {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-check:active:not(:disabled) {
            transform: translateY(2px);
        }

        .btn-check:disabled {
            opacity: .4;
            cursor: not-allowed;
            box-shadow: none;
            pointer-events: none;
        }

        .feedback {
            font-weight: 800;
            font-size: 16px;
            opacity: 0;
            transition: opacity .2s;
            text-align: center;
        }

        .feedback.show {
            opacity: 1;
        }

        .feedback.good {
            color: #2f9e44;
        }

        .feedback.bad {
            color: #e0398c;
        }

        .nav-btn-abs {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            cursor: pointer;
            padding: 14px 28px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 15px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform .15s ease, opacity .2s ease, box-shadow .2s ease;
            box-shadow: 0 5px 0 -1px rgba(0, 0, 0, .2), 0 8px 14px -8px rgba(0, 0, 0, .3);
            z-index: 100;
            background: linear-gradient(180deg, #7ed957, #4caf50);

        }

        .nav-btn-abs:active:not(:disabled) {
            transform: translateY(-50%) translateY(2px);
        }

        .nav-btn-abs:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .nav-btn-abs:hover:not(:disabled) {
            filter: brightness(1.05);
        }

        .btn-prev-abs {
            left: -120px;
        }

        .btn-next-abs {
            right: -120px;
        }

        .progress-indicator {
            font-size: 14px;
            font-weight: 700;
            color: #7c8397;
            text-align: center;
            background: rgba(255, 255, 255, .6);
            padding: 4px 14px;
            border-radius: 999px;
            display: none;
        }

        /* celebration pieces */
        .celebration-piece {
            position: fixed;
            left: 50%;
            top: 42%;
            width: 10px;
            height: 18px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 9998;
            animation: confettiBurst 1.4s cubic-bezier(.2, .8, .2, 1) forwards;
        }

        @keyframes confettiBurst {
            from {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(0) scale(.7);
            }

            to {
                opacity: 0;
                transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(520deg) scale(1);
            }
        }

        .emoji-pop {
            position: fixed;
            left: 50%;
            top: 42%;
            font-size: 80px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
            animation: emojiPop 1.8s cubic-bezier(.2, .8, .2, 1) forwards;
            filter: drop-shadow(0 10px 14px rgba(45, 50, 80, .18));
        }

        @keyframes emojiPop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
            }

            28% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.18) rotate(8deg);
            }

            68% {
                opacity: 1;
                transform: translate(-50%, -54%) scale(1) rotate(-4deg);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -68%) scale(.9) rotate(0);
            }
        }

        .final-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn .4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .final-modal {
            background: #fff;
            max-width: 400px;
            width: 90%;
            padding: 36px 28px 32px;
            border-radius: 56px 20px 56px 20px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
            animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);

        }

        @keyframes popUp {
            from {
                transform: scale(.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .final-modal .icon-big {
            font-size: 52px;
            margin-bottom: 6px;
            display: block;
        }

        .final-modal h2 {
            font-size: 30px;
            font-weight: 800;
            color: #1e1e2a;
            margin-bottom: 8px;
        }

        .final-modal p {
            font-size: 17px;
            color: #3d3d4a;
            margin-bottom: 22px;
        }

        .final-modal .btn-playagain {
            border: none;
            background: linear-gradient(180deg, #ffb347, #f58a2e);
            padding: 12px 36px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 18px;
            color: #2d1f00;
            box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
            cursor: pointer;
            transition: transform .1s;
            display: inline-flex;
            align-items: center;
            gap: 10px;

        }

        .final-modal .btn-playagain:active {
            transform: scale(.95);
        }

        /* ===== RESPONSIVE – exact same media query dimensions from second code ===== */
        @media (max-width:900px) {
            body {
                align-items: center;
                padding: 20px;
                overflow: auto;
            }

            .card-wrapper {
                padding: 0 60px;
            }

            .btn-prev-abs {
                left: -60px;
            }

            .btn-next-abs {
                right: -60px;
            }

            .nav-btn-abs {
                padding: 12px 22px;
                font-size: 14px;
            }
        }

        @media (max-width:768px) {
            body {
                padding: 30px 0 10px;
                align-items: flex-start;
            }

            .card-wrapper {
                padding: 0 50px;
            }

            .btn-prev-abs {
                left: -50px;
            }

            .btn-next-abs {
                right: -50px;
            }

            .topbar h1 {
                font-size: 19px;
            }

            .qcard {
                padding: 22px 18px;
            }

            .poles {
                gap: 14px;
            }

            .pole-col {
                width: 56px;
            }

            .pole-btn {
                width: 50px;
                font-size: 14px;
                height: 38px;
            }

            .bead {
                width: 20px;
                height: 20px;
            }

            .qhead .qnum {
                font-size: 26px;
            }

            .nav-btn-abs {
                padding: 10px 18px;
                font-size: 13px;
            }
        }

        @media (max-width:480px) {
            body {
                padding: 50px 0 10px;
                align-items: flex-start;
            }

            .card-wrapper {
                padding: 0 40px;
            }

            .btn-prev-abs {
                left: -40px;
            }

            .btn-next-abs {
                right: -40px;
            }

            .qcard {
                padding: 16px 12px;
                border-radius: 24px;
            }

            .poles {
                gap: 8px;
            }

            .pole-col {
                width: 44px;
            }

            .pole-btn {
                width: 40px;
                font-size: 12px;
                height: 32px;
            }

            .bead {
                width: 16px;
                height: 16px;
            }

            .qhead .qnum {
                font-size: 20px;
            }

            .name-field input {
                font-size: 16px;
                padding: 10px 14px;
            }

            .btn-check {
                padding: 10px 20px;
                font-size: 15px;
            }

            .nav-btn-abs {
                padding: 8px 12px;
                font-size: 11px;
            }
        }

        @media (max-width:380px) {
            .card-wrapper {
                padding: 0 30px;
            }

            .btn-prev-abs {
                left: -30px;
            }

            .btn-next-abs {
                right: -30px;
            }

            .nav-btn-abs {
                padding: 6px 10px;
                font-size: 10px;
            }
        }

        /* larger screens */
        @media screen and (min-width:1025px) and (max-width:1440px) {
            .wrap {
                max-width: 900px;
            }

            .topbar h1 {
                font-size: 26px;
            }

            .qcard {
                padding: 32px 34px 30px;
                border-radius: 40px;
            }

            .pole-col {
                width: 78px;
            }

            .bead {
                width: 28px;
                height: 28px;
            }

            .pole-btn {
                width: 72px;
                height: 52px;
                font-size: 19px;
            }

            .qhead .qnum {
                font-size: 34px;
            }

            .name-field input {
                font-size: 22px;
                padding: 16px 22px;
            }

            .btn-check {
                padding: 14px 34px;
                font-size: 19px;
            }

            .nav-btn-abs {
                padding: 16px 32px;
                font-size: 17px;
            }

            .btn-prev-abs {
                left: -130px;
            }

            .btn-next-abs {
                right: -130px;
            }
        }

        @media screen and (min-width:1441px) and (max-width:1920px) {
            .wrap {
                max-width: 1000px;
            }

            .topbar h1 {
                font-size: 30px;
            }

            .qcard {
                padding: 38px 40px 34px;
                border-radius: 48px;
            }

            .pole-col {
                width: 88px;
            }

            .bead {
                width: 32px;
                height: 32px;
            }

            .pole-btn {
                width: 80px;
                height: 58px;
                font-size: 22px;
            }

            .qhead .qnum {
                font-size: 40px;
            }

            .name-field input {
                font-size: 24px;
                padding: 18px 24px;
            }

            .btn-check {
                padding: 16px 40px;
                font-size: 22px;
            }

            .nav-btn-abs {
                padding: 18px 38px;
                font-size: 19px;
            }

            .btn-prev-abs {
                left: -160px;
            }

            .btn-next-abs {
                right: -160px;
            }
        }

        @media screen and (min-width:1921px) {
            .wrap {
                max-width: 1100px;
            }

            .topbar h1 {
                font-size: 34px;
            }

            .qcard {
                padding: 42px 44px 38px;
                border-radius: 56px;
            }

            .pole-col {
                width: 96px;
            }

            .bead {
                width: 36px;
                height: 36px;
            }

            .pole-btn {
                width: 88px;
                height: 64px;
                font-size: 24px;
            }

            .qhead .qnum {
                font-size: 44px;
            }

            .name-field input {
                font-size: 26px;
                padding: 20px 28px;
            }

            .btn-check {
                padding: 18px 44px;
                font-size: 24px;
            }

            .nav-btn-abs {
                padding: 20px 42px;
                font-size: 22px;
            }

            .btn-prev-abs {
                left: -180px;
            }

            .btn-next-abs {
                right: -180px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .emoji-pop,
            .final-overlay,
            .final-modal,
            .qcard {
                animation: none;
            }
        }
    </style>

<body>
    <div class="wrap">
        <div class="topbar">
            <div class="title-icon"><i class="fa-solid fa-hashtag"></i></div>
            <h1>Draw beads &amp; write number name</h1>
        </div>

        <div class="card-wrapper" id="cardWrapper">
            <button class="nav-btn-abs btn-prev-abs" id="prevBtnAbs" disabled>
                <i class="fa-solid fa-chevron-left nav-icon"></i> Prev
            </button>
            <div id="questionsGrid" style="width:100%;"></div>
            <button class="nav-btn-abs btn-next-abs" id="nextBtnAbs" disabled>
                Next <i class="fa-solid fa-chevron-right nav-icon"></i>
            </button>
        </div>
    </div>

    <script>
        (function () {
            const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine',
                'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
            const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
            const QCOLORS = ['#a855f7', '#29b6f6'];
            const COLS = [
                { key: 'th', label: 'Th' },
                { key: 'h', label: 'H' },
                { key: 't', label: 'T' },
                { key: 'o', label: 'O' }
            ];
            const MAX_BEADS = 10;
            const NUMBERS = [1087, 9632];

            function numberToWords(n) {
                if (n === 0) return 'zero';
                let out = [];
                const th = Math.floor(n / 1000);
                const hu = Math.floor((n % 1000) / 100);
                const rem = n % 100;
                if (th) out.push(ONES[th] + ' thousand');
                if (hu) out.push(ONES[hu] + ' hundred');
                if (rem) {
                    if (rem < 20) out.push(ONES[rem]);
                    else {
                        let t = TENS[Math.floor(rem / 10)];
                        let o = rem % 10;
                        out.push(o ? t + '-' + ONES[o] : t);
                    }
                }
                return out.join(' ');
            }
            function normalize(s) {
                return s.toLowerCase().replace(/-/g, ' ').replace(/[^a-z ]/g, ' ')
                    .split(' ').filter(w => w && w !== 'and').join(' ');
            }

            let audioCtx = null;
            function getCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
            function beep(freq, duration, type) {
                try {
                    const ctx = getCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type || 'sine';
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(0.16, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration / 1000);
                    osc.start();
                    osc.stop(ctx.currentTime + duration / 1000);
                } catch (e) { }
            }
            const sfx = {
                add: () => beep(720, 90, 'triangle'),
                remove: () => beep(340, 90, 'triangle'),
                maxed: () => beep(200, 120, 'sawtooth'),
                good: () => { beep(660, 110, 'sine'); setTimeout(() => beep(880, 160, 'sine'), 110); },
                bad: () => beep(180, 220, 'sawtooth'),
                finish: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 150, 'sine'), i * 130)); }
            };

            function burstConfetti(fromEl, color) {
                const rect = fromEl.getBoundingClientRect();
                const x = (rect.left + rect.width / 2) / window.innerWidth;
                const y = (rect.top + rect.height / 2) / window.innerHeight;
                confetti({
                    particleCount: 30,
                    spread: 70,
                    origin: { x, y },
                    startVelocity: 20,
                    colors: [color, '#ffd54f', '#ff9f45', '#7ed957', '#ff6b6b', '#4ecdc4']
                });
            }

            // ---- correct emoji popup (🥳) ----
            function showCorrectEmoji() {
                const colors = ['#ff6fb5', '#ffd54f', '#7ed957', '#4fc3f7', '#b388ff'];
                for (let i = 0; i < 18; i++) {
                    const piece = document.createElement('span');
                    const angle = (Math.PI * 2 * i) / 18;
                    const distance = 90 + Math.random() * 100;
                    piece.className = 'celebration-piece';
                    piece.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
                    piece.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
                    piece.style.background = colors[i % colors.length];
                    piece.style.animationDelay = `${Math.random() * .12}s`;
                    document.body.appendChild(piece);
                    setTimeout(() => piece.remove(), 1600);
                }
                const emoji = document.createElement('div');
                emoji.className = 'emoji-pop';
                emoji.textContent = '🥳';
                document.body.appendChild(emoji);
                setTimeout(() => emoji.remove(), 1850);
            }

            // ---- wrong emoji popup (😅) ----
            function showWrongEmoji() {
                const emoji = document.createElement('div');
                emoji.className = 'emoji-pop';
                emoji.textContent = '😔';
                emoji.style.fontSize = '70px';
                document.body.appendChild(emoji);
                setTimeout(() => emoji.remove(), 1500);
            }

            function showFinalPopup() {
                const old = document.querySelector('.final-overlay');
                if (old) old.remove();
                sfx.finish();
                const overlay = document.createElement('div');
                overlay.className = 'final-overlay';
                overlay.innerHTML = `
        <div class="final-modal">
          <span class="icon-big">🎉</span>
          <h2>All Done!</h2>
          <p>Amazing! You got them all right!</p>
          <button class="btn-playagain" id="playAgainBtn"><i class="fa-solid fa-rotate-right"></i> Play again</button>
        </div>
      `;
                document.body.appendChild(overlay);
                setTimeout(() => {
                    const modal = overlay.querySelector('.final-modal');
                    if (modal) burstConfetti(modal, '#ffd54f');
                    setTimeout(() => { if (modal) burstConfetti(modal, '#4ecdc4'); }, 400);
                    setTimeout(() => { if (modal) burstConfetti(modal, '#ff9f45'); }, 800);
                }, 100);
                overlay.querySelector('#playAgainBtn').addEventListener('click', function () {
                    overlay.remove();
                    playAgain();
                });
            }

            let questions = NUMBERS.map(num => ({
                num,
                digits: {
                    th: Math.floor(num / 1000),
                    h: Math.floor((num % 1000) / 100),
                    t: Math.floor((num % 100) / 10),
                    o: num % 10
                },
                beads: { th: 0, h: 0, t: 0, o: 0 },
                touched: { th: false, h: false, t: false, o: false },
                name: '',
                solved: false
            }));

            let currentIndex = 0;
            const grid = document.getElementById('questionsGrid');
            const prevAbs = document.getElementById('prevBtnAbs');
            const nextAbs = document.getElementById('nextBtnAbs');

            function formatNumberName(value) {
                value = value.toLowerCase();

                if (!value.trim()) return '';

                return value.charAt(0).toUpperCase() + value.slice(1);
            }

            function renderQuestion() {
                grid.innerHTML = '';
                const idx = currentIndex;
                const q = questions[idx];
                const color = QCOLORS[idx % QCOLORS.length];
                const card = document.createElement('div');
                card.className = 'qcard' + (q.solved ? ' solved' : '');
                card.style.setProperty('--qc', color);

                card.innerHTML = `
        <div class="qhead">
          <div class="qbadge">${String.fromCharCode(97 + idx)}</div>
          <div class="qnum">${q.num}</div>
          <div class="qtext">Draw beads</div>
        </div>
        <div class="abacus">
          <div class="poles">
            <div class="tray-bg"></div>
            ${COLS.map(c => `
              <div class="pole-col">
                <div class="track">
                  <div class="wire"></div>
                  <div class="beads" data-col="${c.key}"></div>
                </div>
                <button class="pole-btn ${c.key}" data-col="${c.key}">
                  ${c.label}
                  <span class="count-badge" data-badge="${c.key}">0</span>
                </button>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="undo-tip"><i class="fa-solid fa-hand-pointer"></i> tap letter to add &nbsp;•&nbsp; tap bead to remove</div>
        <div class="name-field">
          <label>Number Name</label>
          <input type="text" class="nameInput" placeholder="Type the number name...">
        </div>
        <div class="qfoot">
          <div class="check-row">
            <button class="btn-check" id="checkBtn">Check <i class="fa-solid fa-check"></i></button>
            <span class="feedback"></span>
          </div>
          <div class="progress-indicator">${idx + 1} / ${questions.length}</div>
        </div>
      `;
                grid.appendChild(card);

                const checkBtn = card.querySelector('.btn-check');
                const feedback = card.querySelector('.feedback');
                const nameInput = card.querySelector('.nameInput');
                nameInput.value = q.name;

                function renderColumn(key) {
                    const wrap = card.querySelector(`.beads[data-col="${key}"]`);
                    wrap.innerHTML = '';
                    for (let i = 0; i < q.beads[key]; i++) {
                        const b = document.createElement('div');
                        b.className = `bead ${key}`;
                        wrap.appendChild(b);
                    }
                    const badge = card.querySelector(`.count-badge[data-badge="${key}"]`);
                    badge.textContent = q.beads[key];
                    badge.classList.toggle('show', q.beads[key] > 0);
                    const btn = card.querySelector(`.pole-btn.${key}`);
                    btn.classList.toggle('touched', q.touched[key]);
                }

                function updateCheckEnabled() {
                    const anyBead = COLS.some(c => q.beads[c.key] > 0);
                    const hasName = nameInput.value.trim().length > 0;
                    const enabled = !q.solved && anyBead && hasName;
                    if (enabled) {
                        checkBtn.classList.add('active');
                        checkBtn.disabled = false;
                    } else {
                        checkBtn.classList.remove('active');
                        checkBtn.disabled = true;
                    }
                    prevAbs.disabled = (currentIndex === 0);
                    nextAbs.disabled = (currentIndex === questions.length - 1) || !q.solved;
                }

                function addBead(key) {
                    if (q.solved) return;
                    const btn = card.querySelector(`.pole-btn.${key}`);
                    if (q.beads[key] >= MAX_BEADS) {
                        sfx.maxed();
                        btn.classList.remove('maxed'); void btn.offsetWidth; btn.classList.add('maxed');
                        return;
                    }
                    q.beads[key]++;
                    q.touched[key] = true;
                    sfx.add();
                    renderColumn(key);
                    updateCheckEnabled();
                }

                function removeBead(key) {
                    if (q.solved || q.beads[key] <= 0) return;
                    q.beads[key]--;
                    sfx.remove();
                    renderColumn(key);
                    updateCheckEnabled();
                }

                COLS.forEach(c => {
                    card.querySelector(`.pole-btn.${c.key}`).addEventListener('click', () => addBead(c.key));
                    card.querySelector(`.beads[data-col="${c.key}"]`).addEventListener('click', () => removeBead(c.key));
                });

                nameInput.addEventListener('input', () => {
                    const cursorPosition = nameInput.selectionStart;

                    // Remove numbers, punctuation, and special characters.
                    // Keep only letters and spaces.
                    let value = nameInput.value
                        .replace(/[^a-zA-Z\s]/g, '')
                        .toLowerCase();

                    // Capitalize only the first letter
                    if (value.length > 0) {
                        value = value.charAt(0).toUpperCase() + value.slice(1);
                    }

                    nameInput.value = value;
                    q.name = value;

                    // Keep cursor position
                    const newPosition = Math.min(cursorPosition, value.length);
                    nameInput.setSelectionRange(newPosition, newPosition);

                    updateCheckEnabled();
                });


                function resetAll() {
                    COLS.forEach(c => { q.beads[c.key] = 0; q.touched[c.key] = false; renderColumn(c.key); });
                    q.name = '';
                    nameInput.value = '';
                    nameInput.classList.remove('correct', 'wrong');
                    updateCheckEnabled();
                }

                checkBtn.addEventListener('click', () => {
                    const beadsOk = COLS.every(c => q.beads[c.key] === q.digits[c.key]);
                    const correctWords = normalize(numberToWords(q.num));
                    const nameOk = normalize(nameInput.value) === correctWords;

                    q.name = nameInput.value;

                    nameInput.classList.remove('correct', 'wrong');

                    // BOTH CORRECT
                    if (beadsOk && nameOk) {
                        nameInput.classList.add('correct');

                        feedback.textContent = 'Correct! ⭐';
                        feedback.className = 'feedback show good';

                        card.classList.add('solved');
                        q.solved = true;

                        checkBtn.disabled = true;
                        checkBtn.classList.remove('active');

                        // Lock number name
                        nameInput.disabled = true;

                        // Lock beads
                        COLS.forEach(c => {
                            card.querySelector(`.pole-btn.${c.key}`).style.pointerEvents = 'none';
                        });

                        sfx.good();
                        burstConfetti(card, color);
                        showCorrectEmoji();

                        updateCheckEnabled();

                        if (questions.every(qq => qq.solved)) {
                            setTimeout(() => showFinalPopup(), 900);
                        }

                        return;
                    }

                    // BEADS CORRECT, NAME WRONG
                    if (beadsOk && !nameOk) {
                        nameInput.classList.add('wrong');

                        feedback.textContent = 'Beads are right — fix the number name!';
                        feedback.className = 'feedback show bad';

                        // Keep and lock the correct beads
                        COLS.forEach(c => {
                            card.querySelector(`.pole-btn.${c.key}`).style.pointerEvents = 'none';
                        });

                        // Clear only the wrong name
                        setTimeout(() => {
                            nameInput.value = '';
                            q.name = '';
                            nameInput.classList.remove('wrong');
                            nameInput.focus();
                            updateCheckEnabled();
                        }, 550);

                        sfx.bad();
                        showWrongEmoji();

                        return;
                    }

                    // BEADS WRONG, NAME CORRECT
                    if (!beadsOk && nameOk) {
                        nameInput.classList.add('correct');

                        feedback.textContent = 'Number name is right — fix the beads!';
                        feedback.className = 'feedback show bad';

                        // Keep and lock the correct name
                        nameInput.disabled = true;

                        // Clear only the wrong beads
                        setTimeout(() => {
                            COLS.forEach(c => {
                                q.beads[c.key] = 0;
                                q.touched[c.key] = false;
                                renderColumn(c.key);
                            });

                            updateCheckEnabled();
                        }, 550);

                        sfx.bad();
                        showWrongEmoji();

                        return;
                    }

                    // BOTH WRONG
                    nameInput.classList.add('wrong');

                    feedback.textContent = 'Not quite — try both again!';
                    feedback.className = 'feedback show bad';

                    // Clear beads
                    setTimeout(() => {
                        COLS.forEach(c => {
                            q.beads[c.key] = 0;
                            q.touched[c.key] = false;
                            renderColumn(c.key);
                        });

                        // Clear name
                        nameInput.value = '';
                        q.name = '';
                        nameInput.classList.remove('wrong');

                        updateCheckEnabled();
                    }, 550);

                    sfx.bad();
                    showWrongEmoji();
                });

                COLS.forEach(c => renderColumn(c.key));
                updateCheckEnabled();
                if (q.solved) {
                    COLS.forEach(c => { card.querySelector(`.pole-btn.${c.key}`).style.pointerEvents = 'none'; });
                    checkBtn.disabled = true;
                    checkBtn.classList.remove('active');
                }
                updateCheckEnabled();
            }

            function goPrev() {
                if (currentIndex > 0) { currentIndex--; renderQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
            }
            function goNext() {
                if (currentIndex < questions.length - 1 && questions[currentIndex].solved) {
                    currentIndex++;
                    renderQuestion();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }

            prevAbs.addEventListener('click', goPrev);
            nextAbs.addEventListener('click', goNext);

            function playAgain() {
                questions = NUMBERS.map(num => ({
                    num,
                    digits: {
                        th: Math.floor(num / 1000),
                        h: Math.floor((num % 1000) / 100),
                        t: Math.floor((num % 100) / 10),
                        o: num % 10
                    },
                    beads: { th: 0, h: 0, t: 0, o: 0 },
                    touched: { th: false, h: false, t: false, o: false },
                    name: '',
                    solved: false
                }));
                currentIndex = 0;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            renderQuestion();
        })();
    </script>
    <script src="../../shared/quiz-ui.js"></script>
</body>
