<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standard Form Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #12265d;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1050px;
      padding: 8px 0;
    }

    /* ===== HEADING — unified single color, polished ===== */
    .quiz-heading {
      text-align: center;
      margin-bottom: 6px;
    }

    .quiz-heading h1 {
      display: inline-block;
      color: #12265d;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .quiz-heading h1 .purple {
      color: #12265d;
      font-weight: 800;
    }

    /* ===== SINGLE QUESTION PAGE ===== */
    .question-page {
      display: none;
      min-height: 400px;
      flex-direction: column;
      justify-content: center;
    }

    .question-page.active {
      display: flex;
    }

    /* Clean kid-friendly question panel */
    .question {
      width: 100%;
      min-height: 128px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 4px 20px;
      margin: 0 auto 18px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    /* ===== Question letter — good circular badge ===== */
    .question-letter {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: #00c97c;
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 7px 0 #31eca5;
      position: relative;
    }

    .title-icon {
      display: inline-block;
      color: #ffbd28;
      font-size: .72em;
      margin: 0 6px;
      animation: sparkle 1.5s ease-in-out infinite alternate;
    }

    .title-icon:last-child {
      color: #58c9ef;
      animation-delay: .25s;
    }

    @keyframes sparkle {
      from {
        transform: scale(.9) rotate(-8deg);
        opacity: .75;
      }

      to {
        transform: scale(1.12) rotate(8deg);
        opacity: 1;
      }
    }

    .question-text {
      font-size: 30px;
      line-height: 1.22;
      color: #12265d;
      font-weight: 400;
    }

    /* ===== Digit boxes — made smaller ===== */
    .digit-boxes {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-height: 68px;
    }

    .digit-box {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #72cdea;
      border-radius: 19px;
      background: linear-gradient(145deg, #ffffff, #eafaff);
      color: #23477c;
      font-size: 26px;
      font-weight: 800;
      box-shadow: 0 6px 0 #b9e8f6;
      transition: .18s ease;
    }

    .digit-box:nth-child(2) {
      border-color: #b58af2;
      background: #faf5ff;
      box-shadow: 0 6px 0 #ddcaf8;
    }

    .digit-box:nth-child(3) {
      border-color: #ffbd54;
      background: #fffaf0;
      box-shadow: 0 6px 0 #f8dfad;
    }

    .digit-box:nth-child(4) {
      border-color: #72d477;
      background: #f3fff1;
      box-shadow: 0 6px 0 #c4ebc6;
    }

    .digit-box.filled {
      animation: boxPop .22s ease-out;
    }

    @keyframes boxPop {
      0% {
        transform: scale(.82);
      }

      70% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    .digit-box.filled {
      border-color: #6635dc;
      background: #faf7ff;
      box-shadow: 0 6px 0 #ded0fb;
    }

    .digit-box.correct {
      border-color: #54ad48;
      background: #f0faec;
      box-shadow: 0 6px 0 #c6e5be;
      color: #398e31;
    }

    .digit-box.wrong {
      border-color: #ed5973;
      background: #fff1f4;
      box-shadow: 0 6px 0 #f4c3cf;
      animation: inputWrong .55s ease;
    }

    /* Shuffled digit choices */
    .digit-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin: 30px auto 0;
      max-width: 520px;
    }

    .digit-btn {
      width: 62px;
      height: 58px;
      border: 0;
      border-radius: 17px;
      background: linear-gradient(145deg, #fff7cf, #ffe9a0);
      color: #6b4a00;
      box-shadow: 0 5px 0 #f0d47e;
      font-size: 25px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, opacity .18s ease;
    }

    .digit-btn:hover:not(:disabled) {
      transform: translateY(-3px);
    }

    .digit-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #d9cdf6;
    }

    .digit-btn:disabled {
      opacity: .28;
      cursor: not-allowed;
      box-shadow: none;
    }

    .digit-btn.picked {
      transform: scale(.86);
    }

    @keyframes inputWrong {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-7px);
      }

      40% {
        transform: translateX(7px);
      }

      60% {
        transform: translateX(-5px);
      }

      80% {
        transform: translateX(4px);
      }
    }

    /* ===== CHECK ===== */
    .check-btn {
      display: block;
      margin: 36px auto 0;
      min-width: 190px;
      border: 0;
      border-radius: 999px;
      padding: 14px 36px;
      background: linear-gradient(180deg, #467ff0, #2556d6);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 7px 0 #1944ae, 0 12px 20px -12px rgba(37, 86, 214, .45);
      transition: transform .15s ease, filter .15s ease;
    }

    .check-btn:hover:not(:disabled) {
      filter: brightness(1.05);
      transform: translateY(-2px);
    }

    .check-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 4px 0 #1944ae;
    }

    .check-btn:disabled {
      opacity: .48;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ===== NAVIGATION — reference style ===== */
    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      margin-top: 38px;
      padding-top: 18px;
      border-top: 2px solid #e8e3de;
    }

    .nav-btn {
      min-width: 120px;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      color: #fff;
      background: linear-gradient(180deg, #42d466, #0bb852);
      box-shadow: 0 6px 0 #079443;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #079443;
    }

    .nav-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .progress {
      min-width: 58px;
      text-align: center;
      color: #12265d;
      font-size: 17px;
      font-weight: 800;
    }

    /* ===== CELEBRATION PIECES (reference) ===== */
    .celebration-piece {
      position: fixed;
      left: 50%;
      top: 42%;
      width: 10px;
      height: 18px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9998;
      animation: confettiBurst 1.4s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    @keyframes confettiBurst {
      from {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0) scale(.7);
      }

      to {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(520deg) scale(1);
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 42%;
      font-size: 80px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      animation: emojiPop 1.8s cubic-bezier(.2, .8, .2, 1) forwards;
      filter: drop-shadow(0 10px 14px rgba(45, 50, 80, .18));
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      }

      28% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18) rotate(8deg);
      }

      68% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(1) rotate(-4deg);
      }

      to {
        opacity: 0;
        transform: translate(-50%, -68%) scale(.9) rotate(0);
      }
    }

    /* ===== FINAL OVERLAY (reference) ===== */
    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      transition: transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: scale(.95);
    }

    /* ===== RESPONSIVE DIMENSIONS ===== */
    @media (max-width: 900px) {
      body {
        align-items: center;
        padding: 20px;
      }

      .quiz-heading h1 {
        font-size: 34px;
      }

      .question {
        width: 100%;
      }

      .question-text {
        font-size: 30px;
      }
    }

    @media (max-width: 768px) {
      body {
        align-items: flex-start;
        padding: 24px 10px 14px;
      }

      .quiz-heading {
        margin-bottom: 14px;
      }

      .quiz-heading h1 {
        font-size: 30px;
      }

      .question-page {
        min-height: 430px;
      }

      .question {
        width: 96%;
        min-height: 76px;
        gap: 12px;
        padding: 12px 16px;
        margin-bottom: 20px;
        border-radius: 0;
      }

      .question-letter {
        width: 56px;
        height: 56px;
        flex-basis: 56px;
        font-size: 30px;
        border-radius: 18px 18px 22px 9px;
      }

      .question-text {
        font-size: 30px;
      }

      .digit-boxes {
        gap: 10px;
      }

      .digit-box {
        width: 54px;
        height: 58px;
        font-size: 22px;
      }

      .digit-buttons {
        gap: 11px;
        margin-top: 24px;
      }

      .digit-btn {
        width: 56px;
        height: 52px;
        font-size: 23px;
      }

      .check-btn {
        margin-top: 28px;
      }

      .nav {
        gap: 12px;
        margin-top: 24px;
        padding-top: 14px;
      }

      .nav-btn {
        min-width: 100px;
        padding: 10px 18px;
        font-size: 14px;
      }

      .progress {
        font-size: 14px;
      }
    }

    @media (max-width: 600px) {
      .question-text {
        font-size: 16px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 4px 10px;
        align-items: flex-start;
      }

      .quiz-heading h1 {
        font-size: 22px;
      }

      .question-page {
        min-height: 390px;
      }

      .question {
        min-height: 64px;
        width: 98%;
        padding: 10px 12px;
        gap: 10px;
        border-radius: 14px;
      }

      .question-letter {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
        font-size: 17px;
      }

      .question-text {
        font-size: 15px;
      }

      .digit-boxes {
        gap: 7px;
      }

      .digit-box {
        width: 45px;
        height: 50px;
        font-size: 19px;
        border-radius: 13px;
      }

      .digit-buttons {
        gap: 9px;
        margin-top: 22px;
      }

      .digit-btn {
        width: 49px;
        height: 47px;
        font-size: 20px;
        border-radius: 14px;
      }

      .check-btn {
        margin-top: 24px;
        min-width: 165px;
        padding: 12px 25px;
        font-size: 17px;
      }

      .nav {
        gap: 8px;
        margin-top: 18px;
        padding-top: 12px;
      }

      .nav-btn {
        min-width: 80px;
        padding: 8px 14px;
        font-size: 12px;
      }

      .progress {
        font-size: 12px;
        min-width: 48px;
      }
    }

    @media (max-width: 380px) {
      .quiz-heading h1 {
        font-size: 18px;
      }

      .question-text {
        font-size: 13px;
      }

      .digit-boxes {
        gap: 5px;
      }

      .digit-box {
        width: 39px;
        height: 44px;
        font-size: 16px;
      }

      .digit-buttons {
        gap: 7px;
      }

      .digit-btn {
        width: 44px;
        height: 43px;
        font-size: 18px;
      }

      .nav-btn {

        padding: 6px 10px;

    }

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        max-width: 1000px;
      }

      .quiz-heading h1 {

      .question-text {

      }

      .question {
        width: 100%;
      }
    }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {

      }

      .quiz-heading h1 {

      }

      .question-text {

      }

      .question {
        width: 100%;
      }

      .nav-btn {
        padding: 14px 34px;
        font-size: 19px;
      }
    }

    @media screen and (min-width: 1921px) {
      .quiz-wrap {
        max-width: 1180px;
      }

      .quiz-heading h1 {
        font-size: 22px;
      }

      .question-text {
        font-size: 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .celebration-piece,
      .emoji-pop,
      .final-overlay,
      .final-modal {
        animation: none !important;
      }

      .celebration-piece {
        display: none !important;
      }
    }

<body>
  <div class="quiz-wrap">

    <div class="quiz-heading">
      <h1><span class="title-icon">✦</span> Write the number formed in <span class="purple">standard form.</span> <span
          class="title-icon">✦</span></h1>
    </div>

    <!-- PAGE 1 -->
    <section class="question-page active" data-index="0">
      <div class="question">
        <div class="question-letter">a)</div>
        <div class="question-text">
          A number with 6 in tens place, 2 in hundreds place, 9 in ones place and 4 in thousands place.
        </div>
      </div>

      <div class="digit-boxes" id="digitBoxes0"></div>

      <div class="digit-buttons" id="digitButtons0"></div>

      <button class="check-btn" id="checkBtn" disabled>
        <i class="fa-solid fa-circle-check"></i>&nbsp; Check
      </button>
    </section>

    <!-- PAGE 2 -->
    <section class="question-page" data-index="1">
      <div class="question">
        <div class="question-letter">b)</div>
        <div class="question-text">
          A number with 5 in hundreds place, 8 in tens place, 7 in ones place and 6 in thousands place.
        </div>
      </div>

      <div class="digit-boxes" id="digitBoxes1"></div>

      <div class="digit-buttons" id="digitButtons1"></div>

      <button class="check-btn" id="checkBtn2" disabled>
        <i class="fa-solid fa-circle-check"></i>&nbsp; Check
      </button>
    </section>

    <div class="nav">
      <button class="nav-btn" id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i> Prev
      </button>

      <div class="progress" id="progress">1 / 2</div>

      <button class="nav-btn" id="nextBtn" disabled>
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      {
        answer: "4269",
        digits: ["6", "2", "9", "4"],
        solved: false,
        userAnswer: ""
      },
      {
        answer: "6587",
        digits: ["5", "8", "7", "6"],
        solved: false,
        userAnswer: ""
      }
    ];

    let current = 0;
    let audioCtx = null;

    const pages = document.querySelectorAll(".question-page");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progress = document.getElementById("progress");

    function currentBoxes() {
      return [...document.querySelectorAll(`#digitBoxes${current} .digit-box`)];
    }

    function currentDigitButtons() {
      return [...document.querySelectorAll(`#digitButtons${current} .digit-btn`)];
    }

    function currentCheckButton() {
      return current === 0
        ? document.getElementById("checkBtn")
        : document.getElementById("checkBtn2");
    }

    function makeShuffledDigits(digits) {
      const result = [...digits];

      // Fisher-Yates shuffle. If a shuffle happens to equal the
      // original order, shuffle once more so the choices look mixed.
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      if (result.join("") === digits.join("")) {
        [result[0], result[1]] = [result[1], result[0]];
      }

      return result;
    }

    function renderDigitChoices(index) {
      const q = QUESTIONS[index];
      const boxes = document.getElementById(`digitBoxes${index}`);
      const buttons = document.getElementById(`digitButtons${index}`);

      boxes.innerHTML = "";
      buttons.innerHTML = "";

      for (let i = 0; i < 4; i++) {
        const box = document.createElement("div");
        box.className = "digit-box";
        box.dataset.index = i;
        box.textContent = q.userAnswer[i] || "";
        box.title = "Click to remove the last digit";
        box.addEventListener("click", () => {
          if (!q.solved && q.userAnswer.length > i) {
            q.userAnswer = q.userAnswer.slice(0, i);
            refreshDigitState();
          }
        });
        boxes.appendChild(box);
      }

      const shuffled = makeShuffledDigits(q.digits);

      shuffled.forEach((digit, i) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "digit-btn";
        button.textContent = digit;
        button.dataset.digit = digit;
        button.dataset.choice = i;

        button.addEventListener("click", () => chooseDigit(digit, button));

        buttons.appendChild(button);
      });

      refreshDigitState();
    }

    function chooseDigit(digit, button) {
      const q = QUESTIONS[current];

      if (q.solved) return;

      // Fill the first empty box.
      if (q.userAnswer.length >= 4) return;

      q.userAnswer += digit;
      button.classList.add("picked");
      refreshDigitState();

      if (q.userAnswer.length === 4) {
        currentCheckButton().disabled = false;
      }
    }

    function removeLastDigit() {
      const q = QUESTIONS[current];
      if (q.solved || !q.userAnswer.length) return;

      q.userAnswer = q.userAnswer.slice(0, -1);
      refreshDigitState();

      const buttons = currentDigitButtons();
      const digitToRestore = q.digits.find(d => {
        const used = [...q.userAnswer].filter(x => x === d).length;
        const available = buttons.filter(b => b.dataset.digit === d).filter(b => !b.disabled).length;
        return available < Math.max(1, 1);
      });
    }

    function refreshDigitState() {
      const q = QUESTIONS[current];
      const boxes = currentBoxes();
      const buttons = currentDigitButtons();

      boxes.forEach((box, index) => {
        box.textContent = q.userAnswer[index] || "";
        box.classList.toggle("filled", !!q.userAnswer[index]);
        box.classList.toggle("correct", q.solved);
      });

      buttons.forEach(button => {
        // Each digit choice can be used only once.
        const usedCount = [...q.userAnswer].filter(
          digit => digit === button.dataset.digit
        ).length;

        const sameButtons = buttons.filter(
          item => item.dataset.digit === button.dataset.digit
        );

        const choiceIndex = sameButtons.indexOf(button);
        button.disabled = q.solved || choiceIndex < usedCount;
        button.classList.toggle("picked", choiceIndex < usedCount);
      });

      currentCheckButton().disabled =
        q.solved || q.userAnswer.length !== 4;
    }

    function updateNav() {
      prevBtn.disabled = current === 0;
      nextBtn.disabled = !QUESTIONS[current].solved || current === QUESTIONS.length - 1;
      progress.textContent = `${current + 1} / ${QUESTIONS.length}`;
    }

    function loadQuestion() {
      pages.forEach((page, index) => {
        page.classList.toggle("active", index === current);
      });

      renderDigitChoices(current);
      updateNav();

      if (!QUESTIONS[current].solved) {
        currentCheckButton().disabled = QUESTIONS[current].userAnswer.length !== 4;
      }
    }

    document.getElementById("checkBtn").addEventListener("click", checkAnswer);
    document.getElementById("checkBtn2").addEventListener("click", checkAnswer);

    document.addEventListener("keydown", (event) => {
      const active = document.activeElement;
      if (event.key === "Backspace" && !event.ctrlKey && !event.metaKey && !event.altKey) {
        const tag = active && active.tagName ? active.tagName.toLowerCase() : "";
        if (tag !== "input" && tag !== "textarea") {
          event.preventDefault();
          removeLastDigit();
        }
      }
    });

    prevBtn.addEventListener("click", () => {
      if (current > 0) {
        current--;
        loadQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    nextBtn.addEventListener("click", () => {
      if (!QUESTIONS[current].solved) return;

      if (current < QUESTIONS.length - 1) {
        current++;
        loadQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    function checkAnswer() {
      const q = QUESTIONS[current];

      if (q.userAnswer.length !== 4) return;

      const boxes = currentBoxes();

      if (q.userAnswer === q.answer) {
        showCorrect(boxes);
      } else {
        showWrong(boxes);
      }
    }

    function showCorrect(boxes) {
      const q = QUESTIONS[current];

      q.solved = true;
      q.userAnswer = q.answer;

      boxes.forEach(box => {
        box.classList.remove("wrong", "filled");
        box.classList.add("correct");
        box.textContent = q.answer[Number(box.dataset.index)];
      });

      currentDigitButtons().forEach(button => button.disabled = true);
      currentCheckButton().disabled = true;

      sfx.good();
      const container = document.getElementById(`digitBoxes${current}`);
      burstConfetti(container, '#4caf50');
      showCorrectEmoji();

      if (QUESTIONS.every(item => item.solved)) {
        setTimeout(showFinalPopup, 700);
      } else {
        updateNav();
      }
    }

    function showWrong(boxes) {
      const q = QUESTIONS[current];

      sfx.bad();
      showWrongEmoji();

      boxes.forEach(box => {
        box.classList.remove("wrong");
        void box.offsetWidth;
        box.classList.add("wrong");
      });

      // Clear all four boxes after a wrong answer.
      q.userAnswer = "";
      currentCheckButton().disabled = true;

      setTimeout(() => {
        boxes.forEach(box => box.classList.remove("wrong"));
        refreshDigitState();
      }, 600);
    }

    /* ===== SOUND (reference) ===== */
    function getCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function beep(freq, duration, type) {
      try {
        const ctx = getCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type || "sine";
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);

        gain.gain.setValueAtTime(.16, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          .0001,
          ctx.currentTime + duration / 1000
        );

        osc.start();
        osc.stop(ctx.currentTime + duration / 1000);
      } catch (e) { }
    }

    const sfx = {
      good: () => {
        beep(660, 110, "sine");
        setTimeout(() => beep(880, 160, "sine"), 110);
      },
      bad: () => beep(180, 220, "sawtooth"),
      finish: () => {
        [523, 659, 784, 1047].forEach((f, i) => {
          setTimeout(() => beep(f, 150, "sine"), i * 130);
        });
      }
    };

    /* ===== CONFETTI (reference) ===== */
    function burstConfetti(fromEl, color) {
      const rect = fromEl.getBoundingClientRect();
      const x = (rect.left + rect.width / 2) / window.innerWidth;
      const y = (rect.top + rect.height / 2) / window.innerHeight;

      confetti({
        particleCount: 30,
        spread: 70,
        origin: { x, y },
        startVelocity: 20,
        colors: [color, "#ffd54f", "#ff9f45", "#7ed957", "#ff6b6b", "#4ecdc4"]
      });
    }

    function showCorrectEmoji() {
      const colors = ['#ff6fb5', '#ffd54f', '#7ed957', '#4fc3f7', '#b388ff'];
      for (let i = 0; i < 18; i++) {
        const piece = document.createElement('span');
        const angle = (Math.PI * 2 * i) / 18;
        const distance = 90 + Math.random() * 100;
        piece.className = 'celebration-piece';
        piece.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
        piece.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = `${Math.random() * .12}s`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 1600);
      }
      const emoji = document.createElement('div');
      emoji.className = 'emoji-pop';
      emoji.textContent = '🥳';
      document.body.appendChild(emoji);
      setTimeout(() => emoji.remove(), 1850);
    }

    function showWrongEmoji() {
      const emoji = document.createElement('div');
      emoji.className = 'emoji-pop';
      emoji.textContent = '😔';
      emoji.style.fontSize = '70px';
      document.body.appendChild(emoji);
      setTimeout(() => emoji.remove(), 1500);
    }

    /* ===== FINAL POPUP (reference) ===== */
    function showFinalPopup() {
      sfx.finish();

      const overlay = document.createElement('div');
      overlay.className = 'final-overlay';
      overlay.innerHTML = `
    <div class="final-modal">
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain" id="playAgainBtn"><i class="fa-solid fa-rotate-right"></i> Play again</button>
    </div>
  `;
      document.body.appendChild(overlay);

      setTimeout(() => {
        const modal = overlay.querySelector('.final-modal');
        if (modal) burstConfetti(modal, '#ffd54f');
        setTimeout(() => { if (modal) burstConfetti(modal, '#4ecdc4'); }, 400);
        setTimeout(() => { if (modal) burstConfetti(modal, '#ff9f45'); }, 800);
      }, 100);

      overlay.querySelector('#playAgainBtn').addEventListener('click', () => {
        overlay.remove();
        QUESTIONS.forEach(q => {
          q.solved = false;
          q.userAnswer = "";
        });
        current = 0;
        loadQuestion();
      });
    }

    loadQuestion();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>
