<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Numbers Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #12265d;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1080px;
      min-height: 610px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ===== HEADING ===== */
    .quiz-heading {
      text-align: center;
      margin-bottom: 18px;
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: #12265d;
      font-size: 34px;
      line-height: 1.08;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .heading-icon {
      font-size: 30px;
      animation: wiggle 2.5s ease-in-out infinite;
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-6deg) scale(1);
      }

      50% {
        transform: rotate(6deg) scale(1.08);
      }
    }

    /* ===== QUESTION ===== */
    .question {
      width: 100%;
      max-width: 980px;
      min-height: 185px;
      margin: 0 auto 22px;
      padding: 24px 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      border: 3px solid #d8ccf7;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 7px 0 #eeeaff, 0 14px 28px rgba(45, 50, 80, .08);
    }

    .question-letter {
      width: 66px;
      height: 66px;
      flex: 0 0 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 19px;
      color: #fff;
      background: linear-gradient(145deg, #ff5d94, #e83f79);
      box-shadow: 0 6px 0 #c92f63;
      font-size: 29px;
      font-weight: 800;
    }

    .question-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      min-width: 0;
    }

    .number {
      min-width: 210px;
      padding: 16px 22px;
      border-radius: 20px;
      text-align: center;
      font-size: 47px;
      line-height: 1;
      font-weight: 800;
      color: #12265d;
    }

    .number.left {
      background: #effaff;
      border: 3px solid #8bd9ff;
      box-shadow: 0 5px 0 #c7edff;
    }

    .number.right {
      background: #f7f3ff;
      border: 3px solid #bca9ff;
      box-shadow: 0 5px 0 #ddd3ff;
    }

    .answer-box {
      width: 88px;
      height: 88px;
      flex: 0 0 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      border: 4px dashed #f2b52f;
      background: #fffaf0;
      color: #e3a400;
      font-size: 48px;
      font-weight: 800;
      transition: .2s ease;
    }

    .answer-box.correct {
      border-style: solid;
      border-color: #55b449;
      background: #effbe9;
      color: #42a13a;
      box-shadow: 0 6px 0 #c6e5bf;
      animation: answerPop .35s ease;
    }

    .answer-box.wrong {
      border-color: #ed5973;
      background: #fff1f4;
      animation: optionWrong .58s ease;
    }

    @keyframes answerPop {
      0% {
        transform: scale(.8);
      }

      70% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes optionWrong {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-8px);
      }

      40% {
        transform: translateX(8px);
      }

      60% {
        transform: translateX(-6px);
      }

      80% {
        transform: translateX(5px);
      }
    }

    /* ===== OPTIONS ===== */
    .choose-label {
      text-align: center;
      margin-bottom: 12px;
      color: #626981;
      font-size: 18px;
      font-weight: 700;
    }

    .options {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .option {
      min-height: 112px;
      border: 3px solid;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      font-size: 62px;
      line-height: 1;
      font-weight: 800;
      color: #12265d;
      transition: transform .16s ease, box-shadow .16s ease, opacity .2s ease;
    }

    .option:nth-child(1) {
      border-color: #4e8ff0;
      background: #f0f6ff;
      box-shadow: 0 7px 0 #bfd5f7;
    }

    .option:nth-child(2) {
      border-color: #ff4e83;
      background: #fff0f5;
      box-shadow: 0 7px 0 #f7bfd0;
    }

    .option:nth-child(3) {
      border-color: #3bb9ae;
      background: #f4fae9;
      box-shadow: 0 7px 0 #cfe3ac;
    }

    .option:hover:not(.disabled) {
      transform: translateY(-4px);
    }

    .option:active:not(.disabled) {
      transform: translateY(2px);
    }

    .option.disabled {
      opacity: .32;
      pointer-events: none;
    }

    .option.correct {
      border-color: #55b449;
      background: #effbe9;
      box-shadow: 0 7px 0 #bfe0b6;
      opacity: 1 !important;
    }

    .option.wrong {
      animation: optionWrong .58s ease;
    }

    /* ===== NAVIGATION ===== */
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 35px;
      padding-top: 15px;
      border-top: 2px solid #e8e3de;
    }

    .nav button {
      min-width: 120px;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      color: #fff;
      background: linear-gradient(180deg, #42d466, #0bb852);
      box-shadow: 0 6px 0 #079443;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .2s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #079443;
    }

    .nav button:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .progress {
      min-width: 58px;
      text-align: center;
      color: #12265d;
      font-size: 17px;
      font-weight: 800;
    }

    /* ===== CELEBRATION PIECES — SAME STYLE AS OLD CODE ===== */
    .celebration-piece {
      position: fixed;
      left: 50%;
      top: 42%;
      width: 10px;
      height: 18px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9998;
      animation: confettiBurst 1.4s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    @keyframes confettiBurst {
      from {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0) scale(.7);
      }

      to {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(520deg) scale(1);
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 42%;
      font-size: 80px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      animation: emojiPop 1.8s cubic-bezier(.2, .8, .2, 1) forwards;
      filter: drop-shadow(0 10px 14px rgba(45, 50, 80, .18));
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      }

      28% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18) rotate(8deg);
      }

      68% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(1) rotate(-4deg);
      }

      to {
        opacity: 0;
        transform: translate(-50%, -68%) scale(.9) rotate(0);
      }
    }

    /* ===== RESULT POPUP — SAME OLD POPUP STYLE ===== */
    .result-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      pointer-events: none;
    }

    .result-modal {
      padding: 20px 24px;
      border-radius: 27px;
      background: rgba(255, 255, 255, .97);
      border: 3px solid #e5ddf8;
      box-shadow: 0 20px 45px rgba(45, 50, 80, .16);
      animation: popup .38s cubic-bezier(.2, .8, .2, 1);
    }

    .result-modal.correct {
      border-color: #bde3b7;
    }

    .result-modal.wrong {
      border-color: #f2b8c7;
    }

    .result-emoji {
      display: block;
      font-size: 68px;
      line-height: 1;
    }

    @keyframes popup {
      from {
        opacity: 0;
        transform: scale(.72);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ===== FINAL POPUP — SAME OLD STYLE ===== */
    .final-overlay {
      /* background: rgba(255,255,255,.48); */
      pointer-events: auto;
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      transition: transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: scale(.95);
    }

    /* ===== LAPTOP SIZE / RESPONSIVE ===== */
    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        max-width: 1050px;
        min-height: 590px;
      }

      .quiz-heading h1 {
        font-size: 34px;
      }

      .question {
        min-height: 175px;
      }

      .number {
        font-size: 44px;
      }

      .option {
        min-height: 105px;
        font-size: 58px;
      }
    }

    @media (max-width: 1024px) {
      body {
        padding: 18px 14px;
        align-items: center;
      }

      .quiz-wrap {
        min-height: auto;
      }

      .quiz-heading h1 {
        font-size: 31px;
      }

      .question {
        min-height: 160px;
        padding: 20px;
      }

      .number {
        min-width: 175px;
        font-size: 39px;
      }

      .option {
        min-height: 100px;
        font-size: 54px;
      }
    }

    @media (max-width: 768px) {
      body {
        align-items: flex-start;
        padding: 22px 10px 14px;
      }

      .quiz-heading {
        margin-bottom: 14px;
      }

      .quiz-heading h1 {
        font-size: 27px;
        gap: 8px;
      }

      .heading-icon {
        font-size: 25px;
      }

      .question {
        min-height: 0;
        padding: 18px 14px;
        margin-bottom: 18px;
        border-radius: 21px;
        gap: 12px;
      }

      .question-letter {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
        border-radius: 14px;
        font-size: 21px;
      }

      .question-content {
        gap: 9px;
        width: 100%;
      }

      .number {
        min-width: 0;
        flex: 1;
        padding: 13px 7px;
        font-size: 31px;
        border-radius: 15px;
      }

      .answer-box {
        width: 64px;
        height: 64px;
        flex-basis: 64px;
        border-radius: 16px;
        font-size: 34px;
      }

      .choose-label {
        font-size: 16px;
      }

      .options {
        gap: 12px;
      }

      .option {
        min-height: 82px;
        border-radius: 17px;
        font-size: 45px;
      }

      .nav {
        margin-top: 20px;
        gap: 12px;
        padding-top: 12px;
      }

      .nav button {
        min-width: 100px;
        padding: 10px 18px;
        font-size: 14px;
      }

      .progress {
        font-size: 14px;
      }
    }

    @media (max-width: 600px) {
      .question {
        flex-direction: column;
      }

      .question-content {
        width: 100%;
      }

      .options {
        grid-template-columns: 1fr;
        max-width: 420px;
      }

      .option {
        min-height: 72px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 6px 10px;
      }

      .quiz-heading h1 {
        font-size: 22px;
        flex-wrap: wrap;
      }

      .heading-icon {
        font-size: 21px;
      }

      .question {
        padding: 14px 9px;
      }

      .question-content {
        gap: 6px;
      }

      .number {
        font-size: 25px;
      }

      .answer-box {
        width: 57px;
        height: 57px;
        flex-basis: 57px;
        font-size: 30px;
      }

      .nav {
        gap: 8px;
      }

      .nav button {
        min-width: 82px;
        padding: 8px 13px;
        font-size: 12px;
      }

      .progress {
        min-width: 45px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .celebration-piece,
      .emoji-pop,
      .final-overlay,
      .final-modal,
      .option.wrong,
      .answer-box.correct,
      .heading-icon {
        animation: none !important;
      }

      .celebration-piece {
        display: none !important;
      }
    }
  </style>

<body>
  <main class="quiz-wrap">

    <header class="quiz-heading">
      <h1>
        <span class="heading-icon">🎯</span>
        Compare the following numbers with &lt;, &gt; or =.
      </h1>
    </header>

    <section id="quiz"></section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i> Prev
      </button>

      <span class="progress" id="progress">1 / 4</span>

      <button id="nextBtn" disabled>
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {
      const QUESTIONS = [
        { letter: "a", left: "789", right: "1089", answer: "<" },
        { letter: "b", left: "6105", right: "6150", answer: "<" },
        { letter: "c", left: "2236", right: "2236", answer: "=" },
        { letter: "d", left: "3894", right: "2862", answer: ">" }
      ];

      QUESTIONS.forEach(q => q.solved = false);

      let current = 0;
      let audioCtx = null;

      const quiz = document.getElementById("quiz");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progress = document.getElementById("progress");

      /* ===== SOUND — SAME OLD CODE STYLE ===== */
      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
      }

      function beep(freq, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type;
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          osc.start();
          osc.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((f, i) => {
            setTimeout(() => beep(f, 150), i * 130);
          });
        }
      };

      /* ===== CONFETTI — SAME OLD CODE STYLE ===== */
      function burstConfetti(el, color) {
        const r = el.getBoundingClientRect();

        confetti({
          particleCount: 34,
          spread: 70,
          startVelocity: 22,
          origin: {
            x: (r.left + r.width / 2) / innerWidth,
            y: (r.top + r.height / 2) / innerHeight
          },
          colors: [
            color || "#6635dc",
            "#ff4e83",
            "#4e8ff0",
            "#76b93b",
            "#f4ae25",
            "#4ecdc4"
          ]
        });
      }

      /* ===== EMOJI POPUPS — SAME OLD CODE ===== */
      function showCorrectEmoji() {
        const colors = ["#ff6fb5", "#ffd54f", "#7ed957", "#4fc3f7", "#b388ff"];

        for (let i = 0; i < 18; i++) {
          const piece = document.createElement("span");
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 90 + Math.random() * 100;

          piece.className = "celebration-piece";
          piece.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          piece.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * .12}s`;

          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1600);
        }

        const emoji = document.createElement("div");
        emoji.className = "emoji-pop";
        emoji.textContent = "🥳";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1850);
      }

      function showWrongEmoji() {
        const emoji = document.createElement("div");
        emoji.className = "emoji-pop";
        emoji.textContent = "😔";
        emoji.style.fontSize = "70px";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);
      }

      /* ===== RESULT POPUP — SAME OLD BEHAVIOUR ===== */
      function showEmojiPopup(type, emoji, duration, callback) {
        const old = document.querySelector(".result-overlay");
        if (old) old.remove();

        const overlay = document.createElement("div");
        overlay.className = "result-overlay";

        const modal = document.createElement("div");
        modal.className = `result-modal ${type}`;

        const emojiEl = document.createElement("span");
        emojiEl.className = "result-emoji";
        emojiEl.textContent = emoji;

        modal.appendChild(emojiEl);
        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => {
          overlay.remove();
          callback?.();
        }, duration);
      }

      /* ===== FINAL POPUP — SAME OLD STYLE ===== */
      function showFinalPopup() {
        sound.finish();

        const overlay = document.createElement("div");
        overlay.className = "result-overlay final-overlay";

        const modal = document.createElement("div");
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i> Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal, "#ffd54f"), 80);
        setTimeout(() => burstConfetti(modal, "#4ecdc4"), 350);
        setTimeout(() => burstConfetti(modal, "#ff9f45"), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          QUESTIONS.forEach(q => q.solved = false);
          current = 0;
          overlay.remove();
          render();
        });
      }

      function showCorrect(optionEl) {
        const q = QUESTIONS[current];
        q.solved = true;

        sound.correct();
        burstConfetti(optionEl, "#4caf50");
        showCorrectEmoji();

        document.querySelectorAll(".option").forEach(el => {
          el.classList.add("disabled");

          if (el.dataset.value === q.answer) {
            el.classList.add("correct");
          }
        });

        const answerBox = document.getElementById("answerBox");
        if (answerBox) {
          answerBox.textContent = q.answer;
          answerBox.classList.add("correct");
        }

        if (QUESTIONS.every(q => q.solved)) {
          setTimeout(showFinalPopup, 700);
        } else {
          updateNav();
        }
      }

      function showWrong(optionEl) {
        sound.wrong();
        showWrongEmoji();

        optionEl.classList.remove("wrong");
        void optionEl.offsetWidth;
        optionEl.classList.add("wrong");

        const answerBox = document.getElementById("answerBox");
        if (answerBox) {
          answerBox.classList.remove("wrong");
          void answerBox.offsetWidth;
          answerBox.classList.add("wrong");
        }

        setTimeout(() => {
          optionEl.classList.remove("wrong");
          if (answerBox) answerBox.classList.remove("wrong");
        }, 600);
      }

      function render() {
        const q = QUESTIONS[current];

        quiz.innerHTML = `
      <div class="question">
        <div class="question-letter">${q.letter})</div>

        <div class="question-content">
          <div class="number left">${q.left}</div>

          <div
            class="answer-box ${q.solved ? "correct" : ""}"
            id="answerBox"
            aria-label="Answer sign"
          >${q.solved ? q.answer : "?"}</div>

          <div class="number right">${q.right}</div>
        </div>
      </div>

      <div class="choose-label">Choose the correct sign</div>

      <div class="options">
        <div
          class="option ${q.solved ? "disabled" : ""} ${q.solved && q.answer === "<" ? "correct" : ""}"
          data-value="<"
          role="button"
          tabindex="${q.solved ? "-1" : "0"}"
        >&lt;</div>

        <div
          class="option ${q.solved ? "disabled" : ""} ${q.solved && q.answer === ">" ? "correct" : ""}"
          data-value=">"
          role="button"
          tabindex="${q.solved ? "-1" : "0"}"
        >&gt;</div>

        <div
          class="option ${q.solved ? "disabled" : ""} ${q.solved && q.answer === "=" ? "correct" : ""}"
          data-value="="
          role="button"
          tabindex="${q.solved ? "-1" : "0"}"
        >=</div>
      </div>
    `;

        if (!q.solved) {
          document.querySelectorAll(".option").forEach(option => {
            option.addEventListener("click", () => {
              if (option.dataset.value === q.answer) {
                showCorrect(option);
              } else {
                showWrong(option);
              }
            });

            option.addEventListener("keydown", e => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                option.click();
              }
            });
          });
        }

        updateNav();
      }

      function updateNav() {
        prevBtn.disabled = current === 0;

        const solved = QUESTIONS[current].solved;
        const hasNext = current < QUESTIONS.length - 1;

        nextBtn.disabled = !(solved && hasNext);
        progress.textContent = `${current + 1} / ${QUESTIONS.length}`;
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) {
          current--;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      nextBtn.addEventListener("click", () => {
        if (current < QUESTIONS.length - 1 && QUESTIONS[current].solved) {
          current++;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      render();
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
