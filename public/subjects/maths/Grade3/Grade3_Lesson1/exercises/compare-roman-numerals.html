<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roman Numeral Comparison Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #12265d;
      background: #fff
    }

    .quiz-wrap {
      width: 100%;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .quiz-heading {
      text-align: center;
      margin-bottom: 24px
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #12265d;
      font-size: 29px;
      line-height: 1.1;
      font-weight: 800
    }

    .heading-icon {
      font-size: 27px;
      animation: wiggle 2.5s ease-in-out infinite
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-6deg) scale(1)
      }

      50% {
        transform: rotate(6deg) scale(1.08)
      }
    }

    .question-stage {
      width: min(900px, 100%);
      min-height: 300px;
      margin: 0 auto;
      padding: 5px 40px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid #e4e7ec;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(32, 43, 69, .08);
      position: relative;
      overflow: hidden
    }

    .question-stage:before {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      left: -125px;
      top: -115px;
      border-radius: 50%;
      background: #fff4df
    }

    .question-stage:after {
      content: "";
      position: absolute;
      width: 250px;
      height: 130px;
      right: -125px;
      bottom: -75px;
      border-radius: 50%;
      background: #eef6ff
    }

    .question-line {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      position: relative;
      z-index: 3;
      margin-bottom: 20px
    }

    .question-letter {
      font-size: 35px;
      color: #172b55;
      font-weight: 800
    }

    .question-title {
      font-size: 27px;
      color: #5c6980;
      font-weight: 700
    }

    .comparison-row {
      position: relative;
      z-index: 3;
      width: min(760px, 100%);
      min-height: 130px;
      display: grid;
      grid-template-columns: 1fr 110px 1fr;
      align-items: center;
      gap: 22px
    }

    .number-card {
      height: 92px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      font-weight: 800;
      color: #172b55;
      background: #fff;
      border: 2px solid #dfe5ec;
      box-shadow: 0 5px 0 #d8dee6;
      position: relative
    }

    .left-card {
      border-color: #ffd39a;
      background: #fffaf1;
      box-shadow: 0 5px 0 #efdbb8
    }

    .right-card {
      border-color: #c8defa;
      background: #f4f9ff;
      box-shadow: 0 5px 0 #cbdcf1
    }

    .symbol-zone {
      display: flex;
      justify-content: center;
      align-items: center
    }

    .symbol-placeholder {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px dashed #d9dee6;
      background: #fafbfc;
      color: #9aa4b2;
      font-size: 35px;
      font-weight: 800
    }

    .symbol-placeholder.filled {
      border-style: solid;
      border-color: #55b449;
      background: #eff9eb;
      color: #3d9634;
      box-shadow: 0 5px 0 #c9e5c4;
      animation: symbolPop .35s cubic-bezier(.175, .885, .32, 1.275)
    }

    @keyframes symbolPop {
      from {
        transform: scale(.7);
        opacity: .4
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    .symbol-options {
      position: relative;
      z-index: 5;
      width: min(720px, 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 28px auto 0
    }

    .symbol-option {
      width: 100%;
      height: 90px;
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .15s ease, filter .15s ease
    }

    .symbol-option:before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, .09);
      pointer-events: none
    }

    .symbol-option:nth-child(1) {
      background: #ff6b57;
      box-shadow: 0 6px 0 #d84b3a
    }

    .symbol-option:nth-child(2) {
      background: #4d9de0;
      box-shadow: 0 6px 0 #3379b8
    }

    .symbol-option:nth-child(3) {
      background: #7b61d9;
      box-shadow: 0 6px 0 #5b45ad
    }

    .symbol-option:hover:not(:disabled) {
      transform: translateY(-4px);
      filter: brightness(1.05)
    }

    .symbol-option:active:not(:disabled) {
      transform: translateY(3px)
    }

    .symbol-option:disabled {
      cursor: default
    }

    .symbol-option.correct {
      background: #55b449 !important;
      box-shadow: 0 6px 0 #3d9634 !important;
      animation: correctOption .35s ease
    }

    .symbol-option.wrong {
      animation: wrongOption .55s ease
    }

    @keyframes correctOption {
      0% {
        transform: scale(1)
      }

      55% {
        transform: scale(1.05)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes wrongOption {

      0%,
      100% {
        transform: translateX(0)
      }

      20% {
        transform: translateX(-6px)
      }

      40% {
        transform: translateX(6px)
      }

      60% {
        transform: translateX(-4px)
      }

      80% {
        transform: translateX(3px)
      }
    }

    .nav {
      width: 100%;
      margin: 10px auto 0 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      position: relative;
      z-index: 5
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px)
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf
    }

    .progress {
      min-width: 52px;
      text-align: center;
      color: #12265d;
      font-size: 14px;
      font-weight: 800
    }

    .celebration-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      left: 50%;
      top: 50%;
      border-radius: 3px;
      pointer-events: none;
      z-index: 9998;
      animation: celebrate 1.5s ease-out forwards
    }

    @keyframes celebrate {
      from {
        transform: translate(-50%, -50%) scale(1) rotate(0);
        opacity: 1
      }

      to {
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.25) rotate(540deg);
        opacity: 0
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35)
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18)
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82)
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275)
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px
    }

    @media(max-width:768px) {
      body {
        padding: 10px 14px
      }

      .quiz-wrap {
        min-height: 520px
      }

      .quiz-heading {
        margin-bottom: 18px
      }

      .quiz-heading h1 {
        font-size: 25px
      }

      .question-stage {
        min-height: 430px;
        padding: 24px 24px 26px
      }

      .question-line {
        margin-bottom: 15px
      }

      .question-letter {
        font-size: 32px
      }

      .question-title {
        font-size: 23px
      }

      .comparison-row {
        grid-template-columns: 1fr 92px 1fr;
        gap: 13px
      }

      .number-card {
        height: 84px;
        font-size: 30px
      }

      .symbol-placeholder {
        width: 76px;
        height: 76px;
        font-size: 30px
      }

      .symbol-options {
        gap: 11px;
        margin-top: 24px
      }

      .symbol-option {
        height: 72px;
        font-size: 36px
      }

      .nav {
        gap: 10px;
        margin-top: 18px
      }

      .nav button {
        min-width: 100px;
        padding: 10px 17px;
        font-size: 14px
      }
    }

    @media(max-width:480px) {
      .quiz-heading h1 {
        font-size: 22px
      }

      .heading-icon {
        font-size: 22px
      }

      .question-stage {
        min-height: 400px;
        padding: 20px 12px 22px
      }

      .question-line {
        gap: 9px;
        margin-bottom: 14px
      }

      .question-letter {
        font-size: 27px
      }

      .question-title {
        font-size: 20px
      }

      .comparison-row {
        grid-template-columns: 1fr 62px 1fr;
        gap: 6px;
        min-height: 100px
      }

      .number-card {
        height: 68px;
        font-size: 24px;
        border-radius: 12px
      }

      .symbol-placeholder {
        width: 56px;
        height: 56px;
        font-size: 24px
      }

      .symbol-options {
        gap: 7px;
        margin-top: 20px
      }

      .symbol-option {
        height: 58px;
        font-size: 29px;
        border-radius: 9px
      }

      .nav {
        gap: 8px;
        margin-top: 15px
      }

      .nav button {
        min-width: 82px;
        padding: 8px 13px;
        font-size: 12px
      }

      .progress {
        min-width: 45px;
        font-size: 12px
      }
    }

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .nav {
        margin: 20px auto 0 !important;
      }
    }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .quiz-wrap {
        min-height: 630px;
      }

      .question-stage {
        padding: 40px 40px;
      }

      .nav {
        margin: 25px auto 0 !important;
      }
    }

    @media screen and (min-width: 1921px) {
      .quiz-wrap {
        min-height: 630px;
      }

      .question-stage {
        padding: 40px 40px;
      }

      .nav {
        margin: 25px auto 0 !important;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .celebration-piece,
      .emoji-pop,
      .final-modal,
      .heading-icon,
      .symbol-option {
        animation: none !important
      }
    }
  </style>
  <style id="lamp-final-design">
    /* ===== REALISTIC ANIMATED TABLE LAMP ===== */
    .lamp-area {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      height: 142px !important;
      margin: -2px auto 2px !important;
      position: relative;
    }

    .lamp {
      width: 150px;
      height: 138px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 8px 8px rgba(0, 0, 0, .12));
    }

    /* subtle idle movement */
    .lamp:not(.on):not(.broken) {
      animation: lampIdle 3.2s ease-in-out infinite;
    }

    @keyframes lampIdle {

      0%,
      100% {
        transform: translateY(0) rotate(0)
      }

      50% {
        transform: translateY(-2px) rotate(.4deg)
      }
    }

    /* metal neck */
    .lamp-shade:before {
      content: "";
      position: absolute;
      left: 50%;
      top: -35px;
      width: 10px;
      height: 38px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #565a60, #aeb2b8, #555960);
      border-radius: 8px 8px 2px 2px;
      z-index: 1;
    }

    /* realistic conical shade */
    .lamp-shade {
      width: 92px;
      height: 62px;
      position: relative;
      z-index: 3;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, .14), transparent 18%, rgba(255, 255, 255, .28) 48%, transparent 75%, rgba(0, 0, 0, .13)),
        linear-gradient(180deg, #e9ebee, #aeb2b8);
      border: 4px solid #555a61;
      border-bottom: 7px solid #4a4e54;
      border-radius: 50% 50% 17% 17% / 32% 32% 13% 13%;
      box-shadow:
        inset 0 4px 5px rgba(255, 255, 255, .45),
        0 7px 0 #454950,
        0 11px 14px rgba(0, 0, 0, .15);
      transition: background .35s, box-shadow .35s, transform .35s;
    }

    /* shade top cap */
    .lamp-shade:after {
      content: "";
      position: absolute;
      left: 50%;
      top: -6px;
      width: 48px;
      height: 9px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: linear-gradient(180deg, #cfd2d6, #73777e);
      border: 3px solid #555a61;
      box-shadow: inset 0 2px 2px rgba(255, 255, 255, .5);
    }

    /* bulb */
    .lamp-bulb {
      position: absolute;
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
      width: 29px;
      height: 34px;
      border-radius: 50% 50% 45% 45%;
      background:
        radial-gradient(circle at 35% 25%, #fff, #e6e7e9 58%, #b7bbc1 100%);
      border: 3px solid #a6abb2;
      box-shadow: inset 0 -5px 7px rgba(0, 0, 0, .08);
      transition: .35s;
      z-index: 2;
    }

    /* bulb screw base */
    .lamp-wire {
      width: 29px;
      height: 13px;
      margin-top: 0;
      background: repeating-linear-gradient(180deg, #777b82 0, #777b82 2px, #4f5359 2px, #4f5359 4px);
      border-radius: 3px 3px 7px 7px;
      box-shadow: 0 3px 0 #41454b;
    }

    .lamp-base {
      width: 70px;
      height: 15px;
      margin-top: 4px;
      border-radius: 50%;
      background: linear-gradient(180deg, #9da1a7, #565a61);
      border: 3px solid #4b4f55;
      box-shadow: 0 6px 0 #3f4348, 0 8px 10px rgba(0, 0, 0, .14);
    }

    /* pull chain */
    .lamp:after {
      content: "";
      position: absolute;
      right: 18px;
      top: 49px;
      width: 2px;
      height: 37px;
      background: #656970;
      z-index: 5;
      box-shadow: 0 35px 0 -1px #656970;
    }

    .lamp:before {
      content: "";
      position: absolute;
      right: 13px;
      top: 81px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #d7d9dc, #676b72 70%);
      border: 2px solid #4d5157;
      z-index: 6;
    }

    /* OFF state */
    .lamp:not(.on) .lamp-bulb {
      background: radial-gradient(circle at 35% 25%, #f2f3f4, #cfd2d6 65%, #9fa4aa);
    }

    /* ON state: warm realistic glow */
    .lamp.on .lamp-shade {
      background:
        linear-gradient(90deg, rgba(255, 180, 25, .18), transparent 18%, rgba(255, 255, 220, .55) 48%, transparent 78%, rgba(255, 170, 20, .18)),
        linear-gradient(180deg, #fff9c9, #ffc83d);
      box-shadow:
        inset 0 4px 6px rgba(255, 255, 255, .65),
        0 7px 0 #454950,
        0 0 18px rgba(255, 205, 60, .75),
        0 0 42px rgba(255, 190, 30, .35);
      animation: shadeWarm 1.4s ease-in-out infinite alternate;
    }

    .lamp.on .lamp-bulb {
      background: radial-gradient(circle at 35% 25%, #fff, #fff5a2 48%, #ffc928 100%);
      border-color: #e2b32c;
      box-shadow:
        0 0 8px #fff7a6,
        0 0 22px #ffd84e,
        0 0 40px rgba(255, 195, 35, .8);
      animation: bulbGlow 1s ease-in-out infinite alternate;
    }

    @keyframes shadeWarm {
      from {
        filter: brightness(1)
      }

      to {
        filter: brightness(1.06)
      }
    }

    @keyframes bulbGlow {
      from {
        transform: translateX(-50%) scale(.95)
      }

      to {
        transform: translateX(-50%) scale(1.1)
      }
    }

    /* light rays when correct */
    .lamp.on .lamp-shade:before {
      animation: neckGlow 1.2s ease-in-out infinite alternate;
    }

    @keyframes neckGlow {
      from {
        filter: brightness(1)
      }

      to {
        filter: brightness(1.18)
      }
    }

    /* realistic glass shatter */
    .lamp-cracks {
      position: absolute;
      inset: 5px;
      opacity: 0;
      pointer-events: none;
      z-index: 8;
    }

    .lamp.broken .lamp-cracks {
      opacity: 1
    }

    .lamp-cracks:before {
      content: "";
      position: absolute;
      left: 48%;
      top: 1px;
      width: 3px;
      height: 55px;
      background: #555960;
      transform: rotate(18deg);
      clip-path: polygon(0 0, 100% 0, 45% 18%, 100% 36%, 43% 55%, 78% 72%, 35% 100%, 0 100%, 30% 72%, 5% 55%, 34% 36%, 2% 18%);
    }

    .lamp-cracks:after {
      content: "";
      position: absolute;
      left: 25%;
      top: 18px;
      width: 50px;
      height: 3px;
      background: #555960;
      transform: rotate(-12deg);
      box-shadow: 10px 15px 0 #555960;
    }

    .lamp.broken .lamp-shade {
      animation: realGlassBreak .65s cubic-bezier(.2, .8, .3, 1) forwards;
    }

    .lamp.broken .lamp-bulb {
      opacity: .08;
      transform: translateX(-50%) scale(.65);
    }

    @keyframes realGlassBreak {
      0% {
        transform: scale(1) rotate(0)
      }

      25% {
        transform: scale(1.06) rotate(-2deg)
      }

      45% {
        transform: scale(.98) rotate(2deg)
      }

      65% {
        transform: translateY(3px) rotate(-3deg)
      }

      100% {
        transform: translateY(9px) rotate(5deg);
        opacity: .38
      }
    }

    /* Keep the simple 3D option boxes */
    .switchboard {
      width: min(500px, 100%);
      margin: 0 auto !important;
      padding: 0 !important;
      border: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
    }

    .switchboard-title {
      display: none !important
    }

    .symbol-options {
      width: min(390px, 100%) !important;
      margin: 0 auto !important;
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 12px !important;
    }

    .symbol-option {
      width: 100% !important;
      height: 62px !important;
      min-height: 62px !important;
      padding: 0 !important;
      border: 2px solid #b8bcc2 !important;
      border-radius: 8px !important;
      background: linear-gradient(180deg, #ffffff, #e7e9ec) !important;
      color: #454950 !important;

<body>
  <main class="quiz-wrap">
    <header class="quiz-heading">
      <h1><span class="heading-icon">⚖️</span> Compare the following and place the correct symbol &gt;, &lt; or =.</h1>
    </header>
    <section id="quiz"></section>
    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled><i class="fa-solid fa-chevron-left"></i> Prev</button>
      <span class="progress" id="progress">1 / 6</span>
      <button id="nextBtn" disabled>Next <i class="fa-solid fa-chevron-right"></i></button>
    </nav>
  </main>
  <script>
    (() => {
      const QUESTIONS = [
        { id: "a", left: "XX", right: "XXIX", answer: "<" },
        { id: "b", left: "XIV", right: "XVI", answer: "<" },
        { id: "c", left: "XXXVII", right: "XXXVII", answer: "=" },
        { id: "d", left: "XL", right: "XXX", answer: ">" },
        { id: "e", left: "VII", right: "VII", answer: "=" },
        { id: "f", left: "XXXIX", right: "XXIX", answer: ">" }
      ];
      let currentPage = 0, audioCtx = null;
      QUESTIONS.forEach(q => { q.solved = false; q.selected = "" });
      const quiz = document.getElementById("quiz"), prevBtn = document.getElementById("prevBtn"), nextBtn = document.getElementById("nextBtn"), progress = document.getElementById("progress");
      function getCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); return audioCtx }
      function beep(freq, duration, type = "sine") { try { const ctx = getCtx(), osc = ctx.createOscillator(), gain = ctx.createGain(); osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(ctx.destination); gain.gain.setValueAtTime(.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + duration / 1000); osc.start(); osc.stop(ctx.currentTime + duration / 1000) } catch (e) { } }
      const sound = { correct() { beep(660, 110); setTimeout(() => beep(880, 160), 110) }, wrong() { beep(180, 220, "sawtooth") }, finish() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 150), i * 130)) } };
      function burstConfetti(el) { const r = el.getBoundingClientRect(); if (typeof confetti === "function") confetti({ particleCount: 34, spread: 70, startVelocity: 22, origin: { x: (r.left + r.width / 2) / innerWidth, y: (r.top + r.height / 2) / innerHeight }, colors: ["#6635dc", "#ff4e83", "#4e8ff0", "#76b93b", "#f4ae25", "#4ecdc4"] }) }
      function showEmoji(text) { const e = document.createElement("div"); e.className = "emoji-pop"; e.textContent = text; document.body.appendChild(e); setTimeout(() => e.remove(), 1600) }
      function showFinalPopup() { sound.finish(); const overlay = document.createElement("div"), modal = document.createElement("div"); overlay.className = "final-overlay"; modal.className = "final-modal"; modal.innerHTML = '<span class="icon-big">🎉</span><h2>All Done!</h2><p>Amazing! You got them all right!</p><button class="btn-playagain"><i class="fa-solid fa-rotate-right"></i> Play again</button>'; overlay.appendChild(modal); document.body.appendChild(overlay); setTimeout(() => burstConfetti(modal), 80); setTimeout(() => burstConfetti(modal), 350); setTimeout(() => burstConfetti(modal), 650); modal.querySelector(".btn-playagain").addEventListener("click", () => { QUESTIONS.forEach(q => { q.solved = false; q.selected = "" }); currentPage = 0; overlay.remove(); render() }) }
      function checkAnswer(button) {
        const q = QUESTIONS[currentPage];
        if (q.solved) return;
        const value = button.dataset.value;
        const all = document.querySelectorAll(".symbol-option");
        const placeholder = document.querySelector(".symbol-placeholder");
        const lamp = document.querySelector("#lamp");
        all.forEach(b => b.classList.remove("wrong", "correct"));

        if (value === q.answer) {
          q.solved = true;
          q.selected = value;
          button.classList.add("correct");
          all.forEach(b => b.disabled = true);
          placeholder.textContent = value;
          placeholder.classList.add("filled");

          lamp.classList.remove("broken");
          void lamp.offsetWidth;
          lamp.classList.add("on");

          sound.correct();
          burstConfetti(button);
          showEmoji("🥳");
          updateNav();
          if (QUESTIONS.every(x => x.solved)) setTimeout(showFinalPopup, 900);
        } else {
          button.classList.add("wrong");
          lamp.classList.remove("on");
          lamp.classList.add("broken");

          sound.wrong();
          showEmoji("😔");

          setTimeout(() => {
            button.classList.remove("wrong");
            lamp.classList.remove("broken");
          }, 850);
        }
      }
      function render() {
        const q = QUESTIONS[currentPage]; quiz.innerHTML = `<article class="question-stage"><div class="question-line"><span class="question-letter">${q.id})</span><span class="question-title">Compare the numbers</span></div><div class="comparison-row"><div class="number-card left-card">${q.left}</div><div class="symbol-zone"><div class="symbol-placeholder ${q.solved ? "filled" : ""}">${q.solved ? q.answer : "?"}</div></div><div class="number-card right-card">${q.right}</div></div><div class="lamp-area">
  <div class="lamp" id="lamp">
    <div class="lamp-shade">
      <div class="lamp-cracks"></div>
      <div class="lamp-bulb"></div>
    </div>
    <div class="lamp-wire"></div>
    <div class="lamp-base"></div>
  </div>
</div>
<div class="symbol-options">${["<", ">", "="].map(symbol => `<button class="symbol-option ${q.solved && symbol === q.answer ? "correct" : ""}" data-value="${symbol}" ${q.solved ? "disabled" : ""}><span>${symbol}</span></button>`).join("")}</div></article>`; document.querySelectorAll(".symbol-option").forEach(b => b.addEventListener("click", () => checkAnswer(b)));
        if (q.solved) {
          const lamp = document.querySelector("#lamp");
          if (lamp) lamp.classList.add("on");
        }
        updateNav()
      }
      function updateNav() { prevBtn.disabled = currentPage === 0; nextBtn.disabled = !QUESTIONS[currentPage].solved; progress.textContent = `${currentPage + 1} / ${QUESTIONS.length}` }
      prevBtn.addEventListener("click", () => { if (currentPage > 0) { currentPage--; render(); window.scrollTo({ top: 0, behavior: "smooth" }) } });
      nextBtn.addEventListener("click", () => { if (!QUESTIONS[currentPage].solved) return; if (currentPage < QUESTIONS.length - 1) { currentPage++; render(); window.scrollTo({ top: 0, behavior: "smooth" }) } else showFinalPopup() });
      render();
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>
