<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.5, user-scalable=yes" />
    <title>Correct Symbols <> =</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
    <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
    <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
    <script src="../assets/shared/quiz-ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
            font-weight: 400;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        .card {
            max-width: 70%;
            width: 100%;
            margin: 0 auto;
            /* background: rgba(255, 250, 242, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 56px 56px 48px 48px;
            padding: 32px 30px 38px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 245, 230, 0.6); */
        }

        .title {
            font-size: 30px;
            font-weight: 800;
            color: #2d2a24;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .title span {
            background: #d9d0c0;
            padding: 2px 18px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 700;
            color: #3f3a32;
        }

        .sub {
            font-size: 17px;
            font-weight: 600;
            color: #5b5346;
            margin-bottom: 28px;
            text-align: center;
            opacity: 0.8;
        }

        /* ----- questions grid ----- */
        .questions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 28px;
            margin-bottom: 8px;
            justify-items: center;
        }

        .q-item {
            background: #ffffffd9;
            backdrop-filter: blur(2px);
            border-radius: 28px;
            padding: 18px 16px 20px;
            box-shadow: 0 6px 18px rgba(90, 70, 50, 0.06);
            border: 2px solid #008f88;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            background: #f7fffd;
        }

        .q-item.correct {
            border-color: #7bcb8a;
            background: #f4fff6;
            box-shadow: 0 6px 18px rgba(80, 180, 100, 0.12);
        }

        .q-item.wrong-shake {
            animation: shake 0.28s ease;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            50% {
                transform: translateX(8px);
            }

            75% {
                transform: translateX(-6px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .q-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .q-label {
            font-weight: 700;
            font-size: 20px;
            color: #3d352b;
            margin-right: 2px;
            min-width: 24px;
        }

        .num {
            font-weight: 800;
            font-size: 28px;
            color: #1f1b16;
            letter-spacing: 1px;
            /* background: #f3ede4; */
            padding: 0 10px;
            border-radius: 20px;
            line-height: 1.4;
            min-width: 60px;
            text-align: center;
        }

        .box {
            font-weight: 800;
            height: 100%;
            font-size: 38px;
            color: #1f2a3a;
            background: #f8f2e9;
            border-radius: 18px;
            min-width: 68px;
            text-align: center;
            padding: 4px 0;
            border: 2px dashed #cbbfb0;
            transition: 0.1s;
            line-height: 1.3;
            letter-spacing: 2px;
        }

        .box.filled {
            border: 2px solid #b8aa98;
            background: #fcf8f2;
        }

        .box.correct-symbol {
            border-color: #42a85a;
            background: #e5f7e9;
            color: #1e6b30;
        }

        /* ----- option buttons row ----- */
        .options {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 2px;
        }

        .opt-btn {
            border: none;
            background: #efebe4;
            font-size: 28px;
            font-weight: 800;
            color: #2f2a22;
            width: 62px;
            height: 62px;
            border-radius: 40px;
            box-shadow: 0 6px 0 #cbc1b2, 0 8px 16px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.08s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            border: 1px solid #ded6c8;
        }

        .opt-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #b3a794;
        }

        .opt-btn:disabled {
            opacity: 0.4;
            transform: translateY(3px);
            box-shadow: 0 3px 0 #b3a794;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .opt-btn.gt {
            background: #ffd9b3;
            color: #854d1a;
            border-color: #eac09a;
        }

        .opt-btn.lt {
            background: #b3d9ff;
            color: #004080;
            border-color: #9ac0e8;
        }

        .opt-btn.eq {
            background: #c8f0c0;
            color: #1f6b2f;
            border-color: #a8d89a;
        }

        .opt-btn:hover:not(:disabled) {
            filter: brightness(0.96);
            transform: scale(0.96);
        }

        .opt-btn:active:not(:disabled) {
            transform: scale(0.92) translateY(3px);
        }

        /* ---- feedback emoji line ---- */
        .feedback-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 34px;
            margin-top: 0px;
        }

        .emoji-feedback {
            font-size: 30px;
            line-height: 1;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .emoji-feedback.show {
            opacity: 1;
        }

        /* ----- celebration pieces (same as first code) ----- */
        .celebration-piece {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 12px;
            height: 12px;
            border-radius: 4px;
            top: 50%;
            left: 50%;
            animation: pieceFly 1.4s ease-out forwards;
        }

        @keyframes pieceFly {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.3) rotate(0deg);
            }

            40% {
                opacity: 1;
                transform: translate(calc(var(--x)*0.6), calc(var(--y)*0.6)) scale(1) rotate(180deg);
            }

            100% {
                opacity: 0;
                transform: translate(var(--x), var(--y)) scale(0.2) rotate(360deg);
            }
        }

        .emoji-pop {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 62px;
            z-index: 9999;
            pointer-events: none;
            animation: emojiPop 1.8s ease forwards;
        }

        @keyframes emojiPop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3);
            }

            30% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.3);
            }

            70% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.6);
            }
        }

        /* ----- FINAL POPUP (exactly from second code) ----- */
        .final-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .final-modal {
            background: #ffffff;
            max-width: 420px;
            width: 90%;
            padding: 40px 28px 32px;
            border-radius: 56px 20px 56px 20px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .final-modal h2 {
            font-size: 34px;
            font-weight: 800;
            color: #1e1e2a;
            margin-bottom: 8px;
        }

        .final-modal p {
            font-size: 18px;
            color: #3d3d4a;
            margin-bottom: 24px;
        }

        .final-modal .btn-playagain {
            border: none;
            background: linear-gradient(180deg, #ffb347, #f58a2e);
            padding: 14px 40px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 20px;
            color: #2d1f00;
            box-shadow: 0 12px 24px rgba(245, 138, 46, 0.3);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .final-modal .btn-playagain:active {
            transform: scale(0.95);
        }

        .final-modal .icon-big {
            font-size: 56px;
            margin-bottom: 6px;
            display: block;
        }

        /* ----- MEDIA QUERIES exactly from second code (Draw the beads) ----- */
        @media (max-width: 900px) {
            body {
                align-items: center;
                padding: 20px;
                overflow: auto;
            }

            .card {
                max-width: 85%;
                padding: 24px 20px 28px;
            }

            .questions {
                gap: 14px 20px;
            }

            .num {
                font-size: 24px;
                min-width: 50px;
            }

            .opt-btn {
                width: 54px;
                height: 54px;
                font-size: 24px;
            }

            .box {
                font-size: 32px;
                min-width: 58px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
                align-items: flex-start;
                overflow: auto;
            }

            .card {
                max-width: 95%;
                padding: 20px 14px 24px;
                border-radius: 40px;
            }

            .questions {
                grid-template-columns: 1fr 1fr;
                gap: 12px 16px;
            }

            .title {
                font-size: 24px;
            }

            .num {
                font-size: 22px;
                min-width: 44px;
                padding: 0 6px;
            }

            .opt-btn {
                width: 48px;
                height: 48px;
                font-size: 20px;
                border-radius: 30px;
            }

            .box {
                font-size: 28px;
                min-width: 50px;
            }

            .q-item {
                padding: 14px 12px 16px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 6px;
                align-items: flex-start;
            }

            .card {
                padding: 18px 12px 20px;
                border-radius: 32px;
            }

            .questions {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .q-item {
                max-width: 360px;
                margin: 0 auto;
            }

            .q-row {
                gap: 4px;
            }

            .num {
                font-size: 20px;
                min-width: 38px;
                padding: 0 6px;
            }

            .box {
                font-size: 26px;
                min-width: 44px;
            }

            .opt-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }

            .title {
                font-size: 20px;
            }

            .sub {
                font-size: 15px;
                margin-bottom: 20px;
            }

            .final-modal {
                padding: 28px 16px 32px;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 16px 10px 20px;
            }

            .num {
                font-size: 18px;
                min-width: 34px;
                padding: 0 4px;
            }

            .box {
                font-size: 22px;
                min-width: 38px;
                padding: 2px 0;
            }

            .opt-btn {
                width: 38px;
                height: 38px;
                font-size: 16px;
                border-radius: 24px;
            }

            .q-label {
                font-size: 16px;
                min-width: 18px;
            }
        }

        /* large screens (from second code) */
        @media screen and (min-width:1025px) and (max-width:1440px) {
            .card {
                max-width: 70%;
            }

            .num {
                font-size: 28px;
            }

            .opt-btn {
                width: 62px;
                height: 62px;
                font-size: 28px;
            }

            .box {
                font-size: 38px;
                min-width: 68px;
            }
        }

        @media screen and (min-width:1441px) and (max-width:1920px) {
            .card {
                max-width: 65%;
            }

            .num {
                font-size: 32px;
                min-width: 70px;
            }

            .opt-btn {
                width: 70px;
                height: 70px;
                font-size: 32px;
            }

            .box {
                font-size: 42px;
                min-width: 78px;
            }
        }

        @media screen and (min-width:1921px) {
            .card {
                max-width: 55%;
            }

            .num {
                font-size: 36px;
                min-width: 80px;
            }

            .opt-btn {
                width: 78px;
                height: 78px;
                font-size: 36px;
            }

            .box {
                font-size: 48px;
                min-width: 88px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/quiz-ui.css">
    <link rel="stylesheet" href="../../shared/grade3-chapter1.css">
</head>

<body>

    <div class="card">
        <div class="title">
            Write the correct symbol <span>&lt; &gt; =</span>
        </div>
        <div class="sub">Tap a symbol to fill the box</div>
        <div class="questions" id="questionsContainer"></div>
    </div>

    <!-- final popup (same as second code) -->
    <div class="final-overlay" id="popupOverlay" style="display:none;">
        <div class="final-modal">
            <span class="icon-big">🎉</span>
            <h2>All correct!</h2>
            <p>Amazing! You got them all right!</p>
            <button class="btn-playagain" id="playAgainBtn"><i class="fa-solid fa-rotate-right"></i> Play again</button>
        </div>
    </div>

    <script>
        (function () {
            // ----- Audio (exactly same as second code) -----
            let audioCtx = null;
            function getCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
            function beep(freq, dur, type = 'sine') {
                try {
                    const ctx = getCtx();
                    const o = ctx.createOscillator();
                    const g = ctx.createGain();
                    o.type = type; o.frequency.value = freq;
                    o.connect(g); g.connect(ctx.destination);
                    g.gain.setValueAtTime(0.14, ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur / 1000);
                    o.start(); o.stop(ctx.currentTime + dur / 1000);
                } catch (e) { }
            }
            const sfx = {
                good: () => { beep(660, 110, 'sine'); setTimeout(() => beep(880, 160, 'sine'), 110); },
                bad: () => beep(180, 220, 'sawtooth'),
                finish: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 150, 'sine'), i * 130)); }
            };

            // ----- confetti (using canvas-confetti library + custom pieces) -----
            function burstConfetti(element, color = '#f5c542') {
                const rect = element.getBoundingClientRect();
                const x = (rect.left + rect.width / 2) / window.innerWidth;
                const y = (rect.top + rect.height / 2) / window.innerHeight;
                confetti({
                    particleCount: 30,
                    spread: 70,
                    origin: { x: x, y: y },
                    startVelocity: 20,
                    colors: [color, '#ffd54f', '#ff9f45', '#7ed957', '#ff6b6b', '#4ecdc4']
                });
            }

            function showCorrectEmoji() {
                const colors = ['#ff6fb5', '#ffd54f', '#7ed957', '#4fc3f7', '#b388ff'];
                for (let i = 0; i < 18; i++) {
                    const piece = document.createElement('span');
                    const angle = (Math.PI * 2 * i) / 18;
                    const distance = 90 + Math.random() * 100;
                    piece.className = 'celebration-piece';
                    piece.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
                    piece.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
                    piece.style.background = colors[i % colors.length];
                    piece.style.animationDelay = `${Math.random() * .12}s`;
                    document.body.appendChild(piece);
                    setTimeout(() => piece.remove(), 1600);
                }
                const emoji = document.createElement('div');
                emoji.className = 'emoji-pop';
                emoji.textContent = '🥳';
                document.body.appendChild(emoji);
                setTimeout(() => emoji.remove(), 1850);
            }

            function showWrongEmoji() {
                const emoji = document.createElement('div');
                emoji.className = 'emoji-pop';
                emoji.textContent = '😔';
                emoji.style.fontSize = '70px';
                document.body.appendChild(emoji);
                setTimeout(() => emoji.remove(), 1500);
            }

            // ----- question data -----
            const questions = [
                { id: 'a', left: 413, right: 431, correct: '<' },
                { id: 'b', left: 578, right: 287, correct: '>' },
                { id: 'c', left: 821, right: 128, correct: '>' },
                { id: 'd', left: 909, right: 909, correct: '=' }
            ];

            const total = questions.length;
            let correctCount = 0;
            let allCorrect = false;

            const container = document.getElementById('questionsContainer');
            const popupOverlay = document.getElementById('popupOverlay');

            // ----- render questions -----
            function renderQuestions() {
                container.innerHTML = '';
                correctCount = 0;
                allCorrect = false;
                popupOverlay.style.display = 'none';

                questions.forEach((q, index) => {
                    const qDiv = document.createElement('div');
                    qDiv.className = 'q-item';
                    qDiv.dataset.index = index;
                    qDiv.dataset.correct = q.correct;
                    qDiv.dataset.locked = 'false';

                    const row = document.createElement('div');
                    row.className = 'q-row';

                    const label = document.createElement('span');
                    label.className = 'q-label';
                    label.textContent = q.id + ')';

                    const leftNum = document.createElement('span');
                    leftNum.className = 'num';
                    leftNum.textContent = q.left;

                    const box = document.createElement('span');
                    box.className = 'box';
                    box.dataset.box = 'true';
                    box.textContent = '';

                    const rightNum = document.createElement('span');
                    rightNum.className = 'num';
                    rightNum.textContent = q.right;

                    row.appendChild(label);
                    row.appendChild(leftNum);
                    row.appendChild(box);
                    row.appendChild(rightNum);

                    const optRow = document.createElement('div');
                    optRow.className = 'options';

                    const btnGt = createSymbolButton('>', 'gt');
                    const btnLt = createSymbolButton('<', 'lt');
                    const btnEq = createSymbolButton('=', 'eq');

                    const btns = [btnGt, btnLt, btnEq];
                    optRow.append(btnLt, btnEq, btnGt);

                    const feedbackRow = document.createElement('div');
                    feedbackRow.className = 'feedback-row';
                    const emojiSpan = document.createElement('span');
                    emojiSpan.className = 'emoji-feedback';
                    emojiSpan.textContent = '';
                    feedbackRow.appendChild(emojiSpan);

                    qDiv.appendChild(row);
                    qDiv.appendChild(optRow);
                    qDiv.appendChild(feedbackRow);
                    container.appendChild(qDiv);

                    let locked = false;

                    function lockQuestion(symbol) {
                        locked = true;
                        qDiv.dataset.locked = 'true';
                        qDiv.classList.add('correct');
                        box.classList.add('correct-symbol');
                        box.textContent = symbol;
                        btns.forEach(b => b.disabled = true);
                        emojiSpan.textContent = '✅';
                        emojiSpan.classList.add('show');
                        correctCount++;
                        sfx.good();
                        showCorrectEmoji();
                        burstConfetti(qDiv, '#f7d44a');

                        if (correctCount === total) {
                            allCorrect = true;
                            sfx.finish();
                            setTimeout(() => {
                                popupOverlay.style.display = 'flex';
                                burstConfetti(popupOverlay, '#ffd966');
                                setTimeout(() => burstConfetti(popupOverlay, '#4ecdc4'), 400);
                                setTimeout(() => burstConfetti(popupOverlay, '#ff9f45'), 800);
                            }, 1000);
                        }
                    }

                    function handleWrong() {
                        qDiv.classList.add('wrong-shake');
                        setTimeout(() => qDiv.classList.remove('wrong-shake'), 300);
                        emojiSpan.textContent = '❌';
                        emojiSpan.classList.add('show');
                        sfx.bad();
                        showWrongEmoji();
                        box.textContent = '';
                        box.classList.remove('correct-symbol', 'filled');
                        setTimeout(() => {
                            if (!locked) {
                                btns.forEach(b => b.disabled = false);
                            }
                            emojiSpan.classList.remove('show');
                        }, 500);
                    }

                    function handleSymbolClick(symbol) {
                        if (locked) return;
                        btns.forEach(b => b.disabled = true);
                        box.textContent = symbol;
                        box.classList.add('filled');

                        if (symbol === q.correct) {
                            lockQuestion(symbol);
                        } else {
                            handleWrong();
                        }
                    }

                    btnGt.addEventListener('click', () => handleSymbolClick('>'));
                    btnLt.addEventListener('click', () => handleSymbolClick('<'));
                    btnEq.addEventListener('click', () => handleSymbolClick('='));

                    btns.forEach(b => b.disabled = false);
                });
            }

            function createSymbolButton(symbol, cls) {
                const btn = document.createElement('button');
                btn.className = `opt-btn ${cls}`;
                if (symbol === '<') btn.innerHTML = '&lt;';
                else if (symbol === '>') btn.innerHTML = '&gt;';
                else btn.textContent = '=';
                btn.setAttribute('aria-label', symbol);
                return btn;
            }

            function resetGame() {
                popupOverlay.style.display = 'none';
                renderQuestions();
                correctCount = 0;
                allCorrect = false;
            }

            document.getElementById('playAgainBtn').addEventListener('click', resetGame);

            // initial render
            renderQuestions();

            // popup overlay click: only close via button (but we keep it same as second code)
            popupOverlay.addEventListener('click', function (e) {
                if (e.target === popupOverlay) {
                    // ignore
                }
            });

        })();
    </script>
    <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
