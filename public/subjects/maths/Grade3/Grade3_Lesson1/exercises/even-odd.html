<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .wrap {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
      text-align: center;
      flex-wrap: wrap;
    }

    .title-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 19px;
      background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .9), rgba(255, 255, 255, 0) 42%), #f97316;
      box-shadow: 0 6px 14px -4px rgba(249, 115, 22, .6);
      flex-shrink: 0;
    }

    .topbar h1 {
      font-size: 22px;
      color: #2d3250;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .card-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
    }

    .questions-container {
      width: 100%;
      background: transparent;
      padding: 0;
      margin: 0;
    }

    .question-grid {
      display: grid;
      grid-template-columns: 1fr;
      justify-items: center;
      max-width: 460px;
      gap: 24px 32px;
      margin: 6px auto 4px;
    }

    .question-item {
      background: #ffffff;
      border-radius: 32px;
      border: 4px solid #01b5bb;
      padding: 28px 24px 24px;
      box-shadow: 0 20px 42px -18px rgba(45, 50, 80, .32), 0 0 0 7px color-mix(in srgb, #16f9f9 10%, transparent);
      transition: border-color .3s, box-shadow .3s, background 0.2s;
      position: relative;
      opacity: 0;
      transform: translateY(16px);
      animation: rise .45s cubic-bezier(.34, 1.56, .64, 1) forwards;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      /* align-items: center; */
    }

    .question-item:nth-child(2) {
      animation-delay: 0.08s;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .question-item.locked {
      border-color: #4caf50;
      box-shadow: 0 20px 42px -18px rgba(76, 175, 80, .32), 0 0 0 7px rgba(76, 175, 80, .10);
      opacity: 0.85;
    }

    .question-item.wrong-flash {
      animation: wrongBlink 0.45s ease;
    }

    @keyframes wrongBlink {

      0%,
      100% {
        border-color: var(--qc, #f97316);
      }

      25% {
        border-color: #ef5675;
        background: #ffd9e6;
      }

      75% {
        border-color: #ef5675;
        background: #ffd9e6;
      }
    }

    .q-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 14px;
      font-weight: 700;
      color: #2d3250;
      justify-content: center;
    }

    .q-letter {
      font-weight: 800;
      font-size: 28px;
      color: #075391;
      padding: 10px;
      border-radius: 30px;
    }

    .q-number {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #1e1e2a;
    }

    .q-status {
      margin-left: auto;
      font-size: 24px;
      color: #b2b8c8;
    }

    .q-status.correct {
      color: #4caf50;
    }

    .q-status.wrong {

    }

    .answer-box {
      background: white;
      border-radius: 16px;
      border: 3px solid #e7ebf3;
      padding: 18px 16px;
      min-height: 80px;

      align-items: center;
      justify-content: center;

      font-weight: 700;
      color: #2d3250;

      margin-bottom: 18px;
      text-align: center;

       text-transform: capitalize;
    }

    .answer-box.filled-correct {

      background: #eefbef;

    .option-btn:active:not(:disabled) {

    }

    .option-btn:disabled {

      box-shadow: none;
      pointer-events: none;
    }

    .option-btn.even {

    @keyframes confettiBurst {
      from {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0) scale(.7);
      }

      to {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(520deg) scale(1);
      }
    }

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title-icon"><i class="fa-regular fa-circle-question"></i></div>
      <h1>Write whether the given numbers are even or odd.</h1>
    </div>

    <div class="card-wrapper" id="cardWrapper">
      <div id="questionsGrid" style="width:100%;"></div>
      <div class="nav-container">
        <button class="nav-btn-abs btn-prev-abs" id="prevBtnAbs" disabled>
          <i class="fa-solid fa-chevron-left nav-icon"></i> Prev
        </button>
        <button class="nav-btn-abs btn-next-abs" id="nextBtnAbs" disabled>
          Next <i class="fa-solid fa-chevron-right nav-icon"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    function speak(t) {
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-US";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }
    (function () {
      const RAW = [
        { letter: 'a', num: 4258 },
        { letter: 'b', num: 3267 },
        { letter: 'c', num: 2650 },
        { letter: 'd', num: 1489 },
        { letter: 'e', num: 9964 },
        { letter: 'f', num: 7543 }
      ];

      let questions = RAW.map(item => ({
        letter: item.letter,
        num: item.num,
        answer: item.num % 2 === 0 ? 'even' : 'odd',
        userChoice: null,
        locked: false,
      }));

      let currentIndex = 0;
      const grid = document.getElementById('questionsGrid');
      const prevBtn = document.getElementById('prevBtnAbs');
      const nextBtn = document.getElementById('nextBtnAbs');

      let audioCtx = null;
      function getCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
      function beep(freq, duration, type) {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type || 'sine';
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(ctx.destination);
          gain.gain.setValueAtTime(0.16, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration / 1000);
          osc.start();
          osc.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }
      const sfx = {
        good: () => { beep(660, 110, 'sine'); setTimeout(() => beep(880, 160, 'sine'), 110); },
        bad: () => beep(180, 220, 'sawtooth'),
        finish: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 150, 'sine'), i * 130)); }
      };

      function burstConfetti(fromEl, color) {
        const rect = fromEl.getBoundingClientRect();
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;
        confetti({
          particleCount: 30,
          spread: 70,
          origin: { x, y },
          startVelocity: 20,
          colors: [color, '#ffd54f', '#ff9f45', '#7ed957', '#ff6b6b', '#4ecdc4']
        });
      }

      function showCorrectEmoji() {
        const colors = ['#ff6fb5', '#ffd54f', '#7ed957', '#4fc3f7', '#b388ff'];
        for (let i = 0; i < 18; i++) {
          const piece = document.createElement('span');
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 90 + Math.random() * 100;
          piece.className = 'celebration-piece';
          piece.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
          piece.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * .12}s`;
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1600);
        }
        const emoji = document.createElement('div');
        emoji.className = 'emoji-pop';
        emoji.textContent = '🥳';
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1850);
      }

      function showWrongEmoji() {
        const emoji = document.createElement('div');
        emoji.className = 'emoji-pop';
        emoji.textContent = '😔';
        emoji.style.fontSize = '70px';
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);
      }

      function showFinalPopup() {
        const old = document.querySelector('.final-overlay');
        if (old) old.remove();
        sfx.finish();
        const overlay = document.createElement('div');
        overlay.className = 'final-overlay';
        overlay.innerHTML = `
        <div class="final-modal">
          <span class="icon-big">🎉</span>
          <h2>All Done!</h2>
          <p>Amazing! You got them all right!</p>
          <button class="btn-playagain" id="playAgainBtn"><i class="fa-solid fa-rotate-right"></i> Play again</button>
        </div>
      `;
        document.body.appendChild(overlay);
        setTimeout(() => {
          const modal = overlay.querySelector('.final-modal');
          if (modal) burstConfetti(modal, '#ffd54f');
          setTimeout(() => { if (modal) burstConfetti(modal, '#4ecdc4'); }, 400);
          setTimeout(() => { if (modal) burstConfetti(modal, '#ff9f45'); }, 800);
        }, 100);
        overlay.querySelector('#playAgainBtn').addEventListener('click', function () {
          overlay.remove();
          playAgain();
        });
      }

      function renderQuestion() {
        grid.innerHTML = '';
        const idx = currentIndex;
        const color = '#f97316';

        const container = document.createElement('div');
        container.className = 'questions-container';

        let gridHTML = `<div class="question-grid">`;
        const start = idx;
        const end = Math.min(idx + 1, questions.length);
        for (let i = start; i < end; i++) {
          const q = questions[i];
          const isLocked = q.locked;
          const userChoice = q.userChoice;
          const isCorrect = userChoice === q.answer;
          const statusIcon = isLocked ? (isCorrect ? '✅' : '❌') : '';
          const statusClass = isLocked ? (isCorrect ? 'correct' : 'wrong') : '';

          gridHTML += `
          <div class="question-item ${isLocked ? 'locked' : ''}" data-qidx="${i}" style="--qc: ${color};">
            <div class="q-head">
              <span class="q-letter">${q.letter})</span>
              <span class="q-number">${q.num}</span>
              <span class="q-status ${statusClass}">${statusIcon}</span>
            </div>
            <div class="answer-box" id="answerBox_${i}">
              ${userChoice ? (isCorrect ? '✅ ' + userChoice : '❌ ' + userChoice) : '?'}
            </div>
            <div class="option-group">
              <button class="option-btn even" data-qidx="${i}" data-value="even" ${isLocked ? 'disabled' : ''}>Even</button>
              <button class="option-btn odd" data-qidx="${i}" data-value="odd" ${isLocked ? 'disabled' : ''}>Odd</button>
            </div>
          </div>
        `;
        }
        gridHTML += `</div>`;
        gridHTML += `
        <div class="qfoot">
          <div class="progress-indicator">${start + 1} / ${questions.length}</div>
        </div>
      `;
        container.innerHTML = gridHTML;
        grid.appendChild(container);

        container.querySelectorAll('.option-btn').forEach(btn => {
          btn.addEventListener('click', function (e) {
            const qIdx = parseInt(this.dataset.qidx);
            const value = this.dataset.value;
            handleOptionClick(qIdx, value);
          });
        });

        updateNavButtons();
      }

      function handleOptionClick(qIdx, chosen) {
        const q = questions[qIdx];
        if (q.locked) return;

        const isCorrect = (chosen === q.answer);
        const box = document.getElementById(`answerBox_${qIdx}`);
        const item = box?.closest('.question-item');

        if (isCorrect) {
          q.locked = true;
          q.userChoice = chosen;
          if (box) {
            box.textContent = '✅ ' + chosen;
            box.classList.remove('filled-wrong');
            box.classList.add('filled-correct');
          }
          const parent = box?.closest('.question-item');
          if (parent) {
            parent.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            parent.classList.add('locked');
          }
          const statusSpan = item?.querySelector('.q-status');
          if (statusSpan) { statusSpan.textContent = '✅'; statusSpan.className = 'q-status correct'; }

          // sfx.good();
          speak('Correct!');
          burstConfetti(item || document.getElementById('questionsGrid'), '#4caf50');
          showCorrectEmoji();

          if (allLocked()) {
            setTimeout(() => showFinalPopup(), 1600);
          }
          renderQuestion();
        } else {
          if (box) {
            box.textContent = '❌ ' + chosen;
            box.classList.add('filled-wrong');
            if (item) {
              item.classList.remove('wrong-flash');
              void item.offsetWidth;
              item.classList.add('wrong-flash');
            }
            // sfx.bad();
            speak("Try Again!");
            showWrongEmoji();
            setTimeout(() => {
              if (box && !q.locked) {
                box.textContent = '?';
                box.classList.remove('filled-wrong');
              }
              if (item) item.classList.remove('wrong-flash');
            }, 550);
          }
        }
      }

      function allLocked() {
        return questions.every(q => q.locked === true);
      }

      function updateNavButtons() {
        const start = currentIndex;
        const end = Math.min(start + 1, questions.length);
        let pairLocked = true;
        for (let i = start; i < end; i++) {
          if (!questions[i].locked) pairLocked = false;
        }
        const hasNext = (currentIndex + 1 < questions.length);

        prevBtn.disabled = (currentIndex === 0);

        if (allLocked()) {
          nextBtn.disabled = true;
        } else {
          nextBtn.disabled = !(pairLocked && hasNext);
        }
      }

      function goPrev() {
        if (currentIndex >= 1) {
          currentIndex -= 1;
          renderQuestion();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      function goNext() {
        if (currentIndex + 1 < questions.length) {
          const start = currentIndex;
          const end = Math.min(start + 1, questions.length);
          let allLockedPair = true;
          for (let i = start; i < end; i++) {
            if (!questions[i].locked) allLockedPair = false;
          }
          if (allLockedPair) {
            currentIndex += 1;
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        }
      }

      prevBtn.addEventListener('click', goPrev);
      nextBtn.addEventListener('click', goNext);

      function playAgain() {
        questions = RAW.map(item => ({
          letter: item.letter,
          num: item.num,
          answer: item.num % 2 === 0 ? 'even' : 'odd',
          userChoice: null,
          locked: false,
        }));
        currentIndex = 0;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      renderQuestion();
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>

</body>

</html>
