<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Even Number Explorer · Quiz</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .wrap {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 2;
      padding: 20px 0;
    }

    /* ---------- header row ---------- */
    .header-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 34px;
      flex-wrap: wrap;
      position: relative;
      justify-content: center;
    }

    .bulb {
      width: 90px;
      height: 130px;
      position: relative;
      flex-shrink: 0;
      opacity: 0;
      animation: popIn .5s cubic-bezier(.34, 1.56, .64, 1) .1s forwards;
    }

    @keyframes popIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .bubble {
      position: relative;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 10px 18px 16px;
      box-shadow: none;
      opacity: 0;
      transform: translateY(-10px);
      animation: dropIn .55s cubic-bezier(.34, 1.56, .64, 1) .25s forwards;
    }

    @keyframes dropIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .bubble:after {
      content: "";
      position: absolute;
      left: 0%;
      right: 0%;
      bottom: 3px;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #68b5c9;
      opacity: .75;
    }

    .bubble h1 {
      font-size: 42px;
      font-weight: 800;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: .2px;
    }

    .bubble h1 .odd {
      color: #26345f;
    }

    .bubble h1 .hunt {
      color: #26345f;
    }

    .bubble h1 .emoji-big {
      font-size: 36px;
      animation: wiggle 2.5s ease-in-out infinite;
      display: none;
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-6deg) scale(1);
      }

      50% {
        transform: rotate(6deg) scale(1.1);
      }
    }

    .sparkle-icon {
      font-size: 26px;
      margin-right: 4px;
      animation: twinkle 1.6s ease-in-out infinite;
      display: none;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 1;
        transform: scale(1) rotate(0);
      }

      50% {
        opacity: .5;
        transform: scale(.85) rotate(-8deg);
      }
    }

    /* ---------- instruction pill ---------- */
    .instruction-bar {
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(255,255,255,.72);
      border: 2px solid #d7eee8;
      border-radius: 22px;
      padding: 20px 28px;
      box-shadow: 0 7px 0 #edf8f4;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp .55s ease .5s forwards;
      position: relative;
    }

    .instruction-bar::before {
      content: "✦";
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #fff3c7;
      color: #e8aa20;
      font-size: 21px;
      display: none;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .instruction-text {
      font-size: 27px;
      font-weight: 700;
      color: #26345f;
      line-height: 1.35;
    }

    .instruction-text .hl {
       font-size: 27px;
      font-weight: 700;
      color: #26345f;
      line-height: 1.35;
    }

    .instruction-text .hl2 {
      font-size: 27px;
      font-weight: 700;
      color: #26345f;
      line-height: 1.35;
    }

    .question-label {
      font-weight: 800;
      color: #6c5ce7;
      margin-right: 6px;
    }

    /* ---------- options row ---------- */
    .option-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      justify-content: center;
      gap: 26px;
      flex-wrap: wrap;
    }

    .option-card {
      position: relative;
      width: 200px;
      min-height: 150px;
      background: rgba(255,255,255,.92);
      border: 3px solid var(--card-color);
      border-radius: 24px;
      padding: 34px 20px 26px;
      box-shadow: 0 6px 0 var(--card-shadow), 0 12px 22px -14px rgba(38,52,95,.22);
      text-align: center;
      opacity: 0;
      transform: translateY(18px);
      animation: cardRise .5s cubic-bezier(.34, 1.56, .64, 1) forwards;
      transition: box-shadow .2s, transform .15s, border-color .2s;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
    }

    .option-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: var(--card-color);
      opacity: .9;
    }

    .option-card::after {
      content: "●";
      position: absolute;
      top: 16px;
      left: 18px;
      color: var(--card-color);
      font-size: 11px;
      opacity: .75;
    }

    .option-card:nth-child(1) {
      --card-color: #9f8be8;
      --card-shadow: #ddd5f8;
      animation-delay: .7s;
    }

    .option-card:nth-child(2) {
      --card-color: #58c9b0;
      --card-shadow: #c9eee6;
      animation-delay: .8s;
    }

    .option-card:nth-child(3) {
      --card-color: #efc34f;
      --card-shadow: #f7e8ae;
      animation-delay: .9s;
    }

    .option-card:nth-child(4) {
      --card-color: #ee8faa;
      --card-shadow: #f7d0da;
      animation-delay: 1s;
    }

    @keyframes cardRise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .option-card:hover:not(.locked) {
      transform: translateY(-4px) scale(1.02);
    }

    .option-card:active:not(.locked) {
      transform: scale(0.96);
    }

    .option-card.locked {
      cursor: default;
      opacity: 0.5;
      transform: scale(0.96);
    }

    .option-number {
      font-size: 44px;
      font-weight: 800;
      color: #26345f;
      pointer-events: none;
      letter-spacing: .5px;
    }

    .corner-dots {
      display: none;
    }

    /* ===== CORRECT ===== */
    .option-card.correct {
      border-color: #4caf50 !important;
      background: #eefbef;
      box-shadow: 0 0 0 6px rgba(76, 175, 80, 0.15), 0 8px 0 -2px #4caf50, 0 14px 24px -12px rgba(76, 175, 80, 0.4);
      animation: popCorrect 0.5s cubic-bezier(.34, 1.56, .64, 1);
      transform: scale(1.04);
    }

    @keyframes popCorrect {
      0% {
        transform: scale(0.85) rotate(-3deg);
      }

      40% {
        transform: scale(1.12) rotate(2deg);
      }

      100% {
        transform: scale(1.04) rotate(0deg);
      }
    }

    .option-card.correct .check-mark {
      opacity: 1;
      transform: scale(1);
    }

    .check-mark {
      position: absolute;
      top: -10px;
      right: -10px;
      font-size: 28px;
      opacity: 0;
      transform: scale(0.2);
      transition: opacity .3s, transform .5s cubic-bezier(.34, 1.56, .64, 1);
      pointer-events: none;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.08));
    }

    /* ===== WRONG ===== */
    .option-card.wrong-flash {
      animation: wrongShake 0.5s ease;
      border-color: #ef5675 !important;
      background: #fff1f4;
    }

    @keyframes wrongShake {

      0%,
      100% {
        transform: translateX(0) scale(1);
      }

      15% {
        transform: translateX(-10px) scale(1.04);
      }

      30% {
        transform: translateX(10px) scale(1.04);
      }

      45% {
        transform: translateX(-6px);
      }

      60% {
        transform: translateX(6px);
      }

      80% {
        transform: translateX(-3px);
      }
    }

    .option-card.other-dim {
      opacity: 0.45;
    }

    /* ---------- bottom landscape ---------- */
    .landscape {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== CELEBRATION PIECES (EXACT from reference) ===== */
    .celebration-piece {
      position: fixed;
      left: 50%;
      top: 42%;
      width: 10px;
      height: 18px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9998;
      animation: confettiBurst 1.4s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    @keyframes confettiBurst {
      from {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0) scale(.7);
      }

      to {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(520deg) scale(1);
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 42%;
      font-size: 80px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      animation: emojiPop 1.8s cubic-bezier(.2, .8, .2, 1) forwards;
      filter: drop-shadow(0 10px 14px rgba(27, 37, 89, .2));
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      }

      28% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18) rotate(8deg);
      }

      68% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(1) rotate(-4deg);
      }

      to {
        opacity: 0;
        transform: translate(-50%, -68%) scale(.9) rotate(0);
      }
    }

    /* ===== FINAL OVERLAY (EXACT from reference) ===== */
    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      transition: transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: scale(.95);
    }

    /* ===== RESPONSIVE (EXACT from reference) ===== */
    @media (max-width:900px) {
      body {
        align-items: center;
        padding: 20px;
      }
    }

    @media (max-width:768px) {
      body {
        padding: 30px 10px 10px;
        align-items: flex-start;
      }

      .bubble h1 {
        font-size: 28px;
      }

      .bubble {
        padding: 14px 24px;
      }

      .instruction-bar {
        padding: 20px 26px;
        gap: 16px;
      }

      .instruction-text {
        font-size: 19px;
      }

      .option-card {
        width: 160px;
        min-height: 125px;
        padding: 30px 18px 22px;
      }

      .option-number {
        font-size: 34px;
      }
    }

    @media (max-width:600px) {
      .header-row {
        flex-direction: column;
        text-align: center;
      }

      .bubble:after {
        display: none;
      }
    }

    @media (max-width:480px) {
      body {
        padding: 30px 0 10px;
        align-items: flex-start;
      }

      .bubble h1 {
        font-size: 22px;
        white-space: normal;
      }

      .bubble h1 .emoji-big {
        font-size: 24px;
      }

      .instruction-bar {
        flex-direction: column;
        text-align: center;
        border-radius: 32px;
        padding: 20px 18px;
      }

      .instruction-text {
        font-size: 16px;
      }

      .option-row {
        gap: 16px;
      }

      .option-card {
        width: 128px;
        min-height: 108px;
        padding: 28px 12px 18px;
        border-radius: 20px;
        border-width: 3px;
      }

      .option-number {
        font-size: 26px;
      }

      .check-mark {
        font-size: 20px;
        top: -6px;
        right: -6px;
      }
    }

    @media (max-width:380px) {
      .option-card {
        width: 42%;
        min-height: 96px;
        padding: 26px 10px 14px;
      }

      .option-number {
        font-size: 22px;
      }

      .bubble h1 {
        font-size: 18px;
      }

      .instruction-text {
        font-size: 14px;
      }
    }

    @media screen and (min-width:1025px) and (max-width:1440px) {
      .wrap {
        max-width: 900px;
      }

      .bubble h1 {
        font-size: 48px;
      }

      .instruction-text {
        font-size: 30px;
      }

      .option-card {
        width: 230px;
        padding: 40px;
      }

      .option-number {
        font-size: 50px;
      }
    }

    @media screen and (min-width:1441px) and (max-width:1920px) {
      .wrap {
        max-width: 1000px;
      }

      .bubble h1 {
        font-size: 52px;
      }

      .instruction-text {
        font-size: 35px;
      }

      .option-card {
        width: 260px;
        padding: 45px;
      }

      .option-number {
        font-size: 56px;
      }

      .bulb {
        width: 110px;
        height: 180px;
      }
    }

    @media screen and (min-width:1921px) {
      .wrap {
        max-width: 1100px;
      }

      .bubble h1 {
        font-size: 56px;
      }

      .instruction-text {
        font-size: 36px;
      }

      .option-card {
        width: 290px;
        padding: 50px;
      }

      .option-number {
        font-size: 62px;
      }

      .bulb {
        width: 120px;
        height: 160px;
      }
    }
  </style>

<body>
  <div class="wrap">
    <div class="header-row">
      <svg class="bulb" viewBox="0 0 90 130" fill="none">
        <g stroke="#f6c744" stroke-width="4" stroke-linecap="round">
          <line x1="45" y1="2" x2="45" y2="16" />
          <line x1="14" y1="14" x2="23" y2="24" />
          <line x1="76" y1="14" x2="67" y2="24" />
          <line x1="2" y1="46" x2="16" y2="46" />
          <line x1="88" y1="46" x2="74" y2="46" />
        </g>
        <circle cx="45" cy="48" r="34" fill="#ffe9a8" stroke="#f6c744" stroke-width="3" />
        <circle cx="33" cy="44" r="4" fill="#1b2559" />
        <path d="M55 40 q6 4 0 8" stroke="#1b2559" stroke-width="3" fill="none" stroke-linecap="round" />
        <path d="M32 58 q13 10 26 0" stroke="#1b2559" stroke-width="3.5" fill="none" stroke-linecap="round" />
        <circle cx="24" cy="54" r="5" fill="#f9a8c4" opacity=".7" />
        <circle cx="66" cy="54" r="5" fill="#f9a8c4" opacity=".7" />
        <rect x="30" y="80" width="30" height="14" rx="3" fill="#b7a6f0" />
        <rect x="33" y="94" width="24" height="8" rx="2" fill="#8f7ad1" />
        <rect x="35" y="102" width="20" height="8" rx="2" fill="#1b2559" />
      </svg>

      <div class="bubble">
        <h1>
          <span class="sparkle-icon">🌟</span>
          <span class="emoji-big">🔢</span>
          <span class="odd">Even</span> <span class="hunt">Number</span> <span class="odd">Explorer</span>
          <span class="emoji-big">🧭</span>
        </h1>
      </div>
    </div>

    <div class="instruction-bar">
      <span style="font-size:40px;">a)</span>
      <p class="instruction-text">
        Identify and circle the <span class="hl">even</span> number that is more than <span class="hl2">7261</span>.
      </p>
    </div>

    <div class="option-row" id="optionRow"></div>
  </div>

  <script>
    (function () {
      const OPTIONS = [7126, 7612, 7216, 6172];
      const ANSWER = 7612;

      const row = document.getElementById('optionRow');
      let locked = false;

      // ─── AUDIO (EXACT from reference) ──────────────────────────────
      let audioCtx = null;

      function getCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }

      function beep(freq, duration, type) {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type || 'sine';
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(ctx.destination);
          gain.gain.setValueAtTime(0.16, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration / 1000);
          osc.start();
          osc.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sfx = {
        good: () => {
          beep(660, 110, 'sine');
          setTimeout(() => beep(880, 160, 'sine'), 110);
        },
        bad: () => beep(180, 220, 'sawtooth'),
        finish: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 150, 'sine'), i * 130)); }
      };

      // ─── CONFETTI (EXACT from reference) ──────────────────────────
      function burstConfetti(fromEl, color) {
        const rect = fromEl.getBoundingClientRect();
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;
        confetti({
          particleCount: 30,
          spread: 70,
          origin: { x, y },
          startVelocity: 20,
          colors: [color, '#ffd54f', '#ff9f45', '#7ed957', '#ff6b6b', '#4ecdc4']
        });
      }

      function showCorrectEmoji() {
        const colors = ['#ff6fb5', '#ffd54f', '#7ed957', '#4fc3f7', '#b388ff'];
        for (let i = 0; i < 18; i++) {
          const piece = document.createElement('span');
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 90 + Math.random() * 100;
          piece.className = 'celebration-piece';
          piece.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
          piece.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * .12}s`;
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1600);
        }
        const emoji = document.createElement('div');
        emoji.className = 'emoji-pop';
        emoji.textContent = '🥳';
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1850);
      }

      function showWrongEmoji() {
        const emoji = document.createElement('div');
        emoji.className = 'emoji-pop';
        emoji.textContent = '😔';
        emoji.style.fontSize = '70px';
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);
      }

      // ─── FINAL POPUP (EXACT from reference) ──────────────────────
      function showFinalPopup() {
        sfx.finish();
        const overlay = document.createElement('div');
        overlay.className = 'final-overlay';
        overlay.innerHTML = `
          <div class="final-modal">
            <span class="icon-big">🎉</span>
            <h2>All Done!</h2>
            <p>Amazing! You got them all right!</p>
            <button class="btn-playagain" id="playAgainBtn"><i class="fa-solid fa-rotate-right"></i> Play again</button>
          </div>
        `;
        document.body.appendChild(overlay);

        setTimeout(() => {
          const modal = overlay.querySelector('.final-modal');
          if (modal) burstConfetti(modal, '#ffd54f');
          setTimeout(() => { if (modal) burstConfetti(modal, '#4ecdc4'); }, 400);
          setTimeout(() => { if (modal) burstConfetti(modal, '#ff9f45'); }, 800);
        }, 100);

        overlay.querySelector('#playAgainBtn').addEventListener('click', function () {
          overlay.remove();
          init();
        });
      }

      // ─── RENDER OPTIONS ────────────────────────────────────
      function render() {
        row.innerHTML = '';
        OPTIONS.forEach(num => {
          const card = document.createElement('div');
          card.className = 'option-card';
          card.dataset.value = num;
          card.innerHTML = `
            <div class="corner-dots"><span></span><span></span><span></span></div>
            <div class="option-number">${num}</div>
            <span class="check-mark">✅</span>
          `;
          card.addEventListener('click', () => handleClick(num, card));
          row.appendChild(card);
        });
      }

      // ─── GAME LOGIC ────────────────────────────────────────
      function handleClick(value, card) {
        if (locked) return;
        const isCorrect = (value === ANSWER);

        if (isCorrect) {
          locked = true;
          card.classList.add('correct');
          document.querySelectorAll('.option-card').forEach(c => {
            c.classList.add('locked');
            if (c !== card) c.classList.add('other-dim');
          });
          sfx.good();
          burstConfetti(card, '#4caf50');
          showCorrectEmoji();
          setTimeout(() => showFinalPopup(), 750);
        } else {
          card.classList.remove('wrong-flash');
          void card.offsetWidth;
          card.classList.add('wrong-flash');
          sfx.bad();
          showWrongEmoji();
          setTimeout(() => {
            card.classList.remove('wrong-flash');
          }, 500);
        }
      }

      function init() {
        locked = false;
        render();
      }

      init();
    })();
  </script>
<script src="../../shared/quiz-ui.js"></script>
</body>

</html>
