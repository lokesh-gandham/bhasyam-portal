<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greatest and Smallest Number Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #12265d;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1080px;
      min-height: 610px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ===== HEADING — SAME STYLE FAMILY AS PREVIOUS TEMPLATE ===== */
    .quiz-heading {
      text-align: center;
      margin-bottom: 18px;
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: #12265d;
      font-size: 34px;
      line-height: 1.08;
      font-weight: 800;
    }

    .heading-icon {
      font-size: 30px;
      animation: wiggle 2.5s ease-in-out infinite;
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-6deg) scale(1);
      }

      50% {
        transform: rotate(6deg) scale(1.08);
      }
    }

    /* ===== QUESTION ===== */
    .question {
      position: relative;
      width: 100%;
      max-width: 980px;
      min-height: 255px;
      margin: 0 auto 10px;
      padding: 18px 34px 24px;
      border: 3px solid #d8ccf7;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 7px 0 #eeeaff, 0 14px 28px rgba(45, 50, 80, .08);
    }

    .question-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    .question-letter {
      position: absolute;
      top: 6px;
      left: 5px;
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      color: #fff;
      background: linear-gradient(145deg, #ff5d94, #e83f79);
      box-shadow: 0 6px 0 #c92f63;
      font-size: 25px;
      font-weight: 800;
    }

    .instruction {
      color: #12265d;
      font-size: 23px;
      line-height: 1.25;
      font-weight: 700;
      text-align: center;
    }

    /* ===== SIMPLE WORKSHEET NUMBER LAYOUT ===== */
    .numbers {
      width: min(820px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      column-gap: 30px;
      row-gap: 28px;
      justify-items: center;
      align-items: center;
    }

    .number-card {
      position: relative;
      width: 100%;
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: transform .18s ease;
    }

    .number-card:nth-child(1),
    .number-card:nth-child(2),
    .number-card:nth-child(3) {
      grid-column: span 2;
    }

    .number-card:nth-child(4) {
      grid-column: 2 / span 2;
    }

    .number-card:nth-child(5) {
      grid-column: 4 / span 2;
    }

    .number-card:hover {
      transform: translateY(-2px);
    }

    .number-card:active {
      cursor: grabbing;
    }

    .number-value {
      position: relative;
      z-index: 2;
      display: inline-block;
      padding: 8px 14px;
      font-size: 42px;
      line-height: 1;
      font-weight: 800;
      color: #12265d;
    }

    /* Simple circle appears around the number itself */
    .number-card.circled .number-value {
      padding: 12px 18px;
    }

    .number-card.circled .number-value::before {
      content: "";
      position: absolute;
      inset: -7px -12px;
      border: 4px solid #ff4e83;
      border-radius: 50%;
      z-index: -1;
      animation: markPop .3s ease;
    }

    /* Simple underline appears directly underneath the number */
    .number-card.underlined .number-value::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: -5px;
      height: 5px;
      border-radius: 99px;
      background: #4e8ff0;
      animation: lineDraw .3s ease;
    }

    @keyframes markPop {
      from {
        transform: scale(.7);
        opacity: .2;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes lineDraw {
      from {
        transform: scaleX(0);
        transform-origin: left;
      }

      to {
        transform: scaleX(1);
        transform-origin: left;
      }
    }

    /* Wrong drop */
    .number-card.marked-wrong {
      animation: targetWrong .58s ease;
    }

    @keyframes targetWrong {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-8px);
      }

      40% {
        transform: translateX(8px);
      }

      60% {
        transform: translateX(-6px);
      }

      80% {
        transform: translateX(5px);
      }
    }

    /* ===== SIMPLE FLOATING DRAG TOOLS ===== */
    .tool-area {
      text-align: center;
      margin-top: 2px;
    }

    .tool-title {
      margin-bottom: 8px;
      color: #626981;
      font-size: 16px;
      font-weight: 700;
    }

    .tools {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 34px;
    }

    .drag-tool {
      position: relative;
      width: 74px;
      height: 62px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
      touch-action: none;
      background: transparent;
      transition: transform .16s ease, opacity .2s ease;
    }

    .drag-tool:hover:not(.used) {
      transform: translateY(-4px) scale(1.06);
    }

    .drag-tool:active {
      cursor: grabbing;
      transform: scale(.94);
    }

    .drag-tool.circle-tool {
      color: #ff4e83;
      background: rgba(255, 78, 131, .08);
    }

    .drag-tool.underline-tool {
      color: #4e8ff0;
      background: rgba(78, 143, 240, .08);
    }

    .tool-symbol {
      font-size: 52px;
      line-height: .8;
      font-weight: 800;
    }

    .drag-tool.used {
      opacity: .25;
      cursor: default;
    }

    /* Floating mark that follows the pointer/finger during dragging */
    .drag-ghost {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 20000;
      pointer-events: none;
      transform: translate(-50%, -50%);
      opacity: .94;
      filter: drop-shadow(0 5px 8px rgba(45, 50, 80, .18));
    }

    .drag-ghost.circle {
      width: 76px;
      height: 76px;
      border: 5px solid #ff4e83;
      border-radius: 50%;
    }

    .drag-ghost.underline {
      width: 110px;
      height: 28px;
      border-bottom: 6px solid #4e8ff0;
    }

    /* ===== NAVIGATION — SAME OLD STYLE ===== */
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 24px;
      padding-top: 15px;
      border-top: 2px solid #e8e3de;
    }

    .nav button {
      min-width: 120px;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      color: #fff;
      background: linear-gradient(180deg, #42d466, #0bb852);
      box-shadow: 0 6px 0 #079443;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .2s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #079443;
    }

    .nav button:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .progress {
      min-width: 58px;
      text-align: center;
      color: #12265d;
      font-size: 17px;
      font-weight: 800;
    }

    /* ===== SAME OLD CONFETTI / EMOJI EFFECTS ===== */
    .celebration-piece {
      position: fixed;
      left: 50%;
      top: 42%;
      width: 10px;
      height: 18px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9998;
      animation: confettiBurst 1.4s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    @keyframes confettiBurst {
      from {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0) scale(.7);
      }

      to {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(520deg) scale(1);
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 42%;
      font-size: 80px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      animation: emojiPop 1.8s cubic-bezier(.2, .8, .2, 1) forwards;
      filter: drop-shadow(0 10px 14px rgba(45, 50, 80, .18));
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      }

      28% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18) rotate(8deg);
      }

      68% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(1) rotate(-4deg);
      }

      to {
        opacity: 0;
        transform: translate(-50%, -68%) scale(.9) rotate(0);
      }
    }

    /* ===== SAME OLD FINAL POPUP ===== */
    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      background: rgba(255, 255, 255, .48);
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      transition: transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: scale(.95);
    }

    /* ===== LAPTOP DIMENSIONS ===== */
    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        max-width: 1050px;
        min-height: 590px;
      }

      .quiz-heading h1 {
        font-size: 34px;
      }

      .question {
        min-height: 265px;
      }

      .number-card {
        min-height: 84px;
      }

      .number-value {
        font-size: 38px;
      }

      .drag-tool {
        min-height: 64px;
      }
    }

    @media (max-width: 1024px) {
      body {
        padding: 18px 14px;
        align-items: center;
      }

      .quiz-wrap {
        min-height: auto;
      }

      .quiz-heading h1 {
        font-size: 31px;
      }

      .question {
        min-height: 0;
        padding: 22px;
      }

      .number-value {
        font-size: 35px;
      }
    }

    @media (max-width: 768px) {
      body {
        align-items: flex-start;
        padding: 22px 10px 14px;
      }

      .quiz-heading {
        margin-bottom: 14px;
      }

      .quiz-heading h1 {
        font-size: 27px;
        gap: 8px;
      }

      .heading-icon {
        font-size: 25px;
      }

      .question {
        padding: 18px 14px;
        margin-bottom: 18px;
        border-radius: 21px;
      }

      .question-top {
        margin-bottom: 8px;
      }

      .question-letter {
        width: 50px;
        height: 43px;
        flex-basis: 50px;
        border-radius: 13px 13px 13px 4px;
        font-size: 20px;
      }

      .instruction {
        font-size: 19px;
      }

      .numbers {
        gap: 13px;
      }

      .number-card {
        min-height: 66px;
      }

      .number-value {
        font-size: 30px;
      }

      .number-card.circled .number-value::before {
        border-width: 3px;
        inset: -6px -9px;
      }

      .number-card.underlined .number-value::after {
        height: 4px;
        bottom: -4px;
      }

      .tool-title {
        font-size: 15px;
      }

      .tools {
        gap: 12px;
      }

      .drag-tool {
        width: 60px;
        height: 52px;
      }

      .tool-symbol {
        font-size: 45px;
      }

      .drag-ghost.circle {
        width: 62px;
        height: 62px;
      }

      .drag-ghost.underline {
        width: 90px;
        height: 25px;
      }

      .nav {
        margin-top: 20px;
        gap: 12px;
        padding-top: 12px;
      }

      .nav button {
        min-width: 100px;
        padding: 10px 18px;
        font-size: 14px;
      }

      .progress {
        font-size: 14px;
      }
    }

    @media (max-width: 600px) {
      .numbers {
        grid-template-columns: repeat(2, 1fr);
      }

      .number-card:nth-child(1),
      .number-card:nth-child(2),
      .number-card:nth-child(3),
      .number-card:nth-child(4),
      .number-card:nth-child(5) {
        grid-column: auto;
      }

      .number-card:nth-child(5) {
        grid-column: 1 / -1;
        width: 50%;
      }

      .tools {
        flex-direction: column;
      }

      .drag-tool {
        width: min(300px, 90%);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 6px 10px;
      }

      .quiz-heading h1 {
        font-size: 22px;
        flex-wrap: wrap;
      }

      .heading-icon {
        font-size: 21px;
      }

      .question {
        padding: 14px 9px;
      }

      .instruction {
        font-size: 17px;
      }

      .number-card {
        min-height: 58px;
      }

      .number-value {
        font-size: 25px;
        padding: 6px 10px;
      }

      .number-card.circled .number-value::before {
        border-width: 3px;
        inset: -5px -7px;
      }

      .number-card.underlined .number-value::after {
        height: 3px;
        bottom: -3px;
      }

      .nav {
        gap: 8px;
      }

      .nav button {
        min-width: 82px;
        padding: 8px 13px;
        font-size: 12px;
      }

      .progress {
        min-width: 45px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .celebration-piece,
      .emoji-pop,
      .final-overlay,
      .final-modal,
      .number-card.marked-wrong,
      .heading-icon {
        animation: none !important;
      }

      .celebration-piece {
        display: none !important;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">

<body>
  <main class="quiz-wrap">

    <header class="quiz-heading">
      <h1>
        <span class="heading-icon">🎯</span>
        Circle the greatest number and underline the smallest number.
      </h1>
    </header>

    <section id="quiz"></section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i> Prev
      </button>

      <span class="progress" id="progress">1 / 2</span>

      <button id="nextBtn" disabled>
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {
      const QUESTIONS = [
        {
          letter: "a",
          numbers: ["1003", "1300", "1113", "1103", "1013"]
        },
        {
          letter: "b",
          numbers: ["7248", "4178", "4871", "7482", "8247"]
        }
      ];

      QUESTIONS.forEach(q => {
        q.greatest = String(Math.max(...q.numbers.map(Number)));
        q.smallest = String(Math.min(...q.numbers.map(Number)));
        q.greatestSolved = false;
        q.smallestSolved = false;
      });

      let current = 0;
      let audioCtx = null;
      let draggedTool = null;

      const quiz = document.getElementById("quiz");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progress = document.getElementById("progress");

      /* ===== SOUND — SAME OLD CODE ===== */
      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
      }

      function beep(freq, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type;
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          osc.start();
          osc.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((f, i) => {
            setTimeout(() => beep(f, 150), i * 130);
          });
        }
      };

      /* ===== CONFETTI — SAME OLD CODE ===== */
      function burstConfetti(el, color) {
        const r = el.getBoundingClientRect();

        confetti({
          particleCount: 34,
          spread: 70,
          startVelocity: 22,
          origin: {
            x: (r.left + r.width / 2) / innerWidth,
            y: (r.top + r.height / 2) / innerHeight
          },
          colors: [
            color || "#6635dc",
            "#ff4e83",
            "#4e8ff0",
            "#76b93b",
            "#f4ae25",
            "#4ecdc4"
          ]
        });
      }

      function showCorrectEmoji() {
        const colors = ["#ff6fb5", "#ffd54f", "#7ed957", "#4fc3f7", "#b388ff"];

        for (let i = 0; i < 18; i++) {
          const piece = document.createElement("span");
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 90 + Math.random() * 100;

          piece.className = "celebration-piece";
          piece.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          piece.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * .12}s`;

          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1600);
        }

        const emoji = document.createElement("div");
        emoji.className = "emoji-pop";
        emoji.textContent = "🥳";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1850);
      }

      function showWrongEmoji() {
        const emoji = document.createElement("div");
        emoji.className = "emoji-pop";
        emoji.textContent = "😔";
        emoji.style.fontSize = "70px";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);
      }

      /* ===== FINAL POPUP — SAME AS OLD REFERENCE CODE ===== */
      function showFinalPopup() {
        sound.finish();

        const overlay = document.createElement('div');
        overlay.className = 'final-overlay';
        overlay.innerHTML = `
      <div class="final-modal">
        <span class="icon-big">🎉</span>
        <h2>All Done!</h2>
        <p>Amazing! You got them all right!</p>
        <button class="btn-playagain" id="playAgainBtn"><i class="fa-solid fa-rotate-right"></i> Play again</button>
      </div>
    `;

        document.body.appendChild(overlay);

        setTimeout(() => {
          const modal = overlay.querySelector('.final-modal');
          if (modal) burstConfetti(modal, '#ffd54f');
          setTimeout(() => { if (modal) burstConfetti(modal, '#4ecdc4'); }, 400);
          setTimeout(() => { if (modal) burstConfetti(modal, '#ff9f45'); }, 800);
        }, 100);

        overlay.querySelector('#playAgainBtn').addEventListener('click', () => {
          overlay.remove();
          QUESTIONS.forEach(q => {
            q.greatestSolved = false;
            q.smallestSolved = false;
          });
          current = 0;
          render();
        });
      }

      function allSolved(q) {
        return q.greatestSolved && q.smallestSolved;
      }

      /* ===== DRAG / DROP LOGIC ===== */
      function setupDragTool(tool) {
        let ghost = null;

        function moveGhost(e) {
          if (!ghost) return;
          ghost.style.left = `${e.clientX}px`;
          ghost.style.top = `${e.clientY}px`;
        }

        function endDrag(e) {
          if (!draggedTool) return;

          const target = document.elementFromPoint(e.clientX, e.clientY);
          const numberCard = target?.closest(".number-card");

          document.removeEventListener("pointermove", moveGhost);
          document.removeEventListener("pointerup", endDrag);

          if (ghost) {
            ghost.remove();
            ghost = null;
          }

          tool.style.visibility = "";

          if (numberCard) {
            applyTool(draggedTool, numberCard);
          }

          draggedTool = null;
        }

        tool.addEventListener("pointerdown", e => {
          if (tool.classList.contains("used")) return;

          e.preventDefault();
          draggedTool = tool.dataset.tool;
          tool.style.visibility = "hidden";

          ghost = document.createElement("div");
          ghost.className = `drag-ghost ${draggedTool}`;
          document.body.appendChild(ghost);

          ghost.style.left = `${e.clientX}px`;
          ghost.style.top = `${e.clientY}px`;

          document.addEventListener("pointermove", moveGhost);
          document.addEventListener("pointerup", endDrag, { once: false });
        });
      }

      function applyTool(toolType, card) {
        const q = QUESTIONS[current];
        const value = card.dataset.value;

        if (toolType === "circle") {
          if (value === q.greatest) {
            q.greatestSolved = true;
            card.classList.add("circled");

            sound.correct();
            burstConfetti(card, "#ff4e83");
            showCorrectEmoji();

            document.querySelector('.drag-tool[data-tool="circle"]')?.classList.add("used");

            setTimeout(() => {
              if (allSolved(q) && current === QUESTIONS.length - 1) {
                showFinalPopup();
              } else {
                updateNav();
              }
            }, 850);
          } else {
            wrongMark(card);
          }
        }

        if (toolType === "underline") {
          if (value === q.smallest) {
            q.smallestSolved = true;
            card.classList.add("underlined");

            sound.correct();
            burstConfetti(card, "#4e8ff0");
            showCorrectEmoji();

            document.querySelector('.drag-tool[data-tool="underline"]')?.classList.add("used");

            setTimeout(() => {
              if (allSolved(q) && current === QUESTIONS.length - 1) {
                showFinalPopup();
              } else {
                updateNav();
              }
            }, 850);
          } else {
            wrongMark(card);
          }
        }
      }

      function wrongMark(card) {
        sound.wrong();
        showWrongEmoji();

        card.classList.remove("marked-wrong");
        void card.offsetWidth;
        card.classList.add("marked-wrong");

        setTimeout(() => {
          card.classList.remove("marked-wrong");
        }, 700);
      }

      /* ===== RENDER ===== */
      function render() {
        const q = QUESTIONS[current];

        quiz.innerHTML = `
      <div class="question">
        <div class="question-top">
          <div class="question-letter">${q.letter})</div>
        </div>

        <div class="numbers">
          ${q.numbers.map(value => {
          const circled = q.greatestSolved && value === q.greatest;
          const underlined = q.smallestSolved && value === q.smallest;

          return `
              <div class="number-card ${circled ? "circled" : ""} ${underlined ? "underlined" : ""}"
                   data-value="${value}"
                   aria-label="Number ${value}">
                <span class="number-value">${value}</span>
              </div>
            `;
        }).join("")}
        </div>
      </div>

      <div class="tool-area">
        <div class="tool-title">Drag a mark onto a number</div>

        <div class="tools">
          <div class="drag-tool circle-tool ${q.greatestSolved ? "used" : ""}"
               data-tool="circle"
               role="button"
               tabindex="0"
               aria-label="Circle">
            <span class="tool-symbol">◯</span>
          </div>

          <div class="drag-tool underline-tool ${q.smallestSolved ? "used" : ""}"
               data-tool="underline"
               role="button"
               tabindex="0"
               aria-label="Underline">
            <span class="tool-symbol">_</span>
          </div>
        </div>
      </div>
    `;

        document.querySelectorAll(".drag-tool").forEach(setupDragTool);

        updateNav();
      }

      function updateNav() {
        const q = QUESTIONS[current];

        prevBtn.disabled = current === 0;

        // Once both markings are correct, Next is immediately enabled.
        nextBtn.disabled = !(allSolved(q) && current < QUESTIONS.length - 1);

        progress.textContent = `${current + 1} / ${QUESTIONS.length}`;
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) {
          current--;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      nextBtn.addEventListener("click", () => {
        if (current < QUESTIONS.length - 1 && allSolved(QUESTIONS[current])) {
          current++;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      render();
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
