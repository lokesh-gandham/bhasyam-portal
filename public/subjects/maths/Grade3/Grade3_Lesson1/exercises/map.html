  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }


    html,
    body {

      width: 100%;

      min-height: 100%;

    }


    body {

      min-height: 100vh;

      padding:
        12px 20px;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #12265d;
      overflow: auto;
    }


    /* =========================================================
       MAIN
    ========================================================= */

    .quiz-wrap {

      width: 100%;

      max-width: 1400px;

      min-height: 610px;

      display: flex;

      flex-direction: column;

      justify-content: center;

    }


    /* =========================================================
       HEADING
    ========================================================= */

    .quiz-heading {

      text-align: center;

      margin-bottom: 20px;

    }


    .quiz-heading h1 {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      color: #12265d;

      font-size: 29px;

      line-height: 1.1;

      font-weight: 500;

    }


    .heading-icon {

      font-size: 27px;

      animation:
        headingWiggle 2.5s ease-in-out infinite;

    }


    @keyframes headingWiggle {

      0%,
      100% {

        transform:
          rotate(-6deg) scale(1);

      }

      50% {

        transform:
          rotate(6deg) scale(1.08);

      }

    }


    /* =========================================================
       ACTIVITY AREA
       NO CARD
    ========================================================= */

    .activity-stage {

      width: min(1250px,
          100%);

      margin: 0 auto;

      position: relative;

      display: flex;

      flex-direction: column;

      align-items: center;

    }


    .instruction {

      margin-bottom: 10px;

      color: #6d788c;

      font-size: 16px;

      font-weight: 400;

      text-align: center;

    }


    .instruction span {

      display: inline-block;

      margin-left: 5px;

      animation:
        littleBounce 1.4s ease-in-out infinite;

    }


    @keyframes littleBounce {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(-4px);

      }

    }


    /* =========================================================
       SVG AREA
    ========================================================= */

    .dot-board {

      position: relative;

      width: min(1400px,
          100%);

      aspect-ratio:
        642 / 706;

      margin: 0 auto;

      /*
        IMPORTANT:
        NO BACKGROUND IMAGE.
        SVG IS TRANSPARENT.
      */

      background: transparent;

      overflow: visible;

    }


    #dotSvg {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      overflow: visible;

      display: block;

      touch-action: manipulation;

    }


    /* =========================================================
       SVG DOTS
    ========================================================= */

    .dot-hit {
      fill: transparent;
      stroke: none;
      cursor: pointer;
      pointer-events: all;
    }

    @media (hover: hover) and (pointer: fine) {
      .dot-hit:hover {
        cursor: crosshair;
      }
    }


    .dot {
      fill: #294b91;
      stroke: none;
      transition:
        transform .15s ease,
        fill .15s ease;
      transform-box: fill-box;
      transform-origin: center;
      pointer-events: none;
    }

    .dot-number {
      fill: #18366f;
      font-size: 8px;
      font-weight: 800;
      text-anchor: start;
      dominant-baseline: middle;
      pointer-events: none;
    }

    /* Small solid dot beside each large, easy-to-read number */
    .dot.current-dot {
      fill: #ef5350;
      transform: scale(1.35);
    }

    .map-reveal {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      opacity: 0;
      transform: scale(.94);
      transition: opacity .5s ease, transform .5s ease;
    }

    .map-reveal.show {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    .map-reveal img {
      display: block;
      width: min(100%, 1400px);
      height: auto;
      max-height: 100%;
      object-fit: contain;
      border-radius: 18px;
    }


    /* =========================================================
       CONNECTED LINE
    ========================================================= */

    .join-line {

      fill: none;

      stroke: #5c78d8;

      stroke-width: 2.8;

      stroke-linecap: round;

      stroke-linejoin: round;

      opacity: .92;

      filter:
        drop-shadow(0 2px 1px rgba(72, 91, 160, .12));

      animation:
        lineDraw .32s ease-out both;

    }


    @keyframes lineDraw {

      from {

        opacity: 0;

        stroke-dasharray: 80;

        stroke-dashoffset: 80;

      }

      to {

        opacity: .92;

        stroke-dashoffset: 0;

      }

    }


    /* =========================================================
       COMPLETED DOT
    ========================================================= */

    .dot.done {
      fill: #54a36a;
    }

    .dot-number.done {
      fill: #347342;
    }


    /* =========================================================
       CURRENT DOT
    ========================================================= */

    .current-ring {
      display: none;
    }


    @keyframes currentPulse {

      0%,
      100% {

        r: 8;

        opacity: .9;

      }

      50% {

        r: 12;

        opacity: .3;

      }

    }


    /* =========================================================
       SUCCESS DOT POP
    ========================================================= */

    .success-ring {

      fill: none;

      stroke: #62b66f;

      stroke-width: 2;

      opacity: 0;

      animation:
        successRing .65s ease-out;

    }


    @keyframes successRing {

      0% {

        r: 5;

        opacity: .9;

      }

      100% {

        r: 16;

        opacity: 0;

      }

    }


    /* =========================================================
       SMALL STATUS
    ========================================================= */

    .dot-status {

      min-height: 25px;

      margin-top: -4px;

      color: #59677e;

      font-size: 14px;

      font-weight: 800;

      text-align: center;

    }


    .dot-status strong {

      color: #274b91;

    }


    /* =========================================================
       NAVIGATION
       SAME REFERENCE STYLE
    ========================================================= */

    .nav {

      width: 100%;

      margin:
        14px auto 0;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 25px;

      position: relative;

      z-index: 20;
      display: none;

    }


    .nav button {

      min-width: 112px;

      border: 0;

      border-radius: 999px;

      padding:
        11px 20px;

      background: #55b449;

      color: #fff;

      font-size: 15px;

      font-weight: 800;

      box-shadow:
        0 5px 0 #3d9634;

      cursor: pointer;

      transition:
        transform .15s ease,
        opacity .15s ease;

    }


    .nav button:hover:not(:disabled) {

      transform:
        translateY(-2px);

    }


    .nav button:active:not(:disabled) {

      transform:
        translateY(2px);

      box-shadow:
        0 2px 0 #3d9634;

    }


    .nav button:disabled {

      opacity: .45;

      cursor: default;

      box-shadow:
        0 3px 0 #cfd9cf;

    }


    .progress {

      min-width: 52px;

      text-align: center;

      color: #12265d;

      font-size: 14px;

      font-weight: 800;

    }


    /* =========================================================
       WRONG / CORRECT EMOJI POPUP
    ========================================================= */

    .emoji-pop {

      position: fixed;

      left: 50%;

      top: 45%;

      transform:
        translate(-50%, -50%);

      font-size: 82px;

      pointer-events: none;

      z-index: 9999;

      animation:
        emojiPop 1.1s ease-out forwards;

    }


    @keyframes emojiPop {

      0% {

        opacity: 0;

        transform:
          translate(-50%, -50%) scale(.35);

      }

      22% {

        opacity: 1;

        transform:
          translate(-50%, -50%) scale(1.18);

      }

      100% {

        opacity: 0;

        transform:
          translate(-50%, -75%) scale(.82);

      }

    }


    /* =========================================================
       FINAL POPUP
    ========================================================= */

    .final-overlay {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      z-index: 10000;

      background:
        rgba(18,
          38,
          93,
          .14);

      animation:
        fadeIn .4s ease;

    }


    @keyframes fadeIn {

      from {

        opacity: 0;

      }

      to {

        opacity: 1;

      }

    }


    .final-modal {

      background: #fff;

      max-width: 400px;

      width: 90%;

      padding:
        36px 28px 32px;

      border-radius:
        56px 20px 56px 20px;

      text-align: center;

      box-shadow:
        0 30px 60px rgba(0, 0, 0, .3);

      animation:
        popUp .4s cubic-bezier(.175,
          .885,
          .32,
          1.275);

    }


    @keyframes popUp {

      from {

        transform:
          scale(.8);

        opacity: 0;

      }

      to {

        transform:
          scale(1);

        opacity: 1;

      }

    }


    .final-modal .icon-big {

      font-size: 52px;

      margin-bottom: 6px;

      display: block;

    }


    .final-modal h2 {

      font-size: 30px;

      font-weight: 500;

      color: #1e1e2a;

      margin-bottom: 8px;

    }


    .final-modal p {

      font-size: 17px;

      color: #3d3d4a;

      margin-bottom: 22px;

    }


    .final-modal .btn-playagain {

      border: none;

      background:
        linear-gradient(180deg,
          #ffb347,
          #f58a2e);

      padding:
        12px 36px;

      border-radius: 999px;

      font-weight: 800;

      font-size: 18px;

      color: #2d1f00;

      box-shadow:
        0 12px 24px rgba(245,
          138,
          46,
          .3);

      cursor: pointer;

      display: inline-flex;

      align-items: center;

      gap: 10px;

    }


    /* =========================================================
       768px
       SAME BREAKPOINT
    ========================================================= */

    @media(max-width:768px) {

      body {

        padding:
          10px 14px;

      }


      .quiz-wrap {

        min-height: 520px;

      }


      .quiz-heading {

        margin-bottom: 14px;

      }


      .quiz-heading h1 {

        font-size: 25px;

      }


      .dot-board {

        width:
          min(860px,
            100%);

      }


      .instruction {

        font-size: 14px;

      }


      .dot-status {

        font-size: 13px;

      }


      /* SAME NAV */

      .nav {

        gap: 10px;

        margin-top: 10px;

      }


      .nav button {

        min-width: 100px;

        padding:
          10px 17px;

        font-size: 14px;

      }

    }


    /* =========================================================
       480px
       SAME BREAKPOINT
    ========================================================= */

    @media(max-width:480px) {

      .quiz-heading h1 {

        font-size: 22px;

      }


      .heading-icon {

        font-size: 22px;

      }


      .instruction {

        font-size: 12px;

        margin-bottom: 5px;

      }


      .dot-status {

        font-size: 11px;

        min-height: 20px;

      }


      /* SAME NAV */

      .nav {

        gap: 8px;

        margin-top: 8px;

      }


      .nav button {

        min-width: 82px;

        padding:
          8px 13px;

        font-size: 12px;

      }


      .progress {

        min-width: 45px;

        font-size: 12px;

      }

    }



    @media (min-width: 1400px) {
      .dot-board {
        width: min(1400px, 92vw);
      }

      .map-reveal img {
        width: min(1400px, 92vw);
      }
    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media(prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation:
          none !important;

        transition:
          none !important;

      }

    }

      const nextBtn =
        document.getElementById(
          "nextBtn"
        );


      /* =====================================================
         STATE
      ===================================================== */

      let current = 601;

      let completed = false;

      let audioCtx = null;


      /* =====================================================
         SVG HELPER
      ===================================================== */

      function E(
        tag,
        attrs = {}
      ) {

        const element =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            tag
          );


        Object.entries(
          attrs
        ).forEach(
          ([key, value]) => {

            element.setAttribute(
              key,
              value
            );

          }
        );


        return element;

      }


      /* =====================================================
         AUDIO
         SAME BEEP PATTERN
      ===================================================== */

      function getCtx() {

        if (!audioCtx) {

          audioCtx =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }


        if (
          audioCtx.state ===
          "suspended"
        ) {

          audioCtx.resume();

        }


        return audioCtx;

      }


      function beep(
        frequency,
        duration,
        type = "sine"
      ) {

        try {

          const ctx =
            getCtx();


          const oscillator =
            ctx.createOscillator();


          const gain =
            ctx.createGain();


          oscillator.type =
            type;


          oscillator.frequency.value =
            frequency;


          oscillator.connect(
            gain
          );


          gain.connect(
            ctx.destination
          );


          gain.gain.setValueAtTime(
            .15,
            ctx.currentTime
          );


          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime +
            duration / 1000
          );


          oscillator.start();


          oscillator.stop(
            ctx.currentTime +
            duration / 1000
          );

        }

        catch (e) { }

      }


      const sound = {


        correct() {

          beep(
            660,
            110
          );


          setTimeout(
            () => {

              beep(
                880,
                160
              );

            },
            110
          );

        },


        wrong() {

          beep(
            180,
            220,
            "sawtooth"
          );

        },


        finish() {

          [
            523,
            659,
            784,
            1047

          ].forEach(
            (frequency, index) => {

              setTimeout(
                () => {

                  beep(
                    frequency,
                    150
                  );

                },
                index * 130
              );

            }
          );

        }

      };


      /* =====================================================
         CONFETTI
         SAME STYLE
      ===================================================== */

      function burstConfetti(
        element
      ) {

        const rect =
          element.getBoundingClientRect();


        if (
          typeof confetti ===
          "function"
        ) {

          confetti({

            particleCount: 34,

            spread: 70,

            startVelocity: 22,

            origin: {

              x:
                (
                  rect.left +
                  rect.width / 2
                ) /
                innerWidth,

              y:
                (
                  rect.top +
                  rect.height / 2
                ) /
                innerHeight

            },

            colors: [

              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"

            ]

          });

        }

      }


      /* =====================================================
         EMOJI POPUP
      ===================================================== */

      function showEmoji(
        emoji
      ) {

        const element =
          document.createElement(
            "div"
          );


        element.className =
          "emoji-pop";


        element.textContent =
          emoji;


        document.body.appendChild(
          element
        );


        setTimeout(
          () => {

            element.remove();

          },
          1600
        );

      }


      /* =====================================================
         DRAW ALL DOTS + NUMBERS
      ===================================================== */

      function renderDots() {

        dotLayer.innerHTML = "";

        hitLayer.innerHTML = "";

        hintLayer.innerHTML = "";


        for (
          let n = 601;
          n <= 700;
          n++
        ) {

          const [
            x,
            y
          ] = P[n];


          /* ==============================
             DOT
          ============================== */

          const dot =
            E(
              "circle",
              {

                cx: x,

                cy: y,

                r: 2.8,

                class:
                  "dot" +
                  (
                    n < current
                      ? " done"
                      : (n === current ? " current-dot" : "")
                  ),

                id:
                  "dot-" + n

              }
            );


          dotLayer.appendChild(
            dot
          );


          /* ==============================
             NUMBER
          ============================== */

          const number =
            E(
              "text",
              {

                x: x + 7,

                y: y + 1,

                class:
                  "dot-number" +
                  (
                    n < current
                      ? " done"
                      : ""
                  )

              }
            );


          number.textContent =
            n;


          dotLayer.appendChild(
            number
          );


          /* ==============================
             LARGE TOUCH TARGET
          ============================== */

          const hit =
            E(
              "circle",
              {

                cx: x,

                cy: y,

                r: 10,

                class:
                  "dot-hit",

                id:
                  "hit-" + n

              }
            );


          // CLICK: user can always click the dot to connect it.
          hit.addEventListener(
            "click",
            () => {
              clickDot(n);
            }
          );

          // MOUSE / POINTER: simply moving the cursor onto the correct
          // dot automatically connects it. Wrong dots do nothing on hover.
          hit.addEventListener(
            "pointerenter",
            () => {
              if (n === current && !completed) {
                clickDot(n);
              }
            }
          );


          hitLayer.appendChild(
            hit
          );

        }


        drawHint();

      }


      /* =====================================================
         DRAW HINT AROUND CURRENT DOT
      ===================================================== */

      function drawHint() {
        /* No ring around numbers. The current number's dot is highlighted instead. */
        hintLayer.innerHTML = "";
      }


      /* =====================================================
         ADD SUCCESS RING
      ===================================================== */

      function successRing(number) {
        /* Intentionally no outer ring. */
      }


      /* =====================================================
         CONNECT TWO NUMBERS
      ===================================================== */

      function connect(
        previous,
        next
      ) {

        const [
          x1,
          y1
        ] = P[previous];


        const [
          x2,
          y2
        ] = P[next];


        const line =
          E(
            "line",
            {

              x1: x1,

              y1: y1,

              x2: x2,

              y2: y2,

              class:
                "join-line"

            }
          );


        lineLayer.appendChild(
          line
        );

      }


      function showIndiaMap() {
        /* Show the supplied full-color India map as soon as the connection is complete. */
        svg.style.display = "none";
        mapReveal.classList.add("show");
        status.innerHTML = "<strong>🎉 Great job! Here is the India map.</strong>";
      }


      /* =====================================================
         CLICK DOT
      ===================================================== */

      function clickDot(
        number
      ) {

        if (
          completed
        ) {

          return;

        }


        /* ==================================
           WRONG NUMBER
        ================================== */

        if (
          number !== current
        ) {

          sound.wrong();

          showEmoji(
            "😔"
          );

          const wrongDot =
            document.getElementById(
              "dot-" + number
            );


          if (
            wrongDot
          ) {

            wrongDot.animate(

              [

                {
                  transform:
                    "scale(1)"
                },

                {
                  transform:
                    "scale(1.5)"
                },

                {
                  transform:
                    "scale(1)"
                }

              ],

              {

                duration: 420,

                easing:
                  "ease-in-out"

              }

            );

          }


          return;

        }


        /* ==================================
           FIRST DOT
        ================================== */

        if (
          number === 601
        ) {

          sound.correct();

          successRing(
            number
          );

          current++;

          updateState();

          renderDots();

          return;

        }


        /* ==================================
           CONNECT PREVIOUS TO CURRENT
        ================================== */

        connect(
          number - 1,
          number
        );


        sound.correct();


        successRing(
          number
        );


        current++;


        /* ==================================
           COMPLETE
        ================================== */

        if (
          current > 700
        ) {

          completed = true;

          status.innerHTML =
            "<strong>✓ Complete!</strong>";

          nextBtn.disabled =
            false;


          sound.finish();


          setTimeout(
            () => {

              burstConfetti(
                svg
              );

            },
            100
          );


          setTimeout(
            () => {

              burstConfetti(
                svg
              );

            },
            350
          );


          /* Reveal the full India map immediately after 700 is connected. */
          showIndiaMap();

          /* Keep the India map visible for 8 seconds, then show the final popup. */
          setTimeout(
            showFinalPopup,
            8000
          );


          renderDots();


          return;

        }


        updateState();

        renderDots();

      }


      /* =====================================================
         UPDATE STATUS
      ===================================================== */

      function updateState() {

        if (
          current <= 700
        ) {

          status.innerHTML = `

            Connect:

            <strong>
              ${current}
            </strong>

          `;

        }

        else {

          status.innerHTML =
            "<strong>✓ Complete!</strong>";

        }

      }


      /* =====================================================
         RESET
      ===================================================== */

      function resetGame() {

        current = 601;

        completed = false;

        lineLayer.innerHTML = "";

        mapReveal.classList.remove("show");
        svg.style.display = "block";

        status.innerHTML = `

          Connect:

          <strong>
            601
          </strong>

        `;

        nextBtn.disabled = true;

        renderDots();

      }


      /* =====================================================
         FINAL POPUP
      ===================================================== */

      function showFinalPopup() {

        const overlay =
          document.createElement(
            "div"
          );


        const modal =
          document.createElement(
            "div"
          );


        overlay.className =
          "final-overlay";


        modal.className =
          "final-modal";


        modal.innerHTML = `

          <span class="icon-big">
            🎉
          </span>

          <h2>
            All Done!
          </h2>

          <p>
            Amazing! You got them all right!
          </p>

          <button
            class="btn-playagain"
          >

            <i
              class="fa-solid fa-rotate-right"
            ></i>

            Play again

          </button>

        `;


        overlay.appendChild(
          modal
        );


        document.body.appendChild(
          overlay
        );


        setTimeout(
          () => {

            burstConfetti(
              modal
            );

          },
          80
        );


        setTimeout(
          () => {

            burstConfetti(
              modal
            );

          },
          350
        );


        setTimeout(
          () => {

            burstConfetti(
              modal
            );

          },
          650
        );


        modal
          .querySelector(
            ".btn-playagain"
          )
          .addEventListener(
            "click",
            () => {

              overlay.remove();

              resetGame();

            }
          );

      }


      /* =====================================================
         NAV BUTTONS
      ===================================================== */

      prevBtn.addEventListener(
        "click",
        () => {

          /*
            This activity contains one
            Join-the-Dots page, therefore
            Prev remains disabled.
          */

        }
      );


      nextBtn.addEventListener(
        "click",
        () => {

          if (
            completed
          ) {

            showFinalPopup();

          }

        }
      );


      /* =====================================================
         INITIALIZE
      ===================================================== */

      renderDots();

      updateState();


    })();

  </script>
