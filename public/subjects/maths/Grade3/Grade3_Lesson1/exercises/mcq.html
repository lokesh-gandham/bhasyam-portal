<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tick the Correct Option</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1080px;
      padding: 20px 0;
    }

    /* ===== HEADING with icon and full underline ===== */
    .quiz-heading {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 16px;
      position: relative;
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: #10265d;
      font-size: 42px;
      line-height: 1.05;
      font-weight: 800;
      padding: 0 14px;
    }

    .quiz-heading h1 .heading-icon {
      font-size: 38px;
      color: #6736dc;
      animation: wiggle 2.5s ease-in-out infinite;
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-6deg) scale(1);
      }

      50% {
        transform: rotate(6deg) scale(1.08);
      }
    }

    .quiz-heading h1 .option-text-head {
      color: #10265d;
      font-weight: 800;
    }

    /* ===== QUESTION ===== */
    .question {
      width: 100%;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 16px 24px;
      margin-bottom: 28px;
    }

    .question-letter {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #fff;
      background: #7137e4;
      font-size: 26px;
      font-weight: 800;
    }

    .question-text {
      font-size: 30px;
      line-height: 1.35;
      font-weight: 700;
      color: #17285d;
    }

    /* ===== OPTIONS (smaller) ===== */
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 20px;
    }

    .option {
      position: relative;
      min-height: 100px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px 22px;
      border: 3px solid;
      border-radius: 20px;
      cursor: pointer;
      user-select: none;
      background: #fff;
      transition: transform .16s ease, box-shadow .16s ease, opacity .2s ease;
    }

    .option:hover:not(.disabled) {
      transform: translateY(-3px);
    }

    .option:active:not(.disabled) {
      transform: translateY(2px);
    }

    .option-a {
      border-color: #ff4e83;
      background: #fff0f5;
      box-shadow: 0 6px 0 #f7bfd0;
    }

    .option-b {
      border-color: #4e8ff0;
      background: #f0f6ff;
      box-shadow: 0 6px 0 #bfd5f7;
    }

    .option-c {
      border-color: #3bb9ae;
      background: #f4fae9;
      box-shadow: 0 6px 0 #cfe3ac;
    }

    .option-d {
      border-color: #f4ae25;
      background: #fff8e8;
      box-shadow: 0 6px 0 #f5d995;
    }

    .option-letter {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid currentColor;
      border-radius: 12px;
      background: rgba(255, 255, 255, .8);
      font-size: 20px;
      font-weight: 800;
    }

    .option-a .option-letter {
      color: #ef3d73;
    }

    .option-b .option-letter {
      color: #377fe2;
    }

    .option-c .option-letter {
      color: #67a82f;
    }

    .option-d .option-letter {
      color: #eea514;
    }

    .option-text {
      font-size: 24px;
      color: #10265d;
      font-weight: 800;
    }

    .option.disabled {
      opacity: .3;
      pointer-events: none;
    }

    .option.correct {
      border-color: #55b449;
      background: #effbe9;
      box-shadow: 0 6px 0 #bfe0b6;
      opacity: 1 !important;
    }

    .option.correct .option-letter {
      color: #55b449 !important;
    }

    .option.wrong {
      animation: optionWrong .58s ease;
    }

    @keyframes optionWrong {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-8px);
      }

      40% {
        transform: translateX(8px);
      }

      60% {
        transform: translateX(-6px);
      }

      80% {
        transform: translateX(5px);
      }
    }

    /* ===== NAVIGATION ===== */
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 34px;
      padding-top: 18px;
      border-top: 2px solid #e8e3de;
    }

    .nav button {
      min-width: 120px;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      color: #fff;
      background: linear-gradient(180deg, #42d466, #0bb852);
      box-shadow: 0 6px 0 #079443;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .2s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #079443;
    }

    .nav button:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .progress {
      min-width: 58px;
      text-align: center;
      color: #10265d;
      font-size: 17px;
      font-weight: 800;
    }

    /* ===== CELEBRATION PIECES (EXACT from reference) ===== */
    .celebration-piece {
      position: fixed;
      left: 50%;
      top: 42%;
      width: 10px;
      height: 18px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9998;
      animation: confettiBurst 1.4s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    @keyframes confettiBurst {
      from {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0) scale(.7);
      }

      to {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(520deg) scale(1);
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 42%;
      font-size: 80px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      animation: emojiPop 1.8s cubic-bezier(.2, .8, .2, 1) forwards;
      filter: drop-shadow(0 10px 14px rgba(45, 50, 80, .18));
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      }

      28% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18) rotate(8deg);
      }

      68% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(1) rotate(-4deg);
      }

      to {
        opacity: 0;
        transform: translate(-50%, -68%) scale(.9) rotate(0);
      }
    }

    /* ===== FINAL OVERLAY (EXACT from reference) ===== */
    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
      font-family: "CCSyntroman", "Baloo 2", sans-serif;
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      transition: transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "CCSyntroman", "Baloo 2", sans-serif;
    }

    .final-modal .btn-playagain:active {
      transform: scale(.95);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      body {
        align-items: center;
        padding: 20px;
      }

      .quiz-heading h1 {
        font-size: 34px;
      }

      .quiz-heading h1 .heading-icon {
        font-size: 32px;
      }

      .question-text {
        font-size: 30px;
      }

      .option-text {
        font-size: 21px;
      }

      .option {
        min-height: 88px;
        padding: 14px 18px;
      }
    }

    @media (max-width: 768px) {
      body {
        align-items: flex-start;

      .quiz-heading h1 {

      .quiz-heading h1 .heading-icon {

      }

      .question-letter {

      .option {

      }

      .option-a {
        box-shadow: 0 5px 0 #f7bfd0;
      }

      }

    @media (max-width: 480px) {

    @media (max-width: 380px) {

      }

    @media screen and (min-width: 1025px) and (max-width: 1440px) {

<body>
  <main class="quiz-wrap">
    <!-- ===== HEADING with icon and full underline ===== -->
    <header class="quiz-heading">
      <h1>
        <span class="heading-icon">🎯</span>
        <span class="heading-number">2.</span> Tick (<span class="check">✔</span>) the
        <span class="option-text-head">correct</span> option
      </h1>
    </header>

    <section id="quiz"></section>

    <nav class="nav">
      <button id="prevBtn" disabled><i class="fa-solid fa-chevron-left"></i> Prev</button>
      <span class="progress" id="progress">1 / 6</span>
      <button id="nextBtn" disabled>Next <i class="fa-solid fa-chevron-right"></i></button>
    </nav>
  </main>

  <script>
    (() => {
      const QUESTIONS = [{
        letter: "a",
        text: "In which of these numbers the place value of 4 is 4000?",
        options: ["1456", "4598", "9804", "3540"],
        answer: "4598"
      }, {
        letter: "b",
        text: "In which of these numbers the face value of 9 is not 9?",
        options: ["6709", "5940", "9999", "1234"],
        answer: "1234"
      }, {
        letter: "c",
        text: "Find the number whose face value of 0 is 0.",
        options: ["6700", "8073", "5906", "All the numbers"],
        answer: "All the numbers"
      }, {
        letter: "d",
        text: "What is the place value of 5 in 5409?",
        options: ["5000", "0", "4995", "495"],
        answer: "5000"
      }, {
        letter: "e",
        text: "What is the place value of 9 in 1908?",
        options: ["199", "900", "9", "909"],
        answer: "900"
      }, {
        letter: "f",
        text: "What is the face value of 7 in 7634?",
        options: ["28", "7777", "7", "7 + 7 + 7"],
        answer: "7"
      }];

      QUESTIONS.forEach(q => q.solved = false);

      let current = 0;
      let audioCtx = null;

      const quiz = document.getElementById("quiz");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progress = document.getElementById("progress");

      /* ===== SOUND – EXACT from reference ===== */
      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
      }

      function beep(freq, duration, type) {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type || "sine";
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.16, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          osc.start();
          osc.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sfx = {
        good: () => {
          beep(660, 110, "sine");
          setTimeout(() => beep(880, 160, "sine"), 110);
        },
        bad: () => beep(180, 220, "sawtooth"),
        finish: () => {
          [523, 659, 784, 1047].forEach((f, i) => {
            setTimeout(() => beep(f, 150, "sine"), i * 130);
          });
        }
      };

      /* ===== CONFETTI – EXACT from reference ===== */
      function burstConfetti(fromEl, color) {
        const rect = fromEl.getBoundingClientRect();
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;

        confetti({
          particleCount: 30,
          spread: 70,
          origin: { x, y },
          startVelocity: 20,
          colors: [color, "#ffd54f", "#ff9f45", "#7ed957", "#ff6b6b", "#4ecdc4"]
        });
      }

      function showCorrectEmoji() {
        const colors = ['#ff6fb5', '#ffd54f', '#7ed957', '#4fc3f7', '#b388ff'];
        for (let i = 0; i < 18; i++) {
          const piece = document.createElement('span');
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 90 + Math.random() * 100;
          piece.className = 'celebration-piece';
          piece.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
          piece.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * .12}s`;
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1600);
        }
        const emoji = document.createElement('div');
        emoji.className = 'emoji-pop';
        emoji.textContent = '🥳';
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1850);
      }

      function showWrongEmoji() {
        const emoji = document.createElement('div');
        emoji.className = 'emoji-pop';
        emoji.textContent = '😔';
        emoji.style.fontSize = '70px';
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);
      }

      /* ===== FINAL POPUP – EXACT from reference ===== */
      function showFinalPopup() {
        sfx.finish();

        const overlay = document.createElement('div');
        overlay.className = 'final-overlay';
        overlay.innerHTML = `
          <div class="final-modal">
            <span class="icon-big">🎉</span>
            <h2>All Done!</h2>
            <p>Amazing! You got them all right!</p>
            <button class="btn-playagain" id="playAgainBtn"><i class="fa-solid fa-rotate-right"></i> Play again</button>
          </div>
        `;
        document.body.appendChild(overlay);

        setTimeout(() => {
          const modal = overlay.querySelector('.final-modal');
          if (modal) burstConfetti(modal, '#ffd54f');
          setTimeout(() => { if (modal) burstConfetti(modal, '#4ecdc4'); }, 400);
          setTimeout(() => { if (modal) burstConfetti(modal, '#ff9f45'); }, 800);
        }, 100);

        overlay.querySelector('#playAgainBtn').addEventListener('click', () => {
          overlay.remove();
          QUESTIONS.forEach(q => q.solved = false);
          current = 0;
          render();
        });
      }

      function showCorrect(optionEl) {
        const q = QUESTIONS[current];
        q.solved = true;

        sfx.good();
        burstConfetti(optionEl, '#4caf50');
        showCorrectEmoji();

        document.querySelectorAll(".option").forEach(el => {
          el.classList.add("disabled");
          if (el.dataset.value === q.answer) {
            el.classList.add("correct");
          }
        });

        if (QUESTIONS.every(q => q.solved)) {
          setTimeout(() => showFinalPopup(), 700);
        } else {
          updateNav();
        }
      }

      function showWrong(optionEl) {
        sfx.bad();
        showWrongEmoji();

        optionEl.classList.remove("wrong");
        void optionEl.offsetWidth;
        optionEl.classList.add("wrong");

        setTimeout(() => {
          optionEl.classList.remove("wrong");
        }, 600);
      }

      function render() {
        const q = QUESTIONS[current];
        const solved = q.solved;

        quiz.innerHTML = `
          <div class="question">
            <div class="question-letter">${q.letter})</div>
            <div class="question-text">${q.text}</div>
          </div>

          <div class="options">
            ${q.options.map((value, i) => {
          const letter = String.fromCharCode(65 + i);
          const classNames = `option option-${String.fromCharCode(97 + i)}`;
          const isCorrect = solved && value === q.answer;
          const isDisabled = solved && !isCorrect;
          return `
                <div class="${classNames} ${isDisabled ? 'disabled' : ''} ${isCorrect ? 'correct' : ''}"
                     data-value="${value}"
                     role="button"
                     tabindex="${solved ? "-1" : "0"}">
                  <div class="option-letter">${letter}</div>
                  <div class="option-text">${value}</div>
                </div>
              `;
        }).join("")}
          </div>
        `;

        if (!solved) {
          document.querySelectorAll(".option").forEach(option => {
            option.addEventListener("click", () => {
              if (option.dataset.value === q.answer) {
                showCorrect(option);
              } else {
                showWrong(option);
              }
            });

            option.addEventListener("keydown", e => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                option.click();
              }
            });
          });
        }

        updateNav();
      }

      function updateNav() {
        prevBtn.disabled = current === 0;

        const solved = QUESTIONS[current].solved;
        const hasNext = current < QUESTIONS.length - 1;

        nextBtn.disabled = !(solved && hasNext);
        progress.textContent = `${current + 1} / ${QUESTIONS.length}`;
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) {
          current--;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      nextBtn.addEventListener("click", () => {
        if (current < QUESTIONS.length - 1 && QUESTIONS[current].solved) {
          current++;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      render();
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
