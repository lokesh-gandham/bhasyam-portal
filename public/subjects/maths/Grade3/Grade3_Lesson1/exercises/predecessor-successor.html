<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fill the Box · Drag & Drop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .wrap {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    /* ===== HEADING ===== */
    .topbar {
      text-align: center;
      margin-bottom: 34px;
    }

    .topbar h1 {
      display: inline-block;
      position: relative;
      font-size: 42px;
      line-height: 1.1;
      font-weight: 800;
      color: #2f4f4f;
      letter-spacing: .2px;
      padding: 0 12px 13px;
    }

    .topbar h1::after {
      content: "";
      position: absolute;
      left: 0%;
      right: 0%;
      bottom: 0;
      height: 6px;
      border-radius: 999px;
      background: #fcd041;
      width: 100%;
    }

    /* ===== QUESTION ===== */
    .question-container {
      width: 100%;
      opacity: 0;
      transform: translateY(16px);
      animation: rise .45s cubic-bezier(.34, 1.56, .64, 1) forwards;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .q-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      margin-bottom: 25px;
      padding: 0 8px;
    }

    .q-badge {
      flex: 0 0 auto;
      font-size: 28px;
      font-weight: 800;
      color: #2d3250;
      line-height: 1.4;
    }

    .q-desc {
      font-size: 30px;
      font-weight: 400;
      color: #2d3250;
      line-height: 1.4;
    }

    /* ===== DROP AREA ===== */
    .drop-area {
      width: min(560px, 90%);
      min-height: 130px;
      margin: 0 auto 28px;
      border: 3px dashed #b9a8f5;
      border-radius: 24px;
      background: #fbf9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .18s ease, border-color .18s ease, box-shadow .18s ease, transform .15s ease;
      position: relative;
    }

    .drop-text {
      font-size: 27px;
      font-weight: 800;
      color: #9d8bd9;
      user-select: none;
    }

    .drop-area.drag-over {
      border-color: #7c68e8;
      background: #f3efff;
      box-shadow: 0 0 0 5px rgba(168, 85, 247, .12);
      transform: scale(1.015);
    }

    .drop-area.correct {
      border-color: #58b957;
      background: #effbea;
      box-shadow: 0 0 0 5px rgba(88, 185, 87, .13);
    }

    .drop-area.correct .drop-text {
      color: #399b42;
    }

    .drop-area.wrong {
      border-color: #ef5675;
      background: #fff1f4;
      animation: wrongBlink .62s ease;
    }

    @keyframes wrongBlink {

      0%,
      100% {
        border-color: #ef5675;
        background: #fff1f4;
        box-shadow: 0 0 0 0 rgba(239, 86, 117, 0);
      }

      25%,
      75% {
        border-color: #ff315b;
        background: #ffe1e8;
        box-shadow: 0 0 0 8px rgba(239, 86, 117, .14);
      }

      50% {
        border-color: #ef5675;
        background: #fff1f4;
      }
    }

    .dropped-answer {
      font-size: 42px;
      font-weight: 800;
      color: #399b42;
    }

    /* ===== OPTIONS ===== */
    .choose-label {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #69728d;
      margin-bottom: 17px;
    }

    .options {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .option {
      width: 185px;
      min-height: 88px;
      border: 3px solid #d9d3cc;
      border-radius: 22px;
      background: #fffdfb;
      box-shadow: 0 5px 0 #e8e2dc, 0 10px 18px -14px rgba(45, 50, 80, .35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: transform .15s ease, box-shadow .15s ease, opacity .2s ease, border-color .15s ease;
    }

    .option:nth-child(1) {
      border-color: #f3a1b6;
      box-shadow: 0 5px 0 #f8d2dc, 0 10px 18px -14px rgba(45, 50, 80, .35);
    }

    .option:nth-child(2) {
      border-color: #8fc5f2;
      box-shadow: 0 5px 0 #d0e5fa, 0 10px 18px -14px rgba(45, 50, 80, .35);
    }

    .option:nth-child(3) {
      border-color: #a8d67d;
      box-shadow: 0 5px 0 #dcefc9, 0 10px 18px -14px rgba(45, 50, 80, .35);
    }

    .option:hover:not(.disabled) {
      transform: translateY(-4px);
    }

    .option:active:not(.disabled) {
      cursor: grabbing;
      transform: translateY(2px);
    }

    .option-number {
      font-size: 36px;
      font-weight: 800;
      color: #252d4c;
    }

    .option.disabled {
      opacity: .38;
      cursor: not-allowed;
      pointer-events: none;
      transform: none;
      box-shadow: none;
    }

    .option.selected-correct {
      border-color: #58b957;
      background: #effbea;
      box-shadow: 0 5px 0 #bfe6bb;
      opacity: .5;
      pointer-events: none;
    }

    /* ===== NAVIGATION ===== */
    .nav-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 38px;
    }

    .nav-btn {
      border: none;
      cursor: pointer;
      min-width: 130px;
      padding: 14px 30px;
      border-radius: 999px;
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(180deg, #7ed957, #4caf50);
      box-shadow: 0 6px 0 -1px #378c3a, 0 10px 18px -10px rgba(76, 175, 80, .55);
      transition: transform .15s ease, opacity .2s ease, filter .15s ease;
    }

    .nav-btn:hover:not(:disabled) {
      filter: brightness(1.05);
      transform: translateY(-2px);
    }

    .nav-btn:active:not(:disabled) {
      transform: translateY(2px);
    }

    .nav-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .progress {
      min-width: 65px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: #7c8397;
    }

    /* ===== CELEBRATION PIECES (EXACT from reference) ===== */
    .celebration-piece {
      position: fixed;
      left: 50%;
      top: 42%;
      width: 10px;
      height: 18px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9998;
      animation: confettiBurst 1.4s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    @keyframes confettiBurst {
      from {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0) scale(.7);
      }

      to {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(520deg) scale(1);
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 42%;
      font-size: 80px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      animation: emojiPop 1.8s cubic-bezier(.2, .8, .2, 1) forwards;
      filter: drop-shadow(0 10px 14px rgba(45, 50, 80, .18));
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      }

      28% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18) rotate(8deg);
      }

      68% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(1) rotate(-4deg);
      }

      to {
        opacity: 0;
        transform: translate(-50%, -68%) scale(.9) rotate(0);
      }
    }

    /* ===== FINAL OVERLAY (EXACT from reference) ===== */
    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      transition: transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: scale(.95);
    }

    /* ===== RESPONSIVE – EXACT from reference ===== */
    @media (max-width:900px) {
      body {
        align-items: center;
        padding: 20px;
      }
    }

    @media (max-width:768px) {
      body {
        padding: 30px 10px 10px;
        align-items: flex-start;
      }

      .topbar h1 {
        font-size: 30px;
      }

      .q-desc {
        font-size: 30px;
      }

      .q-badge {
        font-size: 22px;
      }

      .drop-area {
        min-height: 110px;
        width: 94%;
      }

      .drop-text {
        font-size: 23px;
      }

      .option {
        width: 155px;
        min-height: 78px;
      }

      .option-number {
        font-size: 31px;
      }

      .nav-btn {
        min-width: 105px;
        padding: 11px 22px;
        font-size: 15px;
      }
    }

    @media (max-width:480px) {
      body {
        padding: 30px 0 10px;
        align-items: flex-start;
      }

      .topbar h1 {
        font-size: 26px;
      }

      .q-desc {
        font-size: 17px;
      }

      .q-badge {
        font-size: 19px;
      }

      .drop-area {
        min-height: 100px;
        width: 100%;
        border-radius: 19px;
      }

      .drop-text {
        font-size: 20px;
      }

      .dropped-answer {
        font-size: 34px;
      }

      .choose-label {
        font-size: 17px;
      }

      .options {
        gap: 12px;
      }

      .option {
        width: 44%;
        min-height: 68px;
        border-radius: 18px;
      }

      .option-number {
        font-size: 27px;
      }

      .nav-area {
        gap: 9px;
        margin-top: 25px;
      }

      .nav-btn {
        min-width: 92px;
        padding: 9px 15px;
        font-size: 13px;
      }

      .progress {
        font-size: 13px;
      }
    }

    @media (max-width:380px) {
      .topbar h1 {
        font-size: 23px;
      }

      .q-desc {
        font-size: 15px;
      }

      .q-badge {
        font-size: 17px;
      }

      .option {
        width: 46%;
        min-height: 62px;
      }

      .option-number {
        font-size: 24px;
      }

      .nav-btn {
        min-width: 82px;
        padding: 8px 11px;
        font-size: 12px;
      }
    }

    @media screen and (min-width:1025px) and (max-width:1440px) {
      .wrap {
        max-width: 1000px;
      }

      .topbar h1 {
        font-size: 46px;
      }

      .q-desc {
        font-size: 30px;
      }

      .q-badge {
        font-size: 32px;
      }

      .drop-area {
        min-height: 145px;
        width: 600px;
      }

      .drop-text {
        font-size: 30px;
      }

      .option {
        width: 205px;
        min-height: 95px;
      }

      .option-number {
        font-size: 40px;
      }

      .nav-btn {
        padding: 16px 32px;
        font-size: 17px;
      }
    }

    @media screen and (min-width:1441px) and (max-width:1920px) {
      .wrap {
        max-width: 1100px;
      }

      .topbar h1 {
        font-size: 52px;
      }

      .q-desc {
        font-size: 40px;
      }

      .q-badge {
        font-size: 36px;
      }

      .drop-area {
        min-height: 160px;
        width: 680px;
      }

      .drop-text {
        font-size: 34px;
      }

      .option {
        width: 230px;
        min-height: 105px;
      }

      .option-number {
        font-size: 44px;
      }

      .nav-btn {
        padding: 18px 38px;
        font-size: 19px;
      }
    }

    @media screen and (min-width:1921px) {
      .wrap {
        max-width: 1200px;
      }

      .topbar h1 {
        font-size: 58px;
      }

      .q-desc {
        font-size: 40px;
      }

      .q-badge {
        font-size: 40px;
      }

      .drop-area {
        min-height: 175px;
        width: 760px;
      }

      .drop-text {
        font-size: 38px;
      }

      .option {
        width: 250px;
        min-height: 115px;
      }

      .option-number {
        font-size: 48px;
      }

      .nav-btn {
        padding: 20px 42px;
        font-size: 21px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .question-container,
      .drop-area.wrong,
      .celebration-piece,
      .emoji-pop,
      .final-overlay,
      .final-modal {
        animation: none !important;
      }

      .celebration-piece {
        display: none !important;
      }
    }

<body>
  <main class="wrap">
    <header class="topbar">
      <h1>Fill the box</h1>
    </header>

    <section class="question-container" id="questionContainer"></section>

    <nav class="nav-area" aria-label="Question navigation">
      <button class="nav-btn" id="prevBtn" disabled><i class="fa-solid fa-chevron-left nav-icon"></i> Prev</button>
      <span class="progress" id="progress">1 / 4</span>
      <button class="nav-btn" id="nextBtn" disabled>Next <i class="fa-solid fa-chevron-right nav-icon"></i></button>
    </nav>
  </main>

  <script>
    (() => {
      const QUESTIONS = [
        {
          letter: "a",
          text: "The successor of the greatest 3 digit number is",
          answer: "1000",
          options: ["999", "1000", "1001"]
        },
        {
          letter: "b",
          text: "The predecessor of the smallest 4 digit number is",
          answer: "999",
          options: ["998", "999", "1000"]
        },
        {
          letter: "c",
          text: "The successor of the greatest 4 digit number is",
          answer: "10000",
          options: ["9999", "10000", "10001"]
        },
        {
          letter: "d",
          text: "The predecessor of the smallest 3 digit number is",
          answer: "99",
          options: ["98", "99", "100"]
        }
      ];

      QUESTIONS.forEach(q => q._solved = false);

      let currentIndex = 0;
      let audioCtx = null;

      const container = document.getElementById("questionContainer");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progress = document.getElementById("progress");

      /* ===== SOUND – EXACT from reference ===== */
      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
      }

      function beep(freq, duration, type) {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type || "sine";
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.16, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          osc.start();
          osc.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sfx = {
        good: () => {
          beep(660, 110, "sine");
          setTimeout(() => beep(880, 160, "sine"), 110);
        },
        bad: () => beep(180, 220, "sawtooth"),
        finish: () => {
          [523, 659, 784, 1047].forEach((f, i) => {
            setTimeout(() => beep(f, 150, "sine"), i * 130);
          });
        }
      };

      /* ===== CONFETTI – EXACT from reference ===== */
      function burstConfetti(fromEl, color) {
        const rect = fromEl.getBoundingClientRect();
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;

        confetti({
          particleCount: 30,
          spread: 70,
          origin: { x, y },
          startVelocity: 20,
          colors: [color, "#ffd54f", "#ff9f45", "#7ed957", "#ff6b6b", "#4ecdc4"]
        });
      }

      function showCorrectEmoji() {
        const colors = ['#ff6fb5', '#ffd54f', '#7ed957', '#4fc3f7', '#b388ff'];
        for (let i = 0; i < 18; i++) {
          const piece = document.createElement('span');
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 90 + Math.random() * 100;
          piece.className = 'celebration-piece';
          piece.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
          piece.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * .12}s`;
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1600);
        }
        const emoji = document.createElement('div');
        emoji.className = 'emoji-pop';
        emoji.textContent = '🥳';
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1850);
      }

      function showWrongEmoji() {
        const emoji = document.createElement('div');
        emoji.className = 'emoji-pop';
        emoji.textContent = '😔';
        emoji.style.fontSize = '70px';
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);
      }

      /* ===== FINAL POPUP – EXACT from reference ===== */
      function showFinalPopup() {
        sfx.finish();

        const overlay = document.createElement('div');
        overlay.className = 'final-overlay';
        overlay.innerHTML = `
          <div class="final-modal">
            <span class="icon-big">🎉</span>
            <h2>All Done!</h2>
            <p>Amazing! You got them all right!</p>
            <button class="btn-playagain" id="playAgainBtn"><i class="fa-solid fa-rotate-right"></i> Play again</button>
          </div>
        `;
        document.body.appendChild(overlay);

        setTimeout(() => {
          const modal = overlay.querySelector('.final-modal');
          if (modal) burstConfetti(modal, '#ffd54f');
          setTimeout(() => { if (modal) burstConfetti(modal, '#4ecdc4'); }, 400);
          setTimeout(() => { if (modal) burstConfetti(modal, '#ff9f45'); }, 800);
        }, 100);

        overlay.querySelector('#playAgainBtn').addEventListener('click', () => {
          overlay.remove();
          QUESTIONS.forEach(q => q._solved = false);
          currentIndex = 0;
          render();
        });
      }

      /* ===== RENDER ===== */
      function render() {
        const q = QUESTIONS[currentIndex];
        const solved = q._solved;

        container.innerHTML = `
          <div class="q-heading">
            <span class="q-badge">${q.letter})</span>
            <span class="q-desc">${q.text} <strong>?</strong></span>
          </div>

          <div class="drop-area ${solved ? "correct" : ""}" id="dropArea">
            ${solved
            ? `<span class="dropped-answer">${q.answer}</span>`
            : `<span class="drop-text">Drop here</span>`
          }
          </div>

          <div class="choose-label">Choose your answer</div>

          <div class="options" id="options">
            ${q.options.map(option => `
              <div
                class="option ${solved ? "disabled" : ""} ${solved && option === q.answer ? "selected-correct" : ""}"
                draggable="${!solved}"
                data-answer="${option}"
              >
                <span class="option-number">${option}</span>
              </div>
            `).join("")}
          </div>
        `;

        if (!solved) attachDragEvents();
        updateNav();
      }

      /* ===== DRAG & DROP ===== */
      function attachDragEvents() {
        const dropArea = document.getElementById("dropArea");
        const options = document.querySelectorAll(".option");

        let draggedValue = null;

        options.forEach(option => {
          option.addEventListener("dragstart", e => {
            if (option.classList.contains("disabled")) return;
            draggedValue = option.dataset.answer;
            e.dataTransfer.setData("text/plain", draggedValue);
            e.dataTransfer.effectAllowed = "move";
          });

          option.addEventListener("pointerdown", () => {
            if (option.classList.contains("disabled")) return;
            draggedValue = option.dataset.answer;
          });
        });

        dropArea.addEventListener("dragover", e => {
          e.preventDefault();
          if (!dropArea.classList.contains("correct")) {
            dropArea.classList.add("drag-over");
          }
        });

        dropArea.addEventListener("dragleave", e => {
          if (!dropArea.contains(e.relatedTarget)) {
            dropArea.classList.remove("drag-over");
          }
        });

        dropArea.addEventListener("drop", e => {
          e.preventDefault();
          dropArea.classList.remove("drag-over");

          const value = e.dataTransfer.getData("text/plain") || draggedValue;
          handleAnswer(value, dropArea);
        });

        options.forEach(option => {
          option.addEventListener("click", function () {
            if (this.classList.contains("disabled")) return;
            const dropAreaEl = document.getElementById("dropArea");
            if (dropAreaEl.classList.contains("correct")) return;
            handleAnswer(this.dataset.answer, dropAreaEl);
          });
        });
      }

      function handleAnswer(value, dropArea) {
        const q = QUESTIONS[currentIndex];
        if (q._solved || !value) return;

        if (value === q.answer) {
          q._solved = true;

          dropArea.classList.remove("drag-over", "wrong");
          dropArea.classList.add("correct");
          dropArea.innerHTML = `<span class="dropped-answer">${value}</span>`;

          document.querySelectorAll(".option").forEach(option => {
            option.classList.add("disabled");
            if (option.dataset.answer === value) {
              option.classList.add("selected-correct");
            }
          });

          sfx.good();
          burstConfetti(dropArea, '#4caf50');
          showCorrectEmoji();

          if (QUESTIONS.every(q => q._solved)) {
            setTimeout(() => showFinalPopup(), 700);
          } else {
            updateNav();
          }

        } else {
          dropArea.classList.remove("drag-over");
          dropArea.classList.remove("wrong");
          void dropArea.offsetWidth;
          dropArea.classList.add("wrong");

          sfx.bad();
          showWrongEmoji();

          setTimeout(() => {
            dropArea.classList.remove("wrong");
            dropArea.innerHTML = '<span class="drop-text">Drop here</span>';
          }, 600);
        }
      }

      /* ===== NAV ===== */
      function updateNav() {
        prevBtn.disabled = currentIndex === 0;

        const solved = QUESTIONS[currentIndex]._solved;
        const hasNext = currentIndex < QUESTIONS.length - 1;

        nextBtn.disabled = !(solved && hasNext);
        progress.textContent = `${currentIndex + 1} / ${QUESTIONS.length}`;
      }

      prevBtn.addEventListener("click", () => {
        if (currentIndex > 0) {
          currentIndex--;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      nextBtn.addEventListener("click", () => {
        if (currentIndex < QUESTIONS.length - 1 && QUESTIONS[currentIndex]._solved) {
          currentIndex++;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      render();
    })();
  </script>
<script src="../../shared/quiz-ui.js"></script>
