<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tell the Time Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1060px;
      min-height: 610px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .quiz-heading {
      text-align: center;
      margin-bottom: 24px
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #12265d;
      font-size: 29px;
      line-height: 1.1;
      font-weight: 800;
    }

    .heading-icon {
      font-size: 27px;
      animation: wiggle 2.5s ease-in-out infinite
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-6deg) scale(1)
      }

      50% {
        transform: rotate(6deg) scale(1.08)
      }
    }

    /* ===== ONE QUESTION PER PAGE ===== */
    .question-stage {
      width: min(900px, 100%);
      min-height: 350px;
      margin: 0 auto;
      padding: 0px 38px 0px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      /* border: 2px solid #e4e7ec;
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(32, 43, 69, .08); */
      position: relative;
      overflow: visible;
    }

    .question-line {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #2f4f4f;
      font-size: 30px;
      font-weight: 400;
      line-height: 1;
      margin-bottom: 8px;
    }

    .question-letter {
      font-size: 30px;
      color: #2f4f4f
    }

    .clock-area {
      width: 250px;
      height: 190px;
      position: relative;
      margin-top: 2px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== CARTOON ALARM CLOCK ===== */
    .alarm-clock {
      width: 220px;
      height: 185px;
      position: relative
    }

    .clock-bell {
      position: absolute;
      top: 0;
      width: 62px;
      height: 43px;
      background: #ffad16;
      border: 3px solid #db7900;
      border-radius: 52% 48% 42% 42%;
      z-index: 1;
    }

    .clock-bell.left {
      left: 5px;
      transform: rotate(-24deg)
    }

    .clock-bell.right {
      right: 5px;
      transform: rotate(24deg)
    }

    .clock-bell::after {
      content: "";
      position: absolute;
      bottom: -6px;
      width: 54px;
      height: 12px;
      background: #ff7f0a;
      border: 3px solid #d96a00;
      border-radius: 50%;
    }

    .clock-bell.left::after {
      right: -4px
    }

    .clock-bell.right::after {
      left: -4px
    }

    .bell-top {
      position: absolute;
      top: -4px;
      left: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e58b00;
      transform: translateX(-50%);
    }

    .clock-body {
      position: absolute;
      left: 15px;
      top: 37px;
      width: 200px;
      height: 155px;
      border-radius: 48% 48% 45% 45%;
      background: linear-gradient(180deg, #ff5d25, #f22d13);
      border: 4px solid #c9230d;
      box-shadow: inset 0 -7px 0 rgba(160, 20, 10, .12), 0 10px 0 rgba(100, 30, 10, .12);
    }

    .clock-face {
      position: absolute;
      left: 32px;
      top: 18px;
      width: 136px;
      height: 136px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid #cfcfcf;
      box-shadow: inset 0 0 0 2px #ececec;
    }

    .clock-face .num {
      position: absolute;
      color: #222;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      transform: translate(-50%, -50%);
    }

    .n12 {
      left: 50%;
      top: 8%
    }

    .n1 {
      left: 71%;
      top: 14%
    }

    .n2 {
      left: 86%;
      top: 28%
    }

    .n3 {
      left: 92%;
      top: 50%
    }

    .n4 {
      left: 86%;
      top: 72%
    }

    .n5 {
      left: 71%;
      top: 86%
    }

    .n6 {
      left: 50%;
      top: 92%
    }

    .n7 {
      left: 29%;
      top: 86%
    }

    .n8 {
      left: 14%;
      top: 72%
    }

    .n9 {
      left: 8%;
      top: 50%
    }

    .n10 {
      left: 14%;
      top: 28%
    }

    .n11 {
      left: 29%;
      top: 14%
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      border-radius: 6px;
      z-index: 5;
    }

    .hour-hand {
      width: 6px;
      height: 40px;
      background: #172b55;
      transform: translateX(-50%) rotate(var(--hour))
    }

    .minute-hand {
      width: 4px;
      height: 52px;
      background: #17a9d7;
      transform: translateX(-50%) rotate(var(--minute))
    }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #20c2ef;
      border: 2px solid #098bb2;
      transform: translate(-50%, -50%);
      z-index: 7;
    }

    .clock-foot {
      position: absolute;
      bottom: -2px;
      width: 48px;
      height: 16px;
      border-radius: 50%;
      background: #8d9aa7;
      border: 3px solid #69747f;
    }

    .clock-foot.left {
      left: 38px;
      transform: rotate(7deg)
    }

    .clock-foot.right {
      right: 38px;
      transform: rotate(-7deg)
    }

    .clock-button {
      position: absolute;
      top: 30px;
      width: 15px;
      height: 33px;
      border-radius: 9px;
      background: #f8c23d;
      border: 2px solid #c78c00
    }

    .clock-button.left {
      left: 1px;
      transform: rotate(-15deg)
    }

    .clock-button.right {
      right: 1px;
      transform: rotate(15deg)
    }

    .clock-side {
      position: absolute;
      top: 92px;
      width: 18px;
      height: 42px;
      border-radius: 12px;
      background: #ff7b2a;
      border: 3px solid #c9230d
    }

    .clock-side.left {
      left: -7px
    }

    .clock-side.right {
      right: -7px
    }

    /* ===== ALARM-STYLE TIME INPUT ===== */
    .time-setter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 2px;
    }

    .time-spinner {
      width: 120px;
      height: 55px;
      border: 2px solid #ff9651;
      border-radius: 14px;
      background: #fff;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 #ffe2cb;
      overflow: hidden;
    }

    .spin-arrow {
      width: 100%;
      height: 31px;
      border: 0;
      background: #fff7ef;
      color: #f1843d;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: background .12s ease, transform .12s ease;
    }

    .spin-arrow:hover {
      background: #ffe9d7
    }

    .spin-arrow:active {
      transform: scale(.9)
    }

    .spin-value {
      width: 100%;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #172b55;
      font-size: 28px;
      font-weight: 800;
      border-top: 1px solid #ffe4d2;
      border-bottom: 1px solid #ffe4d2;
      user-select: none;
    }

    .time-colon {
      font-size: 30px;
      font-weight: 800;
      color: #172b55
    }

    .check-time {
      margin-top: 16px;
      border: 0;
      border-radius: 999px;
      padding: 11px 28px;
      background: linear-gradient(180deg, #55b449, #3d9634);
      color: #fff;
      box-shadow: 0 5px 0 #2f7c2b;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }

    .check-time:hover:not(:disabled) {
      transform: translateY(-2px)
    }

    .check-time:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #2f7c2b
    }

    .check-time:disabled {
      opacity: .45;
      cursor: default
    }

    .time-setter.wrong .time-part {
      border-color: #ed5973;
      background: #fff0f3;
      animation: blink .62s ease
    }

    .time-setter.correct .time-part {
      border-color: #55b449;
      background: #eff9eb;
      box-shadow: 0 4px 0 #c9e5c4
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      18%,
      58% {
        opacity: .28
      }

      38%,
      78% {
        opacity: 1
      }
    }

    /* ===== NAV / POPUPS ===== */
    .nav {
      margin: 10px auto 0 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      position: relative;
      z-index: 5
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px)
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf
    }

    .progress {
      min-width: 52px;
      text-align: center;
      color: #12265d;
      font-size: 14px;
      font-weight: 800
    }

    .celebration-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      left: 50%;
      top: 50%;
      border-radius: 3px;
      pointer-events: none;
      z-index: 9998;
      animation: celebrate 1.5s ease-out forwards;
    }

    @keyframes celebrate {
      from {
        transform: translate(-50%, -50%) scale(1) rotate(0);
        opacity: 1
      }

      to {
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.25) rotate(540deg);
        opacity: 0
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35)
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18)
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82)
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      transition: transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: scale(.95)
    }

    @media(max-width:768px) {
      body {
        padding: 10px 14px
      }

      .quiz-wrap {
        min-height: 520px
      }

      .quiz-heading {
        margin-bottom: 18px
      }

      .quiz-heading h1 {
        font-size: 25px
      }

      .question-stage {
        min-height: 440px;
        padding: 22px 22px 22px
      }

      .question-line {

      }

      .question-letter {
        font-size: 30px
      }

      .clock-area {
        transform: scale(.92);
        margin-top: -5px;
        margin-bottom: -4px
      }

      .time-spinner {
        width: 110px;
        height: 70px
      }

      .spin-value {
        font-size: 25px
      }

      .check-time {
        margin-top: 14px
      }

      .nav {
        gap: 10px;
        margin-top: 18px
      }

      .nav button {
        min-width: 100px;
        padding: 10px 17px;
        font-size: 14px
      }
    }

    @media(max-width:480px) {
      .quiz-heading h1 {
        font-size: 22px
      }

      .heading-icon {
        font-size: 22px
      }

      .question-stage {
        min-height: 420px;
        padding: 19px 12px 18px
      }

      .question-line {
        font-size: 30px;
        gap: 12px
      }

      .question-letter {
        font-size: 30px
      }

      .clock-area {
        transform: scale(.76);
        height: 178px;
        margin-top: -12px;
        margin-bottom: -12px
      }

      .time-spinner {
        width: 110px;
        height: 70px
      }

      .spin-value {
        font-size: 23px
      }

      .time-colon {
        font-size: 26px
      }

      .check-time {
        font-size: 15px;

      }

      .nav {

        margin-top: 15px
      }

      .nav button {
        min-width: 82px;

      }

      .progress {

    }

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {

      }

      .question-line {

      }

      }

      .clock-area {

      }

      }

      }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {

      }
    }

    @media screen and (min-width: 1921px) {
      .question-line {

      }

      .question-letter {

      .clock-area {

      }

    @media(prefers-reduced-motion:reduce) {

  </style>

<body>
  <main class="quiz-wrap">
    <header class="quiz-heading">
      <h1><span class="heading-icon">⏰</span> Write the time shown on the clock.</h1>
    </header>
    <section id="quiz"></section>
    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled><i class="fa-solid fa-chevron-left"></i> Prev</button>
      <span class="progress" id="progress">1 / 4</span>
      <button id="nextBtn" disabled>Next <i class="fa-solid fa-chevron-right"></i></button>
    </nav>
  </main>

  <script>
    (() => {
      /* Times represented by the four clocks in the supplied worksheet image. */
      const QUESTIONS = [
        { id: "a", hour: 1, minute: 0, answer: "01:00" },
        { id: "b", hour: 5, minute: 45, answer: "05:45" },
        { id: "c", hour: 8, minute: 0, answer: "08:00" },
        { id: "d", hour: 7, minute: 15, answer: "07:15" }
      ];

      let currentPage = 0;
      let audioCtx = null;
      QUESTIONS.forEach(q => { q.solved = false; q.selected = "00:00"; });

      const quiz = document.getElementById("quiz");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progress = document.getElementById("progress");

      function getCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }
      function beep(freq, duration, type = "sine") {
        try {
          const ctx = getCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(ctx.destination);
          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + duration / 1000);
          osc.start(); osc.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }
      const sound = {
        correct() { beep(660, 110); setTimeout(() => beep(880, 160), 110) },
        wrong() { beep(180, 220, "sawtooth") },
        finish() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 150), i * 130)) }
      };

      function burstConfetti(el) {
        const r = el.getBoundingClientRect();
        if (typeof confetti === "function") {
          confetti({
            particleCount: 34, spread: 70, startVelocity: 22,
            origin: { x: (r.left + r.width / 2) / innerWidth, y: (r.top + r.height / 2) / innerHeight },
            colors: ["#6635dc", "#ff4e83", "#4e8ff0", "#76b93b", "#f4ae25", "#4ecdc4"]
          });
        }
      }
      function showEmoji(text) {
        const emoji = document.createElement("div");
        emoji.className = "emoji-pop"; emoji.textContent = text;
        document.body.appendChild(emoji); setTimeout(() => emoji.remove(), 1600);
      }
      function showFinalPopup() {
        sound.finish();
        const overlay = document.createElement("div");
        overlay.className = "final-overlay";
        const modal = document.createElement("div");
        modal.className = "final-modal";
        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain"><i class="fa-solid fa-rotate-right"></i> Play again</button>
    `;
        overlay.appendChild(modal); document.body.appendChild(overlay);
        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);
        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          QUESTIONS.forEach(q => { q.solved = false; q.selected = "00:00" });
          currentPage = 0; overlay.remove(); render();
        });
      }

      function checkAnswer() {
        const q = QUESTIONS[currentPage];
        if (q.solved) return;
        const hour = document.getElementById("hourValue");
        const minute = document.getElementById("minuteValue");
        const setter = document.querySelector(".time-setter");
        const check = document.getElementById("checkTime");
        const value = `${hour.textContent}:${minute.textContent}`;

        setter.classList.remove("wrong", "correct");
        if (value === q.answer) {
          q.solved = true; q.selected = value;
          setter.classList.add("correct");
          hour.disabled = true; minute.disabled = true; check.disabled = true;
          sound.correct(); burstConfetti(check); showEmoji("🥳"); updateNav();
          if (QUESTIONS.every(x => x.solved)) setTimeout(showFinalPopup, 900);
        } else {
          q.selected = value;
          setter.classList.add("wrong");
          sound.wrong(); showEmoji("😔");

          setTimeout(() => {
            setter.classList.remove("wrong");
            hour.textContent = "00";
            minute.textContent = "00";
            q.selected = "00:00";
            check.disabled = true;
          }, 650);
        }
      }

      function clockMarkup(q) {
        const minuteDeg = q.minute * 6;
        const hourDeg = ((q.hour % 12) * 30) + (q.minute * .5);
        return `
      <div class="alarm-clock" aria-label="Clock showing ${q.answer}">
        <div class="clock-bell left"><span class="bell-top"></span></div>
        <div class="clock-bell right"><span class="bell-top"></span></div>
        <div class="clock-body">
          <div class="clock-button left"></div><div class="clock-button right"></div>
          <div class="clock-side left"></div><div class="clock-side right"></div>
          <div class="clock-face">
            <span class="num n12">XII</span><span class="num n1">I</span><span class="num n2">II</span>
            <span class="num n3">III</span><span class="num n4">IV</span><span class="num n5">V</span>
            <span class="num n6">VI</span><span class="num n7">VII</span><span class="num n8">VIII</span>
            <span class="num n9">IX</span><span class="num n10">X</span><span class="num n11">XI</span>
            <span class="hand hour-hand" style="--hour:${hourDeg}deg"></span>
            <span class="hand minute-hand" style="--minute:${minuteDeg}deg"></span>
            <span class="center-dot"></span>
          </div>
        </div>
        <div class="clock-foot left"></div><div class="clock-foot right"></div>
      </div>
    `;
      }

      function optionsMarkup(q) {
        const [h, m] = q.selected ? q.selected.split(":") : ["00", "00"];
        return `
      <div class="time-setter ${q.solved ? "correct" : ""}">
        <div class="time-spinner" data-part="hour">
          <button class="spin-arrow spin-up" type="button" aria-label="Increase hour">
            <i class="fa-solid fa-chevron-up"></i>
          </button>
          <div class="spin-value" id="hourValue">${h}</div>
          <button class="spin-arrow spin-down" type="button" aria-label="Decrease hour">
            <i class="fa-solid fa-chevron-down"></i>
          </button>
        </div>

        <span class="time-colon">:</span>

        <div class="time-spinner" data-part="minute">
          <button class="spin-arrow spin-up" type="button" aria-label="Increase minute">
            <i class="fa-solid fa-chevron-up"></i>
          </button>
          <div class="spin-value" id="minuteValue">${m}</div>
          <button class="spin-arrow spin-down" type="button" aria-label="Decrease minute">
            <i class="fa-solid fa-chevron-down"></i>
          </button>
        </div>
      </div>

      <button class="check-time" id="checkTime" ${q.solved ? "disabled" : ""}>
        <i class="fa-solid fa-check"></i> Check
      </button>
    `;
      }

      function bindTimeControls(q) {
        let hour = q.selected ? Number(q.selected.split(":")[0]) : 0;
        let minute = q.selected ? Number(q.selected.split(":")[1]) : 0;

        const hourValue = document.getElementById("hourValue");
        const minuteValue = document.getElementById("minuteValue");

        function paint() {
          hourValue.textContent = String(hour).padStart(2, "0");
          minuteValue.textContent = String(minute).padStart(2, "0");
          q.selected = `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;

          const checkButton = document.getElementById("checkTime");
          if (checkButton && !q.solved) {
            checkButton.disabled = (hour === 0 && minute === 0);
          }
        }

        document.querySelectorAll(".time-spinner").forEach(spinner => {
          spinner.querySelector(".spin-up").addEventListener("click", () => {
            if (q.solved) return;
            if (spinner.dataset.part === "hour") {
              hour = hour === 12 ? 1 : hour + 1;
            } else {
              minute = (minute + 1) % 60;
            }
            paint();
          });

          spinner.querySelector(".spin-down").addEventListener("click", () => {
            if (q.solved) return;
            if (spinner.dataset.part === "hour") {
              hour = hour === 0 ? 12 : hour - 1;
            } else {
              minute = (minute + 59) % 60;
            }
            paint();
          });
        });

        paint();
        document.getElementById("checkTime").addEventListener("click", checkAnswer);
      }


      function render() {
        const q = QUESTIONS[currentPage];
        quiz.innerHTML = `
      <article class="question-stage">
        <div class="question-line">
          <span class="question-letter">${q.id})</span>
          <span>Read the clock</span>
        </div>
        <div class="clock-area">${clockMarkup(q)}</div>
        ${optionsMarkup(q)}
      </article>
    `;
        bindTimeControls(q);
        updateNav();
      }

      function updateNav() {
        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = !QUESTIONS[currentPage].solved;
        progress.textContent = `${currentPage + 1} / ${QUESTIONS.length}`;
      }

      prevBtn.addEventListener("click", () => {
        if (currentPage > 0) { currentPage--; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
      });
      nextBtn.addEventListener("click", () => {
        if (!QUESTIONS[currentPage].solved) return;
        if (currentPage < QUESTIONS.length - 1) { currentPage++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
        else showFinalPopup();
      });

      render();
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
