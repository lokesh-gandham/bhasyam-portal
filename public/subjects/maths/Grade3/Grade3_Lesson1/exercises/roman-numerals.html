<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roman Numerals Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #12265d;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1060px;
      min-height: 610px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ===== HEADING ===== */
    .quiz-heading {
      text-align: center;
      margin-bottom: 24px;
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #12265d;
      font-size: 29px;
      line-height: 1.1;
      font-weight: 800;
    }

    .heading-icon {
      font-size: 27px;
      animation: wiggle 2.5s ease-in-out infinite;
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-6deg) scale(1);
      }

      50% {
        transform: rotate(6deg) scale(1.08);
      }
    }

    /* ===== NEW BALLOON CARD ===== */
    .question-stage {
      width: min(900px, 100%);
      min-height: 430px;
      margin: 0 auto;
      padding: 0 38px 15px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 3px solid #202b45;
      border-radius: 30px;
      background: #fff;
      box-shadow: 9px 9px 0 #dcecff, 0 18px 35px rgba(32, 43, 69, .12);
    }

    .question-stage::before {
      content: "";
      position: absolute;
      width: 175px;
      height: 175px;
      top: -105px;
      left: -90px;
      border-radius: 50%;
      background: #fff1d9;
    }

    .question-stage::after {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      right: -120px;
      bottom: -135px;
      border-radius: 50%;
      background: #eaf7ff;
    }

    .stage-top {
      width: min(700px, 100%);
      margin-top: 5px;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 13px;
      position: relative;
      z-index: 3;
      border-radius: 18px;
      background: #f6f8fc;
      border: 2px solid #e5e9f1;
    }

    .question-number {
      min-width: 46px;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #202b45;
      color: #fff;
      font-size: 21px;
      font-weight: 800;
      box-shadow: 0 4px 0 #101827;
    }

    .stage-title {
      color: #202b45;
      font-size: 24px;
      font-weight: 800;
    }

    .question-text {
      position: relative;
      z-index: 3;
      margin-top: 8px;
      font-size: 43px;
      line-height: 1.15;
      font-weight: 800;
      color: #172b55;
      letter-spacing: 1px;
    }

    .answer-box {
      width: 200px;
      height: 61px;
      margin: 10px 0 20px;
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #ff9b52;
      border-radius: 17px;
      background: #fff;
      color: #12265d;
      font-size: 29px;
      font-weight: 800;
      box-shadow: 0 6px 0 #ffe3c4;
      transition: background .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .answer-box.correct {
      border-color: #55b449;
      background: #effbe9;
      box-shadow: 0 6px 0 #cbe7c5;
    }

    .answer-box.wrong {
      border-color: #ed5973;
      background: #fff1f4;
      animation: answerBlink .62s ease;
    }

    @keyframes answerBlink {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      18%,
      58% {
        opacity: .28;
        transform: scale(1.045);
      }

      38%,
      78% {
        opacity: 1;
        transform: scale(.985);
      }
    }

    .balloon-options {
      width: 100%;
      max-width: 760px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 42px;
      position: relative;
      z-index: 6;
    }

    .balloon-choice {
      position: relative;
      z-index: 5;
      width: 180px;
      height: 150px;
      padding: 0;
      border: 0;
      background: transparent;
      position: relative;
      cursor: pointer;
      transition: opacity .2s ease;
    }

    .balloon {
      width: 150px;
      height: 108px;
      margin: 0 auto;
      border: 0;
      border-radius: 50% 50% 47% 47% / 54% 54% 46% 46%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #111827 !important;
      background: #ff9f7f;
      font-size: 32px;
      line-height: 1;
      font-weight: 800;
      text-shadow: none;
      box-shadow:
        inset -12px -12px 0 rgba(0, 0, 0, .07),
        inset 10px 10px 0 rgba(255, 255, 255, .32),
        0 8px 0 rgba(80, 70, 100, .08),
        0 13px 18px rgba(40, 40, 70, .12);
      transform-origin: 50% 100%;
      isolation: isolate;
    }

    .balloon::before {
      content: "";
      position: absolute;
      width: 31px;
      height: 18px;
      left: 23px;
      top: 17px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .38);
      transform: rotate(-30deg);
    }

    .balloon::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -11px;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 13px solid currentColor;
      filter: brightness(.87);
    }

    .balloon>.balloon-label {
      position: relative;
      z-index: 3;
      display: block;
      width: 100%;
      padding: 0 12px;
      text-align: center;
      color: #111827 !important;
      font-size: 32px;
      line-height: 1;
      font-weight: 800;
    }

    .balloon-string {
      width: 2px;
      height: 35px;
      margin: 0 auto;
      background: #aaa4b3;
      position: relative;
    }

    .balloon-string::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      left: 50%;
      bottom: -5px;
      transform: translateX(-50%) rotate(45deg);
      border-right: 2px solid #aaa4b3;
      border-bottom: 2px solid #aaa4b3;
    }

    .balloon-choice:nth-child(1) .balloon {
      background: #ff9f7f;
      color: #111827 !important;
    }

    .balloon-choice:nth-child(2) .balloon {
      background: #6fc8f5;
      color: #111827 !important;
    }

    .balloon-choice:nth-child(3) .balloon {
      background: #a991f2;
      color: #111827 !important;
    }

    @keyframes balloonFloatOne {

      0%,
      100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-13px) rotate(3deg);
      }
    }

    @keyframes balloonFloatTwo {

      0%,
      100% {
        transform: translateY(-5px) rotate(2deg);
      }

      50% {
        transform: translateY(-18px) rotate(-3deg);
      }
    }

    @keyframes balloonFloatThree {

      0%,
      100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-14px) rotate(4deg);
      }
    }

    /* Keep the balloons gently floating all the time */
    .balloon-choice:nth-child(1) .balloon {
      animation: balloonFloatOne 3.2s ease-in-out infinite;
    }

    .balloon-choice:nth-child(2) .balloon {
      animation: balloonFloatTwo 3.7s ease-in-out infinite;
      animation-delay: -.8s;
    }

    .balloon-choice:nth-child(3) .balloon {
      animation: balloonFloatThree 3.4s ease-in-out infinite;
      animation-delay: -1.4s;
    }

    .balloon-choice:hover:not(:disabled) .balloon {
      transform: translateY(-9px) scale(1.09);
      filter: saturate(1.08);
    }

    .balloon-choice:active:not(:disabled) .balloon {
      transform: translateY(3px) scale(.98);
    }

    .balloon-choice:disabled {
      cursor: default;
      opacity: .4;
    }

    .balloon-choice.burst {
      animation: balloonBurst .58s ease forwards;
    }

    .balloon-choice.fly {
      animation: balloonFly 1.15s cubic-bezier(.18, .78, .24, 1) forwards;
    }

    .balloon-choice.burst .balloon,
    .balloon-choice.fly .balloon {
      animation: none;
    }

    @keyframes balloonBurst {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      30% {
        transform: scale(1.18);
        opacity: 1;
      }

      58% {
        transform: scale(.86);
        opacity: .65;
      }

      100% {
        transform: scale(.04);
        opacity: 0;
      }
    }

    @keyframes balloonFly {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      20% {
        transform: translateY(-25px) rotate(-5deg) scale(1.06);
        opacity: 1;
      }

      55% {
        transform: translateY(-105px) rotate(7deg) scale(.94);
        opacity: .92;
      }

      100% {
        transform: translateY(-285px) rotate(13deg) scale(.62);
        opacity: 0;
      }
    }

    .burst-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      animation: burstPiece .65s ease-out forwards;
    }

    @keyframes burstPiece {
      from {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }

      to {
        transform: translate(var(--x), var(--y)) scale(.12);
        opacity: 0;
      }
    }

    /* ===== NAV ===== */
    .nav {
      margin: 15px auto 0 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      position: relative;
      z-index: 5;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    .progress {
      min-width: 52px;
      text-align: center;
      color: #12265d;
      font-size: 14px;
      font-weight: 800;
    }

    /* ===== EMOJI / FINAL POPUP ===== */
    .celebration-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      left: 50%;
      top: 50%;
      border-radius: 3px;
      pointer-events: none;
      z-index: 9998;
      animation: celebrate 1.5s ease-out forwards;
    }

    @keyframes celebrate {
      from {
        transform: translate(-50%, -50%) scale(1) rotate(0);
        opacity: 1;
      }

      to {
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.25) rotate(540deg);
        opacity: 0;
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    /* ===== FINAL POPUP — OLD REFERENCE STYLE ===== */
    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      transition: transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: scale(.95);
    }

    /* ===== SAME RESPONSIVE BREAKPOINTS ===== */
    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        min-height: 580px;
      }

      .question-stage {
        min-height: 410px;
      }
    }

    @media (max-width: 1024px) {
      .quiz-wrap {
        min-height: 560px;
      }

      .question-stage {
        width: min(900px, 100%);
        min-height: 400px;
      }

      .question-text {
        font-size: 37px;
      }

      .balloon-options {
        gap: 24px;
      }

      .balloon-choice {
        width: 155px;
      }

      .balloon {
        width: 126px;
        height: 92px;
      }

      .balloon>.balloon-label {
        font-size: 26px;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 10px 14px;
      }

      .quiz-wrap {
        min-height: 520px;
      }

      .quiz-heading {
        margin-bottom: 18px;
      }

      .quiz-heading h1 {
        font-size: 25px;
      }

      .question-stage {
        min-height: 390px;
        padding: 0 18px 24px;
      }

      .stage-top {
        padding-top: 20px;
      }

      .question-number {
        min-width: 40px;
        height: 40px;
        font-size: 20px;
      }

      .stage-title {
        font-size: 21px;
      }

      .question-text {
        font-size: 33px;
        margin-top: 5px;
      }

      .answer-box {
        width: 175px;
        height: 53px;
        margin: 18px 0 22px;
        font-size: 26px;
      }

      .balloon-options {
        gap: 10px;
      }

      .balloon-choice {
        width: 128px;
      }

      .balloon {
        width: 105px;
        height: 77px;
      }

      .balloon>.balloon-label {
        font-size: 22px;
      }

      .nav {
        gap: 10px;
        margin-top: 24px;
      }

      .nav button {
        min-width: 100px;
        padding: 10px 17px;
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .quiz-heading h1 {
        font-size: 22px;
      }

      .heading-icon {
        font-size: 22px;
      }

      .question-stage {
        min-height: 365px;
        padding: 0 11px 20px;
      }

      .stage-top {
        padding-top: 18px;
        gap: 8px;
      }

      .question-number {
        min-width: 36px;
        height: 36px;
        border-radius: 11px;
        font-size: 18px;
      }

      .stage-title {
        font-size: 19px;
      }

      .question-text {
        font-size: 29px;
      }

      .answer-box {
        width: 170px;
        height: 47px;
        margin-bottom: 18px;
      }

      .balloon-options {
        gap: 3px;
      }

      .balloon-choice {
        width: 88px;
        height: 98px;
      }

      .balloon {
        width: 76px;
        height: 57px;
        font-size: 17px;
      }

      .balloon-string {
        height: 23px;
      }

      .nav {
        gap: 8px;
      }

      .nav button {
        min-width: 82px;
        padding: 8px 13px;
        font-size: 12px;
      }

      .progress {
        min-width: 45px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .balloon,
      .celebration-piece,
      .burst-piece,
      .emoji-pop,
      .final-modal,
      .heading-icon {
        animation: none !important;
      }

      .celebration-piece,
      .burst-piece {
        display: none !important;
      }
    }
  </style>

<body>
  <main class="quiz-wrap">

    <header class="quiz-heading">
      <h1>
        <span class="heading-icon">🎯</span>
        Write the Roman numerals for the following Hindu Arabic numerals.
      </h1>
    </header>

    <section id="quiz"></section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i> Prev
      </button>

      <span class="progress" id="progress">1 / 6</span>

      <button id="nextBtn" disabled>
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {
      const QUESTIONS = [
        { number: 6, answer: "VI", options: ["IV", "VI", "IX"] },
        { number: 19, answer: "XIX", options: ["XIV", "XIX", "XXI"] },
        { number: 45, answer: "XLV", options: ["XLV", "LV", "XLI"] },
        { number: 28, answer: "XXVIII", options: ["XXVIII", "XXIV", "XXXVIII"] },
        { number: 100, answer: "C", options: ["L", "C", "D"] },
        { number: 32, answer: "XXXII", options: ["XXII", "XXXII", "XXXIV"] }
      ];

      let currentPage = 0;
      let audioCtx = null;

      QUESTIONS.forEach(q => {
        q.selected = null;
        q.solved = false;
      });

      const quiz = document.getElementById("quiz");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progress = document.getElementById("progress");

      /* ===== SOUND ===== */
      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(freq, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type;
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          osc.start();
          osc.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((f, i) => {
            setTimeout(() => beep(f, 150), i * 130);
          });
        }
      };

      /* ===== CONFETTI ===== */
      function burstConfetti(el, color) {
        const r = el.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (r.left + r.width / 2) / innerWidth,
              y: (r.top + r.height / 2) / innerHeight
            },
            colors: [
              color || "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showCorrectEmoji() {
        const colors = ["#ff6fb5", "#ffd54f", "#7ed957", "#4fc3f7", "#b388ff"];

        for (let i = 0; i < 18; i++) {
          const piece = document.createElement("span");
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 90 + Math.random() * 100;

          piece.className = "celebration-piece";
          piece.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          piece.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * .12}s`;

          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1600);
        }

        const emoji = document.createElement("div");
        emoji.className = "emoji-pop";
        emoji.textContent = "🥳";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1850);
      }

      function showWrongEmoji() {
        const emoji = document.createElement("div");
        emoji.className = "emoji-pop";
        emoji.textContent = "😔";
        emoji.style.fontSize = "70px";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);
      }

      /* ===== BALLOON POP ===== */
      function burstBalloon(button) {
        const rect = button.getBoundingClientRect();
        const colors = ["#ff8f70", "#68bdf4", "#9b83ed", "#ffd45c", "#55b449"];

        for (let i = 0; i < 13; i++) {
          const piece = document.createElement("span");
          const angle = (Math.PI * 2 * i) / 13;
          const distance = 35 + Math.random() * 70;

          piece.className = "burst-piece";
          piece.style.left = `${rect.left + rect.width / 2}px`;
          piece.style.top = `${rect.top + 35}px`;
          piece.style.background = colors[i % colors.length];
          piece.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          piece.style.setProperty("--y", `${Math.sin(angle) * distance}px`);

          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 700);
        }
      }

      /* ===== FINAL POPUP ===== */
      function showFinalPopup() {
        sound.finish();

        const overlay = document.createElement("div");
        overlay.className = "final-overlay";

        const modal = document.createElement("div");
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i> Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal, "#ffd54f"), 80);
        setTimeout(() => burstConfetti(modal, "#4ecdc4"), 350);
        setTimeout(() => burstConfetti(modal, "#ff9f45"), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          QUESTIONS.forEach(q => {
            q.selected = null;
            q.solved = false;
          });

          currentPage = 0;
          overlay.remove();
          render();
        });
      }

      function setAnswerBox(index, value, state) {
        const box = document.querySelector(`.answer-box[data-index="${index}"]`);
        if (!box) return;

        box.classList.remove("wrong", "correct");
        box.textContent = value || "";

        if (state === "wrong") {
          void box.offsetWidth;
          box.classList.add("wrong");
        }

        if (state === "correct") {
          void box.offsetWidth;
          box.classList.add("correct");
        }
      }

      function checkAnswer(index, button) {
        const q = QUESTIONS[index];

        if (q.solved) return;

        q.selected = button.dataset.value;

        if (q.selected === q.answer) {
          q.solved = true;

          setAnswerBox(index, q.answer, "correct");

          button.classList.remove("selected", "wrong");
          button.classList.add("fly");

          document
            .querySelectorAll(`.balloon-choice[data-index="${index}"]`)
            .forEach(btn => btn.disabled = true);

          sound.correct();
          burstConfetti(button, "#55b449");
          showCorrectEmoji();

          updateNav();

          if (QUESTIONS.every(item => item.solved)) {
            setTimeout(showFinalPopup, 900);
          }

        } else {
          button.classList.remove("selected");
          button.classList.add("burst");

          setAnswerBox(index, q.selected, "wrong");

          sound.wrong();
          burstBalloon(button);
          showWrongEmoji();

          setTimeout(() => {
            button.classList.remove("burst");
            setAnswerBox(index, "", "");
            q.selected = null;
          }, 650);
        }
      }

      function render() {
        const q = QUESTIONS[currentPage];

        quiz.innerHTML = `
      <article class="question-stage">
        <div class="stage-top">
          <span class="question-number">${currentPage + 1})</span>
          <span class="stage-title">Write the Roman numeral</span>
        </div>

        <div class="question-text">${q.number}</div>

        <div class="answer-box ${q.solved ? "correct" : ""}"
             data-index="${currentPage}"
             aria-label="Answer box">
          ${q.solved ? q.answer : ""}
        </div>

        <div class="balloon-options">
          ${q.options.map((option, i) => `
            <button
              class="balloon-choice"
              data-index="${currentPage}"
              data-value="${option}"
              ${q.solved ? "disabled" : ""}
              aria-label="Choose ${option}">
              <div class="balloon"><span class="balloon-label">${option}</span></div>
              <div class="balloon-string"></div>
            </button>
          `).join("")}
        </div>
      </article>
    `;

        document.querySelectorAll(".balloon-choice").forEach(button => {
          button.addEventListener("click", () => {
            checkAnswer(
              Number(button.dataset.index),
              button
            );
          });
        });

        updateNav();
      }

      function updateNav() {
        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = !QUESTIONS[currentPage].solved || currentPage === QUESTIONS.length - 1;
        progress.textContent = `${currentPage + 1} / ${QUESTIONS.length}`;
      }

      prevBtn.addEventListener("click", () => {
        if (currentPage > 0) {
          currentPage--;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      nextBtn.addEventListener("click", () => {
        if (QUESTIONS[currentPage].solved && currentPage < QUESTIONS.length - 1) {
          currentPage++;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      document.addEventListener("keydown", e => {
        if (e.key !== "Backspace") return;

        const active = document.activeElement;
        if (active && ["INPUT", "TEXTAREA", "SELECT"].includes(active.tagName)) return;

        const q = QUESTIONS[currentPage];
        if (q.solved) return;

        if (q.selected !== null) {
          q.selected = null;
          setAnswerBox(currentPage, "", "");
          document.querySelectorAll(".balloon-choice").forEach(btn => {
            btn.classList.remove("burst", "fly");
          });
        }
      });

      render();
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
