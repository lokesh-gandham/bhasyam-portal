<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roman Numerals Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1060px;
      min-height: 610px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ===== HEADING ===== */
    .quiz-heading {
      text-align: center;
      margin-bottom: 24px;
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #12265d;
      font-size: 29px;
      line-height: 1.1;
      font-weight: 800;
    }

    .heading-icon {
      font-size: 27px;
      animation: wiggle 2.5s ease-in-out infinite;
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-6deg) scale(1);
      }

      50% {
        transform: rotate(6deg) scale(1.08);
      }
    }

    /* ===== PROPER ANIMATED CAMPFIRE GAME ===== */
    .question-stage {
      width: min(900px, 100%);
      min-height: 430px;
      margin: 0 auto;
      padding: 22px 38px 28px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 2px solid #e4e7ec;
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(32, 43, 69, .08);
    }

    .stage-top {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 5;
      margin-bottom: 12px;
    }

    .question-number {
      min-width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #f1f4f8;
      color: #50617a;
      font-size: 20px;
      font-weight: 800;
    }

    .stage-title {
      color: #263653;
      font-size: 23px;
      font-weight: 800
    }

    .question-text {
      position: relative;
      z-index: 5;
      margin: 0 0 14px;
      font-size: 43px;
      line-height: 1;
      font-weight: 800;
      color: #172b55;
      letter-spacing: 2px;
    }

    /* Answer */
    .answer-box {
      width: 190px;
      height: 58px;
      margin: 0 0 19px;
      position: relative;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #ff9b52;
      border-radius: 15px;
      background: #fff;
      color: #12265d;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 5px 0 #ffe3c4;
    }

    .answer-box.correct {
      border-color: #55b449;
      background: #effbe9;
      box-shadow: 0 5px 0 #cbe7c5
    }

    .answer-box.wrong {
      border-color: #ed5973;
      background: #fff1f4;
      animation: answerBlink .62s ease
    }

    @keyframes answerBlink {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      18%,
      58% {
        opacity: .28;
        transform: scale(1.045)
      }

      38%,
      78% {
        opacity: 1;
        transform: scale(.985)
      }
    }

    /* Three bonfire choices */
    .balloon-options {
      width: min(700px, 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      position: relative;
      z-index: 6;
    }

    .balloon-string {
      display: none
    }

    .balloon-choice {
      width: 100%;
      height: 145px;
      padding: 8px 8px 9px;
      position: relative;
      border: 2px solid #e8e1d9;
      border-radius: 21px;
      background: #fffaf5;
      box-shadow: 0 5px 0 #eee5dc;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, opacity .2s ease;
    }

    .balloon-choice:hover:not(:disabled) {
      transform: translateY(-5px);
      border-color: #e3b267;
      box-shadow: 0 9px 0 #eadfce;
    }

    .balloon-choice:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #eadfce
    }

    .balloon-choice:disabled {
      cursor: default;
      opacity: .4
    }

    .balloon-choice:focus-visible {
      outline: 3px solid #ffd45c;
      outline-offset: 3px
    }

    /* Bonfire illustration */
    .balloon {
      width: 112px;
      height: 93px;
      position: relative;
      margin: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      isolation: isolate;
    }

    /* soft glow */
    .balloon .fire-glow {
      position: absolute;
      left: 25px;
      bottom: 22px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(255, 174, 45, .18);
      filter: blur(7px);
      z-index: 1;
    }

    /* rear log */
    .balloon .log-back {
      position: absolute;
      left: 18px;
      bottom: 12px;
      width: 76px;
      height: 17px;
      border-radius: 10px;
      background: linear-gradient(180deg, #a96637, #74401f);
      border: 3px solid #5c351e;
      transform: rotate(13deg);
      z-index: 3;
    }

    /* front log */
    .balloon .log-front {
      position: absolute;
      left: 18px;
      bottom: 8px;
      width: 76px;
      height: 17px;
      border-radius: 10px;
      background: linear-gradient(180deg, #b8723c, #77421f);
      border: 3px solid #5c351e;
      transform: rotate(-13deg);
      z-index: 5;
    }

    .balloon .log-end {
      position: absolute;
      left: 22px;
      bottom: 10px;
      width: 18px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid #d49a62;
      background: #8c512b;
      z-index: 6;
      transform: rotate(-13deg);
    }

    /* outer flame */
    .balloon .flame-outer {
      position: absolute;
      left: 35px;
      bottom: 24px;
      width: 43px;
      height: 64px;
      background: linear-gradient(180deg, #ffd85b 0%, #ff9b32 48%, #ed5b2c 100%);
      border-radius: 52% 48% 48% 48% / 64% 64% 36% 36%;
      transform: rotate(-3deg);
      transform-origin: 50% 100%;
      z-index: 7;
      filter: drop-shadow(0 0 7px rgba(255, 139, 32, .45));
      animation: outerFlame 1.05s ease-in-out infinite alternate;
    }

    .balloon .flame-inner {
      position: absolute;
      left: 44px;
      bottom: 25px;
      width: 25px;
      height: 43px;
      background: linear-gradient(180deg, #fff3a3, #ffd447 58%, #ff8c28);
      border-radius: 55% 45% 48% 48% / 65% 65% 35% 35%;
      transform: rotate(4deg);
      z-index: 8;
      transform-origin: 50% 100%;
      animation: innerFlame .72s ease-in-out infinite alternate;
    }

    .balloon .flame-core {
      position: absolute;
      left: 50px;
      bottom: 25px;
      width: 12px;
      height: 25px;
      background: #fff9d4;
      border-radius: 50% 50% 45% 45%;
      z-index: 9;
      animation: coreFlame .58s ease-in-out infinite alternate;
    }

    @keyframes outerFlame {
      from {
        transform: scaleY(.94) scaleX(.94) rotate(-5deg)
      }

      to {
        transform: scaleY(1.1) scaleX(1.04) rotate(5deg)
      }
    }

    @keyframes innerFlame {
      from {
        transform: scaleY(.9) rotate(5deg)
      }

      to {
        transform: scaleY(1.1) rotate(-5deg)
      }
    }

    @keyframes coreFlame {
      from {
        transform: scaleY(.8)
      }

      to {
        transform: scaleY(1.15)
      }
    }

    /* sparks */
    .balloon .spark {
      position: absolute;
      width: 5px;
      height: 9px;
      border-radius: 50%;
      background: #ffb52e;
      z-index: 10;
      animation: sparkRise 1.3s ease-out infinite;
    }

    .balloon .spark.s1 {
      left: 35px;
      bottom: 70px;
      animation-delay: -.2s
    }

    .balloon .spark.s2 {
      left: 73px;
      bottom: 67px;
      animation-delay: -.75s
    }

    .balloon .spark.s3 {
      left: 55px;
      bottom: 83px;
      animation-delay: -1s
    }

    @keyframes sparkRise {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(.5)
      }

      25% {
        opacity: 1
      }

      100% {
        opacity: 0;
        transform: translateY(-30px) scale(.2)
      }
    }

    /* option text */
    .balloon-label {
      position: absolute;
      top: 8px;
      left: 0;
      width: 100%;
      z-index: 12;
      color: #172b55 !important;
      font-size: 27px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .balloon-choice::before {
      content: attr(data-option);
      position: absolute;
      left: 10px;
      top: 9px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f2f4f7;
      color: #718096;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      z-index: 15;
    }

    /* Correct: fire grows */
    .balloon-choice.fly {
      border-color: #e7a33d;
      background: #fff9ee;
      box-shadow: 0 5px 0 #f3e0b9;
      animation: firePower .65s ease forwards;
    }

    .balloon-choice.fly .flame-outer {
      animation: bigOuterFlame .48s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 15px rgba(255, 130, 20, .7))
    }

    .balloon-choice.fly .flame-inner {
      animation: bigInnerFlame .35s ease-in-out infinite alternate
    }

    .balloon-choice.fly .flame-core {
      animation: coreFlame .3s ease-in-out infinite alternate
    }

    .balloon-choice.fly .fire-glow {
      background: rgba(255, 150, 30, .32);
      filter: blur(11px);
      transform: scale(1.25)
    }

    .balloon-choice.fly .spark {
      animation-duration: .8s
    }

    @keyframes firePower {
      0% {
        transform: scale(1)
      }

      35% {
        transform: scale(1.05)
      }

      100% {
        transform: scale(1.02)
      }
    }

    @keyframes bigOuterFlame {
      from {
        transform: scaleY(1.05) scaleX(1) rotate(-6deg);
        height: 64px
      }

      to {
        transform: scaleY(1.32) scaleX(1.15) rotate(6deg);
        height: 78px
      }
    }

    @keyframes bigInnerFlame {
      from {
        transform: scaleY(1);
        transform-origin: 50% 100%
      }

      to {
        transform: scaleY(1.3);
        transform-origin: 50% 100%
      }
    }

    /* Wrong: fire goes out */
    .balloon-choice.burst {
      animation: extinguishCard .7s ease forwards
    }

    .balloon-choice.burst .flame-outer,
    .balloon-choice.burst .flame-inner,
    .balloon-choice.burst .flame-core,
    .balloon-choice.burst .spark {
      animation: extinguishFlame .65s ease forwards
    }

    @keyframes extinguishCard {
      0% {
        transform: scale(1);
        opacity: 1
      }

      25% {
        transform: translateX(-4px)
      }

      50% {
        transform: translateX(4px)
      }

      100% {
        transform: translateY(5px);
        opacity: .35
      }
    }

    @keyframes extinguishFlame {
      0% {
        opacity: 1;
        transform: scale(1)
      }

      45% {
        opacity: .45;
        transform: scale(.65) translateY(8px)
      }

      100% {
        opacity: 0;
        transform: scale(.1) translateY(22px)
      }
    }

    .balloon-choice.burst .balloon::after {
      content: "";
      position: absolute;
      left: 48px;
      bottom: 69px;
      width: 17px;
      height: 24px;
      border-radius: 50%;
      border-left: 3px solid #aeb5bd;
      border-right: 2px solid #c2c7cc;
      opacity: .75;
      z-index: 20;
      animation: smoke .8s ease forwards;
    }

    @keyframes smoke {
      from {
        transform: translate(0, 8px) scale(.6);
        opacity: 0
      }

      30% {
        opacity: .75
      }

      to {
        transform: translate(-7px, -32px) scale(1.25);
        opacity: 0
      }
    }

    .burst-piece {
      position: fixed;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      animation: burstPiece .65s ease-out forwards;
    }

    @keyframes burstPiece {
      from {
        transform: translate(0, 0) scale(1);
        opacity: 1
      }

      to {
        transform: translate(var(--x), var(--y)) scale(.12);
        opacity: 0
      }
    }

    @media screen and (min-width:1025px) and (max-width:1440px) {
      .quiz-wrap {
        min-height: 580px
      }

      .question-stage {
        min-height: 410px
      }
    }

    @media (max-width:1024px) {
      .quiz-wrap {
        min-height: 560px
      }

      .question-stage {
        width: min(900px, 100%);
        min-height: 400px
      }

      .question-text {
        font-size: 37px
      }

      .balloon-options {
        width: min(650px, 100%);
        gap: 14px
      }
    }

    @media (max-width:768px) {
      body {
        padding: 10px 14px
      }

      .quiz-wrap {
        min-height: 520px
      }

      .quiz-heading {
        margin-bottom: 18px
      }

      .quiz-heading h1 {
        font-size: 25px
      }

      .question-stage {
        min-height: 390px;
        padding: 0 18px 24px
      }

      .stage-top {
        padding-top: 18px;
        margin-bottom: 10px
      }

      .question-number {
        min-width: 40px;
        height: 40px;
        font-size: 20px
      }

      .stage-title {
        font-size: 21px
      }

      .question-text {
        font-size: 33px;
        margin-bottom: 9px
      }

      .answer-box {
        width: 175px;
        height: 53px;
        margin: 12px 0 18px;
        font-size: 26px
      }

      .balloon-options {
        gap: 10px
      }

      .balloon-choice {
        height: 125px
      }

      .balloon-label {
        font-size: 22px
      }
    }

    @media (max-width:480px) {
      .quiz-heading h1 {
        font-size: 22px
      }

      .heading-icon {
        font-size: 22px
      }

      .question-stage {
        min-height: 365px;
        padding: 0 10px 20px
      }

      .stage-top {
        padding-top: 16px;
        gap: 8px
      }

      .question-number {
        min-width: 36px;
        height: 36px;
        border-radius: 11px;
        font-size: 18px
      }

      .stage-title {
        font-size: 18px
      }

      .question-text {
        font-size: 29px
      }

      .answer-box {
        width: 160px;
        height: 47px;
        margin-bottom: 14px;
        font-size: 23px
      }

      .balloon-options {
        gap: 7px
      }

      .balloon-choice {
        height: 108px;
        border-radius: 14px
      }

      .balloon {
        transform: scale(.74);
        transform-origin: center bottom;
        margin-bottom: -3px
      }

      .balloon-label {
        font-size: 18px
      }

      .balloon-choice::before {
        width: 20px;
        height: 20px;
        top: 6px;
        left: 5px;
        font-size: 9px
      }

      .nav {
        gap: 8px
      }

      .nav button {
        min-width: 82px;
        padding: 8px 13px;
        font-size: 12px
      }

      .progress {
        min-width: 45px;
        font-size: 12px
      }
    }

    @media (prefers-reduced-motion:reduce) {

      .balloon,
      .celebration-piece,
      .burst-piece,
      .emoji-pop,
      .final-modal,
      .heading-icon {
        animation: none !important
      }
    }

    /* ===== NAV ===== */
    .nav {
      margin: 30px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      position: relative;
      z-index: 5;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    .progress {
      min-width: 52px;
      text-align: center;
      color: #12265d;
      font-size: 14px;
      font-weight: 800;
    }

    /* ===== EMOJI / FINAL POPUP ===== */
    .celebration-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      left: 50%;
      top: 50%;
      border-radius: 3px;
      pointer-events: none;
      z-index: 9998;
      animation: celebrate 1.5s ease-out forwards;
    }

    @keyframes celebrate {
      from {
        transform: translate(-50%, -50%) scale(1) rotate(0);
        opacity: 1;
      }

      to {
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.25) rotate(540deg);
        opacity: 0;
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    /* ===== FINAL POPUP — OLD REFERENCE STYLE ===== */
    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      transition: transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: scale(.95);
    }

    /* ===== SAME RESPONSIVE BREAKPOINTS ===== */
    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        min-height: 580px;
      }

      .question-stage {
        min-height: 410px;
      }
    }

    @media (max-width: 1024px) {
      .quiz-wrap {
        min-height: 560px;
      }

      .question-stage {
        width: min(900px, 100%);
        min-height: 400px;
      }

      .question-text {
        font-size: 37px;
      }

      .balloon-options {
        gap: 24px;
      }

      .balloon-choice {
        width: 155px;
      }

      .balloon {
        width: 126px;
        height: 92px;
      }

      .balloon>.balloon-label {
        font-size: 26px;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 10px 14px;
      }

      .quiz-wrap {
        min-height: 520px;
      }

      .quiz-heading {
        margin-bottom: 18px;
      }

      .quiz-heading h1 {
        font-size: 25px;
      }

      .question-stage {
        min-height: 390px;
        padding: 0 18px 24px;
      }

      .stage-top {
        padding-top: 20px;

<body>
  <main class="quiz-wrap">

    <header class="quiz-heading">
      <h1>
        Write the Hindu Arabic numerals for the following Roman numerals.
      </h1>
    </header>

    <section id="quiz"></section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i> Prev
      </button>

      <span class="progress" id="progress">1 / 6</span>

      <button id="nextBtn" disabled>
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {
      const QUESTIONS = [
        { number: "IX", answer: "9", options: ["9", "11", "7"] },
        { number: "XVIII", answer: "18", options: ["16", "18", "20"] },
        { number: "XLI", answer: "41", options: ["41", "49", "39"] },
        { number: "XXXVI", answer: "36", options: ["34", "36", "46"] },
        { number: "XLVII", answer: "47", options: ["57", "47", "43"] },
        { number: "XXIX", answer: "29", options: ["19", "39", "29"] }
      ];

      let currentPage = 0;
      let audioCtx = null;

      QUESTIONS.forEach(q => {
        q.selected = null;
        q.solved = false;
      });

      const quiz = document.getElementById("quiz");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progress = document.getElementById("progress");

      /* ===== SOUND ===== */
      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(freq, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type;
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          osc.start();
          osc.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((f, i) => {
            setTimeout(() => beep(f, 150), i * 130);
          });
        }
      };

      /* ===== CONFETTI ===== */
      function burstConfetti(el, color) {
        const r = el.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (r.left + r.width / 2) / innerWidth,
              y: (r.top + r.height / 2) / innerHeight
            },
            colors: [
              color || "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showCorrectEmoji() {
        const colors = ["#ff6fb5", "#ffd54f", "#7ed957", "#4fc3f7", "#b388ff"];

        for (let i = 0; i < 18; i++) {
          const piece = document.createElement("span");
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 90 + Math.random() * 100;

          piece.className = "celebration-piece";
          piece.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          piece.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * .12}s`;

          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1600);
        }

        const emoji = document.createElement("div");
        emoji.className = "emoji-pop";
        emoji.textContent = "🥳";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1850);
      }

      function showWrongEmoji() {
        const emoji = document.createElement("div");
        emoji.className = "emoji-pop";
        emoji.textContent = "😔";
        emoji.style.fontSize = "70px";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);
      }

      /* ===== BALLOON POP ===== */
      function burstBalloon(button) {
        const rect = button.getBoundingClientRect();
        const colors = ["#ff8f70", "#68bdf4", "#9b83ed", "#ffd45c", "#55b449"];

        for (let i = 0; i < 13; i++) {
          const piece = document.createElement("span");
          const angle = (Math.PI * 2 * i) / 13;
          const distance = 35 + Math.random() * 70;

          piece.className = "burst-piece";
          piece.style.left = `${rect.left + rect.width / 2}px`;
          piece.style.top = `${rect.top + 35}px`;
          piece.style.background = colors[i % colors.length];
          piece.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          piece.style.setProperty("--y", `${Math.sin(angle) * distance}px`);

          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 700);
        }
      }

      /* ===== FINAL POPUP ===== */
      function showFinalPopup() {
        sound.finish();

        const overlay = document.createElement("div");
        overlay.className = "final-overlay";

        const modal = document.createElement("div");
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i> Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal, "#ffd54f"), 80);
        setTimeout(() => burstConfetti(modal, "#4ecdc4"), 350);
        setTimeout(() => burstConfetti(modal, "#ff9f45"), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          QUESTIONS.forEach(q => {
            q.selected = null;
            q.solved = false;
          });

          currentPage = 0;
          overlay.remove();
          render();
        });
      }

      function setAnswerBox(index, value, state) {
        const box = document.querySelector(`.answer-box[data-index="${index}"]`);
        if (!box) return;

        box.classList.remove("wrong", "correct");
        box.textContent = value || "";

        if (state === "wrong") {
          void box.offsetWidth;
          box.classList.add("wrong");
        }

        if (state === "correct") {
          void box.offsetWidth;
          box.classList.add("correct");
        }
      }

      function checkAnswer(index, button) {
        const q = QUESTIONS[index];
        if (q.solved) return;

        q.selected = button.dataset.value;

        if (q.selected === q.answer) {
          q.solved = true;

          button.classList.remove("wrong");
          button.classList.add("correct");

          document
            .querySelectorAll(`.mcq-option[data-index="${index}"]`)
            .forEach(btn => btn.disabled = true);

          const fire = document.querySelector(".question-stage .balloon");
          if (fire) fire.classList.add("powerful");

          sound.correct();
          burstConfetti(button, "#55b449");
          showCorrectEmoji();

          updateNav();

          if (QUESTIONS.every(item => item.solved)) {
            setTimeout(showFinalPopup, 900);
          }
        } else {
          button.classList.remove("correct");
          button.classList.add("wrong");

          sound.wrong();
          showWrongEmoji();

          const fire = document.querySelector(".question-stage .balloon");
          if (fire) fire.classList.add("extinguish");

          setTimeout(() => {
            button.classList.remove("wrong");
            if (fire) fire.classList.remove("extinguish");
            q.selected = null;
          }, 700);
        }
      }

      function render() {
        const q = QUESTIONS[currentPage];

        quiz.innerHTML = `
      <article class="question-stage">
        <div class="question-content">
          <div class="question-text">
            <span class="question-letter">${String.fromCharCode(97 + currentPage)})</span>
            <span>${q.number}</span>
          </div>

          <div class="bonfire-area">
            <div class="balloon ${q.solved ? "powerful" : ""}">
              <span class="fire-glow"></span>
              <span class="log-back"></span>
              <span class="log-front"></span>
              <span class="log-end"></span>
              <span class="flame-outer"></span>
              <span class="flame-inner"></span>
              <span class="flame-core"></span>
              <span class="spark s1"></span>
              <span class="spark s2"></span>
              <span class="spark s3"></span>
            </div>
          </div>
        </div>

        <div class="mcq-options" aria-label="Answer choices">
          ${q.options.map((option, i) => `
            <button
              class="mcq-option ${q.solved && option === q.answer ? "correct" : ""}"
              data-index="${currentPage}"
              data-value="${option}"
              ${q.solved ? "disabled" : ""}
              aria-label="Choose ${option}">
              <span class="mcq-letter">${String.fromCharCode(65 + i)}</span>
              <span class="mcq-value">${option}</span>
            </button>
          `).join("")}
        </div>
      </article>
    `;

        document.querySelectorAll(".mcq-option").forEach(button => {
          button.addEventListener("click", () => {
            checkAnswer(Number(button.dataset.index), button);
          });
        });

        updateNav();
      }

      function updateNav() {
        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = !QUESTIONS[currentPage].solved || currentPage === QUESTIONS.length - 1;
        progress.textContent = `${currentPage + 1} / ${QUESTIONS.length}`;
      }

      prevBtn.addEventListener("click", () => {
        if (currentPage > 0) {
          currentPage--;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      nextBtn.addEventListener("click", () => {
        if (!QUESTIONS[currentPage].solved) return;

        if (currentPage < QUESTIONS.length - 1) {
          currentPage++;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          showFinalPopup();
        }
      });

      document.addEventListener("keydown", e => {
        if (e.key !== "Backspace") return;

        const active = document.activeElement;
        if (active && ["INPUT", "TEXTAREA", "SELECT"].includes(active.tagName)) return;

        const q = QUESTIONS[currentPage];
        if (q.solved) return;

        if (q.selected !== null) {
          q.selected = null;
          setAnswerBox(currentPage, "", "");
          document.querySelectorAll(".balloon-choice").forEach(btn => {
            btn.classList.remove("burst", "fly");
          });
        }
      });

      render();
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>
