<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Round to the Nearest 10</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1060px;
      min-height: 610px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ===== HEADING ===== */
    .quiz-heading {
      text-align: center;
      margin-bottom: 24px;
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #12265d;
      font-size: 29px;
      line-height: 1.1;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .heading-icon {
      font-size: 27px;
      animation: wiggle 2.5s ease-in-out infinite;
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-6deg) scale(1);
      }

      50% {
        transform: rotate(6deg) scale(1.08);
      }
    }

    /* ===== TWO QUESTIONS PER PAGE — UNIQUE ROUNDING WORKSHEET ===== */
    .questions-grid {
      width: min(940px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 26px;
      align-items: stretch;
    }

    .round-question {
      min-width: 0;
      min-height: 326px;
      padding: 0 30px 27px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 0;
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 8px 0 #e9e5f7, 0 14px 30px rgba(44, 48, 80, .10);
    }

    .round-question::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 9px;
      background: #f39a3d;
    }

    .round-question:nth-child(even)::before {
      background: #68bdf4;
    }

    .round-question::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      right: -92px;
      bottom: -102px;
      background: #fff6df;
      pointer-events: none;
    }

    .round-question:nth-child(even)::after {
      left: -92px;
      right: auto;
      background: #edf8ff;
    }

    .question-line {
      width: calc(100% + 60px);
      margin-top: 9px;
      padding: 19px 18px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      position: relative;
      color: #242d40;
      font-size: 29px;
      line-height: 1;
      font-weight: 800;
      background: #fffaf1;
      border-bottom: 2px solid #f5e4c8;
    }

    .round-question:nth-child(even) .question-line {
      background: #f3f9ff;
      border-bottom-color: #d8eafa;
    }

    .question-number {
      min-width: 43px;
      height: 43px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      background: #ffb45f;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 4px 0 #df8d3e;
    }

    .round-question:nth-child(even) .question-number {
      background: #68bdf4;
      box-shadow: 0 4px 0 #3c94cd;
    }

    .number-value {
      font-size: 35px;
      font-weight: 800;
      color: #172b55;
      letter-spacing: .5px;
    }

    .answer-box {
      width: 238px;
      height: 61px;
      margin: 24px 0 21px;
      border: 3px solid #ff9b52;
      border-radius: 15px;
      background: #fff;
      color: #12265d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .answer-box:hover:not(.correct) {
      transform: translateY(-2px);
      box-shadow: 0 5px 0 #ffe0bf;
    }


    .answer-box.filled {
      border-color: #55b449;
      background: #effbe9;
      box-shadow: 0 4px 0 #cbe7c5;
      animation: slotPop .25s ease;
    }

    .answer-box.correct {
      border: 3px solid #55b449 !important;
      background: #effbe9;
      box-shadow: 0 4px 0 #cbe7c5;
    }

    .answer-box.wrong {
      border: 3px solid #ed5973 !important;
      background: #fff1f4;
      animation: shake .55s ease, wrongBlink .55s ease;
    }

    @keyframes slotPop {
      from {
        transform: scale(.92);
      }

      to {
        transform: scale(1);
      }
    }

    @keyframes wrongBlink {

      0%,
      100% {
        opacity: 1;
      }

      20%,
      60% {
        opacity: .28;
      }

      40%,
      80% {
        opacity: 1;
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-7px);
      }

      40% {
        transform: translateX(7px);
      }

      60% {
        transform: translateX(-5px);
      }

      80% {
        transform: translateX(4px);
      }
    }

    .options {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    .option {
      min-width: 145px;
      height: 68px;
      padding: 10px 30px;
      border: 3px solid #c9d4eb;
      border-radius: 17px;
      background: #fff;
      color: #12265d;
      box-shadow: 0 5px 0 #e4e9f3;
      font-size: 26px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .14s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }

    .option:first-child {
      border-color: #ffd27a;
      background: #fffaf0;
      box-shadow: 0 5px 0 #f2dfb4;
    }

    .option:last-child {
      border-color: #a9dffb;
      background: #f4fbff;
      box-shadow: 0 5px 0 #d5edf9;
    }

    .option:hover:not(:disabled) {
      transform: translateY(-3px);
    }

    .option:active:not(:disabled) {
      transform: translateY(2px);
    }

    .option.selected {
      border-color: #ffb347;
      background: #fff6dc;
    }

    .option.wrong {
      border-color: #ed5973;
      background: #fff1f4;
      animation: shake .55s ease;
    }

    .option:disabled {
      cursor: default;
      opacity: .4;
      filter: none;
    }

    /* ===== NAVIGATION ===== */
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 38px;
      padding-top: 15px;
      border-top: 2px solid #e8e3de;
    }

    .nav button {
      min-width: 120px;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      color: #fff;
      background: linear-gradient(180deg, #42d466, #0bb852);
      box-shadow: 0 6px 0 #079443;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .2s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #079443;
    }

    .nav button:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .progress {
      min-width: 58px;
      text-align: center;
      color: #12265d;
      font-size: 17px;
      font-weight: 800;
    }

    /* ===== OLD-STYLE EMOJI / CONFETTI ===== */
    .celebration-piece {
      position: fixed;
      left: 50%;
      top: 42%;
      width: 10px;
      height: 18px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9998;
      animation: confettiBurst 1.4s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    @keyframes confettiBurst {
      from {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0) scale(.7);
      }

      to {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(520deg) scale(1);
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 42%;
      font-size: 80px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      animation: emojiPop 1.8s cubic-bezier(.2, .8, .2, 1) forwards;
      filter: drop-shadow(0 10px 14px rgba(45, 50, 80, .18));
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      }

      28% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18) rotate(8deg);
      }

      68% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(1) rotate(-4deg);
      }

      to {
        opacity: 0;
        transform: translate(-50%, -68%) scale(.9) rotate(0);
      }
    }

    /* ===== FINAL POPUP ===== */
    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      transition: transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: scale(.95);
    }

    /* ===== LAPTOP ===== */
    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        max-width: 1050px;
        min-height: 590px;
      }

      .quiz-heading h1 {
        font-size: 29px;
      }

      .number-value {
        font-size: 29px;
      }

      .answer-box {
        width: 195px;
      }
    }

    /* ===== TABLET ===== */
    @media (max-width: 1024px) {
      body {
        padding: 18px 14px;
        align-items: center;
      }

      .quiz-wrap {
        min-height: auto;
      }

      .quiz-heading h1 {
        font-size: 27px;
      }

      .questions-grid {
        gap: 24px;
      }

      .round-question {
        min-height: 315px;
        padding: 0 22px 24px;
      }

      .question-line {
        width: calc(100% + 44px);
      }

      .answer-box {
        width: 205px;
      }

      .option {
        min-width: 125px;
        height: 64px;
        font-size: 27px;
      }

      .question-line {
        font-size: 27px;
      }

      .number-value {
        font-size: 30px;
      }

      .answer-box {
        width: 200px;
        margin-left: 0;
      }

      .options {
        margin-left: 0;
        gap: 18px;
      }

      .option {
        min-width: 100px;
      }
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      body {
        align-items: flex-start;
        padding: 20px 10px 14px;
      }

      .quiz-heading {
        margin-bottom: 18px;
      }

      .quiz-heading h1 {
        font-size: 24px;
        gap: 7px;
      }

      .heading-icon {
        font-size: 22px;
      }

      .questions-grid {
        grid-template-columns: 1fr;
        gap: 22px;
        width: min(430px, 100%);
      }

      .round-question {
        min-height: 285px;
        padding: 0 17px 23px;
        text-align: center;
      }

      .question-line {
        width: calc(100% + 34px);
      }

      .question-line {
        font-size: 24px;
        margin-bottom: 18px;
      }

      .question-number {
        min-width: 34px;
        font-size: 21px;
      }

      .number-value {
        font-size: 28px;
      }

      .answer-box {
        width: 190px;
        height: 52px;
        margin-left: 0;
        margin-bottom: 17px;
      }

      .options {
        margin-left: 0;
        gap: 14px;
      }

      .option {
        min-width: 105px;
        height: 54px;
        padding: 7px 18px;
        font-size: 23px;
      }

      .nav {
        margin-top: 25px;
        gap: 12px;
        padding-top: 12px;
      }

      .nav button {
        min-width: 100px;
        padding: 10px 18px;
        font-size: 14px;
      }

      .progress {
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 7px 10px;
      }

      .quiz-heading h1 {
        font-size: 21px;
        flex-wrap: wrap;
      }

      .heading-icon {
        font-size: 19px;
      }

      .question-line {
        font-size: 21px;
      }

      .number-value {
        font-size: 25px;
      }

      .round-question {
        min-height: 265px;
        padding: 0 11px 20px;
      }

      .question-line {
        width: calc(100% + 22px);
      }

      .answer-box {
        width: 170px;
        height: 47px;
        margin-left: 0;
        margin-bottom: 15px;
      }

      .options {
        margin-left: 0;
        gap: 11px;
      }

      .option {
        min-width: 92px;
        height: 50px;
        font-size: 21px;
        padding: 5px 12px;
      }

      .nav {
        gap: 8px;
      }

      .nav button {
        min-width: 82px;
        padding: 8px 13px;
        font-size: 12px;
      }

      .progress {
        min-width: 45px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .celebration-piece,
      .emoji-pop,
      .final-modal,
      .heading-icon {
        animation: none !important;
      }

      .celebration-piece {
        display: none !important;
      }
    }
  </style>

<body>
  <main class="quiz-wrap">

    <header class="quiz-heading">
      <h1>
        <span class="heading-icon">🎯</span>
        Round off the following numbers to the nearest 10.
      </h1>
    </header>

    <section id="quiz"></section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i> Prev
      </button>

      <span class="progress" id="progress">1 / 3</span>

      <button id="nextBtn" disabled>
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {
      const QUESTIONS = [
        { number: 15, answer: 20, options: [10, 20] },
        { number: 37, answer: 40, options: [30, 40] },
        { number: 678, answer: 680, options: [670, 680] },
        { number: 543, answer: 540, options: [540, 550] },
        { number: 1024, answer: 1020, options: [1020, 1030] },
        { number: 4631, answer: 4630, options: [4620, 4630] }
      ];

      let currentPage = 0;
      let audioCtx = null;

      // Two questions per page.
      const PAGES = [
        [0, 1],
        [2, 3],
        [4, 5]
      ];

      const quiz = document.getElementById("quiz");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progress = document.getElementById("progress");

      QUESTIONS.forEach(q => {
        q.selected = null;
        q.solved = false;
      });

      /* ===== SOUND ===== */
      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
      }

      function beep(freq, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type;
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          osc.start();
          osc.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((f, i) => {
            setTimeout(() => beep(f, 150), i * 130);
          });
        }
      };

      /* ===== CONFETTI ===== */
      function burstConfetti(el, color) {
        const r = el.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (r.left + r.width / 2) / innerWidth,
              y: (r.top + r.height / 2) / innerHeight
            },
            colors: [
              color || "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showCorrectEmoji() {
        const colors = ["#ff6fb5", "#ffd54f", "#7ed957", "#4fc3f7", "#b388ff"];

        for (let i = 0; i < 18; i++) {
          const piece = document.createElement("span");
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 90 + Math.random() * 100;

          piece.className = "celebration-piece";
          piece.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          piece.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * .12}s`;

          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1600);
        }

        const emoji = document.createElement("div");
        emoji.className = "emoji-pop";
        emoji.textContent = "🥳";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1850);
      }

      function showWrongEmoji() {
        const emoji = document.createElement("div");
        emoji.className = "emoji-pop";
        emoji.textContent = "😔";
        emoji.style.fontSize = "70px";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);
      }

      /* ===== FINAL POPUP ===== */
      function showFinalPopup() {
        sound.finish();

        const overlay = document.createElement("div");
        overlay.className = "final-overlay";

        const modal = document.createElement("div");
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i> Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal, "#ffd54f"), 80);
        setTimeout(() => burstConfetti(modal, "#4ecdc4"), 350);
        setTimeout(() => burstConfetti(modal, "#ff9f45"), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          QUESTIONS.forEach(q => {
            q.selected = null;
            q.solved = false;
          });

          currentPage = 0;
          overlay.remove();
          render();
        });
      }

      function checkAnswer(index, button) {
        const q = QUESTIONS[index];

        if (q.solved) return;

        q.selected = Number(button.dataset.value);

        document
          .querySelectorAll(`.option[data-index="${index}"]`)
          .forEach(btn => btn.classList.remove("selected", "wrong", "correct"));

        button.classList.add("selected");

        if (q.selected === q.answer) {
          q.solved = true;
          button.classList.remove("selected", "correct", "wrong");

          const box = document.querySelector(`.answer-box[data-index="${index}"]`);
          box.classList.remove("wrong", "filled");
          box.textContent = q.answer;
          void box.offsetWidth;
          box.classList.add("filled", "correct");

          sound.correct();
          burstConfetti(button, "#55b449");
          showCorrectEmoji();

          document
            .querySelectorAll(`.option[data-index="${index}"]`)
            .forEach(btn => btn.disabled = true);

          updateNav();

          if (QUESTIONS.every(item => item.solved)) {
            setTimeout(showFinalPopup, 900);
          }
        } else {
          button.classList.remove("selected");
          button.classList.add("wrong");

          const box = document.querySelector(`.answer-box[data-index="${index}"]`);
          box.classList.remove("filled", "correct", "wrong");
          box.textContent = q.selected;
          void box.offsetWidth;
          box.classList.add("wrong");

          sound.wrong();
          showWrongEmoji();

          setTimeout(() => {
            button.classList.remove("wrong");
            box.classList.remove("wrong");
            box.textContent = "";
            q.selected = null;
          }, 650);
        }
      }

      function render() {
        const indexes = PAGES[currentPage];

        quiz.innerHTML = `
      <div class="questions-grid">
        ${indexes.map(index => {
          const q = QUESTIONS[index];

          return `
            <article class="round-question">
              <div class="question-line">
                <span class="question-number">${index + 1})</span>
                <span class="number-value">${q.number}</span>
              </div>

              <div class="answer-box ${q.solved ? "filled correct" : ""}"
                   data-index="${index}"
                   title="Click to remove">
                ${q.solved ? q.answer : ""}
              </div>

              <div class="options">
                ${q.options.map(option => `
                  <button
                    class="option"
                    data-index="${index}"
                    data-value="${option}"
                    ${q.solved ? "disabled" : ""}>
                    ${option}
                  </button>
                `).join("")}
              </div>
            </article>
          `;
        }).join("")}
      </div>
    `;

        document.querySelectorAll(".option").forEach(button => {
          button.addEventListener("click", () => {
            checkAnswer(
              Number(button.dataset.index),
              button
            );
          });
        });

        document.querySelectorAll(".answer-box").forEach(box => {
          box.addEventListener("click", () => {
            const index = Number(box.dataset.index);
            const q = QUESTIONS[index];

            if (!q.solved && q.selected !== null) {
              q.selected = null;
              box.textContent = "";

              document
                .querySelectorAll(`.option[data-index="${index}"]`)
                .forEach(btn => {
                  btn.classList.remove("selected", "wrong");
                });
            }
          });
        });

        updateNav();
      }

      function updateNav() {
        const indexes = PAGES[currentPage];
        const pageSolved = indexes.every(index => QUESTIONS[index].solved);

        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = !pageSolved || currentPage === PAGES.length - 1;
        progress.textContent = `${currentPage + 1} / ${PAGES.length}`;
      }

      prevBtn.addEventListener("click", () => {
        if (currentPage > 0) {
          currentPage--;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      nextBtn.addEventListener("click", () => {
        const indexes = PAGES[currentPage];

        if (
          indexes.every(index => QUESTIONS[index].solved) &&
          currentPage < PAGES.length - 1
        ) {
          currentPage++;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      /* Backspace clears the last selected answer on the current page. */
      document.addEventListener("keydown", e => {
        if (e.key !== "Backspace") return;

        const active = document.activeElement;
        if (active && ["INPUT", "TEXTAREA", "SELECT"].includes(active.tagName)) return;

        const indexes = PAGES[currentPage];

        for (let i = indexes.length - 1; i >= 0; i--) {
          const q = QUESTIONS[indexes[i]];

          if (!q.solved && q.selected !== null) {
            q.selected = null;

            const box = document.querySelector(
              `.answer-box[data-index="${indexes[i]}"]`
            );
            if (box) box.textContent = "";

            document
              .querySelectorAll(`.option[data-index="${indexes[i]}"]`)
              .forEach(btn => btn.classList.remove("selected", "wrong"));

            e.preventDefault();
            break;
          }
        }
      });

      render();
    })();
  </script>
<script src="../../shared/quiz-ui.js"></script>
