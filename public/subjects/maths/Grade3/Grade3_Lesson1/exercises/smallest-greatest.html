<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smallest and Greatest Numbers Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #12265d;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1080px;
      min-height: 610px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ===== HEADING ===== */
    .quiz-heading {
      text-align: center;
      margin-bottom: 18px;
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: #12265d;
      font-size: 34px;
      line-height: 1.08;
      font-weight: 800;
    }

    .heading-icon {
      font-size: 30px;
      animation: wiggle 2.5s ease-in-out infinite;
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-6deg) scale(1);
      }

      50% {
        transform: rotate(6deg) scale(1.08);
      }
    }

    /* ===== QUESTION AREA ===== */
    .question {
      width: 100%;
      max-width: 980px;
      margin: 0 auto 20px;
    }

    .question-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 25px;
    }

    .question-letter {
      width: 55px;
      height: 55px;
      flex: 0 0 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      color: #fff;
      background: linear-gradient(145deg, #ff5d94, #e83f79);
      box-shadow: 0 6px 0 #c92f63;
      font-size: 25px;
      font-weight: 800;
    }

    .digits-line {
      font-size: 30px;
      font-weight: 400;
      color: #12265d;
    }

    .digits-line span {
      color: #626981;
      font-weight: 400;
    }

    /* ===== TWO ANSWER COLUMNS ===== */
    .answer-columns {
      width: min(820px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .answer-panel {
      padding: 17px 18px 19px;
      border-radius: 22px;
      background: #fafcff;
      border: 2px solid #e1e7f4;
    }

    .answer-panel.smallest {
      border-color: #8bd9ff;
      background: #f5fcff;
    }

    .answer-panel.greatest {
      border-color: #bca9ff;
      background: #faf8ff;
    }

    .answer-title {
      text-align: center;
      margin-bottom: 14px;
      font-size: 23px;
      font-weight: 800;
    }

    .smallest .answer-title {
      color: #2a8bb8;
    }

    .greatest .answer-title {
      color: #755dd5;
    }

    .input-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .digit-slot {
      width: 100%;
      height: 62px;
      border-radius: 14px;
      border: 3px dashed #b8c5dd;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #12265d;
      font-size: 33px;
      font-weight: 800;
      transition: .18s ease;
    }

    .digit-slot.over {
      border-style: solid;
      border-color: #ffb347;
      background: #fffaf0;
      transform: scale(1.04);
    }

    .digit-slot.filled {
      border-style: solid;
      border-color: #55b449;
      background: #effbe9;
      box-shadow: 0 4px 0 #cbe7c5;
      animation: slotPop .25s ease;
    }

    @keyframes slotPop {
      from {
        transform: scale(.88);
      }

      to {
        transform: scale(1);
      }
    }

    .digit-slot.wrong {
      border-color: #ed5973;
      background: #fff1f4;
      animation: shake .55s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-7px);
      }

      40% {
        transform: translateX(7px);
      }

      60% {
        transform: translateX(-5px);
      }

      80% {
        transform: translateX(4px);
      }
    }

    /* ===== DRAG DIGITS ===== */
    .drag-area {
      margin-top: 19px;
      text-align: center;
    }

    .drag-label {
      margin-bottom: 10px;
      color: #626981;
      font-size: 17px;
      font-weight: 700;
    }

    .digit-bank {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .digit-tile {
      width: 56px;
      height: 56px;
      border: 3px solid #ffc44d;
      border-radius: 16px;
      background: linear-gradient(145deg, #fff5bf, #ffe08a);
      color: #5b4300;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      cursor: grab;
      user-select: none;
      touch-action: none;
      box-shadow: 0 5px 0 #e7bd45;
      transition: transform .15s ease, opacity .18s ease;
    }

    .digit-tile:hover {
      transform: translateY(-3px);
    }

    .digit-tile:active {
      cursor: grabbing;
    }

    .digit-tile.hidden-source {
      visibility: hidden;
    }

    .drag-ghost {
      position: fixed;
      left: 0;
      top: 0;
      width: 56px;
      height: 56px;
      z-index: 20000;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #ffc44d;
      border-radius: 16px;
      background: linear-gradient(145deg, #fff5bf, #ffe08a);
      color: #5b4300;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 6px 0 #e7bd45;
    }

    /* ===== NAVIGATION ===== */
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 35px;
      padding-top: 15px;
      border-top: 2px solid #e8e3de;
    }

    .nav button {
      min-width: 120px;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      color: #fff;
      background: linear-gradient(180deg, #42d466, #0bb852);
      box-shadow: 0 6px 0 #079443;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .2s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #079443;
    }

    .nav button:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .progress {
      min-width: 58px;
      text-align: center;
      color: #12265d;
      font-size: 17px;
      font-weight: 800;
    }

    /* ===== OLD-STYLE CONFETTI / EMOJI ===== */
    .celebration-piece {
      position: fixed;
      left: 50%;
      top: 42%;
      width: 10px;
      height: 18px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9998;
      animation: confettiBurst 1.4s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    @keyframes confettiBurst {
      from {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0) scale(.7);
      }

      to {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(520deg) scale(1);
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 42%;
      font-size: 80px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      animation: emojiPop 1.8s cubic-bezier(.2, .8, .2, 1) forwards;
      filter: drop-shadow(0 10px 14px rgba(45, 50, 80, .18));
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      }

      28% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18) rotate(8deg);
      }

      68% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(1) rotate(-4deg);
      }

      to {
        opacity: 0;
        transform: translate(-50%, -68%) scale(.9) rotate(0);
      }
    }

    /* ===== FINAL POPUP ===== */
    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      pointer-events: auto;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      transition: transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: scale(.95);
    }

    /* ===== LAPTOP ===== */
    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        max-width: 1050px;
        min-height: 590px;
      }

      .quiz-heading h1 {
        font-size: 28px;
      }

      .question {
        padding-top: 18px;
        padding-bottom: 20px;
      }

      .digit-slot {
        height: 58px;
      }

      .digit-tile {
        width: 54px;
        height: 54px;
      }

      .digits-line {
        font-size: 30px;
      }
    }

     @media screen and (min-width: 1440px) {
      .digits-line {
        font-size: 40px;
      }
     }

    @media (max-width: 1024px) {
      body {
        padding: 18px 14px;
        align-items: center;
      }

      .quiz-wrap {
        min-height: auto;
      }

      .quiz-heading h1 {
        font-size: 31px;
      }

      .question {
        padding: 20px;
      }

      .digits-line {
        font-size: 30px;
      }
    }

    @media (max-width: 768px) {
      body {
        align-items: flex-start;
        padding: 22px 10px 14px;
      }

      .quiz-heading {
        margin-bottom: 14px;
      }

      .quiz-heading h1 {
        font-size: 27px;
        gap: 8px;
      }

      .heading-icon {
        font-size: 25px;
      }

      .question {
        padding: 17px 13px 19px;
        border-radius: 21px;
      }

      .question-head {
        gap: 10px;
        margin-bottom: 15px;
      }

      .question-letter {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
        border-radius: 14px;
        font-size: 21px;
      }

      .digits-line {
        font-size: 30px;
      }

      .answer-columns {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .answer-panel {
        padding: 0;
      }

      .answer-title {
        font-size: 20px;
        margin-bottom: 11px;
      }

      .digit-slot {
        width: 57px;
        height: 57px;
        font-size: 29px;
      }

      .input-row {
        grid-template-columns: repeat(4, 57px);
      }

      .digit-bank {
        gap: 9px;
      }

      .digit-tile {
        width: 52px;
        height: 52px;
        font-size: 27px;
      }

      .nav {
        margin-top: 18px;
        gap: 12px;
        padding-top: 12px;
      }

      .nav button {
        min-width: 100px;
        padding: 10px 18px;
        font-size: 14px;
      }

      .progress {
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 6px 10px;
      }

      .quiz-heading h1 {
        font-size: 22px;
        flex-wrap: wrap;
      }

      .heading-icon {
        font-size: 21px;
      }

      .question {
        padding: 14px 9px 16px;
      }

      .digits-line {
        font-size: 17px;
      }

      .digit-slot {
        height: 50px;
        font-size: 25px;
      }

      .digit-tile {
        width: 46px;
        height: 46px;
        font-size: 24px;
      }

      .nav {
        gap: 8px;
      }

      .nav button {
        min-width: 82px;
        padding: 8px 13px;
        font-size: 12px;
      }

      .progress {
        min-width: 45px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .celebration-piece,
      .emoji-pop,
      .final-modal,
      .heading-icon,
      .digit-slot.filled {
        animation: none !important;
      }

      .celebration-piece {
        display: none !important;
      }
    }

<body>
  <main class="quiz-wrap">

    <header class="quiz-heading">
      <h1>
        <span class="heading-icon">🎯</span>
        Form the smallest and the greatest numbers by using the given digits.
      </h1>
    </header>

    <section id="quiz"></section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i> Prev
      </button>

      <span class="progress" id="progress">1 / 3</span>

      <button id="nextBtn" disabled>
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {
      const QUESTIONS = [
        { letter: "a", digits: ["3", "9", "7", "1"], smallest: "1379", greatest: "9731" },
        { letter: "b", digits: ["6", "4", "2", "5"], smallest: "2456", greatest: "6542" },
        { letter: "c", digits: ["2", "0", "8", "7"], smallest: "2078", greatest: "8720" }
      ];

      QUESTIONS.forEach(q => {
        q.smallestValue = [];
        q.greatestValue = [];
        q.smallestSolved = false;
        q.greatestSolved = false;
      });

      let current = 0;
      let audioCtx = null;
      let dragging = null;
      let ghost = null;

      const quiz = document.getElementById("quiz");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progress = document.getElementById("progress");

      /* ===== SOUND ===== */
      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
      }

      function beep(freq, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type;
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          osc.start();
          osc.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((f, i) => {
            setTimeout(() => beep(f, 150), i * 130);
          });
        }
      };

      /* ===== CONFETTI ===== */
      function burstConfetti(el, color) {
        const r = el.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (r.left + r.width / 2) / innerWidth,
              y: (r.top + r.height / 2) / innerHeight
            },
            colors: [
              color || "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showCorrectEmoji() {
        const colors = ["#ff6fb5", "#ffd54f", "#7ed957", "#4fc3f7", "#b388ff"];

        for (let i = 0; i < 18; i++) {
          const piece = document.createElement("span");
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 90 + Math.random() * 100;

          piece.className = "celebration-piece";
          piece.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          piece.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * .12}s`;

          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1600);
        }

        const emoji = document.createElement("div");
        emoji.className = "emoji-pop";
        emoji.textContent = "🥳";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1850);
      }

      function showWrongEmoji() {
        const emoji = document.createElement("div");
        emoji.className = "emoji-pop";
        emoji.textContent = "😔";
        emoji.style.fontSize = "70px";
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);
      }

      /* ===== FINAL POPUP ===== */
      function showFinalPopup() {
        sound.finish();

        const overlay = document.createElement("div");
        overlay.className = "final-overlay";

        const modal = document.createElement("div");
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i> Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal, "#ffd54f"), 80);
        setTimeout(() => burstConfetti(modal, "#4ecdc4"), 350);
        setTimeout(() => burstConfetti(modal, "#ff9f45"), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          QUESTIONS.forEach(q => {
            q.smallestValue = [];
            q.greatestValue = [];
            q.smallestSolved = false;
            q.greatestSolved = false;
          });

          current = 0;
          overlay.remove();
          render();
        });
      }

      function makeGhost(value) {
        ghost = document.createElement("div");
        ghost.className = "drag-ghost";
        ghost.textContent = value;
        document.body.appendChild(ghost);
      }

      function moveGhost(e) {
        if (!ghost) return;
        ghost.style.left = `${e.clientX}px`;
        ghost.style.top = `${e.clientY}px`;
      }

      function finishDrag(e) {
        if (!dragging) return;

        const tile = dragging.tile;
        const value = dragging.value;

        document.removeEventListener("pointermove", moveGhost);
        document.removeEventListener("pointerup", finishDrag);

        const target = document.elementFromPoint(e.clientX, e.clientY);
        const slot = target?.closest(".digit-slot");

        if (ghost) {
          ghost.remove();
          ghost = null;
        }

        tile.classList.remove("hidden-source");

        if (slot) {
          placeDigit(value, slot);
        }

        dragging = null;
      }

      function setupTile(tile) {
        tile.addEventListener("pointerdown", e => {
          e.preventDefault();

          const q = QUESTIONS[current];

          if (q.smallestSolved && q.greatestSolved) return;

          dragging = {
            tile,
            value: tile.dataset.value
          };

          tile.classList.add("hidden-source");
          makeGhost(tile.dataset.value);

          ghost.style.left = `${e.clientX}px`;
          ghost.style.top = `${e.clientY}px`;

          document.addEventListener("pointermove", moveGhost);
          document.addEventListener("pointerup", finishDrag);
        });
      }

      function removeDigit(slot) {
        const q = QUESTIONS[current];

        if (slot.classList.contains("locked")) return;

        const side = slot.dataset.side;
        const index = Number(slot.dataset.index);
        const targetArray = side === "smallest" ? q.smallestValue : q.greatestValue;

        if (!targetArray[index]) return;

        /* Remove this digit and shift only this answer row's later digits left. */
        targetArray.splice(index, 1);
        while (targetArray.length < 4) targetArray.push("");

        const slots = [...document.querySelectorAll(`.digit-slot[data-side="${side}"]`)];
        slots.forEach((s, i) => {
          s.textContent = targetArray[i] || "";
          s.classList.toggle("filled", Boolean(targetArray[i]));
          s.classList.remove("wrong");
        });
      }

      function removeLastDigit(side) {
        const q = QUESTIONS[current];
        const targetArray = side === "smallest" ? q.smallestValue : q.greatestValue;

        if (side === "smallest" && q.smallestSolved) return;
        if (side === "greatest" && q.greatestSolved) return;

        let index = -1;
        for (let i = 3; i >= 0; i--) {
          if (targetArray[i]) {
            index = i;
            break;
          }
        }

        if (index < 0) return;

        targetArray[index] = "";

        const slots = [...document.querySelectorAll(`.digit-slot[data-side="${side}"]`)];
        slots.forEach((s, i) => {
          s.textContent = targetArray[i] || "";
          s.classList.toggle("filled", Boolean(targetArray[i]));
          s.classList.remove("wrong");
        });
      }

      function placeDigit(value, slot) {
        const q = QUESTIONS[current];
        const side = slot.dataset.side;
        const index = Number(slot.dataset.index);
        const targetArray = side === "smallest" ? q.smallestValue : q.greatestValue;

        if (slot.classList.contains("filled") || slot.classList.contains("locked")) {
          return;
        }

        /* A digit can only be used once in each number. */
        if (targetArray.includes(value)) {
          wrongSlot(slot);
          return;
        }

        targetArray[index] = value;

        slot.textContent = value;
        slot.classList.add("filled");

        if (targetArray.filter(Boolean).length === 4) {
          checkNumber(side);
        }
      }

      function checkNumber(side) {
        const q = QUESTIONS[current];
        const value = (side === "smallest" ? q.smallestValue : q.greatestValue).join("");
        const answer = side === "smallest" ? q.smallest : q.greatest;

        if (value === answer) {
          if (side === "smallest") {
            q.smallestSolved = true;
          } else {
            q.greatestSolved = true;
          }

          document
            .querySelectorAll(`.digit-slot[data-side="${side}"]`)
            .forEach(slot => slot.classList.add("locked"));

          document
            .querySelector(`.answer-panel.${side}`)
            ?.classList.add("locked");

          sound.correct();

          const panel = document.querySelector(`.answer-panel.${side}`);
          burstConfetti(panel, side === "smallest" ? "#4e8ff0" : "#ff4e83");
          showCorrectEmoji();

          setTimeout(() => {
            if (q.smallestSolved && q.greatestSolved) {
              if (current === QUESTIONS.length - 1) {
                showFinalPopup();
              } else {
                updateNav();
              }
            }
          }, 850);
        } else {
          wrongNumber(side);
        }
      }

      function wrongNumber(side) {
        sound.wrong();
        showWrongEmoji();

        const slots = document.querySelectorAll(`.digit-slot[data-side="${side}"]`);

        slots.forEach(slot => {
          if (slot.classList.contains("filled")) {
            slot.classList.remove("wrong");
            void slot.offsetWidth;
            slot.classList.add("wrong");
          }
        });

        setTimeout(() => {
          const q = QUESTIONS[current];

          if (side === "smallest") {
            q.smallestValue = [];
            q.smallestSolved = false;
          } else {
            q.greatestValue = [];
            q.greatestSolved = false;
          }

          slots.forEach(slot => {
            slot.textContent = "";
            slot.classList.remove("filled", "wrong");
          });
        }, 600);
      }

      function wrongSlot(slot) {
        sound.wrong();
        showWrongEmoji();

        slot.classList.remove("wrong");
        void slot.offsetWidth;
        slot.classList.add("wrong");

        setTimeout(() => slot.classList.remove("wrong"), 600);
      }

      function render() {
        const q = QUESTIONS[current];

        quiz.innerHTML = `
      <div class="question">
        <div class="question-head">
          <div class="question-letter">${q.letter})</div>
          <div class="digits-line">
            <span>Digits - </span>${q.digits.join(", ")}
          </div>
        </div>

        <div class="answer-columns">

          <div class="answer-panel smallest ${q.smallestSolved ? "locked" : ""}">
            <div class="answer-title">Smallest number</div>
            <div class="input-row">
              ${[0, 1, 2, 3].map(i => `
                <div class="digit-slot ${q.smallestValue[i] ? "filled" : ""} ${q.smallestSolved ? "locked" : ""}"
                     data-side="smallest"
                     data-index="${i}"
                     tabindex="0">
                  ${q.smallestValue[i] || ""}
                </div>
              `).join("")}
            </div>
          </div>

          <div class="answer-panel greatest ${q.greatestSolved ? "locked" : ""}">
            <div class="answer-title">Greatest number</div>
            <div class="input-row">
              ${[0, 1, 2, 3].map(i => `
                <div class="digit-slot ${q.greatestValue[i] ? "filled" : ""} ${q.greatestSolved ? "locked" : ""}"
                     data-side="greatest"
                     data-index="${i}"
                     tabindex="0">
                  ${q.greatestValue[i] || ""}
                </div>
              `).join("")}
            </div>
          </div>

        </div>
      </div>

      <div class="drag-area">
        <div class="drag-label">Drag the digits into the boxes</div>

        <div class="digit-bank">
          ${q.digits.map(value => `
            <div class="digit-tile"
                 data-value="${value}"
                 role="button"
                 tabindex="0"
                 aria-label="Drag digit ${value}">
              ${value}
            </div>
          `).join("")}
        </div>
      </div>
    `;

        document.querySelectorAll(".digit-tile").forEach(setupTile);

        document.querySelectorAll(".digit-slot").forEach(slot => {
          slot.addEventListener("click", () => removeDigit(slot));
        });

        updateNav();
      }

      function updateNav() {
        const q = QUESTIONS[current];

        prevBtn.disabled = current === 0;
        nextBtn.disabled = !(q.smallestSolved && q.greatestSolved && current < QUESTIONS.length - 1);
        progress.textContent = `${current + 1} / ${QUESTIONS.length}`;
      }

      document.addEventListener("keydown", e => {
        if (e.key !== "Backspace") return;

        const active = document.activeElement;
        if (active && ["INPUT", "TEXTAREA", "SELECT"].includes(active.tagName)) return;

        const q = QUESTIONS[current];

        /* If the last clicked/focused slot is known, remove from that side.
           Otherwise remove the last digit from the rightmost unfinished side. */
        const focusedSlot = active?.closest?.(".digit-slot");

        if (focusedSlot) {
          removeDigit(focusedSlot);
          e.preventDefault();
          return;
        }

        if (!q.greatestSolved && q.greatestValue.some(Boolean)) {
          removeLastDigit("greatest");
          e.preventDefault();
        } else if (!q.smallestSolved && q.smallestValue.some(Boolean)) {
          removeLastDigit("smallest");
          e.preventDefault();
        }
      });

      prevBtn.addEventListener("click", () => {
        if (current > 0) {
          current--;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      nextBtn.addEventListener("click", () => {
        const q = QUESTIONS[current];

        if (q.smallestSolved && q.greatestSolved && current < QUESTIONS.length - 1) {
          current++;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      render();
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
