<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standard Form Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #12265d;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1050px;
    }

    /* ===== HEADING ===== */
    .quiz-heading {
      text-align: center;
      margin-bottom: 38px;
    }

    .quiz-heading h1 {
      display: inline-block;
      color: #12265d;
      font-size: 42px;
      line-height: 1.15;
      font-weight: 800;
    }

    .quiz-heading h1 .purple {
      color: #6635dc;
    }

    /* ===== QUESTION ===== */
    .question {
      width: 70%;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 18px 34px;
      margin-bottom: 42px;
      border: 2px dashed #c5a8f5;
      border-radius: 26px;
      background: #fbf9ff;
      box-shadow: 0 8px 0 #eee8ff;
      margin-inline: auto;
    }

    .question-letter {
      width: 70px;
      height: 70px;
      flex: 0 0 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #7137e4;
      color: #fff;
      font-size: 31px;
      font-weight: 800;
    }

    .question-text {
      font-size: 30px;
      line-height: 1.35;
      color: #12265d;
      font-weight: 700;
    }

    /* ===== ANSWER AREA ===== */
    .answer-label {
      text-align: center;
      margin-bottom: 13px;
      color: #777b91;
      font-size: 19px;
      font-weight: 700;
    }

    .answer-label span {
      color: #6635dc;
      font-weight: 800;
    }

    .answer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .equals {
      color: #12265d;
      font-size: 38px;
      font-weight: 800;
    }

    .answer-input {
      width: 500px;
      height: 86px;
      padding: 0 25px;
      border: 3px solid #f0b516;
      border-radius: 22px;
      outline: none;
      background: #fffdf6;
      color: #12265d;
      font-size: 32px;
      font-weight: 400;
      text-align: center;
      box-shadow: 0 7px 0 #f8e5ad;
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .answer-input::placeholder {
      color: #a1a2ae;
      font-size: 24px;
      font-weight: 400;
    }

    .answer-input:focus {
      border-color: #6635dc;
      box-shadow: 0 7px 0 #ded0fb, 0 0 0 4px rgba(102, 53, 220, .08);
    }

    .answer-input.correct {
      border-color: #54ad48;
      background: #f0faec;
      box-shadow: 0 7px 0 #c6e5be;
      color: #398e31;
    }

    .answer-input.wrong {
      border-color: #ed5973;
      background: #fff1f4;
      box-shadow: 0 7px 0 #f4c3cf;
      animation: inputWrong .55s ease;
    }

    @keyframes inputWrong {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-7px);
      }

      40% {
        transform: translateX(7px);
      }

      60% {
        transform: translateX(-5px);
      }

      80% {
        transform: translateX(4px);
      }
    }

    /* ===== CHECK ===== */
    .checkBtn-box {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .check-btn {
      display: block;
      margin: 36px auto 0 !important;
      min-width: 190px;
      border: 0;
      border-radius: 999px;
      padding: 14px 36px;
      background: linear-gradient(180deg, #467ff0, #2556d6);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 7px 0 #1944ae, 0 12px 20px -12px rgba(37, 86, 214, .45);
      transition: transform .15s ease, filter .15s ease;
    }

    .check-btn:hover:not(:disabled) {
      filter: brightness(1.05);
      transform: translateY(-2px);
    }

    .check-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 4px 0 #1944ae;
    }

    .check-btn:disabled {
      opacity: .48;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ===== NAV (reference style) ===== */
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 52px;
      padding-top: 18px;
      border-top: 2px solid #e8e3de;
    }

    .nav button {
      min-width: 120px;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      color: #fff;
      background: linear-gradient(180deg, #42d466, #0bb852);
      box-shadow: 0 6px 0 #079443;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .2s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #079443;
    }

    .nav button:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .progress {
      min-width: 58px;
      text-align: center;
      color: #12265d;
      font-size: 17px;
      font-weight: 800;
    }

    /* ===== CELEBRATION PIECES (reference) ===== */
    .celebration-piece {
      position: fixed;
      left: 50%;
      top: 42%;
      width: 10px;
      height: 18px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9998;
      animation: confettiBurst 1.4s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    @keyframes confettiBurst {
      from {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0) scale(.7);
      }

      to {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(520deg) scale(1);
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 42%;
      font-size: 80px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      animation: emojiPop 1.8s cubic-bezier(.2, .8, .2, 1) forwards;
      filter: drop-shadow(0 10px 14px rgba(45, 50, 80, .18));
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35) rotate(-12deg);
      }

      28% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18) rotate(8deg);
      }

      68% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(1) rotate(-4deg);
      }

      to {
        opacity: 0;
        transform: translate(-50%, -68%) scale(.9) rotate(0);
      }
    }

    /* ===== FINAL OVERLAY (reference) ===== */
    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      transition: transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: scale(.95);
    }

    /* ===== RESPONSIVE (reference dimensions) ===== */
    @media (max-width: 900px) {
      .quiz-heading h1 {
        font-size: 34px;
      }

      .question-text {
        font-size: 20px;
      }

      .answer-input {
        width: 430px;
      }
    }

    @media (max-width: 768px) {
      body {
        align-items: flex-start;
        padding: 24px 10px 14px;
      }

      .quiz-heading {
        margin-bottom: 24px;
      }

      .quiz-heading h1 {
        font-size: 28px;
      }

      .question {
        min-height: 76px;
        gap: 12px;
        padding: 12px 16px;
        margin-bottom: 20px;
        border-radius: 18px;
      }

      .question-letter {
        width: 46px;
        height: 46px;
        flex-basis: 46px;
        font-size: 20px;
      }

      .question-text {
        font-size: 17px;
      }

      .answer-label {
        font-size: 17px;
      }

      .answer-row {
        gap: 12px;
      }

      .equals {
        font-size: 31px;
      }

      .answer-input {
        width: 80%;
        height: 72px;
        font-size: 27px;
      }

      .check-btn {
        margin-top: 29px;
        min-width: 165px;
        padding: 12px 28px;
        font-size: 17px;
      }

      .nav {
        margin-top: 24px;
        gap: 12px;
        padding-top: 14px;
      }

      .nav button {
        min-width: 100px;
        padding: 10px 18px;
        font-size: 14px;
      }

      .progress {
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 4px 10px;
        align-items: flex-start;
      }

      .quiz-heading h1 {
        font-size: 22px;
      }

      .question {
        min-height: 64px;
        padding: 10px 12px;
        gap: 9px;
        border-radius: 14px;
      }

      .question-letter {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
        font-size: 17px;
      }

      .question-text {
        font-size: 15px;
      }

      .answer-label {
        font-size: 15px;
      }

      .answer-row {
        gap: 8px;
      }

      .equals {
        font-size: 27px;
      }

      .answer-input {
        width: 86%;
        height: 62px;
        padding: 0 13px;
        border-radius: 17px;
        font-size: 23px;
      }

      .check-btn {
        min-width: 140px;
        padding: 10px 23px;
        font-size: 15px;
      }

      .nav {
        gap: 8px;
        margin-top: 18px;
        padding-top: 12px;
      }

      .nav button {
        min-width: 80px;
        padding: 8px 14px;
        font-size: 12px;
      }

      .progress {
        font-size: 12px;
        min-width: 48px;
      }
    }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .quiz-wrap {
        max-width: 1100px;
      }

      .quiz-heading h1 {
        font-size: 50px;
      }

      .question {
        min-height: 126px;
      }

      .question-text {
        font-size: 27px;
      }

      .answer-input {
        width: 540px;
        height: 92px;
        font-size: 34px;
      }

      .nav button {
        padding: 14px 34px;
        font-size: 19px;
      }
    }

    @media screen and (min-width: 1921px) {
      .quiz-wrap {
        max-width: 1200px;
      }

      .quiz-heading h1 {
        font-size: 54px;
      }

      .question {
        min-height: 138px;
      }

      .question-text {
        font-size: 29px;
      }

      .answer-input {
        width: 600px;
        height: 100px;
        font-size: 38px;
      }

      .nav button {
        padding: 16px 38px;
        font-size: 21px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .celebration-piece,
      .emoji-pop,
      .final-overlay,
      .final-modal {
        animation: none !important;
      }

      .celebration-piece {
        display: none !important;
      }
    }

    /* ===== POLISHED CLEAN KIDS STYLE ===== */

    .quiz-heading {
      margin-bottom: 34px;
    }

    .quiz-heading h1,
    .quiz-heading h1 .purple {
      color: #12265d;
      font-weight: 800;
    }

    .quiz-heading h1 .purple {
      color: inherit;
    }

    .quiz-heading h1::after {
      display: none;
    }

    .question {
      background: #fff;
      border: 2px solid #d8ccf7;
      border-radius: 22px;
      box-shadow: 0 6px 0 #eeeaff;
    }

    .question-letter {
      background: #7040df;
      box-shadow: 0 5px 0 #d7caf8;
    }

    .answer-label {
      color: #626981;
    }

    .answer-label span {
      color: #626981;
    }

    .answer-input {
      background: #fff;
      border-color: #e9b52b;
      box-shadow: 0 6px 0 #f5e3ae;
    }

    .answer-input:focus {
      border-color: #7040df;
      box-shadow: 0 6px 0 #ddd2f8, 0 0 0 4px rgba(112, 64, 223, .08);
    }

    .answer-input.correct {
      border-color: #56ad49;
      background: #f1faee;
      box-shadow: 0 6px 0 #c7e5bf;
    }

    .check-btn {
      background: linear-gradient(180deg, #4d83ef, #2d5ddd);
      box-shadow: 0 6px 0 #1f48b4;
    }

    /* Disabled means visually unavailable only; solved input stays green. */
    .check-btn:disabled {
      opacity: .42;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>

<body>
  <main class="quiz-wrap">
    <header class="quiz-heading">
      <h1>Write the following in <span class="purple">standard form.</span></h1>
    </header>

    <section id="quiz"></section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled><i class="fa-solid fa-chevron-left"></i> Prev</button>
      <span class="progress" id="progress">1 / 4</span>
      <button id="nextBtn" disabled>Next <i class="fa-solid fa-chevron-right"></i></button>
    </nav>
  </main>

  <script>
    (() => {
      const QUESTIONS = [
        {
          letter: "a",
          text: "3000 + 800 + 70 + 2",
          answer: "3872"
        },
        {
          letter: "b",
          text: "4000 + 200 + 8",
          answer: "4208"
        },
        {
          letter: "c",
          text: "6000 + 100 + 10 + 1",
          answer: "6111"
        },
        {
          letter: "d",
          text: "2 thousands 3 tens",
          answer: "2030"
        }
      ];

      QUESTIONS.forEach(q => {
        q.solved = false;
        q.userAnswer = "";
      });

      let current = 0;
      let audioCtx = null;

      const quiz = document.getElementById("quiz");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progress = document.getElementById("progress");

      /* ===== SOUND (reference) ===== */
      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
      }

      function beep(freq, duration, type) {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type || "sine";
          osc.frequency.value = freq;
          osc.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.16, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          osc.start();
          osc.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sfx = {
        good: () => {
          beep(660, 110, "sine");
          setTimeout(() => beep(880, 160, "sine"), 110);
        },
        bad: () => beep(180, 220, "sawtooth"),
        finish: () => {
          [523, 659, 784, 1047].forEach((f, i) => {
            setTimeout(() => beep(f, 150, "sine"), i * 130);
          });
        }
      };

      /* ===== CONFETTI (reference) ===== */
      function burstConfetti(fromEl, color) {
        const rect = fromEl.getBoundingClientRect();
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;

        confetti({
          particleCount: 30,
          spread: 70,
          origin: { x, y },
          startVelocity: 20,
          colors: [color, "#ffd54f", "#ff9f45", "#7ed957", "#ff6b6b", "#4ecdc4"]
        });
      }

      function showCorrectEmoji() {
        const colors = ['#ff6fb5', '#ffd54f', '#7ed957', '#4fc3f7', '#b388ff'];
        for (let i = 0; i < 18; i++) {
          const piece = document.createElement('span');
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 90 + Math.random() * 100;
          piece.className = 'celebration-piece';
          piece.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
          piece.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * .12}s`;
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1600);
        }
        const emoji = document.createElement('div');
        emoji.className = 'emoji-pop';
        emoji.textContent = '🥳';
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1850);
      }

      function showWrongEmoji() {
        const emoji = document.createElement('div');
        emoji.className = 'emoji-pop';
        emoji.textContent = '😔';
        emoji.style.fontSize = '70px';
        document.body.appendChild(emoji);
        setTimeout(() => emoji.remove(), 1500);
      }

      /* ===== FINAL POPUP (reference) ===== */
      function showFinalPopup() {
        sfx.finish();

        const overlay = document.createElement('div');
        overlay.className = 'final-overlay';
        overlay.innerHTML = `
      <div class="final-modal">
        <span class="icon-big">🎉</span>
        <h2>All Done!</h2>
        <p>Amazing! You got them all right!</p>
        <button class="btn-playagain" id="playAgainBtn"><i class="fa-solid fa-rotate-right"></i> Play again</button>
      </div>
    `;
        document.body.appendChild(overlay);

        setTimeout(() => {
          const modal = overlay.querySelector('.final-modal');
          if (modal) burstConfetti(modal, '#ffd54f');
          setTimeout(() => { if (modal) burstConfetti(modal, '#4ecdc4'); }, 400);
          setTimeout(() => { if (modal) burstConfetti(modal, '#ff9f45'); }, 800);
        }, 100);

        overlay.querySelector('#playAgainBtn').addEventListener('click', () => {
          overlay.remove();
          QUESTIONS.forEach(q => {
            q.solved = false;
            q.userAnswer = "";
          });
          current = 0;
          render();
        });
      }

      function showCorrect(input) {
        const q = QUESTIONS[current];

        q.solved = true;
        q.userAnswer = q.answer;

        input.value = q.answer;
        input.classList.remove("wrong");
        input.classList.add("correct");
        input.readOnly = true;

        sfx.good();
        burstConfetti(input, '#4caf50');
        showCorrectEmoji();

        updateCheckButton();

        if (QUESTIONS.every(q => q.solved)) {
          setTimeout(() => showFinalPopup(), 700);
        } else {
          updateNav();
        }
      }

      function showWrong(input) {
        sfx.bad();
        showWrongEmoji();

        input.classList.remove("wrong");
        void input.offsetWidth;
        input.classList.add("wrong");

        // Clear the wrong answer and require a fresh answer.
        input.value = "";
        QUESTIONS[current].userAnswer = "";
        updateCheckButton();

        setTimeout(() => {
          input.classList.remove("wrong");
          input.focus();
          updateCheckButton();
        }, 600);
      }

      function updateCheckButton() {
        const input = document.getElementById("answerInput");
        const checkBtn = document.getElementById("checkBtn");

        if (!input || !checkBtn) return;

        // Empty input OR solved/locked question => disabled.
        checkBtn.disabled = input.readOnly || input.value.trim() === "";
      }

      function checkAnswer() {
        const q = QUESTIONS[current];
        const input = document.getElementById("answerInput");

        if (q.solved) return;

        const value = input.value.trim();

        if (!value) {
          input.focus();
          return;
        }

        q.userAnswer = value;

        if (value === q.answer) {
          showCorrect(input);
        } else {
          showWrong(input);
        }
      }

      function render() {
        const q = QUESTIONS[current];

        quiz.innerHTML = `
      <div class="question">
        <div class="question-letter">${q.letter})</div>
        <div class="question-text">${q.text}</div>
      </div>

      <div class="answer-label">
        Write your answer in <span>numbers only</span>
      </div>

      <div class="answer-row">
        <span class="equals">=</span>
        <input
          id="answerInput"
          class="answer-input ${q.solved ? "correct" : ""}"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="10"
          placeholder="Type your answer here"
          value="${q.userAnswer}"
          autocomplete="off"
          ${q.solved ? "readonly" : ""}
          aria-label="Answer"
        >
      </div>

      <div class=checkBtn-box>
        <button class="check-btn" id="checkBtn" ${q.solved ? "disabled" : ""}>
        Check
      </button></div>
    `;

        const input = document.getElementById("answerInput");
        const checkBtn = document.getElementById("checkBtn");

        input.addEventListener("input", () => {
          input.value = input.value.replace(/[^0-9]/g, "");
          q.userAnswer = input.value;
          updateCheckButton();
        });

        input.addEventListener("keydown", e => {
          if (e.key === "Enter") {
            e.preventDefault();
            checkAnswer();
          }
        });

        checkBtn.addEventListener("click", checkAnswer);

        updateCheckButton();
        updateNav();
      }

      function updateNav() {
        prevBtn.disabled = current === 0;

        nextBtn.disabled =
          !QUESTIONS[current].solved ||
          current === QUESTIONS.length - 1;

        progress.textContent = `${current + 1} / ${QUESTIONS.length}`;
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) {
          current--;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      nextBtn.addEventListener("click", () => {
        if (
          current < QUESTIONS.length - 1 &&
          QUESTIONS[current].solved
        ) {
          current++;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      render();
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
