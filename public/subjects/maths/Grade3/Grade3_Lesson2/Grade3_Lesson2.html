<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Math Marvels</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <script src="../assets/shared/quiz-ui.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-weight: 600;
      color: #2e2940;
      background:
        radial-gradient(circle at 8% 15%, #fff1d8 0 11%, transparent 30%),
        radial-gradient(circle at 93% 17%, #e8f5ff 0 11%, transparent 30%),
        radial-gradient(circle at 90% 88%, #eaf8df 0 10%, transparent 28%),
        radial-gradient(circle at 8% 90%, #ffe9ef 0 10%, transparent 28%),
        #fbf9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 5vw, 52px) 18px;
      position: relative;
      overflow: hidden;
    }

    /* Small playful background shapes */
    .bubble {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: float 5s ease-in-out infinite;
    }

    .bubble.one {
      width: 18px;
      height: 18px;
      top: 17%;
      left: 8%;
      background: #ffdcae;
    }

    .bubble.two {
      width: 13px;
      height: 13px;
      top: 26%;
      right: 10%;
      background: #bde5ff;
      animation-delay: -1.5s;
    }

    .bubble.three {
      width: 20px;
      height: 20px;
      bottom: 18%;
      left: 12%;
      background: #ffd0df;
      animation-delay: -3s;
    }

    .bubble.four {
      width: 15px;
      height: 15px;
      bottom: 22%;
      right: 8%;
      background: #cceab8;
      animation-delay: -2s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-10px) rotate(8deg);
      }
    }

    .page {
      width: min(1000px, 100%);
      position: relative;
      z-index: 1;
    }

    /* ---------- Simple heading ---------- */

    .hero {
      text-align: center;
      margin-bottom: clamp(28px, 5vw, 46px);
    }

    .hero h1 {
      font-size: clamp(28px, 4.5vw, 44px);
      line-height: 1.05;
      letter-spacing: .5px;
      color: #3d20a3;
      text-shadow: 0 7px 16px rgba(80, 50, 170, .12);
    }

    .hero h1 .play {
      color: #1f2648;
      display: inline-block;
    }

    /* ---------- Quiz cards ---------- */

    .quiz-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(20px, 3vw, 32px);
    }

    .quiz-card {
      --bg: #f8efff;
      --accent: #b99bfa;
      --dark: #7650d7;

      position: relative;
      min-height: 330px;
      overflow: hidden;
      border-radius: 30px;
      background: var(--bg);
      border: 2px solid rgba(255, 255, 255, .95);
      box-shadow:
        0 18px 35px -18px rgba(67, 42, 130, .30),
        0 4px 10px rgba(67, 42, 130, .06);
      transition:
        transform .32s cubic-bezier(.34, 1.56, .64, 1),
        box-shadow .3s ease;
      animation: cardIn .65s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    .quiz-card:nth-child(2) {
      animation-delay: .12s;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .quiz-card:hover {
      transform: translateY(-10px) rotate(-.7deg);
      box-shadow:
        0 28px 45px -20px rgba(67, 42, 130, .40),
        0 8px 18px rgba(67, 42, 130, .08);
    }

    .quiz-card:nth-child(2):hover {
      transform: translateY(-10px) rotate(.7deg);
    }

    /* Decorative blobs inside cards */
    .quiz-card::before,
    .quiz-card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .quiz-card::before {
      width: 150px;
      height: 150px;
      top: -82px;
      right: -48px;
      background: rgba(255, 255, 255, .32);
    }

    .quiz-card::after {
      width: 90px;
      height: 90px;
      bottom: -52px;
      left: -28px;
      border: 14px solid rgba(255, 255, 255, .28);
    }

    .quiz-top {
      height: 145px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--accent), var(--dark));
      border-bottom: 2px solid rgba(255, 255, 255, .65);
    }

    .quiz-number {
      position: absolute;
      top: 14px;
      left: 16px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .90);
      color: var(--dark);
      font-size: 13px;
      letter-spacing: .3px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, .08);
    }

    .quiz-icon {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      border-radius: 27px;
      background: #fff;
      color: var(--dark);
      font-size: 42px;
      border: 4px solid rgba(255, 255, 255, .78);
      box-shadow: 0 14px 22px -12px rgba(40, 20, 80, .35);
      animation: iconBounce 3s ease-in-out infinite;
    }

    .quiz-card:nth-child(2) .quiz-icon {
      animation-delay: -1.2s;
    }

    @keyframes iconBounce {

      0%,
      100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-6px) rotate(3deg);
      }
    }

    .quiz-card:hover .quiz-icon {
      animation: iconWiggle .45s ease;
    }

    @keyframes iconWiggle {
      0% {
        transform: rotate(0) scale(1);
      }

      35% {
        transform: rotate(-8deg) scale(1.08);
      }

      70% {
        transform: rotate(7deg) scale(1.08);
      }

      100% {
        transform: rotate(0) scale(1);
      }
    }

    .quiz-body {
      min-height: 185px;
      padding: 22px 24px 23px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 9px;
      position: relative;
    }

    .quiz-body h2 {
      font-size: clamp(23px, 2.7vw, 29px);
      line-height: 1.15;
      color: #2c2341;
    }

    .tag {
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      color: var(--dark);
      border: 1px solid rgba(255, 255, 255, .85);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .55px;
      font-weight: 800;
    }

    .play-btn {
      width: 100%;
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 13px 18px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(145deg, var(--accent), var(--dark));
      box-shadow: 0 9px 16px -10px var(--dark);
      border: 1px solid rgba(255, 255, 255, .25);
      font-size: 17px;
      transition: transform .18s ease, box-shadow .2s ease;
    }

    .play-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 14px 22px -11px var(--dark);
    }

    .play-btn:active {
      transform: scale(.98);
    }

    /* ---------- Quiz overlay ---------- */

    .quiz-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      background: #fff;
    }

    .quiz-overlay.active {
      display: block;
    }

    .quiz-iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: linear-gradient(180deg, #fffcf2 0%, #fffbea 100%);
    }

    .quiz-home-btn {
      position: absolute;
      z-index: 1001;
      top: 18px;
      right: 18px;
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(145deg, #a77aff, #6a33d0);
      box-shadow: 0 12px 22px -10px rgba(70, 30, 150, .5);
      font-size: 20px;
      transition: transform .2s ease;
    }

    .quiz-home-btn:hover {
      transform: scale(1.08) translateY(-2px);
    }

    @media (max-width: 720px) {
      body {
        align-items: flex-start;
        padding: 30px 15px 40px;
      }

      .quiz-grid {
        grid-template-columns: 1fr;
        max-width: 520px;
        margin: 0 auto;
      }

      .quiz-card {
        min-height: 315px;
      }

      .quiz-top {
        height: 132px;
      }

      .quiz-body {
        min-height: 180px;
      }
    }

    @media (max-width: 420px) {
      .hero {
        margin-bottom: 25px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .quiz-card {
        border-radius: 26px;
      }

      .quiz-icon {
        width: 78px;
        height: 78px;
        font-size: 36px;
        border-radius: 23px;
      }

      .quiz-body {
        padding: 20px 18px 21px;
      }

      .quiz-home-btn {
        width: 46px;
        height: 46px;
        top: 12px;
        right: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .bubble,
      .quiz-card,
      .quiz-icon,
      .play-btn,
      .quiz-home-btn {
        animation: none;
        transition: none;
      }

      .quiz-card:hover,
      .quiz-card:nth-child(2):hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <span class="bubble one"></span>
  <span class="bubble two"></span>
  <span class="bubble three"></span>
  <span class="bubble four"></span>

  <main class="page">
    <header class="hero">
      <h1>
       <span class="play">Choose an Activity, Start the Quest</span>
      </h1>
    </header>

    <section class="quiz-grid" aria-label="Available quizzes">

      <!-- Quiz 1 -->
      <article class="quiz-card" style="--bg:#f8efff;--accent:#c5a8fb;--dark:#8060d9;">
        <div class="quiz-top">
          <!-- <span class="quiz-number">QUIZ 1</span> -->
          <div class="quiz-icon" aria-hidden="true">➕</div>
        </div>

        <div class="quiz-body">
          <h2>Find the Following</h2>
          <span class="tag">Addition Practice</span>

          <a class="play-btn" href="./exercises/find.html" data-href="./exercises/find.html">
            Play ▶  
          </a>
        </div>
      </article>

      <!-- Quiz 2 -->
      <article class="quiz-card" style="--bg:#edf9ff;--accent:#9ed8fa;--dark:#4b9bd2;">
        <div class="quiz-top">
          <!-- <span class="quiz-number">QUIZ 2</span> -->
          <div class="quiz-icon" aria-hidden="true">🧩</div>
        </div>

        <div class="quiz-body">
          <h2>Fill in the Boxes</h2>
          <span class="tag">Number Practice</span>

          <a class="play-btn" href="./exercises/FTB.html" data-href="./exercises/FTB.html">
            Play ▶ 
          </a>
        </div>
      </article>

    </section>
  </main>

  <div class="quiz-overlay" id="quizOverlay">
    <button class="quiz-home-btn" id="quizHomeBtn" aria-label="Back to quizzes">
      <i class="fa-solid fa-house"></i>
    </button>

    <iframe class="quiz-iframe" id="quizFrame" title="Quiz" src="about:blank"></iframe>
  </div>

  <script>
    const quizOverlay = document.getElementById("quizOverlay");
    const quizFrame = document.getElementById("quizFrame");
    const quizHomeBtn = document.getElementById("quizHomeBtn");

    function openQuiz(href) {
      quizFrame.src = href;
      quizOverlay.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeQuiz() {
      quizOverlay.classList.remove("active");
      quizFrame.src = "about:blank";
      document.body.style.overflow = "";
    }

    document.querySelectorAll(".play-btn").forEach((button) => {
      button.addEventListener("click", (event) => {
        event.preventDefault();
        openQuiz(button.dataset.href);
      });
    });

    quizHomeBtn.addEventListener("click", closeQuiz);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && quizOverlay.classList.contains("active")) {
        closeQuiz();
      }
    });
  </script>
</body>

</html>
