<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill in the boxes.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .quiz-heading {
      text-align: center;
      margin-bottom: 12px;
      position: relative;
      z-index: 5;
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #12265d;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 400;
    }

    .target-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: .92em;
      line-height: 1;
    }

    .heading-line,
    .nav {
      width: 100%;
    }

    .instruction {
      text-align: center;
      margin-bottom: 18px;
      color: #6d788c;
      font-size: 22px;
      font-weight: 400;
    }

    .instruction span {
      display: inline-block;
      animation: littleBounce 1.4s ease-in-out infinite;
    }

    @keyframes littleBounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    .questions {
      width: 100%;
      position: relative;
      z-index: 5;
    }

    .question-card {
      width: 100%;
      background: #fff;
      border: 1px solid #e8edf4;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(18, 38, 93, .09);
      position: relative;
      animation: cardIn .45s ease-out;
    }

    .question-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: linear-gradient(180deg, #ff9a1f, #f47b0b);
      z-index: 2;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .question-card.hidden {
      display: none;
    }

    .question-top {
      min-height: 116px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      border-bottom: 1px solid #edf0f4;
      background: linear-gradient(90deg, #fffaf1, #ffffff);
    }

    .question-left {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
    }

    .question-number {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 17px;
      color: #fff;
      font-size: 25px;
      font-weight: 400;
      background: linear-gradient(180deg, #ff931b, #f57b0d);
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .12);
    }

    .question-text {
      color: #2f4f4f;
      font-size: 30px;
      line-height: 1.22;
      font-weight: 400;
      max-width: 1120px;
    }

    .answer-area {
      min-height: 235px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      position: relative;
      background: #fff;
    }

    .answer-input {
      width: 45%;
      height: 70px;
      margin: 20px auto 5px;
      background: #f4f9ff;
      border: 3px dashed #8ab4f8;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 400;
      color: #2f4f4f;
      text-align: center;
      letter-spacing: 2px;
      box-shadow: 0 4px 10px rgba(45, 58, 102, 0.08);
      transition: 0.2s ease;
      outline: none;
    }

    .answer-input:hover:not(:disabled) {
      border-color: #8ab0f3;
      box-shadow: 0 0 0 4px rgba(138, 180, 248, .18), 0 7px 18px rgba(45, 58, 102, .08);
      transform: translateY(-2px);
    }

    .answer-input:active:not(:disabled) {
      transform: translateY(1px) scale(.995);
    }

    .answer-input:focus-visible {
      border-style: solid;
      border-color: #8ab0f3;
      box-shadow: 0 0 0 4px rgba(138, 180, 248, .28), 0 4px 10px rgba(45, 58, 102, .08);
      animation: inputFocusPulse 1.2s ease-in-out infinite;
    }

    @keyframes inputFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @keyframes inputFocusPulse {

      0%,
      100% {
        box-shadow: 0 0 0 4px rgba(255, 133, 13, .08), 0 8px 20px rgba(255, 133, 13, .10);
      }

      50% {
        box-shadow: 0 0 0 7px rgba(255, 133, 13, .13), 0 10px 25px rgba(255, 133, 13, .14);
      }
    }

    .answer-input:disabled {
      cursor: not-allowed;
      opacity: 1;
    }

    .answer-input::placeholder {
      color: #b3b3b3;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
    }

    .answer-input:focus {
      border-style: solid;
      border-color: #8ab0f3;
      box-shadow: 0 0 0 4px rgba(138, 180, 248, 0.28), 0 4px 10px rgba(45, 58, 102, 0.08);
    }

    .answer-input.correct {
      background: #fff;
      border: 3px solid #4caf50;
      color: #2f4f4f;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.12);
    }

    .answer-input.wrong {
      animation: wrongShake 0.6s ease;
    }

    @keyframes answerCorrect {
      0% {
        transform: scale(.98);
      }

      60% {
        transform: scale(1.015);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes answerWrong {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-9px);
      }

      50% {
        transform: translateX(9px);
      }

      75% {
        transform: translateX(-5px);
      }
    }

    .check-btn {
      width: 150px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 22px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 16px;
      color: #2f4f4f;
      border: 3px solid #ffabab;
      background: linear-gradient(135deg, #ffd8d8, #ffd2d2);
      box-shadow: 0 4px 0 #ffabab, 0 8px 14px rgba(0, 0, 0, 0.08);
      transition: 0.2s;
    }

    .check-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #ffc8c8, #ffc6c6);
    }

    .check-btn:active:not(:disabled) {
      opacity: 0.5;
    }

    .check-btn:focus-visible {
      outline: 4px solid rgba(255, 171, 171, .24);
      outline-offset: 4px;
    }

    .check-btn i {
      font-size: 1em;
    }

    .check-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      transform: none;
    }

    .nav {
      margin: 16px auto 0;
      padding-top: 14px;
      border-top: 2px solid #dfe2e8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      position: relative;
      z-index: 20;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 400;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    .progress {
      min-width: 52px;
      text-align: center;
      color: #12265d;
      font-size: 14px;
      font-weight: 400;
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 400;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 400;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    /* =====================================================
       🖥️ MONITOR / LAPTOP SCALING
       Same breakpoint dimensions as the reference code.
       ===================================================== */

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        max-width: 1380px;
      }

      .quiz-heading h1 {
        font-size: 30px;
      }

      .instruction {
        font-size: 22px;
      }

      .question-top {
        min-height: 125px;
      }

      .question-number {
        width: 62px;
        height: 62px;
        font-size: 28px;
      }

      .question-text {
        font-size: 30px;
      }

      .answer-input {
        width: 45%;
        height: 55px;
        font-size: 20px;
      }

      .answer-area {
        min-height: 230px;
        gap: 18px;
      }

      .check-btn {
        width: 145px;
        min-width: 145px;
        height: 55px;
        padding: 0;
        font-size: 20px;
      }

      .nav {
        gap: 30px;
      }

      .nav button {
        width: 150px;
        min-width: 150px;
        height: 55px;
        padding: 0;
        font-size: 20px;
      }

      .progress {
        font-size: 16px;
      }
    }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .quiz-wrap {
        max-width: 1600px;
      }

      .quiz-heading {
        margin-bottom: 14px;
      }

      .instruction {
        font-size: 26px;
        margin-bottom: 22px;
      }

      .quiz-heading h1 {
        font-size: 40px;
      }

      .question-top {
        min-height: 145px;
        gap: 24px;
      }

      .question-left {
        gap: 22px;
      }

      .question-number {
        width: 72px;

      }

      .question-text {

      }

      .answer-input {

      }

      .check-btn {
        width: 150px;

      }

      .nav {
        margin-top: 32px;

      }

      .nav button {
        width: 160px;

      }

    @media screen and (min-width: 1921px) {
      .quiz-wrap {

      }

      .quiz-heading h1 {

      }

      }

      .check-btn {
        width: 155px;

      }

      .nav {

      }

    @media (max-width: 768px) {

      }

      }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

<body>

  <main class="quiz-wrap">

    <header class="quiz-heading">
      <h1>
        <span class="target-icon">🎯</span>
        Fill in the boxes.
      </h1>
    </header>

    <div class="instruction">
      Read the question and enter the correct answer
      <span>✨</span>
    </div>

    <section class="questions">
      <article class="question-card" data-question="0">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">a)</div>
            <div class="question-text">5 more than the smallest 2 digit number is</div>
          </div>
        </div>
        <div class="answer-area">
          <input class="answer-input" id="answer-0" type="text" inputmode="numeric" autocomplete="off"
            aria-label="Answer for question a" placeholder="Enter your answer">
          <button class="check-btn" type="button" data-question="0">
            <i class="fa-regular fa-circle-check"></i>
            Check
          </button>
        </div>
      </article>

      <article class="question-card hidden" data-question="1">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">b)</div>
            <div class="question-text">The sum of the greatest 1 digit number and the greatest 2 digit number is</div>
          </div>
        </div>
        <div class="answer-area">
          <input class="answer-input" id="answer-1" type="text" inputmode="numeric" autocomplete="off"
            aria-label="Answer for question b" placeholder="Enter your answer">
          <button class="check-btn" type="button" data-question="1">
            <i class="fa-regular fa-circle-check"></i>
            Check
          </button>
        </div>
      </article>

      <article class="question-card hidden" data-question="2">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">c)</div>
            <div class="question-text">740 + 320 =</div>
          </div>
        </div>
        <div class="answer-area">
          <input class="answer-input" id="answer-2" type="text" inputmode="numeric" autocomplete="off"
            aria-label="Answer for question c" placeholder="Enter your answer">
          <button class="check-btn" type="button" data-question="2">
            <i class="fa-regular fa-circle-check"></i>
            Check
          </button>
        </div>
      </article>

      <article class="question-card hidden" data-question="3">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">d)</div>
            <div class="question-text">The sum of the smallest 2 digit number and the greatest 2 digit number is</div>
          </div>
        </div>
        <div class="answer-area">
          <input class="answer-input" id="answer-3" type="text" inputmode="numeric" autocomplete="off"
            aria-label="Answer for question d" placeholder="Enter your answer">
          <button class="check-btn" type="button" data-question="3">
            <i class="fa-regular fa-circle-check"></i>
            Check
          </button>
        </div>
      </article>
    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" type="button" disabled>
        <i class="fa-solid fa-chevron-left"></i> Prev
      </button>

      <span class="progress" id="progress">1 / 1</span>

      <button id="nextBtn" type="button" disabled>
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {
      const questions = [{ answer: ["15"], value: "", answered: false },
      { answer: ["108"], value: "", answered: false },
      { answer: ["1060", "1,060"], value: "", answered: false },
      { answer: ["109"], value: "", answered: false }];

      const cards = document.querySelectorAll(".question-card");
      const inputs = document.querySelectorAll(".answer-input");
      const checkBtns = document.querySelectorAll(".check-btn");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progress = document.getElementById("progress");

      let currentQuestion = 0;
      let audioCtx = null;

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc", "#ff4e83", "#4e8ff0",
              "#76b93b", "#f4ae25", "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);
        setTimeout(() => element.remove(), 1600);
      }

      function updateCheckButton(index = currentQuestion) {
        const state = questions[index];
        const input = inputs[index];
        checkBtns[index].disabled = state.answered || input.value.trim() === "";
      }

      function saveCurrentState() {
        const input = inputs[currentQuestion];
        if (!questions[currentQuestion].answered) {
          questions[currentQuestion].value = input.value;
        }
      }

      function showQuestion(index) {
        saveCurrentState();
        currentQuestion = index;

        cards.forEach((card, i) => {
          card.classList.toggle("hidden", i !== index);
        });

        inputs.forEach((input, i) => {
          const state = questions[i];
          input.value = state.value || "";
          input.disabled = state.answered;
          input.classList.toggle("correct", state.answered);
          input.classList.remove("wrong");
        });

        checkBtns.forEach((button, i) => {
          button.disabled = i !== index ||
            questions[i].answered ||
            inputs[i].value.trim() === "";
        });

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !questions[index].answered;
        progress.textContent = `${index + 1} / ${questions.length}`;
      }

      function checkAnswer(index) {
        if (index !== currentQuestion) return;

        const state = questions[index];
        const input = inputs[index];
        const button = checkBtns[index];

        if (state.answered) return;

        const value = input.value.trim();

        if (!value) {
          button.disabled = true;
          return;
        }

        if (state.answer.includes(value)) {
          state.answered = true;
          state.value = value;

          input.value = value;
          input.disabled = true;
          input.classList.remove("wrong");
          input.classList.add("correct");

          button.disabled = true;
          nextBtn.disabled = false;

          sound.correct();
          showEmoji("🥳");
          burstConfetti(button);

          if (index === questions.length - 1) {
            setTimeout(finishQuiz, 650);
          }
        } else {
          // Wrong answer: clear input and keep Check disabled until
          // the learner enters a new answer.
          state.value = "";
          input.value = "";
          input.classList.remove("correct");
          input.classList.add("wrong");
          button.disabled = true;

          sound.wrong();
          showEmoji("😔");

          setTimeout(() => {
            input.classList.remove("wrong");
            input.focus();
          }, 550);
        }
      }

      inputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          if (questions[index].answered) return;

          questions[index].value = input.value;

          if (index === currentQuestion) {
            updateCheckButton(index);
          }
        });

        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !checkBtns[index].disabled) {
            event.preventDefault();
            checkAnswer(index);
          }
        });
      });

      checkBtns.forEach((button, index) => {
        button.addEventListener("click", () => checkAnswer(index));
      });

      prevBtn.addEventListener("click", () => {
        if (currentQuestion > 0) {
          showQuestion(currentQuestion - 1);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (!questions[currentQuestion].answered) return;

        if (currentQuestion < questions.length - 1) {
          showQuestion(currentQuestion + 1);
        }
      });

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
          <span class="icon-big">🎉</span>
          <h2>All Done!</h2>
          <p>Amazing! You got them all right!</p>
          <button class="btn-playagain" type="button">
            <i class="fa-solid fa-rotate-right"></i>
            Play again
          </button>
        `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();
          resetQuiz();
        });
      }

      function resetQuiz() {
        questions.forEach((state) => {
          state.value = "";
          state.answered = false;
        });

        showQuestion(0);
        inputs[0].focus();
      }

      showQuestion(0);
    })();
  </script>

  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
