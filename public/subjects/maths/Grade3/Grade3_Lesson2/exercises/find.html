  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .quiz-heading {
      text-align: center;
      margin-bottom: 25px;
      position: relative;
      z-index: 5;
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #2f4f4f;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 400;
    }

    .questions {
      width: 100%;
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .question-card {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e9edf4;
      box-shadow: 0 10px 25px rgba(18, 38, 93, .10);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .question-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(18, 38, 93, .13);
    }

    .question-top {
      min-height: 138px;
      padding: 26px 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border-bottom: 1px solid #e6e8ed;
    }

    .question-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .question-equals {
      color: #2f4f4f;
      font-size: 34px;
      font-weight: 400;
    }

    .question-card.orange .question-top {
      background: linear-gradient(90deg, #fffaf0, #fffdf8);
    }

    .question-card.blue .question-top {
      background: linear-gradient(90deg, #f2faff, #fbfdff);
    }

    .question-number {
      width: 66px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      color: #fff;
      font-size: 30px;
      font-weight: 400;
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .12);
    }

    .orange .question-number {
      background: linear-gradient(180deg, #ff931b, #f57b0d);
    }

    .blue .question-number {
      background: linear-gradient(180deg, #2598f0, #1585dc);
    }

    .question-text {
      color: #2f4f4f;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 400;
    }

    .answer-display {
      width: 150px;
      height: 80px;
      border: 2px solid;
      border-radius: 17px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 400;
      color: #12265d;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .orange .answer-display {
      border-color: #ff850d;
    }

    .blue .answer-display {
      border-color: #2499f5;
    }

    .answer-display.has-answer {
      background: #f7fbff;
      animation: answerPop .25s ease-out;
    }

    @keyframes answerPop {
      0% {
        transform: scale(.94);
      }

      100% {
        transform: scale(1);
      }
    }

    .answer-area {
      min-height: 160px;
      padding: 28px 190px 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 44px;
      position: relative;
      background: #fff;
    }

    .choice {
      min-height: 76px;
      border: 2px solid;
      border-radius: 18px;
      background: #fff;
      color: #12265d;
      font-size: 30px;
      font-weight: 400;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .question-card.orange .choice:first-child {
      border-color: #ffb21c;
      box-shadow: 0 4px 0 #ffce6b;
    }

    .question-card.blue .choice:first-child {
      border-color: #ffb21c;
      box-shadow: 0 4px 0 #ffce6b;
    }

    .question-card .choice:last-child {
      border-color: #60b8ff;
      box-shadow: 0 4px 0 #b5ddff;
    }

    .choice:hover {
      transform: translateY(-2px);
      background: #fbfdff;
    }

    .choice:active {
      transform: translateY(2px);
    }

    .choice.selected {
      background: #eef7ff;
    }

    .choice.correct-choice {
      border-color: #55b449 !important;
      background: #effaf0 !important;
      box-shadow: 0 4px 0 #9bd39a !important;
    }

    .choice.wrong-choice {
      border-color: #ef5350 !important;
      background: #fff0f0 !important;
      box-shadow: 0 4px 0 #f5a5a5 !important;
    }

    .choice:disabled {
      cursor: default;
    }

    .question-card.hidden {
      display: none;
    }

    .nav {
      width: 100%;
      margin: 22px auto 0 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      position: relative;
      z-index: 20;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 400;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    .progress {
      min-width: 52px;
      text-align: center;
      color: #12265d;
      font-size: 14px;
      font-weight: 400;
    }

    .instruction {
      text-align: center;
      margin-bottom: 15px;
      color: #6d788c;
      font-size: 22px;
      font-weight: 400;
    }

    .instruction span {
      display: inline-block;
      animation: littleBounce 1.4s ease-in-out infinite;
    }

    @keyframes littleBounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {

      align-items: center;

<body>

  <main class="quiz-wrap">

    <header class="quiz-heading">
      <h1>
        Find the following.
      </h1>
    </header>

    <div class="instruction">
      Read the question and choose the correct answer
      <span>✨</span>
    </div>

    <section class="questions">

      <article class="question-card orange" data-question="0">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">1)</div>
            <div class="question-text">7 more than 536</div>
          </div>
          <div class="question-equals">=</div>
          <div class="answer-display" id="answer-0"></div>
        </div>

        <div class="answer-area">
          <button class="choice" data-question="0" data-answer="543">543</button>
          <button class="choice" data-question="0" data-answer="533">533</button>
        </div>
      </article>

      <article class="question-card blue hidden" data-question="1">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">2)</div>
            <div class="question-text">6 more than 405</div>
          </div>
          <div class="question-equals">=</div>
          <div class="answer-display" id="answer-1"></div>
        </div>

        <div class="answer-area">
          <button class="choice" data-question="1" data-answer="410">410</button>
          <button class="choice" data-question="1" data-answer="411">411</button>
        </div>
      </article>

      <article class="question-card orange" data-question="0">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">1)</div>
            <div class="question-text">10 more than 899</div>
          </div>
          <div class="question-equals">=</div>
          <div class="answer-display" id="answer-2"></div>
        </div>

        <div class="answer-area">
          <button class="choice" data-question="2" data-answer="909">909</button>
          <button class="choice" data-question="2" data-answer="900">900</button>
        </div>
      </article>

      <article class="question-card orange" data-question="0">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">1)</div>
            <div class="question-text">8 more than 247</div>
          </div>
          <div class="question-equals">=</div>
          <div class="answer-display" id="answer-3"></div>
        </div>

        <div class="answer-area">
          <button class="choice" data-question="3" data-answer="255">255</button>
          <button class="choice" data-question="3" data-answer="259">259</button>
        </div>
      </article>

    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i> Prev
      </button>

      <span class="progress" id="progress">1 / 2</span>

      <button id="nextBtn" disabled>
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {
      const questions = [
        { answer: "543" },
        { answer: "411" },
        { answer: "909" },
        { answer: "255" }
      ];

      const cards = document.querySelectorAll(".question-card");
      const choices = document.querySelectorAll(".choice");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const progress = document.getElementById("progress");

      let currentQuestion = 0;
      const answered = [false, false];
      let audioCtx = null;

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + duration / 1000);

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: ["#6635dc", "#ff4e83", "#4e8ff0", "#76b93b", "#f4ae25", "#4ecdc4"]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);

        setTimeout(() => element.remove(), 1600);
      }

      function showQuestion(index) {
        currentQuestion = index;

        cards.forEach((card, cardIndex) => {
          card.classList.toggle("hidden", cardIndex !== index);
        });

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !answered[index];
        progress.textContent = `${index + 1} / ${questions.length}`;
      }

      choices.forEach((choice) => {
        choice.addEventListener("click", () => {
          const questionIndex = Number(choice.dataset.question);

          if (questionIndex !== currentQuestion) return;
          if (answered[questionIndex]) return;

          const selectedAnswer = choice.dataset.answer;
          const correctAnswer = questions[questionIndex].answer;

          if (selectedAnswer === correctAnswer) {
            answered[questionIndex] = true;
            choice.classList.add("correct-choice");

            document.querySelectorAll(`.choice[data-question="${questionIndex}"]`).forEach((button) => {
              button.disabled = true;
            });

            const display = document.getElementById(`answer-${questionIndex}`);
            display.textContent = selectedAnswer;
            display.classList.add("has-answer");

            sound.correct();
            showEmoji("🥳");
            burstConfetti(choice);

            nextBtn.disabled = false;

            if (questionIndex === questions.length - 1) {
              setTimeout(finishQuiz, 650);
            }
          } else {
            choice.classList.add("wrong-choice");
            sound.wrong();
            showEmoji("😔");

            setTimeout(() => {
              choice.classList.remove("wrong-choice");
            }, 550);
          }
        });
      });

      prevBtn.addEventListener("click", () => {
        if (currentQuestion <= 0) return;
        showQuestion(currentQuestion - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (!answered[currentQuestion]) return;
        if (currentQuestion < questions.length - 1) {
          showQuestion(currentQuestion + 1);
        }
      });

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
          <span class="icon-big">🎉</span>
          <h2>All Done!</h2>
          <p>Amazing! You got them all right!</p>
          <button class="btn-playagain">
            <i class="fa-solid fa-rotate-right"></i>
            Play again
          </button>
        `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();
          resetQuiz();
        });
      }

      function resetQuiz() {
        for (let i = 0; i < answered.length; i++) {
          answered[i] = false;
        }

        choices.forEach((choice) => {
          choice.disabled = false;
          choice.classList.remove("correct-choice", "wrong-choice", "selected");
        });

        document.querySelectorAll(".answer-display").forEach((display) => {
          display.textContent = "";
          display.classList.remove("has-answer");
        });

        showQuestion(0);
      }

      showQuestion(0);
    })();
  </script>

  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
