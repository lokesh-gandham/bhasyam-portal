<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill in the boxes.</title>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      height: 100vh;
      padding: 12px 20px;
      position: relative;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      min-height: 610px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 30px !important;
    }

    .quiz-heading {
      text-align: center;
      margin-bottom: 12px;
      position: relative;
      z-index: 5;
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #12265d;
      font-size: 48px;
      line-height: 1.1;
      font-weight: 800;
    }

    .target-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: .92em;
      line-height: 1;
    }

    .questions {
      width: 100%;
      position: relative;
      z-index: 5;
    }

    .question-card {
      width: 100%;
      position: relative;
      animation: cardIn .45s ease-out;
    }

    .question-card.hidden {
      display: none;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .question-top {
      min-height: 116px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      padding: 0 10px;
    }

    .question-left {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
    }

    .question-number {
      width: 55px;
      height: 55px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 17px;
      color: #fff;
      font-size: 26px;
      font-weight: 400;
      background: linear-gradient(180deg, #ff931b, #f57b0d);
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .12);
    }

    .question-text {
      color: #2f4f4f;
      font-size: 30px;
      line-height: 1.22;
      font-weight: 400;
      text-align: center;
    }

    /* ===================== BALLOON OPTIONS ===================== */

    .balloon-options {
      height: 280px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(50px, 9vw, 145px);
      position: relative;
      padding: 18px 20px 8px;
    }

    .balloon-option {
      width: 235px;
      height: 260px;
      border: 0;
      background: transparent;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex-direction: column;
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .3s ease, filter .3s ease;
      outline: none;
      isolation: isolate;
      animation: balloonFloat 3.6s ease-in-out infinite;
    }

    /* candy colour sets per balloon */
    .balloon-option:nth-child(1) {
      --balloon-light: #ffd7de;
      --balloon-main: #ff6b81;
      --balloon-dark: #d63e57;
      animation-delay: 0s;
    }

    .balloon-option:nth-child(2) {
      --balloon-light: #cdeeff;
      --balloon-main: #4fc3f7;
      --balloon-dark: #1f92c9;
      animation-delay: -.9s;
    }

    .balloon-option:nth-child(3) {
      --balloon-light: #fff3c4;
      --balloon-main: #ffca4a;
      --balloon-dark: #e29c1a;
      animation-delay: -1.8s;
    }

    .balloon-option:hover:not(:disabled) {
      transform: translateY(-10px) scale(1.035);
    }

    .balloon-option:active:not(:disabled) {
      transform: translateY(3px) scale(.985);
    }

    .balloon-option:focus-visible {
      outline: 4px solid rgba(116, 200, 232, .28);
      outline-offset: 8px;
      border-radius: 30px;
    }

    @keyframes balloonFloat {

      0%,
      100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-9px) rotate(2deg);
      }
    }

    .balloon-body {
      position: relative;
      flex: 0 0 auto;
      width: 170px;
      height: 190px;
      margin: 0 auto;
      border-radius: 50% 50% 48% 48% / 60% 60% 40% 40%;
      background:
        radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .9) 0%, rgba(255, 255, 255, 0) 18%),
        radial-gradient(ellipse at 38% 30%, var(--balloon-light) 0%, var(--balloon-main) 48%, var(--balloon-dark) 100%);
      border: 6px solid var(--balloon-dark);
      box-shadow:
        inset -12px -16px 0 rgba(0, 0, 0, .08),
        0 16px 22px rgba(20, 25, 50, .16);
      transition: box-shadow .3s ease, border-color .3s ease;
    }

    .balloon-shine {
      position: absolute;
      z-index: 3;
      left: 24%;
      top: 15%;
      width: 26%;
      height: 34%;
      border-radius: 50%;
      background: rgba(255, 255, 255, .55);
      transform: rotate(-20deg);
      pointer-events: none;
    }

    .balloon-knot {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 76%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 13px solid var(--balloon-dark);
    }

    .balloon-string {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 79%;
      width: 18px;
      height: 46px;
      transform: translateX(-50%);
      overflow: visible;
      pointer-events: none;
    }

    .balloon-string path {
      fill: none;
      stroke: #a9835a;
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    .balloon-answer {
      position: absolute;
      z-index: 8;
      left: 50%;
      top: 88%;
      transform: translateX(-50%);
      min-width: 205px;
      max-width: 205px;
      padding: 10px 20px 9px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .96);
      color: #17324d;
      border: 3px solid var(--balloon-dark);
      box-shadow:
        0 4px 0 rgba(0, 0, 0, .18),
        0 8px 18px rgba(18, 38, 93, .13);
      font-size: 22px;
      font-weight: 400;
      letter-spacing: .3px;
      backdrop-filter: blur(5px);
      transition: .3s ease;
    }

    /* ---- correct: keeps its own colours, just stays fully lit ---- */
    .balloon-option.correct {
      cursor: default;
      opacity: 1;
      pointer-events: none;
      animation: none;
    }

    /* only the balloon leaves — the answer card stays exactly where it is */
    .balloon-option.flyup .balloon-lift {
      animation: balloonFlyAway 1.7s cubic-bezier(.42, .04, .62, 1) forwards;
    }

    @keyframes balloonFlyAway {
      0% {
        transform: translate(0, 0) rotate(0) scale(1);
        opacity: 1;
      }

      10% {
        transform: translate(0, 16px) rotate(-3deg) scale(.95);
        opacity: 1;
      }

      32% {
        transform: translate(-28px, -150px) rotate(9deg) scale(1.03);
        opacity: 1;
      }

      58% {
        transform: translate(24px, -370px) rotate(-8deg) scale(.92);
        opacity: 1;
      }

      82% {
        transform: translate(-14px, -580px) rotate(7deg) scale(.8);
        opacity: .85;
      }

      100% {
        transform: translate(6px, -780px) rotate(-4deg) scale(.66);
        opacity: 0;
      }
    }

    .balloon-option.flyup .balloon-body {
      animation: balloonSquish 1.7s ease-in-out forwards;
    }

    @keyframes balloonSquish {
      0% {
        transform: scale(1, 1);
      }

      10% {
        transform: scale(1.08, .92);
      }

      28% {
        transform: scale(.94, 1.08);
      }

      60% {
        transform: scale(1.03, .97);
      }

      100% {
        transform: scale(1, 1);
      }
    }

    /* after the flight the balloon stays away until the question is revisited */
    .balloon-option.gone .balloon-lift {
      opacity: 0;
      visibility: hidden;
    }

    .balloon-option.disabled {
      opacity: .4;
      cursor: default;
      animation-play-state: paused;
      pointer-events: none;
    }

    /* ---- wrong: balloon pops ---- */
    .balloon-option.popped {
      pointer-events: none;
      cursor: default;
      animation: balloonJolt .3s ease-out;
    }

    @keyframes balloonJolt {
      0% {
        transform: translate(0, 0) rotate(0);
      }

      30% {
        transform: translate(-4px, 1px) rotate(-2deg);
      }

      60% {
        transform: translate(4px, -1px) rotate(2deg);
      }

      100% {
        transform: translate(0, 0) rotate(0);
      }
    }

    .balloon-option.popped .balloon-body {
      animation: balloonPopSquash .42s ease forwards;
    }

    @keyframes balloonPopSquash {
      0% {
        transform: scale(1, 1);
        opacity: 1;
      }

      22% {
        transform: scale(1.22, .78) rotate(-2deg);
        opacity: 1;
      }

      50% {
        transform: scale(.4, .4) rotate(6deg);
        opacity: .55;
      }

      100% {
        transform: scale(.05, .05) rotate(10deg);
        opacity: 0;
      }
    }

    .balloon-option.popped .balloon-shine,
    .balloon-option.popped .balloon-knot,
    .balloon-option.popped .balloon-string {
      animation: fadeOutQuick .22s ease forwards;
    }

    @keyframes fadeOutQuick {
      to {
        opacity: 0;
      }
    }

    .balloon-option.popped .balloon-answer {
      opacity: .4;
      text-decoration: line-through;
      transition: .25s ease;
    }

    /* piece flung out when a balloon pops */
    .pop-piece {
      position: fixed;
      z-index: 9500;
      border-radius: 50% 50% 50% 4%;
      pointer-events: none;
      animation: popPieceFly .6s ease-out forwards;
    }

    @keyframes popPieceFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(var(--px), var(--py)) rotate(var(--pr)) scale(.3);
      }
    }

    .answer-fly {
      position: fixed;
      z-index: 12000;
      margin: 0;
      pointer-events: none;
      border-radius: 10px;
      background: #fff;
      border: 3px solid #4caf67;
      color: #24673a;
      padding: 7px 15px;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 7px 20px rgba(35, 96, 55, .22);
      transform-origin: center;
      animation: flyToBlank .65s cubic-bezier(.2, .75, .25, 1) forwards;
    }

    @keyframes flyToBlank {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }

      35% {
        opacity: 1;
        transform: translate(var(--mid-x), var(--mid-y)) scale(1.08);
      }

      100% {
        opacity: .15;
        transform: translate(var(--end-x), var(--end-y)) scale(.78);
      }
    }

    .question-answer {
      display: inline-flex;
      min-width: 145px;
      min-height: 42px;
      padding: 3px 12px;
      margin: 0 5px;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      border: 3px dashed #8ab4f8;
      border-radius: 12px;
      background: #f4f9ff;
      color: #24673a;
      transition: .3s ease;
    }

    .question-answer.filled {
      border-style: solid;
      border-color: #4caf67;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(76, 175, 103, .12);
    }

    .nav {
      margin: 16px auto 0;
      padding-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      position: relative;
      z-index: 20;
      width: 100%;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    .progress {
      min-width: 52px;
      text-align: center;
      color: #12265d;
      font-size: 14px;
      font-weight: 800;
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    @media screen and (min-width: 1025px) and (max-width: 1600px) {
      .quiz-wrap {
        max-width: 1380px;
      }

      .quiz-heading h1 {
        font-size: 30px;
      }

      .instruction {
        font-size: 17px;
      }

      .question-top {
        min-height: 125px;
      }

      .question-number {
        width: 55px;
        height: 55px;
        font-size: 26px;
      }

      .question-text {
        font-size: 30px;
      }

      .balloon-options {
        min-height: 315px;
      }

      .balloon-option {
        width: 210px;
        height: 280px;
      }

      .balloon-body {
        width: 155px;
        height: 175px;
      }

      .nav {
        gap: 30px;
      }

      .nav button {
        width: 150px;
        min-width: 150px;
        height: 55px;
        padding: 0;
        font-size: 20px;
      }

      .progress {
        font-size: 16px;
      }
    }

    @media screen and (min-width: 1601px) and (max-width: 1920px) {

      body {
        width: 100%;
        min-height: 100vh;
        padding: clamp(24px, 1.5vw, 38px) clamp(24px, 1.2vw, 40px);
        overflow: hidden;
      }

      .quiz-wrap {
        width: min(98vw, 1840px);
        max-width: 1840px;
        min-height: clamp(700px, 43vw, 850px);
        gap: clamp(32px, 2vw, 44px) !important;
      }

      .quiz-heading {
        width: 100%;
        margin-bottom: clamp(18px, 1.3vw, 28px);
      }

      .questions {
        width: 100%;
      }

      .question-card {
        width: 100%;
      }

      .question-top {
        width: 100%;
        min-height: clamp(155px, 9vw, 185px);
        padding: clamp(28px, 2vw, 42px) clamp(40px, 4vw, 80px);
        gap: clamp(24px, 2vw, 38px);
        padding: 0px;
      }

      .question-left {
        width: 100%;
        gap: clamp(24px, 1.6vw, 32px);
      }

      .question-number {
        width: 60px;
        height: 60px;
        font-size: 30px;
        border-radius: clamp(18px, 1.2vw, 24px);
      }

      .question-text {
        max-width: none;
      }

      .question-answer {
        min-height: 100px;
        min-width: 200px;
      }

      .balloon-options {
        width: 100%;
        height: clamp(330px, 20vw, 390px);
        padding: clamp(20px, 1.5vw, 30px) clamp(20px, 2vw, 40px) clamp(10px, 1vw, 18px);
        gap: clamp(70px, 8vw, 150px);
        margin-block: 30px;
      }

      .balloon-option {
        width: clamp(225px, 14vw, 270px);
        height: clamp(300px, 18vw, 350px);
      }

      .balloon-body {
        width: clamp(155px, 9.6vw, 190px);
        height: clamp(175px, 11vw, 215px);
      }

      .balloon-answer {
        min-width: clamp(205px, 13vw, 245px);
        max-width: clamp(205px, 13vw, 245px);
        padding: clamp(10px, .7vw, 14px) clamp(20px, 1.3vw, 28px);
      }

      .nav {
        width: 100%;
        margin-top: 30px !important;
        padding-top: clamp(16px, 1vw, 24px);
        gap: clamp(32px, 2vw, 48px);
      }

      .nav button {
        width: clamp(155px, 9vw, 185px);
        min-width: clamp(155px, 9vw, 185px);
        height: clamp(58px, 3.8vw, 70px);
        padding: 0;
      }

      .progress {
        min-width: clamp(60px, 4vw, 78px);
      }
    }


    @media screen and (min-width: 1921px) {

      body {
        width: 100%;
        min-height: 100vh;
        padding: clamp(28px, 1.5vw, 46px) clamp(28px, 1.5vw, 55px);
        overflow: hidden;
      }

      .quiz-wrap {
        width: min(98vw, 2250px);
        max-width: 2250px;
        min-height: clamp(780px, 43vw, 1050px);
        gap: clamp(38px, 2vw, 52px) !important;
      }

      .quiz-heading {
        width: 100%;
        margin-bottom: clamp(22px, 1.5vw, 34px);
      }

      .questions {
        width: 100%;
      }

      .question-card {
        width: 100%;
      }

      .question-top {
        width: 100%;
        min-height: clamp(180px, 9vw, 220px);
        padding: clamp(36px, 2.2vw, 52px) clamp(55px, 4.5vw, 105px);
        gap: clamp(28px, 2vw, 44px);
      }

      .question-left {
        width: 100%;
        gap: clamp(28px, 1.7vw, 40px);
      }

      .question-number {
        width: 60px;
        height: 60px;
        font-size: 30px;
        border-radius: clamp(18px, 1.2vw, 24px);
      }

      .question-text {
        max-width: none;
      }

      .balloon-options {
        width: 100%;
        height: clamp(390px, 21vw, 480px);
        padding: clamp(24px, 1.5vw, 36px) clamp(30px, 2vw, 55px) clamp(12px, 1vw, 22px);
        gap: clamp(90px, 9vw, 180px);
      }

      .balloon-option {
        width: clamp(250px, 14vw, 310px);
        height: clamp(360px, 19vw, 430px);
      }

      .balloon-body {
        width: clamp(175px, 10.5vw, 215px);
        height: clamp(200px, 12vw, 245px);
      }

      .balloon-answer {
        min-width: clamp(225px, 13vw, 285px);
        max-width: clamp(225px, 13vw, 285px);
        padding: clamp(11px, .7vw, 16px) clamp(22px, 1.3vw, 32px);
      }

      .nav {
        width: 100%;
        margin-top: clamp(32px, 1.8vw, 46px);
        padding-top: clamp(18px, 1vw, 28px);
        gap: clamp(38px, 2vw, 58px);
      }

      .nav button {
        width: clamp(175px, 8.5vw, 215px);
        min-width: clamp(175px, 8.5vw, 215px);
        height: clamp(64px, 3.5vw, 78px);
        padding: 0;
      }

      .progress {
        min-width: clamp(68px, 3.5vw, 88px);
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 10px 14px;
      }

      .quiz-wrap {
        min-height: 520px;
      }

      .quiz-heading {
        margin-bottom: 10px;
      }

      .instruction {
        font-size: 14px;
        margin-bottom: 12px;
      }

      .quiz-heading h1 {

  <script>        function speak(t) {
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-US";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }
    (() => {
      const questions = [
        { answer: "subtraction", answered: false },
        { answer: "difference", answered: false },
        { answer: "−", answered: false },
        { answer: "subtrahend", answered: false },
        { answer: "minuend", answered: false }
      ];

      const cards = document.querySelectorAll(".question-card");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const blanks = document.querySelectorAll(".question-answer");

      let currentQuestion = 0;
      let audioCtx = null;

      const quizWrap = document.querySelector(".quiz-wrap");

      function fitQuizToScreen() {
        quizWrap.style.transform = "translate(-50%, -50%)";
        const rect = quizWrap.getBoundingClientRect();
        const availableH = window.innerHeight - 16;
        const availableW = window.innerWidth - 16;
        const scale = Math.min(availableH / rect.height, availableW / rect.width);
        quizWrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }

      window.addEventListener("resize", fitQuizToScreen);
      window.addEventListener("load", fitQuizToScreen);

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc", "#ff4e83", "#4e8ff0",
              "#76b93b", "#f4ae25", "#4ecdc4"
            ]
          });
        }
      }

      // small burst of the balloon's own colour when it pops
      function burstPop(option) {
        const body = option.querySelector(".balloon-body");
        const rect = body.getBoundingClientRect();
        const mainColor = getComputedStyle(option).getPropertyValue("--balloon-main").trim() || "#ff6b81";

        // a few little rubbery pieces flung outward from the balloon
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        for (let i = 0; i < 6; i++) {
          const piece = document.createElement("span");
          piece.className = "pop-piece";
          const size = 8 + Math.random() * 8;
          piece.style.width = `${size}px`;
          piece.style.height = `${size * 1.3}px`;
          piece.style.background = mainColor;
          piece.style.left = `${cx - size / 2}px`;
          piece.style.top = `${cy - size / 2}px`;

          const angle = (Math.PI * 2 * i) / 6 + (Math.random() - .5);
          const dist = 55 + Math.random() * 50;
          piece.style.setProperty("--px", `${Math.cos(angle) * dist}px`);
          piece.style.setProperty("--py", `${Math.sin(angle) * dist - 20}px`);
          piece.style.setProperty("--pr", `${(Math.random() - .5) * 260}deg`);

          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 650);
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);
        setTimeout(() => element.remove(), 1600);
      }

      function getOptions(index = currentQuestion) {
        return cards[index].querySelectorAll(".balloon-option");
      }

      function resetOptionVisuals(index) {
        getOptions(index).forEach(option => {
          option.disabled = false;
          option.classList.remove("correct", "disabled", "popped", "flyup", "gone");
        });
      }

      function showQuestion(index) {
        currentQuestion = index;

        cards.forEach((card, i) => {
          card.classList.toggle("hidden", i !== index);
        });

        cards.forEach((card, i) => {
          if (i !== index) return;

          const options = card.querySelectorAll(".balloon-option");

          if (!questions[i].answered) {
            resetOptionVisuals(i);
          } else {
            options.forEach(option => {
              option.disabled = true;
              option.classList.remove("flyup", "gone");
              if (option.dataset.answer === questions[i].answer) {
                option.classList.add("correct");
              } else {
                option.classList.add("disabled");
              }
            });
          }
        });

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !questions[index].answered;

        requestAnimationFrame(fitQuizToScreen);
      }

      function displayAnswer(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function flyAnswerToBlank(index, option) {
        const blank = blanks[index];
        if (!blank) return;

        const source = option.getBoundingClientRect();
        const target = blank.getBoundingClientRect();

        const chip = document.createElement("span");
        chip.className = "answer-fly";
        chip.textContent = displayAnswer(option.dataset.answer);

        const startX = source.left + source.width / 2;
        const startY = source.top + source.height / 2;
        const endX = target.left + target.width / 2;
        const endY = target.top + target.height / 2;

        chip.style.left = `${startX - chip.offsetWidth / 2}px`;
        chip.style.top = `${startY - chip.offsetHeight / 2}px`;
        chip.style.setProperty("--mid-x", `${(endX - startX) * .38}px`);
        chip.style.setProperty("--mid-y", `${(endY - startY) * .38 - 45}px`);
        chip.style.setProperty("--end-x", `${endX - startX}px`);
        chip.style.setProperty("--end-y", `${endY - startY}px`);

        document.body.appendChild(chip);

        setTimeout(() => {
          blank.textContent = displayAnswer(option.dataset.answer);
          blank.classList.add("filled");
          chip.remove();
        }, 560);
      }

      function chooseAnswer(index, option) {
        if (index !== currentQuestion || questions[index].answered) return;

        const selected = option.dataset.answer;
        const state = questions[index];

        if (selected === state.answer) {
          state.answered = true;

          option.disabled = true;
          option.classList.add("correct", "flyup");

          // the flight is a one-off: strip it so a revisit shows the balloon in place
          setTimeout(() => {
            option.classList.remove("flyup");
            option.classList.add("gone");
          }, 1700);

          flyAnswerToBlank(index, option);

          getOptions(index).forEach(other => {
            if (other !== option) {
              other.disabled = true;
              other.classList.add("disabled");
            }
          });

          nextBtn.disabled = false;

          // sound.correct();
          speak("Correct!");
          showEmoji("🥳");
          burstConfetti(option);

          if (index === questions.length - 1) {
            setTimeout(finishQuiz, 1900);
          }
        } else {
          option.disabled = true;
          option.classList.add("popped");

          // sound.wrong();
          speak("Wrong!");
          showEmoji("😔");
          burstPop(option);

          setTimeout(() => {
            option.classList.remove("popped");
            option.disabled = false;
          }, 850);
        }
      }

      cards.forEach((card, index) => {
        card.querySelectorAll(".balloon-option").forEach(option => {
          option.addEventListener("click", () => chooseAnswer(index, option));
        });
      });

      prevBtn.addEventListener("click", () => {
        if (currentQuestion > 0) {
          showQuestion(currentQuestion - 1);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (!questions[currentQuestion].answered) return;

        if (currentQuestion < questions.length - 1) {
          showQuestion(currentQuestion + 1);
        }
      });

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
          <span class="icon-big">🎉</span>
          <h2>All Done!</h2>
          <p>Amazing! You got them all right!</p>
          <button class="btn-playagain" type="button">
            <i class="fa-solid fa-rotate-right"></i>
            Play again
          </button>
        `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();
          resetQuiz();
        });
      }

      function resetQuiz() {
        questions.forEach(state => {
          state.answered = false;
        });

        blanks.forEach(blank => {
          blank.textContent = "";
          blank.classList.remove("filled");
        });

        cards.forEach((card, index) => {
          if (index === 0) return;
          card.querySelectorAll(".balloon-option").forEach(option => {
            option.disabled = false;
            option.classList.remove("correct", "disabled", "popped", "flyup", "gone");
          });
        });

        showQuestion(0);
      }

      showQuestion(0);
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
