<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill in the boxes.</title>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      height: 100vh;
      padding: 12px 20px;
      position: relative;
      overflow: hidden;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      min-height: 610px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 30px !important;
    }

    .quiz-heading {
      text-align: center;
      margin-bottom: 12px;
      position: relative;
      z-index: 5;
    }

    .quiz-heading h1 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #12265d;
      font-size: 48px;
      line-height: 1.1;
      font-weight: 800;
    }

    .target-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: .92em;
      line-height: 1;
    }

    .questions {
      width: 100%;
      position: relative;
      z-index: 5;
    }

    .question-card {
      width: 100%;
      position: relative;
      animation: cardIn .45s ease-out;
    }

    .question-card.hidden {
      display: none;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .question-top {
      min-height: 116px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      padding: 0 10px;
    }

    .question-left {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
    }

    .question-number {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 17px;
      color: #fff;
      font-size: 25px;
      font-weight: 400;
      background: linear-gradient(180deg, #ff931b, #f57b0d);
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .12);
    }

    .question-text {
      color: #2f4f4f;
      font-size: 30px;
      line-height: 1.22;
      font-weight: 400;
      text-align: center;
    }

    .mirror-options {
      height: 280px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(50px, 9vw, 145px);
      position: relative;
      padding: 18px 20px 8px;
    }

    .mirror-option {
      --frame-gold: #d99b2b;
      width: 235px;
      height: 260px;
      border: 0;
      background: transparent;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-direction: column;
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .3s ease, filter .3s ease;
      outline: none;
      isolation: isolate;
      animation: mirrorFloat 3.6s ease-in-out infinite;
    }

    .mirror-option:nth-child(2) {
      animation-delay: -.9s;
    }

    .mirror-option:nth-child(3) {
      animation-delay: -1.8s;
    }

    .mirror-option:hover:not(:disabled) {
      transform: translateY(-10px) scale(1.035);
    }

    .mirror-option:active:not(:disabled) {
      transform: translateY(3px) scale(.985);
    }

    .mirror-option:focus-visible {
      outline: 4px solid rgba(116, 200, 232, .28);
      outline-offset: 8px;
      border-radius: 30px;
    }

    @keyframes mirrorFloat {

      0%,
      100% {
        transform: translateY(0) rotate(-.4deg);
      }

      50% {
        transform: translateY(-7px) rotate(.4deg);
      }
    }

    .mirror-frame {
      position: relative;
      flex: 0 0 auto;
      width: 170px;
      height: 210px;
      border-radius: 49% 49% 45% 45% / 40% 40% 52% 52%;
      background: linear-gradient(145deg, #fff8dc 0%, #e8b447 38%, #c98516 74%, #f4cf69 100%);
      border: 5px solid var(--frame-gold);
      box-shadow:
        inset 0 0 0 3px #f9dc82,
        inset 0 0 0 7px #b97912,
        0 9px 0 #a96d12,
        0 15px 25px rgba(35, 48, 62, .16);
      transform: perspective(600px) rotateX(3deg);
      overflow: hidden;
      transition: box-shadow .35s ease, border-color .35s ease, transform .35s ease;
    }

    .mirror-frame::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: inherit;
      background:
        linear-gradient(126deg,
          rgba(255, 255, 255, .82) 0 10%,
          rgba(255, 255, 255, .18) 10.5% 15%,
          transparent 15.5% 100%),
        linear-gradient(155deg, #d8f3ff 0%, #8bd4ef 43%, #69b9dd 100%);
      border: 3px solid rgba(255, 255, 255, .82);
      box-shadow:
        inset 0 0 22px rgba(43, 114, 151, .20),
        inset 0 0 0 2px rgba(52, 129, 164, .15);
    }

    .mirror-frame::after {
      content: "";
      position: absolute;
      z-index: 3;
      width: 45%;
      height: 145%;
      left: -65%;
      top: -25%;
      background: linear-gradient(105deg,
          transparent 0%,
          rgba(255, 255, 255, .05) 35%,
          rgba(255, 255, 255, .72) 50%,
          rgba(255, 255, 255, .08) 65%,
          transparent 100%);
      transform: rotate(13deg);
      animation: glassSweep 3.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glassSweep {

      0%,
      32% {
        left: -70%;
        opacity: 0;
      }

      45% {
        opacity: 1;
      }

      72%,
      100% {
        left: 120%;
        opacity: 0;
      }
    }

    .mirror-shine {
      position: absolute;
      z-index: 5;
      width: 36px;
      height: 36px;
      left: calc(50% - 48px);
      top: 55px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .9);
      opacity: .9;
      clip-path: polygon(50% 0, 60% 39%, 100% 50%, 60% 61%, 50% 100%, 40% 61%, 0 50%, 40% 39%);
      animation: shinePulse 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes shinePulse {

      0%,
      100% {
        transform: scale(.9);
        opacity: .7;
      }

      50% {
        transform: scale(1.13);
        opacity: 1;
      }
    }

    .mirror-option::before {
      content: "";
      position: absolute;
      z-index: 1;
      width: 28px;
      height: 47px;
      left: 50%;
      top: 203px;
      transform: translateX(-50%);
      border-radius: 5px 5px 10px 10px;
      background: linear-gradient(90deg, #b97813, #f5c94f 42%, #d38a16);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .28);
    }

    .mirror-option::after {
      content: "";
      position: absolute;
      z-index: 0;
      width: 178px;
      height: 15px;
      left: 50%;
      top: 243px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(180deg, #f6d061, #d58b18);
      border: 3px solid #c27b10;
      box-shadow:
        0 6px 0 #a96d12,
        0 12px 18px rgba(18, 38, 93, .13);
    }

    .mirror-answer {
      position: absolute;
      z-index: 8;
      left: 50%;
      top: 226px;
      transform: translateX(-50%);
      min-width: 205px;
      max-width: 205px;
      padding: 10px 20px 9px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .95);
      color: #17324d;
      border: 3px solid #d99b2b;
      box-shadow:
        0 4px 0 rgba(137, 91, 12, .34),
        0 8px 18px rgba(18, 38, 93, .13);
      font-size: 22px;
      font-weight: 400;
      letter-spacing: .3px;
      backdrop-filter: blur(5px);
      transition: .3s ease;
    }

    .mirror-option.correct {
      cursor: default;
      animation: correctMirror .7s ease forwards;
    }

    @keyframes correctMirror {
      0% {
        transform: translateY(0) scale(1);
      }

      55% {
        transform: translateY(-10px) scale(1.05);
      }

      100% {
        transform: translateY(-6px) scale(1.025);
      }
    }

    .mirror-option.correct .mirror-frame {
      border-color: #4caf67;
      box-shadow:
        inset 0 0 0 3px #c9f5d4,
        inset 0 0 0 7px #368f50,
        0 0 0 4px rgba(76, 175, 103, .14),
        0 0 28px rgba(76, 175, 103, .34),
        0 10px 0 #2f8148,
        0 18px 30px rgba(35, 96, 55, .18);
    }

    .mirror-option.correct .mirror-frame::before {
      background:
        linear-gradient(126deg, rgba(255, 255, 255, .9) 0 10%, rgba(255, 255, 255, .2) 10.5% 15%, transparent 15.5% 100%),
        linear-gradient(155deg, #dff9e6 0%, #a9dfba 45%, #83c99b 100%);
    }

    .mirror-option.correct .mirror-answer {
      border-color: #4caf67;
      color: #24673a;
      box-shadow:
        0 4px 0 rgba(47, 129, 72, .45),
        0 0 20px rgba(76, 175, 103, .24);
    }

    .mirror-option.disabled {
      opacity: .30;
      filter: grayscale(.7);
      cursor: default;
      animation-play-state: paused;
      transform: scale(.94);
      pointer-events: none;
    }

    .mirror-option.broken {
      pointer-events: none;
      cursor: default;
      animation: glassImpact .28s ease-out forwards !important;
    }

    .mirror-option.broken .mirror-frame {
      animation: glassBodyFlash .72s ease-out forwards;
    }

    .mirror-option.broken .mirror-frame::before {
      animation: glassFracture .72s ease-out forwards;
    }

    .mirror-option.broken .mirror-answer {
      opacity: .45;
      transform: translateX(-50%) scale(.92);
      text-decoration: line-through;
    }

    .crack {
      position: absolute;
      z-index: 10;
      left: 50%;
      top: 43px;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .crack::before,
    .crack::after {
      content: "";
      position: absolute;
      display: block;
      width: 48px;
      height: 75px;
      background: linear-gradient(135deg,
          rgba(255, 255, 255, .82),
          rgba(166, 229, 249, .28) 52%,
          rgba(255, 255, 255, .68));
      border: 2px solid rgba(255, 255, 255, .82);
      clip-path: polygon(50% 0, 100% 28%, 72% 100%, 28% 72%, 0 25%);
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, .75));
      opacity: 0;
    }

    .crack::before {
      left: -72px;
      top: 5px;
      transform: rotate(-24deg) scale(.4);
    }

    .crack::after {
      left: 20px;
      top: 18px;
      transform: rotate(29deg) scale(.4);
    }

    .mirror-option.broken .crack {
      opacity: 1;
      animation: shardAppear .42s ease-out forwards;
    }

    .mirror-option.broken .crack::before {
      animation: shardLeft .72s cubic-bezier(.15, .75, .25, 1) forwards;
    }

    .mirror-option.broken .crack::after {
      animation: shardRight .72s cubic-bezier(.15, .75, .25, 1) forwards;
    }

    @keyframes glassImpact {
      0% {
        transform: translate(0, 0) rotate(0) scale(1);
      }

      18% {
        transform: translate(-6px, 1px) rotate(-2deg) scale(1.025);
      }

      36% {
        transform: translate(7px, -1px) rotate(2deg) scale(1.018);
      }

      55% {
        transform: translate(-4px, 2px) rotate(-1deg) scale(1);
      }

      100% {
        transform: translate(0, 0) rotate(0) scale(1);
      }
    }

    @keyframes glassBodyFlash {
      0% {
        filter: brightness(1);
      }

      22% {
        filter: brightness(1.45) saturate(1.15);
        box-shadow:
          inset 0 0 0 3px #ffffff,
          inset 0 0 0 7px #c8edf9,
          0 0 28px rgba(139, 220, 248, .85),
          0 0 55px rgba(139, 220, 248, .45),
          0 9px 0 #a96d12;
      }

      48% {
        filter: brightness(.78) saturate(.75);
      }

      100% {
        filter: brightness(1) saturate(1);
      }
    }

    @keyframes glassFracture {
      0% {
        opacity: 1;
        filter: brightness(1);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }

      35% {
        opacity: .92;
        filter: brightness(1.2);
        clip-path: polygon(0 0, 27% 18%, 45% 7%, 63% 25%, 100% 9%,
            88% 44%, 100% 67%, 71% 58%, 57% 100%,
            34% 77%, 9% 100%, 17% 56%, 0 39%);
      }

      62% {
        opacity: .64;
        clip-path: polygon(0 0, 27% 18%, 45% 7%, 63% 25%, 100% 9%,
            88% 44%, 100% 67%, 71% 58%, 57% 100%,
            34% 77%, 9% 100%, 17% 56%, 0 39%);
      }

      100% {
        opacity: 1;
        filter: brightness(1);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
    }

    @keyframes shardAppear {
      0% {
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      75% {
        opacity: .8;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes shardLeft {
      0% {
        opacity: 0;
        transform: rotate(-24deg) scale(.35) translate(0, 0);
      }

      18% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: rotate(-40deg) scale(1) translate(-34px, 24px);
      }
    }

    @keyframes shardRight {
      0% {
        opacity: 0;
        transform: rotate(29deg) scale(.35) translate(0, 0);
      }

      18% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: rotate(48deg) scale(1) translate(38px, 28px);
      }
    }

    .answer-fly {
      position: fixed;
      z-index: 12000;
      margin: 0;
      pointer-events: none;
      border-radius: 10px;
      background: #fff;
      border: 3px solid #4caf67;
      color: #24673a;
      padding: 7px 15px;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 7px 20px rgba(35, 96, 55, .22);
      transform-origin: center;
      animation: flyToBlank .65s cubic-bezier(.2, .75, .25, 1) forwards;
    }

    @keyframes flyToBlank {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }

      35% {
        opacity: 1;
        transform: translate(var(--mid-x), var(--mid-y)) scale(1.08);
      }

      100% {
        opacity: .15;
        transform: translate(var(--end-x), var(--end-y)) scale(.78);
      }
    }

    .question-answer {
      display: inline-flex;
      min-width: 145px;
      min-height: 42px;
      padding: 3px 12px;
      margin: 0 5px;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      border: 3px dashed #8ab4f8;
      border-radius: 12px;
      background: #f4f9ff;
      color: #24673a;
      transition: .3s ease;
    }

    .question-answer.filled {
      border-style: solid;
      border-color: #4caf67;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(76, 175, 103, .12);
    }

    .nav {
      margin: 16px auto 0;
      padding-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      position: relative;
      z-index: 20;
      width: 100%;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    .progress {
      min-width: 52px;
      text-align: center;
      color: #12265d;
      font-size: 14px;
      font-weight: 800;
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        max-width: 1380px;
      }

      .quiz-heading h1 {
        font-size: 30px;
      }

      .instruction {
        font-size: 17px;
      }

      .question-top {
        min-height: 125px;
      }

      .question-number {
        width: 62px;
        height: 62px;
        font-size: 28px;
      }

      .question-text {
        font-size: 30px;
      }

      .mirror-options {
        min-height: 315px;
      }

      .mirror-option {
        width: 210px;
        height: 280px;
      }

      .nav {
        gap: 30px;
      }

      .nav button {
        width: 150px;
        min-width: 150px;
        height: 55px;
        padding: 0;
        font-size: 20px;
      }

      .progress {
        font-size: 16px;
      }
    }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .quiz-wrap {
        max-width: 1600px;
      }

      .quiz-heading {
        margin-bottom: 14px;
      }

      .instruction {
        font-size: 19px;
        margin-bottom: 22px;
      }

      .quiz-heading h1 {
        font-size: 40px;
      }

      .question-top {
        min-height: 145px;
        gap: 24px;
      }

      .question-left {
        gap: 22px;
      }

      .question-number {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        font-size: 32px;
      }

      .question-text {
        font-size: 40px;
      }

      .mirror-options {
        min-height: 330px;
        gap: 100px;
      }

      .mirror-option {
        width: 225px;
        height: 290px;
      }

      .mirror-answer {
        font-size: 26px;
      }

      .nav {
        margin-top: 32px;
        padding-top: 24px;
        gap: 35px;
      }

      .nav button {
        width: 160px;
        min-width: 160px;
        height: 58px;
        padding: 0;
        font-size: 22px;
      }

      .progress {
        min-width: 60px;
        font-size: 18px;
      }
    }

    @media screen and (min-width: 1921px) {
      .quiz-wrap {
        max-width: 1750px;
      }

      .instruction {
        font-size: 21px;
        margin-bottom: 25px;
      }

      .quiz-heading h1 {
        font-size: 40px;
      }

      .question-top {
        min-height: 160px;
        gap: 28px;
      }

      .question-left {
        gap: 26px;
      }

      .question-number {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        font-size: 36px;
      }

      .question-text {
        font-size: 40px;
      }

      .mirror-options {
        min-height: 360px;
        gap: 135px;
      }

<body>
  <main class="quiz-wrap">

    <header class="quiz-heading">
      <h1>
        <span class="target-icon">🎯</span>
        Fill in the boxes.
      </h1>
    </header>
    <section class="questions" aria-live="polite">

      <article class="question-card" data-question="0">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">1.</div>
            <div class="question-text"><span class="question-answer" id="blank-0"></span> means taking away.
            </div>
          </div>
        </div>

        <div class="mirror-options">
          <button class="mirror-option" type="button" data-answer="subtraction" aria-label="Subtraction">
            <span class="mirror-frame"></span>
            <span class="mirror-shine"></span>
            <span class="mirror-answer">Subtraction</span>
            <span class="crack"></span>
          </button>

          <button class="mirror-option" type="button" data-answer="addition" aria-label="Addition">
            <span class="mirror-frame"></span>

          <button class="mirror-option" type="button" data-answer="multiplication" aria-label="Multiplication">
            <span class="mirror-frame"></span>
            <span class="mirror-shine"></span>
            <span class="mirror-answer">Multiplication</span>
            <span class="crack"></span>
          </button>

      </article>

      <article class="question-card hidden" data-question="1">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">2.</div>
            <div class="question-text">The result in subtraction is called <span class="question-answer"
                id="blank-1"></span>.</div>
          </div>
        </div>

        <div class="mirror-options">
          <button class="mirror-option" type="button" data-answer="difference" aria-label="Difference">
            <span class="mirror-frame"></span>
            <span class="mirror-shine"></span>
            <span class="mirror-answer">Difference</span>
            <span class="crack"></span>
          </button>

          <button class="mirror-option" type="button" data-answer="sum" aria-label="Sum">
            <span class="mirror-frame"></span>
            <span class="mirror-shine"></span>
            <span class="mirror-answer">Sum</span>
            <span class="crack"></span>
          </button>

          <button class="mirror-option" type="button" data-answer="product" aria-label="Product">
            <span class="mirror-frame"></span>
            <span class="mirror-shine"></span>
            <span class="mirror-answer">Product</span>
            <span class="crack"></span>
          </button>
        </div>
      </article>

      <article class="question-card hidden" data-question="2">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">3.</div>
            <div class="question-text">The symbol used to represent subtraction is <span class="question-answer"
                id="blank-2"></span>.</div>
          </div>
        </div>

        <div class="mirror-options">
          <button class="mirror-option" type="button" data-answer="+" aria-label="Plus">
            <span class="mirror-frame"></span>
            <span class="mirror-shine"></span>
            <span class="mirror-answer">+</span>

          <button class="mirror-option" type="button" data-answer="−" aria-label="Minus">

            <span class="mirror-answer">−</span>

          <button class="mirror-option" type="button" data-answer="×" aria-label="Multiply">
            <span class="mirror-frame"></span>

          </button>

      </article>

      <article class="question-card hidden" data-question="3">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">4.</div>
            <div class="question-text">The number that is subtracted is called <span class="question-answer"
                id="blank-3"></span>.</div>
          </div>
        </div>

        <div class="mirror-options">
          <button class="mirror-option" type="button" data-answer="subtrahend" aria-label="Subtrahend">
            <span class="mirror-frame"></span>
            <span class="mirror-shine"></span>
            <span class="mirror-answer">Subtrahend</span>
            <span class="crack"></span>
          </button>

          <button class="mirror-option" type="button" data-answer="minuend" aria-label="Minuend">
            <span class="mirror-frame"></span>
            <span class="mirror-shine"></span>
            <span class="mirror-answer">Minuend</span>
            <span class="crack"></span>
          </button>

          <button class="mirror-option" type="button" data-answer="difference" aria-label="Difference">
            <span class="mirror-frame"></span>
            <span class="mirror-shine"></span>
            <span class="mirror-answer">Difference</span>
            <span class="crack"></span>
          </button>
        </div>
      </article>

      <article class="question-card hidden" data-question="4">
        <div class="question-top">
          <div class="question-left">
            <div class="question-number">5.</div>
            <div class="question-text">The number from which any number is subtracted is called <span
                class="question-answer" id="blank-4"></span>.</div>
          </div>
        </div>

        <div class="mirror-options">
          <button class="mirror-option" type="button" data-answer="minuend" aria-label="Minuend">
            <span class="mirror-frame"></span>
            <span class="mirror-shine"></span>
            <span class="mirror-answer">Minuend</span>
            <span class="crack"></span>
          </button>

          <button class="mirror-option" type="button" data-answer="subtrahend" aria-label="Subtrahend">
            <span class="mirror-frame"></span>
            <span class="mirror-shine"></span>
            <span class="mirror-answer">Subtrahend</span>
            <span class="crack"></span>
          </button>

          <button class="mirror-option" type="button" data-answer="difference" aria-label="Difference">
            <span class="mirror-frame"></span>
            <span class="mirror-shine"></span>
            <span class="mirror-answer">Difference</span>
            <span class="crack"></span>
          </button>
        </div>
      </article>

    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" type="button" disabled>
        <i class="fa-solid fa-chevron-left"></i> Prev
      </button>

      <button id="nextBtn" type="button" disabled>
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {
      const questions = [
        { answer: "subtraction", answered: false },
        { answer: "difference", answered: false },
        { answer: "−", answered: false },
        { answer: "subtrahend", answered: false },
        { answer: "minuend", answered: false }
      ];

      const cards = document.querySelectorAll(".question-card");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const blanks = document.querySelectorAll(".question-answer");

      let currentQuestion = 0;
      let audioCtx = null;

      const quizWrap = document.querySelector(".quiz-wrap");

      function fitQuizToScreen() {
        quizWrap.style.transform = "translate(-50%, -50%)";
        const rect = quizWrap.getBoundingClientRect();
        const availableH = window.innerHeight - 16;
        const availableW = window.innerWidth - 16;
        const scale = Math.min(availableH / rect.height, availableW / rect.width);
        quizWrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }

      window.addEventListener("resize", fitQuizToScreen);
      window.addEventListener("load", fitQuizToScreen);

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc", "#ff4e83", "#4e8ff0",
              "#76b93b", "#f4ae25", "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);
        setTimeout(() => element.remove(), 1600);
      }

      function getOptions(index = currentQuestion) {
        return cards[index].querySelectorAll(".mirror-option");
      }

      function resetOptionVisuals(index) {
        getOptions(index).forEach(option => {
          option.disabled = false;
          option.classList.remove("correct", "disabled", "broken");
        });
      }

      function showQuestion(index) {
        currentQuestion = index;

        cards.forEach((card, i) => {
          card.classList.toggle("hidden", i !== index);
        });

        cards.forEach((card, i) => {
          if (i !== index) return;

          const options = card.querySelectorAll(".mirror-option");

          if (!questions[i].answered) {
            resetOptionVisuals(i);
          } else {
            options.forEach(option => {
              option.disabled = true;
              if (option.dataset.answer === questions[i].answer) {
                option.classList.add("correct");
              } else {
                option.classList.add("disabled");
              }
            });
          }
        });

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !questions[index].answered;

        requestAnimationFrame(fitQuizToScreen);
      }

      function displayAnswer(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function flyAnswerToBlank(index, option) {
        const blank = blanks[index];
        if (!blank) return;

        const source = option.getBoundingClientRect();
        const target = blank.getBoundingClientRect();

        const chip = document.createElement("span");
        chip.className = "answer-fly";
        chip.textContent = displayAnswer(option.dataset.answer);

        const startX = source.left + source.width / 2;
        const startY = source.top + source.height / 2;
        const endX = target.left + target.width / 2;
        const endY = target.top + target.height / 2;

        chip.style.left = `${startX - chip.offsetWidth / 2}px`;
        chip.style.top = `${startY - chip.offsetHeight / 2}px`;
        chip.style.setProperty("--mid-x", `${(endX - startX) * .38}px`);
        chip.style.setProperty("--mid-y", `${(endY - startY) * .38 - 45}px`);
        chip.style.setProperty("--end-x", `${endX - startX}px`);
        chip.style.setProperty("--end-y", `${endY - startY}px`);

        document.body.appendChild(chip);

        setTimeout(() => {
          blank.textContent = displayAnswer(option.dataset.answer);
          blank.classList.add("filled");
          chip.remove();
        }, 560);
      }

      function chooseAnswer(index, option) {
        if (index !== currentQuestion || questions[index].answered) return;

        const selected = option.dataset.answer;
        const state = questions[index];

        if (selected === state.answer) {
          state.answered = true;

          option.disabled = true;
          option.classList.add("correct");

          flyAnswerToBlank(index, option);

          getOptions(index).forEach(other => {
            if (other !== option) {
              other.disabled = true;
              other.classList.add("disabled");
            }
          });

          nextBtn.disabled = false;

          sound.correct();
          showEmoji("🥳");
          burstConfetti(option);

          if (index === questions.length - 1) {
            setTimeout(finishQuiz, 650);
          }
        } else {
          option.disabled = true;
          option.classList.add("broken");

          sound.wrong();
          showEmoji("😔");

          setTimeout(() => {
            option.classList.remove("broken");
            option.disabled = false;
          }, 850);
        }
      }

      cards.forEach((card, index) => {
        card.querySelectorAll(".mirror-option").forEach(option => {
          option.addEventListener("click", () => chooseAnswer(index, option));
        });
      });

      prevBtn.addEventListener("click", () => {
        if (currentQuestion > 0) {
          showQuestion(currentQuestion - 1);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (!questions[currentQuestion].answered) return;

        if (currentQuestion < questions.length - 1) {
          showQuestion(currentQuestion + 1);
        }
      });

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
          <span class="icon-big">🎉</span>
          <h2>All Done!</h2>
          <p>Amazing! You got them all right!</p>
          <button class="btn-playagain" type="button">
            <i class="fa-solid fa-rotate-right"></i>
            Play again
          </button>
        `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();
          resetQuiz();
        });
      }

      function resetQuiz() {
        questions.forEach(state => {
          state.answered = false;
        });

        blanks.forEach(blank => {
          blank.textContent = "";
          blank.classList.remove("filled");
        });

        cards.forEach((card, index) => {
          if (index === 0) return;
          card.querySelectorAll(".mirror-option").forEach(option => {
            option.disabled = false;
            option.classList.remove("correct", "disabled", "broken");
          });
        });

        showQuestion(0);
      }

      showQuestion(0);
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
