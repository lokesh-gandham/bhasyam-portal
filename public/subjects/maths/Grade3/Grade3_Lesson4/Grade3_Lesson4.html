<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Math Marvels · Kids Playground</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    @font-face {
      font-family: "CCSYBold";
      src: url("./assets/CCSYBOLD.TTF") format("truetype");
      font-display: swap;
    }

    :root {
      --ink: #25183e;
      --purple: #7652df;
      --purple-dark: #4f2ba8;
      --pink: #ff6f9b;
      --glass: rgba(255, 255, 255, .72);
      /* Card width grows with the screen on desktop, while staying bounded. */
      --card-w: clamp(300px, 31vw, 560px);
      --card-h: min(630px, 74vh);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 22px;
      color: var(--ink);
      font-family: "CCSYBold", "Nunito", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 221, 238, .9), transparent 32%),
        radial-gradient(circle at 90% 12%, rgba(211, 223, 255, .95), transparent 34%),
        radial-gradient(circle at 85% 92%, rgba(207, 255, 230, .8), transparent 32%),
        linear-gradient(145deg, #eee7ff 0%, #dbe8ff 48%, #e9f8ff 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      filter: blur(35px);
      opacity: .35;
      pointer-events: none;
    }

    body::before {
      background: #b997ff;
      left: -60px;
      top: 25%;
    }

    body::after {
      background: #8fd7ff;
      right: -60px;
      bottom: 15%;
    }

    .page {
      width: min(1180px, 100%);
      height: min(820px, 94vh);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      position: relative;
      z-index: 1;
    }

    .title-block {
      text-align: center;
      line-height: 1;
      user-select: none;
    }

    .title-block .kids {
      display: block;
      font-family: "Baloo 2", sans-serif;
      font-size: clamp(38px, 5vw, 64px);
      font-weight: 800;
      letter-spacing: 1px;
      color: #4d25bd;
      text-shadow: 0 10px 25px rgba(86, 47, 175, .16);
    }

    .title-block .math {
      display: block;
      margin-top: -4px;
      font-family: "Baloo 2", sans-serif;
      font-size: clamp(20px, 2.5vw, 32px);
      font-weight: 800;
      letter-spacing: .5px;
      background: linear-gradient(135deg, #ff759d, #ff4e79);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .carousel {
      width: 100%;
      min-height: 0;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: visible;
      perspective: 1400px;
    }

    .carousel::before {
      content: "";
      position: absolute;
      width: 360px;
      height: 70%;
      border-radius: 50%;
      background: rgba(255, 255, 255, .34);
      filter: blur(28px);
      pointer-events: none;
    }

    .card-stage {
      width: 100%;
      height: 100%;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .card {
      --bg: #fbf7ff;
      --mid: #bb9aff;
      --dark: #7041d2;

      width: var(--card-w);
      height: min(var(--card-h), calc(100% - 12px));
      min-width: 250px;
      max-width: none;
      border-radius: 34px;
      overflow: hidden;
      position: absolute;
      left: 50%;
      top: 50%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow:
        0 35px 70px -28px rgba(62, 34, 129, .42),
        0 12px 24px -12px rgba(30, 20, 70, .18),
        inset 0 1px 0 rgba(255, 255, 255, .9);
      transform: translate(-50%, -50%);
      transition:
        transform .55s cubic-bezier(.2, .85, .25, 1),
        opacity .45s ease,
        filter .45s ease,
        box-shadow .45s ease;
      will-change: transform, opacity, filter;
    }

    /* The center card is the only sharp/focused card. */
    .card.is-current {
      z-index: 5;
      opacity: 1;
      filter: none;
      transform: translate(-50%, -50%) scale(1);
    }

    .card.is-prev,
    .card.is-next {
      z-index: 2;
      opacity: .42;
      filter: blur(5px) saturate(.7);
      transform: translate(-50%, -50%) scale(.72);
      box-shadow: 0 24px 45px -30px rgba(55, 30, 120, .28);
      pointer-events: none;
    }

    .card.is-prev {
      margin-left: calc(-1 * min(31vw, 340px));
    }

    .card.is-next {
      margin-left: min(31vw, 340px);
    }

    .card.is-prev::after,
    .card.is-next::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, .13);
      pointer-events: none;
    }

    .card-head {
      height: 178px;
      flex: none;
      position: relative;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 25% 15%, rgba(255, 255, 255, .34), transparent 28%),
        linear-gradient(145deg, var(--mid), var(--dark));
    }

    .card-head::after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -32px;
      height: 64px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: 0 -1px 0 rgba(255, 255, 255, .45);
    }

    .number-pill {
      position: absolute;
      top: 16px;
      left: 16px;
      min-width: 42px;
      height: 34px;
      padding: 0 12px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, .84);
      color: var(--dark);
      font-family: "Nunito", sans-serif;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(50, 20, 100, .14);
      z-index: 2;
    }

    .level {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--dark);
      background: rgba(255, 255, 255, .82);
      font-family: "Nunito", sans-serif;
      font-size: 12px;
      font-weight: 800;
      z-index: 2;
    }

    .icon-orb {
      width: 112px;
      height: 112px;
      border-radius: 36px;
      display: grid;
      place-items: center;
      color: var(--dark);
      background: rgba(255, 255, 255, .88);
      border: 8px solid rgba(255, 255, 255, .26);
      box-shadow:
        0 18px 32px rgba(55, 20, 120, .24),
        inset 0 0 0 1px rgba(255, 255, 255, .8);
      transform: rotate(-6deg);
      z-index: 1;
    }

    .icon-orb i {
      font-size: 46px;
      transform: rotate(6deg);
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 50px 28px 26px;
      gap: 9px;
      background: var(--bg);
    }

    .tag {
      padding: 6px 13px;
      border-radius: 999px;
      color: var(--dark);
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(255, 255, 255, .75);
      font-family: "Nunito", sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .card h2 {
      max-width: 310px;
      margin-top: 0;
      font-family: "Baloo 2", sans-serif;
      font-size: clamp(27px, 3vw, 35px);
      line-height: 1.08;
      font-weight: 800;
      color: #26183f;
    }

    .play-btn {
      width: 100%;
      margin-top: auto;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 18px;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, var(--mid), var(--dark));
      font-family: "Nunito", sans-serif;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 14px 24px -12px var(--dark);
      transition: transform .18s ease, box-shadow .18s ease;
      cursor: pointer;
    }

    .play-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 30px -12px var(--dark);
    }

    .play-btn:active {
      transform: translateY(0) scale(.98);
    }

    /* Navigation buttons sit directly beside the focused card. */
    .nav-btn {
      position: absolute;
      top: 50%;
      z-index: 10;
      width: 62px;
      height: 62px;
      border: 0;
      border-radius: 22px;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(91, 56, 177, .86);
      box-shadow:
        0 18px 32px -15px rgba(65, 35, 145, .65),
        0 0 0 5px rgba(255, 255, 255, .28);
      backdrop-filter: blur(10px);
      cursor: pointer;
      font-size: 20px;
      transform: translateY(-50%);
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .nav-btn:hover {
      background: linear-gradient(145deg, #9a76f4, #5e32bf);
      transform: translateY(-50%) scale(1.1);
    }

    .nav-btn:active {
      transform: translateY(-50%) scale(.95);
    }

    .nav-btn.prev {
      left: calc(50% - min(31vw, 340px) - 58px);
    }

    .nav-btn.next {
      right: calc(50% - min(31vw, 340px) - 58px);
    }

    .nav-btn::after {
      content: "";
      position: absolute;
      inset: -9px;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 27px;
      pointer-events: none;
    }

    .nav-info {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .62);
      border: 1px solid rgba(255, 255, 255, .78);
      box-shadow: 0 14px 30px -18px rgba(55, 30, 110, .35);
      backdrop-filter: blur(12px);
    }

    .page-count {
      display: none;
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .dot {
      width: 7px;
      height: 7px;
      padding: 0;
      border: 0;
      border-radius: 99px;
      background: #c7b9ec;
      cursor: pointer;
      transition: width .25s ease, transform .25s ease, background .25s ease;
    }

    .dot.active {
      width: 23px;
      background: linear-gradient(90deg, #9b7af0, #6135c5);
    }

    .hint {
      display: none;
    }

    /* Quiz overlay from the original page is preserved. */
    .quiz-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      background: #fff;
    }

    .quiz-overlay.active {
      display: block;
    }

    .quiz-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #eaf3ff;
    }

    .quiz-home-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1001;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #9b78f4, #6034c3);
      box-shadow: 0 15px 30px -12px rgba(70, 30, 150, .6);
      cursor: pointer;
      font-size: 20px;
    }

    /* Desktop: keep the same card proportions and visual scale across monitors. */
    @media (min-width: 1025px) {
      :root {
        --card-w: clamp(390px, 34vw, 500px);
        --card-h: var(--card-w);
      }

      .card.is-prev {
        margin-left: calc(-1 * (var(--card-w) * .92));
      }

      .card.is-next {
        margin-left: calc(var(--card-w) * .92);
      }

      .nav-btn.prev {
        left: calc(50% - (var(--card-w) * .92) - 58px);
      }

      .nav-btn.next {
        right: calc(50% - (var(--card-w) * .92) - 58px);
      }
    }

    @media (min-width: 901px) and (max-width: 1024px) {
      :root {
        --card-w: min(390px, 46vw);
        --card-h: min(560px, 70vh);
      }

      .card.is-prev {
        margin-left: -34vw;
      }

      .card.is-next {
        margin-left: 34vw;
      }

      .nav-btn.prev {
        left: 4%;
      }

      .nav-btn.next {
        right: 4%;
      }
    }

    @media (max-width: 900px) {
      :root {
        --card-w: min(360px, 68vw);
        --card-h: min(530px, 66vh);
      }

      .card.is-prev {
        margin-left: -34vw;
      }

      .card.is-next {
        margin-left: 34vw;
      }

      .nav-btn.prev {
        left: 4%;
      }

      .nav-btn.next {
        right: 4%;
      }
    }

    @media (max-width: 620px) {
      :root {
        --card-w: min(310px, 76vw);
        --card-h: min(500px, 65vh);
      }

      body {
        padding: 10px;
      }

      .page {
        height: 96vh;
        gap: 8px;
      }

      .carousel {
        overflow: visible;
      }

      .card.is-prev,
      .card.is-next {
        opacity: .2;
        filter: blur(7px) saturate(.55);
        transform: translate(-50%, -50%) scale(.62);
      }

      .card.is-prev {
        margin-left: -38vw;
      }

      .card.is-next {
        margin-left: 38vw;
      }

      .nav-btn {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        font-size: 16px;
      }

      .nav-btn.prev {
        left: 1%;
      }

      .nav-btn.next {
        right: 1%;
      }

      .card-head {
        height: 150px;
      }

      .icon-orb {
        width: 92px;
        height: 92px;
        border-radius: 30px;
      }

      .icon-orb i {
        font-size: 38px;
      }

      .card-body {
        padding: 28px 22px 20px;
      }

      .hint {
        display: none;
      }

      .nav-info {
        min-height: 40px;
      }

      .dots {
        gap: 4px;
      }
    }


    @media (min-width: 1600px) {
      .title-block .kids {
        font-size: clamp(56px, 4vw, 78px);
      }

      .title-block .math {
        font-size: clamp(28px, 2vw, 40px);
      }

      .tag {
        font-size: 13px;
        padding: 8px 16px;
      }

      .card h2 {
        font-size: clamp(38px, 2.3vw, 52px);
      }

      .play-btn {
        font-size: 20px;
        min-height: 62px;
      }

      .number-pill,
      .level {
        font-size: 14px;
      }

      .icon-orb i {
        font-size: 56px;
      }
    }


    @media (prefers-reduced-motion: reduce) {

      .card,
      .nav-btn,
      .play-btn,
      .dot {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="title-block">
      <span class="kids">Kids Learning</span>
      <span class="math">Math Playground</span>
    </header>

    <section class="carousel" aria-label="Math games carousel">
      <div class="card-stage" id="cardStage"></div>

      <button class="nav-btn prev" id="prevBtn" aria-label="Previous card">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <button class="nav-btn next" id="nextBtn" aria-label="Next card">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </section>

    <div class="nav-info">
      <div class="dots" id="dots" aria-label="Choose a game"></div>
    </div>
  </main>

  <div class="quiz-overlay" id="quizOverlay">
    <button class="quiz-home-btn" id="quizHomeBtn" aria-label="Back to home">
      <i class="fa-solid fa-house"></i>
    </button>
    <iframe class="quiz-iframe" id="quizFrame" title="Quiz" src="about:blank"></iframe>
  </div>

  <script>
    /* Exactly 10 cards, as requested. */
    const games = [
      { icon: "fa-plus", title: "Find the Sum", tag: "Addition", href: "./exercises/find-sum.html" },
      { icon: "fa-puzzle-piece", title: "Addition facts", tag: "Addition", href: "./exercises/addition.html" },
      { icon: "fa-arrow-trend-up", title: "Complete the Pattern", tag: "Number Sequences", href: "./exercises/pattern.html" },
      { icon: "fa-calculator", title: "Multiplication Facts", tag: "Multiplication", href: "./exercises/multiplication.html" },
      { icon: "fa-circle-check", title: "True or False", tag: "Multiplication Statements", href: "./exercises/true-false.html" },
      { icon: "fa-plus", title: "Addition and Multiplication", tag: "Fact Practice", href: "./exercises/add-mult.html" },
      { icon: "fa-ruler-horizontal", title: "Multiplication Scale", tag: "Multiplication Practice", href: "./exercises/scale-jump.html" },
      { icon: "fa-calculator", title: "Fill in the Boxes", tag: "Multiplication Properties", href: "./exercises/FTB.html" },
      { icon: "fa-bolt", title: "Calculate Orally", tag: "Multiplication", href: "./exercises/calculate.html" },
      { icon: "fa-brain", title: "Mental Calculation", tag: "Multiplication", href: "./exercises/product.html" },
    ];

    const themes = [
      ["#fff7e9", "#ffc36f", "#d9852a"],
      ["#ecfbff", "#83d3ff", "#278bcf"],
      ["#fbf5ff", "#c3a3ff", "#7442d5"],
      ["#f2fce9", "#a8db91", "#4c9c3b"],
      ["#fff0f6", "#ff9fbe", "#dc4f7b"]
    ];

    const stage = document.getElementById("cardStage");
    const dotsBox = document.getElementById("dots");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const quizOverlay = document.getElementById("quizOverlay");
    const quizFrame = document.getElementById("quizFrame");
    const quizHomeBtn = document.getElementById("quizHomeBtn");

    let current = 0;
    let isAnimating = false;
    let touchStartX = 0;

    function wrap(index) {
      return (index + games.length) % games.length;
    }

    function cardHtml(index, position) {
      const game = games[index];
      const theme = themes[index % themes.length];

      return `
        <article class="card ${position}"
          style="--bg:${theme[0]};--mid:${theme[1]};--dark:${theme[2]}"
          data-index="${index}">
          <div class="card-head">
            <span class="number-pill">${String(index + 1).padStart(2, "0")}</span>
            <span class="level">GAME ${index + 1}</span>
            <div class="icon-orb"><i class="fa-solid ${game.icon}"></i></div>
          </div>

          <div class="card-body">
            <span class="tag">${game.tag}</span>
            <h2>${game.title}</h2>

            <a class="play-btn" href="${game.href}" data-href="${game.href}">
              Start Game <i class="fa-solid fa-arrow-right"></i>
            </a>
          </div>
        </article>
      `;
    }

    function renderDots() {
      dotsBox.innerHTML = games.map((_, index) => `
        <button
          class="dot ${index === current ? "active" : ""}"
          aria-label="Go to card ${index + 1}"
          data-dot="${index}">
        </button>
      `).join("");
    }

    function render() {
      const prev = wrap(current - 1);
      const next = wrap(current + 1);

      stage.innerHTML =
        cardHtml(prev, "is-prev") +
        cardHtml(current, "is-current") +
        cardHtml(next, "is-next");

      renderDots();
    }

    function goTo(index, direction = 1) {
      if (isAnimating) return;

      const target = wrap(index);
      if (target === current) return;

      isAnimating = true;
      const oldCurrent = stage.querySelector(".is-current");
      const oldPrev = stage.querySelector(".is-prev");
      const oldNext = stage.querySelector(".is-next");

      // Animate the current card toward the side, then rebuild the 3-card view.
      const sign = direction > 0 ? -1 : 1;
      oldCurrent.style.transform =
        `translate(calc(-50% + ${sign * 28}vw), -50%) scale(.72)`;
      oldCurrent.style.opacity = "0";
      oldCurrent.style.filter = "blur(6px)";

      const incoming = direction > 0 ? oldNext : oldPrev;
      incoming.style.transition = "transform .55s cubic-bezier(.2,.85,.25,1), opacity .45s ease, filter .45s ease";
      incoming.style.transform = "translate(-50%, -50%) scale(1)";
      incoming.style.marginLeft = "0";
      incoming.style.opacity = "1";
      incoming.style.filter = "none";
      incoming.style.zIndex = "5";

      setTimeout(() => {
        current = target;
        render();
        isAnimating = false;
      }, 500);
    }

    function next() { goTo(current + 1, 1); }
    function prev() { goTo(current - 1, -1); }

    nextBtn.addEventListener("click", next);
    prevBtn.addEventListener("click", prev);

    dotsBox.addEventListener("click", (event) => {
      const dot = event.target.closest("[data-dot]");
      if (!dot) return;

      const target = Number(dot.dataset.dot);
      if (target === current) return;

      // Pick the shortest circular direction.
      const forward = (target - current + games.length) % games.length;
      const direction = forward <= games.length / 2 ? 1 : -1;
      goTo(target, direction);
    });

    stage.addEventListener("click", (event) => {
      const button = event.target.closest(".play-btn");
      if (!button) return;
      event.preventDefault();
      quizFrame.src = button.dataset.href;
      quizOverlay.classList.add("active");
    });

    quizHomeBtn.addEventListener("click", () => {
      quizOverlay.classList.remove("active");
      quizFrame.src = "about:blank";
    });

    document.addEventListener("keydown", (event) => {
      if (quizOverlay.classList.contains("active")) {
        if (event.key === "Escape") {
          quizOverlay.classList.remove("active");
          quizFrame.src = "about:blank";
        }
        return;
      }

      if (event.key === "ArrowRight") next();
      if (event.key === "ArrowLeft") prev();
    });

    stage.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    stage.addEventListener("touchend", (event) => {
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) < 45) return;
      if (delta < 0) next();
      else prev();
    }, { passive: true });

    render();
  </script>
</body>

</html>
