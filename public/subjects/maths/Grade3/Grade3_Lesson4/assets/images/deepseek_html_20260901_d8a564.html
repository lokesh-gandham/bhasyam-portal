<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Even / Odd · Numerals</title>
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* ----- custom font: CCSyntroman (same as reference) ----- */
    @font-face {
      font-family: 'CCSyntroman';
      src: url('../assets/CCSYNTRO.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "CCSyntroman", "Baloo 2", sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #eefaf3 0%, #eaf5ff 55%, #fdf3ee 100%);
      padding: 28px 18px 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .wrap {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
    }

    /* ===== header ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 28px;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 19px;
      background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.85), rgba(255,255,255,0) 42%), #ff9f45;
      box-shadow: 0 6px 14px -4px rgba(217,122,31,.5);
    }

    .title h1 {
      font-size: 21px;
      color: #2d3250;
    }

    .title p {
      font-size: 13px;
      color: #7c8397;
      font-weight: 500;
    }

    .hud {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 14px;
      color: #2d3250;
      box-shadow: 0 5px 14px -6px rgba(45,50,80,.25);
    }

    .chip-star-icon { color: #ffb400; }

    /* ===== question card ===== */
    .qcard {
      background: #fff;
      border-radius: 26px;
      padding: 28px;
      margin-bottom: 22px;
      box-shadow: 0 14px 30px -16px rgba(45,50,80,.25);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(16px);
      animation: rise .5s cubic-bezier(.34,1.56,.64,1) forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .qhead {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .qbadge {
      width: 50px;
      height: 50px;
      min-width: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #fff;
      font-size: 20px;
      background: var(--qc, #4fc3f7);
      box-shadow: 0 4px 10px -3px var(--qc, #4fc3f7);
    }

    .qhead-text {
      font-weight: 700;
      color: #5b6480;
      font-size: 20px;
    }

    /* ===== main content grid ===== */
    .qbody {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 32px;
      margin-bottom: 28px;
    }

    .number-section {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .number-label {
      font-size: 16px;
      font-weight: 800;
      color: #2d3250;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: .3px;
    }

    .number-display {
      background: #f9fafb;
      border-radius: 16px;
      border: 1.5px solid #e7ebf3;
      padding: 24px 12px;
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      color: #1e1e2a;
      letter-spacing: 2px;
      word-break: break-word;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .answers-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 0;
    }

    .mascot-wrap {
      display: flex;
      justify-content: center;
    }

    .mascot-img {
      position: absolute;
      top: -1%;
      width: 100px;
      height: 160px;
      object-fit: contain;
      filter: drop-shadow(0 8px 10px rgba(45,50,80,.18));
    }

    .pv-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .input-notice {
      position: absolute;
      top: -30px;
      right: 0;
      z-index: 2;
      padding: 5px 9px;
      border-radius: 8px;
      background: #2d3250;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
      opacity: 0;
      transform: translateX(6px) scale(.94);
    }

    .input-notice.show {
      animation: noticePop 1.5s ease forwards;
    }

    @keyframes noticePop {
      0% { opacity: 0; transform: translateX(6px) scale(.94); }
      15%, 75% { opacity: 1; transform: translateX(0) scale(1); }
      100% { opacity: 0; transform: translateX(0) scale(.96); }
    }

    .pv-table {
      border-collapse: separate;
      border-spacing: 10px;
      width: 100%;
      max-width: 300px;
    }

    .pv-table thead th {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: .3px;
      color: #52514f;
      background: #fff3e0;
      border: 2px solid #ffd9a8;
      border-radius: 10px;
      padding: 6px 0;
      width: 54px;
      text-align: center;
    }

    .pv-table tbody td {
      padding: 0;
      text-align: center;
    }

    .digitInput {
      width: 54px;
      height: 54px;
      border: 2.5px solid #8598be;
      border-radius: 12px;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      color: #2d3250;
      outline: none;
      background: #fbfcfe;
      transition: border-color .2s ease, box-shadow .2s ease, transform .15s ease, background .2s ease;
    }

    .digitInput:focus {
      border-color: var(--qc, #4fc3f7);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--qc, #4fc3f7) 18%, transparent);
    }

    .digitInput:disabled {
      background: #f0f2f7;
      color: #111827;
      opacity: 1;
      cursor: not-allowed;
      border-color: #e7ebf3;
    }

    .digitInput.correct {
      border-color: #4caf50;
      background: #eefbef;
      box-shadow: 0 0 0 4px rgba(76,175,80,.18);
    }

    .digitInput.correct:disabled {
      background: #eefbef;
      color: #111827;
      opacity: 1;
    }

    .digitInput.wrong {
      border-color: #ef5675;
      background: #fff1f4;
      animation: wrongBlink .9s ease;
    }

    @keyframes wrongBlink {
      0%, 100% { border-color: #e7ebf3; background: #fbfcfe; box-shadow: none; }
      18%, 42%, 66% { border-color: #ef5675; background: #fff1f4; box-shadow: 0 0 0 4px rgba(239,86,117,.16); }
    }

    .check-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .qfoot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-top: 20px;
      border-top: 1.5px solid #e7ebf3;
    }

    .controls-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .btn-check {
      border: none;
      cursor: pointer;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      background: var(--qc, #4fc3f7);
      box-shadow: 0 5px 0 -1px color-mix(in srgb, var(--qc, #4fc3f7) 70%, black),
                  0 8px 14px -8px var(--qc, #4fc3f7);
      transition: transform .15s ease, opacity .2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-check:active:not(:disabled) { transform: translateY(2px); }
    .btn-check:disabled { opacity: 0.5; cursor: not-allowed; }

    .feedback {
      font-weight: 800;
      font-size: 15px;
      opacity: 0;
      transition: opacity .2s ease;
      text-align: center;
    }

    .feedback.show { opacity: 1; }
    .feedback.good { color: #2f9e44; }
    .feedback.bad { color: #e0398c; }

    .nav-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
    }

    .btn-nav {
      border: none;
      cursor: pointer;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform .15s ease, opacity .2s ease;
      box-shadow: 0 5px 0 -1px rgba(0,0,0,.2), 0 8px 14px -8px rgba(0,0,0,.3);
    }

    .btn-prev { background: linear-gradient(180deg, #7ed957, #4caf50); }
    .btn-next { background: linear-gradient(180deg, #7ed957, #4caf50); }

    .btn-nav:active:not(:disabled) { transform: translateY(2px); }
    .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }

    .progress-indicator {
      font-size: 14px;
      font-weight: 700;
      color: #7c8397;
      text-align: center;
    }

    /* even/odd toggle */
    .eo-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin: 6px 0 10px;
    }

    .eo-btn {
      background: #f0f2f7;
      border: 2.5px solid #d0d6e2;
      border-radius: 40px;
      padding: 8px 18px;
      font-weight: 800;
      font-size: 18px;
      color: #3d4a5e;
      cursor: pointer;
      transition: all .15s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,.04);
      min-width: 70px;
    }

    .eo-btn.active {
      background: #2d3250;
      border-color: #2d3250;
      color: #fff;
      box-shadow: 0 6px 12px rgba(45,50,80,.25);
    }

    .eo-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* celebration pieces (same as reference) */
    .celebration-piece {
      position: fixed;
      left: 50%;
      top: 42%;
      width: 9px;
      height: 16px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 9998;
      animation: confettiBurst 1.4s cubic-bezier(.2,.8,.2,1) forwards;
    }

    @keyframes confettiBurst {
      from { opacity: 1; transform: translate(-50%,-50%) rotate(0) scale(.7); }
      to { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(520deg) scale(1); }
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 42%;
      font-size: 84px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%,-50%) scale(.35) rotate(-12deg);
      animation: emojiPop 1.8s cubic-bezier(.2,.8,.2,1) forwards;
      filter: drop-shadow(0 10px 14px rgba(45,50,80,.18));
    }

    @keyframes emojiPop {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.35) rotate(-12deg); }
      28% { opacity: 1; transform: translate(-50%,-50%) scale(1.18) rotate(8deg); }
      68% { opacity: 1; transform: translate(-50%,-54%) scale(1) rotate(-4deg); }
      to { opacity: 0; transform: translate(-50%,-68%) scale(.9) rotate(0); }
    }

    /* final overlay */
    .final-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .final-modal {
      background: #ffffff;
      max-width: 420px;
      width: 90%;
      padding: 40px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
      position: relative;
      animation: popUp 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    }

    @keyframes popUp {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .final-modal .icon-big { font-size: 56px; margin-bottom: 6px; display: block; }
    .final-modal h2 { font-size: 34px; font-weight: 800; color: #1e1e2a; margin-bottom: 8px; }
    .final-modal p { font-size: 18px; color: #3d3d4a; margin-bottom: 24px; }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 14px 40px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 20px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245,138,46,0.3);
      cursor: pointer;
      transition: transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active { transform: scale(0.95); }

    /* ===== media queries (same as reference) ===== */
    @media (max-width: 900px) {
      body { align-items: center; padding: 20px; overflow: auto; }
      .wrap { padding: 0; }
    }

    @media (max-width: 768px) {
      .qbody { grid-template-columns: 1fr; gap: 24px; }
      .number-display { min-height: 90px; font-size: 34px; }
      .qcard { padding: 20px; }
      .btn-nav { padding: 12px 20px; font-size: 14px; }
    }

    @media (max-width: 640px) {
      .topbar { flex-direction: column; align-items: flex-start; }
      .hud { width: 100%; justify-content: space-between; }
      .controls-row { width: 100%; }
      .check-row { justify-content: stretch; flex-direction: column; align-items: center; }
      .btn-check { width: 100%; justify-content: center; }
      .nav-buttons { width: 100%; flex-wrap: wrap; }
      .btn-nav { flex: 1; min-width: 120px; justify-content: center; }
    }

    @media (max-width: 480px) {
      body { padding: 16px 6px; }
      .qcard { padding: 16px; }
      .digitInput { width: 44px; height: 44px; font-size: 20px; }
      .pv-table thead th { font-size: 18px; width: 44px; }
    }

    @media screen and (min-width:1025px) and (max-width:1440px) { .wrap { max-width: 1100px; } }
    @media screen and (min-width:1441px) and (max-width:1920px) { .wrap { max-width: 1200px; } }
    @media screen and (min-width:1921px) { .wrap { max-width: 1300px; } }

    @media (prefers-reduced-motion: reduce) {
      .emoji-pop, .success-modal, .success-modal-content, .digitInput.wrong { animation: none; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">
      <div class="title-icon"><i class="fa-solid fa-cubes"></i></div>
      <div>
        <h1>Even or Odd?</h1>
        <p>Read the number, then tick even or odd</p>
      </div>
    </div>
    <div class="hud">
      <div class="chip"><i class="fa-solid fa-star chip-star-icon"></i> <span id="scoreVal">0</span> Stars</div>
    </div>
  </div>
  <div id="questions"></div>
</div>

<script>
  // ----- AUDIO (same as reference) -----
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function beep(freq, dur, type = 'sine') {
    try {
      const ctx = getCtx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.value = freq;
      o.connect(g);
      g.connect(ctx.destination);
      g.gain.setValueAtTime(0.14, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur/1000);
      o.start();
      o.stop(ctx.currentTime + dur/1000);
    } catch(e) {}
  }
  const sfx = {
    correct: () => { beep(660,110,'sine'); setTimeout(()=>beep(880,160,'sine'),110); },
    wrong: () => beep(180,220,'sawtooth'),
    star: () => { beep(720,90,'triangle'); },
    good: () => { beep(660,110,'sine'); setTimeout(()=>beep(880,160,'sine'),110); },
    bad: () => beep(180,220,'sawtooth'),
    finish: () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,150,'sine'),i*130)); }
  };

  // ----- CONFETTI (canvas-confetti) -----
  function burstConfetti(fromEl, color) {
    const rect = fromEl.getBoundingClientRect();
    const x = (rect.left + rect.width/2) / window.innerWidth;
    const y = (rect.top + rect.height/2) / window.innerHeight;
    confetti({
      particleCount: 30,
      spread: 70,
      origin: { x, y },
      startVelocity: 20,
      colors: [color, '#ffd54f', '#ff9f45', '#7ed957', '#ff6b6b', '#4ecdc4']
    });
  }

  function showCorrectEmoji() {
    const colors = ['#ff6fb5','#ffd54f','#7ed957','#4fc3f7','#b388ff'];
    for (let i=0; i<18; i++) {
      const piece = document.createElement('span');
      const angle = (Math.PI*2*i)/18;
      const distance = 90 + Math.random()*100;
      piece.className = 'celebration-piece';
      piece.style.setProperty('--x', `${Math.cos(angle)*distance}px`);
      piece.style.setProperty('--y', `${Math.sin(angle)*distance}px`);
      piece.style.background = colors[i%colors.length];
      piece.style.animationDelay = `${Math.random()*.12}s`;
      document.body.appendChild(piece);
      setTimeout(()=>piece.remove(),1600);
    }
    const emoji = document.createElement('div');
    emoji.className = 'emoji-pop';
    emoji.textContent = '🥳';
    document.body.appendChild(emoji);
    setTimeout(()=>emoji.remove(),1850);
  }

  function showWrongEmoji() {
    const emoji = document.createElement('div');
    emoji.className = 'emoji-pop';
    emoji.textContent = '😅';
    emoji.style.fontSize = '70px';
    document.body.appendChild(emoji);
    setTimeout(()=>emoji.remove(),1500);
  }

  // ----- GAME STATE -----
  const QCOLORS = ['#4fc3f7','#ff6fb5','#7ed957','#b388ff'];
  // questions: number in words, numeric value, correct even/odd
  const questionPool = [
    { text: 'Two thousand three hundred eighty nine', value: 2389, answer: 'odd' },
    { text: 'Three thousand one hundred eleven', value: 3111, answer: 'odd' },
    { text: 'One thousand two', value: 1002, answer: 'even' },
    { text: 'Nine thousand seven hundred sixteen', value: 9716, answer: 'even' }
  ];

  let questions = [];
  let currentQuestionIndex = 0;
  let score = 0;
  let questionScores = {};

  function buildQuestions() {
    // use the pool exactly
    questions = questionPool.map((q, idx) => ({
      ...q,
      id: idx
    }));
  }
  buildQuestions();

  function updateCheckButtonState(inputs, checkBtn, eoBtns) {
    const allFilled = inputs.every(inp => inp.value.trim().length > 0);
    const eoSelected = eoBtns.some(b => b.classList.contains('active'));
    const allLocked = inputs.every(inp => inp.disabled);
    checkBtn.disabled = allLocked || !allFilled || !eoSelected;
  }

  // ----- show final popup (same as reference) -----
  function showFinalPopup() {
    const old = document.querySelector('.final-overlay');
    if (old) old.remove();
    sfx.finish();

    const overlay = document.createElement('div');
    overlay.className = 'final-overlay';
    overlay.innerHTML = `
      <div class="final-modal">
        <span class="icon-big">🎉</span>
        <h2>All correct!</h2>
        <p>You completed all the questions!</p>
        <button class="btn-playagain" id="playAgainBtn"><i class="fa-solid fa-rotate-right"></i> Play again</button>
      </div>
    `;
    document.body.appendChild(overlay);

    setTimeout(() => {
      const modal = overlay.querySelector('.final-modal');
      if (modal) burstConfetti(modal, '#ffd54f');
      setTimeout(() => { if (modal) burstConfetti(modal, '#4ecdc4'); }, 400);
      setTimeout(() => { if (modal) burstConfetti(modal, '#ff9f45'); }, 800);
    }, 100);

    overlay.querySelector('#playAgainBtn').addEventListener('click', function() {
      overlay.remove();
      playAgain();
    });
  }

  function renderQuestions() {
    const root = document.getElementById('questions');
    root.innerHTML = '';

    const q = questions[currentQuestionIndex];
    const color = QCOLORS[currentQuestionIndex % QCOLORS.length];
    const expected = q.answer; // 'even' or 'odd'

    const card = document.createElement('div');
    card.className = 'qcard';
    card.style.setProperty('--qc', color);
    card.dataset.qindex = currentQuestionIndex;

    card.innerHTML = `
      <div class="qhead">
        <div class="qbadge">Q${currentQuestionIndex+1}</div>
        <div class="qhead-text">Write the number & choose even/odd</div>
      </div>
      <div class="qbody">
        <div class="number-section">
          <div class="number-label">Number in words</div>
          <div class="number-display">${q.text}</div>
        </div>
        <div class="answers-section">
          <div class="mascot-wrap">
            <img src="../assets/images/boy-img.png" alt="Helper" class="mascot-img" style="position:relative; width:70px; height:auto; margin-bottom:8px;">
          </div>
          <div class="pv-wrap">
            <span class="input-notice pv-notice">Numbers only</span>
            <table class="pv-table">
              <thead><tr><th>Th</th><th>H</th><th>T</th><th>O</th></tr></thead>
              <tbody><tr>
                <td><input type="text" inputmode="numeric" maxlength="1" class="digitInput" data-place="th"></td>
                <td><input type="text" inputmode="numeric" maxlength="1" class="digitInput" data-place="h"></td>
                <td><input type="text" inputmode="numeric" maxlength="1" class="digitInput" data-place="t"></td>
                <td><input type="text" inputmode="numeric" maxlength="1" class="digitInput" data-place="o"></td>
              </tr></tbody>
            </table>
          </div>
          <div class="eo-group">
            <button class="eo-btn" data-value="even">Even</button>
            <button class="eo-btn" data-value="odd">Odd</button>
          </div>
          <div class="check-row">
            <button class="btn-check"><i class="fa-solid fa-check check-icon"></i> Check</button>
          </div>
        </div>
      </div>
      <div class="qfoot">
        <span class="feedback"></span>
        <div class="nav-buttons">
          <button class="btn-nav btn-prev" ${currentQuestionIndex===0?'disabled':''}><i class="fa-solid fa-chevron-left nav-icon"></i> Prev</button>
          <span class="progress-indicator"><span class="current-q">${currentQuestionIndex+1}</span> / <span class="total-q">${questions.length}</span></span>
          <button class="btn-nav btn-next" disabled><i class="fa-solid fa-chevron-right nav-icon"></i> Next</button>
        </div>
      </div>
    `;
    root.appendChild(card);

    const inputs = Array.from(card.querySelectorAll('.digitInput'));
    const feedback = card.querySelector('.feedback');
    const checkBtn = card.querySelector('.btn-check');
    const prevBtn = card.querySelector('.btn-prev');
    const nextBtn = card.querySelector('.btn-next');
    const pvNotice = card.querySelector('.pv-notice');
    const eoBtns = Array.from(card.querySelectorAll('.eo-btn'));

    // restore state
    if (questionScores[currentQuestionIndex]) {
      const saved = questionScores[currentQuestionIndex];
      inputs.forEach(inp => {
        const place = inp.dataset.place;
        const rec = saved[place];
        if (rec) {
          inp.value = rec.value || '';
          if (rec.correct) {
            inp.classList.add('correct');
            inp.disabled = true;
          }
        }
      });
      if (saved.eo) {
        const btn = eoBtns.find(b => b.dataset.value === saved.eo);
        if (btn) btn.classList.add('active');
        eoBtns.forEach(b => b.disabled = true);
      }
      if (saved.scored) {
        feedback.textContent = 'Great job! ⭐';
        feedback.className = 'feedback show good';
        nextBtn.disabled = false;
        checkBtn.disabled = true;
      }
    }

    updateCheckButtonState(inputs, checkBtn, eoBtns);

    // input events
    inputs.forEach((inp, idx) => {
      inp.addEventListener('beforeinput', event => {
        if (event.data && /[^0-9]/.test(event.data)) {
          event.preventDefault();
          showInputNotice(pvNotice);
        }
      });

      inp.addEventListener('input', () => {
        let cleanValue = inp.value.replace(/[^0-9]/g, '');
        if (cleanValue.length > 1) cleanValue = cleanValue.slice(-1);
        if (cleanValue !== inp.value) {
          inp.value = cleanValue;
          showInputNotice(pvNotice);
        }
        if (!inp.disabled) {
          updateCheckButtonState(inputs, checkBtn, eoBtns);
          if (cleanValue && idx < inputs.length-1) {
            inputs[idx+1].focus();
          }
        }
      });

      inp.addEventListener('keydown', event => {
        if (event.key === 'Backspace' && !inp.value && idx > 0) {
          inputs[idx-1].focus();
        }
      });

      inp.addEventListener('focus', () => {
        if (!inp.disabled) inp.select();
      });
    });

    // eo toggle
    eoBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        eoBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateCheckButtonState(inputs, checkBtn, eoBtns);
      });
    });

    // Check answer
    checkBtn.onclick = () => {
      let allCorrect = true;
      let firstWrong = null;

      // get number from inputs
      let numStr = inputs.map(inp => inp.value.trim()).join('');
      if (numStr.length === 0) return;
      const numberValue = parseInt(numStr, 10);
      // get selected even/odd
      const activeEo = eoBtns.find(b => b.classList.contains('active'));
      const selected = activeEo ? activeEo.dataset.value : null;
      const isEven = numberValue % 2 === 0;
      const correctEo = isEven ? 'even' : 'odd';

      // check each digit against q.value
      const expectedDigits = String(q.value).padStart(4,'0').split('');
      inputs.forEach((inp, i) => {
        const val = inp.value.trim();
        if (val !== expectedDigits[i]) {
          allCorrect = false;
          if (!firstWrong) firstWrong = inp;
        }
      });

      // also check even/odd
      if (selected !== correctEo) allCorrect = false;

      if (allCorrect) {
        // mark all correct
        inputs.forEach((inp, i) => {
          const place = inp.dataset.place;
          if (!questionScores[currentQuestionIndex]) questionScores[currentQuestionIndex] = {};
          questionScores[currentQuestionIndex][place] = {
            value: inp.value.trim(),
            correct: true
          };
          inp.classList.add('correct');
          inp.disabled = true;
          inp.classList.remove('wrong');
        });
        // save eo
        questionScores[currentQuestionIndex].eo = selected;
        eoBtns.forEach(b => b.disabled = true);

        sfx.correct();
        feedback.textContent = 'Great job! ⭐';
        feedback.className = 'feedback show good';
        checkBtn.disabled = true;
        nextBtn.disabled = false;

        if (!questionScores[currentQuestionIndex].scored) {
          score++;
          document.getElementById('scoreVal').textContent = score;
          questionScores[currentQuestionIndex].scored = true;
          showCorrectEmoji();

          if (currentQuestionIndex === questions.length-1) {
            setTimeout(() => { showFinalPopup(); }, 1600);
          }
        }
      } else {
        // wrong: clear everything
        inputs.forEach(inp => {
          inp.value = '';
          inp.classList.remove('correct');
          flashWrong(inp);
        });
        eoBtns.forEach(b => {
          b.classList.remove('active');
        });
        sfx.wrong();
        feedback.textContent = 'Not quite — try again!';
        feedback.className = 'feedback show bad';
        showWrongEmoji();
        checkBtn.disabled = true;
        if (firstWrong) {
          setTimeout(() => firstWrong.focus(), 300);
        } else {
          setTimeout(() => inputs[0].focus(), 300);
        }
      }
      updateCheckButtonState(inputs, checkBtn, eoBtns);
    };

    // navigation
    prevBtn.onclick = () => {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestions();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    nextBtn.onclick = () => {
      if (currentQuestionIndex < questions.length-1) {
        currentQuestionIndex++;
        renderQuestions();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };
  }

  function showInputNotice(notice) {
    notice.classList.remove('show');
    void notice.offsetWidth;
    notice.classList.add('show');
  }

  function flashWrong(input) {
    input.classList.remove('wrong');
    void input.offsetWidth;
    input.classList.add('wrong');
    input.addEventListener('animationend', () => {
      input.classList.remove('wrong');
    }, { once: true });
  }

  function playAgain() {
    const overlay = document.querySelector('.final-overlay');
    if (overlay) overlay.remove();
    currentQuestionIndex = 0;
    score = 0;
    questionScores = {};
    document.getElementById('scoreVal').textContent = score;
    buildQuestions();
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  renderQuestions();
</script>
</body>
</html>
