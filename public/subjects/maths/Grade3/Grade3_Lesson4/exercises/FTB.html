<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Math Adventure - Property Quest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
    <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
    <script src="../assets/shared/quiz-ui.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
            font-weight: 400;
        }

        :root {
            --purple: #6847e8;
            --orange: #ff861f;
            --green: #55b449;
            --green-dark: #3d9634;
            --red: #e74c3c;
            --ink: #27344d;
            --muted: #7b8498;
            --border: #e3e6eb
        }

        body {
            margin: 0;
            height: 100vh;
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app {
            width: min(1040px, 94%);
            margin: 2px auto 3px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Header */
        .header {
            background: #fff;
            border: 1px solid #e5e8f1;
            border-radius: 22px;
            padding: 16px 21px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            box-shadow: 0 9px 25px #34426712;
            display: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 13px
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            background: linear-gradient(145deg, #7655eb, #4f34d1);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 25px
        }

        .header-title h2 {
            margin: 0;
            font-size: 21px
        }

        .header-title p {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700
        }

        .progress-area {
            width: 330px
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 900;
            margin-bottom: 7px
        }

        .progress-track {
            height: 11px;
            background: #eceef6;
            border-radius: 99px;
            overflow: hidden
        }

        .progress-fill {
            width: 25%;
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, #6948e8, #a675ff);
            transition: width .4s
        }

        .score {
            background: #fff5d8;
            color: #a36a00;
            border-radius: 14px;
            padding: 9px 13px;
            font-weight: 1000;
            white-space: nowrap
        }

        /* Main */
        .game-card {
           min-width: 100%;
           width: 100%;
           display: flex;
           flex-direction: column;
           justify-content: center;
           align-items: center;
        }

        .game-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px
        }

        .level {
            color: #6043d9;
            background: #f0ecff;
            border-radius: 99px;
            padding: 9px 15px;
            font-size: 12px;
            font-weight: 1000
        }

        /* Question */
        .question-card {
            width: 100%;
            min-width: 100%;
            min-height: 300px;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 22px;
            align-items: center;
            padding: 20px;
            border-radius: 24px;
            border: 2px solid #b5c5f1;
            background: linear-gradient(145deg, #fbfcff, #f5f7ff)
        }

        .question-image {
            height: 225px;
            /* border-radius: 19px;
            background: linear-gradient(180deg, #f4fbff, #fff);
            border: 1px solid #e2eaf3; */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden
        }

        .question-image img {
            width: 100%;
            height: 100%;
            object-fit: contain
        }

        .question-content {
            text-align: center
        }

        .question-number {
            font-size: 18px;
            color: #2f4f4f;
            font-weight: 1000;
            margin-bottom: 5px
        }

        .mission {
            color: #2f4f4f;
            font-size: 20px;
            font-weight: 900;
            margin-top: 5px;
            margin-bottom: 20px
        }

        .equation {
            font-size: clamp(21px, 3vw, 33px);
            font-weight: 1000;
            line-height: 2.25
        }

        .blank {
            display: inline-flex;
            width: 68px;
            height: 47px;
            vertical-align: middle;
            align-items: center;
            justify-content: center;
            border: 3px dashed var(--orange);
            border-radius: 11px;
            background: #fffaf5;
            color: #6043d9;
            margin: 0 3px;
            font-size: 21px;
            transition: .18s
        }

        .blank.filled {
            border-style: solid;
            border-color: #7659e8;
            background: #f0edff
        }

        .blank.correct {
            border-color: var(--green);
            background: #e7fff3;
            color: #16885b
        }

        .blank.active {
            border-color: #6847e8;
            background: #f0edff;
            box-shadow: 0 0 0 4px rgba(104, 71, 232, .14);
            transform: scale(1.04);
        }

        .blank.drag-over {
            border-color: #55b449;
            background: #eaffea;
            box-shadow: 0 0 0 5px rgba(85, 180, 73, .15);
            transform: scale(1.06);
        }

        .property-line {
            margin-top: 15px;
            font-size: 20px;
            font-weight: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .property-box {
            display: inline-flex;
            min-width: 165px;
            height: 44px;
            align-items: center;
            justify-content: center;
            border: 3px dashed var(--orange);
            border-radius: 11px;
            background: #fffaf5;
            color: #6043d9;
            margin-right: 5px
        }

        .property-box.filled {
            border-style: solid;
            border-color: #7659e8;
            background: #f0edff
        }

        .property-box.correct {
            border-color: var(--green);
            background: #e7fff3;
            color: #16885b
        }

        /* Options */
        .answer-area {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 14px;
            margin-block: 40px;
        }

        .answer-panel {
            background: #fafbff;
            border: 1px solid #e5e8f1;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }

        .panel-title {
            text-align: center;
            color: #2f4f4f;
            font-size: 20px;
            font-weight: 500 !important;
            letter-spacing: .7px;
            margin-bottom: 15px
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 9px;
            flex-wrap: wrap
        }

        .option {
            min-width: 100px;
            border: 2px solid #6781c7;
            background: #fff;
            border-radius: 13px;
            padding: 11px 15px;
            color: #34405a;
            font-size:22px;
            font-weight: 400;
            cursor: pointer;
            box-shadow: 0 5px 10px #26334d0a;
            transition: transform .15s, opacity .15s
        }

        .option:hover:not(:disabled) {
            transform: translateY(-5px);
            /* border-color: #927af2 */
        }

        .option:disabled {
            cursor: default
        }

        .option.correct-choice {
            background: #55b449;
            border-color: #55b449;
            color: #fff;
            animation: choiceSuccess .45s ease
        }

        .option.wrong-choice {
            animation: optionWrong .45s ease;
            border-color: #e74c3c;
            color: #c62d22;
            background: #fff2ef
        }

        .property-option {
            min-width: 125px;
            font-size: 20px;
            background: #fff9ea;
            border-color: #f0c760;
            color: #2f4f4f
        }

        .property-option.correct-choice {
            background: #55b449;
            border-color: #55b449;
            color: #fff
        }

        @keyframes choiceSuccess {
            50% {
                transform: scale(1.06)
            }
        }

        @keyframes optionWrong {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-5px)
            }

            75% {
                transform: translateX(5px)
            }
        }

        /* Feedback */
        .feedback {
            min-height: 40px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 800;
            color: #7b8497
        }

        .feedback.good {
            color: #16813b
        }

        .feedback.bad {
            color: #c62d22
        }

        /* Navigation — same reference style */
        .nav {
            width: 60%;
            margin: 14px auto 0;
            padding-top: 18px;
            /* border-top: 2px solid #e3e6eb; */
            display: grid;
            grid-template-columns: 1fr  1fr;
            align-items: center;
            justify-items: center;
            gap: 20px;
            position: relative;
            z-index: 20
        }

        .nav #prevBtn {
            justify-self: start
        }

        .nav #nextBtn {
            justify-self: end
        }

        .nav-progress {
            color: #12265d;
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            min-width: 60px;
            display: none;
        }

        .nav button {
            min-width: 112px;
            border: 0;
            border-radius: 999px;
            padding: 11px 20px;
            background: #55b449;
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 5px 0 #3d9634;
            cursor: pointer;
            transition: transform .15s ease, opacity .15s ease
        }

        .nav button:hover:not(:disabled) {
            transform: translateY(-2px)
        }

        .nav button:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #3d9634
        }

        .nav button:disabled {
            opacity: .45;
            cursor: default;
            box-shadow: 0 3px 0 #cfd9cf
        }

        .lock-text {
            text-align: center;
            color: #8a93a5;
            font-size: 11px;
            font-weight: 800;
            margin-top: 8px
        }

        /* Emoji popup — same reference */
        .emoji-pop {
            position: fixed;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            font-size: 82px;
            pointer-events: none;
            z-index: 9999;
            animation: emojiPop 1.1s ease-out forwards
        }

        @keyframes emojiPop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.35)
            }

            22% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.18)
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -75%) scale(.82)
            }
        }

        /* Final popup — same reference */
        .final-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn .4s ease;
            background: rgba(18, 38, 93, .10)
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        .final-modal {
            background: #fff;
            max-width: 400px;
            width: 90%;
            padding: 36px 28px 32px;
            border-radius: 56px 20px 56px 20px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
            animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275)
        }

        @keyframes popUp {
            from {
                transform: scale(.8);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        .final-modal .icon-big {
            font-size: 52px;
            margin-bottom: 6px;
            display: block
        }

        .final-modal h2 {
            font-size: 30px;
            font-weight: 800;
            color: #1e1e2a;
            margin: 0 0 8px
        }

        .final-modal p {
            font-size: 17px;
            color: #3d3d4a;
            margin: 0 0 22px
        }

        .final-modal .btn-playagain {
            border: none;
            background: linear-gradient(180deg, #ffb347, #f58a2e);
            padding: 12px 36px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 18px;
            color: #2d1f00;
            box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
            cursor: pointer
        }

        /* Small reward */
        .reward {
            position: fixed;
            left: 50%;
            top: 30%;
            transform: translate(-50%, -50%) scale(.5);
            opacity: 0;
            background: #fff;
            color: #16813b;
            padding: 12px 20px;
            border-radius: 18px;
            box-shadow: 0 18px 45px #0002;
            font-weight: 1000;
            pointer-events: none;
            z-index: 9998
        }

        .reward.show {
            animation: rewardPop .9s ease
        }

        @keyframes rewardPop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.5)
            }

            25%,
            70% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1)
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -68%) scale(1)
            }
        }

        @media(max-width:760px) {
            .header {
                flex-wrap: wrap
            }

            .progress-area {
                width: 100%;
                max-width: none;
                order: 3
            }

            .question-card {
                grid-template-columns: 1fr;
                gap: 12px
            }

            .question-image {
                height: 180px
            }

            .question-image img {
                max-width: 330px
            }

            .answer-area {
                grid-template-columns: 1fr
            }

            .nav {
                gap: 10px
            }
        }

        @media(max-width:480px) {
            .app {
                width: 95%;
                margin-top: 12px
            }

            .game-card {
                padding: 13px;
                border-radius: 23px
            }

            .question-card {
                padding: 12px
            }

            .question-image {
                height: 160px
            }

            .equation {
                font-size: 21px
            }

            .blank {
                width: 59px;
                height: 43px
            }

            .property-box {
                min-width: 145px
            }

            .nav button {
                min-width: 90px;
                padding: 9px 13px;
                font-size: 13px
            }

            .nav-progress {
                font-size: 14px
            }
        }

        /* Tablet and medium desktop */
        @media (min-width:761px) and (max-width:1199px) {
            .app {
                width: min(1000px, 94vw)
            }

            .question-card {
                grid-template-columns: 230px 1fr;
                gap: 18px
            }

            .question-image {
                height: 215px
            }

            .equation {
                font-size: 29px
            }

            .answer-area {
                gap: 12px
            }
        }

        /* Small-height monitors / laptop screens */
        @media (min-width:761px) and (max-height:800px) {
            .app {
                margin-top: 14px;
                margin-bottom: 20px
            }

            .game-card {
                padding: 18px;
                margin-top: 12px
            }

            .question-card {
                min-height: 230px;
                padding: 15px
            }

            .question-image {
                height: 190px
            }

            .answer-panel {
                padding: 11px
            }

            .nav {
                margin-top: 10px;
                padding-top: 12px
            }
        }

        /* Landscape phones */
        @media (max-width:760px){
            .app {
                margin: 8px auto 15px
            }

            .header {
                padding: 10px 14px
            }

            .game-card {
                padding: 12px;
                margin-top: 10px
            }

            .question-card {
                grid-template-columns: 250px 1fr;
                min-height: 190px
            }

            .question-image {
                height: 155px
            }

            .answer-area {
                grid-template-columns: 1fr 1fr
            }

            .option {
                padding: 8px 12px
            }
        }

        /* =========================================================
   LARGE MONITOR RESPONSIVE LAYOUT
   1600px - 1920px
   ========================================================= */
        @media screen and (min-width:1500px) and (max-width:1920px) {

            .app {
                width: min(1380px, 90vw);
                margin: 42px auto 55px;
            }

            .header {
                min-height: 88px;
                padding: 20px 28px;
                border-radius: 26px;
                gap: 28px;
            }

            .logo {
                width: 58px;
                height: 58px;
                border-radius: 18px;
                font-size: 30px;
            }

            .header-title h2 {
                font-size: 25px;
            }

            .header-title p {
                font-size: 14px;
            }

            .progress-area {
                width: 440px;
            }

            .progress-top {
                font-size: 14px;
                margin-bottom: 9px;
            }

            .progress-track {
                height: 13px;
            }

            .score {
                font-size: 16px;
                padding: 11px 16px;
                border-radius: 16px;
            }

            .game-card {
                margin-top: 24px;
                padding: 30px;
                border-radius: 34px;
            }

            .game-top {
                margin-bottom: 20px;
            }

            .level {
                padding: 11px 18px;
                font-size: 14px;
            }

            /* Larger question card while preserving image-left layout */
            .question-card {
                min-height: 390px;
                grid-template-columns: 360px 1fr;
                gap: 38px;
                padding: 30px;
                border-radius: 28px;
            }

            .question-image {
                height: 325px;
                border-radius: 23px;
            }

            .question-image img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .question-content {
                padding: 10px 35px;
            }

            .question-number {
                font-size: 25px;
                margin-bottom: 9px;
            }

            .mission {
                font-size: 20px;
                margin-bottom: 25px;
            }

            .equation {
                font-size: 42px;
                line-height: 2.15;
            }

            .blank {
                width: 88px;
                height: 58px;
                border-width: 3px;
                border-radius: 14px;
                font-size: 27px;
                margin: 0 5px;
            }

            .property-line {
                margin-top: 14px;
                font-size: 22px;
            }

            .property-box {
                min-width: 215px;
                height: 56px;
                border-radius: 14px;
                font-size: 20px;
                margin-right: 7px;
            }

            /* Larger answer panels */
            .answer-area {
                gap: 20px;
                margin-top: 21px;
            }

            .answer-panel {
                padding: 21px;
                border-radius: 23px;
            }

            .panel-title {
                font-size: 18px;
                margin-bottom: 15px;
            }

            .options {
                gap: 13px;
            }

            .option {
                min-width: 130px;
                padding: 20px 21px;
                border-radius: 15px;
                font-size: 28px;
            }

            .property-option {
                min-width: 165px;
                font-size: 25px;
            }

            .feedback {
                min-height: 50px;
                margin-top: 17px;
                font-size: 16px;
            }

            /* Monitor navigation */
            .nav {
                margin-top: 20px;
                padding-top: 22px;
                gap: 30px;
            }

            .nav button {
                min-width: 145px;
                padding: 13px 27px;
                font-size: 17px;
            }

            .nav-progress {
                font-size: 20px;
                min-width: 70px;
            }

            .lock-text {
                font-size: 13px;
                margin-top: 10px;
            }

            /* Larger popup on monitor */
            .final-modal {
                max-width: 480px;
                padding: 42px 35px 38px;
                border-radius: 60px 24px 60px 24px;
            }

            .final-modal .icon-big {
                font-size: 62px;
            }

            .final-modal h2 {
                font-size: 34px;
            }

            .final-modal p {
                font-size: 18px;
            }

            .final-modal .btn-playagain {
                padding: 14px 42px;
                font-size: 19px;
            }
        }

        /* Extra-wide 1920px monitors */
        @media screen and (min-width:1921px) {
            .app {
                width: min(1450px, 88vw);
                margin-top: 45px;
            }

            .question-card {
                min-height: 410px;
                grid-template-columns: 380px 1fr;
                gap: 42px;
            }

            .question-image {
                height: 345px;
            }

            .equation {
                font-size: 45px;
            }

            .answer-area {
                gap: 22px;
            }
        }

        /* Large monitors with reduced vertical space */
        @media screen and (min-width:1600px) and (max-width:1920px) and (max-height:850px) {
            .app {
                margin-top: 20px;
                margin-bottom: 25px;
            }

            .header {
                min-height: 72px;
                padding: 14px 24px;
            }

            .logo {
                width: 48px;
                height: 48px;
                font-size: 25px;
            }

            .header-title h2 {
                font-size: 21px;
            }

            .game-card {
                margin-top: 15px;
                padding: 21px;
            }

            .question-card {
                min-height: 285px;
                grid-template-columns: 285px 1fr;
                padding: 20px;
                gap: 28px;
            }

            .question-image {
                height: 245px;
            }

            .question-content {
                padding: 5px 20px;
            }

            .equation {
                font-size: 32px;
            }

            .blank {
                width: 72px;
                height: 48px;
                font-size: 22px;
            }

            .property-box {
                min-width: 175px;
                height: 46px;
            }

            .answer-area {
                margin-top: 13px;
            }

            .answer-panel {
                padding: 14px;
            }

            .feedback {
                min-height: 34px;
                margin-top: 8px;
            }

            .nav {
                margin-top: 10px;
                padding-top: 14px;
            }

            .lock-text {
                margin-top: 5px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../shared/quiz-ui.css">
</head>

<body>

    <div class="app">
        <header class="header">
            <div class="header-left">
                <div class="logo">🧠</div>
                <div class="header-title">
                    <h2>Math Adventure</h2>
                    <p>Multiplication Property Quest</p>
                </div>
            </div>
            <div class="progress-area">
                <div class="progress-top">
                    <span id="progressText">Question 1 of 4</span>
                    <span id="percent">25%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            <div class="score">⭐ <span id="score">0</span>/4</div>
        </header>

        <main class="game-card">
            <div class="game-top">
                <!-- <div class="level" id="level">LEVEL 1</div> -->
            </div>

            <section class="question-card">
                <div class="question-image">
                    <img id="childrenImage" alt="Children learning mathematics">
                </div>
                <div class="question-content">
                    <div class="question-number" id="questionNumber">QUESTION 1</div>
                    <div class="mission" id="mission"></div>
                    <div class="equation" id="equation"></div>
                    <div class="property-line">
                        <span class="property-box" id="propertyBox"></span> property
                    </div>
                </div>
            </section>

            <section class="answer-area">
                <div class="answer-panel">
                    <div class="panel-title">🔢 Choose a Option</div>
                    <div class="options" id="digitOptions"></div>
                </div>
                <div class="answer-panel">
                    <div class="panel-title">⚡ Choose the Property</div>
                    <div class="options" id="propertyOptions"></div>
                </div>
            </section>

            <!-- <div class="feedback" id="feedback">Choose an answer.</div> -->

            <nav class="nav" aria-label="Question navigation">
                <button id="prevBtn" disabled>Prev</button>
                <div class="nav-progress" id="navProgress">1/4</div>
                <button id="nextBtn" disabled>Next</button>
            </nav>

            <!-- <div class="lock-text" id="lockText">
                🔒 Next is locked until this question is completely correct.
            </div> -->
        </main>
    </div>

    <div class="reward" id="reward">🎉 Great job!</div>

    <script>
        (() => {
            const childImage = "../assets/images/FTB.png"
            const questions = [
                {
                    mission: "Use the same factors in a different order.",
                    parts: ["35 × 8 = 8 × ", { blank: 35 }],
                    correct: [35], property: "Commutative",
                    digits: [35, 53, 30], properties: ["Commutative", "Associative"]
                },
                {
                    mission: "Use the identity number to keep the value unchanged.",
                    parts: [{ blank: 1 }, " × 29 = 29 × 1 = ", { blank: 29 }],
                    correct: [1, 29], property: "Identity",
                    digits: [1, 29, 9], properties: ["Identity", "Zero"]
                },
                {
                    mission: "Change the grouping of the factors.",
                    parts: ["19 × (", { blank: 46 }, " × 32) = (46 × ", { blank: 19 }, ") × ", { blank: 32 }],
                    correct: [46, 19, 32], property: "Associative",
                    digits: [46, 19, 32], properties: ["Associative", "Commutative"]
                },
                {
                    mission: "Use zero to make the product zero.",
                    parts: [{ blank: 0 }, " × 67 = 0"],
                    correct: [0], property: "Zero",
                    digits: [0, 67, 1], properties: ["Zero", "Identity"]
                }
            ];

            const content = {
                // level:document.getElementById("level"),
                questionNumber: document.getElementById("questionNumber"),
                mission: document.getElementById("mission"),
                equation: document.getElementById("equation"),
                propertyBox: document.getElementById("propertyBox"),
                digitOptions: document.getElementById("digitOptions"),
                propertyOptions: document.getElementById("propertyOptions"),
                // feedback: document.getElementById("feedback"),
                prevBtn: document.getElementById("prevBtn"),
                nextBtn: document.getElementById("nextBtn"),
                navProgress: document.getElementById("navProgress"),
                progressText: document.getElementById("progressText"),
                percent: document.getElementById("percent"),
                progressFill: document.getElementById("progressFill"),
                score: document.getElementById("score"),
                // lockText: document.getElementById("lockText"),
                reward: document.getElementById("reward")
            };

            document.getElementById("childrenImage").src = childImage;

            let current = 0;
            let xp = 0;
            let audioCtx = null;

            const state = questions.map(() => ({
                answers: [],
                property: "",
                completed: false,
                attempts: 0,
                activeBox: 0
            }));

            function getCtx() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === "suspended") audioCtx.resume();
                return audioCtx;
            }

            /* SAME SOUND PATTERN AS REFERENCE CODE */
            function beep(frequency, duration, type = "sine") {
                try {
                    const ctx = getCtx();
                    const oscillator = ctx.createOscillator();
                    const gain = ctx.createGain();

                    oscillator.type = type;
                    oscillator.frequency.value = frequency;
                    oscillator.connect(gain);
                    gain.connect(ctx.destination);

                    gain.gain.setValueAtTime(.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(
                        .0001, ctx.currentTime + duration / 1000
                    );

                    oscillator.start();
                    oscillator.stop(ctx.currentTime + duration / 1000);
                } catch (e) { }
            }

            const sound = {
                correct() {
                    beep(660, 110);
                    setTimeout(() => beep(880, 160), 110);
                },
                wrong() {
                    beep(180, 220, "sawtooth");
                },
                finish() {
                    [523, 659, 784, 1047].forEach((frequency, index) => {
                        setTimeout(() => beep(frequency, 150), index * 130);
                    });
                },
                click() {
                    beep(430, 80);
                }
            };

            function showEmoji(emoji) {
                const element = document.createElement("div");
                element.className = "emoji-pop";
                element.textContent = emoji;
                document.body.appendChild(element);
                setTimeout(() => element.remove(), 1100);
            }

            function showReward() {
                content.reward.classList.remove("show");
                void content.reward.offsetWidth;
                content.reward.classList.add("show");
            }

            function burstConfetti(element) {
                const rect = element.getBoundingClientRect();
                if (typeof confetti === "function") {
                    confetti({
                        particleCount: 34,
                        spread: 70,
                        startVelocity: 22,
                        origin: {
                            x: (rect.left + rect.width / 2) / innerWidth,
                            y: (rect.top + rect.height / 2) / innerHeight
                        },
                        colors: ["#6635dc", "#ff4e83", "#4e8ff0", "#76b93b", "#f4ae25", "#4ecdc4"]
                    });
                }
            }

            function loadConfetti() {
                if (document.getElementById("confettiLib")) return;
                const script = document.createElement("script");
                script.id = "confettiLib";
                script.src = "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js";
                document.head.appendChild(script);
            }

            loadConfetti();

            function allNumbersCorrect(q, s) {
                return q.correct.length === s.answers.length &&
                    q.correct.every((value, index) => s.answers[index] === value);
            }

            function renderQuestion(index) {
                current = index;
                const q = questions[index];
                const s = state[index];

                content.questionNumber.textContent = "QUESTION " + (index + 1);
                content.mission.textContent = q.mission;

                const percent = Math.round(((index + 1) / questions.length) * 100);
                content.progressText.textContent = `Question ${index + 1} of ${questions.length}`;
                content.percent.textContent = percent + "%";
                content.progressFill.style.width = percent + "%";
                content.navProgress.textContent = `${index + 1}/${questions.length}`;
                content.score.textContent = state.filter(x => x.completed).length;

                /* Keep activeBox valid. It can be ANY empty number box. */
                const firstEmpty = q.correct.findIndex((_, i) => s.answers[i] === undefined);
                if (s.activeBox === undefined || s.activeBox < 0 || s.activeBox >= q.correct.length || s.answers[s.activeBox] !== undefined) {
                    s.activeBox = firstEmpty >= 0 ? firstEmpty : -1;
                }

                /* Equation / number boxes */
                content.equation.innerHTML = "";
                let blankIndex = 0;

                q.parts.forEach(part => {
                    if (typeof part === "string") {
                        content.equation.append(document.createTextNode(part));
                    } else {
                        const box = document.createElement("span");
                        const targetIndex = blankIndex;
                        box.className = "blank";

                        if (s.answers[targetIndex] !== undefined) {
                            box.textContent = s.answers[targetIndex];
                            box.classList.add("filled", "correct");
                        } else if (!s.completed && s.activeBox === targetIndex) {
                            box.classList.add("active");
                        }

                        /* CLICK ANY EMPTY BOX = MAKE THAT BOX ACTIVE */
                        box.addEventListener("click", () => {
                            if (s.completed || s.answers[targetIndex] !== undefined) return;
                            s.activeBox = targetIndex;
                            renderQuestion(current);
                            sound.click();
                        });

                        /* DRAG A NUMBER TO ANY BOX */
                        box.addEventListener("dragover", event => {
                            if (s.completed || s.answers[targetIndex] !== undefined) return;
                            event.preventDefault();
                            event.dataTransfer.dropEffect = "copy";
                            box.classList.add("drag-over");
                        });

                        box.addEventListener("dragleave", () => {
                            box.classList.remove("drag-over");
                        });

                        box.addEventListener("drop", event => {
                            event.preventDefault();
                            event.stopPropagation();
                            box.classList.remove("drag-over");

                            if (s.completed || s.answers[targetIndex] !== undefined) return;

                            let raw = event.dataTransfer.getData("application/x-math-number") ||
                                event.dataTransfer.getData("text/plain");
                            let data;
                            try { data = JSON.parse(raw); } catch (e) {
                                const n = Number(raw);
                                if (Number.isFinite(n)) data = { type: "number", value: n };
                            }
                            if (!data || data.type !== "number") return;

                            /* DROP IS VALID FOR ANY BOX — CHECK THAT BOX'S OWN ANSWER */
                            if (Number(data.value) !== Number(q.correct[targetIndex])) {
                                sound.wrong();
                                showEmoji("😔");
                                box.classList.remove("wrong-choice");
                                void box.offsetWidth;
                                box.classList.add("wrong-choice");
                                setTimeout(() => box.classList.remove("wrong-choice"), 520);
                                return;
                            }

                            s.answers[targetIndex] = Number(data.value);
                            s.activeBox = q.correct.findIndex((_, i) => s.answers[i] === undefined);
                            sound.correct();
                            showEmoji("🥳");

                            if (s.answers.filter(v => v !== undefined).length === q.correct.length) {
                                checkQuestion();
                            } else {
                                renderQuestion(current);
                            }
                        });

                        content.equation.append(box);
                        blankIndex++;
                    }
                });

                /* Property */
                content.propertyBox.textContent = s.property || "";
                content.propertyBox.className = "property-box" + (s.property ? " filled" : "");
                if (s.completed) content.propertyBox.classList.add("correct");

                content.propertyBox.addEventListener("dragover", event => {
                    if (s.completed || s.property) return;
                    event.preventDefault();
                    event.dataTransfer.dropEffect = "copy";
                    content.propertyBox.classList.add("drag-over");
                });
                content.propertyBox.addEventListener("dragleave", () => content.propertyBox.classList.remove("drag-over"));
                content.propertyBox.addEventListener("drop", event => {
                    event.preventDefault();
                    content.propertyBox.classList.remove("drag-over");
                    if (s.completed || s.property) return;

                    let data;
                    try { data = JSON.parse(event.dataTransfer.getData("text/plain")); } catch (e) { return; }
                    if (!data || data.type !== "property") return;

                    if (data.value !== q.property) {
                        sound.wrong();
                        showEmoji("😔");
                        content.propertyBox.classList.remove("wrong-choice");
                        void content.propertyBox.offsetWidth;
                        content.propertyBox.classList.add("wrong-choice");
                        setTimeout(() => content.propertyBox.classList.remove("wrong-choice"), 520);
                        return;
                    }

                    s.property = data.value;
                    sound.correct();
                    showEmoji("🥳");
                    checkQuestion();
                });

                /* NUMBER OPTIONS */
                content.digitOptions.innerHTML = "";
                q.digits.forEach(number => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "option";
                    button.textContent = number;
                    button.draggable = !s.completed;
                    button.dataset.number = number;

                    const allNumberBoxesFilled = s.answers.filter(v => v !== undefined).length >= q.correct.length;
                    const requiredCount = q.correct.filter(x => x === number).length;
                    const usedCount = s.answers.filter(x => x === number).length;

                    if (allNumberBoxesFilled || (requiredCount > 0 && usedCount >= requiredCount)) {
                        button.classList.add("used");
                        button.disabled = true;
                    }

                    button.addEventListener("dragstart", event => {
                        if (button.disabled || s.completed) {
                            event.preventDefault();
                            return;
                        }
                        const payload = JSON.stringify({ type: "number", value: number });
                        event.dataTransfer.setData("application/x-math-number", payload);
                        event.dataTransfer.setData("text/plain", payload);
                        event.dataTransfer.effectAllowed = "copy";
                    });

                    /* CLICK OPTION -> FILL THE CURRENTLY ACTIVE BOX */
                    button.addEventListener("click", () => {
                        if (s.completed || button.disabled) return;

                        let targetIndex = s.activeBox;
                        if (targetIndex < 0 || targetIndex >= q.correct.length || s.answers[targetIndex] !== undefined) {
                            targetIndex = q.correct.findIndex((_, i) => s.answers[i] === undefined);
                        }
                        if (targetIndex < 0) return;

                        if (Number(number) !== Number(q.correct[targetIndex])) {
                            s.attempts++;
                            sound.wrong();
                            showEmoji("😔");
                            button.classList.remove("wrong-choice");
                            void button.offsetWidth;
                            button.classList.add("wrong-choice");
                            setTimeout(() => button.classList.remove("wrong-choice"), 520);
                            return;
                        }

                        s.answers[targetIndex] = number;
                        s.activeBox = q.correct.findIndex((_, i) => s.answers[i] === undefined);
                        sound.correct();
                        showEmoji("🥳");

                        if (s.answers.filter(v => v !== undefined).length === q.correct.length) {
                            checkQuestion();
                        } else {
                            renderQuestion(current);
                        }
                    });

                    content.digitOptions.appendChild(button);
                });

                /* PROPERTY OPTIONS */
                content.propertyOptions.innerHTML = "";
                q.properties.forEach(property => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "option property-option";
                    button.textContent = property + " property";
                    button.draggable = !s.property && !s.completed;

                    if (s.property) {
                        button.disabled = true;
                        button.classList.add("used");
                    }

                    button.addEventListener("dragstart", event => {
                        if (button.disabled || s.completed || s.property) {
                            event.preventDefault();
                            return;
                        }
                        event.dataTransfer.setData("text/plain", JSON.stringify({ type: "property", value: property }));
                        event.dataTransfer.effectAllowed = "copy";
                    });

                    button.addEventListener("click", () => {
                        if (s.completed || s.property) return;

                        if (property !== q.property) {
                            s.attempts++;
                            sound.wrong();
                            showEmoji("😔");
                            button.classList.remove("wrong-choice");
                            void button.offsetWidth;
                            button.classList.add("wrong-choice");
                            setTimeout(() => button.classList.remove("wrong-choice"), 520);
                            return;
                        }

                        s.property = property;
                        button.classList.add("correct-choice");
                        sound.correct();
                        showEmoji("🥳");
                        checkQuestion();
                    });

                    content.propertyOptions.appendChild(button);
                });

                content.prevBtn.disabled = index === 0;
                content.nextBtn.disabled = !s.completed;
                content.nextBtn.style.display = "block";
                content.nextBtn.textContent = "Next";
            }

            function checkQuestion() {
                const q = questions[current];
                const s = state[current];

                const numbersCorrect = allNumbersCorrect(q, s);
                const propertyCorrect = s.property === q.property;

                if (numbersCorrect && propertyCorrect) {
                    if (!s.completed) {
                        s.completed = true;
                        xp += 100;
                        sound.correct();
                        showEmoji("🥳");
                        // showReward();
                        burstConfetti(content.nextBtn);
                    }

                    // content.feedback.className = "feedback good";
                    // content.feedback.textContent = "Great job!";
                    content.nextBtn.disabled = false;
                    // content.lockText.textContent = "🔓 Question complete! Next is unlocked.";

                    renderQuestion(current);

                    /* Automatically open the final popup after the last question is correct. */
                    if (current === questions.length - 1) {
                        setTimeout(() => finishQuiz(), 700);
                    }
                    return;
                }

                s.completed = false;
                content.nextBtn.disabled = true;

                // if (numbersCorrect && !propertyCorrect) {
                //     content.feedback.className = "feedback bad";
                //     content.feedback.textContent = "Numbers are correct. Choose the correct property.";
                // } else if (propertyCorrect && !numbersCorrect) {
                //     content.feedback.className = "feedback bad";
                //     content.feedback.textContent = "Property is correct. Check the number boxes.";
                // } else {
                //     content.feedback.className = "feedback";
                //     content.feedback.textContent = "Keep going! Complete both parts.";
                // }

                renderQuestion(current);
            }

            function finishQuiz() {
                sound.finish();
                showFinalPopup();
            }

            /* SAME FINAL POPUP STRUCTURE / BEHAVIOR AS REFERENCE */
            function showFinalPopup() {
                if (document.querySelector(".final-overlay")) return;

                const overlay = document.createElement("div");
                const modal = document.createElement("div");

                overlay.className = "final-overlay";
                modal.className = "final-modal";

                const total = state.filter(s => s.completed).length;

                modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain"> <i class="fa-solid fa-rotate-right"></i> Play again</button>
    `;

                overlay.appendChild(modal);
                document.body.appendChild(overlay);

                setTimeout(() => burstConfetti(modal), 80);
                setTimeout(() => burstConfetti(modal), 350);
                setTimeout(() => burstConfetti(modal), 650);

                modal.querySelector(".btn-playagain").addEventListener("click", () => {
                    overlay.remove();

                    state.forEach(s => {
                        s.answers = [];
                        s.property = "";
                        s.completed = false;
                        s.attempts = 0;
                        s.activeBox = 0;
                    });

                    current = 0;
                    xp = 0;
                    renderQuestion(0);
                });
            }

            /* SAME PREV / NEXT LOGIC AS REFERENCE */
            content.prevBtn.addEventListener("click", () => {
                if (current > 0) {
                    renderQuestion(current - 1);
                    sound.click();
                }
            });

            content.nextBtn.addEventListener("click", () => {
                if (!state[current].completed) return;

                if (current < questions.length - 1) {
                    renderQuestion(current + 1);
                    sound.click();
                } else {
                    /* Last-question text button remains Next; popup is normally automatic. */
                    finishQuiz();
                }
            });

            renderQuestion(0);
        })();
    </script>
    <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
