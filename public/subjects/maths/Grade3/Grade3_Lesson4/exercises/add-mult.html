<!DOCTYPE html>
<html lang="en">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px 20px;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ================= HEADER ================= */

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0;
    }

    .header h1 {
      color: #12265d;
      font-size: 32px;
      line-height: 1.1;
      font-weight: 500;
    }

    /* ================= QUESTION ================= */

    .question-screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0;
    }

    .question-label {
      color: #12265d;
      font-size: 22px;
      font-weight: 800;
      /* margin-bottom: 50px; */
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------------- PICTURE + ADDEND ROW ----------------
       Each group is a single column: the picture on top, its number
       box directly underneath, so the box is always centered under
       its own image — no separate rows to keep in sync. The "+", "="
       and sum box each sit in their own column too, with an invisible
       spacer matching the picture height, so everything still lines
       up along the same baseline as the number boxes. */

    .picture-addend-row {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 20px;
      min-width: 0;
    }

    .group-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .group-col .symbol {
      padding: 0;
    }

    .spacer {
      visibility: hidden;
    }

    .mini-picture-frame {
      width: 150px;
      height: 130px;
      flex: 0 0 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 12px;
    }

    .mini-picture-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ================= ADDEND / EQUATION ROWS ================= */

    .addend-input {
      width: 92px;
      height: 52px;
      border: 2px solid #ff9b2f;
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: #12265d;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 25px;
      font-weight: 800;
      box-shadow: 0 3px 8px rgba(18, 38, 93, .06);
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .addend-input.picture-linked {
      background: #fff5e9;
      border-color: #ef8b22;
    }

    .addend-input:read-only {
      cursor: default;
    }

    input.addend-input,
    input.total-input {
      font-family: inherit;
    }

    /* Active/editable input state — same dimensions, distinct active border. */
    input.addend-input:focus,
    input.total-input:focus {
      border-color: #5b63e6;
      background: #f7f8ff;
      box-shadow: 0 0 0 4px rgba(91, 99, 230, .16),
        0 4px 12px rgba(18, 38, 93, .10);
      transform: translateY(-1px);
    }

    input.addend-input:focus-visible,
    input.total-input:focus-visible {
      border-color: #4f46e5;
      outline: 3px solid rgba(79, 70, 229, .12);
      outline-offset: 1px;
    }

    .symbol {
      flex: 0 0 auto;
      min-width: 26px;
      color: #12265d;
      font-size: 29px;
      font-weight: 800;
      text-align: center;
    }

    /* text-form repeated addition (e / f) */
    .sentence-line {
      font-size: 30px;
      font-weight: 800;
      color: #12265d;
      text-align: center;
      line-height: 1.4;
      margin: 20px auto 30px;
      word-break: keep-all;
    }

    /* ================= TOTAL / MULTIPLICATION ROW (unchanged) ================= */

    .total-row {
      margin-top: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .equals {
      font-size: 31px;
      font-weight: 800;
      color: #12265d;
    }

    .total-input {
      width: 150px;
      height: 58px;
      border: 2px solid #009cb4;
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: #12265d;
      text-align: center;
      font-size: 29px;
      font-weight: 800;
      box-shadow: 0 3px 8px rgba(18, 38, 93, .06);
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    /* Wrong answer: red blink */
    .wrong-shake {
      animation: wrongBlink .5s ease;
    }

    @keyframes wrongBlink {
      0% {
        background: #fff;
        border-color: #ff9b2f;
      }

      25% {
        background: #ffe1e1;
        border-color: #e0483f;
      }

      50% {
        background: #fff;
        border-color: #ff9b2f;
      }

      75% {
        background: #ffe1e1;
        border-color: #e0483f;
      }

      100% {
        background: #fff;
        border-color: #ff9b2f;
      }
    }

    /* Correct answer: green border, locked */
    .correct-locked {
      border-color: #55b449 !important;
      background: #f2fbf1 !important;
      box-shadow: 0 0 0 4px rgba(85, 180, 73, .13) !important;
      cursor: default;
    }

    /* ================= CHECK BUTTON ================= */

    .check-btn-row {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }

    .check-btn {
      border: 0;
      width: 150px;
      height: 53px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 999px;
      background: #e0b453;
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #e9b23d;
      transition: transform .15s ease, opacity .15s ease;
    }

    .check-btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .check-btn:active:not(:disabled) {
      transform: translateY(2px);
    }

    .check-btn:disabled {
      opacity: .45;
      cursor: default;
    }

    .hidden {
      display: none !important;
    }

    /* ================= NAV ================= */

    .nav {
      width: 70%;
      margin: 0px auto 0;
      /* padding-top: 18px; */
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 100px;
      position: relative;
      z-index: 20;
    }

    .nav #prevBtn {
      justify-self: start;
    }

    .nav #nextBtn {
      justify-self: end;
    }

    .nav-progress {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
      display: none;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    #prevBtn {
      justify-self: start;
    }

    #nextBtn {
      justify-self: end;
    }

    /* ================= EMOJI / POPUP ================= */

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
      background: rgba(18, 38, 93, .10);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

===================================================== */













    /* ================= PICTURE GRID OVERRIDE =================
       Keep all existing HTML/JS unchanged.
       Keep each picture group centered without giving it an oversized
       flex column. The columns can shrink only when the question has
       many groups, so the row still fits the available layout width. */
    .picture-addend-row {
      justify-content: center;
      gap: 20px;
    }

    /* Picture columns: compact, centered, and shrinkable for 4/5/6 groups. */
    .picture-addend-row>.group-col:not(:has(.spacer)) {
      flex: 0 1 200px;
      width: 200px;
      max-width: 200px;
      min-width: 0;
    }

    /* The operator columns (+) stay narrow. */
    .picture-addend-row>.group-col:has(.spacer):not(:nth-last-child(-n+2)) {
      flex: 0 0 30px;
      width: 30px;
      min-width: 30px;
    }

    /* The final = gets its own narrow column and remains visible. */
    .picture-addend-row>.group-col:nth-last-child(2) {
      flex: 0 0 30px;
      width: 30px;
      min-width: 30px;
    }

    /* The final answer box keeps its normal width. */
    .picture-addend-row>.group-col:last-child {
      flex: 0 0 150px;
      width: 150px;
      min-width: 150px;
    }

    /* Laptop/desktop pictures: larger than the old 90px breakpoint size,
       but still limited by the actual group-column width. */
    .picture-addend-row>.group-col:not(:has(.spacer)) .mini-picture-frame {
      width: min(200px, 100%);
      height: 130px;
      flex-basis: 130px;
    }

    .picture-addend-row>.group-col:not(:has(.spacer)) .addend-input {
      width: 104px;
    }

    /* Keep the operator symbols centered without taking image-column space. */
    .picture-addend-row>.group-col:has(.spacer) .symbol {
      width: 30px;
      min-width: 30px;
      text-align: center;
    }

    /* ================= SYMBOL ALIGNMENT ONLY =================
       Keeps the existing layout/sizes unchanged.
       The spacer is made the same height as the picture area, and the
       operator cell matches the input height so + and = sit exactly
       in the vertical center of the number boxes. */
    .picture-addend-row>.group-col:has(.spacer) {
      align-items: center;
    }

    .picture-addend-row>.group-col:has(.spacer) .mini-picture-frame.spacer {
      width: 30px;
      min-width: 30px;
      height: 130px;
      flex: 0 0 130px;
    }

    .picture-addend-row>.group-col:has(.spacer) .symbol {
      width: 30px;
      min-width: 30px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding: 0;
      text-align: center;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/quiz-ui.css">
</head>

<body>
  <main class="quiz-wrap">

    <header class="header">
      <h1>Addition &amp; Multiplication Facts</h1>
    </header>

    <section class="question-screen">
      <div class="question-label" id="questionLabel">Question 1</div>
      <div class="question-content" id="questionContent"></div>
    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i>
        Prev
      </button>

      <div class="nav-progress" id="navProgress">1 / 6</div>

      <button id="nextBtn" disabled>
        Next
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {

      const QUESTIONS = [
        { type: "picture", label: "A)", image: "../assets/images/mango1.png", groups: 6, each: 2 },
        { type: "picture", label: "B)", image: "../assets/images/tokri.png", groups: 4, each: 4 },
        { type: "picture", label: "C)", image: "../assets/images/stars.png", groups: 5, each: 4 },
        { type: "picture", label: "D)", image: "../assets/images/rabbit.png", groups: 3, each: 8 },
        { type: "text", label: "E)", each: 7, groups: 7 },
        { type: "text", label: "F)", each: 9, groups: 9 }
      ];

      const content = document.getElementById("questionContent");
      const questionLabel = document.getElementById("questionLabel");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const navProgress = document.getElementById("navProgress");

      let current = 0;
      const completed = Array(QUESTIONS.length).fill(false);
      let audioCtx = null;

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);

        setTimeout(() => element.remove(), 1600);
      }

      function updateProgress() {
        navProgress.textContent = `${current + 1} / ${QUESTIONS.length}`;
      }

      /* ===================================================================
         Generic partial-correct checker used by every question type.
         boxes: [{ input, expected }]
         - Any box that matches its expected value gets locked green and
           made read-only, and is left alone on future clicks.
         - Any box that's wrong is cleared and shaken, but stays editable
           so the user can try again.
         - Only once every box in the question is locked does it count as
           complete: full correct fanfare plays and Next unlocks.
         =================================================================== */
      function checkBoxes(boxes, index) {
        let anyWrong = false;

        boxes.forEach(({ input, expected }) => {
          if (input.classList.contains("correct-locked")) return;

          const raw = input.value.trim();

          if (raw !== "" && Number(raw) === expected) {
            input.classList.add("correct-locked");
            input.readOnly = true;
          } else {
            anyWrong = true;
            input.classList.remove("wrong-shake");
            void input.offsetWidth;
            input.classList.add("wrong-shake");
            input.value = "";
            input.addEventListener("animationend", () => {
              input.classList.remove("wrong-shake");
            }, { once: true });
          }
        });

        const allDone = boxes.every(b => b.input.classList.contains("correct-locked"));

        if (allDone) {
          completed[index] = true;
          sound.correct();
          showEmoji("🥳");
          burstConfetti(boxes[boxes.length - 1].input);
          nextBtn.disabled = false;

          if (index === QUESTIONS.length - 1) {
            setTimeout(finishQuiz, 650);
          }
        } else if (anyWrong) {
          sound.wrong();
          showEmoji("😔");
        }

        return allDone;
      }

      function renderQuestion(index) {
        const q = QUESTIONS[index];
        current = index;

        // questionLabel.textContent = `Question ${index + 1} ${q.label ? "(" + q.label.replace(")", "") + ")" : ""}`;
        questionLabel.textContent = `${q.label}`;

        updateProgress();

        content.innerHTML = "";

        const sum = q.groups * q.each;

        if (q.type === "picture") {
          renderPictureQuestion(q, sum, index);
        } else {
          renderTextQuestion(q, sum, index);
        }

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !completed[index];
      }

      function renderPictureQuestion(q, sum, index) {
        // Single merged row: each group is one column with its picture
        // on top and its number box directly below it, so the box is
        // always centered under its own image. The "+" / "=" symbols
        // and the sum box are also their own columns, each with an
        // invisible spacer matching the picture height, so they still
        // line up on the same baseline as the number boxes below the
        // pictures.
        const row = document.createElement("div");
        row.className = "picture-addend-row";

        for (let i = 0; i < q.groups; i++) {
          const col = document.createElement("div");
          col.className = "group-col";

          const frame = document.createElement("div");
          frame.className = "mini-picture-frame";

          const img = document.createElement("img");
          img.src = q.image;
          img.alt = `Group ${i + 1}`;
          frame.appendChild(img);
          col.appendChild(frame);

          const addend = document.createElement("input");
          addend.className = "addend-input picture-linked";
          addend.type = "text";
          addend.value = q.each;
          addend.readOnly = true;
          addend.tabIndex = -1;
          col.appendChild(addend);

          row.appendChild(col);

          if (i < q.groups - 1) {
            const symCol = document.createElement("div");
            symCol.className = "group-col";

            const spacer = document.createElement("div");
            spacer.className = "mini-picture-frame spacer";
            symCol.appendChild(spacer);

            const plus = document.createElement("div");
            plus.className = "symbol";
            plus.textContent = "+";
            symCol.appendChild(plus);

            row.appendChild(symCol);
          }
        }

        const eqCol = document.createElement("div");
        eqCol.className = "group-col";

        const eqSpacer = document.createElement("div");
        eqSpacer.className = "mini-picture-frame spacer";
        eqCol.appendChild(eqSpacer);

        const eq1 = document.createElement("div");
        eq1.className = "symbol";
        eq1.textContent = "=";
        eqCol.appendChild(eq1);

        row.appendChild(eqCol);

        const sumCol = document.createElement("div");
        sumCol.className = "group-col";

        const sumSpacer = document.createElement("div");
        sumSpacer.className = "mini-picture-frame spacer";
        sumCol.appendChild(sumSpacer);

        const sumInput = document.createElement("input");
        sumInput.className = "total-input";
        sumInput.type = "text";
        sumInput.inputMode = "numeric";
        sumInput.autocomplete = "off";
        sumInput.maxLength = 3;
        sumInput.placeholder = "?";
        sumCol.appendChild(sumInput);

        row.appendChild(sumCol);

        // Multiplication row: auto-filled factors (read-only) + editable
        // product — unchanged from your original code.
        const multRow = document.createElement("div");
        multRow.className = "total-row";

        const factor1 = document.createElement("input");
        factor1.className = "addend-input picture-linked";
        factor1.type = "text";
        factor1.value = q.each;
        factor1.readOnly = true;
        factor1.tabIndex = -1;

        const times = document.createElement("div");
        times.className = "symbol";
        times.textContent = "×";

        const factor2 = document.createElement("input");
        factor2.className = "addend-input picture-linked";
        factor2.type = "text";
        factor2.value = q.each;
        factor2.readOnly = true;
        factor2.tabIndex = -1;

        const eq2 = document.createElement("span");
        eq2.className = "equals";
        eq2.textContent = "=";

        const productInput = document.createElement("input");
        productInput.className = "total-input";
        productInput.type = "text";
        productInput.inputMode = "numeric";
        productInput.autocomplete = "off";
        productInput.maxLength = 3;
        productInput.placeholder = "?";

        multRow.appendChild(factor1);
        multRow.appendChild(times);
        multRow.appendChild(factor2);
        multRow.appendChild(eq2);
        multRow.appendChild(productInput);

        const checkBtnRow = document.createElement("div");
        checkBtnRow.className = "check-btn-row";

        const checkBtn = document.createElement("button");
        checkBtn.className = "check-btn";
        checkBtn.type = "button";
        checkBtn.textContent = "Check";
        checkBtn.disabled = true;

        checkBtnRow.appendChild(checkBtn);

        content.appendChild(row);
        content.appendChild(multRow);
        content.appendChild(checkBtnRow);

        const boxes = [
          { input: sumInput, expected: sum },
          { input: productInput, expected: q.each * q.each }
        ];

        function refreshCheckState() {
          checkBtn.disabled = boxes.some(b =>
            !b.input.classList.contains("correct-locked") &&
            b.input.value.trim().length === 0
          );
        }

        boxes.forEach(({ input }) => {
          input.addEventListener("input", () => {
            input.value = input.value.replace(/\D/g, "").slice(0, 3);
            refreshCheckState();
          });
        });

        checkBtn.addEventListener("click", () => {
          checkBoxes(boxes, index);
          checkBtn.disabled = true;
        });

        if (completed[index]) {
          boxes.forEach(b => {
            b.input.value = b.expected;
            b.input.classList.add("correct-locked");
            b.input.readOnly = true;
          });
          checkBtn.disabled = true;
        }
      }

      function renderTextQuestion(q, sum, index) {
        const sentence = document.createElement("div");
        sentence.className = "sentence-line";
        sentence.textContent = Array(q.groups).fill(q.each).join(" + ");
        content.appendChild(sentence);

        const eqRow = document.createElement("div");
        eqRow.className = "total-row";

        const eqStart = document.createElement("span");
        eqStart.className = "equals";
        eqStart.textContent = "=";

        const factor1 = document.createElement("input");
        factor1.className = "total-input";
        factor1.type = "text";
        factor1.inputMode = "numeric";
        factor1.autocomplete = "off";
        factor1.maxLength = 2;
        factor1.placeholder = "?";

        const times = document.createElement("span");
        times.className = "equals";
        times.textContent = "×";

        const factor2 = document.createElement("input");
        factor2.className = "total-input";
        factor2.type = "text";
        factor2.inputMode = "numeric";
        factor2.autocomplete = "off";
        factor2.maxLength = 2;
        factor2.placeholder = "?";

        const eqEnd = document.createElement("span");
        eqEnd.className = "equals";
        eqEnd.textContent = "=";

        const productInput = document.createElement("input");
        productInput.className = "total-input";
        productInput.type = "text";
        productInput.inputMode = "numeric";
        productInput.autocomplete = "off";
        productInput.maxLength = 3;
        productInput.placeholder = "?";

        eqRow.appendChild(eqStart);
        eqRow.appendChild(factor1);
        eqRow.appendChild(times);
        eqRow.appendChild(factor2);
        eqRow.appendChild(eqEnd);
        eqRow.appendChild(productInput);

        const checkBtnRow = document.createElement("div");
        checkBtnRow.className = "check-btn-row";

        const checkBtn = document.createElement("button");
        checkBtn.className = "check-btn";
        checkBtn.type = "button";
        checkBtn.textContent = "Check";
        checkBtn.disabled = true;

        checkBtnRow.appendChild(checkBtn);

        content.appendChild(eqRow);
        content.appendChild(checkBtnRow);

        // Factor order matches the sentence above: q.groups groups of
        // q.each, so factor1 = groups, factor2 = each. (Individual
        // per-box locking needs a fixed expected value per box, so
        // either-order matching from the original code no longer
        // applies here.)
        const boxes = [
          { input: factor1, expected: q.groups },
          { input: factor2, expected: q.each },
          { input: productInput, expected: sum }
        ];

        function refreshCheckState() {
          checkBtn.disabled = boxes.some(b =>
            !b.input.classList.contains("correct-locked") &&
            b.input.value.trim().length === 0
          );
        }

        boxes.forEach(({ input }) => {
          input.addEventListener("input", () => {
            input.value = input.value.replace(/\D/g, "").slice(0, 3);
            refreshCheckState();
          });
        });

        checkBtn.addEventListener("click", () => {
          checkBoxes(boxes, index);
          checkBtn.disabled = true;
        });

        if (completed[index]) {
          boxes.forEach(b => {
            b.input.value = b.expected;
            b.input.classList.add("correct-locked");
            b.input.readOnly = true;
          });
          checkBtn.disabled = true;
        }
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i>
        Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();
          completed.fill(false);
          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) renderQuestion(current - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (completed[current] && current < QUESTIONS.length - 1) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);

    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
