  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: clip;
      padding: 12px 20px;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ================= HEADER ================= */

    .header {
      text-align: center;
      padding: 0px 0 8px;
      flex-shrink: 0;
    }

    .header h1 {
      color: #12265d;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 400;
    }

    /* ================= QUESTION ================= */

    .question-screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0px 0 0;
    }

    .question-label {
      color: #12265d;
      font-size: 22px;
      font-weight: 400;
      margin-bottom: 14px;
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* No card/container around the question. */
    .picture-row {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 22px;
      min-width: 0;
    }

    .picture-item {
      width: 180px;
      flex: 0 0 180px;
      min-width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      border-radius: 14px;
      padding: 5px;
      transition: transform .18s ease, background .18s ease;
    }

    .picture-item:hover {
      transform: translateY(-2px);
    }

    .picture-item.selected {
      background: #fff5e9;
    }

    .picture-frame {
      width: 180px;
      height: 120px;
      flex: 0 0 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 14px;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .picture-item.selected .picture-frame {
      border-color: #ff9b2f;
      box-shadow: 0 4px 14px rgba(255, 155, 47, .16);
    }

    .picture-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Pictures are displayed without visible + signs, but the symbol still
       takes up the same space as in the addend row below, so the number
       boxes line up directly under their matching picture. */
    .picture-row .symbol {
      visibility: hidden;
    }

    .symbol {
      flex: 0 0 auto;
      min-width: 26px;
      padding-top: 70px;
      color: #12265d;
      font-size: 29px;
      font-weight: 800;
      text-align: center;
    }

    /* ================= ADDENDS ================= */

    .addend-row {
      width: 100%;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      min-width: 0;
    }

    .addend-slot {
      width: 180px;
      flex: 0 0 180px;
      min-width: 180px;
      display: flex;
      justify-content: center;
    }

    .addend-input {
      width: 92px;
      height: 52px;
      border: 2px solid #ff9b2f;
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: #12265d;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 25px;
      font-weight: 800;
      box-shadow: 0 3px 8px rgba(18, 38, 93, .06);
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .addend-input.selected-number {
      background: #fff5e9;
      border-color: #ef8b22;
      box-shadow: 0 0 0 4px rgba(255, 155, 47, .10);
    }

    .total-input {
      width: 92px;
      height: 52px;
      border: 2px solid #ff9b2f;
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: #12265d;
      text-align: center;
      font-size: 25px;
      font-weight: 800;
      box-shadow: 0 3px 8px rgba(18, 38, 93, .06);
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .addend-input:focus,
    .total-input:focus {
      border-color: #ef7e12;
      box-shadow: 0 0 0 4px rgba(255, 155, 47, .13);
    }

    .addend-input.guided {

    }

      background: #fff5e9;
      border-color: #ef8b22;
    }

    .addend-input:read-only {
      cursor: pointer;
    }

    /* Wrong answer: red blink on the total input */
    .total-input.wrong-shake {
      animation: wrongBlink .5s ease;
    }

    @keyframes wrongBlink {
      0% {
        background: #fff;
        border-color: #ff9b2f;
      }

      25% {
        background: #ffe1e1;
        border-color: #e0483f;

        border-color: #ff9b2f;
      }

      75% {
        background: #ffe1e1;
        border-color: #e0483f;
      }

      100% {
        background: #fff;
        border-color: #ff9b2f;
      }

    /* Correct answer: green border, locked */
    .total-input.correct-locked {
      border-color: #55b449;
      background: #f2fbf1;
      box-shadow: 0 0 0 4px rgba(85, 180, 73, .13);
      cursor: default;

    .check-btn:disabled {
      opacity: .45;
      cursor: default;
    }

    .hidden {

    .nav {

      margin: 0px auto;
      padding-top: 0px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 100px;
      position: relative;

    .nav-progress {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
      display: none;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    #prevBtn {
      justify-self: start;
    }

    #nextBtn {
      justify-self: end;

    /* ================= SAME EMOJI / POPUP ================= */

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);

      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;

<body>
  <main class="quiz-wrap">

    <header class="header">
      <h1>Write the addition facts</h1>
    </header>

    <section class="question-screen">
      <div class="question-label" id="questionLabel">Question 1</div>
      <div class="question-content" id="questionContent"></div>
    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i>
        Prev
      </button>

      <div class="nav-progress" id="navProgress">1 / 4</div>

      <button id="nextBtn" disabled>
        Next
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {

      /*
        Source worksheet groups:
        a) 3 balloon groups, 9 balloons in each
        b) 2 bell groups, 8 bells in each
        c) 4 book groups, 5 books in each
        d) 5 flower groups, 8 flowers in each
      */

      const questions = [
        {
          image: "../assets/images/ballon.png",
          groups: 3,
          each: 13,
          answer: 39
        },
        {
          image: "../assets/images/popo.png",
          groups: 2,
          each: 8,
          answer: 16
        },
        {
          image: "../assets/images/books.png",
          groups: 4,
          each: 5,
          answer: 20
        },
        {
          image: "../assets/images/flowers.png",
          groups: 5,
          each: 8,
          answer: 40
        }
      ];

      const content = document.getElementById("questionContent");
      const questionLabel = document.getElementById("questionLabel");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const navProgress = document.getElementById("navProgress");

      let current = 0;
      const completed = Array(questions.length).fill(false);
      let audioCtx = null;

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);

        setTimeout(() => element.remove(), 1600);
      }

      function updateProgress() {
        navProgress.textContent = `${current + 1} / ${questions.length}`;
      }

      function renderQuestion(index) {
        const q = questions[index];
        current = index;

        questionLabel.textContent = `Question ${index + 1}`;
        updateProgress();

        content.innerHTML = "";

        const pictureRow = document.createElement("div");
        pictureRow.className = "picture-row";

        const addendRow = document.createElement("div");
        addendRow.className = "addend-row";

        const pictureItems = [];
        const addendInputs = [];

        /*
          IMPORTANT:
          The worksheet has:
            Q1 = 3 balloon GROUPS
            Q2 = 2 bell GROUPS
            Q3 = 4 book GROUPS
            Q4 = 5 flower GROUPS
    
          Each picture is one complete group.
          We do NOT split the individual objects inside a picture.
        */
        for (let i = 0; i < q.groups; i++) {

          const pictureItem = document.createElement("div");
          pictureItem.className = "picture-item";
          pictureItem.setAttribute("tabindex", "0");
          pictureItem.setAttribute("role", "button");
          pictureItem.setAttribute(
            "aria-label",
            `Picture group ${i + 1}, contains ${q.each} items`
          );

          const frame = document.createElement("div");
          frame.className = "picture-frame";

          const img = document.createElement("img");
          img.src = q.image;
          img.alt = `Picture group ${i + 1}: ${q.each} items`;
          frame.appendChild(img);
          pictureItem.appendChild(frame);

          pictureItems.push(pictureItem);
          pictureRow.appendChild(pictureItem);

          /*
            Addend box is NOT an input.
            It simply shows the number represented by that picture,
            centered directly below the matching picture.
          */
          const addendSlot = document.createElement("div");
          addendSlot.className = "addend-slot";

          const addend = document.createElement("div");
          addend.className = "addend-input picture-linked";
          addend.textContent = q.each;
          addend.setAttribute("aria-label", `${q.each}`);

          addendInputs.push(addend);
          addendSlot.appendChild(addend);
          addendRow.appendChild(addendSlot);

          if (i < q.groups - 1) {

            const addendSymbol = document.createElement("div");
            addendSymbol.className = "symbol";
            addendSymbol.style.paddingTop = "0";
            addendSymbol.textContent = "+";
            addendRow.appendChild(addendSymbol);

            /* Matching (hidden) placeholder in the picture row keeps the
               two rows the same width per column, so each number box
               stays centered under its picture. */
            const pictureSymbol = document.createElement("div");
            pictureSymbol.className = "symbol";
            pictureSymbol.textContent = "+";
            pictureRow.appendChild(pictureSymbol);
          }

          function selectPicture() {
            pictureItems.forEach(item => item.classList.remove("selected"));
            addendInputs.forEach(input => input.classList.remove("selected-number"));

            pictureItem.classList.add("selected");
            addend.classList.add("selected-number");
          }

          pictureItem.addEventListener("click", selectPicture);

          pictureItem.addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              selectPicture();
            }
          });
        }

        const totalRow = document.createElement("div");
        totalRow.className = "total-row";

        const equals = document.createElement("span");
        equals.className = "equals";
        equals.textContent = "=";

        const totalInput = document.createElement("input");
        totalInput.className = "total-input";
        totalInput.type = "text";
        totalInput.inputMode = "numeric";
        totalInput.autocomplete = "off";
        totalInput.maxLength = 3;
        totalInput.placeholder = "?";
        totalInput.setAttribute("aria-label", "Enter the sum");

        totalRow.appendChild(equals);
        totalRow.appendChild(totalInput);

        const checkBtnRow = document.createElement("div");
        checkBtnRow.className = "check-btn-row";

        const checkBtn = document.createElement("button");
        checkBtn.className = "check-btn";
        checkBtn.type = "button";
        checkBtn.innerHTML = 'Check';
        checkBtn.disabled = true;
        checkBtnRow.appendChild(checkBtn);

        content.appendChild(pictureRow);
        content.appendChild(addendRow);
        content.appendChild(totalRow);
        content.appendChild(checkBtnRow);

        totalInput.addEventListener("input", () => {
          totalInput.value =
            totalInput.value.replace(/\D/g, "").slice(0, 3);

          checkBtn.disabled = totalInput.value.trim().length === 0;
        });

        checkBtn.addEventListener("click", () => {

          const totalCorrect =
            Number(totalInput.value) === q.answer;

          if (!totalCorrect) {
            sound.wrong();
            showEmoji("😔");

            totalInput.classList.remove("wrong-shake");
            // restart the animation if it fires twice in a row
            void totalInput.offsetWidth;
            totalInput.classList.add("wrong-shake");

            totalInput.value = "";
            checkBtn.disabled = true;

            totalInput.addEventListener("animationend", () => {
              totalInput.classList.remove("wrong-shake");
            }, { once: true });

            return;
          }

          completed[index] = true;

          sound.correct();
          showEmoji("🥳");
          burstConfetti(totalInput);

          totalInput.classList.add("correct-locked");
          totalInput.readOnly = true;
          checkBtn.disabled = true;

          nextBtn.disabled = false;

          if (index === questions.length - 1) {
            setTimeout(finishQuiz, 650);
          }
        });

        if (completed[index]) {
          totalInput.value = q.answer;
          totalInput.readOnly = true;
          totalInput.classList.add("correct-locked");
          checkBtn.disabled = true;
        }

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !completed[index];
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i>
        Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          completed.fill(false);
          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) renderQuestion(current - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (completed[current] && current < questions.length - 1) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);

    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
