    .questionCard {
      display: grid;

      gap: 28px;
      align-items: center;
      padding: 22px;
      border: 2px solid #e7eaf3;
      border-radius: 25px;
      background: linear-gradient(145deg, #fcfdff, #f5f7ff)
    }

    /* ================= BUS QUESTION CARD ================= */
    .questionCard {
      position: relative;
      overflow: visible;
      border: 3px solid #6b4be8;
      border-radius: 30px 42px 42px 30px;
      background: linear-gradient(180deg, #fff 0%, #f5f2ff 100%);
      box-shadow: 0 15px 0 #d9d0ff, 0 22px 35px #26344d18;
      transform: translateX(0);
      will-change: transform, opacity;
    }

    /* Bus roof / destination sign */
    .questionCard::before {
      content: "MATH BUS  •  NEXT STOP: ANSWER";
      position: absolute;
      top: -17px;
      left: 42px;
      right: 110px;
      height: 31px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      border: 3px solid #6b4be8;
      border-bottom: 0;
      border-radius: 17px 17px 0 0;
      background: #ffd75a;
      color: #4b369e;
      font-size: 10px;
      font-weight: 1000;
      letter-spacing: .7px;
      z-index: 3;
    }

    /* Bus front */
    .questionCard::after {
      content: "";
      position: absolute;
      right: -12px;
      top: 48%;
      width: 25px;
      height: 82px;
      border-radius: 0 18px 18px 0;
      background: #ff9a38;
      border: 3px solid #6b4be8;
      border-left: 0;
      transform: translateY(-50%);
      z-index: 2;
    }

    /* Bus wheels */
    .questionCard .bus-wheel {
      position: absolute;
      bottom: -21px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #26344d;
      border: 7px solid #fff;
      box-shadow: 0 0 0 3px #6b4be8;
      z-index: 5;
    }

    .questionCard .bus-wheel::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: #aeb7c7;
    }

    .questionCard .wheel-left {
      left: 115px
    }

    .questionCard .wheel-right {
      right: 115px
    }

    /* Bus movement */
    .questionCard.bus-exit-right {
      animation: busExitRight .48s cubic-bezier(.65, 0, .9, 1) forwards;
    }

    .questionCard.bus-enter-left {
      animation: busEnterLeft .55s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    .questionCard.bus-exit-left {
      animation: busExitLeft .48s cubic-bezier(.65, 0, .9, 1) forwards;
    }

    .questionCard.bus-enter-right {
      animation: busEnterRight .55s cubic-bezier(.2, .8, .2, 1) forwards;
    }

    @keyframes busExitRight {
      0% {
        transform: translateX(0);
        opacity: 1
      }

      100% {
        transform: translateX(115vw);
        opacity: .35
      }
    }

    @keyframes busEnterLeft {
      0% {
        transform: translateX(-115vw);
        opacity: .35
      }

      100% {
        transform: translateX(0);
        opacity: 1
      }
    }

    @keyframes busExitLeft {
      0% {
        transform: translateX(0);
        opacity: 1
      }

      100% {
        transform: translateX(-115vw);
        opacity: .35
      }
    }

    @keyframes busEnterRight {
      0% {
        transform: translateX(115vw);
        opacity: .35
      }

      100% {
        transform: translateX(0);
        opacity: 1
      }
    }

    /* Keep the card stable during the swap */
    .questionCard.is-moving {
      pointer-events: none;
    }

    .character {
      height: 250px;
      border-radius: 20px;
      background: linear-gradient(180deg, #eef9ff, #fff);
      border: 1px solid #dfe8f2;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden
    }

    .character .rocket {
      font-size: 95px;
      filter: drop-shadow(0 10px 8px #0002);
      animation: float 2.3s ease-in-out infinite
    }

    .character .stars {
      position: absolute;
      inset: 0;
      font-size: 20px
    }

    .star {
      position: absolute;
      animation: twinkle 1.6s infinite alternate
    }

    .star:nth-child(1) {
      top: 20px;
      left: 25px
    }

    .star:nth-child(2) {
      top: 65px;
      right: 25px
    }

    .star:nth-child(3) {
      bottom: 35px;
      left: 35px
    }

    .star:nth-child(4) {
      bottom: 55px;
      right: 45px
    }

    @keyframes float {
      50% {
        transform: translateY(-9px) rotate(-2deg)

    }

    @keyframes twinkle {
      from {
        opacity: .25;
        transform: scale(.7)
      }

      to {
        opacity: 1;
        transform: scale(1.2)

    }

    .answerBox {

    .answerBox.correct {

    @keyframes shake {

    .option {

    .option:hover:not(:disabled) {
      transform: translateY(-3px);

    }

    .option:disabled {
      cursor: default;
      opacity: .52

    .option.good {

    .option.bad {

    #prev {

    .lock {

    /* popup */
    .pop {

      left: 50%;

      transform: translate(-50%, -50%);

    @keyframes pop {

      20% {

    .overlay {

    @media (max-height: 700px) and (min-width: 651px) {
      .app {
        margin-top: 10px;
        margin-bottom: 15px;
      }

      .game {
        padding: 15px;
      }

      .questionCard {
        min-height: 250px;
      }

      .character {
        height: 210px;
      }

      .optionsPanel {
        margin-top: 10px;
        padding: 12px;
      }

      .nav {
        margin-top: 9px;
        padding-top: 10px;
      }
    }

    @media (min-width: 1600px) {
      .app {
        width: min(1500px, 92vw);
      }

      .qnum{
        font-size: 30px;
      }

      .optionsTitle {
        font-size: 25px;
      }

      .qtitle{
        font-size: 25px;
        margin-bottom: 25px;
        margin-top: 15px;
      }

      .game {
        padding: 30px;
      }

      .questionCard {
        min-height: 390px;
      }

      .character {
        height: 320px;
      }

      .equation {
        font-size: 45px;
      }

      .answerBox{
        width: 160px;
        height: 80px;
      }

      .answerBox.correct {
        font-size: 45px
      }

      .option {
        min-width: 180px;
        height: 80px;
        padding: 15px 24px;
        font-size: 28px;
      }
    }

    /* ================= CENTER GAME ON ALL SCREENS ================= */
    html {
      width: 100%;
      min-height: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: min(1500px, 92vw);
      margin: 0 auto;
      flex: 0 1 auto;
    }

    .game {
      width: 100%;
      margin: 0;
    }

    /* Large desktop / monitor */
    @media (min-width:1200px) {
      .app {
        width: min(1500px, 95vw);
      }
    }

    /* Laptop / tablet landscape */
    @media (min-width:651px) and (max-width:1199px) {
      body {

      .app {

    /* Mobile */
    @media (max-width:650px) {

  </style>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../../shared/quiz-ui.css">
</head>

<body>
  <div class="app">
    <main class="game">
      <div class="topLine">
        <div class="badge">LEVEL 1 • ROCKET MISSION</div>
        <div class="instructions">Choose the correct answer to launch 🚀</div>
      </div>

      <section class="questionCard" id="questionCard">
        <span class="bus-wheel wheel-left"></span>
        <span class="bus-wheel wheel-right"></span>
        <div class="character">
          <div class="stars">
            <span class="star">✦</span><span class="star">✧</span><span class="star">✦</span><span class="star">✧</span>
          </div>
          <div class="rocket">🚀</div>
        </div>
        <div class="questionContent">
          <div class="qnum" id="qnum">QUESTION 1</div>
          <div class="qtitle">Calculate orally and choose the answer.</div>
          <div class="equation" id="equation"></div>
          <!-- <div class="challenge">🎯 Select the answer that belongs in the box.</div> -->
        </div>
      </section>

      <section class="optionsPanel">
        <div class="optionsTitle">🔢 CHOOSE YOUR ANSWER</div>
        <div class="options" id="options"></div>
      </section>

      <!-- <div class="feedback" id="feedback">Choose an answer to continue.</div> -->

      <nav class="nav">
        <button id="prev" disabled>Prev</button>
        <div class="counter" id="counter">1/8</div>
        <button id="next" disabled>Next</button>
      </nav>
      <!-- <div class="lock" id="lock">🔒 Next is locked until the answer is correct.</div> -->
    </main>
  </div>

  <script>
    (() => {
      const questions = [
        { a: "15 × 10 =", ans: 150, opts: [150, 105, 50] },
        { a: "25 × 100 =", ans: 2500, opts: [2500, 250, 2050] },
        { a: "38 × 100 =", ans: 3800, opts: [3800, 3080, 380] },
        { a: "9 × 1000 =", ans: 9000, opts: [9000, 900, 9900] },
        { a: "8 × 1000 =", ans: 8000, opts: [8000, 800, 80000] },
        { a: "62 × 20 =", ans: 1240, opts: [1240, 1204, 124] },
        { a: "30 × 100 =", ans: 3000, opts: [3000, 300, 3300] },
        { a: "4 × 300 =", ans: 1200, opts: [1200, 120, 900] }
      ];
      const state = questions.map(() => ({ done: false, attempts: 0 }));
      let current = 0, ctx = null;

      const $ = id => document.getElementById(id);
      function audio() {
        try {
          ctx ||= new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === "suspended") ctx.resume();
          return ctx;
        } catch (e) { return null }
      }
      function beep(f, d, type = "sine") {
        const c = audio(); if (!c) return;
        const o = c.createOscillator(), g = c.createGain();
        o.type = type; o.frequency.value = f; o.connect(g); g.connect(c.destination);
        g.gain.setValueAtTime(.15, c.currentTime);
        g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + d / 1000);
        o.start(); o.stop(c.currentTime + d / 1000);
      }
      function correctSound() { beep(660, 110); setTimeout(() => beep(880, 160), 110) }
      function wrongSound() { beep(180, 220, "sawtooth") }
      function finishSound() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 150), i * 130)) }
      function pop(emoji) {
        const p = document.createElement("div"); p.className = "pop"; p.textContent = emoji;
        document.body.appendChild(p); setTimeout(() => p.remove(), 1100)
      }

      function render() {
        const q = questions[current], s = state[current];
        $("qnum").textContent = "QUESTION " + (current + 1);
        $("equation").innerHTML = q.a + ' <span class="answerBox ' + (s.done ? "correct" : "") + '">' + (s.done ? q.ans : "") + '</span>';
        $("counter").textContent = `${current + 1}/${questions.length}`;
        const pct = Math.round((current + 1) / questions.length * 100);
        if ($("progressText")) $("progressText").textContent = `Question ${current + 1} of ${questions.length}`;
        if ($("percent")) $("percent").textContent = pct + "%";
        if ($("fill")) $("fill").style.width = pct + "%";
        if ($("score")) $("score").textContent = state.filter(x => x.done).length;

        $("options").innerHTML = "";
        q.opts.forEach(n => {
          const b = document.createElement("button");
          b.className = "option"; b.textContent = n; b.type = "button";
          if (s.done) b.disabled = true;
          b.onclick = () => choose(n, b);
          $("options").appendChild(b);
        });

        $("prev").disabled = current === 0;
        $("next").disabled = !s.done;
        $("next").style.display = "block";
        // $("feedback").className = "feedback " + (s.done ? "good" : "");
        // $("feedback").textContent = s.done ? "🎉 Correct! Great work!" : "Choose an answer to continue.";
        // $("lock").textContent = s.done ? "🔓 Correct answer! Next is unlocked." : "🔒 Next is locked until the answer is correct.";
      }

      function choose(n, b) {
        const s = state[current], q = questions[current];
        if (s.done) return;
        if (n !== q.ans) {
          s.attempts++; wrongSound(); pop("😔");
          b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad");
          // $("feedback").className = "feedback bad";
          // $("feedback").textContent = "Not quite! Try another answer.";
          setTimeout(() => b.classList.remove("bad"), 450);
          return;
        }
        s.done = true; correctSound(); pop("🥳");
        b.classList.add("good");
        // $("feedback").className = "feedback good";
        // $("feedback").textContent = "✓ Correct! Rocket mission complete!";
        render();
        setTimeout(() => { if (current === questions.length - 1) showFinal() }, 450);
      }

      let moving = false;

      function moveBus(direction) {
        if (moving) return;

        const card = $("questionCard");

        if (direction === "next" && !state[current].done) return;

        if (direction === "next" && current === questions.length - 1) {
          showFinal();
          return;
        }

        if (direction === "prev" && current === 0) return;

        moving = true;
        card.classList.add("is-moving");
        card.classList.remove("bus-enter-left", "bus-enter-right");

        const exitClass = direction === "next" ? "bus-exit-right" : "bus-exit-left";
        const enterClass = direction === "next" ? "bus-enter-left" : "bus-enter-right";

        card.classList.add(exitClass);
        beep(430, 80);

        setTimeout(() => {
          current += direction === "next" ? 1 : -1;
          render();

          const newCard = $("questionCard");
          newCard.classList.remove(exitClass, "bus-exit-right", "bus-exit-left");
          newCard.classList.add("is-moving", enterClass);

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              newCard.classList.add(enterClass);
            });
          });

          setTimeout(() => {
            newCard.classList.remove("is-moving", enterClass);
            moving = false;
          }, 560);
        }, 480);
      }

      $("prev").onclick = () => moveBus("prev");
      $("next").onclick = () => moveBus("next");

      function showFinal() {
        if (document.querySelector(".overlay")) return;
        finishSound();
        const o = document.createElement("div"); o.className = "overlay";
        const m = document.createElement("div"); m.className = "modal";
        m.innerHTML = `<div class="modalIcon">🎉</div>
   <h2>All Done!</h2>
   <p>Amazing! You got them all right!</p>
   <button class="play"><i class="fa-solid fa-rotate-right"></i> Play Again</button>`;
        o.appendChild(m); document.body.appendChild(o);
        m.querySelector(".play").onclick = () => {
          o.remove(); state.forEach(s => { s.done = false; s.attempts = 0 }); current = 0; render();
        };
      }
      render();
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
