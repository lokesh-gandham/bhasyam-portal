<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open & Closed shapes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
    <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
    <script src="../assets/shared/quiz-ui.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
            font-weight: 400;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;


            display: flex;
            justify-content: center;
            align-items: center;

            background: #ffffff;

            overflow: hidden;
        }


        /* =====================================================
           MAIN QUIZ
        ===================================================== */

        .quiz {
            width: min(1100px, 96vw);
            min-height: 720px;

            /* padding: 25px 30px; */

            display: flex;
            flex-direction: column;

            position: relative;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .quiz-header {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            margin-bottom: 12px;
            display: none;
        }

        .quiz-title {
            text-align: center;

            color: #3f613f;

            font-size: clamp(23px, 3vw, 34px);

            font-weight: 700;

            line-height: 1.2;
        }

        .quiz-subtitle {
            margin-top: 5px;

            color: #666;

            font-size: clamp(14px, 1.8vw, 18px);

            font-weight: 400;
        }


        /* =====================================================
           SCORE
        ===================================================== */

        .score-box {
            position: absolute;

            right: 0;
            top: 2px;

            padding: 8px 18px;

            background: #e98a9d;

            color: white;

            border-radius: 25px;

            font-size: clamp(14px, 1.7vw, 18px);

            font-weight: 600;

            white-space: nowrap;

            box-shadow: 0 3px 8px rgba(0, 0, 0, .12);
        }


        /* =====================================================
           INSTRUCTION
        ===================================================== */

        .instruction-text {
            width: min(960px, 100%);

            margin: 5px auto 5px;

            padding: 10px 18px;

            text-align: center;

            font-size: clamp(30px, 2vw, 21px);

            font-weight: 600;

            line-height: 1.45;

            color: #444;





            border-radius: 10px;
        }


        /* =====================================================
           QUESTION AREA
        ===================================================== */

        .question-area {
            width: 100%;

            /* flex: 1; */

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            position: relative;

            /* padding: 10px 0 15px; */
        }


        /* =====================================================
           QUESTION NUMBER
        ===================================================== */

        .question-number {
            font-size: clamp(19px, 2.5vw, 27px);

            font-weight: 400;

            color: #333;

            margin-bottom: 12px;
        }


        /* =====================================================
           IMAGE BOX
        ===================================================== */

        .image-box {
            width: min(550px, 70vw);

            height: min(300px, 45vh);

            min-height: 200px;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;

            border-radius: 20px;

            background: #fff;

            border: 3px solid #e6e6e6;

            box-shadow:
                0 7px 18px rgba(0, 0, 0, .08);

            overflow: hidden;
        }

        .question-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }


        /* =====================================================
           OPTIONS
        ===================================================== */

        .options-area {
            width: min(650px, 94vw);

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-top: 20px;
        }

        .option-btn {
            min-height: 68px;

            border: none;

            border-radius: 18px;

            cursor: pointer;



            font-size: clamp(17px, 2vw, 23px);

            font-weight: 600;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            color: #333;

            background: #f3f3f3;

            box-shadow:
                0 5px 0 #d1d1d1,
                0 7px 13px rgba(0, 0, 0, .08);

            transition:
                transform .15s ease,
                box-shadow .15s ease,
                background .2s ease;
        }

        .option-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 0 #d1d1d1,
                0 10px 17px rgba(0, 0, 0, .10);
        }

        .option-btn:active {
            transform: translateY(3px);

            box-shadow:
                0 2px 0 #d1d1d1;
        }

        .closed-option {
            background: #dff5df;

            box-shadow:
                0 5px 0 #a9d5a9,
                0 7px 13px rgba(0, 0, 0, .08);
        }

        .open-option {
            background: #ffe2e2;

            box-shadow:
                0 5px 0 #e5b3b3,
                0 7px 13px rgba(0, 0, 0, .08);
        }

        .option-icon {
            font-size: 27px;
        }


        /* =====================================================
           SELECTED / DISABLED
        ===================================================== */

        .option-btn.disabled {
            pointer-events: none;

            opacity: .65;
        }



        /* =====================================================
           NAVIGATION - SAME AS TRUE / FALSE REFERENCE
        ===================================================== */
        .quiz-nav {
            width: 100%;
            margin: 20px auto 0;
            padding-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            position: relative;
            z-index: 20;
        }

        .nav-btn {
            min-width: 112px;
            border: 0;
            border-radius: 999px;
            padding: 11px 20px;
            background: #55b449;
            color: #fff;

            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 5px 0 #3d9634;
            cursor: pointer;
            transition: transform .15s ease, opacity .15s ease;
        }

        .nav-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .nav-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #3d9634;
        }

        .nav-btn:disabled {
            opacity: .45;
            cursor: default;
            box-shadow: 0 3px 0 #cfd9cf;
        }

        .prev-btn,
        .next-btn {
            background: #55b449;
            color: #fff;
        }

        .nav-progress {
            color: #12265d;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .5px;
        }


        /* =====================================================
           ANSWER POPUP - SAME AS TRUE / FALSE REFERENCE
        ===================================================== */
        .emoji-pop {
            position: fixed;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            font-size: 82px;
            pointer-events: none;
            z-index: 9999;
            animation: emojiPop 1.1s ease-out forwards;
        }

        @keyframes emojiPop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.35);
            }

            22% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.18);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -75%) scale(.82);
            }
        }

        /* =====================================================
           FINAL POPUP - SAME AS TRUE / FALSE REFERENCE
        ===================================================== */
        .final-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn .4s ease;

        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .final-modal {
            background: #fff;
            max-width: 400px;
            width: 90%;
            padding: 36px 28px 32px;
            border-radius: 56px 20px 56px 20px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
            animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
        }

        @keyframes popUp {
            from {
                transform: scale(.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .final-modal .icon-big {
            font-size: 52px;
            margin-bottom: 6px;
            display: block;
        }

        .final-modal h2 {
            font-size: 30px;
            font-weight: 800;
            color: #1e1e2a;
            margin-bottom: 8px;
        }

        .final-modal p {
            font-size: 17px;
            color: #3d3d4a;
            margin-bottom: 22px;
        }

        .final-modal .btn-playagain {
            border: none;
            background: linear-gradient(180deg, #ffb347, #f58a2e);
            padding: 12px 36px;
            border-radius: 999px;

            font-weight: 800;
            font-size: 18px;
            color: #2d1f00;
            box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 768px) {

            body {
                align-items: flex-start;

                padding: 12px 0;

                overflow-y: auto;
            }

            .quiz {
                width: 97vw;

                min-height: calc(100vh - 24px);

                padding: 15px;
            }

            .quiz-header {
                padding-right: 0;
            }

            .quiz-title {
                padding: 0 75px;
            }

            .score-box {
                right: 0;

                padding: 6px 12px;
            }

            .instruction-text {
                margin-bottom: 15px;

                padding: 8px 12px;
            }

            .question-area {
                padding-top: 5px;
            }

            .image-box {
                width: min(600px, 92vw);

                height: 42vh;

                min-height: 230px;

                padding: 14px;
            }

            .options-area {
                width: min(600px, 94vw);

                gap: 14px;

                margin-top: 15px;
            }

            .option-btn {
                min-height: 60px;

                border-radius: 15px;
            }

            .quiz-nav {
                width: min(600px, 94vw);

                margin-top: 16px;
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            body {
                padding: 5px 0;
            }

            .quiz {
                width: 98vw;

                min-height: calc(100vh - 10px);

                padding: 8px;
            }

            .quiz-header {
                margin-bottom: 7px;
            }

            .quiz-title {
                padding: 0 55px;

                font-size: 20px;
            }

            .quiz-subtitle {
                font-size: 12px;

                margin-top: 2px;
            }

            .score-box {
                top: 0;

                padding: 5px 9px;

                font-size: 12px;

                border-radius: 18px;
            }

            .instruction-text {
                width: 98%;

                margin: 2px auto 10px;

                padding: 6px 8px;

                font-size: 13px;

                line-height: 1.4;
            }

            .question-number {
                font-size: 18px;

                margin-bottom: 7px;
            }

            .image-box {
                width: 96vw;

                height: 38vh;

                min-height: 200px;

                padding: 8px;

                border-radius: 15px;

                border-width: 2px;
            }

            .options-area {
                width: 96vw;

                grid-template-columns: 1fr;

                gap: 10px;

                margin-top: 12px;
            }

            .option-btn {
                width: 100%;

                min-height: 52px;

                border-radius: 13px;

                font-size: 16px;

                gap: 8px;
            }

            .option-icon {
                font-size: 22px;
            }

            .quiz-nav {
                width: 96vw;

                margin-top: 12px;

                gap: 10px;
            }

            .nav-btn {
                flex: 1;

                min-width: 0;

                min-height: 44px;

                padding: 7px 10px;

                font-size: 14px;
            }

            .popup-content {
                padding: 25px 18px;
            }

            .popup-icon {
                font-size: 52px;
            }

            .popup-title {
                font-size: 24px;
            }

            .popup-msg {
                font-size: 16px;
            }

            #stars {
                font-size: 30px;
            }

        }


        /* =====================================================
           VERY SMALL DEVICES
        ===================================================== */

        @media (max-width: 350px) {

            .quiz-title {
                padding: 0 45px;

                font-size: 17px;
            }

            .quiz-subtitle {
                font-size: 10px;
            }

            .score-box {
                font-size: 10px;

                padding: 4px 7px;
            }

            .image-box {
                height: 34vh;

                min-height: 175px;
            }

            .option-btn {
                min-height: 47px;

                font-size: 14px;
            }

            .nav-btn {
                font-size: 12px;
            }

        }


        @media screen and (min-width:1025px) and (max-width:1440px) {
            .quiz-nav {
                gap: 150px;
                margin-top: 32px;
                padding-top: 24px;
            }

            .nav-btn {
                width: 150px;
                min-width: 150px;
                height: 55px;
                padding: 0;
                font-size: 20px;
            }
        }

        @media screen and (min-width:1441px) and (max-width:1920px) {
            .quiz-nav {
                gap: 180px;
                margin-top: 32px;
                padding-top: 24px;
            }

            .nav-btn {
                width: 160px;
                min-width: 160px;
                height: 58px;
                padding: 0;
                font-size: 22px;
            }
        }

        @media screen and (min-width:1921px) {
            .quiz-nav {
                gap: 190px;
                margin-top: 36px;
                padding-top: 28px;
            }

            .nav-btn {
                width: 170px;
                min-width: 170px;
                height: 60px;
                padding: 0;
                font-size: 24px;
            }
        }

        @media (max-width:768px) {
            .quiz-nav {
                gap: 90px;
                margin-top: 10px;
                padding-top: 10px;
            }

            .nav-btn {
                min-width: 100px;
                padding: 10px 17px;
                font-size: 14px;
            }

            .nav-progress {
                font-size: 15px;
            }
        }

        @media (max-width:480px) {
            .quiz-nav {
                gap: 80px;
                margin-top: 8px;
                padding-top: 8px;
            }

            .nav-btn {
                min-width: 82px;
                padding: 8px 13px;
                font-size: 12px;
            }

            .nav-progress {
                font-size: 13px;
            }

            .emoji-pop {
                font-size: 65px;
            }

            .final-modal {
                width: 92%;
                padding: 30px 20px 28px;
            }

            .final-modal h2 {
                font-size: 26px;
            }
        }
    </style>

<body>

    <div class="quiz">

        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="quiz-header">

            <div class="quiz-title">

                🔷 Closed & Open Figures

                <div class="quiz-subtitle">
                    Let's identify the figures!
                </div>

            </div>

            <div class="score-box" id="scoreBox">

                Score: 0

            </div>

        </div>


        <!-- =================================================
             INSTRUCTION
        ================================================== -->

        <div class="instruction-text">

            Put a tick (✓) for closed figures and a crossout (✕) for open figures.

        </div>


        <!-- =================================================
             QUESTION
        ================================================== -->

        <div class="question-area">

            <div class="question-number" id="questionNumber">
            </div>


            <div class="image-box">

                <img id="questionImage" class="question-image" src="" alt="Question figure">

            </div>


            <!-- =================================================
                 OPTIONS
            ================================================== -->

            <div class="options-area">

                <button class="option-btn closed-option" id="closedBtn">

                    <span class="option-icon">✓</span>

                    <span>Closed</span>

                </button>


                <button class="option-btn open-option" id="openBtn">

                    <span class="option-icon">✕</span>

                    <span>Open</span>

                </button>

            </div>


            <!-- =================================================
                 PREVIOUS / NEXT
            ================================================== -->

            <nav class="quiz-nav">

                <button class="nav-btn prev-btn" id="prevBtn">

                    <i class="fa-solid fa-chevron-left"></i> Prev

                </button>


                <div class="nav-progress" id="navProgress">1 / 12</div>

                <button class="nav-btn next-btn" id="nextBtn">

                    Next <i class="fa-solid fa-chevron-right"></i>

                </button>

            </nav>

        </div>

    </div>
    <!-- =====================================================
         ANSWER POPUP
         True/False reference uses animated emoji feedback.
    ====================================================== -->

    <!-- =====================================================
         FINAL POPUP
    ====================================================== -->
    <div id="finalPopup" style="display:none;"></div>

    <!-- =====================================================
         CONFETTI
    ====================================================== -->



    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


    <script>


        /* =====================================================
           QUESTIONS
           Change only image paths / correct answers as needed.
        ===================================================== */

        const questions = [

            {
                number: "a)",
                image: "../assets/images/a1.png",
                correct: "closed"
            },

            {
                number: "b)",
                image: "../assets/images/b2.png",
                correct: "closed"
            },

            {
                number: "c)",
                image: "../assets/images/c3.png",
                correct: "open"
            },

            {
                number: "d)",
                image: "../assets/images/d4.png",
                correct: "closed"
            },

            {
                number: "e)",
                image: "../assets/images/e5.png",
                correct: "closed"
            },

            {
                number: "f)",
                image: "../assets/images/f6.png",
                correct: "open"
            },

            {
                number: "g)",
                image: "../assets/images/g7.png",
                correct: "closed"
            },

            {
                number: "h)",
                image: "../assets/images/h8.png",
                correct: "open"
            },

            {
                number: "i)",
                image: "../assets/images/i9.png",
                correct: "open"
            },

            {
                number: "j)",
                image: "../assets/images/j10.png",
                correct: "closed"
            },

            {
                number: "k)",
                image: "../assets/images/k11.png",
                correct: "closed"
            },

            {
                number: "l)",
                image: "../assets/images/l12.png",
                correct: "open"
            }

        ];

        let currentIndex = 0;
        let score = 0;
        const answers = Array(questions.length).fill(null);
        let audioCtx = null;

        const questionNumber = document.getElementById("questionNumber");
        const questionImage = document.getElementById("questionImage");
        const closedBtn = document.getElementById("closedBtn");
        const openBtn = document.getElementById("openBtn");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const scoreBox = document.getElementById("scoreBox");
        const navProgress = document.getElementById("navProgress");

        function getCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === "suspended") audioCtx.resume();
            return audioCtx;
        }

        function beep(frequency, duration, type = "sine") {
            try {
                const ctx = getCtx();
                const oscillator = ctx.createOscillator();
                const gain = ctx.createGain();
                oscillator.type = type;
                oscillator.frequency.value = frequency;
                oscillator.connect(gain);
                gain.connect(ctx.destination);
                gain.gain.setValueAtTime(.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(
                    .0001,
                    ctx.currentTime + duration / 1000
                );
                oscillator.start();
                oscillator.stop(ctx.currentTime + duration / 1000);
            } catch (e) { }
        }

        const sound = {
            correct() {
                beep(660, 110);
                setTimeout(() => beep(880, 160), 110);
            },
            wrong() {
                beep(180, 220, "sawtooth");
            },
            finish() {
                [523, 659, 784, 1047].forEach((frequency, index) =>
                    setTimeout(() => beep(frequency, 150), index * 130)
                );
            }
        };

        document.body.addEventListener("click", () => {
            try { getCtx(); } catch (e) { }
        }, { once: true });

        function showEmoji(emoji) {
            const element = document.createElement("div");
            element.className = "emoji-pop";
            element.textContent = emoji;
            document.body.appendChild(element);
            setTimeout(() => element.remove(), 1600);
        }

        function burstConfetti(element) {
            if (typeof confetti !== "function") return;
            const rect = element.getBoundingClientRect();
            confetti({
                particleCount: 34,
                spread: 70,
                startVelocity: 22,
                origin: {
                    x: (rect.left + rect.width / 2) / innerWidth,
                    y: (rect.top + rect.height / 2) / innerHeight
                },
                colors: ["#6635dc", "#ff4e83", "#4e8ff0", "#76b93b", "#f4ae25", "#4ecdc4"]
            });
        }

        function updateScore() {
            scoreBox.textContent = "Score: " + score;
        }

        function updateProgress() {
            navProgress.textContent = `${currentIndex + 1} / ${questions.length}`;
        }

        function loadQuestion() {
            const q = questions[currentIndex];

            questionNumber.textContent =
                `${q.number} Figure ${currentIndex + 1} of ${questions.length}`;

            questionImage.src = q.image;
            questionImage.alt = `Figure ${q.number}`;

            updateProgress();
            updateScore();

            closedBtn.classList.remove("disabled", "correct-choice", "wrong-choice", "locked-wrong");
            openBtn.classList.remove("disabled", "correct-choice", "wrong-choice", "locked-wrong");

            if (answers[currentIndex]) {
                closedBtn.classList.add("disabled");
                openBtn.classList.add("disabled");

                const correctButton = q.correct === "closed" ? closedBtn : openBtn;
                const wrongButton = q.correct === "closed" ? openBtn : closedBtn;

                correctButton.classList.add("correct-choice");
                wrongButton.classList.add("locked-wrong");
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = !answers[currentIndex];
        }

        function checkAnswer(selected, button) {
            if (answers[currentIndex]) return;

            const q = questions[currentIndex];

            if (selected !== q.correct) {
                sound.wrong();
                showEmoji("😔");

                button.classList.remove("wrong-choice");
                void button.offsetWidth;
                button.classList.add("wrong-choice");

                setTimeout(() => button.classList.remove("wrong-choice"), 700);
                return;
            }

            answers[currentIndex] = selected;
            score++;
            updateScore();

            closedBtn.classList.add("disabled");
            openBtn.classList.add("disabled");

            button.classList.add("correct-choice");

            const otherButton = selected === "closed" ? openBtn : closedBtn;
            otherButton.classList.add("locked-wrong");

            sound.correct();
            showEmoji("🥳");
            burstConfetti(button);

            nextBtn.disabled = false;

            if (currentIndex === questions.length - 1) {
                setTimeout(finishQuiz, 650);
            }
        }

        closedBtn.addEventListener("click", () => checkAnswer("closed", closedBtn));
        openBtn.addEventListener("click", () => checkAnswer("open", openBtn));

        prevBtn.addEventListener("click", () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        });

        nextBtn.addEventListener("click", () => {
            if (answers[currentIndex] && currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        });

        function finishQuiz() {
            sound.finish();
            showFinalPopup();
        }

        function showFinalPopup() {
            if (document.querySelector(".final-overlay")) return;

            const overlay = document.createElement("div");
            const modal = document.createElement("div");

            overlay.className = "final-overlay";
            modal.className = "final-modal";

            const percentage = (score / questions.length) * 100;
            const message =
                percentage >= 80
                    ? "Excellent work! You identified the figures correctly."
                    : percentage >= 50
                        ? "Good job! Keep practising closed and open figures."
                        : "Nice try! Practise once more and you will improve.";

            modal.innerHTML = `
                <span class="icon-big">🎉</span>
                <h2>All Done!</h2>
                <p>Amazing! You got them all right!</p>
                <button class="btn-playagain" type="button">
                    <i class="fa-solid fa-rotate-right"></i> Play again
                </button>
            `;

            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            setTimeout(() => burstConfetti(modal), 80);
            setTimeout(() => burstConfetti(modal), 350);
            setTimeout(() => burstConfetti(modal), 650);

            modal.querySelector(".btn-playagain").addEventListener("click", () => {
                overlay.remove();
                currentIndex = 0;
                score = 0;
                answers.fill(null);
                loadQuestion();
            });
        }

        loadQuestion();

    </script>

    <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
