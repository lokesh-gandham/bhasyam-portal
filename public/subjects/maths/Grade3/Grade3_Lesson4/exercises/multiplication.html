<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Mission</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: clip;
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0;
    }

    .header h3 {
      color: #12265d;
      font-size: 30px !important;
      line-height: 1.1;
      font-weight: 800;
    }

    .question-screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 0 0;
      justify-content: flex-start;
    }

    .question-label {
      color: #12265d;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 14px;
      display: none;
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* margin-block: 12px 24px; */
      flex: 0 1 auto;
      justify-content: flex-start;
      gap: 10px;
    }

    .progress-small {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
      color: #12265d;
    }

    /* ================= MULTIPLICATION ARRAY VISUAL ================= */

    .array-stage {
      width: 100%;
      max-width: 680px;
      margin: 0 auto 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(8px, 1.4vw, 16px);
      padding: 0 6px;
    }

    .array-group {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: center;
      gap: clamp(3px, .5vw, 6px);
      padding: clamp(7px, 1vw, 11px);
      border-radius: 18px;
      border: 2px solid transparent;
      box-shadow: 0 4px 0 rgba(18, 38, 93, .06);
      max-width: clamp(120px, 20vw, 150px);
      animation: groupPop .4s ease both;
      animation-delay: var(--delay, 0s);
    }

    .array-item {
      display: inline-block;
      font-size: clamp(15px, 1.7vw, 23px);
      line-height: 1;
      animation: itemPop .3s ease both;
      animation-delay: var(--item-delay, 0s);
    }

    .array-stage.dense .array-item {
      font-size: clamp(10px, 1.1vw, 15px);
    }

    .array-stage.dense .array-group {
      max-width: clamp(46px, 9vw, 74px);
    }

    .pastel-pink {
      background: #FFE7EF;
      border-color: #FFCBDC;
    }

    .pastel-blue {
      background: #E6F3FF;
      border-color: #C6E5FF;
    }

    .pastel-yellow {
      background: #FFF7DC;
      border-color: #FFEBAC;
    }

    .pastel-mint {
      background: #E4FBEE;
      border-color: #C2F2D6;
    }

    .pastel-lavender {
      background: #F2ECFF;
      border-color: #DED0FF;
    }

    @keyframes groupPop {
      0% {
        opacity: 0;
        transform: scale(.55) translateY(8px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes itemPop {
      0% {
        opacity: 0;
        transform: scale(.2);
      }

      65% {
        opacity: 1;
        transform: scale(1.2);
      }

      100% {
        transform: scale(1);
      }
    }

    @media (max-width: 480px) {
      .array-stage {
        max-width: 100%;
        gap: 6px;
        margin-bottom: 14px;
      }
    }

    .question-main {
      text-align: center;
      margin-top: 8px;
    }

    .equation {
      color: #12265d;
      font-size: 52px;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .equation .question-mark {
      color: #6c5ce7;
    }

    .jump-title {
      margin-top: 24px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
      display: none;
    }

    .jump-options {
      display: flex;
      gap: 14px;
      margin-top: 12px;
      margin-block-end: 8px;
      justify-content: center;
    }

    .jump-option {
      width: 150px;
      height: 72px;
      min-width: 150px;
      padding: 0 18px;
      border: 0;
      border-radius: 24px;
      font-size: 25px;
      font-weight: 800;
      color: #12265d;
      background: #fff;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      box-shadow:
        0 5px 0 #d8dce5,
        0 10px 20px rgba(18, 38, 93, .10);
    }

    .jump-option::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 3px solid #ff9b2f;
      border-radius: inherit;
      pointer-events: none;
    }

    .jump-option:nth-child(2)::before {
      border-color: #6c5ce7;
    }

    .jump-option:nth-child(3)::before {
      border-color: #42a5f5;
    }

    .jump-option:hover:not(:disabled) {
      transform: translateY(-4px);
      box-shadow:
        0 8px 0 #cfd4df,
        0 14px 24px rgba(18, 38, 93, .13);
    }

    .jump-option:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow:
        0 2px 0 #cfd4df,
        0 6px 12px rgba(18, 38, 93, .09);
    }

    .jump-option:focus-visible {
      outline: 3px solid rgba(255, 155, 47, .28);
      outline-offset: 2px;
    }

    .jump-option.correct-choice {
      background: #f2fff6;
      color: #16813b;
      /* border: 3px solid #35b95f; */
      box-shadow:
        0 0 0 3px rgba(53, 185, 95, .18),
        0 8px 22px rgba(53, 185, 95, .28);
      animation: choiceSuccess .3s ease;
    }

    .jump-option.correct-choice::before {
      border-color: #35b95f;
    }

    .jump-option.wrong-choice {
      background: #fff4f4;
      color: #c62d22;
      box-shadow:
        0 5px 0 #f3aa91,
        0 10px 20px rgba(18, 38, 93, .10);
      animation: optionWrong .45s ease 2;
    }

    .jump-option.wrong-choice::before {
      border-color: #e74c3c;
    }

    .jump-option.wrong-disabled {
      opacity: .4;
      cursor: default;
    }

    .jump-option.wrong-disabled:hover,
    .jump-option.wrong-disabled:active {
      transform: none;
    }

    @keyframes choiceSuccess {
      50% {
        transform: scale(1.06);
      }
    }

    @keyframes optionWrong {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    .feedback {
      min-height: 31px;
      margin-top: 8px;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
    }

    .feedback.correct {
      color: #16813b;
    }

    .feedback.wrong {
      color: #c62d22;
    }

    .completion-box {
      margin-top: 24px;
      width: min(760px, 92%);
      padding: 20px 24px;
      border: 2px solid #35b95f;
      border-radius: 22px;
      background: #f5fff7;
      box-shadow: 0 8px 22px rgba(18, 38, 93, .08);
      text-align: center;
      animation: completionPop .35s ease-out;
    }

    .completion-title {
      font-size: 25px;
      line-height: 1.2;
      color: #16813b;
      font-weight: 800;
    }

    .completion-sequence {
      margin-top: 9px;
      font-size: 20px;
      line-height: 1.35;
      color: #12265d;
      font-weight: 800;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .completion-sequence::-webkit-scrollbar {
      display: none;
    }

    @keyframes completionPop {
      0% {
        opacity: 0;
        transform: scale(.94);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ================= NAV / FOOTER ================= */

    .nav {
      width: 100%;
      margin: 10px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 100px;
      position: relative;
      z-index: 20;
      margin-top: 0px !important;
    }

    .nav #prevBtn {
      justify-self: start;
    }

    .nav #nextBtn {
      justify-self: end;
    }

    .nav-progress {
      grid-column: 2;
      grid-row: 1;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      min-width: 60px;
      display: none;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
      display: none;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    /* ================= SAME EMOJI / POPUP ================= */

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
      background: rgba(18, 38, 93, .10);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    /* ================= RESPONSIVE BREAKPOINT DIMENSIONS ================= */

    @media screen and (min-width: 1025px) and (max-width: 1600px) {
      .quiz-wrap {
        max-width: 1380px;
      }

      .header h3 {
        font-size: 30px !important;
      }

      .question-label {
        font-size: 24px;
      }

      .equation {
        font-size: 56px;
        margin-block: 20px;
      }

      .nav {
        gap: 110px;
      }

      .nav-progress {
        font-size: 20px;
      }

      .nav button {
        width: 150px;
        min-width: 150px;
        height: 55px;
        padding: 0;
        font-size: 20px;
      }
    }

<body>
  <main class="quiz-wrap">
    <header class="header">
      <h3>Multiplication Mission</h3>
    </header>

    <section class="question-screen">
      <div class="question-label" id="questionLabel">Question 1 of 9</div>
      <div class="question-content" id="questionContent"></div>
    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i> Prev
      </button>
      <div class="nav-progress" id="navProgress">1/9</div>
      <button id="nextBtn" disabled>
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>
  </main>

  <script>        function speak(t) {
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-US";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }
    (() => {
      const questions = [
        { a: 4, b: 5, hint: "full" },
        { a: 6, b: 8, hint: "small" },
        { a: 7, b: 9, hint: "optional" },
        { a: 10, b: 4, hint: "optional" },
        { a: 2, b: 7, hint: "none" },
        { a: 3, b: 9, hint: "none" },
        { a: 5, b: 6, hint: "none" },
        { a: 9, b: 3, hint: "none" },
        { a: 7, b: 6, hint: "none" }
      ];

      const content = document.getElementById("questionContent");
      const questionLabel = document.getElementById("questionLabel");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const navProgress = document.getElementById("navProgress");

      let current = 0;
      let audioCtx = null;

      const state = questions.map(() => ({
        completed: false,
        attempts: 0,
        options: null,
        wrongOptions: new Set()
      }));

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);
        setTimeout(() => element.remove(), 1600);
      }

      function makeOptions(correct, index) {
        const wrongSets = [
          [correct - 5, correct + 5],
          [correct - 6, correct + 6],
          [correct - 7, correct + 7],
          [correct - 4, correct + 4],
          [correct - 2, correct + 2],
          [correct - 3, correct + 3],
          [correct - 5, correct + 6],
          [correct - 3, correct + 4],
          [correct - 6, correct + 5]
        ];

        const set = wrongSets[index];
        const values = [correct, set[0], set[1]]
          .filter(n => n > 0 && n !== correct);

        while (values.length < 2) {
          values.push(correct + values.length + 2);
        }

        return [correct, ...values.slice(0, 2)]
          .sort(() => Math.random() - 0.5);
      }

      function renderArrayVisual(a, b, qIndex) {
        const stage = document.createElement("div");
        stage.className = "array-stage";

        if (a * b > 30) stage.classList.add("dense");

        const icons = ["🍓", "⭐", "🍭", "🎈", "🌸", "🧁", "🍇", "🍬", "🌟"];
        const icon = icons[qIndex % icons.length];
        const pastels = ["pastel-pink", "pastel-blue", "pastel-yellow", "pastel-mint", "pastel-lavender"];

        for (let g = 0; g < a; g++) {
          const group = document.createElement("div");
          group.className = "array-group " + pastels[g % pastels.length];
          group.style.setProperty("--delay", (g * 0.06) + "s");

          for (let i = 0; i < b; i++) {
            const item = document.createElement("span");
            item.className = "array-item";
            item.style.setProperty("--item-delay", (g * 0.06 + i * 0.02) + "s");
            item.textContent = icon;
            group.appendChild(item);
          }

          stage.appendChild(group);
        }

        return stage;
      }

      function renderQuestion(index) {
        const q = questions[index];
        const s = state[index];

        current = index;
        questionLabel.textContent = `Question ${index + 1} of ${questions.length}`;
        navProgress.textContent = `${index + 1}/${questions.length}`;
        content.innerHTML = "";

        const progress = document.createElement("div");
        progress.className = "progress-small";
        progress.textContent = s.completed ? "Fact mastered!" : "Solve the multiplication fact";

        const main = document.createElement("div");
        main.className = "question-main";

        main.appendChild(renderArrayVisual(q.a, q.b, index));

        const equation = document.createElement("div");
        equation.className = "equation";
        equation.innerHTML = `${q.a} × ${q.b} = <span class="question-mark">?</span>`;

        main.append(equation);
        content.append(progress, main);

        const jumpTitle = document.createElement("div");
        jumpTitle.className = "jump-title";
        jumpTitle.textContent = "What is the answer?";

        const optionsWrap = document.createElement("div");
        optionsWrap.className = "jump-options";

        const feedback = document.createElement("div");
        feedback.className = "feedback";
        feedback.setAttribute("aria-live", "polite");

        // Keep the same option order when navigating away and back.
        if (!s.options) s.options = makeOptions(q.a * q.b, index);

        s.options.forEach(option => {
          const button = document.createElement("button");
          button.className = "jump-option";
          button.type = "button";
          button.textContent = option;

          // Restore previously selected wrong answers.
          if (s.wrongOptions.has(option)) {
            button.disabled = true;
            button.classList.add("wrong-disabled");
          }

          // Restore the correct answer after navigation.
          if (s.completed && option === q.a * q.b) {
            button.classList.add("correct-choice");
            button.innerHTML = `<span>✓</span> ${option}`;
            button.disabled = true;
          }

          button.addEventListener("click", () => {
            if (s.completed || s.wrongOptions.has(option)) return;

            if (option !== q.a * q.b) {
              s.attempts++;
              s.wrongOptions.add(option);
              button.disabled = true;
              button.classList.add("wrong-disabled");

              // sound.wrong();
              speak("Wrong!");
              showEmoji("😔");

              feedback.className = "feedback wrong";
              feedback.textContent = "Try again!";

              button.classList.remove("wrong-choice");
              void button.offsetWidth;
              button.classList.add("wrong-choice");

              setTimeout(() => button.classList.remove("wrong-choice"), 520);
              return;
            }

            // Keep the existing options visible; only mark this option.
            s.completed = true;
            button.classList.add("correct-choice");
            button.innerHTML = `<span>✓</span> ${option}`;
            button.disabled = true;

            // sound.correct();
            speak("Correct!");
            showEmoji("🥳");
            burstConfetti(button);

            feedback.className = "feedback correct";
            feedback.textContent = "Great job!";

            nextBtn.disabled = false;

            if (index === questions.length - 1) {
              setTimeout(finishQuiz, 1600);
            }
          });

          optionsWrap.appendChild(button);
        });

        content.append(jumpTitle, optionsWrap, feedback);

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !s.completed;
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
          <span class="icon-big">🎉</span>
          <h2>All Done!</h2>
          <p>Amazing! You got them all right!</p>
          <button class="btn-playagain">
            <i class="fa-solid fa-rotate-right"></i>
            Play again
          </button>
        `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          state.forEach(s => {
            s.completed = false;
            s.attempts = 0;
            s.options = null;
            s.wrongOptions = new Set();
          });

          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) renderQuestion(current - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (state[current].completed && current < questions.length - 1) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);
    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
