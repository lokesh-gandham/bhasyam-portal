<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Odd One Out</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
    <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
    <script src="../assets/shared/quiz-ui.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
            font-weight: 400;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: clip;

            padding: 12px 20px;

            background:
                linear-gradient(180deg,
                    #fffdf4 0%,
                    #fff8e8 100%);

            color: #12265d;
        }


        /* =========================================================
   MAIN WRAPPER
========================================================= */

        .quiz-wrap {
            width: 100%;
            max-width: 1380px;

            margin: 0 auto;

            display: flex;
            flex-direction: column;

            position: relative;
        }


        /* =========================================================
   MAIN HEADING
   No extra header/banner
========================================================= */

        .main-heading {
            width: 100%;

            text-align: center;

            padding:
                8px 0 18px;

            flex-shrink: 0;

            color: #12265d;

            font-size: 35px;
            line-height: 1.1;

            font-weight: 800;
        }


        /* =========================================================
   GAME AREA
========================================================= */

        .game-area {
            width: 100%;
            min-height: 0;

            display: flex;
            flex-direction: column;

            align-items: center;

            position: relative;
        }


        /* =========================================================
   QUESTION NUMBER
========================================================= */

        .question-label {
            color: #12265d;

            font-size: 22px;

            font-weight: 800;

            margin-bottom: 8px;

            line-height: 1;
        }


        /* =========================================================
   GAME BOARD
========================================================= */

        .game-board {
            position: relative;

            width: 100%;

            max-width: 1160px;

            min-height: 420px;

            border-radius: 34px;

            background:
                linear-gradient(180deg,
                    rgba(255, 255, 255, .98),
                    rgba(255, 250, 235, .98));

            border:
                5px solid #f7dfab;

            box-shadow:
                inset 0 5px 15px rgba(0, 0, 0, .025),
                0 12px 30px rgba(53, 42, 24, .07);

            overflow: hidden;
        }


        /* Soft decorative circles */

        .game-board::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            left: -110px;
            top: 80px;

            border-radius: 50%;

            background:
                radial-gradient(circle,
                    rgba(255, 213, 112, .22),
                    transparent 70%);

            pointer-events: none;
        }

        .game-board::after {
            content: "";

            position: absolute;

            width: 260px;
            height: 260px;

            right: -130px;
            bottom: -130px;

            border-radius: 50%;

            background:
                radial-gradient(circle,
                    rgba(123, 210, 126, .15),
                    transparent 70%);

            pointer-events: none;
        }


        /* =========================================================
   OPTION GRID
   2 x 2
========================================================= */

        .option-grid {
            position: absolute;

            top: 28px;
            right: 30px;

            width: calc(80% - 270px);

            height: calc(100% - 56px);

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            grid-template-rows:
                repeat(2, minmax(0, 1fr));

            gap: 26px 30px;

            z-index: 10;
        }


        /* =========================================================
   OPTION CARD
========================================================= */

        .option-card {
            position: relative;

            width: 100%;
            height: 100%;

            min-width: 0;
            min-height: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 28px;

            background:
                linear-gradient(145deg,
                    #ffffff 0%,
                    #ffffff 72%,
                    #fff8e8 100%);

            border:
                5px solid var(--card-color);

            box-shadow:
                0 7px 0 var(--card-dark),
                0 14px 25px rgba(64, 48, 27, .13),
                inset 0 4px 0 rgba(255, 255, 255, .95);

            cursor: pointer;

            user-select: none;

            transition:
                transform .2s cubic-bezier(.175, .885, .32, 1.275),
                box-shadow .2s ease,
                filter .2s ease;

            overflow: visible;
        }


        /* Glossy top highlight */

        .option-card::before {
            content: "";

            position: absolute;

            left: 16px;
            right: 16px;

            top: 8px;

            height: 18px;

            border-radius: 50%;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, .75),
                    transparent);

            filter: blur(4px);

            pointer-events: none;
        }


        /* Little 3D label */

        .option-number {
            position: absolute;

            left: -13px;
            top: -13px;

            width: 48px;
            height: 48px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(145deg,
                    var(--card-light),
                    var(--card-color));

            color: #fff;

            font-size: 19px;

            font-weight: 800;

            border:
                3px solid rgba(255, 255, 255, .85);

            box-shadow:
                0 5px 0 var(--card-dark),
                0 8px 14px rgba(0, 0, 0, .12);

            z-index: 8;
        }


        /* =========================================================
   IMAGE
========================================================= */

        .option-image {
            position: relative;

            z-index: 3;

            width: 62%;
            height: 68%;

            max-width: 185px;
            max-height: 145px;

            object-fit: contain;

            display: block;

            filter:
                drop-shadow(0 10px 8px rgba(60, 43, 25, .17));

            transform:
                translateZ(0);

            transition:
                transform .25s cubic-bezier(.175, .885, .32, 1.275),
                filter .25s ease;
        }


        /* Hover */

        .option-card:hover {
            transform:
                translateY(-5px) scale(1.015);

            box-shadow:
                0 11px 0 var(--card-dark),
                0 20px 30px rgba(64, 48, 27, .17),
                inset 0 4px 0 rgba(255, 255, 255, .95);
        }

        .option-card:hover .option-image {
            transform:
                scale(1.07) translateY(-4px);

            filter:
                drop-shadow(0 15px 10px rgba(60, 43, 25, .2));
        }


        /* =========================================================
   CARD COLOR VARIANTS
========================================================= */

        .card-orange {
            --card-color: #ff9d38;
            --card-dark: #d97920;
            --card-light: #ffc66d;
        }

        .card-yellow {
            --card-color: #f5c542;
            --card-dark: #d99f18;
            --card-light: #ffe58a;
        }

        .card-blue {
            --card-color: #45a9ec;
            --card-dark: #2184c4;
            --card-light: #8bd1fa;
        }

        .card-purple {
            --card-color: #a867e8;
            --card-dark: #8145c5;
            --card-light: #ce9af7;
        }


        /* =========================================================
   SELECTED STATE
========================================================= */

        .option-card.selected {
            transform:
                translateY(-4px) scale(1.015);

            box-shadow:
                0 8px 0 var(--card-dark),
                0 0 0 6px rgba(255, 190, 66, .12),
                0 18px 30px rgba(64, 48, 27, .18);
        }


        /* =========================================================
   CORRECT STATE
========================================================= */

        .option-card.locked {
            opacity: .4;
            pointer-events: none;
            cursor: default;
        }

        .option-card.locked.correct {
            opacity: 1;
            pointer-events: none;
            cursor: default;
        }

        .option-card.correct {
            border-color: #55b449;

            box-shadow:
                0 8px 0 #3d9634,
                0 0 0 7px rgba(85, 180, 73, .15),
                0 18px 30px rgba(61, 150, 52, .18);

            animation:
                correctCard .7s cubic-bezier(.175, .885, .32, 1.275);
        }

        .option-card.correct::after {
            content: "✓";

            position: absolute;

            right: 14px;
            top: 12px;

            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(145deg,
                    #73d865,
                    #42a83a);

            color: #fff;

            font-size: 30px;
            font-weight: 400;

            box-shadow:
                0 5px 0 #348b2d,
                0 7px 15px rgba(52, 139, 45, .25);

            z-index: 20;

            animation:
                correctBadge .5s cubic-bezier(.175, .885, .32, 1.275);
        }

        @keyframes correctCard {

            0% {
                transform:
                    scale(1);
            }

            35% {
                transform:
                    scale(1.045) rotate(-1deg);
            }

            65% {
                transform:
                    scale(.985) rotate(1deg);
            }

            100% {
                transform:
                    scale(1) rotate(0);
            }
        }

        @keyframes correctBadge {

            from {
                transform:
                    scale(.2) rotate(-25deg);

                opacity: 0;
            }

            to {
                transform:
                    scale(1) rotate(0);

                opacity: 1;
            }
        }


        /* =========================================================
   WRONG / BURNING STATE
========================================================= */

        .option-card.burning {
            pointer-events: none;

            animation:
                burnShake .65s ease-in-out forwards;
        }


        /* Orange/red fire glow */

        .option-card.burning::before {
            content: "";

            position: absolute;

            inset: -8px;

            border-radius: 34px;

            background:
                radial-gradient(ellipse at center,
                    rgba(255, 208, 42, .9) 0%,
                    rgba(255, 120, 15, .65) 35%,
                    rgba(235, 49, 20, .45) 60%,
                    transparent 75%);

            filter: blur(12px);

            z-index: -1;

            animation:
                burnGlow .65s ease-out forwards;
        }


        /* Burn overlay */

        .option-card.burning .option-image {
            animation:
                burnObject .75s ease-out forwards;
        }


        @keyframes burnShake {

            0% {
                transform:
                    scale(1) rotate(0);
            }

            15% {
                transform:
                    scale(1.025) rotate(-2deg);
            }

            30% {
                transform:
                    scale(.98) rotate(2deg);
            }

            45% {
                transform:
                    scale(1.02) rotate(-1.5deg);
            }

            65% {
                transform:
                    scale(.98) rotate(1deg);
            }

            100% {
                transform:
                    scale(.93) rotate(0);
            }
        }


        @keyframes burnGlow {

            0% {
                opacity: 0;
                transform: scale(.7);
            }

            30% {
                opacity: 1;
                transform: scale(1.08);
            }

            100% {
                opacity: 0;
                transform: scale(1.2);
            }
        }


        @keyframes burnObject {

            0% {
                filter:
                    drop-shadow(0 10px 8px rgba(60, 43, 25, .17));
                transform:
                    scale(1);
            }

            25% {
                filter:
                    brightness(1.4) saturate(1.8) drop-shadow(0 0 15px #ff941c);
                transform:
                    scale(1.04);
            }

            55% {
                filter:
                    brightness(.9) saturate(1.7) drop-shadow(0 0 20px #ff4a17);
                transform:
                    scale(.98);
            }

            100% {
                filter:
                    grayscale(.75) brightness(.5) drop-shadow(0 0 0 transparent);

                opacity: .32;

                transform:
                    scale(.87);
            }
        }


        /* =========================================================
   FIRE LAUNCHER ZONE
========================================================= */

        .fire-launcher-zone {
            position: absolute;

            left: 12px;
            bottom: 20px;

            width: 225px;
            height: 255px;

            z-index: 30;

            pointer-events: none;
        }


        /* Ground shadow */

        .launcher-shadow {
            position: absolute;

            left: 50%;
            bottom: 2px;

            width: 205px;
            height: 38px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(ellipse,
                    rgba(68, 47, 28, .22),
                    rgba(68, 47, 28, .08) 55%,
                    transparent 75%);

            filter: blur(6px);
        }


        /* =========================================================
   3D FIRE LAUNCHER
========================================================= */

        .fire-launcher {
            position: absolute;

            left: 0;
            bottom: 18px;

            width: 220px;
            height: 205px;

            transform-origin:
                50% 85%;

            filter:
                drop-shadow(0 12px 7px rgba(62, 42, 25, .18));

            animation:
                launcherFloat 3.8s ease-in-out infinite;
        }


        /* Main body */

        .launcher-body {
            position: absolute;

            left: 28px;
            bottom: 30px;

            width: 142px;
            height: 118px;

            border-radius:
                38px 42px 30px 35px;

            background:
                linear-gradient(145deg,
                    #ffd76b 0%,
                    #ff9a38 38%,
                    #f16c31 72%,
                    #d84a2b 100%);

            border:
                5px solid #e68734;

            box-shadow:
                inset 0 7px 0 rgba(255, 255, 255, .42),
                inset 0 -10px 0 rgba(139, 43, 24, .2),
                0 7px 0 #b95629;
        }


        /* Body shine */

        .launcher-body::before {
            content: "";

            position: absolute;

            left: 17px;
            top: 9px;

            width: 70px;
            height: 14px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, .4);

            filter: blur(4px);

            transform:
                rotate(-8deg);
        }


        /* =========================================================
   FIRE CORE
========================================================= */

        .launcher-core {
            position: absolute;

            right: 18px;
            top: 16px;

            width: 38px;
            height: 38px;

            border-radius: 50%;

            background:
                radial-gradient(circle,
                    #fffde0 0%,
                    #fff04a 28%,
                    #ff9a20 55%,
                    #ef401d 78%,
                    #c42c1c 100%);

            border:
                3px solid #ffb73d;

            box-shadow:
                0 0 8px #ffc32e,
                0 0 20px rgba(255, 105, 20, .7),
                inset 0 3px 4px rgba(255, 255, 255, .55);

            animation:
                corePulse .75s ease-in-out infinite alternate;
        }

        .launcher-core::after {
            content: "";

            position: absolute;

            left: 12px;
            top: 7px;

            width: 12px;
            height: 18px;

            border-radius:
                50% 50% 45% 45%;

            background: #fff5a6;

            box-shadow:
                0 0 8px #fff4a1;

            animation:
                flameMove .3s ease-in-out infinite alternate;
        }


        /* =========================================================
   LAUNCHER FACE
========================================================= */

        .launcher-face {
            position: absolute;

            left: 28px;
            bottom: 17px;

            width: 86px;
            height: 62px;
        }

        .launcher-eye {
            position: absolute;

            top: 5px;

            width: 25px;
            height: 32px;

            border-radius: 50%;

            background: #fff;

            border:
                3px solid #572725;

            box-shadow:
                inset 0 3px 0 #dbeaff;
        }

        .launcher-eye::after {
            content: "";

            position: absolute;

            left: 6px;
            top: 9px;

            width: 10px;
            height: 14px;

            border-radius: 50%;

            background: #283044;
        }

        .launcher-eye:first-child {
            left: 2px;
        }

        .launcher-eye:nth-child(2) {
            left: 40px;
        }

        .launcher-mouth {
            position: absolute;

            left: 24px;
            top: 39px;

            width: 40px;
            height: 19px;

            border-bottom:
                4px solid #572725;

            border-radius:
                0 0 40px 40px;
        }


        /* =========================================================
   BARREL
========================================================= */

        .launcher-barrel {
            position: absolute;

            left: 102px;
            top: 38px;

            width: 115px;
            height: 54px;

            transform:
                rotate(-20deg);

            transform-origin:
                left center;

            border-radius:
                30px 40px 38px 28px;

            background:
                linear-gradient(145deg,
                    #ffd067,
                    #ff9135 45%,
                    #db4e2c 100%);

            border:
                5px solid #e88935;

            box-shadow:
                inset 0 6px 0 rgba(255, 255, 255, .32),
                inset 0 -7px 0 rgba(128, 42, 26, .22),
                0 5px 0 #b85a2b;
        }


        /* Barrel opening */

        .barrel-opening {
            position: absolute;

            right: -17px;
            top: -11px;

            width: 52px;
            height: 74px;

            border-radius: 50%;

            background:
                radial-gradient(ellipse,
                    #20191d 0%,
                    #412026 42%,
                    #9d432a 61%,
                    #ffb747 66%,
                    #e76d31 100%);

            border:
                5px solid #ffb448;

            box-shadow:
                inset 0 6px 8px rgba(0, 0, 0, .5),
                0 5px 0 #b75a2c;
        }


        /* Fire inside barrel */

        .barrel-flame {
            position: absolute;

            right: 3px;
            top: 8px;

            width: 20px;
            height: 38px;

            border-radius:
                50% 50% 45% 45%;

            background:
                radial-gradient(ellipse,
                    #fffbc5,
                    #ffe43c 35%,
                    #ff7219 70%,
                    transparent 72%);

            filter: blur(2px);

            animation:
                barrelFlame .2s ease-in-out infinite alternate;
        }


        /* =========================================================
   LAUNCHER WHEELS
========================================================= */

        .launcher-wheel {
            position: absolute;

            bottom: 2px;

            width: 62px;
            height: 62px;

            border-radius: 50%;

            background:
                linear-gradient(145deg,
                    #58bdf5,
                    #1471b9);

            border:
                6px solid #0c5c9b;

            box-shadow:
                0 6px 0 #094a7d,
                inset 0 5px 0 rgba(255, 255, 255, .4);
        }

        .launcher-wheel::after {
            content: "";

            position: absolute;

            left: 16px;
            top: 16px;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            background: #ffd258;

            border:
                3px solid #e9942b;
        }

        .launcher-wheel.left {
            left: 10px;
        }

        .launcher-wheel.right {
            right: 8px;
        }


        /* =========================================================
   LAUNCHER ANIMATION
========================================================= */

        @keyframes launcherFloat {

            0%,
            100% {
                transform:
                    translateY(0) rotate(0);
            }

            50% {
                transform:
                    translateY(-4px) rotate(.5deg);
            }
        }

        @keyframes corePulse {

            from {
                transform: scale(.92);
                filter: brightness(.95);
            }

            to {
                transform: scale(1.08);
                filter: brightness(1.18);
            }
        }

        @keyframes flameMove {

            from {
                transform:
                    translateY(2px) scale(.82) rotate(-5deg);
            }

            to {
                transform:
                    translateY(-2px) scale(1.08) rotate(5deg);
            }
        }

        @keyframes barrelFlame {

            from {
                transform:
                    scale(.8) translateX(2px);
            }

            to {
                transform:
                    scale(1.15) translateX(-2px);
            }
        }


        /* =========================================================
   FIREBALL
========================================================= */

        .fireball {
            position: fixed;

            width: 52px;
            height: 52px;

            border-radius: 50%;

            pointer-events: none;

            z-index: 9998;

            opacity: 0;

            transform:
                translate(-50%, -50%);

            background:
                radial-gradient(circle at 32% 25%,
                    #ffffff 0%,
                    #fffbd1 9%,
                    #fff04a 24%,
                    #ffc11c 43%,
                    #ff7418 66%,
                    #ed3214 88%,
                    #b91d17 100%);

            box-shadow:
                0 0 8px #fff,
                0 0 18px #ffe14a,
                0 0 34px #ff981c,
                0 0 58px rgba(255, 75, 12, .8),
                inset -7px -8px 10px rgba(155, 32, 10, .35);

            filter:
                saturate(1.35);
        }


        /* Fireball trail */

        .fireball::before {
            content: "";

            position: absolute;

            right: 22px;
            top: 7px;

            width: 145px;
            height: 38px;

            border-radius:
                80% 20% 20% 80%;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(255, 218, 46, .95),
                    rgba(255, 115, 17, .78),
                    transparent);

            filter: blur(7px);

            transform:
                rotate(-7deg);

            transform-origin:
                right center;
        }


        /* Energy ring */

        .fireball::after {
            content: "";

            position: absolute;

            inset: -10px;

            border-radius: 50%;

            border:
                3px solid rgba(255, 170, 30, .55);

            box-shadow:
                0 0 20px rgba(255, 113, 17, .6);

            animation:
                fireballEnergy .16s ease-in-out infinite alternate;
        }

        @keyframes fireballEnergy {

            from {
                transform: scale(.9);
                opacity: .6;
            }

            to {
                transform: scale(1.12);
                opacity: 1;
            }
        }


        /* =========================================================
   IMPACT EFFECT
========================================================= */

        .impact {
            position: fixed;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            pointer-events: none;

            z-index: 9997;

            transform:
                translate(-50%, -50%) scale(.2);

            animation:
                impactBurst .65s ease-out forwards;
        }

        .impact::before,
        .impact::after {
            content: "";

            position: absolute;

            inset: -30px;

            border-radius: 50%;

            border:
                4px solid rgba(255, 145, 20, .65);
        }

        .impact::after {
            inset: -48px;

            border-color:
                rgba(255, 210, 45, .35);
        }

        @keyframes impactBurst {

            0% {
                opacity: 1;
                transform:
                    translate(-50%, -50%) scale(.15);
            }

            45% {
                opacity: 1;
                transform:
                    translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 0;
                transform:
                    translate(-50%, -50%) scale(1.7);
            }
        }


        /* =========================================================
   NAVIGATION
   Same reference style
========================================================= */

        .nav {
            width: 100%;
            margin: auto auto 0;
            padding-top: 18px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;

            position: relative;
            z-index: 20;
        }

        .nav-progress {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #12265d;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .5px;
        }

        .nav button {
            min-width: 112px;
            border: 0;
            border-radius: 999px;
            padding: 11px 20px;
            background: #55b449;
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 5px 0 #3d9634;

    <!-- FIREBALL -->

    <div class="fireball" id="fireball"></div>


    <script>

        (() => {

            /* =====================================================
               QUESTIONS
        
               CHANGE ONLY THESE IMAGE PATHS.
        
               Every question contains FOUR images.
        
               correctIndex:
               0 = i
               1 = ii
               2 = iii
               3 = iv
            ===================================================== */

            const questions = [

                {
                    correctIndex: 0,

                    items: [
                        "../assets/images/brick.png",
                        "../assets/images/ball.png",
                        "../assets/images/matchbox.png",
                        "../assets/images/book.png"
                    ]
                },

                {
                    correctIndex: 3,

                    items: [
                        "../assets/images/topi.png",
                        "../assets/images/ice-cream.png",
                        "../assets/images/kuppi.png",
                        "../assets/images/phone.png"
                    ]
                },

                {
                    correctIndex: 0,

                    items: [
                        "../assets/images/sandwich.png",
                        "../assets/images/gas-cylinder.png",
                        "../assets/images/mango-pulp.png",
                        "../assets/images/bottle.png"
                    ]
                }

            ];


            /* =====================================================
               STATE
            ===================================================== */

            let currentIndex = 0;

            let isAnimating = false;

            let quizState =
                Array.from(
                    {
                        length: questions.length
                    },
                    () => ({
                        solved: false,
                        selectedIndex: null
                    })
                );


            /* =====================================================
               ELEMENTS
            ===================================================== */

            const optionGrid =
                document.getElementById("optionGrid");

            const gameBoard =
                document.getElementById("gameBoard");

            const launcher =
                document.getElementById("launcher");

            const fireball =
                document.getElementById("fireball");

            const questionLabel =
                document.getElementById("questionLabel");

            const prevBtn =
                document.getElementById("prevBtn");

            const nextBtn =
                document.getElementById("nextBtn");

            const navProgress =
                document.getElementById("navProgress");


            let audioCtx = null;


            /* =====================================================
               SOUND
               Same reference beep patterns
            ===================================================== */

            function getAudioContext() {

                if (!audioCtx) {

                    audioCtx =
                        new (
                            window.AudioContext ||
                            window.webkitAudioContext
                        )();

                }

                if (
                    audioCtx.state === "suspended"
                ) {
                    audioCtx.resume();
                }

                return audioCtx;
            }


            function beep(
                frequency,
                duration,
                type = "sine"
            ) {

                try {

                    const ctx =
                        getAudioContext();

                    const oscillator =
                        ctx.createOscillator();

                    const gain =
                        ctx.createGain();


                    oscillator.type = type;

                    oscillator.frequency.value =
                        frequency;


                    oscillator.connect(gain);

                    gain.connect(
                        ctx.destination
                    );


                    gain.gain.setValueAtTime(
                        .15,
                        ctx.currentTime
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        .0001,
                        ctx.currentTime +
                        duration / 1000
                    );


                    oscillator.start();

                    oscillator.stop(
                        ctx.currentTime +
                        duration / 1000
                    );

                } catch (e) {

                    /* Audio may be blocked until user interaction */

                }

            }


            const sound = {

                correct() {

                    beep(
                        660,
                        110
                    );

                    setTimeout(() => {

                        beep(
                            880,
                            160
                        );

                    }, 110);

                },


                wrong() {

                    beep(
                        180,
                        220,
                        "sawtooth"
                    );

                },


                finish() {

                    [
                        523,
                        659,
                        784,
                        1047
                    ].forEach(
                        (
                            frequency,
                            index
                        ) => {

                            setTimeout(
                                () => {

                                    beep(
                                        frequency,
                                        150
                                    );

                                },
                                index * 130
                            );

                        }
                    );

                },


                shoot() {

                    try {

                        const ctx =
                            getAudioContext();

                        const oscillator =
                            ctx.createOscillator();

                        const gain =
                            ctx.createGain();


                        oscillator.type =
                            "sawtooth";


                        oscillator.frequency.setValueAtTime(
                            160,
                            ctx.currentTime
                        );


                        oscillator.frequency.exponentialRampToValueAtTime(
                            70,
                            ctx.currentTime + .18
                        );


                        oscillator.connect(gain);

                        gain.connect(
                            ctx.destination
                        );


                        gain.gain.setValueAtTime(
                            .08,
                            ctx.currentTime
                        );


                        gain.gain.exponentialRampToValueAtTime(
                            .001,
                            ctx.currentTime + .18
                        );


                        oscillator.start();

                        oscillator.stop(
                            ctx.currentTime + .18
                        );

                    } catch (e) { }

                }

            };


            /* =====================================================
               CONFETTI
               Same reference style
            ===================================================== */

            function burstConfetti(element) {

                const rect =
                    element.getBoundingClientRect();


                if (
                    typeof confetti === "function"
                ) {

                    confetti({

                        particleCount: 34,

                        spread: 70,

                        startVelocity: 22,

                        origin: {

                            x:
                                (
                                    rect.left +
                                    rect.width / 2
                                ) /
                                innerWidth,

                            y:
                                (
                                    rect.top +
                                    rect.height / 2
                                ) /
                                innerHeight

                        },

                        colors: [
                            "#6635dc",
                            "#ff4e83",
                            "#4e8ff0",
                            "#76b93b",
                            "#f4ae25",
                            "#4ecdc4"
                        ]

                    });

                }

            }


            /* =====================================================
               EMOJI POP
            ===================================================== */

            function showEmoji(emoji) {

                const element =
                    document.createElement("div");

                element.className =
                    "emoji-pop";

                element.textContent =
                    emoji;


                document.body.appendChild(
                    element
                );


                setTimeout(() => {

                    element.remove();

                }, 1600);

            }


            /* =====================================================
               UPDATE NAV
            ===================================================== */

            function updateNavigation() {

                const state =
                    quizState[currentIndex];


                prevBtn.disabled =
                    currentIndex === 0;


                nextBtn.disabled =
                    currentIndex ===
                    questions.length - 1 ||
                    !state.solved;


                navProgress.textContent =
                    `${currentIndex + 1} / ${questions.length}`;

            }


            /* =====================================================
               CREATE OPTIONS
            ===================================================== */

            function renderQuestion(index) {

                currentIndex = index;

                isAnimating = false;


                const question =
                    questions[index];

                const state =
                    quizState[index];


                questionLabel.textContent =
                    `Question ${index + 1}`;


                optionGrid.innerHTML =
                    "";


                const cardColors = [
                    "card-orange",
                    "card-yellow",
                    "card-blue",
                    "card-purple"
                ];


                const labels = [
                    "i)",
                    "ii)",
                    "iii)",
                    "iv)"
                ];


                question.items.forEach(
                    (src, itemIndex) => {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            `option-card ${cardColors[itemIndex]}`;


                        card.dataset.index =
                            itemIndex;


                        const number =
                            document.createElement(
                                "div"
                            );

                        number.className =
                            "option-number";

                        number.textContent =
                            labels[itemIndex];


                        const img =
                            document.createElement(
                                "img"
                            );

                        img.className =
                            "option-image";

                        img.src =
                            src;

                        img.alt =
                            `Option ${labels[itemIndex]}`;


                        card.appendChild(
                            number
                        );

                        card.appendChild(
                            img
                        );


                        card.addEventListener(
                            "click",
                            () => {

                                handleOptionClick(
                                    itemIndex,
                                    card
                                );

                            }
                        );


                        optionGrid.appendChild(
                            card
                        );


                        /*
                           Restore solved state
                           when returning with Prev.
                        */

                        if (state.solved) {

                            card.classList.add(
                                "locked"
                            );

                            if (
                                state.selectedIndex === itemIndex
                            ) {
                                card.classList.add(
                                    "correct"
                                );
                            }

                        }

                    }
                );


                updateNavigation();

            }


            /* =====================================================
               FIREBALL
            ===================================================== */

            function fireAtCard(
                targetCard,
                callback
            ) {

                const barrel =
                    launcher.querySelector(
                        ".launcher-barrel"
                    );


                const barrelRect =
                    barrel.getBoundingClientRect();

                const targetRect =
                    targetCard.getBoundingClientRect();


                const startX =
                    barrelRect.right - 4;

                const startY =
                    barrelRect.top +
                    barrelRect.height * .48;


                const targetX =
                    targetRect.left +
                    targetRect.width / 2;

                const targetY =
                    targetRect.top +
                    targetRect.height / 2;


                /*
                   Put fireball exactly
                   at barrel opening.
                */

                fireball.style.left =
                    `${startX}px`;

                fireball.style.top =
                    `${startY}px`;

                fireball.style.opacity =
                    "1";


                /* Recoil */

                launcher.animate(
                    [
                        {
                            transform:
                                "translate(0,0) rotate(0)"
                        },

                        {
                            transform:
                                "translate(-14px,7px) rotate(2deg)"
                        },

                        {
                            transform:
                                "translate(4px,-2px) rotate(-1deg)"
                        },

                        {
                            transform:
                                "translate(0,0) rotate(0)"
                        }
                    ],
                    {
                        duration: 430,

                        easing:
                            "cubic-bezier(.15,.8,.2,1)"
                    }
                );


                sound.shoot();


                /*
                   Main fireball flight.
                */

                const animation =
                    fireball.animate(
                        [

                            {
                                left:
                                    `${startX}px`,

                                top:
                                    `${startY}px`,

                                transform:
                                    "translate(-50%,-50%) scale(.45)"
                            },

                            {
                                left:
                                    `${startX +
                                    (targetX - startX) *
                                    .35
                                    }px`,

                                top:
                                    `${startY +
                                    (targetY - startY) *
                                    .08
                                    }px`,

                                transform:
                                    "translate(-50%,-50%) scale(1.22)"
                            },

                            {
                                left:
                                    `${targetX}px`,

                                top:
                                    `${targetY}px`,

                                transform:
                                    "translate(-50%,-50%) scale(1)"
                            }

                        ],
                        {

                            duration: 720,

                            easing:
                                "cubic-bezier(.12,.65,.2,1)"

                        }
                    );


                animation.finished.then(
                    () => {

                        fireball.style.opacity =
                            "0";


                        createImpact(
                            targetX,
                            targetY
                        );


                        callback();

                    }
                );

            }


            /* =====================================================
               IMPACT
            ===================================================== */

            function createImpact(
                x,
                y
            ) {

                const impact =
                    document.createElement(
                        "div"
                    );


                impact.className =
                    "impact";


                impact.style.left =
                    `${x}px`;

                impact.style.top =
                    `${y}px`;


                document.body.appendChild(
                    impact
                );


                setTimeout(
                    () => {

                        impact.remove();

                    },
                    700
                );

            }


            /* =====================================================
               OPTION CLICK
            ===================================================== */

            function handleOptionClick(
                index,
                card
            ) {

                if (isAnimating) return;


                const state =
                    quizState[currentIndex];


                if (state.solved) return;


                isAnimating = true;

                state.selectedIndex =
                    index;


                /*
                   Fire at selected card.
                */

                fireAtCard(
                    card,
                    () => {

                        const question =
                            questions[currentIndex];


                        const correct =
                            question.correctIndex;


                        if (
                            index === correct
                        ) {

                            handleCorrect(
                                card
                            );

                        } else {

                            handleWrong(
                                card
                            );

                        }

                    }
                );

            }


            /* =====================================================
               CORRECT
            ===================================================== */

            function handleCorrect(card) {

                const state =
                    quizState[currentIndex];


                state.solved = true;


                /*
                   Lock every option after
                   the correct answer.
                */
                const allCards =
                    optionGrid.querySelectorAll(
                        ".option-card"
                    );

                allCards.forEach(
                    (optionCard) => {
                        optionCard.classList.add(
                            "locked"
                        );
                    }
                );


                /*
                   Keep only the correct card
                   fully visible.
                */
                card.classList.add(
                    "correct"
                );


                sound.correct();


                showEmoji(
                    "🥳"
                );


                burstConfetti(
                    card
                );


                if (
                    currentIndex ===
                    questions.length - 1
                ) {

                    setTimeout(
                        () => {

                            sound.finish();

                            showFinalPopup();

                        },
                        650
                    );

                }


                updateNavigation();

                isAnimating = false;

            }


            /* =====================================================
               WRONG
            ===================================================== */

            function handleWrong(card) {

                sound.wrong();


                showEmoji(
                    "😔"
                );


                /*
                   Burn animation.
                */

                card.classList.add(
                    "burning"
                );


                /*
                   Let the card finish
                   its burn animation.
                */

                setTimeout(
                    () => {

                        card.classList.remove(
                            "burning"
                        );

                        stateResetSelection();

                        isAnimating = false;

                    },
                    760
                );

            }


            /* =====================================================
               RESET WRONG SELECTION
            ===================================================== */

            function stateResetSelection() {

                quizState[currentIndex]
                    .selectedIndex = null;

            }


            /* =====================================================
               FINAL POPUP
            ===================================================== */

            function showFinalPopup() {

                if (
                    document.querySelector(
                        ".final-overlay"
                    )
                ) {
                    return;
                }


                const overlay =
                    document.createElement(
                        "div"
                    );


                const modal =
                    document.createElement(
                        "div"
                    );


                overlay.className =
                    "final-overlay";


                modal.className =
                    "final-modal";


                modal.innerHTML = `

            <span class="icon-big">
                🎉
            </span>

            <h2>
                All Done!
            </h2>

            <p>
                Amazing! You got them all right!
            </p>

            <button class="btn-playagain">
                <i class="fa-solid fa-rotate-right"></i>
                Play again
            </button>

        `;


                overlay.appendChild(
                    modal
                );


                document.body.appendChild(
                    overlay
                );


                /*
                   Same multiple confetti
                   bursts as reference.
                */

                setTimeout(
                    () => burstConfetti(modal),
                    80
                );

                setTimeout(
                    () => burstConfetti(modal),
                    350
                );

                setTimeout(
                    () => burstConfetti(modal),
                    650
                );


                modal
                    .querySelector(
                        ".btn-playagain"
                    )
                    .addEventListener(
                        "click",
                        () => {

                            overlay.remove();

                            restartGame();

                        }
                    );

            }


            /* =====================================================
               RESTART
            ===================================================== */

            function restartGame() {


                quizState =
                    Array.from(
                        {
                            length:
                                questions.length
                        },
                        () => ({
                            solved: false,
                            selectedIndex: null
                        })
                    );


                currentIndex = 0;


                renderQuestion(
                    0
                );

            }


            /* =====================================================
               PREV
            ===================================================== */

            prevBtn.addEventListener(
                "click",
                () => {

                    if (
                        isAnimating
                    ) return;


                    if (
                        currentIndex > 0
                    ) {

                        renderQuestion(
                            currentIndex - 1
                        );

                    }

                }
            );


            /* =====================================================
               NEXT
            ===================================================== */

            nextBtn.addEventListener(
                "click",
                () => {

                    if (
                        isAnimating
                    ) return;


                    const state =
                        quizState[currentIndex];


                    if (
                        state.solved &&
                        currentIndex <
                        questions.length - 1
                    ) {

                        renderQuestion(
                            currentIndex + 1
                        );

                    }

                }
            );


            /* =====================================================
               START
            ===================================================== */

            renderQuestion(0);

        })();

    </script>

    <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
