<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete the Pattern</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      min-height: 100%
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative
    }

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0
    }

    .header h1 {
      color: #12265d;
      font-size: 42px;
      line-height: 1.1;
      font-weight: 800
    }

    .question-screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0
    }

    .question-label {
      color: #12265d;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 14px
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-block: 15px;
    }

    .progress-small {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 20px;
      color: #12265d;
    }

    /* ONE horizontal number path */
    .path-wrap {
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center
    }

    .number-path {
      width: max-content;
      max-width: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      white-space: nowrap;
      margin: 5px auto 15px;
    }

    .path-node {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      position: relative
    }

    .path-node.given {
      background: #fff5e9;
      border: 2px solid #ff9b2f
    }

    .path-node.missing {
      background: #fff;
      border: 3px solid #ff9b2f;
      color: #8a8f9d;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(18, 38, 93, .06)
    }

    .path-node.missing:hover {
      transform: translateY(-2px)
    }

    .path-node.missing.active {
      border-color: #ef7e12;
      box-shadow: 0 0 0 5px rgba(255, 155, 47, .12)
    }

    .path-node.correct {
      border-color: #35b95f;
      background: #f2fff6;
      color: #12265d
    }

    .path-node.wrong {
      border-color: #e74c3c;
      background: #fff4f4;
      animation: wrongBlink .45s ease 2
    }

    @keyframes wrongBlink {

      0%,
      100% {
        border-color: #e74c3c
      }

      50% {
        border-color: #ffb3aa
      }
    }

    .arrow {
      font-size: 28px;
      font-weight: 800;
      flex: 0 0 auto;
      color: #12265d
    }

    .jump-title {
      margin-top: 34px;
      font-size: 22px;
      font-weight: 800
    }

    .jump-options {
      display: flex;
      gap: 12px;
      margin-block: 14px;
      justify-content: center
    }

    .jump-option {
      border: 2px solid #ff9b2f;
      background: #fff;
      border-radius: 999px;
      width: 150px;
      height: 70px;
      padding: 0 18px;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      /* box-shadow: 0 3px 8px rgba(18, 38, 93, .06) */
    }

    .jump-option:hover {
      transform: translateY(-2px)
    }

    .jump-option.selected {
      background: #fff5e9;
      border-color: #ef7e12
    }

    .jump-option.correct-choice {
      background: #f2fff6;
      border-color: #35b95f;
      animation: choiceSuccess .3s ease
    }

    @keyframes choiceSuccess {
      50% {
        transform: scale(1.06)
      }
    }

    .jump-option.wrong-choice {
      background: #fff4f4;
      border-color: #e74c3c
    }

    .jump-options.locked .jump-option {
      cursor: default
    }

    .check-btn:hover:not(:disabled) {
      transform: translateY(-2px)
    }

    .check-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634
    }

    .check-btn:disabled {
      opacity: .45;
      cursor: default
    }

    /* ================= NAV / FOOTER ================= */

    .nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 100px;
      position: relative;
      z-index: 20;
      margin-inline: auto;
    }

    .nav #prevBtn {
      justify-self: start;
    }

    .nav #nextBtn {
      justify-self: end;
    }

    .nav-progress {
      grid-column: 2;
      grid-row: 1;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      min-width: 60px;
      display: none;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }


    /* ================= SAME EMOJI / POPUP ================= */

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }




    /* ================= CLEAN CONTENT SPACING ================= */
    .question-screen {
      justify-content: flex-start;
      padding-top: 4px;
    }

    .question-content {
      flex: 0 1 auto;
      justify-content: flex-start;
      gap: 0;
    }

    .progress-small {
      margin-bottom: 14px;
    }

    .path-wrap {
      flex: 0 0 auto;
    }

    .jump-title {
      margin-top: 24px;
      line-height: 1.2;
    }

    .jump-options {
      margin-top: 12px;
      gap: 14px;
    }

    .jump-option {
      width: 150px;
      height: 80px;
      padding: 0 16px;
      border-radius: 18px;
      font-size: 25px;
      border: 2px solid #6c5ce7;
      background: linear-gradient(180deg, #ffffff 0%, #f3efff 100%);
      color: #12265d;
      box-shadow:
        0 7px 0 #b7a9ef,
        0 11px 18px rgba(18, 38, 93, .13),
        inset 0 1px 0 rgba(255, 255, 255, .9);
      transition: transform .15s ease, box-shadow .15s ease,
        background .15s ease, border-color .15s ease;
      position: relative;
      overflow: hidden;
    }

    .jump-option:nth-child(1) {
      border-color: #b265d1;
      background: linear-gradient(180deg, #fffaf7 0%, #fcdfff 100%);
      box-shadow:
        0 7px 0 #c788e0,
        0 11px 18px rgba(18, 38, 93, .13),
        inset 0 1px 0 rgba(255, 255, 255, .95);
    }

    .jump-option:nth-child(2) {
      border-color: #42a5f5;
      background: linear-gradient(180deg, #f8fcff 0%, #e1f2ff 100%);
      box-shadow:
        0 7px 0 #91c9f3,
        0 11px 18px rgba(18, 38, 93, .13),
        inset 0 1px 0 rgba(255, 255, 255, .95);
    }

    .jump-option:nth-child(3) {
      border-color: #71c9bd;
      background: linear-gradient(180deg, #fbfffb 0%, #e5f7e6 100%);
      box-shadow:
        0 7px 0 #72dfd0,
        0 11px 18px rgba(18, 38, 93, .13),
        inset 0 1px 0 rgba(255, 255, 255, .95);
    }

    .jump-option:hover:not(:disabled) {
      transform: translateY(-5px);
    }

    .jump-option:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow:
        0 3px 0 #b7a9ef,
        0 6px 10px rgba(18, 38, 93, .10),
        inset 0 1px 0 rgba(255, 255, 255, .95);
    }

    .jump-option:focus-visible {
      outline: 3px solid rgba(255, 155, 47, .28);
      outline-offset: 2px;
    }

    .jump-option.correct-choice {
      background: #f2fff6;
      border-color: #35b95f;
      box-shadow:
        0 7px 0 #9bd09e,
        0 11px 18px rgba(18, 38, 93, .13),
        inset 0 1px 0 rgba(255, 255, 255, .95);
      color: #16813b;
    }

    .jump-option.wrong-choice {
      background: #fff4f4;
      border-color: #e74c3c;
      color: #c62d22;
      box-shadow:
        0 7px 0 #f3aa91,
        0 11px 18px rgba(18, 38, 93, .13),
        inset 0 1px 0 rgba(255, 255, 255, .95);
      animation: optionWrong .45s ease 2;
    }

    @keyframes optionWrong {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    .learning-note {
      margin-top: 16px;
      font-size: 18px;
      color: #12265d;
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
    }

    /* Completion message shown inside a clean, compact success box. */
    .completion-box {
      margin-top: 24px;
      width: min(760px, 92%);
      padding: 20px 24px;
      border: 2px solid #35b95f;
      border-radius: 22px;
      background: #f5fff7;
      box-shadow: 0 8px 22px rgba(18, 38, 93, .08);
      text-align: center;
      animation: completionPop .35s ease-out;
    }

    .completion-title {
      font-size: 25px;
      line-height: 1.2;
      color: #16813b;
      font-weight: 800;
    }

    .completion-sequence {
      margin-top: 9px;
      font-size: 20px;
      line-height: 1.35;
      color: #12265d;
      font-weight: 800;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .completion-sequence::-webkit-scrollbar {
      display: none;
    }

    @keyframes completionPop {
      0% {
        opacity: 0;
        transform: scale(.94);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =====================================================
       SAME RESPONSIVE BREAKPOINT DIMENSIONS AS REFERENCE
    ===================================================== */

    @media screen and (min-width: 1025px) and (max-width: 1600px) {
      .quiz-wrap {
        max-width: 1380px;
      }

      .header h1 {
        font-size: 52px;
      }

      .question-label {
        font-size: 24px;
      }

      .number-path {
        gap: 14px;
      }

      .path-node {
        width: 76px;
        height: 76px;
        flex-basis: 76px;
        font-size: 28px;
      }

      .arrow {
        font-size: 28px;
      }

      .nav {
        gap: 110px;
      }

      .nav-progress {
        font-size: 20px;
      }

      .nav button {
        width: 150px;
        min-width: 150px;
        height: 55px;
        padding: 0;
        font-size: 20px;
      }
    }

    /* =========================================================
   BIG TRAIN + BIG CONTENT ON MONITORS
   Fonts and colors unchanged
========================================================= */

    @media screen and (min-width: 1601px) and (max-width: 1920px) {

      .quiz-wrap {
        width: min(97vw, 1840px);
        max-width: 1840px;
      }

      .question-content {
        width: min(96vw, 1700px);
        max-width: 1700px;
        margin-block: clamp(28px, 2.5vw, 48px);
      }

      /* BIGGER TRAIN TRACK */
      .path-wrap {
        width: 100%;
        padding: clamp(18px, 1.5vw, 28px) 0 clamp(28px, 2vw, 38px);
        border-bottom-width: 9px;
      }

      .number-path {
        gap: clamp(8px, 0.7vw, 14px);
        margin: 12px auto 20px;
      }

      /* BIGGER TRAIN CARRIAGES */
      .path-node {
        width: clamp(150px, 8vw, 195px) !important;
        height: clamp(150px, 8vw, 195px) !important;
        flex-basis: clamp(150px, 8vw, 195px) !important;
        margin-bottom: clamp(22px, 1.5vw, 30px);
      }

      /* BIGGER ENGINE */
      .path-node:nth-of-type(1) {
        width: clamp(140px, 8vw, 175px);
        flex-basis: clamp(140px, 8vw, 175px);
      }

      /* BIGGER CONNECTORS */
      .arrow {
        width: clamp(24px, 1.5vw, 32px);
        flex-basis: clamp(24px, 1.5vw, 32px);
        margin-bottom: clamp(58px, 3vw, 70px);
      }

      .arrow::before {
        height: 9px;
      }

      .arrow::after {
        width: 14px;
        height: 14px;
      }

      /* BIGGER TRAIN WHEELS */
      .train-wheel {
        width: clamp(34px, 2vw, 42px);
        height: clamp(34px, 2vw, 42px);
        bottom: clamp(-42px, -2.2vw, -34px);
        border-width: 6px;
      }

      .train-wheel::after {
        width: 9px;
        height: 9px;
      }

      .path-node:nth-of-type(1) .train-wheel {
        width: clamp(40px, 2.3vw, 50px);
        height: clamp(40px, 2.3vw, 50px);
        bottom: clamp(-50px, -2.6vw, -40px);
        border-width: 7px;
      }

      /* BIGGER ANSWER AREA */
      .jump-title {
        margin-top: clamp(32px, 2.5vw, 48px);
      }

      .jump-options {
        gap: clamp(20px, 1.6vw, 32px);
        margin-top: clamp(18px, 1.3vw, 26px);
      }

      .jump-option {
        width: clamp(190px, 11vw, 240px);
        min-width: clamp(190px, 11vw, 240px);
        height: clamp(100px, 6vw, 125px);
        padding-inline: clamp(20px, 1.5vw, 32px);
        border-radius: clamp(20px, 1.3vw, 28px);
      }

      .jump-option::before {
        width: clamp(46px, 2.5vw, 58px);
        height: clamp(46px, 2.5vw, 58px);
        top: clamp(-32px, -1.7vw, -25px);
      }

      /* MORE SPACE AROUND CONTENT */
      .learning-note {
        margin-top: clamp(20px, 1.5vw, 30px);
      }

      .completion-box {
        width: min(950px, 85%);
        margin-top: clamp(28px, 2vw, 40px);
        padding: clamp(24px, 2vw, 34px) clamp(30px, 2.5vw, 46px);
      }

      .nav {
        width: min(90%, 1500px);
        margin-top: clamp(28px, 2vw, 42px);
        padding-top: clamp(22px, 1.5vw, 32px);
        gap: clamp(180px, 13vw, 300px);
      }

      .nav button {
        width: 160px;
        min-width: 160px;
        height: 58px;
        padding: 0;
      }
    }


    @media screen and (min-width: 1921px) {

      .quiz-wrap {
        width: min(97vw, 2350px);
        max-width: 2350px;
      }

      .question-content {
        width: min(96vw, 2200px);
        max-width: 2200px;
        margin-block: clamp(34px, 2.5vw, 58px);
      }

      /* VERY BIG TRAIN TRACK */
      .path-wrap {
        width: 100%;
        padding: clamp(22px, 1.5vw, 34px) 0 clamp(34px, 2vw, 46px);
        border-bottom-width: 10px;
      }

      .number-path {
        gap: clamp(12px, 0.8vw, 18px);
        margin: 16px auto 24px;
      }

      /* VERY BIG TRAIN CARRIAGES */
      .path-node {
        width: clamp(125px, 6vw, 160px);
        height: clamp(125px, 6vw, 160px);
        flex-basis: clamp(125px, 6vw, 160px);
        margin-bottom: clamp(26px, 1.6vw, 36px);
      }

      /* VERY BIG ENGINE */
      .path-node:nth-of-type(1) {
        width: clamp(165px, 8vw, 205px);
        flex-basis: clamp(165px, 8vw, 205px);
      }

      /* BIGGER CONNECTORS */
      .arrow {
        width: clamp(28px, 1.6vw, 38px);
        flex-basis: clamp(28px, 1.6vw, 38px);
        margin-bottom: clamp(68px, 3vw, 82px);
      }

      .arrow::before {
        height: 10px;
      }

      .arrow::after {
        width: 16px;
        height: 16px;
      }

      /* VERY BIG TRAIN WHEELS */
      .train-wheel {
        width: clamp(40px, 2vw, 50px);
        height: clamp(40px, 2vw, 50px);
        bottom: clamp(-50px, -2.3vw, -40px);
        border-width: 7px;
      }

      .train-wheel::after {
        width: 10px;
        height: 10px;
      }

      .path-node:nth-of-type(1) .train-wheel {
        width: clamp(48px, 2.4vw, 60px);
        height: clamp(48px, 2.4vw, 60px);
        bottom: clamp(-60px, -2.8vw, -48px);
        border-width: 8px;
      }

      /* BIGGER ANSWER AREA */
      .jump-title {
        margin-top: clamp(38px, 2.5vw, 56px);
      }

      .jump-options {
        gap: clamp(24px, 1.7vw, 38px);
        margin-top: clamp(20px, 1.3vw, 30px);
      }

      .jump-option {
        width: clamp(210px, 11vw, 270px);
        min-width: clamp(210px, 11vw, 270px);
        height: clamp(110px, 6vw, 140px);
        padding-inline: clamp(24px, 1.5vw, 38px);
        border-radius: clamp(22px, 1.3vw, 30px);
      }

      .jump-option::before {
        width: clamp(52px, 2.5vw, 64px);
        height: clamp(52px, 2.5vw, 64px);
        top: clamp(-36px, -1.7vw, -28px);
      }

      /* MORE SPACE AROUND CONTENT */
      .learning-note {
        margin-top: clamp(24px, 1.5vw, 34px);
      }

      .completion-box {
        width: min(1100px, 85%);
        margin-top: clamp(32px, 2vw, 46px);
        padding: clamp(28px, 2vw, 40px) clamp(34px, 2.5vw, 52px);
      }

      .nav {
        width: min(92%, 1750px);
        margin-top: clamp(32px, 2vw, 50px);
        padding-top: clamp(26px, 1.5vw, 40px);
        gap: clamp(210px, 13vw, 360px);
      }

      .nav button {
        width: 170px;
        min-width: 170px;
        height: 60px;
        padding: 0;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 10px 14px;
      }

      .header h1 {
        font-size: 35px;
      }

      .question-label {
        font-size: 20px;
        margin-bottom: 10px;
      }

      .progress-small {
        font-size: 16px;
        margin-bottom: 12px;
      }

      .path-wrap {
        width: 100%;
        overflow: hidden;
        justify-content: flex-start;
      }

      .number-path {
        gap: 7px;
        margin: 0 auto;
      }

      .path-node {
        width: 58px;
        height: 58px;
        flex-basis: 58px;
        font-size: 21px;
      }

      .arrow {
        font-size: 21px;
      }

      .jump-title {
        margin-top: 22px;
        font-size: 19px;
      }

      .jump-options {
        gap: 7px;
        margin-top: 10px;
      }

      .jump-option {

<body>
  <main class="quiz-wrap">
    <header class="header">
      <h1>Complete the pattern</h1>
    </header>
    <section class="question-screen">
      <div class="question-label" id="questionLabel">Question 1</div>
      <div class="question-content" id="questionContent"></div>
    </section>
    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled><i class="fa-solid fa-chevron-left"></i> Prev</button>
      <div class="nav-progress" id="navProgress">1/4</div>
      <button id="nextBtn" disabled>Next <i class="fa-solid fa-chevron-right"></i></button>
    </nav>
  </main>

  <script>        function speak(t) {
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-US";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }
    (() => {
      const questions = [
        {
          values: [3, 6, 9, 12, null, null, null, null],
          missing: [15, 18, 21, 24],
          jump: 3
        },
        {
          values: [6, 12, 18, 24, null, null, null, null],
          missing: [30, 36, 42, 48],
          jump: 6
        },
        {
          values: [11, 22, 33, 44, null, null, null, null],
          missing: [55, 66, 77, 88],
          jump: 11
        },
        {
          values: [7, 14, 21, 28, null, null, null, null],
          missing: [35, 42, 49, 56],
          jump: 7
        }
      ];

      const content = document.getElementById("questionContent");
      const questionLabel = document.getElementById("questionLabel");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const navProgress = document.getElementById("navProgress");

      let current = 0;
      let audioCtx = null;

      const state = questions.map(q => ({
        step: 0,
        completed: false
      }));

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);

        setTimeout(() => element.remove(), 1600);
      }

      function getOptions(correct, step, jump) {
        // Every step always contains the real answer plus two plausible
        // alternatives based on the current sequence value.
        const wrongOffsets = [
          [-1, 1],
          [-1, 2],
          [-1, 3],
          [-2, 1]
        ];
        const offsets = wrongOffsets[step % wrongOffsets.length];

        const options = [
          correct,
          correct + offsets[0],
          correct + offsets[1]
        ];

        // Keep all options positive and unique, then shuffle their positions.
        const unique = [...new Set(options.filter(n => n > 0))];
        while (unique.length < 3) {
          unique.push(correct + unique.length + 1);
        }

        return unique.sort(() => Math.random() - 0.5);
      }

      function renderQuestion(index) {
        const q = questions[index];
        const s = state[index];

        current = index;
        questionLabel.textContent = `Question ${index + 1}`;
        navProgress.textContent =
          `${String(index + 1)}/4`;

        content.innerHTML = "";

        const progress = document.createElement("div");
        progress.className = "progress-small";
        progress.textContent = s.completed
          ? "Pattern complete!"
          : "Complete the pattern";

        const pathWrap = document.createElement("div");
        pathWrap.className = "path-wrap";

        const path = document.createElement("div");
        path.className = "number-path";

        let missingCount = 0;

        q.values.forEach((value, indexInSequence) => {
          const node = document.createElement("div");

          if (value !== null) {
            node.className = "path-node given";
            node.textContent = value;
          } else {
            const answerIndex = missingCount;
            const answer = q.missing[answerIndex];

            node.className = "path-node missing";

            if (answerIndex < s.step || s.completed) {
              node.classList.add("correct");
              node.textContent = answer;
            } else {
              node.textContent = "?";
            }

            missingCount++;
          }

          /* Add two real toy-train wheels so they sit outside the carriage
             instead of being clipped inside the card background. */
          const wheel1 = document.createElement("span");
          const wheel2 = document.createElement("span");
          wheel1.className = "train-wheel train-wheel-left";
          wheel2.className = "train-wheel train-wheel-right";
          node.append(wheel1, wheel2);

          path.appendChild(node);

          if (indexInSequence < q.values.length - 1) {
            const arrow = document.createElement("span");
            arrow.className = "arrow";
            arrow.textContent = "→";
            path.appendChild(arrow);
          }
        });

        pathWrap.appendChild(path);

        const questionPrompt = document.createElement("div");
        questionPrompt.className = "jump-title";

        const optionsWrap = document.createElement("div");
        optionsWrap.className = "jump-options";

        const hint = null; // No hint button by request.

        if (!s.completed) {
          questionPrompt.textContent = "What comes next?";

          const correct = q.missing[s.step];
          const options = getOptions(correct, s.step, q.jump);

          options.forEach(option => {
            const button = document.createElement("button");
            button.className = "jump-option";
            button.type = "button";
            button.textContent = option;

            button.addEventListener("click", () => {
              if (option !== correct) {
                // sound.wrong();
                speak("Try Again!");
                showEmoji("😔");

                button.classList.remove("wrong-choice");
                void button.offsetWidth;
                button.classList.add("wrong-choice");

                setTimeout(() => {
                  button.classList.remove("wrong-choice");
                }, 520);

                return;
              }

              button.classList.add("correct-choice");
              button.innerHTML = `<span>✓</span> ${option}`;
              button.disabled = true;

              // sound.correct();
              speak("Correct!");
              showEmoji("🥳");
              burstConfetti(button);

              s.step++;

              setTimeout(() => {
                if (s.step >= q.missing.length) {
                  s.completed = true;
                  nextBtn.disabled = false;
                  renderQuestion(index);
                  if (index === questions.length - 1) {
                    nextBtn.disabled = true;
                    setTimeout(finishQuiz, 1400);
                  }
                } else {
                  renderQuestion(index);
                }
              }, 360);
            });

            optionsWrap.appendChild(button);
          });
        } else {
          questionPrompt.textContent = "";

          const completionBox = document.createElement("div");
          completionBox.className = "completion-box";

          const completionTitle = document.createElement("div");
          completionTitle.className = "completion-title";
          completionTitle.textContent = "🎉 Pattern Complete!";

          const completedText = document.createElement("div");
          completedText.className = "completion-sequence";
          completedText.textContent =
            q.values.map((v, i) => {
              if (v !== null) return v;
              const missingIndex =
                q.values.slice(0, i + 1).filter(x => x === null).length - 1;
              return q.missing[missingIndex];
            }).join(" → ");

          completionBox.append(completionTitle, completedText);
          content.append(progress, pathWrap, completionBox);

          prevBtn.disabled = index === 0;
          nextBtn.disabled = false;
          return;
        }

        content.append(
          progress,
          pathWrap,
          questionPrompt,
          optionsWrap
        );

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !s.completed;
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>You completed all the pattern!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i>
        Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          state.forEach((s, i) => {
            s.step = 0;
            s.completed = false;
          });

          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) {
          renderQuestion(current - 1);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (
          state[current].completed &&
          current < questions.length - 1
        ) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);
    })();
  </script>
</body>

</html>
