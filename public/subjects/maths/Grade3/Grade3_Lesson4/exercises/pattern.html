<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete the Pattern</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      min-height: 100%
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative
    }

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0
    }

    .header h1 {
      color: #12265d;
      font-size: 42px;
      line-height: 1.1;
      font-weight: 800
    }

    .question-screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0
    }

    .question-label {
      color: #12265d;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 14px
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-block: 30px;
    }

    .progress-small {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 20px;
      color: #12265d;
    }

    /* ONE horizontal number path */
    .path-wrap {
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center
    }

    .number-path {
      width: max-content;
      max-width: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      white-space: nowrap;
      margin: 5px auto 15px;
    }

    .path-node {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      position: relative
    }

    .path-node.given {
      background: #fff5e9;
      border: 2px solid #ff9b2f
    }

    .path-node.missing {
      background: #fff;
      border: 3px solid #ff9b2f;
      color: #8a8f9d;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(18, 38, 93, .06)
    }

    .path-node.missing:hover {
      transform: translateY(-2px)
    }

    .path-node.missing.active {
      border-color: #ef7e12;
      box-shadow: 0 0 0 5px rgba(255, 155, 47, .12)
    }

    .path-node.correct {
      border-color: #35b95f;
      background: #f2fff6;
      color: #12265d
    }

    .path-node.wrong {
      border-color: #e74c3c;
      background: #fff4f4;
      animation: wrongBlink .45s ease 2
    }

    @keyframes wrongBlink {

      0%,
      100% {
        border-color: #e74c3c
      }

      50% {
        border-color: #ffb3aa
      }
    }

    .arrow {
      font-size: 28px;
      font-weight: 800;
      flex: 0 0 auto;
      color: #12265d
    }

    .jump-title {
      margin-top: 34px;
      font-size: 22px;
      font-weight: 800
    }

    .jump-options {
      display: flex;
      gap: 12px;
      margin-block: 14px;
      justify-content: center
    }

    .jump-option {
      border: 2px solid #ff9b2f;
      background: #fff;
      border-radius: 999px;
      width: 150px;
      height: 70px;
      padding: 0 18px;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      /* box-shadow: 0 3px 8px rgba(18, 38, 93, .06) */
    }

    .jump-option:hover {
      transform: translateY(-2px)
    }

    .jump-option.selected {
      background: #fff5e9;
      border-color: #ef7e12
    }

    .jump-option.correct-choice {
      background: #f2fff6;
      border-color: #35b95f;
      animation: choiceSuccess .3s ease
    }

    @keyframes choiceSuccess {
      50% {
        transform: scale(1.06)
      }
    }

    .jump-option.wrong-choice {
      background: #fff4f4;
      border-color: #e74c3c
    }

    .jump-options.locked .jump-option {
      cursor: default
    }

    .check-btn:hover:not(:disabled) {
      transform: translateY(-2px)
    }

    .check-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634
    }

    .check-btn:disabled {
      opacity: .45;
      cursor: default
    }

    /* ================= NAV / FOOTER ================= */

    .nav {
      width: 100%;
      margin: 10px auto 0;
      padding-top: 18px;
      border-top: 2px solid #e3e6eb;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 100px;
      position: relative;
      z-index: 20;
    }

    .nav #prevBtn {
      justify-self: start;
    }

    .nav #nextBtn {
      justify-self: end;
    }

    .nav-progress {
      grid-column: 2;
      grid-row: 1;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      min-width: 60px;
      display: none;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }


    /* ================= SAME EMOJI / POPUP ================= */

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    }

    }

    }

      align-items: center;

    .question-screen {

    }

    .question-content {

    .jump-option {

    .jump-option:nth-child(3) {

    .jump-option:hover:not(:disabled) {

    }

    .jump-option:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow:
        0 3px 0 #b7a9ef,
        0 6px 10px rgba(18, 38, 93, .10),

    }

    .jump-option:focus-visible {

    }

    .jump-option.correct-choice {
      background: #f2fff6;
      border-color: #35b95f;
      box-shadow:
        0 7px 0 #9bd09e,
        0 11px 18px rgba(18, 38, 93, .13),
        inset 0 1px 0 rgba(255, 255, 255, .95);
      color: #16813b;
    }

    .jump-option.wrong-choice {
      background: #fff4f4;
      border-color: #e74c3c;
      color: #c62d22;
      box-shadow:
        0 7px 0 #f3aa91,
        0 11px 18px rgba(18, 38, 93, .13),
        inset 0 1px 0 rgba(255, 255, 255, .95);
      animation: optionWrong .45s ease 2;
    }

    @keyframes optionWrong {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    .learning-note {
      margin-top: 16px;
      font-size: 18px;
      color: #12265d;
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
    }

    /* Completion message shown inside a clean, compact success box. */
    .completion-box {
      margin-top: 24px;
      width: min(760px, 92%);
      padding: 20px 24px;
      border: 2px solid #35b95f;
      border-radius: 22px;
      background: #f5fff7;
      box-shadow: 0 8px 22px rgba(18, 38, 93, .08);
      text-align: center;
      animation: completionPop .35s ease-out;
    }

    .completion-title {
      font-size: 25px;
      line-height: 1.2;
      color: #16813b;
      font-weight: 800;
    }

    .completion-sequence {
      margin-top: 9px;
      font-size: 20px;
      line-height: 1.35;
      color: #12265d;
      font-weight: 800;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .completion-sequence::-webkit-scrollbar {
      display: none;
    }

    @keyframes completionPop {
      0% {
        opacity: 0;
        transform: scale(.94);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

<body>
  <main class="quiz-wrap">
    <header class="header">
      <h1>Complete the pattern</h1>
    </header>
    <section class="question-screen">
      <div class="question-label" id="questionLabel">Question 1</div>
      <div class="question-content" id="questionContent"></div>
    </section>
    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled><i class="fa-solid fa-chevron-left"></i> Prev</button>
      <div class="nav-progress" id="navProgress">1/4</div>
      <button id="nextBtn" disabled>Next <i class="fa-solid fa-chevron-right"></i></button>
    </nav>
  </main>

  <script>
    (() => {
      const questions = [
        {
          values: [3, 6, 9, 12, null, null, null, null],
          missing: [15, 18, 21, 24],
          jump: 3
        },
        {
          values: [6, 12, 18, 24, null, null, null, null],
          missing: [30, 36, 42, 48],
          jump: 6
        },
        {
          values: [11, 22, 33, 44, null, null, null, null],
          missing: [55, 66, 77, 88],
          jump: 11
        },
        {
          values: [7, 14, 21, 28, null, null, null, null],
          missing: [35, 42, 49, 56],
          jump: 7
        }
      ];

      const content = document.getElementById("questionContent");
      const questionLabel = document.getElementById("questionLabel");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const navProgress = document.getElementById("navProgress");

      let current = 0;
      let audioCtx = null;

      const state = questions.map(q => ({
        step: 0,
        completed: false
      }));

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);

        setTimeout(() => element.remove(), 1600);
      }

      function getOptions(correct, step, jump) {
        // Every step always contains the real answer plus two plausible
        // alternatives based on the current sequence value.
        const wrongOffsets = [
          [-1, 1],
          [-1, 2],
          [-1, 3],
          [-2, 1]
        ];
        const offsets = wrongOffsets[step % wrongOffsets.length];

        const options = [
          correct,
          correct + offsets[0],
          correct + offsets[1]
        ];

        // Keep all options positive and unique, then shuffle their positions.
        const unique = [...new Set(options.filter(n => n > 0))];
        while (unique.length < 3) {
          unique.push(correct + unique.length + 1);
        }

        return unique.sort(() => Math.random() - 0.5);
      }

      function renderQuestion(index) {
        const q = questions[index];
        const s = state[index];

        current = index;
        questionLabel.textContent = `Question ${index + 1}`;
        navProgress.textContent =
          `${String(index + 1)}/4`;

        content.innerHTML = "";

        const progress = document.createElement("div");
        progress.className = "progress-small";
        progress.textContent = s.completed
          ? "Pattern complete!"
          : "Complete the pattern";

        const pathWrap = document.createElement("div");
        pathWrap.className = "path-wrap";

        const path = document.createElement("div");
        path.className = "number-path";

        let missingCount = 0;

        q.values.forEach((value, indexInSequence) => {
          const node = document.createElement("div");

          if (value !== null) {
            node.className = "path-node given";
            node.textContent = value;
          } else {
            const answerIndex = missingCount;
            const answer = q.missing[answerIndex];

            node.className = "path-node missing";

            if (answerIndex < s.step || s.completed) {
              node.classList.add("correct");
              node.textContent = answer;
            } else {
              node.textContent = "?";
            }

            missingCount++;
          }

          path.appendChild(node);

          if (indexInSequence < q.values.length - 1) {
            const arrow = document.createElement("span");
            arrow.className = "arrow";
            arrow.textContent = "→";
            path.appendChild(arrow);
          }
        });

        pathWrap.appendChild(path);

        const questionPrompt = document.createElement("div");
        questionPrompt.className = "jump-title";

        const optionsWrap = document.createElement("div");
        optionsWrap.className = "jump-options";

        const hint = null; // No hint button by request.

        if (!s.completed) {
          questionPrompt.textContent = "What comes next?";

          const correct = q.missing[s.step];
          const options = getOptions(correct, s.step, q.jump);

          options.forEach(option => {
            const button = document.createElement("button");
            button.className = "jump-option";
            button.type = "button";
            button.textContent = option;

            button.addEventListener("click", () => {
              if (option !== correct) {
                sound.wrong();
                showEmoji("😔");

                button.classList.remove("wrong-choice");
                void button.offsetWidth;
                button.classList.add("wrong-choice");

                setTimeout(() => {
                  button.classList.remove("wrong-choice");
                }, 520);

                return;
              }

              button.classList.add("correct-choice");
              button.innerHTML = `<span>✓</span> ${option}`;
              button.disabled = true;

              sound.correct();
              showEmoji("🥳");
              burstConfetti(button);

              s.step++;

              setTimeout(() => {
                if (s.step >= q.missing.length) {
                  s.completed = true;
                  nextBtn.disabled = false;
                  renderQuestion(index);
                  if (index === questions.length - 1) {
                    setTimeout(finishQuiz, 650);
                  }
                } else {
                  renderQuestion(index);
                }
              }, 360);
            });

            optionsWrap.appendChild(button);
          });
        } else {
          questionPrompt.textContent = "";

          const completionBox = document.createElement("div");
          completionBox.className = "completion-box";

          const completionTitle = document.createElement("div");
          completionTitle.className = "completion-title";
          completionTitle.textContent = "🎉 Pattern Complete!";

          const completedText = document.createElement("div");
          completedText.className = "completion-sequence";
          completedText.textContent =
            q.values.map((v, i) => {
              if (v !== null) return v;
              const missingIndex =
                q.values.slice(0, i + 1).filter(x => x === null).length - 1;
              return q.missing[missingIndex];
            }).join(" → ");

          completionBox.append(completionTitle, completedText);
          content.append(progress, pathWrap, completionBox);

          prevBtn.disabled = index === 0;
          nextBtn.disabled = false;
          return;
        }

        content.append(
          progress,
          pathWrap,
          questionPrompt,
          optionsWrap
        );

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !s.completed;
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>You completed all the pattern!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i>
        Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          state.forEach((s, i) => {
            s.step = 0;
            s.completed = false;
          });

          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) {
          renderQuestion(current - 1);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (
          state[current].completed &&
          current < questions.length - 1
        ) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);
    })();
  </script>
