    .train {
      position: absolute;
      z-index: 4;
      left: 4%;
      right: 4%;
      top: 38%;
      height: 40%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px
    }

    .wagon {
      position: relative;
      width: 23%;
      height: 190px;
      background: linear-gradient(#2787ee, #1463ce);
      border: 7px solid #113f90;
      border-radius: 12px;
      box-shadow: 0 7px rgba(0, 0, 0, .2)
    }

    .wagon:before {
      content: "";
      position: absolute;
      left: -7px;
      right: -7px;
      top: -27px;
      height: 27px;
      background: #1472dc;
      border: 7px solid #113f90;
      border-bottom: 0;
      transform: skewX(35deg)
    }

    .content {
      position: absolute;
      inset: 20px 14px 28px;
      background: #fff8dc;
      border: 4px solid #ffb12b;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .num {
      font-size: 40px;
      font-weight: 600
    }

    .wheel {
      position: absolute;
      bottom: -54px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #20282b;
      border: 8px solid #080d0f;
      box-shadow: inset 0 0 0 8px #3e484b
    }

    .wheel:after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: #c77a18;
      border: 4px solid #71400d
    }

    .w1 {
      left: 8%
    }

    .w2 {
      right: 8%
    }

    .symbol {
      font-size: 58px;
      font-weight: 600;
      color: #030303;
      /* text-shadow: 2px 3px #214789; */
      margin: 0 4px 60px
    }

    .engine {
      position: relative;
      width: 25%;
      height: 210px;
      background: #ed3030;
      border: 7px solid #a91717;
      border-radius: 35px 35px 15px 15px
    }

    .cab {
      position: absolute;
      left: 25px;
      top: -75px;
      width: 110px;
      height: 100px;
      background: #ed3030;
      border: 7px solid #a91717;
      border-bottom: 0;
      border-radius: 18px
    }

    .window {
      position: absolute;
      inset: 20px;
      background: #6fe1ff;
      border: 5px solid #173d80;
      border-radius: 8px
    }

    .bigwheel {
      position: absolute;
      right: 5%;
      bottom: -65px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #20282b;
      border: 9px solid #080d0f;
      box-shadow: inset 0 0 0 12px #3e484b
    }

    .bigwheel:after {
      content: "";
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      background: #c77a18;
      border: 5px solid #71400d
    }

    .cat {
      position: absolute;
      right: 35px;
      top: -165px;
      width: 95px;
      height: 95px;
      background: #a878ef;
      border: 6px solid #4a267d;
      border-radius: 50%;
      z-index: 3
    }

    .eye {
      position: absolute;
      top: 15px;
      width: 22px;
      height: 28px;
      background: #111;
      border-radius: 50%
    }

    .e1 {
      left: 10px
    }

    .e2 {
      right: 10px
    }

    .nose {
      position: absolute;
      top: 45px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 20px;
      background: #70401c;
      border-radius: 50%
    }

    .smile {
      position: absolute;
      top: 60px;
      left: 50%;
      width: 28px;
      height: 17px;
      transform: translateX(-50%);
      border-bottom: 5px solid #392018;
      border-radius: 0 0 20px 20px
    }

    .answers {
      position: absolute;
      z-index: 15;
      bottom: 9%;
      left: 50%;
      transform: translateX(-50%);
      width: min(850px, 82vw);
      display: flex;
      gap: 30px;
      padding: 8px 18px;
      /* background: #fff5c9; */
      /* border: 6px solid #efb536; */
      border-radius: 30px;
      margin-bottom: 20px;
    }

    .answer {
      flex: 1;
      min-height: 75px;
      border: 5px solid #1676df;
      border-radius: 22px;
      background: linear-gradient(#72d9ff, #3199ef);
      color: #060606;
      font-size: 30px;
      font-weight: 600;
      /* text-shadow: 2px 3px #2362a0; */
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      /* box-shadow: 0 6px #10509d */
    }

    .answer.used {
      opacity: .3;
      pointer-events: none
    }

    .drop {
      width: 100%;
      height: 100%;
      border: 4px dashed #f0ae25;
      border-radius: 10px;
      background: #fffdf0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 600;
      color: #173b80
    }

    .drop.over {
      background: #fff0a8
    }

    .drop.correct {
      background: #b9f4c7;
      border: 5px solid #2aa84d;
      color: #167b37
    }

    .drop.wrong {
      animation: shake .3s;
      background: #ffd0d0;
      border-color: #e33
    }

    /* ================= REFERENCE PREV / NEXT NAV ================= */
    .nav {
      position: absolute;
      z-index: 20;
      bottom: 1%;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap:350px !important;
      padding: 0 20px;
    }

    .nav button {
      min-width: 150px;
      height: 55px;
      border: 0;
      border-radius: 999px;
      padding: 0 20px;
      background: #55b449;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    #prev,
    #next {
      background: #55b449;
      color: #fff;
    }

    @media(max-width:900px) {
      .nav { gap: 70px; }
      .nav button {
        min-width: 125px;
        height: 50px;
        font-size: 17px;
      }
    }

    @media(max-width:600px) {
      .nav {
        gap: 45px;
        padding: 0 12px;
      }

      .nav button {
        min-width: 100px;
        height: 44px;

        font-size: 14px;
      }

    @media(max-width:480px) {

        height: 40px;

      }
    }

    .popup {
      position: fixed;
      z-index: 100;
      inset: 0;
      background: #0005;
      display: none;

    }

    .popup.show {

    .card {
      background: #fff8df;

    /* Reference popup / feedback effects */
    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.35); }
      22% { opacity: 1; transform: translate(-50%, -50%) scale(1.18); }
      100% { opacity: 0; transform: translate(-50%, -75%) scale(.82); }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
      background: rgba(18,38,93,.10);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,.3);
      animation: popUp .4s cubic-bezier(.175,.885,.32,1.275);
    }

    @keyframes popUp {
      from { transform: scale(.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg,#ffb347,#f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245,138,46,.3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    @keyframes shake {
      25% {
        transform: translateX(-8px)
      }

      50% {
        transform: translateX(8px)
      }

      75% {
        transform: translateX(-5px)
      }
    }

    @media(max-width:900px) {
      .header {
        font-size: 19px;

      .wagon {
        height: 140px

      .num {

      .num {

      .cab {
        top: -45px;

      }

      .window {
        inset: 10px;

      }

      .bigwheel {
        width: 62px;
        height: 62px;
        border-width: 5px;

      }

      .cat {
        transform: scale(.45);

        right: 0
      }

      .answers {
        width: 95vw;
        bottom: 8%;

      }

      .answer {

      z-index: 4;
      left: 0;
      right: 0;
      top: 20%;
      height: 43%;

    }

    .train {
      position: absolute;
      left: 4%;
      right: 4%;
      top: 0;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px
    }

    .train:before {
      content: "";
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: 5px;
      height: 12px;
      background: #303030;
      border-radius: 8px;
      box-shadow: 0 18px #1d1d1d, 0 34px #9a602c, 0 44px #71441f;
      z-index: -2
    }

    .train:after {
      content: "";
      position: absolute;
      left: -6%;
      right: -6%;
      bottom: -5px;
      height: 7px;
      background: repeating-linear-gradient(90deg, #8a5428 0 40px, transparent 40px 68px);
      z-index: -1
    }

    .engine {
      overflow: visible;
      position: relative
    }

    .engine:before {
      content: "";
      position: absolute;
      right: -68px;
      bottom: 8px;
      width: 50px;
      height: 35px;
      background: #ed3030;
      border: 7px solid #a91717;
      border-left: 0;
      border-radius: 0 28px 18px 0;
      z-index: -1
    }

    .engine:after {
      content: "";
      position: absolute;
      right: -82px;
      bottom: 58px;
      width: 25px;
      height: 45px;
      background: #ffd32c;
      border: 5px solid #9a6412;
      border-radius: 50%
    }

    .chimney {
      position: absolute;
      left: 15px;
      top: -82px;
      width: 37px;
      height: 62px;
      background: #303030;
      border: 6px solid #171717;
      border-radius: 8px 8px 3px 3px
    }

    .chimney:before {
      content: "";
      position: absolute;
      left: -13px;
      top: -12px;
      width: 57px;
      height: 18px;
      background: #202020;
      border-radius: 12px
    }

    .smoke {
      position: absolute;
      left: 2px;
      top: -30px;
      width: 22px;
      height: 22px;
      background: #625959;
      border-radius: 50%;
      opacity: .75;
      animation: smokeUp 1.7s ease-out infinite
    }

    .smoke.s2 {
      left: 20px;
      top: -55px;
      animation-delay: .55s;
      transform: scale(.75)
    }

    .smoke.s3 {
      left: -15px;
      top: -78px;
      animation-delay: 1s;
      transform: scale(.55)
    }

    @keyframes smokeUp {
      0% {
        opacity: .75;
        transform: translate(0, 0) scale(.5)
      }

      60% {
        opacity: .45
      }

      100% {
        opacity: 0;
        transform: translate(20px, -50px) scale(1.2)
      }
    }

    .cabin-light {
      position: absolute;
      right: -4px;
      top: -80px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #ffd83b;
      border: 4px solid #9b6412
    }

    .cowcatcher {
      position: absolute;
      right: -67px;
      bottom: -2px;
      width: 73px;
      height: 38px;
      border-bottom: 8px solid #333;
      border-right: 8px solid #333;
      transform: skewX(-25deg)
    }

    .train-runner.go {
      animation: trainLeftToRight 3s cubic-bezier(.18, .7, .25, 1) forwards
    }

    @keyframes trainLeftToRight {
      0% {
        transform: translateX(0)
      }

      12% {
        transform: translateX(-4%)
      }

      100% {
        transform: translateX(125%)
      }
    }

    .train-runner.enter {
      animation: trainEnterFromLeft 3s cubic-bezier(.18, .7, .25, 1) forwards
    }

    @keyframes trainEnterFromLeft {
      0% {
        transform: translateX(-125%)
      }

      88% {
        transform: translateX(4%)
      }

      100% {
        transform: translateX(0)
      }
    }

    @media(max-width:600px) {
      .train-runner {
        top: 37%;
        height: 39%
      }

      .train {
        left: 1%;
        right: 1%
      }

      .chimney {
        top: -60px;
        transform: scale(.75);
        transform-origin: bottom left
      }

      .cowcatcher {
        right: -55px;
        transform: scale(.75) skewX(-25deg)
      }
    }


    /* Stationary railway: it never moves with the train */
    .stationary-road {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      top: calc(30% + 30%);
      height: 82px;
      pointer-events: none;
    }

    .rail {
      position: absolute;
      left: 0;
      right: 0;
      height: 8px;
      background: #454545;
      border: 2px solid #252525;
      box-shadow: 0 2px 0 rgba(255, 255, 255, .25);
    }

    .rail-top {
      top: 18px
    }

    .rail-bottom {
      top: 61px
    }

    .sleepers {
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      height: 68px;
      background: repeating-linear-gradient(90deg,
          transparent 0 20px,
          #8b5429 20px 55px,
          transparent 55px 78px);
      z-index: -1;
    }

    .train:before,
    .train:after {
      display: none !important;
    }

      <div class="train">
        <div class="wagon">
          <div class="content"><span class="num" id="a"></span></div>

          <div class="content"><span class="num" id="b"></span></div>
          <div class="wheel w1"></div>
          <div class="wheel w2"></div>
        </div>
        <div class="symbol">=</div>
        <div class="wagon">
          <div class="content">
            <div class="drop" id="drop">Drop Answer</div>
          </div>
          <div class="wheel w1"></div>
          <div class="wheel w2"></div>
        </div>
        <div class="engine">
          <div class="chimney"><span class="smoke"></span><span class="smoke s2"></span><span class="smoke s3"></span>
          </div>
          <div class="cabin-light"></div>
          <div class="cat"><span class="eye e1"></span><span class="eye e2"></span><span class="nose"></span><span
              class="smile"></span></div>
          <div class="cab">
            <div class="window"></div>
          </div>
          <div class="bigwheel"></div>
        </div>
      </div>
    </div>
    <div class="answers" id="answers"></div>
    <div class="nav" aria-label="Question navigation">
      <button id="prev" onclick="prevQuestion()">
        <i class="fa-solid fa-chevron-left"></i> Prev
      </button>
      <button id="next" onclick="nextQuestion()" disabled>
        Next <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
    <div class="popup" id="popup">
      <div class="card">
        <div class="emoji" id="emoji">🥳</div>
        <h2 id="title">Correct!</h2>
        <p id="msg">Great job!</p>
      </div>
    </div>
  </div>
  <script>
    const Q = [
      { a: 17, b: 100, c: "1700", o: ["1200", "1500", "1700"] },
      { a: 680, b: 10, c: "6800", o: ["6800", "680", "8600"] },
      { a: 99, b: 100, c: "9900", o: ["9900", "9090", "9000"] },
      { a: 64, b: 20, c: "1280", o: ["1240", "1280", "1380"] },
      { a: 41, b: 30, c: "1230", o: ["1203", "1230", "1320"] }
    ];
    let i = 0, done = Array(Q.length).fill(false), drag = null, visited = Array(Q.length).fill(false);
    let animating = false;
    const $ = id => document.getElementById(id);
    function render() {
      visited[i] = true;
      let q = Q[i]; $("a").textContent = q.a; $("b").textContent = q.b;
      $("drop").textContent = done[i] ? q.c : "Drop Answer"; $("drop").className = done[i] ? "drop correct" : "drop";
      $("answers").innerHTML = "";
      q.o.forEach(v => {
        let x = document.createElement("div"); x.className = "answer"; x.textContent = v; x.draggable = !done[i];
        if (done[i] && v === q.c) x.classList.add("used");
        x.onclick = () => answer(v);
        x.ondragstart = e => { drag = v; e.dataTransfer.setData("text/plain", v) };
        $("answers").appendChild(x);
      });
      $("drop").ondragover = e => { e.preventDefault(); if (!done[i]) $("drop").classList.add("over") };
      $("drop").ondragleave = () => $("drop").classList.remove("over");
      $("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("over"); answer(e.dataTransfer.getData("text/plain") || drag) };
      $("prev").disabled = i === 0 || animating;
      $("next").disabled = !done[i] || animating;
    }
    let audioCtx = null;

    function getCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function beep(frequency, duration, type = "sine") {
      try {
        const ctx = getCtx();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.type = type;
        oscillator.frequency.value = frequency;
        oscillator.connect(gain);
        gain.connect(ctx.destination);

        gain.gain.setValueAtTime(.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          .0001,
          ctx.currentTime + duration / 1000
        );

        oscillator.start();
        oscillator.stop(ctx.currentTime + duration / 1000);
      } catch (e) {}
    }

    const sound = {
      correct() {
        beep(660, 110);
        setTimeout(() => beep(880, 160), 110);
      },
      wrong() {
        beep(180, 220, "sawtooth");
      },
      finish() {
        [523, 659, 784, 1047].forEach((frequency, index) => {
          setTimeout(() => beep(frequency, 150), index * 130);
        });
      }
    };

    function burstConfetti(element) {
      const rect = element.getBoundingClientRect();

      if (typeof confetti === "function") {
        confetti({
          particleCount: 34,
          spread: 70,
          startVelocity: 22,
          origin: {
            x: (rect.left + rect.width / 2) / innerWidth,
            y: (rect.top + rect.height / 2) / innerHeight
          },
          colors: [
            "#6635dc", "#ff4e83", "#4e8ff0",
            "#76b93b", "#f4ae25", "#4ecdc4"
          ]
        });
      }
    }

    function showEmoji(emoji) {
      const element = document.createElement("div");
      element.className = "emoji-pop";
      element.textContent = emoji;
      document.body.appendChild(element);
      setTimeout(() => element.remove(), 1600);
    }

    function answer(v) {
      if (done[i] || !v) return;

      if (v === Q[i].c) {
        done[i] = true;
        render();

        sound.correct();
        showEmoji("🥳");

      } else {
        sound.wrong();
        showEmoji("😔");
        $("drop").classList.add("wrong");
        setTimeout(() => {
          $("drop").classList.remove("wrong");
        }, 350);
      }
    }

    function finishQuiz() {
      sound.finish();
      showFinalPopup();
    }

    function showFinalPopup() {
      if (document.querySelector(".final-overlay")) return;

      const overlay = document.createElement("div");
      const modal = document.createElement("div");

      overlay.className = "final-overlay";
      modal.className = "final-modal";

      modal.innerHTML = `
        <span class="icon-big">🎉</span>
        <h2>All Done!</h2>
        <p>Amazing! You got them all right!</p>
        <button class="btn-playagain">
          <i class="fa-solid fa-rotate-right"></i>
          Play again
        </button>
      `;

      overlay.appendChild(modal);
      document.body.appendChild(overlay);

      setTimeout(() => burstConfetti(modal), 80);
      setTimeout(() => burstConfetti(modal), 350);
      setTimeout(() => burstConfetti(modal), 650);

      modal.querySelector(".btn-playagain").addEventListener("click", () => {
        overlay.remove();

        i = 0;
        done = Array(Q.length).fill(false);
        drag = null;
        visited = Array(Q.length).fill(false);
        animating = false;

        render();
      });
    }

    function finalWin() {
      sound.finish();
      showFinalPopup();
    }

    function runTrainThen(cb) {
      animating = true;
      $("prev").disabled = true;
      $("next").disabled = true;

      const runner = document.getElementById("trainRunner");

      // 1) Exit to the right (same as before)
      runner.classList.remove("go", "enter");
      runner.style.transform = "";
      void runner.offsetWidth;
      runner.classList.add("go");

      setTimeout(() => {
        runner.classList.remove("go");

        // 2) Snap it, unseen, off-screen to the left
        runner.style.transform = "translateX(-125%)";
        void runner.offsetWidth;

        // 3) Load the next question while it's off-screen
        cb();

        // 4) Slide it back in from the left, mirroring the exit
        runner.classList.add("enter");

        setTimeout(() => {
          runner.classList.remove("enter");
          runner.style.transform = "";
          animating = false;
          $("prev").disabled = i === 0;
          $("next").disabled = !done[i];
        }, 3000);
      }, 1300);
    }

    function nextQuestion() {
      if (!done[i] || animating) return;

      const alreadyVisitedNext = i < Q.length - 1 && visited[i + 1];

      if (alreadyVisitedNext) {
        // We've been to this question before (via prev) - jump straight
        // there without sliding, same as prevQuestion does.
        i++;
        render();
        return;
      }

      runTrainThen(() => {
        if (i < Q.length - 1) {
          i++;
          render();
        } else {
          finalWin();
        }
      });
    }
    function prevQuestion() {
      if (i > 0 && !animating) {
        i--;
        render();
      }
    }
    render();
  </script>
<script src="../../shared/quiz-ui.js"></script>
</body>

</html>
