<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find the Product Using the Number Line</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px 20px;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ================= HEADER ================= */

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0;
    }

    .header h1 {
      color: #12265d;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* ================= QUESTION ================= */

    .question-screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0;
    }

    .question-label {
      color: #12265d;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-line {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ================= EQUATION ================= */

    .equation {
      color: #12265d;
      font-size: 34px;
      font-weight: 800;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .answer-box {
      width: 92px;
      height: 52px;
      border: 3px solid #5b63e6;
      border-radius: 16px;
      outline: none;
      background: linear-gradient(180deg, #ffffff 0%, #eef0ff 100%);
      color: #12265d;
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      box-shadow: 0 4px 0 #4148b8, 0 8px 16px rgba(91, 99, 230, .22);
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
      cursor: default;
    }

    /* Wrong answer: red blink on the answer box (same as reference) */
    .answer-box.wrong-shake {
      animation: wrongBlink .5s ease;
    }

    @keyframes wrongBlink {
      0% {
        background: linear-gradient(180deg, #ffffff 0%, #eef0ff 100%);
        border-color: #5b63e6;
        box-shadow: 0 4px 0 #4148b8, 0 8px 16px rgba(91, 99, 230, .22);
      }

      25% {
        background: linear-gradient(180deg, #fff0f0 0%, #ffd7d7 100%);
        border-color: #e0483f;
        box-shadow: 0 4px 0 #b23830, 0 8px 16px rgba(224, 72, 63, .28);
      }

      50% {
        background: linear-gradient(180deg, #ffffff 0%, #eef0ff 100%);
        border-color: #5b63e6;
        box-shadow: 0 4px 0 #4148b8, 0 8px 16px rgba(91, 99, 230, .22);
      }

      75% {
        background: linear-gradient(180deg, #fff0f0 0%, #ffd7d7 100%);
        border-color: #e0483f;
        box-shadow: 0 4px 0 #b23830, 0 8px 16px rgba(224, 72, 63, .28);
      }

      100% {
        background: linear-gradient(180deg, #ffffff 0%, #eef0ff 100%);
        border-color: #5b63e6;
        box-shadow: 0 4px 0 #4148b8, 0 8px 16px rgba(91, 99, 230, .22);
      }
    }

    /* Correct answer: green border, locked (same as reference) */
    .answer-box.correct-locked {
      border-color: #55b449;
      background: linear-gradient(180deg, #ffffff 0%, #eafbe8 100%);
      box-shadow: 0 4px 0 #3d9634, 0 0 0 4px rgba(85, 180, 73, .16);
      cursor: default;
    }

    /* ================= NUMBER LINE ================= */

    .number-line-wrap {
      width: 100%;
      max-width: 1120px;
      margin-top: 34px;
      position: relative;
      padding: 44px 40px 56px;
      overflow-x: auto;
    }

    .number-line-track {
      position: relative;
      min-width: 640px;
    }

    .number-line {
      position: relative;
      width: 100%;
      height: 4px;
      background: #12265d;
      border-radius: 10px;
    }

    .number-line::before,
    .number-line::after {
      content: "";
      position: absolute;
      top: -5px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
    }

    .number-line::before {
      left: -2px;
      border-right: 12px solid #12265d;
    }

    .number-line::after {
      right: -2px;
      border-left: 12px solid #12265d;
    }

    .tick-row {
      position: absolute;
      left: 0;
      right: 0;
      top: -12px;
      height: 35px;
      display: flex;
      justify-content: space-between;
    }

    .tick {
      position: relative;
      width: 1px;
      height: 22px;
      background: #ff5c8a;
    }

    .tick::after {
      content: attr(data-number);
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: #12265d;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .tick.landmark {
      background: #5b63e6;
      height: 27px;
      top: -3px;
    }

    .tick.reached {
      background: #00b894;
    }

    .position-marker {
      position: absolute;
      top: 50%;
      left: 0;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      transition: left .45s cubic-bezier(.22, 1, .36, 1);
      z-index: 5;
      pointer-events: none;
    }

    /* expanding pulse ring that also cycles color, right on the scale point */
    .marker-ring {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid #5b63e6;
      animation: markerPing 1.8s ease-out infinite, markerColorCycle 3s linear infinite;
    }

    /* solid core dot that changes color and gently bounces */
    .marker-dot {
      position: relative;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .28);
      background: #5b63e6;
      animation: markerColorCycle 3s linear infinite, markerBounce 1s ease-in-out infinite;
    }

    @keyframes markerPing {
      0% {
        transform: scale(.55);
        opacity: .9;
      }

      70% {
        transform: scale(1.7);
        opacity: 0;
      }

      100% {
        transform: scale(1.7);
        opacity: 0;
      }
    }

    @keyframes markerColorCycle {

      0%,
      100% {
        border-color: #5b63e6;
        background: #5b63e6;
      }

      33% {
        border-color: #ff6b9a;
        background: #ff6b9a;
      }

      66% {
        border-color: #f39c12;
        background: #f39c12;
      }
    }

    @keyframes markerBounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    /* success state: settle on green and pop once */
    .position-marker.correct .marker-ring {
      animation: none;
      border-color: #55b449;
      opacity: .55;
    }

    .position-marker.correct .marker-dot {
      animation: markerSuccess .55s ease;
      background: #55b449;
      border-color: #fff;
    }

    @keyframes markerSuccess {
      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.5);
      }

      100% {
        transform: scale(1);
      }
    }

    /* ================= JUMP / CHECK BUTTONS ================= */

    .check-btn-row {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .jump-btn,
    .check-btn {
      border: 0;
      width: 150px;
      height: 53px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 999px;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .jump-btn {
      background: #5b63e6;
      box-shadow: 0 5px 0 #4148b8;
    }

    .check-btn {
      background: #e0b453;
      font-size: 22px;
      box-shadow: 0 5px 0 #e9b23d;
    }

    .jump-btn:hover:not(:disabled),
    .check-btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .jump-btn:active:not(:disabled),
    .check-btn:active:not(:disabled) {
      transform: translateY(2px);
    }

    .jump-btn:disabled,
    .check-btn:disabled {
      opacity: .45;
      cursor: default;
    }

    .hidden {
      display: none !important;
    }

    /* ================= NAV (prev / progress / next) ================= */

    .nav {
      width: 100%;
      margin: 25px auto 0;
      padding-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      position: relative;
      z-index: 20;
    }

    .nav-progress {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    #prevBtn {
      justify-self: start;
    }

    #nextBtn {
      justify-self: end;
    }

    /* ================= SAME EMOJI / POPUP ================= */

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
      background: rgba(18, 38, 93, .10);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: translateY(2px);
    }

    /* =====================================================
     SAME RESPONSIVE BREAKPOINT DIMENSIONS AS REFERENCE
  ===================================================== */

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {

      .header h1 {

      }

      .question-label {

      .equation {
        font-size: 38px;

      .answer-box {

    @media screen and (min-width: 1441px) and (max-width: 1920px) {

      .header h1 {

      }

      .question-label {

      }

      .answer-box {

      }

      .jump-btn,

      }

      }
    }

    @media screen and (min-width: 1921px) {
      .quiz-wrap {
        max-width: 1750px;
      }

      .header {
        padding-top: 20px;
      }

      .header h1 {

      }

      .question-label {
        font-size: 30px;

      }

      }

      }

      }

      }

        border-radius: 9px;

      }

        padding: 30px 4px 40px;

      }

      .tick::after {
        font-size: 9px;

      }

    @media (prefers-reduced-motion: reduce) {

<body>
  <main class="quiz-wrap">

    <header class="header">
      <h1>Find the Product Using the Number Line</h1>
    </header>

    <section class="question-screen">
      <div class="question-label" id="questionLabel">Question 1</div>
      <div class="question-content" id="questionContent"></div>
    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i>
        Prev
      </button>

      <div class="nav-progress" id="navProgress">1 / 4</div>

      <button id="nextBtn" disabled>
        Next
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {

      /*
        Questions match the worksheet template:
        1) 4 x 3   -> number line 0-20
        2) 10 x 2  -> number line 0-20
        3) 7 x 4   -> number line 0-30
        4) 9 x 3   -> number line 0-30
      */
      const questions = [
        { a: 4, b: 3, max: 20 },
        { a: 10, b: 2, max: 30 },
        { a: 7, b: 4, max: 30 },
        { a: 9, b: 3, max: 30 }
      ];

      const content = document.getElementById("questionContent");
      const questionLabel = document.getElementById("questionLabel");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const navProgress = document.getElementById("navProgress");

      let current = 0;
      let audioCtx = null;

      // per-question state
      const state = questions.map(() => ({
        jumps: 0,          // number of jumps taken
        position: 0,       // current rocket position
        completed: false   // question answered correctly
      }));

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);
        setTimeout(() => element.remove(), 1600);
      }

      function updateProgress() {
        navProgress.textContent = `${current + 1} / ${questions.length}`;
      }

      function renderQuestion(index) {
        const q = questions[index];
        const s = state[index];
        current = index;

        questionLabel.textContent = `Question ${index + 1}`;
        updateProgress();

        content.innerHTML = "";

        const game = document.createElement("div");
        game.className = "game-line";

        // ---- Equation ----
        const equation = document.createElement("div");
        equation.className = "equation";
        equation.innerHTML = `
      <span>${q.a} &times; ${q.b} =</span>
      <input class="answer-box" id="answerBox" type="text" readonly
             value="${s.jumps > 0 ? s.position : ""}" placeholder="?" aria-label="Product">
    `;

        // ---- Number line ----
        const lineWrap = document.createElement("div");
        lineWrap.className = "number-line-wrap";

        const track = document.createElement("div");
        track.className = "number-line-track";

        const line = document.createElement("div");
        line.className = "number-line";

        const ticks = document.createElement("div");
        ticks.className = "tick-row";

        for (let n = 0; n <= q.max; n++) {
          const tick = document.createElement("span");
          tick.className = "tick";
          if (n % q.a === 0) tick.classList.add("landmark");
          if (n <= s.position) tick.classList.add("reached");
          tick.dataset.number = n;
          ticks.appendChild(tick);
        }

        const rocket = document.createElement("div");
        rocket.className = "position-marker";
        rocket.id = "rocketMarker";
        rocket.innerHTML = '<span class="marker-ring"></span><span class="marker-dot"></span>';
        rocket.style.left = `${(s.position / q.max) * 100}%`;

        line.appendChild(ticks);
        track.append(line, rocket);
        lineWrap.appendChild(track);

        // ---- Jump / Check buttons ----
        const btnRow = document.createElement("div");
        btnRow.className = "check-btn-row";

        const jumpBtn = document.createElement("button");
        jumpBtn.className = "jump-btn";
        jumpBtn.type = "button";
        jumpBtn.id = "jumpBtn";
        jumpBtn.textContent = `JUMP +${q.a}`;

        const checkBtn = document.createElement("button");
        checkBtn.className = "check-btn";
        checkBtn.type = "button";
        checkBtn.id = "checkBtn";
        checkBtn.textContent = "Check";
        checkBtn.disabled = true; // enabled only after at least one jump

        btnRow.append(jumpBtn, checkBtn);

        game.append(equation, lineWrap, btnRow);
        content.appendChild(game);

        const answerBox = document.getElementById("answerBox");

        // lock everything if this question is already completed
        if (s.completed) {
          answerBox.value = q.a * q.b;
          answerBox.classList.add("correct-locked");
          rocket.classList.add("correct");
          jumpBtn.disabled = true;
          checkBtn.disabled = true;
        } else {
          // cap jumps so the rocket can't fly off the line
          const maxJumps = Math.floor(q.max / q.a);
          if (s.jumps >= maxJumps) jumpBtn.disabled = true;

          jumpBtn.addEventListener("click", () => handleJump(q, s));
          checkBtn.addEventListener("click", () => handleCheck(q, s));
        }

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !s.completed;
      }

      function handleJump(q, s) {
        s.jumps++;
        s.position = s.jumps * q.a;

        const answerBox = document.getElementById("answerBox");
        const rocket = document.getElementById("rocketMarker");
        const jumpBtn = document.getElementById("jumpBtn");
        const checkBtn = document.getElementById("checkBtn");

        if (answerBox) answerBox.value = s.position;

        if (rocket) {
          rocket.style.left = `${(s.position / q.max) * 100}%`;
        }

        document.querySelectorAll(".tick").forEach((tick) => {
          const n = Number(tick.dataset.number);
          tick.classList.toggle("reached", n <= s.position);
        });

        // one jump is enough to enable checking the answer
        checkBtn.disabled = false;

        // stop jumping once the rocket would fly off the line
        const maxJumps = Math.floor(q.max / q.a);
        if (s.jumps >= maxJumps) jumpBtn.disabled = true;
      }

      function handleCheck(q, s) {
        const answerBox = document.getElementById("answerBox");
        const rocket = document.getElementById("rocketMarker");
        const jumpBtn = document.getElementById("jumpBtn");
        const checkBtn = document.getElementById("checkBtn");

        const correctAnswer = q.a * q.b;
        const isCorrect = s.position === correctAnswer;

        if (!isCorrect) {
          sound.wrong();
          showEmoji("😔");

          answerBox.classList.remove("wrong-shake");
          void answerBox.offsetWidth; // restart animation if fired twice in a row
          answerBox.classList.add("wrong-shake");
          answerBox.addEventListener("animationend", () => {
            answerBox.classList.remove("wrong-shake");
          }, { once: true });

          // wrong: send them back to the start of the number line to try again
          s.jumps = 0;
          s.position = 0;

          answerBox.value = "";

          if (rocket) rocket.style.left = "0%";

          document.querySelectorAll(".tick").forEach((tick) => {
            tick.classList.toggle("reached", Number(tick.dataset.number) === 0);
          });

          // Check stays disabled until the user jumps again from the start
          checkBtn.disabled = true;
          jumpBtn.disabled = false;

          return;
        }

        s.completed = true;

        sound.correct();
        showEmoji("🥳");
        burstConfetti(answerBox);

        answerBox.classList.add("correct-locked");
        if (rocket) rocket.classList.add("correct");

        jumpBtn.disabled = true;
        checkBtn.disabled = true;
        nextBtn.disabled = false;

        if (current === questions.length - 1) {
          setTimeout(finishQuiz, 650);
        }
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i>
        Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          state.forEach(s => {
            s.jumps = 0;
            s.position = 0;
            s.completed = false;
          });

          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) renderQuestion(current - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (state[current].completed && current < questions.length - 1) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);

    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
