<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find the Product Using the Number Line</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
  <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
  <script src="../assets/shared/quiz-ui.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
      font-weight: 400;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px 20px;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ================= HEADER ================= */

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0;
    }

    .header h1 {
      color: #12265d;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* ================= QUESTION ================= */

    .question-screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0;
    }

    .question-label {
      color: #12265d;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .game-line {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* ================= EQUATION ================= */

    .equation {
      color: #12265d;
      font-size: 34px;
      font-weight: 800;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .answer-box {
      width: 92px;
      height: 52px;
      border: 3px solid #5b63e6;
      border-radius: 16px;
      outline: none;
      background: linear-gradient(180deg, #ffffff 0%, #eef0ff 100%);
      color: #12265d;
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      box-shadow: 0 4px 0 #4148b8, 0 8px 16px rgba(91, 99, 230, .22);
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
      cursor: default;
    }

    .answer-box.wrong-shake {
      animation: wrongBlink .5s ease;
    }

    @keyframes wrongBlink {
      0% {
        background: linear-gradient(180deg, #ffffff 0%, #eef0ff 100%);
        border-color: #5b63e6;
        box-shadow: 0 4px 0 #4148b8, 0 8px 16px rgba(91, 99, 230, .22);
      }

      25% {
        background: linear-gradient(180deg, #fff0f0 0%, #ffd7d7 100%);
        border-color: #e0483f;
        box-shadow: 0 4px 0 #b23830, 0 8px 16px rgba(224, 72, 63, .28);
      }

      50% {
        background: linear-gradient(180deg, #ffffff 0%, #eef0ff 100%);
        border-color: #5b63e6;
        box-shadow: 0 4px 0 #4148b8, 0 8px 16px rgba(91, 99, 230, .22);
      }

      75% {
        background: linear-gradient(180deg, #fff0f0 0%, #ffd7d7 100%);
        border-color: #e0483f;
        box-shadow: 0 4px 0 #b23830, 0 8px 16px rgba(224, 72, 63, .28);
      }

      100% {
        background: linear-gradient(180deg, #ffffff 0%, #eef0ff 100%);
        border-color: #5b63e6;
        box-shadow: 0 4px 0 #4148b8, 0 8px 16px rgba(91, 99, 230, .22);
      }
    }

    .answer-box.correct-locked {
      border-color: #55b449;
      background: linear-gradient(180deg, #ffffff 0%, #eafbe8 100%);
      box-shadow: 0 4px 0 #3d9634, 0 0 0 4px rgba(85, 180, 73, .16);
      cursor: default;
    }

    /* ================= HINT LINE ================= */

    .hint-line {
      color: #2f4f4f;
      font-size: 18px;
      font-weight: 700;
      margin-top: 10px;
      text-align: center;
      opacity: .85;
      position: absolute;
      bottom: -15%;
    }

    /* ================= NUMBER LINE ================= */

    .number-line-wrap {
      width: 100%;
      max-width: 1120px;
      position: relative;
      padding: 92px 40px 62px;
      /* overflow-x: ove;
      overflow-y: auto; */
    }

    .number-line-track {
      position: relative;
      min-width: 640px;
    }

    .number-line {
      position: relative;
      width: 100%;
      height: 4px;
      background: #12265d;
      border-radius: 10px;
    }

    .number-line::before,
    .number-line::after {
      content: "";
      position: absolute;
      top: -5px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
    }

    .number-line::before {
      left: -2px;
      border-right: 12px solid #12265d;
    }

    .number-line::after {
      right: -2px;
      border-left: 12px solid #12265d;
    }

    .tick-row {
      position: absolute;
      left: 0;
      right: 0;
      top: -12px;
      height: 22px;
      display: flex;
      justify-content: space-between;
    }

    .tick {
      position: relative;
      width: 1px;
      height: 22px;
      background: #ff5c8a;
    }

    .tick.landmark {
      background: #5b63e6;
      height: 27px;
      top: -3px;
    }

    .tick.reached {
      background: #00b894;
    }

    /* ---- number buttons row (replaces plain tick labels) ---- */
    .number-btn-row {
      position: absolute;
      left: 0;
      right: 0;
      top: 22px;
      height: 44px;
    }

    .number-btn {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      min-width: 30px;
      height: 30px;
      padding: 0 4px;
      border-radius: 10px;
      border: 2px solid #c9cdf5;
      background: #ffffff;
      color: #12265d;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 #c9cdf5;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease, opacity .2s ease;
    }

    .number-btn.landmark-num {
      border-color: #b9bdff;
      background: #eef0ff;
      color: #4148b8;
    }

    .number-btn:hover:not(:disabled) {
      transform: translateX(-50%) translateY(-3px);
    }

    .number-btn:active:not(:disabled) {
      transform: translateX(-50%) translateY(1px);
      box-shadow: 0 1px 0 #c9cdf5;
    }

    .number-btn:disabled {
      cursor: default;
    }

    .number-btn.btn-disabled-dim:disabled {
      opacity: .4;
    }

    .number-btn.btn-correct {
      background: #55b449 !important;
      border-color: #3d9634 !important;
      color: #fff !important;
      box-shadow: 0 3px 0 #3d9634 !important;
      opacity: 1 !important;
    }

    .number-btn.btn-wrong {
      animation: numWrongShake .45s ease;
      background: #e0483f !important;
      border-color: #b23830 !important;
      color: #fff !important;
      box-shadow: 0 3px 0 #b23830 !important;
    }

    @keyframes numWrongShake {

      0%,
      100% {
        transform: translateX(-50%) rotate(0deg);
      }

      20% {
        transform: translateX(-50%) translateX(-4px) rotate(-6deg);
      }

      40% {
        transform: translateX(-50%) translateX(4px) rotate(6deg);
      }

      60% {
        transform: translateX(-50%) translateX(-4px) rotate(-4deg);
      }

      80% {
        transform: translateX(-50%) translateX(4px) rotate(4deg);
      }
    }

    /* ================= CARTOON FROG (pure SVG + CSS, no emoji/images) ================= */

    .frog-shadow {
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 40px;
      height: 10px;
      border-radius: 50%;
      background: rgba(18, 38, 93, .18);
      transform: translate(-50%, 0);
      transition: left .46s cubic-bezier(.45, 0, .2, 1), width .18s ease, opacity .18s ease;
      z-index: 4;
      filter: blur(1px);
    }

    .frog-marker {
      position: absolute;
      bottom: 4px;
      left: 0;
      width: 76px;
      height: 76px;
      transform: translate(-50%, 0);
      transition: left .46s cubic-bezier(.45, 0, .2, 1);
      z-index: 6;
      pointer-events: none;
    }

    .frog-svg-wrap {
      width: 100%;
      height: 100%;
      transform-origin: 50% 100%;
      animation: frogBreathe 1.7s ease-in-out infinite;
      filter: drop-shadow(0 4px 3px rgba(18, 38, 93, .3));
    }

    .frog-svg-wrap svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    @keyframes frogBreathe {

      0%,
      100% {
        transform: translateY(0) scaleX(1) scaleY(1);
      }

      50% {
        transform: translateY(-2px) scaleX(1.015) scaleY(.985);
      }
    }

    /* blinking eyes */
    .frog-eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: frogBlink 4.2s ease-in-out infinite;
    }

    .frog-eye.eye-r {
      animation-delay: .04s;
    }

    @keyframes frogBlink {

      0%,
      88%,
      100% {
        transform: scaleY(1);
      }

      92% {
        transform: scaleY(.12);
      }
    }

    /* gentle idle arm sway */
    .frog-arm {
      transform-box: fill-box;
      transform-origin: top center;
      animation: armSway 2.4s ease-in-out infinite;
    }

    .frog-arm.arm-r {
      animation-delay: .3s;
    }

    @keyframes armSway {

      0%,
      100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(4deg);
      }
    }

    /* ---- forward hop: smooth single arc, gentle squash & stretch ---- */
    .frog-marker.hop-fwd .frog-svg-wrap {
      animation: frogHopArc .46s cubic-bezier(.45, 0, .2, 1);
    }

    @keyframes frogHopArc {
      0% {
        transform: translateY(0) scaleX(1) scaleY(1);
      }

      22% {
        transform: translateY(3px) scaleX(1.1) scaleY(.9);
      }

      55% {
        transform: translateY(-40px) scaleX(.96) scaleY(1.06);
      }

      85% {
        transform: translateY(2px) scaleX(1.08) scaleY(.93);
      }

      100% {
        transform: translateY(0) scaleX(1) scaleY(1);
      }
    }

    .frog-marker.hop-fwd .frog-legs {
      animation: legKickFwd .46s cubic-bezier(.45, 0, .2, 1);
    }

    @keyframes legKickFwd {
      0% {
        transform: scaleY(1);
      }

      22% {
        transform: scaleY(.85);
      }

      55% {
        transform: scaleY(1.08);
      }

      85% {
        transform: scaleY(.92);
      }

      100% {
        transform: scaleY(1);
      }
    }

    .frog-marker.hop-fwd .frog-arm {
      animation: armSwingFwd .46s ease !important;
    }

    @keyframes armSwingFwd {
      0% {
        transform: rotate(0deg);
      }

      45% {
        transform: rotate(-18deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    /* ---- wrong answer: shake in place, no jump ---- */
    .frog-marker.shake-wrong .frog-svg-wrap {
      animation: frogShakeWrong .5s ease;
      transform-origin: 50% 100%;
    }

    @keyframes frogShakeWrong {

      0%,
      100% {
        transform: rotate(0deg) translateX(0);
      }

      15% {
        transform: rotate(-8deg) translateX(-3px);
      }

      30% {
        transform: rotate(7deg) translateX(3px);
      }

      45% {
        transform: rotate(-6deg) translateX(-2px);
      }

      60% {
        transform: rotate(5deg) translateX(2px);
      }

      75% {
        transform: rotate(-3deg) translateX(-1px);
      }

      90% {
        transform: rotate(2deg) translateX(1px);
      }
    }

    /* sad face */
    .frog-marker.mood-sad .frog-eye {
      animation: none;
      transform: scaleY(.55);
    }

    .frog-marker.mood-sad .frog-brow {
      opacity: 1;
    }

    .frog-brow {
      opacity: 0;
      transition: opacity .15s ease;
    }

    /* happy / celebrate face + raised arms */
    .frog-marker.correct .frog-svg-wrap {
      animation: frogCelebrate .65s ease;
    }

    @keyframes frogCelebrate {
      0% {
        transform: translateY(0) rotate(0deg);
      }

      25% {
        transform: translateY(-22px) rotate(-8deg);
      }

      50% {
        transform: translateY(0) rotate(6deg);
      }

      75% {
        transform: translateY(-11px) rotate(-4deg);
      }

      100% {
        transform: translateY(0) rotate(0deg);
      }
    }

    .frog-marker.correct .frog-arm {
      animation: none !important;
      transform: rotate(-95deg);
    }

    .frog-marker.correct .frog-arm.arm-r {
      transform: rotate(95deg);
    }

    .frog-marker.correct .frog-cheek {
      opacity: 1;
    }

    .frog-cheek {
      opacity: .55;
    }

    .hidden {
      display: none !important;
    }

    /* ================= NAV (prev / progress / next) ================= */

    .nav {
      width: 100%;
      margin: 30px auto 0 !important;
      padding-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      position: relative;
      z-index: 20;
    }

    .nav-progress {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
      display: none;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    #prevBtn {
      justify-self: start;
    }

    #nextBtn {
      justify-self: end;
    }

    /* ================= SAME EMOJI / POPUP ================= */

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
      background: rgba(18, 38, 93, .10);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .final-modal .btn-playagain:active {
      transform: translateY(2px);
    }

    /* =====================================================
     SAME RESPONSIVE BREAKPOINT DIMENSIONS AS REFERENCE
  ===================================================== */

    @media screen and (min-width: 1025px) and (max-width: 1600px) {
      .quiz-wrap {
        max-width: 1380px;
      }

      .header h1 {
        font-size: 35px;
      }

      .question-label {
        font-size: 24px;
      }

      .equation {
        font-size: 40px;
      }

      .answer-box {
        width: 104px;
        height: 58px;
        font-size: 40px;
      }

      .nav {
        gap: 150px;
        margin: 80px auto 0 !important;
      }

      .nav button {
        width: 150px;
        min-width: 150px;
        height: 55px;
        padding: 0;
        font-size: 20px;
      }
    }

    @media screen and (min-width: 1601px) and (max-width: 1920px) {

      body {
        padding: 24px 30px;
      }

      .quiz-wrap {
        width: min(97vw, 1840px);
        max-width: 1840px;
      }

      .header {
        padding-top: clamp(18px, 1.5vw, 28px);
        padding-bottom: clamp(14px, 1vw, 22px);
      }

      .question-screen {
        width: 100%;
        padding-top: 10px;
        gap: 10px;
      }

      .question-content {
        width: min(96vw, 1700px);
        max-width: 1700px;
      }

      .question-label {
        margin-bottom: clamp(20px, 1.5vw, 32px);
      }

      .equation {
        gap: clamp(14px, 1vw, 22px);
        font-size: 55px;
      }

      .answer-box {
        width: clamp(200px, 14vw, 250px);
        height: clamp(100px, 8vw, 140px);
        font-size: 50px;
      }

      .number-line-wrap {
        width: min(96vw, 1650px);
        max-width: 1650px;
        margin-top: 80px;
      }

      .number-line-track {
        width: 100%;
        min-width: 0;
      }

      .number-line {
        height: clamp(5px, .35vw, 7px);
      }

      .number-line::before,
      .number-line::after {
        border-top-width: clamp(8px, .5vw, 11px);
        border-bottom-width: clamp(8px, .5vw, 11px);
      }

      .tick {
        width: clamp(2px, .12vw, 3px);
        height: clamp(25px, 1.8vw, 34px);
      }

      .tick.landmark {
        height: clamp(30px, 2vw, 40px);
      }

      .number-btn {
        min-width: clamp(32px, 2.4vw, 42px);
        height: clamp(32px, 2.4vw, 42px);
        font-size: clamp(14px, 1vw, 17px);
      }

      .frog-marker {
        width: clamp(84px, 5.5vw, 106px);
        height: clamp(84px, 5.5vw, 106px);
      }

      .nav {
        width: min(90%, 1500px);
        margin-top: clamp(122px, 9vw, 156px) !important;
        padding-top: clamp(22px, 1.5vw, 34px) !important;
        gap: clamp(180px, 13vw, 320px);
      }

      .nav button {
        width: clamp(165px, 10vw, 220px);
        min-width: clamp(165px, 10vw, 220px);
        height: clamp(60px, 4vw, 76px);
        padding: 0;
      }
    }

    @media screen and (min-width: 1921px) {

      .question-screen {
        width: 100%;
        padding-top: 10px;
        gap: 10px;
      }

      .question-content {
        width: min(96vw, 1700px);
        max-width: 1700px;
      }

      .question-label {
        margin-bottom: clamp(20px, 1.5vw, 32px);
      }

      .equation {
        gap: clamp(14px, 1vw, 22px);
        font-size: 55px;
      }

      .answer-box {
        width: clamp(200px, 14vw, 250px);
        height: clamp(100px, 8vw, 140px);
        font-size: 50px;
      }

      .number-line-wrap {
        width: min(96vw, 1650px);
        max-width: 1650px;
        margin-top: 80px;
      }

      .number-line-track {
        width: 100%;
        min-width: 0;
      }

      .number-line {
        height: clamp(5px, .35vw, 7px);
      }

      .number-line::before,
      .number-line::after {
        border-top-width: clamp(8px, .5vw, 11px);
        border-bottom-width: clamp(8px, .5vw, 11px);
      }

      .tick {
        width: clamp(2px, .12vw, 3px);
        height: clamp(25px, 1.8vw, 34px);
      }

      .tick.landmark {
        height: clamp(30px, 2vw, 40px);
      }

      .number-btn {
        min-width: clamp(32px, 2.4vw, 42px);
        height: clamp(32px, 2.4vw, 42px);
        font-size: clamp(14px, 1vw, 17px);
      }

      .frog-marker {
        width: clamp(84px, 5.5vw, 106px);
        height: clamp(84px, 5.5vw, 106px);
      }

      .nav {
        width: min(90%, 1500px);
        margin-top: clamp(122px, 9vw, 156px) !important;
        padding-top: clamp(22px, 1.5vw, 34px) !important;
        gap: clamp(180px, 13vw, 320px);
      }

      .nav button {
        width: clamp(165px, 10vw, 220px);
        min-width: clamp(165px, 10vw, 220px);
        height: clamp(60px, 4vw, 76px);
        padding: 0;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 10px 14px;
      }

      .header h1 {
        font-size: 35px;
      }

      .question-label {
        font-size: 20px;
        margin-bottom: 10px;
      }

      .equation {
        font-size: 24px;
        gap: 8px;
      }

      .answer-box {
        width: 72px;
        height: 46px;
        font-size: 20px;
      }

      .number-btn {
        min-width: 24px;
        height: 24px;
        font-size: 11px;
        border-radius: 8px;
      }

      .frog-marker {
        width: 52px;
        height: 52px;
      }

      .nav {
        gap: 90px;
        margin-top: 10px;
      }

      .nav button {
        min-width: 100px;
        padding: 10px 17px;
        font-size: 14px;
      }

      .nav-progress {
        font-size: 15px;
      }
    }

    @media (max-width: 480px) {
      .header {
        padding-top: 5px;
      }

      .header h1 {
        font-size: 25px;
      }

      .question-label {
        font-size: 16px;
        margin-bottom: 7px;
      }

      .equation {
        font-size: 19px;
        gap: 6px;
      }

      .answer-box {
        width: 53px;
        height: 37px;
        border-radius: 9px;
        font-size: 16px;
      }

      .number-btn {
        min-width: 20px;
        height: 20px;
        font-size: 9px;
        border-radius: 6px;
      }

      .frog-marker {
        width: 40px;
        height: 40px;
      }

      .nav {
        gap: 80px;
        margin-top: 8px;
      }

      .nav button {
        min-width: 82px;
        padding: 8px 13px;
        font-size: 12px;
      }

      .nav-progress {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/quiz-ui.css">
</head>

<body>
  <main class="quiz-wrap">

    <header class="header">
      <h1>Find the Product Using the Number Line</h1>
    </header>

    <section class="question-screen">
      <div class="question-label" id="questionLabel">Question 1</div>
      <div class="question-content" id="questionContent"></div>
    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i>
        Prev
      </button>

      <div class="nav-progress" id="navProgress">1 / 4</div>

      <button id="nextBtn" disabled>
        Next
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    function speak(t) {
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-US";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }

    // Hand-built cartoon frog: pure SVG shapes (no emoji, no raster images),
    // animated entirely with CSS classes toggled from JS.
    const FROG_SVG = `
      <svg viewBox="0 0 140 120" xmlns="http://www.w3.org/2000/svg">
        <!-- back legs, folded flat on the ground either side of the body: a proper SITTING pose -->
        <g class="frog-legs" style="transform-box:fill-box;transform-origin:50% 100%;">
          <path d="M46,82 C24,80 8,90 6,106 C5,112 14,116 26,113 C36,111 42,100 44,88 Z"
            fill="#57ba4b"/>
          <path d="M94,82 C116,80 132,90 134,106 C135,112 126,116 114,113 C104,111 98,100 96,88 Z"
            fill="#57ba4b"/>
          <ellipse cx="15" cy="112" rx="13" ry="6" fill="#3d9634"/>
          <ellipse cx="125" cy="112" rx="13" ry="6" fill="#3d9634"/>
          <path d="M5,110 L11,103 M15,112 L15,102 M25,110 L19,103" stroke="#2f7a29" stroke-width="2.6" stroke-linecap="round" fill="none"/>
          <path d="M135,110 L129,103 M125,112 L125,102 M115,110 L121,103" stroke="#2f7a29" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        </g>

        <!-- little hands resting on the ground in front -->
        <ellipse class="frog-arm arm-l" cx="54" cy="103" rx="9" ry="7" fill="#5bc24f"
          style="transform-box:fill-box;transform-origin:80% 20%;"/>
        <ellipse class="frog-arm arm-r" cx="86" cy="103" rx="9" ry="7" fill="#5bc24f"
          style="transform-box:fill-box;transform-origin:20% 20%;"/>

        <!-- rounded sitting body -->
        <ellipse cx="70" cy="62" rx="43" ry="40" fill="#66c95a"/>
        <ellipse cx="70" cy="88" rx="27" ry="19" fill="#eafbe0"/>

        <ellipse class="frog-cheek" cx="41" cy="53" rx="7" ry="4.5" fill="#ff9fb3"/>
        <ellipse class="frog-cheek" cx="99" cy="53" rx="7" ry="4.5" fill="#ff9fb3"/>

        <circle cx="62" cy="29" r="1.8" fill="#2f5c2a"/>
        <circle cx="78" cy="29" r="1.8" fill="#2f5c2a"/>

        <g class="frog-eye eye-l">
          <circle cx="50" cy="31" r="16" fill="#66c95a"/>
          <circle cx="50" cy="29" r="10.5" fill="#fff"/>
          <circle cx="50" cy="30" r="5.2" fill="#1a1a1a"/>
          <circle cx="52.6" cy="26.4" r="1.8" fill="#fff"/>
          <path class="frog-brow" d="M42,16 Q50,12 58,17" stroke="#2f5c2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        </g>
        <g class="frog-eye eye-r">
          <circle cx="90" cy="31" r="16" fill="#66c95a"/>
          <circle cx="90" cy="29" r="10.5" fill="#fff"/>
          <circle cx="90" cy="30" r="5.2" fill="#1a1a1a"/>
          <circle cx="92.6" cy="26.4" r="1.8" fill="#fff"/>
          <path class="frog-brow" d="M82,16 Q90,12 98,17" stroke="#2f5c2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        </g>

        <path class="frog-mouth" d="M53,53 Q70,61 87,53" stroke="#1a1a1a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      </svg>`;

    (() => {

      /*
        Questions match the worksheet template:
        1) 4 x 3   -> number line 0-20
        2) 10 x 2  -> number line 0-30
        3) 7 x 4   -> number line 0-30
        4) 9 x 3   -> number line 0-30
      */
      const questions = [
        { a: 4, b: 3, max: 20 },
        { a: 10, b: 2, max: 30 },
        { a: 7, b: 4, max: 30 },
        { a: 9, b: 3, max: 30 }
      ];

      const MOUTHS = {
        idle: "M53,54 Q70,62 87,54",
        sad: "M53,60 Q70,50 87,60",
        happy: "M48,52 Q70,76 92,52 Q70,68 48,52"
      };

      const content = document.getElementById("questionContent");
      const questionLabel = document.getElementById("questionLabel");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const navProgress = document.getElementById("navProgress");

      let current = 0;
      let audioCtx = null;
      let busy = false; // true while a hop animation is playing (blocks clicks)

      // per-question state
      const state = questions.map(() => ({
        finalPosition: 0,   // where the frog ends up once correct
        completed: false
      }));

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        hop() {
          beep(520, 70);
        },
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);
        setTimeout(() => element.remove(), 1600);
      }

      function updateProgress() {
        navProgress.textContent = `${current + 1} / ${questions.length}`;
      }

      function setFrogMood(frogEl, mood) {
        const mouth = frogEl.querySelector(".frog-mouth");
        if (mouth) mouth.setAttribute("d", MOUTHS[mood] || MOUTHS.idle);
        frogEl.classList.remove("mood-sad", "mood-happy");
        if (mood === "sad") frogEl.classList.add("mood-sad");
        if (mood === "happy") frogEl.classList.add("mood-happy");
      }

      function renderQuestion(index) {
        const q = questions[index];
        const s = state[index];
        current = index;
        busy = false;

        questionLabel.textContent = `Question ${index + 1}`;
        updateProgress();

        content.innerHTML = "";

        const game = document.createElement("div");
        game.className = "game-line";

        // ---- Equation ----
        const equation = document.createElement("div");
        equation.className = "equation";
        equation.innerHTML = `
      <span>${q.a} &times; ${q.b} =</span>
      <input class="answer-box" id="answerBox" type="text" readonly
             value="${s.completed ? s.finalPosition : ""}" placeholder="?" aria-label="Product">
    `;

        // ---- Hint ----
        const hint = document.createElement("div");
        hint.className = "hint-line";
        hint.id = "hintLine";
        hint.textContent = s.completed
          ? "Great job! 🐸"
          : "Tap the number where the frog should land!";

        // ---- Number line ----
        const lineWrap = document.createElement("div");
        lineWrap.className = "number-line-wrap";

        const track = document.createElement("div");
        track.className = "number-line-track";

        const line = document.createElement("div");
        line.className = "number-line";

        const ticks = document.createElement("div");
        ticks.className = "tick-row";

        for (let n = 0; n <= q.max; n++) {
          const tick = document.createElement("span");
          tick.className = "tick";
          if (n % q.a === 0) tick.classList.add("landmark");
          if (n <= (s.completed ? s.finalPosition : 0)) tick.classList.add("reached");
          tick.dataset.number = n;
          ticks.appendChild(tick);
        }
        line.appendChild(ticks);

        // ---- number buttons row ----
        const btnRow = document.createElement("div");
        btnRow.className = "number-btn-row";
        btnRow.id = "numberBtnRow";

        for (let n = 0; n <= q.max; n++) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "number-btn" + (n % q.a === 0 ? " landmark-num" : "");
          btn.textContent = n;
          btn.style.left = `${(n / q.max) * 100}%`;
          btn.dataset.number = n;
          if (s.completed) {
            btn.disabled = true;
            if (n === s.finalPosition) btn.classList.add("btn-correct");
            else btn.classList.add("btn-disabled-dim");
          } else {
            btn.addEventListener("click", () => handleGuess(q, s, n, btn));
          }
          btnRow.appendChild(btn);
        }

        // ---- frog ----
        const frogShadow = document.createElement("div");
        frogShadow.className = "frog-shadow";
        frogShadow.id = "frogShadow";

        const frog = document.createElement("div");
        frog.className = "frog-marker";
        frog.id = "frogMarker";
        frog.innerHTML = `<div class="frog-svg-wrap">${FROG_SVG}</div>`;

        const startLeft = s.completed ? (s.finalPosition / q.max) * 100 : 0;
        frog.style.left = `${startLeft}%`;
        frogShadow.style.left = `${startLeft}%`;
        setFrogMood(frog, s.completed ? "happy" : "idle");
        if (s.completed) frog.classList.add("correct");

        track.append(line, btnRow, frogShadow, frog);
        lineWrap.appendChild(track);

        game.append(equation, hint, lineWrap);
        content.appendChild(game);

        const answerBox = document.getElementById("answerBox");
        if (s.completed) {
          answerBox.classList.add("correct-locked");
        }

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !s.completed;
      }

      function setButtonsDisabled(disabled) {
        document.querySelectorAll(".number-btn").forEach(b => {
          if (!b.classList.contains("btn-correct")) b.disabled = disabled;
        });
      }

      function handleGuess(q, s, n, btnEl) {
        if (busy || s.completed) return;

        const correctAnswer = q.a * q.b;
        const frog = document.getElementById("frogMarker");
        const answerBox = document.getElementById("answerBox");
        const hint = document.getElementById("hintLine");

        busy = true;
        setButtonsDisabled(true);

        if (n === correctAnswer) {
          answerBox.value = n;
          frogHopForwardTo(q, n, () => {
            s.completed = true;
            s.finalPosition = n;

            sound.correct();
            speak("Correct!");
            showEmoji("🥳");
            burstConfetti(answerBox);

            answerBox.classList.add("correct-locked");
            frog.classList.add("correct");
            setFrogMood(frog, "happy");
            btnEl.classList.remove("btn-disabled-dim");
            btnEl.classList.add("btn-correct");
            hint.textContent = "Great job! 🐸";

            document.querySelectorAll(".number-btn").forEach(b => {
              if (b !== btnEl) {
                b.disabled = true;
                b.classList.add("btn-disabled-dim");
              }
            });

            nextBtn.disabled = false;
            busy = false;

            if (current === questions.length - 1) {
              setTimeout(finishQuiz, 1600);
            }
          });
        } else {
          btnEl.classList.remove("btn-wrong");
          void btnEl.offsetWidth;
          btnEl.classList.add("btn-wrong");
          btnEl.addEventListener("animationend", () => {
            btnEl.classList.remove("btn-wrong");
          }, { once: true });

          answerBox.classList.remove("wrong-shake");
          void answerBox.offsetWidth;
          answerBox.classList.add("wrong-shake");
          answerBox.addEventListener("animationend", () => {
            answerBox.classList.remove("wrong-shake");
          }, { once: true });

          sound.wrong();
          speak("Try Again!");
          showEmoji("😔");
          hint.textContent = "Not quite — try again! 🐸";
          setFrogMood(frog, "sad");

          frogShakeWrong(() => {
            answerBox.value = "";
            setFrogMood(frog, "idle");
            setButtonsDisabled(false);
            busy = false;
          });
        }
      }

      // ---- frog hops forward in "b" jumps of size "a", ending on target ----
      function frogHopForwardTo(q, target, onDone) {
        const frog = document.getElementById("frogMarker");
        const frogShadow = document.getElementById("frogShadow");
        let step = 0;
        const totalSteps = target / q.a;

        function nextHop() {
          if (step >= totalSteps) {
            onDone();
            return;
          }
          step++;
          const pos = step * q.a;
          const leftPct = (pos / q.max) * 100;

          sound.hop();
          frog.classList.remove("hop-fwd");
          void frog.offsetWidth;
          frog.classList.add("hop-fwd");
          frog.style.left = `${leftPct}%`;
          frogShadow.style.left = `${leftPct}%`;

          document.querySelectorAll(".tick").forEach(tick => {
            const n = Number(tick.dataset.number);
            if (n <= pos) tick.classList.add("reached");
          });

          setTimeout(() => {
            frog.classList.remove("hop-fwd");
            setTimeout(nextHop, 90);
          }, 380);
        }

        nextHop();
      }

      // ---- wrong answer: frog just shakes in place, no jump, no movement ----
      function frogShakeWrong(onDone) {
        const frog = document.getElementById("frogMarker");

        frog.classList.remove("shake-wrong");
        void frog.offsetWidth;
        frog.classList.add("shake-wrong");

        setTimeout(() => {
          frog.classList.remove("shake-wrong");
          onDone();
        }, 500);
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i>
        Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          state.forEach(s => {
            s.finalPosition = 0;
            s.completed = false;
          });

          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) renderQuestion(current - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (state[current].completed && current < questions.length - 1) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);

    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>
