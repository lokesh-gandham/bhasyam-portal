<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True or False</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
            font-weight: 400;
        }

        html,
        body {
            width: 100%;
            min-height: 100%
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: clip;
            padding: 12px 20px
        }

        .quiz-wrap {
            width: 100%;
            max-width: 1380px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative
        }

        .header {
            text-align: center;
            padding: 12px 0 8px;
            flex-shrink: 0
        }

        .header h1 {
            color: #12265d;
            font-size: 35px;
            line-height: 1.1;
            font-weight: 800
        }

        .question-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0 0
        }

        .question-label {
            color: #12265d;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 14px
        }

        .question-content {
            width: 100%;
            max-width: 1160px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center
        }

        .statement-box {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 90px;
            padding: 0px 28px
        }

        .statement {
            color: #2f4f4f;
            font-size: 30px;
            line-height: 1.3;
            font-weight: 800;
            max-width: 1050px
        }

        .answer-row {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 42px;
            margin-top: 30px
        }

        .answer-btn {
            width: 220px;
            height: 280px;
            border: none;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            padding: 0;
            overflow: visible;
            isolation: isolate;
            transform: translateY(0);
            transition: transform .18s ease, filter .18s ease, opacity .18s ease;
        }

        .true-btn,
        .false-btn {
            background: transparent;
            box-shadow: none
        }

        .answer-btn:hover:not(:disabled) {
            transform: translateY(-8px) rotate(-1deg) scale(1.045);
            filter: brightness(1.04) saturate(1.08)
        }

        .false-btn:hover:not(:disabled) {
            transform: translateY(-8px) rotate(1deg) scale(1.045)
        }

        .answer-btn:active:not(:disabled) {
            transform: translateY(4px) scale(.97)
        }

        .answer-btn:focus-visible {
            outline: 4px solid rgba(18, 38, 93, .28);
            outline-offset: 5px;
            border-radius: 24px
        }

        .answer-btn:disabled {
            cursor: default
        }

        .answer-btn.correct-choice {
            animation: gameWin .78s cubic-bezier(.175, .885, .32, 1.275);
            filter: brightness(1.05) saturate(1.1);
            z-index: 2
        }

        .answer-btn.wrong-choice {
            animation: gameBreak .65s cubic-bezier(.36, .07, .19, .97)
        }

        .answer-btn.locked-wrong {
            opacity: .5;
            filter: grayscale(.55);
            transform: none !important
        }

        /* ---- Panda avatar & expressions (no box, face floats free) ---- */
        .panda-avatar {
            width: 220px;
            height: 220px;
            pointer-events: none;
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, .16))
        }

        .panda-avatar svg {
            width: 100%;
            height: 100%;
            overflow: visible
        }

        .panda-avatar .expr {
            opacity: 0;
            transition: opacity .32s ease
        }

        .panda-avatar .expr-default {
            opacity: 1
        }

        .p-ear,
        .p-face {
            transition: transform .3s ease
        }

        .answer-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            padding: 8px 30px;
            border-radius: 999px;
            transition: transform .25s ease, background .25s ease;
            text-shadow: 0 2px 0 rgba(0, 0, 0, .18)
        }

        .true-btn .answer-text {
            background: linear-gradient(145deg, #72e58d 0%, #4fd477 52%, #35b85e 100%);
            box-shadow: 0 6px 0 #29994b, 0 10px 16px rgba(41, 153, 75, .28), inset 0 2px 0 rgba(255, 255, 255, .4)
        }

        .false-btn .answer-text {
            background: linear-gradient(145deg, #ff8299 0%, #ff637e 52%, #ed4867 100%);
            box-shadow: 0 6px 0 #c93652, 0 10px 16px rgba(201, 54, 82, .28), inset 0 2px 0 rgba(255, 255, 255, .4)
        }

        /* Happy state (correct answer) */
        .answer-btn.panda-state-happy .expr-default {
            opacity: 0
        }

        .answer-btn.panda-state-happy .expr-happy {
            opacity: 1
        }

        .answer-btn.panda-state-happy .panda-avatar {
            animation: pandaBounce .65s cubic-bezier(.36, .11, .21, 1.32)
        }

        .answer-btn.panda-state-happy .answer-text {
            transform: scale(1.08)
        }

        .answer-btn.panda-state-happy .p-blush {
            animation: blushPulse 1.4s ease-in-out infinite
        }

        /* Sad state (wrong / locked-out answer, persists) */
        .answer-btn.panda-state-sad .expr-default {
            opacity: 0
        }

        .answer-btn.panda-state-sad .expr-sad {
            opacity: 1
        }

        .answer-btn.panda-state-sad .panda-avatar {
            animation: pandaDroop .5s ease forwards
        }

        .answer-btn.panda-state-sad .p-tear {
            animation: tearFall 1.6s ease-in infinite
        }

        /* Flash state: temporary sad blink on a wrong pick, then reverts to default */
        .answer-btn.panda-state-flash .expr-default {
            opacity: 0
        }

        .answer-btn.panda-state-flash .expr-sad {
            opacity: 1
        }

        .answer-btn.panda-state-flash .p-blinkable {
            animation: pandaBlink .5s ease-in-out 1;
            transform-origin: center
        }

        @keyframes pandaBounce {
            0% {
                transform: translateY(0) scale(1) rotate(0)
            }

            30% {
                transform: translateY(-14px) scale(1.12) rotate(-4deg)
            }

            55% {
                transform: translateY(4px) scale(.96) rotate(3deg)
            }

            75% {
                transform: translateY(-6px) scale(1.04) rotate(-2deg)
            }

            100% {
                transform: translateY(0) scale(1) rotate(0)
            }
        }

        @keyframes pandaDroop {
            0% {
                transform: translateY(0) rotate(0)
            }

            40% {
                transform: translateY(4px) rotate(-3deg)
            }

            70% {
                transform: translateY(2px) rotate(2deg)
            }

            100% {
                transform: translateY(6px) rotate(0)
            }
        }

        @keyframes pandaBlink {

            0%,
            100% {
                transform: scaleY(1)
            }

            50% {
                transform: scaleY(.08)
            }
        }

        @keyframes blushPulse {

            0%,
            100% {
                opacity: .8;
                transform: scale(1)
            }

            50% {
                opacity: 1;
                transform: scale(1.12)
            }
        }

        @keyframes tearFall {
            0% {
                opacity: 0;
                transform: translateY(0) scale(.6)
            }

            15% {
                opacity: 1;
                transform: translateY(0) scale(1)
            }

            80% {
                opacity: .9;
                transform: translateY(9px) scale(1)
            }

            100% {
                opacity: 0;
                transform: translateY(12px) scale(.7)
            }
        }

        @keyframes gameWin {
            0% {
                transform: translateY(0) scale(1) rotate(0)
            }

            18% {
                transform: translateY(-18px) scale(1.12) rotate(-2deg)
            }

            35% {
                transform: translateY(6px) scale(.98) rotate(2deg)
            }

            52% {
                transform: translateY(-10px) scale(1.05) rotate(-1deg)
            }

            70% {
                transform: translateY(3px) scale(1.01) rotate(1deg)
            }

            100% {
                transform: translateY(0) scale(1) rotate(0)
            }
        }

        @keyframes gameBreak {
            0% {
                transform: translateX(0) rotate(0) scale(1)
            }

            12% {
                transform: translateX(-11px) rotate(-4deg) scale(1.02)
            }

            24% {
                transform: translateX(12px) rotate(4deg) scale(.98)
            }

            38% {
                transform: translateX(-16px) rotate(-6deg) scale(1.04)
            }

            52% {
                transform: translateX(15px) rotate(6deg) scale(.96)
            }

            66% {
                transform: translateX(-10px) rotate(-4deg) scale(1.02)
            }

            82% {
                transform: translateX(7px) rotate(3deg) scale(.99)
            }

            100% {
                transform: translateX(0) rotate(0) scale(1)
            }
        }

        .nav {
            width: 100%;
            margin: 0px auto 0 !important;
            padding-top: 18px;
            display: flex;
            align-items: center;
            justify-content: space-around !important;
            gap: 60px;

        }

        .nav-progress {

            justify-content: center;
            align-items: center;

        .nav button {

            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 5px 0 #3d9634;
            cursor: pointer;

        }

        .nav button:hover:not(:disabled) {
            transform: translateY(-2px)
        }

        .nav button:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #3d9634
        }

        .nav button:disabled {
            opacity: .45;
            cursor: default;

        }

        #prevBtn {
            justify-self: start
        }

        #nextBtn {
            justify-self: end
        }

        .emoji-pop {
            position: fixed;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            font-size: 82px;
            pointer-events: none;
            z-index: 9999;
            animation: emojiPop 1.1s ease-out forwards
        }

        @keyframes emojiPop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.35)
            }

            22% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.18)
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -75%) scale(.82)
            }
        }

        .final-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn .4s ease;
            background: rgba(18, 38, 93, .10)
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        .final-modal {
            background: #fff;
            max-width: 400px;
            width: 90%;
            padding: 36px 28px 32px;
            border-radius: 56px 20px 56px 20px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
            animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275)
        }

        @keyframes popUp {
            from {
                transform: scale(.8);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        .final-modal .icon-big {
            font-size: 52px;
            margin-bottom: 6px;
            display: block
        }

        .final-modal h2 {
            font-size: 30px;
            font-weight: 800;
            color: #1e1e2a;
            margin-bottom: 8px
        }

        .final-modal p {
            font-size: 17px;
            color: #3d3d4a;
            margin-bottom: 22px
        }

        .final-modal .btn-playagain {
            border: none;
            background: linear-gradient(180deg, #ffb347, #f58a2e);
            padding: 12px 36px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 18px;
            color: #2d1f00;
            box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px
        }

        @media screen and (min-width:1025px) and (max-width:1600px) {
            .quiz-wrap {
                max-width: 1380px
            }

            .header h1 {

            .question-label {

            }

            .answer-row {

            }

            .answer-btn {

            }

            }

            }

            }

        }

        @media screen and (min-width:1601px) and (max-width:1920px) {

            }

        }

        @media screen and (min-width:1921px) {
            .quiz-wrap {
                max-width: 1750px
            }

            .header {

            }

            .header h1 {

            }

<body>
    <main class="quiz-wrap">
        <header class="header">
            <h1>Write true (T) or false (F).</h1>
        </header>
        <section class="question-screen">
            <div class="question-label" id="questionLabel">Question 1</div>
            <div class="question-content" id="questionContent"></div>
        </section>
        <nav class="nav" aria-label="Question navigation">
            <button id="prevBtn" disabled><i class="fa-solid fa-chevron-left"></i> Prev</button>
            <div class="nav-progress" id="navProgress">1 / 3</div>
            <button id="nextBtn" disabled>Next <i class="fa-solid fa-chevron-right"></i></button>
        </nav>
    </main>
    <script>        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }
        (() => {
            const questions = [
                { text: "Repeated addition is called multiplication.", answer: "T" },
                { text: "The number that is multiplied is multiplicand.", answer: "T" },
                { text: "The result of multiplication is called sum.", answer: "F" }
            ];

            const content = document.getElementById("questionContent"), questionLabel = document.getElementById("questionLabel"), prevBtn = document.getElementById("prevBtn"), nextBtn = document.getElementById("nextBtn"), navProgress = document.getElementById("navProgress");
            let current = 0; const completed = Array(questions.length).fill(false); let audioCtx = null;
            function getCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); return audioCtx }
                        function beep(frequency, duration, type = "sine") {
                try {
                    const ctx = getCtx();
                    const oscillator = ctx.createOscillator();
                    const gain = ctx.createGain();
                    oscillator.type = type;
                    oscillator.frequency.value = frequency;
                    oscillator.connect(gain);
                    gain.connect(ctx.destination);
                    gain.gain.setValueAtTime(.15, ctx.currentTime);
                    gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + duration / 1000);
                    oscillator.start();
                    oscillator.stop(ctx.currentTime + duration / 1000);
                } catch (e) { }
            }const sound = { correct() { beep(660, 110); setTimeout(() => beep(880, 160), 110) }, wrong() { beep(180, 220, "sawtooth") }, finish() { [523, 659, 784, 1047].forEach((frequency, index) => setTimeout(() => beep(frequency, 150), index * 130)) } };
            function burstConfetti(element) { const rect = element.getBoundingClientRect(); if (typeof confetti === "function") confetti({ particleCount: 34, spread: 70, startVelocity: 22, origin: { x: (rect.left + rect.width / 2) / innerWidth, y: (rect.top + rect.height / 2) / innerHeight }, colors: ["#6635dc", "#ff4e83", "#4e8ff0", "#76b93b", "#f4ae25", "#4ecdc4"] }) }
            function showEmoji(emoji) { const element = document.createElement("div"); element.className = "emoji-pop"; element.textContent = emoji; document.body.appendChild(element); setTimeout(() => element.remove(), 1600) }
            function updateProgress() { navProgress.textContent = `${current + 1} / ${questions.length}` }
            function pandaSVG() {
                return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <ellipse cx="60" cy="112" rx="34" ry="6" fill="rgba(0,0,0,.10)"/>
                    <circle class="p-ear" cx="27" cy="27" r="17" fill="#2b2b2b"/>
                    <circle class="p-ear" cx="93" cy="27" r="17" fill="#2b2b2b"/>
                    <circle class="p-face" cx="60" cy="63" r="46" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
                    <ellipse cx="40" cy="56" rx="14" ry="18" fill="#2b2b2b" transform="rotate(-15 40 56)"/>
                    <ellipse cx="80" cy="56" rx="14" ry="18" fill="#2b2b2b" transform="rotate(15 80 56)"/>
                    <ellipse cx="60" cy="81" rx="6" ry="4" fill="#2b2b2b"/>
                    <g class="expr expr-default">
                        <circle cx="40" cy="58" r="5" fill="#fff"/><circle cx="40" cy="59" r="2.6" fill="#111"/>
                        <circle cx="80" cy="58" r="5" fill="#fff"/><circle cx="80" cy="59" r="2.6" fill="#111"/>
                        <path d="M52 89 Q60 94 68 89" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
                    </g>
                    <g class="expr expr-happy">
                        <path d="M33 56 Q40 47 47 56" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <path d="M73 56 Q80 47 87 56" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <ellipse class="p-blush" cx="29" cy="73" rx="7" ry="4.5" fill="#ff9fb3" opacity=".8"/>
                        <ellipse class="p-blush" cx="91" cy="73" rx="7" ry="4.5" fill="#ff9fb3" opacity=".8"/>
                        <path d="M46 87 Q60 104 74 87 Q60 98 46 87 Z" fill="#8a4a3a"/>
                        <path d="M46 87 Q60 104 74 87" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
                    </g>
                    <g class="expr expr-sad">
                        <path d="M46 47 L34 51" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
                        <path d="M74 47 L86 51" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
                        <circle class="p-blinkable" cx="40" cy="60" r="4.2" fill="#fff"/>
                        <circle class="p-blinkable" cx="41" cy="61.5" r="2.2" fill="#111"/>
                        <circle class="p-blinkable" cx="80" cy="60" r="4.2" fill="#fff"/>
                        <circle class="p-blinkable" cx="79" cy="61.5" r="2.2" fill="#111"/>
                        <path class="p-tear" d="M39 67 q-4 7 0 12 q4 -5 0 -12 Z" fill="#7ec8ff"/>
                        <path d="M52 91 Q60 85 68 91" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
                    </g>
                </svg>`;
            }
            function renderQuestion(index) {
                const q = questions[index]; current = index; questionLabel.textContent = `Question ${index + 1}`; updateProgress(); content.innerHTML = "";
                const statementBox = document.createElement("div"); statementBox.className = "statement-box";
                const statement = document.createElement("div"); statement.className = "statement"; statement.textContent = q.text; statementBox.appendChild(statement);
                const answerRow = document.createElement("div"); answerRow.className = "answer-row";
                const trueBtn = document.createElement("button"); trueBtn.className = "answer-btn true-btn"; trueBtn.type = "button";
                trueBtn.innerHTML = `<div class="panda-avatar">${pandaSVG()}</div><span class="answer-text">TRUE</span>`;
                const falseBtn = document.createElement("button"); falseBtn.className = "answer-btn false-btn"; falseBtn.type = "button";
                falseBtn.innerHTML = `<div class="panda-avatar">${pandaSVG()}</div><span class="answer-text">FALSE</span>`;
                answerRow.appendChild(trueBtn); answerRow.appendChild(falseBtn); content.appendChild(statementBox); content.appendChild(answerRow);
                const buttons = [trueBtn, falseBtn];
                function choose(value, button) {
                    if (completed[index] || buttons.some(btn => btn.dataset.locked === "true")) return;
                    if (value !== q.answer) {
                        // sound.wrong(); 
                        speak("Wrong!");
                        showEmoji("😔"); button.classList.remove("wrong-choice", "panda-state-flash"); void button.offsetWidth; button.classList.add("wrong-choice", "panda-state-flash");
                        setTimeout(() => button.classList.remove("wrong-choice", "panda-state-flash"), 700); return;
                    }
                    completed[index] = true;
                    buttons.forEach(btn => { btn.disabled = true; btn.dataset.locked = "true"; if (btn !== button) btn.classList.add("locked-wrong", "panda-state-sad") });
                    button.classList.remove("panda-state-flash"); button.classList.add("correct-choice", "panda-state-happy");
                    // sound.correct(); 
                    speak("Correct!");
                    showEmoji("🥳"); burstConfetti(button); nextBtn.disabled = false;
                    if (index === questions.length - 1) setTimeout(finishQuiz, 1600);
                }
                trueBtn.addEventListener("click", () => choose("T", trueBtn)); falseBtn.addEventListener("click", () => choose("F", falseBtn));
                if (completed[index]) {
                    buttons.forEach(btn => { btn.disabled = true; btn.dataset.locked = "true" });
                    const correctButton = q.answer === "T" ? trueBtn : falseBtn;
                    correctButton.classList.add("correct-choice", "panda-state-happy");
                    buttons.filter(btn => btn !== correctButton).forEach(btn => btn.classList.add("locked-wrong", "panda-state-sad"));
                }
                prevBtn.disabled = index === 0; nextBtn.disabled = !completed[index];
            }
            function finishQuiz() { sound.finish(); showFinalPopup() }
            function showFinalPopup() {
                if (document.querySelector(".final-overlay")) return;
                const overlay = document.createElement("div"), modal = document.createElement("div"); overlay.className = "final-overlay"; modal.className = "final-modal";
                modal.innerHTML = `<span class="icon-big">🎉</span><h2>All Done!</h2><p>Amazing! You got them all right!</p><button class="btn-playagain"><i class="fa-solid fa-rotate-right"></i> Play again</button>`;
                overlay.appendChild(modal); document.body.appendChild(overlay);
                setTimeout(() => burstConfetti(modal), 80); setTimeout(() => burstConfetti(modal), 350); setTimeout(() => burstConfetti(modal), 650);
                modal.querySelector(".btn-playagain").addEventListener("click", () => { overlay.remove(); completed.fill(false); renderQuestion(0) });
            }
            prevBtn.addEventListener("click", () => { if (current > 0) renderQuestion(current - 1) });
            nextBtn.addEventListener("click", () => { if (completed[current] && current < questions.length - 1) renderQuestion(current + 1) });
            renderQuestion(0);
        })();
    </script>
    <script src="../../shared/quiz-ui.js"></script>
