<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True or False</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/shared/quiz-ui.css">
    <link rel="stylesheet" href="../assets/shared/grade3-chapter1.css">
    <script src="../assets/shared/quiz-ui.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', sans-serif;
            font-weight: 400;
        }

        html,
        body {
            width: 100%;
            min-height: 100%
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: clip;
            padding: 12px 20px
        }

        .quiz-wrap {
            width: 100%;
            max-width: 1380px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative
        }

        .header {
            text-align: center;
            padding: 12px 0 8px;
            flex-shrink: 0
        }

        .header h1 {
            color: #12265d;
            font-size: 35px;
            line-height: 1.1;
            font-weight: 800
        }

        .question-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0 0
        }

        .question-label {
            color: #12265d;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 14px
        }

        .question-content {
            width: 100%;
            max-width: 1160px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center
        }

        .statement-box {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 90px;
            padding: 0px 28px
        }

        .statement {
            color: #2f4f4f;
            font-size: 30px;
            line-height: 1.3;
            font-weight: 800;
            max-width: 1050px
        }

        .answer-row {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 42px;
            margin-top: 30px
        }

        .answer-btn {
            width: 270px;
            height: 180px;
            border: 3px solid transparent;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            color: #fff;
            font-size: 37px;
            font-weight: 800;
            letter-spacing: 1px;
            overflow: hidden;
            isolation: isolate;
            transform: translateY(0);
            transition: transform .16s ease, filter .16s ease, box-shadow .16s ease, opacity .16s ease;
            text-shadow: 0 3px 0 rgba(0, 0, 0, .22)
        }

        .answer-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -2;
            background: linear-gradient(135deg, rgba(255, 255, 255, .24) 0 8%, transparent 8% 88%, rgba(255, 255, 255, .10) 88%), repeating-linear-gradient(135deg, rgba(255, 255, 255, .035) 0 5px, transparent 5px 10px);
            clip-path: polygon(0 8%, 8% 0, 92% 0, 100% 10%, 100% 90%, 91% 100%, 8% 100%, 0 91%)
        }

        .answer-btn::after {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            top: 9px;
            height: 9px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .30);
            transform: skewX(-18deg);
            pointer-events: none
        }

        .true-btn {
            background: linear-gradient(145deg, #72e58d 0%, #4fd477 52%, #35b85e 100%);
            border-color: #a8f5b8;
            box-shadow: 0 10px 0 #29994b, 0 17px 28px rgba(41, 153, 75, .25), inset 0 2px 0 rgba(255, 255, 255, .48), inset 0 -7px 0 rgba(0, 0, 0, .08)
        }

        .false-btn {
            background: linear-gradient(145deg, #ff8299 0%, #ff637e 52%, #ed4867 100%);
            border-color: #ffb7c5;
            box-shadow: 0 10px 0 #c93652, 0 17px 28px rgba(201, 54, 82, .25), inset 0 2px 0 rgba(255, 255, 255, .48), inset 0 -7px 0 rgba(0, 0, 0, .08)
        }

        .answer-btn:hover:not(:disabled) {
            transform: translateY(-7px) scale(1.035);
            filter: brightness(1.10) saturate(1.08)
        }

        .answer-btn:active:not(:disabled) {
            transform: translateY(7px) scale(.98);
            box-shadow: 0 3px 0 rgba(0, 0, 0, .28), inset 0 -2px 0 rgba(0, 0, 0, .12)
        }

        .answer-btn:focus-visible {
            outline: 4px solid rgba(18, 38, 93, .28);
            outline-offset: 5px
        }

        .answer-btn:disabled {
            cursor: default
        }

        .answer-btn.correct-choice {
            animation: gameWin .78s cubic-bezier(.175, .885, .32, 1.275);
            filter: brightness(1.12) saturate(1.12);
            z-index: 2
        }

        .answer-btn.wrong-choice {
            animation: gameBreak .65s cubic-bezier(.36, .07, .19, .97)
        }

        .answer-btn.locked-wrong {
            opacity: .34;
            filter: grayscale(.65);
            transform: none !important;
            box-shadow: 0 5px 0 rgba(0, 0, 0, .16)
        }

        @keyframes gameWin {
            0% {
                transform: translateY(0) scale(1) rotate(0)
            }

            18% {
                transform: translateY(-18px) scale(1.12) rotate(-2deg)
            }

            35% {
                transform: translateY(6px) scale(.98) rotate(2deg)
            }

            52% {
                transform: translateY(-10px) scale(1.05) rotate(-1deg)
            }

            70% {
                transform: translateY(3px) scale(1.01) rotate(1deg)
            }

            100% {
                transform: translateY(0) scale(1) rotate(0)
            }
        }

        @keyframes gameBreak {
            0% {
                transform: translateX(0) rotate(0) scale(1)
            }

            12% {
                transform: translateX(-11px) rotate(-4deg) scale(1.02)
            }

            24% {
                transform: translateX(12px) rotate(4deg) scale(.98)
            }

            38% {
                transform: translateX(-16px) rotate(-6deg) scale(1.04)
            }

            52% {
                transform: translateX(15px) rotate(6deg) scale(.96)
            }

            66% {
                transform: translateX(-10px) rotate(-4deg) scale(1.02)
            }

            82% {
                transform: translateX(7px) rotate(3deg) scale(.99)
            }

            100% {
                transform: translateX(0) rotate(0) scale(1)
            }
        }

        .nav {
            width: 100%;
            margin: 20px auto 0;
            padding-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            position: relative;
            z-index: 20
        }

        .nav-progress {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #12265d;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .5px;
            display: none;
        }

        .nav button {
            min-width: 112px;
            border: 0;
            border-radius: 999px;
            padding: 11px 20px;
            background: #55b449;
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 5px 0 #3d9634;
            cursor: pointer;
            transition: transform .15s ease, opacity .15s ease
        }

        .nav button:hover:not(:disabled) {
            transform: translateY(-2px)
        }

        .nav button:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #3d9634
        }

        .nav button:disabled {
            opacity: .45;
            cursor: default;
            box-shadow: 0 3px 0 #cfd9cf
        }

        #prevBtn {
            justify-self: start
        }

        #nextBtn {
            justify-self: end
        }

        .emoji-pop {
            position: fixed;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            font-size: 82px;
            pointer-events: none;
            z-index: 9999;
            animation: emojiPop 1.1s ease-out forwards
        }

        @keyframes emojiPop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.35)
            }

            22% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.18)
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -75%) scale(.82)
            }
        }

        .final-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn .4s ease;
            background: rgba(18, 38, 93, .10)
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        .final-modal {
            background: #fff;
            max-width: 400px;
            width: 90%;
            padding: 36px 28px 32px;
            border-radius: 56px 20px 56px 20px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
            animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275)
        }

        @keyframes popUp {
            from {
                transform: scale(.8);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        .final-modal .icon-big {
            font-size: 52px;
            margin-bottom: 6px;
            display: block
        }

        .final-modal h2 {
            font-size: 30px;
            font-weight: 800;
            color: #1e1e2a;
            margin-bottom: 8px
        }

        .final-modal p {
            font-size: 17px;
            color: #3d3d4a;
            margin-bottom: 22px
        }

        .final-modal .btn-playagain {
            border: none;
            background: linear-gradient(180deg, #ffb347, #f58a2e);
            padding: 12px 36px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 18px;
            color: #2d1f00;
            box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px
        }

        @media screen and (min-width:1025px) and (max-width:1440px) {
            .quiz-wrap {
                max-width: 1380px
            }

            .header h1 {
                font-size: 35px
            }

            .question-label {
                font-size: 24px
            }

            .answer-row {
                gap: 48px
            }

            .answer-btn {
                width: 290px;
                height: 220px
            }

            .nav {
                gap: 150px
            }

            .nav button {
                width: 150px;
                min-width: 150px;
                height: 55px;
                padding: 0;
                font-size: 20px
            }
        }

        @media screen and (min-width:1441px) and (max-width:1920px) {
            .quiz-wrap {
                max-width: 1600px
            }

            .header {
                padding-top: 16px
            }

            .header h1 {
                font-size: 50px
            }

            .question-label {
                font-size: 27px;
                margin-bottom: 18px
            }

            .statement-box {
                min-height: 120px
            }

            .statement {
                font-size: 40px
            }

            .answer-row {
                gap: 58px;
                margin-top: 32px
            }

            .answer-btn {
                width: 340px;
                height: 240px;
                font-size: 46px;
                border-radius: 30px
            }

            .nav {
                margin-top: 32px;
                padding-top: 24px;
                gap: 180px
            }

            .nav button {
                width: 160px;
                min-width: 160px;
                height: 58px;
                padding: 0;
                font-size: 22px
            }
        }

        @media screen and (min-width:1921px) {
            .quiz-wrap {
                max-width: 1750px
            }

            .header {
                padding-top: 20px
            }

            .header h1 {
                font-size: 50px
            }

            .question-label {
                font-size: 30px;
                margin-bottom: 20px
            }

            .statement-box {
                min-height: 130px
            }

            .statement {
                font-size: 40px
            }

            .answer-row {
                gap: 68px;
                margin-top: 36px
            }

            .answer-btn {
                width: 390px;
                height: 220px;
                font-size: 52px;
                border-radius: 34px
            }

            .nav {
                margin-top: 36px;
                padding-top: 28px;
                gap: 190px
            }

            .nav button {
                width: 170px;
                min-width: 170px;
                height: 60px;
                padding: 0;
                font-size: 24px
            }
        }

        @media(max-width:768px) {
            body {
                padding: 10px 14px
            }

            .header h1 {
                font-size: 35px
            }

            .question-label {
                font-size: 20px;
                margin-bottom: 10px
            }

            .statement-box {
                min-height: 110px;
                padding: 10px 12px
            }

            .statement {
                font-size: 28px;
                line-height: 1.28
            }

            .answer-row {
                gap: 18px;
                margin-top: 20px
            }

            .answer-btn {
                width: 185px;
                height: 120px;
                border-radius: 21px;
                font-size: 30px
            }

            .nav {
                gap: 90px;
                margin-top: 10px
            }

            .nav button {
                min-width: 100px;
                padding: 10px 17px;
                font-size: 14px
            }

            .nav-progress {
                font-size: 15px
            }
        }

        @media(max-width:480px) {
            .header {
                padding-top: 5px
            }

            .header h1 {
                font-size: 25px
            }

            .question-label {
                font-size: 16px;
                margin-bottom: 7px
            }

            .statement-box {
                min-height: 92px;
                padding: 8px 6px
            }

            .statement {
                font-size: 21px;
                line-height: 1.25
            }

            .answer-row {
                gap: 10px;
                margin-top: 14px
            }

            .answer-btn {
                width: 132px;
                height: 100px;
                border-radius: 16px;
                font-size: 22px;
                box-shadow: 0 7px 0 #31752a, 0 12px 17px rgba(49, 117, 42, .20), inset 0 2px 0 rgba(255, 255, 255, .28)
            }

            .false-btn {
                box-shadow: 0 7px 0 #9e2e30, 0 12px 17px rgba(158, 46, 48, .20), inset 0 2px 0 rgba(255, 255, 255, .28)
            }

            .nav {
                gap: 80px;
                margin-top: 8px
            }

            .nav button {
                min-width: 82px;
                padding: 8px 13px;
                font-size: 12px
            }

            .nav-progress {
                font-size: 13px
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/quiz-ui.css">
</head>

<body>
    <main class="quiz-wrap">
        <header class="header">
            <h1>Write true (T) or false (F).</h1>
        </header>
        <section class="question-screen">
            <div class="question-label" id="questionLabel">Question 1</div>
            <div class="question-content" id="questionContent"></div>
        </section>
        <nav class="nav" aria-label="Question navigation">
            <button id="prevBtn" disabled><i class="fa-solid fa-chevron-left"></i> Prev</button>
            <div class="nav-progress" id="navProgress">1 / 3</div>
            <button id="nextBtn" disabled>Next <i class="fa-solid fa-chevron-right"></i></button>
        </nav>
    </main>
    <script>
        (() => {
            const questions = [
                { text: "Repeated addition is called multiplication.", answer: "T" },
                { text: "The number that is multiplied is multiplicand.", answer: "T" },
                { text: "The result of multiplication is called sum.", answer: "F" }
            ];

            const content = document.getElementById("questionContent"), questionLabel = document.getElementById("questionLabel"), prevBtn = document.getElementById("prevBtn"), nextBtn = document.getElementById("nextBtn"), navProgress = document.getElementById("navProgress");
            let current = 0; const completed = Array(questions.length).fill(false); let audioCtx = null;
            function getCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); return audioCtx }
            function beep(frequency, duration, type = "sine") { try { const ctx = getCtx(), oscillator = ctx.createOscillator(), gain = ctx.createGain(); oscillator.type = type; oscillator.frequency.value = frequency; oscillator.connect(gain); gain.connect(ctx.destination); gain.gain.setValueAtTime(.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + duration / 1000); oscillator.start(); oscillator.stop(ctx.currentTime + duration / 1000) } catch (e) { } }
            const sound = { correct() { beep(660, 110); setTimeout(() => beep(880, 160), 110) }, wrong() { beep(180, 220, "sawtooth") }, finish() { [523, 659, 784, 1047].forEach((frequency, index) => setTimeout(() => beep(frequency, 150), index * 130)) } };
            function burstConfetti(element) { const rect = element.getBoundingClientRect(); if (typeof confetti === "function") confetti({ particleCount: 34, spread: 70, startVelocity: 22, origin: { x: (rect.left + rect.width / 2) / innerWidth, y: (rect.top + rect.height / 2) / innerHeight }, colors: ["#6635dc", "#ff4e83", "#4e8ff0", "#76b93b", "#f4ae25", "#4ecdc4"] }) }
            function showEmoji(emoji) { const element = document.createElement("div"); element.className = "emoji-pop"; element.textContent = emoji; document.body.appendChild(element); setTimeout(() => element.remove(), 1600) }
            function updateProgress() { navProgress.textContent = `${current + 1} / ${questions.length}` }
            function renderQuestion(index) {
                const q = questions[index]; current = index; questionLabel.textContent = `Question ${index + 1}`; updateProgress(); content.innerHTML = "";
                const statementBox = document.createElement("div"); statementBox.className = "statement-box";
                const statement = document.createElement("div"); statement.className = "statement"; statement.textContent = q.text; statementBox.appendChild(statement);
                const answerRow = document.createElement("div"); answerRow.className = "answer-row";
                const trueBtn = document.createElement("button"); trueBtn.className = "answer-btn true-btn"; trueBtn.type = "button"; trueBtn.textContent = "TRUE (T)";
                const falseBtn = document.createElement("button"); falseBtn.className = "answer-btn false-btn"; falseBtn.type = "button"; falseBtn.textContent = "FALSE (F)";
                answerRow.appendChild(trueBtn); answerRow.appendChild(falseBtn); content.appendChild(statementBox); content.appendChild(answerRow);
                const buttons = [trueBtn, falseBtn];
                function choose(value, button) {
                    if (completed[index] || buttons.some(btn => btn.dataset.locked === "true")) return;
                    if (value !== q.answer) {
                        sound.wrong(); showEmoji("😔"); button.classList.remove("wrong-choice"); void button.offsetWidth; button.classList.add("wrong-choice"); setTimeout(() => button.classList.remove("wrong-choice"), 700); return;
                    }
                    completed[index] = true;
                    buttons.forEach(btn => { btn.disabled = true; btn.dataset.locked = "true"; if (btn !== button) btn.classList.add("locked-wrong") });
                    button.classList.add("correct-choice"); sound.correct(); showEmoji("🥳"); burstConfetti(button); nextBtn.disabled = false;
                    if (index === questions.length - 1) setTimeout(finishQuiz, 650);
                }
                trueBtn.addEventListener("click", () => choose("T", trueBtn)); falseBtn.addEventListener("click", () => choose("F", falseBtn));
                if (completed[index]) {
                    buttons.forEach(btn => { btn.disabled = true; btn.dataset.locked = "true" });
                    const correctButton = q.answer === "T" ? trueBtn : falseBtn;
                    correctButton.classList.add("correct-choice");
                    buttons.filter(btn => btn !== correctButton).forEach(btn => btn.classList.add("locked-wrong"));
                }
                prevBtn.disabled = index === 0; nextBtn.disabled = !completed[index];
            }
            function finishQuiz() { sound.finish(); showFinalPopup() }
            function showFinalPopup() {
                if (document.querySelector(".final-overlay")) return;
                const overlay = document.createElement("div"), modal = document.createElement("div"); overlay.className = "final-overlay"; modal.className = "final-modal";
                modal.innerHTML = `<span class="icon-big">🎉</span><h2>All Done!</h2><p>Amazing! You got them all right!</p><button class="btn-playagain"><i class="fa-solid fa-rotate-right"></i> Play again</button>`;
                overlay.appendChild(modal); document.body.appendChild(overlay);
                setTimeout(() => burstConfetti(modal), 80); setTimeout(() => burstConfetti(modal), 350); setTimeout(() => burstConfetti(modal), 650);
                modal.querySelector(".btn-playagain").addEventListener("click", () => { overlay.remove(); completed.fill(false); renderQuestion(0) });
            }
            prevBtn.addEventListener("click", () => { if (current > 0) renderQuestion(current - 1) });
            nextBtn.addEventListener("click", () => { if (completed[current] && current < questions.length - 1) renderQuestion(current + 1) });
            renderQuestion(0);
        })();
    </script>
    <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
