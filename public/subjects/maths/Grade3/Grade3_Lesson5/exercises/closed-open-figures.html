<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wise Wings - Closed & Open Figures</title>

    <link rel="icon" type="image/png" href="/iconsa1.png">

    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../assets/CSS/walkman-font.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            height: 100vh;
            font-family: "Tiro Devanagari Hindi", Arial, sans-serif;

            background: #ffffff;

            overflow: hidden;
            position: relative;
        }


        /* =====================================================
           MAIN QUIZ
        ===================================================== */

        .quiz {
            width: min(1100px, 96vw);
            min-height: 0;

            /* padding: 25px 30px; */

            display: flex;
            flex-direction: column;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .quiz-header {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            margin-bottom: 12px;
            display: none;
        }

        .quiz-title {
            text-align: center;

            color: #3f613f;

            font-size: clamp(23px, 3vw, 34px);

            font-weight: 700;

            line-height: 1.2;
        }

        .quiz-subtitle {
            margin-top: 5px;

            color: #666;

            font-size: clamp(14px, 1.8vw, 18px);

            font-weight: 400;
        }


        /* =====================================================
           SCORE
        ===================================================== */

        .score-box {
            position: absolute;

            right: 0;
            top: 2px;

            padding: 8px 18px;

            background: #e98a9d;

            color: white;

            border-radius: 25px;

            font-size: clamp(14px, 1.7vw, 18px);

            font-weight: 600;

            white-space: nowrap;

            box-shadow: 0 3px 8px rgba(0, 0, 0, .12);
        }


        /* =====================================================
           INSTRUCTION
        ===================================================== */

        .instruction-text {
            width: 100%;

            margin: 5px auto 5px;

            padding: 10px 18px;

            text-align: center;

            white-space: nowrap;

            font-size: 30px;

            font-weight: 400;

            line-height: 1.45;

            color: #444;





            border-radius: 10px;
        }


        /* =====================================================
           QUESTION AREA
        ===================================================== */

        .question-area {
            width: 100%;

            /* flex: 1; */

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            position: relative;

            /* padding: 10px 0 15px; */
        }


        /* =====================================================
           QUESTION NUMBER
        ===================================================== */

        .question-number {
            font-size: clamp(19px, 2.5vw, 27px);

            font-weight: 400;

            color: #333;

            margin-bottom: 12px;
            display: none;
        }


        /* =====================================================
           IMAGE BOX
        ===================================================== */

        .image-box {
            width: min(400px, 50vw);

            height: min(200px, 30vh);

            min-height: 170px;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 12px;

            border-radius: 18px;

            background: #fff;

            border: 3px solid #e6e6e6;

            box-shadow:
                0 7px 18px rgba(0, 0, 0, .08);

            overflow: hidden;
        }

        .question-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }


        /* =====================================================
           DROP ZONE (drag your answer here)
        ===================================================== */

        .drop-zone {
            width: min(480px, 86vw);
            height: 82px;

            margin: 16px auto 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 4px dashed #c2caea;
            border-radius: 22px;

            background: #f7f8ff;

            position: relative;

            transition: border-color .2s ease, background .2s ease, transform .18s ease, box-shadow .2s ease;
        }

        .drop-zone-hint {
            font-size: 20px;
            font-weight: 400;
            color: #98a1c9;
            text-align: center;
            padding: 0 12px;
            line-height: 1.3;
            pointer-events: none;
        }

        .drop-zone-icon {
            font-size: 42px;
            font-weight: 900;
            line-height: 1;
            pointer-events: none;
            animation: dropIconPop .4s cubic-bezier(.175, .885, .32, 1.275);
        }

        @keyframes dropIconPop {
            0% {
                transform: scale(.3);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .drop-zone-icon.icon-closed {
            color: #3d9634;
        }

        .drop-zone-icon.icon-open {
            color: #b23830;
        }

        .drop-zone.drop-zone-active {
            border-style: solid;
            border-color: #5b63e6;
            background: #eef0ff;
            transform: scale(1.06);
            box-shadow: 0 10px 22px rgba(91, 99, 230, .22);
        }

        .drop-zone.drop-zone-correct {
            border-style: solid;
            border-color: #55b449;
            background: #f2fbf1;
            box-shadow: 0 0 0 6px rgba(85, 180, 73, .14);
            animation: dropCorrectPop .55s cubic-bezier(.175, .885, .32, 1.275);
        }

        @keyframes dropCorrectPop {
            0% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.16);
            }

            100% {
                transform: scale(1);
            }
        }

        .drop-zone.drop-zone-wrong {
            animation: dropWrongShake .5s ease;
        }

        @keyframes dropWrongShake {

            0%,
            100% {
                transform: translateX(0);
                border-color: #c2caea;
                background: #f7f8ff;
            }

            20%,
            60% {
                transform: translateX(-9px);
                border-color: #e0483f;
                background: #fff0f0;
            }

            40%,
            80% {
                transform: translateX(9px);
                border-color: #e0483f;
                background: #fff0f0;
            }
        }


        /* =====================================================
           OPTIONS - draggable icon-only chips
        ===================================================== */

        .options-area {
            width: min(650px, 94vw);

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 46px;

            margin-top: 18px;
        }

        .option-btn {
            width: 90px;
            height: 90px;

            border: 0;
            border-radius: 50%;

            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #fff;

            transition:
                transform .15s ease,
                box-shadow .15s ease,
                opacity .2s ease,
                filter .2s ease;
        }

        .option-icon {
            font-size: 42px;
            font-weight: 900;
            pointer-events: none;
        }

        .closed-option {
            background: linear-gradient(150deg, #93e493, #55b449 60%, #429838);
            box-shadow:
                0 6px 0 #3d9634,
                0 9px 16px rgba(61, 150, 52, .28);
        }

        .open-option {
            background: linear-gradient(150deg, #ff9d9d, #e0483f 60%, #c73a32);
            box-shadow:
                0 6px 0 #b23830,
                0 9px 16px rgba(178, 56, 48, .28);
        }

        .option-btn:hover:not(.disabled) {
            transform: translateY(-4px) scale(1.06);
        }

        .option-btn:active:not(.disabled) {
            cursor: grabbing;
        }

        .option-btn.dragging {
            cursor: grabbing;
            transform: scale(1.02);
            box-shadow: 0 16px 26px rgba(0, 0, 0, .3);
            opacity: .98;
        }

        .option-btn.chip-placeholder {
            opacity: .0;
            /* filter: blur(1.5px) grayscale(.25); */
            transform: scale(.96);
        }

        .option-btn.disabled {
            opacity: .35;
            filter: grayscale(.55);
            pointer-events: none;
            cursor: default;
        }


        /* =====================================================
           NAVIGATION - SAME AS OTHER QUIZZES
        ===================================================== */
        .nav {
            width: 100%;
            margin: auto auto 0;
            padding-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            position: relative;
            z-index: 20;
        }

        .nav button {
            min-width: 112px;
            border: 0;
            border-radius: 999px;
            padding: 11px 20px;
            background: #55b449;
            color: #fff;
            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 5px 0 #3d9634;
            cursor: pointer;
            transition: transform .15s ease, opacity .15s ease;
        }

        .nav button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .nav button:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #3d9634;
        }

        .nav button:disabled {
            opacity: .45;
            cursor: default;
            box-shadow: 0 3px 0 #cfd9cf;
        }


        /* =====================================================
           ANSWER POPUP - SAME AS TRUE / FALSE REFERENCE
        ===================================================== */
        .emoji-pop {
            position: fixed;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            font-size: 82px;
            pointer-events: none;
            z-index: 9999;
            animation: emojiPop 1.1s ease-out forwards;
        }

        @keyframes emojiPop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.35);
            }

            22% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.18);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -75%) scale(.82);
            }
        }

        /* =====================================================
           FINAL POPUP - SAME AS TRUE / FALSE REFERENCE
        ===================================================== */
        .final-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn .4s ease;

        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .final-modal {
            background: #fff;
            max-width: 400px;
            width: 90%;
            padding: 36px 28px 32px;
            border-radius: 56px 20px 56px 20px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
            animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
        }

        @keyframes popUp {
            from {
                transform: scale(.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .final-modal .icon-big {
            font-size: 52px;
            margin-bottom: 6px;
            display: block;
        }

        .final-modal h2 {
            font-size: 30px;
            font-weight: 800;
            color: #1e1e2a;
            margin-bottom: 8px;
        }

        .final-modal p {
            font-size: 17px;
            color: #3d3d4a;
            margin-bottom: 22px;
        }

        .final-modal .btn-playagain {
            border: none;
            background: linear-gradient(180deg, #ffb347, #f58a2e);
            padding: 12px 36px;
            border-radius: 999px;
            font-family: "Tiro Devanagari Hindi", Arial, sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #2d1f00;
            box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 768px) {

            body {
                align-items: flex-start;

                padding: 12px 0;

                overflow-y: auto;
            }

            .quiz {
                width: 97vw;

                min-height: calc(100vh - 24px);

                padding: 15px;
            }

            .quiz-header {
                padding-right: 0;
            }

            .quiz-title {
                padding: 0 75px;
            }

            .score-box {
                right: 0;

                padding: 6px 12px;
            }

            .instruction-text {
                margin-bottom: 15px;

                padding: 8px 12px;

                white-space: normal;

                font-size: 18px;
            }

            .question-area {
                padding-top: 5px;
            }

            .image-box {
                width: min(260px, 60vw);

                height: 26vh;

                min-height: 140px;

                padding: 10px;
            }

            .drop-zone {
                width: min(360px, 90vw);
                height: 68px;
                margin-top: 12px;
                border-radius: 18px;
            }

            .drop-zone-hint {
                font-size: 11px;
            }

            .drop-zone-icon {
                font-size: 34px;
            }

            .options-area {
                width: min(600px, 94vw);

                gap: 28px;

                margin-top: 16px;
            }

            .option-btn {
                width: 68px;
                height: 68px;
            }

            .option-icon {
                font-size: 30px;
            }

            .nav {
                width: min(600px, 94vw);

                margin-top: 16px;
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            body {
                padding: 5px 0;
            }

            .quiz {
                width: 98vw;

                min-height: calc(100vh - 10px);

                padding: 8px;
            }

            .quiz-header {
                margin-bottom: 7px;
            }

            .quiz-title {
                padding: 0 55px;

                font-size: 20px;
            }

            .quiz-subtitle {
                font-size: 12px;

                margin-top: 2px;
            }

            .score-box {
                top: 0;

                padding: 5px 9px;

                font-size: 12px;

                border-radius: 18px;
            }

            .instruction-text {
                width: 98%;

                margin: 2px auto 10px;

                padding: 6px 8px;

                white-space: normal;

                font-size: 13px;

                line-height: 1.4;
            }

            .question-number {
                font-size: 18px;

                margin-bottom: 7px;
            }

            .image-box {
                width: 60vw;

                height: 22vh;

                min-height: 110px;

                padding: 8px;

                border-radius: 15px;

                border-width: 2px;
            }

            .drop-zone {
                width: 92vw;
                height: 56px;
                margin-top: 10px;
                border-width: 3px;
                border-radius: 16px;
            }

            .drop-zone-hint {
                font-size: 10px;
            }

            .drop-zone-icon {
                font-size: 28px;
            }

            .options-area {
                width: 96vw;

                gap: 20px;

                margin-top: 12px;
            }

            .option-btn {
                width: 58px;
                height: 58px;
            }

            .option-icon {
                font-size: 26px;
            }

            .nav {
                width: 100%;
                margin-top: 12px;
            }

            .popup-content {
                padding: 25px 18px;
            }

            .popup-icon {
                font-size: 52px;
            }

            .popup-title {
                font-size: 24px;
            }

            .popup-msg {
                font-size: 16px;
            }

            #stars {
                font-size: 30px;
            }

        }


        /* =====================================================
           VERY SMALL DEVICES
        ===================================================== */

        @media (max-width: 350px) {

            .quiz-title {
                padding: 0 45px;

                font-size: 17px;
            }

            .quiz-subtitle {
                font-size: 10px;
            }

            .score-box {
                font-size: 10px;

                padding: 4px 7px;
            }

            .image-box {
                height: 18vh;

                min-height: 90px;
            }

            .drop-zone {
                width: 90vw;
                height: 46px;
                border-radius: 13px;
            }

            .drop-zone-icon {
                font-size: 24px;
            }

            .option-btn {
                width: 50px;
                height: 50px;
            }

            .option-icon {
                font-size: 22px;
            }

            .nav button {
                font-size: 12px;
            }

        }


        @media screen and (min-width:1025px) and (max-width:1440px) {
            .nav {
                gap: 150px;
                margin-top: 32px;
                padding-top: 24px;
            }

            .nav button {
                width: 150px;
                min-width: 150px;
                height: 55px;
                padding: 0;
                font-size: 20px;
            }
        }

        @media screen and (min-width: 1441px) and (max-width: 1920px) {

            .quiz {
                width: min(96vw, 1840px);
                max-width: 1840px;
            }

            .instruction-text {
                width: 100%;
                margin-top: clamp(8px, 0.5vw, 12px);
                margin-bottom: clamp(12px, 0.8vw, 20px);
                padding: clamp(12px, 0.8vw, 18px) clamp(20px, 1.2vw, 30px);
            }

            .question-area {
                width: 100%;
            }

            .question-number {
                margin-bottom: clamp(14px, 0.8vw, 20px);
            }

            .image-box {
                width: clamp(320px, 22vw, 420px);
                height: clamp(180px, 13vw, 240px);
                min-height: 0;
                padding: clamp(12px, .8vw, 18px);
            }

            .drop-zone {
                width: clamp(420px, 32vw, 620px);
                height: clamp(84px, 6vw, 106px);
                margin-top: clamp(18px, 1.2vw, 26px);
                border-radius: clamp(20px, 1.2vw, 26px);
            }

            .drop-zone-hint {
                font-size: clamp(18px, 1vw, 20px);
            }

            .drop-zone-icon {
                font-size: clamp(44px, 2.8vw, 54px);
            }

            .options-area {
                width: min(100%, 1000px);
                gap: clamp(46px, 3vw, 64px);
                margin-top: clamp(24px, 1.5vw, 34px);
            }

            .option-btn {
                width: clamp(96px, 6vw, 116px);
                height: clamp(96px, 6vw, 116px);
            }

            .option-icon {
                font-size: clamp(44px, 2.8vw, 54px);
            }

            .nav {
                width: min(100%, 1500px);
                margin-top: clamp(28px, 1.8vw, 40px);
                padding-top: clamp(22px, 1.4vw, 30px);
                gap: clamp(180px, 13vw, 300px);
            }

            /* OLD NAV BUTTON SIZE */
            .nav button {
                width: 160px;
                min-width: 160px;
                height: 58px;
                padding: 0;
            }
        }


        @media screen and (min-width: 1921px) {

            .quiz {
                width: min(97vw, 2350px);
                max-width: 2350px;
            }

            .instruction-text {
                width: 100%;
                margin-top: clamp(10px, 0.5vw, 15px);
                margin-bottom: clamp(14px, 0.8vw, 24px);
                padding: clamp(14px, 0.8vw, 20px) clamp(24px, 1.2vw, 36px);
            }

            .question-area {
                width: 100%;
            }

            .question-number {
                margin-bottom: clamp(16px, 0.8vw, 24px);
            }

            .image-box {
                width: clamp(380px, 24vw, 480px);
                height: clamp(210px, 14vw, 270px);
                min-height: 0;
                padding: clamp(14px, .9vw, 20px);
            }

            .drop-zone {
                width: clamp(480px, 34vw, 700px);
                height: clamp(96px, 6.5vw, 120px);
                margin-top: clamp(22px, 1.4vw, 30px);
                border-radius: clamp(22px, 1.4vw, 30px);
            }

            .drop-zone-hint {
                font-size: clamp(18px, 1vw, 20px);
            }

            .drop-zone-icon {
                font-size: clamp(50px, 3.2vw, 62px);
            }

            .options-area {
                width: min(100%, 1300px);
                gap: clamp(52px, 3vw, 74px);
                margin-top: clamp(28px, 1.5vw, 40px);
            }

            .option-btn {
                width: clamp(110px, 6vw, 132px);
                height: clamp(110px, 6vw, 132px);
            }

            .option-icon {
                font-size: clamp(50px, 2.8vw, 60px);
            }

            .nav {
                width: min(100%, 1800px);
                margin-top: clamp(32px, 1.8vw, 48px);
                padding-top: clamp(26px, 1.4vw, 38px);
                gap: clamp(200px, 13vw, 360px);
            }

            /* OLD NAV BUTTON SIZE */
            .nav button {
                width: 170px;
                min-width: 170px;
                height: 60px;
                padding: 0;
            }
        }

        @media (max-width:768px) {
            .nav {
                gap: 90px;
                margin-top: 10px;
                padding-top: 10px;
            }

            .nav button {
                min-width: 100px;
                padding: 10px 17px;
                font-size: 14px;
            }

            .nav-progress {
                font-size: 15px;
            }
        }

        @media (max-width:480px) {
            .nav {
                gap: 80px;
                margin-top: 8px;
                padding-top: 8px;
            }

            .nav button {
                min-width: 82px;
                padding: 8px 13px;
                font-size: 12px;
            }

            .nav-progress {
                font-size: 13px;
            }

            .emoji-pop {
                font-size: 65px;
            }

            .final-modal {
                width: 92%;
                padding: 30px 20px 28px;
            }

            .final-modal h2 {
                font-size: 26px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/quiz-ui.css">
</head>


<body>

    <div class="quiz">

        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="quiz-header">

            <div class="quiz-title">

                🔷 Closed & Open Figures

                <div class="quiz-subtitle">
                    Let's identify the figures!
                </div>

            </div>

            <div class="score-box" id="scoreBox">

                Score: 0

            </div>

        </div>


        <!-- =================================================
             INSTRUCTION
        ================================================== -->

        <div class="instruction-text">

            Drag ✓ for closed figures and ✕ for open figures into the box.

        </div>


        <!-- =================================================
             QUESTION
        ================================================== -->

        <div class="question-area">

            <div class="question-number" id="questionNumber">
            </div>


            <div class="image-box">

                <img id="questionImage" class="question-image" src="" alt="Question figure">

            </div>


            <!-- =================================================
                 DROP ZONE
            ================================================== -->

            <div class="drop-zone" id="dropZone">
                <span class="drop-zone-hint" id="dropZoneHint">Drag your answer here</span>
                <span class="drop-zone-icon" id="dropZoneIcon"></span>
            </div>


            <!-- =================================================
                 OPTIONS - draggable icon chips
            ================================================== -->

            <div class="options-area">

                <button class="option-btn closed-option" id="closedBtn" type="button" aria-label="Closed figure">

                    <span class="option-icon">✓</span>

                </button>


                <button class="option-btn open-option" id="openBtn" type="button" aria-label="Open figure">

                    <span class="option-icon">✕</span>

                </button>

            </div>


            <!-- =================================================
                 PREVIOUS / NEXT
            ================================================== -->

            <nav class="nav" aria-label="Question navigation">
                <button id="prevBtn" type="button">
                    <i class="fa-solid fa-chevron-left"></i>
                    Prev
                </button>

                <button id="nextBtn" type="button">
                    Next
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </nav>

        </div>

    </div>
    <!-- =====================================================
         ANSWER POPUP
         True/False reference uses animated emoji feedback.
    ====================================================== -->

    <!-- =====================================================
         FINAL POPUP
    ====================================================== -->
    <div id="finalPopup" style="display:none;"></div>

    <!-- =====================================================
         CONFETTI
    ====================================================== -->



    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


    <script>        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }


        /* =====================================================
           QUESTIONS
           Change only image paths / correct answers as needed.
        ===================================================== */

        const questions = [

            {
                number: "a)",
                image: "../assets/images/a1.png",
                correct: "closed"
            },

            {
                number: "b)",
                image: "../assets/images/b2.png",
                correct: "closed"
            },

            {
                number: "c)",
                image: "../assets/images/c3.png",
                correct: "open"
            },

            {
                number: "d)",
                image: "../assets/images/d4.png",
                correct: "closed"
            },

            {
                number: "e)",
                image: "../assets/images/e5.png",
                correct: "closed"
            },

            {
                number: "f)",
                image: "../assets/images/f6.png",
                correct: "open"
            },

            {
                number: "g)",
                image: "../assets/images/g7.png",
                correct: "closed"
            },

            {
                number: "h)",
                image: "../assets/images/h8.png",
                correct: "open"
            },

            {
                number: "i)",
                image: "../assets/images/i9.png",
                correct: "open"
            },

            {
                number: "j)",
                image: "../assets/images/j10.png",
                correct: "closed"
            },

            {
                number: "k)",
                image: "../assets/images/k11.png",
                correct: "closed"
            },

            {
                number: "l)",
                image: "../assets/images/l12.png",
                correct: "open"
            }

        ];

        let currentIndex = 0;
        let score = 0;
        const answers = Array(questions.length).fill(null);
        let audioCtx = null;

        const quizWrap = document.querySelector(".quiz");

        function fitQuizToScreen() {
            quizWrap.style.transform = "translate(-50%, -50%)";
        }

        window.addEventListener("resize", fitQuizToScreen);
        window.addEventListener("load", fitQuizToScreen);

        const questionNumber = document.getElementById("questionNumber");
        const questionImage = document.getElementById("questionImage");
        const closedBtn = document.getElementById("closedBtn");
        const openBtn = document.getElementById("openBtn");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const scoreBox = document.getElementById("scoreBox");
        const dropZone = document.getElementById("dropZone");
        const dropZoneHint = document.getElementById("dropZoneHint");
        const dropZoneIcon = document.getElementById("dropZoneIcon");

        function getCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === "suspended") audioCtx.resume();
            return audioCtx;
        }

        function beep(frequency, duration, type = "sine") {
            try {
                const ctx = getCtx();
                const oscillator = ctx.createOscillator();
                const gain = ctx.createGain();
                oscillator.type = type;
                oscillator.frequency.value = frequency;
                oscillator.connect(gain);
                gain.connect(ctx.destination);
                gain.gain.setValueAtTime(.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(
                    .0001,
                    ctx.currentTime + duration / 1000
                );
                oscillator.start();
                oscillator.stop(ctx.currentTime + duration / 1000);
            } catch (e) { }
        }

        const sound = {
            correct() {
                beep(660, 110);
                setTimeout(() => beep(880, 160), 110);
            },
            wrong() {
                beep(180, 220, "sawtooth");
            },
            finish() {
                [523, 659, 784, 1047].forEach((frequency, index) =>
                    setTimeout(() => beep(frequency, 150), index * 130)
                );
            }
        };

        document.body.addEventListener("click", () => {
            try { getCtx(); } catch (e) { }
        }, { once: true });

        function showEmoji(emoji) {
            const element = document.createElement("div");
            element.className = "emoji-pop";
            element.textContent = emoji;
            document.body.appendChild(element);
            setTimeout(() => element.remove(), 1600);
        }

        function burstConfetti(element) {
            if (typeof confetti !== "function") return;
            const rect = element.getBoundingClientRect();
            confetti({
                particleCount: 34,
                spread: 70,
                startVelocity: 22,
                origin: {
                    x: (rect.left + rect.width / 2) / innerWidth,
                    y: (rect.top + rect.height / 2) / innerHeight
                },
                colors: ["#6635dc", "#ff4e83", "#4e8ff0", "#76b93b", "#f4ae25", "#4ecdc4"]
            });
        }

        function updateScore() {
            scoreBox.textContent = "Score: " + score;
        }

        /* =====================================================
           DRAG & DROP (pointer events - works for mouse + touch)
        ===================================================== */

        function isPointOverDropZone(x, y) {
            const dz = dropZone.getBoundingClientRect();
            return x >= dz.left && x <= dz.right && y >= dz.top && y <= dz.bottom;
        }

        function removeGhosts() {
            document.querySelectorAll(".option-btn-ghost").forEach(g => g.remove());
        }

        function makeDraggable(chip, value) {
            let dragging = false;
            let ghost = null;
            let startX = 0, startY = 0, originRect = null;

            // belt-and-braces: make sure no native HTML5 drag ever kicks in
            chip.addEventListener("dragstart", (e) => e.preventDefault());

            chip.addEventListener("pointerdown", (e) => {
                if (chip.classList.contains("disabled") || answers[currentIndex]) return;
                if (e.button !== undefined && e.button !== 0) return; // left-click / primary touch only

                e.preventDefault();

                dragging = true;
                originRect = chip.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;

                try { chip.setPointerCapture(e.pointerId); } catch (err) { }

                // the real chip stays exactly where it is, just dimmed/blurred
                chip.classList.add("chip-placeholder");

                // a floating copy is what actually follows the pointer
                ghost = chip.cloneNode(true);
                ghost.removeAttribute("id");
                ghost.setAttribute("aria-hidden", "true");
                ghost.tabIndex = -1;
                ghost.classList.remove("chip-placeholder");
                ghost.classList.add("option-btn-ghost", "dragging");
                ghost.style.position = "fixed";
                ghost.style.left = originRect.left + "px";
                ghost.style.top = originRect.top + "px";
                ghost.style.width = originRect.width + "px";
                ghost.style.height = originRect.height + "px";
                ghost.style.margin = "0";
                ghost.style.zIndex = "1000";
                ghost.style.pointerEvents = "none";
                document.body.appendChild(ghost);
            });

            chip.addEventListener("pointermove", (e) => {
                if (!dragging || !ghost) return;
                e.preventDefault();

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                ghost.style.left = (originRect.left + dx) + "px";
                ghost.style.top = (originRect.top + dy) + "px";

                dropZone.classList.toggle(
                    "drop-zone-active",
                    isPointOverDropZone(e.clientX, e.clientY)
                );
            });

            function endDrag(e) {
                if (!dragging) return;
                dragging = false;

                chip.classList.remove("chip-placeholder");
                dropZone.classList.remove("drop-zone-active");

                const overDropZone = isPointOverDropZone(e.clientX, e.clientY);

                if (overDropZone) {
                    if (ghost) ghost.remove();
                    ghost = null;
                    checkAnswer(value, chip);
                    return;
                }

                // not dropped on the target: the ghost snaps back, then disappears
                if (ghost) {
                    const g = ghost;
                    ghost = null;
                    g.style.transition =
                        "left .25s cubic-bezier(.34,1.4,.44,1), top .25s cubic-bezier(.34,1.4,.44,1)";
                    g.style.left = originRect.left + "px";
                    g.style.top = originRect.top + "px";
                    setTimeout(() => g.remove(), 260);
                }
            }

            chip.addEventListener("pointerup", endDrag);
            chip.addEventListener("pointercancel", endDrag);
        }

        makeDraggable(closedBtn, "closed");
        makeDraggable(openBtn, "open");

        function setDropZoneIcon(value) {
            dropZoneIcon.textContent = value === "closed" ? "✓" : "✕";
            dropZoneIcon.classList.toggle("icon-closed", value === "closed");
            dropZoneIcon.classList.toggle("icon-open", value === "open");
            dropZoneHint.style.display = "none";
        }

        function clearDropZone() {
            dropZoneIcon.textContent = "";
            dropZoneIcon.classList.remove("icon-closed", "icon-open");
            dropZoneHint.style.display = "";
        }

        function loadQuestion() {
            const q = questions[currentIndex];

            questionNumber.textContent =
                `${q.number} Figure ${currentIndex + 1} of ${questions.length}`;

            questionImage.src = q.image;
            questionImage.alt = `Figure ${q.number}`;

            updateScore();

            closedBtn.classList.remove("disabled", "chip-placeholder");
            openBtn.classList.remove("disabled", "chip-placeholder");
            removeGhosts();

            dropZone.classList.remove("drop-zone-correct", "drop-zone-wrong", "drop-zone-active");
            clearDropZone();

            if (answers[currentIndex]) {
                closedBtn.classList.add("disabled");
                openBtn.classList.add("disabled");

                dropZone.classList.add("drop-zone-correct");
                setDropZoneIcon(answers[currentIndex]);
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = !answers[currentIndex];

            requestAnimationFrame(fitQuizToScreen);
        }

        function checkAnswer(selected, chip) {
            if (answers[currentIndex]) return;

            const q = questions[currentIndex];

            if (selected !== q.correct) {
                // sound.wrong();
                speak("Wrong!");
                showEmoji("😔");

                setDropZoneIcon(selected);

                dropZone.classList.remove("drop-zone-wrong");
                void dropZone.offsetWidth;
                dropZone.classList.add("drop-zone-wrong");

                setTimeout(() => {
                    dropZone.classList.remove("drop-zone-wrong");
                    clearDropZone();
                }, 650);

                return;
            }

            answers[currentIndex] = selected;
            score++;
            updateScore();

            closedBtn.classList.add("disabled");
            openBtn.classList.add("disabled");

            setDropZoneIcon(selected);
            dropZone.classList.add("drop-zone-correct");

            // sound.correct();
            speak("Correct!");
            showEmoji("🥳");
            burstConfetti(dropZone);

            nextBtn.disabled = false;

            if (currentIndex === questions.length - 1) {
                setTimeout(finishQuiz, 650);
            }
        }

        prevBtn.addEventListener("click", () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        });

        nextBtn.addEventListener("click", () => {
            if (answers[currentIndex] && currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        });

        function finishQuiz() {
            sound.finish();
            showFinalPopup();
        }

        function showFinalPopup() {
            if (document.querySelector(".final-overlay")) return;

            const overlay = document.createElement("div");
            const modal = document.createElement("div");

            overlay.className = "final-overlay";
            modal.className = "final-modal";

            const percentage = (score / questions.length) * 100;
            const message =
                percentage >= 80
                    ? "Excellent work! You identified the figures correctly."
                    : percentage >= 50
                        ? "Good job! Keep practising closed and open figures."
                        : "Nice try! Practise once more and you will improve.";

            modal.innerHTML = `
                <span class="icon-big">🎉</span>
                <h2>All Done!</h2>
                <p>Amazing! You got them all right!</p>
                <button class="btn-playagain" type="button">
                    <i class="fa-solid fa-rotate-right"></i> Play again
                </button>
            `;

            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            setTimeout(() => burstConfetti(modal), 80);
            setTimeout(() => burstConfetti(modal), 350);
            setTimeout(() => burstConfetti(modal), 650);

            modal.querySelector(".btn-playagain").addEventListener("click", () => {
                overlay.remove();
                currentIndex = 0;
                score = 0;
                answers.fill(null);
                loadQuestion();
            });
        }

        loadQuestion();

    </script>

    <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
