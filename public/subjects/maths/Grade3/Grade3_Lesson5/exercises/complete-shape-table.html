<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What is it?</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @font-face {
      font-family: "CCSyntroman";
      src: url("../assets/CCSYNTRO.TTF") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "CCSyntroman", "Baloo 2", sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      height: 100vh;
      overflow: hidden;
      padding: 12px 20px;
      position: relative;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* ================= HEADER ================= */

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0;
    }

    .header h1 {
      color: #12265d;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 400;
    }

    /* ================= QUESTION ================= */

    .question-screen {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0;
    }

    .question-text {
      color: #12265d;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 26px;
      text-align: left;
      max-width: 900px;
      line-height: 1.4;
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ================= SHAPE QUESTION ================= */

    .shape-question-label {
      width: 100%;
      max-width: 100%;
      color: #2f4f4f;
      font-size: 30px;
      font-weight: 400;
      text-align: left;
      margin: 0px auto 14px;
      line-height: 1.25;
      text-align: center;
    }

    .shape-display {
      width: 180px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .shape-display svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .answer-table {
      width: 100%;
      /* max-width: 980px; */
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    .answer-column {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 0px 20px 10px;
      /* border: 2px solid rgba(18, 38, 93, .10);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 7px 0 rgba(18, 38, 93, .12), 0 12px 22px rgba(18, 38, 93, .10); */
      transition: transform .18s ease, box-shadow .18s ease;
    }

    /* .answer-column:nth-child(1) {
      background: #fff7df;
      border-color: #f0cf72;
      box-shadow: 0 7px 0 #dfbe62, 0 12px 22px rgba(18, 38, 93, .10);
    }

    .answer-column:nth-child(2) {
      background: #eaf7ff;
      border-color: #83c9ec;
      box-shadow: 0 7px 0 #63add4, 0 12px 22px rgba(18, 38, 93, .10);
    }

    .answer-column:nth-child(3) {
      background: #f3edff;
      border-color: #bca6ed;
      box-shadow: 0 7px 0 #9f88d7, 0 12px 22px rgba(18, 38, 93, .10);
    } */

    .answer-column:hover {
      transform: translateY(-2px);
    }

    .answer-heading {
      /* position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -50%);
      min-height: auto;
      width: max-content;
      max-width: calc(100% - 28px); */
      border: 2px solid rgba(18, 38, 93, .12);
      border-radius: 999px;
      background: rgba(255, 255, 255, .96);
      color: #12265d;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 18px;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.1;
      white-space: normal;
      z-index: 2;
      box-shadow: 0 3px 0 rgba(18, 38, 93, .10);
    }

    .answer-option {
      width: 80%;
      min-height: 61px;
      margin: 0px auto;
      border: 2px solid rgba(18, 38, 93, .12);
      border-radius: 14px;
      background: rgba(255, 255, 255, .88);
      color: #12265d;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 10px;
      font-size: 21px;
      font-weight: 400;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      box-shadow: 0 4px 0 rgba(18, 38, 93, .10), 0 7px 14px rgba(18, 38, 93, .07);
      transition: transform .12s ease, background .15s ease, border-color .15s ease,
        box-shadow .12s ease, opacity .2s ease;
    }

    /* Button colors are coordinated with each card's background. */
    .answer-column:nth-child(1) .answer-option {
      border-color: #e4bd59;
      background: #fffdf5;
      box-shadow: 0 4px 0 #d8b34f, 0 7px 14px rgba(18, 38, 93, .07);
    }

    .answer-column:nth-child(2) .answer-option {
      border-color: #6db6da;
      background: #f8fdff;
      box-shadow: 0 4px 0 #5da6cb, 0 7px 14px rgba(18, 38, 93, .07);
    }

    .answer-column:nth-child(3) .answer-option {
      border-color: #a996dc;
      background: #fcfaff;
      box-shadow: 0 4px 0 #9681ca, 0 7px 14px rgba(18, 38, 93, .07);
    }

    .answer-option:hover:not(.disabled) {
      transform: translateY(-2px);
      background: #fff;
      box-shadow: 0 6px 0 rgba(18, 38, 93, .13), 0 10px 16px rgba(18, 38, 93, .10);
    }

    .answer-column:nth-child(1) .answer-option:hover:not(.disabled) {
      border-color: #d6ad45;
    }

    .answer-column:nth-child(2) .answer-option:hover:not(.disabled) {
      border-color: #4e9ec7;
    }

    .answer-column:nth-child(3) .answer-option:hover:not(.disabled) {
      border-color: #8d75c7;
    }

    .answer-option:active:not(.disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(18, 38, 93, .12), 0 3px 7px rgba(18, 38, 93, .08);
    }

    .answer-option.correct {
      border-color: #55b449 !important;
      background: inherit !important;
      color: #12265d !important;
      box-shadow: 0 0 0 2px rgba(85, 180, 73, .18),
        0 5px 0 #55b449,
        0 9px 16px rgba(85, 180, 73, .18) !important;
      transform: translateY(-1px);
    }


    @keyframes wrongAnswerBlink {

      0%,
      100% {
        border-color: transparent;
        box-shadow: 0 4px 0 rgba(18, 38, 93, .10),
          0 7px 14px rgba(18, 38, 93, .07);
      }

      25%,
      75% {
        border-color: #ef6b63;
        box-shadow: 0 0 0 3px rgba(239, 107, 99, .22),
          0 5px 18px rgba(239, 107, 99, .28);
      }
    }

    .answer-option.wrong {
      animation: wrongAnswerBlink .6s ease-in-out;
    }

    .answer-option.wrong {
      /* Wrong answer keeps its normal color and stays clickable. */
      opacity: 1;
    }

    .answer-option.disabled {
      cursor: default;
      pointer-events: none;
    }

    .answer-table.all-correct {
      pointer-events: none;
    }

    /* ================= NAV (prev / progress / next in one row) ================= */

    .nav {
      width: 100%;
      margin: auto auto 0;
      padding-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      position: relative;
      z-index: 20;
    }

    .nav-progress {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #12265d;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: .5px;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 400;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    #prevBtn {
      justify-self: start;
    }

    #nextBtn {
      justify-self: end;
    }

    /* ================= SAME EMOJI / POPUP ================= */

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
      background: rgba(18, 38, 93, .10);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 400;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 400;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    /* =====================================================

===================================================== */

<body>
  <main class="quiz-wrap">

    <header class="header">
      <h1>Complete the following table.</h1>
    </header>

    <section class="question-screen">
      <div class="question-text" id="questionText"></div>
      <div class="question-content" id="questionContent"></div>
    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i>
        Prev
      </button>

      <button id="nextBtn" disabled>
        Next
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {

      /* ============== SHAPE ICON LIBRARY (inline SVG, no external assets) ============== */
      /* Restyled to match the reference key: red Triangle, blue Square,
         soft pearl Circle, and a glossy orange Oval. */

      const shapeIcons = {
        triangle: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <linearGradient id="triGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ff7a7a"/>
                        <stop offset="100%" stop-color="#e0313f"/>
                      </linearGradient>
                    </defs>
                    <polygon points="50,10 92,88 8,88" fill="url(#triGrad)" stroke="#c02532" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="50,10 68,44 32,44" fill="#ffffff" opacity=".18"/>
                  </svg>`,
        square: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <linearGradient id="sqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#6fa8ff"/>
                        <stop offset="100%" stop-color="#3169d6"/>
                      </linearGradient>
                    </defs>
                    <rect x="10" y="10" width="80" height="80" rx="12" fill="url(#sqGrad)" stroke="#274f9e" stroke-width="4"/>
                    <rect x="20" y="20" width="28" height="12" rx="6" fill="#ffffff" opacity=".25"/>
                  </svg>`,
        circle: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <radialGradient id="circGrad" cx="36%" cy="30%" r="72%">
                        <stop offset="0%" stop-color="#fbf8ff"/>
                        <stop offset="55%" stop-color="#e3d9ff"/>
                        <stop offset="100%" stop-color="#bdaaf0"/>
                      </radialGradient>
                    </defs>
                    <circle cx="50" cy="50" r="42" fill="url(#circGrad)" stroke="#a693e0" stroke-width="3"/>
                    <ellipse cx="50" cy="88" rx="26" ry="5" fill="#12265d" opacity=".08"/>
                  </svg>`,
        oval: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <radialGradient id="ovalGrad" cx="36%" cy="30%" r="75%">
                        <stop offset="0%" stop-color="#ffdca3"/>
                        <stop offset="55%" stop-color="#ffb347"/>
                        <stop offset="100%" stop-color="#e07b17"/>
                      </radialGradient>
                    </defs>
                    <ellipse cx="50" cy="50" rx="44" ry="34" fill="url(#ovalGrad)" stroke="#c9660f" stroke-width="3"/>
                    <ellipse cx="50" cy="80" rx="24" ry="4.5" fill="#12265d" opacity=".08"/>
                  </svg>`,
        rectangle: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="rectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8fd6b0"/>
                <stop offset="100%" stop-color="#55ad7f"/>
              </linearGradient>
            </defs>
            <rect x="30" y="20" width="40" height="60" rx="5"
                  fill="url(#rectGrad)" stroke="#3d8e67" stroke-width="4"/>
            <rect x="38" y="26" width="28" height="8" rx="4"
                  fill="#ffffff" opacity=".24"/>
          </svg>`
      };

      /* ============== QUESTIONS ============== */

      const questions = [
        {
          shape: "circle",
          name: "Circle",
          sides: "0",
          vertices: "0",
          nameOptions: ["Circle", "Oval"],
          sideOptions: ["0", "1"],
          vertexOptions: ["0", "1"]
        },
        {
          shape: "triangle",
          name: "Triangle",
          sides: "3",
          vertices: "3",
          nameOptions: ["Triangle", "Square"],
          sideOptions: ["3", "4"],
          vertexOptions: ["3", "4"]
        },
        {
          shape: "rectangle",
          name: "Rectangle",
          sides: "4",
          vertices: "4",
          nameOptions: ["Rectangle", "Square"],
          sideOptions: ["4", "3"],
          vertexOptions: ["4", "3"]
        },
        {
          shape: "square",
          name: "Square",
          sides: "4",
          vertices: "4",
          nameOptions: ["Square", "Rectangle"],
          sideOptions: ["4", "3"],
          vertexOptions: ["4", "3"]
        },
        {
          shape: "oval",
          name: "Oval",
          sides: "0",
          vertices: "0",
          nameOptions: ["Oval", "Circle"],
          sideOptions: ["0", "4"],
          vertexOptions: ["0", "4"]
        },
      ];

      const questionText = document.getElementById("questionText");
      const content = document.getElementById("questionContent");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let current = 0;
      const completed = Array(questions.length).fill(false);
      let audioCtx = null;

      const quizWrap = document.querySelector(".quiz-wrap");

      function fitQuizToScreen() {
        quizWrap.style.transform = "translate(-50%, -50%)";
        const rect = quizWrap.getBoundingClientRect();
        const availableH = window.innerHeight - 16;
        const availableW = window.innerWidth - 16;
        const scale = Math.min(availableH / rect.height, availableW / rect.width);
        quizWrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }

      window.addEventListener("resize", fitQuizToScreen);
      window.addEventListener("load", fitQuizToScreen);

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);

        setTimeout(() => element.remove(), 1600);
      }

      function renderQuestion(index) {
        const q = questions[index];
        current = index;

        questionText.textContent = "";
        content.innerHTML = "";

        const questionLabel = document.createElement("div");
        questionLabel.className = "shape-question-label";
        questionLabel.textContent = `Question ${index + 1}: What is this shape?`;

        const shapeDisplay = document.createElement("div");
        shapeDisplay.className = "shape-display";
        shapeDisplay.innerHTML = shapeIcons[q.shape];

        const answerTable = document.createElement("div");
        answerTable.className = "answer-table";

        const columns = [
          { title: "Name", values: q.nameOptions, answer: q.name },
          { title: "Number of sides", values: q.sideOptions, answer: q.sides },
          { title: "Number of vertices/corners", values: q.vertexOptions, answer: q.vertices }
        ];

        let correctCount = 0;
        const optionItems = [];

        columns.forEach(column => {
          const answerColumn = document.createElement("div");
          answerColumn.className = "answer-column";

          const heading = document.createElement("div");
          heading.className = "answer-heading";
          heading.textContent = column.title;
          answerColumn.appendChild(heading);

          const shuffledValues = [...new Set(column.values)];
          for (let i = shuffledValues.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledValues[i], shuffledValues[j]] = [shuffledValues[j], shuffledValues[i]];
          }

          shuffledValues.forEach(value => {
            const option = document.createElement("div");
            option.className = "answer-option";
            option.textContent = value;
            option.setAttribute("role", "button");
            option.setAttribute("tabindex", "0");

            const choose = () => {
              if (option.classList.contains("disabled") || completed[index]) return;

              if (String(value).toLowerCase() !== String(column.answer).toLowerCase()) {
                sound.wrong();
                showEmoji("😔");

                option.classList.add("wrong");
                setTimeout(() => option.classList.remove("wrong"), 600);
                return;
              }

              option.classList.add("correct", "disabled");
              [...answerColumn.querySelectorAll(".answer-option")].forEach(item => {
                item.classList.add("disabled");
                if (item !== option) {
                  item.style.opacity = ".4";
                }
              });
              correctCount++;

              sound.correct();
              showEmoji("🥳");

              if (correctCount === columns.length) {
                completed[index] = true;
                answerTable.classList.add("all-correct");

                optionItems.forEach(item => item.classList.add("disabled"));

                burstConfetti(answerTable);
                nextBtn.disabled = false;

                if (index === questions.length - 1) {
                  setTimeout(finishQuiz, 650);
                }
              }
            };

            option.addEventListener("click", choose);
            option.addEventListener("keydown", e => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                choose();
              }
            });

            answerColumn.appendChild(option);
            optionItems.push(option);
          });

          answerTable.appendChild(answerColumn);
        });

        content.appendChild(questionLabel);
        content.appendChild(shapeDisplay);
        content.appendChild(answerTable);

        if (completed[index]) {
          answerTable.classList.add("all-correct");
          optionItems.forEach(item => {
            item.classList.add("disabled");
            const parentTitle = item.parentElement.querySelector(".answer-heading").textContent;
            const column = columns.find(c => c.title === parentTitle);
            if (column && String(item.textContent).toLowerCase() === String(column.answer).toLowerCase()) {
              item.classList.add("correct");
            }
          });
        }

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !completed[index];

        requestAnimationFrame(fitQuizToScreen);
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i>
        Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          completed.fill(false);
          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) renderQuestion(current - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (completed[current] && current < questions.length - 1) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);

    })();
  </script>
<script src="../../shared/quiz-ui.js"></script>
</body>

</html>
