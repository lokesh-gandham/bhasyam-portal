<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What is it?</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @font-face {
      font-family: "CCSyntroman";
      src: url("../assets/CCSYNTRO.TTF") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "CCSyntroman", "Baloo 2", sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      height: 100vh;
      overflow: hidden;
      padding: 12px 20px;
      background: #fbf7f0;
      position: relative;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0;
    }

    .header h1 {
      color: #12265d;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 400;
    }

    .question-screen {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0;
      margin-inline: auto;
    }

    .question-text {
      color: #12265d;
      font-size: 30px;
      font-weight: 400;
      margin-bottom: 26px;
      text-align: left;
      max-width: 900px;
      line-height: 1.4;
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .shape-question-label {
      width: 100%;
      max-width: 900px;
      color: #12265d;
      font-size: 30px;
      font-weight: 400;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.25;
    }

    .statement-game {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .statement-card {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      padding: 0 4px 14px;
      margin: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .statement-text {
      color: #2f4f4f;
      font-size: 30px;
      font-weight: 400;
      line-height: 1.5;
      margin: 0;
    }

    .choice-area {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 4px;
    }

    .tf-choice {
      position: relative;
      width: 150px;
      height: 118px;
      border: 3px solid;
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-family: inherit;
      font-size: 22px;
      font-weight: 400;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }

    .tf-choice i {
      font-size: 40px;
      line-height: 1;
    }

    .tf-choice span {
      font-size: 20px;
      line-height: 1;
    }

    .tf-choice.true-choice {
      border-color: #79c7b0;
      background: linear-gradient(145deg, #eefbf6 0%, #d6f3e8 100%);
      color: #28745f;
      box-shadow: 0 7px 0 #a8d8c9, 0 12px 22px rgba(53, 133, 111, .13);
    }

    .tf-choice.false-choice {
      border-color: #e2bd76;
      background: linear-gradient(145deg, #fff9e8 0%, #ffedc3 100%);
      color: #8a6729;
      box-shadow: 0 7px 0 #efd49e, 0 12px 22px rgba(181, 141, 64, .13);
    }

    .tf-choice:hover:not(.disabled) {
      transform: translateY(-5px);
    }

    .tf-choice:active,
    .tf-choice.dragging {
      cursor: grabbing;
      transform: scale(.96);
    }

    .tf-choice.dragging {
      opacity: .45;
    }

    .tf-choice.disabled {
      pointer-events: none;
      opacity: .35;
    }

    .tf-drop-zone {
      width: min(300px, 42vw);
      height: 108px;
      border: 3px dashed #b9c5d4;
      border-radius: 24px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #8c98a8;
      font-size: 18px;
      font-weight: 400;
      transition: border-color .18s ease, background .18s ease, transform .15s ease, box-shadow .18s ease;
    }

    .tf-drop-zone.drag-over {
      border-color: #78a9d7;
      background: #eef6ff;
      transform: scale(1.04);
      box-shadow: 0 0 0 5px rgba(120, 169, 215, .10);
    }

    .tf-drop-zone.dropped {
      border-style: solid;
      border-color: #86c5b2;
      background: #f0faf6;
    }

    .drop-result {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 17px;
      font-weight: 400;
    }

    .drop-result i {
      font-size: 38px;
    }

    .drop-result.true-result {
      color: #28745f;
    }

    .drop-result.false-result {
      color: #8a6729;
    }

    .drag-hint {
      color: #8d98a6;
      font-size: 14px;
      text-align: center;
    }

    .fix-choice-area {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .fix-choice {
      min-height: 76px;
      padding: 12px 16px;
      border: 2px solid #b8c7dd;
      border-radius: 18px;
      background: #ffffff;
      color: #263657;
      font-family: inherit;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.35;
      cursor: pointer;
      box-shadow: 0 6px 0 #dbe2ed;
      transition: transform .12s ease, box-shadow .12s ease,
        border-color .15s ease, background .15s ease,
        opacity .15s ease;
    }

    .fix-choice:first-child {
      border-color: #8ab7df;
      background: #f3f9ff;
      box-shadow: 0 6px 0 #c9ddf0;
    }

    .fix-choice:last-child {
      border-color: #c0a3df;
      background: #faf5ff;
      box-shadow: 0 6px 0 #e0d2ef;
    }

    .fix-choice:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: #6f94bd;
      box-shadow: 0 9px 0 #d0dce9;
    }

    .fix-choice:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #d8e0eb;
    }

    .fix-choice.correct-choice {
      opacity: 1 !important;
      border-color: #42b85e !important;
      background: #edfff2 !important;
      color: #207e39 !important;
      box-shadow: 0 0 0 4px rgba(66, 184, 94, .15),
        0 7px 18px rgba(66, 184, 94, .22) !important;
    }

    .fix-choice.wrong-selected {
      opacity: .4 !important;
    }

    .fix-choice.wrong-choice {
      animation: choiceWrong .65s ease-in-out;
    }

    .fix-panel {
      width: 100%;
      box-sizing: border-box;
      padding: 20px 22px;
      border-radius: 19px;
      background: #effff4;
      border: 2px solid #8cdda2;
      box-shadow: 0 5px 0 rgba(66, 163, 91, .10);
      display: none;
      animation: fixIn .25s ease-out;
    }

    .fix-panel.show {
      display: block;
    }

    @keyframes fixIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fix-title {
      color: #238344;
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 11px;
      text-align: center;
    }

    .fix-entry {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .fix-input {
      width: 68%;
      min-width: 0;
      height: 52px;
      box-sizing: border-box;
      border: 2px solid #b9c8bf;
      border-radius: 13px;
      background: #fff;
      color: #173c25;
      padding: 8px 13px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 400;
      outline: none;
      box-shadow: 0 4px 0 rgba(18, 38, 93, .06);
      transition: .15s ease;
    }

    .fix-input:focus {
      border-color: #4fbd65;
      box-shadow: 0 0 0 4px rgba(79, 189, 101, .15),
        0 5px 12px rgba(18, 38, 93, .10);
      transform: translateY(-2px);
    }

    .fix-input.correct {
      border-color: #45b85a !important;
      background: #f4fff6 !important;
      color: #23843a !important;
      box-shadow: 0 0 0 4px rgba(69, 184, 90, .14),
        0 6px 16px rgba(69, 184, 90, .18) !important;
    }

    .fix-input.wrong-blink {
      animation: fixWrong .65s ease-in-out;
    }

    @keyframes fixWrong {

      0%,
      100% {
        border-color: #b9c8bf;
        box-shadow: 0 4px 0 rgba(18, 38, 93, .06);
      }

      35%,
      70% {
        border-color: #ef7770 !important;
        box-shadow: 0 0 0 4px rgba(239, 119, 112, .14),
          0 0 16px rgba(239, 119, 112, .20) !important;
      }
    }

    .fix-check {
      height: 52px;
      min-width: 84px;
      border: 2px solid #43a95c;
      border-radius: 13px;
      background: #43a95c;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 400;
      cursor: pointer;
      box-shadow: 0 4px 0 #318444;
      transition: transform .12s ease, box-shadow .12s ease, opacity .15s ease;
    }

    .fix-check:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #318444;
    }

    .fix-check:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: none;
    }

    .reward-message {
      display: none;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      border-radius: 14px;
      background: #fff3b8;
      border: 2px solid #ffd65b;
      color: #745300;
      text-align: center;
      font-size: 17px;
      font-weight: 400;
      animation: rewardPop .25s ease-out;
    }

    .reward-message.show {
      display: block;
    }

    @keyframes rewardPop {
      from {
        opacity: 0;
        transform: scale(.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .nav {
      width: 100%;
      margin: auto auto 0;
      padding-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      position: relative;
      z-index: 20;
    }

    .nav-progress {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #12265d;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: .5px;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 400;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    #prevBtn {
      justify-self: start;
    }

    #nextBtn {
      justify-self: end;
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
      background: rgba(18, 38, 93, .10);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 400;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 400;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .question-number {
      display: block;
      width: fit-content;
      margin: 0 auto 12px;
      color: #12265d;
      font-size: 22px;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: .2px;
      text-align: center;
    }

    /* ================= RESPONSIVE LAYOUT =================
       Responsive behavior matched to the supplied reference:
       - desktop grows progressively
       - tablet/mobile use fluid widths
       - navigation stays inside the viewport
       - statement/correction content wraps instead of overflowing
       - existing quiz/game behavior and styling are preserved
    ========================================================= */

    .quiz-wrap {
      width: min(100%, 1380px);
    }

    .question-screen,
    .question-content,
    .statement-game,
    .fix-panel {
      min-width: 0;
    }

    .question-text,
    .shape-question-label,
    .statement-text,
    .fix-choice {
      overflow-wrap: anywhere;
      word-break: normal;
    }

    /* 1025px – 1440px */
    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        width: min(96vw, 1380px);
        max-width: 1380px;
      }

      .header {
        padding: 10px 0 8px;
      }

      .header h1 {
        font-size: 35px;
      }

      .question-screen {
        width: 100%;
        padding-top: 6px;
      }

      .question-number {
        font-size: 24px;
        margin-bottom: 12px;
      }

      .question-text {
        width: min(94%, 1100px);
        max-width: 1100px;
        font-size: 30px;
        margin-bottom: 22px;
      }

      .question-content {
        width: min(96%, 1160px);
        max-width: 1160px;
      }

      .statement-game {
        width: min(100%, 1000px);
        max-width: 1000px;
        gap: 18px;
      }

      .statement-card {
        width: 100%;
        padding: 0 8px 14px;
      }

      .statement-text {
        font-size: 30px;
        line-height: 1.45;
        text-align: center;
      }

      .choice-area {
        width: 100%;
        gap: 22px;
        margin-top: 0;
      }

      .tf-choice {
        width: 150px;
        height: 118px;
      }

      .tf-drop-zone {
        width: min(300px, 34vw);
        height: 108px;
      }

      .fix-panel {
        width: 100%;
        padding: 20px 22px;
      }

      .fix-choice-area {
        width: 100%;
        gap: 13px;
      }

      .fix-choice {
        min-width: 0;
      }

      .nav {
        width: 100%;
        gap: clamp(80px, 10vw, 150px);
        padding-top: 18px;
      }

      .nav button {
        width: 150px;
        min-width: 150px;
        height: 55px;
        padding: 0;
        font-size: 20px;
      }
    }

    /* 1441px – 1920px */
    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .quiz-wrap {
        width: min(90vw, 1640px);
        max-width: 1640px;
      }

      .header {
        width: 100%;
        padding-top: clamp(16px, 1.2vw, 24px);
        padding-bottom: clamp(10px, .8vw, 16px);
      }

      .header h1 {
        font-size: clamp(35px, 2.1vw, 40px);
      }

      .question-screen {
        width: min(94%, 1500px);
        padding-top: clamp(14px, 1vw, 22px);
      }

      .question-number {
        width: 100%;
        margin-bottom: clamp(14px, 1vw, 24px);
        font-size: clamp(24px, 1.5vw, 28px);
      }

      .question-text {
        width: min(94%, 1500px);
        max-width: 1500px;
        font-size: clamp(30px, 1.8vw, 36px);
        margin-bottom: clamp(22px, 1.5vw, 34px);
      }

      .question-content {
        width: min(96%, 1550px);
        max-width: 1550px;
      }

      .statement-game {
        width: min(100%, 1450px);
        max-width: 1450px;
        gap: clamp(20px, 1.2vw, 30px);
      }

      .statement-card {
        width: 100%;
        padding: 0 clamp(8px, .5vw, 14px) clamp(16px, 1vw, 24px);
      }

      .statement-text {
        font-size: clamp(30px, 1.8vw, 36px);
        line-height: 1.45;
        text-align: center;
      }

      .choice-area {
        width: 100%;
        gap: clamp(26px, 1.8vw, 38px);
        margin-top: 0;
      }

      .tf-choice {
        width: clamp(150px, 11vw, 180px);
        height: clamp(118px, 8vw, 140px);
        border-radius: clamp(26px, 1.8vw, 32px);
      }

      .tf-choice i {
        font-size: clamp(40px, 2.5vw, 48px);
      }

      .tf-choice span {
        font-size: clamp(20px, 1.3vw, 24px);
      }

      .tf-drop-zone {
        width: clamp(300px, 20vw, 360px);
        height: clamp(108px, 7vw, 128px);
        border-radius: clamp(24px, 1.5vw, 30px);
        font-size: clamp(18px, 1.1vw, 21px);
      }

      .fix-panel {
        width: 100%;
        padding: clamp(22px, 1.3vw, 30px) clamp(24px, 1.5vw, 34px);
        border-radius: clamp(20px, 1.2vw, 26px);
      }

      .fix-choice-area {
        width: 100%;
        gap: clamp(14px, 1vw, 20px);
      }

      .fix-choice {
        min-height: clamp(78px, 5vw, 96px);
        padding: clamp(13px, .8vw, 18px) clamp(16px, 1vw, 24px);
        border-radius: clamp(18px, 1vw, 22px);
        font-size: clamp(17px, 1.05vw, 20px);
      }

      .fix-entry {
        gap: clamp(8px, .6vw, 12px);
      }

      .fix-input {
        height: clamp(54px, 3.5vw, 64px);
      }

      .fix-check {
        height: clamp(54px, 3.5vw, 64px);
        min-width: clamp(88px, 6vw, 110px);
      }

      .reward-message {
        padding: clamp(13px, .8vw, 18px) clamp(18px, 1vw, 24px);
        border-radius: clamp(14px, .8vw, 18px);
      }

      .nav {
        width: 100%;
        margin-top: clamp(20px, 1.5vw, 34px);
        padding-top: clamp(18px, 1.2vw, 28px);
        gap: clamp(140px, 12vw, 280px);
      }

      .nav button {
        width: 160px;
        min-width: 160px;
        height: 58px;
        padding: 0;
      }
    }

    /* 1921px+ */
    @media screen and (min-width: 1921px) {
      .quiz-wrap {
        width: min(90vw, 2050px);
        max-width: 2050px;
      }

      .header {
        width: 100%;
        padding-top: clamp(20px, 1.2vw, 30px);
        padding-bottom: clamp(12px, .8vw, 20px);
      }

      .header h1 {
        font-size: clamp(38px, 2vw, 46px);
      }

      .question-screen {
        width: min(94%, 1850px);
        padding-top: clamp(16px, 1vw, 26px);
      }

      .question-number {
        width: 100%;
        margin-bottom: clamp(18px, 1vw, 28px);
        font-size: clamp(26px, 1.4vw, 32px);
      }

      .question-text {
        width: min(95%, 1900px);
        max-width: 1900px;
        font-size: clamp(32px, 1.7vw, 42px);
        margin-bottom: clamp(28px, 1.6vw, 42px);
      }

      .question-content {
        width: min(96%, 1950px);
        max-width: 1950px;
      }

      .statement-game {
        width: min(100%, 1850px);
        max-width: 1850px;
        gap: clamp(24px, 1.2vw, 36px);
      }

      .statement-card {
        width: 100%;

  </style>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/quiz-ui.css">
</head>

<body>
  <main class="quiz-wrap">

    <header class="header">
      <h1>Correct the statements.</h1>
    </header>

    <section class="question-screen">
      <div class="question-number" id="questionNumber">Question 1</div>
      <div class="question-text" id="questionText"></div>
      <div class="question-content" id="questionContent"></div>
    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i>
        Prev
      </button>

      <button id="nextBtn" disabled>
        Next
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>        function speak(t) {
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-US";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }
    (() => {

      const questions = [
        {
          statement: "The shapes that have length, breadth and height are called plane shapes.",
          correct: false,
          fix: "The shapes that have length, breadth and height are called solid shapes.",
          fixOptions: [
            {
              text: "The shapes that have length, breadth and height are called solid shapes.",
              correct: true
            },
            {
              text: "The shapes that have length and breadth only are called solid shapes.",
              correct: false
            }
          ]
        },
        {
          statement: "All solid shapes are called two dimensional shapes.",
          correct: false,
          fix: "All solid shapes are called three dimensional shapes or All plane shapes are called two dimensional shapes.",
          fixOptions: [
            {
              text: "All solid shapes are called three dimensional shapes or All plane shapes are called two dimensional shapes.",
              correct: true
            },
            {
              text: "All solid shapes are called one dimensional shapes.",
              correct: false
            }
          ]
        },
        {
          statement: "A sphere and a circle are 2D shapes.",
          correct: false,
          fix: "A square and a circle are 2D shapes.",
          fixOptions: [
            {
              text: "A square and a circle are 2D shapes.",
              correct: true
            },
            {
              text: "A square and a sphere are 2D shapes.",
              correct: false
            }
          ]
        },
        {
          statement: "A cone has 2 circular faces, 1 curved face, 2 edges and 1 vertex.",
          correct: false,
          fix: "A cone has 1 circular face, 1 curved face, 1 edge and 1 vertex.",
          fixOptions: [
            {
              text: "A cone has 1 circular face, 1 curved face, 1 edge and 1 vertex.",
              correct: true
            },
            {
              text: "A cone has 1 circular face, 1 curved face, 2 edges and 1 vertex.",
              correct: false
            }
          ]
        }
      ];

      const questionNumber = document.getElementById("questionNumber");
      const questionText = document.getElementById("questionText");
      const content = document.getElementById("questionContent");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let current = 0;
      const completed = Array(questions.length).fill(false);
      let audioCtx = null;

      const quizWrap = document.querySelector(".quiz-wrap");

      function fitQuizToScreen() {
        quizWrap.style.transform = "translate(-50%, -50%)";
        const rect = quizWrap.getBoundingClientRect();
        const availableH = window.innerHeight - 16;
        const availableW = window.innerWidth - 16;
        const scale = Math.min(availableH / rect.height, availableW / rect.width);
        quizWrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }

      window.addEventListener("resize", fitQuizToScreen);
      window.addEventListener("load", fitQuizToScreen);

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);

        setTimeout(() => element.remove(), 1600);
      }

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function updateProgress() {
        const number = current + 1;
        questionNumber.textContent = `Question ${number}`;
      }

      function renderQuestion(index) {
        const q = questions[index];
        current = index;

        questionText.textContent = "";
        updateProgress();
        content.innerHTML = "";

        const game = document.createElement("div");
        game.className = "statement-game";

        const card = document.createElement("div");
        card.className = "statement-card";

        const statement = document.createElement("p");
        statement.className = "statement-text";
        statement.textContent = q.statement;
        card.appendChild(statement);

        const choices = document.createElement("div");
        choices.className = "choice-area";

        const trueChoice = document.createElement("div");
        trueChoice.className = "tf-choice true-choice";
        trueChoice.setAttribute("draggable", "true");
        trueChoice.innerHTML = `<i class="fa-solid fa-check"></i><span>TRUE</span>`;

        const dropZone = document.createElement("div");
        dropZone.className = "tf-drop-zone";
        dropZone.innerHTML = `<span>Drop answer here</span>`;

        const falseChoice = document.createElement("div");
        falseChoice.className = "tf-choice false-choice";
        falseChoice.setAttribute("draggable", "true");
        falseChoice.innerHTML = `<i class="fa-solid fa-xmark"></i><span>FALSE</span>`;

        choices.appendChild(trueChoice);
        choices.appendChild(dropZone);
        choices.appendChild(falseChoice);

        const dragHint = document.createElement("div");
        dragHint.className = "drag-hint";
        dragHint.textContent = "Drag TRUE or FALSE into the box";

        const fixPanel = document.createElement("div");
        fixPanel.className = "fix-panel";

        const fixTitle = document.createElement("div");
        fixTitle.className = "fix-title";
        fixTitle.textContent = "Choose the correct statement";
        fixPanel.appendChild(fixTitle);

        const fixChoices = document.createElement("div");
        fixChoices.className = "fix-choice-area";

        let answeredTF = false;
        let dragSource = null;

        function showDropResult(selected) {
          dropZone.classList.add("dropped");
          dropZone.innerHTML = `
            <div class="drop-result ${selected === "true" ? "true-result" : "false-result"}">
              <i class="fa-solid ${selected === "true" ? "fa-check" : "fa-xmark"}"></i>
              <span>${selected === "true" ? "TRUE" : "FALSE"}</span>
            </div>
          `;
        }

        function completeQuestion() {
          completed[index] = true;
          speak("Correct!");
          showEmoji("🥳");
          burstConfetti(game);
          nextBtn.disabled = false;

          if (index === questions.length - 1) {
            setTimeout(finishQuiz, 650);
          }
        }

        function handleTFDrop(selected) {
          if (answeredTF || completed[index]) return;
          if (selected !== "true" && selected !== "false") return;

          answeredTF = true;
          showDropResult(selected);

          const isCorrect = (selected === "true") === q.correct;
          const source = selected === "true" ? trueChoice : falseChoice;
          source.classList.remove("dragging");

          if (!isCorrect) {
            speak("Wrong!");
            showEmoji("😔");
            dropZone.classList.remove("dropped");
            dropZone.classList.add("wrong-choice");
            dropZone.innerHTML = `<span>Try again</span>`;

            setTimeout(() => {
              dropZone.classList.remove("wrong-choice");
              answeredTF = false;
            }, 700);
            return;
          }

          if (q.correct) {
            trueChoice.classList.add("disabled");
            falseChoice.classList.add("disabled");
            completeQuestion();
            return;
          }

          // A correct FALSE answer moves to the correction step.
          trueChoice.classList.add("disabled");
          falseChoice.classList.add("disabled");
          fixPanel.classList.add("show");
          game.appendChild(fixPanel);
        }

        function setupDrag(choice, value) {
          choice.addEventListener("dragstart", event => {
            if (answeredTF) {
              event.preventDefault();
              return;
            }
            dragSource = value;
            choice.classList.add("dragging");
            if (event.dataTransfer) {
              event.dataTransfer.effectAllowed = "move";
              event.dataTransfer.setData("text/plain", value);
            }
          });

          choice.addEventListener("dragend", () => {
            choice.classList.remove("dragging");
            dragSource = null;
            dropZone.classList.remove("drag-over");
          });

          // Pointer/touch drag so the game also works on touch screens.
          let pointerDragging = false;
          let ghost = null;

          choice.addEventListener("pointerdown", event => {
            if (answeredTF || event.pointerType === "mouse") return;
            event.preventDefault();
            pointerDragging = true;
            dragSource = value;
            choice.setPointerCapture?.(event.pointerId);
            choice.classList.add("dragging");

            ghost = choice.cloneNode(true);
            ghost.style.position = "fixed";
            ghost.style.pointerEvents = "none";
            ghost.style.zIndex = "99999";
            ghost.style.width = `${choice.getBoundingClientRect().width}px`;
            ghost.style.height = `${choice.getBoundingClientRect().height}px`;
            ghost.style.opacity = ".8";
            ghost.style.transform = "scale(.92)";
            document.body.appendChild(ghost);
            moveGhost(event.clientX, event.clientY);
          });

          choice.addEventListener("pointermove", event => {
            if (!pointerDragging) return;
            moveGhost(event.clientX, event.clientY);
            const target = document.elementFromPoint(event.clientX, event.clientY);
            const over = target && (target === dropZone || dropZone.contains(target));
            dropZone.classList.toggle("drag-over", !!over);
          });

          choice.addEventListener("pointerup", event => {
            if (!pointerDragging) return;
            pointerDragging = false;
            choice.classList.remove("dragging");
            ghost?.remove();
            ghost = null;

            const target = document.elementFromPoint(event.clientX, event.clientY);
            const over = target && (target === dropZone || dropZone.contains(target));
            dropZone.classList.remove("drag-over");
            if (over) handleTFDrop(value);
            dragSource = null;
          });

          choice.addEventListener("pointercancel", () => {
            pointerDragging = false;
            choice.classList.remove("dragging");
            ghost?.remove();
            ghost = null;
            dropZone.classList.remove("drag-over");
            dragSource = null;
          });
        }

        function moveGhost(x, y) {
          if (!ghost) return;
          ghost.style.left = `${x - ghost.offsetWidth / 2}px`;
          ghost.style.top = `${y - ghost.offsetHeight / 2}px`;
        }

        setupDrag(trueChoice, "true");
        setupDrag(falseChoice, "false");

        dropZone.addEventListener("dragover", event => {
          if (answeredTF) return;
          event.preventDefault();
          dropZone.classList.add("drag-over");
        });

        dropZone.addEventListener("dragleave", () => {
          dropZone.classList.remove("drag-over");
        });

        dropZone.addEventListener("drop", event => {
          event.preventDefault();
          dropZone.classList.remove("drag-over");
          const selected = event.dataTransfer?.getData("text/plain") || dragSource;
          handleTFDrop(selected);
        });

        if (!q.correct) {
          q.fixOptions.forEach(option => {
            const fixButton = document.createElement("button");
            fixButton.className = "fix-choice";
            fixButton.type = "button";
            fixButton.textContent = option.text;

            fixButton.addEventListener("click", () => {
              if (completed[index] || !answeredTF) return;

              if (!option.correct) {
                speak("Wrong!");
                showEmoji("😔");
                fixButton.classList.remove("wrong-choice");
                void fixButton.offsetWidth;
                fixButton.classList.add("wrong-choice");
                fixButton.classList.add("wrong-selected");
                setTimeout(() => {
                  fixButton.classList.remove("wrong-choice");
                  fixButton.classList.remove("wrong-selected");
                }, 700);
                return;
              }

              fixButton.classList.add("correct-choice");
              fixChoices.querySelectorAll(".fix-choice").forEach(item => {
                item.disabled = true;
              });

              completeQuestion();
            });

            fixChoices.appendChild(fixButton);
          });
          fixPanel.appendChild(fixChoices);
        }

        game.appendChild(card);
        game.appendChild(choices);
        game.appendChild(dragHint);
        content.appendChild(game);

        if (completed[index]) {
          answeredTF = true;
          showDropResult(q.correct ? "true" : "false");
          trueChoice.classList.add("disabled");
          falseChoice.classList.add("disabled");

          if (!q.correct) {
            fixPanel.classList.add("show");
            game.appendChild(fixPanel);
            const correctFix = fixChoices.querySelector(".fix-choice");
            if (correctFix) correctFix.classList.add("correct-choice");
            fixChoices.querySelectorAll(".fix-choice").forEach(item => item.disabled = true);
          }
        }

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !completed[index];

        requestAnimationFrame(fitQuizToScreen);
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i>
        Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          completed.fill(false);
          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) renderQuestion(current - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (completed[current] && current < questions.length - 1) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);

    })();
  </script>
  <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
