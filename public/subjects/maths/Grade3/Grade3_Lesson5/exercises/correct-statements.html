<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What is it?</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @font-face {
      font-family: "CCSyntroman";
      src: url("../assets/CCSYNTRO.TTF") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "CCSyntroman", "Baloo 2", sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      height: 100vh;
      overflow: hidden;
      padding: 12px 20px;
      background: #fbf7f0;
      position: relative;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0;
    }

    .header h1 {
      color: #12265d;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 400;
    }

    .question-screen {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0;
    }

    .question-text {
      color: #12265d;
      font-size: 30px;
      font-weight: 400;
      margin-bottom: 26px;
      text-align: left;
      max-width: 900px;
      line-height: 1.4;
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .shape-question-label {
      width: 100%;
      max-width: 900px;
      color: #12265d;
      font-size: 30px;
      font-weight: 400;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.25;
    }

    .statement-game {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .statement-card {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      padding: 0 4px 14px;
      margin: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .statement-text {
      color: #2f4f4f;
      font-size: 30px;
      font-weight: 400;
      line-height: 1.5;
      margin: 0;
    }

    .choice-area {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin-top: 4px;
      align-items: stretch;
    }

    .choice-button {
      position: relative;
      width: 100%;
      min-height: 250px;
      padding: 28px 30px;
      border: 3px solid #7fc8e8;
      border-radius: 28px;
      background:
        radial-gradient(circle at 15% 18%, rgba(255, 255, 255, .95) 0 7%, transparent 8%),
        radial-gradient(circle at 88% 82%, rgba(255, 255, 255, .55) 0 6%, transparent 7%),
        linear-gradient(145deg, #e8faff 0%, #c9efff 52%, #dff8ff 100%);
      color: #24506b;
      box-shadow:
        0 8px 0 #8ccfe7,
        0 14px 26px rgba(62, 137, 169, .16);
      font-size: 24px;
      font-weight: 400;
      line-height: 1.45;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }

    .choice-button::before {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      left: -28px;
      top: -28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .42);
      pointer-events: none;
    }

    .choice-button::after {
      content: "★";
      position: absolute;
      right: 14px;
      top: 10px;
      font-size: 19px;
      opacity: .42;
      transform: rotate(12deg);
      pointer-events: none;
    }

    .choice-button:hover:not(:disabled) {
      transform: translateY(-5px) rotate(-.3deg);
      filter: saturate(1.05);
      box-shadow:
        0 12px 0 #8ccfe7,
        0 19px 32px rgba(62, 137, 169, .2);
    }

    .choice-button:nth-child(2) {
      border-color: #f2b85d;
      background:
        radial-gradient(circle at 15% 18%, rgba(255, 255, 255, .95) 0 7%, transparent 8%),
        radial-gradient(circle at 88% 82%, rgba(255, 255, 255, .5) 0 6%, transparent 7%),
        linear-gradient(145deg, #fff7d9 0%, #ffe8a9 52%, #fff1c7 100%);
      color: #72501d;
      box-shadow:
        0 8px 0 #f2c978,
        0 14px 26px rgba(191, 143, 53, .15);
    }

    .choice-button:nth-child(2):hover:not(:disabled) {
      box-shadow:
        0 12px 0 #f2c978,
        0 19px 32px rgba(191, 143, 53, .2);
    }

    .choice-button:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 4px 0 #b9c9d8, 0 8px 14px rgba(18, 38, 93, .08);
    }

    .choice-button.statement-not-selected {
      opacity: .4;
      transform: none;
      filter: saturate(.7);
      box-shadow: 0 5px 0 #d5dce5, 0 9px 18px rgba(18, 38, 93, .06);
    }

    .choice-button.statement-correct {
      border-color: #55b86a;
      background:
        radial-gradient(circle at 15% 18%, rgba(255, 255, 255, .95) 0 7%, transparent 8%),
        radial-gradient(circle at 88% 82%, rgba(255, 255, 255, .5) 0 6%, transparent 7%),
        linear-gradient(145deg, #edfff0 0%, #c9f3d0 52%, #e2fbe6 100%);
      color: #216a34;
      box-shadow: 0 8px 0 #8fd39a, 0 14px 28px rgba(51, 143, 70, .18);
      transform: translateY(-2px);
    }

    .choice-button.statement-correct::after {
      content: "✓";
      font-size: 24px;
      opacity: 1;
      color: #2e9b49;
      transform: rotate(0);
    }

    .choice-button.correct-choice {
      opacity: 1 !important;
      border-color: #3caf5a !important;
      background: #ecfff1 !important;
      color: #21803a !important;
      box-shadow: 0 0 0 4px rgba(60, 175, 90, .14),
        0 6px 16px rgba(60, 175, 90, .22) !important;
    }

    .choice-button.wrong-selected {
      opacity: .4 !important;
    }

    .choice-button.wrong-choice {
      animation: choiceWrong .65s ease-in-out;
    }

    @keyframes choiceWrong {

      0%,
      100% {
        border-color: #d8dfeb;
        background: #fff;
        box-shadow: 0 5px 0 #d9dfeb;
      }

      35%,
      70% {
        border-color: #ef7770 !important;
        background: #fff7f6 !important;
        box-shadow: 0 0 0 4px rgba(239, 119, 112, .13),
          0 0 16px rgba(239, 119, 112, .20) !important;
      }
    }

    .fix-choice-area {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .fix-choice {
      min-height: 76px;
      padding: 12px 16px;
      border: 2px solid #b8c7dd;
      border-radius: 18px;
      background: #ffffff;
      color: #263657;
      font-family: inherit;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.35;
      cursor: pointer;
      box-shadow: 0 6px 0 #dbe2ed;
      transition: transform .12s ease, box-shadow .12s ease,
        border-color .15s ease, background .15s ease,
        opacity .15s ease;
    }

    .fix-choice:first-child {
      border-color: #8ab7df;
      background: #f3f9ff;
      box-shadow: 0 6px 0 #c9ddf0;
    }

    .fix-choice:last-child {
      border-color: #c0a3df;
      background: #faf5ff;
      box-shadow: 0 6px 0 #e0d2ef;
    }

    .fix-choice:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: #6f94bd;
      box-shadow: 0 9px 0 #d0dce9;
    }

    .fix-choice:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #d8e0eb;
    }

    .fix-choice.correct-choice {
      opacity: 1 !important;
      border-color: #42b85e !important;
      background: #edfff2 !important;
      color: #207e39 !important;
      box-shadow: 0 0 0 4px rgba(66, 184, 94, .15),
        0 7px 18px rgba(66, 184, 94, .22) !important;
    }

    .fix-choice.wrong-selected {
      opacity: .4 !important;
    }

    .fix-choice.wrong-choice {
      animation: choiceWrong .65s ease-in-out;
    }

    .fix-panel {
      width: 100%;
      box-sizing: border-box;
      padding: 20px 22px;
      border-radius: 19px;
      background: #effff4;
      border: 2px solid #8cdda2;
      box-shadow: 0 5px 0 rgba(66, 163, 91, .10);
      display: none;
      animation: fixIn .25s ease-out;
    }

    .fix-panel.show {
      display: block;
    }

    @keyframes fixIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fix-title {
      color: #238344;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 11px;
      text-align: center;
    }

    .fix-entry {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .fix-input {
      width: 68%;
      min-width: 0;
      height: 52px;
      box-sizing: border-box;
      border: 2px solid #b9c8bf;
      border-radius: 13px;
      background: #fff;
      color: #173c25;
      padding: 8px 13px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 400;
      outline: none;
      box-shadow: 0 4px 0 rgba(18, 38, 93, .06);
      transition: .15s ease;
    }

    .fix-input:focus {
      border-color: #4fbd65;
      box-shadow: 0 0 0 4px rgba(79, 189, 101, .15),
        0 5px 12px rgba(18, 38, 93, .10);
      transform: translateY(-2px);
    }

    .fix-input.correct {
      border-color: #45b85a !important;
      background: #f4fff6 !important;
      color: #23843a !important;
      box-shadow: 0 0 0 4px rgba(69, 184, 90, .14),
        0 6px 16px rgba(69, 184, 90, .18) !important;
    }

    .fix-input.wrong-blink {
      animation: fixWrong .65s ease-in-out;
    }

    @keyframes fixWrong {

      0%,
      100% {
        border-color: #b9c8bf;
        box-shadow: 0 4px 0 rgba(18, 38, 93, .06);
      }

      35%,
      70% {
        border-color: #ef7770 !important;
        box-shadow: 0 0 0 4px rgba(239, 119, 112, .14),
          0 0 16px rgba(239, 119, 112, .20) !important;
      }
    }

    .fix-check {
      height: 52px;
      min-width: 84px;
      border: 2px solid #43a95c;
      border-radius: 13px;
      background: #43a95c;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 400;
      cursor: pointer;
      box-shadow: 0 4px 0 #318444;
      transition: transform .12s ease, box-shadow .12s ease, opacity .15s ease;
    }

    .fix-check:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #318444;
    }

    .fix-check:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: none;
    }

    .reward-message {
      display: none;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      border-radius: 14px;
      background: #fff3b8;
      border: 2px solid #ffd65b;
      color: #745300;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      animation: rewardPop .25s ease-out;
    }

    .reward-message.show {
      display: block;
    }

    @keyframes rewardPop {
      from {
        opacity: 0;
        transform: scale(.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .nav {
      width: 100%;
      margin: auto auto 0;
      padding-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      position: relative;
      z-index: 20;
    }

    .nav-progress {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    #prevBtn {
      justify-self: start;
    }

    #nextBtn {
      justify-self: end;
    }

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
      background: rgba(18, 38, 93, .10);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .question-number {
      display: block;
      width: fit-content;
      margin: 0 auto 12px;
      color: #12265d;
      font-size: 22px;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: .2px;
      text-align: center;
    }

    /* ================= RESPONSIVE LAYOUT ================= */

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        max-width: 1380px;
      }

      .header h1 {
        font-size: 35px;
      }

      .question-number {
        font-size: 24px;
      }

      .question-text {
        font-size: 30px;
      }

      .shape-question-label {
        font-size: 30px;
      }

      .statement-text {
        font-size: 30px;
      }

      .choice-area,
      .fix-choice-area {
        gap: 22px;
      }

      .choice-button {
        min-height: 240px;
        font-size: 24px;
      }

      .nav {
        gap: 150px;
      }

      .nav button {
        width: 150px;
        min-width: 150px;
        height: 55px;
        padding: 0;
        font-size: 20px;
      }
    }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .quiz-wrap {
        max-width: 1600px;
      }

      .header {
        padding-top: 16px;
      }

      .header h1 {
        font-size: 50px;
      }

      .question-number {
        font-size: 27px;
        margin-bottom: 18px;
      }

      .question-text {
        font-size: 40px;
        margin-bottom: 32px;
      }

      .shape-question-label {
        font-size: 30px;
        margin-bottom: 10px;
      }

      .statement-text {
        font-size: 40px;
        line-height: 1.48;
      }

      .choice-area {
        gap: 28px;
        margin-top: 0;
      }

      .choice-button {
        min-height: 300px;
        padding: 42px 48px;
        border-radius: 36px;
        font-size: 30px;
        line-height: 1.48;
      }

      .fix-choice-area {
        gap: 16px;
      }

      .nav {
        margin-top: 32px;
        padding-top: 24px;
        gap: 180px;
      }

      .nav button {
        width: 160px;
        min-width: 160px;
        height: 58px;
        padding: 0;
        font-size: 22px;
      }
    }

    @media screen and (min-width: 1921px) {
      .quiz-wrap {
        max-width: 1750px;
      }

      .header {
        padding-top: 20px;
      }

      .header h1 {
        font-size: 50px;
      }

      .question-number {
        font-size: 30px;
        margin-bottom: 20px;
      }

      .question-text {
        font-size: 40px;
        margin-bottom: 36px;
      }

      .shape-question-label {
        font-size: 30px;
        margin-bottom: 10px;
      }

      .statement-text {
        font-size: 40px;
        line-height: 1.48;
      }

      .choice-area {
        gap: 34px;
        margin-top: 0;
      }

      .choice-button {
        min-height: 400px;
        height: 400px;
        padding: 48px 56px;
        font-size: 34px;
        line-height: 1.48;
      }

      .fix-choice-area {
        gap: 18px;
      }

      .nav {
        margin-top: 36px;
        padding-top: 28px;
        gap: 190px;
      }

      .nav button {
        width: 170px;
        min-width: 170px;
        height: 60px;
        padding: 0;
        font-size: 24px;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 10px 14px;
      }

      .header {
        padding-top: 5px;
      }

      .header h1 {
        font-size: 35px;
      }

      .question-screen {
        padding-top: 0;
      }

      .question-number {
        font-size: 20px;
        margin-bottom: 8px;
      }

      .question-text {
        font-size: 30px;
        margin-bottom: 16px;
        padding: 0 6px;
      }

      .shape-question-label {
        font-size: 22px;
        padding: 0 6px;
        margin-bottom: 10px;
      }

      .statement-text {
        font-size: 17px;
      }

      .choice-area {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .choice-button {
        min-height: 120px;
        height: 120px;
        padding: 18px 16px;
        font-size: 17px;
      }

      .fix-choice-area {
        gap: 8px;
      }

      .fix-choice {
        min-height: 58px;
        padding: 8px 10px;
        font-size: 14px;
      }

      .fix-panel {
        padding: 16px 14px;
      }

      .fix-input,
      .fix-check {
        height: 48px;
      }

      .fix-input {
        font-size: 16px;
      }

      .fix-check {
        min-width: 78px;
        font-size: 15px;
      }

      .reward-message {
        font-size: 15px;
      }

      .nav {
        gap: 90px;
        margin-top: 10px;
      }

      .nav button {
        min-width: 100px;
        padding: 10px 17px;
        font-size: 14px;
      }

      .nav-progress {
        font-size: 15px;
      }
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 25px;
      }

      .question-number {
        font-size: 16px;
        margin-bottom: 5px;
      }

      .question-text {
        font-size: 22px;
        margin-bottom: 12px;
      }

      .shape-question-label {
        font-size: 19px;
        margin-bottom: 10px;
      }

      .statement-text {
        font-size: 16px;
      }

      .choice-area {
        gap: 12px;
      }

      .choice-button {
        min-height: 112px;
        height: 112px;
        padding: 15px 13px;
        font-size: 15px;
      }

      .fix-choice-area {
        gap: 6px;
      }

      .fix-choice {
        min-height: 48px;
        padding: 5px 7px;
        font-size: 12px;
        border-radius: 10px;
      }

      .fix-panel {
        padding: 14px 10px;
      }

      .fix-title {
        font-size: 16px;
        margin-bottom: 8px;
      }

      .fix-input,
      .fix-check {
        height: 44px;
      }

      .fix-input {
        width: 68%;
        font-size: 15px;
        padding: 7px 10px;
      }

      .fix-check {
        min-width: 72px;
        font-size: 14px;
      }

      .reward-message {
        font-size: 14px;
        padding: 10px 12px;
      }

      .nav {
        gap: 80px;
        margin-top: 8px;
      }

      .nav button {
        min-width: 82px;
        padding: 8px 13px;
        font-size: 12px;
      }

      .nav-progress {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/quiz-ui.css">
</head>

<body>
  <main class="quiz-wrap">

    <header class="header">
      <h1>Correct the statements.</h1>
    </header>

    <section class="question-screen">
      <div class="question-number" id="questionNumber">Question 1</div>
      <div class="question-text" id="questionText"></div>
      <div class="question-content" id="questionContent"></div>
    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i>
        Prev
      </button>

      <button id="nextBtn" disabled>
        Next
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {

      const questions = [
        {
          statement: "The shapes that have length, breadth and height are called plane shapes.",
          correct: false,
          fix: "The shapes that have length, breadth and height are called solid shapes.",
          fixOptions: [
            {
              text: "The shapes that have length, breadth and height are called solid shapes.",
              correct: true
            },
            {
              text: "The shapes that have length and breadth only are called solid shapes.",
              correct: false
            }
          ]
        },
        {
          statement: "All solid shapes are called two dimensional shapes.",
          correct: false,
          fix: "All solid shapes are called three dimensional shapes or All plane shapes are called two dimensional shapes.",
          fixOptions: [
            {
              text: "All solid shapes are called three dimensional shapes or All plane shapes are called two dimensional shapes.",
              correct: true
            },
            {
              text: "All solid shapes are called one dimensional shapes.",
              correct: false
            }
          ]
        },
        {
          statement: "A sphere and a circle are 2D shapes.",
          correct: false,
          fix: "A square and a circle are 2D shapes.",
          fixOptions: [
            {
              text: "A square and a circle are 2D shapes.",
              correct: true
            },
            {
              text: "A square and a sphere are 2D shapes.",
              correct: false
            }
          ]
        },
        {
          statement: "A cone has 2 circular faces, 1 curved face, 2 edges and 1 vertex.",
          correct: false,
          fix: "A cone has 1 circular face, 1 curved face, 1 edge and 1 vertex.",
          fixOptions: [
            {
              text: "A cone has 1 circular face, 1 curved face, 1 edge and 1 vertex.",
              correct: true
            },
            {
              text: "A cone has 1 circular face, 1 curved face, 2 edges and 1 vertex.",
              correct: false
            }
          ]
        }
      ];

      const questionNumber = document.getElementById("questionNumber");
      const questionText = document.getElementById("questionText");
      const content = document.getElementById("questionContent");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let current = 0;
      const completed = Array(questions.length).fill(false);
      let audioCtx = null;

      const quizWrap = document.querySelector(".quiz-wrap");

      function fitQuizToScreen() {
        quizWrap.style.transform = "translate(-50%, -50%)";
        const rect = quizWrap.getBoundingClientRect();
        const availableH = window.innerHeight - 16;
        const availableW = window.innerWidth - 16;
        const scale = Math.min(availableH / rect.height, availableW / rect.width);
        quizWrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }

      window.addEventListener("resize", fitQuizToScreen);
      window.addEventListener("load", fitQuizToScreen);

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);

        setTimeout(() => element.remove(), 1600);
      }

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function updateProgress() {
        const number = current + 1;
        questionNumber.textContent = `Question ${number}`;
      }

      function renderQuestion(index) {
        const q = questions[index];
        current = index;

        questionText.textContent = "";
        updateProgress();
        content.innerHTML = "";

        const game = document.createElement("div");
        game.className = "statement-game";

        const card = document.createElement("div");
        card.className = "statement-card";

        const statement = document.createElement("p");
        statement.className = "statement-text";
        statement.textContent = q.statement;

        card.appendChild(statement);

        const choices = document.createElement("div");
        choices.className = "choice-area";

        let choiceLocked = completed[index];

        const fixPanel = document.createElement("div");
        fixPanel.className = "fix-panel";

        const fixTitle = document.createElement("div");
        fixTitle.className = "fix-title";
        fixTitle.textContent = "Now fix the incorrect statement:";

        const fixChoices = document.createElement("div");
        fixChoices.className = "fix-choice-area";

        if (!q.correct) {
          q.fixOptions.forEach(option => {
            const fixButton = document.createElement("button");
            fixButton.className = "fix-choice";
            fixButton.type = "button";
            fixButton.textContent = option.text;

            fixButton.addEventListener("click", () => {
              if (completed[index]) return;

              if (!option.correct) {
                sound.wrong();
                showEmoji("😔");
                fixButton.classList.remove("wrong-choice");
                void fixButton.offsetWidth;
                fixButton.classList.add("wrong-choice");
                fixButton.classList.add("wrong-selected");
                setTimeout(() => {
                  fixButton.classList.remove("wrong-choice");
                  fixButton.classList.remove("wrong-selected");
                }, 700);
                return;
              }

              fixButton.classList.add("correct-choice");
              fixChoices.querySelectorAll(".fix-choice").forEach(item => {
                item.disabled = true;
              });

              completed[index] = true;
              sound.correct();
              showEmoji("🥳");
              reward.textContent = "🏆 Correct! You fixed the statement!";
              reward.classList.add("show");
              burstConfetti(game);
              nextBtn.disabled = false;

              if (index === questions.length - 1) {
                setTimeout(finishQuiz, 650);
              }
            });

            fixChoices.appendChild(fixButton);
          });
        }

        fixPanel.appendChild(fixTitle);
        if (!q.correct) {
          fixPanel.appendChild(fixChoices);
        }

        const reward = document.createElement("div");
        reward.className = "reward-message";
        reward.textContent = "🎉 Correct! You fixed the statement!";

        const correctText = q.correct ? q.statement : q.fix;
        const wrongText = q.fixOptions?.find(o => !o.correct)?.text || q.statement;
        const choiceOptions = shuffleArray([
          { text: correctText, isCorrect: true },
          { text: wrongText, isCorrect: false }
        ]);

        choiceOptions.forEach(option => {
          const button = document.createElement("button");
          button.className = "choice-button";
          button.type = "button";
          button.textContent = option.text;

          button.addEventListener("click", () => {
            if (choiceLocked || completed[index]) return;

            if (!option.isCorrect) {
              sound.wrong();
              showEmoji("😔");
              button.classList.remove("wrong-choice");
              void button.offsetWidth;
              button.classList.add("wrong-choice");
              button.classList.add("wrong-selected");
              setTimeout(() => {
                button.classList.remove("wrong-choice");
                button.classList.remove("wrong-selected");
              }, 700);
              return;
            }

            sound.correct();
            showEmoji("🥳");

            button.classList.add("statement-correct");
            button.disabled = true;
            choices.querySelectorAll(".choice-button").forEach(item => {
              item.disabled = true;
              if (item !== button) item.classList.add("statement-not-selected");
            });

            choiceLocked = true;
            completed[index] = true;
            burstConfetti(game);
            nextBtn.disabled = false;

            if (index === questions.length - 1) {
              setTimeout(finishQuiz, 650);
            }
          });

          choices.appendChild(button);
        });

        if (!q.correct) {
          // The correction is selected from two choices above.
        }

        game.appendChild(card);
        game.appendChild(choices);
        // No separate correct/reward message; the selected card provides feedback.

        content.appendChild(game);

        if (completed[index]) {
          choices.querySelectorAll(".choice-button").forEach(button => {
            button.disabled = true;
            const selectedText = q.correct ? q.statement : q.fix;
            if (button.textContent === selectedText) {
              button.classList.add("statement-correct");
            }
          });

        }

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !completed[index];

        requestAnimationFrame(fitQuizToScreen);
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i>
        Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          completed.fill(false);
          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) renderQuestion(current - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (completed[current] && current < questions.length - 1) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);

    })();
  </script>
<script src="../../shared/quiz-ui.js"></script>
</body>

</html>
