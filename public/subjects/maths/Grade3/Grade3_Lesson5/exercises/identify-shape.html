<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identify the Shape</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @font-face {
      font-family: "CCSyntroman";
      src: url("../assets/CCSYNTRO.TTF") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "CCSyntroman", "Baloo 2", sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      height: 100vh;
      overflow: hidden;
      padding: 12px 20px;
      background: #fbf7f0;
      position: relative;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* ================= HEADER ================= */

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0;
    }

    .header h1 {
      color: #12265d;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 800;
    }

    /* ================= QUESTION ================= */

    .question-screen {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0;
    }

    .question-label {
      color: #12265d;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
      display: none;
    }

    .question-text {
      color: #2f4f4f;
      font-size: 30px;
      font-weight: 400;
      margin-bottom: 22px;
      text-align: left;
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ================= OBJECT IMAGE ================= */

    .object-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .object-frame {
      width: 220px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 3px solid #ffe0b3;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(18, 38, 93, .08);
      padding: 14px;
    }

    .object-frame svg,
    .object-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ================= SHAPE OPTIONS ================= */

    .shape-options-row {
      width: 100%;
      margin-top: 30px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 22px;
      min-width: 0;
      overflow: hidden;
    }

    .picture-item {
      width: 180px;
      flex: 0 0 180px;
      min-width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      border-radius: 14px;
      padding: 5px;
      transition: transform .18s ease, background .18s ease;
    }

    .picture-item:hover {
      transform: translateY(-2px);
    }

    .picture-item.selected {
      background: #fff5e9;
    }

    .picture-frame {
      width: 180px;
      height: 140px;
      flex: 0 0 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 14px;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
      background: #fff;
      padding: 14px;
    }

    .picture-item.selected .picture-frame {
      border-color: #ff9b2f;
      box-shadow: 0 4px 14px rgba(255, 155, 47, .16);
    }

    .picture-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .picture-item.locked {
      cursor: default;
    }

    .picture-item.locked:hover {
      transform: none;
    }

    /* Wrong answer: red blink on the selected shape */
    .picture-frame.wrong-shake {
      animation: wrongBlink .5s ease;
    }

    @keyframes wrongBlink {
      0% {
        background: #fff;
        border-color: transparent;
      }

      25% {
        background: #ffe1e1;
        border-color: #e0483f;
      }

      50% {
        background: #fff;
        border-color: transparent;
      }

      75% {
        background: #ffe1e1;
        border-color: #e0483f;
      }

      100% {
        background: #fff;
        border-color: transparent;
      }
    }

    /* Correct answer: green border, locked */
    .picture-frame.correct-locked {
      border-color: #55b449 !important;
      background: #f2fbf1;
      box-shadow: 0 0 0 4px rgba(85, 180, 73, .13);
    }

    /* ================= CHECK BUTTON ================= */

    .check-btn-row {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 26px;
    }

    .check-btn {
      border: 0;
      width: 150px;
      height: 53px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 999px;
      background: #e0b453;
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #e9b23d;
      transition: transform .15s ease, opacity .15s ease;
    }

    .check-btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .check-btn:active:not(:disabled) {
      transform: translateY(2px);
    }

    .check-btn:disabled {
      opacity: .45;
      cursor: default;
    }

    .hidden {
      display: none !important;
    }

    /* ================= NAV (prev / progress / next in one row) ================= */

    .nav {
      width: 100%;
      margin: auto auto 0;
      padding-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      position: relative;
      z-index: 20;
    }

    .nav-progress {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    #prevBtn {
      justify-self: start;
    }

    #nextBtn {
      justify-self: end;
    }

    /* ================= SAME EMOJI / POPUP ================= */

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
      background: rgba(18, 38, 93, .10);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    /* =====================================================
   SAME RESPONSIVE BREAKPOINT DIMENSIONS
===================================================== */

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        max-width: 1380px;
      }

      .header h1 {
        font-size: 35px;
      }

      .question-label {
        font-size: 24px;
      }

      .shape-options-row {
        gap: 22px;
      }

      .picture-item {

      }

      .picture-frame {

      }

    }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {

      }

      }

      .nav button {

      }
    }

    @media screen and (min-width: 1921px) {
      .quiz-wrap {
        max-width: 1750px;
      }

      .header {

      }

      .header h1 {

      }

      .question-label {
        font-size: 30px;

      }

      .question-text {

      }

      .object-frame {

      }

      .shape-options-row {

      }

    @media (max-width: 768px) {

<body>
  <main class="quiz-wrap">

    <header class="header">
      <h1>Identify the Shape</h1>
    </header>

    <section class="question-screen">
      <div class="question-label" id="questionLabel">Question 1</div>
      <div class="question-text" id="questionText"></div>
      <div class="question-content" id="questionContent"></div>
    </section>


    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i>
        Prev
      </button>

      <button id="nextBtn" disabled>
        Next
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {

      /* ============== SHAPE ICON LIBRARY (inline SVG, no external assets) ============== */

      const shapeIcons = {
        circle: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="42" fill="#4ecdc4" stroke="#2f9a92" stroke-width="4"/>
                  </svg>`,
        sphere: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <radialGradient id="sphereGrad" cx="38%" cy="32%" r="70%">
                        <stop offset="0%" stop-color="#ffe0a3"/>
                        <stop offset="55%" stop-color="#ffb347"/>
                        <stop offset="100%" stop-color="#e08a1f"/>
                      </radialGradient>
                    </defs>
                    <circle cx="50" cy="50" r="42" fill="url(#sphereGrad)" stroke="#c96f12" stroke-width="3"/>
                    <ellipse cx="50" cy="88" rx="26" ry="5" fill="#12265d" opacity=".12"/>
                  </svg>`,
        square: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="12" y="12" width="76" height="76" rx="8" fill="#4e8ff0" stroke="#2f68c9" stroke-width="4"/>
                  </svg>`,
        rectangle: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="6" y="24" width="88" height="52" rx="8" fill="#76b93b" stroke="#549024" stroke-width="4"/>
                  </svg>`,
        triangle: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="50,10 92,88 8,88" fill="#ff4e83" stroke="#d92e63" stroke-width="4" stroke-linejoin="round"/>
                  </svg>`,
        cone: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#c9a6ff"/>
                        <stop offset="50%" stop-color="#9b6bf0"/>
                        <stop offset="100%" stop-color="#7c4bd8"/>
                      </linearGradient>
                    </defs>
                    <polygon points="50,8 84,80 16,80" fill="url(#coneGrad)" stroke="#6635b0" stroke-width="3" stroke-linejoin="round"/>
                    <ellipse cx="50" cy="80" rx="34" ry="9" fill="#7c4bd8" stroke="#6635b0" stroke-width="3"/>
                  </svg>`
      };

      /* ============== OBJECT IMAGES (real image paths) ============== */

      const objectImages = {
        ball: "../assets/images/ball.png",
        blackboard: "../assets/images/black-board.png",
        cap: "../assets/images/birthday-topi.png",
        sandwich: "../assets/images/sandwich2.png",
        phone: "../assets/images/phone.png"
      };

      /* ============== QUESTIONS ============== */

      const questions = [
        { label: "a) What is the shape of a ball?", object: "ball", options: ["sphere", "triangle", "square"], answer: "sphere" },
        { label: "b) What is the shape of a blackboard?", object: "blackboard", options: ["rectangle", "square", "circle"], answer: "rectangle" },
        { label: "c) What is the shape of a birthday cap?", object: "cap", options: ["cone", "triangle", "circle"], answer: "cone" },
        { label: "d) What is the shape of a slice of sandwich?", object: "sandwich", options: ["triangle", "cone", "rectangle"], answer: "triangle" },
        { label: "e) What is the shape of a mobile phone?", object: "phone", options: ["rectangle", "square", "circle"], answer: "rectangle" }
      ];

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      questions.forEach(q => shuffleArray(q.options));

      const content = document.getElementById("questionContent");
      const questionLabel = document.getElementById("questionLabel");
      const questionText = document.getElementById("questionText");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let current = 0;
      const completed = Array(questions.length).fill(false);
      const savedChoice = Array(questions.length).fill(null);
      let audioCtx = null;

      const quizWrap = document.querySelector(".quiz-wrap");

      function fitQuizToScreen() {
        quizWrap.style.transform = "translate(-50%, -50%)";
        const rect = quizWrap.getBoundingClientRect();
        const availableH = window.innerHeight - 16;
        const availableW = window.innerWidth - 16;
        const scale = Math.min(availableH / rect.height, availableW / rect.width);
        quizWrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }

      window.addEventListener("resize", fitQuizToScreen);
      window.addEventListener("load", fitQuizToScreen);

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);

        setTimeout(() => element.remove(), 1600);
      }

      function renderQuestion(index) {
        const q = questions[index];
        current = index;

        questionLabel.textContent = `Question ${index + 1}`;
        questionText.textContent = q.label;
        content.innerHTML = "";

        const objectRow = document.createElement("div");
        objectRow.className = "object-row";

        const objectFrame = document.createElement("div");
        objectFrame.className = "object-frame";

        const objectImg = document.createElement("img");
        objectImg.src = objectImages[q.object];
        objectImg.alt = q.object;
        objectFrame.appendChild(objectImg);
        objectRow.appendChild(objectFrame);

        const optionsRow = document.createElement("div");
        optionsRow.className = "shape-options-row";

        const optionItems = [];

        q.options.forEach(shapeName => {

          const pictureItem = document.createElement("div");
          pictureItem.className = "picture-item";
          pictureItem.setAttribute("tabindex", "0");
          pictureItem.setAttribute("role", "button");
          pictureItem.setAttribute("aria-label", `${shapeName} option`);
          pictureItem.dataset.shape = shapeName;

          const frame = document.createElement("div");
          frame.className = "picture-frame";
          frame.innerHTML = shapeIcons[shapeName];
          pictureItem.appendChild(frame);

          optionItems.push(pictureItem);
          optionsRow.appendChild(pictureItem);

          function checkOption() {
            if (pictureItem.classList.contains("locked") || completed[index]) return;

            const isCorrect = shapeName === q.answer;

            if (!isCorrect) {
              sound.wrong();
              showEmoji("😔");

              frame.classList.remove("wrong-shake");
              void frame.offsetWidth;
              frame.classList.add("wrong-shake");

              frame.addEventListener("animationend", () => {
                frame.classList.remove("wrong-shake");
              }, { once: true });

              return;
            }

            completed[index] = true;
            savedChoice[index] = shapeName;

            sound.correct();
            showEmoji("🥳");
            burstConfetti(frame);

            pictureItem.classList.add("selected");
            frame.classList.add("correct-locked");
            optionItems.forEach(item => item.classList.add("locked"));

            nextBtn.disabled = false;

            if (index === questions.length - 1) {
              setTimeout(finishQuiz, 650);
            }
          }

          pictureItem.addEventListener("click", checkOption);

          pictureItem.addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              checkOption();
            }
          });
        });

        content.appendChild(objectRow);
        content.appendChild(optionsRow);

        if (completed[index]) {
          const chosenItem = optionItems.find(item => item.dataset.shape === savedChoice[index]);
          if (chosenItem) {
            chosenItem.classList.add("selected");
            chosenItem.querySelector(".picture-frame").classList.add("correct-locked");
          }
          optionItems.forEach(item => item.classList.add("locked"));
        }

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !completed[index];

        requestAnimationFrame(fitQuizToScreen);
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i>
        Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          completed.fill(false);
          savedChoice.fill(null);
          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) renderQuestion(current - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (completed[current] && current < questions.length - 1) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);

    })();
  </script>
<script src="../../shared/quiz-ui.js"></script>
</body>

</html>
