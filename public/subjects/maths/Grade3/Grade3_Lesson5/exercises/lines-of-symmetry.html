<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lines of Symmetry</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @font-face {
      font-family: "CCSyntroman";
      src: url("../assets/CCSYNTRO.TTF") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "CCSyntroman", "Baloo 2", sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: clip;
      padding: 12px 20px;
      background: #fbf7f0;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ================= HEADER ================= */

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0;
    }

    .header h1 {
      color: #12265d;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 800;
    }

    /* ================= QUESTION ================= */

    .question-screen {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0;
    }

    .question-label {
      color: #12265d;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
      display: none;
    }

    .question-text {
      color: #2f4f4f;
      font-size: 30px;
      font-weight: 400;
      margin-bottom: 22px;
      text-align: left;
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: row;
      gap: 60px;
      align-items: center;
      justify-content: center;
    }

    /* ================= FIGURE IMAGE ================= */

    .object-frame {
      width: 350px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 3px solid #1bcbbf;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(18, 38, 93, .08);
      padding: 14px;
    }

    .object-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ================= DRAWING AREA ================= */

    .drawing-area {
      width: 520px;
      max-width: 100%;
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .canvas-frame {
      width: 100%;
      height: 220px;
      background: #fff;
      border: 3px solid #ffe0b3;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(18, 38, 93, .08);
      overflow: hidden;
      touch-action: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    #answerCanvas {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    .canvas-frame.wrong-shake {
      animation: wrongBlink .5s ease;
    }

    @keyframes wrongBlink {
      0% {
        background: #fff;
        border-color: #ffe0b3;
      }

      25% {
        background: #ffe1e1;
        border-color: #e0483f;
      }

      50% {
        background: #fff;
        border-color: #ffe0b3;
      }

      75% {
        background: #ffe1e1;
        border-color: #e0483f;
      }

      100% {
        background: #fff;
        border-color: #ffe0b3;
      }
    }

    .canvas-frame.correct-locked {
      border-color: #55b449 !important;
      background: #f2fbf1;
      box-shadow: 0 0 0 4px rgba(85, 180, 73, .13);
    }

    /* ================= CHECK BUTTON ================= */

    .check-btn-row {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    .check-btn {
      border: 0;
      width: 150px;
      height: 53px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 999px;
      background: #f3c86c;
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #c29128;
      transition: transform .15s ease, opacity .15s ease;
    }

    .check-btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .check-btn:active:not(:disabled) {
      transform: translateY(2px);
    }

    .check-btn:disabled {
      opacity: .45;
      cursor: default;
    }

    .hidden {
      display: none !important;
    }

    /* ================= NAV ================= */

    .nav {
      width: 100%;
      margin: 40px auto 0;
      padding-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      position: relative;
      z-index: 20;
    }

    .nav-progress {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    #prevBtn {
      justify-self: start;
    }

    #nextBtn {
      justify-self: end;
    }

    /* ================= HOW TO PLAY / HINT ================= */

    .hint-btn {
      position: absolute;
      top: 0px;
      right: 30px;
      z-index: 50;
      border: 0;
      min-width: 108px;
      height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      background: #4fd4cc;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 5px 0 #06c2b5;
      cursor: pointer;
      transition: transform .15s ease;
    }

    .hint-btn:hover {
      transform: translateY(-2px);
    }

    .hint-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #06c2b5;
    }

    .hint-box {
      position: absolute;
      top: 66px;
      right: 0;
      width: 310px;
      padding: 22px 22px 20px;
      background: #fff;
      border: 3px solid #ffe0b3;
      border-radius: 22px;
      box-shadow: 0 14px 32px rgba(18, 38, 93, .18);
      z-index: 100;
      animation: hintPop .22s ease-out;
    }

    @keyframes hintPop {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .hint-box h2 {
      color: #12265d;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .hint-box p {
      color: #3d3d4a;
      font-size: 17px;
      line-height: 1.45;
      padding-right: 4px;
    }

    .hint-close {
      position: absolute;
      top: 9px;
      right: 11px;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      background: #f4f0e9;
      color: #12265d;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .hint-btn {
        top: 8px;
        right: 0;
        min-width: 92px;
        height: 40px;
        padding: 0 14px;
        font-size: 14px;
      }

      .hint-box {
        top: 56px;
        right: 0;
        width: min(300px, calc(100vw - 28px));
        padding: 19px 18px 18px;
      }

      .hint-box h2 {
        font-size: 21px;
      }

      .hint-box p {
        font-size: 15px;
      }
    }

    /* ================= SAME EMOJI / POPUP ================= */

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
      background: rgba(18, 38, 93, .10);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    /* =====================================================
       SAME RESPONSIVE BREAKPOINT DIMENSIONS
    ===================================================== */

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        max-width: 1380px;
      }

      .header h1 {
        font-size: 35px;
      }

      .question-label {
        font-size: 24px;
      }

      .object-frame {
        width: 350px;
        height: 300px;
      }

      .drawing-area {
        width: 600px;
      }

      .canvas-frame {
        height: 220px;
      }

      .nav {
        gap: 150px;
        margin-top: 50px;
      }

      .nav button {
        width: 150px;
        min-width: 150px;
        height: 55px;
        padding: 0;
        font-size: 20px;
      }
    }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .quiz-wrap {
        max-width: 1600px;
      }

      .header {
        padding-top: 16px;
      }

      .header h1 {
        font-size: 50px;
      }

      .question-label {
        font-size: 27px;
        margin-bottom: 18px;
      }

      .question-text {
        font-size: 40px;
      }

      .object-frame {
        width: 400px;
        height: 400px;
      }

      .drawing-area {
        width: 600px;
      }

      .canvas-frame {
        height: 280px;
      }

      .nav {
        margin-top: 50px;
        padding-top: 24px;
        gap: 180px;
      }

      .nav button {
        width: 160px;
        min-width: 160px;
        height: 58px;
        padding: 0;
        font-size: 22px;
      }
    }

    @media screen and (min-width: 1921px) {
      .quiz-wrap {
        max-width: 1750px;
      }

      .header {
        padding-top: 20px;
      }

      .header h1 {
        font-size: 50px;
      }

      .question-label {
        font-size: 30px;
        margin-bottom: 20px;
      }

      .question-text {
        font-size: 40px;
      }

      .object-frame {
        width: 340px;
        height: 250px;
      }

      .drawing-area {
        width: 650px;
      }

      .canvas-frame {
        height: 300px;
      }

      .nav {
        margin-top: 50px;
        padding-top: 28px;
        gap: 190px;
      }

      .nav button {
        width: 170px;
        min-width: 170px;
        height: 60px;
        padding: 0;
        font-size: 24px;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 10px 14px;
      }

      .header h1 {
        font-size: 35px;
      }

      .question-label {
        font-size: 20px;
        margin-bottom: 8px;
      }

      .question-text {
        font-size: 30px;
        margin-bottom: 16px;
      }

      .object-frame {
        width: 260px;
        height: 175px;
        border-radius: 16px;
        padding: 10px;
      }

      .drawing-area {
        width: 100%;
        margin-top: 18px;
      }

      .canvas-frame {
        height: 125px;
        border-radius: 16px;
      }

      .check-btn-row {
        margin-top: 18px;
      }

      .check-btn {
        min-width: 170px;
        height: 49px;
        font-size: 16px;
      }

      .nav {
        gap: 90px;
        margin-top: 10px;
      }

      .nav button {
        min-width: 100px;
        padding: 10px 17px;
        font-size: 14px;
      }

      .nav-progress {
        font-size: 15px;
      }
    }

    @media (max-width: 480px) {
      .header {
        padding-top: 5px;
      }

      .header h1 {
        font-size: 25px;
      }

      .question-label {
        font-size: 16px;
        margin-bottom: 5px;
      }

      .question-text {
        font-size: 30px;
        margin-bottom: 12px;
      }

      .object-frame {
        width: 220px;
        height: 145px;
        border-radius: 12px;
        padding: 8px;
      }

      .drawing-area {
        margin-top: 12px;
      }

      .canvas-frame {
        height: 95px;
        border-radius: 12px;
      }

      .check-btn-row {
        margin-top: 12px;
      }

      .check-btn {
        min-width: 145px;
        height: 42px;
        padding: 0 18px;
        font-size: 14px;
      }

      .nav {
        gap: 80px;
        margin-top: 8px;
      }

      .nav button {
        min-width: 82px;
        padding: 8px 13px;
        font-size: 12px;
      }

      .nav-progress {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>

</head>

<body>
  <main class="quiz-wrap">

    <header class="header">
      <h1>Lines of Symmetry</h1>
    </header>

    <section class="question-screen">
      <button class="hint-btn" id="hintBtn" type="button">How to Play</button>

      <div class="hint-box hidden" id="hintBox" role="dialog" aria-label="How to play">
        <button class="hint-close" id="hintClose" type="button" aria-label="Close">×</button>
        <h2>How to Play</h2>
        <p>Look at the figure and draw its line(s) of symmetry in the box using your mouse, touchpad, or finger. Then
          press <strong>Check</strong>.</p>
      </div>

      <div class="question-label" id="questionLabel">Question 1</div>
      <div class="question-text" id="questionText"></div>
      <div class="question-content" id="questionContent"></div>
    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i>
        Prev
      </button>

      <button id="nextBtn" disabled>
        Next
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {
      /* =====================================================
         REAL IMAGE PATHS
         Put these files inside ../assets/images/
      ===================================================== */

      const questions = [
        {
          label: "Draw the line(s) of symmetry.",
          image: "../assets/images/m-removebg-preview.png",
          answerAngles: [90]
        },
        {
          label: "Draw the line(s) of symmetry.",
          image: "../assets/images/oval.png",
          answerAngles: [90, 0]
        },
        {
          label: "Draw the line(s) of symmetry.",
          image: "../assets/images/arrow.png",
          answerAngles: [0]
        },
        {
          label: "Draw the line(s) of symmetry.",
          image: "../assets/images/apple.png",
          answerAngles: [90]
        },
        {
          label: "Draw the line(s) of symmetry.",
          image: "../assets/images/snowman.png",
          answerAngles: [90]
        },
        {
          label: "Draw the line(s) of symmetry.",
          image: "../assets/images/pattern.png",
          answerAngles: [0, 45, 90, 135]
        },
        {
          label: "Draw the line(s) of symmetry.",
          image: "../assets/images/b.png",
          answerAngles: [0]
        },
        {
          label: "Draw the line(s) of symmetry.",
          image: "../assets/images/star.png",
          answerAngles: [0, 30, 60, 90, 120, 150]
        }
      ];

      const content = document.getElementById("questionContent");
      const questionLabel = document.getElementById("questionLabel");
      const questionText = document.getElementById("questionText");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const hintBtn = document.getElementById("hintBtn");
      const hintBox = document.getElementById("hintBox");
      const hintClose = document.getElementById("hintClose");
      const questionScreen = document.querySelector(".question-screen");

      let current = 0;
      const completed = Array(questions.length).fill(false);
      const savedStrokes = Array(questions.length).fill(null);
      let canvas = null;
      let ctx = null;
      let drawing = false;
      let currentStroke = null;
      let audioCtx = null;
      let checkBtn = null;

      function closeHint() {
        hintBox.classList.add("hidden");
      }

      hintBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        hintBox.classList.toggle("hidden");
      });

      hintClose.addEventListener("click", (event) => {
        event.stopPropagation();
        closeHint();
      });

      document.addEventListener("click", (event) => {
        if (hintBox.classList.contains("hidden")) return;
        if (!hintBox.contains(event.target) && event.target !== hintBtn) {
          closeHint();
        }
      });

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },

        wrong() {
          beep(180, 220, "sawtooth");
        },

        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);

        setTimeout(() => element.remove(), 1600);
      }

      // Keeps the Check button's disabled state in sync with:
      //  - whether the current question already has drawn strokes
      //  - whether the current question is already completed/locked
      function updateCheckBtnState() {
        if (!checkBtn) return;
        const hasStrokes = !!(savedStrokes[current] && savedStrokes[current].length);
        checkBtn.disabled = completed[current] || !hasStrokes;
      }

      function setupCanvas() {
        canvas = document.getElementById("answerCanvas");
        ctx = canvas.getContext("2d");

        const ratio = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();

        canvas.width = rect.width * ratio;
        canvas.height = rect.height * ratio;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = 5;
        ctx.strokeStyle = "#12265d";

        canvas.addEventListener("pointerdown", startDrawing);
        canvas.addEventListener("pointermove", draw);
        canvas.addEventListener("pointerup", stopDrawing);
        canvas.addEventListener("pointercancel", stopDrawing);
        canvas.addEventListener("pointerleave", stopDrawing);

        redrawSavedStrokes();
      }

      function getPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top
        };
      }

      function startDrawing(event) {
        if (completed[current]) return;

        drawing = true;
        canvas.setPointerCapture?.(event.pointerId);

        const point = getPoint(event);
        currentStroke = [point];

        ctx.beginPath();
        ctx.moveTo(point.x, point.y);
      }

      function draw(event) {
        if (!drawing || completed[current]) return;

        const point = getPoint(event);
        currentStroke.push(point);

        ctx.lineTo(point.x, point.y);
        ctx.stroke();
      }

      function stopDrawing() {
        if (!drawing) return;

        drawing = false;

        if (currentStroke && currentStroke.length > 1) {
          if (!savedStrokes[current]) savedStrokes[current] = [];
          savedStrokes[current].push(currentStroke);
        }

        currentStroke = null;
        updateCheckBtnState();
      }

      function redrawSavedStrokes() {
        if (!ctx || !canvas) return;

        const strokes = savedStrokes[current] || [];

        ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

        strokes.forEach(stroke => {
          if (stroke?.segments) {
            stroke.segments.forEach(segment => {
              if (segment.length < 2) return;
              ctx.beginPath();
              ctx.moveTo(segment[0].x, segment[0].y);
              ctx.lineTo(segment[1].x, segment[1].y);
              ctx.stroke();
            });
            return;
          }

          if (!stroke || stroke.length < 2) return;

          ctx.beginPath();
          ctx.moveTo(stroke[0].x, stroke[0].y);

          for (let i = 1; i < stroke.length; i++) {
            ctx.lineTo(stroke[i].x, stroke[i].y);
          }

          ctx.stroke();
        });
      }

      function strokeAngle(stroke) {
        const first = stroke[0];
        const last = stroke[stroke.length - 1];

        let angle = Math.atan2(
          last.y - first.y,
          last.x - first.x
        ) * 180 / Math.PI;

        angle = ((angle % 180) + 180) % 180;
        return angle;
      }

      function strokeLength(stroke) {
        let total = 0;

        for (let i = 1; i < stroke.length; i++) {
          const dx = stroke[i].x - stroke[i - 1].x;
          const dy = stroke[i].y - stroke[i - 1].y;
          total += Math.sqrt(dx * dx + dy * dy);
        }

        return total;
      }

      function angleDifference(a, b) {
        const diff = Math.abs(a - b);
        return Math.min(diff, 180 - diff);
      }

      // If a line is close to the expected direction, gently snap it to the
      // exact symmetry direction. This makes small drawing inaccuracies count
      // as correct and visually straightens the child's line.
      // Draw accepted answers as clean, fixed-size symmetry lines.
      // Non-diagonal lines are kept separated when they share the same
      // direction. Diagonal symmetry lines are allowed to meet at the center.
      function snapStrokeToAngle(stroke, targetAngle, offsetIndex = 0, totalSameAngle = 1, useCenterGap = false, stackIndex = 0, stackTotal = 1) {
        if (!stroke || stroke.length < 2 || !canvas) return stroke;

        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const centerX = width / 2;
        const centerY = height / 2;
        const radians = targetAngle * Math.PI / 180;
        const cos = Math.cos(radians);
        const sin = Math.sin(radians);
        const absCos = Math.abs(cos);
        const absSin = Math.abs(sin);

        // Fixed line sizes. The lines are never stretched to the full box.
        const HORIZONTAL_LENGTH = 132;
        const VERTICAL_LENGTH = 92;
        const DIAGONAL_LENGTH = 108;
        const LINE_GAP = 24;
        const padding = 14;

        const isHorizontal = angleDifference(targetAngle, 0) <= 1;
        const isVertical = angleDifference(targetAngle, 90) <= 1;
        const isDiagonal = !isHorizontal && !isVertical;

        let lineLength;
        if (isHorizontal) {
          lineLength = Math.min(HORIZONTAL_LENGTH, width - padding * 2);
        } else if (isVertical) {
          lineLength = Math.min(VERTICAL_LENGTH, height - padding * 2);
        } else {
          const maxLengthByWidth = absCos > 0.0001 ? (width - padding * 2) / absCos : Infinity;
          const maxLengthByHeight = absSin > 0.0001 ? (height - padding * 2) / absSin : Infinity;
          lineLength = Math.min(DIAGONAL_LENGTH, maxLengthByWidth, maxLengthByHeight);
        }

        const half = lineLength / 2;
        let lineCenterX = centerX;
        let lineCenterY = centerY;

        // Every corrected symmetry line passes through the shape's true
        // center, so multiple lines cross each other there (a "+" for a
        // vertical + horizontal pair, a full asterisk for more lines) -
        // matching how lines of symmetry are actually drawn on a shape.
        if (!isDiagonal && totalSameAngle > 1) {
          // Same-direction non-diagonal lines remain separated so they
          // don't sit exactly on top of one another.
          const gap = 22;
          const perpendicularOffset = (offsetIndex - (totalSameAngle - 1) / 2) * gap;
          lineCenterX += -sin * perpendicularOffset;
          lineCenterY += cos * perpendicularOffset;
        }

        const startPoint = {
          x: lineCenterX - cos * half,
          y: lineCenterY - sin * half
        };
        const endPoint = {
          x: lineCenterX + cos * half,
          y: lineCenterY + sin * half
        };

        return [startPoint, endPoint];
      }

      function isDiagonalAngle(angle) {
        const a = ((angle % 180) + 180) % 180;
        return a > 18 && a < 72 || a > 108 && a < 162;
      }

      function orientation(a, b, c) {
        const value = (b.y - a.y) * (c.x - b.x) -
          (b.x - a.x) * (c.y - b.y);
        if (Math.abs(value) < 0.001) return 0;
        return value > 0 ? 1 : 2;
      }

      function onSegment(a, b, c) {
        return Math.min(a.x, c.x) - 2 <= b.x &&
          b.x <= Math.max(a.x, c.x) + 2 &&
          Math.min(a.y, c.y) - 2 <= b.y &&
          b.y <= Math.max(a.y, c.y) + 2;
      }

      function segmentsIntersect(a1, a2, b1, b2) {
        const o1 = orientation(a1, a2, b1);
        const o2 = orientation(a1, a2, b2);
        const o3 = orientation(b1, b2, a1);
        const o4 = orientation(b1, b2, a2);

        if (o1 !== o2 && o3 !== o4) return true;
        if (o1 === 0 && onSegment(a1, b1, a2)) return true;
        if (o2 === 0 && onSegment(a1, b2, a2)) return true;
        if (o3 === 0 && onSegment(b1, a1, b2)) return true;
        if (o4 === 0 && onSegment(b1, a2, b2)) return true;
        return false;
      }

      function strokesOverlap(strokeA, strokeB) {
        if (!strokeA?.length || !strokeB?.length) return false;

        const a1 = strokeA[0];
        const a2 = strokeA[strokeA.length - 1];
        const b1 = strokeB[0];
        const b2 = strokeB[strokeB.length - 1];

        const angleA = strokeAngle(strokeA);
        const angleB = strokeAngle(strokeB);

        // Diagonal lines are intentionally allowed to meet/cross.
        if (isDiagonalAngle(angleA) || isDiagonalAngle(angleB)) return false;

        // Different directions (e.g. horizontal vs vertical) are EXPECTED to
        // cross at the center — that is not an overlap/error. Only strokes that
        // are already close to the same direction can be "overlapping".
        if (angleDifference(angleA, angleB) > 12) return false;

        // From here on, both strokes are near the same direction, so a physical
        // crossing/overlap really does mean the child drew the same line twice.
        if (segmentsIntersect(a1, a2, b1, b2)) return true;

        const distance = Math.abs(
          (b1.x - a1.x) * (a2.y - a1.y) -
          (b1.y - a1.y) * (a2.x - a1.x)
        ) / Math.max(1, Math.hypot(a2.x - a1.x, a2.y - a1.y));

        if (distance <= 12) {
          const minAx = Math.min(a1.x, a2.x) - 8;
          const maxAx = Math.max(a1.x, a2.x) + 8;
          const minAy = Math.min(a1.y, a2.y) - 8;
          const maxAy = Math.max(a1.y, a2.y) + 8;

          const minBx = Math.min(b1.x, b2.x);
          const maxBx = Math.max(b1.x, b2.x);
          const minBy = Math.min(b1.y, b2.y);
          const maxBy = Math.max(b1.y, b2.y);

          return maxAx >= minBx && maxBx >= minAx &&
            maxAy >= minBy && maxBy >= minAy;
        }

        return false;
      }

      function normalizeCorrectAnswer() {
        const strokes = savedStrokes[current] || [];
        const expected = questions[current].answerAngles;
        const usableStrokes = strokes.filter(stroke => strokeLength(stroke) >= 35);

        if (usableStrokes.length !== expected.length) return false;

        // Before correcting/centering anything, reject strokes that are
        // essentially drawn on top of another non-diagonal stroke.
        for (let i = 0; i < usableStrokes.length; i++) {
          for (let j = i + 1; j < usableStrokes.length; j++) {
            if (strokesOverlap(usableStrokes[i], usableStrokes[j])) {
              return false;
            }
          }
        }

        const adjusted = [];
        const used = new Set();

        for (const stroke of usableStrokes) {
          const angle = strokeAngle(stroke);
          let matchedIndex = -1;
          let bestDifference = Infinity;

          expected.forEach((expectedAngle, index) => {
            if (used.has(index)) return;

            const difference = angleDifference(angle, expectedAngle);
            if (difference <= 22 && difference < bestDifference) {
              bestDifference = difference;
              matchedIndex = index;
            }
          });

          if (matchedIndex === -1) return false;

          used.add(matchedIndex);
          adjusted.push({
            original: stroke,
            angle: expected[matchedIndex],
            index: matchedIndex
          });
        }

        // Keep every accepted line the same fixed size. If several expected
        // lines have the same non-diagonal direction, give them a real gap
        // instead of stacking them on top of each other.
        const counts = {};
        adjusted.forEach(item => {
          const key = ((item.angle % 180) + 180) % 180;
          counts[key] = (counts[key] || 0) + 1;
        });

        const seen = {};
        // Render in the requested fixed order: vertical first, then horizontal.
        // Other answers keep their expected order.
        const ordered = [...adjusted].sort((a, b) => {
          const groupRank = (angle) => {
            if (angleDifference(angle, 90) <= 1) return 0; // vertical first
            if (isDiagonalAngle(angle)) return 1;             // diagonal group second
            return 2;                                        // horizontal last
          };

          const rankDifference = groupRank(a.angle) - groupRank(b.angle);
          return rankDifference || (a.index - b.index);
        });

        // All corrected lines use one shared horizontal row. The order is
        // vertical first, then any diagonal lines, then horizontal.
        // A fixed gap is measured between the actual line extents, so lines
        // never visually touch after normalization.
        const fixedRowLengths = ordered.map(item => {
          const a = ((item.angle % 180) + 180) % 180;
          if (Math.min(a, 180 - a) <= 1) return 132;
          if (Math.abs(a - 90) <= 1) return 92;
          return 108;
        });

        window.__symmetryRowLengths = fixedRowLengths;
        window.__symmetryRowAngles = ordered.map(item => item.angle);

        savedStrokes[current] = ordered.map((item, rowIndex) => {
          item.rendered = true;
          const key = ((item.angle % 180) + 180) % 180;
          const offsetIndex = seen[key] || 0;
          seen[key] = offsetIndex + 1;

          return snapStrokeToAngle(
            item.original,
            item.angle,
            offsetIndex,
            counts[key],
            false,
            rowIndex,
            ordered.length
          );
        });

        window.__symmetryRowLengths = null;
        window.__symmetryRowAngles = null;

        redrawSavedStrokes();
        return true;
      }

      function isAnswerCorrect() {
        const strokes = savedStrokes[current] || [];
        const expected = questions[current].answerAngles;

        if (strokes.length !== expected.length) return false;

        const usableStrokes = strokes.filter(stroke => strokeLength(stroke) >= 35);

        if (usableStrokes.length !== expected.length) return false;

        const used = new Set();

        for (const stroke of usableStrokes) {
          const angle = strokeAngle(stroke);
          let matchedIndex = -1;

          expected.forEach((expectedAngle, index) => {
            if (used.has(index)) return;

            if (angleDifference(angle, expectedAngle) <= 22) {
              matchedIndex = index;
            }
          });

          if (matchedIndex === -1) return false;
          used.add(matchedIndex);
        }

        return used.size === expected.length;
      }

      function checkAnswer() {
        if (completed[current]) return;

        stopDrawing();

        if (!normalizeCorrectAnswer()) {
          sound.wrong();
          showEmoji("😔");

          // Clear the child's incorrect drawing so they can try again.
          savedStrokes[current] = null;
          redrawSavedStrokes();
          updateCheckBtnState();

          const frame = document.querySelector(".canvas-frame");
          frame.classList.remove("wrong-shake");
          void frame.offsetWidth;
          frame.classList.add("wrong-shake");

          return;
        }

        completed[current] = true;

        sound.correct();
        showEmoji("🥳");
        updateCheckBtnState();

        const frame = document.querySelector(".canvas-frame");
        frame.classList.add("correct-locked");

        burstConfetti(frame);

        canvas.style.cursor = "default";
        nextBtn.disabled = false;

        if (current === questions.length - 1) {
          setTimeout(finishQuiz, 650);
        }
      }

      function renderQuestion(index) {
        const q = questions[index];

        current = index;
        closeHint();
        questionLabel.textContent = `Question ${index + 1}`;
        questionText.textContent = q.label;

        content.innerHTML = "";

        const objectFrame = document.createElement("div");
        objectFrame.className = "object-frame";

        const objectImg = document.createElement("img");
        objectImg.src = q.image;
        objectImg.alt = `Figure ${index + 1}`;
        objectFrame.appendChild(objectImg);

        const drawingArea = document.createElement("div");
        drawingArea.className = "drawing-area";

        const canvasFrame = document.createElement("div");
        canvasFrame.className = "canvas-frame";

        const answerCanvas = document.createElement("canvas");
        answerCanvas.id = "answerCanvas";
        canvasFrame.appendChild(answerCanvas);

        const checkBtnRow = document.createElement("div");
        checkBtnRow.className = "check-btn-row";

        checkBtn = document.createElement("button");
        checkBtn.className = "check-btn";
        checkBtn.type = "button";
        checkBtn.textContent = "Check";
        checkBtn.disabled = completed[index] || !(savedStrokes[index] && savedStrokes[index].length);

        checkBtn.addEventListener("click", checkAnswer);

        checkBtnRow.appendChild(checkBtn);
        drawingArea.appendChild(canvasFrame);
        drawingArea.appendChild(checkBtnRow);

        content.appendChild(objectFrame);
        content.appendChild(drawingArea);

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !completed[index];

        setupCanvas();

        if (completed[index]) {
          canvasFrame.classList.add("correct-locked");
          canvas.style.cursor = "default";
        }
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
          <span class="icon-big">🎉</span>
          <h2>All Done!</h2>
          <p>Amazing! You got them all right!</p>
          <button class="btn-playagain">
            <i class="fa-solid fa-rotate-right"></i>
            Play again
          </button>
        `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          completed.fill(false);
          savedStrokes.fill(null);

          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) {
          renderQuestion(current - 1);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (completed[current] && current < questions.length - 1) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);

    })();
  </script>
