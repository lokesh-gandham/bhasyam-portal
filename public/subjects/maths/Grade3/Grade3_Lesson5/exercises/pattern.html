<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Pattern Quest</title>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400&family=Livvic:wght@400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../../shared/quiz-ui.css">

    <style>
        /* =========================================================
           RESET
        ========================================================= */
        * {
            box-sizing: border-box;
            font-weight: 400;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Baloo 2", "Trebuchet MS", Arial, sans-serif;
            background: linear-gradient(160deg, #eaf7ff 0%, #fdf9ec 100%);
            color: #26364a;
            font-weight: 400;
        }

        /* =========================================================
           SCALE-TO-FIT WRAPPER
           fixed design size, scaled by JS so the whole page fills
           any screen without a separate media-query set
        ========================================================= */
        #gameWrap {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 1600px;
            height: 900px;
            transform: translate(-50%, -50%);
        }

        /* no card look any more — content sits directly on the page */
        .game {
            width: 100%;
            height: 100%;
            background: transparent;
            border: 0;
            box-shadow: none;
            border-radius: 0;
            padding: 30px 50px;
            display: flex;
            flex-direction: column;
        }

        .screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-card {
            width: 100%;
            max-width: none;
            margin: 0 auto;
            text-align: center;
        }

        .instruction {
            font-size: 34px;
            font-weight: 400;
            margin: 0 0 30px;
            color: #233d59;
            line-height: 1.25;
        }

        /* =========================================================
           TRAIN TRACK / PATTERN BOX  (bigger)
        ========================================================= */
        .track-wrap {
            position: relative;
            width: 100%;
            padding: 70px 10px 46px;
            margin-bottom: 40px;
        }

        .track-wrap::before {
            content: "";
            position: absolute;
            left: 3%;
            right: 3%;
            bottom: 40px;
            height: 8px;
            border-radius: 8px;
            background: repeating-linear-gradient(90deg, #cdd8e2 0 30px, transparent 30px 46px);
            display: none;
        }

        .pattern-box {
            position: relative;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            flex-wrap: nowrap;
            gap: 0;
            z-index: 2;
        }

        /* the locomotive that leads the pattern */
        .engine {
            position: relative;
            flex: 0 0 auto;
            width: 150px;
            height: 126px;
            margin-right: -10px;
            background: linear-gradient(180deg, #ffd95a 0%, #ffbd3f 100%);
            border: 6px solid #263238;
            border-radius: 34px 20px 20px 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: chug 1.4s ease-in-out infinite;
            z-index: 3;
        }

        .engine::before {
            content: "";
            position: absolute;
            width: 40px;
            height: 40px;
            left: -24px;
            top: 12px;
            background: #ff6b6b;
            border: 6px solid #263238;
            border-radius: 13px;
        }

        .engine::after {
            content: "🙂";
            font-size: 48px;
        }

        .engine .puff {
            position: absolute;
            top: -40px;
            left: 18px;
            width: 24px;
            height: 24px;
            background: #fff;
            border: 4px solid #dfe6ec;
            border-radius: 50%;
            opacity: 0;
            animation: puff 2.2s ease-out infinite;
        }

        .engine .puff:nth-child(2) {
            animation-delay: .7s;
            left: 40px;
        }

        .engine .puff:nth-child(3) {
            animation-delay: 1.4s;
            left: 6px;
        }

        .engine .wheel,
        .term .wheel {
            position: absolute;
            bottom: -24px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #37474f;
            border: 5px solid #1c2528;
            animation: roll 1.1s linear infinite;
        }

        .wheel.left {
            left: 20px;
        }

        .wheel.right {
            right: 20px;
        }

        /* each pattern piece = a train car */
        .term {
            position: relative;
            flex: 0 0 auto;
            min-width: 120px;
            height: 120px;
            margin-left: 40px;
            padding: 14px 10px;
            background: #fff;
            border: 6px solid #55c6ea;
            border-radius: 28px 28px 18px 18px;
            box-shadow: 0 10px 0 #2f9fc2, inset 0 4px 0 rgba(255, 255, 255, .6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 400;
            color: #1c5878;
            animation: bob 2.6s ease-in-out infinite;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
        }

        .term:nth-of-type(3n+1) {
            border-color: #55c6ea;
            box-shadow: 0 10px 0 #2f9fc2, inset 0 4px 0 rgba(255, 255, 255, .6);
            color: #1c5878;
        }

        .term:nth-of-type(3n+2) {
            border-color: #ff9d5c;
            box-shadow: 0 10px 0 #d97a2f, inset 0 4px 0 rgba(255, 255, 255, .6);
            color: #7a4213;
        }

        .term:nth-of-type(3n) {
            border-color: #7bcf88;
            box-shadow: 0 10px 0 #4fa860, inset 0 4px 0 rgba(255, 255, 255, .6);
            color: #23632f;
        }

        .term::after {
            content: "";
            position: absolute;
            left: -30px;
            top: 50%;
            width: 30px;
            height: 12px;
            transform: translateY(-50%);
            background: #263238;
            border-radius: 6px;
            z-index: -1;
        }

        .term:first-of-type::after {
            display: none;
        }

        .term.blank {
            border-style: dashed;
            border-color: #ffae4c;
            background: #fff7e9;
            color: #ff9b27;
            box-shadow: 0 10px 0 #f1cf9d;
            font-size: 44px;
        }

        .term.blank.drop-hover {
            transform: translateY(-10px) scale(1.05);
            border-color: #55c6ea;
            background: #eefaff;
            box-shadow: 0 14px 0 #a9d9e9, 0 0 0 8px rgba(85, 198, 234, .18);
        }

        .term.filled {
            border-style: solid;
            border-color: #45ca91;
            background: #e7fff3;
            color: #16825b;
            box-shadow: 0 10px 0 #2aa976;
            animation: fillPop .42s ease;
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-7px) rotate(-1.2deg);
            }
        }

        @keyframes chug {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        @keyframes roll {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes puff {
            0% {
                opacity: 0;
                transform: translateY(0) scale(.5);
            }

            30% {
                opacity: .8;
            }

            100% {
                opacity: 0;
                transform: translateY(-32px) scale(1.3);
            }
        }

        @keyframes fillPop {
            0% {
                transform: scale(.8);
            }

            60% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        /* =========================================================
           OPTIONS (bigger)
        ========================================================= */
        .options-title {
            font-weight: 400;
            color: #627991;
            margin: 0 0 18px;
            font-size: 18px;
        }

        .options {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
            justify-items: stretch;
        }

        .option {
            border: 4px solid #3fa9d6;
            border-radius: 20px;
            min-height: 92px;
            padding: 14px 16px;
            background: linear-gradient(180deg, #ffffff, #ffffff);
            box-shadow: 0 7px 0 #2c85ab;
            color: #143a52;
            font: 400 26px "Baloo 2", "Trebuchet MS", Arial, sans-serif;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            /* user-select: none;
            touch-action: none; */
            transition: transform .16s ease, box-shadow .16s ease, opacity .2s ease;
        }

        .option:hover:not(:disabled) {
            transform: translateY(-3px);
            border-color: #1682b1;
            box-shadow: 0 10px 0 #2c85ab;
        }

        .option:active:not(:disabled) {
            cursor: grabbing;
        }

        .option:disabled {
            cursor: default;
        }

        .option.dragging {
            opacity: .5;
            transform: scale(.96);
        }

        .option.used {
            opacity: .38;
        }

        .option.correct {
            background: #ddfff0;
            border-color: #45ca91;
            box-shadow: 0 6px 0 #2aa976;
            color: #16825b;
            animation: pop .4s;
        }

        .option.wrong {
            background: #fff0f0;
            border-color: #ff7c7c;
            box-shadow: 0 6px 0 #e15d5d;
            color: #c94444;
            animation: shake .35s;
        }

        @keyframes pop {
            0% {
                transform: scale(.8);
            }

            60% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-7px);
            }

            75% {
                transform: translateX(7px);
            }
        }

        /* =========================================================
           FEEDBACK + NAV
        ========================================================= */
        .feedback {
            text-align: center;
            min-height: 30px;
            margin-top: 20px;
            font-weight: 400;
            font-size: 18px;
        }

        .feedback.good {
            color: #15976a;
        }

        .feedback.bad {
            color: #dc5555;
        }

        .nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 70px;
            margin-top: 24px;
        }

        .nav button {
            border: 0;
            border-radius: 999px;
            min-width: 140px;
            padding: 14px 22px;
            font: 400 17px "Baloo 2", "Trebuchet MS", Arial, sans-serif;
            cursor: pointer;
            transition: transform .15s ease;
        }

        .nav button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .prev {
            background: #edf2f7;
            color: #536b80;
        }

        .prev:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .next {
            background: linear-gradient(135deg, #48cfa1, #36b7e6);
            color: #fff;
            box-shadow: 0 5px 0 #2398a4;
        }

        .next:disabled {
            background: #d5e1e8;
            box-shadow: none;
            color: #8294a1;
            cursor: not-allowed;
        }

        /* =========================================================
           FINAL POPUP
        ========================================================= */
        .overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50;
        }

        .overlay.show {
            display: flex;
        }

        .modal {
            width: min(500px, 100%);
            background: #fff;
            border-radius: 28px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .25);
            animation: modalIn .3s;
        }

        .trophy {
            font-size: 65px;
        }

        .modal h2 {
            margin: 6px 0 8px;
            font-size: 32px;
            font-weight: 400;
            color: #1e1e2a;
        }

        .modal p {
            color: #3d3d4a;
            font-size: 17px;
            font-weight: 400;
            margin-bottom: 22px;
        }

        .restart {
            border: 0;
            background: linear-gradient(180deg, #ffb347, #f58a2e);
            color: #2d1f00;
            border-radius: 999px;
            padding: 12px 36px;
            box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 400;
            cursor: pointer;
        }

        @keyframes modalIn {
            from {
                transform: translateY(20px) scale(.94);
                opacity: 0;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        .burst {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 60;
            display: none;
        }

        .burst.show {
            display: block;
        }

        .confetti {
            position: absolute;
            width: 9px;
            height: 17px;
            animation: fall .9s ease-out forwards;
        }

        @keyframes fall {
            from {
                transform: translate(0, 0) rotate(0);
                opacity: 1;
            }

            to {
                transform: translate(var(--x), var(--y)) rotate(650deg);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div id="gameWrap">
        <div class="game">
            <main class="screen">
                <section class="question-card">
                    <h1 class="instruction">Complete the pattern by choosing the two missing parts.</h1>

                    <div class="track-wrap">
                        <div class="pattern-box" id="patternBox"></div>
                    </div>

                    <p class="options-title">Choose your answer</p>
                    <div class="options" id="options"></div>

                    <div class="feedback" id="feedback"></div>

                    <div class="nav">
                        <button type="button" class="prev" id="prevBtn" disabled>
                            <i class="fa-solid fa-chevron-left"></i> Prev
                        </button>
                        <button type="button" class="next" id="nextBtn" disabled>
                            Next <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="overlay" id="finalOverlay">
        <div class="modal">
            <div class="trophy">🎉</div>
            <h2>All Done!</h2>
            <p id="finalMessage"></p>
            <button type="button" class="restart" id="restartBtn">
                <i class="fa-solid fa-rotate-right"></i> Play again
            </button>
        </div>
    </div>
    <div class="burst" id="burst"></div>

    <script>
        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-US";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        const gameWrap = document.getElementById("gameWrap");
        function fitGameToScreen() {
            gameWrap.style.transform = "translate(-50%, -50%)";
            const rect = gameWrap.getBoundingClientRect();
            const availableW = window.innerWidth;
            const availableH = window.innerHeight;
            const scale = Math.max(availableW / rect.width, availableH / rect.height);
            gameWrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        window.addEventListener("resize", fitGameToScreen);
        window.addEventListener("load", fitGameToScreen);

        const questions = [
            {
                pattern: ["45", "49", "53", "57", "61", "65", "?", "?"],
                answer: ["69", "73"],
                choices: ["69", "73", "70", "75", "68", "72"]
            },
            {
                pattern: ["121", "135", "149", "163", "177", "?", "?"],
                answer: ["191", "205"],
                choices: ["191", "205", "190", "204", "192", "206"]
            },
            {
                pattern: ["4", "9", "16", "25", "36", "?", "?"],
                answer: ["49", "64"],
                choices: ["49", "64", "48", "63", "50", "65"]
            },
            {
                pattern: ["1", "9", "99", "100", "999", "?", "?"],
                answer: ["1000", "9999"],
                choices: ["1000", "9999", "9990", "10000", "1001", "9998"]
            },
            {
                pattern: ["AB", "ABCA", "ABCDAB", "ABCDEABC", "?", "?"],
                answer: ["ABCDEFABCD", "ABCDEFGABCDE"],
                choices: [
                    "ABCDEFABCD",
                    "ABCDEFGABCDE",
                    "ABCDEFABC",
                    "ABCDEFGHAB",
                    "ABCDEABCDE",
                    "ABCDEFABCDEF"
                ]
            }
        ];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        questions.forEach(q => shuffleArray(q.choices));

        let current = 0;
        let score = 0;
        let answered = Array(questions.length).fill(false);
        let selected = Array(questions.length).fill(null);

        function $(id) { return document.getElementById(id); }

        function render() {
            const q = questions[current];

            const box = $("patternBox");
            box.innerHTML = "";

            const engine = document.createElement("div");
            engine.className = "engine";
            engine.innerHTML =
                '<span class="puff"></span><span class="puff"></span><span class="puff"></span>' +
                '<span class="wheel left"></span><span class="wheel right"></span>';
            box.appendChild(engine);

            q.pattern.forEach((item, patternIndex) => {
                const el = document.createElement("div");
                el.className = "term" + (item === "?" ? " blank" : "");
                el.innerHTML =
                    '<span class="wheel left"></span><span class="wheel right"></span>' +
                    '<span class="term-text">' + item + '</span>';

                if (item === "?") {
                    el.dataset.blankIndex = String(
                        [...q.pattern.slice(0, patternIndex)].filter(x => x === "?").length
                    );
                    el.addEventListener("dragover", e => {
                        e.preventDefault();
                        if (!answered[current]) el.classList.add("drop-hover");
                    });
                    el.addEventListener("dragleave", () => el.classList.remove("drop-hover"));
                    el.addEventListener("drop", e => {
                        e.preventDefault();
                        el.classList.remove("drop-hover");
                        const optionIndex = Number(e.dataTransfer.getData("text/plain"));
                        if (!Number.isNaN(optionIndex)) checkAnswer(optionIndex, null, el);
                    });
                }

                box.appendChild(el);
            });

            $("options").innerHTML = "";

            const flatChoices = [];
            q.choices.forEach((choice, choiceIndex) => {
                if (Array.isArray(choice)) {
                    choice.forEach(value => flatChoices.push({ value: String(value), choiceIndex }));
                } else {
                    flatChoices.push({ value: String(choice), choiceIndex });
                }
            });

            flatChoices.slice(0, 6).forEach((item, index) => {
                const b = document.createElement("button");
                b.className = "option";
                b.type = "button";
                b.textContent = item.value;
                b.draggable = true;
                b.dataset.value = item.value;
                b.dataset.index = String(index);

                b.addEventListener("click", () => {
                    const blank = [...document.querySelectorAll(".term.blank")]
                        .find(el => !el.dataset.filled);
                    if (blank) checkAnswer(index, b, blank);
                });

                b.addEventListener("dragstart", e => {
    if (b.disabled || b.classList.contains("used")) {
        e.preventDefault();
        return;
    }
    b.classList.add("dragging");
    e.dataTransfer.effectAllowed = "copy";
    e.dataTransfer.setData("text/plain", String(index));

    // Build a small custom drag ghost sized to the text
    const ghost = document.createElement("div");
    ghost.textContent = b.textContent;
    ghost.style.position = "absolute";
    ghost.style.top = "-1000px";
    ghost.style.left = "-1000px";
    ghost.style.display = "inline-block";
    ghost.style.padding = "15px 20px";
    ghost.style.background = "#ffffff";
    ghost.style.border = "3px solid #3fa9d6";
    ghost.style.borderRadius = "12px";
    ghost.style.boxShadow = "0 4px 0 #2c85ab";
    ghost.style.color = "#143a52";
    ghost.style.font = '400 20px "Baloo 2", "Trebuchet MS", Arial, sans-serif';
    ghost.style.whiteSpace = "nowrap";
    ghost.style.pointerEvents = "none";

    document.body.appendChild(ghost);

    e.dataTransfer.setDragImage(
      ghost,
      ghost.offsetWidth / 2,
      ghost.offsetHeight / 2
    );

    // Clean up the ghost once the browser has captured it
    setTimeout(() => ghost.remove(), 0);
});
                b.addEventListener("dragend", () => b.classList.remove("dragging"));

                $("options").appendChild(b);
            });

            $("feedback").textContent = "";
            $("feedback").className = "feedback";
            $("nextBtn").disabled = !answered[current];
            $("prevBtn").disabled = current === 0;

            if (answered[current]) {
                fillMissing();
                showSavedAnswer();
            }

            requestAnimationFrame(fitGameToScreen);
        }

        function getChoiceValue(index) {
            const buttons = [...document.querySelectorAll(".option")];
            return buttons[index] ? buttons[index].dataset.value : "";
        }

        function checkAnswer(index, button, targetBlank) {
            if (answered[current]) return;

            const q = questions[current];
            const value = getChoiceValue(index);
            if (!value) return;

            const blanks = [...document.querySelectorAll(".term.blank")];
            if (!targetBlank) targetBlank = blanks.find(el => !el.dataset.filled);
            if (!targetBlank || targetBlank.dataset.filled) return;

            const blankIndex = Number(targetBlank.dataset.blankIndex);
            const correctValue = String(q.answer[blankIndex]);

            const buttons = [...document.querySelectorAll(".option")];
            const pickedButton = buttons[index];

            if (value === correctValue) {
                targetBlank.querySelector(".term-text").textContent = value;
                targetBlank.classList.remove("blank", "drop-hover");
                targetBlank.classList.add("filled");
                targetBlank.dataset.filled = "true";

                if (pickedButton) {
                    pickedButton.disabled = true;
                    pickedButton.classList.add("correct", "used");
                    pickedButton.draggable = false;
                }

                const remainingBlanks = [...document.querySelectorAll(".term.blank")];

                if (remainingBlanks.length === 0) {
                    answered[current] = true;
                    selected[current] = q.answer.slice();
                    score++;

                    buttons.forEach(b => {
                        if (!b.classList.contains("used")) {
                            b.disabled = true;
                            b.draggable = false;
                        }
                    });

                    $("feedback").textContent = "🎉 Correct! Great pattern spotting!";
                    $("feedback").className = "feedback good";
                    $("nextBtn").disabled = false;

                    celebrate();

                    if (current === questions.length - 1) {
                        setTimeout(showFinalPopup, 1600);
                    }
                } else {
                    $("feedback").textContent = "Great! Now fill the other blank.";
                    $("feedback").className = "feedback good";
                    speak("Great!");
                }
            } else {
                if (pickedButton) {
                    pickedButton.classList.remove("wrong");
                    void pickedButton.offsetWidth;
                    pickedButton.classList.add("wrong");
                    setTimeout(() => pickedButton.classList.remove("wrong"), 450);
                }
                speak("Wrong!");
                $("feedback").textContent = "Try again! Look carefully at the pattern.";
                $("feedback").className = "feedback bad";
            }
        }

        function fillMissing() {
            const q = questions[current];
            const blanks = [...document.querySelectorAll(".term.blank")];
            blanks.forEach((el) => {
                const i = Number(el.dataset.blankIndex);
                el.querySelector(".term-text").textContent = q.answer[i];
                el.classList.remove("blank");
                el.classList.add("filled");
                el.dataset.filled = "true";
            });
        }

        function showSavedAnswer() {
            const q = questions[current];
            [...document.querySelectorAll(".option")].forEach(b => {
                b.disabled = true;
                b.draggable = false;
                if (q.answer.map(String).includes(b.dataset.value)) {
                    b.classList.add("correct", "used");
                }
            });
            $("feedback").textContent = "✓ Answer completed";
            $("feedback").className = "feedback good";
        }

        function nextQuestion() {
            if (!answered[current]) return;
            if (current < questions.length - 1) {
                current++;
                render();
            } else {
                showFinalPopup();
            }
        }

        function previousQuestion() {
            if (current > 0) {
                current--;
                render();
            }
        }

        function showFinalPopup() {
            if (window.quizUiSfx) window.quizUiSfx.finish();

            $("finalMessage").textContent = "Amazing! You got them all right!";
            $("finalOverlay").classList.add("show");

            const modal = document.querySelector("#finalOverlay .modal");

            const fireConfetti = window.burstConfetti || function (element) {
                if (typeof window.confetti !== "function" || !element) return;
                const rect = element.getBoundingClientRect();
                window.confetti({
                    particleCount: 34,
                    spread: 70,
                    startVelocity: 22,
                    origin: {
                        x: (rect.left + rect.width / 2) / window.innerWidth,
                        y: (rect.top + rect.height / 2) / window.innerHeight
                    },
                    colors: ["#6635dc", "#ff4e83", "#4e8ff0", "#76b93b", "#f4ae25", "#4ecdc4"]
                });
            };

            setTimeout(function () { fireConfetti(modal); }, 80);
            setTimeout(function () { fireConfetti(modal); }, 350);
            setTimeout(function () { fireConfetti(modal); }, 650);
        }

        function restartGame() {
            current = 0;
            score = 0;
            answered = Array(questions.length).fill(false);
            selected = Array(questions.length).fill(null);
            $("finalOverlay").classList.remove("show");
            render();
        }

        function celebrate() {
            if (window.quizUiSfx) speak("Correct!");
            if (window.showCorrectEmoji) window.showCorrectEmoji();
            if (window.burstConfetti) {
                window.burstConfetti(document.querySelector(".instruction"), "#7ed957");
            }
        }

        document.addEventListener("DOMContentLoaded", render);
        document.getElementById("nextBtn").addEventListener("click", nextQuestion);
        document.getElementById("prevBtn").addEventListener("click", previousQuestion);
        document.getElementById("restartBtn").addEventListener("click", restartGame);
    </script>
    <script src="../../shared/quiz-ui.js"></script>
</body>

</html>
