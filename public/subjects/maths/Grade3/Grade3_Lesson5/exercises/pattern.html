<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Pattern Quest</title>
    <style>
        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden
        }

        body {
            font-family: Trebuchet MS, Arial, sans-serif;
            background: linear-gradient(135deg, #dff7ff, #eef8ff 45%, #fff5d8);
            color: #26364a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px
        }

        .game {
            width: min(1450px, 100%);
            height: min(96vh, 900px);
            background: rgba(255, 255, 255, .96);
            border: 3px solid #fff;
            border-radius: 28px;
            box-shadow: 0 18px 50px rgba(38, 72, 105, .18);
            padding: 18px;
            overflow: hidden
        }

        .screen {
            height: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 230px;
            gap: 16px
        }

        .question-card,
        .side-panel {
            min-height: 0;
            border: 3px solid #dcecf7;
            border-radius: 24px;
            background: linear-gradient(180deg, #fff, #f7fbff)
        }

        .question-card {
            padding: clamp(14px, 2vw, 28px);
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        .level {
            display: inline-block;
            align-self: flex-start;
            background: #e8f7ff;
            color: #1682b1;
            border: 2px solid #bce7fa;
            border-radius: 99px;
            padding: 6px 13px;
            font-weight: 400;
            font-size: 14px;
            margin-bottom: 12px
        }

        .instruction {
            font-size: clamp(20px, 2.3vw, 31px);
            margin: 0 0 18px;
            color: #233d59
        }

        .pattern-box {
            background: #fffdf4;
            border: 3px dashed #f3cf73;
            border-radius: 20px;
            padding: 18px 10px;
            min-height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px
        }

        .term {
            min-width: 64px;
            padding: 11px 9px;
            border-radius: 13px;
            background: #fff;
            border: 2px solid #d8e4ee;
            box-shadow: 0 4px 0 #dce7ee;
            font-weight: 400;
            font-size: clamp(18px, 2vw, 26px);
            text-align: center;
            color: #304b66
        }

        .term.blank {
            border: 3px dashed #ffae4c;
            color: #ff9b27;
            background: #fff7e9;
            box-shadow: none
        }

        .term.missing {
            min-width: 95px
        }

        .options-title {
            text-align: center;
            font-weight: 400;
            color: #627991;
            margin: 0 0 9px
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px
        }

        .option {
            border: 3px solid #cfe2ef;
            border-radius: 15px;
            min-height: 58px;
            padding: 9px;
            background: linear-gradient(180deg, #fff, #edf6fc);
            box-shadow: 0 5px 0 #bdd3e2;
            color: #26445f;
            font: 400 clamp(16px, 1.8vw, 22px) Trebuchet MS, Arial, sans-serif;
            cursor: pointer
        }

        .option:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #55c6ea
        }

        .option.correct {
            background: #ddfff0;
            border-color: #45ca91;
            box-shadow: 0 5px 0 #2aa976;
            color: #16825b;
            animation: pop .4s
        }

        .option.wrong {
            background: #fff0f0;
            border-color: #ff7c7c;
            box-shadow: 0 5px 0 #e15d5d;
            color: #c94444;
            animation: shake .35s
        }

        .feedback {
            text-align: center;
            min-height: 27px;
            margin-top: 9px;
            font-weight: 400
        }

        .feedback.good {
            color: #15976a
        }

        .feedback.bad {
            color: #dc5555
        }

        .nav {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px
        }

        .nav button,
        .restart {
            border: 0;
            border-radius: 13px;
            padding: 11px 18px;
            font: 400 15px Trebuchet MS, Arial, sans-serif;
            cursor: pointer
        }

        .prev {
            background: #edf2f7;
            color: #536b80
        }

        .prev:disabled {
            opacity: .45;
            cursor: not-allowed
        }

        .next {
            background: linear-gradient(135deg, #48cfa1, #36b7e6);
            color: #fff;
            box-shadow: 0 5px 0 #2398a4
        }

        .next:disabled {
            background: #d5e1e8;
            box-shadow: none;
            color: #8294a1;
            cursor: not-allowed
        }

        .side-panel {
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(180deg, #f0fbff, #f9f5ff)
        }

        .character {
            background: #fff;
            border: 2px solid #e4edf4;
            border-radius: 18px;
            padding: 7px;
            text-align: center
            
        }

        .character img {
            width: 100%;
            height: auto;
            max-height: 260px;
            object-fit: contain;
            display: block
        }

        .hint {
            margin-top: 10px;
            padding: 12px;
            background: #fff9df;
            border: 2px solid #f2dc89;
            border-radius: 15px;
            line-height: 1.35;
            font-size: 13px;
            font-weight: 400;
            color: #6c5b2b
        }

        .side-note {
            text-align: center;
            font-weight: 400;
            color: #71869b;
            margin-top: 10px
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50
        }

        .overlay.show {
            display: flex
        }

        .modal {
            width: min(500px, 100%);
            background: #fff;
            border-radius: 28px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .25);
            animation: modalIn .3s
        }

        .trophy {
            font-size: 65px
        }

        .modal h2 {
            margin: 6px 0 8px;
            font-size: clamp(28px, 5vw, 33px);
            font-weight: 400;
            color: #1e1e2a
        }

        .modal p {
            color: #3d3d4a;
            font-size: 17px;
            font-weight: 400;
            margin-bottom: 22px
        }

        .restart {
            background: linear-gradient(180deg, #ffb347, #f58a2e);
            color: #2d1f00;
            border-radius: 999px;
            padding: 12px 36px;
            box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 400;
        }

        .burst {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 60;
            display: none
        }

        .burst.show {
            display: block
        }

        .confetti {
            position: absolute;
            width: 9px;
            height: 17px;
            animation: fall .9s ease-out forwards
        }

        @keyframes pop {
            0% {
                transform: scale(.8)
            }

            60% {
                transform: scale(1.08)
            }

            100% {
                transform: scale(1)
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-7px)
            }

            75% {
                transform: translateX(7px)
            }
        }

        @keyframes modalIn {
            from {
                transform: translateY(20px) scale(.94);
                opacity: 0
            }

            to {
                transform: none;
                opacity: 1
            }
        }

        @keyframes fall {
            from {
                transform: translate(0, 0) rotate(0);
                opacity: 1
            }

            to {
                transform: translate(var(--x), var(--y)) rotate(650deg);
                opacity: 0
            }
        }

        @media(max-width:900px) {
            .game {
                height: 98vh;
                padding: 9px;
                border-radius: 20px
            }

            .screen {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                gap: 7px
            }

            .side-panel {
                height: 20vh;
                min-height: 0;
                flex-direction: row;
                align-items: center;
                padding: 6px
            }

            .character {
                width: 115px;
                flex: 0 0 115px;
                padding: 4px
            }

            .character img {
                max-height: 100px
            }

            .hint {
                display: none
            }

            .side-note {
                flex: 1;
                font-size: 13px
            }

            .question-card {
                padding: 10px;
                border-radius: 18px
            }

            .pattern-box {
                min-height: 90px;
                padding: 10px;
                margin-bottom: 9px
            }

            .instruction {
                margin-bottom: 9px
            }

            .option {
                min-height: 50px
            }

            .nav {
                margin-top: 5px
            }
        }

        @media(max-width:600px) {
            body {
                padding: 3px
            }

            .game {
                height: 99vh;
                padding: 6px;
                border-width: 2px;
                border-radius: 15px
            }

            .screen {
                gap: 5px
            }

            .side-panel {
                height: 15vh;
                padding: 4px;
                border-radius: 13px
            }

            .character {
                width: 75px;
                flex-basis: 75px
            }

            .character img {
                max-height: 65px
            }

            .side-note {
                font-size: 10px
            }

            .question-card {
                padding: 7px;
                border-radius: 13px
            }

            .level {
                font-size: 10px;
                padding: 3px 8px;
                margin-bottom: 4px
            }

            .instruction {
                font-size: clamp(16px, 5vw, 21px);
                margin-bottom: 6px
            }

            .pattern-box {
                min-height: 68px;
                padding: 6px 3px;
                gap: 4px;
                margin-bottom: 6px
            }

            .term {
                min-width: 40px;
                padding: 6px 3px;
                font-size: 15px;
                border-radius: 9px
            }

            .term.missing {
                min-width: 58px
            }

            .options-title {
                font-size: 11px;
                margin-bottom: 4px
            }

            .options {
                gap: 5px
            }

            .option {
                min-height: 39px;
                padding: 5px 3px;
                border-width: 2px;
                border-radius: 9px;
                font-size: 14px;
                box-shadow: 0 3px 0 #bdd3e2
            }

            .feedback {
                min-height: 17px;
                margin-top: 3px;
                font-size: 11px
            }

            .nav {
                margin-top: 3px
            }

            .nav button {
                padding: 6px 9px;
                border-radius: 9px;
                font-size: 11px
            }
        }

        @media(max-width:900px) and (orientation:landscape) and (max-height:520px) {
            .game {
                height: 99vh
            }

            .screen {
                grid-template-columns: minmax(0, 1fr) 145px;
                grid-template-rows: 1fr
            }

            .side-panel {
                height: 100%;
                flex-direction: column
            }

            .character {
                width: 100%;
                flex: 0 0 auto
            }

            .character img {
                max-height: 100px
            }

            .hint {
                display: none
            }

            .side-note {
                font-size: 10px
            }

            .question-card {
                padding: 6px
            }

            .pattern-box {
                min-height: 55px;
                margin-bottom: 4px
            }

            .instruction {
                font-size: 16px;
                margin-bottom: 4px
            }

            .option {
                min-height: 32px;
                font-size: 12px
            }

            .feedback {
                min-height: 14px;
                font-size: 10px
            }

            .nav {
                margin-top: 2px
            }

            .nav button {
                padding: 4px 7px;
                font-size: 10px
            }
        }
    </style>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../../shared/quiz-ui.css">
</head>

<body>
    <div class="game">
        <main class="screen">
            <section class="question-card">
                <div class="level" id="level">LEVEL 1</div>
                <h1 class="instruction">Complete the pattern by choosing the two missing parts.</h1>
                <div class="pattern-box" id="patternBox"></div>
                <p class="options-title">Choose your answer</p>
                <div class="options" id="options"></div>
                <div class="feedback" id="feedback"></div>
                <div class="nav"><button type="button" class="prev" id="prevBtn" disabled><i class="fa-solid fa-chevron-left nav-icon"></i> Prev</button><button
                        type="button" class="next" id="nextBtn" disabled>Next <i class="fa-solid fa-chevron-right nav-icon"></i></button></div>
            </section>
            <aside class="side-panel">
                <div>
                    <div class="character"><img src="../assets/images/pattern.jpg" alt="Pattern image"></div>
                    <div class="hint">💡 <b>Think!</b><br>Look at how the numbers or letters change from one term to the
                        next.</div>
                </div>
                <div class="side-note">🌟 Find the pattern!</div>
            </aside>
        </main>
    </div>
    <div class="overlay" id="finalOverlay">
        <div class="modal">
            <div class="trophy">🎉</div>
            <h2>All Done!</h2>
            <p id="finalMessage"></p>
            <button type="button" class="restart"
                id="restartBtn"><i class="fa-solid fa-rotate-right"></i> Play again</button>
        </div>
    </div>
    <div class="burst" id="burst"></div>
    <script>const questions = 
    [{ pattern: ["45", "49", "53", "57", "61", "65", "?", "?"], answer: ["69", "73"], choices: [["69", "73"], ["70", "75"], ["68", "72"], ["71", "77"]] },
     { pattern: ["121", "135", "149", "163", "177", "?", "?"], answer: ["191", "205"], choices: [["191", "205"], ["190", "204"], ["192", "206"], ["195", "209"]] },
      { pattern: ["4", "9", "16", "25", "36", "?", "?"], answer: ["49", "64"], choices: [["49", "64"], ["48", "63"], ["50", "65"], ["54", "72"]] }, 
      { pattern: ["1", "9", "99", "100", "999", "?", "?"], answer: ["1000", "9999"], choices: [["1000", "9999"], ["9990", "10000"], ["1001", "9998"], ["1000", "9990"]] },
       { pattern: ["AB", "ABCA", "ABCDAB", "ABCDEABC", "?", "?"], answer: ["ABCDEFABCD", "ABCDEFGABCDE"], choices: [["ABCDEFABCD", "ABCDEFGABCDE"], ["ABCDEFABC", "ABCDEFGHAB"], ["ABCDEABCDE", "ABCDEFABCDEF"], ["ABCDEFABCE", "ABCDEFGABCD"]] }
    ];

        function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[arr[i], arr[j]] = [arr[j], arr[i]] } return arr }
        questions.forEach(q => shuffleArray(q.choices));
        let current = 0, score = 0, answered = Array(questions.length).fill(false), selected = Array(questions.length).fill(null);
        function $(id) { return document.getElementById(id) }
        function render() { const q = questions[current]; $("level").textContent = "LEVEL " + (current + 1); const box = $("patternBox"); box.innerHTML = ""; q.pattern.forEach((item) => { const el = document.createElement("div"); el.className = "term" + (item === "?" ? " blank missing" : ""); el.textContent = item; box.appendChild(el) }); $("options").innerHTML = ""; q.choices.forEach((choice, index) => { const b = document.createElement("button"); b.className = "option"; b.type = "button"; b.textContent = choice[0] + "    " + choice[1]; b.addEventListener("click", () => checkAnswer(index, b)); $("options").appendChild(b) }); $("feedback").textContent = ""; $("feedback").className = "feedback"; $("nextBtn").disabled = !answered[current]; $("prevBtn").disabled = current === 0; if (answered[current]) { fillMissing(false); showSavedAnswer() } }
        function checkAnswer(index, button) { if (answered[current]) return; const q = questions[current], picked = q.choices[index], buttons = [...document.querySelectorAll(".option")]; if (picked[0] === q.answer[0] && picked[1] === q.answer[1]) { buttons.forEach(b => b.disabled = true); button.classList.add("correct"); answered[current] = true; selected[current] = picked; score++; $("feedback").textContent = "🎉 Correct! Great pattern spotting!"; $("feedback").className = "feedback good"; fillMissing(true); $("nextBtn").disabled = false; celebrate(); if (current === questions.length - 1) setTimeout(showFinalPopup, 700) } else { button.classList.add("wrong"); $("feedback").textContent = "Try again! Look carefully at the pattern."; $("feedback").className = "feedback bad"; setTimeout(() => { button.classList.remove("wrong") }, 450) } }
        function fillMissing(animate) { const q = questions[current], blanks = [...document.querySelectorAll(".term.blank")]; blanks.forEach((el, i) => { el.textContent = q.answer[i]; el.classList.remove("blank"); el.style.background = "#e7fff3"; el.style.borderColor = "#45ca91"; el.style.color = "#16825b"; el.style.boxShadow = "0 4px 0 #b8e5cf"; if (animate && el.animate) el.animate([{ transform: "scale(.75)" }, { transform: "scale(1.12)" }, { transform: "scale(1)" }], { duration: 450 }) }) }
        function showSavedAnswer() { const q = questions[current];[...document.querySelectorAll(".option")].forEach((b, i) => { b.disabled = true; if (q.choices[i][0] === q.answer[0] && q.choices[i][1] === q.answer[1]) b.classList.add("correct") }); $("feedback").textContent = "✓ Answer completed"; $("feedback").className = "feedback good" }
        function nextQuestion() { if (!answered[current]) return; if (current < questions.length - 1) { current++; render() } else showFinalPopup() }
        function previousQuestion() { if (current > 0) { current--; render() } }
        function showFinalPopup() {
            if (window.quizUiSfx) window.quizUiSfx.finish();
            $("finalMessage").textContent = "Amazing! You got them all right!";
            $("finalOverlay").classList.add("show");
            var modal = document.querySelector("#finalOverlay .modal");
            var fireConfetti = window.burstConfetti || function (element) {
                if (typeof window.confetti !== "function" || !element) return;
                var rect = element.getBoundingClientRect();
                window.confetti({
                    particleCount: 34,
                    spread: 70,
                    startVelocity: 22,
                    origin: {
                        x: (rect.left + rect.width / 2) / window.innerWidth,
                        y: (rect.top + rect.height / 2) / window.innerHeight
                    },
                    colors: ["#6635dc", "#ff4e83", "#4e8ff0", "#76b93b", "#f4ae25", "#4ecdc4"]
                });
            };
            setTimeout(function () { fireConfetti(modal); }, 80);
            setTimeout(function () { fireConfetti(modal); }, 350);
            setTimeout(function () { fireConfetti(modal); }, 650);
        }
        function restartGame() { current = 0; score = 0; answered = Array(questions.length).fill(false); selected = Array(questions.length).fill(null); $("finalOverlay").classList.remove("show"); render() }
        function celebrate() { if (window.quizUiSfx) window.quizUiSfx.correct(); if (window.showCorrectEmoji) window.showCorrectEmoji(); if (window.burstConfetti) window.burstConfetti(document.querySelector(".instruction"), "#7ed957"); }
        document.addEventListener("DOMContentLoaded", render); document.getElementById("nextBtn").addEventListener("click", nextQuestion); document.getElementById("prevBtn").addEventListener("click", previousQuestion); document.getElementById("restartBtn").addEventListener("click", restartGame);</script>
<script src="../../shared/quiz-ui.js"></script>
</body>

</html>
