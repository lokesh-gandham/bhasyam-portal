<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What is it?</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @font-face {
      font-family: "CCSyntroman";
      src: url("../assets/CCSYNTRO.TTF") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "CCSyntroman", "Baloo 2", sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      height: 100vh;
      overflow: hidden;
      padding: 12px 20px;
      background: #fbf7f0;
      position: relative;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0;
      display: none;
    }

    .header h1 {
      color: #12265d;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 400;
    }

    .question-screen {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0;
    }

    .question-text {
      color: #12265d;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 26px;
      text-align: left;
      max-width: 900px;
      line-height: 1.4;
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .shape-question-label {
      width: 100%;
      max-width: 900px;
      color: #2f4f4f;
      font-size: 30px;
      font-weight: 400;
      text-align: center;
      margin-bottom: 14px;
      line-height: 1.25;
    }

    .shape-display {
      width: 210px;
      height: 145px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .shape-display img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .shape-display svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .questions-grid {
      width: 100%;
      max-width: 1080px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px 20px;
    }

    .answer-question {
      min-width: 0;
      padding: 16px 18px;
      /* border: 2px solid #e1e5ee; */
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 5px 0 rgba(18, 38, 93, .06),
        0 9px 18px rgba(18, 38, 93, .06);
    }

    .answer-question:nth-child(1) {
      background: #fff5cd;
      border-color: #ffd86b;
    }

    .answer-question:nth-child(2) {
      background: #e1f6fd;
      border-color: #72d8f2;
    }

    .answer-question:nth-child(3) {
      background: #e6d4ff;
      border-color: #bd91f2;
    }

    .answer-question:nth-child(4) {
      background: #e9fdca;
      border-color: #b2d973;
    }

    .answer-question-label {
      color: #12265d;
      font-size: 19px;
      font-weight: 400;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .answer-entry {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .answer-input {
      width: 62%;
      min-width: 0;
      height: 52px;
      box-sizing: border-box;
      border: 2px solid #b8c4d8;
      border-radius: 14px;
      background: rgba(255, 255, 255, .97);
      color: #12265d;
      padding: 8px 13px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 400;
      outline: none;
      box-shadow: 0 4px 0 rgba(18, 38, 93, .07);
      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        transform .12s ease,
        background-color .18s ease;
    }

    .answer-input::placeholder {
      color: #9aa4b7;
      opacity: 1;
    }

    /* Nice "active" typing state */
    .answer-input:hover:not(:disabled) {
      border-color: #6676c9;
      background: #fff;
      box-shadow:
        0 0 0 4px rgba(102, 118, 201, .18),
        0 6px 14px rgba(18, 38, 93, .13);
      transform: translateY(-2px);
    }

    .answer-input:focus {
      border-color: #6676c9;
      background: #fff;
      box-shadow:
        0 0 0 4px rgba(102, 118, 201, .18),
        0 6px 14px rgba(18, 38, 93, .13);
      transform: translateY(-2px);
    }

    .answer-input:focus::placeholder {
      color: #b0b7c7;
    }

    .answer-input:disabled {
      cursor: default;
    }

    /* Correct answer state */
    .answer-input.correct {
      border-color: #55b449 !important;
      background: #f2fff4;
      box-shadow:
        0 0 0 4px rgba(85, 180, 73, .16),
        0 5px 14px rgba(85, 180, 73, .18) !important;
      transform: translateY(-1px);
    }

    /* Wrong answer state */
    .answer-input.wrong {
      border-color: #ef4f47 !important;
      background: #fff4f3;
      box-shadow:
        0 0 0 4px rgba(239, 79, 71, .16),
        0 5px 14px rgba(239, 79, 71, .16) !important;
    }

    /* Small validation popup that visually comes from the input */
    .answer-entry {
      position: relative;
    }

    .input-type-popup {
      position: absolute;
      left: 50%;
      top: calc(100% + 8px);
      transform: translateX(-50%) translateY(-4px) scale(.96);
      z-index: 50;
      max-width: 190px;
      padding: 7px 11px;
      border-radius: 9px;
      background: #12265d;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
      box-shadow: 0 6px 14px rgba(18, 38, 93, .18);
      opacity: 0;
      pointer-events: none;
      animation: inputPopup .18s ease-out forwards;
    }

    .input-type-popup::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -5px;
      width: 10px;
      height: 10px;
      background: #12265d;
      transform: translateX(-50%) rotate(45deg);
    }

    @keyframes inputPopup {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-4px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }


    .check-button {
      height: 52px;
      min-width: 84px;
      border: 2px solid #6676c9;
      border-radius: 12px;
      background: #6676c9;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 400;
      cursor: pointer;
      box-shadow: 0 4px 0 #4f5fae;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .check-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #4f5fae;
    }

    .check-button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #4f5fae;
    }

    .check-button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .check-button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #4f5fae;
    }

    .wrong-blink {
      animation: wrongBlink .7s ease-in-out;
    }

    @keyframes wrongBlink {
      0% {
        border-color: #ef4f47;
        box-shadow: 0 0 0 4px rgba(239, 79, 71, .18),
          0 0 16px rgba(239, 79, 71, .28);
        transform: translateX(0);
      }

      15% {
        transform: translateX(-5px);
      }

      30% {
        border-color: #ff3f3f;
        box-shadow: 0 0 0 5px rgba(239, 79, 71, .22),
          0 0 22px rgba(239, 79, 71, .38);
        transform: translateX(5px);
      }

      45% {
        transform: translateX(-4px);
      }

      60% {
        border-color: #ef4f47;
        box-shadow: 0 0 0 4px rgba(239, 79, 71, .18),
          0 0 18px rgba(239, 79, 71, .32);
        transform: translateX(4px);
      }

      75% {
        transform: translateX(-2px);
      }

      100% {
        border-color: #b8c4d8;
        box-shadow: 0 4px 0 rgba(18, 38, 93, .07);
        transform: translateX(0);
      }
    }

      margin: auto auto 0;
      padding-top: 18px;

      position: relative;

    .nav-progress {

      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .nav button {

      border: 0;
      border-radius: 999px;

      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    #prevBtn {
      justify-self: start;
    }

    #nextBtn {
      justify-self: end;

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;

    @keyframes emojiPop {

        opacity: 0;

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;

      }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
      background: rgba(18, 38, 93, .10);

    @keyframes fadeIn {

    .final-modal {

    @keyframes popUp {

    .final-modal .icon-big {

<body>
  <main class="quiz-wrap">

    <header class="header">
      <h1>Complete the following table.</h1>
    </header>

    <section class="question-screen">
      <div class="question-text" id="questionText"></div>
      <div class="question-content" id="questionContent"></div>
    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i>
        Prev
      </button>

      <button id="nextBtn" disabled>
        Next
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {

      const questions = [
        {
          image: "../assets/images/brick.png",
          shapeName: "Brick",
          shapeOfObject: "Cuboid",
          edges: "12",
          faces: "6",
          vertices: "8"
        },
        {
          image: "../assets/images/football.png",
          shapeName: "Ball",
          shapeOfObject: "Sphere",
          edges: "0",
          faces: "1",
          vertices: "0"
        },
        {
          image: "../assets/images/cream.png",
          shapeName: "Ice cream",
          shapeOfObject: "Cone",
          edges: "1",
          faces: "2",
          vertices: "1"
        }
      ];

      const questionText = document.getElementById("questionText");
      const content = document.getElementById("questionContent");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let current = 0;
      const completed = Array(questions.length).fill(false);
      let audioCtx = null;

      const quizWrap = document.querySelector(".quiz-wrap");

      function fitQuizToScreen() {
        quizWrap.style.transform = "translate(-50%, -50%)";
        const rect = quizWrap.getBoundingClientRect();
        const availableH = window.innerHeight - 16;
        const availableW = window.innerWidth - 16;
        const scale = Math.min(availableH / rect.height, availableW / rect.width);
        quizWrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }

      window.addEventListener("resize", fitQuizToScreen);
      window.addEventListener("load", fitQuizToScreen);

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);

        setTimeout(() => element.remove(), 1600);
      }

      function renderQuestion(index) {
        const q = questions[index];
        current = index;

        questionText.textContent = "";
        content.innerHTML = "";

        const questionLabel = document.createElement("div");
        questionLabel.className = "shape-question-label";
        questionLabel.textContent = `Question ${index + 1}: Complete the following.`;

        const shapeDisplay = document.createElement("div");
        shapeDisplay.className = "shape-display";

        const image = document.createElement("img");
        image.src = q.image;
        image.alt = q.shapeName;
        image.draggable = false;
        shapeDisplay.appendChild(image);

        const questionsGrid = document.createElement("div");
        questionsGrid.className = "questions-grid";

        const rows = [
          {
            label: "Shape of the object",
            answer: q.shapeOfObject,
            inputType: "text",
            allowedType: "text"
          },
          {
            label: "Number of edges",
            answer: q.edges,
            inputType: "text",
            allowedType: "number"
          },
          {
            label: "Number of faces",
            answer: q.faces,
            inputType: "text",
            allowedType: "number"
          },
          {
            label: "Number of vertices",
            answer: q.vertices,
            inputType: "text",
            allowedType: "number"
          }
        ];

        let correctCount = 0;
        const savedRows = [];

        rows.forEach(rowData => {
          const card = document.createElement("div");
          card.className = "answer-question";

          const label = document.createElement("div");
          label.className = "answer-question-label";
          label.textContent = rowData.label;

          const entry = document.createElement("div");
          entry.className = "answer-entry";

          const input = document.createElement("input");
          input.className = "answer-input";
          input.type = rowData.inputType;
          input.inputMode = rowData.allowedType === "number" ? "numeric" : "text";
          input.autocomplete = "off";
          input.spellcheck = false;

          const check = document.createElement("button");
          check.className = "check-button";
          check.type = "button";
          check.textContent = "Check";

          const checkAnswer = () => {
            if (completed[index] || input.disabled) return;

            const value = input.value.trim();
            if (!value) {
              input.focus();
              return;
            }

            if (value.toLowerCase() !== String(rowData.answer).toLowerCase()) {
              sound.wrong();
              showEmoji("😔");
              input.classList.remove("wrong", "wrong-blink");
              void input.offsetWidth;
              input.classList.add("wrong", "wrong-blink");

              setTimeout(() => {
                input.classList.remove("wrong", "wrong-blink");
                input.value = "";
                check.disabled = true;
                input.focus();
              }, 700);

              return;
            }

            input.value = rowData.answer;
            input.classList.add("correct");
            input.disabled = true;
            check.disabled = true;

            correctCount++;
            sound.correct();
            showEmoji("🥳");

            if (correctCount === rows.length) {
              completed[index] = true;
              burstConfetti(questionsGrid);
              nextBtn.disabled = false;

              if (index === questions.length - 1) {
                setTimeout(finishQuiz, 650);
              }
            }
          };

          check.disabled = true;

          let popupTimer = null;

          const showTypePopup = message => {
            const oldPopup = entry.querySelector(".input-type-popup");
            if (oldPopup) oldPopup.remove();

            const popup = document.createElement("div");
            popup.className = "input-type-popup";
            popup.textContent = message;
            entry.appendChild(popup);

            clearTimeout(popupTimer);
            popupTimer = setTimeout(() => {
              popup.style.opacity = "0";
              popup.style.transform = "translateX(-50%) translateY(-4px) scale(.96)";
              setTimeout(() => popup.remove(), 180);
            }, 1400);
          };

          input.addEventListener("input", () => {
            if (input.disabled) return;

            const value = input.value;

            if (rowData.allowedType === "number") {
              // Keep only whole-number digits.
              const cleaned = value.replace(/[^0-9]/g, "");

              if (cleaned !== value) {
                input.value = cleaned;
                showTypePopup("Please enter a number only");
                input.classList.remove("wrong", "wrong-blink");
                void input.offsetWidth;
                input.classList.add("wrong", "wrong-blink");

                setTimeout(() => {
                  input.classList.remove("wrong", "wrong-blink");
                }, 700);
              }
            } else {
              // Text field: remove digits and tell the learner what belongs here.
              const cleaned = value.replace(/[0-9]/g, "");

              if (cleaned !== value) {
                input.value = cleaned;
                showTypePopup("Please enter text only");
                input.classList.remove("wrong", "wrong-blink");
                void input.offsetWidth;
                input.classList.add("wrong", "wrong-blink");

                setTimeout(() => {
                  input.classList.remove("wrong", "wrong-blink");
                }, 700);
              }
            }

            check.disabled = input.value.trim() === "" || input.disabled;
          });

          check.addEventListener("click", checkAnswer);
          input.addEventListener("keydown", e => {
            if (e.key === "Enter" && !check.disabled) checkAnswer();
          });

          entry.appendChild(input);
          entry.appendChild(check);
          card.appendChild(label);
          card.appendChild(entry);
          questionsGrid.appendChild(card);

          savedRows.push({ input, check, rowData });
        });

        content.appendChild(questionLabel);
        content.appendChild(shapeDisplay);
        content.appendChild(questionsGrid);

        if (completed[index]) {
          savedRows.forEach(item => {
            item.input.value = item.rowData.answer;
            item.input.classList.add("correct");
            item.input.disabled = true;
            item.check.disabled = true;
          });
        }

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !completed[index];

        requestAnimationFrame(fitQuizToScreen);
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i>
        Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          completed.fill(false);
          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) renderQuestion(current - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (completed[current] && current < questions.length - 1) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);

    })();
  </script>
<script src="../../shared/quiz-ui.js"></script>
