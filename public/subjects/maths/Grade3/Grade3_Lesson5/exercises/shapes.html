<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Pattern Game</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    width: 100%;
    height: 100dvh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #ffffff;

    overflow: hidden;
}


/* =========================================================
   MAIN GAME
========================================================= */

.game {
    width: 100%;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.content {
    width: 100%;
    height: 100%;

    min-height: 0;

    display: flex;
    flex-direction: column;

    padding:
        clamp(8px, 1.5vh, 20px)
        clamp(10px, 2.5vw, 45px);

    overflow: hidden;
}


/* =========================================================
   MAIN INSTRUCTION
========================================================= */

.instruction {
    flex: 0 0 auto;

    text-align: center;

    color: #34405c;

    font-size:
        clamp(
            18px,
            2.4vw,
            31px
        );

    line-height: 1.15;

    font-weight: 400;

    margin-bottom:
        clamp(
            7px,
            1.5vh,
            18px
        );
}


/* =========================================================
   GAME CARD
========================================================= */

.card {
    position: relative;

    width: 100%;
    height: 100%;

    flex: 1 1 auto;

    min-height: 0;

    background: #fffdf0;

    border:
        2px solid
        #eee3ac;

    border-radius:
        clamp(
            12px,
            1.8vw,
            25px
        );

    padding:
        clamp(25px, 3vh, 38px)
        clamp(8px, 2vw, 30px)
        clamp(8px, 1.5vh, 16px);

    display: flex;
    flex-direction: column;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}


/* =========================================================
   QUESTION LABEL
========================================================= */

.question-label {
    position: absolute;

    top:
        clamp(
            5px,
            1vh,
            13px
        );

    left:
        clamp(
            7px,
            1.2vw,
            20px
        );

    padding:
        clamp(5px, .8vh, 9px)
        clamp(12px, 1.4vw, 22px);

    border-radius: 30px;

    background: #ff9846;

    color: #ffffff;

    font-size:
        clamp(
            11px,
            1.1vw,
            16px
        );

    font-weight: 400;

    line-height: 1;
}


/* =========================================================
   PATTERN
========================================================= */

.pattern {
    width: 100%;

    flex: 0 1 27%;

    min-height: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    gap:
        clamp(
            7px,
            1.4vw,
            20px
        );

    flex-wrap: nowrap;

    overflow: hidden;
}


/* =========================================================
   BIG PATTERN SHAPE CONTAINER
========================================================= */

.pattern-shape {

    width:
        clamp(
            55px,
            7vw,
            105px
        );

    height:
        clamp(
            60px,
            10vh,
            105px
        );

    flex:
        0 1 auto;

    display: flex;

    align-items: center;

    justify-content: center;
}


/* =========================================================
   SVG SHAPES
========================================================= */

.shape-svg {

    width:
        clamp(
            48px,
            6vw,
            90px
        );

    height:
        clamp(
            52px,
            9vh,
            95px
        );

    overflow: visible;

    pointer-events: none;
}


/* =========================================================
   COMPLETE PATTERN TITLE
========================================================= */

.answer-heading {

    flex: 0 0 auto;

    color: #536079;

    font-size:
        clamp(
            14px,
            1.5vw,
            20px
        );

    font-weight: 400;

    text-align: center;

    margin-bottom:
        clamp(
            5px,
            1vh,
            10px
        );
}


/* =========================================================
   ANSWER AREA
========================================================= */

.answer-area {

    flex: 0 0 auto;

    display: flex;

    align-items: center;

    justify-content: center;

    gap:
        clamp(
            10px,
            1.5vw,
            22px
        );
}


/* =========================================================
   BIG ANSWER BOX
========================================================= */

.answer-box {

    width:
        clamp(
            75px,
            9vw,
            120px
        );

    height:
        clamp(
            75px,
            11vh,
            120px
        );

    border:
        3px dashed
        #ff9846;

    border-radius:
        clamp(
            10px,
            1.3vw,
            18px
        );

    background: #ffffff;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
}


.answer-box .shape-svg {

    width:
        clamp(
            50px,
            6vw,
            82px
        );

    height:
        clamp(
            54px,
            8vh,
            88px
        );
}


.answer-box.over {

    transform:
        scale(1.06);

    border-color:
        #5969e8;

    background:
        #f2f4ff;
}


.answer-box.correct {

    border:
        3px solid
        #28b86a;

    background:
        #effff5;

    animation:
        answerPop .3s ease;
}


.answer-box.wrong {

    border-color:
        #ef4f4f;

    animation:
        shake .35s ease;
}


@keyframes answerPop {

    0% {
        transform: scale(.8);
    }

    70% {
        transform: scale(1.1);
    }

    100% {
        transform: scale(1);
    }

}


@keyframes shake {

    0%,
    100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-7px);
    }

    75% {
        transform: translateX(7px);
    }

}


/* =========================================================
   OPTIONS TITLE
========================================================= */

.options-heading {

    flex: 0 0 auto;

    color: #536079;

    font-size:
        clamp(
            13px,
            1.5vw,
            19px
        );

    font-weight: 400;

    text-align: center;

    margin-top:
        clamp(
            8px,
            1.5vh,
            15px
        );

    margin-bottom:
        clamp(
            5px,
            1vh,
            10px
        );
}


/* =========================================================
   OPTIONS
========================================================= */

.options {

    width: 100%;

    flex: 0 1 23%;

    min-height: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-wrap: wrap;

    gap:
        clamp(
            7px,
            1.2vw,
            17px
        );

    overflow: hidden;
}


/* =========================================================
   BIG OPTION CARDS
========================================================= */

.option {

    width:
        clamp(
            68px,
            8vw,
            108px
        );

    height:
        clamp(
            68px,
            10vh,
            108px
        );

    flex: 0 0 auto;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #ffffff;

    border:
        3px solid
        #dfe4ef;

    border-radius:
        clamp(
            10px,
            1.4vw,
            18px
        );

    box-shadow:
        0 4px 12px
        rgba(
            40,
            50,
            80,
            .12
        );

    cursor: grab;

    user-select: none;

    -webkit-user-select: none;

    touch-action: manipulation;

    transition:
        transform .15s ease,
        border-color .15s ease;
}


.option .shape-svg {

    width:
        clamp(
            45px,
            6vw,
            78px
        );

    height:
        clamp(
            48px,
            8vh,
            82px
        );
}


.option:hover {

    transform:
        translateY(-4px);

    border-color:
        #6470dd;
}


.option:active {

    transform:
        scale(.94);
}


/* =========================================================
   FEEDBACK
========================================================= */

.feedback {

    flex: 0 0 auto;

    min-height:
        clamp(
            20px,
            3vh,
            32px
        );

    margin-top:
        clamp(
            3px,
            1vh,
            8px
        );

    text-align: center;

    font-size:
        clamp(
            12px,
            1.4vw,
            18px
        );

    line-height: 1.2;

    font-weight: 400;
}


.feedback.correct {
    color: #18a655;
}


.feedback.wrong {
    color: #e34444;
}


/* =========================================================
   NAVIGATION (REFERENCE IMPLEMENTATION)
========================================================= */

.navigation {
    width: 100%;
    margin: auto auto 0;
    padding-top: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    position: relative;
    z-index: 20;
}

.nav-progress {
    display: flex;
    justify-content: center;
    align-items: center;
    color: #12265d;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: .5px;
}

.nav {
    min-width: 112px;
    border: 0;
    border-radius: 999px;
    padding: 11px 20px;
    background: #55b449;
    color: #fff;
    font-size: 15px;
    font-weight: 400;
    box-shadow: 0 5px 0 #3d9634;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
}

.nav:hover:not(:disabled) { transform: translateY(-2px); }
.nav:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #3d9634; }
.nav:disabled { opacity: .45; cursor: default; box-shadow: 0 3px 0 #cfd9cf; }

#previous { justify-self: start; }
#next { justify-self: end; }

/* =========================================================
   ANSWER FEEDBACK EMOJI + CONFETTI BURST
========================================================= */

.emoji-pop {
    position: fixed;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    font-size: clamp(58px, 9vw, 82px);
    pointer-events: none;
    z-index: 11000;
    animation: emojiPop 1.1s ease-out forwards;
}

@keyframes emojiPop {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
    }
    22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
    }
}

.confetti-burst {
    position: fixed;
    width: 9px;
    height: 13px;
    pointer-events: none;
    z-index: 10999;
    border-radius: 2px;
    animation: burstFly .8s ease-out forwards;
}

@keyframes burstFly {
    from {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0deg) scale(1);
    }
    to {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--dx)),
                calc(-50% + var(--dy))
            )
            rotate(var(--rot))
            scale(.65);
    }
}

/* =========================================================
   POPUP
========================================================= */

.popup-background {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 15px;
}


.popup-background.show {

    display: flex;
}


.popup {

    width:
        min(
            430px,
            92vw
        );

    max-height:
        90dvh;

    overflow: auto;

    padding:
        clamp(
            25px,
            5vh,
            45px
        )
        22px;

    text-align: center;

    background: #ffffff;

    border-radius: 56px 20px 56px 20px;

    box-shadow:
        0 30px 60px
        rgba(
            0,
            0,
            0,
            .30
        );

    animation:
        popupIn .4s cubic-bezier(.175, .885, .32, 1.275);
}


@keyframes popupIn {

    from {

        opacity: 0;

        transform:
            scale(.7);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

    }

}


.trophy {

    font-size:
        clamp(
            45px,
            8vw,
            72px
        );

    margin-bottom: 8px;
}


.popup h2 {

    color: #1e1e2a;

    font-size:
        clamp(
            23px,
            5vw,
            33px
        );

    margin-bottom: 10px;
}


.popup-score {

    color: #3d3d4a;

    font-size:
        clamp(
            16px,
            3vw,
            21px
        );

    line-height: 1.4;

    margin-bottom: 22px;
}


.restart {

    border: none;

    border-radius: 999px;

    padding:
        12px 36px;

    background: linear-gradient(180deg, #ffb347, #f58a2e);

    color: #2d1f00;

    font-size:
        clamp(
            15px,
            2vw,
            18px
        );

    font-weight: 400;

    box-shadow: 0 12px 24px rgba(245, 138, 46, .3);

    display: inline-flex;

    align-items: center;

    gap: 10px;

    cursor: pointer;
}


/* =========================================================
   CONFETTI
========================================================= */

.confetti {

    position: fixed;

    top: -30px;

    z-index: 10000;

    pointer-events: none;

    animation:
        fall 2.5s linear forwards;
}


@keyframes fall {

    to {

        transform:
            translateY(110vh)
            rotate(720deg);

    }

}


/* =========================================================
   LARGE DESKTOP
========================================================= */

@media (
    min-width: 1600px
)
and (
    min-height: 850px
) {

    .content {

        padding:
            15px 60px 18px;
    }


    .instruction {

        font-size: 30px;

        margin-bottom: 10px;
    }


    .pattern {

        gap: 16px;
    }


    .pattern-shape {

        width: 95px;
        height: 100px;
    }


    .pattern-shape .shape-svg {

        width: 82px;
        height: 88px;
    }


    .answer-box {

        width: 112px;
        height: 112px;
    }


    .answer-box .shape-svg {

        width: 76px;
        height: 82px;
    }


    .option {

        width: 100px;
        height: 100px;
    }


    .option .shape-svg {

        width: 72px;
        height: 78px;
    }

}


/* =========================================================
   LAPTOP SHORT HEIGHT
========================================================= */

@media (
    min-width: 700px
)
and (
    max-height: 720px
) {

    .content {

        padding:
            6px 25px 8px;
    }


    .instruction {

        font-size: 21px;

        margin-bottom: 5px;
    }


    .card {

        padding-top: 25px;
    }


    .pattern {

        flex-basis: 25%;
    }


    .pattern-shape {

        width: 65px;
        height: 65px;
    }


    .pattern-shape .shape-svg {

        width: 55px;
        height: 58px;
    }


    .answer-heading {

        font-size: 14px;

        margin-bottom: 3px;
    }


    .answer-box {

        width: 70px;
        height: 70px;
    }


    .answer-box .shape-svg {

        width: 48px;
        height: 52px;
    }


    .options-heading {

        margin-top: 4px;

        margin-bottom: 3px;
    }


    .option {

        width: 65px;
        height: 65px;
    }


    .option .shape-svg {

        width: 47px;
        height: 50px;
    }


    .feedback {

        min-height: 18px;

        margin-top: 2px;

        font-size: 13px;
    }


    .navigation {

        margin-top: 2px;
    }


    .nav {

        padding:
            8px 15px;

        font-size: 14px;
    }

}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 900px) {

    .content {

        padding:
            8px 12px;
    }


    .pattern {

        gap: 4px;
    }


    .pattern-shape {

        width: 55px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .content {

        padding:
            5px 5px 6px;
    }


    .instruction {

        font-size: 17px;

        margin-bottom: 5px;
    }


    .card {

        border-radius: 15px;

        padding:
            25px 4px 6px;
    }


    .question-label {

        top: 4px;
        left: 6px;

        font-size: 10px;

        padding:
            5px 9px;
    }


    .pattern {

        flex-basis: 25%;

        gap: 0;
    }


    .pattern-shape {

        width: 42px;
        height: 50px;
    }


    .pattern-shape .shape-svg {

        width: 38px;
        height: 43px;
    }


    .answer-heading {

        font-size: 13px;

        margin-bottom: 4px;
    }


    .answer-area {

        gap: 8px;
    }


    .answer-box {

        width: 65px;
        height: 65px;
    }


    .answer-box .shape-svg {

        width: 43px;
        height: 47px;
    }


    .options-heading {

        font-size: 12px;

        margin-top: 5px;

        margin-bottom: 3px;
    }


    .options {

        flex-basis: 23%;

        gap: 5px;
    }


    .option {

        width: 58px;
        height: 58px;
    }


    .option .shape-svg {

        width: 39px;
        height: 42px;
    }


    .feedback {

        font-size: 11px;

        min-height: 19px;

        margin-top: 2px;
    }


    .navigation {

        gap: 7px;

        margin-top: 2px;
    }


    .nav {

        width: 108px;

        padding:
            8px 7px;

        font-size: 12px;
    }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media (max-width: 380px) {

    .instruction {

        font-size: 14px;
    }


    .card {

        padding-top: 22px;
    }


    .pattern-shape {

        width: 34px;
        height: 43px;
    }


    .pattern-shape .shape-svg {

        width: 31px;
        height: 36px;
    }


    .answer-box {

        width: 55px;
        height: 55px;
    }


    .answer-box .shape-svg {

        width: 37px;
        height: 40px;
    }


    .option {

        width: 51px;
        height: 51px;
    }


    .option .shape-svg {

        width: 34px;
        height: 37px;
    }


    .options-heading {

        font-size: 10px;
    }


    .feedback {

        font-size: 10px;
    }


    .nav {

        width: 101px;

        font-size: 11px;
    }

}


/* =========================================================
   MOBILE LANDSCAPE
========================================================= */

@media (
    max-height: 520px
)
and (
    orientation: landscape
) {

    .content {

        padding:
            4px 12px 5px;
    }


    .instruction {

        font-size: 15px;

        margin-bottom: 3px;
    }


    .card {

        padding:
            21px 5px 4px;
    }


    .pattern {

        flex-basis: 25%;
    }


    .pattern-shape {

        width: 45px;
        height: 44px;
    }


    .pattern-shape .shape-svg {

        width: 36px;
        height: 38px;
    }


    .answer-heading {

        font-size: 11px;

        margin-bottom: 2px;
    }


    .answer-box {

        width: 52px;
        height: 52px;
    }


    .answer-box .shape-svg {

        width: 34px;
        height: 37px;
    }


    .options-heading {

        font-size: 11px;

        margin-top: 2px;

        margin-bottom: 2px;
    }


    .options {

        flex-basis: 20%;

        gap: 4px;
    }


    .option {

        width: 48px;
        height: 48px;
    }


    .option .shape-svg {

        width: 31px;
        height: 34px;
    }


    .feedback {

        min-height: 15px;

        font-size: 10px;

        margin-top: 1px;
    }


    .navigation {

        margin-top: 1px;
    }


    .nav {

        width: 100px;

        padding:
            6px 7px;

        font-size: 11px;
    }

}

</style>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="../../shared/quiz-ui.css">
</head>


<body>


<div class="game">

    <main class="content">

        <div class="instruction">
            Observe the pattern and draw the next two shapes!
        </div>


        <section class="card">

            <div class="question-label">
                Question
                <span id="questionLabel">1</span>
            </div>


            <div
                class="pattern"
                id="pattern">
            </div>


            <div class="answer-heading">
                Complete the pattern
            </div>


            <div class="answer-area">

                <div
                    class="answer-box"
                    id="box0"
                    data-index="0">
                </div>

                <div
                    class="answer-box"
                    id="box1"
                    data-index="1">
                </div>

            </div>


            <div class="options-heading">
                🎯 Choose or drag a shape
            </div>


            <div
                class="options"
                id="options">
            </div>


            <div
                class="feedback"
                id="feedback">
            </div>


            <nav class="navigation" aria-label="Question navigation">

                <button
                    class="nav previous"
                    id="previous"
                    type="button">
                    Prev
                </button>

                <button
                    class="nav next"
                    id="next"
                    type="button">
                    Next
                </button>

            </nav>

        </section>

    </main>

</div>


<!-- =======================================================
     FINAL POPUP
======================================================= -->

<div
    class="popup-background"
    id="popup">

    <div class="popup">

        <div class="trophy">
            🎉
        </div>

        <h2>
            All Done!
        </h2>

        <div
            class="popup-score"
            id="popupScore">
        </div>

        <button
            class="restart"
            id="restart"
            type="button">

            <i class="fa-solid fa-rotate-right"></i>
            Play again

        </button>

    </div>

</div>


<script>


/* =========================================================
   SOUND ENGINE — SAME FEEL AS THE REFERENCE GAME
========================================================= */

let audioContext = null;

function getAudioContext() {
    if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        audioContext = new AudioCtx();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
    }

    return audioContext;
}

function beep(frequency, duration, wave = "sine", volume = 0.055) {
    const ctx = getAudioContext();
    if (!ctx) return;

    try {
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.type = wave;
        oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);

        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + 0.012);
        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ctx.currentTime + duration / 1000
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();
        oscillator.stop(ctx.currentTime + duration / 1000 + 0.025);
    } catch (e) {}
}

const sound = {
    correct() {
        beep(660, 110);
        setTimeout(() => beep(880, 160), 110);
    },

    wrong() {
        beep(180, 220, "sawtooth", 0.045);
    },

    next() {
        beep(520, 75, "sine", 0.035);
    },

    previous() {
        beep(430, 75, "sine", 0.035);
    },

    finish() {
        [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
        });
    }
};

function burstConfetti(element) {
    const rect = element.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const pieces = 28;

    for (let i = 0; i < pieces; i++) {
        const item = document.createElement("div");
        item.className = "confetti-burst";

        const angle = Math.random() * Math.PI * 2;
        const distance = 55 + Math.random() * 105;

        item.style.left = centerX + "px";
        item.style.top = centerY + "px";
        item.style.setProperty("--dx", Math.cos(angle) * distance + "px");
        item.style.setProperty("--dy", Math.sin(angle) * distance + "px");
        item.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");

        const size = 6 + Math.random() * 6;
        item.style.width = size + "px";
        item.style.height = (size * 1.45) + "px";

        const symbols = ["⭐", "✨", "🎉", "🌟", "💫"];
        item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        item.style.fontSize = (12 + Math.random() * 8) + "px";
        item.style.width = "auto";
        item.style.height = "auto";

        document.body.appendChild(item);

        setTimeout(() => item.remove(), 1000);
    }
}

/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    const result =
        array.slice();


    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        const temp =
            result[i];

        result[i] =
            result[j];

        result[j] =
            temp;

    }


    return result;

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    const question =
        questions[currentQuestion];

    const state =
        states[currentQuestion];


    questionLabelElement.textContent =
        currentQuestion + 1;


    /* PATTERN */

    patternElement.innerHTML =
        "";


    question.pattern.forEach(
        function(type) {

            const item =
                document.createElement("div");


            item.className =
                "pattern-shape";


            item.appendChild(
                makeShape(type)
            );


            patternElement.appendChild(
                item
            );

        }
    );


    /* ANSWER BOXES */

    renderAnswer(
        box0,
        state.answers[0]
    );


    renderAnswer(
        box1,
        state.answers[1]
    );


    /* OPTIONS */

    optionsElement.innerHTML =
        "";


    const shuffled =
        shuffle(
            question.options
        );


    shuffled.forEach(
        function(type) {

            createOption(type);

        }
    );


    /* FEEDBACK */

    if (state.completed) {

        setFeedback(
            "Amazing! Pattern completed! 🎉",
            "correct"
        );

    }

    else {

        feedbackElement.textContent =
            "";

        feedbackElement.className =
            "feedback";

    }


    updateNavigation();

}


/* =========================================================
   RENDER ANSWER
========================================================= */

function renderAnswer(
    box,
    type
) {

    box.innerHTML =
        "";

    box.classList.remove(
        "correct",
        "wrong",
        "over"
    );


    if (type) {

        box.classList.add(
            "correct"
        );


        box.appendChild(
            makeShape(type)
        );

    }

}


/* =========================================================
   CREATE OPTION
========================================================= */

function createOption(type) {

    const option =
        document.createElement("div");


    option.className =
        "option";


    option.dataset.shape =
        type;


    option.draggable =
        true;


    option.appendChild(
        makeShape(type)
    );


    /* CLICK */

    option.addEventListener(
        "click",
        function() {

            placeByClick(type);

        }
    );


    /* DRAG */

    option.addEventListener(
        "dragstart",
        function(event) {

            event.dataTransfer.setData(
                "text/plain",
                type
            );

            event.dataTransfer.effectAllowed =
                "copy";

        }
    );


    optionsElement.appendChild(
        option
    );

}


/* =========================================================
   CLICK OPTION
========================================================= */

function placeByClick(type) {

    const state =
        states[currentQuestion];


    if (state.completed) {
        return;
    }


    if (!state.answers[0]) {

        checkAnswer(
            type,
            0
        );

        return;

    }


    if (!state.answers[1]) {

        checkAnswer(
            type,
            1
        );

        return;

    }

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(
    type,
    index
) {

    const question =
        questions[currentQuestion];

    const state =
        states[currentQuestion];


    if (state.answers[index]) {
        return;
    }


    const correctShape =
        question.answers[index];


    /* WRONG */

    if (type !== correctShape) {

        const box =
            index === 0
                ? box0
                : box1;


        box.classList.remove(
            "wrong"
        );


        void box.offsetWidth;


        box.classList.add(
            "wrong"
        );


        sound.wrong();
        showEmoji("😔");

        setFeedback(
            "Try another shape! 🔎",
            "wrong"
        );


        setTimeout(
            function() {

                box.classList.remove(
                    "wrong"
                );

            },
            400
        );


        return;

    }


    /* CORRECT */

    state.answers[index] =
        type;


    if (!state.scored[index]) {

        state.scored[index] =
            true;

        score++;

    }


    const box =
        index === 0
            ? box0
            : box1;


    renderAnswer(
        box,
        type
    );

    sound.correct();
    showEmoji("🥳");
    burstConfetti(box);


    /* BOTH COMPLETE */

    if (
        state.answers[0] !== null &&
        state.answers[1] !== null
    ) {

        state.completed =
            true;


        setFeedback(
            "Amazing! Pattern completed! 🎉",
            "correct"
        );


        celebrate();

        if (currentQuestion === questions.length - 1) {
            setTimeout(function() {
                sound.finish();
                showFinalPopup();
            }, 650);
        }

    }

    else {

        setFeedback(
            "Correct! Now find the next shape. ⭐",
            "correct"
        );

    }


    updateNavigation();

}


/* =========================================================
   DRAG & DROP
========================================================= */

function setupDropBox(box) {

    box.addEventListener(
        "dragover",
        function(event) {

            event.preventDefault();


            const index =
                Number(
                    box.dataset.index
                );


            const state =
                states[currentQuestion];


            if (
                !state.answers[index] &&
                !state.completed
            ) {

                box.classList.add(
                    "over"
                );

            }

        }
    );


    box.addEventListener(
        "dragleave",
        function() {

            box.classList.remove(
                "over"
            );

        }
    );


    box.addEventListener(
        "drop",
        function(event) {

            event.preventDefault();


            box.classList.remove(
                "over"
            );


            const type =
                event.dataTransfer.getData(
                    "text/plain"
                );


            if (!type) {
                return;
            }


            const index =
                Number(
                    box.dataset.index
                );


            checkAnswer(
                type,
                index
            );

        }
    );

}


setupDropBox(box0);

setupDropBox(box1);


/* =========================================================
   FEEDBACK
========================================================= */

function setFeedback(
    text,
    type
) {

    feedbackElement.textContent =
        text;


    feedbackElement.className =
        "feedback " + type;

}


/* =========================================================
   NAVIGATION — SAME BEHAVIOR AS REFERENCE CODE
========================================================= */

function updateNavigation() {

    const state = states[currentQuestion];

    previousButton.disabled = currentQuestion === 0;
    nextButton.disabled = !state.completed;

    if (currentQuestion === questions.length - 1) {
        nextButton.textContent = "Finish ✓";
    } else {
        nextButton.textContent = "Next";
    }
}

previousButton.addEventListener("click", function() {
    if (currentQuestion === 0) return;
    currentQuestion--;
    if (sound.previous) sound.previous();
    loadQuestion();
});

nextButton.addEventListener("click", function() {
    const state = states[currentQuestion];

    if (!state.completed) return;

    if (currentQuestion === questions.length - 1) {
        sound.finish();
        showFinalPopup();
        return;
    }

    currentQuestion++;
    if (sound.next) sound.next();
    loadQuestion();
});


/* =========================================================
   CELEBRATION
========================================================= */

function celebrate() {

    const boxes = [
        box0,
        box1
    ];


    boxes.forEach(
        function(box) {

            box.animate(
                [
                    {
                        transform:
                            "scale(1)"
                    },

                    {
                        transform:
                            "scale(1.12)"
                    },

                    {
                        transform:
                            "scale(1)"
                    }
                ],
                {
                    duration: 450
                }
            );

        }
    );

}


/* =========================================================
   FINAL POPUP
========================================================= */

function showFinalPopup() {

    if (popup.classList.contains("show")) {
        return;
    }

    popupScore.innerHTML =
        "Amazing! You got them all right!";

    popup.classList.add(
        "show"
    );

    const modal = popup.querySelector(".popup");
    const fireConfetti = window.burstConfetti || function (element) {
        if (typeof confetti !== "function" || !element) return;
        const rect = element.getBoundingClientRect();
        confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
                x: (rect.left + rect.width / 2) / innerWidth,
                y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
                "#6635dc",
                "#ff4e83",
                "#4e8ff0",
                "#76b93b",
                "#f4ae25",
                "#4ecdc4"
            ]
        });
    };

    setTimeout(() => fireConfetti(modal), 80);
    setTimeout(() => fireConfetti(modal), 350);
    setTimeout(() => fireConfetti(modal), 650);

}


/* =========================================================
   RESTART
========================================================= */

restartButton.addEventListener(
    "click",
    function() {

        currentQuestion =
            0;

        score =
            0;


        states.forEach(
            function(state) {

                state.answers = [
                    null,
                    null
                ];

                state.scored = [
                    false,
                    false
                ];

                state.completed =
                    false;

            }
        );


        popup.classList.remove(
            "show"
        );

        sound.next();


        document
            .querySelectorAll(".confetti")
            .forEach(
                function(item) {

                    item.remove();

                }
            );


        loadQuestion();

    }
);


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti() {

    const symbols = [
        "⭐",
        "✨",
        "🎉",
        "🌟",
        "💫"
    ];


    for (
        let i = 0;
        i < 40;
        i++
    ) {

        const item =
            document.createElement("div");


        item.className =
            "confetti";


        item.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        item.style.left =
            Math.random() * 100 +
            "vw";


        item.style.fontSize =
            (
                12 +
                Math.random() * 14
            ) +
            "px";


        item.style.animationDelay =
            Math.random() * 1.2 +
            "s";


        document.body.appendChild(
            item
        );


        setTimeout(
            function() {

                item.remove();

            },
            4000
        );

    }

}

   START
========================================================= */

    getAudioContext();
}, { once: true });

loadQuestion();
