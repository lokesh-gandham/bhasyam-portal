<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What is it?</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @font-face {
      font-family: "CCSyntroman";
      src: url("../assets/CCSYNTRO.TTF") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "CCSyntroman", "Baloo 2", sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      height: 100vh;
      overflow: hidden;
      padding: 12px 20px;
      background: #fbf7f0;
      position: relative;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 1380px;
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* ================= HEADER ================= */

    .header {
      text-align: center;
      padding: 12px 0 8px;
      flex-shrink: 0;
    }

    .header h1 {
      color: #12265d;
      font-size: 35px;
      line-height: 1.1;
      font-weight: 800;
    }

    /* ================= QUESTION ================= */

    .question-screen {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0;
    }

    /* No "Question 1" label here on purpose - only the question sentence shows */
    .question-text {
      color: #2f4f4f;
      font-size: 30px;
      font-weight: 400;
      margin-bottom: 26px;
      text-align: left;
      max-width: 900px;
      line-height: 1.4;
    }

    .question-content {
      width: 100%;
      max-width: 1160px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ================= DROP BOX ================= */

    .dropzone-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .drop-box {
      width: 180px;
      height: 140px;
      border: 3px dashed #ff9b2f;
      border-radius: 16px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #ffb56a;
      box-shadow: 0 3px 8px rgba(18, 38, 93, .06);
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
      padding: 10px;
    }

    .drop-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      line-height: 1.2;
      pointer-events: none;
      user-select: none;
    }

    .drop-hint i {
      font-size: 22px;
      opacity: .9;
    }

    .drop-hint span {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .drop-box img,
    .drop-box svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .drop-box.drag-hover {
      border-color: #ef8b22;
      background: #fff5e9;
      box-shadow: 0 0 0 4px rgba(255, 155, 47, .13);
    }

    /* Wrong answer: red blink on the drop box */
    .drop-box.wrong-shake {
      animation: wrongBlink .5s ease;
    }

    @keyframes wrongBlink {
      0% {
        background: #fff;
        border-color: #ff9b2f;
      }

      25% {
        background: #ffe1e1;
        border-color: #e0483f;
      }

      50% {
        background: #fff;
        border-color: #ff9b2f;
      }

      75% {
        background: #ffe1e1;
        border-color: #e0483f;
      }

      100% {
        background: #fff;
        border-color: #ff9b2f;
      }
    }

    /* Correct answer: green border, locked */
    .drop-box.correct-locked {
      border-style: solid;
      border-color: #55b449;
      background: #f2fbf1;
      box-shadow: 0 0 0 4px rgba(85, 180, 73, .13);
    }

    /* ================= DRAGGABLE SHAPE OPTIONS ================= */

    .shape-options-row {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 22px;
      min-width: 0;
      overflow: visible;
    }

    .picture-item {
      width: 180px;
      flex: 0 0 180px;
      min-width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      border-radius: 14px;
      padding: 5px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: transform .25s ease, opacity .2s ease;
    }

    .picture-item.dragging {
      cursor: grabbing;
      z-index: 500;
      transition: none;
    }

    .picture-item.locked {
      cursor: default;
      opacity: .35;
      pointer-events: none;
    }

    /* dragging clone that flies from the option to the drop box */
    .drag-ghost {
      position: fixed;
      z-index: 600;
      pointer-events: none;
    }

    .picture-frame {
      width: 150px;
      height: 100px;
      flex: 0 0 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* border: 2px solid transparent; */
      /* border-radius: 14px;
      background: #fff;
      box-shadow: 0 3px 8px rgba(18, 38, 93, .06); */
    }

    .picture-item.dragging .picture-frame {
      border-color: #ff9b2f;
      box-shadow: 0 8px 20px rgba(255, 155, 47, .25);
    }

    .picture-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ================= NAV (prev / progress / next in one row) ================= */

    .nav {
      width: 100%;
      margin: auto auto 0;
      padding-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      position: relative;
      z-index: 20;
    }

    .nav-progress {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #12265d;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .nav button {
      min-width: 112px;
      border: 0;
      border-radius: 999px;
      padding: 11px 20px;
      background: #55b449;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 0 #3d9634;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .nav button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .nav button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3d9634;
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
      box-shadow: 0 3px 0 #cfd9cf;
    }

    #prevBtn {
      justify-self: start;
    }

    #nextBtn {
      justify-self: end;
    }

    /* ================= SAME EMOJI / POPUP ================= */

    .emoji-pop {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 82px;
      pointer-events: none;
      z-index: 9999;
      animation: emojiPop 1.1s ease-out forwards;
    }

    @keyframes emojiPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.35);
      }

      22% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -75%) scale(.82);
      }
    }

    .final-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn .4s ease;
      background: rgba(18, 38, 93, .10);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .final-modal {
      background: #fff;
      max-width: 400px;
      width: 90%;
      padding: 36px 28px 32px;
      border-radius: 56px 20px 56px 20px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .3);
      animation: popUp .4s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popUp {
      from {
        transform: scale(.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .final-modal .icon-big {
      font-size: 52px;
      margin-bottom: 6px;
      display: block;
    }

    .final-modal h2 {
      font-size: 30px;
      font-weight: 800;
      color: #1e1e2a;
      margin-bottom: 8px;
    }

    .final-modal p {
      font-size: 17px;
      color: #3d3d4a;
      margin-bottom: 22px;
    }

    .final-modal .btn-playagain {
      border: none;
      background: linear-gradient(180deg, #ffb347, #f58a2e);
      padding: 12px 36px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      color: #2d1f00;
      box-shadow: 0 12px 24px rgba(245, 138, 46, .3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    /* =====================================================
   SAME RESPONSIVE BREAKPOINT DIMENSIONS
===================================================== */

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .quiz-wrap {
        max-width: 1380px;
      }

      .header h1 {
        font-size: 35px;
      }

      .question-text {
        font-size: 30px;
      }

      .shape-options-row {

      }

      .picture-item {

      }

      .picture-frame {

      }

      .drop-box {

      }

      .nav {

      }

      .nav button {

    }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {

      }

      .picture-item {

    @media screen and (min-width: 1921px) {
      .quiz-wrap {

      .header {

  </style>

<body>
  <main class="quiz-wrap">

    <header class="header">
      <h1>What is it?</h1>
    </header>

    <section class="question-screen">
      <div class="question-text" id="questionText"></div>
      <div class="question-content" id="questionContent"></div>
    </section>

    <nav class="nav" aria-label="Question navigation">
      <button id="prevBtn" disabled>
        <i class="fa-solid fa-chevron-left"></i>
        Prev
      </button>

      <button id="nextBtn" disabled>
        Next
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </nav>

  </main>

  <script>
    (() => {

      /* ============== SHAPE ICON LIBRARY (inline SVG, no external assets) ============== */
      /* Restyled to match the reference key: red Triangle, blue Square,
         soft pearl Circle, and a glossy orange Oval. */

      const shapeIcons = {
        triangle: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <linearGradient id="triGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ff7a7a"/>
                        <stop offset="100%" stop-color="#e0313f"/>
                      </linearGradient>
                    </defs>
                    <polygon points="50,10 92,88 8,88" fill="url(#triGrad)" stroke="#c02532" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="50,10 68,44 32,44" fill="#ffffff" opacity=".18"/>
                  </svg>`,
        square: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <linearGradient id="sqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#6fa8ff"/>
                        <stop offset="100%" stop-color="#3169d6"/>
                      </linearGradient>
                    </defs>
                    <rect x="10" y="10" width="80" height="80" rx="12" fill="url(#sqGrad)" stroke="#274f9e" stroke-width="4"/>
                    <rect x="20" y="20" width="28" height="12" rx="6" fill="#ffffff" opacity=".25"/>
                  </svg>`,
        circle: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <radialGradient id="circGrad" cx="36%" cy="30%" r="72%">
                        <stop offset="0%" stop-color="#fbf8ff"/>
                        <stop offset="55%" stop-color="#e3d9ff"/>
                        <stop offset="100%" stop-color="#bdaaf0"/>
                      </radialGradient>
                    </defs>
                    <circle cx="50" cy="50" r="42" fill="url(#circGrad)" stroke="#a693e0" stroke-width="3"/>
                    <ellipse cx="50" cy="88" rx="26" ry="5" fill="#12265d" opacity=".08"/>
                  </svg>`,
        oval: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <radialGradient id="ovalGrad" cx="36%" cy="30%" r="75%">
                        <stop offset="0%" stop-color="#ffdca3"/>
                        <stop offset="55%" stop-color="#ffb347"/>
                        <stop offset="100%" stop-color="#e07b17"/>
                      </radialGradient>
                    </defs>
                    <ellipse cx="50" cy="50" rx="44" ry="34" fill="url(#ovalGrad)" stroke="#c9660f" stroke-width="3"/>
                    <ellipse cx="50" cy="80" rx="24" ry="4.5" fill="#12265d" opacity=".08"/>
                  </svg>`
      };

      /* ============== QUESTIONS ============== */

      const questions = [
        { label: "a) I have three corners and three sides? I am a ___.", options: ["triangle", "square", "circle"], answer: "triangle" },
        { label: "b) I have four sides and all my sides are same. I am a ___.", options: ["square", "triangle", "oval"], answer: "square" },
        { label: "c) I am round and curvy. I am a 2D shape and have no sides. I am a ___.", options: ["circle", "square", "oval"], answer: "circle" },
        { label: "d) I am curvy but not round. I look like an eatable which is healthy. I am an ___.", options: ["oval", "triangle", "circle"], answer: "oval" }
      ];

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      questions.forEach(q => shuffleArray(q.options));

      const questionText = document.getElementById("questionText");
      const content = document.getElementById("questionContent");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let current = 0;
      const completed = Array(questions.length).fill(false);
      let audioCtx = null;

      const quizWrap = document.querySelector(".quiz-wrap");

      function fitQuizToScreen() {
        quizWrap.style.transform = "translate(-50%, -50%)";
        const rect = quizWrap.getBoundingClientRect();
        const availableH = window.innerHeight - 16;
        const availableW = window.innerWidth - 16;
        const scale = Math.min(availableH / rect.height, availableW / rect.width);
        quizWrap.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }

      window.addEventListener("resize", fitQuizToScreen);
      window.addEventListener("load", fitQuizToScreen);

      function getCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function beep(frequency, duration, type = "sine") {
        try {
          const ctx = getCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();

          oscillator.type = type;
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          gain.connect(ctx.destination);

          gain.gain.setValueAtTime(.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + duration / 1000
          );

          oscillator.start();
          oscillator.stop(ctx.currentTime + duration / 1000);
        } catch (e) { }
      }

      const sound = {
        correct() {
          beep(660, 110);
          setTimeout(() => beep(880, 160), 110);
        },
        wrong() {
          beep(180, 220, "sawtooth");
        },
        finish() {
          [523, 659, 784, 1047].forEach((frequency, index) => {
            setTimeout(() => beep(frequency, 150), index * 130);
          });
        }
      };

      function burstConfetti(element) {
        const rect = element.getBoundingClientRect();

        if (typeof confetti === "function") {
          confetti({
            particleCount: 34,
            spread: 70,
            startVelocity: 22,
            origin: {
              x: (rect.left + rect.width / 2) / innerWidth,
              y: (rect.top + rect.height / 2) / innerHeight
            },
            colors: [
              "#6635dc",
              "#ff4e83",
              "#4e8ff0",
              "#76b93b",
              "#f4ae25",
              "#4ecdc4"
            ]
          });
        }
      }

      function showEmoji(emoji) {
        const element = document.createElement("div");
        element.className = "emoji-pop";
        element.textContent = emoji;
        document.body.appendChild(element);

        setTimeout(() => element.remove(), 1600);
      }

      function renderQuestion(index) {
        const q = questions[index];
        current = index;

        questionText.textContent = q.label;
        content.innerHTML = "";

        const dropzoneRow = document.createElement("div");
        dropzoneRow.className = "dropzone-row";

        const dropBox = document.createElement("div");
        dropBox.className = "drop-box";
        dropBox.innerHTML = '<div class="drop-hint"><i class="fa-solid fa-hand-pointer" aria-hidden="true"></i><span>Drag and drop</span></div>';

        dropzoneRow.appendChild(dropBox);

        const optionsRow = document.createElement("div");
        optionsRow.className = "shape-options-row";

        const optionItems = [];

        [...new Set(q.options)].forEach(shapeName => {

          const pictureItem = document.createElement("div");
          pictureItem.className = "picture-item";
          pictureItem.setAttribute("role", "button");
          pictureItem.setAttribute("tabindex", "0");
          pictureItem.setAttribute("aria-label", `Drag the ${shapeName} into the box`);
          pictureItem.dataset.shape = shapeName;

          const frame = document.createElement("div");
          frame.className = "picture-frame";
          frame.innerHTML = shapeIcons[shapeName];
          pictureItem.appendChild(frame);

          optionItems.push(pictureItem);
          optionsRow.appendChild(pictureItem);

          /* ---------- Pointer-based drag & drop (mouse + touch) ---------- */
          /* The original option NEVER moves or disappears - a floating
             clone ("ghost") is what actually gets dragged to the drop box. */

          let startX = 0, startY = 0, dragging = false, ghost = null;

          function isOverDropBox(e) {
            const dropRect = dropBox.getBoundingClientRect();
            return e.clientX >= dropRect.left && e.clientX <= dropRect.right &&
                   e.clientY >= dropRect.top && e.clientY <= dropRect.bottom;
          }

          function removeGhost() {
            if (ghost) {
              ghost.remove();
              ghost = null;
            }
          }

          function snapBackGhost() {
            if (!ghost) return;
            ghost.style.transition = "transform .25s ease";
            ghost.style.transform = "translate(0,0)";
            ghost.addEventListener("transitionend", removeGhost, { once: true });
          }

          function onPointerMove(e) {
            if (!dragging || !ghost) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            ghost.style.transform = `translate(${dx}px, ${dy}px)`;

            dropBox.classList.toggle("drag-hover", isOverDropBox(e) && !completed[index]);
          }

          function onPointerUp(e) {
            dragging = false;
            pictureItem.removeEventListener("pointermove", onPointerMove);
            dropBox.classList.remove("drag-hover");

            if (completed[index]) {
              removeGhost();
              return;
            }

            if (!isOverDropBox(e)) {
              snapBackGhost();
              return;
            }

            const isCorrect = shapeName === q.answer;

            if (!isCorrect) {
              sound.wrong();
              showEmoji("😔");

              dropBox.classList.remove("wrong-shake");
              void dropBox.offsetWidth;
              dropBox.classList.add("wrong-shake");
              dropBox.addEventListener("animationend", () => {
                dropBox.classList.remove("wrong-shake");
              }, { once: true });

              snapBackGhost();
              return;
            }

            completed[index] = true;

            sound.correct();
            showEmoji("🥳");

            dropBox.textContent = "";
            dropBox.innerHTML = shapeIcons[shapeName];
            dropBox.classList.add("correct-locked");
            burstConfetti(dropBox);

            /* every option stays visible in place - just dimmed/disabled */
            optionItems.forEach(item => item.classList.add("locked"));

            removeGhost();

            nextBtn.disabled = false;

            if (index === questions.length - 1) {
              setTimeout(finishQuiz, 650);
            }
          }

          pictureItem.addEventListener("pointerdown", e => {
            if (pictureItem.classList.contains("locked") || completed[index]) return;
            e.preventDefault();
            pictureItem.setPointerCapture(e.pointerId);
            dragging = true;
            startX = e.clientX;
            startY = e.clientY;

            const shape = pictureItem.querySelector("svg");
            const rect = shape.getBoundingClientRect();
            ghost = shape.cloneNode(true);
            ghost.classList.add("drag-ghost", "dragging");
            ghost.style.left = rect.left + "px";
            ghost.style.top = rect.top + "px";
            ghost.style.width = rect.width + "px";
            ghost.style.height = rect.height + "px";
            ghost.style.margin = "0";
            ghost.style.transition = "none";
            document.body.appendChild(ghost);

            pictureItem.addEventListener("pointermove", onPointerMove);
            pictureItem.addEventListener("pointerup", onPointerUp, { once: true });
            pictureItem.addEventListener("pointercancel", onPointerUp, { once: true });
          });
        });

        content.appendChild(dropzoneRow);
        content.appendChild(optionsRow);

        if (completed[index]) {
          dropBox.textContent = "";
          dropBox.innerHTML = shapeIcons[q.answer];
          dropBox.classList.add("correct-locked");
          optionItems.forEach(item => item.classList.add("locked"));
        }

        prevBtn.disabled = index === 0;
        nextBtn.disabled = !completed[index];

        requestAnimationFrame(fitQuizToScreen);
      }

      function finishQuiz() {
        sound.finish();
        showFinalPopup();
      }

      function showFinalPopup() {
        if (document.querySelector(".final-overlay")) return;

        const overlay = document.createElement("div");
        const modal = document.createElement("div");

        overlay.className = "final-overlay";
        modal.className = "final-modal";

        modal.innerHTML = `
      <span class="icon-big">🎉</span>
      <h2>All Done!</h2>
      <p>Amazing! You got them all right!</p>
      <button class="btn-playagain">
        <i class="fa-solid fa-rotate-right"></i>
        Play again
      </button>
    `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        setTimeout(() => burstConfetti(modal), 80);
        setTimeout(() => burstConfetti(modal), 350);
        setTimeout(() => burstConfetti(modal), 650);

        modal.querySelector(".btn-playagain").addEventListener("click", () => {
          overlay.remove();

          completed.fill(false);
          renderQuestion(0);
        });
      }

      prevBtn.addEventListener("click", () => {
        if (current > 0) renderQuestion(current - 1);
      });

      nextBtn.addEventListener("click", () => {
        if (completed[current] && current < questions.length - 1) {
          renderQuestion(current + 1);
        }
      });

      renderQuestion(0);

    })();
  </script>
<script src="../../shared/quiz-ui.js"></script>
</body>
