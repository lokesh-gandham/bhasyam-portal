<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade4_Lesson1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css?v=11">
<link rel="stylesheet" href="../css/quiz.css?v=99">
<link rel="stylesheet" href="../css/match-the-place-values.css?v=100">
<style>
  body.page-match {
    background: #f4ebdf;
  }

  .page-match .shell {
    background: #f4ebdf;
  }

  .page-match .bar {
    padding: 0.4rem 0.7rem 0;
  }

  .page-match .bar-text {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 60%;
  }

  .page-match .bar-text h1 {
    font-size: clamp(0.62rem, 1.6vw, 0.92rem);
    padding: 0.22rem 0.8rem;
  }

  .page-match .hint-btn {
    width: clamp(8rem, 18vw, 13rem);
    max-width: 13rem;
    white-space: normal;
    line-height: 1.1;
    text-align: left;
  }

  .page-match .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 0.4rem;
  }

  .page-match .mtp-board {
    width: min(62vw, 46rem);
    max-width: 46rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    row-gap: clamp(1.55rem, 3.8vh, 2.9rem);
    column-gap: clamp(1.9rem, 6.5vw, 5.2rem);
    padding: 0.3rem 0.2rem 0.8rem;
  }

  .page-match .mtp-col {
    display: flex;
    flex-direction: column;
    gap: clamp(0.86rem, 1.95vh, 1rem);
    min-width: 0;
  }

  .page-match .mtp-card {
    --face: #f4e8f4;
    --edge: #e8b7d0;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    width: 100%;
    min-height: clamp(1.55rem, 4.6vh, 2.55rem);
    padding: clamp(0.16rem, 0.5vh, 0.34rem) clamp(0.24rem, 0.65vw, 0.52rem);
    border-radius: clamp(0.7rem, 1.2vw, 1.15rem);
    border: clamp(1.5px, 0.22vw, 3px) solid var(--edge);
    background: var(--face);
 box-shadow:
    0 0.14rem 0 var(--edge),
    0 0.28rem 0.55rem rgba(70, 50, 65, 0.16),
    inset 0 0.10rem 0 rgba(255, 255, 255, 0.65),
    inset 0 -0.08rem 0 rgba(100, 70, 90, 0.08);
    transform: translateY(0);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .page-match .mtp-card:hover {
    transform: translateY(-0.12rem);
    box-shadow:
      0 0.3rem 0 var(--edge),
      0 0.6rem 0.9rem rgba(72, 56, 43, 0.18),
      inset 0 0.12rem 0 rgba(255,255,255,0.72);
  }

  .page-match .mtp-card:active {
    transform: translateY(0.12rem);
    box-shadow:
      0 0.1rem 0 var(--edge),
      0 0.25rem 0.45rem rgba(72, 56, 43, 0.12),
      inset 0 0.12rem 0 rgba(255,255,255,0.55);
  }

  .page-match .mtp-no {
    flex: none;
    width: clamp(0.9rem, 2.2vw, 1.55rem);
    height: clamp(0.9rem, 2.2vw, 1.55rem);
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: clamp(1px, 0.2vw, 3px) solid rgba(255,255,255,0.5);
    color: #2c2d69;
    font-size: clamp(0.46rem, 1.05vw, 0.78rem);
    font-weight: 700;
  }

  .page-match .mtp-label {
    flex: 1;
    text-align: center;
    font-size: clamp(0.52rem, 1.35vw, 1.35rem);
    color: #2d2a6d;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.2;
    white-space: nowrap;
  }

  .page-match .mtp-num .mtp-label {
    font-size: clamp(0.7rem, 1.45vw, 1.3rem);
    font-weight: 500;
  }

  .page-match .mtp-val .mtp-label {
    font-size: clamp(0.7rem, 1.45vw, 1.3rem);
    font-weight: 500;
  }

  .page-match .mtp-dot {
    flex: none;
    width: clamp(0.38rem, 1vw, 0.7rem);
    height: clamp(0.38rem, 1vw, 0.7rem);
    border-radius: 50%;
    border: clamp(1px, 0.2vw, 3px) solid rgba(255,255,255,0.8);
    background: var(--edge);
    box-shadow: none;
  }

  .page-match .mtp-left .mtp-card:nth-child(1) { --face:#fbecef; --edge:#edb6c4; }
  .page-match .mtp-left .mtp-card:nth-child(2) { --face:#eaf4fc; --edge:#a8d4ef; }
  .page-match .mtp-left .mtp-card:nth-child(3) { --face:#eaf7ef; --edge:#a8d9c0; }
  .page-match .mtp-left .mtp-card:nth-child(4) { --face:#fff8dc; --edge:#efd98a; }
  .page-match .mtp-left .mtp-card:nth-child(5) { --face:#f1eafd; --edge:#c8b2e8; }
  .page-match .mtp-left .mtp-card:nth-child(6) { --face:#eaf8ef; --edge:#a8d7bc; }
  .page-match .mtp-left .mtp-card:nth-child(7) { --face:#fff0e5; --edge:#efc19a; }

  .page-match .mtp-right .mtp-card:nth-child(1) { --face:#eaf4fc; --edge:#a8d4ef; }
  .page-match .mtp-right .mtp-card:nth-child(2) { --face:#eaf7ef; --edge:#a8d9c0; }
  .page-match .mtp-right .mtp-card:nth-child(3) { --face:#fff8dc; --edge:#efd98a; }
  .page-match .mtp-right .mtp-card:nth-child(4) { --face:#fbecef; --edge:#edb6c4; }
  .page-match .mtp-right .mtp-card:nth-child(5) { --face:#f1eafd; --edge:#c8b2e8; }
  .page-match .mtp-right .mtp-card:nth-child(6) { --face:#eaf8ef; --edge:#a8d7bc; }
  .page-match .mtp-right .mtp-card:nth-child(7) { --face:#fff0e5; --edge:#efc19a; }

  /* Use one shared colour for each number and its correct place-value option. */
  .page-match .mtp-left .mtp-card:nth-child(1),
  .page-match .mtp-right .mtp-card:nth-child(4) { --face:#fbecef; --edge:#edb6c4; } /* ten thousand */
  .page-match .mtp-left .mtp-card:nth-child(2),
  .page-match .mtp-right .mtp-card:nth-child(3) { --face:#fff8dc; --edge:#efd98a; } /* 50000 */
  .page-match .mtp-left .mtp-card:nth-child(3),
  .page-match .mtp-right .mtp-card:nth-child(2) { --face:#eaf7ef; --edge:#a8d9c0; } /* 9000 */
  .page-match .mtp-left .mtp-card:nth-child(4),
  .page-match .mtp-right .mtp-card:nth-child(5) { --face:#f1eafd; --edge:#c8b2e8; } /* greatest 5 digit number */
  .page-match .mtp-left .mtp-card:nth-child(5),
  .page-match .mtp-right .mtp-card:nth-child(6) { --face:#eaf8ef; --edge:#a8d7bc; } /* 4 lakh */
  .page-match .mtp-left .mtp-card:nth-child(6),
  .page-match .mtp-right .mtp-card:nth-child(7) { --face:#fff0e5; --edge:#efc19a; } /* smallest 6 digit number */
  .page-match .mtp-left .mtp-card:nth-child(7),
  .page-match .mtp-right .mtp-card:nth-child(1) { --face:#eaf4fc; --edge:#a8d4ef; } /* 800 */

  .page-match .mtp-card.sel {
    --face: #d8f0e6;
    --edge: #70c9a9;
  }

  .page-match .mtp-card.bad {
    --face: #f7d7da;
    --edge: #e76d78;
  }

  .page-match .mtp-card.done {
    opacity: 1;
  }

  .page-match .mtp-card.done:hover,
  .page-match .mtp-card:disabled {
    box-shadow:
      0 0.18rem 0 var(--edge),
      0 0.35rem 0.6rem rgba(72, 56, 43, 0.13),
      inset 0 0.12rem 0 rgba(255,255,255,0.62);
  }

  .page-match .mtp-card .mtp-badge {
    width: clamp(0.8rem, 2vw, 1.35rem);
    height: clamp(0.8rem, 2vw, 1.35rem);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: clamp(0.42rem, 0.75vw, 0.58rem);
    font-weight: 700;
    color: #fff;
  }

  .page-match .mtp-wires {
    z-index: 1;
  }

  .page-match .actions {
    display: flex;
    justify-content: center;
    margin-top: 0.7rem;
  }

  .page-match .btn.check-btn {
    background: #d6d8d0;
    border: 3px solid #c8cbc4;
    color: #3a3a3a;
    border-radius: 999px;
    box-shadow: 0 4px 0 rgba(126, 119, 107, 0.18);
    font-weight: 800;
    font-size: 1.2rem;
    padding: 0.7rem 2.7rem;
  }

  @media (max-width: 700px) {
    .page-match .bar {
      gap: 0.25rem;
      padding-left: 0.35rem;
      padding-right: 0.35rem;
    }

    .page-match .back {
      padding: 0.24rem 0.48rem;
      font-size: 0.42rem;
    }

    .page-match .back svg {
      width: 0.42rem;
      height: 0.42rem;
    }

    .page-match .hint-btn {
      max-width: 5rem;
      padding: 0.24rem 0.42rem;
      font-size: 0.42rem;
    }

    .page-match .bar-text {
      max-width: 48%;
    }

    .page-match .bar-text h1 {
      padding: 0.18rem 0.42rem;
      font-size: 0.52rem;
    }

    .page-match .mtp-board {
      width: 88vw;
      max-width: 88vw;
      row-gap: 0.62rem;
      column-gap: 0.7rem;
    }

    .page-match .mtp-card {
      gap: 0.14rem;
      min-height: clamp(1.45rem, 5.2vh, 2.15rem);
      padding: 0.13rem 0.17rem;
    }

    .page-match .mtp-label {
      letter-spacing: 0;
    }

    .page-match .mtp-card .mtp-badge {
      width: 0.72rem;
      height: 0.72rem;
    }
  }

  @media (max-height: 600px) {
    .page-match .mtp-col {
      gap: 0.42rem;
    }

    .page-match .mtp-card {
      min-height: 1.55rem;
      padding-top: 0.14rem;
      padding-bottom: 0.14rem;
    }
  }

  @media (min-width: 1400px) {
    .page-match .mtp-board {
      width: min(62vw, 50rem);
      max-width: 50rem;
    }
    .page-match .mtp-card {
min-height: 1.8rem;
    }
  }
</style>
</head>
<body class="page-match">
<div class="shell">

  <div class="bar">
    <a class="back" href="../newindex.html" aria-label="Back to activities">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </a>
    <div class="bar-text">
      <span class="kicker" id="q-kicker"></span>
      <h1 id="q-title"></h1>
    </div>
    <button type="button" class="hint-btn" id="q-hint-btn">💡 Match with the correct colour option</button>
  </div>
  <div class="track"><span id="q-bar"></span></div>

  <section class="qcard" id="q-card">
    <p class="prompt" id="q-prompt"></p>
    <div class="stage" id="q-stage"></div>
    <div class="feedback" id="q-feed"></div>
    <div class="actions">
      <button class="btn prev-btn" id="q-prev" disabled>&larr; Prev</button>
      <button class="btn check-btn" id="q-primary">Check</button>
      <button class="btn next-btn" id="q-next" >Next &rarr;</button>
    </div>
  </section>

  <section class="qcard result" id="q-result">
    <div class="score" id="q-score"></div>
    <div class="of" id="q-of"></div>
    <div class="stars" id="q-stars"></div>
    <h2 id="q-verdict"></h2>
    <p id="q-blurb"></p>
    <div class="actions">
      <button class="btn ghost" id="q-again">Play again</button>
      <a class="btn" href="../index.html">Back to activities</a>
    </div>
  </section>

</div>

<script src="../js/quiz.js?v=99"></script>
<script src="../js/match-the-place-values.js?v=101"></script>
</body>
</html>
