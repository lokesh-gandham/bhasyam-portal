<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Number Kingdom &middot; Class 4 Maths &middot; Chapter 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=11">
<style>
/* ============================================================
   Chapter 1 index — same proportions as the chapter 3 index,
   kept in chapter 1's own warm orange colours.
   Sizes are in px: theme.css sets :root{font-size:30px}, so rem
   here would not line up with the other chapters.
   ============================================================ */
:root{
  --c1-brand:#E07B39;      --c1-brand-dark:#A85A2E;  --c1-brand-light:#FFEFE1;
  --c1-amber:#EFAE33;      --c1-amber-dark:#9A6C10;  --c1-amber-light:#FFF6E2;
  --c1-ink:#2B1D12;        --c1-ink-soft:#2B1D12;
  --c1-paper:#FFFFFF;      --c1-line:#F0DFCE;
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
*{ font-family:'Livvic'; font-weight:400; font-style:normal; }

body{
  font-size:16px;
  color:var(--c1-ink);
  background:
    radial-gradient(circle at 8% 6%,   rgba(224,123,57,.20), transparent 26%),
    radial-gradient(circle at 94% 10%, rgba(239,174,51,.20), transparent 24%),
    radial-gradient(circle at 86% 94%, rgba(232,143,86,.18), transparent 28%),
    linear-gradient(150deg,#FFF9F1 0%,#FFF4E8 55%,#FFF1F0 100%);
  background-attachment:fixed;
  min-height:100vh;
  padding:clamp(14px,2.2vw,26px);
  display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased;
}

/* ---------------- decorative blobs ---------------- */
body::before,
body::after{
  content:"";
  position:fixed;
  z-index:-1;
  border-radius:45% 55% 60% 40%;
  pointer-events:none;
}
body::before{
  width:230px; height:230px;
  left:-70px; bottom:-60px;
  background:linear-gradient(145deg, rgba(240,168,126,.34), rgba(239,201,76,.24));
  transform:rotate(18deg);
}
body::after{
  width:250px; height:250px;
  right:-90px; top:-80px;
  background:linear-gradient(145deg, rgba(239,174,51,.26), rgba(224,123,57,.18));
  transform:rotate(-24deg);
}

.wrap{ width:100%; max-width:1240px; margin:0; padding:0; display:flex; flex-direction:column; }

/* ---------------- hero ---------------- */
.hero{
  background:var(--c1-paper); border:2px solid var(--c1-line); border-radius:22px;
  padding:clamp(18px,2.4vw,28px) clamp(20px,3vw,38px);
  display:flex; align-items:center; justify-content:space-between;
  gap:22px; flex-wrap:wrap;
  box-shadow:0 10px 32px rgba(168,90,46,.10);
}
.hero-text{ flex:1 1 18rem; }
.eyebrow{
  display:block; font-size:16.5px; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--c1-ink-soft); margin-bottom:6px;
}
.hero h1{ font-size:51px; line-height:1.05; letter-spacing:-0.02em; }
.hero h1 em{ font-style:normal; color:var(--c1-brand-dark); }

.stats{ display:flex; gap:12px; flex-wrap:wrap; }
.stat{
  min-width:104px; text-align:center; padding:12px 18px; border-radius:16px;
  background:linear-gradient(160deg,var(--c1-brand-light),#FFE0C7);
  border:2px solid var(--c1-brand);
  box-shadow:0 5px 0 var(--c1-brand-dark),0 10px 20px rgba(224,123,57,.18);
}
.stat.alt{
  background:linear-gradient(160deg,var(--c1-amber-light),#FFE7C2);
  border-color:var(--c1-amber);
  box-shadow:0 5px 0 var(--c1-amber-dark),0 10px 20px rgba(239,174,51,.18);
}
.stat .num{ display:block; font-size:34px; line-height:1; color:var(--c1-brand-dark); }
.stat.alt .num{ color:var(--c1-amber-dark); }
.stat .lbl{ display:block; margin-top:4px; font-size:14px; color:var(--c1-ink-soft); }

/* ---------------- section ---------------- */
.section{ display:block; }
.section-head{ display:flex; align-items:center; gap:14px; margin:clamp(18px,2.6vw,28px) 2px 14px; }
.section-head h2{ font-size:20px; white-space:nowrap; }
.section-head .rule,.rule{ flex:1; height:2px; background:var(--c1-line); border-radius:2px; }

/* ---------------- cards ---------------- */
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }

.card{
  display:flex; flex-direction:column;
  background:var(--c1-paper); border:2px solid var(--c1-line); border-radius:20px;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(168,90,46,.10);
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.card:hover,.card:focus-within{
  transform:translateY(-5px); border-color:var(--c1-brand);
  box-shadow:0 14px 34px rgba(224,123,57,.22);
}
.preview{
  height:132px; padding:14px;
  background:linear-gradient(160deg,#FFF6EC,#FFEEDD);
  border-bottom:2px solid var(--c1-line);
  display:grid; place-items:center;
}
.preview svg{ width:100%; height:100%; }

.card-body{ padding:16px 18px 18px; flex:1; display:flex; flex-direction:column; }
.card-top{ display:flex; align-items:center; gap:11px; }
.qnum{
  flex:none; display:grid; place-items:center; width:34px; height:34px;
  border-radius:11px; background:var(--c1-brand-light); border:2px solid var(--c1-brand);
  color:var(--c1-brand-dark); font-size:16px;
}
.card h3{ font-size:19px; line-height:1.25; }
.card p{ margin-top:8px; font-size:16px; line-height:1.5; color:var(--c1-ink-soft); flex:1; }

.card-play{ margin-top:auto; padding-top:14px; }
.play.big{
  width:100%;
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  padding:13px 18px; border-radius:13px;
  border:2.5px solid var(--c1-brand-dark);
  background:linear-gradient(180deg,#EE8F4C,var(--c1-brand));
  color:#fff; font:inherit; font-size:17px; text-decoration:none; cursor:pointer;
  box-shadow:0 5px 0 var(--c1-brand-dark),0 9px 18px rgba(224,123,57,.26);
  transition:transform .15s ease, box-shadow .15s ease;
}
.play.big:hover{ transform:translateY(-2px); box-shadow:0 7px 0 var(--c1-brand-dark),0 13px 22px rgba(224,123,57,.3); }
.play.big:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--c1-brand-dark); }
.play.big svg{ width:13px; height:13px; fill:currentColor; }
.play.big[data-ready="0"]{
  background:linear-gradient(180deg,#FBF3E8,#F3E6D5);
  border-color:#D9C6AE; color:#6B5843;
  box-shadow:0 5px 0 #D9C6AE;
}

/* ---------------- toast ---------------- */
.toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,18px);
  background:var(--c1-ink); color:#fff; font-size:15px;
  padding:12px 22px; border-radius:999px;
  opacity:0; pointer-events:none;
  transition:opacity .22s ease, transform .22s ease; z-index:50;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

@media (max-width:1000px){ .grid{ grid-template-columns:repeat(2,1fr); } }
/* ------------------------------------------------------------
   Big monitors (1600px and wider) — laptops are untouched.
   The page keeps its centred column but the column grows, so the
   cards, pictures and words fill the extra room instead of
   leaving wide empty margins on either side.
   ------------------------------------------------------------ */
@media (min-width:1600px){
  .wrap{ max-width:min(1760px,94vw); }
  .hero h1{ font-size:68px; }
  .eyebrow{ font-size:22px; }
  .section-head h2{ font-size:25px; }
  .grid{ grid-template-columns:repeat(4,1fr); gap:26px; }
  .preview{ height:180px; }
  .card h3{ font-size:24px; }
  .card p{ font-size:18px; }
  .qnum{ width:42px; height:42px; border-radius:13px; font-size:19px; }
  .play.big{ font-size:20px; padding:16px 20px; }
}
@media (max-width:640px){
  .grid{ grid-template-columns:1fr; }
  .hero{ text-align:center; flex-direction:column; }
  .stats{ justify-content:center; }
  .hero h1{ font-size:34px; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-text">
      <span class="eyebrow">Class 4 · Mathematics</span>
      <h1>Chapter 1 &mdash; <em>Numbers</em></h1>
    </div>
    <div class="stats">
      <div class="stat"><span class="num" id="stat-count">0</span><span class="lbl">Activities</span></div>
    </div>
  </header>

  <main id="sections"></main>


</div>

<div class="toast" id="toast"></div>

<script src="js/index.js?v=4"></script>
</body>
</html>
