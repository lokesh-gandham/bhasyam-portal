<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Number Kingdom &middot; Class 4 Maths &middot; Chapter 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Chapter 1 index — activities grouped into 5 packs by TYPE
   (not by textbook page order). Same warm orange theme.
   ============================================================ */
:root{
  --c1-brand:#E07B39;      --c1-brand-dark:#A85A2E;  --c1-brand-light:#FFEFE1;
  --c1-amber:#EFAE33;      --c1-amber-dark:#9A6C10;  --c1-amber-light:#FFF6E2;
  --c1-ink:#2B1D12;        --c1-ink-soft:#2B1D12;
  --c1-paper:#FFFFFF;      --c1-line:#F0DFCE;

  /* generic art palette used inside the SVG previews */
  --mint-line:#3FAE6B; --mint-bg:#E1F7E9;
  --sand-line:#D9C6AE;
  --sun-line:#EFAE33;  --sun-bg:#FFF6E2;
  --rose-line:#F4436C; --rose-bg:#FFE1E9;
  --lilac-line:#9B7BE0; --lilac-bg:#F0EAFC;
  --warm-soft:#FFEFE1;
  --ink:#2B1D12;
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
*{ font-family:'Livvic'; font-weight:400; font-style:normal; }

body{
  font-size:16px;
  color:var(--c1-ink);
  /* background:
    radial-gradient(circle at 8% 6%,   rgba(224,123,57,.20), transparent 26%),
    radial-gradient(circle at 94% 10%, rgba(239,174,51,.20), transparent 24%),
    radial-gradient(circle at 86% 94%, rgba(232,143,86,.18), transparent 28%),
    linear-gradient(150deg,#FFF9F1 0%,#FFF4E8 55%,#FFF1F0 100%); */
    background-color: #ffffff;
  background-attachment:fixed;
  min-height:100vh;
  padding:clamp(14px,2.2vw,26px);
  display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
/* 
body::before,body::after{
  content:""; position:fixed; z-index:-1; border-radius:45% 55% 60% 40%; pointer-events:none;
}
body::before{
  width:230px; height:230px; left:-70px; bottom:-60px;
  background:linear-gradient(145deg, rgba(240,168,126,.34), rgba(239,201,76,.24));
  transform:rotate(18deg);
}
body::after{
  width:250px; height:250px; right:-90px; top:-80px;
  background:linear-gradient(145deg, rgba(239,174,51,.26), rgba(224,123,57,.18));
  transform:rotate(-24deg);
} */

.wrap{ width:100%; max-width:1240px; margin:0; padding:0; display:flex; flex-direction:column; }

/* ---------------- hero ---------------- */
.hero{
  /* background:var(--c1-paper); */
   /* border:2px solid var(--c1-line);
    border-radius:22px; */
  padding:clamp(18px,2.4vw,28px) clamp(20px,3vw,38px);
  display:flex; align-items:center; justify-content:space-between;
  gap:22px; flex-wrap:wrap;
  /* box-shadow:0 10px 32px rgba(168,90,46,.10); */
}
.hero-text{ flex:1 1 18rem; }
.eyebrow{
  display:block; font-size:16.5px; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--c1-ink-soft); margin-bottom:6px;
}
.hero h1{ font-size:51px; line-height:1.05; letter-spacing:-0.02em; }
.hero h1 em{ font-style:normal; color:var(--c1-brand-dark); }

.stats{ display:flex; gap:12px; flex-wrap:wrap; }
.stat{
  min-width:104px; text-align:center; padding:12px 18px; border-radius:16px;
  background:linear-gradient(160deg,var(--c1-brand-light),#FFE0C7);
  border:2px solid var(--c1-brand);
  box-shadow:0 5px 0 var(--c1-brand-dark),0 10px 20px rgba(224,123,57,.18);
}
.stat .num{ display:block; font-size:34px; line-height:1; color:var(--c1-brand-dark); }
.stat .lbl{ display:block; margin-top:4px; font-size:14px; color:var(--c1-ink-soft); }

#backBtn{
  display:none; align-items:center; gap:8px;
  border:2px solid var(--c1-line); background:var(--c1-line);
  padding:11px 20px; border-radius:999px;
  font-size:15px; font-weight:600; color:var(--c1-ink);
  cursor:pointer; box-shadow:0 5px 0 var(--c1-brand-dark);
  transition: transform .12s ease;
  position: fixed;
  top:5px;
  left: 5px;
  height: 46px;
  width: 120px;
  z-index: 99999;
}
#backBtn:hover{ transform:translateY(-2px); }
#backBtn:active{ transform:translateY(1px); }

/* ---------------- section ---------------- */
.section-head{ display:flex; align-items:center; gap:14px; margin:clamp(18px,2.6vw,28px) 2px 14px; }
.section-head h2{ font-size:20px; white-space:nowrap; }
/* .rule{ flex:1; height:2px; background:var(--c1-line); border-radius:2px; } */

/* ---------------- shared grid ---------------- */
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }

/* ---------------- home: category packs ---------------- */
#homeGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:22px; }
.pack{
  text-align:left; cursor:pointer; border:2px solid var(--c1-line); border-radius:20px;
  background:var(--c1-paper); padding:20px 18px; position:relative; overflow:hidden;
  box-shadow:0 6px 20px rgba(168,90,46,.10);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.pack:hover{ transform:translateY(-5px); border-color:var(--pack-c); box-shadow:0 14px 30px rgba(168,90,46,.18); }
.pack:active{ transform:translateY(0); }
.pack::after{
  content:""; position:absolute; width:120px; height:120px; border-radius:50%;
  right:-40px; bottom:-46px; background:var(--pack-c); opacity:.13;
}
.pack-num{
  display:inline-flex; align-items:center; justify-content:center;
  width:32px; height:32px; border-radius:10px; margin-bottom:14px;
  background:var(--pack-soft); border:1px solid var(--pack-c); color:var(--pack-c);
  font-size:15px; font-weight:400;
}
.pack h3{ font-size:23px; line-height:1.25; margin-bottom:6px; }
.pack p{ font-size:14.5px; color:var(--c1-ink-soft); line-height:1.42; margin-bottom:16px; min-height:56px; }
.pack-count{
  display:inline-block; font-size:12.5px; font-weight:400; padding:6px 13px;
  border-radius:999px; background:var(--pack-soft); color:var(--pack-c); position:relative; z-index:1;
}

/* ---------------- category view ---------------- */
#packView{ display:none; }
 .pack-banner{
  border-radius:20px;
  padding:22px 26px;
  margin-top:22px;
  margin-bottom:8px;
  color:#4B4650;
  display:flex;
  align-items:center;
  gap:16px;
  background:var(--banner-bg);
  border:2px solid var(--banner-border);
  box-shadow:0 7px 18px rgba(120,110,120,.12);
}
.pack-banner .pnum{
  width:42px;
  height:42px;
  border-radius:13px;
  background:rgba(255,255,255,.60);
  border:2px solid rgba(255,255,255,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:600;
  flex:none;
  color:#55505A;
}
.pack-banner h2{ font-size:23px; margin-bottom:3px; }
.pack-banner p{ font-size:14px; opacity:.92; }

/* ---------------- activity cards ---------------- */
.card{
  display:flex;
  flex-direction:column;
  background:#FFFFFF;
  border:2px solid #E9E2EA;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(90,80,100,.10);
  position:relative;
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
 
}
.card:hover,.card:focus-within{
  transform:translateY(-6px);
  border-color:#CFC5D5;
  box-shadow:0 16px 34px rgba(90,80,100,.16);
}
.card::before{
  content:"";
  position:absolute;
  top:0;
  left:18px;
  right:18px;
  height:5px;
  border-radius:0 0 8px 8px;
  /* background:linear-gradient(90deg,#E8DDF5,#DDEEDB,#DCECF6,#F6DCE5); */
  opacity:.9;
  pointer-events:none;
  z-index:2;
}
.preview{
  height:132px; padding:14px;
  /* background:linear-gradient(160deg,#FFF6EC,#FFEEDD); */
  background-color: white;
  /* border-bottom:2px solid var(--c1-line); */
  display:grid; place-items:center;
}
.preview svg{ width:100%; height:100%; }

.card-body{ padding:16px 18px 18px; flex:1; display:flex; flex-direction:column; }
.card-top{ display:flex; align-items:center; gap:11px; }
.qnum{
  flex:none; display:grid; place-items:center; width:34px; height:34px;
  border-radius:11px; background:var(--c1-brand-light); border:2px solid var(--c1-brand);
  color:var(--c1-brand-dark); font-size:16px;
}
.card h3{ font-size:19px; line-height:1.25; }
.card p{ margin-top:8px; font-size:16px; line-height:1.5; color:var(--c1-ink-soft); flex:1; }

.card-play{ margin-top:auto; padding-top:14px; }
 .play.big{
  width:100%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:13px 18px;
  border-radius:13px;
  border:2px solid var(--banner-border);
  background:var(--banner-bg);
  color:#514B55;
  font:inherit;
  font-size:17px;
  text-decoration:none;
  cursor:pointer;
  box-shadow:0 5px 0 var(--play-shadow),
             0 9px 18px rgba(120,110,120,.15);
  transition:transform .15s ease, box-shadow .15s ease;
}
.play.big:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 0 var(--play-shadow),
             0 13px 22px rgba(120,110,120,.18);
}
.play.big:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 var(--play-shadow);
}
.play.big svg{ width:13px; height:13px; fill:currentColor; }
.play.big[data-ready="0"]{
  background:#EEEAF0;
  border-color:#D1CBD3;
  color:#6B6470;
  box-shadow:0 5px 0 #BBB3BE;
}

/* ---------------- toast ---------------- */
.toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,18px);
  background:var(--c1-ink); color:#fff; font-size:15px;
  padding:12px 22px; border-radius:999px;
  opacity:0; pointer-events:none;
  transition:opacity .22s ease, transform .22s ease; z-index:50;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

@media (max-width:1000px){
  .grid{ grid-template-columns:repeat(2,1fr); }
  #homeGrid{ grid-template-columns:repeat(3,1fr); }
}
@media (max-width:640px){
  .grid{ grid-template-columns:1fr; }
  #homeGrid{ grid-template-columns:1fr; }
  .hero{ text-align:center; flex-direction:column; }
  .stats{ justify-content:center; }
  .hero h1{ font-size:34px; }
}

/* ============================================================
   LARGE DESKTOP — 1600px to 1920px
   ============================================================ */
@media (min-width:1700px) and (max-width:1920px){

  body{
    padding:28px 40px;
  }

  .wrap{
    max-width:1500px;
  }

  /* Header */
  .hero{
    padding:30px 42px;
    border-radius:26px;
    gap:30px;
  }

  .hero h1{
    font-size:58px;
  }

  .eyebrow{
    font-size:18px;
  }

  .stat{
    min-width:120px;
    padding:14px 22px;
  }

  .stat .num{
    font-size:38px;
  }

  .stat .lbl{
    font-size:15px;
  }

  /* Section heading */
  .section-head{
    margin-top:30px;
    margin-bottom:18px;
  }

  .section-head h2{
    font-size:23px;
  }

  /* Home packs */
  #homeGrid{
    grid-template-columns:repeat(3,1fr);
    gap:22px;
    margin-top:26px;
  }

  .pack{
    padding:24px 22px;
    height:245px;
    border-radius:24px;
  }

  .pack-num{
    width:38px;
    height:38px;
    border-radius:12px;
    margin-bottom:17px;
    font-size:17px;
  }

  .pack h3{
    font-size:32px;
  }

  .pack p{
    font-size:18px;
    line-height:1.5;
    min-height:64px;
  }

  .pack-count{
    font-size:13.5px;
    padding:7px 15px;
  }

  /* Pack banner */
  .pack-banner{
    padding:26px 32px;
    margin-top:26px;
    margin-bottom:12px;
    border-radius:24px;
    gap:20px;
  }

  .pack-banner .pnum{
    width:48px;
    height:48px;
    border-radius:15px;
    font-size:19px;
  }

  .pack-banner h2{
    font-size:27px;
  }

  .pack-banner p{
    font-size:16px;
  }

  /* Activity cards */
  .grid{
    grid-template-columns:repeat(3,1fr);
    gap:24px;
  }

  .card{
    border-radius:26px;
  }

  .preview{
    height:155px;
    padding:18px;
  }

  .card-body{
    padding:20px 22px 22px;
  }

  .card-top{
    gap:13px;
  }

  .qnum{
    width:38px;
    height:38px;
    border-radius:12px;
    font-size:17px;
  }

  .card h3{
    font-size:26px;
  }

  .card p{
    font-size:17px;
    line-height:1.55;
  }

  /* Play button */
  .play.big{
    padding:15px 20px;
    border-radius:15px;
    font-size:18px;
  }

  .play.big svg{
    width:14px;
    height:14px;
  }

}
</style>
</head>
<body>
    
<div class="wrap">
<button id="backBtn">🏠 Home</button>
  <header class="hero">
    <!-- <button id="backBtn">🏠 Home</button> -->
    <div class="hero-text">
        
      <span class="eyebrow">Class 4 · Mathematics</span>
      <h1>Chapter 1 &mdash; <em>Numbers</em></h1>
    </div>
    <div class="stats">
      <div class="stat"><span class="num" id="stat-count">0</span><span class="lbl">Activities</span></div>
     
    </div>
  </header>

  <!-- HOME: 5 type-based packs -->
  <div class="section-head"><h2>Choose a pack</h2><span class="rule"></span></div>
  <div id="homeGrid"></div>

  <!-- INSIDE A PACK -->
  <main id="packView">
    <div class="pack-banner" id="packBanner"></div>
    <div class="grid" id="sections"></div>
  </main>

</div>

<div class="toast" id="toast"></div>

<script>
/* ==================================================================
   PREVIEWS — unchanged from the original chapter build.
   ================================================================== */
const A='var(--mint-line)', AL='var(--sand-line)', W='var(--sun-line)', INK='var(--ink)', WH='#fff';
const BEADS=['#EF5A5A','#F5A62E','#2FBFA4','#4C9EE8','#9B7BE0','#EE6FA4'];

const svg = inner => `<svg viewBox="0 0 160 70" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;

function chip(x,y,w,h,txt,{fill=WH,stroke=AL,color=INK,size=13,dash=0}={}){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${fill}"
            stroke="${stroke}" stroke-width="1.5" ${dash?`stroke-dasharray="4 3"`:''}/>
          <text x="${x+w/2}" y="${y+h/2+size*.35}" text-anchor="middle"
            font-family="Livvic" font-size="${size}" fill="${color}">${txt}</text>`;
}
function label(x,y,txt,size=11,color=INK){
  return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Livvic"
            font-size="${size}" fill="${color}">${txt}</text>`;
}

function abacus(counts,{names=null,target=null}={}){
  const n=counts.length, left=18, right=142, span=(right-left)/(n-1||1);
  let s='';
  if(target) s+=chip(56,2,48,16,target,{fill:'var(--sun-bg)',stroke:W,size:12});
  const top = target?22:8, baseY=52;
  counts.forEach((c,i)=>{
    const x=left+span*i;
    s+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${baseY}" stroke="${AL}" stroke-width="2"/>`;
    for(let b=0;b<c;b++){
      s+=`<circle cx="${x}" cy="${baseY-4-b*7}" r="3.4" fill="${BEADS[b%BEADS.length]}"/>`;
    }
  });
  s+=`<rect x="8" y="${baseY}" width="144" height="14" rx="5" fill="${WH}" stroke="${AL}" stroke-width="1.5"/>`;
  (names||[]).forEach((t,i)=>{ s+=label(left+span*i,baseY+10,t,9); });
  return svg(s);
}

function tubesArt(counts, names){
  const n = counts.length, left = 8, right = 152, w = (right - left) / n;
  const FILL = ['#EDE7FB','#FBE1E8','#FCE7DC','#FDF3D2','#DFF5EE','#E2EFFB'];
  const LINE = ['#A991DE','#E8899C','#F0A87E','#EFC94C','#5CC8A5','#7FB6E8'];
  let s = '';
  counts.forEach((c, i) => {
    const x = left + w * i + 1.5, cw = w - 3;
    const k = i % FILL.length;
    s += `<rect x="${x}" y="4" width="${cw}" height="46" rx="3" fill="none"
            stroke="${LINE[k]}" stroke-width="1.2" stroke-dasharray="3 2"/>`;
    for(let b = 0; b < c; b++){
      s += `<rect x="${x + 2}" y="${44 - b * 6.5}" width="${cw - 4}" height="5" rx="1.5"
              fill="${FILL[k]}" stroke="${LINE[k]}" stroke-width=".8"/>`;
    }
    s += label(x + cw / 2, 60, names[i], 7);
  });
  return svg(s);
}

function compare(a,b,sym='?'){
  return svg(
    chip(6,20,52,30,a,{size:15})+
    chip(64,20,32,30,sym,{fill:'var(--sun-bg)',stroke:W,size:16,dash:1})+
    chip(102,20,52,30,b,{size:15})
  );
}

function bins(l='Even',r='Odd'){
  let s='';
  s+=chip(4,4,70,20,'2347',{size:12})+chip(86,4,70,20,'5642',{size:12});
  s+=`<path d="M39 26 L39 34" stroke="${AL}" stroke-width="1.5"/>
      <path d="M121 26 L121 34" stroke="${AL}" stroke-width="1.5"/>`;
  s+=chip(4,36,70,30,l,{fill:'var(--mint-bg)',stroke:A,size:13,color:A});
  s+=chip(86,36,70,30,r,{fill:'var(--sun-bg)',stroke:W,size:13});
  return svg(s);
}

function boxes(txt='9'){
  let s='';
  for(let i=0;i<4;i++){
    s+=chip(6+i*39,20,32,30,i===1?txt:'',{fill:i===1?'var(--sun-bg)':WH,stroke:i===1?W:AL,size:15,dash:i===1?0:1});
  }
  s+=label(80,12,'fill each box',10);
  return svg(s);
}

function words(word,num){
  return svg(
    chip(10,4,140,26,word,{size:11})+
    `<path d="M80 30 L80 42 M75 37 L80 42 L85 37" stroke="var(--lilac-line)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+
    chip(30,46,100,22,num,{fill:'var(--rose-bg)',stroke:'var(--rose-line)',size:13,dash:1})
  );
}

function strip(cells,hi=[]){
  const w=150/cells.length;
  let s=`<rect x="5" y="18" width="150" height="34" rx="6" fill="${WH}" stroke="${AL}" stroke-width="1.5"/>`;
  cells.forEach((c,i)=>{
    const x=5+w*i;
    if(hi.includes(i)) s+=`<rect x="${x+1}" y="19" width="${w-2}" height="32" rx="4" fill="var(--warm-soft)"/>`;
    if(i) s+=`<line x1="${x}" y1="18" x2="${x}" y2="52" stroke="${AL}" stroke-width="1.2"/>`;
    s+=label(x+w/2,40,c,12);
  });
  return svg(s);
}

function match(){
  let s='';
  const L=[14,32,50], R=[14,32,50];
  L.forEach((y,i)=>{ s+=chip(6,y-9,54,18,['76549','89011','99999'][i],{size:11}); });
  R.forEach((y,i)=>{ s+=chip(100,y-9,54,18,['9000','800','50000'][i],{size:11,fill:'var(--sun-bg)',stroke:W}); });
  s+=`<path d="M62 14 C80 14 82 32 98 32" stroke="${A}" stroke-width="2" fill="none"/>`;
  s+=`<path d="M62 32 C80 32 82 50 98 50" stroke="${A}" stroke-width="2" fill="none" opacity=".45"/>`;
  return svg(s);
}

function formnum(digits){
  let s='';
  digits.forEach((d,i)=>{ s+=chip(6+i*26,4,22,22,d,{size:13}); });
  s+=`<path d="M52 30 L52 40 M47 35 L52 40 L57 35" stroke="${A}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  s+=`<path d="M108 30 L108 40 M103 35 L108 40 L113 35" stroke="${W}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  s+=chip(6,44,72,22,'smallest',{size:11,fill:'var(--mint-bg)',stroke:A,color:A});
  s+=chip(82,44,72,22,'greatest',{size:11,fill:'var(--sun-bg)',stroke:W});
  return svg(s);
}

function prevnext(n){
  return svg(
    chip(4,22,44,26,'?',{fill:'var(--sun-bg)',stroke:W,size:15,dash:1})+
    chip(52,22,56,26,n,{size:14})+
    chip(112,22,44,26,'?',{fill:'var(--sun-bg)',stroke:W,size:15,dash:1})+
    label(26,14,'before',10)+label(134,14,'after',10)
  );
}

function numberline(a,b,dot,val){
  let s=`<line x1="10" y1="40" x2="150" y2="40" stroke="${AL}" stroke-width="2"/>`;
  for(let i=0;i<=6;i++){
    const x=10+i*(140/6);
    s+=`<line x1="${x}" y1="34" x2="${x}" y2="46" stroke="${AL}" stroke-width="2"/>`;
  }
  s+=`<circle cx="${dot}" cy="40" r="5" fill="${W}"/>`;
  s+=label(dot,26,val,12);
  s+=label(16,60,a,10)+label(146,60,b,10);
  return svg(s);
}

function roman(items,{hi=1}={}){
  let s='';
  const w=Math.min(46,150/items.length-6);
  items.forEach((t,i)=>{
    s+=chip(6+i*(w+6),20,w,30,t,{size:14,
      fill:i===hi?'var(--sun-bg)':WH, stroke:i===hi?W:AL, dash:i===hi?1:0});
  });
  return svg(s);
}

function convert(from,to){
  return svg(
    chip(6,20,60,30,from,{size:15})+
    `<path d="M72 35 L88 35 M83 30 L88 35 L83 40" stroke="${A}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+
    chip(94,20,60,30,to,{fill:'var(--sun-bg)',stroke:W,size:15,dash:1})
  );
}

/* flatten, keeping each item's original section code/pages for its label */
const allItems = [];
RAW_SECTIONS.forEach(sec=>{
  sec.items.forEach(it=>allItems.push({...it, secCode:sec.code, secTitle:sec.title}));

const byId = id => allItems.find(i=>i.id===id);

/* ==================================================================
   5 PACKS — grouped by activity TYPE, not textbook order.
   ================================================================== */

const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72c0 .78.86 1.25 1.52.84l10.78-6.86a1 1 0 0 0 0-1.68L9.52 4.3A1 1 0 0 0 8 5.14z"/></svg> Play';

document.getElementById('stat-count').textContent = allItems.length;

/* ---------------- render home packs ---------------- */
const homeGrid = document.getElementById('homeGrid');
homeGrid.innerHTML = PACKS.map(p => `
  <button class="pack" style="--pack-c:var(${p.c});--pack-soft:var(${p.soft})" data-pack="${p.id}">
    <span class="pack-num">${p.id}</span>
    <h3>${p.title}</h3>
    <p>${p.blurb}</p>
    <span class="pack-count">${p.ids.length} activities</span>
  </button>
`).join('');

/* ---------------- render one pack's activities ---------------- */
const sectionsRoot = document.getElementById('sections');
const packView = document.getElementById('packView');
const packBanner = document.getElementById('packBanner');
const backBtn = document.getElementById('backBtn');

function openPack(packId){
  const pack = PACKS.find(p => p.id === packId);
  document.getElementById('homeGrid').style.display = 'none';
  document.querySelector('.section-head').style.display = 'none';
  packView.style.display = 'block';
  backBtn.style.display = 'inline-flex';

  /* One exact pastel color is shared by the banner AND every Play button
     * inside this pack. Each pack gets its own color. */
  const pastelColors = {
    1: { bg:'#E8DDF5', border:'#C7B5DF', shadow:'#9F8BB9' }, // soft lilac
    2: { bg:'#F8E8B9', border:'#E5CB83', shadow:'#B79C55' }, // soft yellow
    3: { bg:'#DDEEDB', border:'#B5D2AF', shadow:'#89A983' }, // soft green
    4: { bg:'#DCECF6', border:'#B0D1E4', shadow:'#7FA5B7' }, // soft blue
    5: { bg:'#F6DCE5', border:'#E1B9C8', shadow:'#B88799' }  // soft pink
  };

  const pc = pastelColors[pack.id] || pastelColors[1];

  /* The SAME variables are used by .pack-banner and .play.big */
  /* Set colors on the common parent so BOTH the banner and
     every Play button inside this pack inherit the exact same color. */
  packView.style.setProperty('--banner-bg', pc.bg);
  packView.style.setProperty('--banner-border', pc.border);
  packView.style.setProperty('--play-shadow', pc.shadow);

  packBanner.innerHTML = `
    <span class="pnum">${pack.id}</span>
    <div><h2>${pack.title}</h2><p>${pack.blurb}</p></div>
  `;

  const cards = pack.ids.map((id, idx) => {
    const it = byId(id);
    return `
      <article class="card">
        <div class="preview">${it.art()}</div>
        <div class="card-body">
          <div class="card-top">
            <span class="qnum">${idx + 1}</span>
            <h3>${it.title}</h3>
          </div>
          <p>${it.desc}</p>
          <div class="card-play">
            <button class="play big" data-id="${it.id}" data-ready="${it.ready ? 1 : 0}"
                    data-title="${it.secCode} · Q${it.q}"
                    aria-label="Play activity ${idx + 1}: ${it.title}">${PLAY}</button>
          </div>
        </div>
      </article>`;
  }).join('');

  sectionsRoot.innerHTML = cards;
  window.scrollTo({top:0, behavior:'smooth'});
}

function showHome(){
  document.getElementById('homeGrid').style.display = 'grid';
  document.querySelector('.section-head').style.display = 'flex';
  packView.style.display = 'none';
  backBtn.style.display = 'none';
  window.scrollTo({top:0, behavior:'smooth'});
}

homeGrid.addEventListener('click', e => {
  const btn = e.target.closest('.pack');
  if(!btn) return;
  openPack(Number(btn.dataset.pack));
});
backBtn.addEventListener('click', showHome);

/* ---------------- play / toast (unchanged logic) ---------------- */
const toast = document.getElementById('toast');
let t;
function showToast(msg){
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(t); t = setTimeout(()=>toast.classList.remove('show'), 2200);
}
/* No fetch() probe here on purpose — it is blocked when the page is opened
   straight from disk (file://). Each item declares ready:true once its
   activity page exists. */
packView.addEventListener('click', e => {
  const btn = e.target.closest('.play');
  if(!btn) return;
  if(btn.dataset.ready === '1'){
    sessionStorage.setItem('scrollToCard', btn.dataset.id);
    location.href = `html/${btn.dataset.id}.html`;
  } else {
    showToast(`${btn.dataset.title} — activity coming soon`);
  }
});

(function restoreScroll(){
  const id = sessionStorage.getItem('scrollToCard');
  if(!id) return;
  sessionStorage.removeItem('scrollToCard');
  const owningPack = PACKS.find(p => p.ids.includes(id));
  if(!owningPack) return;
  openPack(owningPack.id);
  const btn = sectionsRoot.querySelector(`.play[data-id="${id}"]`);
  if(btn){
    const card = btn.closest('.card');
    if(card) setTimeout(()=> card.scrollIntoView({block:'center'}), 60);
  }
})();
</script>
