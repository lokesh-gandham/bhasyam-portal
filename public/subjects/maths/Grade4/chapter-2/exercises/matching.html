<!DOCTYPE html>
<html lang="en">
<head>

<style>
@import url("https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap");
:root{--ink:#27253a;--purple:#6c59e8;--purple-dark:#4938b1;--coral:#ff825c;--pink:#ff5f91;--yellow:#ffd85c;--aqua:#42c8c1;--green:#15956f;--green-dark:#087354;--red:#c83d4f;--white:#fff}
*{box-sizing:border-box;font-family:"Livvic",sans-serif}html,body{margin:0;min-height:100%}
.home-btn{position:fixed;top:14px;left:14px;z-index:40;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:12px;border:2px solid var(--purple);background:linear-gradient(145deg,#8a78ff,var(--purple));color:#fff;font-size:14px;font-weight:400;text-decoration:none;box-shadow:0 4px 0 var(--purple-dark),0 6px 14px rgba(108,89,232,.25);transition:transform .15s ease,box-shadow .15s ease;font-family:inherit}.home-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--purple-dark),0 10px 18px rgba(108,89,232,.3)}.home-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--purple-dark),0 3px 6px rgba(108,89,232,.2)}.home-btn svg{width:16px;height:16px;fill:currentColor}body{min-height:100vh;color:var(--ink);background:radial-gradient(circle at 12% 15%,rgba(255,216,92,.55),transparent 26%),radial-gradient(circle at 88% 18%,rgba(255,95,145,.17),transparent 24%),radial-gradient(circle at 80% 88%,rgba(66,200,193,.25),transparent 28%),linear-gradient(135deg,#fff8e8 0%,#f7f5ff 52%,#eefdff 100%);background-attachment:fixed}.app{position:relative;min-height:100vh;width:100%;padding:clamp(24px,4vw,58px) clamp(18px,5vw,78px);display:flex;flex-direction:column}.app:before,.app:after{content:"";position:fixed;z-index:-1;border-radius:45% 55% 60% 40%;pointer-events:none}.app:before{width:220px;height:220px;left:-70px;bottom:-70px;background:linear-gradient(145deg,rgba(255,130,92,.32),rgba(255,216,92,.25));transform:rotate(18deg)}.app:after{width:250px;height:250px;right:-90px;top:-80px;background:linear-gradient(145deg,rgba(138,120,255,.26),rgba(66,200,193,.18));transform:rotate(-24deg)}
.header{text-align:center;margin-bottom:26px}.title{margin:0;font-size:36px;font-weight:400;letter-spacing:-.45px}.subtitle{margin:10px 0 0;color:#514d73;font-size:24px;font-weight:400}.game{flex:1;width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;gap:20px}.column{display:grid;gap:18px}.match-card{position:relative;width:100%;min-height:92px;padding:17px 22px;border:3px solid #d9d1f7;border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(247,244,255,.92));color:var(--ink);box-shadow:0 7px 0 #c7bdeb,0 15px 26px rgba(77,62,145,.14),inset 0 3px 0 #fff;cursor:pointer;text-align:left;display:flex;align-items:center;gap:16px;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}.match-card:hover:not(:disabled){transform:translateY(-3px);border-color:var(--purple);box-shadow:0 10px 0 #b8ade8,0 20px 30px rgba(77,62,145,.18)}.match-card:focus-visible{outline:5px solid rgba(108,89,232,.2);outline-offset:3px}.match-card.selected{border-color:var(--purple);background:linear-gradient(145deg,#f7f4ff,#e8e2ff);box-shadow:0 8px 0 var(--purple-dark),0 16px 27px rgba(108,89,232,.23)}.match-card.matched{border-color:var(--green);background:linear-gradient(145deg,#f4fff9,#d8f7e9);box-shadow:0 7px 0 var(--green-dark),0 15px 25px rgba(21,149,111,.18);cursor:default}.match-card:disabled{opacity:1}.match-card.shake{animation:shake .42s ease}.number,.letter{flex:0 0 46px;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;color:#fff;background:linear-gradient(145deg,#8a78ff,var(--purple));border:2px solid var(--purple-dark);box-shadow:0 5px 0 #352b8f;font-size:21px;font-weight:400}.matched .number,.matched .letter{background:linear-gradient(145deg,#2db98c,var(--green));border-color:var(--green-dark);box-shadow:0 5px 0 #075d45}.card-text{font-size:26px;font-weight:400;line-height:1.25;flex:1}
.btn{min-width:160px;min-height:56px;padding:12px 24px;border:3px solid;border-radius:17px;font-size:18px;font-weight:400;cursor:pointer}.primary{color:#fff;background:linear-gradient(145deg,#8a78ff,var(--purple));border-color:var(--purple-dark);box-shadow:0 7px 0 #352b8f}.secondary{color:var(--ink);background:#fff;border-color:var(--ink);box-shadow:0 7px 0 #c8c2d3}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@media(min-width:1440px){.title{font-size:44px}.subtitle{font-size:30px}.game{width:min(1320px,100%);grid-template-columns:1fr 140px 1fr}.match-card{min-height:108px;padding:20px 26px}.card-text{font-size:25px}.number,.letter{width:54px;height:54px;flex-basis:54px;font-size:25px}}
@media(max-width:820px){.app{padding:24px 12px}.game{grid-template-columns:1fr;gap:26px}.middle{display:none}.column{gap:12px}.match-card{min-height:76px;padding:13px 15px}.card-text{font-size:17px}.number,.letter{width:40px;height:40px;flex-basis:40px}.right{padding-top:24px;border-top:3px dashed rgba(108,89,232,.22)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html,body{width:100%;height:100%;overflow:hidden}
.app{height:100vh;min-height:0;padding:clamp(90px,12vh,120px) clamp(18px,3.5vw,58px) clamp(12px,2.2vh,24px) clamp(18px,3.5vw,58px)}
.header{flex:0 0 auto;margin-bottom:clamp(10px,1.8vh,20px)}
.title{font-size:clamp(27px,3.2vh,36px);font-weight:400}
.subtitle{margin-top:5px;font-size:clamp(15px,1.9vh,24px);font-weight:400}
.game{flex:1 1 auto;min-height:0;width:min(1180px,100%);grid-template-columns:minmax(0,1fr) clamp(70px,8vw,105px) minmax(0,1fr);gap:clamp(12px,1.8vw,22px)}
.column{min-height:0;height:100%;display:grid;grid-template-rows:repeat(5,auto);gap:clamp(18px,3.5vh,32px)}
.match-card{min-height:0;height:100%;padding:clamp(8px,1.3vh,14px) clamp(12px,1.4vw,20px);border-radius:clamp(15px,1.8vh,20px)}
.number,.letter{width:clamp(36px,4.8vh,46px);height:clamp(36px,4.8vh,46px);flex-basis:clamp(36px,4.8vh,46px);border-radius:12px;font-size:clamp(17px,2.3vh,21px)}
.card-text{font-size:26px;line-height:1.18}
.match-symbol{width:clamp(58px,7vh,76px);height:clamp(58px,7vh,76px);border-radius:20px;font-size:clamp(29px,4vh,38px)}
.status{flex:0 0 auto;min-height:22px;margin:clamp(9px,1.3vh,15px) 0 0;font-size:clamp(15px,1.9vh,18px)}
.reset-row{flex:0 0 auto;margin-top:clamp(8px,1.1vh,12px)}
.reset{min-height:clamp(44px,5.2vh,52px);padding:8px 22px;font-size:clamp(15px,1.8vh,17px)}
@media(min-width:821px) and (max-height:760px){.app{padding-top:10px;padding-bottom:10px}.header{margin-bottom:8px}.title{font-size:27px;font-weight:400}.subtitle{font-size:20px;font-weight:400}.column{gap:18px}.match-card{padding-top:7px;padding-bottom:7px}.number,.letter{width:36px;height:36px;flex-basis:36px}.card-text{font-size:26px}.status{margin-top:7px}.reset-row{margin-top:5px}.reset{min-height:42px}}
@media(max-width:820px){html,body{height:auto;overflow:auto}.app{height:auto;min-height:100vh}.game{grid-template-columns:1fr}.column{height:auto;grid-template-rows:none}.match-card{min-height:72px}}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.status,.reset-row,.reset{display:none!important}
.game{padding-bottom:clamp(8px,1.5vh,18px);position:relative}
.match-lines{position:absolute;inset:0;z-index:3;width:100%;height:100%;overflow:visible;pointer-events:none}
.column,.middle{position:relative;z-index:4}
.match-line-shadow{fill:none;stroke:rgba(39,37,58,.18);stroke-width:9;stroke-linecap:round}
.match-line{fill:none;stroke:#15956f;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 3px 2px rgba(8,115,84,.25));stroke-dasharray:800;stroke-dashoffset:800;animation:drawMatchLine 420ms ease forwards}
.match-dot{fill:#fff;stroke:#15956f;stroke-width:4;filter:drop-shadow(0 3px 2px rgba(8,115,84,.22))}
@keyframes drawMatchLine{to{stroke-dashoffset:0}}
@media(max-width:820px){.match-lines{display:none}}
.match-symbol{display:none!important}
.middle{min-width:0;pointer-events:none}
.popup-overlay{background:transparent!important;backdrop-filter:none!important}
.right .match-card:nth-child(1){background:#ffe0e6}
.right .match-card:nth-child(2){background:#dceeff}
.right .match-card:nth-child(3){background:#d4f5e2}
.right .match-card:nth-child(4){background:#e8e0ff}
.right .match-card:nth-child(5){background:#fff5cc}
</style>
</head>
<body>
<a href="../index.html" class="home-btn"><svg viewBox="0 0 16 16"><path d="M8 1L1 7h2v6h4V9h2v4h4V7h2L8 1z"/></svg> Home</a>
<main class="app">
<header class="header"><h1 class="title">Match the following</h1><p class="subtitle">Choose one card from the left, then choose its matching card from the right.</p></header>
<section id="game" class="game" aria-label="Subtraction matching activity"><svg id="matchLines" class="match-lines" aria-hidden="true"></svg>
<div id="leftColumn" class="column left"></div>
<div class="middle" aria-hidden="true"></div>
<div id="rightColumn" class="column right"></div>
</section>
<p id="status" class="sr-only" aria-live="polite"></p>
</main>
<script src="../js/quiz.js?v=3"></script>
<script>
"use strict";
var leftItems=[
{id:"result",label:"The result in subtraction",match:"difference"},
{id:"subtracted",label:"The number that is subtracted",match:"subtrahend"},
{id:"ninety",label:"100 \u2212 10",match:"90"},
{id:"from",label:"The number from which subtraction is done",match:"minuend"},
{id:"twoHundred",label:"700 \u2212 500",match:"200"}
];
var rightItems=[
{id:"minuend",letter:"a",label:"Minuend"},
{id:"200",letter:"b",label:"200"},
{id:"subtrahend",letter:"c",label:"Subtrahend"},
{id:"difference",letter:"d",label:"Difference"},
{id:"90",letter:"e",label:"90"}
];
var selectedLeft=null;var matched=new Set();
var leftColumn=document.getElementById("leftColumn"),rightColumn=document.getElementById("rightColumn"),statusText=document.getElementById("status"),game=document.getElementById("game"),matchLines=document.getElementById("matchLines");

function render(){
  leftColumn.innerHTML="";rightColumn.innerHTML="";
  leftItems.forEach(function(item,index){
    var b=document.createElement("button");b.type="button";
    b.className="match-card"+(selectedLeft===item.id?" selected":"")+(matched.has(item.id)?" matched":"");
    b.disabled=matched.has(item.id);b.dataset.id=item.id;
    b.innerHTML='<span class="number">'+(index+1)+'</span><span class="card-text">'+item.label+'</span>';
    b.onclick=function(){selectLeft(item.id)};leftColumn.appendChild(b);
  });
  rightItems.forEach(function(item){
    var owner=leftItems.find(function(x){return x.match===item.id});
    var done=owner&&matched.has(owner.id);
    var b=document.createElement("button");b.type="button";
    b.className="match-card"+(done?" matched":"");
    b.disabled=done;b.dataset.id=item.id;
    b.innerHTML='<span class="letter">'+item.letter+'</span><span class="card-text">'+item.label+'</span>';
    b.onclick=function(){selectRight(item.id,b)};rightColumn.appendChild(b);
  });
  requestAnimationFrame(drawMatchLines);
}

function drawMatchLines(){
  matchLines.innerHTML="";
  if(window.innerWidth<=820)return;
  var gameBox=game.getBoundingClientRect();
  matched.forEach(function(leftId){
    var leftItem=leftItems.find(function(item){return item.id===leftId});
    if(!leftItem)return;
    var leftCard=leftColumn.querySelector('[data-id="'+leftId+'"]');
    var rightCard=rightColumn.querySelector('[data-id="'+leftItem.match+'"]');
    if(!leftCard||!rightCard)return;
    var a=leftCard.getBoundingClientRect();
    var b=rightCard.getBoundingClientRect();
    var x1=a.right-gameBox.left;
    var y1=a.top+a.height/2-gameBox.top;
    var x2=b.left-gameBox.left;
    var y2=b.top+b.height/2-gameBox.top;
    var bend=Math.max(55,(x2-x1)*0.42);
    var pathData="M "+x1+" "+y1+" C "+(x1+bend)+" "+y1+", "+(x2-bend)+" "+y2+", "+x2+" "+y2;
    var ns="http://www.w3.org/2000/svg";
    var shadow=document.createElementNS(ns,"path");
    shadow.setAttribute("d",pathData);shadow.setAttribute("class","match-line-shadow");
    var line=document.createElementNS(ns,"path");
    line.setAttribute("d",pathData);line.setAttribute("class","match-line");
    var startDot=document.createElementNS(ns,"circle");
    startDot.setAttribute("cx",x1);startDot.setAttribute("cy",y1);startDot.setAttribute("r",7);startDot.setAttribute("class","match-dot");
    var endDot=document.createElementNS(ns,"circle");
    endDot.setAttribute("cx",x2);endDot.setAttribute("cy",y2);endDot.setAttribute("r",7);endDot.setAttribute("class","match-dot");
    matchLines.append(shadow,line,startDot,endDot);
  });
}

function selectLeft(id){selectedLeft=id;statusText.textContent="Now choose the matching card on the right.";render();}

function selectRight(rightId,rightButton){
  if(!selectedLeft){vibrate(rightButton);statusText.textContent="First choose a card from the left.";return;}
  var left=leftItems.find(function(x){return x.id===selectedLeft});
  var leftButton=leftColumn.querySelector('[data-id="'+selectedLeft+'"]');
  if(left.match!==rightId){vibrate(leftButton);vibrate(rightButton);Quiz2.speak("Try again.");statusText.textContent="That pair does not match. Try another card.";return;}
  matched.add(selectedLeft);selectedLeft=null;
  statusText.textContent=matched.size===leftItems.length?"All pairs are correct!":"Correct match! Choose another card from the left.";
  Quiz2.speak("Correct!");
  render();
  Quiz2.confetti({count:70});
  if(matched.size===leftItems.length){
    Quiz2.showPopout("correct","All pairs are correct!",function(){
      var starCount=3;
      var starStr=Array(starCount+1).join("\u2605")+Array(4-starCount).join("\u2606");
      Quiz2.showCongrats(leftItems.length,leftItems.length,starStr,function(){
        selectedLeft=null;matched.clear();statusText.textContent="Select a card from the left.";render();
      });
    });
  }
}

function vibrate(el){if(!el)return;el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");setTimeout(function(){el.classList.remove("shake")},450);}

window.addEventListener("resize",drawMatchLines);
render();
</script>
</body>
</html>
