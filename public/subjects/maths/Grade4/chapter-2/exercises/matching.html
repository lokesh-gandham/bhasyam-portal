<body>
<a href="../index.html" class="home-btn"><svg viewBox="0 0 16 16">
      <path d="M8 1L1 7h2v6h4V9h2v4h4V7h2L8 1z" /></svg> Home</a>
<main class="app">
<header class="header"><h1 class="title">Match the following</h1><p class="subtitle">Choose one card from the left, then choose its matching card from the right.</p></header>
<section id="game" class="game" aria-label="Subtraction matching activity"><svg id="matchLines" class="match-lines" aria-hidden="true"></svg>
<div id="leftColumn" class="column left"></div>
<div class="middle" aria-hidden="true"></div>
<div id="rightColumn" class="column right"></div>
</section>
<p id="status" class="sr-only" aria-live="polite"></p>
</main>
<script src="../js/quiz.js?v=3"></script>
<script>
"use strict";
var leftItems=[
{id:"result",label:"The result in subtraction",match:"difference"},
{id:"subtracted",label:"The number that is subtracted",match:"subtrahend"},
{id:"ninety",label:"100 \u2212 10",match:"90"},
{id:"from",label:"The number from which subtraction is done",match:"minuend"},
{id:"twoHundred",label:"700 \u2212 500",match:"200"}
];
var rightItems=[
{id:"minuend",letter:"a",label:"Minuend"},
{id:"200",letter:"b",label:"200"},
{id:"subtrahend",letter:"c",label:"Subtrahend"},
{id:"difference",letter:"d",label:"Difference"},
{id:"90",letter:"e",label:"90"}
];
var selectedLeft=null;var matched=new Set();
var leftColumn=document.getElementById("leftColumn"),rightColumn=document.getElementById("rightColumn"),statusText=document.getElementById("status"),game=document.getElementById("game"),matchLines=document.getElementById("matchLines");

function render(){
  leftColumn.innerHTML="";rightColumn.innerHTML="";
  leftItems.forEach(function(item,index){
    var b=document.createElement("button");b.type="button";
    b.className="match-card"+(selectedLeft===item.id?" selected":"")+(matched.has(item.id)?" matched":"");
    b.disabled=matched.has(item.id);b.dataset.id=item.id;
    b.innerHTML='<span class="number">'+(index+1)+'</span><span class="card-text">'+item.label+'</span>';
    b.onclick=function(){selectLeft(item.id)};leftColumn.appendChild(b);
  });
  rightItems.forEach(function(item){
    var owner=leftItems.find(function(x){return x.match===item.id});
    var done=owner&&matched.has(owner.id);
    var b=document.createElement("button");b.type="button";
    b.className="match-card"+(done?" matched":"");
    b.disabled=done;b.dataset.id=item.id;
    b.innerHTML='<span class="letter">'+item.letter+'</span><span class="card-text">'+item.label+'</span>';
    b.onclick=function(){selectRight(item.id,b)};rightColumn.appendChild(b);
  });
  requestAnimationFrame(drawMatchLines);
}

function drawMatchLines(){
  matchLines.innerHTML="";
  if(window.innerWidth<=820)return;
  var gameBox=game.getBoundingClientRect();
  matched.forEach(function(leftId){
    var leftItem=leftItems.find(function(item){return item.id===leftId});
    if(!leftItem)return;
    var leftCard=leftColumn.querySelector('[data-id="'+leftId+'"]');
    var rightCard=rightColumn.querySelector('[data-id="'+leftItem.match+'"]');
    if(!leftCard||!rightCard)return;
    var a=leftCard.getBoundingClientRect();
    var b=rightCard.getBoundingClientRect();
    var x1=a.right-gameBox.left;
    var y1=a.top+a.height/2-gameBox.top;
    var x2=b.left-gameBox.left;
    var y2=b.top+b.height/2-gameBox.top;
    var bend=Math.max(55,(x2-x1)*0.42);
    var pathData="M "+x1+" "+y1+" C "+(x1+bend)+" "+y1+", "+(x2-bend)+" "+y2+", "+x2+" "+y2;
    var ns="http://www.w3.org/2000/svg";
    var shadow=document.createElementNS(ns,"path");
    shadow.setAttribute("d",pathData);shadow.setAttribute("class","match-line-shadow");
    var line=document.createElementNS(ns,"path");
    line.setAttribute("d",pathData);line.setAttribute("class","match-line");
    var startDot=document.createElementNS(ns,"circle");
    startDot.setAttribute("cx",x1);startDot.setAttribute("cy",y1);startDot.setAttribute("r",7);startDot.setAttribute("class","match-dot");
    var endDot=document.createElementNS(ns,"circle");
    endDot.setAttribute("cx",x2);endDot.setAttribute("cy",y2);endDot.setAttribute("r",7);endDot.setAttribute("class","match-dot");
    matchLines.append(shadow,line,startDot,endDot);
  });
}

function selectLeft(id){selectedLeft=id;statusText.textContent="Now choose the matching card on the right.";render();}

function selectRight(rightId,rightButton){
  if(!selectedLeft){vibrate(rightButton);statusText.textContent="First choose a card from the left.";return;}
  var left=leftItems.find(function(x){return x.id===selectedLeft});
  var leftButton=leftColumn.querySelector('[data-id="'+selectedLeft+'"]');
  if(left.match!==rightId){vibrate(leftButton);vibrate(rightButton);Quiz2.speak("Try again.");statusText.textContent="That pair does not match. Try another card.";return;}
  matched.add(selectedLeft);selectedLeft=null;
  statusText.textContent=matched.size===leftItems.length?"All pairs are correct!":"Correct match! Choose another card from the left.";
  Quiz2.speak("Correct!");
  render();
  Quiz2.confetti({count:70});
  if(matched.size===leftItems.length){
    Quiz2.showPopout("correct","All pairs are correct!",function(){
      var starCount=3;
      var starStr=Array(starCount+1).join("\u2605")+Array(4-starCount).join("\u2606");
      Quiz2.showCongrats(leftItems.length,leftItems.length,starStr,function(){
        selectedLeft=null;matched.clear();statusText.textContent="Select a card from the left.";render();
      });
    });
  }
}

function vibrate(el){if(!el)return;el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");setTimeout(function(){el.classList.remove("shake")},450);}

window.addEventListener("resize",drawMatchLines);
render();
</script>
</body>
