<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap">
  <title>Missing Digits Quiz</title>
  <link rel="stylesheet" href="../css/quiz.css?v=5">
  <style>
    :root {
      --purple: #6557d9;
      --purple-dark: #5043bd;
      --purple-light: #f1efff;
      --orange: #ff8a3d;
      --orange-dark: #df6c23;
      --orange-light: #fff3e8;
      --green: #15956f;
      --green-dark: #0d7657;
      --green-light: #e7f8f1;
      --blue: #3187d9;
      --blue-light: #eaf5ff;
      --red: #c83d4f;
      --red-light: #fff0f2;
      --yellow: #ffd95c;
      --cream: #fffaf0;
      --white: #ffffff;
      --text: #27253a;
      --line: #e8e3d8;
      --focus: #1557b0;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      font-family: "Livvic", sans-serif;
    }

    .home-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 40;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 12px;
      border: 2px solid var(--purple);
      background: linear-gradient(145deg, #8a78ff, var(--purple));
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      box-shadow: 0 4px 0 var(--purple-dark), 0 6px 14px rgba(101, 87, 217, .25);
      transition: transform .15s ease, box-shadow .15s ease;
      font-family: inherit
    }

    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--purple-dark), 0 10px 18px rgba(101, 87, 217, .3)
    }

    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--purple-dark), 0 3px 6px rgba(101, 87, 217, .2)
    }

    .home-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at 8% 10%, rgba(255, 217, 92, 0.35), transparent 25%), radial-gradient(circle at 92% 88%, rgba(101, 87, 217, 0.16), transparent 28%), linear-gradient(145deg, #fffdf5, #f7fbff);
    }

    main {
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    .card {
      position: relative;
      width: min(94vw, 1120px);
      height: calc(100vh - 55px);
      max-height: calc(100vh - 23px);
      /* 32px .app padding + the card's own 23px lip, which paints below the border box and was chopped flat at the bottom of the screen */
      padding: 32px 48px 28px;
      display: flex;
      flex-direction: column;
      background: transparent;
      border: 3px solid #ece6d8;
      border-radius: 34px;
      box-shadow: 0 23px 0 rgba(101, 87, 217, 0.08), 0 28px 65px rgba(55, 49, 91, 0.16);
      overflow: hidden;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      font-weight: 400;
      margin: 0 0 8px;
      color: var(--text);
    }

    .help {
      text-align: center;
      font-size: 18px;
      font-weight: 400;
      margin: 0 0 20px;
      color: var(--text);
    }

    .board {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 20px;
      min-height: 120px;
      width: min(100%, 940px);
      margin: 0 auto;
      background: linear-gradient(rgba(49, 135, 217, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(49, 135, 217, 0.05) 1px, transparent 1px), #fffef9;
      background-size: 24px 24px;
      border-radius: 25px;
    }

    .wrap {
      position: relative;
      padding-left: 55px;
      z-index: 1;
    }

    .plus {
      position: absolute;
      left: 2px;
      top: 135px;
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--purple);
      border: 3px solid var(--purple-dark);
      border-radius: 14px;
      box-shadow: 0 6px 0 var(--purple-dark);
      font-size: 30px;
      font-weight: 400;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      box-shadow: 0 8px 0 #302d38, 0 17px 28px rgba(39, 37, 58, 0.2);
      border-radius: 15px;
      overflow: hidden;
    }

    th,
    td {
      width: 82px;
      height: 68px;
      border-right: 2px solid #474451;
      border-bottom: 2px solid #474451;
      text-align: center;
      background: #fff;
      font-size: 30px;
      font-weight: 400;
    }

    th {
      height: 55px;
      border-top: 2px solid #474451;
      background: linear-gradient(#fff9bb, #ffef78);
      font-size: 30px;
    }

    th:first-child,
    td:first-child {
      border-left: 2px solid #474451;
    }

    th:first-child {
      border-top-left-radius: 15px;
    }

    th:last-child {
      border-top-right-radius: 15px;
    }

    tr:last-child td {
      border-top: 5px solid var(--purple);
      background: var(--purple-light);
    }

    .digit {
      width: calc(100% - 10px);
      height: calc(100% - 10px);
      margin: 5px;
      text-align: center;
      font-size: 30px;
      font-weight: 400;
      color: var(--text);
      background: linear-gradient(145deg, #fffaf5, #ffe8d6);
      border: 3px solid var(--orange);
      border-radius: 10px;
      outline: none;
      box-shadow: 0 5px 0 rgba(255, 138, 61, 0.2), 0 10px 16px rgba(255, 138, 61, 0.24);
      transition: 0.18s ease;
    }

    .digit:hover:not([readonly]) {
      transform: translateY(-2px);
      background: #fff;
      box-shadow: 0 7px 0 rgba(255, 138, 61, 0.2), 0 14px 20px rgba(255, 138, 61, 0.25);
    }

    .digit:focus {
      transform: translateY(-3px) scale(1.05);
      border-color: var(--purple);
      box-shadow: 0 6px 0 var(--purple-dark), 0 0 0 5px rgba(101, 87, 217, 0.18), 0 15px 25px rgba(101, 87, 217, 0.24);
    }

    .digit.bad {
      background: var(--red-light);
      border-color: var(--red);
      box-shadow: 0 5px 0 rgba(200, 61, 79, 0.15);
    }

    .digit[readonly] {
      background: var(--green-light);
      border-color: var(--green);
      box-shadow: 0 5px 0 rgba(21, 149, 111, 0.15), 0 10px 18px rgba(21, 149, 111, 0.18);
    }

    .msg {
      color: var(--red);
      font-size: 15px;
      font-weight: 400;
      text-align: center;
      min-height: 20px;
      margin: 8px 0 0;
    }

    .nav {
      width: min(100%, 940px);
      margin: 15px auto 0;
      padding-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border-top: 2px dashed #dcd6c8;
      flex-wrap: wrap;
    }

    .btn {
      border-radius: 16px;
      min-width: 140px;
      min-height: 50px;
      padding: 10px 22px;
      font-size: 17px;
      font-weight: 400;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-3px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: none;
    }

    .btn:disabled {
      color: var(--text);
      background: var(--white);
      border: 3px dashed #6d6975;
      box-shadow: none;
      cursor: not-allowed;
    }

    .primary {
      color: var(--white);
      background: var(--green);
      border: 3px solid var(--green);
      box-shadow: 0 7px 0 var(--green-dark);
    }

    .primary:hover:not(:disabled) {
      background: var(--green-dark);
    }

    .check {
      color: var(--white);
      background: var(--purple);
      border: 3px solid var(--purple);
      box-shadow: 0 7px 0 var(--purple-dark);
    }

    .check:hover:not(:disabled) {
      background: var(--purple-dark);
    }

    /* check button "not all filled yet" state -> faded, but keeps its own colors (not the generic dashed :disabled look) */
    .check.incomplete {
      opacity: 0.4;
      background: var(--purple);
      border: 3px solid var(--purple);
      box-shadow: 0 7px 0 var(--purple-dark);
      cursor: not-allowed;
    }

    .secondary {
      color: var(--text);
      background: var(--white);
      border: 3px solid var(--text);
      box-shadow: 0 7px 0 #d9d5cd;
    }

    .background-shape {
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
    }

    .shape-three {
      top: 15%;
      right: 5%;
      width: 95px;
      height: 95px;
      border: 20px solid rgba(49, 135, 217, 0.12);
    }

    @media (max-width: 700px) {
      .card {
        padding: 24px 16px 20px;
        height: calc(100vh - 39px);
        /* 16px padding + 23px lip */
        border-radius: 23px;
      }

      h1 {
        font-size: 27px;
      }

      .board {
        border-radius: 22px;
        min-height: 100px;
        padding: 15px 8px;
      }

      .nav {
        flex-direction: column-reverse;
      }

      .nav .btn {
        width: 100%;
        min-height: 48px;
        font-size: 16px;
      }

      .digit {
        width: calc(100% - 8px);
        height: calc(100% - 8px);
        margin: 4px;
        font-size: 24px;
      }

      th,
      td {
        width: 65px;
        height: 55px;
        font-size: 24px;
      }

      th {
        height: 45px;
        font-size: 16px;
      }
    }

    .popup-overlay {
      background: transparent !important;
      backdrop-filter: none !important
    }
  </style>
</head>

<body>
  <a href="../index.html" class="home-btn"><svg viewBox="0 0 16 16">
      <path d="M8 1L1 7h2v6h4V9h2v4h4V7h2L8 1z" />
    </svg> Home</a>
  <div class="background-shape shape-three"></div>
  <main>
    <section class="card">
      <h1>Find the missing digits</h1>
      <p class="help">Enter one digit in each raised orange box.</p>
      <div class="board">
        <div class="wrap">
          <span class="plus">+</span>
          <table id="grid"></table>
        </div>
      </div>
      <p id="msg" class="msg"></p>
      <nav class="nav">
        <button id="prev" class="btn secondary">← Previous</button>
        <button id="check" class="btn check">Check Answer</button>
        <button id="next" class="btn primary" disabled>Next →</button>
      </nav>
    </section>
  </main>
  <script src="../js/quiz.js?v=3"></script>
  <script>
    "use strict";
    var qs = [
      { c: ['T Th', 'Th', 'H', 'T', 'O'], r: [['i7', 'i4', '2', '1', '0'], ['1', '4', '5', 'i2', '2'], ['8', '8', 'i7', '3', '2']] },
      { c: ['T Th', 'Th', 'H', 'T', 'O'], r: [['4', 'i3', '1', '0', 'i6'], ['i3', '9', '7', 'i8', '5'], ['8', '2', 'i8', '9', '1']] },
      { c: ['L', 'T Th', 'Th', 'H', 'T', 'O'], r: [['', '5', 'i0', 'i9', '8', '4'], ['', '6', '7', '0', 'i8', 'i6'], ['1', 'i1', '8', '0', '7', '0']] },
      { c: ['L', 'T Th', 'Th', 'H', 'T', 'O'], r: [['', 'i8', '4', '7', 'i5', '2'], ['', '9', 'i5', '6', '4', 'i9'], ['i1', '8', '0', 'i4', '0', '1']] }
    ];
    var at = 0; var st = init();
    var grid = document.getElementById('grid');
    var prevBtn = document.getElementById('prev');
    var checkBtn = document.getElementById('check');
    var nextBtn = document.getElementById('next');
    var msg = document.getElementById('msg');

    function init() {
      return qs.map(function (q, qi) {
        var v = {};
        q.r.forEach(function (r, ri) { r.forEach(function (x, ci) { if (x[0] === 'i') v[qi + '-' + ri + '-' + ci] = ''; }); });
        // locked keeps track of which individual boxes have already been answered correctly
        return { done: false, v: v, save: null, locked: {} };
      });
    }

    // Enables/disables the Check button based on whether every still-editable
    // box (i.e. not yet locked-in as correct) currently has a digit in it.
    function updateCheckBtn() {
      var s = st[at];

      if (s.done) {
        checkBtn.disabled = true;
        checkBtn.classList.remove('incomplete');
        checkBtn.textContent = 'Answered';
        return;
      }

      var inputs = grid.querySelectorAll('input');
      var allFilled = true;
      inputs.forEach(function (i) {
        if (!i.readOnly && !i.value) allFilled = false;
      });

      checkBtn.disabled = !allFilled;
      checkBtn.classList.toggle('incomplete', !allFilled);
      checkBtn.textContent = 'Check Answer';
    }

    function draw() {
      var q = qs[at], s = st[at];
      grid.innerHTML = '';
      var hr = document.createElement('tr');
      q.c.forEach(function (x) { var th = document.createElement('th'); th.textContent = x; hr.appendChild(th); });
      grid.appendChild(hr);
      q.r.forEach(function (r, ri) {
        var tr = document.createElement('tr');
        r.forEach(function (x, ci) {
          var td = document.createElement('td');
          if (x[0] === 'i') {
            var id = at + '-' + ri + '-' + ci;
            var inp = document.createElement('input');
            inp.className = 'digit'; inp.id = id; inp.maxLength = 1; inp.inputMode = 'numeric';
            inp.dataset.a = x.slice(1);
            inp.value = s.done ? s.save[id] : (s.v[id] || '');
            inp.readOnly = s.done || !!s.locked[id];
            inp.oninput = function (e) {
              e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 1);
              s.v[id] = e.target.value;
              e.target.classList.remove('bad');
              msg.textContent = '';
              updateCheckBtn();
            };
            td.appendChild(inp);
          } else { td.textContent = x; }
          tr.appendChild(td);
        });
        grid.appendChild(tr);
      });
      prevBtn.disabled = at === 0;
      nextBtn.disabled = !s.done || at === qs.length - 1;
      nextBtn.textContent = 'Next →';
      updateCheckBtn();
    }

    function checkAnswer() {
      var s = st[at];
      var allCorrect = true;
      var first = null;

      grid.querySelectorAll('input').forEach(function (i) {
        if (i.readOnly) return; // already locked-in from a previous check

        var id = i.id;
        var good = s.v[id] === i.dataset.a;

        if (good) {
          // lock this box in permanently
          s.locked[id] = true;
          i.readOnly = true;
          i.classList.remove('bad');
        } else {
          allCorrect = false;
          first = first || i;
          // clear the wrong box so the user re-enters just that one
          i.classList.add('bad');
          i.value = '';
          s.v[id] = '';
        }
      });

      // SOME WRONG (but at least one may now be locked) -> stay on this question
      if (!allCorrect) {
        msg.textContent = 'Check the highlighted digits and try again.';
        updateCheckBtn(); // will disable Check again until the cleared boxes are refilled

        Quiz2.showPopout(
          'wrong',
          'Check the highlighted digits and give it another try.',
          function () {
            if (first) first.focus();
          }
        );

        return;
      }

      // ALL CORRECT
      s.done = true;
      s.save = Object.assign({}, s.v);

      // LAST QUESTION
      if (at === qs.length - 1) {

        var starCount = 3;
        var starStr =
          Array(starCount + 1).join('\u2605') +
          Array(4 - starCount).join('\u2606');

        // FIRST: show correct popup
        Quiz2.showPopout(
          'correct',
          'You found all the missing digits.',
          function () {

            // THEN: show final congratulations popup
            Quiz2.showCongrats(
              qs.length,
              qs.length,
              starStr,
              function () {

                // Restart quiz after congratulations
                at = 0;
                st = init();
                draw();

              }
            );

          }
        );

        return;
      }

      // OTHER QUESTIONS
      Quiz2.showPopout(
        'correct',
        'You found all the missing digits.',
        function () {
          draw();
        }
      );
    }

    function goNext() {
      var s = st[at];
      if (!s.done) return;
      if (at < qs.length - 1) { at++; draw(); }
    }

    prevBtn.onclick = function () { if (at > 0) { at--; draw(); } };
    checkBtn.onclick = function () { if (!checkBtn.disabled) checkAnswer(); };
    nextBtn.onclick = goNext;
    draw();
  </script>
</body>

</html>
