<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Properties of Addition Quiz</title>
  <link rel="stylesheet" href="../css/quiz.css?v=5">

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap");

    .home-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 40;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 12px;
      border: 2px solid var(--purple);
      background: linear-gradient(145deg, #8a78ff, var(--purple));
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      box-shadow: 0 4px 0 var(--purple-dark), 0 6px 14px rgba(101, 87, 217, .25);
      transition: transform .15s ease, box-shadow .15s ease;
      font-family: inherit
    }

    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--purple-dark), 0 10px 18px rgba(101, 87, 217, .3)
    }

    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--purple-dark), 0 3px 6px rgba(101, 87, 217, .2)
    }

    .home-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor
    }

    :root {
      --purple: #6557d9;
      --purple-dark: #5043bd;
      --purple-light: #f1efff;

      --orange: #ff8a3d;
      --orange-dark: #df6c23;
      --orange-light: #fff3e8;

      --green: #15956f;
      --green-dark: #0d7657;
      --green-light: #e7f8f1;

      --blue: #3187d9;
      --blue-light: #eaf5ff;

      --red: #c83d4f;
      --red-light: #fff0f2;

      --yellow: #ffd95c;
      --cream: #fffaf0;
      --white: #ffffff;
      --text: #27253a;
      --line: #e8e3d8;
      --focus: #1557b0;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      font-family: "Livvic", sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 10%,
          rgba(255, 217, 92, 0.35),
          transparent 25%),
        radial-gradient(circle at 92% 88%,
          rgba(101, 87, 217, 0.16),
          transparent 28%),
        linear-gradient(145deg, #fffdf5, #f7fbff);
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: var(--text);
    }

    .app {
      position: relative;
      width: 100%;
      height: 100vh;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .background-shape {
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
    }

    .shape-one {
      top: -90px;
      left: -80px;
      width: 230px;
      height: 230px;
      background: rgba(255, 199, 82, 0.28);
    }

    .shape-two {
      right: -80px;
      bottom: -100px;
      width: 280px;
      height: 280px;
      background: rgba(101, 87, 217, 0.13);
    }

    .shape-three {
      top: 15%;
      right: 5%;
      width: 95px;
      height: 95px;
      border: 20px solid rgba(49, 135, 217, 0.12);
    }

    .quiz-card {
      position: relative;
      width: min(94vw, 1120px);
      height: calc(100vh - 55px);
      /* 32px .app padding + the card's own 23px lip */
      max-height: calc(100vh - 23px);
      padding: 32px 48px 28px;
      display: flex;
      flex-direction: column;
      background: transparent;
      border: 3px solid #ece6d8;
      border-radius: 34px;
      box-shadow:
        0 23px 0 rgba(101, 87, 217, 0.08),
        0 28px 65px rgba(55, 49, 91, 0.16);
      overflow: hidden;
    }



    .decoration-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .decoration-dot:nth-child(1) {
      background: var(--orange);
    }

    .decoration-dot:nth-child(2) {
      background: var(--yellow);
    }

    .decoration-dot:nth-child(3) {
      background: var(--green);
    }

    .question-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .question-badge {
      display: none;
      width: fit-content;
      margin: 0 auto 12px;
      padding: 7px 16px;
      color: var(--purple-dark);
      background: var(--purple-light);
      border: 2px solid var(--purple);
      border-radius: 999px;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .answered-badge {
      width: fit-content;
      margin: 0 auto 12px;
      padding: 7px 14px;
      display: none;
      align-items: center;
      gap: 8px;
      color: var(--green-dark);
      background: var(--green-light);
      border: 2px solid var(--green);
      border-radius: 999px;
      font-size: 15px;
      font-weight: 400;
    }

    .answered-badge.visible {
      display: flex;
    }

    .answer-tick {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      color: var(--white);
      background: var(--green);
      border-radius: 50%;
      font-size: 15px;
    }

    .instruction {
      max-width: 750px;
      margin: 0 auto 20px;
      color: var(--text);
      text-align: center;
      font-size: 26px;
      line-height: 1.4;
      font-weight: 400;
    }

    .equation-board {
      width: min(100%, 940px);
      min-height: 120px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(49, 135, 217, 0.05) 1px,
          transparent 1px),
        linear-gradient(90deg,
          rgba(49, 135, 217, 0.05) 1px,
          transparent 1px),
        #fffef9;
      background-size: 24px 24px;
      border: 3px solid #dedbea;
      border-radius: 25px;
      box-shadow: inset 0 -7px 0 rgba(101, 87, 217, 0.06);
    }

    .question-text {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text);
      text-align: center;
      font-size: 26px;
      line-height: 1.4;
      font-weight: 400;
    }

    .equation-part {
      white-space: nowrap;
    }

    .answer-input {
      width: 120px;
      min-height: 52px;
      padding: 6px 10px;
      color: var(--text);
      background: var(--white);
      border: 3px solid var(--orange);
      border-radius: 15px;
      outline: none;
      text-align: center;
      font-size: 22px;
      font-weight: 400;
      box-shadow: 0 5px 0 rgba(255, 138, 61, 0.2);
      transition:
        transform 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease;
    }

    .answer-input:hover:not([readonly]) {
      transform: translateY(-2px);
      border-color: var(--orange-dark);
    }

    .answer-input:focus-visible {
      border-color: var(--focus);
      box-shadow:
        0 0 0 5px rgba(21, 87, 176, 0.18),
        0 6px 0 rgba(21, 87, 176, 0.16);
    }

    .answer-input.is-wrong {
      background: var(--red-light);
      border-color: var(--red);
      box-shadow: 0 6px 0 rgba(200, 61, 79, 0.15);
    }

    .answer-input[readonly] {
      color: var(--text);
      background: var(--green-light);
      border-color: var(--green);
      box-shadow: 0 6px 0 rgba(21, 149, 111, 0.15);
      cursor: default;
    }

    .property-section {
      width: min(100%, 810px);
      margin: 15px auto 0;
    }

    .property-title {
      margin: 0 0 10px;
      text-align: center;
      color: var(--text);
      font-size: 16px;
      font-weight: 400;
    }

    .property-title span {
      display: inline-block;
      margin-right: 6px;
      font-size: 23px;
    }

    .property-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .property-card {
      position: relative;
      min-height: 80px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--text);
      background: var(--white);
      border: 3px solid #dcd8e9;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 6px 0 #e9e5f2;
      transition:
        transform 160ms ease,
        border-color 160ms ease,
        background-color 160ms ease,
        box-shadow 160ms ease;
    }

    .property-card[data-property="commutative"] {
      background: #e0ecff;
    }

    .property-card[data-property="identity"] {
      background: #d4f5e2;
    }

    .property-card[data-property="associative"] {
      background: #fde8d0;
    }

    .property-card:hover:not(:disabled) {
      transform: translateY(-4px);
      border-color: var(--purple);
      box-shadow: 0 9px 0 rgba(101, 87, 217, 0.15);
    }

    .property-card:focus-visible {
      outline: 4px solid rgba(21, 87, 176, 0.22);
      outline-offset: 3px;
    }

    .property-card.selected {
      color: var(--purple-dark);
      background: var(--purple-light);
      border-color: var(--purple);
      box-shadow: 0 7px 0 rgba(101, 87, 217, 0.23);
    }

    .property-card.wrong {
      color: var(--red);
      background: var(--red-light);
      border-color: var(--red);
      box-shadow: 0 7px 0 rgba(200, 61, 79, 0.15);
    }

    .property-card.locked {
      color: var(--green-dark);
      background: var(--green-light);
      border-color: var(--green);
      box-shadow: 0 7px 0 rgba(21, 149, 111, 0.16);
      cursor: default;
    }

    .property-icon {
      font-size: 26px;
      line-height: 1;
    }

    .property-name {
      font-size: 22px;
      line-height: 1.2;
      font-weight: 400;
    }

    .property-hint {
      display: none;
    }

    .selected-check {
      position: absolute;
      top: 8px;
      right: 9px;
      width: 23px;
      height: 23px;
      display: none;
      place-items: center;
      color: var(--white);
      background: var(--purple);
      border-radius: 50%;
      font-size: 13px;
      font-weight: 400;
    }

    .property-card.selected .selected-check,
    .property-card.locked .selected-check {
      display: grid;
    }

    .property-card.locked .selected-check {
      background: var(--green);
    }

    .field-message {
      min-height: 20px;
      margin: 8px 0 0;
      text-align: center;
      color: var(--red);
      font-size: 15px;
      line-height: 1.4;
      font-weight: 400;
    }

    .navigation {
      margin-top: 15px;
      padding-top: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-top: 2px dashed #dcd6c8;
    }

    .button {
      min-width: 155px;
      min-height: 50px;
      padding: 10px 22px;
      border: 3px solid transparent;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 400;
      cursor: pointer;
      transition:
        transform 160ms ease,
        box-shadow 160ms ease,
        background-color 160ms ease;
    }

    .button:hover:not(:disabled) {
      transform: translateY(-3px);
    }

    .button:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: none;
    }

    .button:focus-visible {
      outline: 4px solid rgba(21, 87, 176, 0.22);
      outline-offset: 3px;
    }

    .button-primary {
      color: var(--white);
      background: var(--purple);
      border-color: var(--purple);
      box-shadow: 0 7px 0 var(--purple-dark);
    }

    .button-primary:hover:not(:disabled) {
      background: var(--purple-dark);
    }

    .button-secondary {
      color: var(--text);
      background: var(--white);
      border-color: var(--text);
      box-shadow: 0 7px 0 #d9d5cd;
    }

    .button-orange {
      color: var(--white);
      background: var(--orange);
      border-color: var(--orange);
      box-shadow: 0 7px 0 var(--orange-dark);
    }

    .button:disabled {
      color: var(--text);
      background: var(--white);
      border: 3px dashed #6d6975;
      box-shadow: none;
      cursor: not-allowed;
      opacity: .4;
    }

    .dialog-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      padding: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(39, 37, 58, 0.68);
    }

    .dialog-overlay.visible {
      display: flex;
    }

    .dialog {
      position: relative;
      z-index: 2002;
      width: min(100%, 500px);
      padding: 38px 30px 34px;
      text-align: center;
      background: var(--white);
      border: 5px solid var(--purple);
      border-radius: 30px;
      box-shadow: 0 20px 0 rgba(39, 37, 58, 0.2);
      animation: popupEntrance 240ms ease-out;
    }

    .dialog.correct {
      border-color: var(--green);
    }

    .dialog.wrong {
      border-color: var(--red);
    }

    .dialog.final {
      width: min(100%, 560px);
      border-color: var(--orange);
    }

    @keyframes popupEntrance {
      from {
        opacity: 0;
        transform: scale(0.88) translateY(18px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .dialog-icon {
      width: 84px;
      height: 84px;
      margin: 0 auto 19px;
      display: grid;
      place-items: center;
      color: var(--white);
      background: var(--purple);
      border-radius: 50%;
      font-size: 43px;
      font-weight: 400;
      box-shadow: 0 8px 0 rgba(101, 87, 217, 0.2);
    }

    .correct .dialog-icon {
      background: var(--green);
    }

    .wrong .dialog-icon {
      background: var(--red);
    }

    .final .dialog-icon {
      color: var(--text);
      background: var(--yellow);
      border: 3px solid var(--orange);
    }

    .dialog-title {
      margin: 0 0 11px;
      color: var(--text);
      font-size: 31px;
      font-weight: 400;
    }

    .dialog-message {
      margin: 0;
      color: var(--text);
      font-size: 19px;
      line-height: 1.5;
      font-weight: 400;
    }

    .dialog-actions {
      margin-top: 27px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .menu-screen {
      display: none;
      width: min(94vw, 760px);
      height: calc(100vh - 32px);
      max-height: 500px;
      padding: 40px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--white);
      border: 3px solid #e8e1d3;
      border-radius: 34px;
      box-shadow: 0 25px 60px rgba(55, 49, 91, 0.16);
    }

    .menu-screen.visible {
      display: flex;
    }

    .menu-icon {
      width: 90px;
      height: 90px;
      margin-bottom: 18px;
      display: grid;
      place-items: center;
      background: var(--yellow);
      border: 4px solid var(--orange);
      border-radius: 26px;
      transform: rotate(-5deg);
      font-size: 45px;
    }

    .menu-title {
      margin: 0 0 10px;
      font-size: 32px;
      font-weight: 400;
    }

    .menu-description {
      max-width: 480px;
      margin: 0 0 24px;
      font-size: 18px;
      line-height: 1.5;
      font-weight: 400;
    }

    @media (min-width: 1440px) {
      .quiz-card {
        width: min(88vw, 1320px);
        height: calc(100vh - 63px);
        /* 40px padding + 23px lip */
        padding: 40px 60px 35px;
      }

      .instruction {
        font-size: 30px;
      }

      .question-text {
        font-size: 36px;
        gap: 14px;
      }

      .equation-board {
        min-height: 140px;
      }

      .answer-input {
        width: 150px;
        min-height: 60px;
        font-size: 28px;
      }

      .property-section {
        width: min(100%, 900px);
      }

      .property-card {
        min-height: 90px;
      }

      .property-name {
        font-size: 20px;
      }

      .property-hint {
        display: none;
      }

      .button {
        min-width: 175px;
        min-height: 55px;
        font-size: 20px;
      }
    }

    @media (max-width: 760px) {
      .app {
        padding: 8px;
      }

      .quiz-card {
        width: 100%;
        height: calc(100vh - 39px);
        /* 16px padding + 23px lip */
        padding: 24px 16px 20px;
        border-radius: 23px;
      }

      .instruction {
        margin-bottom: 15px;
        font-size: 17px;
      }

      .equation-board {
        min-height: 100px;
        padding: 15px 10px;
      }

      .question-text {
        font-size: 22px;
        gap: 8px;
      }

      .answer-input {
        width: 90px;
        min-height: 48px;
        font-size: 18px;
      }

      .property-options {
        grid-template-columns: 1fr;
      }

      .property-card {
        min-height: 60px;
        flex-direction: row;
        justify-content: flex-start;
        padding: 10px 16px;
        text-align: left;
      }

      .property-icon {
        width: 40px;
        text-align: center;
      }

      .property-name {
        font-size: 18px;
      }

      .property-hint {
        display: none;
      }

      .navigation {
        flex-direction: column-reverse;
        margin-top: 10px;
        padding-top: 10px;
      }

      .navigation .button {
        width: 100%;
        min-height: 48px;
        font-size: 16px;
      }

      .dialog-actions {
        flex-direction: column;
      }

      .dialog-actions .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    .popup-overlay {
      background: transparent !important;
      backdrop-filter: none !important
    }
  </style>
</head>

<body>
  <a href="../index.html" class="home-btn"><svg viewBox="0 0 16 16">
      <path d="M8 1L1 7h2v6h4V9h2v4h4V7h2L8 1z" />
    </svg> Home</a>
  <main class="app">
    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <div class="background-shape shape-three"></div>

    <section id="quizCard" class="quiz-card" aria-label="Properties of addition quiz">


      <div class="question-area">
        <div id="questionBadge" class="question-badge">
          Number Puzzle
        </div>

        <div id="answeredBadge" class="answered-badge">
          <span class="answer-tick" aria-hidden="true">✓</span>
          Answered correctly
        </div>

        <p id="instruction" class="instruction"></p>

        <div class="equation-board">
          <div id="questionText" class="question-text" aria-label="Math question"></div>
        </div>

        <section id="propertySection" class="property-section" aria-labelledby="propertyTitle">
          <h2 id="propertyTitle" class="property-title">
            Choose the property power
          </h2>

          <div id="propertyOptions" class="property-options" role="group" aria-label="Choose an addition property">
            <button class="property-card" type="button" data-property="commutative" aria-pressed="false">
              <span class="selected-check" aria-hidden="true">✓</span>
              <span class="property-icon" aria-hidden="true">↔</span>

              <span class="property-name">
                Commutative
              </span>

              <span class="property-hint">
                Switch the order
              </span>
            </button>

            <button class="property-card" type="button" data-property="identity" aria-pressed="false">
              <span class="selected-check" aria-hidden="true">✓</span>
              <span class="property-icon" aria-hidden="true">0</span>

              <span class="property-name">
                Identity
              </span>

              <span class="property-hint">
                Add zero
              </span>
            </button>

            <button class="property-card" type="button" data-property="associative" aria-pressed="false">
              <span class="selected-check" aria-hidden="true">✓</span>
              <span class="property-icon" aria-hidden="true">( )</span>

              <span class="property-name">
                Associative
              </span>

              <span class="property-hint">
                Change the grouping
              </span>
            </button>
          </div>
        </section>

        <p id="fieldMessage" class="field-message" role="alert"></p>
      </div>

      <nav class="navigation" aria-label="Quiz navigation">
        <button id="previousButton" class="button button-secondary" type="button">
          ← Previous
        </button>

        <button id="checkButton" class="button button-orange" type="button">
          Check Answer
        </button>

        <button id="nextButton" class="button button-primary" type="button" disabled>
          Next →
        </button>
      </nav>
    </section>

    <section id="menuScreen" class="menu-screen" aria-labelledby="menuTitle">
      <div class="menu-icon" aria-hidden="true">＋</div>

      <h1 id="menuTitle" class="menu-title">
        Addition Adventure
      </h1>

      <p class="menu-description">
        Solve number puzzles and discover the special powers of
        addition.
      </p>

      <button id="menuStartButton" class="button button-primary" type="button">
        Start Adventure
      </button>
    </section>
  </main>

  <script src="../js/quiz.js?v=3"></script>
  <script>
    "use strict";

    const questions = [
      {
        badge: "Switch-It Puzzle",

        instruction:
          "Complete the number sentence and choose its property power.",

        parts: [
          { type: "text", value: "6290 +" },

          {
            type: "input",
            id: "q1a",
            answer: "3074",
            label: "First missing number"
          },

          { type: "text", value: "= 3074 +" },

          {
            type: "input",
            id: "q1b",
            answer: "6290",
            label: "Second missing number"
          },

          { type: "text", value: "=" },

          {
            type: "input",
            id: "q1c",
            answer: "9364",
            label: "Total"
          }
        ],

        propertyRequired: true,
        propertyAnswer: "commutative"
      },

      {
        badge: "Zero-Hero Puzzle",

        instruction:
          "Find the number that keeps the total unchanged, then choose its property power.",

        parts: [
          {
            type: "input",
            id: "q2a",
            answer: "0",
            label: "Missing number"
          },

          { type: "text", value: "+ 9999 = 9999" }
        ],

        propertyRequired: true,
        propertyAnswer: "identity"
      },

      {
        badge: "Grouping Puzzle",

        instruction:
          "Complete both groups and choose the matching property power.",

        parts: [
          { type: "text", value: "1000 + (100 +" },

          {
            type: "input",
            id: "q3a",
            answer: "99",
            label: "First missing number"
          },

          { type: "text", value: ") = (" },

          {
            type: "input",
            id: "q3b",
            answer: "1000",
            label: "Second missing number"
          },

          { type: "text", value: "+" },

          {
            type: "input",
            id: "q3c",
            answer: "100",
            label: "Third missing number"
          },

          { type: "text", value: ") + 99" }
        ],

        propertyRequired: true,
        propertyAnswer: "associative"
      },

      {
        badge: "Final Number Puzzle",

        instruction:
          "Find the missing number to finish the addition sentence.",

        parts: [
          { type: "text", value: "1 +" },

          {
            type: "input",
            id: "q4a",
            answer: "3420",
            label: "Missing number"
          },

          { type: "text", value: "= 3421" }
        ],

        propertyRequired: false,
        propertyAnswer: null
      }
    ];

    let currentQuestionIndex = 0;
    let questionStates = createInitialStates();

    const quizCard = document.getElementById("quizCard");
    const menuScreen = document.getElementById("menuScreen");
    const questionBadge = document.getElementById("questionBadge");
    const answeredBadge = document.getElementById("answeredBadge");
    const instruction = document.getElementById("instruction");
    const questionText = document.getElementById("questionText");

    const propertySection =
      document.getElementById("propertySection");

    const propertyCards = Array.from(
      document.querySelectorAll(".property-card")
    );

    const fieldMessage =
      document.getElementById("fieldMessage");

    const previousButton =
      document.getElementById("previousButton");

    const checkButton =
      document.getElementById("checkButton");

    const nextButton =
      document.getElementById("nextButton");

    const menuStartButton =
      document.getElementById("menuStartButton");

    function createInitialStates() {
      return questions.map(function (question) {
        const values = {};

        question.parts.forEach(function (part) {
          if (part.type === "input") {
            values[part.id] = "";
          }
        });

        return {
          completed: false,
          values: values,
          property: "",
          lockedFields: {},
          propertyLocked: false
        };
      });
    }

    // Returns true only when every remaining (not-yet-locked) input has a
    // value AND (if this question needs a property) a property has been
    // chosen or already locked in. This drives the Check button's
    // enabled/disabled state.
    function canCheck(question, state) {
      const allInputsFilled = question.parts.every(function (part) {
        if (part.type !== "input") {
          return true;
        }

        if (state.lockedFields[part.id]) {
          return true;
        }

        return (
          state.values[part.id] &&
          state.values[part.id].trim() !== ""
        );
      });

      const propertyOk =
        !question.propertyRequired ||
        state.propertyLocked ||
        !!state.property;

      return allInputsFilled && propertyOk;
    }

    function updateCheckButtonState() {
      const question = questions[currentQuestionIndex];
      const state = questionStates[currentQuestionIndex];

      checkButton.disabled =
        state.completed || !canCheck(question, state);
    }

    function renderQuestion() {
      const question = questions[currentQuestionIndex];
      const state = questionStates[currentQuestionIndex];

      questionBadge.textContent = question.badge;
      instruction.textContent = question.instruction;

      answeredBadge.classList.toggle(
        "visible",
        state.completed
      );

      questionText.innerHTML = "";
      fieldMessage.textContent = "";

      question.parts.forEach(function (part) {
        if (part.type === "text") {
          const textElement = document.createElement("span");

          textElement.className = "equation-part";
          textElement.textContent = part.value;

          questionText.appendChild(textElement);
          return;
        }

        const input = document.createElement("input");

        input.type = "text";
        input.inputMode = "numeric";
        input.autocomplete = "off";
        input.className = "answer-input";
        input.id = part.id;
        input.setAttribute("aria-label", part.label);

        input.value = state.values[part.id] || "";

        if (state.lockedFields[part.id]) {
          input.readOnly = true;
          input.setAttribute("aria-readonly", "true");
        } else {
          input.addEventListener("input", function (event) {
            event.target.value =
              event.target.value.replace(/[^0-9]/g, "");

            state.values[part.id] = event.target.value;

            event.target.classList.remove("is-wrong");
            event.target.removeAttribute("aria-invalid");

            fieldMessage.textContent = "";

            updateCheckButtonState();
          });
        }

        questionText.appendChild(input);
      });

      renderPropertyCards(question, state);

      previousButton.disabled = currentQuestionIndex === 0;

      checkButton.disabled =
        state.completed || !canCheck(question, state);

      nextButton.disabled = !state.completed;

      setTimeout(function () {
        if (!state.completed) {
          const firstInput =
            questionText.querySelector(".answer-input:not([readonly])");

          if (firstInput) {
            firstInput.focus();
          }
        }
      }, 50);
    }

    function renderPropertyCards(question, state) {
      if (!question.propertyRequired) {
        propertySection.style.display = "none";
        return;
      }

      propertySection.style.display = "block";

      propertyCards.forEach(function (card) {
        const property = card.dataset.property;
        const isSelected = state.property === property;

        card.classList.remove(
          "selected",
          "wrong",
          "locked"
        );

        card.disabled = false;
        card.setAttribute(
          "aria-pressed",
          String(isSelected)
        );

        if (state.propertyLocked) {
          card.disabled = true;

          if (property === question.propertyAnswer) {
            card.classList.add("locked");
          }
        } else if (isSelected) {
          card.classList.add("selected");
        }
      });
    }

    propertyCards.forEach(function (card) {
      card.addEventListener("click", function () {
        const state = questionStates[currentQuestionIndex];

        if (state.completed || state.propertyLocked) {
          return;
        }

        state.property = card.dataset.property;

        propertyCards.forEach(function (item) {
          const selected =
            item.dataset.property === state.property;

          item.classList.toggle("selected", selected);
          item.classList.remove("wrong");

          item.setAttribute(
            "aria-pressed",
            String(selected)
          );
        });

        fieldMessage.textContent = "";

        updateCheckButtonState();
      });
    });

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }

    // Checks whichever fields aren't locked yet. Correct ones get locked
    // (read-only, kept). Wrong ones are cleared back to empty so the user
    // must retype them. Returns whether everything was correct this time.
    function checkRemainingFields() {
      const question = questions[currentQuestionIndex];
      const state = questionStates[currentQuestionIndex];

      let allCorrect = true;
      let firstWrongControl = null;

      question.parts.forEach(function (part) {
        if (part.type !== "input") {
          return;
        }

        if (state.lockedFields[part.id]) {
          return;
        }

        const input = document.getElementById(part.id);

        const answerIsCorrect =
          normalize(state.values[part.id]) ===
          normalize(part.answer);

        if (answerIsCorrect) {
          state.lockedFields[part.id] = true;

          input.readOnly = true;
          input.setAttribute("aria-readonly", "true");
          input.classList.remove("is-wrong");
          input.removeAttribute("aria-invalid");
        } else {
          allCorrect = false;

          state.values[part.id] = "";
          input.value = "";
          input.classList.remove("is-wrong");
          input.removeAttribute("aria-invalid");

          if (!firstWrongControl) {
            firstWrongControl = input;
          }
        }
      });

      if (question.propertyRequired && !state.propertyLocked) {
        const propertyIsCorrect =
          state.property === question.propertyAnswer;

        if (propertyIsCorrect) {
          state.propertyLocked = true;
        } else {
          allCorrect = false;
          state.property = "";

          if (!firstWrongControl) {
            firstWrongControl = propertyCards[0];
          }
        }
      }

      renderPropertyCards(question, state);

      return {
        isCorrect: allCorrect,
        firstWrongControl: firstWrongControl
      };
    }

    function handleCheck() {
      const state = questionStates[currentQuestionIndex];

      const result = checkRemainingFields();

      if (!result.isCorrect) {
        fieldMessage.textContent =
          "Almost there! The correct ones are locked in — fill the empty boxes and try again.";

        showWrongPopup(result.firstWrongControl);
        updateCheckButtonState();
        return;
      }

      state.completed = true;

      showCorrectPopup();
    }

    function handleNext() {
      const state = questionStates[currentQuestionIndex];

      if (!state.completed) {
        return;
      }

      if (currentQuestionIndex === questions.length - 1) {
        showFinalPopup();
        return;
      }

      currentQuestionIndex += 1;
      renderQuestion();
    }

    function showCorrectPopup() {
      Quiz2.showPopout(
        "correct",
        "You solved the number puzzle correctly.",
        function () {
          // Last question → the adventure is done, show the final
          // popup automatically.
          if (currentQuestionIndex === questions.length - 1) {
            showFinalPopup();
            return;
          }

          // Any other question → stay here, the user moves on using
          // the Next button themselves.
          renderQuestion();
        }
      );
    }


    function showWrongPopup(firstWrongControl) {
      Quiz2.showPopout("wrong", "Check the highlighted answer and give it another try.", function () {
        setTimeout(function () {
          if (firstWrongControl) {
            firstWrongControl.focus();
          }
        }, 50);
      });
    }

    function showFinalPopup() {
      var starCount = 3;
      var starStr = Array(starCount + 1).join("\u2605") + Array(4 - starCount).join("\u2606");
      Quiz2.showCongrats(questions.length, questions.length, starStr, function () {
        currentQuestionIndex = 0;
        questionStates = createInitialStates();
        menuScreen.classList.remove("visible");
        quizCard.style.display = "flex";
        renderQuestion();
      });
    }

    previousButton.addEventListener("click", function () {
      if (currentQuestionIndex === 0) {
        return;
      }

      currentQuestionIndex -= 1;
      renderQuestion();
    });

    checkButton.addEventListener("click", handleCheck);

    nextButton.addEventListener("click", handleNext);

    menuStartButton.addEventListener("click", function () {
      menuScreen.classList.remove("visible");
      quizCard.style.display = "flex";
      currentQuestionIndex = 0;
      questionStates = createInitialStates();
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>

</html>
