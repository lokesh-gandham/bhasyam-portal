<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtraction Fill in the Blanks</title>
  <link rel="stylesheet" href="../css/quiz.css?v=5">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap");

    :root {
      --ink: #27253a;
      --purple: #6c59e8;
      --purple-dark: #4938b1;
      --coral: #ff825c;
      --coral-dark: #d95d39;
      --green: #15956f;
      --green-dark: #087354;
      --red: #c83d4f;
      --red-dark: #98263d
    }

    * {
      box-sizing: border-box;
      font-family: "Livvic", sans-serif;
      margin: 0;
      padding: 0
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden
    }

    body {
      color: var(--ink);
      background: radial-gradient(circle at 12% 15%, rgba(255, 216, 92, .55), transparent 26%), radial-gradient(circle at 88% 18%, rgba(255, 95, 145, .17), transparent 24%), radial-gradient(circle at 80% 88%, rgba(66, 200, 193, .25), transparent 28%), linear-gradient(135deg, #fff8e8 0%, #f7f5ff 52%, #eefdff 100%);
      background-attachment: fixed
    }

    .home-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 40;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 12px;
      border: 2px solid var(--purple);
      background: linear-gradient(145deg, #8a78ff, var(--purple));
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      box-shadow: 0 4px 0 var(--purple-dark), 0 6px 14px rgba(108, 89, 232, .25);
      transition: transform .15s ease, box-shadow .15s ease;
      font-family: inherit
    }

    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--purple-dark), 0 10px 18px rgba(108, 89, 232, .3)
    }

    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--purple-dark), 0 3px 6px rgba(108, 89, 232, .2)
    }

    .home-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor
    }

    .app {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    .app:before,
    .app:after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 45% 55% 60% 40%;
      pointer-events: none
    }

    .app:before {
      width: 220px;
      height: 220px;
      left: -70px;
      bottom: -70px;
      background: linear-gradient(145deg, rgba(255, 130, 92, .32), rgba(255, 216, 92, .25));
      transform: rotate(18deg)
    }

    .app:after {
      width: 250px;
      height: 250px;
      right: -90px;
      top: -80px;
      background: linear-gradient(145deg, rgba(138, 120, 255, .26), rgba(66, 200, 193, .18));
      transform: rotate(-24deg)
    }

    .card {
      position: relative;
      width: min(94vw, 900px);
      padding: 40px 60px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: 3px solid #ece6d8;
      border-radius: 34px;
      box-shadow: 0 23px 0 rgba(101, 87, 217, 0.08), 0 28px 65px rgba(55, 49, 91, 0.16)
    }

    .header {
      text-align: center;
      margin-bottom: 24px
    }

    .title {
      margin: 0;
      font-size: 30px;
      font-weight: 400;
      letter-spacing: -.45px
    }

    .helper {
      margin: 10px 0 0;
      color: #514d73;
      font-size: 24px;
      font-weight: 400
    }

    .stage {
      width: 100%;
      height: 320px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .bubble {
      position: absolute;
      width: 100%;
      text-align: center;
      border-radius: 40px;
      opacity: 0;
      transform: scale(0.7) rotate(-5deg);
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 50px
    }

    .bubble.active {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      pointer-events: auto
    }

    .bubble-1 {
      background: linear-gradient(145deg, #fff4d4, #ffe485);
      border: 5px solid #e3bd3d;
      box-shadow: 0 12px 0 #c9a735, 0 25px 50px rgba(210, 170, 60, 0.35), inset 0 -5px 15px rgba(0, 0, 0, 0.05)
    }

    .bubble-2 {
      background: linear-gradient(145deg, #ffe4f0, #ffb8d9);
      border: 5px solid #ff5f91;
      box-shadow: 0 12px 0 #d94577, 0 25px 50px rgba(255, 95, 145, 0.35), inset 0 -5px 15px rgba(0, 0, 0, 0.05)
    }

    .bubble-3 {
      background: linear-gradient(145deg, #d4f9f7, #9aeeea);
      border: 5px solid #42c8c1;
      box-shadow: 0 12px 0 #2ea59e, 0 25px 50px rgba(66, 200, 193, 0.35), inset 0 -5px 15px rgba(0, 0, 0, 0.05)
    }

    .bubble-4 {
      background: linear-gradient(145deg, #e4dcff, #bba8ff);
      border: 5px solid var(--purple);
      box-shadow: 0 12px 0 var(--purple-dark), 0 25px 50px rgba(108, 89, 232, 0.35), inset 0 -5px 15px rgba(0, 0, 0, 0.05)
    }

    .bubble-5 {
      background: linear-gradient(145deg, #ffe8df, #ffb89f);
      border: 5px solid var(--coral);
      box-shadow: 0 12px 0 var(--coral-dark), 0 25px 50px rgba(255, 130, 92, 0.35), inset 0 -5px 15px rgba(0, 0, 0, 0.05)
    }

    .equation {
      font-size: 60px;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.2;
      text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.8);
      margin-bottom: 20px
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 20px;
      justify-content: center
    }

    .answer-input {
      width: 170px;
      height: 76px;
      border: 4px solid var(--coral);
      border-radius: 16px;
      background: linear-gradient(145deg, #fffaf5, #ffe3d1);
      text-align: center;
      font-size: 44px;
      font-weight: 400;
      color: var(--ink);
      outline: none;
      box-shadow: 0 8px 0 var(--coral-dark), inset 0 3px 8px rgba(255, 255, 255, 0.9), 0 0 0 3px rgba(255, 130, 92, 0.15);
      transition: 0.2s ease
    }

    .answer-input::placeholder {
      color: #9a8c6e;
      font-size: 48px;
      font-weight: 400;
      opacity: 0.7
    }

    .answer-input:focus {
      transform: translateY(-3px);
      border-color: var(--purple);
      box-shadow: 0 11px 0 var(--purple-dark), 0 0 0 6px rgba(108, 89, 232, 0.18), 0 0 20px rgba(108, 89, 232, 0.12)
    }

    .answer-input.correct {
      background: linear-gradient(145deg, #f5fffb, #cef4e4);
      border-color: var(--green);
      box-shadow: 0 8px 0 var(--green-dark), 0 0 0 3px rgba(21, 149, 111, 0.15)
    }

    .answer-input.wrong {
      background: linear-gradient(145deg, #fff, #ffdce6);
      border-color: var(--red);
      box-shadow: 0 8px 0 var(--red-dark), 0 0 0 3px rgba(200, 61, 79, 0.15);
      animation: shake 0.4s ease
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0)
      }

      20% {
        transform: translateX(-8px)
      }

      40% {
        transform: translateX(8px)
      }

      60% {
        transform: translateX(-5px)
      }

      80% {
        transform: translateX(5px)
      }
    }

    .check-btn {
      min-width: 160px;
      height: 76px;
      border-radius: 16px;
      border: none;
      font-size: 22px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s ease;
      background: linear-gradient(145deg, var(--green), var(--green-dark));
      color: #fff;
      box-shadow: 0 6px 0 #087354, 0 0 0 3px rgba(21, 149, 111, 0.15)
    }

    .check-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 0 #087354, 0 0 0 3px rgba(21, 149, 111, 0.15)
    }

    .check-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #087354
    }

    .check-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none
    }

    .dots {
      display: flex;
      gap: 14px;
      margin-top: 16px;
      justify-content: center
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ddd;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.3s ease
    }

    .dot.active {
      background: var(--purple);
      border-color: var(--purple-dark);
      transform: scale(1.3)
    }

    .dot.locked {
      background: #ccc;
      cursor: not-allowed
    }

    .dot.completed {
      background: var(--green);
      border-color: var(--green-dark)
    }

    .dot:hover:not(.locked) {
      transform: scale(1.2)
    }

    .nav {
      width: min(100%, 940px);
      margin: 15px auto 0;
      padding-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border-top: 2px dashed #dcd6c8;
      flex-wrap: wrap;
    }

    .btn {
      border-radius: 16px;
      min-width: 140px;
      min-height: 50px;
      padding: 10px 22px;
      font-size: 17px;
      font-weight: 400;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-3px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: none;
    }

    .btn:disabled {
      color: var(--ink);
      background: #ffffff;
      border: 3px dashed #6d6975;
      box-shadow: none;
      cursor: not-allowed;
    }

    .primary {
      color: #ffffff;
      background: var(--green);
      border: 3px solid var(--green);
      box-shadow: 0 7px 0 var(--green-dark);
    }

    .primary:hover:not(:disabled) {
      background: var(--green-dark);
    }

    .secondary {
      color: var(--ink);
      background: #ffffff;
      border: 3px solid var(--ink);
      box-shadow: 0 7px 0 #d9d5cd;
    }

    @media(min-width:1440px) {
      .helper {
        font-size: 30px
      }

      .card {
        width: min(94vw, 1000px);
        padding: 48px 70px 36px
      }

      .stage {
        height: 360px
      }

      .equation {
        font-size: 72px
      }

      .answer-input {
        width: 200px;
        height: 88px;
        font-size: 52px
      }

      .check-btn {
        min-width: 180px;
        height: 88px;
        font-size: 26px
      }

      .btn {
        min-width: 170px;
        height: 60px
      }
    }

    /* the heading reads at the site scale: 30px laptop, 40px monitor */
    @media(min-width:1600px) {
      .title {
        font-size: 40px
      }
    }

    @media(max-width:820px) {

      html,
      body {
        height: auto;
        overflow: auto
      }

      .app {
        height: auto;
        min-height: 100vh;
        padding: 16px 10px
      }

      .card {
        padding: 24px 20px 20px;
        width: 100%
      }

      .stage {
        height: auto;
        min-height: 240px
      }

      .equation {
        font-size: 42px
      }

      .input-row {
        gap: 12px
      }

      .answer-input {
        width: 120px;
        height: 58px;
        font-size: 32px
      }

      .check-btn {
        min-width: 110px;
        height: 58px;
        font-size: 18px
      }

      .btn {
        min-width: 50px
      }
    }

    @media(max-width:520px) {
      .equation {
        font-size: 34px
      }

      .input-row {
        gap: 10px
      }

      .answer-input {
        width: min(30vw, 110px);
        height: 52px;
        font-size: 28px
      }

      .check-btn {
        min-width: 90px;
        height: 52px;
        font-size: 16px
      }

      .nav {
        flex-direction: column-reverse;
        gap: 10px
      }

      .btn {
        width: 100%;
        min-height: 44px;
        border-radius: 12px
      }
    }

    /* ---- SHORT WINDOWS ----
   Everything above is fixed px, so the card is a constant height and is
   centred inside .app{height:100vh} while html,body clip. A 1366x768 laptop
   leaves only ~600-660 CSS px once browser chrome and the taskbar are gone,
   so the bottom of the card was being cut off.

   The fix takes the height out of WHITESPACE, not out of the artwork: the
   yellow bubble, the equation, the answer box, the Check button and the
   heading all keep their full size. .stage is only a spacer -- the bubble is
   position:absolute and is ~258px tall -- so most of its 320px was empty
   room that can go without touching anything you can see. */
    @media(max-height:720px) {
      .card {
        padding: 24px 60px 20px
      }

      .header {
        margin-bottom: 14px
      }

      .stage {
        height: 285px
      }

      .dots {
        margin-top: 10px
      }

      .nav {
        margin-top: 12px
      }
    }

    /* Below this the card genuinely cannot fit at full size, so start scaling
   the type down rather than clipping the buttons off the screen. */
    @media(max-height:575px) {
      .card {
        padding: 16px 36px 14px
      }

      .header {
        margin-bottom: 10px
      }

      .title {
        font-size: 28px
      }

      .helper {
        font-size: 18px
      }

      .stage {
        height: 210px
      }

      .bubble {
        padding: 20px 30px
      }

      .equation {
        font-size: 40px;
        margin-bottom: 12px
      }

      .answer-input {
        width: 130px;
        height: 56px;
        font-size: 32px
      }

      .answer-input::placeholder {
        font-size: 34px
      }

      .check-btn {
        min-width: 130px;
        height: 56px;
        font-size: 18px
      }

      .dots {
        margin-top: 8px
      }

      .dot {
        width: 12px;
        height: 12px
      }

      .nav {
        margin-top: 10px
      }

      .btn {
        height: 44px;
        font-size: 16px;
        min-width: 130px
      }
    }

    /* Last resort: let the page scroll rather than clip the buttons out of reach. */
    @media(max-height:450px) {

      html,
      body {
        height: auto;
        overflow: auto
      }

      .app {
        height: auto;
        min-height: 100vh
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }

    .popup-overlay {
      background: transparent !important;
      backdrop-filter: none !important
    }
  </style>
</head>

<body>
  <a href="../index.html" class="home-btn"><svg viewBox="0 0 16 16">
      <path d="M8 1L1 7h2v6h4V9h2v4h4V7h2L8 1z" />
    </svg> Home</a>
  <main class="app">
    <div class="card">
      <header class="header">
        <h1 class="title">Fill in the box</h1>
        <p class="helper">Find the missing number that makes the subtraction sentence true.</p>
      </header>
      <section class="stage" id="stage"></section>
      <div class="dots" id="dots"></div>
      <nav class="nav" aria-label="Question navigation">
        <button id="previous" class="btn secondary" type="button" disabled>← Previous</button>
        <button id="action" class="btn primary" type="button" disabled>Next →</button>
      </nav>
    </div>
  </main>
  <script src="../js/quiz.js?v=3"></script>
  <script>
    "use strict";
    var questions = [
      { before: "496 − 496 = ", after: "?", answer: "0" },
      { before: "?", after: " − 1 = 3000", answer: "3001" },
      { before: "7549 − ", after: "? = 0", answer: "7549" },
      { before: "?", after: " − 0 = 5320", answer: "5320" },
      { before: "654 − ", after: "? = 653", answer: "1" }
    ];
    var current = 0; var states = questions.map(function () { return { value: "", completed: false, submitted: "" } });
    var stage = document.getElementById("stage"), previous = document.getElementById("previous"), action = document.getElementById("action"), dotsContainer = document.getElementById("dots");

    questions.forEach(function (_, i) {
      var dot = document.createElement("button");
      dot.className = "dot" + (i === 0 ? " active" : " locked");
      dot.setAttribute("data-index", i);
      dot.onclick = function () { if (states[i].completed || i <= current) { current = i; render() } };
      dotsContainer.appendChild(dot);
    });

    function render() {
      stage.innerHTML = "";
      var q = questions[current], s = states[current];
      var bubble = document.createElement("div");
      bubble.className = "bubble bubble-" + (current + 1) + " active";

      var eq = document.createElement("div");
      eq.className = "equation";
      eq.textContent = (q.before ? q.before : "") + (q.after ? q.after : "");
      bubble.appendChild(eq);

      var inputRow = document.createElement("div");
      inputRow.className = "input-row";

      var input = document.createElement("input");
      input.className = "answer-input" + (s.completed ? " correct" : "");
      input.type = "text"; input.inputMode = "numeric"; input.autocomplete = "off";
      input.value = s.completed ? s.submitted : s.value;
      input.readOnly = s.completed;
      input.setAttribute("aria-label", "Missing number");
      input.placeholder = "?"; input.maxLength = 6;
      input.oninput = function (e) { e.target.value = e.target.value.replace(/[^0-9]/g, ""); s.value = e.target.value; e.target.classList.remove("wrong") };
      input.onkeydown = function (e) { if (e.key === "Enter") check() };
      inputRow.appendChild(input);

      var btn = document.createElement("button");
      btn.className = "check-btn";
      btn.textContent = "Check";
      btn.disabled = s.completed;
      btn.onclick = check;
      inputRow.appendChild(btn);

      bubble.appendChild(inputRow);
      stage.appendChild(bubble);

      var dots = dotsContainer.querySelectorAll(".dot");
      dots.forEach(function (d, i) {
        d.className = "dot";
        if (i === current) d.className += " active";
        else if (states[i].completed) d.className += " completed";
        else if (i > current && !states[i].completed) d.className += " locked";
      });

      previous.disabled = current === 0;
      action.disabled = !s.completed || current === questions.length - 1;

      setTimeout(function () { if (!s.completed) input.focus() }, 300);
    }

    function check() {
      var q = questions[current], s = states[current], input = stage.querySelector(".answer-input");
      if (s.completed) return;
      if (!input || !input.value.trim()) {
        if (input) { input.classList.add("wrong"); setTimeout(function () { input.classList.remove("wrong") }, 400) }
        return;
      }
      if (input.value.trim() !== q.answer) {
        input.classList.add("wrong"); setTimeout(function () { input.classList.remove("wrong") }, 400);
        Quiz2.showPopout("wrong", "That number does not complete the subtraction sentence. Try again.",input.value = "", function () { input.focus();});
        return;
      }
      s.completed = true; s.submitted = input.value.trim(); input.classList.add("correct"); input.readOnly = true;
      var checkBtn = stage.querySelector(".check-btn");
      if (checkBtn) checkBtn.disabled = true;
      if (current === questions.length - 1) {
        var starCount = 3;
        var starStr =
          Array(starCount + 1).join("\u2605") +
          Array(4 - starCount).join("\u2606");

        Quiz2.showPopout(
          "correct",
          "Well done! You found the missing number.",
          function () {
            Quiz2.showCongrats(
              questions.length,
              questions.length,
              starStr,
              function () {
                current = 0;
                states = questions.map(function () {
                  return {
                    value: "",
                    completed: false,
                    submitted: ""
                  };
                });

                var dots = dotsContainer.querySelectorAll(".dot");

                dots.forEach(function (d, i) {
                  d.className =
                    "dot" + (i === 0 ? " active" : " locked");
                });

                render();
              }
            );
          }
        );

        return;

      } else {
        Quiz2.showPopout("correct", "Well done! You found the missing number.", function () { render() });
      }
    }

    previous.onclick = function () { if (current > 0) { current--; render() } };
    action.onclick = function () { if (!action.disabled && states[current].completed && current < questions.length - 1) { current++; render() } };
    render();
  </script>
</body>

</html>
