<script>
var ITEMS = [
  { a:599,   b:10,   q:59,  r:9   },
  { a:4009,  b:100,  q:40,  r:9   },
  { a:47008, b:1000, q:47,  r:8   },
  { a:6890,  b:1000, q:6,   r:890 },
  { a:70600, b:100,  q:706, r:0   }
];

Quiz.mount({

  title:'Divide by 10, 100 and 1000',

  questions: ITEMS.map(function(it){

    return {

      stem:
        'Divide ' +
        it.a +
        ' by ' +
        it.b +
        '. Identify the quotient and remainder.',

      praise:
        it.a +
        ' ÷ ' +
        it.b +
        ' gives Quotient = ' +
        it.q +
        ' and Remainder = ' +
        it.r +
        '.',

      build:function(host,Q){

        host.appendChild(
          Q.sentence([
            String(it.a),
            '÷',
            String(it.b)
          ])
        );

        var ansRow = Q.el(
          'div',
          'answer-row'
        );

        ansRow.appendChild(
          Q.labelled(
            'Quotient',
            Q.blank(
              it.q,
              {
                width:5,
                label:'quotient'
              }
            )
          )
        );

        ansRow.appendChild(
          Q.labelled(
            'Remainder',
            Q.blank(
              it.r,
              {
                width:5,
                label:'remainder'
              }
            )
          )
        );

        host.appendChild(ansRow);
      }
    };
  })
});

/*
  IMPORTANT:
  When the learner gives one correct answer and one wrong answer:
  - the correct field stays filled
  - the correct field stays green
  - ONLY the wrong field is cleared
  - the learner can immediately type the wrong answer again

  This hooks into the existing quiz.js Check button without replacing
  the main quiz engine.
*/
(function setupPartialRetry() {

  function normal(v) {
    return String(v == null ? '' : v)
      .trim()
      .replace(/,/g, '')
      .replace(/\s+/g, '')
      .toLowerCase();
  }

  function getFields() {
    return Array.prototype.filter.call(
      document.querySelectorAll('.board *'),
      function(n) {
        return n && n._f &&
          typeof n._f.correct === 'function' &&
          typeof n._f.value === 'function';
      }
    ).filter(function(n) {
      return !n.parentNode || !n.parentNode._f;
    });
  }

  function findCheckButton() {
    var buttons = document.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      if (String(buttons[i].textContent).trim().toLowerCase() === 'check answer') {
        return buttons[i];
      }
    }
    return null;
  }

  function highlightCorrectFields(fields) {
    fields.forEach(function(field) {
      if (field._f.correct()) {
        field._f.mark('good');
      }
    });
  }

  function processAfterCheck() {
    var fields = getFields();
    if (!fields.length) return;

    var wrong = [];

    fields.forEach(function(field) {
      if (field._f.correct()) {
        // Keep the correct answer.
        field._f.mark('good');
      } else {
        // Keep wrong answers red until the retry popup closes.
        field._f.mark('bad');
        wrong.push(field);
      }
    });

    if (!wrong.length) return;

    /*
      Wait for the normal "Not quite yet" popup to finish, then clear
      ONLY the wrong fields. Correct fields are never cleared.
    */
    setTimeout(function() {
      wrong.forEach(function(field) {
        if (field._f.clear) {
          field._f.clear();
        } else {
          field._f.setValue('');
          field._f.mark('');
        }
      });

      // Re-apply green to the answers that were correct.
      fields.forEach(function(field) {
        if (field._f.correct()) {
          field._f.mark('good');
        }
      });

      if (wrong[0] && wrong[0]._f.focus) {
        wrong[0]._f.focus();
      }
    }, 1450);
  }

  function attach() {
    var checkBtn = findCheckButton();
    if (!checkBtn) {
      setTimeout(attach, 50);
      return;
    }

    checkBtn.addEventListener('click', function() {
      /*
        Let quiz.js perform its normal validation first.
        Then inspect the fields and preserve only the correct ones.
      */
      setTimeout(processAfterCheck, 10);
    });

    /*
      Correct typed answers are highlighted immediately.
      They remain editable; only a successful Check locks them.
    */
    var board = document.querySelector('.board');
    if (board) {
      board.addEventListener('input', function() {
        var fields = getFields();

        fields.forEach(function(field) {
          if (field._f.correct()) {
            field._f.mark('good');
          } else if (field._f.value() !== '') {
            field._f.mark('');
          }
        });
      });
    }
  }

  attach();

})();
</script>
