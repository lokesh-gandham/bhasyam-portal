<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Divide by 10, 100, 1000 · Chapter 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/quiz.css?v=13">
<style>
body.dt .board{ justify-content:safe center; gap:clamp(10px,1.6vh,16px); padding:clamp(12px,2vh,20px); }
body.dt .stem{ font-size:clamp(18px,min(2.2vw,3vh),26px); font-weight:500; color:#332a59; }

body.dt .sentence{
  font-size:clamp(28px,min(5vw,6.5vh),56px);
  gap:clamp(10px,1.6vh,20px);
  margin-top:2px;
  padding:clamp(12px,2.2vh,20px) clamp(16px,2.8vw,36px);
  background:linear-gradient(145deg,#ffffff,#f9f8ff);
  border:3.5px solid #d4ccf7;
  border-radius:24px;
  box-shadow:0 10px 0 #cfc5f8, 0 20px 36px rgba(108,92,224,.16);
}
body.dt .sentence .op{ color:var(--plum); font-weight:700; }
body.dt .blank{
  font-weight:400;
  font-size:0.95em;
  background:linear-gradient(145deg,#fffdf7,#fff3db);
  border:3px solid #ff9f43;
  color:#b45309;
  box-shadow:0 6px 0 #d97706, 0 12px 20px rgba(217,119,6,.18);
  border-radius:14px;
  transition:transform .15s ease, border-color .15s ease;
}
body.dt .blank:focus{ transform:scale(1.04); border-color:#7c3aed; outline:none; }
body.dt .art svg{ max-width:min(660px,80vw); }

/* Short windows — lower the size floors so the board's content keeps
   shrinking instead of overflowing and being cut off at the bottom.
   See the matching block in assets/quiz.css. */
@media (max-height:680px){
  body.dt .board{ gap:clamp(4px,1.6vh,16px); padding:clamp(6px,2vh,20px); }
  body.dt .stem{ font-size:clamp(13px,min(2.2vw,3vh),26px); }
  body.dt .sentence{ font-size:clamp(20px,min(5vw,6.5vh),56px); padding:clamp(6px,2.2vh,20px) clamp(12px,2.8vw,36px); }
  body.dt .board > .art{ min-height:clamp(70px,20vh,175px); }
}
</style>
</head>
<body class="dt">
<script src="../assets/quiz.js?v=13"></script>
<script>
/* Textbook page 99 · section 3.8 — quotient and remainder without actual division */

var CUT = { 10: 'last digit', 100: 'last two digits', 1000: 'last three digits' };

var ITEMS = [
  { a: 599,   b: 10,   q: 59,  r: 9   },
  { a: 4009,  b: 100,  q: 40,  r: 9   },
  { a: 47008, b: 1000, q: 47,  r: 8   },
  { a: 6890,  b: 1000, q: 6,   r: 890 },
  { a: 70600, b: 100,  q: 706, r: 0   }
];

/* Rule Concept Visualizer SVG (Explains the shortcut without revealing the answer) */
function ruleVisual(b) {
  var zeros = String(b).length - 1;
  var W = 720, H = 120;
  var svg = '';

  /* Title */
  svg += '<text x="360" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#4A4466">Division Shortcut Rule for ÷ ' + b + '</text>';

  /* Card 1: Quotient Rule (Purple 3D Card) */
  var X1 = 60, Y = 34, W1 = 260, H1 = 64;
  svg += '<rect x="' + X1 + '" y="' + Y + '" width="' + W1 + '" height="' + H1 + '" rx="16" fill="#F0EDFF" stroke="#7C3AED" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.05))"/>';
  svg += '<text x="' + (X1 + W1/2) + '" y="' + (Y + 28) + '" text-anchor="middle" font-size="18" font-weight="700" fill="#5445C4">🎯 Quotient</text>';
  svg += '<text x="' + (X1 + W1/2) + '" y="' + (Y + 50) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">Front Digits of Dividend</text>';

  /* Arrow Divider */
  svg += '<text x="360" y="' + (Y + 40) + '" text-anchor="middle" font-size="28" font-weight="700" fill="#EF9F2B">⚡</text>';

  /* Card 2: Remainder Rule (Amber 3D Card) */
  var X2 = 400, W2 = 260;
  svg += '<rect x="' + X2 + '" y="' + Y + '" width="' + W2 + '" height="' + H1 + '" rx="16" fill="#FFF4E2" stroke="#F59E0B" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.05))"/>';
  svg += '<text x="' + (X2 + W2/2) + '" y="' + (Y + 28) + '" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">🧩 Remainder</text>';
  svg += '<text x="' + (X2 + W2/2) + '" y="' + (Y + 50) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#B45309">Last ' + zeros + (zeros===1?' Digit':' Digits') + ' (' + zeros + (zeros===1?' zero':' zeros') + ' in ' + b + ')</text>';

  return svg;
}

Quiz.mount({
  title: 'Divide by 10, 100 and 1000',
  questions: ITEMS.map(function (it) {
    return {
      stem: 'Divide ' + it.a + ' by ' + it.b + '. Identify the quotient and remainder.',
      praise: it.a + ' ÷ ' + it.b + ' gives Quotient = ' + it.q + ' and Remainder = ' + it.r + '.',
      build: function (host, Q) {
        host.appendChild(Q.sentence([String(it.a), '÷', String(it.b)]));
        host.appendChild(Q.art('0 0 720 115', ruleVisual(it.b)));
        var ansRow = Q.el('div', 'answer-row');
        ansRow.appendChild(Q.labelled('Quotient',  Q.blank(it.q, { width: 5, label: 'quotient' })));
        ansRow.appendChild(Q.labelled('Remainder', Q.blank(it.r, { width: 5, label: 'remainder' })));
        host.appendChild(ansRow);
      }
    };
  })
});



</script>
</body>
</html>
