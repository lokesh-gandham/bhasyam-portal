<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Properties of Division · Chapter 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/quiz.css?v=13">
  <style>
    body.div-props .quiz {
      border-color: #CFC5F8;
      box-shadow: 0 22px 0 rgba(240, 236, 255, .6), var(--shadow-card);
    }

    body.div-props .board {
      justify-content: safe center;
      gap: clamp(12px, 2vh, 20px);
      border-color: #E2DDFB;
      padding: clamp(14px, 2.2vh, 24px);
    }

    body.div-props .stem {
      font-size: clamp(18px, min(2.2vw, 3vh), 26px);
      font-weight: 500;
      color: #332a59;
    }

    .sentence .blank {
      font-size: 0.82em;
      height: 1.55em;
      min-width: 7.5ch !important;
      padding: .12em .32em;
      border-radius: 14px;
      vertical-align: middle;
    }

    body.div-props .sentence {
      font-size: clamp(32px, min(6vw, 7.5vh), 68px);
      gap: clamp(12px, 1.8vh, 24px);
      margin-top: 4px;
      padding: clamp(16px, 2.6vh, 28px) clamp(20px, 3.5vw, 48px);
      background: linear-gradient(145deg, #ffffff, #f9f8ff);
      border: 3.5px solid #d4ccf7;
      border-radius: 26px;
      box-shadow: 0 10px 0 #cfc5f8, 0 20px 36px rgba(108, 92, 224, .16);
    }

    body.div-props .sentence .op {
      color: var(--plum);
      font-weight: 700;
    }

    body.div-props .blank {
      font-weight: 400;
      font-size: 0.95em;
      background: linear-gradient(145deg, #fffdf7, #fff3db);
      border: 3px solid #ff9f43;
      color: #b45309;
      box-shadow: 0 6px 0 #d97706, 0 12px 20px rgba(217, 119, 6, .18);
      border-radius: 14px;
      transition: transform .15s ease, border-color .15s ease;
    }

    body.div-props .blank:focus {
      transform: scale(1.04);
      border-color: #7c3aed;
      outline: none;
    }

    body.div-props .pick-label {
      font-size: clamp(16px, 2.2vh, 20px);
      font-weight: 600;
      color: #4a4466;
      margin-top: clamp(4px, 1vh, 10px);
    }

    body.div-props .choices {
      gap: clamp(10px, 1.4vh, 16px);
    }

    body.div-props .pick {
      font-size: clamp(17px, min(2vw, 2.8vh), 22px);
      font-weight: 400;
      padding: clamp(12px, 2vh, 17px) clamp(18px, 2.4vw, 32px);
      border-radius: 999px;
      border-width: 3px;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    body.div-props .pick:hover {
      transform: translateY(-2px);
    }

    body.div-props .pick {
      background: #F7F5FF;
      border-color: #D4CCF7;
      color: #4a4466;
      box-shadow: 0 6px 0 #CFC5F8;
    }

    body.div-props .pick.on {
      background: var(--plum);
      border-color: var(--plum-dark);
      color: #fff;
      box-shadow: 0 6px 0 var(--plum-dark);
    }

    body.div-props .pick.good {
      background: #d1fae5;
      border-color: #10b981;
      color: #065f46;
      box-shadow: 0 6px 0 #059669;
    }

    body.div-props .pick.bad {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
      box-shadow: 0 6px 0 #dc2626;
    }

    /* Short windows — lower the size floors so the answer pills keep shrinking
   instead of overflowing the board. See assets/quiz.css. */
    @media (max-height:680px) {
      body.div-props .board {
        gap: clamp(5px, 2vh, 20px);
        padding: clamp(6px, 2.2vh, 24px);
      }

      body.div-props .stem {
        font-size: clamp(13px, min(2.2vw, 3vh), 26px);
      }

      body.div-props .sentence {
        font-size: clamp(22px, min(6vw, 7.5vh), 68px);
        padding: clamp(7px, 2.6vh, 28px) clamp(14px, 3.5vw, 48px);
      }

      body.div-props .pick-label {
        font-size: clamp(12px, 2.2vh, 20px);
        margin-top: clamp(2px, 1vh, 10px);
      }

      body.div-props .pick {
        font-size: clamp(12px, min(2vw, 2.8vh), 22px);
        padding: clamp(6px, 2vh, 17px) clamp(11px, 2.4vw, 32px);
      }
    }
  </style>
</head>

<body class="div-props">
  <script src="../assets/quiz.js?v=13"></script>
  <script>
    /* Textbook page 97 · section 3.7 — Properties of Division */

    var RULES = [
      'A number ÷ itself',
      'Division by 1',
      'Zero divided by a number',
      'Division by zero'
    ];

    var ITEMS = [
      {
        parts: [['36'], '÷', '36', '=', '1'], rule: 'A number ÷ itself',
        why: 'Any number shared into groups of its own size makes exactly 1 group.'
      },

      {
        parts: ['50', '÷', ['1'], '=', '50'], rule: 'Division by 1',
        why: 'Dividing by 1 leaves the number untouched.'
      },

      {
        parts: [['0'], '÷', '9', '=', '0'], rule: 'Zero divided by a number',
        why: 'Nothing shared between 9 friends is still nothing for each.'
      },

      {
        parts: ['176', '÷', ['176'], '=', '1'], rule: 'A number ÷ itself',
        why: '176 ÷ 176 = 1, just like 56 ÷ 56 = 1.'
      },

      {
        parts: [['356'], '÷', '1', '=', '356'], rule: 'Division by 1',
        why: 'The quotient is the number itself when you divide by 1.'
      }
    ];

    var questions = ITEMS.map(function (item) {
      return {
        stem: 'Fill the box, then choose the rule that explains it.',
        praise: item.why,
        build: function (host, Q) {
          host.appendChild(Q.sentence(item.parts.map(function (p) {
            if (Array.isArray(p)) return Q.blank(p[0], { width: p[0].length + 1, label: 'missing number' });
            return p;
          })));
          host.appendChild(Q.choice(RULES, item.rule, { label: 'Which rule is this?' }));
        }
      };
    });

    Quiz.mount({
      title: 'Properties of Division',
      questions: questions
    });
  </script>
</body>

</html>
