<body class="div-props">
  <script src="../assets/quiz.js?v=13"></script>
  <script>
    /* Textbook page 97 · section 3.7 — Properties of Division */

    var RULES = [
      'A number ÷ itself',
      'Division by 1',
      'Zero divided by a number',
      'Division by zero'
    ];

    var ITEMS = [
      {
        parts: [['36'], '÷', '36', '=', '1'],
        rule: 'A number ÷ itself',
        why: 'Any number shared into groups of its own size makes exactly 1 group.'
      },
      {
        parts: ['50', '÷', ['1'], '=', '50'],
        rule: 'Division by 1',
        why: 'Dividing by 1 leaves the number untouched.'
      },
      {
        parts: [['0'], '÷', '9', '=', '0'],
        rule: 'Zero divided by a number',
        why: 'Nothing shared between 9 friends is still nothing for each.'
      },
      {
        parts: ['176', '÷', ['176'], '=', '1'],
        rule: 'A number ÷ itself',
        why: '176 ÷ 176 = 1, just like 56 ÷ 56 = 1.'
      },
      {
        parts: [['356'], '÷', '1', '=', '356'],
        rule: 'Division by 1',
        why: 'The quotient is the number itself when you divide by 1.'
      }
    ];

    /*
      Page-local choice control.

      This is intentionally defined AFTER quiz.js so it replaces the
      base choice control only on this page.

      Behaviour:
      - click correct rule  -> green immediately
      - click wrong rule    -> selected state
      - Check wrong answer  -> red, then clear
      - Check correct answer -> green and lock
    */
    Quiz.choice = function (options, answer, opts) {
      opts = opts || {};

      var wrap = Quiz.el('div', 'choices');
      var chosen = null;
      var buttons = [];

      function normal(v) {
        return String(v == null ? '' : v)
          .trim()
          .replace(/\s+/g, ' ')
          .toLowerCase();
      }

      options.forEach(function (label) {
        var b = Quiz.el('button', 'pick', label);
        b.type = 'button';
        buttons.push(b);
        wrap.appendChild(b);
      });

      function clearClasses() {
        buttons.forEach(function (b) {
          b.classList.remove('on', 'good', 'bad');
        });
      }

      function showSelection() {
        clearClasses();

        if (chosen === null || chosen === '') return;

        buttons.forEach(function (b) {
          if (normal(b.textContent) === normal(chosen)) {
            if (normal(chosen) === normal(answer)) {
              b.classList.add('good');
            } else {
              b.classList.add('on');
            }
          }
        });
      }

      wrap._f = {
        el: wrap,

        filled: function () {
          return chosen !== null && chosen !== '';
        },

        correct: function () {
          return normal(chosen) !== '' &&
            normal(chosen) === normal(answer);
        },

        mark: function (state) {
          clearClasses();

          buttons.forEach(function (b) {
            var text = normal(b.textContent);

            if (state === 'good' && text === normal(answer)) {
              b.classList.add('good');
            } else if (state === 'bad' && text === normal(chosen)) {
              b.classList.add('bad');
            }
          });
        },

        lock: function () {
          buttons.forEach(function (b) {
            b.disabled = true;
          });
        },

        reveal: function () {
          chosen = String(answer || '').trim();
          clearClasses();

          buttons.forEach(function (b) {
            if (normal(b.textContent) === normal(answer)) {
              b.classList.add('good');
            }
          });
        },

        value: function () {
          return chosen;
        },

        setValue: function (v) {
          if (v == null || String(v).trim() === '') {
            chosen = null;

            buttons.forEach(function (b) {
              b.classList.remove('on', 'good', 'bad');
              b.disabled = false;
            });

            return;
          }

          chosen = String(v).trim();
          showSelection();
        },

        clear: function () {
          chosen = null;

          buttons.forEach(function (b) {
            b.classList.remove('on', 'good', 'bad');
            b.disabled = false;
          });
        },

        focus: function () {
          if (buttons.length) buttons[0].focus();
        }
      };

      buttons.forEach(function (b) {
        b.addEventListener('click', function (e) {
          e.preventDefault();

          if (b.disabled) return;

          chosen = String(b.textContent || '').trim();

          clearClasses();

          if (normal(chosen) === normal(answer)) {
            b.classList.add('good');
          } else {
            b.classList.add('on');
          }

          Quiz._clearMsg();
        });
      });

      if (opts.label) {
        var box = Quiz.el('div');

        box.style.textAlign = 'center';
        box.appendChild(
          Quiz.el('div', 'pick-label', opts.label)
        );

        box.style.display = 'grid';
        box.style.gap = '10px';
        box.appendChild(wrap);

        box._f = wrap._f;

        return box;
      }

      return wrap;
    };

    var questions = ITEMS.map(function (item) {
      return {
        stem: 'Fill the box, then choose the rule that explains it.',
        praise: item.why,
        build: function (host, Q) {
          var sentence = Q.sentence(item.parts.map(function (p) {
            if (Array.isArray(p)) {
              return Q.blank(p[0], {
                width: p[0].length + 1,
                label: 'missing number'
              });
            }
            return p;
          }));

          host.appendChild(sentence);

          // Highlight the number answer immediately when it is correct.
          // Keep it normal while it is incomplete/wrong.
          var numberFields = sentence.querySelectorAll('.blank');

          Array.prototype.forEach.call(numberFields, function (input) {
            input.addEventListener('input', function () {
              if (!input._f) return;

              // Correct number = highlight green immediately.
              // Do NOT lock it here; the learner must still choose
              // the correct rule and may change the number if needed.
              if (input._f.correct()) {
                input._f.mark('good');
              } else {
                input._f.mark('');
              }

              // Keep the Check button in sync while the learner types.
              var board = host.closest('.board');
              if (board) {
                board.dispatchEvent(new Event('input', { bubbles: true }));
              }
            });
          });

          host.appendChild(
            Q.choice(RULES, item.rule, {
              label: 'Which rule is this?'
            })
          );
        }
      };
    });

    Quiz.mount({
      title: 'Properties of Division',
      questions: questions
    });
  </script>
</body>
