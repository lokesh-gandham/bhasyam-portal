  <script>
    /* Textbook page 87 · section 3.1 — Properties of Multiplication */

    var PROPS = ['Commutative', 'Associative', 'Identity', 'Zero'];

    var ITEMS = [
      {
        parts: ['796', '×', ['208'], '=', '208', '×', ['796']],
        prop: 'Commutative',
        why: 'Swapping the two numbers never changes the product.'
      },
      {
        parts: [['114'], '×', '1', '=', '114'],
        prop: 'Identity',
        why: '1 is the multiplicative identity — it leaves a number exactly as it was.'
      },
      {
        parts: ['543', '×', ['0'], '=', '0'],
        prop: 'Zero',
        why: 'Anything multiplied by 0 collapses to 0.'
      },
      {
        parts: ['271', '×', '(', '560', '×', ['386'], ')', '=', '(', '386', '×', ['271'], ')', '×', ['560']],
        prop: 'Associative',
        why: 'Regrouping the brackets does not change the product of three numbers.'
      },
      {
        parts: ['390', '×', ['0'], '=', '0'],
        prop: 'Zero',
        why: 'Zero again — 390 groups of nothing is still nothing.'
      },
      {
        parts: ['448', '×', ['1'], '=', '448'],
        prop: 'Identity',
        why: 'One group of 448 is 448.'
      }
    ];

    /* High-quality large crisp property reference SVG banner */
    function propertyCard() {
      var PANELS = [
        { name: 'Commutative', icon: '↔️', formula: 'a × b = b × a', bg: '#F1F8F5', line: '#CFE5DC', ink: '#52655D' },
        { name: 'Associative', icon: '🧩', formula: '(a×b)×c = a×(b×c)', bg: '#F1F8F5', line: '#CFE5DC', ink: '#52655D' },
        { name: 'Identity', icon: '1️⃣', formula: 'a × 1 = a', bg: '#F1F8F5', line: '#CFE5DC', ink: '#52655D' },
        { name: 'Zero', icon: '0️⃣', formula: 'a × 0 = 0', bg: '#F1F8F5', line: '#CFE5DC', ink: '#52655D' }
      ];
      var W = 190, H = 138, GAP = 16, Y = 10;
      var X0 = (840 - (PANELS.length * W + (PANELS.length - 1) * GAP)) / 2;
      var svg = '';

      PANELS.forEach(function (p, i) {
        var x = X0 + i * (W + GAP), cx = x + W / 2;
        svg += '<rect x="' + x + '" y="' + Y + '" width="' + W + '" height="' + H +
          '" rx="20" fill="' + p.bg + '" stroke="' + p.line + '" stroke-width="3.5" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.08))"/>';
        svg += '<text x="' + cx + '" y="' + (Y + 30) + '" text-anchor="middle" font-size="20" font-weight="700" fill="' + p.ink + '">' +
          p.name + '</text>';
        svg += '<rect x="' + (x + 12) + '" y="' + (Y + 44) + '" width="' + (W - 24) + '" height="76"' +
          ' rx="14" fill="#FFFFFF" stroke="' + p.line + '" stroke-width="2.5"/>';
        svg += '<text x="' + cx + '" y="' + (Y + 74) + '" text-anchor="middle" font-size="26">' + p.icon + '</text>';
        svg += '<text x="' + cx + '" y="' + (Y + 104) + '" text-anchor="middle" font-size="17" font-weight="700" fill="' + p.ink + '">' +
          p.formula + '</text>';
      });

      return svg;
    }

    /* ==========================================================
       Local override #1 — Quiz.choice
       Adds a _f.clear() method (reset the pill selection back to
       "nothing chosen") that the base engine doesn't expose. Needed
       so a wrong property-pill pick can be emptied out on retry,
       same as a wrong text blank. Everything else copied unchanged
       from assets/quiz.js — only affects this page, since it runs
       after quiz.js has already set the original Quiz.choice.
       ========================================================== */
   Quiz.choice = function (options, answer, opts) {
  opts = opts || {};

  var wrap = Quiz.el('div', 'choices');
  var chosen = null;
  var buttons = [];

  function normal(v) {
    return String(v == null ? '' : v)
      .trim()
      .replace(/\s+/g, ' ')
      .toLowerCase();
  }

  options.forEach(function (label) {
    var b = Quiz.el('button', 'pick', label);
    b.type = 'button';
    buttons.push(b);
    wrap.appendChild(b);
  });

  function paintSelection() {
    buttons.forEach(function (b) {
      var text = String(b.textContent || '').trim();

      b.classList.remove('on', 'good', 'bad');

      if (chosen === null || chosen === '') return;

      if (normal(text) === normal(chosen)) {
        if (normal(chosen) === normal(answer)) {
          b.classList.add('good');
        } else {
          b.classList.add('on');
        }
      }
    });
  }

  function mark(state) {
    buttons.forEach(function (b) {
      var text = String(b.textContent || '').trim();
      b.classList.remove('on', 'good', 'bad');

      if (state === 'good' && normal(text) === normal(answer)) {
        b.classList.add('good');
      } else if (state === 'bad' && normal(text) === normal(chosen)) {
        b.classList.add('bad');
      } else if (!state && normal(text) === normal(chosen)) {
        b.classList.add('on');
      }
    });
  }

  wrap._f = {
    el: wrap,

    filled: function () {
      return chosen !== null && chosen !== '';
    },

    correct: function () {
      return normal(chosen) !== '' &&
             normal(chosen) === normal(answer);
    },

    mark: mark,

    lock: function () {
      buttons.forEach(function (b) {
        b.disabled = true;
      });
    },

    reveal: function () {
      chosen = String(answer || '').trim();
      buttons.forEach(function (b) {
        b.classList.remove('on', 'bad', 'good');
        if (normal(b.textContent) === normal(answer)) {
          b.classList.add('good');
        }
      });
    },

    value: function () {
      return chosen;
    },

    setValue: function (v) {
      if (v == null || String(v).trim() === '') {
        chosen = null;
        buttons.forEach(function (b) {
          b.classList.remove('on', 'good', 'bad');
          b.disabled = false;
        });
        return;
      }

      chosen = String(v).trim();
      paintSelection();
    },

    clear: function () {
      chosen = null;
      buttons.forEach(function (b) {
        b.classList.remove('on', 'good', 'bad');
        b.disabled = false;
      });
    },

    focus: function () {
      if (buttons.length) buttons[0].focus();
    }
  };

  buttons.forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.preventDefault();

      if (b.disabled) return;

      chosen = String(b.textContent || '').trim();

      // Always select the clicked option.
      // If it is the correct answer, highlight it green immediately.
      buttons.forEach(function (x) {
        x.classList.remove('on', 'good', 'bad');
      });

      if (normal(chosen) === normal(answer)) {
        b.classList.add('good');
      } else {
        b.classList.add('on');
      }

      Quiz._clearMsg();
    });
  });

  if (opts.label) {
    var box = Quiz.el('div');

    box.style.textAlign = 'center';
    box.appendChild(
      Quiz.el('div', 'pick-label', opts.label)
    );

    box.style.display = 'grid';
    box.style.gap = '10px';
    box.appendChild(wrap);

    box._f = wrap._f;

    return box;
  }

  return wrap;
};

    /* ==========================================================
       Local override #2 — Quiz.mount
       Copied from assets/quiz.js with two behavioural changes:
  
       1. Check button is disabled whenever any field (blank or
          property pill) is empty — live, as the child types or
          picks — not just at solved/unsolved.
       2. On a wrong Check: fields that were right lock in place
          and stay marked good; fields that were wrong get cleared
          back to empty once the "try again" popup closes, and the
          Check button goes disabled again until every box is
          refilled.
  
       Everything else — layout, scoring, dots, hint,
       result screen, confetti — is identical to the original.
       ========================================================== */
    Quiz.mount = function (cfg) {
      var self = this;
      var qs = cfg.questions;
      var at = 0;
      var state = qs.map(function () {
        return { solved: false, tries: 0, clean: true, saved: null };
      });

      document.title = cfg.title + ' · Chapter 3';
      var home = Quiz.el('a', 'home',
        '🏠 Home');
      home.href = cfg.home || '../index.html';

      var stage = Quiz.el('main', 'stage');
      var card = Quiz.el('section', 'quiz');
      var head = Quiz.el('header', 'quiz-head');
      var titleBox = Quiz.el('div');
      if (cfg.tag) titleBox.appendChild(Quiz.el('span', 'tag', cfg.tag));
      titleBox.appendChild(Quiz.el('h1', null, cfg.title));
      var dots = Quiz.el('div', 'dots');
      head.appendChild(titleBox);
      head.appendChild(dots);

      var hint = Quiz.el('p', 'hint', cfg.hint || '');
      var board = Quiz.el('div', 'board');
      /* live-updates the Check button any time a blank is typed into
         or a property pill is clicked, anywhere inside the board */
      board.addEventListener('input', function () { refreshCheckBtn(); });
      board.addEventListener('click', function () { refreshCheckBtn(); });

      var msg = Quiz.el('p', 'msg');
      this._msg = msg;

      var nav = Quiz.el('nav', 'nav');
      var prev = Quiz.el('button', 'btn ghost', '← Prev');
      var checkBtn = Quiz.el('button', 'btn primary', 'Check answer');
      var nextBtn = Quiz.el('button', 'btn primary', 'Next →');
      nextBtn.disabled = true;
      [prev, checkBtn, nextBtn].forEach(function (b) { b.type = 'button'; });
      nav.appendChild(prev);
      nav.appendChild(checkBtn);
      nav.appendChild(nextBtn);

      card.appendChild(head);
      if (cfg.hint) card.appendChild(hint);
      card.appendChild(board);
      card.appendChild(msg);
      card.appendChild(nav);
      stage.appendChild(card);
      document.body.appendChild(home);
      document.body.appendChild(stage);

      var popTimer = null;
      var modal = Quiz.el('div', 'overlay');
      var pop = Quiz.el('section', 'pop');
      var popIcon = Quiz.el('div', 'emoji', '🎉');
      var popTitle = Quiz.el('h2', null, 'Correct!');
      var popText = Quiz.el('p');
      var popActions = Quiz.el('div', 'actions');
      var popBtn = Quiz.el('button', 'btn primary', 'Continue');
      popBtn.type = 'button';
      popActions.appendChild(popBtn);
      var popBand = Quiz.el('div', 'pop-band');
      popBand.appendChild(popIcon);
      popBand.appendChild(popTitle);
      [popBand, popText, popActions].forEach(function (n) { pop.appendChild(n); });
      modal.appendChild(pop);

      var finish = Quiz.el('div', 'overlay');
      var fin = Quiz.el('section', 'pop');
      var finText = Quiz.el('div');
      var finActions = Quiz.el('div', 'actions');
      var again = Quiz.el('button', 'btn primary', 'Play again');
      var back = Quiz.el('a', 'btn ghost', 'Back to chapter');
      again.type = 'button';
      back.href = cfg.home || '../index.html';
      back.textContent = 'Home';
      back.style.display = 'inline-flex';
      back.style.alignItems = 'center';
      back.style.justifyContent = 'center';
      back.style.textDecoration = 'none';
      finActions.appendChild(again);
      finActions.appendChild(back);
      fin.appendChild(finText);
      fin.appendChild(finActions);
      finish.appendChild(fin);

      document.body.appendChild(modal);
      document.body.appendChild(finish);

      function fields() {
        return Array.prototype.filter
          .call(board.querySelectorAll('*'), function (n) { return n._f; })
          .filter(function (n) { return !n.parentNode._f; });
      }

      /* new: single source of truth for "is every box filled right now" */
      function refreshCheckBtn() {
        var s = state[at];
        var fs = fields();
        checkBtn.disabled = s.solved || fs.length === 0 || fs.some(function (n) { return !n._f.filled(); });
      }

      function save() {
        state[at].saved = fields().map(function (n) { return n._f.value(); });
      }

      function isUnlocked(idx) {
        if (idx === 0) return true;
        if (state[idx] && state[idx].solved) return true;
        for (var k = 0; k < idx; k++) {
          if (!state[k] || !state[k].solved) return false;
        }
        return true;
      }

      function drawDots() {
        dots.innerHTML = '';
        qs.forEach(function (q, i) {
          var d = Quiz.el('button', 'dot', String(i + 1));
          var unlocked = isUnlocked(i);
          d.type = 'button';
          d.title = 'Question ' + (i + 1) + ' of ' + qs.length;
          d.setAttribute('aria-label', d.title);
          if (i === at) d.classList.add('at');
          if (state[i].solved) d.classList.add(state[i].clean ? 'ok' : 'no');
          if (!unlocked) {
            d.disabled = true;
            d.classList.add('locked');
          }
          d.onclick = function () {
            if (!isUnlocked(i)) return;
            save();
            at = i;
            draw();
          };
          dots.appendChild(d);
        });
      }

      function draw() {
        var s = state[at];
        board.innerHTML = '';
        self._clearMsg();

        var q = qs[at];
        if (q.stem) board.appendChild(Quiz.el('p', 'stem', q.stem));
        q.build(board, Quiz);

        var fs = fields();
        if (s.saved) fs.forEach(function (n, i) { n._f.setValue(s.saved[i]); });
        if (s.solved) {
          fs.forEach(function (n) { n._f.mark('good'); n._f.lock(); });
        }

        prev.disabled = at === 0;
        refreshCheckBtn();
        nextBtn.disabled = !s.solved || at === qs.length - 1;
        nextBtn.textContent = 'Next →';

        drawDots();
        if (!s.solved && fs.length) fs[0]._f.focus();
      }

      function check() {
        var s = state[at];

        var fs = fields();
        var blankLeft = fs.filter(function (n) { return !n._f.filled(); });
        if (blankLeft.length) {
          msg.className = 'msg bad';
          msg.textContent = 'Fill in every box before checking.';
          blankLeft[0]._f.focus();
          return;
        }

        var wrong = [];
        fs.forEach(function (n) {
          var ok = n._f.correct();
          n._f.mark(ok ? 'good' : 'bad');
          if (ok) { n._f.lock(); } else { wrong.push(n); }
        });

        if (wrong.length) {
          s.tries++;
          s.clean = false;
          pop.className = 'pop wrong';
          popIcon.textContent = '🤔';
          popTitle.textContent = 'Not quite yet';
          popText.textContent = wrong.length === 1
            ? 'One answer needs another look — it is marked in red.'
            : wrong.length + ' answers need another look — they are marked in red.';
          popActions.style.display = 'none';
          Quiz.soundWrong();
          modal.classList.add('show');
          popTimer && clearTimeout(popTimer);
          popTimer = setTimeout(function () {
            modal.classList.remove('show');
            /* empty out only the boxes that were wrong; correct ones
               stay locked in from the marking loop above */
            wrong.forEach(function (n) {
              if (n._f.clear) n._f.clear();
              else n._f.setValue('');
              n._f.mark('');
            });
            refreshCheckBtn();
            if (wrong[0]) wrong[0]._f.focus();
          }, 1400);
          return;
        }

        s.solved = true;
        save();
        fs.forEach(function (n) { n._f.lock(); });
        drawDots();
        checkBtn.disabled = true;
        nextBtn.disabled = at === qs.length - 1;

        Quiz.soundCorrect();
        Quiz.confetti({ count: 45 });

        var isLast = at === qs.length - 1;
        if (isLast) Quiz.soundCongrats();

        pop.className = 'pop';
        popIcon.textContent = s.clean ? '🎉' : '👍';
        popTitle.textContent = s.clean ? 'Perfect!' : 'Got it!';
        popText.textContent = qs[at].praise ||
          (s.clean ? 'First try — beautifully done.' : 'You stuck with it and worked it out.');
        popActions.style.display = 'none';
        modal.classList.add('show');
        popTimer && clearTimeout(popTimer);
        popTimer = setTimeout(function () {
          modal.classList.remove('show');
          if (isLast) showResult();
        }, 1400);
      }

      function advance() {
        if (at === qs.length - 1) { showResult(); return; }
        save();
        at++;
        draw();
      }

      function showResult() {
        var clean = state.filter(function (s) { return s.solved && s.clean; }).length;
        var stars = clean === qs.length ? 3 : (clean >= qs.length * 0.6 ? 2 : 1);
        finText.innerHTML =
          '<div class="pop-band"><div class="emoji">' +
          (stars === 3 ? '🏆' : stars === 2 ? '⭐' : '💪') + '</div>' +
          '<h2>' + (stars === 3 ? 'Flawless!' : stars === 2 ? 'Well done!' : 'Good effort!') + '</h2></div>' +
          '<p>You finished every question in <b>' + cfg.title + '</b>.</p>' +
          '<div class="score"><b>' + clean + '</b><span>of ' + qs.length + ' on the first try</span></div>' +
          '<div class="stars">' + ('★ '.repeat(stars) + '☆ '.repeat(3 - stars)).trim() + '</div>';
        finish.classList.add('show');
        Quiz.confetti({ count: 85, spread: Math.min(window.innerWidth, window.innerHeight) * 0.75 });
        again.focus();
      }

      prev.onclick = function () { if (at > 0) { save(); at--; draw(); } };
      checkBtn.onclick = check;
      nextBtn.onclick = function () { if (!nextBtn.disabled) advance(); };
      again.onclick = function () {
        at = 0;
        state = qs.map(function () { return { solved: false, tries: 0, clean: true, saved: null }; });
        finish.classList.remove('show');
        draw();
      };

      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        if (finish.classList.contains('show') || modal.classList.contains('show')) return;
        e.preventDefault();
        check();
      });

      draw();
    };

    Quiz.mount({
      title: 'Properties of Multiplication',
      questions: ITEMS.map(function (item) {
        return {
          stem: 'Complete the number sentence and name the property behind it.',
          praise: item.why,
          build: function (host, Q) {
            host.appendChild(Q.sentence(item.parts.map(function (p) {
              if (Array.isArray(p)) return Q.blank(p[0], { width: p[0].length + 1, label: 'missing number' });
              return p;
            })));
            host.appendChild(Q.art('0 0 840 160', propertyCard()));
            host.appendChild(Q.choice(PROPS, item.prop, { label: 'Which property is this?' }));
          }
        };
      })
    });
  </script>
</body>
