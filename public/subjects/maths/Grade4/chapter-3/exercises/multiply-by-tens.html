<body class="tens">

  <script src="../assets/quiz.js?v=13"></script>

  <script>

    /* ============================================================
       QUESTIONS
       ============================================================ */

    var ITEMS = [

      {
        type: 'direct',

        a: '84',

        zeros: 1,

        by: '10',

        ans: '840',

        parts: [
          '84',
          '×',
          '10',
          '=',
          ['840']
        ],

        stem:
          '10 carries 1 zero, so 1 zero joins the end of 84.',

        why:
          '84 with 1 extra zero attached is 840.'
      },


      {
        type: 'direct',

        a: '19',

        zeros: 2,

        by: '100',

        ans: '1900',

        parts: [
          '19',
          '×',
          '100',
          '=',
          ['1900']
        ],

        stem:
          '100 carries 2 zeros, so 2 zeros join the end of 19.',

        why:
          '19 with 2 extra zeros attached is 1900.'
      },


      {
        type: 'direct',

        a: '31',

        zeros: 3,

        by: '1000',

        ans: '31000',

        parts: [
          '31',
          '×',
          '1000',
          '=',
          ['31000']
        ],

        stem:
          '1000 carries 3 zeros, so 3 zeros join the end of 31.',

        why:
          '31 with 3 extra zeros attached is 31000.'
      },


      {
        type: 'missing',

        start: '70',

        startZ: 1,

        target: '700',

        targetZ: 2,

        ans: '10',

        parts: [
          '70',
          '×',
          ['10'],
          '=',
          '700'
        ],

        stem:
          'Compare 70 and 700. Count how many extra zeros appeared!',

        why:
          '700 has 1 more zero than 70, so the multiplier is 10.'
      },


      {
        type: 'missing',

        start: '102',

        startZ: 0,

        target: '1020',

        targetZ: 1,

        ans: '10',

        parts: [
          ['10'],
          '×',
          '102',
          '=',
          '1020'
        ],

        stem:
          'Which number turns 102 into 1020?',

        why:
          '1 extra zero appeared, so 102 was multiplied by 10.'
      },


      {
        type: 'missing',

        start: '111',

        startZ: 0,

        target: '11100',

        targetZ: 2,

        ans: '100',

        parts: [
          '111',
          '×',
          ['100'],
          '=',
          '11100'
        ],

        stem:
          'Compare 111 with 11100 and count the zeros that were added.',

        why:
          '2 zeros were added, so the multiplier is 100.'
      }

    ];


    /* ============================================================
       QUIZ
       ============================================================ */

    Quiz.mount({

      title:
        'Multiply by 10, 100 and 1000',


      questions:
        ITEMS.map(function (item) {

          return {

            stem:
              item.stem,


            praise:
              item.why,


            build:
              function (host, Q) {


                /* ==================================================
                   IMAGE FIRST
                   ================================================== */

                var imageWrap =
                  document.createElement('div');

                imageWrap.className =
                  'question-image';


                var image =
                  document.createElement('img');

                image.src =
                  '../assets/images/image.png';

                image.alt =
                  'Question illustration';


                imageWrap.appendChild(
                  image
                );


                host.appendChild(
                  imageWrap
                );


                /* ==================================================
                   SENTENCE SECOND
                   ================================================== */

                host.appendChild(

                  Q.sentence(

                    item.parts.map(

                      function (p) {

                        if (
                          Array.isArray(p)
                        ) {

                          return Q.blank(

                            p[0],

                            {
                              width:
                                p[0].length + 1,

                              label:
                                'missing number'
                            }

                          );

                        }


                        return p;

                      }

                    )

                  )

                );

              }

          };

        })

    });


    /* ============================================================
       TRY AGAIN OVERRIDE
       ============================================================ */

    (function () {


      var modal =
        document.querySelectorAll(
          '.overlay'
        )[0];


      if (!modal) {
        return;
      }


      var pop =
        modal.querySelector(
          '.pop'
        );


      var board =
        document.querySelector(
          '.board'
        );


      if (!pop || !board) {
        return;
      }


      var wasWrong =
        false;


      new MutationObserver(

        function () {


          var showing =
            modal.classList.contains(
              'show'
            );


          if (
            showing &&
            pop.classList.contains(
              'wrong'
            )
          ) {

            wasWrong =
              true;

          }


          else if (
            !showing &&
            wasWrong
          ) {

            wasWrong =
              false;


            var toFocus =
              null;


            board
              .querySelectorAll(
                '.blank.bad'
              )
              .forEach(

                function (input) {


                  input.value =
                    '';


                  input.dispatchEvent(

                    new Event(
                      'input',
                      {
                        bubbles: true
                      }
                    )

                  );


                  if (!toFocus) {

                    toFocus =
                      input;

                  }

                }

              );


            if (toFocus) {

              toFocus.focus();

              toFocus.select();

            }

          }

        }

      ).observe(

        modal,

        {
          attributes: true,

          attributeFilter:
            ['class']
        }

      );

    })();

  </script>

</body>
