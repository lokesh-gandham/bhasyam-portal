<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Multiply by 10, 100, 1000 · Chapter 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/quiz.css?v=13">
  <style>
    body.tens .board {
      justify-content: safe center;
      gap: clamp(10px, 1.6vh, 16px);
      border-color: #E2DDFB;
      padding: clamp(12px, 2vh, 20px);
    }

    body.tens .stem {
      font-size: clamp(18px, min(2.2vw, 3vh), 26px);
      font-weight: 500;
      color: #332a59;
    }

    .sentence .blank {
      font-size: 0.82em;
      height: 1.55em;
      min-width: 7.5ch !important;
      padding: .12em .32em;
      border-radius: 14px;
      vertical-align: middle;
    }

    body.tens .sentence {
      font-size: clamp(30px, min(5.5vw, 7.2vh), 64px);
      gap: clamp(10px, 1.6vh, 20px);
      margin-top: 2px;
      padding: clamp(14px, 2.4vh, 24px) clamp(18px, 3vw, 42px);
      background: linear-gradient(145deg, #ffffff, #f9f8ff);
      border: 3.5px solid #d4ccf7;
      border-radius: 26px;
      box-shadow: 0 10px 0 #cfc5f8, 0 20px 36px rgba(108, 92, 224, .16);
    }

    body.tens .sentence .op {
      color: var(--plum);
      font-weight: 700;
    }

    body.tens .blank {
      font-weight: 400;
      font-size: 0.95em;
      background: linear-gradient(145deg, #fffdf7, #fff3db);
      border: 3px solid #ff9f43;
      color: #b45309;
      box-shadow: 0 6px 0 #d97706, 0 12px 20px rgba(217, 119, 6, .18);
      border-radius: 14px;
      transition: transform .15s ease, border-color .15s ease;
    }

    body.tens .blank:focus {
      transform: scale(1.04);
      border-color: #7c3aed;
      box-shadow: 0 6px 0 #7c3aed, 0 12px 20px rgba(16, 47, 185, 0.22);
      outline: none;
    }

    body.tens .blank.good {
      border-color: #10b981;
      color: #026146;
      box-shadow: 0 6px 0 #059669, 0 12px 20px rgba(16, 185, 129, .22);
      background: #ecfdf5;
    }

    body.tens .art svg {
      max-width: min(720px, 90vw);
    }

    body.tens .board>.art {
      min-height: clamp(120px, 20vh, 170px);
    }

    /* Short windows — lower the size floors so the board's content keeps
   shrinking instead of overflowing. See assets/quiz.css. */
    @media (max-height:680px) {
      body.tens .board {
        gap: clamp(4px, 1.6vh, 16px);
        padding: clamp(6px, 2vh, 20px);
      }

      body.tens .stem {
        font-size: clamp(13px, min(2.2vw, 3vh), 26px);
      }

      body.tens .sentence {
        font-size: clamp(20px, min(5vw, 6.5vh), 56px);
        padding: clamp(6px, 2.2vh, 20px) clamp(12px, 2.8vw, 36px);
      }

      body.tens .board>.art {
        min-height: clamp(70px, 20vh, 175px);
      }
    }
  </style>
</head>

<body class="tens">
  <script src="../assets/quiz.js?v=13"></script>
  <script>
    /* Textbook page 88 · section 3.2 — Multiplication by 10, 100, 1000 */

    var ITEMS = [
      {
        type: 'direct', a: '84', zeros: 1, by: '10', ans: '840',
        parts: ['84', '×', '10', '=', ['840']],
        stem: '10 carries 1 zero, so 1 zero joins the end of 84.',
        why: '84 with 1 extra zero attached is 840.'
      },

      {
        type: 'direct', a: '19', zeros: 2, by: '100', ans: '1900',
        parts: ['19', '×', '100', '=', ['1900']],
        stem: '100 carries 2 zeros, so 2 zeros join the end of 19.',
        why: '19 with 2 extra zeros attached is 1900.'
      },

      {
        type: 'direct', a: '31', zeros: 3, by: '1000', ans: '31000',
        parts: ['31', '×', '1000', '=', ['31000']],
        stem: '1000 carries 3 zeros, so 3 zeros join the end of 31.',
        why: '31 with 3 extra zeros attached is 31000.'
      },

      {
        type: 'missing', start: '70', startZ: 1, target: '700', targetZ: 2, ans: '10',
        parts: ['70', '×', ['10'], '=', '700'],
        stem: 'Compare 70 and 700. Count how many extra zeros appeared!',
        why: '700 has 1 more zero than 70, so the multiplier is 10.'
      },

      {
        type: 'missing', start: '102', startZ: 0, target: '1020', targetZ: 1, ans: '10',
        parts: [['10'], '×', '102', '=', '1020'],
        stem: 'Which number turns 102 into 1020?',
        why: '1 extra zero appeared, so 102 was multiplied by 10.'
      },

      {
        type: 'missing', start: '111', startZ: 0, target: '11100', targetZ: 2, ans: '100',
        parts: ['111', '×', ['100'], '=', '11100'],
        stem: 'Compare 111 with 11100 and count the zeros that were added.',
        why: '2 zeros were added, so the multiplier is 100.'
      }
    ];

    /* Dynamic Zero Transfer Visualizer SVG (Concept Rule diagram without revealing the answer) */
    function questionZeroVisual(item) {
      var W = 720, H = 140;
      var svg = '';

      if (item.type === 'direct') {
        var X0 = 60, Y = 36;
        /* Step 1: Base Number Card */
        svg += '<rect x="' + X0 + '" y="' + Y + '" width="120" height="68" rx="16" fill="#F0EDFF" stroke="#7C3AED" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.06))"/>';
        svg += '<text x="' + (X0 + 60) + '" y="' + (Y + 44) + '" text-anchor="middle" font-size="28" font-weight="700" fill="#5445C4">' + item.a + '</text>';
        svg += '<text x="' + (X0 + 60) + '" y="' + (Y + 92) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">Base Number</text>';

        /* Join Arrow */
        svg += '<text x="' + (X0 + 155) + '" y="' + (Y + 44) + '" text-anchor="middle" font-size="28" font-weight="700" fill="#7C3AED">➔</text>';

        /* Step 2: Zeros to Attach */
        var zBoxW = 40 + item.zeros * 40;
        var zX = X0 + 185;
        svg += '<rect x="' + zX + '" y="' + Y + '" width="' + zBoxW + '" height="68" rx="16" fill="#FFF4E2" stroke="#F59E0B" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.06))"/>';
        for (var z = 0; z < item.zeros; z++) {
          var cx = zX + 30 + z * 38;
          svg += '<circle cx="' + cx + '" cy="' + (Y + 34) + '" r="15" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>' +
            '<text x="' + cx + '" y="' + (Y + 40) + '" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">0</text>';
        }
        svg += '<text x="' + (zX + zBoxW / 2) + '" y="' + (Y + 92) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#B45309">' + item.zeros + (item.zeros === 1 ? ' Zero' : ' Zeros') + ' from ' + item.by + '</text>';

        /* Equals Arrow */
        svg += '<text x="' + (zX + zBoxW + 35) + '" y="' + (Y + 44) + '" text-anchor="middle" font-size="32" font-weight="700" fill="#7C3AED">➔</text>';

        /* Step 3: Result Pattern Mask (Does NOT reveal numeric answer) */
        var resX = zX + zBoxW + 70;
        var resW = 110 + item.zeros * 28;
        svg += '<rect x="' + resX + '" y="' + Y + '" width="' + resW + '" height="68" rx="16" fill="#FBFAFF" stroke="#7C3AED" stroke-width="3" stroke-dasharray="6 4" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.04))"/>';
        svg += '<text x="' + (resX + 35) + '" y="' + (Y + 44) + '" text-anchor="middle" font-size="28" font-weight="700" fill="#5445C4">' + item.a + '</text>';
        for (var p = 0; p < item.zeros; p++) {
          var px = resX + 68 + p * 28;
          svg += '<rect x="' + px + '" y="' + (Y + 18) + '" width="22" height="32" rx="6" fill="#FFF4E2" stroke="#F59E0B" stroke-width="2"/>' +
            '<text x="' + (px + 11) + '" y="' + (Y + 40) + '" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">?</text>';
        }
        svg += '<text x="' + (resX + resW / 2) + '" y="' + (Y + 92) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">Attach ' + item.zeros + (item.zeros === 1 ? ' Zero' : ' Zeros') + '</text>';
      }

      else if (item.type === 'step') {
        var X0 = 40, Y = 36;
        /* Step 1: Multiply Digits */
        svg += '<rect x="' + X0 + '" y="' + Y + '" width="150" height="68" rx="16" fill="#F0EDFF" stroke="#7C3AED" stroke-width="3"/>';
        svg += '<text x="' + (X0 + 75) + '" y="' + (Y + 42) + '" text-anchor="middle" font-size="24" font-weight="700" fill="#5445C4">' + item.a + ' × ' + item.mult + ' = ' + item.step1 + '</text>';
        svg += '<text x="' + (X0 + 75) + '" y="' + (Y + 92) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">Step 1: Multiply Digits</text>';

        /* Join Arrow */
        svg += '<text x="' + (X0 + 180) + '" y="' + (Y + 44) + '" text-anchor="middle" font-size="26" font-weight="700" fill="#7C3AED">➔</text>';


        /* Step 2: Attach Zeros */
        var zX = X0 + 205;
        svg += '<rect x="' + zX + '" y="' + Y + '" width="140" height="68" rx="16" fill="#FFF4E2" stroke="#F59E0B" stroke-width="3"/>';
        for (var z = 0; z < item.zeros; z++) {
          var cx = zX + 45 + z * 44;
          svg += '<circle cx="' + cx + '" cy="' + (Y + 34) + '" r="15" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>' +
            '<text x="' + cx + '" y="' + (Y + 40) + '" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">0</text>';
        }
        svg += '<text x="' + (zX + 70) + '" y="' + (Y + 92) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#B45309">Step 2: Bring Down ' + item.zeros + ' Zeros</text>';

        /* Equals Arrow */
        svg += '<text x="' + (zX + 170) + '" y="' + (Y + 44) + '" text-anchor="middle" font-size="32" font-weight="700" fill="#7C3AED">➔</text>';

        /* Step 3: Final Pattern Mask (Does NOT reveal final answer) */
        var resX = zX + 195;
        svg += '<rect x="' + resX + '" y="' + Y + '" width="150" height="68" rx="16" fill="#FBFAFF" stroke="#7C3AED" stroke-width="3" stroke-dasharray="6 4"/>';
        svg += '<text x="' + (resX + 42) + '" y="' + (Y + 44) + '" text-anchor="middle" font-size="24" font-weight="700" fill="#5445C4">' + item.step1 + '</text>';
        for (var p = 0; p < item.zeros; p++) {
          var px = resX + 80 + p * 30;
          svg += '<rect x="' + px + '" y="' + (Y + 18) + '" width="24" height="32" rx="6" fill="#FFF4E2" stroke="#F59E0B" stroke-width="2"/>' +
            '<text x="' + (px + 12) + '" y="' + (Y + 40) + '" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">?</text>';
        }
        svg += '<text x="' + (resX + 75) + '" y="' + (Y + 92) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">Attach to ' + item.step1 + '</text>';
      }

      else if (item.type === 'missing') {
        var X0 = 90, Y = 36;
        /* Start Number */
        svg += '<rect x="' + X0 + '" y="' + Y + '" width="130" height="68" rx="16" fill="#F0EDFF" stroke="#7C3AED" stroke-width="3"/>';
        svg += '<text x="' + (X0 + 65) + '" y="' + (Y + 44) + '" text-anchor="middle" font-size="26" font-weight="700" fill="#5445C4">' + item.start + '</text>';
        svg += '<text x="' + (X0 + 65) + '" y="' + (Y + 92) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">' + item.startZ + (item.startZ === 1 ? ' zero' : ' zeros') + '</text>';

        /* Zero Comparison Arrow */
        var diffZ = item.targetZ - item.startZ;
        svg += '<rect x="' + (X0 + 160) + '" y="' + (Y + 8) + '" width="180" height="52" rx="12" fill="#FFF4E2" stroke="#F59E0B" stroke-width="2.5"/>';
        svg += '<text x="' + (X0 + 250) + '" y="' + (Y + 38) + '" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">Compare Zeros</text>';
        svg += '<text x="' + (X0 + 250) + '" y="' + (Y + 76) + '" text-anchor="middle" font-size="28" font-weight="700" fill="#F59E0B">➔</text>';

        /* Target Number */
        var resX = X0 + 360;
        svg += '<rect x="' + resX + '" y="' + Y + '" width="140" height="68" rx="16" fill="#F0EDFF" stroke="#7C3AED" stroke-width="3"/>';
        svg += '<text x="' + (resX + 70) + '" y="' + (Y + 44) + '" text-anchor="middle" font-size="26" font-weight="700" fill="#5445C4">' + item.target + '</text>';
        svg += '<text x="' + (resX + 70) + '" y="' + (Y + 92) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">' + item.targetZ + (item.targetZ === 1 ? ' zero' : ' zeros') + '</text>';
      }

      return svg;
    }


        Quiz.mount({
      title: 'Multiply by 10, 100 and 1000',
      questions: ITEMS.map(function (item) {
        return {
          stem: item.stem,
          praise: item.why,
          build: function (host, Q) {
            host.appendChild(Q.sentence(item.parts.map(function (p) {
              if (Array.isArray(p)) return Q.blank(p[0], { width: p[0].length + 1, label: 'missing number' });
              return p;
            })));
            host.appendChild(Q.art('0 0 720 140', questionZeroVisual(item)));
          }
        };
      })
    });

    /* ---- Override (this file only, quiz.js untouched):
       when the "Try again" popup finishes closing after a wrong
       answer, empty the wrong box(es) and let the child retype. ---- */
    (function () {
      var modal = document.querySelectorAll('.overlay')[0]; // the correct/wrong popup
      var pop = modal.querySelector('.pop');
      var board = document.querySelector('.board');
      var wasWrong = false;

      new MutationObserver(function () {
        var showing = modal.classList.contains('show');

        if (showing && pop.classList.contains('wrong')) {
          wasWrong = true;                 // wrong popup just opened
        } else if (!showing && wasWrong) {  // wrong popup just closed
          wasWrong = false;
          var toFocus = null;
          board.querySelectorAll('.blank.bad').forEach(function (input) {
            input.value = '';
            /* reuse quiz.js's own input handler to resize + unmark + clear msg */
            input.dispatchEvent(new Event('input', { bubbles: true }));
            if (!toFocus) toFocus = input;
          });
          if (toFocus) { toFocus.focus(); toFocus.select(); }
        }
      }).observe(modal, { attributes: true, attributeFilter: ['class'] });
    })();
  </script>
</body>

</html>
