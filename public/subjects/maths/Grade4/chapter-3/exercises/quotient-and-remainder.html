<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quotient and Remainder · Chapter 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/quiz.css?v=13">
<style>
body.qr .board{ justify-content:safe center; gap:clamp(10px,1.6vh,16px); padding:clamp(12px,2vh,20px); }
body.qr .stem{ font-size:clamp(18px,min(2.2vw,3vh),26px); font-weight:500; color:#332a59; }

body.qr .sentence{
  font-size:clamp(28px,min(5vw,6.5vh),56px);
  gap:clamp(10px,1.6vh,20px);
  margin-top:2px;
  padding:clamp(12px,2.2vh,20px) clamp(16px,2.8vw,36px);
  background:linear-gradient(145deg,#ffffff,#f9f8ff);
  border:3.5px solid #d4ccf7;
  border-radius:24px;
  box-shadow:0 10px 0 #cfc5f8, 0 20px 36px rgba(108,92,224,.16);
}
body.qr .sentence .op{ color:var(--plum); font-weight:700; }
body.qr .blank{
  font-weight:400;
  font-size:0.95em;
  background:linear-gradient(145deg,#fffdf7,#fff3db);
  border:3px solid #ff9f43;
  color:#b45309;
  box-shadow:0 6px 0 #d97706, 0 12px 20px rgba(217,119,6,.18);
  border-radius:14px;
  transition:transform .15s ease, border-color .15s ease;
}
body.qr .blank:focus{ transform:scale(1.04); border-color:#7c3aed; outline:none; }
body.qr .art svg{ max-width:min(680px,82vw); }

/* Short windows — lower the size floors so the board's content keeps
   shrinking instead of overflowing and being cut off at the bottom.
   See the matching block in assets/quiz.css. */
@media (max-height:680px){
  body.qr .board{ gap:clamp(4px,1.6vh,16px); padding:clamp(6px,2vh,20px); }
  body.qr .stem{ font-size:clamp(13px,min(2.2vw,3vh),26px); }
  body.qr .sentence{ font-size:clamp(20px,min(5vw,6.5vh),56px); padding:clamp(6px,2.2vh,20px) clamp(12px,2.8vw,36px); }
  body.qr .board > .art{ min-height:clamp(70px,20vh,175px); }
}
</style>
</head>
<body class="qr">
<script src="../assets/quiz.js?v=13"></script>
<script>
/* Textbook page 97 · section 3.7 — find the quotient (Q) and the remainder (R) */

var ITEMS = [
  { a: 72,  b: 8,  q: 9,  r: 0 },
  { a: 61,  b: 6,  q: 10, r: 1 },
  { a: 58,  b: 7,  q: 8,  r: 2 },
  { a: 99,  b: 9,  q: 11, r: 0 }
];

function barModel(a, b, q, r) {
  var X = 50, W = 620, Y = 36, H = 50;
  var svg = '<text x="360" y="22" text-anchor="middle" font-size="16" font-weight="700" fill="#4A4466">Total Amount = ' + a + '</text>';

  /* Outer background track representing total A */
  svg += '<rect x="' + X + '" y="' + Y + '" width="' + W + '" height="' + H +
         '" rx="16" fill="#F4F1FF" stroke="#D4CCF7" stroke-width="2.5"/>';

  /* SVG Gradient definition */
  svg += '<defs><linearGradient id="groupGrad" x1="0%" y1="0%" x2="100%" y2="100%">' +
         '<stop offset="0%" stop-color="#ECE7FF"/><stop offset="100%" stop-color="#DCD5FF"/>' +
         '</linearGradient></defs>';


if (r === 0) { 
    /* Full Exact Division Bar */ 
    svg += '<rect x="' + (X + 2) + '" y="' + (Y + 2) + '" width="' + (W - 4) + '" height="' + (H - 4) + 
           '" rx="14" fill="url(#groupGrad)" stroke="#7C3AED" stroke-width="2"/>'; 
    svg += '<text x="360" y="' + (Y + 32) + '" text-anchor="middle" font-size="18" font-weight="700" fill="#5445C4">Split into Equal Groups of ' + b + ' (Exact Division)</text>'; 
 
    /* Bottom bracket */ 
    svg += '<path d="M' + X + ' ' + (Y + H + 8) + ' v8 H' + (X + W) + ' v-8" fill="none" stroke="#7C3AED" stroke-width="3"/>' + 
           '<text x="360" y="' + (Y + H + 34) + '" text-anchor="middle" font-size="15" font-weight="700" fill="#7C3AED">How many groups of ' + b + ' fit in ' + a + '?</text>'; 
  } else { 
    /* Calculate proportions */ 
    var wholePart = a - r; 
    var remW = 140; 
    var wholeW = W - remW; 
 
    /* Whole Groups Bar */ 
    svg += '<rect x="' + (X + 2) + '" y="' + (Y + 2) + '" width="' + (wholeW - 4).toFixed(1) + '" height="' + (H - 4) + 
           '" rx="14" fill="url(#groupGrad)" stroke="#7C3AED" stroke-width="2"/>'; 
    svg += '<text x="' + (X + wholeW / 2).toFixed(1) + '" y="' + (Y + 32) + 
           '" text-anchor="middle" font-size="17" font-weight="700" fill="#5445C4">Groups of ' + b + '</text>'; 
 
    /* Remainder Bar */ 
    svg += '<rect x="' + (X + wholeW + 2).toFixed(1) + '" y="' + (Y + 2) + 
           '" width="' + (remW - 4).toFixed(1) + '" height="' + (H - 4) + 
           '" rx="12" fill="#FFF4E2" stroke="#F59E0B" stroke-width="2"/>'; 
    svg += '<text x="' + (X + wholeW + remW / 2).toFixed(1) + '" y="' + (Y + 32) + 
           '" text-anchor="middle" font-size="16" font-weight="700" fill="#B45309">Remainder</text>'; 
 
    /* Bottom brackets */ 
    svg += '<path d="M' + X + ' ' + (Y + H + 8) + ' v8 H' + (X + wholeW).toFixed(1) + ' v-8" fill="none" stroke="#7C3AED" stroke-width="3"/>' + 
           '<text x="' + (X + wholeW / 2).toFixed(1) + '" y="' + (Y + H + 34) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">How many groups of ' + b + '?</text>'; 
 
    svg += '<path d="M' + (X + wholeW + 4).toFixed(1) + ' ' + (Y + H + 8) + ' v8 H' + (X + W) + ' v-8" fill="none" stroke="#F59E0B" stroke-width="3"/>' + 
           '<text x="' + (X + wholeW + remW / 2).toFixed(1) + '" y="' + (Y + H + 34) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#B45309">Leftover Remainder</text>'; 
  } 
 
  return svg; 
}

Quiz.mount({
  title: 'Quotient and Remainder',
  questions: ITEMS.map(function (it) {
    return {
      stem: 'How many whole groups of ' + it.b + ' fit inside ' + it.a + ', and what is left over?',
      praise: it.b + ' × ' + it.q + ' = ' + (it.b * it.q) +
              (it.r ? ', and ' + it.a + ' − ' + (it.b * it.q) + ' = ' + it.r + ' is left over.'
                    : ', with nothing left over.'),
      build: function (host, Q) {
        host.appendChild(Q.sentence([String(it.a), '÷', String(it.b)]));
        host.appendChild(Q.art('0 0 720 130', barModel(it.a, it.b, it.q, it.r)));
        var ansRow = Q.el('div', 'answer-row');
        ansRow.appendChild(Q.labelled('Quotient',  Q.blank(it.q, { width: 4, label: 'quotient' })));
        ansRow.appendChild(Q.labelled('Remainder', Q.blank(it.r, { width: 4, label: 'remainder' })));
        host.appendChild(ansRow);
      }
    };
  })
});

</script>
</body>
</html>
