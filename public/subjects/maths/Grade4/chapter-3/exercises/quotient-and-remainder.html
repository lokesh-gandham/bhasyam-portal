<body class="qr">

<script src="../assets/quiz.js?v=13"></script>

<script>
var ITEMS = [
  { a:72, b:8, q:9,  r:0 },
  { a:61, b:6, q:10, r:1 },
  { a:58, b:7, q:8,  r:2 },
  { a:99, b:9, q:11, r:0 }
];

/*
  ============================================================
  LIVE CORRECT-NUMBER HIGHLIGHT
  ============================================================

  quiz.js creates every number answer through Quiz.blank().
  We wrap that function only on this page.

  Result:
    Correct typed number -> green immediately.
    Wrong/incomplete     -> normal.
    The answer is NOT locked while typing, so it can be changed.
*/
(function setupBlankHighlight(){

  var originalBlank = Quiz.blank;

  Quiz.blank = function(answer, opts){
    var field = originalBlank.call(Quiz, answer, opts);

    if (!field || !field._f) return field;

    var input = field._f.el || field.querySelector('input');

    if (input && !input.__qrHighlightAttached) {
      input.__qrHighlightAttached = true;

      input.addEventListener('input', function(){
        if (field._f.correct()) {
          field._f.mark('good');
        } else {
          field._f.mark('');
        }
      });
    }

    return field;
  };

})();

Quiz.mount({
  title:'Quotient and Remainder',

  questions: ITEMS.map(function(it){

    return {
      stem:
        'How many whole groups of ' +
        it.b +
        ' fit inside ' +
        it.a +
        ', and what is left over?',

      praise:
        it.r === 0
          ? 'Excellent! There is no remainder.'
          : 'Great job! You found the quotient and remainder.',

      build:function(host,Q){

        /* Division sentence */
        host.appendChild(
          Q.sentence([
            String(it.a),
            '÷',
            String(it.b)
          ])
        );

        /* Answer row */
        var ansRow = Q.el('div','answer-row');

        ansRow.appendChild(
          Q.labelled(
            'Quotient',
            Q.blank(it.q,{
              width:4,
              label:'quotient'
            })
          )
        );

        ansRow.appendChild(
          Q.labelled(
            'Remainder',
            Q.blank(it.r,{
              width:4,
              label:'remainder'
            })
          )
        );

        host.appendChild(ansRow);
      }
    };
  })
});

/*
  ============================================================
  KEEP CORRECT / CLEAR ONLY WRONG
  ============================================================

  If the learner enters:
      Quotient  = correct
      Remainder = wrong

  after Check:
      Quotient  -> stays filled + green
      Remainder -> red, then clears

  The learner can then type the remainder again.

  If both are correct:
      both stay green and the normal quiz completion runs.
*/
(function setupPartialRetry(){

  function getFields(){
    return Array.prototype.filter.call(
      document.querySelectorAll('.board *'),
      function(n){
        return n &&
          n._f &&
          typeof n._f.correct === 'function' &&
          typeof n._f.value === 'function';
      }
    ).filter(function(n){
      return !n.parentNode || !n.parentNode._f;
    });
  }

  function findCheckButton(){
    var buttons = document.querySelectorAll('button');

    for(var i=0;i<buttons.length;i++){
      if(
        String(buttons[i].textContent)
          .trim()
          .toLowerCase() === 'check answer'
      ){
        return buttons[i];
      }
    }

    return null;
  }

  function processCheckResult(){
    var fields = getFields();

    if(!fields.length) return;

    var wrong = [];

    fields.forEach(function(field){

      if(field._f.correct()){

        /* NEVER clear the correct answer. */
        field._f.mark('good');

      }else{

        /* Only this field is wrong. */
        field._f.mark('bad');
        wrong.push(field);
      }
    });

    if(!wrong.length) return;

    /*
      Wait until the quiz feedback popup finishes.
      Then clear ONLY wrong fields.
    */
    setTimeout(function(){

      wrong.forEach(function(field){

        if(field._f.clear){
          field._f.clear();
        }else{
          field._f.setValue('');
          field._f.mark('');
        }

      });

      /*
        Re-highlight all correct fields so they remain visibly green.
      */
      fields.forEach(function(field){

        if(field._f.correct()){
          field._f.mark('good');
        }

      });

      if(
        wrong[0] &&
        wrong[0]._f.focus
      ){
        wrong[0]._f.focus();
      }

    },1450);
  }

  function attach(){

    var checkBtn = findCheckButton();

    if(!checkBtn){
      setTimeout(attach,50);
      return;
    }

    checkBtn.addEventListener('click',function(){

      /*
        Allow quiz.js to do its normal checking first.
        Then preserve correct answers and clear only wrong ones.
      */
      setTimeout(processCheckResult,10);

    });

    /*
      Live highlighting while typing.
      Correct values are green immediately.
    */
    var board = document.querySelector('.board');

    if(board){

      board.addEventListener('input',function(){

        var fields = getFields();

        fields.forEach(function(field){

          if(field._f.correct()){

            field._f.mark('good');

          }else if(field._f.value() !== ''){

            field._f.mark('');

          }

        });

      });

    }
  }

  attach();

})();
</script>
