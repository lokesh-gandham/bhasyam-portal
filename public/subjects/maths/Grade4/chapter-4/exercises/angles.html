<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angles · Chapter 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/quiz.css?v=16">
<style>
/* Capitalise the first letter as the learner types — the answer check is
   case-insensitive, so this is purely cosmetic. */
.blank { text-transform: capitalize; }

/* The picture on the left, the sentence with its blanks on the right. */
.question-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 2.6vw, 40px);
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
}

/* the drawing sits straight on the board - no card, no frame */
.figure-img-wrap {
  width: clamp(220px, 24vw, 340px);
  height: clamp(180px, 34vh, 300px);
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.figure-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* the sentence side of the row */
.answer-side {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  gap: clamp(10px, 1.8vh, 18px);
  justify-items: center;
}
.answer-side .claim {
  max-width: none;
  text-align: left;
}

/* the angle sign is not on a keyboard, so it is offered as a key to tap */
.key-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
.key-row .key-note {
  font-size: clamp(15px, 1.9vh, 17px);
  color: var(--ink);
  opacity: .85;
}
.key-row .tap { min-width: 62px; font-size: clamp(20px, 2.6vh, 26px); }

/* ------------------------------------------------------------
   Big monitors (1600px and wider). There is room to spare down
   there, so the drawing grows and the sentence is set at 40px.
   Laptops are below this width and stay exactly as they are.
   ------------------------------------------------------------ */
@media (min-width: 1600px) {
  .question-row {
    max-width: 1560px;
    gap: clamp(40px, 4vw, 80px);
  }
  .figure-img-wrap {
    width: clamp(360px, 32vw, 620px);
    height: clamp(300px, 50vh, 560px);
  }
  .answer-side { gap: 22px; }
  .answer-side .claim { font-size: 40px; line-height: 2.1; }
  .answer-side .blank { min-height: 64px; margin: 10px .15em; }
  .key-row .key-note { font-size: 19px; }
  .key-row .tap { min-width: 76px; font-size: 30px; }
}

@media (max-width: 900px) {
  .question-row { flex-direction: column; gap: 14px; }
  .answer-side .claim { text-align: center; }
  /* stacked, the picture gives up some height so the sentence and the
     tap-a-sign row still fit on the board */
  .figure-img-wrap {
    width: clamp(180px, 46vw, 280px);
    height: clamp(100px, 16vh, 160px);
  }
}
</style>
</head>
<body>
<script src="../assets/confetti.js?v=3"></script>
<script src="../assets/quiz.js?v=19"></script>
<script>
/* Section 4.4 — the seven blanks from the textbook exercise, word for word.
   Every blank is typed into by hand: there are no words to pick from. */

function imgArt(src) {
  var wrap = document.createElement('div');
  wrap.className = 'figure-img-wrap';
  var img = document.createElement('img');
  img.src = src;
  wrap.appendChild(img);
  return wrap;
}

/* Our own tidy-up before comparing. Spaces, full stops and capitals do not
   matter; the degree and angle signs do, so those are kept. */
function tidy(v) {
  return String(v == null ? '' : v)
    .replace(/[\s.,;:!?'"()-]/g, '')
    .toLowerCase();
}

var WORDS = [
  /* a) */
  { text: ['An', 'GAP', 'is formed where the two rays meet.'],
    img: '../assets/angle1.png',
    blanks: [
      { answer: 'angle', width: 10, accept: ['angle', 'an angle'] }
    ],
    why: 'Two rays that start from the same point make an angle.' },

  /* b) */
  { text: ['The point where two rays meet is called', 'GAP', '.'],
    img: '../assets/angle2.png',
    blanks: [
      { answer: 'the vertex', width: 12, accept: ['vertex', 'the vertex', 'a vertex'] }
    ],
    why: 'That shared corner is called the vertex of the angle.' },

  /* c) */
  { text: ['A', 'GAP', 'is used to measure angles.'],
    img: '../assets/protractor_tool.jpg',
    blanks: [
      { answer: 'protractor', width: 13, accept: ['protractor', 'a protractor', 'the protractor'] }
    ],
    why: 'The protractor is the half-circle tool with the degree scale on it.' },

  /* d) — this sentence has two blanks */
  { text: ['An angle is measured in', 'GAP', 'and the symbol for an angle is', 'GAP', '.'],
    img: '../assets/angle4.png',
    blanks: [
      { answer: 'degrees', width: 10, accept: ['degrees', 'degree'] },
      { answer: '∠', width: 4, accept: ['∠'], keys: ['∠', '°', '△'] }
    ],
    why: 'Angles are measured in degrees, and the symbol for an angle is ∠.' },

  /* e) */
  { text: ['An angle whose measure is exactly 90° is called', 'GAP', '.'],
    img: '../assets/angle5.png',
    blanks: [
      { answer: 'a right angle', width: 15,
        accept: ['right angle', 'a right angle', 'right'] }
    ],
    why: 'Exactly 90° is a right angle — the corner of a page.' },

  /* f) */
  { text: ['An angle whose measure is more than 180° and less than 360° is called', 'GAP', '.'],
    img: '../assets/angle6.png',
    blanks: [
      { answer: 'a reflex angle', width: 16,
        accept: ['reflex angle', 'a reflex angle', 'reflex'] }
    ],
    why: 'Past a straight line but not all the way round — that is a reflex angle.' },

  /* g) */
  { text: ['The scale of the protractor is divided into', 'GAP', 'equal parts.'],
    img: '../assets/angle7.png',
    blanks: [
      { answer: '180', width: 6, accept: ['180', '180°', '180degrees'] }
    ],
    why: 'A protractor is half a circle, so its scale runs from 0 to 180.' }
];

var LETTERS = ['a', 'b', 'c', 'd', 'e', 'f', 'g'];

var questions = WORDS.map(function (w, i) {
  return {
    short: LETTERS[i] + ')',
    stem: 'Fill in the blank' + (w.blanks.length > 1 ? 's' : '') + '.',
    praise: w.why,
    build: function (host, Q) {
      var made = 0;
      var keyRows = [];

      var parts = w.text.map(function (t) {
        if (t !== 'GAP') return t;

        var b = w.blanks[made++];
        var box = Q.blank(b.answer, { text: true, width: b.width, label: 'your answer' });
        box.placeholder = '';

        /* the typed words only have to read right — spacing and capitals are free */
        box._f.correct = function () {
          var typed = tidy(box.value);
          return b.accept.some(function (ok) { return tidy(ok) === typed; });
        };

        if (b.keys) {
          var keys = Q.el('div', 'key-row');
          keys.appendChild(Q.el('span', 'key-note', 'Not on your keyboard? Tap a sign:'));
          b.keys.forEach(function (sign) {
            var k = Q.el('button', 'tap', sign);
            k.type = 'button';
            k.addEventListener('click', function () {
              if (box.readOnly) return;
              box.value = sign;
              box.dispatchEvent(new Event('input'));
              box.focus();
            });
            keys.appendChild(k);
          });
          keyRows.push(keys);
        }

        return box;
      });

      var side = Q.el('div', 'answer-side');
      side.appendChild(Q.claim(parts));
      keyRows.forEach(function (k) { side.appendChild(k); });

      var row = Q.el('div', 'question-row');
      if (w.img) row.appendChild(imgArt(w.img));
      row.appendChild(side);
      host.appendChild(row);
    }
  };
});

Quiz.mount({
  title: 'Angles',
  hint: 'Type your answer in the box, then press Check answer. Under 90° is acute, exactly 90° is right, over 90° is obtuse, 180° is straight and beyond that is reflex.',
  questions: questions
});
</script>
</body>
</html>
