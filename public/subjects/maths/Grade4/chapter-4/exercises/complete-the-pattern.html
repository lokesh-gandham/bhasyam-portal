<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade4_Lesson4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/quiz.css?v=16">
<style>
/* Match the angle layout: one question is shown at a time, with the
   example on the left and the answer area on the right. */
.question-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 2.8vw, 42px);
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
}

.pattern-figure {
  width: clamp(260px, 28vw, 420px);
  min-height: auto;
  padding: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pattern-image {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  object-fit: contain;
}

.pattern-card {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 0.55em;
  font-size: clamp(24px, 2.2vw, 38px);
  line-height: 1.3;
  color: var(--ink);
}

.pattern-chip,
.pattern-placeholder {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 2.2em;
  padding: 0.18em 0.5em;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(81, 58, 36, 0.16);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
}

.pattern-placeholder {
  color: rgba(66, 53, 41, 0.7);
  min-width: 2.6em;
}

.answer-side {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  gap: clamp(10px, 1.8vh, 20px);
  justify-items: center;
}

.answer-side .claim {
  max-width: none;
  text-align: left;
  font-size: clamp(22px, 2.4vw, 36px);
  line-height: 1.8;
}

.answer-side .blank {
  min-height: 1.8em;
  vertical-align: middle;
  margin: 0 0.12em;
}

.answer-options {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  width: 100%;
}

.answer-choice-group {
  display: grid;
  gap: 6px;
  justify-items: center;
}

.answer-choice-label {
  font-size: clamp(15px, 1.8vh, 19px);
  color: var(--ink);
}

.answer-options .option {
  min-width: 120px;
  padding: 10px 16px;
  border: 2px solid var(--accent-border);
  border-radius: 12px;
  background: var(--accent-light);
  color: var(--ink);
  font-size: clamp(18px, 2vh, 24px);
  cursor: pointer;
}

.answer-options .option:hover:not(:disabled) {
  background: var(--paper);
  border-color: var(--accent);
  transform: translateY(-1px);
}

.answer-options .option:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

@media (min-width: 1600px) {
  .question-row {
    max-width: 1520px;
    gap: clamp(40px, 4vw, 80px);
  }
  .pattern-figure {
    width: clamp(420px, 32vw, 640px);
    min-height: clamp(240px, 32vh, 360px);
  }
  .answer-side .claim {
    font-size: 40px;
    line-height: 2.1;
  }
  .answer-side .blank {
    min-height: 64px;
    margin: 8px 0.12em;
  }
}

@media (max-width: 900px) {
  .question-row {
    flex-direction: column;
    gap: 14px;
  }
  .answer-side .claim {
    text-align: center;
  }
  .pattern-figure {
    width: clamp(220px, 52vw, 340px);
    min-height: clamp(120px, 18vh, 180px);
  }
}
</style>
</head>
<body>
<script src="../assets/confetti.js?v=3"></script>
<script src="../assets/quiz.js?v=19"></script>
<script>
function tidy(v) {
  return String(v == null ? '' : v).replace(/[\s.,]/g, '').toUpperCase();
}

var ROWS = [
  { tag: 'a)', seq: [21, 25, 33, 49, 81], answers: ['145', '273'], letters: false,
    options: [['137','145', '162'], ['273', '265', '294']],
    why: 'a) adds 4, then 8, then 16, then 32 — each jump doubles, so 81 + 64 = 145 and 145 + 128 = 273.' },

  { tag: 'b)', seq: [2, 3, 5, 8, 12], answers: ['17', '23'], letters: false,
    options: [['17', '16', '18'], ['23', '22', '25']],
    why: 'b) grows by 1, 2, 3, 4 — so add 5 to reach 17, then 6 to reach 23.' },

  { tag: 'c)', seq: ['ABC', 'DEF', 'GHI'], answers: ['JKL', 'MNO'], letters: true,
    options: [[ 'IJK', 'JKL','KLM'], [ 'KLM','NOP','MNO']],
    why: 'c) takes the alphabet three letters at a time: JKL then MNO.' },

  { tag: 'd)', seq: ['28Z', '27Y', '26X'], answers: ['25W', '24V'], letters: true,
    options: [['25W', '25X', '24W'], [ '24W','24V', '23U']],
    why: 'd) counts down by one and steps back through the alphabet: 25W then 24V.' },

  { tag: 'e)', seq: [864, 764, 664], answers: ['564', '464'], letters: false,
    options: [['564', '574', '584'], ['464', '474', '364']],
    why: 'e) takes away 100 each time: 564 then 464.' }
];

function addAnswerOptions(Q, side, boxes, options) {
  options.forEach(function (choices, boxIndex) {
    var group = Q.el('div', 'answer-choice-group');
    group.appendChild(Q.el('div', 'answer-choice-label', 'Choose value ' + (boxIndex + 1)));
    var optionRow = Q.el('div', 'answer-options');

    choices.forEach(function (value) {
      var option = Q.el('button', 'option', value);
      option.type = 'button';
      option.addEventListener('click', function () {
        var box = boxes[boxIndex];
        box.value = value;
        box.dispatchEvent(new Event('input', { bubbles: true }));
      });
      optionRow.appendChild(option);
    });

    var originalMark = boxes[boxIndex]._f.mark;
    boxes[boxIndex]._f.mark = function (state) {
      originalMark(state);
      if (state === 'good') {
        Array.prototype.forEach.call(optionRow.querySelectorAll('.option'), function (choice) {
          choice.disabled = true;
        });
      }
    };

    group.appendChild(optionRow);
    side.appendChild(group);
  });
}

var questions = ROWS.map(function (row) {
  return {
    short: row.tag,
    stem: 'Complete the pattern.',
    praise: row.why,
    build: function (host, Q) {
      var left = Q.el('div', 'pattern-figure');

var img = document.createElement('img');
img.src = '../assets/img/image.png';
img.alt = 'Pattern';
img.className = 'pattern-image';

left.appendChild(img);

      var boxes = [];
      row.answers.forEach(function (ans) {
        var box = Q.blank(ans, {
          text: row.letters,
          width: Math.max(ans.length + 2, 6),
          label: row.tag + ' missing term'
        });
        box.readOnly = true;
        box.placeholder = '';
        if (row.letters) {
          box._f.correct = function () { return tidy(box.value) === tidy(ans); };
          box.style.textTransform = 'uppercase';
          box.addEventListener('input', function () {
            var start = box.selectionStart, end = box.selectionEnd;
            box.value = box.value.toUpperCase();
            try { box.setSelectionRange(start, end); } catch (e) {}
          });
        }
        boxes.push(box);
      });

      var seqParts = [row.tag + ' '];
      row.seq.forEach(function (item, i) {
        seqParts.push(String(item));
        if (i < row.seq.length - 1) seqParts.push(', ');
      });
      seqParts.push(', ');
      seqParts.push(boxes[0]);
      seqParts.push(', ');
      seqParts.push(boxes[1]);

      var side = Q.el('div', 'answer-side');
      side.appendChild(Q.claim(seqParts));
      addAnswerOptions(Q, side, boxes, row.options);

      var rowWrap = Q.el('div', 'question-row');
      rowWrap.appendChild(left);
      rowWrap.appendChild(side);
      host.appendChild(rowWrap);
    }
  };
});

Quiz.mount({
  title: 'Complete the Pattern',
  hint: 'Find what changes from one term to the next, then carry the same change on twice.',
  questions: questions
});
</script>
</body>
</html>
