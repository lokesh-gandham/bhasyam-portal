<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Count the Segments · Chapter 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/quiz.css?v=16">
</head>
<body>
<script src="../assets/confetti.js?v=3"></script>
<script src="../assets/quiz.js?v=19"></script>
<script>
/* Section 4.1 — how many line segments between the given points */

var INK = '#1F2440', BLUE = '#4C5FD5', CORAL = '#F2704A', GOLD = '#F4C542';

function dotsAndJoins(pts, join) {
  var art = '';
  if (join) {
    for (var i = 0; i < pts.length; i++) {
      for (var j = i + 1; j < pts.length; j++) {
        art += '<line x1="' + pts[i].x + '" y1="' + pts[i].y + '" x2="' + pts[j].x +
               '" y2="' + pts[j].y + '" stroke="' + GOLD + '" stroke-width="4"/>';
      }
    }
  }
  pts.forEach(function (p) {
    art += '<circle cx="' + p.x + '" cy="' + p.y + '" r="10" fill="' + CORAL + '"/>';
    art += '<text x="' + p.x + '" y="' + (p.y - 18) + '" text-anchor="middle" font-size="22" fill="' + INK + '">' + p.n + '</text>';
  });
  return art;
}

var ITEMS = [
  {
    pts: [{n:'S',x:90,y:60},{n:'T',x:400,y:170}],
    ans: 1,
    why: 'Two points can only be joined one way — that is 1 segment.'
  },
  {
    pts: [{n:'E',x:120,y:50},{n:'F',x:330,y:150}],
    ans: 1,
    why: 'Two points can only be joined one way — that is 1 segment.'
  },
  {
    pts: [{n:'W',x:480,y:50},{n:'Y',x:90,y:170},{n:'X',x:520,y:170}],
    ans: 3,
    why: 'Three points, none in a straight line, make a triangle — 3 segments.'
  },
  {
    pts: [{n:'A',x:90,y:60},{n:'B',x:430,y:110},{n:'D',x:90,y:190},{n:'C',x:350,y:190}],
    ans: 6,
    why: 'Four points with no three in a line: 4 sides and 2 diagonals. That is 6.'
  },
  {
    pts: [{n:'A',x:90,y:70},{n:'B',x:300,y:110},{n:'E',x:480,y:70},{n:'D',x:90,y:190},{n:'C',x:330,y:190}],
    ans: 10,
    why: 'Five points, no three in a line: you can join every pair. 4+3+2+1 = 10.'
  }
];

Quiz.mount({
  title: 'Count the Segments',
  hint: 'Join every pair of points in your mind. A segment needs two end points — that is all.',
  questions: ITEMS.map(function (it, i) {
    return {
      short: 'Figure ' + (i + 1),
      stem: 'How many line segments can be drawn between the given points?',
      praise: it.why,
      build: function (host, Q) {
        var wrap = Q.el('div', 'play-art');
        wrap.innerHTML = '<svg viewBox="0 0 600 230" xmlns="http://www.w3.org/2000/svg">' +
          dotsAndJoins(it.pts, false) + '</svg>';
        host.appendChild(wrap);
        host.appendChild(Q.claim([
          'I can draw',
          Q.blank(it.ans, { width: 3, label: 'number of line segments' }),
          'line segments.'
        ]));
      }
    };
  })
});
</script>
</body>
</html>
