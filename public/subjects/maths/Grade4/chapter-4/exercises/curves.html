<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grade4_Lesson4</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/quiz.css?v=16">

  <style>
    /* =========================================================
       PAGE / BOARD FIT
       The shared quiz.css uses a scrolling fallback at the end.
       These page-specific rules override it for this exercise.
       ========================================================= */

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
    }

    body {
      min-height: 100vh;
    }

    .stage {
      height: 100vh;
      min-height: 0;
      overflow: hidden;
    }

    .quiz {
      min-height: 0;
      overflow: hidden;
    }

    .board {
      min-height: 0;
      overflow: hidden !important;
      justify-content: center;
      align-items: center;
      gap: 0;
      padding: clamp(6px, 1.2vh, 14px) clamp(8px, 1.5vw, 20px);
    }

    .board > * {
      min-height: 0;
      max-width: 100%;
    }

    /* =========================================================
       ONE FIGURE / ONE ANSWER
       ========================================================= */

    .curve-row {
      width: 100%;
      height: 100%;
      min-height: 0;
      flex: 1 1 auto;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      box-sizing: border-box;
    }

    .curve-cell {
      width: min(760px, 96%);
      height: 100%;
      min-width: 0;
      min-height: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: clamp(6px, 1.2vh, 14px);
      margin: 0 auto;

      box-sizing: border-box;
      overflow: hidden;
    }

    .curve-tag {
      display: none;
    }

    /* Figure always scales down rather than pushing the answer away */
    .curve-art {
      width: min(680px, 90%);
      height: min(50vh, 420px);

      min-width: 0;
      min-height: 0;
      flex: 1 1 auto;

      display: flex;
      align-items: center;
      justify-content: center;

      box-sizing: border-box;
      overflow: hidden;
    }

    .curve-art img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;

      display: block;
      object-fit: contain;
      object-position: center;
    }

    .curve-art svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    /* Answer stays visible at all sizes */
    .curve-cell .blank {
      width: min(520px, 86%) !important;
      min-width: 0;
      min-height: clamp(40px, 6vh, 60px);
      max-height: 64px;

      flex: 0 0 auto;

      font-size: clamp(21px, 2.2vw, 32px);
      box-sizing: border-box;
      text-transform: uppercase;
    }

    /* =========================================================
       LARGE MONITORS
       ========================================================= */

    @media (min-width: 1600px) {
      .curve-cell {
        width: min(900px, 94%);
        gap: clamp(8px, 1.1vh, 14px);
      }

      .curve-art {
        width: min(760px, 88%);
        height: min(54vh, 500px);
      }

      .curve-cell .blank {
        width: min(600px, 78%) !important;
        min-height: 58px;
        max-height: 68px;
        font-size: 36px;
      }
    }

    /* =========================================================
       NORMAL DESKTOP / LAPTOP
       ========================================================= */

    @media (min-width: 1100px) and (max-width: 1599px) {
      .curve-cell {
        width: min(720px, 94%);
        gap: clamp(5px, 1vh, 11px);
      }

      .curve-art {
        width: min(620px, 88%);
        height: min(48vh, 350px);
      }

      .curve-cell .blank {
        width: min(500px, 78%) !important;
        min-height: 46px;
        max-height: 56px;
        font-size: 28px;
      }
    }

    /* 1366×768 / 1280×720 and similar short laptop screens */
    @media (min-width: 1100px) and (max-height: 800px) {
      .board {
        padding: 5px 12px;
      }

      .curve-cell {
        gap: 5px;
      }

      .curve-art {
        width: min(590px, 84%);
        height: min(43vh, 300px);
      }

      .curve-cell .blank {
        min-height: 44px;
        max-height: 52px;
        font-size: 26px;
      }
    }

    @media (min-width: 1100px) and (max-height: 680px) {
      .curve-art {
        height: min(38vh, 245px);
      }

      .curve-cell .blank {
        min-height: 40px;
        max-height: 48px;
        font-size: 24px;
      }
    }

    /* =========================================================
       TABLET
       ========================================================= */

    @media (min-width: 601px) and (max-width: 1099px) {
      .curve-cell {
        width: 92%;
        gap: clamp(5px, 1vh, 9px);
      }

      .curve-art {
        width: min(560px, 90%);
        height: min(44vh, 300px);
      }

      .curve-cell .blank {
        width: min(430px, 78%) !important;
        min-height: 43px;
        max-height: 52px;
        font-size: 25px;
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 820px) {
      html,
      body {
        overflow: hidden !important;
      }

      .stage {
        height: 100vh;
        min-height: 0;
        padding: 8px;
      }

      .quiz {
        height: 100%;
        min-height: 0;
        padding: 10px 10px 8px;
      }

      .board {
        min-height: 0;
        overflow: hidden !important;
        padding: 5px 7px;
      }

      .curve-row {
        height: 100%;
        min-height: 0;
      }

      .curve-cell {
        width: 100%;
        height: 100%;
        gap: 5px;
      }

      .curve-art {
        width: 94%;
        height: min(43vh, 250px);
      }

      .curve-cell .blank {
        width: min(88%, 400px) !important;
        min-height: 40px;
        max-height: 48px;
        font-size: 22px;
      }
    }

    @media (max-width: 600px) {
      .curve-art {
        width: 96%;
        height: min(40vh, 225px);
      }

      .curve-cell .blank {
        width: 88% !important;
        min-height: 40px;
        max-height: 46px;
        font-size: 21px;
      }
    }

    @media (max-width: 380px) {
      .curve-art {
        width: 98%;
        height: min(36vh, 190px);
      }

      .curve-cell .blank {
        width: 90% !important;
        min-height: 38px;
        max-height: 44px;
        font-size: 20px;
      }
    }

    /* =========================================================
       SHORT MOBILE
       ========================================================= */

    @media (max-width: 820px) and (max-height: 700px) {
      .curve-cell {
        gap: 3px;
      }

      .curve-art {
        height: min(38vh, 205px);
      }

      .curve-cell .blank {
        min-height: 38px;
        max-height: 44px;
        font-size: 20px;
      }
    }

    /* =========================================================
       KEEP QUIZ CONTROLS FROM CREATING EXTRA BOARD HEIGHT
       ========================================================= */

    .hint {
      flex: 0 0 auto;
      margin-top: clamp(4px, 1vh, 10px);
    }

    .nav {
      flex: 0 0 auto;
      margin-top: 6px;
      padding-top: 8px;
    }

    .msg {
      flex: 0 0 auto;
    }

    /* The exercise board itself must never become a scroll container */
    .board::-webkit-scrollbar {
      display: none;
    }

    .board {
      scrollbar-width: none;
      overscroll-behavior: none;
    }
  </style>
</head>

<body>

  <script src="../assets/confetti.js?v=3"></script>
  <script src="../assets/quiz.js?v=19"></script>

  <script>
    /* =========================================================
       SECTION 4.3 Q1
       ONE FIGURE PER QUIZ PAGE
       8 FIGURES = 8 SEPARATE QUESTIONS / PAGES
       ========================================================= */

    var INK = '#1F2440';


    /* =========================================================
       SVG PLOTTER
       ========================================================= */

    function plot(fn, t0, t1, close) {

      var steps = 260;
      var d = '';

      for (var i = 0; i <= steps; i++) {

        var t = t0 + (t1 - t0) * i / steps;
        var p = fn(t);

        d += (i ? 'L' : 'M') +
          p[0].toFixed(1) + ',' +
          p[1].toFixed(1);
      }

      if (close) {
        d += 'Z';
      }

      return '<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="' + d +
        '" fill="none" stroke="' + INK +
        '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg>';
    }


    var CX = 100;
    var CY = 75;
    var PI = Math.PI;


    /* =========================================================
       CURVE DATA
       ========================================================= */

    var LOOP_BLOB = plot(function (t) {

      var r = 24 + 52 * Math.cos(t);

      return [
        CX + r * Math.cos(t),
        CY + r * Math.sin(t) * 0.86
      ];

    }, 0, 2 * PI, true);


    var SQUIGGLE = plot(function (t) {

      return [
        CX + 74 * Math.cos(t),
        CY + 40 * Math.sin(2 * t)
      ];

    }, 0.45, 5.35, false);


    var ARC = plot(function (t) {

      return [
        22 + 156 * t,
        122 - 82 * Math.sin(PI * t)
      ];

    }, 0, 1, false);


    var ROSE = plot(function (t) {

      var r = 62 * Math.cos(2 * t);

      return [
        CX + r * Math.cos(t),
        CY + r * Math.sin(t) * 0.85
      ];

    }, 0, 2 * PI, true);


    var EIGHT = plot(function (t) {

      return [
        CX + 74 * Math.cos(t),
        CY + 42 * Math.sin(2 * t)
      ];

    }, 0, 2 * PI, true);


    var TREFOIL = plot(function (t) {

      return [
        CX + 42 * Math.cos(t) + 26 * Math.cos(2 * t),
        CY + (42 * Math.sin(t) - 26 * Math.sin(2 * t)) * 0.82
      ];

    }, 0, 2 * PI, true);


    var OVAL = plot(function (t) {

      return [
        CX + 76 * Math.cos(t),
        CY + 44 * Math.sin(t)
      ];

    }, 0, 2 * PI, true);


    var LEAF = plot(function (t) {

      var r = 48 * (1 + Math.cos(t));

      return [
        CX - 34 + r * Math.cos(t),
        CY + r * Math.sin(t) * 0.78
      ];

    }, 0, 2 * PI, true);


    /* =========================================================
       ANSWER NORMALIZATION
       ========================================================= */

    function tidy(v) {

      return String(v == null ? '' : v)
        .replace(/[\s.,;:!?'"()-]/g, '')
        .toLowerCase();
    }


    /* =========================================================
       ANSWER TYPES
       ========================================================= */

    var CC = {
      answer: 'CC',
      accept: [
        'cc',
        'closed curve'
      ]
    };


    var SCC = {
      answer: 'SCC',
      accept: [
        'scc',
        'simple closed curve'
      ]
    };


    var OC = {
      answer: 'OC',
      accept: [
        'oc',
        'open curve'
      ]
    };


    /* =========================================================
       FIGURES
       ========================================================= */

    var FIGURES = [

      {
        tag: 'a)',
        image: '../assets/img/shape1.png',
        key: CC,
        note:
          'a) is a closed curve, but it crosses over itself, so it is only CC.'
      },

      {
        tag: 'b)',
        image: '../assets/img/shape2.png',
        key: OC,
        note:
          'b) has two loose ends, so it is an open curve.'
      },

      {
        tag: 'c)',
        image: '../assets/img/shape3.png',
        key: OC,
        note:
          'c) is a single arc with two ends — an open curve.'
      },

      {
        tag: 'd)',
        image: '../assets/img/shape4.png',
        key: OC,
        note:
          'd) never joins back up on itself, so it is an open curve.'
      },

      {
        tag: 'e)',
        image: '../assets/img/shape5.png',
        key: CC,
        note:
          'e) is a figure of eight: it closes, but it crosses at the middle, so CC.'
      },

      {
        tag: 'f)',
        image: '../assets/img/shape6.png',
        key: OC,
        note:
          'f) never joins back up on itself, so it is an open curve.'
      },

      {
        tag: 'g)',
        image: '../assets/img/shape7.png',
        key: SCC,
        note:
          'g) closes and never crosses itself — a simple closed curve.'
      },

      {
        tag: 'h)',
        image: '../assets/img/shape8.png',
        key: SCC,
        note:
          'h) closes and never crosses itself — a simple closed curve.'
      }

    ];


    /* =========================================================
       QUIZ
       EVERY FIGURE = ONE QUESTION / ONE PAGE
       ========================================================= */

    Quiz.mount({

      title: 'Open and Closed Curves',

      hint:
        'Write CC for a closed curve, SCC for a simple closed curve (one that never crosses itself) and OC for an open curve.',

      questions: FIGURES.map(function (f) {

        return {

          short: f.tag,

          stem:
            'Which of the following are Closed Curve(CC), Simple Closed Curve(SCC), Open Curve(OC)?',

          praise: f.note,

          build: function (host, Q) {

            var row =
              Q.el('div', 'curve-row');

            var cell =
              Q.el('div', 'curve-cell');


            /* Tag remains hidden because every figure has its own page */
            cell.appendChild(
              Q.el('div', 'curve-tag', f.tag)
            );


            /* Figure */
            var art =
              Q.el('div', 'curve-art');

            var img =
              document.createElement('img');

            img.src = f.image;
            img.alt = f.tag + ' curve';
            img.draggable = false;

            art.appendChild(img);
            cell.appendChild(art);


            /* Answer */
            var box =
              Q.blank(
                f.key.answer,
                {
                  text: true,
                  width: 6,
                  label: f.tag + ' answer'
                }
              );

            box.placeholder = '';


            /* Custom answer checking */
            box._f.correct = function () {

              var typed =
                tidy(box.value);

              return f.key.accept.some(function (ok) {
                return tidy(ok) === typed;
              });

            };


            cell.appendChild(box);
            row.appendChild(cell);
            host.appendChild(row);

          }
        };

      })

    });
  </script>

</body>

</html>
