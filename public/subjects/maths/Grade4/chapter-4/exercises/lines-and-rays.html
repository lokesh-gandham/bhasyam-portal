<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lines and Rays · Chapter 4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/quiz.css?v=16">
  <style>
    /* Enhanced layout & high-curiosity aesthetics */
    .board {
      gap: clamp(12px, 2vh, 22px) !important;
    }

    /* 1. Question Claim placed at TOP above image */
    .claim {
      /* same as every other statement on the site: 30px laptop, 40px monitor */
      font-size: 30px !important;
      line-height: 1.45 !important;
      color: var(--ink);
      background: linear-gradient(145deg, #FFFFFF, #F5F7FF);
      border: 2.5px solid #C9D4FB;
      border-radius: 22px;
      padding: 16px 28px;
      box-shadow: 0 8px 24px rgba(76, 95, 213, 0.08);
      max-width: 920px;
      width: 100%;
    }

    .gap {
      min-width: 14ch;
      border-bottom: 5.5px solid #F4C542;
      background: #FFF9E6;
      border-radius: 10px 10px 0 0;
      padding: 4px 18px;
      display: inline-block;
      text-align: center;
      font-weight: 400;
      transition: all 0.25s ease;
    }

    /* 2. Visual drawing placed BELOW question statement */
    .board>.figure {
      width: min(640px, 85vw);
      max-height: 190px;
      border: 3px solid #DCE3FD;
      border-radius: 22px;
      background: #FFFFFF;
      box-shadow: 0 10px 24px rgba(76, 95, 213, 0.08);
      padding: 10px clamp(12px, 2vw, 24px);
    }

    /* 3. Choice Options - Large, Vibrant & Engaging */
    .field-stack {
      gap: 10px !important;
      width: 100%;
    }

    .field-label {
      font-size: clamp(18px, 2.3vh, 22px) !important;
      color: #3B4474;
      font-weight: 400;
    }

    .choices {
      gap: clamp(12px, 1.8vw, 22px) !important;
      justify-content: center;
    }

    .pick {
      font-size: clamp(21px, min(2.4vw, 3.2vh), 28px) !important;
      font-weight: 400;
      padding: clamp(14px, 1.8vh, 18px) clamp(20px, 2vw, 32px) !important;
      min-width: clamp(160px, 16vw, 210px) !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center !important;
      border-radius: 999px !important;
      color: #242B56;
      background: linear-gradient(180deg, #FFFFFF 0%, #EDF1FE 100%);
      border: 3.5px solid #5C6EE6 !important;
      box-shadow: 0 6px 0 #5C6EE6, 0 10px 22px rgba(76, 95, 213, 0.18) !important;
      cursor: pointer;
      letter-spacing: 0.02em;
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }

    .pick:focus,
    .pick:focus-visible {
      outline: none !important;
      box-shadow: 0 6px 0 #5C6EE6, 0 10px 22px rgba(76, 95, 213, 0.18) !important;
    }

    .pick:hover:not(:disabled) {
      transform: translateY(-4px) scale(1.05) !important;
      background: linear-gradient(180deg, #FFFFFF 0%, #DFE7FF 100%);
      border-color: #4C5FD5 !important;
      box-shadow: 0 8px 0 #4C5FD5, 0 16px 30px rgba(76, 95, 213, 0.28) !important;
      color: #121738;
    }

    .pick:active:not(:disabled) {
      transform: translateY(2px) scale(0.97) !important;
      box-shadow: 0 2px 0 #4C5FD5 !important;
    }

    /* Selected state (.on) */
    .pick.on {
      background: linear-gradient(180deg, #5367EE 0%, #3646C7 100%) !important;
      border-color: #3646C7 !important;
      color: #FFFFFF !important;
      box-shadow: 0 6px 0 #2A3688, 0 12px 24px rgba(54, 70, 199, 0.4) !important;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
      outline: none !important;
    }

    /* Correct state (.good) */
    .pick.good {
      background: linear-gradient(180deg, #22C55E 0%, #15803D 100%) !important;
      border-color: #166534 !important;
      color: #FFFFFF !important;
      box-shadow: 0 6px 0 #14532D, 0 12px 24px rgba(21, 128, 61, 0.4) !important;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
    }

    /* Wrong state (.bad) */
    .pick.bad {
      background: linear-gradient(180deg, #EF4444 0%, #B91C1C 100%) !important;
      border-color: #991B1B !important;
      color: #FFFFFF !important;
      box-shadow: 0 6px 0 #7F1D1D, 0 12px 24px rgba(185, 28, 28, 0.4) !important;
    }

    @media (min-width:1600px) {
      .claim {
        font-size: 40px !important;
      }
    }

    @media (max-height:640px) {
      .claim {
        font-size: 24px !important;
        padding: 10px 20px;
      }
    }
  </style>
</head>

<body>
  <script src="../assets/confetti.js?v=3"></script>
  <script src="../assets/quiz.js?v=19"></script>
  <script>
    /* Section 4.1 — Geometry Statements & Concepts */

    var INK = '#1F2440', BLUE = '#4C5FD5', CORAL = '#F2704A';

    function dot(x, y, c) {
      return '<circle cx="' + x + '" cy="' + y + '" r="8" fill="' + (c || BLUE) + '"/>';
    }
    function tag(x, y, t) {
      return '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-size="26" fill="' + INK + '">' + t + '</text>';
    }
    function arrow(x, y, dir) {           /* dir: -1 points left, 1 points right */
      var t = x + 18 * dir;
      return '<polygon points="' + t + ',' + y + ' ' + x + ',' + (y - 11) + ' ' + x + ',' + (y + 11) + '" fill="' + BLUE + '"/>';
    }
    function seg(x1, y1, x2, y2, c) {
      return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
        '" stroke="' + (c || BLUE) + '" stroke-width="5" stroke-linecap="round"/>';
    }

    var QUESTIONS = [
      {
        short: 'Point',
        stem: 'Correct the statement.',
        art: dot(300, 90) + tag(300, 58, 'Z'),
        text: ['A point', '<span class="gap"></span>', 'the position.'],
        options: ['Might show', 'Shows', 'Hides'],
        answer: 'shows',
        why: 'A point shows the position — it marks a precise location!'
      },
      {
        short: 'Line',
        stem: 'Correct the statement.',
        art: seg(60, 90, 540, 90) + arrow(60, 90, -1) + arrow(540, 90, 1) +
          dot(210, 90) + tag(210, 58, 'M') + dot(390, 90) + tag(390, 58, 'N'),
        text: ['A', '<span class="gap"></span>', 'has no end points and extends endlessly.'],
        options: ['Line segment', 'Ray', 'Line'],
        answer: 'line',
        why: 'A line has no end points and extends endlessly in both directions!'
      },
      {
        short: 'Line segment',
        stem: 'Correct the statement.',
        art: seg(140, 90, 460, 90) + dot(140, 90) + tag(140, 58, 'C') + dot(460, 90) + tag(460, 58, 'D'),
        text: ['A', '<span class="gap"></span>', 'has two end points and can be measured.'],
        options: ['Line segment', 'Line', 'Ray'],
        answer: 'line segment',
        why: 'A line segment has two end points and can be measured.'
      },
      {
        short: 'Intersecting lines',
        stem: 'Correct the statement.',
        art: seg(90, 30, 510, 150) + seg(90, 150, 510, 30) + dot(300, 90, CORAL),
        text: ['Any two lines that cross each other at a point are called', '<span class="gap"></span>', 'lines.'],
        options: ['Parallel', 'Curved', 'Intersecting'],
        answer: 'intersecting',
        why: 'Any two lines that cross each other at a point are called intersecting lines.'
      },
      {
        short: 'Parallel lines',
        stem: 'Correct the statement.',
        art: seg(60, 55, 540, 55) + arrow(60, 55, -1) + arrow(540, 55, 1) +
          seg(60, 125, 540, 125) + arrow(60, 125, -1) + arrow(540, 125, 1),
        text: ['The distance between two', '<span class="gap"></span>', 'lines is the same at any point.'],
        options: ['Parallel', 'Intersecting', 'Slanting'],
        answer: 'parallel',
        why: 'The distance between two parallel lines is the same at any point.'
      }
    ];
    var questions = QUESTIONS.map(function (q) {
      return {
        short: q.short,
        stem: q.stem,
        praise: q.why,
        build: function (host, Q) {
          /* 1. Claim with gap FIRST (Question Statement at TOP) */
          host.appendChild(Q.claim(q.text.map(function (t) {
            return t.indexOf('<span') === 0 ? Q.el('span', 'gap') : t;
          })));

          /* 2. Visual drawing BELOW the question statement */
          host.appendChild(Q.figure('0 0 600 180', q.art));

          /* 3. Choice options below image */
          host.appendChild(Q.choice(q.options, q.answer, { label: 'Which word belongs in the gap?' }));
        }
      };
    });

    Quiz.mount({
      title: 'Lines and Rays',
      hint: 'A point marks a place, a segment has two ends, a ray has one, and a line has none.',
      questions: questions
    });
  </script>
</body>

</html>
