<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parts of a Circle · Chapter 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/quiz.css?v=16">
<style>
/* Capitalise the first letter as the learner types — the answer check is
   case-insensitive, so this is purely cosmetic. */
.blank { text-transform: capitalize; }

/* The picture on the left, the sentence with its blank on the right. */
.question-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 2.6vw, 40px);
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
}

/* the drawing sits straight on the board - no card, no frame */
.figure-img-wrap {
  width: clamp(220px, 24vw, 340px);
  height: clamp(180px, 34vh, 300px);
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.figure-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* the sentence side of the row */
.answer-side {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  gap: clamp(10px, 1.8vh, 18px);
  justify-items: center;
}
.answer-side .claim {
  max-width: none;
  text-align: left;
}

/* ------------------------------------------------------------
   Big monitors (1600px and wider). There is room to spare down
   there, so the drawing grows and the sentence is set at 40px.
   Laptops are below this width and stay exactly as they are.
   ------------------------------------------------------------ */
@media (min-width: 1600px) {
  .question-row {
    max-width: 1560px;
    gap: clamp(40px, 4vw, 80px);
  }
  .figure-img-wrap {
    width: clamp(360px, 32vw, 620px);
    height: clamp(300px, 50vh, 560px);
  }
  .answer-side { gap: 22px; }
  .answer-side .claim { font-size: 40px; line-height: 1.6; }
  .answer-side .blank { min-height: 64px; }
}

@media (max-width: 900px) {
  .question-row { flex-direction: column; gap: 14px; }
  .answer-side .claim { text-align: center; }
  .figure-img-wrap {
    width: clamp(180px, 46vw, 280px);
    height: clamp(100px, 16vh, 160px);
  }
}
</style>
</head>
<body>
<script src="../assets/confetti.js?v=3"></script>
<script src="../assets/quiz.js?v=19"></script>
<script>
/* Section 4.5 — fill in the blanks about the parts of a circle.
   Every blank is typed in by hand; each question has its own picture. */

function imgArt(src) {
  var wrap = document.createElement('div');
  wrap.className = 'figure-img-wrap';
  var img = document.createElement('img');
  img.src = src;
  wrap.appendChild(img);
  return wrap;
}

/* Spaces, full stops and capitals do not matter when the word is checked. */
function tidy(v) {
  return String(v == null ? '' : v)
    .replace(/[\s.,;:!?'"()-]/g, '')
    .toLowerCase();
}

var BLANKS = [
  { text: ['A', 'GAP', 'is a figure bounded by a curve line.'],
    img: '../assets/circle1.png',
    answer: 'circle', width: 12, accept: ['circle', 'a circle'],
    why: 'One closed curved line all the way round — that is a circle.' },

  { text: ['The outer boundary of a circle is called the', 'GAP', 'of a circle.'],
    img: '../assets/circle2.png',
    answer: 'circumference', width: 16, accept: ['circumference', 'the circumference'],
    why: 'The whole boundary line is the circumference.' },

  { text: ['Half of a circle is called', 'GAP', '.'],
    img: '../assets/circle3.png',
    answer: 'semicircle', width: 14, accept: ['semicircle', 'a semicircle', 'semi circle'],
    why: 'A diameter cuts the circle into two semicircles.' },

  { text: ['Any part of a circle is called an', 'GAP', 'of the circle.'],
    img: '../assets/circle4.png',
    answer: 'arc', width: 8, accept: ['arc', 'an arc'],
    why: 'Any piece of the boundary is an arc.' },

  { text: ['The distance from the centre to any point on the circumference of the circle is called', 'GAP', 'of the circle.'],
    img: '../assets/circle5.png',
    answer: 'the radius', width: 13, accept: ['radius', 'the radius', 'a radius'],
    why: 'Every radius of one circle has the very same length.' },

  { text: ['A line segment drawn between two points on the circumference of a circle is called', 'GAP', 'of the circle.'],
    img: '../assets/circle6.png',
    answer: 'a chord', width: 11, accept: ['chord', 'a chord', 'the chord'],
    why: 'A chord joins two points on the boundary.' },

  { text: ['The longest chord passing through the centre of the circle is called', 'GAP', 'of the circle.'],
    img: '../assets/circle7.png',
    answer: 'the diameter', width: 15, accept: ['diameter', 'the diameter', 'a diameter'],
    why: 'The diameter is the longest chord of all, and it is twice the radius.' }
];

var questions = BLANKS.map(function (b, i) {
  return {
    short: 'Q' + (i + 1),
    stem: 'Fill in the blank.',
    praise: b.why,
    build: function (host, Q) {
      var parts = b.text.map(function (t) {
        if (t !== 'GAP') return t;

        var box = Q.blank(b.answer, { text: true, width: b.width, label: 'your answer' });
        box.placeholder = '';
        box._f.correct = function () {
          var typed = tidy(box.value);
          return b.accept.some(function (ok) { return tidy(ok) === typed; });
        };
        return box;
      });

      var side = Q.el('div', 'answer-side');
      side.appendChild(Q.claim(parts));

      var row = Q.el('div', 'question-row');
      if (b.img) row.appendChild(imgArt(b.img));
      row.appendChild(side);
      host.appendChild(row);
    }
  };
});

Quiz.mount({
  title: 'Parts of a Circle',
  hint: 'Centre, radius, diameter, chord, arc and circumference — every one of them lives on the same circle.',
  questions: questions
});
</script>
</body>
</html>
