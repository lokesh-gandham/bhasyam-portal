<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number Patterns · Chapter 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/quiz.css?v=16">
<style>
/* Show one pattern at a time, with its visual on the left and the
   answer sentence on the right, like the Angles exercise. */
.question-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 2.8vw, 42px);
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
}

.pattern-figure {
  width: clamp(280px, 30vw, 460px);
  min-height: auto;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.pattern-image {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  object-fit: contain;
}
.pattern-card {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  font-size: clamp(24px, 2.4vw, 40px);
  line-height: 1.3;
}

.pattern-chip,
.pattern-placeholder {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 2.4em;
  padding: 0.18em 0.45em;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(81, 58, 36, 0.16);
}

.pattern-placeholder {
  color: rgba(66, 53, 41, 0.7);
  background: var(--accent-light);
}

.answer-side {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  gap: clamp(10px, 1.8vh, 20px);
  justify-items: center;
}

.answer-side .claim {
  max-width: none;
  text-align: left;
  font-size: clamp(22px, 2.4vw, 36px);
  line-height: 1.8;
}

.answer-side .blank {
  min-height: 1.8em;
  vertical-align: middle;
  margin: 0 0.12em;
}

.answer-options {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  width: 100%;
}

.answer-choice-group {
  display: grid;
  gap: 6px;
  justify-items: center;
}

.answer-choice-label {
  font-size: clamp(15px, 1.8vh, 19px);
  color: var(--ink);
}

.answer-options .option {
  min-width: 120px;
  padding: 10px 16px;
  border: 2px solid var(--accent-border);
  border-radius: 12px;
  background: var(--accent-light);
  color: var(--ink);
  font-size: clamp(18px, 2vh, 24px);
  cursor: pointer;
}

.answer-options .option:hover:not(:disabled) {
  background: var(--paper);
  border-color: var(--accent);
  transform: translateY(-1px);
}

.answer-options .option:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

@media (min-width: 1600px) {
  .question-row {
    max-width: 1520px;
    gap: clamp(40px, 4vw, 80px);
  }
  .pattern-figure {
    width: clamp(420px, 32vw, 640px);
    min-height: clamp(240px, 32vh, 360px);
  }
  .answer-side .claim {
    font-size: 40px;
    line-height: 2.1;
  }
  .answer-side .blank {
    min-height: 64px;
    margin: 8px 0.12em;
  }
}

@media (max-width: 900px) {
  .question-row {
    flex-direction: column;
    gap: 14px;
  }
  .answer-side .claim { text-align: center; }
  .pattern-figure {
    width: clamp(220px, 54vw, 360px);
    min-height: clamp(120px, 18vh, 180px);
  }
}
</style>
</head>
<body>
<script src="../assets/confetti.js?v=3"></script>
<script src="../assets/quiz.js?v=19"></script>
<script>
function makePatternFigure(Q, row) {
  var figure = Q.el('div', 'pattern-figure');

  var img = document.createElement('img');
  img.src = '../assets/img/name.png';
  img.alt = 'Number pattern';
  img.className = 'pattern-image';

  figure.appendChild(img);
  return figure;
}

var ROWS = [
  {
    tag: 'a)',
    seq: [240, 120, '?', '?', 15],
    answers: ['60', '30'],
    options: [[ '50', '60','70'], ['30', '25', '35']],
    why: 'a) halves each time: 240, 120, 60, 30, 15.'
  },
  {
    tag: 'b)',
    seq: [15, 22, 29, 36, 43, '?', 57, 64, 71, 78, 85, '?'],
    answers: ['50', '92'],
    options: [['50', '49', '51'], [ '91', '93','92']],
    why: 'b) adds 7 each time, so 43 + 7 = 50 and 85 + 7 = 92.'
  }
];

function addAnswerOptions(Q, side, boxes, options) {
  options.forEach(function (choices, boxIndex) {
    var group = Q.el('div', 'answer-choice-group');
    group.appendChild(Q.el('div', 'answer-choice-label', 'Choose value ' + (boxIndex + 1)));
    var optionRow = Q.el('div', 'answer-options');

    choices.forEach(function (value) {
      var option = Q.el('button', 'option', value);
      option.type = 'button';
      option.addEventListener('click', function () {
        var box = boxes[boxIndex];
        box.value = value;
        box.dispatchEvent(new Event('input', { bubbles: true }));
      });
      optionRow.appendChild(option);
    });

    var originalMark = boxes[boxIndex]._f.mark;
    boxes[boxIndex]._f.mark = function (state) {
      originalMark(state);
      if (state === 'good') {
        Array.prototype.forEach.call(optionRow.querySelectorAll('.option'), function (choice) {
          choice.disabled = true;
        });
      }
    };

    group.appendChild(optionRow);
    side.appendChild(group);
  });
}

var questions = ROWS.map(function (row) {
  return {
    short: row.tag,
    stem: 'Find the missing value in the number pattern.',
    praise: row.why,
    build: function (host, Q) {
      var boxes = row.answers.map(function (answer) {
        var box = Q.blank(answer, {
          width: Math.max(answer.length + 2, 5),
          label: row.tag + ' missing value'
        });
        box.readOnly = true;
        box.placeholder = '';
        return box;
      });

      var parts = [row.tag + ' '];
      var answerIndex = 0;
      row.seq.forEach(function (item, i) {
        parts.push(item === '?' ? boxes[answerIndex++] : String(item));
        if (i < row.seq.length - 1) parts.push(', ');
      });

      var side = Q.el('div', 'answer-side');
      side.appendChild(Q.claim(parts));
      addAnswerOptions(Q, side, boxes, row.options);

      var rowWrap = Q.el('div', 'question-row');
      rowWrap.appendChild(makePatternFigure(Q, row));
      rowWrap.appendChild(side);
      host.appendChild(rowWrap);
    }
  };
});

Quiz.mount({
  title: 'Number Patterns',
  hint: 'Find what changes from one number to the next, then use the same change to fill the boxes.',
  questions: questions
});
</script>
</body>
</html>
