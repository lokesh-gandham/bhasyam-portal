<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number Patterns · Chapter 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/quiz.css?v=16">
<style>
/* every part of the question on one board, one line each — the book's layout.
   The block hugs its widest line, so the board centres the whole question. */
.pattern-list {
  display: grid;
  gap: clamp(12px, 3vh, 34px);
  width: max-content;
  max-width: 100%;
  --q: 30px;
}

.pattern-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4em;
  font-size: var(--q);
  line-height: 1.25;
  color: var(--ink);
}
/* Question heading: 30px on laptops, 40px on monitors — even on short
   windows where the shared rule would otherwise shrink it. */
.stem { font-size: 30px !important; }
@media (min-width: 1600px) { .stem { font-size: 40px !important; } }

.pattern-line .tag { min-width: 2.1em; }
/* Hold the input a step smaller than the line text with room top and
   bottom so the value stays centred. content-box so the ch width the
   script sets is the room for the digits — padding and border sit
   outside it and can never clip the answer. */
.pattern-line .blank {
  display: inline-block;
  text-align: center;
  vertical-align: middle;
  font-size: 0.8em;
  line-height: 1.2;
  min-height: 1.7em;
  box-sizing: content-box;
  min-width: 3.5ch;
  padding: 0.15em 0.65em;
}

.pattern-line .row-tick {
  display: inline-flex;
  align-items: center;
  gap: 0.3em;
  margin-left: 0.5em;
  font-size: 0.6em;
  color: var(--green, #2FB57C);
  white-space: nowrap;
}
.pattern-line .row-tick::before { content: "✓"; font-size: 1.2em; line-height: 1; }
.pattern-line .row-tick[hidden] { display: none; }

/* The number text is fixed: 30px on laptops, 40px on monitors. On short
   windows the ROW GAPS and the input box tighten instead, and the board
   scrolls if it still needs to — the digits never shrink. */
@media (min-width: 1600px) { .pattern-list { --q: 40px; gap: 34px; } }
@media (max-height: 780px) {
  .pattern-list { gap: 14px; }
  .pattern-line .blank { min-height: 1.5em; padding: 0.1em 0.6em; }
}
@media (max-height: 660px) {
  .pattern-list { gap: 8px; }
}
@media (max-width: 820px) { .pattern-list { --q: 18px; gap: 8px; } }
</style>
</head>
<body>
<script src="../assets/confetti.js?v=3"></script>
<script src="../assets/quiz.js?v=19"></script>
<script>
/* Section 4.8 Q3 — "Find the missing value in the number pattern."
   Both parts of the book sit on the same board. */

/* Add a "✓ correct" flag to the right of a row, lit only when every box
   on that row is marked good. */
function markRowTick(Q, line, boxes) {
  var tick = Q.el('span', 'row-tick', 'correct');
  tick.hidden = true;
  line.appendChild(tick);
  boxes.forEach(function (box) {
    var orig = box._f.mark;
    box._f.mark = function (state) {
      orig(state);
      tick.hidden = !boxes.every(function (b) { return b.classList.contains('good'); });
    };
  });
}

var ROWS = [
  { tag: 'a)',
    seq: [240, 120, '?', '?', 15],
    answers: ['60', '30'],
    why: 'a) halves each time: 240, 120, 60, 30, 15.' },

  { tag: 'b)',
    seq: [15, 22, 29, 36, 43, '?', 57, 64, 71, 78, 85, '?'],
    answers: ['50', '92'],
    why: 'b) adds 7 each time, so 43 + 7 = 50 and 85 + 7 = 92.' }
];

Quiz.mount({
  title: 'Number Patterns',
  hint: 'Find what changes from one number to the next, then use the same change to fill the boxes.',
  questions: [{
    short: 'Q3',
    stem: 'Find the missing value in the number pattern.',
    praise: ROWS.map(function (r) { return r.why; }).join(' '),
    build: function (host, Q) {
      var list = Q.el('div', 'pattern-list');

      ROWS.forEach(function (row) {
        var line = Q.el('div', 'pattern-line');
        line.appendChild(Q.el('span', 'tag', row.tag));

        var made = 0;
        var lineBoxes = [];
        row.seq.forEach(function (item, i) {
          if (item === '?') {
            var ans = row.answers[made++];
            var box = Q.blank(ans, { width: ans.length + 2, label: row.tag + ' missing value' });
            box.placeholder = '';
            lineBoxes.push(box);
            line.appendChild(box);
          } else {
            var last = i === row.seq.length - 1;
            line.appendChild(Q.el('span', 'num', item + (last ? '' : ',')));
          }
        });

        markRowTick(Q, line, lineBoxes);
        list.appendChild(line);
      });

      host.appendChild(list);
    }
  }]
});
</script>
</body>
</html>
