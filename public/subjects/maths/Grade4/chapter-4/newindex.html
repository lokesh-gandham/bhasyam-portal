<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Number Kingdom · Class 4 Maths · Chapter 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#4C5FD5; --brand-dark:#3A49AE; --brand-light:#EDEFFC;
  --amber:#F4C542; --amber-dark:#B98D0C; --amber-light:#FFF7E0;
  --coral:#F2704A;
  --ink:#1F2440;   --ink-soft:#4A5178;
  --paper:#FFFFFF; --line:#DFE3F2;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
*{ font-family:'Livvic', sans-serif; font-weight:400; font-style:normal; }

body{
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 8%,   rgba(244,197,66,.20), transparent 28%),
    radial-gradient(circle at 92% 12%, rgba(76,95,213,.16), transparent 26%),
    radial-gradient(circle at 86% 92%, rgba(242,112,74,.12), transparent 28%),
    linear-gradient(150deg,#FFFDF6 0%,#F7F8FE 55%,#F2F6FF 100%);
  background-attachment:fixed;
  min-height:100vh;
  padding:clamp(14px,2.2vw,26px);
  display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
body::before, body::after{
  content:""; position:fixed; z-index:-1; pointer-events:none;
  border-radius:45% 55% 60% 40%;
}
body::before{
  width:230px; height:230px; left:-70px; bottom:-60px;
  background:linear-gradient(145deg, rgba(244,197,66,.32), rgba(242,112,74,.18));
  transform:rotate(18deg);
}
body::after{
  width:250px; height:250px; right:-90px; top:-80px;
  background:linear-gradient(145deg, rgba(76,95,213,.24), rgba(138,107,226,.16));
  transform:rotate(-24deg);
}
.wrap{ width:100%; max-width:1240px; display:flex; flex-direction:column; }

.hero{
  background:var(--paper); border:2px solid var(--line); border-radius:22px;
  padding:clamp(18px,2.4vw,28px) clamp(20px,3vw,38px);
  display:flex; align-items:center; justify-content:space-between;
  gap:22px; flex-wrap:wrap;
  box-shadow:0 10px 32px rgba(76,95,213,.10);
}
.eyebrow{
  display:block; font-size:16.5px; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;
}
.hero h1{ font-size:51px; line-height:1.05; letter-spacing:-0.02em; }
.hero h1 em{ color:var(--brand); font-style:normal; }

.tiles{ display:flex; gap:12px; flex-wrap:wrap; }
.tile{
  min-width:104px; text-align:center; padding:12px 18px; border-radius:16px;
  background:linear-gradient(160deg,var(--brand-light),#DDE1FA);
  border:2px solid var(--brand);
  box-shadow:0 5px 0 var(--brand-dark),0 10px 20px rgba(76,95,213,.18);
}
.tile.alt{
  background:linear-gradient(160deg,var(--amber-light),#FFE7C2);
  border-color:var(--amber);
  box-shadow:0 5px 0 var(--amber-dark),0 10px 20px rgba(244,197,66,.18);
}
.tile b{ display:block; font-size:34px; line-height:1; color:var(--brand-dark); }
.tile.alt b{ color:var(--amber-dark); }
.tile span{ display:block; margin-top:4px; font-size:14px; color:var(--ink-soft); }

.section-head{ display:flex; align-items:center; gap:14px; margin:clamp(18px,2.6vw,28px) 2px 14px; }
.section-head h2{ font-size:20px; white-space:nowrap; }
.section-head .rule{ flex:1; height:2px; background:var(--line); border-radius:2px; }

.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }

.card{
  display:flex; flex-direction:column;
  background:var(--paper); border:2px solid var(--line); border-radius:20px;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(76,95,213,.10);
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.card:hover,.card:focus-within{
  transform:translateY(-5px); border-color:var(--brand);
  box-shadow:0 14px 34px rgba(76,95,213,.20);
}
.preview{
  height:132px; padding:14px;
  background:linear-gradient(160deg,#F4F6FF,#EDEFFC);
  border-bottom:2px solid var(--line);
  display:grid; place-items:center;
}
.preview svg{ width:100%; height:100%; }

.body{ padding:16px 18px 18px; flex:1; display:flex; flex-direction:column; }
.top{ display:flex; align-items:center; gap:11px; }
.num{
  flex:none; display:grid; place-items:center; width:34px; height:34px;
  border-radius:11px; background:var(--brand-light); border:2px solid var(--brand);
  color:var(--brand-dark); font-size:16px;
}
.card h3{ font-size:19px; line-height:1.25; }
.card p{ margin-top:8px; font-size:16px; line-height:1.5; color:var(--ink-soft); flex:1; }

.play{
  margin-top:14px;
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  padding:13px 18px; border-radius:13px;
  border:2.5px solid var(--brand-dark);
  background:linear-gradient(180deg,#5A6CE0,var(--brand));
  color:#fff; font:inherit; font-size:17px; text-decoration:none;
  box-shadow:0 5px 0 var(--brand-dark),0 9px 18px rgba(76,95,213,.26);
  transition:transform .15s ease, box-shadow .15s ease;
}
.play:hover{ transform:translateY(-2px); box-shadow:0 7px 0 var(--brand-dark),0 13px 22px rgba(76,95,213,.3); }
.play:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--brand-dark); }
.play svg{ width:13px; height:13px; fill:currentColor; }

@media (max-width:1000px){ .grid{ grid-template-columns:repeat(2,1fr); } }
/* ------------------------------------------------------------
   Big monitors (1600px and wider) — laptops are untouched.
   The page keeps its centred column but the column grows, so the
   cards, pictures and words fill the extra room instead of
   leaving wide empty margins on either side.
   ------------------------------------------------------------ */
@media (min-width:1600px){
  .wrap{ max-width:min(1760px,94vw); }
  .hero h1{ font-size:68px; }
  .eyebrow{ font-size:22px; }
  .section-head h2{ font-size:25px; }
  .grid{ grid-template-columns:repeat(4,1fr); gap:26px; }
  .preview{ height:180px; }
  .card h3{ font-size:24px; }
  .card p{ font-size:18px; }
  .num{ width:42px; height:42px; border-radius:13px; font-size:19px; }
  .play{ font-size:20px; padding:16px 20px; }
}
@media (max-width:640px){
  .grid{ grid-template-columns:1fr; }
  .hero{ text-align:center; flex-direction:column; }
  .tiles{ justify-content:center; }
  .hero h1{ font-size:34px; }
}
</style>
<style>
#backBtn{display:none;align-items:center;gap:8px;border:2px solid var(--line);background:var(--brand-light);padding:11px 20px;border-radius:999px;font-size:15px;color:var(--brand-dark);cursor:pointer;box-shadow:0 5px 0 var(--brand-dark);transition:.12s}
#backBtn:hover{transform:translateY(-2px)}
#backBtn:active{transform:translateY(1px);box-shadow:0 2px 0 var(--brand-dark)}
#homeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:22px}
.pack{text-align:left;cursor:pointer;border:2px solid var(--line);border-radius:20px;background:var(--paper);padding:22px 20px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(76,95,213,.10);transition:.18s;color:var(--ink)}
.pack:hover{transform:translateY(-5px);border-color:var(--pack-c);box-shadow:0 14px 30px rgba(76,95,213,.18)}
.pack::after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-42px;bottom:-50px;background:var(--pack-c);opacity:.12;pointer-events:none}
.pack-num{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;margin-bottom:14px;background:var(--pack-soft);border:2px solid var(--pack-c);color:var(--pack-c);font-size:16px}
.pack h3{font-size:22px;line-height:1.25;margin-bottom:7px}
.pack p{font-size:15px;color:var(--ink-soft);line-height:1.45;min-height:64px}
.pack-count{display:inline-block;margin-top:15px;font-size:13px;padding:7px 13px;border-radius:999px;background:var(--pack-soft);color:var(--pack-c)}
#packView{display:none}
.pack-banner{border-radius:20px;padding:22px 26px;margin-top:22px;margin-bottom:18px;color:#fff;display:flex;align-items:center;gap:16px;background:var(--pack-c)}
.pack-banner .pnum{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.pack-banner h2{font-size:25px;margin-bottom:3px}.pack-banner p{font-size:14px;opacity:.94}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);background:var(--ink);color:#fff;font-size:15px;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1000px){#homeGrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){#homeGrid{grid-template-columns:1fr}.hero{flex-wrap:wrap}#backBtn{order:-1}.pack-banner{padding:18px}.pack-banner h2{font-size:21px}}
@media(min-width:1600px){#homeGrid{gap:26px}.pack{padding:28px 24px}.pack h3{font-size:27px}.pack p{font-size:18px}.pack-num{width:46px;height:46px;font-size:19px}.pack-count{font-size:15px}.pack-banner h2{font-size:31px}}
</style>

</head>

const homeGrid=document.getElementById('homeGrid');
const homeHeading=document.getElementById('homeHeading');
const packView=document.getElementById('packView');
const sectionsRoot=document.getElementById('sections');
const packBanner=document.getElementById('packBanner');
const backBtn=document.getElementById('backBtn');

function byId(id){return ACTIVITIES.find(a=>a.id===id);}

function openPack(packId){
 const pack=PACKS.find(p=>p.id===packId); if(!pack)return;
 homeGrid.style.display='none'; homeHeading.style.display='none';
 packView.style.display='block'; backBtn.style.display='inline-flex';
 packBanner.style.background=`var(--brand)`;
 packBanner.innerHTML=`<span class="pnum">${pack.id}</span><div><h2>${pack.title}</h2><p>${pack.blurb}</p></div>`;
 sectionsRoot.innerHTML=pack.ids.map((id,idx)=>{
   const a=byId(id);
   return ORIGINAL_CARDS[id]
    .replace(/<span class="num">\d+<\/span>/,`<span class="num">${idx+1}</span>`)
    .replace(/<a class="play" href="([^"]+)">([\s\S]*?)<\/a>/,`<button class="play" type="button" data-id="${a.id}">$2</button>`);
 }).join('');
 window.scrollTo({top:0,behavior:'smooth'});
}

function showHome(){
 homeGrid.style.display='grid'; homeHeading.style.display='flex';
 packView.style.display='none'; backBtn.style.display='none';
 window.scrollTo({top:0,behavior:'smooth'});
}

homeGrid.addEventListener('click',e=>{
 const b=e.target.closest('.pack'); if(b)openPack(Number(b.dataset.pack));
});
backBtn.addEventListener('click',showHome);

packView.addEventListener('click',e=>{
 const b=e.target.closest('.play'); if(!b)return;
 const a=byId(b.dataset.id); if(!a)return;
 sessionStorage.setItem('scrollToCard',a.id);
 location.href=a.href;
});

(function restoreScroll(){
 const id=sessionStorage.getItem('scrollToCard'); if(!id)return;
 sessionStorage.removeItem('scrollToCard');
 const pack=PACKS.find(p=>p.ids.includes(id)); if(!pack)return;
 openPack(pack.id);
 const b=sectionsRoot.querySelector(`.play[data-id="${id}"]`);
 if(b){const card=b.closest('.card');if(card)setTimeout(()=>card.scrollIntoView({block:'center'}),60);}
})();
</script>
