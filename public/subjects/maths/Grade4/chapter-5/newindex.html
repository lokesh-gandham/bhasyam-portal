<style>
:root{
  --brand:#7C3AED;     --brand-dark:#6D28D9;  --brand-light:#F5F3FF;
  --amber:#EF9F2B;     --amber-dark:#C57C10;  --amber-light:#FFF4E2;
  --plum:#8B5CF6;      --plum-dark:#6D28D9;   --plum-light:#F5F3FF;
  --ink:#2D241E;       --ink-soft:#5C4D42;
  --paper:#FFFFFF;     --line:#F3E8DC;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

/* Livvic weight 400 only — no bold text anywhere */
*{ font-family:'Livvic'; font-weight:400; font-style:normal; }

body{ color:var(--ink);
  /* background:
    radial-gradient(circle at 8% 8%,   rgba(251,191,36,.15), transparent 32%),
    radial-gradient(circle at 92% 14%, rgba(249,115,22,.10), transparent 28%),
    radial-gradient(circle at 85% 90%, rgba(168,85,247,.10), transparent 30%),
    linear-gradient(150deg, #FFFDF9 0%, #FFF8EF 50%, #FAF4EB 100%); */

    background-color: #ffffff;
  background-attachment:fixed;
  min-height:100vh;
  padding:clamp(14px,2.2vw,26px);
  display:flex; justify-content:center;
  -webkit-font-smoothing:antialiased;
}


.wrap{ width:100%; max-width:1240px; display:flex; flex-direction:column; }

/* ---------------- hero ---------------- */
.hero{
  /* background:#FFFFFF;
  border:2.5px solid #F3E8DC; border-radius:24px; */
  padding:clamp(18px,2.4vw,28px) clamp(20px,3vw,38px);
  display:flex; align-items:center; justify-content:space-between;
  gap:22px; flex-wrap:wrap;
  /* box-shadow:0 12px 32px rgba(180,83,9,.08); */
}
.eyebrow{
  display:block; font-size:16.5px; letter-spacing:0.12em;
  text-transform:uppercase;  margin-bottom:6px;
}
.hero h1{ font-size:51px; line-height:1.05; letter-spacing:-0.02em; color:var(--ink); font-weight: 400; }
/* .hero h1 em{ color:var(--brand); } */

.tiles{ display:flex; gap:12px; flex-wrap:wrap;  }
.tile{
  min-width:104px; text-align:center; padding:12px 18px; border-radius:16px;
  background:#fcfcfc;
  border:2px solid #d4d3d3;
  box-shadow:0 5px 0 #dedede,0 10px 20px rgba(246, 240, 255, 0.18);
}
.tile b{ display:block; font-size:34px; line-height:1; color:#000; }
.tile span{ display:block; margin-top:4px; font-size:14px; color:#000; }

/* ---------------- section ---------------- */
.section-head{ display:flex; align-items:center; gap:14px; margin:clamp(18px,2.6vw,28px) 2px 14px; }
.section-head h2{ font-size:20px; white-space:nowrap; color:var(--ink); }
/* .section-head .rule{ flex:1; height:2px; background:#F3E8DC; border-radius:2px; } */

/* ---------------- cards ---------------- */
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }

.card{
  display:flex; flex-direction:column;
  background:#FFFFFF;
  border:2.5px solid #F3E8DC; border-radius:22px;
  overflow:hidden;
  box-shadow:0 10px 28px rgba(180,83,9,.07);
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.card:hover,.card:focus-within{
  transform:translateY(-5px); border-color:rgb(244, 255, 244);
  box-shadow:0 18px 40px rgba(124,58,237,.18);
}
.preview{
  height:132px; padding:14px;
  /* background:linear-gradient(160deg,#FFFDF9,#FFF3E4);
  border-bottom:2px solid var(--line); */
  background-color: #fff;
  display:grid; place-items:center;
}
.preview svg{ width:100%; height:100%; }

.body{ padding:16px 18px 18px; flex:1; display:flex; flex-direction:column; }
.top{ display:flex; align-items:center; gap:11px; }
.num{
  flex:none; display:grid; place-items:center; width:34px; height:34px;
  border-radius:11px; background:var(--brand-light); border:2px solid var(--brand);
  color:var(--brand-dark); font-size:16px;
}
.card h3{ font-size:19px; line-height:1.25; color:var(--ink); }
.card p{ margin-top:8px; font-size:16px; line-height:1.5; color:var(--ink-soft); flex:1; }

.play{
  margin-top:14px;
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  padding:13px 18px; border-radius:13px;
  border:2.5px solid var(--pack-border);
  background:var(--pack-bg);
  color:var(--pack-text);
  font:inherit; font-size:17px; text-decoration:none;
  box-shadow:0 5px 0 var(--pack-shadow),0 9px 18px rgba(80,60,90,.12);
  transition:transform .15s ease, box-shadow .15s ease;
}
.play:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 0 var(--pack-shadow),0 13px 22px rgba(80,60,90,.16);
}
.play:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 var(--pack-shadow);
}
.play svg{ width:13px; height:13px; fill:currentColor; }

/* ------------------------------------------------------------
   Big monitors (1600px and wider) — laptops are untouched.
   The page keeps its centred column but the column grows, so the
   cards, pictures and words fill the extra room instead of
   leaving wide empty margins on either side.
   ------------------------------------------------------------ */
@media (min-width:1600px){
  .wrap{ max-width:min(1760px,94vw); }
  .hero h1{ font-size:68px; }
  .eyebrow{ font-size:22px; }
  .section-head h2{ font-size:25px; }
  .grid{ grid-template-columns:repeat(4,1fr); gap:26px; margin-top: 30px; }
  .preview{ height:180px; }
  .card h3{ font-size:24px; }
  .card p{ font-size:18px; }
  .num{ width:42px; height:42px; border-radius:13px; font-size:19px; }
  .play{ font-size:20px; padding:16px 20px; }
}

@media (max-width:1000px){ .grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:640px){
  .grid{ grid-template-columns:1fr; }
  .hero{ text-align:center; flex-direction:column; }
  .tiles{ justify-content:center; }
  .hero h1{ font-size:34px; }
}
</style>
<style>
/* ===== Chapter 5 · 3 Part Navigation ===== */
#backBtn{
  display:none;
  align-items:center;
  gap:8px;
  border:2px solid var(--line);

  padding:11px 20px;
  border-radius:999px;
  height: 46px;
  width: 110px;
  font:inherit;
  font-size:15px;
  color:#0a0a0a;
  cursor:pointer;

  left: 5px;

#backBtn:active{transform:translateY(1px);box-shadow:0 2px 0 var(--brand-dark)}

#homeGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
  margin-top:22px;
}

.pack{
  appearance:none;
  width:100%;
  min-height:220px;
  text-align:left;
  cursor:pointer;
  border:2.5px solid var(--line);
  border-radius:22px;
  background:#fff;
  padding:24px 22px;
  position:relative;
  overflow:hidden;
  color:var(--ink);
  box-shadow:0 10px 28px rgba(180,83,9,.07);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.pack:hover{
  transform:translateY(-5px);
  border-color:var(--pack-c);
  box-shadow:0 18px 40px rgba(124,58,237,.16);
}
.pack:active{transform:translateY(-1px)}
.pack::after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  right:-45px;
  bottom:-65px;
  border-radius:50%;
  background:var(--pack-c);
  opacity:.12;
  pointer-events:none;
}
.pack-num{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  border-radius:13px;
  margin-bottom:16px;
  background:var(--pack-soft);
  border:2px solid var(--pack-c);
  color:var(--pack-c);
  font-size:17px;
}
.pack h3{
  font-size:23px;
  line-height:1.25;
  margin-bottom:8px;
}
.pack p{
  font-size:16px;
  line-height:1.5;
  color:var(--ink-soft);
  min-height:72px;
}
.pack-count{
  display:inline-block;
  margin-top:15px;
  padding:8px 14px;
  border-radius:999px;
  background:var(--pack-soft);
  color:#242323;
  font-size:14px;
}

#packView{display:none}

.pack-banner{
  margin:22px 0 18px;
  padding:21px 25px;
  border-radius:22px;
  background:var(--pack-bg);
  border:2px solid var(--pack-border);
  color:var(--pack-text);
  display:flex;
  align-items:center;
  gap:15px;
  box-shadow:0 7px 0 var(--pack-shadow),0 12px 24px rgba(80,60,90,.10);
}
.pack-banner .pnum{
  flex:none;
  width:45px;
  height:45px;
  border-radius:13px;
  background:rgba(255,255,255,.48);
  border:2px solid rgba(255,255,255,.62);
  display:grid;
  place-items:center;
  font-size:18px;
  color:var(--pack-text);
}
.pack-banner h2{
  font-size:25px;
  line-height:1.2;
  margin-bottom:4px;
}
.pack-banner p{
  font-size:14px;
  opacity:.95;
}

@media(max-width:1000px){
  #homeGrid{grid-template-columns:repeat(3,1fr);gap:18px}
  .pack{padding:20px 17px}
  .pack h3{font-size:20px}
  .pack p{font-size:14px}
}
@media(max-width:700px){
  #homeGrid{grid-template-columns:1fr}
  .pack{min-height:auto}
  #backBtn{order:-1}
  .pack-banner{padding:18px}
  .pack-banner h2{font-size:21px}
}
@media(min-width:1600px){
  #homeGrid{gap:26px}
  .pack{min-height:290px;padding:30px 26px}
  .pack h3{font-size:32px}
  .pack p{font-size:20px}
  .pack-num{width:48px;height:48px;font-size:20px}
  .pack-count{font-size:18px}
  .pack-banner h2{font-size:31px}
}
</style>

const homeGrid=document.getElementById('homeGrid');
const homeHeading=document.getElementById('homeHeading');
const packView=document.getElementById('packView');
const sectionsRoot=document.getElementById('sections');
const packBanner=document.getElementById('packBanner');
const backBtn=document.getElementById('backBtn');

function byId(id){
  return ACTIVITIES.find(a=>a.id===id);
}

function openPack(packId){
  const pack=PACKS.find(p=>p.id===packId);
  if(!pack)return;

  homeGrid.style.display='none';
  homeHeading.style.display='none';
  packView.style.display='block';
  backBtn.style.display='inline-flex';

  const pastel={
    1:{bg:"#E7DDF7",border:"#CBB9E5",shadow:"#A18DBD",text:"#5B4772"},
    2:{bg:"#F8E8BC",border:"#E4CB8A",shadow:"#B89E5D",text:"#6F5A2B"},
    3:{bg:"#DDEEDB",border:"#B8D5B2",shadow:"#8FAE88",text:"#486246"}
  }[pack.id];

  packView.style.setProperty("--pack-bg",pastel.bg);
  packView.style.setProperty("--pack-border",pastel.border);
  packView.style.setProperty("--pack-shadow",pastel.shadow);
  packView.style.setProperty("--pack-text",pastel.text);

  packBanner.innerHTML=
    '<span class="pnum">'+pack.id+'</span>'+
    '<div><h2>'+pack.title+'</h2><p>'+pack.desc+'</p></div>';

  sectionsRoot.innerHTML=pack.ids.map((id,index)=>{
    const activity=byId(id);
    return ORIGINAL_CARDS[id]
      .replace(
        /<span class="num">\d+<\/span>/,
        '<span class="num">'+(index+1)+'</span>'
      )
      .replace(
        /<a class="play" href="([^"]+)">([\s\S]*?)<\/a>/,
        '<button class="play" type="button" data-id="'+activity.id+'">$2</button>'
      );
  }).join('');

  window.scrollTo({top:0,behavior:'smooth'});
}

function showHome(){
  homeGrid.style.display='grid';
  homeHeading.style.display='flex';
  packView.style.display='none';
  backBtn.style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

homeGrid.addEventListener('click',function(e){
  const button=e.target.closest('.pack');
  if(button)openPack(Number(button.dataset.pack));
});

backBtn.addEventListener('click',showHome);

packView.addEventListener('click',function(e){
  const button=e.target.closest('.play');
  if(!button)return;

  const activity=byId(button.dataset.id);
  if(!activity)return;

  sessionStorage.setItem('scrollToCard',activity.id);
  location.href=activity.href;
});

/* Same return-to-card behavior as the reference navigation. */
(function restoreScroll(){
  const id=sessionStorage.getItem('scrollToCard');
  if(!id)return;

  sessionStorage.removeItem('scrollToCard');

  const owningPack=PACKS.find(p=>p.ids.includes(id));
  if(!owningPack)return;

  openPack(owningPack.id);

  const button=sectionsRoot.querySelector('.play[data-id="'+id+'"]');
  if(button){
    const card=button.closest('.card');
    if(card)setTimeout(function(){
      card.scrollIntoView({block:'center',behavior:'smooth'});
    },80);
  }
})();
</script>
