<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>Number Challenge</title>

<style>

/* =========================================
   BASIC
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Livvic",sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at 8% 15%,rgba(255,205,101,.25),transparent 18%),
        radial-gradient(circle at 90% 20%,rgba(101,204,210,.20),transparent 20%),
        linear-gradient(180deg,#edf8f8 0%,#f8f3e7 100%);

    color:#2f4f4f;
}


/* =========================================
   MAIN GAME
========================================= */

.game{
    width:100vw;
    height:100vh;
    overflow:hidden;
    position:relative;
}


/* =========================================
   BACKGROUND DECORATIONS
========================================= */

.cloud{
    position:absolute;
    width:150px;
    height:38px;
    border-radius:100px;
    background:rgba(255,255,255,.50);
    z-index:0;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:inherit;
    border-radius:50%;
}

.cloud::before{
    width:58px;
    height:58px;
    left:25px;
    bottom:8px;
}

.cloud::after{
    width:45px;
    height:45px;
    left:75px;
    bottom:7px;
}

.cloud-left{
    top:14%;
    left:6%;
}

.cloud-right{
    top:25%;
    right:7%;
}


/* =========================================
   HEADER
========================================= */

header{
    height:92px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    z-index:5;
}

.heading{
    font-size:22px;
    font-weight:400;
    color:#2f4f4f;
    text-align:center;
}



/* =========================================
   GAME STAGE
========================================= */

.stage{

    position:absolute;

    top:92px;
    bottom:82px;

    left:0;
    right:0;

    padding:5px 4vw;

    display:flex;
    flex-direction:column;
    align-items:center;

    z-index:2;
}


/* =========================================
   GAME LABEL
========================================= */

.game-label{

    display:flex;
    align-items:center;
    gap:10px;

    padding:9px 24px;

    border-radius:999px;

    background:#fff3cf;

    border:2px solid #e7bb59;

    color:#72562f;

    font-size:18px;
    font-weight:500;

    box-shadow:
        0 6px 0 rgba(194,145,35,.12);

    margin-top:5px;
}


/* =========================================
   QUESTION
========================================= */

.question-area{

    width:100%;

    min-height:130px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:15px 8%;
}

.question{

    text-align:center;

    max-width:1000px;

    font-size:30px;

    font-weight:400;

    line-height:1.35;

    color:#2f4f4f;

    overflow-wrap:anywhere;
}


/* =========================================
   GAME TRACK
========================================= */

.track-area{

    position:relative;

    width:min(1200px,95vw);

    flex:1;

    min-height:260px;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* Main dashed path */

.track-line{

    position:absolute;

    left:7%;
    right:7%;

    top:52%;

    border-top:8px dashed rgba(74,155,158,.38);

    z-index:0;
}


/* =========================================
   START FLAG
========================================= */

.start-point{

    position:absolute;

    left:6%;

    top:50%;

    transform:translateY(-50%);

    z-index:2;

    display:flex;
    flex-direction:column;
    align-items:center;
}

.flag{

    font-size:46px;
}

.point-text{

    margin-top:5px;

    font-size:14px;

    font-weight:500;

    color:#587273;
}


/* =========================================
   GAME CHECKPOINTS
========================================= */

.checkpoint{

    position:absolute;

    width:62px;
    height:62px;

    border-radius:18px;

    display:grid;
    place-items:center;

    background:#fff;

    border:4px solid #efbc61;

    box-shadow:

        0 7px 0 rgba(193,139,32,.13),

        0 12px 22px rgba(50,91,92,.12);

    font-size:29px;

    z-index:2;
}

.cp-one{

    left:25%;

    top:52%;

    transform:translateY(-50%) rotate(-6deg);
}

.cp-two{

    right:25%;

    top:52%;

    transform:translateY(-50%) rotate(6deg);
}


/* =========================================
   ANSWER GATE
========================================= */

.answer-gate{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:min(310px,80vw);

    height:190px;

    border-radius:28px;

    background:

        linear-gradient(
            145deg,
            #e6f8f7,
            #b9e3df
        );

    border:7px solid #4d9e9d;

    box-shadow:

        0 10px 0 rgba(47,112,111,.16),

        0 20px 35px rgba(46,97,98,.18);

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    z-index:3;
}


/* Gate decoration */

.gate-top{

    position:absolute;

    top:-30px;

    padding:7px 18px;

    border-radius:14px;

    background:#fff3ca;

    border:3px solid #e7b75c;

    font-size:24px;

    box-shadow:0 5px 0 rgba(188,130,25,.13);
}


/* Input */

.answer{

    width:178px;
    height:58px;

    border:none;

    outline:none;

    border-radius:16px;

    background:#fff;

    text-align:center;

    font-size:24px;

    color:#2f4f4f;

    box-shadow:

        inset 0 0 0 3px #ef9e57,

        0 6px 0 rgba(185,103,37,.14);

    transition:.2s;
}

.answer:focus{

    transform:scale(1.04);

    box-shadow:

        inset 0 0 0 3px #419b9b,

        0 0 0 7px rgba(65,155,155,.14);
}

.answer.correct{

    background:#effbf3;

    box-shadow:

        inset 0 0 0 4px #55b97f,

        0 6px 0 rgba(35,121,73,.13);
}

.answer.wrong{

    background:#fff4f2;

    box-shadow:

        inset 0 0 0 4px #e56f65;

    animation:shake .35s;
}


@keyframes shake{

    25%{
        transform:translateX(-7px);
    }

    50%{
        transform:translateX(7px);
    }

    75%{
        transform:translateX(-4px);
    }

}


/* Gate text */

.gate-text{

    margin-top:16px;

    font-size:15px;

    font-weight:500;

    color:#3e6869;

    text-align:center;
}


/* =========================================
   FINISH
========================================= */

.finish-point{

    position:absolute;

    right:6%;

    top:50%;

    transform:translateY(-50%);

    z-index:2;

    display:flex;
    flex-direction:column;
    align-items:center;
}

.trophy{

    font-size:48px;
}


/* =========================================
   DECORATIVE STARS
========================================= */

.spark{

    position:absolute;

    font-size:28px;

    color:#f1bd52;

    animation:sparkFloat 2.5s ease-in-out infinite alternate;

    z-index:1;
}

.spark1{
    left:15%;
    top:25%;
}

.spark2{
    right:15%;
    top:28%;
    animation-delay:.7s;
}

.spark3{
    left:37%;
    bottom:15%;
    font-size:22px;
    animation-delay:1.1s;
}

.spark4{
    right:37%;
    bottom:14%;
    font-size:20px;
    animation-delay:1.5s;
}


@keyframes sparkFloat{

    from{
        transform:translateY(0) rotate(-5deg);
    }

    to{
        transform:translateY(-10px) rotate(8deg);
    }

}


/* =========================================
   CONTROLS
========================================= */

.controls{

    position:absolute;

    bottom:0;
    left:0;

    width:100%;
    height:82px;

    z-index:20;

    pointer-events:none;
}

.nav-btn,
.submit-btn{

    position:absolute;

    pointer-events:auto;

    border:none;

    cursor:pointer;

    font-family:"Livvic",sans-serif;

    font-size:20px;

    font-weight:500;

    transition:.2s;
}


.nav-btn{

    bottom:22px;

    min-width:126px;

    height:46px;

    padding:0 19px;

    border-radius:15px;

    color:#2f4f4f;

    border:2px solid rgba(47,79,79,.12);

    box-shadow:0 8px 18px rgba(47,79,79,.12);
}


#prevBtn{

    left:clamp(20px,4vw,70px);

    background:#91bbd7;
}

#nextBtn{

    right:clamp(20px,4vw,70px);

    background:#e9ad92;
}


.nav-btn:hover:not(:disabled){

    transform:translateY(-3px);
}

.nav-btn:disabled{

    opacity:.55;

    cursor:not-allowed;
}


.submit-btn{

    left:50%;

    bottom:20px;

    transform:translateX(-50%);

    min-width:155px;

    height:50px;

    padding:0 28px;

    border-radius:18px;

    background:#2f4f4f;

    color:white;

    box-shadow:

        0 8px 0 rgba(22,59,59,.18),

        0 13px 25px rgba(47,79,79,.20);
}

.submit-btn:hover:not(:disabled){

    transform:
        translateX(-50%)
        translateY(-3px);
}


/* =========================================
   POPUPS
========================================= */

.feedback{

    position:absolute;

    top:50%;
    left:50%;

    z-index:50;

    width:min(410px,88vw);

    min-height:225px;

    padding:28px 30px;

    border-radius:30px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,-50%)
        scale(.7)
        rotate(-4deg);

    transition:.28s cubic-bezier(.2,.9,.25,1.25);

    box-shadow:0 20px 50px rgba(32,57,57,.22);
}

.feedback.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1)
        rotate(0);
}

.correct-popup{

    background:linear-gradient(135deg,#e1f5e8,#f5fcf7);

    border:5px solid #16834f;
}

.wrong-popup{

    background:linear-gradient(135deg,#fde5e1,#fff6f4);

    border:5px solid #c94740;
}

.feedback-icon{

    width:72px;
    height:72px;

    display:grid;
    place-items:center;

    background:#fff;

    border-radius:22px 22px 22px 8px;

    font-size:40px;

    margin-bottom:10px;

    box-shadow:0 5px 0 rgba(0,0,0,.08);
}

.feedback h3{

    font-size:28px;

    margin-bottom:7px;
}

.feedback p{

    font-size:17px;

    color:#607878;
}


/* =========================================
   FINAL POPUP
========================================= */

.final-popup{

    position:absolute;

    top:50%;
    left:50%;

    z-index:60;

    width:min(520px,91vw);

    padding:38px 36px 32px;

    text-align:center;

    border-radius:34px;

    background:

        radial-gradient(circle at 87% 18%,rgba(255,222,115,.78) 0 12px,transparent 13px),

        radial-gradient(circle at 16% 83%,rgba(255,190,214,.5) 0 10px,transparent 11px),

        linear-gradient(145deg,#eadcff,#cbb5f4 58%,#b89ae8);

    border:5px solid #7350a8;

    box-shadow:

        0 10px 0 rgba(83,55,126,.18),

        0 28px 70px rgba(55,38,80,.30);

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,-50%)
        scale(.72);

    transition:.34s cubic-bezier(.2,.9,.25,1.25);
}

.final-popup.show{

    opacity:1;

    pointer-events:auto;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.final-emoji{

    font-size:75px;

    margin-bottom:10px;
}

.final-popup h2{

    font-size:36px;

    color:#4c3272;

    margin-bottom:8px;
}

.final-popup p{

    font-size:18px;

    color:#5f4a7a;

    margin-bottom:24px;
}

.play-again-btn{

    min-width:185px;

    height:52px;

    border:none;

    border-radius:17px;

    background:#68449a;

    color:white;

    font-family:"Livvic",sans-serif;

    font-size:20px;

    font-weight:500;

    cursor:pointer;

    box-shadow:0 7px 0 rgba(70,44,106,.2);
}


/* =========================================
   LARGE MONITOR
========================================= */

@media(min-width:1400px){

    /* =========================================
       FULL-PAGE MONITOR RESPONSIVE LAYOUT
       Laptop/mobile rules remain unchanged.
    ========================================= */

    header{
        height:100px;
    }

    .heading{
        font-size:30px;
        font-weight:400;
    }

    .stage{
        top:100px;
        bottom:92px;
        padding:12px 4vw;
    }

    .game-label{
        font-size:20px;
        padding:10px 28px;
        margin-top:6px;
    }

    /* Monitor question */
    .question-area{
        min-height:150px;
        padding:18px 5%;
    }

    .question{
        max-width:min(1500px,90vw);
        font-size:40px;
        font-weight:400;
        line-height:1.3;
    }

    /* Use the available monitor width and height */
    .track-area{
        width:min(1700px,94vw);
        min-height:0;
        flex:1;
    }

    .track-line{
        left:5%;
        right:5%;
        border-top-width:9px;
    }

    .flag{
        font-size:56px;
    }

    .trophy{
        font-size:58px;
    }

    .point-text{
        font-size:16px;
    }

    .checkpoint{
        width:76px;
        height:76px;
        border-radius:21px;
        border-width:4px;
        font-size:34px;
    }

    /* Larger answer gate, proportionally centered */
    .answer-gate{
        width:min(370px,28vw);
        height:220px;
        border-width:7px;
        border-radius:32px;
    }

    .gate-top{
        top:-34px;
        padding:8px 20px;
        font-size:28px;
    }

    .answer{
        width:220px;
        height:62px;
        font-size:30px;
        border-radius:17px;
    }

    .gate-text{
        margin-top:18px;
        font-size:18px;
    }

    /* Monitor navigation + submit buttons */
    .controls{
        height:92px;
    }

    .nav-btn,
    .submit-btn{
        width:200px;
        min-width:200px;
        height:60px;
        padding:0;
        font-size:30px;
    }

    .nav-btn{
        bottom:18px;
    }

    .submit-btn{
        bottom:16px;
    }

    #prevBtn{
        left:clamp(30px,4vw,80px);
    }

    #nextBtn{
        right:clamp(30px,4vw,80px);
    }

    /* Scale feedback naturally on large screens */
    .feedback{
        width:min(470px,40vw);
        min-height:250px;
    }

}


/* =========================================
   SMALL LAPTOP / TABLET
========================================= */

@media(max-height:720px){

    .question-area{
        min-height:95px;
    }

    .answer-gate{
        height:160px;
    }

    .track-area{
        min-height:190px;
    }

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:700px){

    header{
        height:70px;
    }

    .stage{

        top:70px;
        bottom:72px;

        padding:5px 10px;
    }

    .heading{
        font-size:18px;
    }

    .game-label{

        font-size:14px;

        padding:7px 16px;
    }

    .question-area{

        min-height:100px;

        padding:10px 4%;
    }

    .question{

        font-size:22px;
    }

    .track-line{

        left:3%;
        right:3%;

        border-top-width:5px;
    }

    .answer-gate{

        width:220px;

        height:150px;

        border-width:5px;
    }

    .answer{

        width:145px;
        height:52px;

        font-size:20px;
    }

    .checkpoint{

        width:42px;
        height:42px;

        font-size:20px;

        border-width:3px;
    }

    .cp-one{
        left:18%;
    }

    .cp-two{
        right:18%;
    }

    .start-point{
        left:1%;
    }

    .finish-point{
        right:1%;
    }

    .flag,
    .trophy{
        font-size:32px;
    }

    .point-text{
        display:none;
    }

    .nav-btn{

        bottom:14px;

        min-width:86px;

        height:42px;

        padding:0 11px;

        font-size:16px;
    }

    .submit-btn{

        bottom:12px;

        min-width:125px;

        height:46px;

        font-size:17px;

        padding:0 15px;
    }

}

</style>
</head>

<body>

<div class="game">

 

    <!-- HEADER -->

    <header>

        <div class="heading">

            Fill in the <span>boxes</span>

        </div>

    </header>


    <!-- GAME STAGE -->

    <main class="stage">


        


        <!-- QUESTION -->

        <div class="question-area">

            <div
                class="question"
                id="questionText"
            >
                Smallest 4 digit number
            </div>

        </div>


        <!-- TRACK -->

        <div class="track-area">


            <div class="track-line"></div>


            <div class="start-point">

                <div class="flag">
                    🚩
                </div>

                <div class="point-text">
                    START
                </div>

            </div>


            <div class="checkpoint cp-one">
                ⭐
            </div>


            <div class="checkpoint cp-two">
                🎯
            </div>


            <!-- ANSWER GATE -->

            <div class="answer-gate">

                <div class="gate-top">
                    🔐
                </div>


                <input
                    type="text"
                    id="answerInput"
                    class="answer"
                    autocomplete="off"
                >


                <div class="gate-text">

                    Unlock the path!

                </div>

            </div>


            <div class="finish-point">

                <div class="trophy">
                    🏆
                </div>

                <div class="point-text">
                    FINISH
                </div>

            </div>


         


        </div>


    </main>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            class="nav-btn"
            id="prevBtn"
        >
            ← Back
        </button>


        <button
            class="submit-btn"
            id="submitBtn"
        >
            Submit ✓
        </button>


        <button
            class="nav-btn"
            id="nextBtn"
            disabled
        >
            Next →
        </button>

    </div>


    <!-- CORRECT POPUP -->

    <div
        class="feedback correct-popup"
        id="correctPopup"
    >

        <div class="feedback-icon">
            🎉
        </div>

        <h3>Perfect!</h3>

        <p>
            You unlocked this challenge successfully.
        </p>

    </div>


    <!-- WRONG POPUP -->

    <div
        class="feedback wrong-popup"
        id="wrongPopup"
    >

        <div class="feedback-icon">
            😕
        </div>

        <h3>Try again!</h3>

        <p>
            Try the challenge once more.
        </p>

    </div>


    <!-- FINAL POPUP -->

    <div
        class="final-popup"
        id="finalPopup"
    >

        <div class="final-emoji">🏆</div>

        <h2>Awesome!</h2>

        <p>
            You completed every challenge brilliantly!
        </p>

        <button
            class="play-again-btn"
            id="playAgainBtn"
        >
            ↻ Play Again
        </button>

    </div>


</div>


<script>

/* =========================================
   SOUND
========================================= */

function speak(t) {

    speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(t);

    msg.lang = "en-US";

    msg.volume = 0.25;

    msg.rate = 1;

    msg.pitch = 1;

    speechSynthesis.speak(msg);

}


/* =========================================
   QUESTIONS
   NOTE: "answer" can be a single string OR an
   array of accepted strings. Use an array for
   number questions so both plain and comma
   formatted digits (e.g. "1000" and "1,000")
   are accepted.
========================================= */

const questions = [

    {
        question:"Q1. Smallest 4 digit number",
        answer:["1000","1,000"]
    },

    {
        question:"Q2. Greatest 4 digit number",
        answer:["9999","9,999"]
    },

    {
        question:"Q3. Smallest 5 digit number",
        answer:["10000","10,000"]
    },

    {
        question:"Q4. Greatest 5 digit number",
        answer:["99999","99,999"]
    },

    {
        question:"Q5. Smallest 6 digit number",
        answer:["100000","1,00,000","100,000"]
    },

    {
        question:"Q6. Greatest 6 digit number",
        answer:["999999","9,99,999","999,999"]
    },

    {
        question:"Q7. The process of reading, writing or naming numbers is called",
        answer:"numeration"
    },

    {
        question:"Q8. The system of using symbols as a form of communication is called",
        answer:"notation"
    }

];


/* =========================================
   VARIABLES
========================================= */

let currentQuestion = 0;

const savedAnswers =
    questions.map(() => ({
        value:"",
        completed:false
    }));


const questionText =
    document.getElementById("questionText");

const answerInput =
    document.getElementById("answerInput");

    answerInput.addEventListener("input", () => {

    const value = answerInput.value;

    if (value.length > 0) {

        answerInput.value =
            value.charAt(0).toUpperCase() +
            value.slice(1).toLowerCase();

    }

});

const submitBtn =
    document.getElementById("submitBtn");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const correctPopup =
    document.getElementById("correctPopup");

const wrongPopup =
    document.getElementById("wrongPopup");

const finalPopup =
    document.getElementById("finalPopup");

const playAgainBtn =
    document.getElementById("playAgainBtn");


/* =========================================
   NORMALIZE ANSWER
========================================= */

function normalize(value){

    return value
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


/* =========================================
   LOAD QUESTION
========================================= */

function loadQuestion(){

    correctPopup.classList.remove("show");
    wrongPopup.classList.remove("show");

    const q =
        questions[currentQuestion];

    const saved =
        savedAnswers[currentQuestion];


    questionText.textContent =
        q.question;

    answerInput.value =
        saved.value;


    answerInput.classList.remove(
        "correct",
        "wrong"
    );


    if(saved.completed){

        answerInput.classList.add("correct");

        answerInput.readOnly = true;

        submitBtn.disabled = true;

        submitBtn.style.opacity = ".45";


        nextBtn.disabled =
            currentQuestion === questions.length - 1;

    }

    else{

        answerInput.readOnly = false;

        submitBtn.disabled = false;

        submitBtn.style.opacity = "1";

        nextBtn.disabled = true;


        setTimeout(() => {

            answerInput.focus();

        },100);

    }


    prevBtn.disabled =
        currentQuestion === 0;

}


/* =========================================
   SUBMIT
========================================= */

function submitAnswer(){

    const value =
        normalize(answerInput.value);


    if(!value){

        answerInput.focus();

        return;

    }


    const rawAnswer =
        questions[currentQuestion].answer;

    // Support both a single answer string and
    // an array of accepted answer strings.
    const acceptedAnswers =
        Array.isArray(rawAnswer)
            ? rawAnswer
            : [rawAnswer];

    const isCorrect =
        acceptedAnswers.some(
            accepted => normalize(accepted) === value
        );


    answerInput.classList.remove(
        "correct",
        "wrong"
    );


    /* CORRECT */

    if(isCorrect){

        answerInput.classList.add("correct");


        savedAnswers[currentQuestion] = {

            value:answerInput.value,

            completed:true

        };


        answerInput.readOnly = true;


        submitBtn.disabled = true;

        submitBtn.style.opacity = ".45";


        correctPopup.classList.add("show");


        speak("Correct!");


        setTimeout(() => {

            correctPopup.classList.remove("show");


            if(
                currentQuestion ===
                questions.length - 1
            ){

                finalPopup.classList.add("show");

             

            }

            else{

                nextBtn.disabled = false;

            }

        },1500);

    }


    /* WRONG */

else{

    answerInput.classList.add("wrong");

    wrongPopup.classList.add("show");

    speak("Try again.");

    setTimeout(() => {

        wrongPopup.classList.remove("show");

        answerInput.classList.remove("wrong");

        // Clear wrong answer automatically
        answerInput.value = "";

        // Keep saved answer empty
        savedAnswers[currentQuestion].value = "";

        // Focus again for new answer
        answerInput.focus();

    },1500);

}

}


/* =========================================
   EVENTS
========================================= */

submitBtn.addEventListener(
    "click",
    submitAnswer
);


nextBtn.addEventListener(
    "click",
    () => {

        if(
            savedAnswers[currentQuestion].completed
            &&
            currentQuestion <
            questions.length - 1
        ){

            currentQuestion++;

            loadQuestion();

        }

    }
);


prevBtn.addEventListener(
    "click",
    () => {

        if(currentQuestion > 0){

            currentQuestion--;

            loadQuestion();

        }

    }
);


answerInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
            &&
            !answerInput.readOnly
        ){

            submitAnswer();

        }

    }
);


/* =========================================
   PLAY AGAIN
========================================= */

playAgainBtn.addEventListener(
    "click",
    () => {

        currentQuestion = 0;


        savedAnswers.forEach(item => {

            item.value = "";

            item.completed = false;

        });


        finalPopup.classList.remove("show");

        loadQuestion();

    }
);


/* =========================================
   START
========================================= */

loadQuestion();

</script>

<script>
/* ===== CONFETTI CELEBRATION (right & final popups) ===== */
(function () {
  let canvas, ctx, pieces = [], raf = null;
  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
    document.body.appendChild(canvas);
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
  function burst(count) {
    ensureCanvas();
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - .5) * 180,
        y: innerHeight / 2 + (Math.random() - .5) * 90,
        vx: (Math.random() - .5) * 11,
        vy: Math.random() * -13 - 4,
        g: 0.30 + Math.random() * 0.14,
        s: 6 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * 0.4,
        color: colors[i % colors.length],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
    pieces.forEach(p => {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (pieces.length) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.fireConfetti = function (big) {
    if (big) {
      burst(170);
      let n = 0;
      const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
    } else {
      burst(90);
    }
  };
  function watch(id, big) {
    const el = document.getElementById(id);
    if (!el) return;
    let was = el.classList.contains("show");
    new MutationObserver(() => {
      const now = el.classList.contains("show");
      if (now && !was) window.fireConfetti(big);
      was = now;
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  function init() { watch("correctPopup", false); watch("finalPopup", true); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
