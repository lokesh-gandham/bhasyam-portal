<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>Period and Place Challenge</title>

<style>

/* ========================================
   RESET
======================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Livvic",sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#edf3f1;
    color:#2f4f4f;
}


/* ========================================
   MAIN GAME
======================================== */

.game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

}


/* ========================================
   BACKGROUND GAME DECORATION
======================================== */

.cloud{
    position:absolute;
    opacity:.48;
    pointer-events:none;
}


header{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:95px;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:10;

    padding:0 100px;
}

.heading{
    color:#2f4f4f;

    text-align:center;

    font-size:22px;
    font-weight:400;

    line-height:1.3;
}


.stage{
    position:absolute;

    top:95px;
    bottom:85px;

    left:0;
    right:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:5px 6vw;

    z-index:5;
}


/* ========================================
   GAME LEVEL LABEL
======================================== */

.level-badge{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:10px;

    padding:9px 24px;

    margin-bottom:18px;

    border-radius:14px;

    background:#fff2c9;

    border:2px solid #e2b14e;

    box-shadow:
        0 6px 0 rgba(174,117,22,.12);

    color:#72582b;

    font-size:18px;
    font-weight:500;
}


/* ========================================
   QUESTION
======================================== */

.question{
    width:100%;

    text-align:center;

    font-size:30px;
    font-weight:400;

    color:#2f4f4f;

    line-height:1.35;

    margin-bottom:28px;
}


/* ========================================
   NUMBER TRAIN TRACK
======================================== */

.track-zone{
    position:relative;

    width:min(920px,92vw);

    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:28px;
}

.track{
    position:absolute;

    width:100%;
    height:52px;

    top:50%;
    transform:translateY(-50%);

    border-top:6px dashed #75a9a8;
    border-bottom:6px dashed #75a9a8;

    opacity:.55;
}


/* ========================================
   NUMBER TRAIN
======================================== */

.number-train{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;

    gap:5px;

    padding:14px 22px;

    background:#fefcf6;

    border:3px solid #4f9897;

    border-radius:18px;

    box-shadow:
        0 9px 0 rgba(53,123,122,.14),
        0 18px 30px rgba(47,79,79,.12);
}

.engine{
    width:46px;
    height:52px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px 18px 18px 11px;

    background:#e5a35d;

    font-size:24px;

    box-shadow:
        inset 0 -5px rgba(130,74,24,.12);
}

.number{
    display:flex;
    align-items:center;

    font-size:30px;
    font-weight:400;

    letter-spacing:3px;

    color:#344f50;
}

.digit{
    position:relative;
    display:inline-block;
}

.target-digit{
    color:#cf514b;
    padding:0 2px;
}

.target-digit::after{
    content:"";

    position:absolute;

    left:1px;
    right:1px;

    bottom:-7px;

    height:3px;

    border-radius:10px;

    background:#cf514b;
}

.wheel{
    position:absolute;

    width:14px;
    height:14px;

    border-radius:50%;

    background:#405f60;

    bottom:-10px;
}

.wheel1{
    left:30px;
}

.wheel2{
    right:30px;
}


/* ========================================
   ANSWER STATIONS
======================================== */

.answer-zone{
    width:min(760px,92vw);

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:55px;

    align-items:center;
}

.answer-station{
    position:relative;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;
}


/* STATION FLAG */

.station-flag{
    position:relative;

    padding:9px 23px;

    margin-bottom:13px;

    border-radius:12px;

    color:white;

    font-size:20px;
    font-weight:500;

    box-shadow:
        0 5px 0 rgba(0,0,0,.12);
}

.period-flag{
    background:#559997;
}

.place-flag{
    background:#d48762;
}


/* TRACK BELOW STATIONS */

.station-rail{
    width:100%;

    height:10px;

    margin-top:15px;

    border-top:3px dashed rgba(78,126,126,.35);
}


/* INPUT */

.answer-input{
    width:178px;
    height:45px;

    border:none;
    outline:none;

    background:white;

    border-radius:12px;

    text-align:center;

    color:#2f4f4f;

    font-size:20px;

    box-shadow:
        inset 0 0 0 3px #ec9e59,
        0 6px 0 rgba(181,106,42,.13);

    transition:.2s;
}

.answer-input:focus{

    transform:translateY(-2px);

    box-shadow:
        inset 0 0 0 3px #4f9998,
        0 0 0 6px rgba(79,153,152,.12);
}

.answer-input.correct{

    background:#eefbf3;

    box-shadow:
        inset 0 0 0 4px #55b97f,
        0 6px 0 rgba(35,121,73,.12);
}

.answer-input.wrong{

    background:#fff2f0;

    box-shadow:
        inset 0 0 0 4px #dd655d;

    animation:shake .35s;
}

@keyframes shake{

    25%{
        transform:translateX(-7px);
    }

    50%{
        transform:translateX(7px);
    }

    75%{
        transform:translateX(-4px);
    }

}


/* ========================================
   SUBMIT BUTTON
   SAME PREVIOUS GAME STYLE
======================================== */

.submit-btn{

    position:absolute;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    z-index:30;

    pointer-events:auto;

    border:none;

    cursor:pointer;

    font-family:"Livvic",sans-serif;

    font-size:20px;

    font-weight:500;

    transition:.2s;

    min-width:155px;

    height:50px;

    padding:0 28px;

    border-radius:18px;

    background:#2f4f4f;

    color:white;

    box-shadow:
        0 8px 0 rgba(22,59,59,.18),
        0 13px 25px rgba(47,79,79,.20);
}

.submit-btn:hover:not(:disabled){

    transform:
        translateX(-50%)
        translateY(-3px);
}

.submit-btn:disabled{

    opacity:.45;
    cursor:not-allowed;
}


/* ========================================
   NAVIGATION
   SAME PREVIOUS STYLE
======================================== */

.nav-btn{

    position:absolute;

    bottom:22px;

    min-width:126px;
    height:46px;

    padding:0 19px;

    border-radius:15px;

    border:2px solid rgba(47,79,79,.12);

    color:#2f4f4f;

    font-size:20px;

    font-weight:500;

    cursor:pointer;

    box-shadow:
        0 8px 18px rgba(47,79,79,.12);

    transition:.2s;

    z-index:30;
}

#prevBtn{

    left:clamp(20px,4vw,70px);

    background:#91bbd7;
}

#nextBtn{

    right:clamp(20px,4vw,70px);

    background:#e9ad92;
}

.nav-btn:hover:not(:disabled){

    transform:translateY(-3px);
}

.nav-btn:disabled{

    opacity:.5;
    cursor:not-allowed;
}


/* ========================================
   CORRECT / WRONG POPUPS
   SAME STYLE
======================================== */

.feedback{

    position:absolute;

    top:50%;
    left:50%;

    z-index:50;

    width:min(390px,88vw);

    min-height:235px;

    padding:30px;

    border-radius:30px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,-50%)
        scale(.7)
        rotate(-4deg);

    transition:.28s cubic-bezier(.2,.9,.25,1.25);

    box-shadow:
        0 20px 50px rgba(32,57,57,.22);
}

.feedback.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1)
        rotate(0);
}

.correct-popup{

    background:linear-gradient(
        135deg,
        #e0f5e8,
        #f5fcf7
    );

    border:5px solid #16834f;
}

.wrong-popup{

    background:linear-gradient(
        135deg,
        #fde4e0,
        #fff5f3
    );

    border:5px solid #c94740;
}

.feedback-icon{

    width:75px;
    height:75px;

    display:grid;

    place-items:center;

    background:#fff;

    border-radius:22px 22px 22px 8px;

    font-size:42px;

    margin-bottom:12px;

    box-shadow:
        0 5px 0 rgba(0,0,0,.08);
}

.feedback h3{

    font-size:29px;

    margin-bottom:8px;
}

.feedback p{

    font-size:17px;

    color:#607878;
}


/* ========================================
   FINAL POPUP
======================================== */

.final-popup{

    position:absolute;

    top:50%;
    left:50%;

    z-index:60;

    width:min(520px,91vw);

    padding:38px 36px 32px;

    text-align:center;

    border-radius:34px;

    background:
        radial-gradient(
            circle at 87% 18%,
            rgba(255,222,115,.78) 0 12px,
            transparent 13px
        ),

        radial-gradient(
            circle at 16% 83%,
            rgba(255,190,214,.5) 0 10px,
            transparent 11px
        ),

        linear-gradient(
            145deg,
            #eadcff,
            #cbb5f4 58%,
            #b89ae8
        );

    border:5px solid #7350a8;

    box-shadow:
        0 10px 0 rgba(83,55,126,.18),
        0 28px 70px rgba(55,38,80,.30);

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,-50%)
        scale(.72);

    transition:.34s cubic-bezier(.2,.9,.25,1.25);
}

.final-popup.show{

    opacity:1;

    pointer-events:auto;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.final-emoji{

    font-size:75px;

    margin-bottom:10px;
}

.final-popup h2{

    font-size:36px;

    color:#4c3272;

    margin-bottom:8px;
}

.final-popup p{

    font-size:18px;

    color:#5f4a7a;

    margin-bottom:24px;
}

.play-again-btn{

    min-width:185px;

    height:52px;

    border:none;

    border-radius:17px;

    background:#68449a;

    color:white;

    font-size:20px;

    font-weight:500;

    cursor:pointer;

    box-shadow:
        0 7px 0 rgba(70,44,106,.2);
}


/* ========================================
   LARGE MONITORS
======================================== */

@media(min-width:1400px){

    /* ========================================
       FULL-PAGE MONITOR RESPONSIVE

    header{

        padding:0 8vw;
    }

    .heading{

        font-weight:600;

        max-width:1200px;
    }

    .stage{
        top:100px;
        bottom:95px;
        padding:10px 4vw;
    }

    .level-badge{

/* ========================================
   SHORT LAPTOP SCREENS
======================================== */

    }

</style>
</head>

<body>

<div class="game">

    <!-- BACKGROUND -->


    <!-- HEADER -->

    <header>

        <div class="heading">

            In which
            period
            and the
            place
            does the underlined digit belong to

        </div>

    </header>


    <!-- GAME AREA -->

    <main class="stage">


        <div
            class="question"
            id="questionText"
        >
            Find where the highlighted digit stops!
        </div>


        <!-- NUMBER TRACK -->

        <div class="track-zone">

            <div class="track"></div>

            <div class="number-train">

                <div class="engine">
                    🚂
                </div>

                <div
                    class="number"
                    id="numberDisplay"
                ></div>

                <div class="wheel wheel1"></div>
                <div class="wheel wheel2"></div>

            </div>

        </div>


        <!-- ANSWERS -->

        <div class="answer-zone">


            <!-- PERIOD -->

            <div class="answer-station">

                <div class="station-flag period-flag">
                    🗺️ Period
                </div>

                <input
                    type="text"
                    id="periodInput"
                    class="answer-input"
                    placeholder="Type here"
                    autocomplete="off"
                >

                <div class="station-rail"></div>

            </div>


            <!-- PLACE -->

            <div class="answer-station">

                <div class="station-flag place-flag">
                    📍 Place
                </div>

                <input
                    type="text"
                    id="placeInput"
                    class="answer-input"
                    placeholder="Type here"
                    autocomplete="off"
                >

                <div class="station-rail"></div>

            </div>


        </div>

    </main>


    <!-- SUBMIT -->

    <button
        class="submit-btn"
        id="submitBtn"
    >
        Submit ✓
    </button>


    <!-- NAVIGATION -->

    <button
        class="nav-btn"
        id="prevBtn"
        disabled
    >
        ← Back
    </button>


    <button
        class="nav-btn"
        id="nextBtn"
        disabled
    >
        Next →
    </button>


    <!-- CORRECT POPUP -->

    <div
        class="feedback correct-popup"
        id="correctPopup"
    >

        <div class="feedback-icon">
            🎉
        </div>

        <h3>Perfect!</h3>

        <p>
            You found the correct period and place!
        </p>

    </div>


    <!-- WRONG POPUP -->

    <div
        class="feedback wrong-popup"
        id="wrongPopup"
    >

        <div class="feedback-icon">
            😕
        </div>

        <h3>Try again!</h3>

        <p>
            Check the highlighted digit and try again.
        </p>

    </div>


    <!-- FINAL POPUP -->

    <div
        class="final-popup"
        id="finalPopup"
    >

        <div class="final-emoji">🏆</div>

        <h2>Awesome!</h2>

        <p>
            You completed the Number Track Challenge!
        </p>

        <button
            class="play-again-btn"
            id="playAgainBtn"
        >
            ↻ Play Again
        </button>

    </div>

</div>


<script>

/* ========================================
   EXACT VOICE FUNCTION
======================================== */

function speak(t) {

    speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(t);

    msg.lang = "en-US";

    msg.volume = 0.25;

    msg.rate = 1;

    msg.pitch = 1;

    speechSynthesis.speak(msg);

}


/* ========================================
   QUESTIONS
======================================== */

const questions = [

    {
        number:"54217804",
        underlineIndex:0,
        period:"crores",
        place:"crores place"
    },

    {
        number:"19823756",
        underlineIndex:1,
        period:"lakhs",
        place:"ten lakhs place"
    },

  {
    number:"605934527",
    underlineIndex:5,
    period:"thousands",
    place:"thousands place"
}

];


/* ========================================
   VARIABLES
======================================== */

let currentQuestion = 0;


const savedAnswers = questions.map(() => ({

    period:"",
    place:"",
    completed:false

}));


const numberDisplay =
    document.getElementById("numberDisplay");

const periodInput =
    document.getElementById("periodInput");

const placeInput =
    document.getElementById("placeInput");

const submitBtn =
    document.getElementById("submitBtn");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const correctPopup =
    document.getElementById("correctPopup");

const wrongPopup =
    document.getElementById("wrongPopup");

const finalPopup =
    document.getElementById("finalPopup");

const playAgainBtn =
    document.getElementById("playAgainBtn");

function capitalizeFirstLetter(input) {

    input.addEventListener("input", function () {

        const cursorPosition = this.selectionStart;

        if (this.value.length > 0) {

            this.value =
                this.value.charAt(0).toUpperCase() +
                this.value.slice(1).toLowerCase();

        }

        this.setSelectionRange(
            cursorPosition,
            cursorPosition
        );

    });

}
capitalizeFirstLetter(periodInput);
capitalizeFirstLetter(placeInput);

function normalize(value){

    return value
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}


/* ========================================
   RENDER NUMBER
======================================== */

function renderNumber(){

    const q = questions[currentQuestion];

    numberDisplay.innerHTML = "";


    [...q.number].forEach((digit,index) => {

        const span =
            document.createElement("span");

        span.className = "digit";

        span.textContent = digit;


        if(index === q.underlineIndex){

            span.classList.add(
                "target-digit"
            );

        }


        numberDisplay.appendChild(span);

    });

}


/* ========================================
   LOAD QUESTION
======================================== */

function loadQuestion(){

    correctPopup.classList.remove("show");

    wrongPopup.classList.remove("show");


    renderNumber();


    const saved =
        savedAnswers[currentQuestion];


    periodInput.value =
        saved.period;

    placeInput.value =
        saved.place;


    periodInput.classList.remove(
        "correct",
        "wrong"
    );

    placeInput.classList.remove(
        "correct",
        "wrong"
    );


    if(saved.completed){

        periodInput.classList.add("correct");

        placeInput.classList.add("correct");


        periodInput.readOnly = true;

        placeInput.readOnly = true;


        submitBtn.disabled = true;


        nextBtn.disabled =
            currentQuestion ===
            questions.length - 1;

    }

    else{

        periodInput.readOnly = false;

        placeInput.readOnly = false;


        submitBtn.disabled = false;

        nextBtn.disabled = true;


        setTimeout(() => {

            periodInput.focus();

        },100);

    }


    prevBtn.disabled =
        currentQuestion === 0;

}


/* ========================================
   CHECK ANSWER
======================================== */

function submitAnswer(){

    const period =
        normalize(periodInput.value);

    const place =
        normalize(placeInput.value)
            .replace(/\s*place$/,"");


    if(!period || !place){

        if(!period){

            periodInput.focus();

        }

        else{

            placeInput.focus();

        }

        return;

    }


    const q =
        questions[currentQuestion];


    periodInput.classList.remove(
        "wrong",
        "correct"
    );

    placeInput.classList.remove(
        "wrong",
        "correct"
    );


    /* CORRECT */

    if(
        period === normalize(q.period) &&
        place === normalize(q.place).replace(/\s*place$/,"")
    ){

        periodInput.classList.add("correct");

        placeInput.classList.add("correct");


        savedAnswers[currentQuestion] = {

            period:periodInput.value,

            place:placeInput.value,

            completed:true

        };


        periodInput.readOnly = true;

        placeInput.readOnly = true;


        submitBtn.disabled = true;


        correctPopup.classList.add("show");


        speak("Correct!");


        setTimeout(() => {

            correctPopup.classList.remove("show");


            if(
                currentQuestion ===
                questions.length - 1
            ){

                finalPopup.classList.add("show");


            }

            else{

                nextBtn.disabled = false;

            }

        },1500);

    }


    /* WRONG */

    else{

        periodInput.classList.add("wrong");

        placeInput.classList.add("wrong");


        wrongPopup.classList.add("show");


        speak("Try again.");


        setTimeout(() => {

            wrongPopup.classList.remove("show");


            periodInput.classList.remove("wrong");

            placeInput.classList.remove("wrong");


            /* AUTOMATICALLY REMOVE ANSWERS */

            periodInput.value = "";

            placeInput.value = "";


            savedAnswers[currentQuestion].period = "";

            savedAnswers[currentQuestion].place = "";


            periodInput.focus();

        },1500);

    }

}


/* ========================================
   SUBMIT
======================================== */

submitBtn.addEventListener(
    "click",
    submitAnswer
);


/* ========================================
   NEXT
======================================== */

nextBtn.addEventListener(
    "click",
    () => {

        if(
            savedAnswers[currentQuestion].completed &&
            currentQuestion <
            questions.length - 1
        ){

            currentQuestion++;

            loadQuestion();

        }

    }
);


/* ========================================
   BACK
======================================== */

prevBtn.addEventListener(
    "click",
    () => {

        if(currentQuestion > 0){

            currentQuestion--;

            loadQuestion();

        }

    }
);


/* ========================================
   ENTER KEY
======================================== */

periodInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            placeInput.focus();

        }

    }
);


placeInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            submitAnswer();

        }

    }
);


/* ========================================
   PLAY AGAIN
======================================== */

playAgainBtn.addEventListener(
    "click",
    () => {

        currentQuestion = 0;


        savedAnswers.forEach(item => {

            item.period = "";

            item.place = "";

            item.completed = false;

        });


        finalPopup.classList.remove("show");


        loadQuestion();

    }
);


/* ========================================
   START GAME
======================================== */

loadQuestion();

</script>

<script>
/* ===== CONFETTI CELEBRATION (right & final popups) ===== */
(function () {
  let canvas, ctx, pieces = [], raf = null;
  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
    document.body.appendChild(canvas);
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
  function burst(count) {
    ensureCanvas();
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - .5) * 180,
        y: innerHeight / 2 + (Math.random() - .5) * 90,
        vx: (Math.random() - .5) * 11,
        vy: Math.random() * -13 - 4,
        g: 0.30 + Math.random() * 0.14,
        s: 6 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * 0.4,
        color: colors[i % colors.length],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
    pieces.forEach(p => {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (pieces.length) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.fireConfetti = function (big) {
    if (big) {
      burst(170);
      let n = 0;
      const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
    } else {
      burst(90);
    }
  };
  function watch(id, big) {
    const el = document.getElementById(id);
    if (!el) return;
    let was = el.classList.contains("show");
    new MutationObserver(() => {
      const now = el.classList.contains("show");
      if (now && !was) window.fireConfetti(big);
      was = now;
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  function init() { watch("correctPopup", false); watch("finalPopup", true); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
