<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Roman Treasure Trail</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Livvic, sans-serif
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden
        }

        body {
            color: #304d4b
        }

        .game {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            border-radius: 50%;
            opacity: .35
        }

        .c1 {
            width: 230px;
            height: 130px;
            left: -80px;
            top: 18%;
            background: #f6d9a8
        }

        .c2 {
            width: 270px;
            height: 160px;
            right: -90px;
            bottom: 8%;
            background: #dcc9ec
        }

        .coin {
            position: absolute;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #fff0bd;
            border: 3px solid #d4ae58;
            color: #a17d32;
            font-size: 18px
        }

        .co1 {
            left: 8%;
            top: 22%
        }

        .co2 {
            right: 9%;
            top: 28%
        }

        .co3 {
            left: 16%;
            bottom: 18%
        }

        .co4 {
            right: 17%;
            bottom: 17%
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 85px;
            z-index: 20
        }

        .heading {
            font-size: 22px;
            font-weight: 400;
            text-align: center;
            color: #2f4f4f
        }

        .home {
            position: absolute;
            right: 28px;
            top: 17px;
            width: 58px;
            height: 58px;
            border: 2px solid #9b7ac8;
            border-radius: 18px;
            background: #7954b3;
            color: #fff;
            font-size: 30px;
            box-shadow: 0 7px 0 #5f4a7a33;
            cursor: pointer;
            z-index: 30
        }

        .stage {
            position: absolute;
            top: 72px;
            bottom: 82px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px
        }

        .trail {
            position: relative;
            width: min(1120px, 94vw);
            height: min(650px, calc(100vh - 150px))
        }

        .vault-top {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 24px;
            border: 3px solid #c8a85d;
            border-radius: 14px;
            background: #fff0bf;
            color: #6b562b;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 1.5px;
            white-space: nowrap;
            box-shadow: 0 5px 0 #66552a20
        }

        .progress {
            display: none
        }

        .dot {
            display: none
        }

        .dot.active,
        .dot.done {
            display: none
        }

        .prompt {
            display: none
        }

        .vault {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(1000px, 70vw);
            height: 450px;
            border-radius: 38px;
            background: linear-gradient(145deg, #eef6f1, #dcece5);
            border: 5px solid #91afa5;
            box-shadow: 0 14px 0 #516c6424, 0 22px 45px #596b6620;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .vault:before {
            content: "";
            position: absolute;
            inset: 18px;
            border: 2px dashed #a9c2ba;
            border-radius: 28px
        }

        .vault-ring {
            position: absolute;
            border-radius: 50%;
            border: px solid #c5a45b;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%)
        }

        .r1 {
            width: 160px;
            height: 160px;
            border-style: dashed
        }

        .r2 {
            width: 166px;
            height: 166px;
            border-color: #aebfba
        }

        .vault-core {
            position: absolute;
            width: min(900px, 78%);
            height: 130px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #fff5cf;
            border: 7px solid #d0aa52;
            box-shadow: inset 0 0 0 7px #f6e4a9, 0 8px 0 #68592a22;
            padding: 14px 20px;
            z-index: 3
        }

        .equation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            white-space: nowrap;
            color: #304d4b;
            width: 100%
        }

        .eq-num {
            font-size: 30px;
            font-weight: 400;
            line-height: 1
        }

        .eq-target {
            font-size: 30px;
            font-weight: 400;
            line-height: 1
        }

        .eq-op {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            background: #e8c66f;
            border: 2px solid #bd963f;
            font-size: 27px;
            font-weight: 700;
            color: #5e4a24;
            line-height: 1;
            flex: 0 0 42px
        }

        .eq-eq {
            font-size: 32px;
            font-weight: 500;
            line-height: 1
        }

        .vault-label {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #607a73;
            white-space: nowrap
        }

        .answer-slot {
            position: absolute;
            bottom: 38px;
            width: min(390px, 78%);
            height: 60px;
            border: 4px solid #d99a64;
            border-radius: 16px;
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 12px;
            z-index: 4;
            box-shadow: 0 5px 0 #6c58421c;
            margin-bottom: 15px;
        }

        .key-icon {
            font-size: 22px;
            margin-right: 8px
        }

        .answer {
            width: 100%;
            height: 100%;
            border: 0;
            outline: 0;
            background: transparent;
            text-align: center;
            font-size: 25px;
            color: #304d4b
        }

        .answer::placeholder {
            color: #a5b0ad;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px
        }

        .hint {
            position: absolute;
            bottom: 18px;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #708782
        }

        .submit-btn {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            min-width: 155px;
            height: 50px;
            padding: 0 28px;
            border: 0;
            border-radius: 17px;
            background: #2f4f4f;
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 8px 0 #1439392e;
            z-index: 40
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateX(-50%) translateY(-3px)
        }

        .submit-btn:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .nav-btn {
            position: absolute;
            bottom: 17px;
            min-width: 126px;
            height: 46px;
            padding: 0 18px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 500;
            color: #2f4f4f;
            cursor: pointer;
            z-index: 40;
            box-shadow: 0 8px 18px #2f4f4f1f
        }

        #prevBtn {
            left: clamp(20px, 4vw, 70px);
            background: #a9cbe2;
            border: 2px solid #79a9c7
        }

        #nextBtn {
            right: clamp(20px, 4vw, 70px);
            background: #efbca6;
            border: 2px solid #d99074
        }

        .nav-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            pointer-events: none
        }

        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 100;
            width: min(440px, 88vw);
            min-height: 215px;
            padding: 26px 30px 28px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(.7);
            transition: .28s cubic-bezier(.2, .9, .25, 1.25);
            box-shadow: 0 20px 50px #20393938
        }

        .feedback.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1)
        }

        .correct-popup {
            background: linear-gradient(135deg, #e2f6e9, #f4fcf6);
            border: 5px solid #16834f
        }

        .wrong-popup {
            background: linear-gradient(135deg, #fde6e2, #fff7f5);
            border: 5px solid #c94740
        }

        .feedback-icon {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            border-radius: 24px 24px 24px 8px;
            font-size: 34px;
            color: #fff;
            box-shadow: 0 5px 0 #00000014
        }

        .correct-popup .feedback-icon {
            background: #16834f
        }

        .wrong-popup .feedback-icon {
            background: #c94740
        }

        .feedback h3 {
            font-size: 28px;
            font-weight: 500;
            color: #2f4f4f
        }

        .feedback p {
            font-size: 17px;
            color: #607878
        }

        .final-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 200;
            width: min(520px, 91vw);
            padding: 38px 36px 32px;
            text-align: center;
            border-radius: 34px;
            background: linear-gradient(145deg, #d8d0ff, #aeb8f4 58%, #8999e2);
            border: 5px solid #5d55a6;
            box-shadow: 0 10px 0 #28286438, 0 28px 70px #0003;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(.72);
            transition: .34s
        }

        .final-popup.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1)
        }

        .final-emoji {
            font-size: 78px;
            margin-bottom: 8px
        }

        .final-popup h2 {
            font-size: 36px;
            font-weight: 700;
            color: #34306e;
            margin-bottom: 8px
        }

        .final-popup p {
            font-size: 18px;
            font-weight: 500;
            color: #454879;
            margin-bottom: 24px
        }

        .play-again-btn {
            min-width: 185px;
            height: 52px;
            padding: 0 28px;
            border: 0;
            border-radius: 17px;
            background: #55479a;
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 7px 0 #2d265a40
        }

        @media(min-width:1400px) {
            .header {
                height: 100px;
                padding: 4px 120px;
            }

            .heading {
                font-size: 30px;
                font-weight: 400;
                color: #2f4f4f;
            }

            .stage {
                top: 100px;
                bottom: 90px;
                padding: 0 4vw;
            }

            .trail {
                width: min(1200px, 92vw);
                height: min(650px, calc(100vh - 190px));
            }

            .vault {
                top: 50%;
                transform: translate(-50%, -50%);
                width: min(1000px, 65vw);
                height: 500px;
            }

            .vault-core {
                width: min(900px, 78%);
                height: 135px;
            }

            .eq-num,
            .eq-target,
            .eq-eq {
                font-size: 38px;
                font-weight: 400;
            }

            .eq-op {
                width: 48px;
                height: 48px;
                flex-basis: 48px;
                font-size: 30px;
            }

            .vault-label {
                font-size: 20px;
                top: 27px;
            }

            .answer-slot {
                width: min(440px, 78%);
                height: 64px;
                bottom: 52px;
            }

            .answer {
                font-size: 28px;
                font-weight: 400;
            }

            .hint {
                font-size: 20px;
            }

            .side-card {
                width: 190px;
                height: 170px;
                right: 1%;
                top: 210px;
            }

            .side-title,
            .side-text {
                font-size: 11px;
            }

            .side-number {
                font-size: 42px;
            }

            .seal {
                left: 2%;
                top: 235px;
                width: 76px;
                height: 76px;
                font-size: 30px;
            }

            .submit-btn,
            .nav-btn {
                width: 200px;
                min-width: 200px;
                height: 60px;
                font-size: 30px;
                padding: 0;
            }

            .submit-btn {
                bottom: 14px
            }

            .nav-btn {
                bottom: 17px
            }

            #prevBtn {
                left: clamp(20px, 4vw, 80px)
            }

            #nextBtn {
                right: clamp(20px, 4vw, 80px)
            }

            .feedback {
                width: min(520px, 42vw);
                min-height: 250px;
                padding: 30px 34px;
            }

            .feedback h3 {
                font-size: 30px
            }

            .feedback p {
                font-size: 19px
            }

            .final-popup {
                width: min(600px, 45vw);
                padding: 42px 40px 36px;
            }

            .final-emoji {
                font-size: 86px
            }

            .final-popup h2 {
                font-size: 40px
            }

            .final-popup p {
                font-size: 20px
            }

            .play-again-btn {
                min-width: 200px;
                height: 60px;
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="game">


        <header class="header">
            <div class="heading">Write the value in Roman numerals</div>
        </header>
        <!-- <button class="home" onclick="location.href='index.html'">⌂</button> -->
        <main class="stage">
            <div class="trail">

                <div class="vault">
                    <div class="vault-ring r1"></div>
                    <div class="vault-ring r2"></div>
                    <div class="vault-core">
                        <div id="romanEquation" class="equation"></div>
                    </div>
                    <div class="vault-label">Ancient number lock • Read the operation</div>
                    <div class="answer-slot"><span class="key-icon">🔑</span><input id="answerInput" class="answer"
                            type="text" autocomplete="off" spellcheck="false" placeholder="Type answer"></div>
                    <div class="hint">Enter the missing Roman value to open the vault</div>
                </div>
            </div>
    </div>
    </main>
    <button id="submitBtn" class="submit-btn">Submit ✓</button>
    <button id="prevBtn" class="nav-btn" disabled>← Back</button>
    <button id="nextBtn" class="nav-btn" disabled>Next →</button>
    <div id="correctPopup" class="feedback correct-popup">
        <div class="feedback-icon">🎉</div>
        <h3>Perfect!</h3>
        <p>Excellent Roman numeral calculation.</p>
    </div>
    <div id="wrongPopup" class="feedback wrong-popup">
        <div class="feedback-icon">😕</div>
        <h3>Try again!</h3>
        <p>Check the Roman numeral values and try again.</p>
    </div>
    <div id="finalPopup" class="final-popup">
        <div class="final-emoji">🏆</div>
        <h2>Awesome!</h2>
        <p>You completed every Roman numeral challenge!</p><button id="playAgainBtn" class="play-again-btn">↻ Play
            again</button>
    </div>
    </div>
    <script>
        const questions = [
            { label: "a)", left: "LXXII", op: "−", right: "XIV", answer: "LVIII" },
            { label: "b)", left: "XXIII", op: "+", right: "IX", answer: "XXXII" },
            { label: "c)", left: "LVII", op: "+", right: "XLII", answer: "XCIX" },
            { label: "d)", left: "CIV", op: "+", right: "LXIX", answer: "CLXXIII" },
            { label: "e)", left: "CC", op: "−", right: "?", target: "CLXXIX", answer: "XXI" },
            { label: "f)", left: "DCCII", op: "+", right: "?", target: "CMIX", answer: "CCVII" }
        ];
        let current = 0, locked = false;
        const saved = questions.map(() => ({ answer: "", done: false }));
        const romanEquation = document.getElementById("romanEquation"), answerInput = document.getElementById("answerInput"), submit = document.getElementById("submitBtn"), back = document.getElementById("prevBtn"), next = document.getElementById("nextBtn"), correct = document.getElementById("correctPopup"), wrong = document.getElementById("wrongPopup"), final = document.getElementById("finalPopup");
        function speak(t) { speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t); m.lang = "en-US"; m.volume = .25; m.rate = 1; m.pitch = 1; speechSynthesis.speak(m) }
        function renderProgress() { progress.innerHTML = questions.map((q, i) => `<i class="dot ${i === current ? "active" : i < current && saved[i].done ? "done" : ""}"></i>`).join("") }
        function load() {
            const q = questions[current], s = saved[current]; locked = s.done;
            romanEquation.innerHTML = `<span class="eq-num">${q.left || ""}</span><span class="eq-op">${q.op}</span><span class="eq-num">${q.right || "?"}</span><span class="eq-eq">=</span><span class="eq-target">${q.target || "?"}</span>`;
            answerInput.value = s.answer;
            answerInput.disabled = locked;
            submit.disabled = locked || !answerInput.value.trim();
            next.disabled = !locked || current === questions.length - 1;
            back.disabled = current === 0;
        }
        function check() {
            if (locked || !answerInput.value.trim()) return;
            const q = questions[current], v = answerInput.value.trim();
            if (v === q.answer) {
                saved[current] = { answer: q.answer, done: true }; locked = true; answerInput.value = q.answer; answerInput.disabled = true; submit.disabled = true; next.disabled = current === questions.length - 1; correct.classList.add("show"); speak("Correct!");
                setTimeout(() => { correct.classList.remove("show"); if (current === questions.length - 1) { final.classList.add("show"); back.disabled = true; next.disabled = true; back.style.pointerEvents = "none"; next.style.pointerEvents = "none"; back.setAttribute("aria-disabled", "true"); next.setAttribute("aria-disabled", "true"); } }, 1500)
            } else {
                wrong.classList.add("show"); speak("Try again.");
                setTimeout(() => { wrong.classList.remove("show"); answerInput.value = ""; submit.disabled = true; answerInput.focus() }, 1500)
            }
        }
        answerInput.addEventListener("input", () => { if (locked) return; answerInput.value = answerInput.value.toUpperCase().replace(/[^IVXLCDM]/g, ""); submit.disabled = !answerInput.value.trim() });
        answerInput.addEventListener("keydown", e => { if (e.key === "Enter" && !submit.disabled) check() });
        submit.addEventListener("click", check);
        next.addEventListener("click", () => { if (saved[current].done && current < questions.length - 1) { current++; load() } });
        back.addEventListener("click", () => { if (current > 0) { current--; load() } });
        document.getElementById("playAgainBtn").addEventListener("click", () => { saved.forEach(q => { q.answer = ""; q.done = false }); current = 0; final.classList.remove("show"); back.style.pointerEvents = ""; next.style.pointerEvents = ""; back.removeAttribute("aria-disabled"); next.removeAttribute("aria-disabled"); load() });
        load();
    </script>
    <script>
        /* ===== CONFETTI CELEBRATION (right & final popups) ===== */
        (function () {
            let canvas, ctx, pieces = [], raf = null;
            function ensureCanvas() {
                if (canvas) return;
                canvas = document.createElement("canvas");
                canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
                document.body.appendChild(canvas);
                ctx = canvas.getContext("2d");
                resize();
                window.addEventListener("resize", resize);
            }
            function resize() {
                if (!canvas) return;
                canvas.width = innerWidth * devicePixelRatio;
                canvas.height = innerHeight * devicePixelRatio;
                ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
            }
            const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
            function burst(count) {
                ensureCanvas();
                for (let i = 0; i < count; i++) {
                    pieces.push({
                        x: innerWidth / 2 + (Math.random() - .5) * 180,
                        y: innerHeight / 2 + (Math.random() - .5) * 90,
                        vx: (Math.random() - .5) * 11,
                        vy: Math.random() * -13 - 4,
                        g: 0.30 + Math.random() * 0.14,
                        s: 6 + Math.random() * 7,
                        rot: Math.random() * 6.28,
                        vr: (Math.random() - .5) * 0.4,
                        color: colors[i % colors.length],
                        life: 0
                    });
                }
                if (!raf) raf = requestAnimationFrame(tick);
            }
            function tick() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
                pieces.forEach(p => {
                    p.life++;
                    p.vy += p.g;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.99;
                    p.rot += p.vr;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
                    ctx.restore();
                });
                if (pieces.length) { raf = requestAnimationFrame(tick); }
                else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
            }
            window.fireConfetti = function (big) {
                if (big) {
                    burst(170);
                    let n = 0;
                    const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
                } else {
                    burst(90);
                }
            };
            function watch(id, big) {
                const el = document.getElementById(id);
                if (!el) return;
                let was = el.classList.contains("show");
                new MutationObserver(() => {
                    const now = el.classList.contains("show");
                    if (now && !was) window.fireConfetti(big);
                    was = now;
                }).observe(el, { attributes: true, attributeFilter: ["class"] });
            }
            function init() { watch("correctPopup", false); watch("finalPopup", true); }
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
            else init();
        })();
    </script>
</body>

</html>
