<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Roman Code Breaker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Livvic, sans-serif
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden
        }

        body {
            color: #2f4f4f
        }

        .game {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: #f4f1f7
        }

        .game:before {
            display: none
        }

        .sun {
            position: absolute;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            left: -95px;
            top: 22%;
            background: #f5d3aa;
            opacity: .35
        }

        .moon {
            position: absolute;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            right: -70px;
            bottom: 3%;
            background: #d7c7ec;
            opacity: .38
        }

        .spark {
            position: absolute;
            font-size: 25px;
            opacity: .7
        }

        .s1 {
            left: 10%;
            top: 17%
        }

        .s2 {
            right: 12%;
            top: 18%
        }

        .s3 {
            left: 17%;
            bottom: 17%
        }

        .s4 {
            right: 20%;
            bottom: 13%
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 78px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px 90px;
            z-index: 10
        }

        .heading {
            font-size: 22px;
            font-weight: 400;
            color: #2f4f4f;
            text-align: center
        }

        .home {
            position: absolute;
            right: 28px;
            top: 18px;
            width: 58px;
            height: 58px;
            border-radius: 18px;
            border: 2px solid #9b7ac8;
            background: #7954b3;
            color: #fff;
            font-size: 30px;
            box-shadow: 0 7px 0 #5f4a7a33;
            cursor: pointer;
            z-index: 40
        }

        .stage {
            position: absolute;
            top: 78px;
            left: 0;
            right: 0;
            bottom: 86px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5
        }

        .arcade {
            width: min(1060px, 92vw);
            height: min(610px, calc(100vh - 175px));
            position: relative
        }

        .title {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #738b86;
            white-space: nowrap
        }

        .title:before,
        .title:after {
            content: "";
            display: inline-block;
            width: 48px;
            height: 3px;
            border-radius: 5px;
            background: #c6d8d1;
            vertical-align: middle;
            margin: 0 12px
        }

        .prompt {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 30px;
            font-weight: 400;
            color: #2f4f4f
        }

        .path {
            position: absolute;
            inset: 83px 35px 22px;
            background: transparent
        }

        .pathline {
            position: absolute;
            left: 12%;
            right: 12%;
            top: 50%;
            height: 10px;
            border-radius: 20px;
            background: #d1e1db;
            transform: rotate(-7deg);
            box-shadow: 0 6px 0 #a8c5bc55
        }

        .pathline:before {
            content: "";
            position: absolute;
            left: 0;
            top: -5px;
            width: 100%;
            height: 4px;
            background: #fff8e9;
            border-radius: 5px;
            opacity: .8
        }

        .gate {
            position: absolute;
            width: 260px;
            height: 154px;
            border-radius: 28px;
            background: #fff9e9;
            border: 4px solid #d4b66e;
            box-shadow: 0 10px 0 #88734622;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 5
        }

        .gate.a {
            left: 4%;
            top: 9%;
            transform: rotate(-6deg);
            background: #fff7dc
        }

        .gate.b {
            right: 4%;
            bottom: 9%;
            transform: rotate(6deg);
            background: #edf8f3;
            border-color: #9fc4b4
        }

        .gate:before {
            content: "";
            position: absolute;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            top: -39px;
            left: 50%;
            transform: translateX(-50%);
            background: #f4ca6a;
            border: 5px solid #c29b43;
            box-shadow: 0 5px 0 #80672d33
        }

        .gate.a:before {
            background: #f0c46b
        }

        .gate.b:before {
            background: #a8d0c0;
            border-color: #6fa391
        }

        .gate-tag {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #7a694b;
            margin-bottom: 10px
        }

        .gate-number {
            font-size: 48px;
            font-weight: 400;
            letter-spacing: 3px;
            color: #304b48
        }

        .lock {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: #f7eee0;
            border: 9px solid #b8a17d;
            box-shadow: 0 12px 0 #6f604633, 0 0 0 14px #ffffffaa;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 8
        }

        .lock:before {
            content: "";
            position: absolute;
            width: 106px;
            height: 106px;
            border-radius: 50%;
            border: 5px dashed #d4bd91
        }

        .lock-core {
            width: 78px;
            height: 78px;
            border-radius: 22px;
            background: #fff;
            border: 5px solid #9d8662;
            display: grid;
            place-items: center;
            font-size: 39px;
            color: #836e4d;
            box-shadow: inset 0 4px 12px #0000000d
        }

        .lock-label {
            position: absolute;
            bottom: -34px;
            background: #e9c95f;
            border: 3px solid #b8932e;
            border-radius: 14px;
            padding: 6px 17px;
            font-size: 12px;
            font-weight: 400;
            color: #634f24;
            white-space: nowrap
        }

        .symbol-zone {
            position: absolute;
            left: 50%;
            bottom: 1%;
            transform: translateX(-50%);
            width: 410px;
            height: 102px;
            background: #e7eef9;
            border: 4px solid #9fb5d0;
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            z-index: 12;
            box-shadow: 0 9px 0 #65799522
        }

        .symbol-label {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: #d7e8f6;
            border: 3px solid #91aac8;
            border-radius: 12px;
            padding: 5px 16px;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #5a708c;
            white-space: nowrap
        }

        .symbol-btn {
            width: 62px;
            height: 52px;
            border: 3px solid #8da5c4;
            border-radius: 16px;
            background: #fff;
            color: #425a78;
            font-size: 31px;
            cursor: pointer;
            box-shadow: 0 5px 0 #65799522;
            transition: .15s
        }

        .symbol-btn:hover:not(:disabled) {
            transform: translateY(-4px)
        }

        .symbol-btn.selected {
            background: #f3c967;
            border-color: #bc902b;
            color: #614a20
        }

        .symbol-btn:disabled {
            cursor: not-allowed;
            opacity: .58
        }

        .robot {
            position: absolute;
            left: 47%;
            bottom: 3%;
            font-size: 54px;
            z-index: 10;
            transform: translateX(-50%)
        }

        .submit-btn {
            position: absolute;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            min-width: 155px;
            height: 50px;
            padding: 0 28px;
            border: 0;
            border-radius: 17px;
            background: #2f4f4f;
            color: #fff;
            font-size: 20px;
            font-weight: 400;
            cursor: pointer;
            box-shadow: 0 8px 0 #1439392e;
            z-index: 40
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateX(-50%) translateY(-3px)
        }

        .submit-btn:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .nav-btn {
            position: absolute;
            bottom: 19px;
            min-width: 126px;
            height: 46px;
            padding: 0 18px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 600;
            color: #2f4f4f;
            cursor: pointer;
            z-index: 40;
            box-shadow: 0 8px 18px #2f4f4f1f
        }

        #prevBtn {
            left: clamp(20px, 4vw, 70px);
            background: #a9cbe2;
            border: 2px solid #79a9c7
        }

        #nextBtn {
            right: clamp(20px, 4vw, 70px);
            background: #efbca6;
            border: 2px solid #d99074
        }

        .nav-btn:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 100;
            width: min(440px, 88vw);
            min-height: 215px;
            padding: 26px 30px 28px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(.7);
            transition: .28s cubic-bezier(.2, .9, .25, 1.25);
            box-shadow: 0 20px 50px #20393938
        }

        .feedback.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1)
        }

        .correct-popup {
            background: linear-gradient(135deg, #e2f6e9, #f4fcf6);
            border: 5px solid #16834f
        }

        .wrong-popup {
            background: linear-gradient(135deg, #fde6e2, #fff7f5);
            border: 5px solid #c94740
        }

        .feedback-icon {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            border-radius: 24px 24px 24px 8px;
            font-size: 34px;
            color: #fff;
            box-shadow: 0 5px 0 #00000014
        }

        .correct-popup .feedback-icon {
            background: #16834f
        }

        .wrong-popup .feedback-icon {
            background: #c94740
        }

        .feedback h3 {
            font-size: 28px;
            font-weight: 600;
            color: #2f4f4f
        }

        .feedback p {
            font-size: 17px;
            color: #607878
        }

        .final-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 200;
            width: min(520px, 91vw);
            padding: 38px 36px 32px;
            text-align: center;
            border-radius: 34px;
            background: linear-gradient(145deg, #d8d0ff, #aeb8f4 58%, #8999e2);
            border: 5px solid #5d55a6;
            box-shadow: 0 10px 0 #28286438, 0 28px 70px #0003;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(.72);
            transition: .34s
        }

        .final-popup.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1)
        }

        .final-emoji {
            font-size: 78px;
            margin-bottom: 8px
        }

        .final-popup h2 {
            font-size: 36px;
            font-weight: 700;
            color: #34306e;
            margin-bottom: 8px
        }

        .final-popup p {
            font-size: 18px;
            font-weight: 500;
            color: #454879;
            margin-bottom: 24px
        }

        .play-again-btn {
            min-width: 185px;
            height: 52px;
            padding: 0 28px;
            border: 0;
            border-radius: 17px;
            background: #55479a;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 7px 0 #2d265a40
        }

        @media(min-width:1400px) {

            /* Full monitor responsive layout */
            .header {
                height: 100px;
                padding: 10px 120px;
            }

            .heading {
                font-size: 30px;
                font-weight: 400;
                line-height: 1.3;
            }

            .home {
                width: 70px;
                height: 70px;
                right: 32px;
                top: 20px;
                font-size: 32px;
                border-radius: 20px;
            }

            .stage {
                top: 100px;
                bottom: 90px;
                padding: 8px 4vw;
            }

            .arcade {
                width: min(1180px, 92vw);
                height: min(650px, calc(100vh - 190px));
            }

            .title {
                font-size: 16px;
                letter-spacing: 2px;
                top: 2px;
            }

            .title:before,
            .title:after {
                width: 55px;
                height: 3px;
                margin: 0 14px;
            }

            .prompt {
                font-size: 40px;
                font-weight: 400;
                top: 30px;
            }

            .path {
                inset: 95px 30px 25px;
            }

            .pathline {
                height: 10px;
            }

            .gate {
                width: 290px;
                height: 175px;
                border-width: 4px;
                border-radius: 30px;
            }

            .gate.a {
                left: 4%;
                top: 9%;
            }

            .gate.b {
                right: 4%;
                bottom: 9%;
            }

            .gate:before {
                width: 82px;
                height: 82px;
                top: -43px;
                border-width: 5px;
            }

            .gate-tag {
                font-size: 14px;
                letter-spacing: 1.5px;
                margin-bottom: 12px;
            }

            .gate-number {
                font-size: 52px;
                font-weight: 500;
                letter-spacing: 3px;
            }

            /* Smaller center lock to avoid overlap */
            .lock {
                width: 150px;
                height: 150px;
                border-width: 7px;
                box-shadow: 0 10px 0 #6f604633, 0 0 0 10px #ffffffaa;
            }

            .lock:before {
                width: 88px;
                height: 88px;
                border-width: 4px;
            }

            .lock-core {
                width: 64px;
                height: 64px;
                border-width: 4px;
                font-size: 32px;
            }

            .lock-label {
                bottom: -31px;
                padding: 6px 15px;
                font-size: 11px;
            }

            .symbol-zone {
                width: 430px;
                height: 108px;
                border-width: 4px;
                border-radius: 27px;
                gap: 15px;
            }

            .symbol-label {
                font-size: 12px;
                padding: 6px 17px;
                top: -15px;
            }

            .symbol-btn {
                width: 68px;
                height: 56px;
                border-width: 3px;
                font-size: 33px;
            }

            .robot {
                font-size: 58px;
            }

            /* Monitor buttons */
            .submit-btn,
            .nav-btn {
                width: 200px;
                min-width: 200px;
                height: 60px;
                font-size: 30px;
                padding: 0;
            }

            .submit-btn {
                bottom: 18px;
            }

            .nav-btn {
                bottom: 20px;
            }

            #prevBtn {
                left: clamp(20px, 4vw, 80px);
            }

            #nextBtn {
                right: clamp(20px, 4vw, 80px);
            }

            .feedback {
                width: min(520px, 42vw);
                min-height: 250px;
                padding: 30px 34px;
            }

            .feedback-icon {
                width: 76px;
                height: 76px;
                font-size: 38px;
            }

            .feedback h3 {
                font-size: 30px;
            }

            .feedback p {
                font-size: 19px;
            }

            .final-popup {
                width: min(600px, 45vw);
                padding: 42px 40px 36px;
            }

            .final-emoji {
                font-size: 86px;
            }

            .final-popup h2 {
                font-size: 40px;
            }

            .final-popup p {
                font-size: 20px;
            }

            .play-again-btn {
                min-width: 200px;
                height: 60px;
                font-size: 24px;
            }
        }

        @media(min-width:651px) and (max-height:760px) {
            .stage {
                top: 72px;
                bottom: 82px
            }

            .arcade {
                height: min(520px, calc(100vh - 160px))
            }

            .prompt {
                top: 23px;
                font-size: 26px
            }

            .path {
                inset: 68px 25px 16px
            }

            .gate {
                width: 230px;
                height: 132px
            }

            .gate-number {
                font-size: 40px
            }

            .lock {
                width: 160px;
                height: 160px
            }

            .lock-core {
                width: 66px;
                height: 66px;
                font-size: 31px
            }

            .symbol-zone {
                height: 92px
            }

            .robot {
                font-size: 44px
            }
        }

        @media(max-width:850px) {
            .gate {
                width: 220px;
                height: 138px
            }

            .gate-number {
                font-size: 39px
            }

            .symbol-zone {
                width: 380px
            }
        }

        @media(max-width:650px) {
            .header {
                height: 62px;
                padding: 5px 58px 5px 8px
            }

            .heading {
                font-size: 16px
            }

            .home {
                width: 44px;
                height: 44px;
                right: 10px;
                top: 9px;
                font-size: 21px;
                border-radius: 14px
            }

            .stage {
                top: 62px;
                bottom: 70px;
                padding: 0 5px
            }

            .arcade {
                height: min(470px, calc(100vh - 142px));
                width: 100%
            }

            .title {
                font-size: 8px;
                top: 0
            }

            .title:before,
            .title:after {
                width: 22px;
                margin: 0 6px
            }

            .prompt {
                top: 25px;
                font-size: 21px
            }

            .path {
                inset: 63px 8px 15px
            }

            .pathline {
                left: 18%;
                right: 18%;
                top: 49%;
                transform: rotate(-12deg);
                height: 7px
            }

            .gate {
                width: 150px;
                height: 105px;
                border-width: 3px;
                border-radius: 20px
            }

            .gate.a {
                left: 2%;
                top: 8%
            }

            .gate.b {
                right: 2%;
                bottom: 16%
            }

            .gate:before {
                width: 54px;
                height: 54px;
                top: -29px;
                border-width: 4px
            }

            .gate-tag {
                font-size: 8px;
                margin-bottom: 6px
            }

            .gate-number {
                font-size: 27px;
                letter-spacing: 1px
            }

            .lock {
                width: 125px;
                height: 125px;
                border-width: 6px;
                box-shadow: 0 8px 0 #6f604633, 0 0 0 8px #ffffffaa
            }

            .lock:before {
                width: 72px;
                height: 72px;
                border-width: 3px
            }

            .lock-core {
                width: 53px;
                height: 53px;
                border-width: 3px;
                border-radius: 15px;
                font-size: 25px
            }

            .lock-label {
                bottom: -27px;
                padding: 4px 10px;
                font-size: 8px;
                border-width: 2px
            }

            .symbol-zone {
                width: 300px;
                height: 82px;
                border-width: 3px;
                border-radius: 20px;
                gap: 8px;
                bottom: 0
            }

            .symbol-label {
                font-size: 8px;
                padding: 4px 10px;
                border-width: 2px;
                top: -11px
            }

            .symbol-btn {
                width: 47px;
                height: 43px;
                border-width: 2px;
                border-radius: 12px;
                font-size: 25px
            }

            .robot {
                font-size: 36px;
                left: 48%;
                bottom: 1%
            }

            .submit-btn {
                bottom: 12px;
                min-width: 155px;
                height: 50px;
                font-size: 18px
            }

            .nav-btn {
                bottom: 14px;
                min-width: 126px;
                height: 46px;
                padding: 0 10px;
                font-size: 18px
            }

            #prevBtn {
                left: 8px
            }

            #nextBtn {
                right: 8px
            }

            .feedback {
                width: min(440px, 90vw);
                min-height: 215px
            }

            .final-popup {
                width: 91vw;
                padding: 30px 22px
            }

            .final-popup h2 {
                font-size: 30px
            }

            .final-emoji {
                font-size: 64px
            }
        }
    </style>
</head>

<body>
    <div class="game">


        <header class="header">
            <div class="heading">Place the correct symbol &lt;, &gt; or =</div>
        </header>

        <main class="stage">
            <div class="arcade">
                <div class="title">Roman code • Unlock the answer</div>
                <div id="questionText" class="prompt"></div>
                <div class="path">
                    <div class="pathline"></div>
                    <div class="gate a">
                        <div class="gate-tag"></div>
                        <div id="leftRoman" class="gate-number"></div>
                    </div>
                    <div class="gate b">
                        <div class="gate-tag"></div>
                        <div id="rightRoman" class="gate-number"></div>
                    </div>
                    <div class="lock">
                        <div class="lock-core" id="lockCore">?</div>
                        <div class="lock-label">Choose the code</div>
                    </div>
                    <div class="symbol-zone">
                        <div class="symbol-label">🔑 Code symbol</div><button class="symbol-btn"
                            data-symbol="&lt;">&lt;</button><button class="symbol-btn" data-symbol="=">=</button><button
                            class="symbol-btn" data-symbol="&gt;">&gt;</button>
                    </div>
                    <div class="robot">🤖</div>
                </div>
            </div>
        </main>
        <button id="submitBtn" class="submit-btn">Submit ✓</button>
        <button id="prevBtn" class="nav-btn" disabled>← Back</button>
        <button id="nextBtn" class="nav-btn" disabled>Next →</button>
        <div id="correctPopup" class="feedback correct-popup">
            <div class="feedback-icon">🎉</div>
            <h3>Perfect!</h3>
            <p>Great detective work! You found the correct symbol.</p>
        </div>
        <div id="wrongPopup" class="feedback wrong-popup">
            <div class="feedback-icon">😕</div>

        </div>
        <div id="finalPopup" class="final-popup">
            <div class="final-emoji">🏆</div>

            <p>You cracked every Roman code!</p><button id="playAgainBtn" class="play-again-btn">↻ Play again</button>
        </div>
    </div>
    <script>
        const questions = [{ label: "a)", left: "LXVI", right: "LXXIV", answer: "<" }, { label: "b)", left: "DCCII", right: "DCCC", answer: "<" }, { label: "c)", left: "CMXC", right: "CMXC", answer: "=" }, { label: "d)", left: "MCCCLVI", right: "MCCCLIV", answer: ">" }];



        function disableNavigationAfterFinal() {
            document.querySelectorAll(".nav-btn").forEach(btn => {
                btn.disabled = true;
                btn.style.pointerEvents = "none";
                btn.setAttribute("aria-disabled", "true");
            });
        }

        function updateLockSymbol(symbol) {
            const lockCore = document.getElementById("lockCore");
            if (lockCore) {
                lockCore.textContent = symbol || "?";
            }
        }

        function speak(t) { speechSynthesis.cancel(); const msg = new SpeechSynthesisUtterance(t); msg.lang = "en-US"; msg.volume = .25; msg.rate = 1; msg.pitch = 1; speechSynthesis.speak(msg) }
        let currentQuestion = 0, selected = "";
        const savedAnswers = questions.map(() => ({ answer: "", completed: false }));
        const q = document.getElementById("questionText"), left = document.getElementById("leftRoman"), right = document.getElementById("rightRoman"), submit = document.getElementById("submitBtn"), back = document.getElementById("prevBtn"), next = document.getElementById("nextBtn"), correct = document.getElementById("correctPopup"), wrong = document.getElementById("wrongPopup"), final = document.getElementById("finalPopup"), again = document.getElementById("playAgainBtn"), buttons = [...document.querySelectorAll(".symbol-btn")];
        buttons.forEach(b => b.addEventListener("click", () => { if (savedAnswers[currentQuestion].completed) return; buttons.forEach(x => x.classList.remove("selected")); b.classList.add("selected"); selected = b.dataset.symbol; submit.disabled = false }));
        function load() { correct.classList.remove("show"); wrong.classList.remove("show"); const x = questions[currentQuestion], s = savedAnswers[currentQuestion]; q.textContent = ""; left.textContent = x.left; right.textContent = x.right; selected = s.answer; updateLockSymbol(s.completed ? s.answer : "?"); buttons.forEach(b => { b.classList.toggle("selected", b.dataset.symbol === selected); b.disabled = s.completed }); submit.disabled = s.completed || !selected; next.disabled = !s.completed || currentQuestion === questions.length - 1; back.disabled = currentQuestion === 0 }
        function check() { if (!selected) return; const x = questions[currentQuestion]; if (selected === x.answer) { savedAnswers[currentQuestion] = { answer: selected, completed: true }; updateLockSymbol(selected); buttons.forEach(b => b.disabled = true); submit.disabled = true; correct.classList.add("show"); speak("Correct!"); setTimeout(() => { correct.classList.remove("show"); if (currentQuestion === questions.length - 1) { final.classList.add("show"); disableNavigationAfterFinal(); } else next.disabled = false }, 1500) } else { wrong.classList.add("show"); speak("Try again."); setTimeout(() => { wrong.classList.remove("show"); selected = ""; updateLockSymbol("?"); buttons.forEach(b => b.classList.remove("selected")); submit.disabled = true }, 1500) } }
        submit.addEventListener("click", check);
        next.addEventListener("click", () => { if (savedAnswers[currentQuestion].completed && currentQuestion < questions.length - 1) { currentQuestion++; load() } });
        back.addEventListener("click", () => { if (currentQuestion > 0) { currentQuestion--; load() } });
        again.addEventListener("click", () => { currentQuestion = 0; savedAnswers.forEach(x => { x.answer = ""; x.completed = false }); final.classList.remove("show"); back.disabled = true; next.disabled = true; back.style.pointerEvents = ""; next.style.pointerEvents = ""; back.removeAttribute("aria-disabled"); next.removeAttribute("aria-disabled"); load() });

<script>
/* ===== CONFETTI CELEBRATION (right & final popups) ===== */
(function () {
  let canvas, ctx, pieces = [], raf = null;
  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
    document.body.appendChild(canvas);
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
  function burst(count) {
    ensureCanvas();
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - .5) * 180,
        y: innerHeight / 2 + (Math.random() - .5) * 90,
        vx: (Math.random() - .5) * 11,
        vy: Math.random() * -13 - 4,
        g: 0.30 + Math.random() * 0.14,
        s: 6 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * 0.4,
        color: colors[i % colors.length],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
    pieces.forEach(p => {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (pieces.length) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.fireConfetti = function (big) {
    if (big) {
      burst(170);
      let n = 0;
      const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
    } else {
      burst(90);
    }
  };
  function watch(id, big) {
    const el = document.getElementById(id);
    if (!el) return;
    let was = el.classList.contains("show");
    new MutationObserver(() => {
      const now = el.classList.contains("show");
      if (now && !was) window.fireConfetti(big);
      was = now;
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  function init() { watch("correctPopup", false); watch("finalPopup", true); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
