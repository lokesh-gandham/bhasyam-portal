<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>Face Value & Place Value</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Livvic", sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            color: #2f4f4f;

        }


        .game {
            width: 100vw;
            height: 100vh;

            position: relative;
            overflow: hidden;
        }


        .grid {
            position: absolute;
            inset: 0;

            opacity: .22;

            background-image:

                linear-gradient(rgba(74, 128, 130, .18) 1px,
                    transparent 1px),

                linear-gradient(90deg,
                    rgba(74, 128, 130, .18) 1px,
                    transparent 1px);

            background-size: 42px 42px;

            pointer-events: none;
        }




        header {
            height: 95px;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;
            z-index: 5;
        }

        .heading {
            text-align: center;

            color: #2f4f4f;

            font-size: 22px;
            font-weight: 400;

            padding: 0 20px;
        }



        .stage {
            position: absolute;

            top: 95px;
            bottom: 82px;

            left: 0;
            right: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 5px 5vw;

            z-index: 2;
        }


        .game-badge {
            display: flex;

            align-items: center;

            gap: 10px;

            padding: 8px 22px;

            margin-bottom: 18px;

            border-radius: 999px;

            background: #fff2c9;

            border: 2px solid #e5b85b;

            color: #71582d;

            font-size: 18px;
            font-weight: 500;

            box-shadow:
                0 6px 0 rgba(189, 132, 24, .12);
        }

        .question {
            width: 100%;

            text-align: center;

            font-size: 30px;
            font-weight: 400;

            line-height: 1.35;

            color: #2f4f4f;

            margin-bottom: 25px;
        }



        .scanner {
            position: relative;

            width: min(760px, 90vw);

            min-height: 115px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 32px;
        }

        .scan-line {
            position: absolute;

            width: 100%;

            top: 50%;

            border-top: 3px dashed rgba(67, 145, 147, .45);
        }

        .scan-corner {
            position: absolute;

            width: 26px;
            height: 26px;

            border-color: #5a9d9e;
        }

        .corner-tl {
            left: 0;
            top: 0;

            border-left: 4px solid;
            border-top: 4px solid;
        }

        .corner-tr {
            right: 0;
            top: 0;

            border-right: 4px solid;
            border-top: 4px solid;
        }

        .corner-bl {
            left: 0;
            bottom: 0;

            border-left: 4px solid;
            border-bottom: 4px solid;
        }

        .corner-br {
            right: 0;
            bottom: 0;

            border-right: 4px solid;
            border-bottom: 4px solid;
        }



        .number-display {
            position: relative;

            z-index: 2;

            display: flex;

            align-items: flex-end;
            justify-content: center;

            gap: 2px;

            padding: 17px 32px;

            background: rgba(255, 255, 255, .66);

            border-radius: 18px;

            border: 2px solid rgba(76, 143, 144, .35);

            box-shadow:
                0 10px 25px rgba(48, 91, 92, .10);

            font-size: 42px;

            font-weight: 400;

            letter-spacing: 3px;

            color: #344e4f;
        }

        .digit {
            position: relative;
            display: inline-block;
        }

        .target-digit {
            color: #d6534c;
            padding: 0 4px;
        }

        .target-digit::after {
            content: "";

            position: absolute;

            left: 2px;
            right: 2px;

            height: 3px;

            bottom: -5px;

            background: #d6534c;

            border-radius: 10px;
        }

        .scan-icon {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 54px;
            height: 54px;

            border-radius: 15px;

            display: grid;

            place-items: center;

            background: #fff;

            border: 3px solid #e7b95e;

            font-size: 26px;

            box-shadow:
                0 6px 0 rgba(180, 124, 27, .12);
        }

        .scan-left {
            left: -78px;
        }

        .scan-right {
            right: -78px;
        }


        .answer-zone {
            width: min(900px, 94vw);

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 60px;
        }

        .answer-station {
            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;
        }

        .station-icon {
            width: 58px;
            height: 58px;

            display: grid;

            place-items: center;

            border-radius: 16px;

            font-size: 28px;

            margin-bottom: 9px;

            background: #d9eeee;

            border: 3px solid #65a8aa;

            box-shadow:
                0 6px 0 rgba(58, 127, 129, .13);
        }

        .station-label {
            font-size: 20px;

            font-weight: 500;

            color: #456566;

            margin-bottom: 10px;
        }

        .answer-input {
            width: 178px;
            height: 45px;

            border: none;
            outline: none;

            text-align: center;

            font-size: 21px;

            color: #2f4f4f;

            background: #fff;

            border-radius: 12px;

            box-shadow:
                inset 0 0 0 3px #ec9e59,
                0 6px 0 rgba(181, 106, 42, .13);

            transition: .2s;
        }

        .answer-input:focus {
            transform: translateY(-2px);

            box-shadow:
                inset 0 0 0 3px #4c9c9d,
                0 0 0 6px rgba(76, 156, 157, .12);
        }

        .answer-input.correct {
            background: #eefbf3;

            box-shadow:
                inset 0 0 0 4px #55b97f,
                0 6px 0 rgba(35, 121, 73, .12);
        }

        .answer-input.wrong {
            background: #fff2f0;

            box-shadow:
                inset 0 0 0 4px #dd655d;

            animation: shake .35s;
        }

        @keyframes shake {

            25% {
                transform: translateX(-7px);
            }

            50% {
                transform: translateX(7px);
            }

            75% {
                transform: translateX(-4px);
            }

        }


        .submit-btn {

            position: absolute;

            left: 50%;
            bottom: 20px;

            transform: translateX(-50%);

            z-index: 20;

            pointer-events: auto;

            border: none;

            cursor: pointer;

            font-family: "Livvic", sans-serif;

            font-size: 20px;

            font-weight: 500;

            transition: .2s;

            min-width: 155px;

            height: 50px;

            padding: 0 28px;

            border-radius: 18px;

            background: #2f4f4f;

            color: white;

            box-shadow:
                0 8px 0 rgba(22, 59, 59, .18),
                0 13px 25px rgba(47, 79, 79, .20);
        }

        .submit-btn:hover:not(:disabled) {

            transform:
                translateX(-50%) translateY(-3px);
        }

        .submit-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }



        .nav-btn {
            position: absolute;

            bottom: 22px;

            min-width: 126px;
            height: 46px;

            padding: 0 19px;

            border-radius: 15px;

            border: 2px solid rgba(47, 79, 79, .12);

            color: #2f4f4f;

            font-size: 20px;

            font-weight: 500;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(47, 79, 79, .12);

            transition: .2s;

            z-index: 20;
        }

        #prevBtn {
            left: clamp(20px, 4vw, 70px);
            background: #91bbd7;
        }

        #nextBtn {
            right: clamp(20px, 4vw, 70px);
            background: #e9ad92;
        }

        .nav-btn:hover:not(:disabled) {
            transform: translateY(-3px);
        }

        .nav-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }


        .feedback {
            position: absolute;

            top: 50%;
            left: 50%;

            z-index: 50;

            width: min(390px, 88vw);

            min-height: 235px;

            padding: 30px;

            border-radius: 30px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            opacity: 0;

            pointer-events: none;

            transform:
                translate(-50%, -50%) scale(.7) rotate(-4deg);

            transition: .28s cubic-bezier(.2, .9, .25, 1.25);

            box-shadow:
                0 20px 50px rgba(32, 57, 57, .22);
        }

        .feedback.show {
            opacity: 1;

            transform:
                translate(-50%, -50%) scale(1) rotate(0);
        }

        .correct-popup {
            background: linear-gradient(135deg,
                    #e0f5e8,
                    #f5fcf7);

            border: 5px solid #16834f;
        }

        .wrong-popup {
            background: linear-gradient(135deg,
                    #fde4e0,
                    #fff5f3);

            border: 5px solid #c94740;
        }

        .feedback-icon {
            width: 75px;
            height: 75px;

            display: grid;

            place-items: center;

            background: #fff;

            border-radius: 22px 22px 22px 8px;

            font-size: 42px;

            margin-bottom: 12px;

            box-shadow:
                0 5px 0 rgba(0, 0, 0, .08);
        }

        .feedback h3 {
            font-size: 29px;
            margin-bottom: 8px;
        }

        .feedback p {
            font-size: 17px;
            color: #607878;
        }

        .final-popup {
            position: absolute;

            top: 50%;
            left: 50%;

            z-index: 60;

            width: min(520px, 91vw);

            padding: 38px 36px 32px;

            text-align: center;

            border-radius: 34px;

            background:
                radial-gradient(circle at 87% 18%,
                    rgba(255, 222, 115, .78) 0 12px,
                    transparent 13px),

                radial-gradient(circle at 16% 83%,
                    rgba(255, 190, 214, .5) 0 10px,
                    transparent 11px),

                linear-gradient(145deg,
                    #eadcff,
                    #cbb5f4 58%,
                    #b89ae8);

            border: 5px solid #7350a8;

            box-shadow:
                0 10px 0 rgba(83, 55, 126, .18),
                0 28px 70px rgba(55, 38, 80, .30);

            opacity: 0;

            pointer-events: none;

            transform:
                translate(-50%, -50%) scale(.72);

            transition: .34s cubic-bezier(.2, .9, .25, 1.25);
        }

        .final-popup.show {
            opacity: 1;

            pointer-events: auto;

            transform:
                translate(-50%, -50%) scale(1);
        }

        .final-emoji {
            font-size: 75px;
            margin-bottom: 10px;
        }

        .final-popup h2 {
            font-size: 36px;

            color: #4c3272;

            margin-bottom: 8px;
        }

        .final-popup p {
            font-size: 18px;

            color: #5f4a7a;

            margin-bottom: 24px;
        }

        .play-again-btn {
            min-width: 185px;

            height: 52px;

            border: none;

            border-radius: 17px;

            background: #68449a;

            color: white;

            font-size: 20px;

            font-weight: 500;

            cursor: pointer;

            box-shadow:
                0 7px 0 rgba(70, 44, 106, .2);
        }


        @media(min-width:1400px) {

            /* Full-page monitor responsive layout */
            header {
                height: 100px;
                padding: 4px 110px;
            }

            .heading {
                font-size: 30px;
                font-weight: 400;
                line-height: 1.25;
            }

            .stage {
                top: 100px;
                bottom: 92px;
                padding: 0 3vw;
            }

            .game-badge {
                font-size: 20px;
                padding: 10px 28px;
                margin-bottom: 22px;
            }

            .question {
                font-size: 40px;
                font-weight: 400;
                line-height: 1.25;
                margin-bottom: 30px;
            }

            .scanner {
                width: min(1050px, 78vw);
                min-height: 145px;
                margin-bottom: 38px;
            }

            .scan-corner {
                width: 34px;
                height: 34px;
            }

            .scan-icon {
                width: 64px;
                height: 64px;
                font-size: 30px;
                border-radius: 18px;
            }

            .scan-left {
                left: -92px;
            }

            .scan-right {
                right: -92px;
            }

            .number-display {
                padding: 20px 42px;
                border-radius: 22px;
                font-size: 50px;
                letter-spacing: 4px;
            }

            .answer-zone {
                width: min(1200px, 82vw);
                gap: 110px;
            }

            .station-icon {
                width: 68px;
                height: 68px;
                font-size: 32px;
                border-radius: 18px;
                margin-bottom: 11px;
            }

            .station-label {
                font-size: 22px;
                margin-bottom: 12px;
            }

            .answer-input {
                width: 210px;
                height: 56px;
                font-size: 26px;
                border-radius: 15px;
            }

            /* Monitor navigation buttons */
            .nav-btn {
                width: 200px;
                min-width: 200px;
                height: 60px;
                padding: 0;
                font-size: 30px;
                border-radius: 18px;
            }

            #prevBtn {
                left: 70px;
                bottom: 16px;
            }

            #nextBtn {
                right: 70px;
                bottom: 16px;
            }

            /* Monitor submit button */
            .submit-btn {
                width: 200px;
                min-width: 200px;
                height: 60px;
                padding: 0;
                font-size: 30px;
                bottom: 16px;
            }

            .feedback {
                width: min(540px, 42vw);
                min-height: 285px;
                padding: 38px;
            }

            .feedback-icon {
                width: 82px;
                height: 82px;
                font-size: 46px;
            }

            .feedback h3 {
                font-size: 32px;
            }

            .feedback p {
                font-size: 19px;
            }

            .final-popup {
                width: min(620px, 52vw);
                padding: 44px 42px 38px;
            }

            .final-emoji {
                font-size: 88px;
            }

            .final-popup h2 {
                font-size: 40px;
            }

            .final-popup p {
                font-size: 20px;
            }

            .play-again-btn {
                min-width: 210px;
                height: 58px;
                font-size: 22px;
            }

        }


        @media(max-height:720px) {

            .game-badge {
                margin-bottom: 8px;
            }

            .question {
                margin-bottom: 15px;
            }

            .scanner {
                margin-bottom: 20px;
            }

        }

        @media(max-width:750px) {

            header {
                height: 70px;
            }

            .stage {
                top: 70px;
                bottom: 75px;

                padding: 5px 10px;
            }

            .heading {
                font-size: 18px;
            }

            .game-badge {
                font-size: 14px;

                margin-bottom: 10px;

                padding: 7px 15px;
            }

            .question {
                font-size: 22px;

                margin-bottom: 15px;
            }

            .scanner {
                min-height: 95px;

                margin-bottom: 25px;
            }

            .number-display {
                font-size: 29px;

                padding: 14px 15px;

                letter-spacing: 1px;
            }

            .scan-icon {
                display: none;
            }

            .answer-zone {
                gap: 18px;
            }

            .station-icon {
                width: 48px;
                height: 48px;

                font-size: 23px;
            }

            .station-label {
                font-size: 15px;
            }

            .answer-input {
                width: 135px;

                height: 43px;

                font-size: 18px;
            }

            .submit-btn {

                bottom: 12px;

                min-width: 130px;

                height: 45px;

                padding: 0 18px;

                font-size: 17px;
            }

            .nav-btn {

                bottom: 14px;

                min-width: 85px;

                height: 42px;

                padding: 0 10px;

                font-size: 16px;
            }

        }
    </style>
</head>

<body>

    <div class="game">

        <div class="grid"></div>

        <div class="pixel pixel1"></div>
        <div class="pixel pixel2"></div>
        <div class="pixel pixel3"></div>
        <div class="pixel pixel4"></div>


        <!-- HEADER -->

        <header>

            <div class="heading">

                Write the
                <span class="highlight">face value</span>
                and
                <span class="highlight">place value</span>
                of the underlined digit

            </div>

        </header>

        <main class="stage">



            <!-- NUMBER -->

            <div class="scanner">

                <div class="scan-line"></div>

                <div class="scan-corner corner-tl"></div>
                <div class="scan-corner corner-tr"></div>
                <div class="scan-corner corner-bl"></div>
                <div class="scan-corner corner-br"></div>

                <div class="scan-icon scan-left">
                    📡
                </div>

                <div class="scan-icon scan-right">
                    🎯
                </div>

                <div class="number-display" id="numberDisplay"></div>

            </div>


            <!-- ANSWERS -->

            <div class="answer-zone">


                <div class="answer-station">

                    <div class="station-icon">
                        👁️
                    </div>

                    <div class="station-label">
                        Face Value
                    </div>

                    <input type="text" id="faceInput" class="answer-input" autocomplete="off">

                </div>


                <div class="answer-station">

                    <div class="station-icon">
                        📍
                    </div>

                    <div class="station-label">
                        Place Value
                    </div>

                    <input type="text" id="placeInput" class="answer-input" autocomplete="off">

                </div>


            </div>

        </main>


        <!-- SUBMIT - BOTTOM CENTER -->

        <button class="submit-btn" id="submitBtn">
            Submit ✓
        </button>


        <!-- NAVIGATION -->

        <button class="nav-btn" id="prevBtn" disabled>
            ← Back
        </button>


        <button class="nav-btn" id="nextBtn" disabled>
            Next →
        </button>


        <!-- CORRECT POPUP -->

        <div class="feedback correct-popup" id="correctPopup">

            <div class="feedback-icon">
                🎉
            </div>

            <h3>Perfect!</h3>

            <p>
                Both values are correct!
            </p>

        </div>


        <!-- WRONG POPUP -->

        <div class="feedback wrong-popup" id="wrongPopup">

            <div class="feedback-icon">
                😕
            </div>

            <h3>Try again!</h3>

            <p>
                Check the digit carefully and try again.
            </p>

        </div>


        <!-- FINAL POPUP -->

        <div class="final-popup" id="finalPopup">

            <div class="final-emoji">🏆</div>

            <h2>Awesome!</h2>

            <p>
                You decoded every number successfully!
            </p>

            <button class="play-again-btn" id="playAgainBtn">
                ↻ Play Again
            </button>

        </div>

    </div>


    <script>

        function speak(t) {

            speechSynthesis.cancel();

            const msg = new SpeechSynthesisUtterance(t);

            msg.lang = "en-US";

            msg.volume = 0.25;

            msg.rate = 1;

            msg.pitch = 1;

            speechSynthesis.speak(msg);

        }

        const questions = [

           {
    number: "30954816",
    underlineIndex: 0,
    face: ["3"],
    place: ["30000000", "30,000,000"]
},

            {
                number: "81743652",
                underlineIndex: 1,
                face: ["1"],
                place: ["1000000", "1,000,000"]
            },

            {
                number: "589743126",
                underlineIndex: 4,
                face: ["4"],
                place: ["40000", "40,000"]
            }

        ];

        let currentQuestion = 0;


        const savedAnswers = questions.map(() => ({
            face: "",
            place: "",
            completed: false
        }));


        const numberDisplay =
            document.getElementById("numberDisplay");

        const faceInput =
            document.getElementById("faceInput");

        const placeInput =
            document.getElementById("placeInput");

        const submitBtn =
            document.getElementById("submitBtn");

        const prevBtn =
            document.getElementById("prevBtn");

        const nextBtn =
            document.getElementById("nextBtn");

        const correctPopup =
            document.getElementById("correctPopup");

        const wrongPopup =
            document.getElementById("wrongPopup");

        const finalPopup =
            document.getElementById("finalPopup");

        const playAgainBtn =
            document.getElementById("playAgainBtn");


        function normalize(value) {

            return value
                .trim()
                .replace(/,/g, "")
                .replace(/\s/g, "");

        }



        function renderNumber() {

            const q = questions[currentQuestion];

            numberDisplay.innerHTML = "";


            [...q.number].forEach((digit, index) => {

                const span =
                    document.createElement("span");

                span.className = "digit";

                span.textContent = digit;


                if (index === q.underlineIndex) {

                    span.classList.add(
                        "target-digit"
                    );

                }


                numberDisplay.appendChild(span);

            });

        }


        function loadQuestion() {

            correctPopup.classList.remove("show");

            wrongPopup.classList.remove("show");


            renderNumber();


            const saved =
                savedAnswers[currentQuestion];


            faceInput.value =
                saved.face;

            placeInput.value =
                saved.place;


            faceInput.classList.remove(
                "correct",
                "wrong"
            );

            placeInput.classList.remove(
                "correct",
                "wrong"
            );


            if (saved.completed) {

                faceInput.classList.add("correct");

                placeInput.classList.add("correct");

                faceInput.readOnly = true;

                placeInput.readOnly = true;

                submitBtn.disabled = true;


                nextBtn.disabled =
                    currentQuestion ===
                    questions.length - 1;

            } else {

                faceInput.readOnly = false;

                placeInput.readOnly = false;

                submitBtn.disabled = false;

                nextBtn.disabled = true;


                setTimeout(() => {

                    faceInput.focus();

                }, 100);

            }


            prevBtn.disabled =
                currentQuestion === 0;

        }

        function submitAnswer() {

            const face =
                normalize(faceInput.value);

            const place =
                normalize(placeInput.value);


            if (!face || !place) {

                if (!face) {

                    faceInput.focus();

                } else {

                    placeInput.focus();

                }

                return;

            }


            const q =
                questions[currentQuestion];


            const correctFace =
                q.face.some(answer => normalize(answer) === face);

            const correctPlace =
                q.place.some(answer => normalize(answer) === place);



            faceInput.classList.remove(
                "wrong",
                "correct"
            );

            placeInput.classList.remove(
                "wrong",
                "correct"
            );


            /* CORRECT */

            if (
                correctFace &&
                correctPlace
            ) {

                faceInput.classList.add("correct");

                placeInput.classList.add("correct");


                savedAnswers[currentQuestion] = {

                    face: faceInput.value,

                    place: placeInput.value,

                    completed: true

                };


                faceInput.readOnly = true;

                placeInput.readOnly = true;

                submitBtn.disabled = true;


                correctPopup.classList.add("show");


                speak("Correct!");


                setTimeout(() => {

                    correctPopup.classList.remove("show");


                    if (
                        currentQuestion ===
                        questions.length - 1
                    ) {

                        finalPopup.classList.add("show");



                    } else {

                        nextBtn.disabled = false;

                    }

                }, 1500);

            }


            /* WRONG */

            else {

                faceInput.classList.add("wrong");

                placeInput.classList.add("wrong");


                wrongPopup.classList.add("show");


                speak("Try again.");


                setTimeout(() => {

                    wrongPopup.classList.remove("show");

                    faceInput.classList.remove("wrong");

                    placeInput.classList.remove("wrong");


                    /* AUTOMATICALLY CLEAR WRONG ANSWERS */

                    faceInput.value = "";

                    placeInput.value = "";


                    savedAnswers[currentQuestion].face = "";

                    savedAnswers[currentQuestion].place = "";


                    faceInput.focus();

                }, 1500);

            }

        }


        submitBtn.addEventListener(
            "click",
            submitAnswer
        );


        nextBtn.addEventListener(
            "click",
            () => {

                if (
                    savedAnswers[currentQuestion].completed &&
                    currentQuestion < questions.length - 1
                ) {

                    currentQuestion++;

                    loadQuestion();

                }

            }
        );


        prevBtn.addEventListener(
            "click",
            () => {

                if (currentQuestion > 0) {

                    currentQuestion--;

                    loadQuestion();

                }

            }
        );


        faceInput.addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    placeInput.focus();

                }

            }
        );


        placeInput.addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    submitAnswer();

                }

            }
        );

        playAgainBtn.addEventListener(
            "click",
            () => {

                currentQuestion = 0;


                savedAnswers.forEach(item => {

                    item.face = "";

                    item.place = "";

                    item.completed = false;

                });


                finalPopup.classList.remove("show");


                loadQuestion();

            }
        );


        loadQuestion();

    </script>

<script>
/* ===== CONFETTI CELEBRATION (right & final popups) ===== */
(function () {
  let canvas, ctx, pieces = [], raf = null;
  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
    document.body.appendChild(canvas);
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
  function burst(count) {
    ensureCanvas();
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - .5) * 180,
        y: innerHeight / 2 + (Math.random() - .5) * 90,
        vx: (Math.random() - .5) * 11,
        vy: Math.random() * -13 - 4,
        g: 0.30 + Math.random() * 0.14,
        s: 6 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * 0.4,
        color: colors[i % colors.length],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
    pieces.forEach(p => {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (pieces.length) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.fireConfetti = function (big) {
    if (big) {
      burst(170);
      let n = 0;
      const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
    } else {
      burst(90);
    }
  };
  function watch(id, big) {
    const el = document.getElementById(id);
    if (!el) return;
    let was = el.classList.contains("show");
    new MutationObserver(() => {
      const now = el.classList.contains("show");
      if (now && !was) window.fireConfetti(big);
      was = now;
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  function init() { watch("correctPopup", false); watch("finalPopup", true); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
