<body>
<div class="game">
<header class="header"><div class="heading">Write the following Roman numerals in Hindu Arabic numerals.</div></header>
<!-- <button class="home" onclick="location.href='index.html'">⌂</button> -->
<main class="stage">
<div class="arena">

<div class="vault">
<div class="vault-head"><span>Unlock the number</span></div>
<div class="lock-zone">
<div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
<div class="core"><small>Secret code</small>?</div>
</div>
<div class="roman-caption">Roman code</div><div class="roman-display" id="romanNumber"></div>

<div class="entry">
<div class="entry-label">Enter the value</div>
<div class="answer-shell">
<span class="answer-icon">🔢</span>
<input id="answerInput" class="answer" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="Type the number">
<span class="answer-arrow">→</span>
</div>
</div>
</div>
</div>
</main>
<button id="submitBtn" class="submit-btn">Submit ✓</button>
<button id="prevBtn" class="nav-btn" disabled>← Back</button>
<button id="nextBtn" class="nav-btn" disabled>Next →</button>
<div id="correctPopup" class="feedback correct-popup"><div class="feedback-icon">🎉</div><h3>Perfect!</h3><p>Excellent Roman numeral conversion.</p></div>
<div id="wrongPopup" class="feedback wrong-popup"><div class="feedback-icon">😕</div><h3>Try again!</h3><p>Check the Roman numeral value and try again.</p></div>
<div id="finalPopup" class="final-popup"><div class="final-emoji">🏆</div><h2>Awesome!</h2><p>You completed every Roman numeral mission!</p><button id="playAgainBtn" class="play-again-btn">↻ Play again</button></div>
</div>
<script>
const questions=[{roman:"DXIII",answer:"513"},{roman:"MMMLVIII",answer:"3058"}];
let current=0,locked=false;
const saved=questions.map(()=>({answer:"",done:false}));
const romanNumber=document.getElementById("romanNumber"),answerInput=document.getElementById("answerInput"),submit=document.getElementById("submitBtn"),back=document.getElementById("prevBtn"),next=document.getElementById("nextBtn"),correct=document.getElementById("correctPopup"),wrong=document.getElementById("wrongPopup"),final=document.getElementById("finalPopup");
function speak(t){speechSynthesis.cancel();const m=new SpeechSynthesisUtterance(t);m.lang="en-US";m.volume=.25;m.rate=1;m.pitch=1;speechSynthesis.speak(m)}
function load(){const q=questions[current],s=saved[current];locked=s.done;romanNumber.textContent=q.roman;answerInput.value=s.answer;answerInput.disabled=locked;submit.disabled=locked||!answerInput.value.trim();next.disabled=!locked||current===questions.length-1;back.disabled=current===0;document.querySelector(".core").textContent=locked?"✓":"?"}
function check(){if(locked||!answerInput.value.trim())return;const q=questions[current],v=answerInput.value.trim();if(v===q.answer){saved[current]={answer:q.answer,done:true};locked=true;answerInput.value=q.answer;answerInput.disabled=true;submit.disabled=true;document.querySelector(".core").textContent="✓";next.disabled=current===questions.length-1;correct.classList.add("show");speak("Correct!");setTimeout(()=>{correct.classList.remove("show");if(current===questions.length-1){final.classList.add("show");back.disabled=true;next.disabled=true;back.style.pointerEvents="none";next.style.pointerEvents="none";back.setAttribute("aria-disabled","true");next.setAttribute("aria-disabled","true")}},1500)}else{wrong.classList.add("show");speak("Try again.");setTimeout(()=>{wrong.classList.remove("show");answerInput.value="";submit.disabled=true;answerInput.focus()},1500)}}
answerInput.addEventListener("input",()=>{if(locked)return;answerInput.value=answerInput.value.replace(/\D/g,"");submit.disabled=!answerInput.value.trim()});
answerInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!submit.disabled)check()});
submit.addEventListener("click",check);
next.addEventListener("click",()=>{if(saved[current].done&&current<questions.length-1){current++;load()}});
back.addEventListener("click",()=>{if(current>0){current--;load()}});
document.getElementById("playAgainBtn").addEventListener("click",()=>{saved.forEach(q=>{q.answer="";q.done=false});current=0;final.classList.remove("show");back.style.pointerEvents="";next.style.pointerEvents="";back.removeAttribute("aria-disabled");next.removeAttribute("aria-disabled");load()});
load();
</script>
<script>
/* ===== CONFETTI CELEBRATION (right & final popups) ===== */
(function () {
  let canvas, ctx, pieces = [], raf = null;
  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
    document.body.appendChild(canvas);
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
  function burst(count) {
    ensureCanvas();
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - .5) * 180,
        y: innerHeight / 2 + (Math.random() - .5) * 90,
        vx: (Math.random() - .5) * 11,
        vy: Math.random() * -13 - 4,
        g: 0.30 + Math.random() * 0.14,
        s: 6 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * 0.4,
        color: colors[i % colors.length],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
    pieces.forEach(p => {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (pieces.length) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.fireConfetti = function (big) {
    if (big) {
      burst(170);
      let n = 0;
      const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
    } else {
      burst(90);
    }
  };
  function watch(id, big) {
    const el = document.getElementById(id);
    if (!el) return;
    let was = el.classList.contains("show");
    new MutationObserver(() => {
      const now = el.classList.contains("show");
      if (now && !was) window.fireConfetti(big);
      was = now;
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  function init() { watch("correctPopup", false); watch("finalPopup", true); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
