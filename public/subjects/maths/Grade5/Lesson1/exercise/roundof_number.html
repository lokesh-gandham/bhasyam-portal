<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Rounding Quest</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Livvic',sans-serif}
html,body{width:100%;height:100%;overflow:hidden}
body{
 color:#2f4f4f;
 
}
.game{width:100vw;height:100vh;position:relative;overflow:hidden}

header{height:92px;display:flex;align-items:center;justify-content:center;position:relative;z-index:3}
.heading{font-size:22px;font-weight:400;color:#2f4f4f;text-align:center}

.stage{position:absolute;top:92px;bottom:82px;left:0;right:0;display:grid;place-items:center;z-index:2;padding:10px}
.quest{width:min(980px,94vw);height:min(520px,72vh);position:relative}
.quest-title{text-align:center;margin-bottom:14px}
.quest-title .badge{display:inline-flex;align-items:center;gap:10px;background:#fff8d9;border:2px solid #edc25f;border-radius:999px;padding:8px 22px;box-shadow:0 7px 0 rgba(210,157,44,.12)}
.quest-title b{font-size:18px;font-weight:400;color:#76542b}
.playfield{height:calc(100% - 58px);position:relative;border-radius:42px;
 background:linear-gradient(135deg,rgba(119,211,202,.17),rgba(255,255,255,.62),rgba(255,213,132,.18));
 border:2px dashed rgba(63,134,145,.35);overflow:hidden}
.playfield:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;border:22px solid rgba(73,177,174,.10);left:-95px;bottom:-105px}
.playfield:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;border:18px solid rgba(241,172,76,.11);right:-75px;top:-80px}
.star{position:absolute;font-size:26px;opacity:.75;animation:float 3s ease-in-out infinite alternate}
.s1{left:7%;top:16%}.s2{right:8%;bottom:17%;animation-delay:.8s}.s3{right:14%;top:22%;animation-delay:1.5s}
@keyframes float{to{transform:translateY(-10px) rotate(10deg)}}
.number-zone{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(390px,75vw);height:138px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.number-label{font-size:16px;letter-spacing:1.2px;color:#5e7b7b;font-weight:500;margin-bottom:5px}
.number-ball{width:300px;max-width:100%;height:84px;border-radius:50%;display:grid;place-items:center;
 background:linear-gradient(145deg,#ffdc82,#f7b84c);border:5px solid #fff7df;
 box-shadow:0 9px 0 rgba(188,120,28,.16),0 18px 30px rgba(116,90,38,.16);
 font-size:30px;font-weight:400;color:#53452e;letter-spacing:2px}
.targets{position:absolute;left:0;right:0;bottom:8%;display:flex;justify-content:space-between;align-items:center;padding:0 7%}
.target{width:clamp(220px,28vw,290px);height:116px;position:relative;display:flex;align-items:center;gap:13px;padding:16px 18px;border-radius:28px;
 background:rgba(255,255,255,.74);border:2px solid rgba(71,151,158,.35);box-shadow:0 12px 24px rgba(58,102,104,.10)}
.target.right{border-color:rgba(226,144,75,.42)}
.target-icon{width:62px;height:62px;flex:0 0 62px;border-radius:50%;display:grid;place-items:center;background:#bceae5;font-size:29px;border:3px solid #fff}
.target.right .target-icon{background:#ffd9b0}
.target-copy{flex:1}.target-copy h3{font-size:18px;font-weight:500;color:#34565c;margin-bottom:8px}
.target.right h3{color:#6d5136}
.answer{width:100%;height:43px;border:2px solid #7ebdbd;border-radius:12px;background:rgba(255,255,255,.95);outline:none;text-align:center;font-size:20px;color:#2f4f4f}
.right .answer{border-color:#e7a765}
.answer:focus{box-shadow:0 0 0 4px rgba(78,159,160,.14)}
.answer.correct{border-color:#57ba85;background:#effbf3}.answer.wrong{border-color:#e77669;background:#fff4f2;animation:shake .35s}
.answer:read-only{cursor:default}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.path{position:absolute;left:22%;right:22%;top:58%;height:2px;border-top:3px dashed rgba(78,148,153,.30);z-index:-1}
.controls{position:absolute;bottom:0;left:0;width:100%;height:82px;z-index:10;pointer-events:none}
.nav-btn,.submit-btn{position:absolute;pointer-events:auto;border:none;cursor:pointer;font-family:'Livvic',sans-serif;font-size:20px;font-weight:500;transition:.2s}
.nav-btn{bottom:22px;min-width:126px;height:46px;padding:0 19px;border-radius:15px;color:#2f4f4f;border:2px solid rgba(47,79,79,.12);box-shadow:0 8px 18px rgba(47,79,79,.12)}
#prevBtn{left:clamp(20px,4vw,70px);background:#a9cbe2}#nextBtn{right:clamp(20px,4vw,70px);background:#efbca6}
.nav-btn:hover:not(:disabled){transform:translateY(-3px)}.nav-btn:disabled{opacity:.55;cursor:not-allowed}
.submit-btn{left:50%;bottom:20px;transform:translateX(-50%);min-width:155px;height:50px;padding:0 28px;border-radius:18px;background:#2f4f4f;color:#fff;box-shadow:0 8px 0 rgba(22,59,59,.18),0 13px 25px rgba(47,79,79,.20)}
.submit-btn:hover{transform:translateX(-50%) translateY(-3px)}
.feedback{position:absolute;top:50%;left:50%;z-index:30;width:min(440px,88vw);min-height:215px;padding:26px 30px 28px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.7) rotate(-4deg);transition:.28s cubic-bezier(.2,.9,.25,1.25);box-shadow:0 20px 50px rgba(32,57,57,.22)}
.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
.correct-popup{background:linear-gradient(135deg,#e2f6e9,#f4fcf6);border:5px solid #16834f}.wrong-popup{background:linear-gradient(135deg,#fde6e2,#fff7f5);border:5px solid #c94740}
.feedback-icon{width:68px;height:68px;display:grid;place-items:center;border-radius:22px 22px 22px 7px;font-size:36px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.feedback-copy h3{font-size:28px;font-weight:500;margin-bottom:4px}.feedback-copy p{font-size:17px;color:#607878}
.final-popup{position:absolute;top:50%;left:50%;z-index:35;width:min(520px,91vw);padding:38px 36px 32px;text-align:center;border-radius:34px;background:radial-gradient(circle at 87% 18%,rgba(255,222,115,.78) 0 12px,transparent 13px),radial-gradient(circle at 16% 83%,rgba(255,190,214,.5) 0 10px,transparent 11px),linear-gradient(145deg,#eadcff,#cbb5f4 58%,#b89ae8);border:5px solid #7350a8;box-shadow:0 10px 0 rgba(83,55,126,.18),0 28px 70px rgba(55,38,80,.30);opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.72);transition:.34s cubic-bezier(.2,.9,.25,1.25)}
.final-popup.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.final-emoji{font-size:78px;margin-bottom:8px}.final-popup h2{font-size:36px;color:#4c3272;margin-bottom:8px}.final-popup p{font-size:18px;color:#5f4a7a;margin-bottom:24px;font-weight:500}
.play-again-btn{min-width:185px;height:52px;border:none;border-radius:17px;background:#68449a;color:#fff;font-family:'Livvic',sans-serif;font-size:20px;font-weight:500;cursor:pointer;box-shadow:0 7px 0 rgba(70,44,106,.2)}
@media(min-width:1400px){
    /* ---------- FULL-PAGE MONITOR LAYOUT ---------- */
    header{
        height:100px;
    }

    .heading{
        font-size:30px;
        font-weight:400;
    }

    .stage{
        top:100px;
        bottom:88px;
        padding:18px 50px;
    }

    .quest{
        width:min(1500px,92vw);
        height:min(720px,78vh);
    }

    .quest-title{
        margin-bottom:18px;
    }

    .quest-title .badge{
        padding:10px 24px;
    }

    .quest-title b{
        font-size:20px;
    }

    .playfield{
        height:calc(100% - 64px);
        border-radius:44px;
    }

    /* Question number */
    .number-zone{
        width:min(520px,42vw);
        height:170px;
        top:43%;
    }

    .number-label{
        font-size:18px;
    }

    .number-ball{
        width:390px;
        height:96px;
        font-size:40px;
        font-weight:400;
    }

    /* Answer targets fill the monitor width naturally */
    .targets{
        bottom:7%;
        padding:0 6%;
        gap:40px;
    }

    .target{
        width:clamp(300px,30vw,390px);
        height:135px;
        padding:18px 22px;
        gap:16px;
        border-radius:30px;
    }

    .target-icon{
        width:70px;
        height:70px;
        flex-basis:70px;
        font-size:32px;
    }

    .target-copy h3{
        font-size:22px;
        margin-bottom:10px;
    }

    .answer{
        height:52px;
        font-size:24px;
        border-radius:14px;
    }

    /* Monitor navigation controls */
    .controls{
        height:88px;
    }

    .nav-btn,
    .submit-btn{
        width:200px;
        min-width:200px;
        height:60px;
        font-size:30px;
        padding:0;
    }

    .nav-btn{
        bottom:18px;
    }

    .submit-btn{
        bottom:14px;
    }

    #prevBtn{
        left:clamp(28px,4vw,70px);
    }

    #nextBtn{
        right:clamp(28px,4vw,70px);
    }
}
@media(max-width:720px){header{height:76px}.stage{top:76px;bottom:76px}.quest{height:100%;width:96vw}.quest-title{margin-bottom:7px}.playfield{height:calc(100% - 48px);border-radius:28px}.number-zone{top:30%}.number-ball{height:68px;font-size:29px}.targets{bottom:7%;padding:0 3%;gap:8px}.target{width:46%;height:108px;padding:10px;border-radius:20px;gap:7px}.target-icon{width:45px;height:45px;flex-basis:45px;font-size:21px}.target-copy h3{font-size:14px}.answer{height:38px;font-size:16px}.path{display:none}.heading{font-size:18px}.feedback{width:min(380px,90vw);min-height:190px}.nav-btn{bottom:14px;min-width:86px;height:42px;padding:0 11px;font-size:16px}.submit-btn{bottom:12px;min-width:125px;height:46px;font-size:17px;padding:0 15px}}
</style>
</head>
<body>
<main class="game">
<header><div class="heading">Round off the given <span>numbers</span> accordingly.</div></header>
<section class="stage">
<div class="quest">
 
 <div class="playfield">
  <span class="star s1">✦</span><span class="star s2">✦</span><span class="star s3">✧</span>
  <div class="path"></div>
  <div class="number-zone">
   <div class="number-label">Your number</div>
   <div class="number-ball" id="numberCell">432109</div>
  </div>
  <div class="targets">
   <div class="target">
    <div class="target-icon">🔟</div>
    <div class="target-copy"><h3>Nearest 10</h3><input class="answer" id="nearest10" inputmode="numeric" autocomplete="off"></div>
   </div>
   <div class="target right">
    <div class="target-icon">💯</div>
    <div class="target-copy"><h3>Nearest 100</h3><input class="answer" id="nearest100" inputmode="numeric" autocomplete="off"></div>
   </div>
  </div>
 </div>
</div>
</section>
<div class="controls"><button class="nav-btn" id="prevBtn">← Back</button><button class="submit-btn" id="submitBtn">Submit ✓</button><button class="nav-btn" id="nextBtn" disabled>Next →</button></div>
<div class="feedback correct-popup" id="correctPopup"><div class="feedback-icon">🎉</div><div class="feedback-copy"><h3>Perfect!</h3><p>You rounded the number correctly.</p></div></div>
<div class="feedback wrong-popup" id="wrongPopup"><div class="feedback-icon">😕</div><div class="feedback-copy"><h3>Try again!</h3><p>Check the rounding targets once more.</p></div></div>
<div class="final-popup" id="finalPopup"><div class="final-emoji">🏆</div><h2>Awesome!</h2><p>You completed the rounding mission brilliantly!</p><button class="play-again-btn" id="playAgainBtn">↻ Play Again</button></div>
</main>
<script>
function speak(t) {
    speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(t);
    msg.lang = "en-US";
    msg.volume = 0.25;
    msg.rate = 1;
    msg.pitch = 1;
    speechSynthesis.speak(msg);
}

const questions = [
    {
        number: "432109",
        nearest10: "432110",
        nearest100: "432100"
    },
    {
        number: "512314",
        nearest10: "512310",
        nearest100: "512300"
    }
];

let currentQuestion = 0;

/* Preserve completed answers when moving back */
const savedAnswers = questions.map(() => ({
    nearest10: "",
    nearest100: "",
    completed: false
}));

const numberCell = document.getElementById("numberCell");
const nearest10 = document.getElementById("nearest10");
const nearest100 = document.getElementById("nearest100");

const submitBtn = document.getElementById("submitBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const correctPopup = document.getElementById("correctPopup");
const wrongPopup = document.getElementById("wrongPopup");
const finalPopup = document.getElementById("finalPopup");
const playAgainBtn = document.getElementById("playAgainBtn");

function clean(value) {
    return value.replace(/[\s,]/g, "");
}

function hideFeedback() {
    correctPopup.classList.remove("show");
    wrongPopup.classList.remove("show");
}

function loadQuestion() {
    hideFeedback();

    const q = questions[currentQuestion];
    const saved = savedAnswers[currentQuestion];

    numberCell.textContent = q.number;
    nearest10.value = saved.nearest10;
    nearest100.value = saved.nearest100;

    nearest10.classList.remove("correct", "wrong");
    nearest100.classList.remove("correct", "wrong");

    if (saved.completed) {
        nearest10.classList.add("correct");
        nearest100.classList.add("correct");

        nearest10.readOnly = true;
        nearest100.readOnly = true;

        submitBtn.disabled = true;
        submitBtn.style.opacity = ".45";
        submitBtn.style.cursor = "not-allowed";
    } else {
        nearest10.readOnly = false;
        nearest100.readOnly = false;

        submitBtn.disabled = false;
        submitBtn.style.opacity = "";
        submitBtn.style.cursor = "";
    }

    prevBtn.disabled = currentQuestion === 0;

    /* Next only unlocks after this question is correct */
    nextBtn.disabled =
        currentQuestion === questions.length - 1 ||
        !saved.completed;

    if (!saved.completed) {
        setTimeout(() => nearest10.focus(), 100);
    }
}

function submitCurrentQuestion() {
    const q = questions[currentQuestion];

    const value10 = clean(nearest10.value);
    const value100 = clean(nearest100.value);

    if (!value10) {
        nearest10.focus();
        return;
    }

    if (!value100) {
        nearest100.focus();
        return;
    }

    const correct10 = value10 === q.nearest10;
    const correct100 = value100 === q.nearest100;

    nearest10.classList.remove("correct", "wrong");
    nearest100.classList.remove("correct", "wrong");

    nearest10.classList.add(correct10 ? "correct" : "wrong");
    nearest100.classList.add(correct100 ? "correct" : "wrong");

    if (correct10 && correct100) {
        savedAnswers[currentQuestion] = {
            nearest10: value10,
            nearest100: value100,
            completed: true
        };

        nearest10.readOnly = true;
        nearest100.readOnly = true;

        submitBtn.disabled = true;
        submitBtn.style.opacity = ".45";
        submitBtn.style.cursor = "not-allowed";

        correctPopup.classList.add("show");
        speak("Correct!");

        setTimeout(() => {
            correctPopup.classList.remove("show");

            if (currentQuestion === questions.length - 1) {
                finalPopup.classList.add("show");
              
            } else {
                nextBtn.disabled = false;
            }
        }, 1500);

    } else {
        wrongPopup.classList.add("show");
        speak("Try again.");

        setTimeout(() => {
            wrongPopup.classList.remove("show");

            /* Automatically remove incorrect answers. */
            if (!correct10) {
                nearest10.value = "";
                nearest10.classList.remove("wrong");
            }

            if (!correct100) {
                nearest100.value = "";
                nearest100.classList.remove("wrong");
            }

            /* Keep any correct answer visible and marked correct. */
            if (correct10) {
                nearest10.classList.add("correct");
            }
            if (correct100) {
                nearest100.classList.add("correct");
            }

            /* Automatically place the cursor in the first incorrect box. */
            if (!correct10) {
                nearest10.focus();
            } else if (!correct100) {
                nearest100.focus();
            }
        }, 1500);
    }
}

submitBtn.addEventListener("click", submitCurrentQuestion);

[nextBtn, prevBtn].forEach(button => {
    button.addEventListener("click", () => {
        if (button === nextBtn && currentQuestion < questions.length - 1 && savedAnswers[currentQuestion].completed) {
            currentQuestion++;
            loadQuestion();
        }

        if (button === prevBtn && currentQuestion > 0) {
            currentQuestion--;
            loadQuestion();
        }
    });
});

[nearest10, nearest100].forEach(input => {
    input.addEventListener("keydown", event => {
        if (event.key === "Enter" && !input.readOnly) {
            submitCurrentQuestion();
        }
    });
});

playAgainBtn.addEventListener("click", () => {
    currentQuestion = 0;

    savedAnswers.forEach(item => {
        item.nearest10 = "";
        item.nearest100 = "";
        item.completed = false;
    });

    finalPopup.classList.remove("show");
    hideFeedback();
    loadQuestion();
});

loadQuestion();
</script>
<script>
/* ===== CONFETTI CELEBRATION (right & final popups) ===== */
(function () {
  let canvas, ctx, pieces = [], raf = null;
  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
    document.body.appendChild(canvas);
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
  function burst(count) {
    ensureCanvas();
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - .5) * 180,
        y: innerHeight / 2 + (Math.random() - .5) * 90,
        vx: (Math.random() - .5) * 11,
        vy: Math.random() * -13 - 4,
        g: 0.30 + Math.random() * 0.14,
        s: 6 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * 0.4,
        color: colors[i % colors.length],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
    pieces.forEach(p => {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (pieces.length) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.fireConfetti = function (big) {
    if (big) {
      burst(170);
      let n = 0;
      const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
    } else {
      burst(90);
    }
  };
  function watch(id, big) {
    const el = document.getElementById(id);
    if (!el) return;
    let was = el.classList.contains("show");
    new MutationObserver(() => {
      const now = el.classList.contains("show");
      if (now && !was) window.fireConfetti(big);
      was = now;
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  function init() { watch("correctPopup", false); watch("finalPopup", true); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
