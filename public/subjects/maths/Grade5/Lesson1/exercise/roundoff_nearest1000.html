<style>

.header{position:absolute;top:0;left:0;right:0;height:86px;display:flex;align-items:center;justify-content:center;padding:8px 120px;z-index:10}

.final-popup{position:fixed;top:50%;left:50%;z-index:200;width:min(520px,91vw);padding:38px 36px 32px;text-align:center;border-radius:34px;background:linear-gradient(145deg,#d8d0ff,#aeb8f4 58%,#8999e2);border:5px solid #5d55a6;box-shadow:0 10px 0 #28286438,0 28px 70px #0007;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.72);transition:.34s}

.main{top:68px;bottom:68px;padding:3px 8px}.mission{font-size:10px;padding:5px 14px;margin-bottom:5px}.question{font-size:21px;margin-bottom:5px}

</head>
<body>
<div class="game">


<header class="header"><div class="heading">Round off the following numbers to the nearest 1000</div></header>

<main class="main">

<div id="questionText" class="question"></div>
<div class="console">
<div class="light l1"></div><div class="light l2"></div><div class="light l3"></div><div class="light l4"></div>
<div class="screen"><div class="screen-label">Number transmission</div><div id="numberDisplay" class="big-number"></div><div class="target">Round to the nearest 1000</div></div>
<div class="answer"><label>🛸 Enter:</label><input id="answerInput" type="text" inputmode="numeric" autocomplete="off" placeholder="Answer"></div>
</div>
</main>
<button id="submitBtn" class="submit-btn">Submit ✓</button>
<button id="prevBtn" class="nav-btn" disabled>← Back</button>
<button id="nextBtn" class="nav-btn" disabled>Next →</button>
<div id="correctPopup" class="feedback correct-popup"><div class="feedback-icon">🎉</div><h3>Perfect!</h3><p>Mission successful! Your rounding is correct.</p></div>
<div id="wrongPopup" class="feedback wrong-popup"><div class="feedback-icon">😕</div><h3>Try again!</h3><p>Check the hundreds digit and round carefully.</p></div>
<div id="finalPopup" class="final-popup"><div class="final-emoji">🏆</div><h2>Awesome!</h2><p>You completed the entire rounding mission!</p><button id="playAgainBtn" class="play-again-btn">↻ Play again</button></div>
</div>
<script>
function speak(t){speechSynthesis.cancel();const msg=new SpeechSynthesisUtterance(t);msg.lang="en-US";msg.volume=.25;msg.rate=1;msg.pitch=1;speechSynthesis.speak(msg)}
const questions=[{label:"a)",number:"5623",answer:"6000"},{label:"b)",number:"73264",answer:"73000"},{label:"c)",number:"254098",answer:"254000"},{label:"d)",number:"503987",answer:"504000"}];
let currentQuestion=0;
const savedAnswers=questions.map(()=>({answer:"",completed:false}));
const q=document.getElementById("questionText"),n=document.getElementById("numberDisplay"),input=document.getElementById("answerInput"),submit=document.getElementById("submitBtn"),back=document.getElementById("prevBtn"),next=document.getElementById("nextBtn"),correct=document.getElementById("correctPopup"),wrong=document.getElementById("wrongPopup"),final=document.getElementById("finalPopup"),again=document.getElementById("playAgainBtn");
input.addEventListener("input",function(){this.value=this.value.replace(/[^0-9]/g,"")});
function load(){correct.classList.remove("show");wrong.classList.remove("show");const x=questions[currentQuestion],s=savedAnswers[currentQuestion];q.textContent=x.label+"  Round "+x.number+" to the nearest 1000";n.textContent=x.number;input.value=s.answer;input.classList.remove("correct");if(s.completed){input.disabled=true;input.classList.add("correct");submit.disabled=true;next.disabled=currentQuestion===questions.length-1}else{input.disabled=false;submit.disabled=false;next.disabled=true}back.disabled=currentQuestion===0}
function check(){if(!input.value.trim())return;const x=questions[currentQuestion];if(input.value===x.answer){savedAnswers[currentQuestion]={answer:x.answer,completed:true};input.disabled=true;input.classList.add("correct");submit.disabled=true;correct.classList.add("show");speak("Correct!");setTimeout(()=>{correct.classList.remove("show");if(currentQuestion===questions.length-1){final.classList.add("show");}else next.disabled=false},1500)}else{wrong.classList.add("show");speak("Try again.");setTimeout(()=>{wrong.classList.remove("show");input.value="";input.focus()},1500)}}
submit.addEventListener("click",check);
next.addEventListener("click",()=>{if(savedAnswers[currentQuestion].completed&&currentQuestion<questions.length-1){currentQuestion++;load()}});
back.addEventListener("click",()=>{if(currentQuestion>0){currentQuestion--;load()}});
again.addEventListener("click",()=>{currentQuestion=0;savedAnswers.forEach(x=>{x.answer="";x.completed=false});final.classList.remove("show");load()});
load();
</script>
<script>
/* ===== CONFETTI CELEBRATION (right & final popups) ===== */
(function () {
  let canvas, ctx, pieces = [], raf = null;
  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
    document.body.appendChild(canvas);
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
  function burst(count) {
    ensureCanvas();
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - .5) * 180,
        y: innerHeight / 2 + (Math.random() - .5) * 90,
        vx: (Math.random() - .5) * 11,
        vy: Math.random() * -13 - 4,
        g: 0.30 + Math.random() * 0.14,
        s: 6 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * 0.4,
        color: colors[i % colors.length],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
    pieces.forEach(p => {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (pieces.length) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.fireConfetti = function (big) {
    if (big) {
      burst(170);
      let n = 0;
      const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
    } else {
      burst(90);
    }
  };
  function watch(id, big) {
    const el = document.getElementById(id);
    if (!el) return;
    let was = el.classList.contains("show");
    new MutationObserver(() => {
      const now = el.classList.contains("show");
      if (now && !was) window.fireConfetti(big);
      was = now;
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  function init() { watch("correctPopup", false); watch("finalPopup", true); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>

</html>
