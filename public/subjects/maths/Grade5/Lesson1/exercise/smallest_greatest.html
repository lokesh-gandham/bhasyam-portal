<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <title>Digit Forge</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Livvic", sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            color: #2f4f4f;
        }


        /* =========================================
           MAIN GAME AREA
        ========================================= */

        .game-page {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;

           
        }



        /* =========================================
           HEADER
        ========================================= */

        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 10px 150px;
            z-index: 10;
        }

        .heading {
            font-size: 22px;
            font-weight: 400;
            color: #2f4f4f;
            text-align: center;
        }


        /* =========================================
           GAME AREA
        ========================================= */

        .game-area {
            position: absolute;
            top: 100px;
            bottom: 82px;
            left: 0;
            right: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 5px 5vw;
        }


        /* =========================================
           GAME TITLE BADGE
        ========================================= */

        .game-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 9px 25px;
            margin-bottom: 14px;

            border-radius: 18px;

            background: linear-gradient(135deg, #fff1c9, #ffe1a0);

            border: 2px solid #d9a84b;

            box-shadow:
                0 6px 0 rgba(175, 120, 35, .14),
                0 10px 20px rgba(80, 60, 30, .08);

            font-size: 17px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #70572d;
        }


        /* =========================================
           QUESTION
        ========================================= */

        .question-text {
            font-size: 30px;
            font-weight: 400;
            color: #2f4f4f;
            text-align: center;
            margin-bottom: 18px;
        }


        /* =========================================
           DIGIT CONVEYOR
        ========================================= */

        .forge-zone {
            width: min(1000px, 94vw);
            position: relative;
        }

        .forge-top-line {
            width: 92%;
            height: 8px;
            margin: 0 auto;
            border-radius: 20px;
            background: repeating-linear-gradient(
                90deg,
                #76aaa5 0 30px,
                #bfe0dc 30px 46px
            );

            opacity: .65;
        }

        .digit-conveyor {
            min-height: 130px;
            margin-top: 12px;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;

            padding: 18px 30px;

            position: relative;
        }

        .digit-conveyor::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 4px;
            height: 26px;

            border-radius: 30px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #6c9d99 0 32px,
                    #86b8b2 32px 45px
                );

            opacity: .55;

            box-shadow:
                0 5px 0 rgba(55, 104, 99, .12);
        }

        .digit-token {
            width: 66px;
            height: 66px;

            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            font-size: 30px;
            font-weight: 400;

            color: #315856;

            background:
                linear-gradient(145deg, #ffffff, #e7f2ef);

            border: 3px solid #7eb7b0;

            box-shadow:
                0 7px 0 rgba(54, 108, 102, .16),
                0 12px 20px rgba(47, 79, 79, .09);

            animation: tokenFloat 3s ease-in-out infinite;
        }

        .digit-token:nth-child(2n) {
            animation-delay: .3s;
        }

        .digit-token:nth-child(3n) {
            animation-delay: .7s;
        }

        @keyframes tokenFloat {
            50% {
                transform: translateY(-5px) rotate(2deg);
            }
        }


        /* =========================================
           BUILD ZONES
        ========================================= */

        .build-zone {
            width: min(900px, 94vw);

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;

            margin-top: 8px;
        }

        .build-side {
            position: relative;
            min-height: 115px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .build-label {
            margin-bottom: 9px;

            padding: 7px 18px;

            border-radius: 14px;

            font-size: 16px;
            font-weight: 400;
            letter-spacing: .5px;
        }

        .smallest-label {
            background: #c9ebe5;
            color: #315d59;
            border: 2px solid #75aaa3;
        }

        .greatest-label {
            background: #ffe0c9;
            color: #784d3a;
            border: 2px solid #dc9c77;
        }

        .answer-machine {
            width: min(100%, 350px);
            height: 65px;

            position: relative;

            display: flex;
            align-items: center;

            padding: 6px 8px;

            border-radius: 20px;

            background: rgba(255, 255, 255, .55);

            border: 3px solid rgba(93, 133, 128, .18);

            box-shadow:
                inset 0 2px 8px rgba(47, 79, 79, .05),
                0 7px 15px rgba(47, 79, 79, .07);
        }

        .answer-machine.smallest-machine {
            border-color: #7db5ad;
        }

        .answer-machine.greatest-machine {
            border-color: #dea07c;
        }

        .answer-input {
            width: 100%;
            height: 100%;

            border: none;
            outline: none;

            border-radius: 14px;

            text-align: center;

            font-size: 26px;
            font-weight: 400;

            color: #2f4f4f;

            background: #fffdf8;

            box-shadow:
                inset 0 0 0 2px rgba(47, 79, 79, .05);

            transition: .2s ease;
        }

        .answer-input::placeholder {
            font-size: 22px;
            opacity: 1;
        }

        .answer-input:focus {
            transform: translateY(-2px);
            box-shadow:
                0 4px 14px rgba(47, 79, 79, .12),
                inset 0 0 0 2px #6fa8a1;
        }

        .answer-input.correct-input {
            background: #e2f6e9;
            box-shadow:
                inset 0 0 0 3px #16834f;
        }

        .answer-input:disabled {
            cursor: not-allowed;
            opacity: 1;
        }

        .forge-arrow {
            position: absolute;
            top: 44px;
            right: -18px;

            font-size: 24px;
            color: #d9a34e;
        }

        .build-side:last-child .forge-arrow {
            display: none;
        }


        /* =========================================
           SUBMIT BUTTON
           EXACT REQUESTED SIZE
        ========================================= */

        .submit-btn {
            position: absolute;

            left: 50%;
            bottom: 20px;

            transform: translateX(-50%);

            min-width: 155px;
            height: 50px;

            padding: 0 28px;

            border: none;
            border-radius: 18px;

            background: #2f4f4f;
            color: #fff;

            font-size: 20px;
            font-weight: 400;

            cursor: pointer;

            box-shadow:
                0 8px 0 rgba(22, 59, 59, .18),
                0 13px 25px rgba(47, 79, 79, .20);

            transition: .2s ease;

            z-index: 30;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateX(-50%) translateY(-3px);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateX(-50%) translateY(2px);
        }

        .submit-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }


        /* =========================================
           NAVIGATION
           EXACT REQUESTED SIZE
        ========================================= */

        .nav-btn {
            position: absolute;
            bottom: 22px;

            min-width: 126px;
            height: 46px;

            padding: 0 19px;

            border-radius: 15px;

            font-size: 20px;
            font-weight: 500;

            color: #2f4f4f;

            cursor: pointer;

            transition: .2s ease;

            border: 2px solid rgba(47, 79, 79, .12);

            box-shadow:
                0 8px 18px rgba(47, 79, 79, .12);

            z-index: 30;
        }

        #prevBtn {
            left: clamp(20px, 4vw, 70px);
            background: #a9cbe2;
            border-color: #79a9c7;
        }

        #nextBtn {
            right: clamp(20px, 4vw, 70px);
            background: #efbca6;
            border-color: #d99074;
        }

        .nav-btn:hover:not(:disabled) {
            transform: translateY(-3px);
        }

        .nav-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }


        /* =========================================
           CORRECT / WRONG POPUP
           EXACT REQUESTED SIZE
        ========================================= */

        .feedback {
            position: fixed;

            top: 50%;
            left: 50%;

            z-index: 100;

            width: min(440px, 88vw);
            min-height: 215px;

            padding: 26px 30px 28px;

            border-radius: 30px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 10px;

            text-align: center;

            opacity: 0;
            pointer-events: none;

            transform:
                translate(-50%, -50%)
                scale(.7)
                rotate(-4deg);

            transition:
                .28s cubic-bezier(.2, .9, .25, 1.25);

            box-shadow:
                0 20px 50px rgba(32, 57, 57, .22);
        }

        .feedback.show {
            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1)
                rotate(0);
        }

        .feedback.correct-popup {
            background:
                linear-gradient(135deg, #e2f6e9, #f4fcf6);

            border: 5px solid #16834f;
        }

        .feedback.wrong-popup {
            background:
                linear-gradient(135deg, #fde6e2, #fff7f5);

            border: 5px solid #c94740;
        }

        .feedback-icon {
            width: 68px;
            height: 68px;

            flex: 0 0 68px;

            border-radius:
                24px 24px 24px 8px;

            display: grid;
            place-items: center;

            font-size: 34px;

            color: white;

            box-shadow:
                0 5px 0 rgba(0, 0, 0, .08);
        }

        .correct-popup .feedback-icon {
            background: #16834f;
        }

        .wrong-popup .feedback-icon {
            background: #c94740;
        }

        .feedback h3 {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 3px;
        }

        .feedback p {
            font-size: 17px;
            color: #607878;
        }


        /* =========================================
           FINAL POPUP
           EXACT REQUESTED SIZE
        ========================================= */

        .final-popup {
            position: fixed;

            top: 50%;
            left: 50%;

            z-index: 200;

            width: min(520px, 91vw);

            padding: 38px 36px 32px;

            text-align: center;

            border-radius: 34px;

            background:
                radial-gradient(
                    circle at 14% 15%,
                    rgba(255,255,255,.70) 0 8px,
                    transparent 9px
                ),

                radial-gradient(
                    circle at 87% 18%,
                    rgba(255,222,115,.78) 0 12px,
                    transparent 13px
                ),

                radial-gradient(
                    circle at 16% 83%,
                    rgba(255,190,214,.50) 0 10px,
                    transparent 11px
                ),

                linear-gradient(
                    145deg,
                    #eadcff,
                    #cbb5f4 58%,
                    #b89ae8
                );

            border: 5px solid #7350a8;

            box-shadow:
                0 10px 0 rgba(83,55,126,.18),
                0 28px 70px rgba(55,38,80,.30);

            opacity: 0;
            pointer-events: none;

            transform:
                translate(-50%, -50%)
                scale(.72)
                rotate(-3deg);

            transition:
                .34s cubic-bezier(.2,.9,.25,1.25);
        }

        .final-popup.show {
            opacity: 1;
            pointer-events: auto;

            transform:
                translate(-50%, -50%)
                scale(1)
                rotate(0);
        }

        .final-emoji {
            font-size: 78px;
            margin-bottom: 8px;
        }

        .final-popup h2 {
            font-size: 36px;
            font-weight: 700;
            color: #4c3272;
            margin-bottom: 8px;
        }

        .final-popup p {
            font-size: 18px;
            color: #5f4a7a;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .play-again-btn {
            min-width: 185px;
            height: 52px;

            padding: 0 28px;

            border: none;
            border-radius: 17px;

            background: #68449a;
            color: #fff;

            font-size: 20px;
            font-weight: 400;

            cursor: pointer;

            box-shadow:
                0 7px 0 rgba(70,44,106,.20),
                0 13px 24px rgba(89,59,131,.24);

            transition: .2s ease;
        }

        .play-again-btn:hover {
            transform: translateY(-3px);
        }

        /* =========================================
           LARGE MONITOR - FULL PAGE RESPONSIVE
        ========================================= */

        @media (min-width: 1400px) {

            .header {
                height: 100px;
                padding: 10px 150px;
            }

            .heading {
                font-size: 30px;
                font-weight: 400;
            }

            .game-area {
                top: 100px;
                bottom: 90px;
                padding: 10px 4vw;
            }

            .game-badge {
                font-size: 20px;
                padding: 11px 30px;
                margin-bottom: 18px;
            }

            .question-text {
                font-size: 40px;
                font-weight: 400;
                margin-bottom: 24px;
            }

            .forge-zone {
                width: min(1200px, 92vw);
            }

            .forge-top-line {
                height: 10px;
            }

            .digit-conveyor {
                min-height: 160px;
                margin-top: 16px;
                gap: 16px;
                padding: 22px 40px;
            }

            .digit-token {
                width: 78px;
                height: 78px;
                border-radius: 20px;
                font-size: 36px;
            }

            .build-zone {
                width: min(1100px, 90vw);
                gap: 40px;
                margin-top: 16px;
            }

            .build-side {
                min-height: 140px;
            }

            .build-label {
                font-size: 20px;
                padding: 9px 22px;
                margin-bottom: 12px;
            }

            .answer-machine {
                width: min(100%, 440px);
                height: 78px;
                border-radius: 22px;
            }

            .answer-input {
                font-size: 30px;
                border-radius: 16px;
            }

            .answer-input::placeholder {
                font-size: 30px;
                opacity: 1;
            }

            .forge-arrow {
                top: 52px;
                right: -24px;
                font-size: 30px;
            }

            .submit-btn,
            .nav-btn {
                width: 200px;
                min-width: 200px;
                height: 60px;
                font-size: 30px;
            }

            .submit-btn {
                bottom: 18px;
            }

            .nav-btn {
                bottom: 20px;
            }

            #prevBtn {
                left: clamp(30px, 4vw, 80px);
            }

            #nextBtn {
                right: clamp(30px, 4vw, 80px);
            }

            .feedback {
                width: min(520px, 80vw);
                min-height: 250px;
            }

            .feedback-icon {
                width: 78px;
                height: 78px;
                flex-basis: 78px;
                font-size: 40px;
            }

            .feedback h3 {
                font-size: 32px;
            }

            .feedback p {
                font-size: 20px;
            }

            .final-popup {
                width: min(620px, 80vw);
            }
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 850px) {

            .build-zone {
                gap: 15px;
            }

            .digit-token {
                width: 55px;
                height: 55px;
                font-size: 25px;
            }

            .answer-machine {
                height: 58px;
            }

            .answer-input {
                font-size: 22px;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            .header {
                height: 75px;
                padding: 8px 15px;
            }

            .heading {
                font-size: 17px;
            }

            .game-area {
                top: 75px;
                bottom: 68px;
                padding: 3px 12px;
                justify-content: center;
            }

            .game-badge {
                font-size: 12px;
                padding: 7px 15px;
                margin-bottom: 7px;
            }

            .question-text {
                font-size: 21px;
                margin-bottom: 8px;
            }

            .forge-top-line {
                height: 5px;
            }

            .digit-conveyor {
                min-height: 94px;
                padding: 10px 12px 18px;
                gap: 7px;
                margin-top: 5px;
            }

            .digit-token {
                width: 42px;
                height: 42px;
                border-radius: 12px;
                font-size: 21px;
                border-width: 2px;
            }

            .digit-conveyor::before {
                height: 17px;
            }

            .build-zone {
                grid-template-columns: 1fr;
                gap: 7px;
                margin-top: 3px;
            }

            .build-side {
                min-height: 76px;
            }

            .build-label {
                margin-bottom: 5px;
                padding: 4px 12px;
                font-size: 12px;
            }

            .answer-machine {
                width: min(100%, 290px);
                height: 48px;
                border-width: 2px;
                border-radius: 15px;
            }

            .answer-input {
                font-size: 20px;
                border-radius: 10px;
            }

            .forge-arrow {
                display: none;
            }

            .submit-btn {
                min-width: 130px;
                height: 43px;
                font-size: 17px;
                bottom: 10px;
            }

            .nav-btn {
                min-width: 85px;
                height: 40px;
                font-size: 15px;
                padding: 0 8px;
                bottom: 11px;
            }

            #prevBtn {
                left: 12px;
            }

            #nextBtn {
                right: 12px;
            }

            .feedback {
                width: min(440px, 90vw);
                min-height: 205px;
            }

            .final-popup {
                width: 91vw;
                padding: 30px 22px;
            }

            .final-popup h2 {
                font-size: 30px;
            }

            .final-emoji {
                font-size: 64px;
            }

        }

    </style>
</head>

<body>

    <div class="game-page">

        <!-- BACKGROUND DECORATION -->

        <div class="gear gear-one"></div>
        <div class="gear gear-two"></div>

        <div class="pixel-dot dot1"></div>
        <div class="pixel-dot dot2"></div>
        <div class="pixel-dot dot3"></div>

        


        <!-- HEADER -->

        <header class="header">

            <div class="heading">
                Form the smallest and the greatest number formed by the given digits
            </div>

        </header>


        <!-- GAME CONTENT -->

        <main class="game-area">

            <div class="forge-zone">

                <div class="forge-top-line"></div>

                <div
                    class="digit-conveyor"
                    id="digitConveyor">
                </div>

            </div>


            <!-- ANSWERS -->

            <div class="build-zone">

                <div class="build-side">

                    <div class="build-label smallest-label">
                        🔽 Smallest number
                    </div>

                    <div class="answer-machine smallest-machine">

                        <input
                            type="text"
                            inputmode="numeric"
                            id="smallestInput"
                            class="answer-input"
                            autocomplete="off"
                            placeholder="Type smallest number">

                    </div>

                    <div class="forge-arrow">➜</div>

                </div>


                <div class="build-side">

                    <div class="build-label greatest-label">
                        🔼 Greatest number
                    </div>

                    <div class="answer-machine greatest-machine">

                        <input
                            type="text"
                            inputmode="numeric"
                            id="greatestInput"
                            class="answer-input"
                            autocomplete="off"
                            placeholder="Type greatest number">

                    </div>

                </div>

            </div>

        </main>


        <!-- SUBMIT -->

        <button
            id="submitBtn"
            class="submit-btn">

            Submit ✓

        </button>


        <!-- NAVIGATION -->

        <button
            id="prevBtn"
            class="nav-btn"
            disabled>

            ← Back

        </button>


        <button
            id="nextBtn"
            class="nav-btn"
            disabled>

            Next →

        </button>


        <!-- CORRECT POPUP -->

        <div
            id="correctPopup"
            class="feedback correct-popup">

            <div class="feedback-icon">
                🎉
            </div>

            <h3>Perfect!</h3>

            <p>
                Both numbers are correct!
            </p>

        </div>


        <!-- WRONG POPUP -->

        <div
            id="wrongPopup"
            class="feedback wrong-popup">

            <div class="feedback-icon">
                😕
            </div>

            <h3>Try Again!</h3>

            <p>
                Arrange the given digits carefully
            </p>

        </div>


        <!-- FINAL POPUP -->

        <div
            id="finalPopup"
            class="final-popup">

            <div class="final-emoji">🏆</div>

            <h2>Awesome!</h2>

            <p>
                You completed all the Digit Forge challenges!
            </p>

            <button
                id="playAgainBtn"
                class="play-again-btn">

                ↻ Play Again

            </button>

        </div>

    </div>


    <script>

        /* =========================================
           VOICE FUNCTION
        ========================================= */

        function speak(t) {

            speechSynthesis.cancel();

            const msg = new SpeechSynthesisUtterance(t);

            msg.lang = "en-US";

            msg.volume = 0.25;

            msg.rate = 1;

            msg.pitch = 1;

            speechSynthesis.speak(msg);

        }


        /* =========================================
           QUESTIONS
        ========================================= */

        const questions = [

            {
                digits: ["1", "3", "7", "6", "2", "5", "4", "0"],
                smallest: "10234567",
                greatest: "76543210"
            },

            {
                digits: ["5", "7", "6", "1", "0", "0", "8", "9", "2"],
                smallest: "100256789",
                greatest: "987652100"
            }

        ];


        /* =========================================
           VARIABLES
        ========================================= */

        let currentQuestion = 0;


        const answers = questions.map(() => ({
            smallest: "",
            greatest: "",
            completed: false
        }));


        const digitConveyor =
            document.getElementById("digitConveyor");


        const smallestInput =
            document.getElementById("smallestInput");


        const greatestInput =
            document.getElementById("greatestInput");


        const submitBtn =
            document.getElementById("submitBtn");


        const prevBtn =
            document.getElementById("prevBtn");


        const nextBtn =
            document.getElementById("nextBtn");


        const correctPopup =
            document.getElementById("correctPopup");


        const wrongPopup =
            document.getElementById("wrongPopup");


        const finalPopup =
            document.getElementById("finalPopup");


        const playAgainBtn =
            document.getElementById("playAgainBtn");


        /* =========================================
           CLEAN NUMBER
           Allows commas and spaces if typed
        ========================================= */

        function cleanNumber(value) {

            return value.replace(/[,\s]/g, "");

        }


        /* =========================================
           ALLOW NUMBERS ONLY
        ========================================= */

        function numericOnly(input) {

            input.addEventListener("input", function () {

                this.value =
                    this.value.replace(/[^0-9]/g, "");

            });

        }


        numericOnly(smallestInput);
        numericOnly(greatestInput);


        /* =========================================
           LOAD QUESTION
        ========================================= */

        function loadQuestion() {

            correctPopup.classList.remove("show");
            wrongPopup.classList.remove("show");


            const question =
                questions[currentQuestion];


            const saved =
                answers[currentQuestion];


            /* DIGITS */

            digitConveyor.innerHTML = "";


            question.digits.forEach((digit) => {

                const token =
                    document.createElement("div");

                token.className =
                    "digit-token";

                token.textContent =
                    digit;

                digitConveyor.appendChild(token);

            });


            /* LOAD SAVED ANSWERS */

            smallestInput.value =
                saved.smallest;


            greatestInput.value =
                saved.greatest;


            smallestInput.classList.remove(
                "correct-input"
            );


            greatestInput.classList.remove(
                "correct-input"
            );


            /* COMPLETED QUESTION */

            if (saved.completed) {

                smallestInput.disabled = true;
                greatestInput.disabled = true;

                smallestInput.classList.add(
                    "correct-input"
                );

                greatestInput.classList.add(
                    "correct-input"
                );

                submitBtn.disabled = true;


                nextBtn.disabled =
                    currentQuestion ===
                    questions.length - 1;

            }

            /* NEW QUESTION */

            else {

                smallestInput.disabled = false;
                greatestInput.disabled = false;

                submitBtn.disabled = false;

                nextBtn.disabled = true;

            }


            prevBtn.disabled =
                currentQuestion === 0;

        }


        /* =========================================
           SUBMIT
        ========================================= */

        function submitAnswer() {

            if (
                !smallestInput.value.trim() ||
                !greatestInput.value.trim()
            ) {
                return;
            }


            const userSmallest =
                cleanNumber(
                    smallestInput.value
                );


            const userGreatest =
                cleanNumber(
                    greatestInput.value
                );


            const question =
                questions[currentQuestion];


            /* =====================================
               CORRECT
            ===================================== */

            if (
                userSmallest === question.smallest &&
                userGreatest === question.greatest
            ) {

                answers[currentQuestion] = {

                    smallest:
                        question.smallest,

                    greatest:
                        question.greatest,

                    completed:
                        true

                };


                smallestInput.value =
                    question.smallest;


                greatestInput.value =
                    question.greatest;


                smallestInput.disabled = true;
                greatestInput.disabled = true;


                smallestInput.classList.add(
                    "correct-input"
                );


                greatestInput.classList.add(
                    "correct-input"
                );


                submitBtn.disabled = true;


                correctPopup.classList.add(
                    "show"
                );


                speak(
                    "Correct!"
                );


                setTimeout(() => {

                    correctPopup.classList.remove(
                        "show"
                    );


                    /* LAST QUESTION */

                    if (
                        currentQuestion ===
                        questions.length - 1
                    ) {

                        finalPopup.classList.add(
                            "show"
                        );


                    }

                    /* ENABLE NEXT */

                    else {

                        nextBtn.disabled = false;

                    }

                }, 1500);

            }
            else {

                wrongPopup.classList.add(
                    "show"
                );


                speak(
                    "Try again."
                );


                setTimeout(() => {

                    wrongPopup.classList.remove(
                        "show"
                    );


                    /* AUTOMATICALLY CLEAR
                       WRONG ANSWERS */

                    smallestInput.value = "";
                    greatestInput.value = "";


                    smallestInput.focus();


                }, 1500);

            }

        }

        submitBtn.addEventListener(
            "click",
            submitAnswer
        );


        nextBtn.addEventListener(
            "click",
            () => {

                if (
                    answers[currentQuestion].completed &&
                    currentQuestion <
                    questions.length - 1
                ) {

                    currentQuestion++;

                    loadQuestion();

                }

            }
        );



        prevBtn.addEventListener(
            "click",
            () => {

                if (currentQuestion > 0) {

                    currentQuestion--;

                    loadQuestion();

                }

            }
        );



        playAgainBtn.addEventListener(
            "click",
            () => {

                currentQuestion = 0;


                answers.forEach((item) => {

                    item.smallest = "";
                    item.greatest = "";
                    item.completed = false;

                });


                finalPopup.classList.remove(
                    "show"
                );


                loadQuestion();

            }
        );

        loadQuestion();

    </script>

<script>
/* ===== CONFETTI CELEBRATION (right & final popups) ===== */
(function () {
  let canvas, ctx, pieces = [], raf = null;
  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
    document.body.appendChild(canvas);
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
  function burst(count) {
    ensureCanvas();
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - .5) * 180,
        y: innerHeight / 2 + (Math.random() - .5) * 90,
        vx: (Math.random() - .5) * 11,
        vy: Math.random() * -13 - 4,
        g: 0.30 + Math.random() * 0.14,
        s: 6 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * 0.4,
        color: colors[i % colors.length],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
    pieces.forEach(p => {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (pieces.length) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.fireConfetti = function (big) {
    if (big) {
      burst(170);
      let n = 0;
      const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
    } else {
      burst(90);
    }
  };
  function watch(id, big) {
    const el = document.getElementById(id);
    if (!el) return;
    let was = el.classList.contains("show");
    new MutationObserver(() => {
      const now = el.classList.contains("show");
      if (now && !was) window.fireConfetti(big);
      was = now;
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  function init() { watch("correctPopup", false); watch("finalPopup", true); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
