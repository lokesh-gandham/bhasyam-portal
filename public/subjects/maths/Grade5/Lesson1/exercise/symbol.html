<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <title>Number Clash</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Livvic", sans-serif;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        body {
            color: #2f4f4f;
        }


        /* =====================================================
           MAIN GAME
        ===================================================== */

        .game-page {

            width: 100%;
            height: 100vh;

            position: relative;
            overflow: hidden;


        }





        .bolt {

            top: 40%;
            left: 5%;

            font-size: 32px;

            color: #e99e63;

            transform: rotate(-15deg);
        }


        .plus {

            right: 6%;
            bottom: 34%;

            font-size: 40px;

            color: #6fb4af;
        }


        .mini-shape.one {

            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: #f1a7b5;

            top: 12%;
            left: 22%;
        }


        .mini-shape.two {

            width: 16px;
            height: 16px;

            border-radius: 5px;

            background: #9fc7e4;

            bottom: 12%;
            right: 25%;

            transform: rotate(25deg);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 105px;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 10px 130px;

            z-index: 10;
        }


        .heading {

            font-size: 22px;
            font-weight: 400;

            color: #2f4f4f;

            text-align: center;
        }


        /* =====================================================
           GAME AREA
        ===================================================== */

        .game-area {

            position: absolute;

            top: 105px;
            bottom: 82px;

            left: 0;
            right: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 5px 6vw;
        }


        /* =====================================================
           GAME LABEL
        ===================================================== */

        .game-label {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            padding: 9px 24px;

            margin-bottom: 14px;

            border-radius: 18px;

            background: #fff2cb;

            border: 2px solid #dfb45a;

            box-shadow:

                0 6px 0 rgba(192, 143, 52, .14),

                0 10px 20px rgba(90, 70, 30, .07);

            font-size: 17px;

            font-weight: 500;

            letter-spacing: 1px;

            color: #70572d;
        }


        /* =====================================================
           QUESTION
        ===================================================== */

        .question-text {

            font-size: 30px;

            font-weight: 400;

            color: #2f4f4f;

            text-align: center;

            margin-bottom: 20px;
        }


        /* =====================================================
           BATTLE FIELD
        ===================================================== */

        .battle-arena {

            width: min(1180px, 94vw);

            display: grid;

            grid-template-columns:
                1fr
                125px
                1fr;

            gap: 22px;

            align-items: center;
        }


        /* =====================================================
           PLAYER AREA
        ===================================================== */

        .player-side {

            position: relative;

            min-height: 155px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;
        }


        .player-tag {

            position: absolute;

            top: 0;

            padding: 6px 18px;

            border-radius: 14px;

            font-size: 14px;

            font-weight: 500;

            letter-spacing: 1px;

            z-index: 2;
        }


        .player-a .player-tag {

            background: #bce3de;

            border: 2px solid #69a8a2;

            color: #315d59;
        }


        .player-b .player-tag {

            background: #f8cabc;

            border: 2px solid #da8d78;

            color: #75473a;
        }


        /* =====================================================
           NUMBER SCREEN
        ===================================================== */

        .number-panel {

            width: 100%;

            min-height: 112px;

            margin-top: 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

            border-radius: 24px;

            overflow: hidden;
        }


        .player-a .number-panel {

            background:

                linear-gradient(
                    135deg,
                    #d8f2ee,
                    #b8dfda
                );

            border: 4px solid #6ba8a3;

            box-shadow:

                0 9px 0 rgba(63, 119, 114, .17),

                inset 0 2px 0 rgba(255, 255, 255, .75);
        }


        .player-b .number-panel {

            background:

                linear-gradient(
                    135deg,
                    #ffe4db,
                    #f4c4b7
                );

            border: 4px solid #d98d78;

            box-shadow:

                0 9px 0 rgba(159, 86, 66, .15),

                inset 0 2px 0 rgba(255, 255, 255, .75);
        }


        .number-panel::before {

            content: "";

            position: absolute;

            left: 16px;
            right: 16px;

            top: 12px;

            height: 3px;

            border-radius: 10px;

            background: rgba(255, 255, 255, .58);
        }


        .number-panel::after {

            content: "● ● ●";

            position: absolute;

            bottom: 9px;

            font-size: 8px;

            letter-spacing: 5px;

            opacity: .3;
        }


        .number-value {

            position: relative;

            z-index: 2;

            font-size: 30px;

            font-weight: 400;

            letter-spacing: 2px;

            color: #2f4f4f;
        }


        /* =====================================================
           VS
        ===================================================== */

        .vs-core {

            height: 155px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;
        }


        .vs-top,
        .vs-bottom {

            width: 5px;
            height: 32px;

            border-radius: 10px;

            background: #dca74e;
        }


        .vs-text {

            width: 78px;
            height: 78px;

            margin: 7px 0;

            border-radius: 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            transform: rotate(45deg);

            background:

                linear-gradient(
                    135deg,
                    #ffe4a0,
                    #f7bd61
                );

            border: 3px solid #d99c36;

            box-shadow:

                0 8px 0 rgba(172, 116, 38, .16),

                0 10px 20px rgba(100, 70, 20, .12);
        }


        .vs-text span {

            transform: rotate(-45deg);

            font-size: 25px;

            font-weight: 500;

            color: #76542d;
        }


        /* =====================================================
           SYMBOL CONTROLS
        ===================================================== */

        .control-title {

            margin-top: 24px;

            margin-bottom: 12px;

            font-size: 17px;

            color: #5e7776;

            text-align: center;
        }


        .symbol-controls {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 20px;
        }


        .symbol-btn {

            width: 82px;
            height: 70px;

            border: 3px solid #b6c9c5;

            border-radius: 20px;

            background:

                linear-gradient(
                    145deg,
                    #ffffff,
                    #e8f0ed
                );

            color: #2f4f4f;

            font-size: 34px;

            font-weight: 500;

            cursor: pointer;

            box-shadow:

                0 7px 0 rgba(70, 100, 96, .14),

                0 10px 18px rgba(60, 90, 85, .08);

            transition: .18s ease;
        }


        .symbol-btn:hover:not(:disabled) {

            transform:
                translateY(-5px)
                rotate(-2deg);
        }


        .symbol-btn:nth-child(2):hover:not(:disabled) {

            transform:
                translateY(-5px)
                rotate(2deg);
        }


        .symbol-btn.selected {

            background:

                linear-gradient(
                    145deg,
                    #fff0ba,
                    #ffd77d
                );

            border-color: #d99d38;

            color: #725326;

            transform: translateY(-4px);
        }


        .symbol-btn.correct {

            background:

                linear-gradient(
                    145deg,
                    #dcf5e5,
                    #bce8ca
                );

            border-color: #16834f;

            color: #16834f;
        }


        .symbol-btn.wrong {

            background:

                linear-gradient(
                    145deg,
                    #ffe8e4,
                    #f6c2ba
                );

            border-color: #c94740;

            color: #c94740;

            animation: shake .4s ease;
        }


        @keyframes shake {

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-6px);
            }

            80% {
                transform: translateX(6px);
            }

            100% {
                transform: translateX(0);
            }

        }


        /* =====================================================
           SUBMIT BUTTON
           REFERENCE SIZE
        ===================================================== */

        .submit-btn {

            position: absolute;

            left: 50%;
            bottom: 20px;

            transform: translateX(-50%);

            min-width: 155px;
            height: 50px;

            padding: 0 28px;

            border: none;

            border-radius: 18px;

            background: #2f4f4f;

            color: white;

            font-size: 20px;

            font-weight: 500;

            cursor: pointer;

            box-shadow:

                0 8px 0 rgba(22, 59, 59, .18),

                0 13px 25px rgba(47, 79, 79, .20);

            transition: .2s ease;

            z-index: 30;
        }


        .submit-btn:hover:not(:disabled) {

            transform:
                translateX(-50%)
                translateY(-3px);
        }


        .submit-btn:active:not(:disabled) {

            transform:
                translateX(-50%)
                translateY(2px);
        }


        .submit-btn:disabled {

            opacity: .5;

            cursor: not-allowed;
        }


        /* =====================================================
           NAV BUTTONS
           EXACT REFERENCE SIZE
        ===================================================== */

        .nav-btn {

            position: absolute;

            bottom: 22px;

            min-width: 126px;
            height: 46px;

            padding: 0 19px;

            border-radius: 15px;

            font-size: 20px;

            font-weight: 500;

            color: #2f4f4f;

            cursor: pointer;

            transition: .2s ease;

            border: 2px solid rgba(47, 79, 79, .12);

            box-shadow:

                0 8px 18px rgba(47, 79, 79, .12);

            z-index: 30;
        }


        #prevBtn {

            left: clamp(20px, 4vw, 70px);

            background: #a9cbe2;

            border-color: #79a9c7;
        }


        #nextBtn {

            right: clamp(20px, 4vw, 70px);

            background: #efbca6;

            border-color: #d99074;
        }


        .nav-btn:hover:not(:disabled) {

            transform: translateY(-3px);
        }


        .nav-btn:disabled {

            opacity: .55;

            cursor: not-allowed;
        }


        /* =====================================================
           CORRECT / WRONG POPUP
           EXACT REFERENCE SIZE
        ===================================================== */

        .feedback {

            position: fixed;

            top: 50%;
            left: 50%;

            z-index: 100;

            width: min(440px, 88vw);
            min-height: 215px;

            padding: 26px 30px 28px;

            border-radius: 30px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 10px;

            text-align: center;

            opacity: 0;

            pointer-events: none;

            transform:

                translate(-50%, -50%)

                scale(.7)

                rotate(-4deg);

            transition:

                .28s cubic-bezier(.2, .9, .25, 1.25);

            box-shadow:

                0 20px 50px rgba(32, 57, 57, .22);
        }


        .feedback.show {

            opacity: 1;

            transform:

                translate(-50%, -50%)

                scale(1)

                rotate(0);
        }


        .feedback.correct-popup {

            background:

                linear-gradient(
                    135deg,
                    #e2f6e9,
                    #f4fcf6
                );

            border: 5px solid #16834f;
        }


        .feedback.wrong-popup {

            background:

                linear-gradient(
                    135deg,
                    #fde6e2,
                    #fff7f5
                );

            border: 5px solid #c94740;
        }


        .feedback-icon {

            width: 68px;
            height: 68px;

            flex: 0 0 68px;

            border-radius:

                24px
                24px
                24px
                8px;

            display: grid;

            place-items: center;

            font-size: 34px;

            color: white;

            box-shadow:

                0 5px 0 rgba(0, 0, 0, .08);
        }


        .correct-popup .feedback-icon {

            background: #16834f;
        }


        .wrong-popup .feedback-icon {

            background: #c94740;
        }


        .feedback h3 {

            font-size: 28px;

            font-weight: 500;

            margin-bottom: 3px;
        }


        .feedback p {

            font-size: 17px;

            color: #607878;
        }


        /* =====================================================
           FINAL POPUP
           REFERENCE SIZE
        ===================================================== */

        .final-popup {

            position: fixed;

            top: 50%;
            left: 50%;

            z-index: 200;

            width: min(520px, 91vw);

            padding:

                38px
                36px
                32px;

            text-align: center;

            border-radius: 34px;

            background:

                radial-gradient(
                    circle at 14% 15%,
                    rgba(255, 255, 255, .70) 0 8px,
                    transparent 9px
                ),

                radial-gradient(
                    circle at 87% 18%,
                    rgba(255, 222, 115, .78) 0 12px,
                    transparent 13px
                ),

                radial-gradient(
                    circle at 16% 83%,
                    rgba(255, 190, 214, .50) 0 10px,
                    transparent 11px
                ),

                linear-gradient(
                    145deg,
                    #eadcff,
                    #cbb5f4 58%,
                    #b89ae8
                );

            border: 5px solid #7350a8;

            box-shadow:

                0 10px 0 rgba(83, 55, 126, .18),

                0 28px 70px rgba(55, 38, 80, .30);

            opacity: 0;

            pointer-events: none;

            transform:

                translate(-50%, -50%)

                scale(.72)

                rotate(-3deg);

            transition:

                .34s cubic-bezier(.2, .9, .25, 1.25);
        }


        .final-popup.show {

            opacity: 1;

            pointer-events: auto;

            transform:

                translate(-50%, -50%)

                scale(1)

                rotate(0);
        }


        .final-emoji {

            font-size: 78px;

            margin-bottom: 8px;
        }


        .final-popup h2 {

            font-size: 36px;

            font-weight: 500;

            color: #4c3272;

            margin-bottom: 8px;
        }


        .final-popup p {

            font-size: 18px;

            color: #5f4a7a;

            margin-bottom: 24px;

            font-weight: 500;
        }


        .play-again-btn {

            min-width: 185px;
            height: 52px;

            padding: 0 28px;

            border: none;

            border-radius: 17px;

            background: #68449a;

            color: white;

            font-size: 20px;

            font-weight: 500;

            cursor: pointer;

            box-shadow:

                0 7px 0 rgba(70, 44, 106, .20),

                0 13px 24px rgba(89, 59, 131, .24);

            transition: .2s ease;
        }


        .play-again-btn:hover {

            transform: translateY(-3px);
        }


        /* =====================================================
           LARGE MONITOR
        ===================================================== */

        /* =====================================================
           LARGE MONITOR - FULL PAGE RESPONSIVE
        ===================================================== */

        @media (min-width: 1400px) {

            .header {
                height: 105px;
                padding: 10px 7vw;
            }

            .heading {
                max-width: 1400px;
                font-size: 30px;
                line-height: 1.3;
            }

            .game-area {
                top: 105px;
                bottom: 95px;
                padding: 10px 4vw;
            }

            .game-label {
                font-size: 20px;
                padding: 11px 28px;
                margin-bottom: 22px;
                border-radius: 18px;
            }

            .question-text {
                font-size: 40px;
                font-weight: 400;
                line-height: 1.3;
                margin-bottom: 34px;
            }

            .battle-arena {
                width: min(1350px, 90vw);
                grid-template-columns: 1fr 150px 1fr;
                gap: 35px;
            }

            .player-side {
                min-height: 220px;
            }

            .player-tag {
                font-size: 18px;
                padding: 9px 24px;
                border-radius: 16px;
            }

            .number-panel {
                min-height: 150px;
                margin-top: 32px;
                border-radius: 28px;
            }

            .number-value {
                font-size: 30px;
                font-weight: 400;
                letter-spacing: 3px;
            }

            .vs-core {
                height: 220px;
            }

            .vs-top,
            .vs-bottom {
                width: 6px;
                height: 42px;
            }

            .vs-text {
                width: 94px;
                height: 94px;
                margin: 9px 0;
                border-radius: 22px;
            }

            .vs-text span {
                font-size: 30px;
            }

            .control-title {
                margin-top: 30px;
                margin-bottom: 16px;
                font-size: 21px;
            }

            .symbol-controls {
                gap: 28px;
            }

            .symbol-btn {
                width: 100px;
                height: 82px;
                border-radius: 22px;
                font-size: 40px;
            }

            /* Monitor buttons: exactly 200px × 60px, 30px text */
            .submit-btn,
            .nav-btn {
                width: 200px;
                min-width: 200px;
                height: 60px;
                padding: 0;
                font-size: 30px;
                border-radius: 18px;
            }

            .submit-btn {
                bottom: 18px;
            }

            .nav-btn {
                bottom: 20px;
            }

            #prevBtn {
                left: clamp(30px, 4vw, 80px);
            }

            #nextBtn {
                right: clamp(30px, 4vw, 80px);
            }

            .feedback {
                width: min(520px, 42vw);
                min-height: 300px;
                padding: 40px;
                border-radius: 34px;
            }

            .feedback-icon {
                width: 88px;
                height: 88px;
                flex-basis: 88px;
                font-size: 48px;
            }

            .feedback h3 {
                font-size: 34px;
            }

            .feedback p {
                font-size: 20px;
            }

            .final-popup {
                width: min(650px, 55vw);
                padding: 48px 46px 40px;
                border-radius: 38px;
            }

            .final-emoji {
                font-size: 90px;
            }

            .final-popup h2 {
                font-size: 42px;
            }

            .final-popup p {
                font-size: 21px;
            }

            .play-again-btn {
                min-width: 220px;
                height: 60px;
                font-size: 23px;
            }
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            .battle-arena {

                grid-template-columns:
                    1fr
                    90px
                    1fr;

                gap: 12px;
            }


            .number-value {

                font-size: 28px;
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 760px) {

            .header {

                height: 72px;

                padding: 8px 12px;
            }


            .heading {

                font-size: 17px;
            }


            .game-area {

                top: 72px;
                bottom: 70px;

                padding: 5px 12px;

                justify-content: center;
            }


            .game-label {

                font-size: 13px;

                padding: 7px 15px;

                margin-bottom: 9px;
            }


            .question-text {

                font-size: 22px;

                margin-bottom: 10px;
            }


            .battle-arena {

                grid-template-columns: 1fr;

                gap: 5px;
            }


            .player-side {

                min-height: 82px;
            }


            .number-panel {

                min-height: 70px;

                margin-top: 15px;
            }


            .player-tag {

                font-size: 11px;

                padding: 4px 12px;
            }


            .number-value {

                font-size: 24px;
            }


            .vs-core {

                height: 52px;

                flex-direction: row;

                gap: 12px;
            }


            .vs-top,
            .vs-bottom {

                width: 30px;
                height: 4px;
            }


            .vs-text {

                width: 42px;
                height: 42px;

                margin: 0;

                border-radius: 11px;
            }


            .vs-text span {

                font-size: 15px;
            }


            .control-title {

                margin-top: 8px;

                margin-bottom: 8px;

                font-size: 13px;
            }


            .symbol-controls {

                gap: 12px;
            }


            .symbol-btn {

                width: 62px;
                height: 52px;

                border-radius: 16px;

                font-size: 27px;
            }


            .submit-btn {

                bottom: 10px;

                min-width: 125px;

                height: 43px;

                padding: 0 15px;

                font-size: 17px;
            }


            .nav-btn {

                bottom: 12px;

                min-width: 82px;

                height: 40px;

                padding: 0 8px;

                font-size: 15px;
            }


            #prevBtn {

                left: 13px;
            }


            #nextBtn {

                right: 13px;
            }


            .feedback {

                width: min(440px, 90vw);

                min-height: 205px;

                padding: 22px;
            }


            .final-popup {

                width: 91vw;

                padding: 30px 22px;
            }


            .final-popup h2 {

                font-size: 30px;
            }


            .final-emoji {

                font-size: 65px;
            }

        }

    </style>

</head>


<body>


    <div class="game-page">


        <!-- BACKGROUND -->

        <!-- HEADER -->

        <header class="header">

            <div class="heading">

                Compare the following numbers with &lt;, &gt; or = 

            </div>

        </header>


        <!-- GAME -->

        <main class="game-area">
            <div class="question-text">

                Choose the winning symbol!

            </div>


            <!-- BATTLE AREA -->

            <div class="battle-arena">


                <!-- PLAYER A -->

                <div class="player-side player-a">

                    <div class="player-tag">

                        PLAYER A

                    </div>


                    <div class="number-panel">

                        <span
                            id="leftNumber"
                            class="number-value">
                        </span>

                    </div>

                </div>


                <!-- VS -->

                <div class="vs-core">

                    <div class="vs-top"></div>

                    <div class="vs-text">

                        <span>VS</span>

                    </div>

                    <div class="vs-bottom"></div>

                </div>


                <!-- PLAYER B -->

                <div class="player-side player-b">

                    <div class="player-tag">

                        PLAYER B

                    </div>


                    <div class="number-panel">

                        <span
                            id="rightNumber"
                            class="number-value">
                        </span>

                    </div>

                </div>


            </div>


            <!-- SYMBOL CONTROLS -->

            <div class="control-title">

                Pick your comparison power!

            </div>


            <div class="symbol-controls">

                <button
                    class="symbol-btn"
                    data-symbol="<">

                    &lt;

                </button>


                <button
                    class="symbol-btn"
                    data-symbol=">">

                    &gt;

                </button>


                <button
                    class="symbol-btn"
                    data-symbol="=">

                    =

                </button>

            </div>


        </main>


        <!-- SUBMIT -->

        <button
            id="submitBtn"
            class="submit-btn">

            Submit ✓

        </button>


        <!-- NAVIGATION -->

        <button
            id="prevBtn"
            class="nav-btn"
            disabled>

            ← Back

        </button>


        <button
            id="nextBtn"
            class="nav-btn"
            disabled>

            Next →

        </button>


        <!-- CORRECT POPUP -->

        <div
            id="correctPopup"
            class="feedback correct-popup">

            <div class="feedback-icon">

                🎉

            </div>

            <h3>

                Perfect!

            </h3>

            <p>

                You selected the correct symbol!

            </p>

        </div>


        <!-- WRONG POPUP -->

        <div
            id="wrongPopup"
            class="feedback wrong-popup">

            <div class="feedback-icon">

                😕 

            </div>

            <h3>

                Try Again!

            </h3>

            <p>

                Compare both numbers carefully.

            </p>

        </div>


        <!-- FINAL POPUP -->

        <div
            id="finalPopup"
            class="final-popup">

            <div class="final-emoji">🏆</div>


            <h2>

                Awesome!

            </h2>


            <p>

                You completed all Number Clash challenges!

            </p>


            <button
                id="playAgainBtn"
                class="play-again-btn">

                ↻ Play Again

            </button>

        </div>


    </div>


    <script>


        /* =====================================================
           VOICE
        ===================================================== */

        function speak(t) {

            speechSynthesis.cancel();

            const msg =
                new SpeechSynthesisUtterance(t);

            msg.lang = "en-US";

            msg.volume = 0.25;

            msg.rate = 1;

            msg.pitch = 1;

            speechSynthesis.speak(msg);

        }


        /* =====================================================
           QUESTIONS
        ===================================================== */

        const questions = [

            {
                left: "4431624",
                right: "44326124",
                answer: "<"
            },

            {
                left: "30150230",
                right: "3510023",
                answer: ">"
            },

            {
                left: "98764125",
                right: "9981472",
                answer: ">"
            },

            {
                left: "88080818",
                right: "88088018",
                answer: "<"
            }

        ];


        /* =====================================================
           VARIABLES
        ===================================================== */

        let currentQuestion = 0;

        let selectedAnswer = "";


        const answers =
            questions.map(() => ({

                answer: "",

                completed: false

            }));


        const leftNumber =
            document.getElementById("leftNumber");


        const rightNumber =
            document.getElementById("rightNumber");


        const submitBtn =
            document.getElementById("submitBtn");


        const prevBtn =
            document.getElementById("prevBtn");


        const nextBtn =
            document.getElementById("nextBtn");


        const correctPopup =
            document.getElementById("correctPopup");


        const wrongPopup =
            document.getElementById("wrongPopup");


        const finalPopup =
            document.getElementById("finalPopup");


        const playAgainBtn =
            document.getElementById("playAgainBtn");


        const symbolButtons =
            document.querySelectorAll(".symbol-btn");


        /* =====================================================
           LOAD QUESTION
        ===================================================== */

        function loadQuestion() {


            correctPopup.classList.remove("show");

            wrongPopup.classList.remove("show");


            const question =
                questions[currentQuestion];


            const saved =
                answers[currentQuestion];


            selectedAnswer =
                saved.answer;


            leftNumber.textContent =
                question.left;


            rightNumber.textContent =
                question.right;


            symbolButtons.forEach(button => {


                button.classList.remove(

                    "selected",

                    "correct",

                    "wrong"

                );


                button.disabled = false;


                if (

                    button.dataset.symbol ===
                    selectedAnswer

                ) {

                    button.classList.add("selected");

                }

            });


            /* COMPLETED QUESTION */

            if (saved.completed) {


                symbolButtons.forEach(button => {


                    button.disabled = true;


                    if (

                        button.dataset.symbol ===
                        saved.answer

                    ) {

                        button.classList.add("correct");

                    }

                });


                submitBtn.disabled = true;


                nextBtn.disabled =

                    currentQuestion ===
                    questions.length - 1;


            }


            /* NEW QUESTION */

            else {


                submitBtn.disabled = false;


                nextBtn.disabled = true;

            }


            prevBtn.disabled =

                currentQuestion === 0;

        }


        /* =====================================================
           SELECT SYMBOL
        ===================================================== */

        symbolButtons.forEach(button => {


            button.addEventListener(
                "click",
                () => {


                    /* LOCK COMPLETED ANSWER */

                    if (

                        answers[currentQuestion]
                        .completed

                    ) {

                        return;

                    }


                    symbolButtons.forEach(btn => {

                        btn.classList.remove(
                            "selected"
                        );

                    });


                    button.classList.add(
                        "selected"
                    );


                    selectedAnswer =
                        button.dataset.symbol;

                }
            );

        });


        /* =====================================================
           SUBMIT ANSWER
        ===================================================== */

        function submitAnswer() {


            if (!selectedAnswer) {

                return;

            }


            const correctAnswer =

                questions[currentQuestion]
                .answer;


            /* =============================================
               CORRECT
            ============================================= */

            if (

                selectedAnswer ===
                correctAnswer

            ) {


                answers[currentQuestion] = {

                    answer:
                        selectedAnswer,

                    completed:
                        true

                };


                symbolButtons.forEach(button => {


                    button.disabled = true;


                    if (

                        button.dataset.symbol ===
                        selectedAnswer

                    ) {


                        button.classList.remove(
                            "selected"
                        );


                        button.classList.add(
                            "correct"
                        );

                    }

                });


                submitBtn.disabled = true;


                correctPopup.classList.add(
                    "show"
                );


                speak(
                    "Correct!"
                );


                setTimeout(() => {


                    correctPopup.classList.remove(
                        "show"
                    );


                    /* LAST QUESTION */

                    if (

                        currentQuestion ===
                        questions.length - 1

                    ) {


                        finalPopup.classList.add(
                            "show"
                        );



                    }


                    /* ENABLE NEXT */

                    else {


                        nextBtn.disabled = false;

                    }


                }, 1500);

            }


            /* =============================================
               WRONG
            ============================================= */

            else {


                const wrongButton =

                    [...symbolButtons]
                    .find(button =>

                        button.dataset.symbol ===
                        selectedAnswer

                    );


                wrongButton.classList.add(
                    "wrong"
                );


                wrongPopup.classList.add(
                    "show"
                );


                speak(
                    "Try again."
                );


                setTimeout(() => {


                    wrongPopup.classList.remove(
                        "show"
                    );


                    /* AUTOMATICALLY REMOVE
                       WRONG ANSWER */

                    wrongButton.classList.remove(

                        "wrong",

                        "selected"

                    );


                    selectedAnswer = "";


                    answers[currentQuestion]
                        .answer = "";


                }, 1500);

            }

        }


        /* =====================================================
           SUBMIT EVENT
        ===================================================== */

        submitBtn.addEventListener(

            "click",

            submitAnswer

        );


        /* =====================================================
           NEXT
        ===================================================== */

        nextBtn.addEventListener(

            "click",

            () => {


                if (

                    answers[currentQuestion]
                    .completed &&

                    currentQuestion <
                    questions.length - 1

                ) {


                    currentQuestion++;


                    loadQuestion();

                }

            }

        );


        /* =====================================================
           BACK
        ===================================================== */

        prevBtn.addEventListener(

            "click",

            () => {


                if (

                    currentQuestion > 0

                ) {


                    currentQuestion--;


                    loadQuestion();

                }

            }

        );


        /* =====================================================
           PLAY AGAIN
        ===================================================== */

        playAgainBtn.addEventListener(

            "click",

            () => {


                currentQuestion = 0;

                selectedAnswer = "";


                answers.forEach(item => {


                    item.answer = "";

                    item.completed = false;

                });


                finalPopup.classList.remove(
                    "show"
                );


                loadQuestion();

            }

        );


        /* =====================================================
           START GAME
        ===================================================== */

        loadQuestion();


    </script>


<script>
/* ===== CONFETTI CELEBRATION (right & final popups) ===== */
(function () {
  let canvas, ctx, pieces = [], raf = null;
  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
    document.body.appendChild(canvas);
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
  function burst(count) {
    ensureCanvas();
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - .5) * 180,
        y: innerHeight / 2 + (Math.random() - .5) * 90,
        vx: (Math.random() - .5) * 11,
        vy: Math.random() * -13 - 4,
        g: 0.30 + Math.random() * 0.14,
        s: 6 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * 0.4,
        color: colors[i % colors.length],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
    pieces.forEach(p => {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (pieces.length) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.fireConfetti = function (big) {
    if (big) {
      burst(170);
      let n = 0;
      const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
    } else {
      burst(90);
    }
  };
  function watch(id, big) {
    const el = document.getElementById(id);
    if (!el) return;
    let was = el.classList.contains("show");
    new MutationObserver(() => {
      const now = el.classList.contains("show");
      if (now && !was) window.fireConfetti(big);
      was = now;
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  function init() { watch("correctPopup", false); watch("finalPopup", true); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
