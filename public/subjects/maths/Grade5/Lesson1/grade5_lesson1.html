<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Math Marvels · Kids Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Livvic:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      min-height: 100%;
      max-width: 100%;
      overflow-x: hidden
    }

    body {
      font-family: 'Livvic', sans-serif;
      color: #26324a;
      background:
        radial-gradient(circle at 5% 5%, rgba(255, 201, 111, .22), transparent 23%),
        radial-gradient(circle at 95% 12%, rgba(112, 174, 255, .18), transparent 25%),
        linear-gradient(135deg, #f8fbff 0%, #f4f0ff 48%, #fff8ed 100%);
      padding: clamp(14px, 2vw, 28px);
    }

    body:before,
    body:after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(2px);
      z-index: -1
    }

    body:before {
      width: 220px;
      height: 220px;
      right: -90px;
      bottom: -70px;
      background: rgba(159, 119, 240, .12)
    }

    body:after {
      width: 180px;
      height: 180px;
      left: -70px;
      bottom: 10%;
      background: rgba(73, 190, 158, .10)
    }

    .page {
      width: min(100%, 1500px);
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 2vw, 26px)
    }

    .title-block {
      min-height: 110px;
      padding: 20px clamp(20px, 3vw, 42px);
      border-radius: 30px;
      background: linear-gradient(115deg, #38236f, #6342b6 56%, #8b68df);
      box-shadow: 0 22px 45px rgba(65, 41, 126, .22);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .title-block:before {
      content: '✦  +  ÷  =  ✦';
      position: absolute;
      right: 5%;
      top: 18px;
      color: rgba(255, 255, 255, .16);
      font-size: clamp(26px, 4vw, 58px);
      letter-spacing: 12px;
      transform: rotate(-7deg)
    }

    .title-block .kids {
      font-size: clamp(26px, 3vw, 44px);
      font-weight: 600;
      color: #fff;
      line-height: 1.05;
      letter-spacing: .5px;
      position: relative
    }

    .title-block .math {
      font-family: 'Livvic', sans-serif;
      font-size: clamp(14px, 1.3vw, 20px);
      font-weight: 800;
      color: #f9df8b;
      letter-spacing: 1px;
      margin-top: 7px;
      position: relative
    }

    .stage {
      width: 100%;
      position: relative
    }

    .viewport {
      width: 100%;
      height: calc(100vh - 230px);
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 8px 18px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #a88be0 transparent;
    }

    .track {
      display: grid;
      grid-template-columns: repeat(var(--items, 4), minmax(0, 1fr));
      gap: clamp(14px, 1.5vw, 22px);
    }

    .scroll-controls {
      position: fixed;
      right: clamp(14px, 2vw, 28px);
      bottom: clamp(18px, 3vw, 34px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scroll-btn {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(145deg, #6342b6, #39236f);
      box-shadow: 0 12px 24px rgba(68, 44, 131, .22);
      font-size: 17px;
      transition: .2s transform, .2s box-shadow, .2s opacity;
    }

    .scroll-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 18px 30px rgba(68, 44, 131, .32)
    }

    .scroll-btn:active {
      transform: scale(.94)
    }

    .scroll-btn:disabled {
      opacity: .35;
      cursor: default;
      transform: none
    }

    .card {
      --bg: #fff;
      --mid: #bb9aff;
      --dark: #7d4be0;
      min-width: 0;
      min-height: 300px;
      position: relative;
      overflow: hidden;
      border-radius: 27px;
      background: rgba(255, 255, 255, .86);
      border: 1px solid rgba(255, 255, 255, .85);
      box-shadow: 0 14px 30px rgba(42, 51, 85, .10);
      display: flex;
      flex-direction: column;
      transition: transform .28s cubic-bezier(.2, .8, .2, 1), box-shadow .28s ease;
    }

    .card:before {
      content: '';
      height: 6px;
      width: 100%;
      background: linear-gradient(90deg, var(--mid), var(--dark))
    }

    .card:nth-child(2n) {
      border-radius: 38px 20px 38px 20px
    }

    .card:nth-child(3n) {
      border-radius: 20px 38px 20px 38px
    }

    .card:hover {
      transform: translateY(-9px);
      box-shadow: 0 25px 42px rgba(42, 51, 85, .18)
    }

    .card-head {
      height: 112px;
      margin: 14px 14px 0;
      border-radius: 22px;
      position: relative;
      background: linear-gradient(135deg, var(--mid), var(--dark));
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .card:nth-child(2n) .card-head {
      border-radius: 32px 16px 32px 16px
    }

    .card:nth-child(3n) .card-head {
      clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%)
    }

    .card-head:after {
      content: '';
      position: absolute;
      width: 145px;
      height: 145px;
      border: 24px solid rgba(255, 255, 255, .14);
      border-radius: 50%;
      right: -42px;
      top: -48px
    }

    .lvl {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      background: rgba(255, 255, 255, .9);
      color: var(--dark);
      padding: 5px 10px;
      border-radius: 10px;
      font-family: 'Livvic', sans-serif;
      font-size: 12px;
      font-weight: 900
    }

    .avatar {
      position: relative;
      z-index: 2;
      width: 70px;
      height: 70px;
      border-radius: 22px;
      background: #fff;
      display: grid;
      place-items: center;
      color: var(--dark);
      font-size: 30px;
      box-shadow: 0 10px 20px rgba(31, 25, 60, .2);
      transform: rotate(-4deg);
      transition: .25s transform
    }

    .card:nth-child(2n) .avatar {
      border-radius: 50%;
      transform: rotate(5deg)
    }

    .card:nth-child(3n) .avatar {
      border-radius: 16px 30px 16px 30px
    }

    .card:hover .avatar {
      transform: rotate(0) scale(1.08)
    }

    .card-body {
      padding: 17px 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 9px;
      flex: 1
    }

    .card-body h3 {
      font-size: clamp(17px, 1.35vw, 21px);
      font-weight: 600;
      line-height: 1.2;
      color: #273149;
      min-height: 2.4em;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .tag {
      font-family: 'Livvic', sans-serif;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .55px;
      color: var(--dark);
      background: var(--bg);
      padding: 7px 12px;
      border-radius: 999px
    }

    .btn-row {
      width: 100%;
      margin-top: auto;
      padding-top: 8px
    }

    .play-btn {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      padding: 12px;
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--mid), var(--dark));
      box-shadow: 0 8px 16px rgba(58, 47, 100, .14);
      transition: .2s transform, .2s filter
    }

    .play-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05)
    }

    .nav-info {
      align-self: center;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 16px 10px 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .8);
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 10px 25px rgba(47, 55, 90, .09)
    }

    .page-count {
      font-family: 'Livvic', sans-serif;
      font-size: 13px;
      font-weight: 900;
      color: #493b75;
      white-space: nowrap
    }

    .dots {
      display: flex;
      gap: 7px;
      align-items: center
    }

    .dot {
      border: 0;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #d9d1eb;
      cursor: pointer;
      transition: .2s
    }

    .dot.active {
      width: 27px;
      background: linear-gradient(90deg, #8b68df, #49308e)
    }

    .dot:hover {
      transform: scale(1.2)
    }

    .quiz-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 1000;
      display: none
    }

    .quiz-overlay.active {
      display: block
    }

    .quiz-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block
    }

    .quiz-home-btn {
      position: absolute;
      z-index: 1001;
      top: 20px;
      right: 20px;
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 18px;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      background: linear-gradient(145deg, #6342b6, #39236f);
      box-shadow: 0 10px 22px rgba(50, 35, 100, .3)
    }

    @media(max-width:1100px) {
      .card {
        min-height: 285px
      }
    }

    @media(max-width:640px) {
      body {
        padding: 12px
      }

      .title-block {
        min-height: 96px;
        border-radius: 24px;
        padding: 18px
      }

      .viewport {
        height: calc(100vh - 190px);
        padding: 6px 4px 16px
      }

      .track {
        gap: 12px
      }

      .card {
        min-height: 275px
      }

      .card-head {
        height: 100px
      }

      .scroll-controls {
        right: 12px;
        bottom: 18px
      }

      .scroll-btn {
        width: 42px;
        height: 42px;
        border-radius: 13px
      }

      .quiz-home-btn {
        top: 12px;
        right: 12px;
        width: 46px;
        height: 46px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .card,
      .track,
      .scroll-btn,
      .avatar {
        transition: none !important
      }

      .viewport {
        scroll-behavior: auto
      }

      .card:hover {
        transform: none
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- header: two-line "Kids Learning" + "Math Playground" -->
    <div class="title-block">
      <span class="kids">Kids Learning</span>
      <span class="math">Math Playground</span>
    </div>

    <div class="stage">
      <div class="viewport" id="viewport">
        <div class="track" id="track"></div>
      </div>
    </div>

    <div class="scroll-controls" aria-label="Scroll controls">
      <button class="scroll-btn" id="scrollUpBtn" aria-label="Scroll up" title="Scroll up">
        <i class="fa-solid fa-chevron-up"></i>
      </button>
      <button class="scroll-btn" id="scrollDownBtn" aria-label="Scroll down" title="Scroll down">
        <i class="fa-solid fa-chevron-down"></i>
      </button>
    </div>

  </div>

  <!-- Quiz overlay: opens the clicked game in an iframe over the whole page -->
  <div class="quiz-overlay" id="quizOverlay">
    <button class="quiz-home-btn" id="quizHomeBtn" aria-label="Back to home">
      <i class="fa-solid fa-house"></i>
    </button>
    <iframe class="quiz-iframe" id="quizFrame" title="Quiz" src="about:blank"></iframe>
  </div>

  <script>
    const games = [
      { icon: 'fa-compass', title: 'Numeral Adventure', tag: 'Numerals', href: './exercise/numeral.html' },
      { icon: 'fa-bullseye', title: 'Rounding Mission', tag: 'Rounding', href: './exercise/roundof_number.html' },
      { icon: 'fa-right-left', title: 'Hindu Arabic to Roman', tag: 'Roman Numerals', href: './exercise/hindu-arabic-to-roman.html' },
      { icon: 'fa-puzzle-piece', title: 'Fillinthe Box', tag: 'Number Puzzle', href: './exercise/Fillinthebox.html' },
      { icon: 'fa-circle-dot', title: 'Abacus game', tag: 'Abacus', href: './exercise/abacus.html' },
      { icon: 'fa-layer-group', title: 'Face Value & Place Value', tag: 'Place Value', href: './exercise/place_&_facevalue.html' },
      { icon: 'fa-location-crosshairs', title: 'Period and Place Challenge', tag: 'Place Value', href: './exercise/Period_Place.html' },
      { icon: 'fa-arrows-left-right', title: 'Predecessor & Successor Challenge', tag: 'Number Sense', href: './exercise/predecessors_successors.html' },
      { icon: 'fa-scale-balanced', title: 'Compare Symbol', tag: 'Number Comparison', href: './exercise/symbol.html' },
      { icon: 'fa-ranking-star', title: 'Smallest & Greatest', tag: 'Number Ordering', href: './exercise/smallest_greatest.html' },
      { icon: 'fa-wand-magic-sparkles', title: 'Making Smallest & Greatest', tag: 'Number Formation', href: './exercise/making_smallestandgreatest.html' },
      { icon: 'fa-9', title: 'Nine Digit Smallest and Greatest', tag: 'Number Ordering', href: './exercise/ninedigit_smallest_greatest.html' },
      { icon: 'fa-arrow-down-1-9', title: 'Find the nearest Ten', tag: 'Rounding', href: './exercise/roundoff_nearest10.html' },
      { icon: 'fa-arrow-down-9-1', title: 'Find the nearest Hundred', tag: 'Rounding', href: './exercise/roundoff_nearest100.html' },
      { icon: 'fa-bullseye', title: 'Find the nearest Thousand', tag: 'Rounding', href: './exercise/roundoff_nearest1000.html' },
      { icon: 'fa-circle-check', title: 'Correct Symbol', tag: 'Number Comparison', href: './exercise/correct_symbol.html' },
      { icon: 'fa-arrows-left-right', title: 'Roman Numeral predecessor & successor', tag: 'Roman Numerals', href: './exercise/Roman_predecessors_successors.html' },
      { icon: 'fa-arrow-right-arrow-left', title: 'Roman numerals in Hindu Arabic', tag: 'Roman Numerals', href: './exercise/roman-numerals-in-hindu-arabic.html' },
      { icon: 'fa-shuffle', title: 'Arabic To Roman Numerals', tag: 'Roman Numerals', href: './exercise/Arabic_Roman_numerals.html' },
      { icon: 'fa-triangle-exclamation', title: 'Roman Numerals', tag: 'Roman Numerals', href: './exercise/Wrong_ronamnumerals.html' },
      { icon: 'fa-hashtag', title: 'Romannumeral value', tag: 'Roman Numerals', href: './exercise/Romannumeral_value.html' }
    ];

    // 4 fixed color sets – repeat pattern every 4 cards
    const fixedThemes = [
      ['#faf0ff', '#bb9aff', '#7d4be0'],
      ['#fef6e6', '#ffbe6e', '#d98c2e'],
      ['#ebfaff', '#7fc9ff', '#2f8ed9'],
      ['#f3fce8', '#a5d88a', '#4f9d3a'],
    ];

    const track = document.getElementById('track');
    const viewport = document.getElementById('viewport');
    const scrollUpBtn = document.getElementById('scrollUpBtn');
    const scrollDownBtn = document.getElementById('scrollDownBtn');

    let itemsPerView = 4;

    function computeItemsPerView() {
      const w = window.innerWidth;
      if (w >= 1100) return 4;
      if (w >= 860) return 3;
      if (w >= 600) return 2;
      return 1;
    }

    function cardHtml(game, indexInAll) {
      const theme = fixedThemes[indexInAll % 4];
      return `
      <article class="card" style="--bg:${theme[0]};--mid:${theme[1]};--dark:${theme[2]}">
        <div class="card-head">
          <span class="lvl">#${indexInAll + 1}</span>
          <span class="avatar"><i class="fa-solid ${game.icon}"></i></span>
        </div>
        <div class="card-body">
          <h3>${game.title}</h3>
          <span class="tag">${game.tag}</span>
          <div class="btn-row">
            <a class="play-btn" href="${game.href}" data-href="${game.href}">Play <i class="fa-solid fa-play"></i></a>
          </div>
        </div>
      </article>`;
    }

    function renderTrack() {
      itemsPerView = computeItemsPerView();
      track.style.setProperty('--items', itemsPerView);
      track.innerHTML = games.map((g, i) => cardHtml(g, i)).join('');
      updateScrollButtons();
    }

    function updateScrollButtons() {
      const atTop = viewport.scrollTop <= 4;
      const atBottom = viewport.scrollTop + viewport.clientHeight >= viewport.scrollHeight - 4;
      scrollUpBtn.disabled = atTop;
      scrollDownBtn.disabled = atBottom;
    }

    function scrollByRows(direction) {
      const firstCard = track.querySelector('.card');
      const gap = parseFloat(getComputedStyle(track).rowGap) || 16;
      const rowHeight = firstCard ? firstCard.getBoundingClientRect().height + gap : viewport.clientHeight * 0.85;
      const rows = Math.max(1, Math.round(viewport.clientHeight / rowHeight));
      viewport.scrollBy({ top: direction * rowHeight * rows, behavior: 'smooth' });
    }

    scrollUpBtn.addEventListener('click', () => scrollByRows(-1));
    scrollDownBtn.addEventListener('click', () => scrollByRows(1));
    viewport.addEventListener('scroll', updateScrollButtons, { passive: true });

    window.addEventListener('resize', () => {
      clearTimeout(window.__resizeTimer);
      window.__resizeTimer = setTimeout(() => {
        const oldItems = itemsPerView;
        const newItems = computeItemsPerView();
        if (oldItems !== newItems) {
          renderTrack();
        } else {
          updateScrollButtons();
        }
      }, 120);
    });

    // ----- Quiz overlay: open a game in an iframe, come back to the same page -----
    function openQuiz(href) {
      quizFrame.src = href;
      quizOverlay.classList.add('active');
    }

    function closeQuiz() {
      quizOverlay.classList.remove('active');
      quizFrame.src = 'about:blank';
      // currentPage was never changed while the quiz was open,
      // so the grid is still showing the exact page the quiz was opened from.
    }

    // event delegation: catches Play buttons even after the track re-renders
    track.addEventListener('click', (e) => {
      const btn = e.target.closest('.play-btn');
      if (!btn) return;
      e.preventDefault();
      openQuiz(btn.dataset.href);
    });

    quizHomeBtn.addEventListener('click', closeQuiz);

    document.addEventListener('keydown', (e) => {
      if (quizOverlay.classList.contains('active')) {
        if (e.key === 'Escape') closeQuiz();
        return;
      }
      if (e.key === 'ArrowDown' || e.key === 'PageDown') {
        e.preventDefault();
        scrollByRows(1);
      }
      if (e.key === 'ArrowUp' || e.key === 'PageUp') {
        e.preventDefault();
        scrollByRows(-1);
      }
    });

    renderTrack();
  </script>
</body>

</html>
