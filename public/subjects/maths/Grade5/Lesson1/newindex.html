<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Math Marvels · Kids Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Livvic',sans-serif;}
html,body{min-height:100%;max-width:100%;overflow-x:hidden}
body{
  font-family:'Livvic',sans-serif;color:#26324a;font-weight:400;font-weight:400;
  background:
    radial-gradient(circle at 5% 5%,rgba(255,201,111,.22),transparent 23%),
    radial-gradient(circle at 95% 12%,rgba(112,174,255,.18),transparent 25%),
    #ffffff;
  padding:clamp(14px,2vw,28px)
}
body:before,body:after{content:'';position:fixed;border-radius:50%;pointer-events:none;filter:blur(2px);z-index:-1}
body:before{width:220px;height:220px;right:-90px;bottom:-70px;background:rgba(159,119,240,.12)}
body:after{width:180px;height:180px;left:-70px;bottom:10%;background:rgba(73,190,158,.10)}
.page{width:min(100%,1500px);margin:auto;display:flex;flex-direction:column;gap:clamp(16px,2vw,26px)}
.title-block{
  min-height:125px;padding:22px clamp(20px,3vw,42px);border-radius:30px;
  /* background:#ffffff; 
  box-shadow:0 22px 45px rgba(65,41,126,.22);position:relative;overflow:hidden; */
  display:flex;flex-direction:column;justify-content:center; align-items: center;
}
.title-block:before{content:'✦  +  ÷  =  ✦';position:absolute;right:5%;top:18px;color:rgba(255,255,255,.16);font-size:clamp(26px,4vw,58px);letter-spacing:12px;transform:rotate(-7deg)}
.kids{font-size:clamp(26px,3vw,44px);font-weight:400;color:#891a1a;line-height:1.05;position:relative}
.math{font-size:clamp(18px,1.3vw,24px);font-weight:400;color:#34332f;letter-spacing:1px;margin-top:7px;position:relative}
.activity-subtitle{font-size:clamp(18px,1.3vw,24px); margin-top: 8px;}
.page-heading{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;

}
.page-heading h2{
  font-size:clamp(20px,1.8vw,26px);
  color:#3d315f;
  text-align:center;
  font-weight:400
}
.rule{display:none}

#homeGrid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:20px;
}
.part-card{
  appearance:none;border:2px solid rgba(255,255,255,.9);
  border-radius:25px;background:#fff;
  padding:24px 20px;text-align:left;cursor:pointer;
  box-shadow:0 14px 30px rgba(42,51,85,.10);
  position:relative;overflow:hidden;color:#26324a;
  transition:.22s transform,.22s box-shadow,.22s border-color;
}
.part-card:hover{transform:translateY(-7px);box-shadow:0 24px 42px rgba(42,51,85,.17);border-color:var(--c)}
.part-card:after{
  content:'';position:absolute;width:150px;height:150px;border-radius:50%;
  right:-60px;bottom:-70px;background:var(--c);opacity:.12
}
.part-number{
  width:46px;height:46px;border-radius:14px;background:var(--soft);
  border:2px solid var(--c);color:var(--c);display:grid;place-items:center;
  font-size:19px;font-weight:400;margin-bottom:17px;position:relative;z-index:1
}
.part-card h3{font-size:clamp(19px,1.5vw,24px);font-weight:400;line-height:1.2;margin-bottom:8px;position:relative;z-index:1}
.explore-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  align-self:flex-start;
  margin-top:14px;
  padding:9px 15px;
  border-radius:999px;
  background:var(--soft);
  color:var(--c);
  font-size:14px;
  font-weight:400;
  line-height:1;
  white-space:nowrap;
  position:relative;
  z-index:2;
}

.part-card p{font-size:14px;line-height:1.5;color:#333946;min-height:66px;position:relative;z-index:1}
.part-count{
  position:absolute;
  top:18px;
  right:18px;
  display:inline-flex;
  align-items:center;
  padding:7px 12px;
  border-radius:999px;
  background:var(--soft);
  color:var(--c);
  font-size:14px;
  font-weight:400;
  line-height:1;
  z-index:2;
}

#partView{display:none}
.part-top{
  display:block;
  margin-bottom:18px
}
.back-home{
  position:fixed;
  top:18px;
  left:18px;
  z-index:900;
     min-height: 46px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #fff;
    border-radius: 999px;
    background: #fff;
    color: #26324a;
    font-weight:400;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(42,51,85,.12);
  font-size:17px;
  flex:none;
  transition:transform .15s ease,box-shadow .15s ease
}
.back-home:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 24px rgba(42,51,85,.16)
}
.part-banner{
  width:100%;
  min-height:82px;
  border-radius:20px;
  padding:18px 22px;
  color:#3f4050;
  background:#ffffff;
  border:2px solid #e5e6ee;
  display:flex;
  align-items:center;
  gap:14px;
  box-shadow:0 8px 22px rgba(42,51,85,.08);
}
.part-banner .big-num{
  width:46px;
  height:46px;
  border-radius:13px;
  background:#f1e9fa;
  border:2px solid #d7c5e9;
  color:#76558f;
  display:grid;
  place-items:center;
  font-size:18px;
  font-weight:400;
  flex:none;
}
.part-banner h2{font-size:clamp(20px,2vw,28px);margin-bottom:3px; font-weight:400;}
.part-banner p{font-size:16px;opacity:.94}

.quiz-list{
  display:grid;grid-template-columns:repeat(4,1fr);gap:18px
}
.quiz-card{
  min-width:0;
  min-height:285px;
  border-radius:22px;
  background:#ffffff;
  border:2px solid #e7e8ef;
  box-shadow:0 10px 24px rgba(42,51,85,.09);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.quiz-card:hover{transform:translateY(-7px);box-shadow:0 24px 42px rgba(42,51,85,.18)}
.quiz-head{
  height:105px;
  margin:11px 11px 0;
  border-radius:18px;
  background:var(--soft);
  border:2px solid rgba(0,0,0,.04);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
.quiz-head:after{content:'';position:absolute;width:130px;height:130px;border:22px solid rgba(255,255,255,.13);border-radius:50%;right:-40px;top:-48px}
.quiz-number{
  position:absolute;top:9px;left:9px;background:rgba(255,255,255,.93);
  color:var(--dark);padding:5px 9px;border-radius:9px;font-size:11px;font-weight:400;z-index:2
}
.quiz-icon{
  width:66px;height:66px;border-radius:20px;background:#fff;color:var(--dark);
  display:grid;place-items:center;font-size:28px;box-shadow:0 10px 20px rgba(31,25,60,.18);
  z-index:2
}
.quiz-body{padding:15px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;flex:1}
.quiz-body h3{font-size:clamp(20px,1.2vw,24px);font-weight:400;line-height:1.2;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.quiz-tag{
  font-size:14px;font-weight:400;text-transform:uppercase;letter-spacing:.5px;
  color:var(--dark);background:var(--soft);padding:7px 11px;border-radius:999px
}
.start-btn{
  width:100%;
  border:2px solid rgba(0,0,0,.05);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  padding:12px;
  border-radius:14px;
  color:#4b4b4b;
  font:inherit;
  font-size:20px;
  font-weight:400;
  background:var(--soft);
  cursor:pointer;
  box-shadow:0 5px 12px rgba(42,51,85,.08);
  transition:.2s transform,.2s filter;
}
.start-btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn-row{width:100%;margin-top:auto;padding-top:7px}

.quiz-overlay{position:fixed;inset:0;background:#fff;z-index:1000;display:none}
.quiz-overlay.active{display:block}
.quiz-iframe{width:100%;height:100%;border:0;display:block}
.quiz-back-btn{
  position:absolute;
  z-index:1001;
  top:20px;
  left:20px;
  width:54px;
  height:54px;
  border:0;
  border-radius:18px;
  color:#fff;
  font-size:20px;
  cursor:pointer;
  background:#ffffff;
  box-shadow:0 10px 22px rgba(50,35,100,.3)
}

@media(max-width:1200px){
  #homeGrid{grid-template-columns:repeat(2,1fr)}
  .quiz-list{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:850px){
  .quiz-list{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  body{padding:12px}
  .title-block{min-height:105px;border-radius:24px;padding:18px}
  #homeGrid,.quiz-list{grid-template-columns:1fr}
  .part-card{min-height:190px}
  .part-count{
    top:14px;
    right:14px;
    font-size:12px;
    padding:6px 9px;
  }
  .part-top{align-items:flex-start}
  .part-banner{padding:16px}
  .back-home{width:42px;height:42px}
  .quiz-card{min-height:275px}
}
@media(min-width:1600px){
  .page{width:min(100%,1750px)}
  #homeGrid{gap:26px}
  .part-card{padding:30px 25px;min-height:265px}
  .part-card h3{font-size:27px}
  .part-card p{font-size:17px}
  .part-count{font-size:20px}
  .quiz-list{grid-template-columns:repeat(4,1fr);gap:24px}
  .quiz-card{min-height:310px}
  .quiz-head{height:120px}
  .quiz-body h3{font-size:24px}
}

/* ---- Soft pastel + unified typography ---- */
*, *::before, *::after{
  font-weight:400 !important;
}
.part-card,
.quiz-card{
  border-color:#E8E8EF;
}
.quiz-head{
  border:2px solid rgba(255,255,255,.8);
}
.quiz-icon{
  background:#fff;
  box-shadow:0 8px 18px rgba(42,51,85,.10);
}
.quiz-number{
  background:rgba(255,255,255,.96);
}
.start-btn{
  border:2px solid rgba(255,255,255,.75);
  color:#4b4b4b;
}


/* Reliable Play arrow */
.start-btn .fa-play{
  display:inline-block !important;
  width:16px;
  height:16px;
  line-height:16px;
  font-family:"Font Awesome 6 Free" !important;
  font-weight:900 !important;
  font-size:16px !important;
  color:currentColor !important;
  flex:0 0 16px;
  text-align:center;
}
.start-btn .fa-play::before{
  content:"\f04b" !important;
}


/* Final soft-pastel activity card palette */
.quiz-card .quiz-head{
  background:var(--soft) !important;
  border:2px solid rgba(0,0,0,.035);
}
.quiz-card .quiz-icon{
  color:var(--dark) !important;
  background:#ffffff !important;
}
.quiz-card .quiz-tag{
  color:var(--dark) !important;
  background:var(--soft) !important;
}
.quiz-card .start-btn{
  color:var(--dark) !important;
  background:var(--soft) !important;
  border:2px solid rgba(0,0,0,.04);
}
.quiz-card{
  background:#ffffff !important;
  border:2px solid #E6E6EA !important;
}

</style>

</head>
<body>
<div class="page">

  <header class="title-block">
    <span class="kids">Math Marvels</span>
    <!-- <span class="math">Kids Playground · 21 Interactive Activities</span> -->
    <span class="activity-subtitle">Learn, practise and have fun with numerals, place value, rounding, number sense and Roman numerals.</span>
  </header>

  <div class="page-heading" id="partHeading">
    <h2>Choose a Learning Part</h2>
    <div class="rule"></div>
  </div>

  <main id="homeGrid">
    <button class="part-card" type="button" data-part="1"
      style="--c:#6342b6;--soft:#f4edff">
      <span class="part-number">1</span>
      <h3>Numerals & Place Value</h3>
      <p>Build number sense with numerals, place value and number formation.</p>
      <span class="part-count">6 Activities</span>
      <span class="explore-btn">EXPLORE ACTIVITIES →</span>
    </button>
<button class="part-card" type="button" data-part="2"
      style="--c:#d98c2e;--soft:#fff5df">
      <span class="part-number">2</span>
      <h3>Rounding & Number Ordering</h3>
      <p>Round numbers and find the nearest, smallest and greatest values.</p>
      <span class="part-count">6 Activities</span>
      <span class="explore-btn">EXPLORE ACTIVITIES →</span>
    </button>
<button class="part-card" type="button" data-part="3"
      style="--c:#2f8ed9;--soft:#eaf8ff">
      <span class="part-number">3</span>
      <h3>Compare & Number Sense</h3>
      <p>Compare numbers and practise predecessor, successor and correct symbols.</p>
      <span class="part-count">3 Activities</span>
      <span class="explore-btn">EXPLORE ACTIVITIES →</span>
    </button>
<button class="part-card" type="button" data-part="4"
      style="--c:#4f9d3a;--soft:#effae9">
      <span class="part-number">4</span>
      <h3>Roman Numerals</h3>
      <p>Read, convert and work with Roman numeral values.</p>
      <span class="part-count">6 Activities</span>
      <span class="explore-btn">EXPLORE ACTIVITIES →</span>
    </button>
  </main>

  <main id="partView">
    <div class="part-top">
      <button class="back-home" id="partBackBtn" type="button" aria-label="Back to all parts">
        🏠 Home
      </button>
      <div class="part-banner" id="partBanner"></div>
    </div>
    <div class="quiz-list" id="quizList"></div>
  </main>

</div>

<div class="quiz-overlay" id="quizOverlay">
  <button class="quiz-back-btn" id="quizBackBtn" aria-label="Back to activities">
   🏠
  </button>
  <iframe class="quiz-iframe" id="quizFrame" title="Math Quiz" src="about:blank"></iframe>
</div>


<script>
const PARTS=[{"id":1,"title":"Numerals & Place Value","subtitle":"Build number sense with numerals, place value and number formation.","color":"#6342b6","soft":"#f4edff","games":[{"icon":"fa-compass","title":"Numeral Adventure","tag":"Numerals","href":"./exercise/numeral.html"},{"icon":"fa-puzzle-piece","title":"Fillinthe Box","tag":"Number Puzzle","href":"./exercise/Fillinthebox.html"},{"icon":"fa-circle-dot","title":"Abacus game","tag":"Abacus","href":"./exercise/abacus.html"},{"icon":"fa-layer-group","title":"Face Value & Place Value","tag":"Place Value","href":"./exercise/place_&_facevalue.html"},{"icon":"fa-location-crosshairs","title":"Period and Place Challenge","tag":"Place Value","href":"./exercise/Period_Place.html"},{"icon":"fa-wand-magic-sparkles","title":"Making Smallest & Greatest","tag":"Number Formation","href":"./exercise/making_smallestandgreatest.html"}]},{"id":2,"title":"Rounding & Number Ordering","subtitle":"Round numbers and find the nearest, smallest and greatest values.","color":"#d98c2e","soft":"#fff5df","games":[{"icon":"fa-bullseye","title":"Rounding Mission","tag":"Rounding","href":"./exercise/roundof_number.html"},{"icon":"fa-ranking-star","title":"Smallest & Greatest","tag":"Number Ordering","href":"./exercise/smallest_greatest.html"},{"icon":"fa-9","title":"Nine Digit Smallest and Greatest","tag":"Number Ordering","href":"./exercise/ninedigit_smallest_greatest.html"},{"icon":"fa-arrow-down-1-9","title":"Find the nearest Ten","tag":"Rounding","href":"./exercise/roundoff_nearest10.html"},{"icon":"fa-arrow-down-9-1","title":"Find the nearest Hundred","tag":"Rounding","href":"./exercise/roundoff_nearest100.html"},{"icon":"fa-bullseye","title":"Find the nearest Thousand","tag":"Rounding","href":"./exercise/roundoff_nearest1000.html"}]},{"id":3,"title":"Compare & Number Sense","subtitle":"Compare numbers and practise predecessor, successor and correct symbols.","color":"#2f8ed9","soft":"#eaf8ff","games":[{"icon":"fa-arrows-left-right","title":"Predecessor & Successor Challenge","tag":"Number Sense","href":"./exercise/predecessors_successors.html"},{"icon":"fa-scale-balanced","title":"Compare Symbol","tag":"Number Comparison","href":"./exercise/symbol.html"},{"icon":"fa-circle-check","title":"Correct Symbol","tag":"Number Comparison","href":"./exercise/correct_symbol.html"}]},{"id":4,"title":"Roman Numerals","subtitle":"Read, convert and work with Roman numeral values.","color":"#4f9d3a","soft":"#effae9","games":[{"icon":"fa-right-left","title":"Hindu Arabic to Roman","tag":"Roman Numerals","href":"./exercise/hindu-arabic-to-roman.html"},{"icon":"fa-arrows-left-right","title":"Roman Numeral predecessor & successor","tag":"Roman Numerals","href":"./exercise/Roman_predecessors_successors.html"},{"icon":"fa-arrow-right-arrow-left","title":"Roman numerals in Hindu Arabic","tag":"Roman Numerals","href":"./exercise/roman-numerals-in-hindu-arabic.html"},{"icon":"fa-shuffle","title":"Arabic To Roman Numerals","tag":"Roman Numerals","href":"./exercise/Arabic_Roman_numerals.html"},{"icon":"fa-triangle-exclamation","title":"Roman Numerals","tag":"Roman Numerals","href":"./exercise/Wrong_ronamnumerals.html"},{"icon":"fa-hashtag","title":"Romannumeral value","tag":"Roman Numerals","href":"./exercise/Romannumeral_value.html"}]}];

const homeGrid=document.getElementById('homeGrid');
const partView=document.getElementById('partView');
const partHeading=document.getElementById('partHeading');
const quizList=document.getElementById('quizList');
const partBackBtn=document.getElementById('partBackBtn');
const quizOverlay=document.getElementById('quizOverlay');
const quizFrame=document.getElementById('quizFrame');
const quizBackBtn=document.getElementById('quizBackBtn');

const themes=[
  ['#F3EAF8','#F3EAF8','#7A5A8A'],  // soft lavender
  ['#FFF1E2','#FFF1E2','#9A7048'],  // soft peach
  ['#EAF5EE','#EAF5EE','#5C8068'],  // soft sage
  ['#FFF8D9','#FFF8D9','#8A7A3F']   // soft butter
];

function esc(value){
  return String(value).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function openPart(partId){
  const part=PARTS.find(p=>p.id===partId);
  if(!part)return;

  homeGrid.style.display='none';
  partHeading.style.display='none';
  partView.style.display='block';

  const banner=document.getElementById('partBanner');
  banner.style.background='#ffffff';
  const bannerThemes={
    1:['#EDE3F8','#EDE3F8','#76558F'],
    2:['#FFF0D6','#FFF0D6','#9A6D32'],
    3:['#E1F3FB','#E1F3FB','#4D829F'],
    4:['#E5F3DE','#E5F3DE','#557A48']
  };
  const bt=bannerThemes[part.id] || bannerThemes[1];
  banner.style.setProperty('--banner-soft','#ffffff');
  banner.style.setProperty('--banner-mid','#ffffff');
  banner.style.setProperty('--banner-dark',bt[2]);
  banner.innerHTML=
    '<span class="big-num">'+part.id+'</span>'+
    '<div><h2>'+esc(part.title)+'</h2><p>'+esc(part.subtitle)+'</p></div>';

  quizList.innerHTML=part.games.map((game,index)=>{
    const theme=themes[index%themes.length];
    return `
      <article class="quiz-card" style="--soft:${theme[0]};--mid:${theme[1]};--dark:${theme[2]}">
        <div class="quiz-head">
          <span class="quiz-number">${index+1}</span>
          <span class="quiz-icon"><i class="fa-solid ${esc(game.icon)}"></i></span>
        </div>
        <div class="quiz-body">
          <h3>${esc(game.title)}</h3>
          <span class="quiz-tag">${esc(game.tag)}</span>
          <div class="btn-row">
            <button class="start-btn" type="button" data-href="${esc(game.href)}">
              Play ▶
            </button>
          </div>
        </div>
      </article>`;
  }).join('');

  window.scrollTo({top:0,behavior:'smooth'});
}

function showHome(){
  partView.style.display='none';
  homeGrid.style.display='grid';
  partHeading.style.display='flex';
  window.scrollTo({top:0,behavior:'smooth'});
}

function openQuiz(href){
  quizFrame.src=href;
  quizOverlay.classList.add('active');
}

function closeQuiz(){
  quizOverlay.classList.remove('active');
  quizFrame.src='about:blank';
}

homeGrid.addEventListener('click',e=>{
  const card=e.target.closest('.part-card');
  if(card)openPart(Number(card.dataset.part));
});

partBackBtn.addEventListener('click',showHome);

quizList.addEventListener('click',e=>{
  const button=e.target.closest('.start-btn');
  if(!button)return;
  openQuiz(button.dataset.href);
});
quizBackBtn.addEventListener('click',closeQuiz);

document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && quizOverlay.classList.contains('active'))closeQuiz();
});
</script>

</body>
</html>
