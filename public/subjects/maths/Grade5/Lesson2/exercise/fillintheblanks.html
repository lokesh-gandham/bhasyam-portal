<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
<title>Addition Mission</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Livvic",sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    color:#2f4f4f;
}

/* =========================================================
   DIFFERENT GAME WORLD — ADDITION MISSION
   ========================================================= */

.game-page{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;

}
.math-mark{
    font-size:42px;
    opacity:.25;
    font-weight:400;
}

.math-mark.one{left:5%;top:48%;color:#d99074;}
.math-mark.two{right:5%;top:56%;color:#6ba8a3;}
.math-mark.three{left:20%;bottom:8%;font-size:30px;color:#7350a8;}
.math-mark.four{right:22%;top:10%;font-size:30px;color:#d99c36;}

.dot-grid{
    width:100px;
    height:70px;
    opacity:.28;
    background-image:radial-gradient(circle,#2f4f4f 1.4px,transparent 1.5px);
    background-size:14px 14px;
}
.dot-grid.one{left:2%;top:10%;}
.dot-grid.two{right:2%;bottom:10%;}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:105px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px 130px;
    z-index:10;
}

.heading{
    font-size:22px;
    font-weight:400;
    color:#2f4f4f;
    text-align:center;
}

/* =========================================================
   GAME AREA
   ========================================================= */

.game-area{
    position:absolute;
    top:105px;
    bottom:82px;
    left:0;
    right:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:5px 5vw;
}

/* =========================================================
   MISSION HUD — intentionally not a card
   ========================================================= */

.mission-row{
    width:min(1120px,92vw);
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.mission-name{
    display:flex;
    align-items:center;
    gap:10px;
    color:#70572d;
    font-size:17px;
    font-weight:500;
    letter-spacing:.7px;
}

.mission-dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#dfb45a;
    box-shadow:0 0 0 5px rgba(223,180,90,.16);
}

.stage{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:15px;
    color:#607878;
}

.stage span{
    width:27px;
    height:27px;
    border-radius:50%;
    display:grid;
    place-items:center;
    border:2px solid #b6c9c5;
    background:#fff;
}

.stage span.active{
    background:#2f4f4f;
    border-color:#2f4f4f;
    color:#fff;
}

/* =========================================================
   CENTRAL ARCADE MACHINE
   ========================================================= */

.machine{
    width:min(1120px,92vw);
    min-height:335px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

/* top/bottom machine rails */
.machine-rail{
    width:100%;
    height:14px;
    border-radius:20px;
    background:#2f4f4f;
    box-shadow:0 7px 0 rgba(22,59,59,.13);
}

.machine-rail.bottom{
    margin-top:17px;
    opacity:.85;
}

.equation-zone{
    width:100%;
    min-height:255px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:34px 42px;
    background:
        linear-gradient(180deg,rgba(255,255,255,.94),rgba(246,250,248,.94));
    border-left:3px solid #8fbab5;
    border-right:3px solid #8fbab5;
    box-shadow:
        inset 0 3px 0 rgba(255,255,255,.95),
        inset 0 -5px 0 rgba(47,79,79,.05);
}

.equation-zone::before,
.equation-zone::after{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#efbca6;
    border:3px solid #d99074;
    top:17px;
}

.equation-zone::before{left:24px;}
.equation-zone::after{right:24px;}

.equation{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:17px;
    flex-wrap:wrap;
    font-size:30px;
    font-weight:400;
    color:#2f4f4f;
}

.fixed-number{
    white-space:nowrap;
}

.equal{
    color:#70572d;
}

.blank{
    width:150px;
    height:62px;
    border:3px dashed #b6c9c5;
    border-radius:17px;
    background:#fffdf7;
    outline:none;
    text-align:center;
    color:#2f4f4f;
    font-size:30px;
    font-weight:400;
    box-shadow:
        inset 0 3px 0 rgba(255,255,255,.9),
        0 5px 0 rgba(47,79,79,.08);
    transition:.18s ease;
}

.blank:focus{
    border-color:#d99c36;
    background:#fff8dd;
    transform:translateY(-2px);
    box-shadow:
        0 6px 0 rgba(172,116,38,.12),
        0 0 0 4px rgba(217,156,54,.10);
}

.blank.correct{
    border-style:solid;
    border-color:#16834f;
    background:#dcf5e5;
    color:#16834f;
}

.blank.wrong{
    border-style:solid;
    border-color:#c94740;
    background:#ffe8e4;
    color:#c94740;
    animation:shake .4s ease;
}

@keyframes shake{
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
    100%{transform:translateX(0);}
}

/* small machine controls */
.machine-controls{
    position:absolute;
    left:34px;
    bottom:25px;
    display:flex;
    align-items:center;
    gap:8px;
}

.machine-light{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#dfb45a;
    box-shadow:0 0 0 4px rgba(223,180,90,.13);
}

.machine-controls span{
    font-size:12px;
    color:#6a7e7d;
    letter-spacing:.6px;
}

.instruction{
    margin-top:17px;
    font-size:17px;
    color:#607878;
    text-align:center;
}

/* =========================================================
   SUBMIT BUTTON — EXACT REFERENCE SIZE/COLOR
   ========================================================= */

.submit-btn{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    min-width:155px;
    height:50px;
    padding:0 28px;
    border:none;
    border-radius:18px;
    background:#2f4f4f;
    color:white;
    font-size:20px;
    font-weight:500;
    cursor:pointer;
    box-shadow:
        0 8px 0 rgba(22,59,59,.18),
        0 13px 25px rgba(47,79,79,.20);
    transition:.2s ease;
    z-index:30;
}

.submit-btn:hover:not(:disabled){
    transform:translateX(-50%) translateY(-3px);
}

.submit-btn:active:not(:disabled){
    transform:translateX(-50%) translateY(2px);
}

.submit-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================================================
   NAV BUTTONS — EXACT REFERENCE SIZE/COLOR
   ========================================================= */

.nav-btn{
    position:absolute;
    bottom:22px;
    min-width:126px;
    height:46px;
    padding:0 19px;
    border-radius:15px;
    font-size:20px;
    font-weight:500;
    color:#2f4f4f;
    cursor:pointer;
    transition:.2s ease;
    border:2px solid rgba(47,79,79,.12);
    box-shadow:0 8px 18px rgba(47,79,79,.12);
    z-index:30;
}

#prevBtn{
    left:clamp(20px,4vw,70px);
    background:#a9cbe2;
    border-color:#79a9c7;
}

#nextBtn{
    right:clamp(20px,4vw,70px);
    background:#efbca6;
    border-color:#d99074;
}

.nav-btn:hover:not(:disabled){
    transform:translateY(-3px);
}

.nav-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================================================
   CORRECT / WRONG POPUP — EXACT REFERENCE SIZE/COLOR
   ========================================================= */

.feedback{
    position:fixed;
    top:50%;
    left:50%;
    z-index:100;
    width:min(440px,88vw);
    min-height:215px;
    padding:26px 30px 28px;
    border-radius:30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,-50%) scale(.7) rotate(-4deg);
    transition:.28s cubic-bezier(.2,.9,.25,1.25);
    box-shadow:0 20px 50px rgba(32,57,57,.22);
}

.feedback.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1) rotate(0);
}

.feedback.correct-popup{
    background:linear-gradient(135deg,#e2f6e9,#f4fcf6);
    border:5px solid #16834f;
}

.feedback.wrong-popup{
    background:linear-gradient(135deg,#fde6e2,#fff7f5);
    border:5px solid #c94740;
}

.feedback-icon{
    width:68px;
    height:68px;
    flex:0 0 68px;
    border-radius:24px 24px 24px 8px;
    display:grid;
    place-items:center;
    font-size:34px;
    color:white;
    box-shadow:0 5px 0 rgba(0,0,0,.08);
}

.correct-popup .feedback-icon{background:#16834f;}
.wrong-popup .feedback-icon{background:#c94740;}

.feedback h3{
    font-size:28px;
    font-weight:600;
    margin-bottom:3px;
}

.feedback p{
    font-size:17px;
    color:#607878;
}

/* =========================================================
   FINAL POPUP — EXACT REFERENCE SIZE/COLOR
   ========================================================= */

.final-popup{
    position:fixed;
    top:50%;
    left:50%;
    z-index:200;
    width:min(520px,91vw);
    padding:38px 36px 32px;
    text-align:center;
    border-radius:34px;
    background:
        radial-gradient(circle at 14% 15%,rgba(255,255,255,.70) 0 8px,transparent 9px),
        radial-gradient(circle at 87% 18%,rgba(255,222,115,.78) 0 12px,transparent 13px),
        radial-gradient(circle at 16% 83%,rgba(255,190,214,.50) 0 10px,transparent 11px),
        linear-gradient(145deg,#eadcff,#cbb5f4 58%,#b89ae8);
    border:5px solid #7350a8;
    box-shadow:
        0 10px 0 rgba(83,55,126,.18),
        0 28px 70px rgba(55,38,80,.30);
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,-50%) scale(.72) rotate(-3deg);
    transition:.34s cubic-bezier(.2,.9,.25,1.25);
}

.final-popup.show{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%,-50%) scale(1) rotate(0);
}

.final-emoji{
    font-size:78px;
    margin-bottom:8px;
}

.final-popup h2{
    font-size:36px;
    font-weight:600;
    color:#4c3272;
    margin-bottom:8px;
}

.final-popup p{
    font-size:18px;
    color:#5f4a7a;
    margin-bottom:24px;
    font-weight:400;
}

.play-again-btn{
    min-width:185px;
    height:52px;
    padding:0 28px;
    border:none;
    border-radius:17px;
    background:#68449a;
    color:white;
    font-size:20px;
    font-weight:500;
    cursor:pointer;
    box-shadow:
        0 7px 0 rgba(70,44,106,.20),
        0 13px 24px rgba(89,59,131,.24);
    transition:.2s ease;
}

.play-again-btn:hover{
    transform:translateY(-3px);
}

/* =========================================================
   LARGE MONITOR
   ========================================================= */

@media (min-width:1400px){
    /*

    */

    .header{

    }

    .heading{

    }

        top:clamp(105px,6.2vw,135px);

/* =========================================================
   TABLET
   ========================================================= */

@media (max-width:900px){
    .equation-zone{padding:30px 22px;}

<body>
<div class="game-page">

    

    <header class="header">
        <div class="heading">Fill in the addition facts</div>
    </header>

    <main class="game-area">

        <div class="mission-row">
            <div class="mission-name">
                <span class="mission-dot"></span>
                ADDITION MISSION
            </div>


        </div>

        <section class="machine">
            <div class="machine-rail"></div>

            <div class="equation-zone">
                <div id="equation" class="equation"></div>

                <div class="machine-controls">
                    <span class="machine-light"></span>
                  
                </div>
            </div>

            <div class="machine-rail bottom"></div>
        </section>

        
    </main>

    <!-- SUBMIT -->
    <button id="submitBtn" class="submit-btn">Submit ✓</button>

    <!-- NAVIGATION -->
    <button id="prevBtn" class="nav-btn" disabled>← Back</button>
    <button id="nextBtn" class="nav-btn" disabled>Next →</button>

    <!-- CORRECT POPUP -->
    <div id="correctPopup" class="feedback correct-popup">
        <div class="feedback-icon">🎉</div>
        <h3>Perfect!</h3>
        <p>You selected the correct answer!</p>
    </div>

    <!-- WRONG POPUP -->
    <div id="wrongPopup" class="feedback wrong-popup">
        <div class="feedback-icon">😕</div>
        <h3>Try Again!</h3>
        <p>Check the addition fact carefully.</p>
    </div>

    <!-- FINAL POPUP -->
    <div id="finalPopup" class="final-popup">
        <div class="final-emoji">🏆</div>
        <h2>Math Champion!</h2>
        <p>You completed all Addition Mission challenges!</p>
        <button id="playAgainBtn" class="play-again-btn">↻ Play Again</button>
    </div>
</div>

<script>
/* =====================================================
   VOICE — EXACT REFERENCE FUNCTION
   ===================================================== */

function speak(t) {
    speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(t);
    msg.lang = "en-US";
    msg.volume = 0.25;
    msg.rate = 1;
    msg.pitch = 1;
    speechSynthesis.speak(msg);
}

/* =====================================================
   QUESTIONS
   Each source row becomes one single-screen mission.
   ===================================================== */

const questions = [
    {
        parts: [
            { type: "text", value: "525" },
            { type: "text", value: "+" },
            { type: "text", value: "475" },
            { type: "text", value: "=" },
            { type: "text", value: "1000" },
            { type: "text", value: "=" },
            { type: "text", value: "475" },
            { type: "input", answer: "525" }
        ],
        spoken: "525 plus 475 equals 1000. 475 plus what number equals 1000?"
    },
    {
        parts: [
            { type: "text", value: "10050" },
            { type: "text", value: "+" },
            { type: "text", value: "30250" },
            { type: "text", value: "=" },
            { type: "input", answer: "40300" },
            { type: "text", value: "=" },
            { type: "text", value: "30250" },
            { type: "text", value: "+" },
            { type: "input", answer: "10050" }
        ],
        spoken: "10050 plus 30250 equals what, and 30250 plus what number gives the same total?"
    },
    {
        parts: [
            { type: "input", answer: "40800" },
            { type: "text", value: "+" },
            { type: "text", value: "5200" },
            { type: "text", value: "=" },
            { type: "text", value: "46000" },
            { type: "text", value: "=" },
            { type: "input", answer: "5200" },
            { type: "text", value: "+" },
            { type: "text", value: "40800" }
        ],
        spoken: "What number plus 5200 equals 46000, and what number plus 40800 equals 46000?"
    },
    {
        parts: [
            { type: "text", value: "75500" },
            { type: "text", value: "+" },
            { type: "input", answer: "24450" },
            { type: "text", value: "=" },
            { type: "text", value: "24450" },
            { type: "text", value: "+" },
            { type: "input", answer: "75500" },
            { type: "text", value: "=" },
            { type: "input", answer: "99950" }
        ],
        spoken: "75500 plus what number equals 24450 plus what number, and what is the total?"
    }
];

let currentQuestion = 0;
let questionCompleted = false;

const equation = document.getElementById("equation");
const submitBtn = document.getElementById("submitBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const correctPopup = document.getElementById("correctPopup");
const wrongPopup = document.getElementById("wrongPopup");
const finalPopup = document.getElementById("finalPopup");
const playAgainBtn = document.getElementById("playAgainBtn");

const savedAnswers = questions.map(() => []);
const completed = questions.map(() => false);

/* =====================================================
   LOAD QUESTION
   ===================================================== */

function loadQuestion() {
    correctPopup.classList.remove("show");
    wrongPopup.classList.remove("show");

    const question = questions[currentQuestion];
    const saved = savedAnswers[currentQuestion];

    equation.innerHTML = "";

    let inputIndex = 0;

    question.parts.forEach(part => {
        if (part.type === "text") {
            const span = document.createElement("span");
            span.className = "fixed-number" +
                (part.value === "=" ? " equal" : "");
            span.textContent = part.value;
            equation.appendChild(span);
        } else {
            const input = document.createElement("input");
            input.type = "text";
            input.inputMode = "numeric";
            input.className = "blank";
            input.autocomplete = "off";
            input.setAttribute("aria-label", "Answer " + (inputIndex + 1));
            input.dataset.answerIndex = inputIndex;

            if (saved[inputIndex] !== undefined) {
                input.value = saved[inputIndex];
            }

            if (completed[currentQuestion]) {
                input.disabled = true;
                input.classList.add("correct");
            }

            input.addEventListener("input", () => {
                input.value = input.value.replace(/\D/g, "");
                savedAnswers[currentQuestion][inputIndex] = input.value;
                updateSubmitState();
            });

            input.addEventListener("keydown", e => {
                if (e.key === "Enter") submitAnswer();
            });

            equation.appendChild(input);
            inputIndex++;
        }
    });

    questionCompleted = completed[currentQuestion];

    submitBtn.disabled = questionCompleted;
    nextBtn.disabled = !questionCompleted || currentQuestion === questions.length - 1;
    prevBtn.disabled = currentQuestion === 0;

    if (!questionCompleted) {
        setTimeout(() => {
            const first = equation.querySelector(".blank");
            if (first) first.focus();
        }, 100);
    }
}

function updateSubmitState() {
    if (completed[currentQuestion]) return;

    const inputs = [...equation.querySelectorAll(".blank")];
    submitBtn.disabled = inputs.some(input => !input.value.trim());
}

/* =====================================================
   SUBMIT ANSWER
   ===================================================== */

function submitAnswer() {
    if (completed[currentQuestion]) return;

    const inputs = [...equation.querySelectorAll(".blank")];

    if (inputs.some(input => !input.value.trim())) {
        speak("Please complete all the blanks.");
        return;
    }

    const question = questions[currentQuestion];

    const isCorrect = inputs.every((input, i) => {
        return input.value.trim() === question.parts.filter(p => p.type === "input")[i].answer;
    });

    if (isCorrect) {
        inputs.forEach(input => {
            input.classList.remove("wrong");
            input.classList.add("correct");
            input.disabled = true;
        });

        savedAnswers[currentQuestion] = inputs.map(input => input.value.trim());
        completed[currentQuestion] = true;
        questionCompleted = true;

        submitBtn.disabled = true;
        nextBtn.disabled = currentQuestion === questions.length - 1;

        correctPopup.classList.add("show");
        speak("Correct!");

        setTimeout(() => {
            correctPopup.classList.remove("show");

            if (currentQuestion === questions.length - 1) {
                finalPopup.classList.add("show");
                
            }
        }, 1500);

    } else {
        inputs.forEach((input, i) => {
            const expected =
                question.parts.filter(p => p.type === "input")[i].answer;

            if (input.value.trim() !== expected) {
                input.classList.add("wrong");
            }
        });

        wrongPopup.classList.add("show");
        speak("Try again.");

       setTimeout(() => {
    wrongPopup.classList.remove("show");

    inputs.forEach((input, i) => {
        const expected =
            question.parts.filter(p => p.type === "input")[i].answer;

        if (input.value.trim() !== expected) {
            input.value = "";
            input.classList.remove("wrong");
        }
    });

    updateSubmitState();

    // Focus the first empty input
    const firstEmpty = inputs.find(input => !input.value.trim());
    if (firstEmpty) firstEmpty.focus();

}, 1500);
    }
}

submitBtn.addEventListener("click", submitAnswer);

/* =====================================================
   NEXT
   ===================================================== */

nextBtn.addEventListener("click", () => {
    if (completed[currentQuestion] && currentQuestion < questions.length - 1) {
        currentQuestion++;
        loadQuestion();
    }
});

/* =====================================================
   BACK
   ===================================================== */

prevBtn.addEventListener("click", () => {
    if (currentQuestion > 0) {
        currentQuestion--;
        loadQuestion();
    }
});

/* =====================================================
   PLAY AGAIN
   ===================================================== */

playAgainBtn.addEventListener("click", () => {
    currentQuestion = 0;

    completed.fill(false);
    savedAnswers.forEach(arr => arr.splice(0, arr.length));

    finalPopup.classList.remove("show");
    loadQuestion();
});

/* =====================================================
   START
   ===================================================== */

loadQuestion();
</script>
<script>
/* ===== CONFETTI CELEBRATION (right & final popups) ===== */
(function () {
  let canvas, ctx, pieces = [], raf = null;
  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
    document.body.appendChild(canvas);
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
  function burst(count) {
    ensureCanvas();
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - .5) * 180,
        y: innerHeight / 2 + (Math.random() - .5) * 90,
        vx: (Math.random() - .5) * 11,
        vy: Math.random() * -13 - 4,
        g: 0.30 + Math.random() * 0.14,
        s: 6 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * 0.4,
        color: colors[i % colors.length],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
    pieces.forEach(p => {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (pieces.length) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.fireConfetti = function (big) {
    if (big) {
      burst(170);
      let n = 0;
      const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
    } else {
      burst(90);
    }
  };
  function watch(id, big) {
    const el = document.getElementById(id);
    if (!el) return;
    let was = el.classList.contains("show");
    new MutationObserver(() => {
      const now = el.classList.contains("show");
      if (now && !was) window.fireConfetti(big);
      was = now;
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  function init() { watch("correctPopup", false); watch("finalPopup", true); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
