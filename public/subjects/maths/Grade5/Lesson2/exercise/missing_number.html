<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Missing Digit Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  overflow:hidden;
  font-family:"Livvic",sans-serif;
  color:#2f4f4f;
  background:#f8f2eb;
}
#game{
  position:relative;width:100%;height:100vh;min-height:620px;
  overflow:hidden;
  
}


/* decorative arcade tracks */
.track{
  position:absolute;pointer-events:none;border:3px dashed rgba(142,112,181,.24);
  border-radius:50%;
}

.spark{position:absolute;pointer-events:none;font-size:36px;opacity:.35}
.spark.a{left:3%;top:36%;color:#e0a272}
.spark.b{right:5%;top:34%;color:#77b4a2}

/* top HUD — deliberately not a large card */
.topbar{
  position:relative;z-index:20;
  height:86px;
  display:flex;align-items:center;
  padding:13px clamp(24px,4vw,70px);
}

.hud{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:12px;
  padding:10px 23px;

}
.hud-icon{
  width:42px;height:42px;display:grid;place-items:center;
  border-radius:12px;background:#eadcf7;border:2px solid #b08bd2;
  font-size:22px;
}
.hud h1{margin:0;font-size:22px;font-weight:400;white-space:nowrap}

/* game arena — compact so the fixed navigation never overlaps */
.arena{
  position:relative;z-index:5;
  width:min(1320px,92vw);
  height:calc(100vh - 165px);
  min-height:0;
  margin:4px auto 0;
  display:flex;align-items:center;justify-content:center;
}

/* unique open "arcade console", not a card */
.console{
  position:relative;
  width:100%;
  height:auto;
  max-height:100%;
  min-height:0;
  overflow:auto;
  padding:28px clamp(18px,4vw,60px) 24px;
  background:rgba(255,255,252,.62);
  border-top:4px solid #9c7ac7;
  border-bottom:4px solid #9c7ac7;
  clip-path:polygon(2% 0,98% 0,100% 8%,100% 92%,98% 100%,2% 100%,0 92%,0 8%);
  box-shadow:0 18px 35px rgba(73,58,86,.12);
}
.console:before,.console:after{
  content:"";position:absolute;width:95px;height:95px;
  border:3px solid #e2c3a7;pointer-events:none;
}
.console:before{left:8px;top:8px;border-right:0;border-bottom:0}
.console:after{right:8px;bottom:8px;border-left:0;border-top:0}

.question-line{
  display:none;
}
.q-orb{
  flex:0 0 50px;width:50px;height:50px;
  display:grid;place-items:center;border-radius:16px 50% 50% 16px;
  background:#d8edf4;border:3px solid #83b7c7;
  color:#315d6b;font-size:25px;font-weight:600;
  box-shadow:0 5px 0 rgba(49,93,107,.10);
}
.question-line h2{
  margin:0;font-size:30px;font-weight:500;color:#2f4f4f;
}

/* worksheet becomes an arcade "digit runway" */
.runway{
  position:relative;z-index:2;
  width:min(1030px,100%);
  margin:0 auto;
}
.runway-label{
  display:flex;justify-content:space-between;align-items:center;
  margin:0 5px 9px;
  font-size:16px;color:#6c7e7e;
}
.runway-label span:first-child{
  padding:5px 11px;border-radius:10px;background:#f1e8fb;color:#72529b;
  font-weight:600;
}
.grid-shell{
  padding:12px;
  background:#f0e9f8;
  border:2px solid #c5b1da;
  border-radius:18px;
  box-shadow:0 7px 0 rgba(92,68,117,.10);
}
.operation{
  display:grid;
  gap:3px;
}
.operation.seven{grid-template-columns:42px repeat(7,minmax(0,1fr))}
.operation.six{grid-template-columns:42px repeat(6,minmax(0,1fr))}
.cell{
  min-width:0;height:57px;
  display:flex;align-items:center;justify-content:center;
  background:#fffefa;
  border:1px solid #b7b7b2;
  color:#303d40;font-size:28px;font-weight:400;
}
.cell.head{
  height:40px;background:#f9e8bc;border-color:#d3b979;
  color:#51462f;font-size:18px;font-weight:600;
}
.cell.sign{
  border:0;background:transparent;font-size:28px;font-weight:500;
}
.cell.blank{
  background:#fff8dd;
  border:2px solid #d9a044;
  box-shadow:inset 0 0 0 2px rgba(217,160,68,.08);
}
.cell.blank input{
  width:100%;height:100%;min-width:0;
  border:0;outline:0;background:transparent;
  text-align:center;color:#2f4f4f;
  font:400 28px "Livvic",sans-serif;
}
.cell.blank:focus-within{
  background:#fffdf1;border-color:#8e70b5;
  box-shadow:inset 0 0 0 2px rgba(142,112,181,.12);
}
.cell.blank.correct{background:#dcf5e5;border-color:#16834f}
.cell.blank.wrong{background:#ffe8e4;border-color:#c94740}

.controls{
  position:relative;z-index:4;
  display:flex;justify-content:center;
  margin-top:20px;
}
.submit-btn{
  min-width:155px;height:50px;padding:0 28px;
  border:0;border-radius:18px;
  background:#2f4f4f;color:#fff;
  font:500 20px "Livvic",sans-serif;
  cursor:pointer;
  box-shadow:0 8px 0 rgba(22,59,59,.18),0 13px 25px rgba(47,79,79,.20);
}
.submit-btn:hover{transform:translateY(-2px)}
.submit-btn:active{transform:translateY(3px)}
.submit-btn:disabled{opacity:.55;cursor:default;transform:none}

.hint{
  margin-top:11px;text-align:center;color:#6c7e7e;font-size:16px;
}

/* exact same nav family */
.nav-btn{
  position:fixed;z-index:30;bottom:22px;
  min-width:126px;height:46px;padding:0 19px;
  border-radius:15px;
  font:500 20px "Livvic",sans-serif;color:#2f4f4f;
  border:2px solid rgba(47,79,79,.12);
  cursor:pointer;
  box-shadow:0 8px 18px rgba(47,79,79,.12);
}
.nav-btn:disabled{opacity:.45;cursor:default}
#prevBtn{left:clamp(20px,4vw,70px);background:#a9cbe2;border-color:#79a9c7}
#nextBtn{right:clamp(20px,4vw,70px);background:#efbca6;border-color:#d99074}

/* exact same popup family */
.feedback{
  position:fixed;left:50%;top:50%;z-index:100;
  width:min(440px,88vw);min-height:215px;padding:26px 30px 28px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;
  border-radius:30px;opacity:0;pointer-events:none;
  transform:translate(-50%,-50%) scale(.7);
  transition:.28s cubic-bezier(.2,.9,.25,1.25);
  box-shadow:0 20px 50px rgba(32,57,57,.22);
}
.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.correct-popup{background:linear-gradient(135deg,#e2f6e9,#f4fcf6);border:5px solid #16834f}
.wrong-popup{background:linear-gradient(135deg,#fde6e2,#fff7f5);border:5px solid #c94740}
.feedback-icon{
  width:68px;height:68px;display:grid;place-items:center;
  border-radius:24px 24px 24px 8px;font-size:34px;color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.08)
}
.correct-popup .feedback-icon{background:#16834f}
.wrong-popup .feedback-icon{background:#c94740}
.feedback h3{margin:0;font-size:28px;font-weight:600;color:#2f4f4f}
.feedback p{margin:0;font-size:17px;color:#607878}

/* exact same final popup family */
.final-popup{
  position:fixed;left:50%;top:50%;z-index:200;
  width:min(520px,91vw);padding:38px 36px 32px;text-align:center;
  border-radius:34px;
  background:
    radial-gradient(circle at 20% 20%,#fff6a6 0 7px,transparent 8px),
    radial-gradient(circle at 80% 25%,#fff 0 6px,transparent 7px),
    linear-gradient(145deg,#eadcff,#cbb5f4 58%,#b89ae8);
  border:5px solid #7350a8;
  box-shadow:0 10px 0 rgba(83,55,126,.18),0 28px 70px rgba(55,38,80,.30);
  opacity:0;pointer-events:none;
  transform:translate(-50%,-50%) scale(.72);transition:.34s;
}
.final-popup.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.final-emoji{font-size:78px;margin-bottom:8px}
.final-popup h2{font-size:36px;font-weight:600;color:#4c3272;margin:0 0 8px}
.final-popup p{font-size:18px;color:#5f4a7a;margin:0 0 24px}
.play-again-btn{
  min-width:185px;height:52px;padding:0 28px;border:0;border-radius:17px;
  background:#68449a;color:#fff;font:500 20px "Livvic",sans-serif;cursor:pointer;
  box-shadow:0 7px 0 rgba(70,44,106,.20),0 13px 24px rgba(89,59,131,.24)
}

/* MONITOR — 40px question, 30px heading/nav */
@media(min-width:1400px){
  /* Monitor layout: center the actual game content in the usable screen area.
     The old version stretched .console to the full arena height, which created
     a large empty area underneath the worksheet on wide monitors. */
  .topbar{height:96px}
  .home{width:64px;height:64px;font-size:30px}
  .hud{padding:12px 28px;border-width:4px}
  .hud-icon{width:50px;height:50px;font-size:26px}
  .hud h1{font-size:30px}

  .arena{
    width:min(1450px,88vw);
    height:calc(100vh - 96px - 108px);
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .console{
    width:100%;
    height:auto;
    min-height:0;
    padding:26px clamp(34px,3.5vw,58px) 24px;
    border-width:5px;
  }

  /* There is no text inside this row in this version, so don't reserve
     empty vertical space above the worksheet. */
  .question-line{display:none}

  .runway{width:min(1240px,100%)}
  .runway-label{font-size:19px;margin-bottom:10px}
  .grid-shell{padding:15px;border-width:3px;border-radius:22px}
  .operation.seven{grid-template-columns:54px repeat(7,minmax(0,1fr))}
  .operation.six{grid-template-columns:54px repeat(6,minmax(0,1fr))}
  .cell{height:70px;font-size:38px;border-width:2px}
  .cell.head{height:48px;font-size:22px}
  .cell.sign{font-size:38px}
  .cell.blank{border-width:3px}
  .cell.blank input{font-size:38px}

  .controls{margin-top:18px}
  .submit-btn{min-width:180px;height:58px;font-size:23px;border-radius:20px}
  .hint{font-size:18px;margin-top:8px}

  .nav-btn{
    min-width:155px;height:56px;padding:0 24px;
    border-radius:18px;border-width:3px;font-size:30px;
    bottom:clamp(22px,2vw,34px)
  }

  .feedback{
    width:min(560px,42vw);min-height:270px;
    padding:32px 40px 36px;border-radius:36px;border-width:6px
  }
  .feedback-icon{width:82px;height:82px;font-size:40px}
  .feedback h3{font-size:34px}.feedback p{font-size:20px}

  .final-popup{
    width:min(650px,48vw);padding:46px 48px 40px;border-radius:40px;border-width:6px
  }
  .final-emoji{font-size:92px}.final-popup h2{font-size:44px}.final-popup p{font-size:21px}
  .play-again-btn{min-width:215px;height:60px;border-radius:20px;font-size:23px}
}

/* laptop */
@media(max-width:1100px) and (min-width:701px){
  .topbar{height:72px}
  .hud h1{font-size:22px}
  .arena{width:95vw;height:calc(100vh - 135px)}
  .console{padding:22px 25px 20px;min-height:0}
  .question-line{margin-bottom:18px}
  .question-line h2{font-size:30px}
  .operation.seven{grid-template-columns:34px repeat(7,minmax(0,1fr))}
  .operation.six{grid-template-columns:34px repeat(6,minmax(0,1fr))}
  .cell{height:50px;font-size:23px}
  .cell.head{height:35px;font-size:15px}
  .cell.blank input{font-size:23px}
}

/* mobile: no overlap, natural vertical layout */
@media(max-width:700px){
  body{overflow:auto}
  #game{height:auto;min-height:100vh;overflow:hidden;padding-bottom:70px}
  .topbar{height:62px;padding:8px 13px}
  .home{width:44px;height:44px;font-size:22px}
  .hud{padding:6px 12px;gap:7px;border-width:2px;border-radius:13px 20px 13px 20px}
  .hud-icon{width:32px;height:32px;font-size:17px}
  .hud h1{font-size:18px}
  .arena{width:96vw;height:auto;min-height:0;margin:0 auto}
  .mission-strip{font-size:14px;padding:6px 13px;margin-bottom:10px;border-width:2px}
  .console{
    height:auto;min-height:0;padding:22px 9px 20px;
    border-width:3px;clip-path:none;border-radius:20px;
  }
  .console:before,.console:after{width:50px;height:50px;border-width:2px}
  .question-line{gap:9px;margin-bottom:14px}
  .q-orb{width:38px;height:38px;flex-basis:38px;font-size:19px;border-width:2px}
  .question-line h2{font-size:22px}
  .runway-label{font-size:12px;margin-bottom:6px}
  .grid-shell{padding:6px;border-radius:12px}
  .operation.seven{grid-template-columns:22px repeat(7,minmax(0,1fr))}
  .operation.six{grid-template-columns:22px repeat(6,minmax(0,1fr))}
  .cell{height:42px;font-size:16px}
  .cell.head{height:29px;font-size:10px}
  .cell.sign{font-size:19px}
  .cell.blank{border-width:2px}
  .cell.blank input{font-size:18px}
  .controls{margin-top:14px}
  .submit-btn{min-width:125px;height:43px;padding:0 15px;font-size:17px;border-radius:15px}
  .hint{font-size:12px;margin-top:8px}
  .nav-btn{min-width:82px;height:40px;padding:0 8px;font-size:15px;border-radius:12px;bottom:12px}
  #prevBtn{left:13px}#nextBtn{right:13px}
  .feedback{width:min(440px,88vw);min-height:190px;padding:22px 20px;border-radius:24px}
  .feedback-icon{width:58px;height:58px;font-size:29px}
  .feedback h3{font-size:24px}.feedback p{font-size:15px}
  .final-popup{width:91vw;padding:30px 22px 25px;border-radius:28px}
  .final-emoji{font-size:65px}.final-popup h2{font-size:30px}.final-popup p{font-size:16px}
}
@media(max-width:430px){
  .hud h1{font-size:16px}
  .operation.seven{min-width:335px}
  .operation.six{min-width:295px}
  .grid-shell{overflow-x:auto}
}
</style>
</head>

<body>
<div id="game">
  <div class="track a"></div>
  <div class="track b"></div>
  <div class="spark a">✦</div>
  <div class="spark b">✦</div>

  <header class="topbar">
   
    <div class="hud">
      <div class="hud-icon">🎯</div>
      <h1>Find the missing digits or number</h1>
    </div>
  </header>

  <main class="arena">
        <section class="console">
      <div class="question-line">
      
      </div>

      <div class="runway">
        <div class="grid-shell">
          <div id="operation" class="operation seven"></div>
        </div>
      </div>

      <div class="controls">
        <button id="submitBtn" class="submit-btn" type="button">Submit</button>
      </div>
      <div class="hint">Enter one digit in each glowing box.</div>
    </section>
  </main>

  <button class="nav-btn" id="prevBtn" type="button">← Back</button>
  <button class="nav-btn" id="nextBtn" type="button">Next →</button>

  <div id="correctPopup" class="feedback correct-popup">
    <div class="feedback-icon">🎉</div>
    <h3>Perfect!</h3>
    <p>Correct answer!</p>
  </div>

  <div id="wrongPopup" class="feedback wrong-popup">
    <div class="feedback-icon">😕</div>
    <h3>Try Again!</h3>
    <p>Check the missing digits and try again.</p>
  </div>

  <div id="finalPopup" class="final-popup">
    <div class="final-emoji">🏆</div>
    <h2>Math Champion!</h2>
    <p>You completed every missing-digit mission!</p>
    <button id="playAgainBtn" class="play-again-btn">↻ Play Again</button>
  </div>
</div>

<script>
/*
  Answer sheet:
    1) 8059457 − 987632  = 7071825
    2) 2800500 − 1976349 = 824151
    3) 9000000 − 5749362 = 3250638
    4) 426735  + 572346  = 999081
  Blank cells are filled from the answers[] list in reading order
  (row 1 left→right, then row 2, then row 3).
*/
const questions=[
  {
    number:1,
    cols:["T L","L","T Th","Th","H","T","O"],
    rows:[
      ["","8","0","","9","4","","7"],
      ["−","","9","8","","6","3","2"],
      ["","7","","7","1","","2",""]
    ],
    answers:["5","5","0","7","0","8","5"]
  },
  {
    number:2,
    cols:["T L","L","T Th","Th","H","T","O"],
    rows:[
      ["","2","8","","0","5","","0"],
      ["−","","9","7","","3","4","9"],
      ["","0","","2","4","","5",""]
    ],
    answers:["0","0","1","6","8","1","1"]
  },
  {
    number:3,
    cols:["T L","L","T Th","Th","H","T","O"],
    rows:[
      ["","","0","0","0","","0","0"],
      ["−","5","7","","9","3","","2"],
      ["","3","","5","","6","3",""]
    ],
    answers:["9","0","4","6","2","0","8"]
  },
  {
    number:4,
    cols:["L","T Th","Th","H","T","O"],
    rows:[
      ["","4","","6","7","","5"],
      ["+","","7","2","","4","6"],
      ["","9","9","","0","8",""]
    ],
    answers:["2","3","5","3","9","1"]
  }
];

let current=0;
let solved=questions.map(()=>false);
let finalShown=false;

const operation=document.getElementById("operation");
const submitBtn=document.getElementById("submitBtn");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const correctPopup=document.getElementById("correctPopup");
const wrongPopup=document.getElementById("wrongPopup");
const finalPopup=document.getElementById("finalPopup");
const playAgainBtn=document.getElementById("playAgainBtn");

function speak(text){
  if(!("speechSynthesis" in window) ||
     !("SpeechSynthesisUtterance" in window)){
    return;
  }

  try{
    const synth = window.speechSynthesis;

    synth.cancel();
    synth.resume();

    const msg = new SpeechSynthesisUtterance(text);
    msg.volume = 1;
    msg.rate = 1;
    msg.pitch = 1;

    const voices = synth.getVoices();
    const voice =
      voices.find(v => v.lang === "en-US") ||
      voices.find(v => /^en[-_]/i.test(v.lang)) ||
      voices.find(v => /English/i.test(v.name));

    if(voice){
      msg.voice = voice;
      msg.lang = voice.lang;
    }else{
      msg.lang = "en-US";
    }

    // Speak immediately so Chrome still treats this as part of
    // the user's Submit-button interaction.
    synth.speak(msg);
  }catch(error){
    console.warn("Voice error:", error);
  }
}

if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}

function sound(type){
  /* Same lightweight browser-generated feedback style; no external files required. */
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    const ctx=new C();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    const now=ctx.currentTime;
    if(type==="correct"){
      o.frequency.setValueAtTime(660,now);
      o.frequency.setValueAtTime(880,now+.09);
    }else{
      o.frequency.setValueAtTime(260,now);
      o.frequency.setValueAtTime(190,now+.12);
    }
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(.12,now+.015);
    g.gain.exponentialRampToValueAtTime(.0001,now+.22);
    o.start(now);o.stop(now+.23);
  }catch(e){}
}

function showPopup(el,time=1200){
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),time);
}

function render(){
  const q=questions[current];
  operation.className="operation "+(q.cols.length===6?"six":"seven");

  let html="<div class='cell head sign'></div>";
  q.cols.forEach(c=>html+="<div class='cell head'>"+c+"</div>");

  q.rows.forEach(row=>{
    html+="<div class='cell sign'>"+(row[0]||"")+"</div>";
    for(let i=1;i<row.length;i++){
      const value=row[i];
      if(value===""){
        html+="<div class='cell blank'><input maxlength='1' inputmode='numeric' autocomplete='off' aria-label='Missing digit'></div>";
      }else{
        html+="<div class='cell'>"+value+"</div>";
      }
    }
  });

  operation.innerHTML=html;

  const inputs=[...operation.querySelectorAll("input")];
  inputs.forEach((input,index)=>{
    input.addEventListener("input",()=>{
      input.value=input.value.replace(/\D/g,"").slice(0,1);
      input.classList.remove("wrong","correct");
      if(input.value && inputs[index+1])inputs[index+1].focus();
    });
    input.addEventListener("keydown",e=>{
      if(e.key==="Backspace"&&!input.value&&inputs[index-1])inputs[index-1].focus();
      if(e.key==="Enter"){e.preventDefault();submitAnswer()}
    });
  });

  submitBtn.disabled=solved[current];
  prevBtn.disabled=current===0;
  nextBtn.disabled=current===questions.length-1&&!solved[current];

  if(solved[current]){
    inputs.forEach((input,i)=>{
      input.value=questions[current].answers[i]||"";
      input.readOnly=true;
      input.classList.add("correct");
    });
  }
}

function submitAnswer(){
  if(finalShown||solved[current])return;
  const q=questions[current];
  const inputs=[...operation.querySelectorAll("input")];
  const values=inputs.map(i=>i.value.trim());

  if(values.some(v=>v==="")){
    inputs.find(i=>!i.value)?.focus();
    return;
  }

  const correct=values.length===q.answers.length &&
    values.every((v,i)=>v===q.answers[i]);

  if(correct){
    inputs.forEach(i=>{i.readOnly=true;i.classList.add("correct")});
    solved[current]=true;
    submitBtn.disabled=true;
    nextBtn.disabled=false;
    sound("correct");
    speak("Correct!");
    showPopup(correctPopup);

    if(solved.every(Boolean)){
      setTimeout(showFinal,850);
    }
  }else{
    inputs.forEach(i=>i.classList.add("wrong"));
    sound("wrong");
    speak("Try again!");
    showPopup(wrongPopup);
    setTimeout(()=>{
      inputs.forEach(i=>{
        i.value="";
        i.classList.remove("wrong");
      });
      inputs[0]?.focus();
    },650);
  }
}

function go(delta){
  if(finalShown)return;
  const target=current+delta;
  if(target<0||target>=questions.length)return;
  current=target;
  render();
}

function showFinal(){
  finalShown=true;
  finalPopup.classList.add("show");
  prevBtn.disabled=true;
  nextBtn.disabled=true;
  
}

prevBtn.addEventListener("click",()=>go(-1));
nextBtn.addEventListener("click",()=>go(1));
submitBtn.addEventListener("click",submitAnswer);


playAgainBtn.addEventListener("click",()=>{
  current=0;
  solved=questions.map(()=>false);
  finalShown=false;
  finalPopup.classList.remove("show");
  render();
});

render();
</script>
<script>
/* ===== CONFETTI CELEBRATION (right & final popups) ===== */
(function () {
  let canvas, ctx, pieces = [], raf = null;
  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
    document.body.appendChild(canvas);
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
  function burst(count) {
    ensureCanvas();
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - .5) * 180,
        y: innerHeight / 2 + (Math.random() - .5) * 90,
        vx: (Math.random() - .5) * 11,
        vy: Math.random() * -13 - 4,
        g: 0.30 + Math.random() * 0.14,
        s: 6 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * 0.4,
        color: colors[i % colors.length],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
    pieces.forEach(p => {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (pieces.length) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.fireConfetti = function (big) {
    if (big) {
      burst(170);
      let n = 0;
      const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
    } else {
      burst(90);
    }
  };
  function watch(id, big) {
    const el = document.getElementById(id);
    if (!el) return;
    let was = el.classList.contains("show");
    new MutationObserver(() => {
      const now = el.classList.contains("show");
      if (now && !was) window.fireConfetti(big);
      was = now;
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  function init() { watch("correctPopup", false); watch("finalPopup", true); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
