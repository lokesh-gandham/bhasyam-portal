<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade1_Lesson4</title>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: 'Livvic', sans-serif
    }

    body {
      background: #fbf8eb;
      color: #29434a;
      overflow-x: hidden
    }

    body.quiz-open {
      overflow: hidden
    }

    button {
      font-family: inherit
    }

    .app {
      min-height: 100vh;
      padding: 24px 0 34px;
      position: relative;
      background:
        radial-gradient(circle at 7% 10%, rgba(255, 198, 91, .18) 0 105px, transparent 106px),
        radial-gradient(circle at 95% 14%, rgba(96, 190, 255, .15) 0 120px, transparent 121px),
        radial-gradient(circle at 85% 90%, rgba(107, 214, 134, .14) 0 130px, transparent 131px), #fbf8eb
    }

    .home {
      width: min(1480px, 95vw);
      margin: auto;
      position: relative;
      z-index: 1
    }

    .hero {
      text-align: center;
      margin-bottom: 24px
    }

    .eyebrow {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      padding: 8px 18px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #eee2ca;
      color: #68747d;
      font-weight: 900;
      font-size: 13px;
      box-shadow: 0 8px 20px rgba(86, 72, 42, .07)
    }

    .eyebrow i {
      color: #f0a415
    }

    .hero h1 {
    
      line-height: 1.05;
      margin-top: 10px;
      font-weight: 900;
      letter-spacing: -1px
    }

    .hero h1 span {
      color: #ed7194
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 20px
    }

    .game-card {
      --accent: #e96d91;
      --soft: #fff0f4;
      position: relative;
      border: 0;
      border-radius: 28px;
      background: #fff;
      padding: 15px;
      min-height: 292px;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 14px 32px rgba(75, 67, 50, .10), inset 0 0 0 1px rgba(232, 225, 210, .8);
      transition: .25s ease
    }

    .game-card:before {
      content: "";
      position: absolute;
      width: 155px;
      height: 155px;
      border-radius: 50%;
      right: -54px;
      top: -60px;
      background: var(--soft)
    }

    .game-card:after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      left: -25px;
      bottom: -27px;
      background: var(--soft);
      opacity: .7
    }

    .game-card:hover {
      transform: translateY(-8px) rotate(-.25deg);
      box-shadow: 0 25px 42px rgba(75, 67, 50, .16)
    }

    .game-card:active {
      transform: translateY(-2px)
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2
    }

    .card-number {
      width: 40px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 900
    }

    .card-icon {
      width: 49px;
      height: 49px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #fff;
      font-size: 20px;
      box-shadow: 0 9px 18px rgba(0, 0, 0, .11)
    }

    .art {
      height: 126px;
      margin: 10px 0;
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--soft), #fff);
      border: 1px solid rgba(255, 255, 255, .9)
    }

    .art:before {
      content: "";
      position: absolute;
      width: 135px;
      height: 135px;
      border-radius: 50%;
      left: -60px;
      bottom: -85px;
      background: #fff;
      opacity: .7
    }

    .visual {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1
    }

    .card-title {
        font-size: clamp(21px, 3.2vw, 25px);
      line-height: 1.08;
      font-weight: 500;
      color: #344e55;
      position: relative;
      z-index: 2
    }

    .card-sub {
      font-size: 13px;
      color: #7c8a90;
      margin-top: 5px;
      font-weight: 600;
      position: relative;
      z-index: 2
    }

    .play-row {
      margin-top: auto;
      padding-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .7px;
      position: relative;
      z-index: 2
    }

    .play-circle {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #fff
    }

    .game-card:hover .play-circle {
      transform: translateX(5px) scale(1.07)
    }

    .theme-pink {
      --accent: #e96d91;
      --soft: #fff0f4
    }

    .theme-blue {
      --accent: #4387c9;
      --soft: #edf6ff
    }

    .theme-green {
      --accent: #35ad6b;
      --soft: #e9f8ef
    }

    .theme-teal {
      --accent: #259c99;
      --soft: #e8faf8
    }

    .theme-purple {
      --accent: #7a5bc1;
      --soft: #f1edff
    }

    .theme-orange {
      --accent: #ed9913;
      --soft: #fff5df
    }

    .theme-indigo {
      --accent: #5068bd;
      --soft: #edf0ff
    }

    .theme-sky {
      --accent: #3885b1;
      --soft: #eaf7fc
    }

    .theme-rose {
      --accent: #cf6681;
      --soft: #fff0f4
    }

    /* playful activity illustrations */
    .math-scene {
      gap: 16px;
      font-weight: 900;
      font-size: 42px;
      color: var(--accent)
    }

    .math-bubble {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 7px 15px rgba(0, 0, 0, .08)
    }

    .box-scene {
      gap: 13px
    }

    .answer-box {
      width: 52px;
      height: 52px;
      border: 3px dashed var(--accent);
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: 900;
      color: var(--accent);
      background: #fff
    }

    .number-chip {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #fff;
      font-weight: 900
    }

    .balloon-scene {
      align-items: flex-end;
      gap: 12px;
      padding-bottom: 18px
    }

    .balloon {
      width: 39px;
      height: 49px;
      border-radius: 50% 50% 48% 48%;
      background: var(--accent);
      position: relative;
      box-shadow: inset -7px -7px 0 rgba(0, 0, 0, .08)
    }

    .balloon:after {
      content: "";
      position: absolute;
      left: 19px;
      top: 47px;
      width: 1px;
      height: 30px;
      background: #7d8790
    }

    .balloon:nth-child(2) {
      transform: translateY(-18px) scale(.85);
      opacity: .8
    }

    .balloon:nth-child(3) {
      transform: translateY(-5px) scale(1.08)
    }

    .line-scene {
      flex-direction: column;
      gap: 10px
    }

    .number-line {
      width: 78%;
      height: 4px;
      border-radius: 9px;
      background: var(--accent);
      position: relative
    }

    .number-line:before {
      content: "0   1   2   3   4   5";
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      font-size: 12px;
      letter-spacing: 12px;
      font-weight: 900;
      color: var(--accent);
      white-space: nowrap
    }

    .marker {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid var(--accent);
      position: absolute;
      top: -7px;
      left: 56%
    }

    .abacus-scene {
      gap: 10px
    }

    .abacus {
      width: 165px;
      height: 88px;
      border: 7px solid var(--accent);
      border-radius: 15px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      background: #fff
    }

    .rod {
      height: 4px;
      background: #9baab0;
      position: relative
    }

    .bead {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      top: -9px
    }

    .rod .bead:nth-child(1) {
      left: 20px
    }

    .rod .bead:nth-child(2) {
      left: 57px
    }

    .rod .bead:nth-child(3) {
      left: 100px
    }

    .draw-beads {
      gap: 8px
    }

    .string {
      width: 170px;
      height: 5px;
      border-radius: 10px;
      background: #9aaab0;
      position: relative
    }

    .draw-beads .bead {
      top: -11px
    }

    .draw-beads .bead:nth-child(1) {
      left: 30px
    }

    .draw-beads .bead:nth-child(2) {
      left: 70px
    }

    .draw-beads .bead:nth-child(3) {
      left: 115px
    }

    .pencil {
      font-size: 38px;
      transform: rotate(-25deg)
    }

    .blank-scene {
      flex-direction: column;
      gap: 13px
    }

    .blank-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 25px;
      font-weight: 900;
      color: var(--accent)
    }

    .blank {
      width: 42px;
      height: 30px;
      border-bottom: 4px dashed var(--accent)
    }

    .lines-scene {
      gap: 12px;
      align-items: flex-end
    }

    .vine {
      width: 9px;
      border-radius: 20px;
      background: var(--accent);
      position: relative
    }

    .vine:after {
      content: "🍃";
      position: absolute;
      font-size: 18px;
      top: -12px;
      left: -5px
    }

    .vine:nth-child(1) {
      height: 42px
    }

    .vine:nth-child(2) {
      height: 74px
    }

    .vine:nth-child(3) {
      height: 57px
    }

    .count-badge {
      position: absolute;
      right: 24px;
      top: 20px;
      background: #fff;
      color: var(--accent);
      padding: 7px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 900
    }

    .required-scene {
      gap: 12px
    }

    .missing-num {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 3px dashed var(--accent);
      font-size: 30px;
      font-weight: 900;
      color: var(--accent);
      background: #fff
    }

    .eq {
      font-size: 30px;
      font-weight: 900;
      color: #7c8a90
    }

    .game-view {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      width: 100%;
      height: 100vh;
      background: #fbf8eb;
      overflow: hidden
    }

    .game-view.show {
      display: block
    }

    .game-topbar {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10001
    }

    .back-btn {
      width: 50px;
      height: 50px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eef4f5;
      color: #355158;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(60, 55, 40, .12)
    }

    .current-title {
      display: none
    }

    #contentFrame {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
      background: #fbf8eb
    }

    @media(max-width:980px) {
      .cards {
        grid-template-columns: repeat(2, minmax(240px, 1fr))
      }
    }

    @media(max-width:620px) {
      .home {
        width: 94vw
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 14px
      }

      .hero h1 {
        font-size: 31px
      }

      .game-card {
        min-height: 275px
      }

      .back-btn {
        width: 46px;
        height: 46px
      }
    }


    /* ===== SIX CARD ARCADE DESIGN ===== */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .game-card {
      --accent: #e96d91;
      --soft: #fff0f4;
      position: relative;
      min-width: 0;
      height: clamp(245px, 31vh, 315px);
      padding: 0;
      border: 0;
      border-radius: 24px;
      background: #fff;
      overflow: hidden;
      isolation: isolate;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(54, 65, 69, .11);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .game-card::before {
      content: "";
      position: absolute;
      inset: 0;
      height: 7px;
      background: var(--accent);
      z-index: 4;
    }

    .game-card::after {
      content: "";
      position: absolute;
      width: 115px;
      height: 115px;
      right: -42px;
      bottom: -46px;
      border-radius: 50%;
      background: var(--soft);
      z-index: -1;
    }

    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 21px 38px rgba(54, 65, 69, .17);
    }

    .game-card:active {
      transform: translateY(-1px)
    }

    .card-top {
      height: 54px;
      padding: 14px 15px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .card-number {
      width: auto;
      height: auto;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .7px;
    }

    .card-icon {
      width: 43px;
      height: 43px;
      margin-top: -2px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--accent);
      color: #fff;
      font-size: 18px;
      box-shadow: 0 7px 15px rgba(54, 65, 69, .12);
    }

    .art {
      height: clamp(88px, 12vh, 120px);
      margin: 4px 14px 0;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      background: var(--soft);
      border: 1px solid rgba(255, 255, 255, .9);
    }

    .art::before {
      content: "";
      position: absolute;
      width: 80px;
      height: 80px;
      left: -27px;
      bottom: -42px;
      border-radius: 50%;
      background: #fff;
      opacity: .65;
    }

    .visual {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .card-title {
      margin: 11px 16px 0;
        font-size: clamp(21px, 3.2vw, 25px);
      line-height: 1.08;
      font-weight: 500;
      letter-spacing: -.25px;
      color: #344e55;
      text-align: center;
      position: relative;

      z-index: 2;
    }

    .card-sub {
      margin: 4px 16px 0;
      min-height: 16px;
        font-size: clamp(16px, 3.2vw, 18px);
      line-height: 1.25;
      color: #263237;
      font-weight: 500;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .play-row {
      margin: 7px 16px 0;
      padding: 7px 0 0;
      border-top: 1px solid rgba(90, 100, 105, .10);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--accent);
        font-size: clamp(15px, 2.2vw, 18px);
      font-weight: 500;
      letter-spacing: .6px;
      position: relative;
      z-index: 2;
    }

    .play-circle {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #fff;
      box-shadow: none;
      transition: .2s ease;
    }

    .game-card:hover .play-circle {
      transform: translateX(4px);
    }

    /* Six unique color identities */
    .game-card:nth-child(1) {
      --accent: #e45f86;
      --soft: #fff0f5
    }

    .game-card:nth-child(2) {
      --accent: #3984cf;
      --soft: #eaf5ff
    }

    .game-card:nth-child(3) {
      --accent: #35a96b;
      --soft: #e9f8ef
    }

    .game-card:nth-child(4) {
      --accent: #8a5bc4;
      --soft: #f2edff
    }

    .game-card:nth-child(5) {
      --accent: #e59620;
      --soft: #fff4df
    }

    .game-card:nth-child(6) {
      --accent: #169d9b;
      --soft: #e7faf9
    }

    /* Card 1: Fill in the blanks */
    .blank-scene {
      flex-direction: column;
      gap: 8px
    }

    .blank-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .blank {
      width: 42px;
      height: 26px;
      border: 3px dashed var(--accent);
      border-radius: 9px;
      background: #fff;
    }

    .blank-star {
      position: absolute;
      font-size: 15px;
      color: var(--accent);
    }

    .blank-star.s1 {
      left: 18%;
      top: 17%
    }

    .blank-star.s2 {
      right: 18%;
      bottom: 18%
    }

    /* Card 2: Matching */
    .match-scene {
      gap: 10px
    }

    .match-column {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .match-dot {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #fff;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    .match-lines {
      width: 42px;
      height: 64px;
      position: relative;
    }

    .match-lines::before,
    .match-lines::after {
      content: "";
      position: absolute;
      left: 2px;
      width: 38px;
      height: 3px;
      border-radius: 8px;
      background: var(--accent);
    }

    .match-lines::before {
      top: 16px;
      transform: rotate(18deg)
    }

    .match-lines::after {
      bottom: 16px;
      transform: rotate(-18deg)
    }

    /* Card 3: Find value */
    .value-scene {
      gap: 8px;
      flex-direction: column
    }

    .equation {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .value-chip {
      min-width: 38px;
      height: 38px;
      padding: 0 8px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 5px 12px rgba(0, 0, 0, .07);
    }

    .value-question {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--accent);
    }

    .mini-label {
      padding: 4px 9px;
      border-radius: 999px;
      background: #fff;
      color: var(--accent);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .6px;
    }

    /* Card 4: Matching Two */
    .pair-scene {
      gap: 12px
    }

    .pair-card {
      width: 54px;
      height: 68px;
      border-radius: 14px;
      background: #fff;
      border: 2px solid var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--accent);
      box-shadow: 0 5px 12px rgba(0, 0, 0, .05);
    }

    .pair-card i {
      font-size: 17px
    }

    .pair-card span {
      font-size: 10px;
      font-weight: 700
    }

    .pair-arrow {
      color: var(--accent);
      font-size: 17px;
    }

    /* Card 5: Missing number */
    .missing-scene {
      gap: 8px;
      flex-direction: column
    }

    .missing-equation {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      font-size: 24px;
      font-weight: 700;
    }

    .missing-box {
      width: 43px;
      height: 43px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      border: 3px dashed var(--accent);
      background: #fff;
    }

    .number-pills {
      display: flex;
      gap: 5px
    }

    .number-pills span {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
    }

    /* Card 6: Draw beads */
    .bead-scene {
      gap: 10px;
      flex-direction: column
    }

    .bead-title {
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .bead-string {
      width: 145px;
      height: 5px;
      border-radius: 10px;
      background: #9aaab0;
      position: relative;
    }

    .bead-item {
      position: absolute;
      top: -9px;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: inset -4px -4px 0 rgba(0, 0, 0, .08);
    }

    .bead-item:nth-child(1) {
      left: 18px
    }

    .bead-item:nth-child(2) {
      left: 61px
    }

    .bead-item:nth-child(3) {
      left: 104px
    }

    .bead-pencil {
      position: absolute;
      right: 19px;
      top: 17px;
      font-size: 22px;
      transform: rotate(-25deg);
    }

    /* Responsive: always six cards, no page scrolling */
    @media (min-width:1200px) {
      .home {
        width: min(1280px, 94vw)
      }

      .hero {
        margin-bottom: 18px
      }

      .hero h1 {
        font-size: 38px
      }

      .cards {
        gap: 18px
      }
    }

    @media (min-width:621px) and (max-width:1199px) {
      .app {
        padding-top: 18px
      }

      .home {
        width: 94vw
      }

      .hero {
        margin-bottom: 14px
      }

      .hero h1 {
        font-size: 32px
      }

      .cards {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px
      }

      .game-card {
        height: 250px;
        border-radius: 20px
      }

      .card-title {
        font-size: 16px
      }

      .card-sub {
        font-size: 10px
      }

      .art {
        height: 82px
      }

      .card-icon {
        width: 38px;
        height: 38px;
        font-size: 16px
      }
    }

    @media (max-width:620px) {
      body {
        overflow: hidden
      }

      .app {
        height: 100vh;
        min-height: 100vh;
        padding: 10px 0;
      }

      .home {
        width: 94vw;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .hero {
        margin-bottom: 10px
      }

      .eyebrow {
        display: none
      }

      .hero h1 {
        margin-top: 0;
        font-size: 26px;
      }

      .cards {
        flex: 1;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 9px;
        min-height: 0;
      }

      .game-card {
        height: auto;
        min-height: 0;
        border-radius: 16px;
      }

      .card-top {
        height: 38px;
        padding: 9px 9px 0
      }

      .card-number {
        padding: 4px 7px;
        font-size: 8px
      }

      .card-icon {
        width: 31px;
        height: 31px;
        border-radius: 9px;
        font-size: 13px
      }

      .art {
        height: 30%;
        min-height: 58px;
        margin: 3px 8px 0;
        border-radius: 12px
      }

      .card-title {
        margin: 7px 9px 0;
        font-size: 13px
      }

      .card-sub {
        margin: 2px 9px 0;
        font-size: 8px;
        min-height: 10px
      }

      .play-row {
        margin: 4px 9px 0;
        padding-top: 4px;
        font-size: 7px;
      }

      .play-circle {
        width: 24px;
        height: 24px;
        border-radius: 7px
      }

      .blank-row {
        font-size: 14px
      }

      .blank {
        width: 27px;
        height: 18px;
        border-width: 2px
      }

      .equation,
      .missing-equation {
        font-size: 16px
      }

      .value-chip {
        min-width: 27px;
        height: 27px
      }

      .value-question,
      .missing-box {
        width: 29px;
        height: 29px
      }

      .pair-card {
        width: 38px;
        height: 46px;
        border-radius: 9px
      }

      .pair-card i {
        font-size: 12px
      }

      .pair-card span {
        font-size: 7px
      }

      .pair-arrow {
        font-size: 11px
      }

      .bead-string {
        width: 90px
      }

      .bead-item {
        width: 16px;
        height: 16px;
        top: -6px
      }

      .bead-item:nth-child(1) {
        left: 10px
      }

      .bead-item:nth-child(2) {
        left: 37px
      }

      .bead-item:nth-child(3) {
        left: 64px
      }

      .bead-pencil {
        font-size: 15px;
        right: 7px;
        top: 8px
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <main class="home">
      <header class="hero">
        <div class="eyebrow"><i class="fa-solid fa-star"></i> FUN LEARNING ACTIVITIES <i class="fa-solid fa-star"></i>
        </div>
        <h1>Choose an <span>Adventure!</span></h1>
      </header>
      <section class="cards">

        <button class="game-card" onclick="openIsland(0,'Fill in the Blanks')">
          <div class="card-top">
            <div class="card-number">01 · PLAY</div>
            <div class="card-icon"><i class="fa-solid fa-pen-to-square"></i></div>
          </div>
          <div class="art">
            <span class="blank-star s1"><i class="fa-solid fa-sparkles"></i></span>
            <span class="blank-star s2"><i class="fa-solid fa-star"></i></span>
            <div class="visual blank-scene">
              <div class="blank-row">3 + <span class="blank"></span> = 8</div>
              <div class="blank-row"><span class="blank"></span> + 2 = 7</div>
            </div>
          </div>
          <div class="card-title">Fill in the Blanks</div>
          <div class="card-sub">Complete the missing numbers</div>
          <div class="play-row"><span>START PLAYING</span><span class="play-circle"><i
                class="fa-solid fa-arrow-right"></i></span></div>
        </button>

        <button class="game-card" onclick="openIsland(1,'Matching')">
          <div class="card-top">
            <div class="card-number">02 · PLAY</div>
            <div class="card-icon"><i class="fa-solid fa-link"></i></div>
          </div>
          <div class="art">
            <div class="visual match-scene">
              <div class="match-column"><span class="match-dot">2</span><span class="match-dot">5</span></div>
              <div class="match-lines"></div>
              <div class="match-column"><span class="match-dot">5</span><span class="match-dot">2</span></div>
            </div>
          </div>
          <div class="card-title">Matching</div>
          <div class="card-sub">Connect each matching number</div>
          <div class="play-row"><span>START PLAYING</span><span class="play-circle"><i
                class="fa-solid fa-arrow-right"></i></span></div>
        </button>

        <button class="game-card" onclick="openIsland(2,'Find Value')">
          <div class="card-top">
            <div class="card-number">03 · PLAY</div>
            <div class="card-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></div>
          </div>
          <div class="art">
            <div class="visual value-scene">
              <div class="equation"><span class="value-chip">8</span><b>−</b><span
                  class="value-chip">3</span><b>=</b><span class="value-question">?</span></div>
              <span class="mini-label">FIND THE VALUE</span>
            </div>
          </div>
          <div class="card-title">Find Value</div>
          <div class="card-sub">Work out the correct answer</div>
          <div class="play-row"><span>START PLAYING</span><span class="play-circle"><i
                class="fa-solid fa-arrow-right"></i></span></div>
        </button>

        <button class="game-card" onclick="openIsland(3,'Matching Two')">
          <div class="card-top">
            <div class="card-number">04 · PLAY</div>
            <div class="card-icon"><i class="fa-solid fa-shuffle"></i></div>
          </div>
          <div class="art">
            <div class="visual pair-scene">
              <div class="pair-card"><i class="fa-solid fa-2"></i><span>PAIR</span></div>
              <span class="pair-arrow"><i class="fa-solid fa-arrow-right-arrow-left"></i></span>
              <div class="pair-card"><i class="fa-solid fa-5"></i><span>PAIR</span></div>
            </div>
          </div>
          <div class="card-title">Matching Two</div>
          <div class="card-sub">Find the correct number pair</div>
          <div class="play-row"><span>START PLAYING</span><span class="play-circle"><i
                class="fa-solid fa-arrow-right"></i></span></div>
        </button>

        <button class="game-card" onclick="openIsland(4,'Missing Number')">
          <div class="card-top">
            <div class="card-number">05 · PLAY</div>
            <div class="card-icon"><i class="fa-solid fa-circle-question"></i></div>
          </div>
          <div class="art">
            <div class="visual missing-scene">
              <div class="missing-equation"><span>5 +</span><span class="missing-box">?</span><span>= 9</span></div>
              <div class="number-pills"><span>2</span><span>3</span><span>4</span><span>5</span></div>
            </div>
          </div>
          <div class="card-title">Missing Number</div>
          <div class="card-sub">Discover the number that is missing</div>
          <div class="play-row"><span>START PLAYING</span><span class="play-circle"><i
                class="fa-solid fa-arrow-right"></i></span></div>
        </button>

      </section>
    </main>
  </div>
  <div class="game-view" id="gameView">
    <div class="game-topbar"><button class="back-btn" onclick="goHome()" aria-label="Go to Home" title="Home"><i
          class="fa-solid fa-house"></i></button>
      <div class="current-title" id="currentTitle">Activity</div>
    </div><iframe id="contentFrame" src="" title="Learning Activity"></iframe>
  </div>
  <script>
    const frame = document.getElementById('contentFrame'); const gameView = document.getElementById('gameView'); const currentTitle = document.getElementById('currentTitle');
    const pages = ['./exercise/fillintheblanks.html', './exercise/matching.html', './exercise/findvalue.html', './exercise/matching_two.html', './exercise/missing_number.html'];
    function openIsland(index, title) {
      currentTitle.textContent = title;
      frame.src = pages[index];
      gameView.classList.add('show');
      document.body.classList.add('quiz-open');
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
    function goHome() {
      gameView.classList.remove('show');
      document.body.classList.remove('quiz-open');
      frame.src = '';
    }
    window.addEventListener('keydown', e => { if (e.key === 'Escape' && gameView.classList.contains('show')) goHome(); });
  </script>
</body>

</html>
