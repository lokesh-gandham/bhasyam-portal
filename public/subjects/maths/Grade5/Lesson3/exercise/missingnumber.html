<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete The Following</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:"Livvic",sans-serif;background:#fbfaf7;color:#294b4f}
#game{min-height:100vh;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:#fbfaf7}

/* Header */
.topbar{height:92px;flex:0 0 92px;display:flex;align-items:center;justify-content:center}
.title{display:flex;align-items:center;gap:14px;padding:8px 24px;min-height:64px;border:3px solid #8f6cc4;border-radius:24px;background:#fffdf9;box-shadow:0 6px 0 rgba(88,67,115,.12)}
.title-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:#eadff8;border:2px solid #b28ddd;font-size:27px}
.title h1{margin:0;color:#294b4f;font-size:22px;font-weight:400}

/* Only the table is the question box — no large outside card */
.main{flex:1;min-height:0;width:min(1050px,92vw);margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0 10px}
.division-table{width:100%;border:3px solid #c98c3d;border-radius:20px;overflow:hidden;background:#fffdf8;box-shadow:0 7px 0 rgba(201,140,61,.13),0 14px 26px rgba(69,54,84,.07);flex:0 0 auto}
.table-row{display:grid;grid-template-columns:76px 1.25fr 1.25fr 1.25fr 1.25fr;width:100%}
.table-head{background:#fff4c5;border-bottom:3px solid #c98c3d}
.table-head>div{min-width:0;height:56px;display:flex;align-items:center;justify-content:center;padding:6px 8px;text-align:center;color:#273f43;font-size:21px;font-weight:500;border-right:2px solid #c98c3d}
.table-head>div:last-child{border-right:0}
.row{min-height:68px;display:grid;grid-template-columns:76px 1.25fr 1.25fr 1.25fr 1.25fr;align-items:stretch;border-bottom:1.5px solid #dca65a}
.row:last-child{border-bottom:0}
.row:nth-child(odd){background:#fffefa}.row:nth-child(even){background:#fffdf5}
.row-number{height:100%;display:grid;place-items:center;border-right:1.5px solid #dca65a;font-size:22px;font-weight:500;color:#294b4f;background:#fff8dd}
.row:nth-child(even) .row-number{background:#f4f0ff}
.cell{min-width:0;display:flex;align-items:center;justify-content:center;padding:6px 8px;border-right:1.5px solid #dca65a;color:#263f43;font-size:30px;line-height:1.15;text-align:center}
.cell:last-child{border-right:0}

/* Clear, playful answer boxes — no star */
.input-box{position:relative;display:block;flex:0 0 auto;width:132px;height:50px;border:3px solid #78aeb5;border-radius:15px;background:#e9f7f7;box-shadow:0 5px 0 #b9d9dc;transition:.15s ease}
.input-box:before{content:"";position:absolute;left:9px;bottom:7px;width:8px;height:8px;border-radius:50%;background:#fff;opacity:.8}
.input-box:after{content:"";position:absolute;right:8px;top:7px;width:7px;height:7px;border-radius:50%;background:#78aeb5;opacity:.8}
.input-box input{width:100%;height:100%;border:0;outline:0;background:transparent;text-align:center;color:#294b4f;font-family:inherit;font-size:28px;font-weight:500;border-radius:12px;padding:0 8px}
.input-box input:focus{background:#f4ffff}
.input-box:has(input:focus){border-color:#7e64b5;box-shadow:0 5px 0 #c9b9e5;transform:translateY(-1px)}
.input-box.correct{border-color:#4e9c7b;background:#e4f6ea;box-shadow:0 5px 0 #9bceb1}
.input-box.correct:after{background:#4e9c7b}
.input-box.wrong{border-color:#cf6c65;background:#fff0ee;box-shadow:0 5px 0 #e0a19c}
.input-box.wrong:after{background:#cf6c65}

.action-area{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:10px;flex:0 0 auto}
.submit{min-width:155px;width:155px;height:50px;padding:0 20px;border:0;border-radius:17px;background:#2f4f4f;color:#fff;font-family:inherit;font-size:20px;font-weight:500;cursor:pointer;box-shadow:0 7px 0 rgba(22,59,59,.18),0 12px 22px rgba(47,79,79,.16)}
.submit:disabled{opacity:.48;cursor:not-allowed}
.hint{font-size:16px;color:#607878;text-align:center}

/* Popups: same family */
.feedback,.final{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);opacity:0;pointer-events:none;width:min(440px,88vw);min-height:215px;padding:26px 30px 28px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:.22s ease}
.feedback.show,.final.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.correct-popup{background:linear-gradient(135deg,#e2f6e9,#f4fcf6);border:5px solid #16834f;box-shadow:0 20px 50px rgba(32,57,57,.22)}
.wrong-popup{background:linear-gradient(135deg,#fde6e2,#fff7f5);border:5px solid #c94740;box-shadow:0 20px 50px rgba(32,57,57,.22)}
.feedback-icon{width:68px;height:68px;border-radius:24px 24px 24px 8px;display:grid;place-items:center;color:#fff;font-size:34px;box-shadow:0 8px 15px rgba(32,57,57,.15)}
.correct-popup .feedback-icon{background:#16834f}.wrong-popup .feedback-icon{background:#c94740}
.feedback h3{margin:10px 0 2px;font-size:28px;font-weight:600}.feedback p{margin:0;font-size:17px;color:#607878}
.final{width:min(520px,91vw);min-height:260px;padding:30px 32px;background:linear-gradient(145deg,#eadcff,#cbb5f4 58%,#b89ae8);border:5px solid #7350a8;box-shadow:0 10px 0 rgba(83,55,126,.18),0 28px 70px rgba(55,38,80,.30)}
.final .emoji{font-size:72px}.final h2{margin:7px 0;font-size:36px;font-weight:600;color:#432e63}.final p{margin:0 0 18px;font-size:18px;color:#56456c}
.play-again{width:185px;height:52px;border:0;border-radius:17px;background:#68449a;color:#fff;font-family:inherit;font-size:20px;font-weight:500;cursor:pointer}

/* Monitor */
@media(min-width:1400px){
 .topbar{height:105px;flex-basis:105px}
 .title{min-height:68px;padding:10px 28px}.title-icon{width:52px;height:52px;font-size:29px}.title h1{font-size:30px}
 .main{width:min(1280px,92vw);padding-top:4px;padding-bottom:6px;justify-content:center}
 .division-table{border-width:3px;border-radius:22px}
 .table-row,.row{grid-template-columns:86px 1.25fr 1.25fr 1.25fr 1.25fr}
 .table-head>div{height:58px;font-size:24px}
 .row{min-height:72px}
 .row-number{font-size:25px}
 .cell{font-size:40px;padding:8px 10px}
 .input-box{width:150px;height:56px;border-radius:17px}
 .input-box input{font-size:34px}
 .action-area{padding-top:9px}
 .submit{min-width:155px;width:155px;height:50px;font-size:20px}
 .hint{font-size:23px;margin-top:14px}
}

/* Laptop */
@media(max-width:1100px){
 .main{width:min(960px,94vw)}
 .table-row,.row{grid-template-columns:64px 1.25fr 1.25fr 1.25fr 1.25fr}
 .table-head>div{height:54px;font-size:18px;padding:6px 4px}
 .row{min-height:64px}.row-number{font-size:20px}
 .cell{font-size:30px;padding:6px 5px}
 .input-box{width:112px;height:48px}
 .input-box input{font-size:28px}
}

/* Tablet */
@media(max-width:760px){
 html,body{overflow:hidden}
 .topbar{height:76px;flex-basis:76px}
 .title{min-height:52px;padding:6px 14px;gap:8px;border-radius:18px}.title-icon{width:38px;height:38px;font-size:21px}.title h1{font-size:19px}
 .main{width:96vw;padding:5px 0 8px}
 .division-table{border-radius:15px;border-width:2px}
 .table-row,.row{grid-template-columns:48px repeat(4,minmax(0,1fr))}
 .table-head>div{height:48px;font-size:15px;padding:4px 2px;border-right-width:1.5px}
 .row{min-height:58px}
 .row-number{font-size:17px}
 .cell{font-size:23px;padding:4px 2px;border-right-width:1.5px}
 .input-box{width:84px;height:42px;border-width:2.5px;border-radius:11px}
 .input-box input{font-size:23px;padding:0 4px}
 .action-area{padding-top:10px}.hint{font-size:13px}
}

@media(max-width:500px){
 .topbar{height:68px;flex-basis:68px}.title{min-height:48px;padding:5px 11px}.title-icon{width:34px;height:34px;font-size:19px}.title h1{font-size:17px}
 .main{width:97vw}
 .table-row,.row{grid-template-columns:38px repeat(4,minmax(0,1fr))}
 .table-head>div{height:43px;font-size:12px}
 .row{min-height:54px}.row-number{font-size:15px}.cell{font-size:18px}
 .input-box{width:61px;height:38px;border-radius:9px}.input-box input{font-size:17px}
 .submit{min-width:145px;width:145px;height:46px;font-size:18px}.hint{font-size:12px}
}

@media(max-width:430px){
  .division-table{border-radius:12px}
  .table-head>div{font-size:11px;padding:3px 1px}
  .cell{font-size:16px;padding:3px 1px}
  .row-number{font-size:14px}
  .input-box{width:56px;height:34px;border-radius:8px}
  .input-box input{font-size:16px;padding:0 2px}
  .submit{min-width:140px;width:140px;height:44px;font-size:18px}
  .hint{font-size:11px}
}
</style>
</head>
<body>
<div id="game">
<header class="topbar">
  <div class="title"><div class="title-icon">➗</div><h1>Complete The Following</h1></div>
</header>

<main class="main">
  <div class="division-table">
    <div class="table-row table-head">
      <div>S. No.</div><div>Dividend</div><div>Divisor</div><div>Quotient</div><div>Remainder</div>
    </div>
    <div class="rows" id="rows"></div>
  </div>
  <div class="action-area">
    <button class="submit" id="submitBtn" disabled>Submit</button>
    <div class="hint">Fill Every Missing Box To Complete The Challenge.</div>
  </div>
</main>

<div id="correctPopup" class="feedback correct-popup"><div class="feedback-icon">✓</div><h3>Perfect!</h3><p>Great Job! All Your Answers Are Correct.</p></div>
<div id="wrongPopup" class="feedback wrong-popup"><div class="feedback-icon">×</div><h3>Try Again!</h3><p>Check The Highlighted Boxes And Try Again.</p></div>
<div id="finalPopup" class="final"><div class="emoji">🏆</div><h2>Well Done!</h2><p>You completed every question in this activity!</p><button class="play-again" id="playAgain">↻ Play Again</button></div>
</div>

<script>
/* Exact worksheet questions and correct missing values */
const questions=[
 {no:1,data:["40579","100","405","79"],missing:{3:"405",4:"79"}},
 {no:2,data:["603025","1000","603","25"],missing:{1:"603025"}},
 {no:3,data:["89001","100","890","1"],missing:{2:"100"}},
 {no:4,data:["7304","1000","7","304"],missing:{2:"1000",4:"304"}},
 {no:5,data:["90020","10","9002","0"],missing:{1:"90020"}}
];

const rows=document.getElementById("rows");
const submitBtn=document.getElementById("submitBtn");
const correctPopup=document.getElementById("correctPopup");
const wrongPopup=document.getElementById("wrongPopup");
const finalPopup=document.getElementById("finalPopup");
const playAgain=document.getElementById("playAgain");
let completed=false;

function speak(text){
 if(!(window.speechSynthesis&&window.SpeechSynthesisUtterance))return;
 try{
  const synth=window.speechSynthesis;
  synth.cancel(); synth.resume();
  const msg=new SpeechSynthesisUtterance(text);
  msg.volume=1;msg.rate=1;msg.pitch=1;
  const voices=synth.getVoices();
  const voice=voices.find(v=>v.lang==="en-US")||voices.find(v=>/^en[-_]/i.test(v.lang))||voices.find(v=>/English/i.test(v.name));
  if(voice){msg.voice=voice;msg.lang=voice.lang}else msg.lang="en-US";
  synth.speak(msg);
 }catch(e){}
}
if("speechSynthesis" in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}

function sound(type){
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
  const now=ctx.currentTime;
  if(type==="correct"){o.frequency.setValueAtTime(660,now);o.frequency.setValueAtTime(880,now+.09)}
  else{o.frequency.setValueAtTime(260,now);o.frequency.setValueAtTime(190,now+.12)}
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+.22);
  o.start(now);o.stop(now+.23);
 }catch(e){}
}
function popup(el,time){el.classList.add("show");setTimeout(()=>el.classList.remove("show"),time)}

function render(){
 rows.innerHTML="";completed=false;submitBtn.disabled=true;
 questions.forEach((q,i)=>{
  const row=document.createElement("div");row.className="row";
  const num=document.createElement("div");num.className="row-number";num.textContent=q.no;row.appendChild(num);
  for(let col=1;col<=4;col++){
   const cell=document.createElement("div");cell.className="cell";
   if(q.missing[col]){
    const box=document.createElement("span");box.className="input-box";
    const input=document.createElement("input");input.type="text";input.inputMode="numeric";input.autocomplete="off";input.maxLength=8;input.dataset.answer=q.missing[col];
    input.setAttribute("aria-label",["Dividend","Divisor","Quotient","Remainder"][col-1]);
    input.addEventListener("input",()=>{input.value=input.value.replace(/\D/g,"");checkReady()});
    box.appendChild(input);cell.appendChild(box);
   }else cell.textContent=q.data[col-1];
   row.appendChild(cell);
  }
  rows.appendChild(row);
 });
 const first=rows.querySelector("input");if(first)first.focus();
}
function checkReady(){
 const inputs=[...rows.querySelectorAll("input")];submitBtn.disabled=inputs.some(i=>!i.value.trim())||completed;
}
function submitAnswers(){
 if(completed)return;
 const inputs=[...rows.querySelectorAll("input")];if(inputs.some(i=>!i.value.trim()))return;
 let allCorrect=true;
 inputs.forEach(input=>{const box=input.parentElement;box.classList.remove("correct","wrong");if(input.value.trim()===input.dataset.answer)box.classList.add("correct");else{box.classList.add("wrong");allCorrect=false}});
 if(allCorrect){
  completed=true;inputs.forEach(i=>i.disabled=true);submitBtn.disabled=true;sound("correct");speak("Correct!");popup(correctPopup,1500);
  setTimeout(()=>{finalPopup.classList.add("show");},1050);
 }else{
  sound("wrong");speak("Try Again!");popup(wrongPopup,1000);
  setTimeout(()=>{inputs.forEach(i=>{i.value="";i.disabled=false;i.parentElement.classList.remove("correct","wrong")});submitBtn.disabled=true;const first=rows.querySelector("input");if(first)first.focus()},700);
 }
}
submitBtn.addEventListener("click",submitAnswers);
playAgain.addEventListener("click",()=>{finalPopup.classList.remove("show");render()});
render();
</script>
<script>
/* ===== CONFETTI CELEBRATION (right & final popups) ===== */
(function () {
  let canvas, ctx, pieces = [], raf = null;
  function ensureCanvas() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999";
    document.body.appendChild(canvas);
    ctx = canvas.getContext("2d");
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  const colors = ["#16834f", "#d99c36", "#7350a8", "#c94740", "#3a8fb7", "#e86ea4", "#ffd257"];
  function burst(count) {
    ensureCanvas();
    for (let i = 0; i < count; i++) {
      pieces.push({
        x: innerWidth / 2 + (Math.random() - .5) * 180,
        y: innerHeight / 2 + (Math.random() - .5) * 90,
        vx: (Math.random() - .5) * 11,
        vy: Math.random() * -13 - 4,
        g: 0.30 + Math.random() * 0.14,
        s: 6 + Math.random() * 7,
        rot: Math.random() * 6.28,
        vr: (Math.random() - .5) * 0.4,
        color: colors[i % colors.length],
        life: 0
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life < 280 && p.y < innerHeight + 40);
    pieces.forEach(p => {
      p.life++;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (pieces.length) { raf = requestAnimationFrame(tick); }
    else { raf = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  window.fireConfetti = function (big) {
    if (big) {
      burst(170);
      let n = 0;
      const iv = setInterval(() => { burst(90); if (++n >= 4) clearInterval(iv); }, 400);
    } else {
      burst(90);
    }
  };
  function watch(id, big) {
    const el = document.getElementById(id);
    if (!el) return;
    let was = el.classList.contains("show");
    new MutationObserver(() => {
      const now = el.classList.contains("show");
      if (now && !was) window.fireConfetti(big);
      was = now;
    }).observe(el, { attributes: true, attributeFilter: ["class"] });
  }
  function init() { watch("correctPopup", false); watch("finalPopup", true); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>

</html>
