<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Fill in the blanks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden
    }

    body {
      font-family: "Livvic", sans-serif;
      color: #2f4f4f;
      background: #f8f1d8;
    }

    /* ---------- PAGE ---------- */
    .page {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 18px 5% 82px;
    }

    .heading {
      flex: none;
      margin: 0;
      text-align: center;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 400;
      color: #2f4f4f;
    }

    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game {
      width: min(1280px, 96vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* ---------- QUESTION ---------- */
    .question-wrap {
      width: min(1200px, 100%);
      text-align: center;
    }

    .question {
      margin: 0;
      font-size: 30px;
      line-height: 1.35;
      font-weight: 400;
      color: #2f4f4f;
    }

    /* ---------- PLAYFUL ANSWER SLOT ---------- */
    .answer-zone {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 78px;
    }

    .answer-box {
      position: relative;
      width: min(330px, 62vw);
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border: 4px solid #e29b67;
      border-radius: 18px;
      background: #fffaf0;
      color: #7b8b89;
      font-size: 21px;
      font-weight: 400;
      box-shadow: 0 7px 0 rgba(192, 124, 72, .12);
      transition: .18s ease;
    }

    .answer-box:before,
    .answer-box:after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e29b67;
      top: 50%;
      transform: translateY(-50%);
    }

    .answer-box:before {
      left: -9px
    }

    .answer-box:after {
      right: -9px
    }

    .answer-box.filled {
      background: #eee5ff;
      border-color: #7f69b4;
      color: #2f4f4f;
      transform: translateY(-2px);
    }

    .answer-box.filled:before,
    .answer-box.filled:after {
      background: #7f69b4
    }

    /* ---------- FOUR OPTIONS ---------- */
    .options {
      width: min(760px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 24px;
    }

    .option {
      position: relative;
      min-width: 0;
      height: 58px;
      border: 3px solid #9b82c8;
      border-radius: 18px;
      background: #fffaf0;
      color: #2f4f4f;
      font: 500 21px "Livvic", sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(91, 68, 132, .11);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease, border-color .16s ease;
    }

    .option:before {
      content: "";
      position: absolute;
      left: 10px;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 3px solid #c2aee4;
      background: #fffaf0;
      transform: translateY(-50%);
      transition: .16s ease;
    }

    .option:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 0 rgba(91, 68, 132, .11);
    }

    .option:active {
      transform: translateY(2px);
      box-shadow: 0 3px 0 rgba(91, 68, 132, .11);
    }

    .option.selected {
      background: #eee5ff;
      border-color: #7f69b4;
      transform: translateY(-2px);
    }

    .option.selected:before {
      background: #7f69b4;
      border-color: #7f69b4;
      box-shadow: inset 0 0 0 3px #eee5ff;
    }

    .option:disabled {
      cursor: not-allowed
    }

    /* ---------- SUBMIT ---------- */
    .submit-btn {
      min-width: 155px;
      height: 50px;
      padding: 0 28px;
      border: 0;
      border-radius: 18px;
      background: #2f4f4f;
      color: #fff;
      font: 500 20px "Livvic", sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(22, 59, 59, .18), 0 13px 25px rgba(47, 79, 79, .20);
      transition: .16s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px)
    }

    .submit-btn:active {
      transform: translateY(3px);
      box-shadow: 0 4px 0 rgba(22, 59, 59, .18)
    }

    .submit-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none
    }

    /* ---------- EXACT PROJECT NAV ---------- */
    .nav-btn {
      position: fixed;
      z-index: 30;
      bottom: 22px;
      min-width: 126px;
      height: 46px;
      padding: 0 19px;
      border-radius: 15px;
      font: 500 20px "Livvic", sans-serif;
      color: #2f4f4f;
      border: 2px solid rgba(47, 79, 79, .12);
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(47, 79, 79, .12);
      transition: .16s ease;
    }

    .nav-btn:hover {
      transform: translateY(-2px)
    }

    .nav-btn:active {
      transform: translateY(2px)
    }

    #prevBtn {
      left: 4%;
      background: #a9cbe2;
      border-color: #79a9c7
    }

    #nextBtn {
      right: 4%;
      background: #efbca6;
      border-color: #d99074
    }

    .nav-btn:disabled {
      opacity: .48;
      cursor: not-allowed;
      transform: none
    }

    /* ---------- EXACT CORRECT / WRONG POPUPS ---------- */
    .feedback {
      position: fixed;
      z-index: 100;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.92);
      width: min(440px, 88vw);
      min-height: 215px;
      padding: 26px 30px 28px;
      border-radius: 30px;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 20px 50px rgba(32, 57, 57, .22);
    }

    .correct-popup {
      background: linear-gradient(135deg, #e2f6e9, #f4fcf6);
      border: 5px solid #16834f
    }

    .wrong-popup {
      background: linear-gradient(135deg, #fde6e2, #fff7f5);
      border: 5px solid #c94740
    }

    .feedback-icon {
      width: 68px;
      height: 68px;
      border-radius: 24px 24px 24px 8px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 34px;
      box-shadow: 0 8px 16px rgba(32, 57, 57, .14)
    }

    .correct-popup .feedback-icon {
      background: #16834f
    }

    .wrong-popup .feedback-icon {
      background: #c94740
    }

    .feedback h3 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      color: #2f4f4f
    }

    .feedback p {
      margin: 0;
      font-size: 17px;
      color: #516766
    }

    .feedback.show {
      display: flex;
      animation: popIn .22s ease forwards
    }

    @keyframes popIn {
      to {
        transform: translate(-50%, -50%) scale(1)
      }
    }

    /* ---------- EXACT FINAL POPUP ---------- */
    .final-popup {
      position: fixed;
      z-index: 110;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.94);
      width: min(520px, 91vw);
      padding: 38px 36px 32px;
      border-radius: 34px;
      background: radial-gradient(circle at 20% 15%, rgba(255, 255, 255, .45), transparent 25%), linear-gradient(145deg, #eadcff, #cbb5f4 58%, #b89ae8);
      border: 5px solid #7350a8;
      box-shadow: 0 10px 0 rgba(83, 55, 126, .18), 0 28px 70px rgba(55, 38, 80, .30);
      text-align: center;
      display: none;
    }

    .final-popup.show {
      display: block;
      animation: finalIn .28s ease forwards
    }

    @keyframes finalIn {
      to {
        transform: translate(-50%, -50%) scale(1)
      }
    }

    .final-emoji {
      font-size: 78px;
      margin-bottom: 8px
    }

    .final-popup h2 {
      margin: 0 0 8px;
      font-size: 36px;
      font-weight: 600;
      color: #4e3970
    }

    .final-popup p {
      margin: 0 0 20px;
      font-size: 18px;
      color: #5e4e70
    }

    .play-again-btn {
      width: 185px;
      height: 52px;
      border: 0;
      border-radius: 17px;
      background: #68449a;
      color: #fff;
      font: 500 20px "Livvic", sans-serif;
      cursor: pointer
    }

    /* ---------- MOBILE ---------- */
    @media(max-width:700px) {

      html,
      body {
        overflow: auto;
        min-height: 100%
      }

      body {
        min-height: 100vh
      }

      .page {
        min-height: 100vh;
        height: auto;
        padding: 14px 16px 78px
      }

      .heading {
        font-size: 22px
      }

      .stage {
        padding: 18px 0
      }

      .game {
        width: 100%;
        gap: 19px
      }

      .question {
        font-size: 27px;
        line-height: 1.4
      }

      .options {
        width: min(560px, 100%);
        grid-template-columns: 1fr;
        gap: 11px
      }

      .option {
        height: 54px;
        font-size: 20px
      }

      .answer-zone {
        gap: 11px;
        flex-wrap: wrap
      }

      .answer-box {
        width: min(300px, 78vw);
        height: 54px
      }

      .nav-btn {
        bottom: 14px
      }
    }

    @media(max-width:420px) {
      .heading {
        font-size: 21px
      }

      .question {
        font-size: 25px
      }

      .option {
        height: 51px;
        font-size: 18px
      }

      .answer-box {
        height: 51px;
        font-size: 19px
      }

      .submit-btn {
        min-width: 145px
      }
    }

    /* ---------- LARGE MONITOR ---------- */
    @media(min-width:1400px) {
      .page {
        padding-left: 6%;
        padding-right: 6%;
        padding-top: 22px
      }

      .heading {
        font-size: 30px
      }

      .game {
        width: min(1280px, 88vw);
        gap: 30px
      }

      .question {
        font-size: 40px;
        line-height: 1.3
      }

      .answer-box {
        width: 390px;
        height: 64px;
        font-size: 26px
      }

      .options {
        width: min(920px, 100%);
        gap: 16px 30px
      }

      .option {
        height: 62px;
        font-size: 25px
      }

      .submit-btn {
        width: 180px;
        height: 50px;
        font-size: 25px
      }

      .nav-btn {
        width: 180px;
        height: 50px;
        font-size: 25px
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <h1 class="heading">Fill in the blanks</h1>

    <section class="stage">
      <div class="game">
        <div class="question-wrap">
          <p class="question" id="questionText"></p>
        </div>

        <div class="answer-zone">
          <div class="answer-box" id="answerBox">Select an answer</div>
          <button class="submit-btn" id="submitBtn" disabled>Submit</button>
        </div>

        <div class="options" id="options"></div>
      </div>
    </section>
  </main>

  <button id="prevBtn" class="nav-btn">Back</button>
  <button id="nextBtn" class="nav-btn" disabled>Next</button>

  <div id="correctPopup" class="feedback correct-popup">
    <div class="feedback-icon">✓</div>
    <h3>Correct!</h3>
    <p>Great job!</p>
  </div>

  <div id="wrongPopup" class="feedback wrong-popup">
    <div class="feedback-icon">×</div>
    <h3>Try Again!</h3>
    <p>Have another look.</p>
  </div>

  <div id="finalPopup" class="final-popup">
    <div class="final-emoji">🏆</div>
    <h2>Excellent Work!</h2>
    <p>You completed all the questions.</p>
    <button id="playAgainBtn" class="play-again-btn">Play Again</button>
  </div>

  <audio id="correctSound" preload="auto"
    src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound" preload="auto"
    src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
  <audio id="clickSound" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3"></audio>
  <audio id="completeSound" preload="auto"
    src="https://assets.mixkit.co/sfx/preview/mixkit-winning-an-extra-bonus-2060.mp3"></audio>

  <script>
    const quizData = [
      {
        question: "Q1. Numbers that are not divisible by 2 are called ______.",
        options: ["Odd numbers", "Even numbers", "Prime numbers", "Whole numbers"],
        answer: "Odd numbers"
      },
      {
        question: "Q2. Numbers which have only two factors are called ______.",
        options: ["Prime numbers", "Odd numbers", "Whole numbers", "Composite numbers"],
        answer: "Prime numbers"
      },
      {
        question: "Q3. ______ is the only even prime number.",
        options: ["2", "1", "3", "4"],
        answer: "2"
      },
      {
        question: "Q4. The prime numbers that have only 1 as a common factor are called ______.",
        options: ["Co-prime numbers", "Composite numbers", "Even numbers", "Whole numbers"],
        answer: "Co-prime numbers"
      },
      {
        question: "Q5. Counting numbers along with 0 are called ______.",
        options: ["Whole numbers", "Natural numbers", "Odd numbers", "Prime numbers"],
        answer: "Whole numbers"
      }
    ];
    let current = 0;
    let selected = "";
    let answered = false;
    let wrongTimer = null;
    let quizFinished = false;

    const state = quizData.map(() => ({ selected: "", answered: false }));

    const questionText = document.getElementById("questionText");
    const optionsEl = document.getElementById("options");
    const answerBox = document.getElementById("answerBox");
    const submitBtn = document.getElementById("submitBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const correctPopup = document.getElementById("correctPopup");
    const wrongPopup = document.getElementById("wrongPopup");
    const finalPopup = document.getElementById("finalPopup");

    const correctSound = document.getElementById("correctSound");
    const wrongSound = document.getElementById("wrongSound");
    const clickSound = document.getElementById("clickSound");
    const completeSound = document.getElementById("completeSound");

    function playSound(audio) {
      try {
        audio.currentTime = 0;
        audio.play().catch(() => { });
      } catch (e) { }
    }

    function smallConfetti() {
      confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
    }

    function bigConfetti() {
      confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } });
    }

    function speak(t) {
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-US";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }

    function normalize(v) {
      return v.trim().toLowerCase().replace(/[.,!?]/g, "").replace(/\s+/g, " ");
    }

    function closePopups() {
      correctPopup.classList.remove("show");
      wrongPopup.classList.remove("show");
    }

    function showPopup(el) {
      closePopups();
      el.classList.add("show");
    }

    function renderQuestion() {
      clearTimeout(wrongTimer);
      if (quizFinished) {
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }
      closePopups();

      const q = quizData[current];
      const saved = state[current];

      selected = saved.selected;
      answered = saved.answered;

      questionText.textContent = q.question;

      answerBox.textContent = selected || "Select an answer";
      answerBox.classList.toggle("filled", !!selected);

      optionsEl.innerHTML = "";

      q.options.forEach(option => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        btn.textContent = option;

        if (option === selected) btn.classList.add("selected");
        btn.disabled = answered;

        btn.addEventListener("click", () => {
          if (answered) return;

          selected = option;
          state[current].selected = selected;

          optionsEl.querySelectorAll(".option").forEach(b => {
            b.classList.toggle("selected", b === btn);
          });

          answerBox.textContent = selected;
          answerBox.classList.add("filled");
          submitBtn.disabled = false;

          playSound(clickSound);
        });

        optionsEl.appendChild(btn);
      });

      submitBtn.disabled = answered || !selected;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = !answered;
    }

    function checkAnswer() {
      if (answered || !selected) return;

      if (normalize(selected) === normalize(quizData[current].answer)) {
        answered = true;
        state[current].answered = true;
        state[current].selected = selected;

        submitBtn.disabled = true;
        nextBtn.disabled = false;

        optionsEl.querySelectorAll(".option").forEach(b => b.disabled = true);

        playSound(correctSound);
        speak("Correct!");
        smallConfetti();
        showPopup(correctPopup);


        setTimeout(() => {
          correctPopup.classList.remove("show");

          if (current === quizData.length - 1) {
            quizFinished = true;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            finalPopup.classList.add("show");
            bigConfetti();
            playSound(completeSound);

          }
        }, 1400);

      } else {
        playSound(wrongSound);
        speak("Try again!");
        showPopup(wrongPopup);

        wrongTimer = setTimeout(() => {
          wrongPopup.classList.remove("show");

          selected = "";
          state[current].selected = "";

          answerBox.textContent = "Select an answer";
          answerBox.classList.remove("filled");
          submitBtn.disabled = true;

          optionsEl.querySelectorAll(".option").forEach(b => {
            b.disabled = false;
            b.classList.remove("selected");
          });
        }, 1400);
      }
    }

    submitBtn.addEventListener("click", checkAnswer);

    prevBtn.addEventListener("click", () => {
      if (quizFinished || current === 0) return;
      playSound(clickSound);
      current--;
      renderQuestion();
    });

    nextBtn.addEventListener("click", () => {
      if (quizFinished || !state[current].answered) return;

      if (current < quizData.length - 1) {
        playSound(clickSound);
        current++;
        renderQuestion();
      }
    });

    document.getElementById("playAgainBtn").addEventListener("click", () => {
      playSound(clickSound);
      state.forEach(s => {
        s.selected = "";
        s.answered = false;
      });
      current = 0;
      quizFinished = false;
      selected = "";
      answered = false;
      finalPopup.classList.remove("show");
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>

</html>
