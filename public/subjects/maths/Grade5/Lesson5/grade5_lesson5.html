<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade4_Lesson4</title>
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
<style>
  @import url('https://fonts.googleapis.com/css2?family=Livvic:wght@400;500&display=swap');

  :root{
    --page:#f8fbff;
    --text:#304954;
    --muted:#7c8d95;
    --white:#ffffff;
    --shadow:0 12px 30px rgba(46,73,84,.10);
    --shadow-hover:0 20px 42px rgba(46,73,84,.16);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{
    width:100%;
    min-height:100%;
    font-family:'Livvic',sans-serif;
    color:var(--text);
  }

  body{
    background:var(--page);
    overflow-x:hidden;
  }

  body.quiz-open{overflow:hidden}

  button{font:inherit}

  .app{
    min-height:100vh;
    padding:clamp(22px,4vw,52px) 16px clamp(28px,5vw,60px);
    background:
      radial-gradient(circle at 5% 8%,rgba(120,190,255,.14) 0 130px,transparent 131px),
      radial-gradient(circle at 96% 12%,rgba(255,185,210,.16) 0 145px,transparent 146px),
      radial-gradient(circle at 88% 92%,rgba(126,220,176,.13) 0 150px,transparent 151px),
      #f8fbff;
  }

  .home{
    width:min(1240px,100%);
    margin:0 auto;
  }

  .hero{
    text-align:center;
    margin-bottom:clamp(22px,3vw,34px);
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:8px 15px;
    border:1px solid #e4edf2;
    border-radius:999px;
    background:rgba(255,255,255,.9);
    color:#71828a;
    font-size:12px;
    font-weight:500;
    letter-spacing:.7px;
    box-shadow:0 6px 18px rgba(46,73,84,.06);
  }

  .eyebrow i{color:#f2b84b}

  .hero h1{
    margin-top:12px;
    font-size:clamp(30px,4vw,48px);
    line-height:1.05;
    font-weight:500;
    letter-spacing:-1px;
    color:#304954;
  }

  .hero h1 span{color:#e56f95}

  .cards{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:clamp(16px,2vw,24px);
  }

  .game-card{
    --accent:#4f91d2;
    --soft:#edf7ff;

    width:100%;
    min-width:0;
    min-height:350px;
    padding:14px;
    position:relative;
    display:flex;
    flex-direction:column;
    text-align:left;
    border:1px solid rgba(221,232,238,.95);
    border-radius:26px;
    background:#fff;
    overflow:hidden;
    isolation:isolate;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
  }

  .game-card::before{
    content:"";
    position:absolute;
    inset:0 0 auto;
    height:6px;
    background:var(--accent);
    z-index:3;
  }

  .game-card::after{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    right:-65px;
    bottom:-72px;
    border-radius:50%;
    background:var(--soft);
    z-index:-1;
  }

  .game-card:hover{
    transform:translateY(-7px);
    box-shadow:var(--shadow-hover);
    border-color:#d8e5eb;
  }

  .game-card:focus-visible{
    outline:3px solid color-mix(in srgb,var(--accent) 35%,white);
    outline-offset:3px;
  }

  .game-card:active{transform:translateY(-2px)}

  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:5px 2px 0;
  }

  .card-number{
    display:inline-flex;
    align-items:center;
    width:max-content;
    padding:6px 10px;
    border-radius:999px;
    background:var(--soft);
    color:var(--accent);
    font-size:11px;
    line-height:1;
    font-weight:500;
    letter-spacing:.5px;
  }

  .card-icon{
    flex:0 0 auto;
    width:46px;
    height:46px;
    display:grid;
    place-items:center;
    border-radius:14px;
    background:var(--accent);
    color:#fff;
    font-size:19px;
    box-shadow:0 8px 17px rgba(46,73,84,.13);
  }

  .art{
    height:145px;
    margin:14px 0 0;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    background:var(--soft);
    border:1px solid rgba(255,255,255,.95);
  }

  .art::before{
    content:"";
    position:absolute;
    width:105px;
    height:105px;
    left:-38px;
    bottom:-60px;
    border-radius:50%;
    background:#fff;
    opacity:.7;
  }

  .art::after{
    content:"";
    position:absolute;
    width:70px;
    height:70px;
    right:-25px;
    top:-28px;
    border-radius:50%;
    background:rgba(255,255,255,.45);
  }

  .visual{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1;
  }

  .card-title{
    margin:15px 2px 0;
    color:#304954;
    font-size:21px;
    line-height:1.12;
    font-weight:500;
  }

  .card-sub{
    margin:6px 2px 0;
    min-height:32px;
    color:var(--muted);
    font-size:13px;
    line-height:1.3;
    font-weight:400;
  }

  .play-row{
    margin-top:auto;
    padding:12px 2px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-top:1px solid #edf1f3;
    color:var(--accent);
    font-size:11px;
    font-weight:500;
    letter-spacing:.65px;
  }

  .play-circle{
    flex:0 0 auto;
    width:36px;
    height:36px;
    display:grid;
    place-items:center;
    border-radius:11px;
    background:var(--accent);
    color:#fff;
    transition:transform .2s ease;
  }

  .game-card:hover .play-circle{
    transform:translateX(4px);
  }

  /* Individual card colors */
  .game-card:nth-child(1){--accent:#4b8fd3;--soft:#edf7ff}
  .game-card:nth-child(2){--accent:#43ad75;--soft:#ebf9f0}
  .game-card:nth-child(3){--accent:#e27499;--soft:#fff0f5}

  /* MCQ illustration */
  .mcq-scene{
    flex-direction:column;
    gap:9px;
  }

  .mcq-question{
    padding:7px 14px;
    border-radius:12px;
    background:#fff;
    color:var(--accent);
    font-size:22px;
    font-weight:500;
    box-shadow:0 5px 12px rgba(46,73,84,.07);
  }

  .mcq-options{
    display:flex;
    gap:7px;
  }

  .mcq-options span{
    width:27px;
    height:27px;
    display:grid;
    place-items:center;
    border-radius:8px;
    background:#fff;
    color:var(--accent);
    font-size:10px;
    font-weight:500;
    box-shadow:0 4px 9px rgba(46,73,84,.06);
  }

  .mcq-pointer{
    position:absolute;
    right:19%;
    bottom:13%;
    color:var(--accent);
    font-size:21px;
    transform:rotate(-12deg);
  }

  /* Prime/composite illustration */
  .prime-scene{
    flex-direction:column;
    gap:5px;
  }

  .prime-number{
    width:66px;
    height:66px;
    display:grid;
    place-items:center;
    border-radius:20px;
    background:#fff;
    color:var(--accent);
    font-size:31px;
    font-weight:500;
    box-shadow:0 7px 15px rgba(46,73,84,.08);
  }

  .prime-label{
    padding:4px 10px;
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    font-size:9px;
    font-weight:500;
    letter-spacing:1px;
  }

  .prime-dividers{
    display:flex;
    gap:6px;
    margin-top:3px;
  }

  .prime-dividers span{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--accent);
    opacity:.55;
  }

  /* Fill-in-the-blanks illustration */
  .blank-scene{
    flex-direction:column;
    gap:10px;
  }

  .blank-row{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--accent);
    font-size:21px;
    font-weight:500;
  }

  .blank{
    width:45px;
    height:28px;
    border:2px dashed var(--accent);
    border-radius:9px;
    background:#fff;
  }

  .blank-star{
    position:absolute;
    color:var(--accent);
    font-size:14px;
  }

  .blank-star.s1{left:17%;top:18%}
  .blank-star.s2{right:17%;bottom:18%}

  /* Activity overlay */
  .game-view{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    width:100%;
    height:100dvh;
    background:#f8fbff;
    overflow:hidden;
  }

  .game-view.show{display:block}

  .game-topbar{
    position:absolute;
    top:max(12px,env(safe-area-inset-top));
    left:max(12px,env(safe-area-inset-left));
    z-index:10001;
  }

  .back-btn{
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#fff;
    color:#355158;
    font-size:19px;
    cursor:pointer;
    box-shadow:0 7px 18px rgba(46,73,84,.14);
  }

  .back-btn:hover{
    background:#eef5f7;
  }

  .current-title{display:none}

  #contentFrame{
    width:100%;
    height:100dvh;
    border:0;
    display:block;
    background:#f8fbff;
  }

  /* Large desktop */
  @media (min-width:1400px){
    .cards{gap:28px}
    .game-card{min-height:380px;padding:16px}
    .art{height:160px}
    .card-title{font-size:23px}
    .card-sub{font-size:14px}
  }

  /* Tablet */
  @media (max-width:1024px){
    .cards{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .game-card{
      min-height:330px;
    }

    .art{height:130px}
  }

  @media (max-width:700px){
    .app{
      padding:22px 12px 32px;
    }

    .hero{
      margin-bottom:20px;
    }

    .eyebrow{
      font-size:10px;
      padding:7px 11px;
    }

    .hero h1{
      font-size:29px;
    }

    .cards{
      grid-template-columns:1fr;
      gap:14px;
    }

    .game-card{
      min-height:310px;
      padding:12px;
      border-radius:22px;
    }

    .art{
      height:125px;
      margin-top:12px;
    }

    .card-title{
      font-size:19px;
    }

    .card-sub{
      font-size:12px;
      min-height:0;
    }

    .play-row{
      margin-top:14px;
    }
  }

  /* Small phones */
  @media (max-width:420px){
    .app{padding:18px 10px 26px}

    .hero h1{
      font-size:26px;
    }

    .eyebrow{
      display:none;
    }

    .game-card{
      min-height:285px;
      padding:10px;
      border-radius:19px;
    }

    .card-top{padding-top:3px}

    .card-number{
      padding:5px 8px;
      font-size:9px;
    }

    .card-icon{
      width:40px;
      height:40px;
      border-radius:12px;
      font-size:16px;
    }

    .art{
      height:108px;
      margin-top:10px;
      border-radius:16px;
    }

    .card-title{
      margin-top:12px;
      font-size:17px;
    }

    .card-sub{
      margin-top:4px;
      font-size:11px;
    }

    .play-row{
      padding-top:9px;
      font-size:9px;
    }

    .play-circle{
      width:32px;
      height:32px;
      border-radius:9px;
    }

    .mcq-question{font-size:18px}
    .prime-number{width:55px;height:55px;font-size:26px}
    .blank-row{font-size:18px}
    .blank{width:39px;height:25px}
  }

  @media (prefers-reduced-motion:reduce){
    .game-card,.play-circle{transition:none}
  }

  @media (min-width: 1600px) and (max-width: 1920px) {
  .app {
    padding: 38px 20px 50px;
  }

  .home {
    width: min(1450px, 92vw);
  }

  .hero {
    margin-bottom: 32px;
  }

  .eyebrow {
    font-size: 13px;
    padding: 9px 17px;
  }

  .hero h1 {
    font-size: 46px;
    margin-top: 14px;
  }

  .cards {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 26px;
  }

  .game-card {
    min-height: 390px;
    padding: 17px;
    border-radius: 28px;
  }

  .card-top {
    padding: 6px 3px 0;
  }

  .card-number {
    padding: 7px 11px;
    font-size: 12px;
  }

  .card-icon {
    width: 50px;
    height: 50px;
    border-radius: 15px;
    font-size: 21px;
  }

  .art {
    height: 165px;
    margin: 15px 0 0;
    border-radius: 21px;
  }

  .card-title {
    margin: 17px 3px 0;
    font-size: 23px;
  }

  .card-sub {
    margin: 7px 3px 0;
    font-size: 14px;
    min-height: 36px;
  }

  .play-row {
    margin-top: auto;
    padding: 13px 3px 0;
    font-size: 12px;
  }

  .play-circle {
    width: 39px;
    height: 39px;
    border-radius: 12px;
  }

  /* MCQ */
  .mcq-question {
    font-size: 25px;
    padding: 8px 16px;
  }

  .mcq-options {
    gap: 9px;
  }

  .mcq-options span {
    width: 31px;
    height: 31px;
    font-size: 11px;
  }

  .mcq-pointer {
    font-size: 24px;
  }

  /* Prime & Composite */
  .prime-number {
    width: 74px;
    height: 74px;
    border-radius: 21px;
    font-size: 35px;
  }

  .prime-label {
    padding: 5px 12px;
    font-size: 10px;
  }

  .prime-dividers {
    gap: 7px;
  }

  .prime-dividers span {
    width: 10px;
    height: 10px;
  }

  /* Fill in the Blanks */
  .blank-row {
    gap: 9px;
    font-size: 24px;
  }

  .blank {
    width: 52px;
    height: 32px;
    border-width: 3px;
  }

  .blank-star {
    font-size: 16px;
  }

  /* Activity screen */
  .back-btn {
    width: 54px;
    height: 54px;
    font-size: 21px;
  }
}
</style>

</head>

<body>
  <div class="app">
    <main class="home">
      <header class="hero">
        <div class="eyebrow"><i class="fa-solid fa-star"></i> FUN LEARNING ACTIVITIES <i class="fa-solid fa-star"></i>
        </div>
        <h1>Choose an <span>Adventure!</span></h1>
      </header>
      <section class="cards">

        <button class="game-card" onclick="openIsland(0,'MCQ')">
          <div class="card-top">
            <div class="card-number">01 · PLAY</div>
            <div class="card-icon"><i class="fa-solid fa-list-check"></i></div>
          </div>
          <div class="art">
            <div class="visual mcq-scene">
              <div class="mcq-question">7 × 3 = ?</div>
              <div class="mcq-options">
                <span>A</span><span>B</span><span>C</span><span>D</span>
              </div>
              <div class="mcq-pointer"><i class="fa-solid fa-hand-pointer"></i></div>
            </div>
          </div>
          <div class="card-title">MCQ</div>
          <div class="card-sub">Choose the correct answer</div>
          <div class="play-row"><span>START PLAYING</span><span class="play-circle"><i
                class="fa-solid fa-arrow-right"></i></span></div>
        </button>

        <button class="game-card" onclick="openIsland(1,'Prime & Composite')">
          <div class="card-top">
            <div class="card-number">02 · PLAY</div>
            <div class="card-icon"><i class="fa-solid fa-shapes"></i></div>
          </div>
          <div class="art">
            <div class="visual prime-scene">
              <div class="prime-number">17</div>
              <div class="prime-label">PRIME</div>
              <div class="prime-dividers">
                <span></span><span></span><span></span>
              </div>
            </div>
          </div>
          <div class="card-title">Prime &amp; Composite</div>
          <div class="card-sub">Identify prime or composite numbers</div>
          <div class="play-row"><span>START PLAYING</span><span class="play-circle"><i
                class="fa-solid fa-arrow-right"></i></span></div>
        </button>

        <button class="game-card" onclick="openIsland(2,'Fill in the Blanks')">
          <div class="card-top">
            <div class="card-number">03 · PLAY</div>
            <div class="card-icon"><i class="fa-solid fa-square-pen"></i></div>
          </div>
          <div class="art">
            <span class="blank-star s1"><i class="fa-solid fa-sparkles"></i></span>
            <span class="blank-star s2"><i class="fa-solid fa-star"></i></span>
            <div class="visual blank-scene">
              <div class="blank-row">3 + <span class="blank"></span> = 8</div>
              <div class="blank-row"><span class="blank"></span> + 2 = 7</div>
            </div>
          </div>
          <div class="card-title">Fill in the Blanks</div>
          <div class="card-sub">Complete the missing number</div>
          <div class="play-row"><span>START PLAYING</span><span class="play-circle"><i
                class="fa-solid fa-arrow-right"></i></span></div>
        </button>

      </section>
    </main>
  </div>
  <div class="game-view" id="gameView">
    <div class="game-topbar"><button class="back-btn" onclick="goHome()" aria-label="Go to Home" title="Home"><i
          class="fa-solid fa-house"></i></button>
      <div class="current-title" id="currentTitle">Activity</div>
    </div><iframe id="contentFrame" src="" title="Learning Activity"></iframe>
  </div>
  <script>
    const frame = document.getElementById('contentFrame'); const gameView = document.getElementById('gameView'); const currentTitle = document.getElementById('currentTitle');
    const pages = ['./exercise/mcq.html', './exercise/prime_composite.html', './exercise/fillintheblanks.html'];
    function openIsland(index, title) {
      currentTitle.textContent = title;
      frame.src = pages[index];
      gameView.classList.add('show');
      document.body.classList.add('quiz-open');
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
    function goHome() {
      gameView.classList.remove('show');
      document.body.classList.remove('quiz-open');
      frame.src = '';
    }
    window.addEventListener('keydown', e => { if (e.key === 'Escape' && gameView.classList.contains('show')) goHome(); });
  </script>
</body>

</html>
