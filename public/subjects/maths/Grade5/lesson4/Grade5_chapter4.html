<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geometry Learning</title>

<style>
/* lesson4 no-bold reset */
h1,h2,h3,h4,h5,h6,b,strong{font-weight:400;}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
    background: #eaf9ff;
    color: #263b66;
}

.app {
    width: 100vw;
    height: 100vh;
    min-height: 500px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
        linear-gradient(
            to bottom,
            #bdefff 0%,
            #e8faff 31%,
            #ffffff 31%,
            #ffffff 100%
        );
}

.top-area {
    height: 25vh;
    min-height: 145px;
    max-height: 250px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
}

.cloud {
    position: absolute;
    background: rgba(255,255,255,.72);
    border-radius: 100px;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
}

.cloud.one {
    width: 170px;
    height: 48px;
    left: 4%;
    top: 34%;
}

.cloud.one::before {
    width: 65px;
    height: 65px;
    left: 25px;
    top: -30px;
}

.cloud.one::after {
    width: 80px;
    height: 80px;
    left: 80px;
    top: -40px;
}

.cloud.two {
    width: 150px;
    height: 43px;
    right: 5%;
    top: 22%;
}

.cloud.two::before {
    width: 65px;
    height: 65px;
    left: 20px;
    top: -28px;
}

.cloud.two::after {
    width: 65px;
    height: 65px;
    right: 18px;
    top: -30px;
}

.home-btn {
    position: absolute;
    left: 2.2%;
    top: 13%;
    width: clamp(52px, 5vw, 82px);
    height: clamp(52px, 5vw, 82px);
    border: 5px solid white;
    border-radius: 50%;
    background: #9b68f5;
    box-shadow:
        0 6px 0 rgba(105,72,170,.25),
        0 10px 18px rgba(72,82,130,.18);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
    z-index: 5;
}

.home-btn:hover {
    transform: scale(1.08);
}

.home-icon {
    width: 55%;
    height: 55%;
    display: block;
}

.mascot-left {
    position: absolute;
    left: 8%;
    bottom: -8px;
    width: clamp(90px, 9vw, 155px);
    aspect-ratio: 1;
    background: #ffd85c;
    clip-path: polygon(50% 2%, 98% 95%, 2% 95%);
    filter: drop-shadow(0 8px 5px rgba(71,106,130,.18));
    display: flex;
    justify-content: center;
    align-items: center;
}

.mascot-left::before {
    content: "••";
    position: absolute;
    top: 38%;
    left: 34%;
    font-size: clamp(20px, 2vw, 34px);
    letter-spacing: 16px;
    color: #243b68;
}

.mascot-face {
    position: absolute;
    top: 54%;
    width: 30%;
    height: 15%;
    border-bottom: 4px solid #243b68;
    border-radius: 0 0 50% 50%;
}

.title-box {
    position: relative;
    z-index: 5;
    text-align: center;
    width: min(54vw, 850px);
    padding: clamp(14px, 1.4vh, 25px) clamp(30px, 3vw, 65px);
    border-radius: 38px;
    background: #ffd95c;
    border: clamp(4px, .35vw, 7px) solid #fff3ad;
    box-shadow:
        0 8px 0 rgba(213,163,49,.28),
        0 12px 25px rgba(63,92,125,.12);
}

.title-box h1 {
    font-size: clamp(42px, 5vw, 86px);
    line-height: .95;
    color: #284a83;
    letter-spacing: 1px;
    text-shadow: 2px 3px 0 white;
}

.title-box p {
    margin-top: 9px;
    font-size: clamp(13px, 1.25vw, 22px);
    font-weight:400;
    color: #405b86;
}

.progress-box {
    position: absolute;
    right: 2.5%;
    top: 13%;
    width: clamp(190px, 19vw, 330px);
    padding: clamp(10px, 1vh, 16px) clamp(14px, 1.2vw, 24px);
    border-radius: 24px;
    background: rgba(255,255,255,.93);
    border: 3px solid #dcecff;
    box-shadow: 0 7px 15px rgba(55,90,125,.13);
    z-index: 5;
}

.progress-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: clamp(12px, 1vw, 18px);
    font-weight:400;
    color: #37578c;
    margin-bottom: 8px;
}

.progress-track {
    width: 100%;
    height: clamp(13px, 1.2vh, 21px);
    background: #e7edf6;
    border-radius: 30px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #58cf8a, #7be29e);
    border-radius: inherit;
    transition: width .4s ease;
}

.grass {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 25px;
    background: #91df76;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}

.lesson-area {
    flex: 1;
    min-height: 0;
    padding: clamp(12px, 1.6vh, 28px) clamp(18px, 2.2vw, 45px) clamp(10px, 1.4vh, 25px);
    overflow: hidden;
}

.lesson-grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: clamp(10px, 1vw, 20px);
    overflow: hidden;
}

.lesson-card {
    position: relative;
    min-width: 0;
    min-height: 0;
    border-radius: clamp(18px, 1.5vw, 30px);
    border: clamp(2px, .2vw, 4px) solid rgba(255,255,255,.85);
    box-shadow:
        0 6px 0 rgba(70,90,130,.12),
        0 10px 20px rgba(62,94,125,.10);
    padding: clamp(9px, 1vw, 18px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease;
}

.lesson-card:hover {
    transform: translateY(-5px) scale(1.015);
    box-shadow:
        0 10px 0 rgba(70,90,130,.12),
        0 15px 25px rgba(62,94,125,.15);
}

.lesson-card:active {
    transform: translateY(1px) scale(.99);
}

.card-pink { background: #ffe1ec; }
.card-purple { background: #eee3ff; }
.card-blue { background: #dcf5ff; }
.card-green { background: #e1f8d9; }
.card-yellow { background: #fff2ca; }

.number {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(34px, 3vw, 52px);
    height: clamp(34px, 3vw, 52px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: clamp(16px, 1.4vw, 25px);
    font-weight:400;
    border: 3px solid white;
    box-shadow: 0 4px 7px rgba(50,70,100,.15);
}

.pink { background: #f25b96; }
.purple { background: #8b61df; }
.blue { background: #3ca7e8; }
.green { background: #55bd73; }
.orange { background: #f6a62f; }

.icon-area {
    width: 78%;
    height: 45%;
    margin-top: clamp(20px, 2.3vh, 38px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.svg-icon {
    width: 100%;
    height: 100%;
    max-width: 150px;
    max-height: 100px;
    display: block;
    overflow: visible;
}

.card-title {
    width: 100%;
    text-align: center;
    font-size: clamp(13px, 1.2vw, 22px);
    line-height: 1.05;
    font-weight:400;
    color: #263b66;
    min-height: 2.2em;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card-bottom {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(2px, .3vw, 7px);
}

.stars {
    display: flex;
    gap: 2px;
    font-size: clamp(13px, 1.1vw, 20px);
    color: #c4cad8;
}

.stars .earned {
    color: #ffc84a;
}

.play-btn {
    width: clamp(34px, 3.1vw, 58px);
    height: clamp(34px, 3.1vw, 58px);
    border-radius: 50%;
    border: 3px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: clamp(15px, 1.3vw, 24px);
    box-shadow: 0 4px 7px rgba(50,70,100,.18);
}

.play-pink { background: #ee5b97; }
.play-purple { background: #8058dd; }
.play-blue { background: #389fe1; }
.play-green { background: #45b871; }
.play-orange { background: #f19b25; }

.lesson-card.completed {
    box-shadow:
        0 6px 0 rgba(70,90,130,.12),
        0 0 0 3px rgba(255,205,71,.18),
        0 10px 22px rgba(62,94,125,.12);
}

.lesson-card.completed .stars .star {
    color: #ffc84a;
    text-shadow: 0 1px 2px rgba(210,150,20,.18);
}

.activity-screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: white;
    z-index: 100;
    display: none;
    overflow: hidden;
}

.activity-screen.active {
    display: block;
}

.activity-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    overflow: hidden;
}

.back-btn {
    position: fixed;
    z-index: 110;
    top: 8px;
    left: 8px;
    width: 46px;
    height: 46px;
    border: 3px solid white;
    border-radius: 50%;
    background: #8b61df;
    color: white;
    font-size: 20px;
    font-weight:400;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(50,70,100,.2);
    cursor: pointer;
}

.back-btn:hover {
    transform: scale(1.07);
}

@media (min-width: 1600px) {
    .top-area { height: 27vh; }
    .lesson-grid { gap: 18px; }
    .card-title { font-size: 21px; }
}

@media (max-width: 1400px) {
    .top-area { height: 24vh; }
    .lesson-grid { gap: 10px; }
    .lesson-card { padding: 8px; }
}

@media (max-width: 1100px) {
    .title-box { width: 48vw; }
    .progress-box { width: 180px; }
    .mascot-left { left: 5%; }
    .lesson-grid {
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 7px;
    }
    .card-title { font-size: 12px; }
    .icon-area { transform: scale(.85); }
}

@media (max-width: 850px) {
    .top-area {
        height: 22vh;
        min-height: 120px;
    }

    .title-box { width: 52vw; }

    .title-box h1 {
        font-size: clamp(32px, 6vw, 55px);
    }

    .progress-box {
        width: 145px;
        right: 2%;
    }

    .mascot-left { display: none; }

    .lesson-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(0, 1fr));
    }

    .card-title { font-size: 12px; }
}

@media (max-width: 600px) {
    .top-area {
        height: 18vh;
        min-height: 100px;
    }

    .home-btn {
        width: 42px;
        height: 42px;
        border-width: 3px;
    }

    .title-box {
        width: 62vw;
        padding: 8px 12px;
        border-radius: 22px;
    }

    .title-box h1 { font-size: 29px; }
    .title-box p { font-size: 9px; }

    .progress-box {
        width: 110px;
        padding: 7px;
        border-radius: 14px;
    }

    .progress-title { font-size: 9px; }

    .lesson-area { padding: 7px; }

    .lesson-grid {
        gap: 5px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(0, 1fr));
    }

    .lesson-card {
        border-radius: 13px;
        padding: 4px;
    }

    .number {
        width: 25px;
        height: 25px;
        font-size: 11px;
    }

    .icon-area {
        margin-top: 17px;
        transform: scale(.62);
    }

    .card-title { font-size: 8px; }
    .stars { font-size: 8px; }

    .play-btn {
        width: 25px;
        height: 25px;
        font-size: 10px;
        border-width: 2px;
    }
}

@media (max-height: 600px) {
    .top-area {
        height: 20vh;
        min-height: 95px;
    }

    .lesson-area { padding-top: 6px; }
    .icon-area { margin-top: 18px; }
}
</style>
</head>

<body>

<div class="app">

    <header class="top-area">

        <div class="cloud one"></div>
        <div class="cloud two"></div>

        <button class="home-btn" onclick="goHome()" aria-label="Home">
            <svg class="home-icon" viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M3 10.5L12 3L21 10.5V20C21 20.55 20.55 21 20 21H4C3.45 21 3 20.55 3 20V10.5Z"
                    fill="white"/>
                <path
                    d="M9 21V14H15V21"
                    fill="#9B68F5"/>
            </svg>
        </button>

        <div class="mascot-left">
            <div class="mascot-face"></div>
        </div>

        <div class="title-box">
            <h1>Geometry</h1>
            <p>Explore • Discover • Practice • Grow!</p>
        </div>

        <div class="progress-box">
            <div class="progress-title">
                <span>Your Progress</span>
                <span id="progressText">0 / 14</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="grass"></div>
    </header>

    <main class="lesson-area">
        <div class="lesson-grid" id="lessonGrid"></div>
    </main>

</div>

<div class="activity-screen" id="activityScreen">

    <button class="back-btn" onclick="closeActivity()">←</button>

    <iframe
        id="activityFrame"
        class="activity-frame"
        frameborder="0"
        scrolling="no">
    </iframe>

</div>

<script>

/* =========================================================
   CHANGE ONLY THE 14 FILE NAMES BELOW
========================================================= */

const lessons = [
    {
        number: 1,
        title: "Curve Types",
        file: "exercises/1.html",
        card: "card-pink",
        badge: "pink",
        play: "play-pink",
        icon: "curve"
    },
    {
        number: 2,
        title: "Meet the Lines",
        file: "exercises/meetTheLines.html",
        card: "card-purple",
        badge: "purple",
        play: "play-purple",
        icon: "lines"
    },
    {
        number: 3,
        title: "Find the Shape",
        file: "exercises/3.html",
        card: "card-blue",
        badge: "blue",
        play: "play-blue",
        icon: "shapes"
    },
    {
        number: 4,
        title: "True or False",
        file: "exercises/2.html",
        card: "card-green",
        badge: "green",
        play: "play-green",
        icon: "tf"
    },
    {
        number: 5,
        title: "Match It",
        file: "exercises/matching.html",
        card: "card-yellow",
        badge: "orange",
        play: "play-orange",
        icon: "matching"
    },
    {
        number: 6,
        title: "One Word",
        file: "exercises/6.html",
        card: "card-pink",
        badge: "pink",
        play: "play-pink",
        icon: "question"
    },
    {
        number: 7,
        title: "Draw a Circle",
        file: "exercises/circle.html",
        card: "card-purple",
        badge: "purple",
        play: "play-purple",
        icon: "circle"
    },
    {
        number: 8,
        title: "Complete It",
        file: "exercises/MissingPart.html",
        card: "card-blue",
        badge: "blue",
        play: "play-blue",
        icon: "complete"
    },
    {
        number: 9,
        title: "Symmetry Check",
        file: "exercises/symmetry-lines.html",
        card: "card-green",
        badge: "green",
        play: "play-green",
        icon: "symmetry"
    },
    {
        number: 10,
        title: "Complete Pattern",
        file: "exercises/pattern.html",
        card: "card-yellow",
        badge: "orange",
        play: "play-orange",
        icon: "pattern"
    },
    {
        number: 11,
        title: "Missing Pattern",
        file: "exercises/missing-patterns.html",
        card: "card-pink",
        badge: "pink",
        play: "play-pink",
        icon: "missing"
    },
    {
        number: 12,
        title: "Identify It",
        file: "exercises/transformations.html",
        card: "card-purple",
        badge: "purple",
        play: "play-purple",
        icon: "identify"
    },
    {
        number: 13,
        title: "Rotate 90°",
        file: "exercises/rotate-90.html",
        card: "card-blue",
        badge: "blue",
        play: "play-blue",
        icon: "rotate"
    },
    {
        number: 14,
        title: "Transform Letters",
        file: "exercises/letter-transformations.html",
        card: "card-green",
        badge: "green",
        play: "play-green",
        icon: "transform"
    }
];


/* =========================================================
   COMPLETION STORAGE
   0 = not completed
   1 = completed
========================================================= */

const STORAGE_KEY = "geometry_14_sections_completed";

let completedSections = loadCompleted();


function loadCompleted() {
    try {
        const saved = JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        );

        if (
            Array.isArray(saved) &&
            saved.length === 14
        ) {
            return saved.map(Boolean);
        }
    } catch (error) {}

    return Array(14).fill(false);
}


function saveCompleted() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(completedSections)
    );
}


/* =========================================================
   ICONS
========================================================= */

function createIcon(type) {

    switch(type) {

        case "curve":
            return `
                <svg class="svg-icon" viewBox="0 0 120 80">
                    <path d="M10 55 C30 15,50 15,70 45 S100 65,112 25"
                        fill="none" stroke="#45BE73" stroke-width="9"
                        stroke-linecap="round"/>
                </svg>
            `;

        case "lines":
            return `
                <svg class="svg-icon" viewBox="0 0 140 90">
                    <line x1="12" y1="25" x2="128" y2="25"
                        stroke="#477DE4" stroke-width="8" stroke-linecap="round"/>
                    <line x1="12" y1="65" x2="128" y2="65"
                        stroke="#477DE4" stroke-width="8" stroke-linecap="round"/>
                    <line x1="62" y1="72" x2="91" y2="14"
                        stroke="#ED5B9A" stroke-width="7" stroke-linecap="round"/>
                </svg>
            `;

        case "shapes":
            return `
                <svg class="svg-icon" viewBox="0 0 150 100">
                    <rect x="10" y="25" width="45" height="45" rx="7" fill="#FFD34E"/>
                    <circle cx="88" cy="48" r="25" fill="#F06C9D"/>
                    <polygon points="120,72 145,28 95,28" fill="#50B8E9"/>
                </svg>
            `;

        case "tf":
            return `
                <svg class="svg-icon" viewBox="0 0 150 90">
                    <circle cx="45" cy="45" r="30" fill="#50BF7B"/>
                    <path d="M30 45 L41 56 L61 33" fill="none"
                        stroke="white" stroke-width="7" stroke-linecap="round"
                        stroke-linejoin="round"/>
                    <circle cx="105" cy="45" r="30" fill="#EF6372"/>
                    <path d="M94 34 L116 56 M116 34 L94 56"
                        stroke="white" stroke-width="7" stroke-linecap="round"/>
                </svg>
            `;

        case "matching":
            return `
                <svg class="svg-icon" viewBox="0 0 150 90">
                    <rect x="10" y="22" width="48" height="48" rx="12" fill="#49A9ED"/>
                    <rect x="92" y="22" width="48" height="48" rx="12" fill="#F178AE"/>
                    <path d="M58 45 H92" stroke="#596B8D" stroke-width="6"
                        stroke-dasharray="7 6"/>
                </svg>
            `;

        case "question":
            return `
                <svg class="svg-icon" viewBox="0 0 120 100">
                    <path d="M20 20 H100 A10 10 0 0 1 110 30 V65
                             A10 10 0 0 1 100 75 H65 L48 91 V75 H20
                             A10 10 0 0 1 10 65 V30 A10 10 0 0 1 20 20Z"
                        fill="white" stroke="#D956A1" stroke-width="5"/>
                    <text x="60" y="61" text-anchor="middle" font-size="43"
                        font-weight="900" fill="#F0A52C">?</text>
                </svg>
            `;

        case "circle":
            return `
                <svg class="svg-icon" viewBox="0 0 130 100">
                    <circle cx="55" cy="48" r="35" fill="none"
                        stroke="#386DBA" stroke-width="8"/>
                    <line x1="83" y1="74" x2="112" y2="92"
                        stroke="#D68A35" stroke-width="9" stroke-linecap="round"/>
                    <line x1="82" y1="73" x2="103" y2="52"
                        stroke="#F06C8A" stroke-width="13" stroke-linecap="round"/>
                </svg>
            `;

        case "complete":
            return `
                <svg class="svg-icon" viewBox="0 0 150 100">
                    <path d="M68 50 C50 10,12 18,20 48 C25 68,47 69,68 50Z"
                        fill="#EF68A2"/>
                    <path d="M82 50 C100 10,138 18,130 48 C125 68,103 69,82 50Z"
                        fill="none" stroke="#596B8D" stroke-width="4"
                        stroke-dasharray="7 6"/>
                    <line x1="75" y1="20" x2="75" y2="82"
                        stroke="#354B76" stroke-width="4"/>
                </svg>
            `;

        case "symmetry":
            return `
                <svg class="svg-icon" viewBox="0 0 150 100">

        case "pattern":

                <svg class="svg-icon" viewBox="0 0 160 90">
                    <circle cx="22" cy="45" r="15" fill="#EF6C9C"/>

        case "missing":
            return `
                <svg class="svg-icon" viewBox="0 0 160 90">
                    <text x="25" y="64" font-size="50" fill="#8059D8">★</text>
                    <text x="72" y="64" font-size="50" fill="#8059D8">★</text>
                    <text x="119" y="64" font-size="50" fill="#687B9E">?</text>
                </svg>
            `;

        case "identify":
            return `
                <svg class="svg-icon" viewBox="0 0 130 110">
                    <circle cx="52" cy="45" r="31" fill="none"
                        stroke="#45AEE8" stroke-width="9"/>
                    <line x1="75" y1="69" x2="108" y2="98"
                        stroke="#E39A42" stroke-width="11" stroke-linecap="round"/>
                </svg>
            `;

        case "rotate":
            return `
                <svg class="svg-icon" viewBox="0 0 150 110">
                    <rect x="58" y="37" width="40" height="40" rx="6" fill="#4AAAE8"/>
                    <path d="M38 48 A45 45 0 0 1 90 18"
                        fill="none" stroke="#397EE0" stroke-width="8"
                        stroke-linecap="round"/>
                    <polygon points="91,18 75,15 87,31" fill="#397EE0"/>
                    <text x="110" y="82" font-size="25" font-weight="900"

        case "transform":
            return `
                <svg class="svg-icon" viewBox="0 0 170 100">
                    <text x="25" y="70" font-size="58" font-weight="900"
                        fill="#ED5C76">A</text>

                    <polygon points="102,43 90,35 90,51" fill="#4E83DC"/>

            `;
    }
}


/* =========================================================
   CREATE CARDS
========================================================= */

const grid = document.getElementById("lessonGrid");

lessons.forEach((lesson) => {

    const card = document.createElement("div");

    card.className = `lesson-card ${lesson.card}`;

    card.innerHTML = `
        <div class="number ${lesson.badge}">
            ${lesson.number}
        </div>

        <div class="icon-area">
            ${createIcon(lesson.icon)}
        </div>

        <div class="card-title">
            ${lesson.title}
        </div>

        <div class="card-bottom">

            <div class="stars" aria-label="Completion stars">
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
            </div>

            <div class="play-btn ${lesson.play}">
                ▶
            </div>

        </div>
    `;

    card.addEventListener("click", () => openActivity(lesson.number));

    lesson.cardElement = card;

    grid.appendChild(card);
});


/* =========================================================
   UPDATE CARD STARS + PROGRESS
========================================================= */

function renderProgress() {

    let completedCount = 0;

    lessons.forEach((lesson, index) => {

        const card = lesson.cardElement;

        if (!card) return;

        const stars = card.querySelectorAll(".star");

        if (completedSections[index]) {

            completedCount++;

            card.classList.add("completed");

            stars.forEach(star => {
                star.classList.add("earned");
            });

        } else {

            card.classList.remove("completed");

            stars.forEach(star => {
                star.classList.remove("earned");
            });
        }
    });


    const percent =
        (completedCount / lessons.length) * 100;


    document.getElementById("progressFill").style.width =
        percent + "%";

    document.getElementById("progressText").textContent =
        `${completedCount} / ${lessons.length}`;
}


/* =========================================================
   MARK A SECTION COMPLETE
=========================================================

   This is the function your activity iframe can trigger.

   Example from section 1:

   window.parent.completeSection(1);

   OR:

   window.parent.postMessage({
       type: "activityCompleted",
       section: 1
   }, "*");

========================================================= */

function completeSection(sectionNumber) {

    const index = Number(sectionNumber) - 1;

    if (
        index < 0 ||
        index >= lessons.length
    ) {
        return;
    }


    completedSections[index] = true;

    saveCompleted();

    renderProgress();
}


/* Make function available to iframe pages */

window.completeSection = completeSection;


/* =========================================================
   RECEIVE COMPLETION FROM IFRAME
========================================================= */

window.addEventListener("message", function(event) {

    const data = event.data;

    if (!data || typeof data !== "object") {
        return;
    }


    if (
        data.type === "activityCompleted" &&
        data.section != null
    ) {

        completeSection(data.section);

    }

});


/* =========================================================
   OPEN ACTIVITY IN IFRAME
========================================================= */

function openActivity(sectionNumber) {

    const lesson =
        lessons[Number(sectionNumber) - 1];

    if (!lesson) return;


    const screen =
        document.getElementById("activityScreen");

    const frame =
        document.getElementById("activityFrame");


    frame.src = lesson.file;

    screen.classList.add("active");

    document.body.style.overflow = "hidden";
}


/* =========================================================
   CLOSE ACTIVITY
========================================================= */

function closeActivity() {

    const screen =
        document.getElementById("activityScreen");

    const frame =
        document.getElementById("activityFrame");


    screen.classList.remove("active");

    frame.src = "";

    document.body.style.overflow = "hidden";
}


/* =========================================================
   HOME
========================================================= */

function goHome() {
    closeActivity();
}


/* =========================================================
   ESCAPE KEY
========================================================= */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeActivity();
    }

});


/* =========================================================
   INITIAL RENDER
========================================================= */

renderProgress();

</script>
