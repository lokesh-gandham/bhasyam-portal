<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shape Quest — Geometry Activities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4F9FC;
    --ink:#23436F;
    --ink-soft:#617895;

    /* Soft pastel colors with clear visibility */
    --cat1-a:#E85D92; --cat1-b:#F6C6D8; --cat1-tint:#FFF0F5;
    --cat2-a:#4CAF78; --cat2-b:#BFE5CC; --cat2-tint:#EFFAF3;
    --cat3-a:#7657C8; --cat3-b:#D2C2EE; --cat3-tint:#F5F1FB;
    --cat4-a:#E69A20; --cat4-b:#F8DFA6; --cat4-tint:#FFF8E7;

    --shadow: 0 10px 24px rgba(44,42,61,0.08);
    --shadow-hover: 0 16px 32px rgba(44,42,61,0.14);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--cream);
    font-family:'Livvic', sans-serif;
    font-weight:400;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }

  h1,h2,h3,h4,p,span,button,.display{
    font-family:'Livvic', sans-serif;
    font-weight:400;
  }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:48px 32px 80px;
  }

  /* ---------- Top banner ---------- */
  .banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    margin-bottom:44px;
    flex-wrap:wrap;
  }
  .banner .title-block h1{
    font-size:2.6rem;
    line-height:1.05;
    margin:0 0 8px;
    font-weight:400;
    color:var(--ink);
  }
  .banner .title-block p{
    margin:0;
    color:var(--ink-soft);
    font-size:1.05rem;
    max-width:46ch;
  }
  .banner-blob{
    width:196px;
    height:196px;
    object-fit: contain;
    flex-shrink:0;
  }

  /* ---------- Category grid (home) ---------- */
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:24px;
  }
  @media (max-width:980px){
    .cat-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:600px){
    .cat-grid{grid-template-columns:1fr;}
    .wrap{padding:32px 20px 64px;}
    .banner .title-block h1{font-size:2.1rem;}
  }

  .cat-card{
    position:relative;
    border-radius:26px;
    padding:20px 24px 26px;
    background: var(--tint);
    box-shadow: 0 5px 0 rgba(35,67,111,.10), 0 10px 22px rgba(35,67,111,.10);
    cursor:pointer;
    border: 3px solid #FFFFFF;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    display:flex;
    flex-direction:column;
    gap:16px;
    min-height:230px;
  }
  .cat-card:hover{
    transform: translateY(-6px);
    box-shadow: 0 7px 0 rgba(35,67,111,.12), 0 15px 28px rgba(35,67,111,.14);
    border-color: var(--accent-a);
  }
  .cat-card:focus-visible{
    outline:3px solid var(--accent-a);
    outline-offset:3px;
  }
  .cat-number{
    position:absolute;
    top:18px;
    right:18px;
    width:34px;
    height:34px;
    border-radius:50%;
    background: var(--accent-a);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Livvic', sans-serif;
    font-weight:400;
    font-size:1.02rem;
    box-shadow:0 4px 10px rgba(0,0,0,.12);
  }
  .cat-icon{
    width:64px;
    height:64px;
    border-radius:18px;
    background: var(--accent-a);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 8px 16px rgba(0,0,0,.10);
  }
  .cat-icon svg{width:34px;height:34px;}
  .cat-card h3{
    margin:0;
    font-size:1.32rem;
    font-weight:400;
    color:var(--ink);
  }
  .cat-card .cat-desc{
    margin:0;
    font-size:.92rem;
    color:var(--ink-soft);
    line-height:1.4;
    flex-grow:1;
  }
  .cat-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:auto;
  }
  .cat-count{
    font-size:.7rem;
    font-weight:400;
    color: var(--accent-a);
    background:white;
    padding:5px 12px;
    border-radius:999px;
  }
  .cat-enter{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:400;
    font-size:.8rem;
    color: var(--ink);
  }
  .cat-enter svg{width:16px;height:16px;transition:transform .18s ease;}
  .cat-card:hover .cat-enter svg{transform:translateX(4px);}

  /* ---------- Category detail view ---------- */
  #category-view{display:none;}
  #category-view.active{display:block;}
  #home-view.hidden{display:none;}

  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:white;
    border:none;
    border-radius:999px;
    padding:10px 18px 10px 14px;
    font-family:'Livvic', sans-serif;
    font-weight:400;
    font-size:.92rem;
    color:var(--ink);
    cursor:pointer;
    box-shadow: 0 5px 0 rgba(35,67,111,.10), 0 10px 22px rgba(35,67,111,.10);
    margin-bottom:28px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .back-btn:hover{transform:translateX(-3px); box-shadow: 0 7px 0 rgba(35,67,111,.12), 0 15px 28px rgba(35,67,111,.14);}
  .back-btn svg{width:16px;height:16px;}

  .cat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    margin-bottom:34px;
  }

  .cat-header-content{
    display:flex;
    align-items:center;
    gap:18px;
    min-width:0;
  }

  .category-page-image{
    width:196px;
    height:196px;
    object-fit:contain;
    flex-shrink:0;
  }
  .cat-header .cat-icon{width:58px;height:58px;flex-shrink:0;}
  .cat-header .cat-icon svg{width:30px;height:30px;}
  .cat-header h2{
    margin:0 0 4px;
    font-size:1.9rem;
    font-weight:400;
  }
  .cat-header p{
    margin:0;
    color:var(--ink-soft);
    font-size:.98rem;
  }

  .quiz-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:22px;
  }
  @media (max-width:980px){
    .quiz-grid{grid-template-columns:repeat(3,1fr);}
    .category-page-image{width:150px;height:150px;}
  }

  @media (max-width:600px){
    .cat-header{
      align-items:flex-start;
    }
    .category-page-image{
      width:110px;
      height:110px;
    }
  }
  @media (max-width:720px){
    .quiz-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:460px){
    .quiz-grid{grid-template-columns:1fr;}
  }

  .quiz-card{
    background: var(--tint);
    border: 3px solid #FFFFFF;
    border-radius:22px;
    padding:24px 20px 20px;
    box-shadow: 0 5px 0 rgba(35,67,111,.10), 0 10px 22px rgba(35,67,111,.10);
    position:relative;
    display:flex;
    flex-direction:column;
    gap:16px;
    min-height:210px;
    cursor:pointer;
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .quiz-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 7px 0 rgba(35,67,111,.12), 0 15px 28px rgba(35,67,111,.14);
  }
  .quiz-number{
    position:absolute;
    top:14px;
    right:14px;
    width:28px;
    height:28px;
    border-radius:50%;
    background: var(--accent-a);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Livvic', sans-serif;
    font-weight:400;
    font-size:.9rem;
    border: var(--accent-a);
  }
  .quiz-icon{
    width:56px;
    height:56px;
    border-radius:16px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.03);
  }
  .quiz-icon svg{width:30px;height:30px;}
  .quiz-card h4{
    margin:0;
    font-size:1.5rem;
    font-weight:400;
    color:var(--ink);
  }
  .start-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background: #FFFFFF;
    color:var(--accent-a);
    border:2px solid var(--accent-a);
    border-radius:999px;
    padding:9px 16px;
    font-family:'Livvic', sans-serif;
    font-weight:400;
    font-size:1rem;
    cursor:pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,.14);
    transition: transform .14s ease, filter .14s ease;
  }
  .start-btn:hover{transform: scale(1.04); filter:brightness(1.05);}
  .start-btn:active{transform: scale(0.98);}
  .start-btn svg{width:14px;height:14px;}


  /* ---------- Activity iframe view ---------- */
  #quiz-view{display:none;position:fixed;inset:0;width:100%;height:100vh;background:var(--cream);z-index:1000;}
  #quiz-view.active{display:block;}
  #quiz-frame{display:block;width:100%;height:100%;border:0;background:white;}
  .quiz-home-btn{
    position:fixed;top:18px;left:18px;z-index:1100;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    min-width:52px;height:46px;padding:0 16px;border:0;border-radius:999px;
    background:#FFFFFF;color:var(--ink);font-family:'Livvic',sans-serif;
    font-size:1rem;font-weight:400;cursor:pointer;
    box-shadow:0 5px 0 rgba(35,67,111,.10),0 10px 22px rgba(35,67,111,.16);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .quiz-home-btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(35,67,111,.12),0 14px 26px rgba(35,67,111,.18);}
  .quiz-home-btn:active{transform:translateY(1px);}
  @media (max-width:600px){
    .quiz-home-btn{top:12px;left:12px;min-width:46px;height:42px;padding:0 13px;font-size:.9rem;}
  }

  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color:white;
    padding:14px 22px;
    border-radius:14px;
    font-weight:400;
    font-size:.92rem;
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
    opacity:0;
    pointer-events:none;
    transition: opacity .22s ease, transform .22s ease;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  /* =========================================================
   LARGE DESKTOP — 1600px TO 1920px
   ========================================================= */
@media (min-width: 1600px) and (max-width: 1920px) {

  .wrap {
    max-width: 1500px;
    padding: 55px 35px 80px;
  }

  /* ---------- Top Banner ---------- */
  .banner {
    margin-bottom: 48px;
    gap: 30px;
  }

  .banner .title-block h1 {
    font-size: 3.2rem;
  }

  .banner .title-block p {
    font-size: 1.15rem;
    max-width: 52ch;
  }

 .banner-blob{
    width:215px;
    height:215px;
    object-fit: contain;
    flex-shrink:0;
  }

  /* ---------- Category Cards ---------- */
  .cat-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 28px;
  }

  .cat-card {
    min-height: 270px;
    padding: 32px 28px 30px;
    border-radius: 28px;
    gap: 18px;
  }

  .cat-number {
    top: 20px;
    right: 20px;
    width: 38px;
    height: 38px;
    font-size: 1.05rem;
  }

  .cat-icon {
    width: 72px;
    height: 72px;
    border-radius: 20px;
  }

  .cat-icon svg {
    width: 38px;
    height: 38px;
  }

  .cat-card h3 {
    font-size: 1.5rem;
  }

  .cat-card .cat-desc {
    font-size: 1rem;
    line-height: 1.45;
  }

  .cat-count {
    font-size: .9rem;
    padding: 6px 14px;
  }

  .cat-enter {
    font-size: .95rem;
  }

  .cat-enter svg {
    width: 18px;
    height: 18px;
  }

  /* ---------- Category Detail Header ---------- */
  .back-btn {
    padding: 11px 20px 11px 16px;
    font-size: 1rem;
    margin-bottom: 32px;
  }

  .cat-header {
    gap: 20px;
    margin-bottom: 38px;
  }

  .category-page-image{
    width:215px;
    height:215px;
  }

  .cat-header .cat-icon {
    width: 66px;
    height: 66px;
  }

  .cat-header .cat-icon svg {
    width: 34px;
    height: 34px;
  }

  .cat-header h2 {
    font-size: 2.15rem;
  }

  .cat-header p {
    font-size: 1.05rem;
  }

  /* ---------- Quiz Cards ---------- */
  .quiz-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 26px;
  }

  .quiz-card {
    min-height: 240px;
    padding: 28px 24px 24px;
    border-radius: 24px;
    gap: 18px;
  }


  .quiz-number {
    top: 16px;
    right: 16px;
    width: 31px;
    height: 31px;
    font-size: .95rem;
  }

  .quiz-icon {
    width: 62px;
    height: 62px;
    border-radius: 17px;
  }

  .quiz-icon svg {
    width: 34px;
    height: 34px;
  }

  .quiz-card h4 {
    font-size: 1.7rem;
  }

  .start-btn {
    padding: 10px 18px;
    font-size: 1.3rem;
  }

  .start-btn svg {
    width: 20px;
    height: 20px;
  }
}
</style>
</head>
<body>

<div class="wrap">

  <!-- ===================== HOME VIEW ===================== -->
  <div id="home-view">
    <div class="banner">
      <div class="title-block">
        <h1>Geometry Fun</h1>
        <p>Explore fun geometry activities in four colorful sets. Pick a set and start learning!</p>
      </div>
      <img class="banner-blob" src="./assets/images/home.png" alt="Shape Quest" />
    </div>

    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <!-- ===================== CATEGORY VIEW ===================== -->
  <div id="category-view">
    <button class="back-btn" id="back-btn">
      🏠 Home
    </button>

    <div class="cat-header" id="cat-header"></div>
    <div class="quiz-grid" id="quiz-grid"></div>
  </div>

</div>


<!-- ===================== ACTIVITY IFRAME VIEW ===================== -->
<div id="quiz-view">
  <button type="button" class="quiz-home-btn" id="quiz-home-btn"
          aria-label="Back to selected category" title="Back to selected category">
    🏠 Home
  </button>
  <iframe id="quiz-frame" title="Geometry Activity" src="about:blank" allow="fullscreen"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------
   Icon set — small inline SVGs, one per activity + category
--------------------------------------------------------- */
const ICON = {
  curve: `<svg viewBox="0 0 48 48" fill="none"><path d="M6 30q6-16 12 0t12 0 12 0" stroke="#4CAF78" stroke-width="4" stroke-linecap="round"/></svg>`,
  lines: `<svg viewBox="0 0 48 48" fill="none"><line x1="8" y1="16" x2="40" y2="16" stroke="#4F8EDB" stroke-width="4" stroke-linecap="round"/><line x1="8" y1="30" x2="40" y2="30" stroke="#4F8EDB" stroke-width="4" stroke-linecap="round"/><line x1="32" y1="8" x2="18" y2="38" stroke="#E875A5" stroke-width="4" stroke-linecap="round"/></svg>`,
  shapes: `<svg viewBox="0 0 48 48" fill="none"><rect x="4" y="14" width="16" height="16" rx="4" fill="#E69A20"/><circle cx="30" cy="16" r="9" fill="#E875A5"/><path d="M30 34l9-16 9 16z" fill="#5AA9E6"/></svg>`,
  check: `<svg viewBox="0 0 48 48" fill="none"><circle cx="15" cy="24" r="13" fill="#4CAF78"/><path d="M9 24l4 4 8-9" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34" cy="24" r="13" fill="#E85D92"/><path d="M29 19l10 10M39 19l-10 10" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>`,
  match: `<svg viewBox="0 0 48 48" fill="none"><rect x="4" y="16" width="14" height="14" rx="4" fill="#5AA9E6"/><circle cx="35" cy="8" r="2" fill="#AEBBD0"/><circle cx="27" cy="8" r="2" fill="#AEBBD0"/><rect x="30" y="16" width="14" height="14" rx="4" fill="#E875A5"/></svg>`,
  question: `<svg viewBox="0 0 48 48" fill="none"><path d="M8 8h32v20H22l-8 8v-8H8z" fill="white" stroke="#E875A5" stroke-width="3"/><text x="24" y="26" font-size="16" font-weight="400" fill="#E69A20" text-anchor="middle" font-family="Livvic, sans-serif">?</text></svg>`,
  circle: `<svg viewBox="0 0 48 48" fill="none"><circle cx="20" cy="20" r="13" stroke="#4F8EDB" stroke-width="4" fill="none"/><line x1="29" y1="29" x2="40" y2="40" stroke="#E3A04C" stroke-width="4" stroke-linecap="round"/></svg>`,
  completeIt: `<svg viewBox="0 0 48 48" fill="none"><ellipse cx="14" cy="24" rx="9" ry="6" fill="#E875A5"/><line x1="26" y1="10" x2="26" y2="38" stroke="#617895" stroke-width="3"/><ellipse cx="38" cy="24" rx="9" ry="6" fill="none" stroke="#AEBBD0" stroke-width="3" stroke-dasharray="4 4"/></svg>`,
  symmetry: `<svg viewBox="0 0 48 48" fill="none"><path d="M24 10c-8 0-14 5-14 12s6 12 14 16c8-4 14-9 14-16s-6-12-14-12z" fill="#E875A5"/><line x1="24" y1="8" x2="24" y2="40" stroke="#617895" stroke-width="3" stroke-dasharray="3 3"/></svg>`,
  pattern: `<svg viewBox="0 0 48 48" fill="none"><circle cx="8" cy="24" r="5" fill="#E875A5"/><rect x="18" y="19" width="10" height="10" rx="3" fill="#5AA9E6"/><circle cx="38" cy="24" r="5" fill="#E875A5"/><rect x="30" y="19" width="10" height="10" rx="3" fill="none" stroke="#AEBBD0" stroke-width="2.5" stroke-dasharray="3 3"/></svg>`,
  missing: `<svg viewBox="0 0 48 48" fill="none"><path d="M8 30l6-14 6 14z" fill="#7657C8" stroke="none"/><path d="M22 30l6-14 6 14z" fill="#7657C8"/><text x="40" y="30" font-size="16" font-weight="400" fill="#E875A5" text-anchor="middle" font-family="Livvic, sans-serif">?</text></svg>`,
  identify: `<svg viewBox="0 0 48 48" fill="none"><circle cx="20" cy="20" r="12" stroke="#5AA9E6" stroke-width="4" fill="none"/><line x1="29" y1="29" x2="40" y2="40" stroke="#E3A04C" stroke-width="4" stroke-linecap="round"/><path d="M14 20a6 6 0 016-6" stroke="#5AA9E6" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  rotate: `<svg viewBox="0 0 48 48" fill="none"><path d="M10 14a14 14 0 1122 8" stroke="#4F8EDB" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M8 6l2 10 10-3z" fill="#4F8EDB"/><rect x="22" y="26" width="14" height="14" rx="3" fill="#5AA9E6"/><text x="42" y="40" font-size="9" fill="#617895" font-family="Livvic, sans-serif" font-weight="400">90°</text></svg>`,
  transform: `<svg viewBox="0 0 48 48" fill="none"><text x="6" y="30" font-size="20" font-weight="400" fill="#E85D92" font-family="Livvic, sans-serif">A</text><path d="M20 24h12" stroke="#5AA9E6" stroke-width="3" stroke-linecap="round"/><path d="M28 19l6 5-6 5" stroke="#5AA9E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="30" font-size="20" font-weight="400" fill="#4CAF78" font-family="Livvic, sans-serif">A</text></svg>`,
};

const CAT_ICON = {
  basics: `<svg viewBox="0 0 48 48" fill="none"><path d="M6 30q6-16 12 0t12 0" stroke="white" stroke-width="4" stroke-linecap="round"/><rect x="30" y="12" width="10" height="10" rx="3" fill="white"/></svg>`,
  logic: `<svg viewBox="0 0 48 48" fill="none"><circle cx="16" cy="24" r="11" fill="white"/><path d="M11 24l3.5 3.5L21 19" stroke="#4CAF78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 18l10 10M40 18L30 28" stroke="white" stroke-width="3.5" stroke-linecap="round"/></svg>`,
  patterns: `<svg viewBox="0 0 48 48" fill="none"><circle cx="9" cy="24" r="5" fill="white"/><rect x="19" y="19" width="10" height="10" rx="3" fill="white"/><circle cx="39" cy="24" r="5" fill="none" stroke="white" stroke-width="2.5" stroke-dasharray="3 3"/></svg>`,
  transforms: `<svg viewBox="0 0 48 48" fill="none"><path d="M10 16a14 14 0 1120 6" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M8 8l2 9 9-3z" fill="white"/><text x="14" y="40" font-size="16" font-weight="400" fill="white" font-family="Livvic, sans-serif">A→A</text></svg>`,
};

/* ---------------------------------------------------------
   Data — the 14 activities, grouped into 4 themed sets
--------------------------------------------------------- */
const CATEGORIES = [
  {
    key: "basics",
    name: "Shapes &amp; Lines",
    desc: "Warm up by spotting curves, lines and basic shapes.",
    accentA: "var(--cat1-a)", accentB: "var(--cat1-b)", tint: "var(--cat1-tint)",

/* ---------------------------------------------------------
   Render: home category cards
--------------------------------------------------------- */
const catGrid = document.getElementById('cat-grid');

CATEGORIES.forEach((cat, i) => {
  const card = document.createElement('div');
  card.className = 'cat-card';
  card.style.setProperty('--accent-a', cat.accentA);
  card.style.setProperty('--accent-b', cat.accentB);
  card.style.setProperty('--tint', cat.tint);
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.innerHTML = `
    <div class="cat-number">${i + 1}</div>
    <div class="cat-icon">${cat.icon}</div>
    <h3>${cat.name}</h3>
    <p class="cat-desc">${cat.desc}</p>
    <div class="cat-meta">
      <span class="cat-count">${cat.activities.length} activities</span>
      <span class="cat-enter">Explore Activities
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </span>
    </div>
  `;
  card.addEventListener('click', () => openCategory(cat.key));
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCategory(cat.key); }
  });
  catGrid.appendChild(card);
});

/* ---------------------------------------------------------
   Render: category detail view
--------------------------------------------------------- */
const homeView = document.getElementById('home-view');
const categoryView = document.getElementById('category-view');
const catHeader = document.getElementById('cat-header');
const quizGrid = document.getElementById('quiz-grid');
const backBtn = document.getElementById('back-btn');
const toast = document.getElementById('toast');

const quizView = document.getElementById('quiz-view');
const quizFrame = document.getElementById('quiz-frame');
const quizHomeBtn = document.getElementById('quiz-home-btn');

let currentCategoryKey = null;

function openCategory(key){
  const cat = CATEGORIES.find(c => c.key === key);
  if (!cat) return;

  currentCategoryKey = key;

  categoryView.style.setProperty('--accent-a', cat.accentA);
  categoryView.style.setProperty('--accent-b', cat.accentB);
  categoryView.style.setProperty('--tint', cat.tint);

  catHeader.innerHTML = `
    <div class="cat-header-content">
      <div class="cat-icon" style="background:${cat.accentB}">${cat.icon}</div>
      <div>
        <h2>${cat.name}</h2>
        <p>${cat.desc}</p>
      </div>
    </div>
    <img class="category-page-image" src="./assets/images/home.png" alt="Geometry Fun" />
  `;

  quizGrid.innerHTML = '';
  cat.activities.forEach((act, i) => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.style.setProperty('--accent-a', cat.accentA);
    card.style.setProperty('--tint', cat.tint);
    card.innerHTML = `
      <div class="quiz-number">${i + 1}</div>
      <div class="quiz-icon" style="border:2px solid ${cat.accentB}; background:#FFFFFF;">${act.icon}</div>
      <h4>${act.title}</h4>
      <div class="start-row">
        <button class="start-btn" data-title="${act.title}" data-link="${act.link}">
          Play
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
    `;
    quizGrid.appendChild(card);
  });

  homeView.classList.add('hidden');
  categoryView.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

backBtn.addEventListener('click', () => {
  quizFrame.src = 'about:blank';
  quizView.classList.remove('active');
  document.body.style.overflow = '';

  categoryView.classList.remove('active');
  homeView.classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

quizGrid.addEventListener('click', (e) => {
  const btn = e.target.closest('.start-btn');
  if (!btn) return;

  const link = btn.dataset.link;
  if (!link) return;

  quizFrame.src = link;
  homeView.classList.add('hidden');
  categoryView.classList.remove('active');
  quizView.classList.add('active');
  document.body.style.overflow = 'hidden';
});


quizHomeBtn.addEventListener('click', () => {
  quizFrame.src = 'about:blank';
  quizView.classList.remove('active');
  document.body.style.overflow = '';

  if (currentCategoryKey) {
    openCategory(currentCategoryKey);
  } else {
    categoryView.classList.remove('active');
    homeView.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

let toastTimer;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}
</script>
