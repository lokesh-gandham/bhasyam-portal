<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Identify the Curved Lines</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/reuse.css">

<style>
/* =========================================================
   BASE STYLES
   Page-specific styles only.
   Next/Prev, answer popup and final popup are supplied by
   reuse.css and are intentionally NOT redefined here.
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    font-family: "Livvic", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
     background:#fffdf8;
}

.quiz {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    padding: clamp(8px, 1.4vh, 18px) clamp(14px, 2.5vw, 42px) clamp(8px, 1.2vh, 16px);
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1vh, 14px);
    overflow: hidden;
    background:
    radial-gradient(circle at 7% 5%, rgba(238,232,255,.72), transparent 24%),
    radial-gradient(circle at 93% 8%, rgba(222,245,233,.68), transparent 23%),
    linear-gradient(180deg,#fffefb 0%,#fffaf2 100%);
}

.topbar {
    width: 100%;
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 90px minmax(0, 1fr) 90px;
    align-items: start;
    gap: 10px;
}

.icon-btn {
    background: none;
    border: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
}

.icon-circle {
    width: clamp(42px, 4.2vw, 62px);
    height: clamp(42px, 4.2vw, 62px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: clamp(18px, 1.8vw, 27px);
    transition: transform .2s ease;
}

.icon-btn:hover .icon-circle {
    transform: scale(1.06);
}

.icon-circle.home {
    background: linear-gradient(145deg, #8b6fe0, #6f42c1);
    box-shadow: 0 4px 0 #4f2e93;
}

.icon-circle.hint {
    background: linear-gradient(145deg, #ffc94d, #f7a800);
    box-shadow: 0 4px 0 #c17e00;
}

.title-block {
    min-width: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.title {
    margin: 0;
    text-align: center;
    color: #1f2d3d;
    font-size: 26px;
    line-height: 1.12;
}

.quiz-layout {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.5vh, 18px);
}

.question-text {
    flex: 0 0 auto;
    width: min(760px, 88vw);
    align-self: center;
    text-align: left;
    padding-left: 0;
    transform: translateX(-8px);
    margin-bottom: -8px;
    color: #1f2d3d;
    font-size: clamp(20px, 2vw, 30px);
    /* font-weight:400; */
    line-height: 1;
}

.question-text.q1-position {
    padding-left: 0;
}

.question-image-wrap {
    flex: 0 1 auto;
    width: min(760px, 88vw);
    height: clamp(130px, 27vh, 250px);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.question-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
}

/* Q4 art is drawn with a light grey stroke; darken it to match the others */
.question-image[src$="1(4).png"] {
    filter: brightness(0.15) contrast(1.6);
}

.options {
    width: min(1100px, 94vw);
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(10px, 2vw, 24px);
    flex: 0 0 auto;
    padding: clamp(4px, 0.5vh, 10px);
}

.option-btn {
    min-width: 0;
    height: clamp(60px, 8vh, 80px);
    border: 3px solid #e2d5f5;
    border-radius: 16px;
    background: linear-gradient(145deg, #ffffff, #f8f6ff);
    color: #1f2d3d;
    font-family: "Livvic", sans-serif;
    font-size: clamp(17px, 1.8vw, 26px);
    /* font-weight:400; */
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(111, 66, 193, 0.08);
    letter-spacing: 0.3px;
    padding: 0 10px;
}

/* Option decorative gradient overlay */
.option-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(145deg, rgba(111, 66, 193, 0.04), rgba(111, 66, 193, 0.01));
    opacity: 0;
    transition: opacity 0.3s ease;
    border-radius: 16px;
    pointer-events: none;
}

.option-btn:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.02);
    border-color: #8b6fe0;
    box-shadow: 0 8px 25px rgba(111, 66, 193, 0.15);
}

.option-btn:hover:not(:disabled)::before {
    opacity: 1;
}

.option-btn:active:not(:disabled) {
    transform: translateY(-1px) scale(0.98);
}

.option-btn.selected {
    border-color: #6f42c1;
    background: linear-gradient(145deg, #f2edff, #e8ddff);
    box-shadow: 0 4px 20px rgba(111, 66, 193, 0.2);
    transform: scale(1.02);
}

.option-btn.correct {
    border-color: #29b44c;
    background: linear-gradient(145deg, #eafff0, #d4edda);
    color: #1c7c54;
    box-shadow: 0 4px 20px rgba(41, 180, 76, 0.2);
    transform: scale(1.04);
    padding-right: clamp(28px, 3.2vw, 40px);
}

.option-btn.correct::after {
    content: '✓';
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    font-size: clamp(16px, 1.8vw, 24px);
    color: #29b44c;
    font-weight:400;
}

.option-btn.wrong {
    border-color: #ff4444;
    background: linear-gradient(145deg, #fff0f0, #ffe0e0);
    animation: optionShake .5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 20px rgba(255, 68, 68, 0.15);
    padding-right: clamp(28px, 3.2vw, 40px);
}

.option-btn.wrong::after {
    content: '✕';
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    font-size: clamp(16px, 1.8vw, 24px);
    color: #ff4444;
    font-weight:400;
}

.option-btn:disabled {
    cursor: default;
    opacity: 0.7;
}

.option-btn:disabled:not(.correct):not(.wrong) {
    opacity: 0.5;
    transform: none !important;
}

/* Add subtle number indicators */
.option-btn::before {
    content: attr(data-number);
    position: absolute;
    top: -4px;
    left: 12px;
    font-size: clamp(10px, 0.8vw, 14px);
    color: #c4b5d9;
    font-weight:400;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.option-btn:hover:not(:disabled)::before {
    opacity: 1;
}

@keyframes optionShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-2deg); }
    40% { transform: translateX(8px) rotate(2deg); }
    60% { transform: translateX(-5px) rotate(-1deg); }
    80% { transform: translateX(5px) rotate(1deg); }
}

/* Decorative icon for each option */
.option-btn .option-icon {
    display: inline-block;
    margin-right: 8px;
    font-size: clamp(14px, 1.4vw, 20px);
    opacity: 0.6;
    transition: opacity 0.3s ease;
}

.option-btn:hover:not(:disabled) .option-icon {
    opacity: 1;
}

.option-btn.correct .option-icon {
    opacity: 1;
    color: #29b44c;
}

.option-btn.wrong .option-icon {
    opacity: 1;
    color: #ff4444;
}

/* Hint overlay kept page-specific, matching the supplied reference. */
.hint-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 3500;
    background: rgba(0, 0, 0, 0.25);
}

.hint-overlay.show {
    display: flex;
}

.hint-box {
    width: min(420px, calc(100vw - 32px));
    padding: 26px 28px;
    background: #ffffff;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
    animation: hintPop .35s ease;
}

.hint-box h3 {
    margin: 0 0 10px;
    font-size: clamp(24px, 3vw, 32px);
    font-weight:400;
    color: #e08e00;
}

.hint-box p {
    margin: 0;
    font-size: clamp(16px, 1.6vw, 21px);
    line-height: 1.45;
    color: #1f2d3d;
}

.hint-close {
    margin-top: 18px;
    min-width: 110px;
    height: 44px;
    border: none;
    border-radius: 24px;
    background: linear-gradient(145deg, #ffc94d, #f7a800);
    color: #fff;
    font-family: "Livvic", sans-serif;
    font-size: 17px;
    font-weight:400;
    cursor: pointer;
    box-shadow: 0 4px 0 #c17e00;
}

.hint-close:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #c17e00;
}

@keyframes hintPop {
    from {
        opacity: 0;
        transform: scale(.85);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Keep the reuse.css navigation area in normal flow. */
.controls {
    flex: 0 0 auto;
}

/* =========================================================
   RESPONSIVE MEDIA QUERIES
   Ordered from smallest to largest.
   ========================================================= */

@media (max-width: 400px) {
    .quiz {
        padding: 6px 8px;
        gap: 4px;
    }

    .topbar {
        grid-template-columns: 48px minmax(0, 1fr) 48px;
    }

    .icon-circle {
        width: 34px;
        height: 34px;
        font-size: 14px;
    }

    .title {
        font-size: 14px;
    }

    .question-text {
        width: 94vw;
        transform: translateX(-4px);
        margin-bottom: -5px;
        font-size: 14px;
    }

    .question-image-wrap {
        width: 94vw;
        height: 27vh;
    }

    .options {
        width: 96vw;
        gap: 4px;
        padding: 2px;
    }

    .option-btn {
        height: 38px;
        font-size: 10px;
        border-width: 2px;
        border-radius: 10px;
        padding: 0 6px;
    }

    .option-btn .option-icon {
        font-size: 10px;
        margin-right: 4px;
    }
}

@media (max-width: 600px) {
    .quiz {
        padding: 6px 8px;
        gap: 4px;
    }

    .topbar {
        grid-template-columns: 48px minmax(0, 1fr) 48px;
    }

    .icon-circle {
        width: 38px;
        height: 38px;
        font-size: 16px;
    }

    .title {
        font-size: clamp(15px, 4.5vw, 21px);
    }

    .question-text {
        width: 94vw;
        transform: translateX(-5px);
        margin-bottom: -6px;
        font-size: 17px;
    }

    .question-image-wrap {
        width: 94vw;
        height: 29vh;
    }

    .options {
        width: 96vw;
        gap: 6px;
        padding: 4px;
    }

    .option-btn {
        height: 46px;
        font-size: 12px;
        border-radius: 12px;
        padding: 0 8px;
    }

    .option-btn .option-icon {
        font-size: 12px;
        margin-right: 5px;
    }
}

@media (max-width: 900px) {
    .quiz {
        padding: 8px 12px 8px;
        gap: 5px;
    }

    .topbar {
        grid-template-columns: 55px minmax(0, 1fr) 55px;
    }

    .quiz-layout {
        gap: 8px;
    }

    .question-text {
        width: 92vw;
        transform: translateX(-6px);
        margin-bottom: -7px;
        font-size: 18px;
    }

    .question-image-wrap {
        width: 92vw;
        height: 30vh;
    }

    .options {
        width: 94vw;
        gap: 8px;
        padding: 6px;
    }

    .option-btn {
        height: 50px;
        font-size: 14px;
        border-radius: 14px;
        padding: 0 10px;
    }

    .option-btn .option-icon {
        font-size: 14px;
        margin-right: 6px;
    }
}

@media (min-width: 1200px) {
    .quiz {
        padding-left: 40px;
        padding-right: 40px;
    }

    .question-text {
        width: min(850px, 80vw);
        transform: translateX(-8px);
        margin-bottom: -8px;
        font-size: 28px;
    }

    .question-image-wrap {
        width: min(850px, 80vw);
        height: 32vh;
    }

    .option-btn {
        height: 72px;
        font-size: 24px;
        border-radius: 18px;
        padding: 0 16px;
    }

    .option-btn .option-icon {
        font-size: 20px;
        margin-right: 10px;
    }
}


@media (min-width: 1440px) {

    .question-text {
        width: 900px;
        transform: translateX(-8px);
        margin-bottom: -8px;
        font-size: 40px;
    }

    .question-image-wrap {
        width: 900px;
        height: 34vh;
    }

    .option-btn {
        height: 80px;
        font-size: 27px;
        border-radius: 20px;
        padding: 0 20px;
    }

    .option-btn .option-icon {
        font-size: 22px;
        margin-right: 12px;
    }
}

/* Heading: 30px on laptops (base), 40px on large monitors */
@media (min-width: 1600px) {
    .title {
        font-size: 40px !important;
    }
}
</style>
</head>

<body>

<div class="quiz" id="quizCard">

    <div class="topbar">
        <button class="icon-btn" id="homeBtn" aria-label="Home">
            <span class="icon-circle home"><i class="fa-solid fa-house"></i></span>
        </button>

        <div class="title-block">
           <p class="title">Identify each curve: OC, CC, or SCC.</p>
        </div>

        <button class="icon-btn" id="hintBtn" aria-label="Hint">
            <span class="icon-circle hint"><i class="fa-solid fa-lightbulb"></i></span>
        </button>
    </div>

    <div class="quiz-layout">
        <div class="question-text" id="questionText">Q1.</div>

        <div class="question-image-wrap">
            <img class="question-image" id="questionImage" src="../assets/images/1(1).png" alt="">
        </div>

        <div class="options" id="options"></div>
    </div>

    <div class="controls">
        <button class="prev" id="prevBtn" disabled><i class="fa-solid fa-circle-arrow-left"></i> Prev</button>
        <button class="next" id="nextBtn" disabled>Next <i class="fa-solid fa-circle-arrow-right"></i></button>
    </div>

</div>

<div class="hint-overlay" id="hintOverlay">
    <div class="hint-box">
        <h3>Hint</h3>
        <p id="hintText"></p>
        <button class="hint-close" id="closeHintBtn">Got it!</button>
    </div>
</div>

<div id="answerPopup" class="kid-popup">
    <div class="kid-card">
        <div class="kid-icon" id="popupIcon"></div>
        <h3 id="popupTitle"></h3>
        <p id="popupMsg"></p>
    </div>
</div>

<div id="finalPopup">
    <div class="final-kid-box">
        <h2>🎉 Congratulations!</h2>
        <p id="finalScore"></p>
        <div id="stars"></div>
        <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
</div>

<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* =========================================================
   QUESTION DATA FROM THE PROVIDED WORKSHEET IMAGE
   a = Q1, b = Q2, c = Q3, d = Q4, e = Q5, f = Q6
   ========================================================= */

const QUESTIONS = [
    {
        label: "Q1.",
        image: "1(1).png",
        answer: "SCC",
        hint: "The line joins back to itself without crossing itself, so it is a Simple Closed Curve."
    },
    {
        label: "Q2.",
        image: "1(2).png",
        answer: "OC",
        hint: "Look carefully at the ends of the line. If the line does not join back to its starting point, it is an Open Curve."
    },
    {
        label: "Q3.",
        image: "1(3).png",
        answer: "CC",
        hint: "The line joins back to itself, but it crosses itself. It is not a Simple Closed Curve."
    },
    {
        label: "Q4.",
        image: "1(4).png",
        answer: "OC",
        hint: "This line has two open ends, so it is an Open Curve."
    },
    {
        label: "Q5.",
        image: "1(5).png",
        answer: "SCC",
        hint: "The line joins back to itself without crossing itself. That is a Simple Closed Curve."
    },
    {
        label: "Q6.",
        image: "1(6).png",
        answer: "CC",
        hint: "The curve is closed but crosses itself, so it is a Closed Curve, not a Simple Closed Curve."
    }
];

const OPTIONS = [
    { value: "OC", text: "Open Curve (OC)", icon: "🔓" },
    { value: "CC", text: "Closed Curve (CC)", icon: "🔒" },
    { value: "SCC", text: "Simple Closed Curve (SCC)", icon: "✨" }
];

const total = QUESTIONS.length;
let current = 0;
let score = 0;

const answered = QUESTIONS.map(() => false);

const questionText = document.getElementById("questionText");
const questionImage = document.getElementById("questionImage");
const optionsBox = document.getElementById("options");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

const homeBtn = document.getElementById("homeBtn");
if (window.top !== window.self) homeBtn.style.visibility = "hidden";
const hintBtn = document.getElementById("hintBtn");
const hintOverlay = document.getElementById("hintOverlay");
const closeHintBtn = document.getElementById("closeHintBtn");
const hintText = document.getElementById("hintText");

function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-US";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

function smallConfetti() {
    if (!window.confetti) return;
    confetti({
        particleCount: 40,
        spread: 60,
        origin: { y: 0.7 },
        scalar: 0.8
    });
}

function showPopup(isCorrect) {
    const popup = document.getElementById("answerPopup");
    const icon = document.getElementById("popupIcon");
    const title = document.getElementById("popupTitle");
    const msg = document.getElementById("popupMsg");

    popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
    popup.style.display = "flex";

    if (isCorrect) {
        icon.textContent = "🎉";
        title.textContent = "Correct!";
        msg.textContent = "";
    } else {
        icon.textContent = "🥲";
        title.textContent = "Try again";
        msg.textContent = "";
    }

    clearTimeout(showPopup._t);
    showPopup._t = setTimeout(() => {
        popup.style.display = "none";
    }, 1400);
}

function showFinal() {
    const popup = document.getElementById("finalPopup");

    document.getElementById("finalScore").textContent =
        `Your Score: ${score} / ${total}`;

    document.getElementById("stars").textContent = "⭐".repeat(score);

    popup.style.display = "flex";

    if (window.confetti) {
        confetti({
            particleCount: 150,
            spread: 100,
            origin: { y: 0.5 }
        });

        setTimeout(() => {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }, 300);
    }
}

function renderOptions() {
    optionsBox.innerHTML = "";

    const optionLetters = ['A', 'B', 'C'];

    OPTIONS.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.setAttribute('data-number', optionLetters[index]);
        
        // Create icon span
        const iconSpan = document.createElement("span");
        iconSpan.className = "option-icon";
        iconSpan.textContent = option.icon;
        
        // Create text span
        const textSpan = document.createElement("span");
        textSpan.textContent = option.text;
        
        btn.appendChild(iconSpan);
        btn.appendChild(textSpan);

        if (answered[current]) {
            btn.disabled = true;
            if (option.value === QUESTIONS[current].answer) {
                btn.classList.add("correct");
            }
        }

        btn.addEventListener("click", () => selectAnswer(btn, option.value));
        optionsBox.appendChild(btn);
    });
}

function selectAnswer(button, value) {
    if (answered[current]) return;

    const q = QUESTIONS[current];

    if (value === q.answer) {
        button.classList.add("correct");
        button.disabled = true;

        const buttons = optionsBox.querySelectorAll(".option-btn");
        buttons.forEach(btn => btn.disabled = true);

        answered[current] = true;
        score++;

        correctSound.currentTime = 0;
        correctSound.play().catch(() => {});

        speak("Correct");
        showPopup(true);
        smallConfetti();

        nextBtn.disabled = false;

        if (current === total - 1) {
            nextBtn.disabled = true;
            setTimeout(showFinal, 1000);
        }
    } else {
        button.classList.remove("wrong");
        void button.offsetWidth;
        button.classList.add("wrong");

        wrongSound.currentTime = 0;
        wrongSound.play().catch(() => {});

        speak("Try again");
        showPopup(false);

        setTimeout(() => {
            if (!answered[current]) button.classList.remove("wrong");
        }, 450);
    }
}

function renderQuestion() {
    const q = QUESTIONS[current];

    questionText.textContent = q.label;
    questionText.classList.toggle("q1-position", current === 0);
    questionImage.src = `../assets/images/${q.image}`;
    questionImage.alt = "";

    renderOptions();

    prevBtn.disabled = current === 0;
    nextBtn.disabled = !answered[current] || current === total - 1;
}

prevBtn.addEventListener("click", () => {
    if (current === 0) return;
    current--;
    renderQuestion();
});

nextBtn.addEventListener("click", () => {
    if (nextBtn.disabled) return;

    if (current < total - 1) {
        current++;
        renderQuestion();
    }
});

homeBtn.addEventListener("click", () => {
    window.location.href = "../Grade2_chapter1.html";
});

hintBtn.addEventListener("click", () => {
    hintText.textContent = QUESTIONS[current].hint;
    hintOverlay.classList.add("show");
});

closeHintBtn.addEventListener("click", () => {
    hintOverlay.classList.remove("show");
});

hintOverlay.addEventListener("click", e => {
    if (e.target === hintOverlay) {
        hintOverlay.classList.remove("show");
    }
});

renderQuestion();
</script>

</body>
</html>
