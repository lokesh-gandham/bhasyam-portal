<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Identify the Shape</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/reuse.css">

<style>
*{box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    font-family:"Livvic",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#33424f;
    background:#fffdf8;
}

.quiz{
    width:100%;
    height:100vh;
    height:100dvh;
    padding:clamp(8px,1.4vh,18px) clamp(14px,3vw,48px) clamp(8px,1.2vh,16px);
    display:flex;
    flex-direction:column;
    gap:clamp(6px,1vh,14px);
    overflow:hidden;
    background:
        radial-gradient(circle at 7% 5%,rgba(238,232,255,.72),transparent 24%),
        radial-gradient(circle at 93% 8%,rgba(222,245,233,.68),transparent 23%),
        linear-gradient(180deg,#fffefb 0%,#fffaf2 100%);
}

/* =========================
   HEADER
   ========================= */

.topbar{
    width:100%;
    flex:0 0 auto;
    display:grid;
    grid-template-columns:90px minmax(0,1fr) 90px;
    align-items:start;
    gap:10px;
}

.icon-btn{
    background:none;
    border:0;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
}

.icon-circle{
    width:clamp(42px,4.2vw,62px);
    height:clamp(42px,4.2vw,62px);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:clamp(18px,1.8vw,27px);
    transition:transform .2s ease;
}

.icon-btn:hover .icon-circle{
    transform:scale(1.06);
}

.icon-circle.home{
    background:linear-gradient(145deg,#8b6fe0,#6f42c1);
    box-shadow:0 4px 0 #4f2e93;
}

.icon-circle.hint{
    background:linear-gradient(145deg,#ffc94d,#f7a800);
    box-shadow:0 4px 0 #c17e00;
}

.title-block{
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.title{
    margin:0;
    text-align:center;
    color:#1f2d3d;
    font-size:26px;
    line-height:1.12;
}

/* =========================
   MAIN QUESTION AREA
   ========================= */

.quiz-layout{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(9px,1.2vh,16px);
    overflow:hidden;
}

.question-line{
    width:min(950px,88vw);
    flex:0 0 auto;
    color:#33424f;
    text-align:center;
}

.question-number{
    display:inline;
    margin:0;
    font-size:30px;
    line-height:1.2;
}

.question-statement{
    display:inline;
    margin:0;
    font-size:30px;
    line-height:1.2;
}

/* Image is deliberately kept narrower */
.question-image-wrap{
    width:min(620px,58vw);
    height:clamp(145px,28vh,280px);
    flex:0 1 auto;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:0;
}

.question-image{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
}

/* =========================
   THREE OPTIONS
   ========================= */

.options{
    width:min(760px,70vw);
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:clamp(14px,2vw,26px);
    align-items:center;
    justify-content:center;
}

.option-btn{
    min-width:0;
    height:clamp(60px,8vh,82px);
    border:3px solid #d8cbe9;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px 12px;
    background:linear-gradient(145deg,#ffffff,#f6f1ff);
    color:#3e4350;
    font-family:"Livvic",sans-serif;
    font-size:clamp(17px,1.7vw,24px);
    cursor:pointer;
    box-shadow:0 5px 0 #d0c1e4,0 8px 18px rgba(111,66,193,.08);
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease;
}

.option-btn:nth-child(1){
    background:linear-gradient(145deg,#fff8e9,#fff0ca);
    border-color:#efd79c;
    box-shadow:0 5px 0 #dfc27c,0 8px 18px rgba(210,166,70,.09);
}

.option-btn:nth-child(2){
    background:linear-gradient(145deg,#eef9ff,#def1fb);
    border-color:#b9dcea;
    box-shadow:0 5px 0 #9bc9dc,0 8px 18px rgba(80,150,185,.09);
}

.option-btn:nth-child(3){
    background:linear-gradient(145deg,#f2fff5,#e1f5e7);
    border-color:#c4dfcc;
    box-shadow:0 5px 0 #a7cdb1,0 8px 18px rgba(87,160,111,.09);
}

.option-btn:hover:not(:disabled){
    transform:translateY(-3px);
}

.option-btn:active:not(:disabled){
    transform:translateY(3px);
}

.option-btn.correct{
    border-color:#62aa7c;
    background:linear-gradient(145deg,#eafff0,#d8f2e1);
    color:#397553;
    box-shadow:0 5px 0 #67a87f;
}

.option-btn.wrong{
    border-color:#df8f95;
    background:linear-gradient(145deg,#fff0f0,#ffe0e0);
    color:#a94e57;
    animation:optionShake .42s ease;
}

.option-btn:disabled{
    cursor:default;
}

@keyframes optionShake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-7px)}
    50%{transform:translateX(7px)}
    75%{transform:translateX(-4px)}
}

/* =========================
   HINT
   ========================= */

.hint-overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:3500;
    background:rgba(0,0,0,.25);
}

.hint-overlay.show{
    display:flex;
}

.hint-box{
    width:min(420px,calc(100vw - 32px));
    padding:26px 28px;
    background:#fff;
    border-radius:24px;
    text-align:center;
    box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.hint-box h3{
    margin:0 0 10px;
    font-size:clamp(24px,3vw,32px);
    font-weight:400;
    color:#e08e00;
}

.hint-box p{
    margin:0;
    font-size:clamp(16px,1.6vw,21px);
    line-height:1.45;
    color:#1f2d3d;
}

.hint-close{
    margin-top:18px;
    min-width:110px;
    height:44px;
    border:0;
    border-radius:24px;
    background:linear-gradient(145deg,#ffc94d,#f7a800);
    color:#fff;
    font-family:"Livvic",sans-serif;
    font-size:17px;
    font-weight:400;
    cursor:pointer;
    box-shadow:0 4px 0 #c17e00;
}

.hint-close:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #c17e00;
}

/* =========================
   RESPONSIVE
   ========================= */

@media (max-width:400px){
    .quiz{
        padding:5px 7px;
        gap:3px;
    }

    .topbar{
        grid-template-columns:42px minmax(0,1fr) 42px;
    }

    .icon-circle{
        width:34px;
        height:34px;
        font-size:14px;
    }

    .title{
        font-size:15px;
    }

    .quiz-layout{
        gap:5px;
    }

    .question-line{
        width:96vw;
        gap:5px;
    }

    .question-number{
        font-size:15px;
    }

    .question-statement{
        font-size:13px;
    }

    .question-image-wrap{
        width:min(86vw,330px);
        height:clamp(105px,25vh,145px);
        border-radius:14px;
        padding:3px;
    }

    .options{
        width:96vw;
        gap:7px;
    }

    .option-btn{
        height:48px;
        border-width:2px;
        border-radius:13px;
        font-size:12px;
        padding:5px 4px;
    }

    .controls{
        height:42px;
    }
}

@media (max-width:600px){
    .quiz{
        padding:6px 9px;
        gap:4px;
    }

    .topbar{
        grid-template-columns:46px minmax(0,1fr) 46px;
    }

    .icon-circle{
        width:37px;
        height:37px;
        font-size:15px;
    }

    .title{
        font-size:clamp(16px,4.5vw,21px);
    }

    .quiz-layout{
        gap:6px;
    }

    .question-line{
        width:94vw;
        gap:6px;
    }

    .question-number{
        font-size:16px;
    }

    .question-statement{
        font-size:14px;
    }

    .question-image-wrap{
        width:min(86vw,380px);
        height:clamp(120px,27vh,175px);
        border-radius:16px;
    }

    .options{
        width:94vw;
        gap:8px;
    }

    .option-btn{
        height:54px;
        border-radius:15px;
        font-size:14px;
        padding:5px 5px;
    }

    .controls{
        height:46px;
    }
}

@media (max-width:900px){
    .quiz{
        padding:8px 12px;
        gap:5px;
    }

    .topbar{
        grid-template-columns:55px minmax(0,1fr) 55px;
    }

    .quiz-layout{
        gap:8px;
    }

    .question-line{
        width:92vw;
        gap:8px;
    }

    .question-number{
        font-size:24px;
    }

    .question-statement{
        font-size:24px;
    }

    .question-image-wrap{
        width:min(600px,76vw);
        height:clamp(145px,28vh,220px);
        border-radius:18px;
    }

    .options{
        width:min(650px,88vw);
        gap:12px;
    }

    .option-btn{
        height:62px;
        border-radius:18px;
        font-size:17px;
    }

    .controls{
        height:50px;
    }
}

@media (min-width:1200px){
    .quiz{
        padding-left:40px;
        padding-right:40px;
    }

    .question-line{
        width:min(950px,86vw);
    }

    .question-number{
        font-size:30px;
    }

    .question-statement{
        font-size:30px;
    }

    .question-image-wrap{
        width:620px;
        height:31vh;
    }

    .options{
        width:700px;
        gap:22px;
    }

    .option-btn{
        height:76px;
        font-size:23px;
        border-radius:20px;
    }
}

@media (min-width:1600px){
    .title{
        font-size:40px;
    }
}

@media (min-width:1440px){
    .question-line{
        width:1000px;
    }

    .question-number{
        font-size:30px;
    }

    .question-statement{
        font-size:30px;
    }

    .question-image-wrap{
        width:650px;
        height:32vh;
    }

    .options{
        width:740px;
        gap:24px;
    }

    .option-btn{
        height:82px;
        font-size:25px;
        border-radius:22px;
    }
}

/* Heading text: 30px on laptops (base), 40px on large monitors */
@media (min-width:1600px){
    .question-number{
        font-size:40px;
    }

    .question-statement{
        font-size:40px;
    }
}

/* Short landscape screens */
@media (max-height:560px){
    .quiz{
        padding-top:4px;
        padding-bottom:4px;
    }

    .topbar{
        min-height:40px;
    }

    .icon-circle{
        width:34px;
        height:34px;
        font-size:14px;
    }

    .title{
        font-size:clamp(14px,2.4vw,22px);
    }

    .quiz-layout{
        gap:4px;
    }

    .question-line{
        gap:5px;
    }

    .question-number{
        font-size:26px;
    }

    .question-statement{
        font-size:26px;
    }

    .question-image-wrap{
        height:clamp(100px,27vh,180px);
    }

    .options{
        gap:8px;
    }

    .option-btn{
        height:48px;
        font-size:14px;
    }

    .controls{
        height:38px;
    }
}
</style>
</head>

<body>

<div class="quiz" id="quizCard">

    <div class="topbar">

        <button class="icon-btn" id="homeBtn" aria-label="Home">
            <span class="icon-circle home">
                <i class="fa-solid fa-house"></i>
            </span>
        </button>

        <div class="title-block">
            <p class="title">Identify the Shape</p>
        </div>

        <button class="icon-btn" id="hintBtn" aria-label="Hint">
            <span class="icon-circle hint">
                <i class="fa-solid fa-lightbulb"></i>
            </span>
        </button>

    </div>

    <div class="quiz-layout">

        <div class="question-line">
            <p class="question-number" id="questionNumber">Q1.</p>
            <p class="question-statement" id="questionStatement"></p>
        </div>

        <div class="question-image-wrap">
            <img class="question-image" id="questionImage" src="../assets/images/shape1.png" alt="">
        </div>

        <div class="options" id="options">
            <button class="option-btn" type="button" data-value="Cube">Cube</button>
            <button class="option-btn" type="button" data-value="Sphere">Sphere</button>
            <button class="option-btn" type="button" data-value="Cylinder">Cylinder</button>
        </div>

    </div>

    <div class="controls">

        <button class="prev" id="prevBtn" disabled>
            <i class="fa-solid fa-circle-arrow-left"></i> Prev
        </button>

        <button class="next" id="nextBtn" disabled>
            Next <i class="fa-solid fa-circle-arrow-right"></i>
        </button>

    </div>

</div>

<div class="hint-overlay" id="hintOverlay">
    <div class="hint-box">
        <h3>Hint</h3>
        <p id="hintText"></p>
        <button class="hint-close" id="closeHintBtn">Got it!</button>
    </div>
</div>

<div id="answerPopup" class="kid-popup">
    <div class="kid-card">
        <div class="kid-icon" id="popupIcon"></div>
        <h3 id="popupTitle"></h3>
        <p id="popupMsg"></p>
    </div>
</div>

<div id="finalPopup">
    <div class="final-kid-box">
        <h2>🎉 Congratulations!</h2>
        <p id="finalScore"></p>
        <div id="stars"></div>
        <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
</div>

<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const QUESTIONS = [
    {
        label:"Q1.",
        text:"A shape that has 6 square faces.",
        answer:"Cube",
        options:["Cube","Sphere","Cylinder"],
        image:"../assets/images/cube.png",
        hint:"Think of a solid with six equal square faces."
    },
    {
        label:"Q2.",
        text:"A shape that has a curved face, no edges and vertices.",
        answer:"Sphere",
        options:["Cube","Sphere","Cylinder"],
        image:"../assets/images/sphere.png",
        hint:"Think of a perfectly round solid with no corners."
    },
    {
        label:"Q3.",
        text:"A shape that has 2 circular faces and a curved face.",
        answer:"Cylinder",
        options:["Cube","Sphere","Cylinder"],
        image:"../assets/images/cylinder.png",
        hint:"Think of a solid with two flat circular ends."
    },
    {
        label:"Q4.",
        text:"A shape that has 6 rectangular faces.",
        answer:"Cuboid",
        options:["Cube","Cuboid","Cylinder"],
        image:"../assets/images/cuboid.png",
        hint:"Think of a box-shaped solid with six rectangular faces."
    },
    {
        label:"Q5.",
        text:"A shape that has 2 faces, 1 edge and a vertex.",
        answer:"Cone",
        options:["Cylinder","Cone","Sphere"],
        image:"../assets/images/cone.png",
        hint:"Think of a solid with one circular face and one pointed vertex."
    }
];

const total=QUESTIONS.length;
let current=0;
let score=0;
const answered=QUESTIONS.map(()=>false);

const questionNumber=document.getElementById("questionNumber");
const questionStatement=document.getElementById("questionStatement");
const questionImage=document.getElementById("questionImage");
const optionsBox=document.getElementById("options");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const homeBtn=document.getElementById("homeBtn");
if(window.top!==window.self)homeBtn.style.visibility="hidden";
const hintBtn=document.getElementById("hintBtn");
const hintOverlay=document.getElementById("hintOverlay");
const closeHintBtn=document.getElementById("closeHintBtn");
const hintText=document.getElementById("hintText");

function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-US";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

function smallConfetti(){
    if(!window.confetti)return;
    confetti({
        particleCount:40,
        spread:60,
        origin:{y:.7},
        scalar:.8
    });
}

function showPopup(isCorrect){
    const popup=document.getElementById("answerPopup");
    const icon=document.getElementById("popupIcon");
    const title=document.getElementById("popupTitle");
    const msg=document.getElementById("popupMsg");

    popup.className="kid-popup "+(isCorrect?"kid-correct":"kid-wrong");
    popup.style.display="flex";

    if(isCorrect){
        icon.textContent="🎉";
        title.textContent="Correct!";
        msg.textContent="";
    }else{
        icon.textContent="🥲";
        title.textContent="Try again";
        msg.textContent="";
    }

    clearTimeout(showPopup._t);
    showPopup._t=setTimeout(()=>{
        popup.style.display="none";
    },1400);
}

function showFinal(){
    const popup=document.getElementById("finalPopup");

    document.getElementById("finalScore").textContent=
        `Your Score: ${score} / ${total}`;

    document.getElementById("stars").textContent=
        "⭐".repeat(Math.max(0,Math.min(score,10)));

    popup.style.display="flex";

    if(window.confetti){
        confetti({
            particleCount:150,
            spread:100,
            origin:{y:.5}
        });

        setTimeout(()=>{
            confetti({
                particleCount:100,
                spread:70,
                origin:{y:.6}
            });
        },300);
    }

    if(window.parent && window.parent!==window){
        try{
            window.parent.postMessage({
                type:"activityCompleted",
                section:3
            },"*");
        }catch(e){}
    }
}

function renderOptions(){
    const buttons=optionsBox.querySelectorAll(".option-btn");

    buttons.forEach((button,index)=>{
        const value=QUESTIONS[current].options[index];

        button.textContent=value;
        button.dataset.value=value;
        button.className="option-btn";
        button.disabled=false;

        if(answered[current]){
            button.disabled=true;

            if(button.dataset.value===QUESTIONS[current].answer){
                button.classList.add("correct");
            }
        }

        button.onclick=()=>selectAnswer(button,button.dataset.value);
    });
}

function selectAnswer(button,value){
    if(answered[current])return;

    const q=QUESTIONS[current];

    if(value===q.answer){

        button.classList.add("correct");
        button.disabled=true;

        const buttons=optionsBox.querySelectorAll(".option-btn");
        buttons.forEach(btn=>btn.disabled=true);

        answered[current]=true;
        score++;

        correctSound.currentTime=0;
        correctSound.play().catch(()=>{});

        speak("Correct");
        showPopup(true);
        smallConfetti();

        nextBtn.disabled=false;

        if(current===total-1){
            nextBtn.disabled=true;
            setTimeout(showFinal,1000);
        }

    }else{

        button.classList.remove("wrong");
        void button.offsetWidth;
        button.classList.add("wrong");

        wrongSound.currentTime=0;
        wrongSound.play().catch(()=>{});

        speak("Try again");
        showPopup(false);

        setTimeout(()=>{
            if(!answered[current]){
                button.classList.remove("wrong");
            }
        },450);
    }
}

function renderQuestion(){
    const q=QUESTIONS[current];

    questionNumber.textContent=q.label;
    questionStatement.textContent=q.text;
    questionImage.src=q.image;
    questionImage.alt="";

    renderOptions();

    prevBtn.disabled=current===0;
    nextBtn.disabled=!answered[current]||current===total-1;
}

prevBtn.addEventListener("click",()=>{
    if(current===0)return;
    current--;
    renderQuestion();
});

nextBtn.addEventListener("click",()=>{
    if(nextBtn.disabled)return;

    if(current<total-1){
        current++;
        renderQuestion();
    }
});

homeBtn.addEventListener("click",()=>{
    window.location.href="../Grade2_chapter1.html";
});

hintBtn.addEventListener("click",()=>{
    hintText.textContent=QUESTIONS[current].hint;
    hintOverlay.classList.add("show");
});

closeHintBtn.addEventListener("click",()=>{
    hintOverlay.classList.remove("show");
});

hintOverlay.addEventListener("click",e=>{
    if(e.target===hintOverlay){
        hintOverlay.classList.remove("show");
    }
});

renderQuestion();
</script>

</body>
</html>
