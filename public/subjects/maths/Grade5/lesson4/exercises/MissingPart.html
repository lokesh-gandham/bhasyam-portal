<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror Match — Complete the Figure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/quiz-popup.css">
<script src="../assets/js/quiz-popup.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --paper: #FBF6EA;
    --paper-edge: #E8DFC8;
    --rule-red: #D98A8A;
    --ink: #26344A;
    --ink-soft: #5B6B84;
    --dot: #C7CFDA;
    --mirror: #9AA7B5;
    --pencil: #4A5A72;
    --pencil-soft: #8FA0B8;
    --teal: #2E8C8C;
    --teal-dark: #1F6666;
    --stamp-red: #C0453F;
    --good: #3F7D58;
    --warn: #B4762B;
    --shadow: rgba(38,52,74,0.14);
  }

  *{ box-sizing: border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    height:100dvh;
    overflow:hidden;
    /* background: #E7E0CC; */
    background:
        linear-gradient(
            to bottom,
            #bdefff 0%,
            #e8faff 31%,
            #ffffff 31%,
            #ffffff 100%
        );
    background-image:
      radial-gradient(circle at 1px 1px, rgba(38,52,74,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    font-family:"Livvic",sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    align-items:stretch;
    padding: 10px 14px 12px;
  }

  .page{
    width: 100%;
    max-width: 1180px;
    height:100%;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  header{
    text-align:center;
    margin-bottom: 4px;
    flex:0 0 auto;
  }

  header h1{
    font-family:"Livvic",sans-serif;
    font-weight:400;
    font-size: 26px;
    color: var(--ink);
    margin: 0 0 1px;
    letter-spacing: 0.5px;
  }
  @media (min-width:1600px){ header h1{ font-size:40px; } }

  header p{
    margin:0;
    color: var(--ink-soft);
    font-size: 13px;
    font-weight:400;
  }

  .sheet{
    position:relative;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    border-radius: 10px;
    box-shadow: 0 18px 40px var(--shadow), 0 2px 0 var(--paper-edge);
    padding: 12px 18px 12px 48px;
    overflow:hidden;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
  }

  .holes{
    position:absolute;
    left: 22px;
    top: 0;
    bottom:0;
    width: 10px;
    display:flex;
    flex-direction:column;
    justify-content: space-evenly;
    padding: 24px 0;
  }
  .holes span{
    width:10px; height:10px; border-radius:50%;
    background: #E7E0CC;
    box-shadow: inset 0 2px 3px rgba(38,52,74,0.25);
  }
  .margin-rule{
    position:absolute;
    left: 44px; top:0; bottom:0;
    width:1px;
    background: var(--rule-red);
    opacity:0.55;
  }

  .work-row{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    gap:18px;
    align-items:stretch;
    justify-content:center;
  }

  .side-col{
    flex:0 0 clamp(260px, 27vw, 350px);
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:0;
  }

  .top-row{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:8px;
    flex:0 0 auto;
  }

  .instruction{
    font-family:"Livvic",sans-serif;
    font-weight:400;
    font-size: 14px;
    color: var(--ink);
    background: #fff;
    border: 1.5px dashed var(--dot);
    border-radius: 8px;
    padding: 7px 12px;
    line-height:1.3;
  }

  .tabs{
    display:flex;
    gap: 8px;
  }

  .tab{
    font-family:"Livvic",sans-serif;
    font-weight:400;
    font-size: 15px;
    background: #F1EBDA;
    border: 1.5px solid var(--paper-edge);
    color: var(--ink-soft);
    padding: 7px 14px 6px;
    border-radius: 8px 8px 3px 3px;
    cursor:pointer;
    position:relative;
    transition: transform .12s ease, background .12s ease;
  }
  .tab:hover{ transform: translateY(-2px); }
  .tab.active{
    background: var(--teal);
    color: #fff;
    border-color: var(--teal-dark);
  }
  .tab .check{
    margin-left:4px;
    color: var(--good);
    font-weight:400;
  }
  .tab.active .check{ color:#DFF5E9; }

  .panel-wrap{
    background: #fff;
    border: 1.5px solid var(--paper-edge);
    border-radius: 10px;
    padding: 8px 10px 8px;
    position: relative;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    flex:1 1 auto;
    min-height:0;
    max-width: min(100%, 80vh);
  }

  .panel-title{
    font-family:"Livvic",sans-serif;
    font-weight:400;
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0 6px 4px;
    flex:0 0 auto;
  }

  svg.grid{
    display:block;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    height:100%;
    touch-action: none;
  }

  .dot{ fill: var(--dot); }
  .dot.editable{ cursor:crosshair; pointer-events:auto; }
  .dot.editable:hover{ fill: var(--teal); r:6; }

  #grid > *:not(.dot){ pointer-events: none; }

  .dot.active-dot{ fill: var(--teal); }
  .active-ring{
    fill:none;
    stroke: var(--teal);
    stroke-width: 2.5;
    transform-origin: center;
    transform-box: fill-box;
    animation: pulse-ring 1.1s ease-in-out infinite;
  }
  @keyframes pulse-ring{
    0%   { r:6;  opacity:0.9; }
    70%  { r:11; opacity:0; }
    100% { r:11; opacity:0; }
  }

  .dot.drag-source{ fill: var(--teal); }
  .preview-line{
    stroke: var(--teal);
    stroke-width: 3;
    stroke-dasharray: 5 5;
    stroke-linecap: round;
    pointer-events: none;
  }

  .stamp{
    position:absolute;
    top: 14px;
    right: 18px;
    width: 92px;
    height: 92px;
    border: 3.5px solid var(--stamp-red);
    border-radius: 50%;
    color: var(--stamp-red);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:"Livvic",sans-serif;
    font-weight:400;
    font-size: 13px;
    line-height:1.15;
    transform: rotate(-14deg);
    opacity: 0.9;
    pointer-events:none;
    background: rgba(255,255,255,0.4);
  }
  .stamp[hidden]{ display:none; }

  .controls{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 8px 4px 4px;
    flex:0 0 auto;
  }

  button{
    font-family:"Livvic",sans-serif;
    font-weight:400;
    font-size: 14px;
    border-radius: 8px;
    border: 1.5px solid var(--paper-edge);
    background: #F1EBDA;
    color: var(--ink);
    padding: 7px 14px;
    cursor:pointer;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  button:hover:not(:disabled){ transform: translateY(-1px); box-shadow: 0 3px 8px rgba(38,52,74,0.12); }
  button:disabled{ opacity:0.45; cursor:not-allowed; }

  button.primary{
    background: var(--teal);
    border-color: var(--teal-dark);
    color:#fff;
  }
  button.ghost{
    background: transparent;
  }

  .feedback{
    min-height: 18px;
    margin: 6px 4px 0;
    font-weight: 400;
    font-size: 14.5px;
    flex:0 0 auto;
  }
  .feedback.good{ color: var(--good); }
  .feedback.warn{ color: var(--warn); }

  .nav-buttons{
    display:flex;
    justify-content:space-between;
    margin-top: 8px;
    flex:0 0 auto;
  }

  .nav-buttons button{
    background: var(--teal);
    border-color: var(--teal-dark);
    color:#fff;
  }
  .nav-buttons button:hover:not(:disabled){
    background: var(--teal-dark);
  }
  .nav-buttons button:disabled{
    background: #F1EBDA;
    border-color: var(--paper-edge);
    color: var(--ink-soft);
  }

  .banner{
    text-align:center;
    font-family:"Livvic",sans-serif;
    font-weight:400;
    color: var(--good);
    background: #E7F4EC;
    border: 1.5px dashed var(--good);
    border-radius: 8px;
    padding: 7px;
    margin-top: 8px;
    display:none;
    flex:0 0 auto;
  }
  .banner.show{ display:block; }

  /* Narrow screens: stack the figure above the controls */
  @media (max-width: 820px){
    .work-row{ flex-direction:column; gap:10px; }
    .side-col{ flex:0 0 auto; }
    .top-row{ flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    svg.grid{ height:auto; max-height:44vh; }
  }

  @media (max-width: 480px){
    .sheet{ padding: 22px 16px 18px 46px; }
    .holes{ left: 10px; }
    .margin-rule{ left: 32px; }
    .instruction{ font-size: 14px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Mirror Match</h1>
    <p>Drag between the dots to draw the missing half of each figure</p>
  </header>

  <div class="sheet">
    <div class="holes"><span></span><span></span><span></span></div>
    <div class="margin-rule"></div>

    <div class="work-row">
      <div class="panel-wrap">
        <p class="panel-title" id="panelTitle">Figure a)</p>
        <div class="stamp" id="stamp" hidden>✓<br>SOLVED</div>
        <svg id="grid" class="grid" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <aside class="side-col">
        <div class="top-row">
          <div class="instruction" id="instruction">1. Complete the other part of the figure. Drag from one glowing dot to the other to draw each line.</div>
          <div class="tabs" id="tabs"></div>
        </div>

        <div class="controls">
          <button id="undoBtn" class="ghost">↶ Undo line</button>
          <button id="clearBtn" class="ghost">Clear</button>
          <button id="solutionBtn">Show solution</button>
        </div>

        <p class="feedback" id="feedback"></p>

        <div class="nav-buttons">
          <button id="prevBtn">← Previous</button>
          <button id="nextBtn">Next →</button>
        </div>

        <div class="banner" id="banner">🎉 All three figures completed — nice symmetry work!</div>
      </aside>
    </div>
  </div>
</div>

<script>
(function(){
  // ---- grid geometry ----
  const COLS = 8;      // columns 0..8
  const ROWS = 11;     // rows 0..11
  const MIRROR = 4;    // mirror line column
  const SPACING = 34;
  const MARGIN = 26;
  const reflect = c => 2*MIRROR - c;

  const px = c => MARGIN + c*SPACING;
  const py = r => MARGIN + r*SPACING;

  // ---- level data: given (left-side) figure as an ordered connected path ----
  const rawLevels = [
    { id:'a', given:[[4,2],[1,6],[4,6]] },
    { id:'b', given:[[4,1],[3,2],[2,3],[1,3],[0,3],[1,4],[2,5],[2,6],[2,7],[1,8],[0,9],[1,9],[2,9],[3,8],[4,7]] },
    { id:'c', given:[[4,2],[5,1],[6,3],[7,2],[8,1],[8,2],[8,3],[8,4],[8,5],[7,4],[6,5],[6,6],[6,7],[5,6],[5,7],[5,8],[4,8]] }
  ];

  const levels = rawLevels.map(l => ({
    id: l.id,
    given: l.given,
    answer: l.given.map(([c,r]) => [reflect(c), r]),
    // the half the pupil draws on is whichever side the given figure is NOT on
    givenOnLeft: Math.max(...l.given.map(p => p[0])) <= MIRROR,
    userSegments: [],   // committed [pointA, pointB] pairs, drawn by dragging
    completed: false
  }));

  const editableCols = level => level.givenOnLeft ? [MIRROR, COLS] : [0, MIRROR];

  levels.forEach(l => { l.answerPairs = toPairs(l.answer); });

  let current = 0;
  let showingSolution = false;
  let dragStart = null;
  let previewEl = null;

  // ---- DOM refs ----
  const svg = document.getElementById('grid');
  const tabsEl = document.getElementById('tabs');
  const panelTitle = document.getElementById('panelTitle');
  const stampEl = document.getElementById('stamp');
  const feedbackEl = document.getElementById('feedback');
  const undoBtn = document.getElementById('undoBtn');
  const clearBtn = document.getElementById('clearBtn');
  const solutionBtn = document.getElementById('solutionBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const banner = document.getElementById('banner');

  const viewW = MARGIN*2 + COLS*SPACING;
  const viewH = MARGIN*2 + ROWS*SPACING;
  svg.setAttribute('viewBox', `0 0 ${viewW} ${viewH}`);

  const svgns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    const e = document.createElementNS(svgns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function pointsToPathAttr(points){
    return points.map(([c,r]) => `${px(c)},${py(r)}`).join(' ');
  }

  function keyOf(p){ return p[0] + ',' + p[1]; }
  function segKey(a,b){
    const ka = keyOf(a), kb = keyOf(b);
    return ka < kb ? ka+'|'+kb : kb+'|'+ka;
  }
  function toPairs(points){
    const pairs = [];
    for (let i=0;i<points.length-1;i++) pairs.push([points[i], points[i+1]]);
    return pairs;
  }

  const QP = window.QuizPopup || null;

  function smallConfetti(){
    if (!window.confetti) return;
    confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 }, scalar: 0.8 });
  }

  function bigConfetti(){
    if (!window.confetti) return;
    confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
    setTimeout(() => confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }), 300);
  }

  function evaluate(level){
    const userKeys = level.userSegments.map(([a,b]) => segKey(a,b));
    const matched = level.answerPairs.filter(p => userKeys.includes(segKey(p[0],p[1]))).length;
    const total = level.answerPairs.length;

    if (matched === total && level.userSegments.length === total){
      const wasDone = level.completed;
      level.completed = true;
      feedbackEl.textContent = '✓ Perfect — that\'s a mirror match!';
      feedbackEl.className = 'feedback good';
      if (!wasDone && QP){
        const allDone = levels.every(l => l.completed);
        smallConfetti();
        QP.answer(true, 'Correct!', 'That\'s a perfect mirror match!', 1900,
          allDone ? () => { bigConfetti(); QP.final(levels.length, levels.length); } : null);
      }
      return;
    }
    if (level.userSegments.length === 0){
      feedbackEl.textContent = 'Drag between two dots to draw the first line.';
      feedbackEl.className = 'feedback warn';
      return;
    }
    const [la, lb] = level.userSegments[level.userSegments.length - 1];
    const lastOK = level.answerPairs.some(p => segKey(p[0],p[1]) === segKey(la,lb));
    feedbackEl.textContent = lastOK
      ? `Nice line! ${matched} of ${total} correct so far.`
      : 'That line doesn\'t match the mirror — Undo it and try the glowing dots.';
    feedbackEl.className = 'feedback ' + (lastOK ? 'good' : 'warn');
    if (!lastOK && QP) QP.answer(false, 'Try Again', 'That line is not a mirror match — undo it and try the glowing dots.', 1900);
  }

  function findHintPair(level){
    const userKeys = level.userSegments.map(([a,b]) => segKey(a,b));
    return level.answerPairs.find(p => !userKeys.includes(segKey(p[0],p[1])));
  }

  function render(){
    const level = levels[current];
    svg.innerHTML = '';

    // dot grid
    const [editFrom, editTo] = editableCols(level);
    for (let r=0; r<=ROWS; r++){
      for (let c=0; c<=COLS; c++){
        const editable = c >= editFrom && c <= editTo;
        svg.appendChild(el('circle', {
          cx: px(c), cy: py(r), r: 3.2,
          class: 'dot' + (editable ? ' editable' : ''),
          'data-col': c, 'data-row': r,
          'data-editable': editable ? '1' : '0'
        }));
      }
    }

    // mirror line — solid so it reads as one continuous line running through the dots
    svg.appendChild(el('line', {
      x1: px(MIRROR), y1: py(0), x2: px(MIRROR), y2: py(ROWS),
      stroke: 'var(--mirror)', 'stroke-width': 2.5
    }));

    // given figure (ink)
    svg.appendChild(el('polyline', {
      points: pointsToPathAttr(level.given),
      fill: 'none', stroke: 'var(--ink)', 'stroke-width': 4,
      'stroke-linecap':'round', 'stroke-linejoin':'round'
    }));
    level.given.forEach(([c,r]) => {
      svg.appendChild(el('circle', { cx:px(c), cy:py(r), r:4.5, fill:'var(--ink)' }));
    });

    // solution overlay
    if (showingSolution){
      svg.appendChild(el('polyline', {
        points: pointsToPathAttr(level.answer),
        fill:'none', stroke:'var(--good)', 'stroke-width':4,
        'stroke-dasharray':'3 7', 'stroke-linecap':'round', 'stroke-linejoin':'round',
        opacity:0.85
      }));
    }

    // user drawing — each dragged segment coloured live against the mirrored answer
    const answerKeys = level.answerPairs.map(p => segKey(p[0],p[1]));
    level.userSegments.forEach(([a,b]) => {
      const correct = answerKeys.includes(segKey(a,b));
      svg.appendChild(el('line', {
        x1: px(a[0]), y1: py(a[1]), x2: px(b[0]), y2: py(b[1]),
        stroke: correct ? 'var(--good)' : 'var(--warn)',
        'stroke-width': 4, 'stroke-linecap':'round'
      }));
      [a,b].forEach(([c,r]) => {
        svg.appendChild(el('circle', { cx:px(c), cy:py(r), r:4.5, fill: correct ? 'var(--good)' : 'var(--warn)' }));
      });
    });

    // guided hint — pulse the two dots that make up the next missing line
    if (!level.completed && !showingSolution){
      const hintPair = findHintPair(level);
      if (hintPair){
        hintPair.forEach(([c,r]) => {
          svg.appendChild(el('circle', { cx: px(c), cy: py(r), r: 6, class: 'active-ring' }));
          svg.appendChild(el('circle', { cx: px(c), cy: py(r), r: 4.5, fill: 'var(--teal)' }));
        });
      }
    }

    // chrome
    panelTitle.textContent = `Figure ${level.id})`;
    stampEl.hidden = !level.completed;
    undoBtn.disabled = level.userSegments.length === 0 || level.completed;
    clearBtn.disabled = level.userSegments.length === 0 || level.completed;
    solutionBtn.textContent = showingSolution ? 'Hide solution' : 'Show solution';
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === levels.length - 1;

    renderTabs();
    banner.classList.toggle('show', levels.every(l => l.completed));
  }

  function renderTabs(){
    tabsEl.innerHTML = '';
    levels.forEach((level, i) => {
      const b = document.createElement('button');
      b.className = 'tab' + (i === current ? ' active' : '');
      b.type = 'button';
      b.innerHTML = level.id + ')' + (level.completed ? '<span class="check">✓</span>' : '');
      b.addEventListener('click', () => {
        current = i;
        showingSolution = false;
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';
        render();
      });
      tabsEl.appendChild(b);
    });
  }

  // ---- drag-to-connect ----
  function svgPoint(evt){
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  // ---- robust drag-to-connect ----
  // Do not depend on the tiny SVG circle being the exact pointer target.
  // Convert the pointer position to the nearest editable grid dot instead.
  function nearestEditablePoint(clientX, clientY){
    if (clientX == null || clientY == null) return null;
    const p = svgPoint({clientX, clientY});
    const [editFrom, editTo] = editableCols(levels[current]);
    let best = null;
    let bestDist = Infinity;

    for (let r = 0; r <= ROWS; r++){
      for (let c = editFrom; c <= editTo; c++){
        const dx = p.x - px(c);
        const dy = p.y - py(r);
        const d = Math.hypot(dx, dy);
        if (d < bestDist){
          bestDist = d;
          best = [c, r];
        }
      }
    }

    // Generous hit radius makes the dots easy to use on mouse and touch.
    return best && bestDist <= 18 ? best : null;
  }

  svg.addEventListener('pointerdown', e => {
    const point = nearestEditablePoint(e.clientX, e.clientY);
    const level = levels[current];

    if (!point || level.completed) return;

    e.preventDefault();
    dragStart = point;

    try { svg.setPointerCapture(e.pointerId); } catch(err) {}

    previewEl = el('line', {
      x1: px(dragStart[0]), y1: py(dragStart[1]),
      x2: px(dragStart[0]), y2: py(dragStart[1]),
      class: 'preview-line'
    });
    svg.appendChild(previewEl);
  });

  svg.addEventListener('pointermove', e => {
    if (!dragStart || !previewEl) return;
    e.preventDefault();
    const p = svgPoint(e);
    previewEl.setAttribute('x2', p.x);
    previewEl.setAttribute('y2', p.y);
  });

  function finishDrag(clientX, clientY){
    if (!dragStart) return;

    const start = dragStart;
    const end = nearestEditablePoint(clientX, clientY);

    dragStart = null;
    if (previewEl){ previewEl.remove(); previewEl = null; }

    if (end && !(end[0] === start[0] && end[1] === start[1])){
      const level = levels[current];
      level.userSegments.push([start, end]);
      evaluate(level);
    }

    render();
  }

  svg.addEventListener('pointerup', e => {
    e.preventDefault();
    finishDrag(e.clientX, e.clientY);
  });

  svg.addEventListener('pointercancel', e => {
    finishDrag(null, null);
  });

  undoBtn.addEventListener('click', () => {
    levels[current].userSegments.pop();
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    render();
  });

  clearBtn.addEventListener('click', () => {
    levels[current].userSegments = [];
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    render();
  });

  solutionBtn.addEventListener('click', () => {
    showingSolution = !showingSolution;
    render();
  });

  prevBtn.addEventListener('click', () => {
    if (current > 0){
      current--;
      showingSolution = false;
      feedbackEl.textContent = '';
      feedbackEl.className = 'feedback';
      render();
    }
  });

  nextBtn.addEventListener('click', () => {
    if (current < levels.length - 1){
      current++;
      showingSolution = false;
      feedbackEl.textContent = '';
      feedbackEl.className = 'feedback';
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
