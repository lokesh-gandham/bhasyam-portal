<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Complete the Pattern</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/reuse.css">

<style>
/* =========================================================
   BASE STYLES
   Shared Prev/Next + popups are supplied by reuse.css.
   ========================================================= */
*{box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    font-family:"Livvic",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#33424f;
    background:#fffdf8;
}

.quiz{
    width:100%;
    height:100vh;
    height:100dvh;
    padding:clamp(8px,1.5vh,18px) clamp(14px,3.2vw,52px) clamp(8px,1.2vh,16px);
    display:flex;
    flex-direction:column;
    gap:clamp(5px,1vh,13px);
    overflow:hidden;
    background:
        radial-gradient(circle at 8% 10%,rgba(234,226,255,.55),transparent 24%),
        radial-gradient(circle at 92% 12%,rgba(222,245,232,.52),transparent 22%),
        linear-gradient(180deg,#fffefb,#fffaf2);
}

/* =========================================================
   HEADER
   ========================================================= */
.topbar{
    width:100%;
    flex:0 0 auto;
    display:grid;
    grid-template-columns:90px minmax(0,1fr) 90px;
    align-items:start;
    gap:10px;
}

.icon-btn{
    background:none;
    border:0;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
}

.icon-circle{
    width:clamp(42px,4.2vw,62px);
    height:clamp(42px,4.2vw,62px);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:clamp(18px,1.8vw,27px);
    transition:transform .2s ease;
}

.icon-btn:hover .icon-circle{transform:scale(1.06)}

.icon-circle.home{
    background:linear-gradient(145deg,#8b6fe0,#6f42c1);
    box-shadow:0 4px 0 #4f2e93;
}

.icon-circle.hint{
    background:linear-gradient(145deg,#ffc94d,#f7a800);
    box-shadow:0 4px 0 #c17e00;
}

.title-block{
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.title{
    margin:0;
    text-align:center;
    color:#1f2d3d;
    font-size:30px;
    line-height:1.12;
    /* font-weight:400; */
}

/* =========================================================
   ACTIVITY AREA
   ========================================================= */
.quiz-layout{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:visible;
    position:relative;
}

.controls{
    flex:0 0 auto;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(18px,3vw,42px);
    padding-top:clamp(2px,0.7vh,8px);
}

.controls .prev,
.controls .next{
    position:static !important;
    left:auto !important;
    right:auto !important;
    top:auto !important;
    bottom:auto !important;
    margin:0 !important;
}

.pattern-area{
    width:min(1180px,91vw);
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(15px,2.4vh,30px);
    overflow:visible;
}

/* Q1 is offset slightly from the far-left edge, but remains
   visually balanced in the full activity area. */
.question-heading{
    width:min(1080px,86vw);
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:12px;
    padding-left:clamp(18px,4vw,62px);
    margin:0 auto;
}

.question-number{
    margin:0;
    color:#6653a2;
    font-size:30px;
    font-weight:400;
    line-height:1;
}

/* =========================================================
   NUMBER TILES
   ========================================================= */
.sequence{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(9px,1.45vw,25px);
    overflow:visible;
    position:relative;
    z-index:1;
}

.number-tile{
    position:relative;
    flex:0 0 auto;
    width:clamp(72px,7.4vw,108px);
    height:clamp(72px,9.2vh,98px);
    border-radius:20px;
    border:2px solid #d9cbe9;
    background:linear-gradient(145deg,#ffffff,#f4effd);
    box-shadow:0 5px 0 #d0c2e2,0 9px 18px rgba(92,69,132,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#35465b;
    font-size:clamp(20px,2vw,29px);
    line-height:1;
    transition:transform .18s ease,box-shadow .18s ease;
}

.number-tile:nth-child(3n+1){
    background:linear-gradient(145deg,#fffdf3,#fff4d8);
    border-color:#ead89e;
    box-shadow:0 5px 0 #ddc681,0 9px 18px rgba(191,148,56,.08);
}

.number-tile:nth-child(3n+2){
    background:linear-gradient(145deg,#effaff,#e1f3fb);
    border-color:#bddce7;
    box-shadow:0 5px 0 #a0cbd9,0 9px 18px rgba(64,135,162,.08);
}

.number-tile:nth-child(3n){
    background:linear-gradient(145deg,#f4fff5,#e5f5e8);
    border-color:#c4dfcb;
    box-shadow:0 5px 0 #a9cdb1,0 9px 18px rgba(72,139,89,.08);
}

/* Blank tiles are deliberately different from normal number tiles. */
.blank-tile{
    position:relative;
    z-index:2;
    flex:0 0 auto;
    width:clamp(78px,8vw,116px);
    height:clamp(78px,9.7vh,104px);
    border-radius:18px;
    border:3px dashed #e59a68;
    background:linear-gradient(145deg,#fff9ef,#fff1df);
    box-shadow:0 6px 0 #edcfb7;
    display:flex;
    align-items:center;
    justify-content:center;
}

.blank-input{
    width:100%;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#5b4a7c;
    text-align:center;
    font-family:"Livvic",sans-serif;
    font-size:clamp(20px,2vw,29px);
    cursor:pointer;
}

.blank-tile:hover{
    z-index:9998;
    border-color:#8068c7;
    background:linear-gradient(145deg,#fff8e9,#f4edff);
    transform:translateY(-2px);
}

.blank-tile.active,
.blank-tile.wrong{
    z-index:9999;
}

.blank-tile.correct{
    border-style:solid;
    border-color:#6bad81;
    background:linear-gradient(145deg,#eafff0,#daf3e3);
    box-shadow:0 6px 0 #a8d1b5;
}

.blank-tile.wrong{
    border-color:#df8f95;
    background:#fff0f0;
    animation:blankShake .42s ease;
}

.blank-question-mark{
    position:absolute;
    top:-13px;
    right:-10px;
    width:29px;
    height:29px;
    border-radius:50%;
    background:#8068c7;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    pointer-events:none;
    box-shadow:0 3px 0 #65519f;
}

.blank-tile.correct .blank-question-mark{
    background:#63a97c;
    box-shadow:0 3px 0 #478563;
}

@keyframes blankShake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    50%{transform:translateX(6px)}
    75%{transform:translateX(-3px)}
}

/* =========================================================
   CHOICE AREA
   Opens directly under the clicked/hovered blank.
   Two choices are ALWAYS side by side.
   ========================================================= */
.choice-menu{
    position:absolute;
    z-index:99999;
    top:calc(100% + 12px);
    left:50%;
    transform:translateX(-50%);
    display:none;
    grid-template-columns:repeat(2,minmax(82px,1fr));
    gap:8px;
    width:max-content;
    min-width:178px;
    padding:8px;
    border-radius:17px;
    background:rgba(255,255,255,.98);
    border:2px solid #d9cce9;
    box-shadow:0 10px 24px rgba(77,62,116,.18);
}

.blank-tile:hover .choice-menu,
.blank-tile.active .choice-menu{
    display:grid;
}

.choice-btn{
    min-width:78px;
    height:clamp(38px,5vh,48px);
    padding:5px 10px;
    border:2px solid #d3c4e7;
    border-radius:11px;
    background:#f4efff;
    color:#4d4268;
    font-family:"Livvic",sans-serif;
    font-size:clamp(15px,1.35vw,19px);
    cursor:pointer;
    box-shadow:0 3px 0 #d1c3e1;
    transition:transform .15s ease,background .15s ease;
}

.choice-btn:nth-child(2){
    background:#eaf8fb;
    border-color:#b8dce5;
    box-shadow:0 3px 0 #9fcbd6;
}

.choice-btn:hover{
    transform:translateY(-2px);
    background:#eee7ff;
}

.choice-btn:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 #c4b5d7;
}

/* =========================================================
   HINT
   ========================================================= */
.hint-overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:3500;
    background:rgba(0,0,0,.25);
}

.hint-overlay.show{display:flex}

.hint-box{
    width:min(430px,calc(100vw - 32px));
    padding:26px 28px;
    background:#fff;
    border-radius:24px;
    text-align:center;
    box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.hint-box h3{
    margin:0 0 10px;
    font-size:clamp(24px,3vw,32px);
    font-weight:400;
    color:#e08e00;
}

.hint-box p{
    margin:0;
    font-size:clamp(16px,1.6vw,21px);
    line-height:1.45;
    color:#1f2d3d;
}

.hint-close{
    margin-top:18px;
    min-width:110px;
    height:44px;
    border:0;
    border-radius:24px;
    background:linear-gradient(145deg,#ffc94d,#f7a800);
    color:#fff;
    font-family:"Livvic",sans-serif;
    font-size:17px;
    font-weight:400;
    cursor:pointer;
    box-shadow:0 4px 0 #c17e00;
}

/* =========================================================
   RESPONSIVE MEDIA QUERIES
   ========================================================= */
@media (max-width:400px){
    .quiz{padding:5px 7px;gap:3px}
    .controls{gap:10px;padding-top:2px}
    .topbar{grid-template-columns:42px minmax(0,1fr) 42px}
    .icon-circle{width:34px;height:34px;font-size:14px}
    .title{font-size:15px}
    .pattern-area{width:98vw;gap:13px}
    .question-heading{
        width:94vw;
        padding-left:13px;
    }
    .question-number{font-size:17px}
    .sequence{
        width:98vw;
        gap:5px;
    }
    .number-tile{
        width:46px;
        height:49px;
        border-radius:10px;
        font-size:12px;
        border-width:1.5px;
        box-shadow:0 3px 0 rgba(100,80,130,.18);
    }
    .blank-tile{
        width:49px;
        height:52px;
        border-width:2px;
        border-radius:10px;
        box-shadow:0 3px 0 #edcfb7;
    }
    .blank-input{font-size:12px}
    .blank-question-mark{
        width:19px;
        height:19px;
        top:-8px;
        right:-7px;
        font-size:11px;
    }
    .choice-menu{
        min-width:132px;
        gap:4px;
        padding:5px;
        border-radius:10px;
        top:calc(100% + 7px);
    }
    .choice-btn{
        min-width:58px;
        height:28px;
        padding:2px 4px;
        border-radius:7px;
        font-size:10px;
    }
}

@media (max-width:600px){
    .quiz{padding:6px 9px;gap:4px}
    .controls{gap:14px;padding-top:2px}
    .topbar{grid-template-columns:46px minmax(0,1fr) 46px}
    .icon-circle{width:37px;height:37px;font-size:15px}
    .title{font-size:clamp(16px,4.5vw,21px)}
    .pattern-area{width:97vw;gap:15px}
    .question-heading{
        width:94vw;
        padding-left:18px;
    }
    .question-number{font-size:19px}
    .sequence{gap:6px}
    .number-tile{
        width:65px;
        height:67px;
        border-radius:12px;
        font-size:14px;
    }
    .blank-tile{
        width:68px;
        height:70px;
        border-radius:12px;
    }
    .blank-input{font-size:14px}
    .blank-question-mark{
        width:21px;
        height:21px;
        top:-9px;
        right:-7px;
        font-size:12px;
    }
    .choice-menu{
        min-width:150px;
        gap:5px;
        padding:6px;
    }
    .choice-btn{
        min-width:66px;
        height:31px;
        font-size:11px;
    }
}

@media (max-width:900px){
    .quiz{padding:8px 12px;gap:5px}
    .controls{gap:18px;padding-top:3px}
    .topbar{grid-template-columns:55px minmax(0,1fr) 55px}
    .pattern-area{width:95vw;gap:18px}
    .question-heading{
        width:92vw;
        padding-left:24px;
    }
    .question-number{font-size:22px}
    .sequence{gap:9px}
    .number-tile{
        width:78px;
        height:80px;
        border-radius:15px;
        font-size:17px;
    }
    .blank-tile{
        width:81px;
        height:83px;
        border-radius:15px;
    }
    .blank-input{font-size:17px}
    .blank-question-mark{
        width:24px;
        height:24px;
        top:-10px;
        right:-8px;
        font-size:14px;
    }
    .choice-menu{min-width:164px}
    .choice-btn{
        min-width:73px;
        height:35px;
        font-size:13px;
    }
}

@media (min-width:1200px){
    .quiz{padding-left:40px;padding-right:40px}
    .controls{gap:34px;padding-top:4px}
    .pattern-area{width:min(1180px,90vw);gap:22px}
    .question-heading{
        width:min(1080px,84vw);
        padding-left:55px;
    }
    .sequence{gap:24px}
    .number-tile{
        width:104px;
        height:98px;
        font-size:25px;
    }
    .blank-tile{
        width:112px;
        height:104px;
    }
    .blank-input{font-size:25px}
    .choice-menu{min-width:194px}
    .choice-btn{
        min-width:85px;
        height:43px;
        font-size:17px;
    }
}

@media (min-width:1600px){
    .title{font-size:40px}
    .question-number{font-size:40px}
}

@media (min-width:1440px){
    .pattern-area{width:min(1250px,90vw);gap:25px}
    .question-heading{
        width:1160px;
        padding-left:65px;
    }
    .question-number{font-size:30px}
    .sequence{gap:28px}
    .number-tile{
        width:114px;
        height:104px;
        font-size:28px;
    }
    .blank-tile{
        width:122px;
        height:110px;
    }
    .blank-input{font-size:28px}
}

@media (max-height:560px){
    .quiz{padding-top:4px;padding-bottom:4px}
    .controls{gap:14px;padding-top:1px}
    .topbar{min-height:40px}
    .icon-circle{width:34px;height:34px;font-size:14px}
    .pattern-area{gap:8px}
    .question-heading{padding-left:25px}
    .sequence{gap:7px}
    .number-tile{
        width:60px;
        height:59px;
        font-size:15px;
    }
    .blank-tile{
        width:64px;
        height:63px;
    }
    .blank-input{font-size:15px}
    .blank-question-mark{
        width:20px;
        height:20px;
        top:-8px;
        right:-7px;
        font-size:11px;
    }
    .choice-menu{
        top:calc(100% + 5px);
        min-width:140px;
        padding:4px;
    }
    .choice-btn{
        height:28px;
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="quiz" id="quizCard">

    <div class="topbar">

        <button class="icon-btn" id="homeBtn" aria-label="Home">
            <span class="icon-circle home">
                <i class="fa-solid fa-house"></i>
            </span>
        </button>

        <div class="title-block">
            <p class="title">Complete the Pattern</p>
        </div>

        <button class="icon-btn" id="hintBtn" aria-label="Hint">
            <span class="icon-circle hint">
                <i class="fa-solid fa-lightbulb"></i>
            </span>
        </button>

    </div>

    <div class="quiz-layout">
        <div class="pattern-area">
            <div class="question-heading">
                <p class="question-number" id="questionNumber">Q1.</p>
            </div>
            <div class="sequence" id="sequence"></div>
        </div>
    </div>

    <div class="controls">

        <button class="prev" id="prevBtn" disabled>
            <i class="fa-solid fa-circle-arrow-left"></i> Prev
        </button>

        <button class="next" id="nextBtn" disabled>
            Next <i class="fa-solid fa-circle-arrow-right"></i>
        </button>

    </div>

</div>

<div class="hint-overlay" id="hintOverlay">
    <div class="hint-box">
        <h3>Hint</h3>
        <p id="hintText"></p>
        <button class="hint-close" id="closeHintBtn">Got it!</button>
    </div>
</div>

<div id="answerPopup" class="kid-popup">
    <div class="kid-card">
        <div class="kid-icon" id="popupIcon"></div>
        <h3 id="popupTitle"></h3>
        <p id="popupMsg"></p>
    </div>
</div>

<div id="finalPopup">
    <div class="final-kid-box">
        <h2>🎉 Congratulations!</h2>
        <p id="finalScore"></p>
        <div id="stars"></div>
        <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
</div>

<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const QUESTIONS = [
    {
        label:"Q1.",
        items:[
            {value:"52"},
            {value:"56"},
            {value:"65"},
            {value:"70"},
            {blank:true,answer:"78",options:["78","77"]},
            {blank:true,answer:"84",options:["84","83"]}
        ],
        hint:"The difference between alternate numbers is 13 (52, 65, 78, 91). The difference between the next alternate numbers is 14 (56, 70, 84)."
    },
    {
        label:"Q2.",
        items:[
            {value:"AEIM"},
            {value:"DHLP"},
            {value:"GKOS"},
            {value:"JNRV"},
            {blank:true,answer:"MQUY",options:["MQUY","MQVY"]},
            {blank:true,answer:"PTXB",options:["PTXB","QTXB"]}
        ],
        hint:"Leave 2 letters after every letter within each group. Each new group starts 3 letters after the previous one."
    },
    {
        label:"Q3.",
        items:[
            {value:"E"},
            {value:"O"},
            {value:"I"},
            {value:"S"},
            {value:"M"},
            {value:"W"},
            {value:"Q"},
            {value:"A"},
            {blank:true,answer:"U",options:["U","V"]},
            {blank:true,answer:"E",options:["E","F"]}
        ],
        hint:"Read the letters in pairs: EO, IS, MW, QA. The same movement continues."
    },
    {
        label:"Q4.",
        items:[
            {value:"65"},
            {value:"58"},
            {value:"50"},
            {blank:true,answer:"41",options:["41","42"]},
            {value:"31"},
            {blank:true,answer:"20",options:["20","21"]}
        ],
        hint:"The amount subtracted increases by 1 each time: 7, 8, 9, 10, 11."
    },
    {
        label:"Q5.",
        items:[
            {value:"80"},
            {blank:true,answer:"71",options:["71","72"]},
            {value:"62"},
            {value:"53"},
            {value:"44"},
            {blank:true,answer:"35",options:["35","34"]}
        ],
        hint:"Each number goes down by 9."
    },
    {
        label:"Q6.",
        items:[
            {blank:true,answer:"63",options:["63","64"]},
            {value:"69"},
            {value:"75"},
            {value:"81"},
            {value:"87"},
            {blank:true,answer:"93",options:["93","92"]}
        ],
        hint:"Each number goes up by 6."
    }
];

const total=QUESTIONS.length;
let current=0;
let score=0;
let finalShown=false;

const completed=QUESTIONS.map(q=>q.items.map(item=>!item.blank));
const values=QUESTIONS.map(q=>q.items.map(item=>item.blank?"":item.value||""));

const sequence=document.getElementById("sequence");
const questionNumber=document.getElementById("questionNumber");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");

const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");

const homeBtn=document.getElementById("homeBtn");
if(window.top!==window.self)homeBtn.style.visibility="hidden";
const hintBtn=document.getElementById("hintBtn");
const hintOverlay=document.getElementById("hintOverlay");
const hintText=document.getElementById("hintText");
const closeHintBtn=document.getElementById("closeHintBtn");

function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-US";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

function smallConfetti(){
    if(!window.confetti)return;
    confetti({
        particleCount:40,
        spread:60,
        origin:{y:.7},
        scalar:.8
    });
}

function showPopup(isCorrect){
    const popup=document.getElementById("answerPopup");
    const icon=document.getElementById("popupIcon");
    const title=document.getElementById("popupTitle");
    const msg=document.getElementById("popupMsg");

    popup.className="kid-popup "+(isCorrect?"kid-correct":"kid-wrong");
    popup.style.display="flex";

    if(isCorrect){
        icon.textContent="🎉";
        title.textContent="Correct!";
        msg.textContent="";
    }else{
        icon.textContent="🥲";
        title.textContent="Try again";
        msg.textContent="";
    }

    clearTimeout(showPopup._timer);
    showPopup._timer=setTimeout(()=>{
        popup.style.display="none";
    },1400);
}

function showFinal(){
    if(finalShown)return;
    finalShown=true;

    const popup=document.getElementById("finalPopup");

    document.getElementById("finalScore").textContent=
        `Your Score: ${score} / ${total}`;

    document.getElementById("stars").textContent=
        "⭐".repeat(Math.max(0,Math.min(score,5)));

    popup.style.display="flex";

    if(window.confetti){
        confetti({
            particleCount:150,
            spread:100,
            origin:{y:.5}
        });
        setTimeout(()=>{
            confetti({
                particleCount:100,
                spread:70,
                origin:{y:.6}
            });
        },300);
    }

    if(window.parent && window.parent!==window){
        try{
            window.parent.postMessage({
                type:"activityCompleted",
                section:10
            },"*");
        }catch(e){}
    }
}

function questionComplete(){
    return completed[current].every(Boolean);
}

function closeOtherMenus(except){
    document.querySelectorAll(".blank-tile.active").forEach(el=>{
        if(el!==except)el.classList.remove("active");
    });
}

function renderQuestion(){

    const q=QUESTIONS[current];

    questionNumber.textContent=q.label;
    sequence.innerHTML="";

    q.items.forEach((item,index)=>{

        if(!item.blank){

            const tile=document.createElement("div");
            tile.className="number-tile";
            tile.textContent=item.value;
            sequence.appendChild(tile);
            return;
        }

        const blankTile=document.createElement("div");
        blankTile.className="blank-tile";

        if(values[current][index]===item.answer){
            blankTile.classList.add("correct");
        }

        const input=document.createElement("button");
        input.type="button";
        input.className="blank-input";
        input.textContent=values[current][index] || "?";
        input.setAttribute("aria-label","Missing value");

        const questionMark=document.createElement("span");
        questionMark.className="blank-question-mark";
        questionMark.textContent=values[current][index] ? "✓" : "?";

        const menu=document.createElement("div");
        menu.className="choice-menu";

        item.options.forEach(option=>{

            const choice=document.createElement("button");
            choice.type="button";
            choice.className="choice-btn";
            choice.textContent=option;

            choice.addEventListener("click",event=>{
                event.stopPropagation();
                chooseAnswer(index,option,blankTile,input,questionMark);
            });

            menu.appendChild(choice);
        });

        input.addEventListener("click",event=>{
            event.stopPropagation();
            if(input.disabled)return;
            closeOtherMenus(blankTile);
            blankTile.classList.toggle("active");
        });

        blankTile.addEventListener("mouseenter",()=>{
            if(!input.disabled){
                closeOtherMenus(blankTile);
                blankTile.classList.add("active");
            }
        });

        blankTile.appendChild(input);
        blankTile.appendChild(questionMark);
        blankTile.appendChild(menu);
        sequence.appendChild(blankTile);

        if(values[current][index]===item.answer){
            input.disabled=true;
        }
    });

    prevBtn.disabled=current===0;
    nextBtn.disabled=!questionComplete() || current===total-1;
}

function chooseAnswer(index,value,blankTile,input,questionMark){

    const item=QUESTIONS[current].items[index];

    if(value===item.answer){

        values[current][index]=value;
        completed[current][index]=true;

        input.textContent=value;
        input.disabled=true;

        questionMark.textContent="✓";
        blankTile.classList.remove("active","wrong");
        blankTile.classList.add("correct");

        correctSound.currentTime=0;
        correctSound.play().catch(()=>{});

        speak("Correct");
        showPopup(true);
        smallConfetti();

        if(questionComplete()){

            score++;
            nextBtn.disabled=false;

            if(current===total-1){
                nextBtn.disabled=true;
                setTimeout(showFinal,1000);
            }
        }

    }else{

        blankTile.classList.remove("wrong");
        void blankTile.offsetWidth;
        blankTile.classList.add("wrong");

        wrongSound.currentTime=0;
        wrongSound.play().catch(()=>{});

        speak("Try again");
        showPopup(false);

        setTimeout(()=>{
            blankTile.classList.remove("wrong");
        },450);
    }
}

document.addEventListener("click",event=>{
    if(!event.target.closest(".blank-tile")){
        closeOtherMenus(null);
    }
});

prevBtn.addEventListener("click",()=>{
    if(current===0)return;
    current--;
    renderQuestion();
});

nextBtn.addEventListener("click",()=>{
    if(nextBtn.disabled)return;
    if(current<total-1){
        current++;
        renderQuestion();
    }
});

homeBtn.addEventListener("click",()=>{
    window.location.href="../Grade2_chapter1.html";
});

hintBtn.addEventListener("click",()=>{
    hintText.textContent=QUESTIONS[current].hint;
    hintOverlay.classList.add("show");
});

closeHintBtn.addEventListener("click",()=>{
    hintOverlay.classList.remove("show");
});

hintOverlay.addEventListener("click",event=>{
    if(event.target===hintOverlay){
        hintOverlay.classList.remove("show");
    }
});

renderQuestion();
</script>

</body>
</html>
