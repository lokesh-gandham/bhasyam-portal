<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotate 90 Degrees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/quiz-popup.css">
<script src="../assets/js/quiz-popup.js"></script>
<style>
  :root{
    --ink:#2b2b2b;
    --orange:#F2802C;
    --orange-soft:#FDF1E7;
    --green:#2E9E5B;
    --green-soft:#E8F6EE;
    --red:#D94B3E;
    --line:#3a3a3a;
    --card:#ffffff;
    --bg:#FAF8F5;
    --fs:26px;
  }
  @media (min-width:1600px){ :root{ --fs:40px; } }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:'Livvic', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size:var(--fs);
    line-height:1.4;
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; height:100vh;
  }

  .sheet{
    width:100%; max-width:1600px; margin:0 auto;
    padding:.5em clamp(14px, 6.5vw, 84px) .4em;
    display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden;
  }

  .question{
    font-weight:400;
    margin-bottom:.4em;
    flex-shrink:0;
    text-align:center;
  }

  /* ---- one question per screen ---- */
  .stack{flex:1; min-height:0; position:relative;}
  .panel{
    position:absolute; inset:0;
    background:var(--card);
    border:2px solid #ECE6DF;
    border-radius:.6em;
    padding:.4em .6em;
    display:none;
    flex-direction:column;
    transition:border-color .25s, background .25s;
  }
  .panel.on{display:flex; animation:fade .3s ease;}
  .panel.correct{border-color:var(--green); background:var(--green-soft);}
  @keyframes fade{from{opacity:0; transform:translateY(.4em);} to{opacity:1; transform:none;}}

  .label{font-weight:400; font-size:.8em; line-height:1; margin-bottom:.1em;}

  .panes{
    flex:1; min-height:0;
    display:flex; align-items:center; justify-content:center; gap:.6em;
  }
  .pane{
    height:100%; flex:1; min-width:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:.1em;
  }
  .pane-tag{
    font-size:.55em; font-weight:400;
    text-transform:uppercase; color:var(--ink);
  }
  .stage{flex:1; min-height:0; width:100%; position:relative;}
  .stage svg{position:absolute; inset:0; width:100%; height:100%;}

  .stage.box{
    border:2px solid #4A90D9;
    border-radius:.35em;
    background:#fff;
    padding:.15em;
  }
  .card.correct .stage.box, .panel.correct .stage.box{border-color:var(--green);}

  .shape{fill:none; stroke:var(--line); stroke-width:1.4; stroke-linejoin:round;}
  .shape.filled{fill:#fff;}
  .turner{transition:transform .45s cubic-bezier(.3,1.2,.5,1);}

  .tools{
    display:flex; gap:.4em; justify-content:center; align-items:center;
    padding-top:.3em;
  }
  .tool{
    font-family:inherit; font-size:.55em; font-weight:400;
    color:#fff; background:var(--orange);
    border:none; border-radius:2em;
    padding:.35em .95em; cursor:pointer;
    box-shadow:0 2px 6px rgba(242,128,44,.3);
    transition:all .18s ease;
  }
  .tool:hover:not(:disabled){filter:brightness(1.08); transform:translateY(-1px);}
  .tool:active:not(:disabled){transform:translateY(0);}
  .tool.turn{
    font-size:.8em; padding:.3em .7em; line-height:1.1;
    background:#4A90D9;
    box-shadow:0 2px 6px rgba(74,144,217,.3);
  }
  .tool:disabled{opacity:.35; cursor:default;}
  .angle{font-size:.55em; font-weight:400; color:var(--ink); min-width:3.2em; text-align:center;}

  .mark{height:.9em; font-size:.5em; font-weight:400; line-height:1; text-align:center;}
  .panel.correct .mark{color:var(--green);}

  /* ---- nav ---- */
  .nav{
    margin-top:.4em; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between; gap:1em;
  }
  .nav-btn{
    width:130px; height:55px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:inherit; font-size:20px; font-weight:400; letter-spacing:.5px;
    color:#fff; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(145deg, #6ec3e8, #4a9fc9);
    box-shadow:0 6px 0 #2d7aa3, 0 8px 20px rgba(74,159,201,.3);
    transition:all .3s ease;
  }
  .nav-btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 8px 0 #2d7aa3, 0 12px 30px rgba(74,159,201,.4);}
  .nav-btn:active:not(:disabled){transform:translateY(4px); box-shadow:0 2px 0 #2d7aa3, 0 8px 20px rgba(74,159,201,.3);}
  .nav-btn.next{background:linear-gradient(145deg, #f8da64, #f7c307); box-shadow:0 6px 0 #c4a22e, 0 8px 20px rgba(232,196,69,.3);}
  .nav-btn.next:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 8px 0 #c4a22e, 0 12px 30px rgba(232,196,69,.4);}
  .nav-btn.next:active:not(:disabled){transform:translateY(4px); box-shadow:0 2px 0 #c4a22e, 0 8px 20px rgba(232,196,69,.3);}
  .nav-btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  .nav-note{font-size:.5em; color:#a9a29a;}

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:60;}
  .pop{
    position:fixed; inset:0; z-index:70;
    display:none; align-items:center; justify-content:center;
    background:transparent; pointer-events:none;
  }
  .pop.show{display:flex;}
  .pop-box{
    background:#fff; border-radius:.5em; padding:1em 1.6em 1.1em;
    text-align:center; max-width:14em;
    border-top:.28em solid var(--orange);
    box-shadow:0 0.4em 2em rgba(0,0,0,.18);
    animation:pop .35s cubic-bezier(.2,1.4,.5,1);
    pointer-events:auto;
  }
  .pop-box.good{border-top-color:var(--green);}
  .pop-box.bad{border-top-color:var(--red);}
  .pop-icon{font-size:1.6em; line-height:1;}
  .pop-title{font-weight:400; margin:.25em 0 .1em;}
  .pop-box.good .pop-title{color:var(--green);}
  .pop-box.bad .pop-title{color:var(--red);}
  @keyframes pop{from{opacity:0; transform:scale(.7) translateY(1em);} to{opacity:1; transform:none;}}
</style>
</head>
<body>

<div class="sheet">
  <div class="question">Rotate the figure 90&deg; clockwise using the buttons below.</div>
  <div class="stack" id="stack"></div>
  <div class="nav">
    <button class="nav-btn" id="prev">&#8592; Previous</button>
    <span class="nav-note" id="note">Answer this one to move on</span>
    <button class="nav-btn next" id="next">Next &#8594;</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<div class="pop" id="pop">
  <div class="pop-box" id="popBox">
    <div class="pop-icon" id="popIcon">&#127881;</div>
    <div class="pop-title" id="popTitle">Correct!</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var TARGET = 90;

  var ITEMS = [
    { key:'a',
      art:'<path class="shape" d="M14 14 H86 V86 H14 Z"/>' +
          '<path class="shape" d="M14 14 L86 86"/>' +
          '<circle class="shape filled" cx="72" cy="26" r="10"/>' +
          '<rect class="shape filled" x="16" y="64" width="20" height="20"/>' },
    { key:'b',
      art:'<path class="shape" d="M50 20 L16 80 L84 76 Z"/>' +
          '<ellipse class="shape" cx="50" cy="78" rx="34" ry="9"/>' +
          '<rect class="shape filled" x="43" y="6" width="14" height="14"/>' +
          '<circle class="shape filled" cx="84" cy="76" r="8"/>' }
  ];

  var STARTS = [0, 180, 270];
  var stack = document.getElementById('stack');

  ITEMS.forEach(function(item, i){
    var start = STARTS[(Math.random() * STARTS.length) | 0];
    var panel = document.createElement('div');
    panel.className = 'panel';
    panel.setAttribute('data-angle', start);
    panel.setAttribute('data-i', i);
    panel.innerHTML =
      '<div class="label">' + item.key + ')</div>' +
      '<div class="panes">' +
        '<div class="pane">' +
          '<div class="pane-tag">Given figure</div>' +
          '<div class="stage">' +
            '<svg viewBox="0 0 100 100" role="img" aria-label="the given figure">' + item.art + '</svg>' +
          '</div>' +
        '</div>' +
        '<div class="pane">' +
          '<div class="pane-tag">Your answer</div>' +
          '<div class="stage box">' +
            '<svg viewBox="0 0 100 100" role="img" aria-label="your rotated copy">' +
              '<g class="turner" transform="rotate(' + start + ' 50 50)">' + item.art + '</g>' +
            '</svg>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="tools">' +
        '<button class="tool turn" data-turn="-90" title="turn anticlockwise">&#8634;</button>' +
        '<span class="angle">' + start + '&deg;</span>' +
        '<button class="tool turn" data-turn="90" title="turn clockwise">&#8635;</button>' +
        '<button class="tool" data-check="1">Check</button>' +
      '</div>' +
      '<div class="mark"></div>';
    stack.appendChild(panel);
  });

  var panels = Array.prototype.slice.call(document.querySelectorAll('.panel'));

  function paint(panel){
    var a = +panel.getAttribute('data-angle');
    panel.querySelector('.turner').setAttribute('transform', 'rotate(' + a + ' 50 50)');
    panel.querySelector('.angle').innerHTML = ((a % 360) + 360) % 360 + '&deg;';
  }

  function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-US";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}
  if('speechSynthesis' in window){ window.speechSynthesis.getVoices(); }

  var pop = document.getElementById('pop'), popBox = document.getElementById('popBox');
  var popIcon = document.getElementById('popIcon'), popTitle = document.getElementById('popTitle');
  var popTimer = null;

  function showPop(ok, title, ms, onDone){
    QuizPopup.answer(ok, title, '', ms, onDone);
  }

  var finalShown = false;

  var cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  var bits = [], running = false;
  var colors = ['#F2802C','#2E9E5B','#F5C542','#4A90D9','#D94B3E','#8E5BD9'];

  function sizeCanvas(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  function burst(n){
    var cx = cv.width / 2, cy = cv.height / 2;
    for(var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 11;
      bits.push({ x:cx, y:cy, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 4,
                  w:6+Math.random()*8, h:8+Math.random()*10,
                  rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.35,
                  c:colors[(Math.random()*colors.length)|0], life:1 });
    }
    if(!running){ running = true; requestAnimationFrame(tick); }
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i = bits.length - 1; i >= 0; i--){
      var b = bits[i];
      b.vy += 0.32; b.vx *= 0.995; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.life -= 0.006;
      if(b.life <= 0 || b.y > cv.height + 60){ bits.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, b.life));
      ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.fillStyle = b.c;
      ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h); ctx.restore();
    }
    if(bits.length){ requestAnimationFrame(tick); }
    else { running = false; ctx.clearRect(0,0,cv.width,cv.height); }
  }

  /* ---- navigation ---- */
  var at = 0;
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var note    = document.getElementById('note');

  function show(i){
    at = i;
    panels.forEach(function(p, k){
      p.classList.toggle('on', k === i);
    });
    paintNav();
  }

  function paintNav(){
    prevBtn.disabled = (at === 0);

    if(at === panels.length - 1){
      nextBtn.innerHTML = 'Next &#8594;';
      nextBtn.disabled = true;
      note.textContent = panels[at].getAttribute('data-done') === '1' ? 'All done!' : 'Answer this one to finish';
    }else{
      nextBtn.innerHTML = 'Next &#8594;';
      nextBtn.disabled = panels[at].getAttribute('data-done') !== '1';
      note.textContent = panels[at].getAttribute('data-done') === '1' ? 'Tap Next for the next figure' : 'Answer this one to move on';
    }
  }

  prevBtn.addEventListener('click', function(){ if(at > 0) show(at - 1); });
  nextBtn.addEventListener('click', function(){
    if(panels[at].getAttribute('data-done') !== '1') return;
    if(at < panels.length - 1) show(at + 1);
  });

  /* ---- interaction ---- */
  stack.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.tool') : null;
    if(!btn || btn.disabled) return;
    var panel = btn.closest('.panel');
    if(!panel || panel.getAttribute('data-done') === '1') return;

    if(btn.hasAttribute('data-turn')){
      panel.setAttribute('data-angle', +panel.getAttribute('data-angle') + (+btn.getAttribute('data-turn')));
      paint(panel);
      return;
    }

    var a = ((+panel.getAttribute('data-angle') % 360) + 360) % 360;

    if(a === TARGET){
      panel.setAttribute('data-done', '1');
      panel.classList.add('correct');
      Array.prototype.forEach.call(panel.querySelectorAll('.tool'), function(b){ b.disabled = true; });
      panel.querySelector('.mark').innerHTML = '&#10004; Correct';
      burst(130);
      speak('Correct!');
      paintNav();

      var allDone = panels.every(function(p){ return p.getAttribute('data-done') === '1'; });
      if(allDone && !finalShown){
        finalShown = true;
        showPop(true, 'Correct!', 2200, function(){
          burst(240);
          QuizPopup.final(panels.length, panels.length);
        });
      }else{
        showPop(true, 'Correct!', 2200);
      }
    }else{
      showPop(false, 'Try Again', 1800);
      speak('Try again');
    }
  });

  show(0);
})();
</script>
</body>
</html>
