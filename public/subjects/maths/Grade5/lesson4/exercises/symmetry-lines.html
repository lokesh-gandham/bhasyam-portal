<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symmetry Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/quiz-popup.css">
<script src="../assets/js/quiz-popup.js"></script>
<style>
  :root{
    --ink:#2b2b2b;
    --orange:#F2802C;
    --orange-soft:#FDF1E7;
    --green:#2E9E5B;
    --green-soft:#E8F6EE;
    --red:#D94B3E;
    --red-soft:#FBEAE8;
    --line:#3a3a3a;
    --card:#ffffff;
    --bg:#FAF8F5;
    --fs:26px;
  }
  @media (min-width:1600px){ :root{ --fs:40px; } }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%; overflow:hidden;}
  body{
    font-family:'Livvic', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size:var(--fs);
    line-height:1.4;
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  .sheet{
    max-width:1500px;
    width:100%;
    margin:0 auto;
    padding:.6em clamp(14px, 6.5vw, 84px) .5em;
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    overflow:hidden;
  }

  .question{
    display:flex;
    gap:.4em;
    align-items:baseline;
    font-weight:400;
    margin-bottom:.5em;
    flex-shrink:0;
    text-align:center;
    justify-content:center;
  }
  .question .hint{ display:none; }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:.7em;
    flex:1;
    min-height:0;
  }
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--card);
    border:2px solid #ECE6DF;
    border-radius:.6em;
    padding:.4em .5em .5em;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.3em;
    transition:border-color .3s, background .3s;
    flex:1;
    min-height:0;
    overflow:hidden;
  }
  .card.correct{border-color:var(--green); background:var(--green-soft);}
  .card.shake{animation:shakeCard .4s ease;}
  @keyframes shakeCard{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }

  .label{
    align-self:flex-start;
    font-weight:400;
    flex-shrink:0;
  }

  .figure{
    width:100%;
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .figure svg{height:100%; width:100%; max-width:100%; overflow:hidden;}
  .figure svg .shape{fill:none; stroke:var(--line); stroke-width:3.2;}
  .figure svg .axis{stroke:var(--line); stroke-width:3.2;}

  .answer{
    width:100%;
    display:flex;
    gap:.5em;
    justify-content:center;
    flex-shrink:0;
  }
  .opt{
    font-family:inherit;
    font-size:.8em;
    font-weight:400;
    color:var(--orange);
    background:#fff;
    border:2.5px solid var(--orange);
    border-radius:.35em;
    padding:.2em .9em;
    min-width:3em;
    cursor:pointer;
    transition:all .18s ease;
  }
  .opt:hover:not(:disabled){background:var(--orange-soft);}
  .opt.selected{background:var(--orange); color:#fff;}
  .opt:disabled{cursor:default; opacity:.55;}
  .opt.selected:disabled{opacity:1;}
  .card.correct .opt.selected{background:var(--green); border-color:var(--green);}

  .mark{
    height:1em;
    font-size:.72em;
    font-weight:400;
    line-height:1;
    flex-shrink:0;
  }
  .card.correct .mark{color:var(--green);}

  /* ---- confetti + popup ---- */
  #confetti{position:fixed; inset:0; pointer-events:none; z-index:60;}
  .pop{
    position:fixed; inset:0; z-index:70;
    display:none; align-items:center; justify-content:center;
    background:transparent;
  }
  .pop.show{display:flex;}
  .pop-box{
    background:#fff;
    border-radius:.5em;
    padding:1em 1.6em 1.1em;
    text-align:center;
    max-width:14em;
    border-top:.28em solid var(--orange);
    box-shadow:0 .6em 2em rgba(0,0,0,.18);
    animation:pop .35s cubic-bezier(.2,1.4,.5,1);
  }
  .pop-box.good{border-top-color:var(--green);}
  .pop-box.bad{border-top-color:var(--red);}
  .pop-icon{font-size:1.6em; line-height:1;}
  .pop-title{font-weight:400; margin:.25em 0 .1em;}
  .pop-box.good .pop-title{color:var(--green);}
  .pop-box.bad .pop-title{color:var(--red);}
  .pop-msg{font-size:.6em; color:#6d6d6d; line-height:1.5;}
  @keyframes pop{from{opacity:0; transform:scale(.7) translateY(1em);} to{opacity:1; transform:none;}}
</style>
</head>
<body>

<div class="sheet">
  <div class="question">
    <span>Are the given lines symmetrical? Write &lsquo;Yes&rsquo; if symmetrical or &lsquo;No&rsquo; if asymmetrical.
      <span class="hint">Tap Yes or No under each shape.</span>
    </span>
  </div>

  <div class="grid" id="grid">

    <div class="card" data-answer="Yes"
         data-why="The line passes exactly through the middle of the rectangle, so both halves match.">
      <div class="label">a)</div>
      <div class="figure">
        <svg viewBox="0 0 240 150" role="img" aria-label="Rectangle with a vertical line through its centre">
          <rect class="shape" x="30" y="35" width="180" height="80"/>
          <line class="axis" x1="120" y1="15" x2="120" y2="135"/>
        </svg>
      </div>
      <div class="answer">
        <button class="opt" data-value="Yes">Yes</button>
        <button class="opt" data-value="No">No</button>
      </div>
      <div class="mark"></div>
    </div>

    <div class="card" data-answer="No"
         data-why="The slanting line does not pass through the centre, so the two parts are not mirror images.">
      <div class="label">b)</div>
      <div class="figure">
        <svg viewBox="0 0 240 150" role="img" aria-label="Oval with a slanting line across it">
          <ellipse class="shape" cx="120" cy="75" rx="82" ry="55"/>
          <line class="axis" x1="52" y1="46" x2="172" y2="142"/>
        </svg>
      </div>
      <div class="answer">
        <button class="opt" data-value="Yes">Yes</button>
        <button class="opt" data-value="No">No</button>
      </div>
      <div class="mark"></div>
    </div>

    <div class="card" data-answer="No"
         data-why="The horizontal line splits the shape into a triangle and a trapezium, which are not mirror images.">
      <div class="label">c)</div>
      <div class="figure">
        <svg viewBox="0 0 240 150" role="img" aria-label="Pentagon with a horizontal line across it">
          <polygon class="shape" points="120,15 210,65 180,135 60,135 30,65"/>
          <line class="axis" x1="30" y1="65" x2="210" y2="65"/>
        </svg>
      </div>
      <div class="answer">
        <button class="opt" data-value="Yes">Yes</button>
        <button class="opt" data-value="No">No</button>
      </div>
      <div class="mark"></div>
    </div>

  </div>
</div>

<canvas id="confetti"></canvas>

<div class="pop" id="pop">
  <div class="pop-box" id="popBox">
    <div class="pop-icon" id="popIcon">&#127881;</div>
    <div class="pop-title" id="popTitle">Correct!</div>
    <div class="pop-msg" id="popMsg"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var cards   = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var pop     = document.getElementById('pop');
  var popBox  = document.getElementById('popBox');
  var popIcon = document.getElementById('popIcon');
  var popTitle= document.getElementById('popTitle');
  var popMsg  = document.getElementById('popMsg');
  var soundOn = true;
  var score   = 0;
  var popTimer= null;
  var currentCard = null;

  /* ---------- voice ---------- */
  var praise = ['Correct!', 'Well done!', 'That is right!', 'Excellent!'];
  var nudge  = ['Try again.'];

  function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-US";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){};
    window.speechSynthesis.getVoices();
  }

  /* ---------- popup ---------- */
  function showPop(ok, title, msg, ms, onDone){
    QuizPopup.answer(ok, title, msg, ms, onDone);
  }

  /* ---------- confetti ---------- */
  var cv  = document.getElementById('confetti');
  var ctx = cv.getContext('2d');
  var bits = [];
  var running = false;
  var colors = ['#F2802C','#2E9E5B','#F5C542','#4A90D9','#D94B3E','#8E5BD9'];

  function sizeCanvas(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  function burst(n){
    var cx = cv.width / 2, cy = cv.height / 2;
    for(var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2;
      var s = 4 + Math.random() * 11;
      bits.push({
        x:cx, y:cy,
        vx:Math.cos(a) * s, vy:Math.sin(a) * s - 4,
        w:6 + Math.random() * 8, h:8 + Math.random() * 10,
        rot:Math.random() * Math.PI, vr:(Math.random() - 0.5) * 0.35,
        c:colors[(Math.random() * colors.length) | 0],
        life:1
      });
    }
    if(!running){ running = true; requestAnimationFrame(tick); }
  }

  function tick(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    for(var i = bits.length - 1; i >= 0; i--){
      var b = bits[i];
      b.vy += 0.32; b.vx *= 0.995;
      b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      b.life -= 0.006;
      if(b.life <= 0 || b.y > cv.height + 60){ bits.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, b.life));
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = b.c;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    }
    if(bits.length){ requestAnimationFrame(tick); }
    else { running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  }

  function resetCard(card){
    card.removeAttribute('data-done');
    card.classList.remove('correct');
    card.querySelector('.mark').textContent = '';
    var opts = card.querySelectorAll('.opt');
    for(var i = 0; i < opts.length; i++){
      opts[i].disabled = false;
      opts[i].classList.remove('selected');
    }
  }

  /* ---------- answering ---------- */
  function pick(e){
    var btn = e.target.closest ? e.target.closest('.opt') : null;
    if(!btn) return;
    var card = btn.parentNode.parentNode;
    if(card.getAttribute('data-done') === '1') return;

    var ok = btn.getAttribute('data-value') === card.getAttribute('data-answer');

    if(ok){
      card.setAttribute('data-done', '1');
      btn.classList.add('selected');
      var opts = card.querySelectorAll('.opt');
      for(var i = 0; i < opts.length; i++){ opts[i].disabled = true; }
      card.classList.add('correct');
      card.querySelector('.mark').innerHTML = '&#10004; Correct';

      score++;
      burst(120);
      showPop(true, praise[(Math.random() * praise.length) | 0], card.getAttribute('data-why'), 2000);

      var allDone = cards.every(function(c){ return c.getAttribute('data-done') === '1'; });
      if(allDone){
        setTimeout(function(){
          burst(240);
          QuizPopup.final(score, cards.length);
        }, 2400);
      }
    }else{
      btn.classList.add('selected');
      btn.disabled = true;
      card.classList.add('shake');
      showPop(false, nudge[(Math.random() * nudge.length) | 0], 'Try choosing the other option.', 2000, function(){
        card.classList.remove('shake');
        var allOpts = card.querySelectorAll('.opt');
        for(var j = 0; j < allOpts.length; j++){
          allOpts[j].disabled = false;
          allOpts[j].classList.remove('selected');
        }
      });
    }
  }
  document.getElementById('grid').addEventListener('click', pick);
})();
</script>
</body>
</html>
