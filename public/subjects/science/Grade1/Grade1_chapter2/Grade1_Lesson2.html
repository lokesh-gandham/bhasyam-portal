<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            background: #fff;
            /* background: url("assets/images/bg.jpg"); */
            background-size: 100% 100%;
            overflow: hidden;
        }

        .app {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 10px;
            gap: 10px;
            /* background: #e3e1fcec; */
        }

        .sidebar {
            width: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .tab {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 600;
            color: #777;
            cursor: pointer;
            transition: .3s;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .tab i {
            font-size: 25px;
        }

        .tab::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0%;
            height: 4px;
            border-radius: 10px;
            transition: .3s;
        }

        .tab:hover {
            color: #555;
        }

        /* .t1.active {
            color: #ff7eb3;
        }

        .t1.active::after {
            width: 60%;
            background: #ff7eb3;
        }

        .t2.active {
            color: #e9a239;
        }

        .t2.active::after {
            width: 60%;
            background: #e9a239;
        }

        .t3.active {
            color: #43af6e;
        }

        .t3.active::after {
            width: 60%;
            background: #43af6e;
        }

        .t4.active {
            color: #41ace2;
        }

        .t4.active::after {
            width: 60%;
            background: #41ace2;
        } */

        .t1.active,
        .t2.active,
        .t3.active,
        .t4.active {
            color: #ff7eb3;
        }

        .t1.active::after,
        .t2.active::after,
        .t3.active::after,
        .t4.active::after {
            width: 60%;
            background: #ff7eb3;
        }

        .main {
            flex: 1;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .menu-btn {
            display: none;
            position: fixed;
            top: 8px;
            right: 15px;
            font-size: 26px;
            background: #e9a106;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            cursor: pointer;
            z-index: 5000;
        }

        .offcanvas {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: none;
            z-index: 4000;
        }

        .offcanvas.show {
            display: block;
        }

        .panel {
            position: absolute;
            right: 0;
            top: 0;
            width: 220px;
            height: 100%;
            background: #f1f5f9;
            padding: 65px 20px 20px;
            transform: translateX(100%);
            transition: .3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .offcanvas.show .panel {
            transform: translateX(0);
        }

        @media(max-width:1065px) {

            .app {
                flex-direction: column;
            }

            .sidebar {
                display: none;
            }

            .menu-btn {
                display: block;
            }

        }

        @media (min-width: 900px) and (max-height: 800px) {
            .app {
                transform: scaleY(0.95);
                transform-origin: top center;
                height: calc(100vh / 0.95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {
            .app {
                transform: scaleY(0.9);
                transform-origin: top center;
                height: calc(100vh / 0.9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {
            .app {
                transform: scaleY(0.85);
                transform-origin: top center;
                height: calc(100vh / 0.85);
            }
        }

        @media (min-width: 900px) and (max-height: 500px) {
            .app {
                transform: scaleY(0.8);
                transform-origin: top center;
                height: calc(100vh / 0.8);
            }
        }

        @media screen and (min-width: 1025px) and (max-width: 1440px) {

            .sidebar {
                width: 260px;
                gap: 24px;
            }

            .tab {
                font-size: 20px;
            }

            .tab i {
                font-size: 24px;
            }

        }

        @media screen and (min-width: 1441px) and (max-width: 1920px) {

            .sidebar {
                width: 300px;
                gap: 28px;
            }

            .tab {
                font-size: 22px;
            }

            .tab i {
                font-size: 30px;
            }

        }

        @media screen and (min-width: 1921px) {

            .sidebar {
                width: 360px;
                gap: 36px;
            }

            .tab {
                font-size: 26px;
            }

            .tab i {
                font-size: 34px;
            }

            iframe {
                border-radius: 14px;
            }

        }
    </style>
</head>

<body>
<button class="menu-btn" onclick="toggleMenu()">☰</button>

    <div class="app">

        <div class="sidebar">

            <div class="tab t1 active" onclick="openPage(0)">
                <i class="fa-solid fa-check-double"></i>
                <div>Choose Correct</div>
            </div>

            <div class="tab t2" onclick="openPage(1)">
                <i class="fa-solid fa-scale-balanced"></i>
                <div>True / False</div>
            </div>

            <div class="tab t3" onclick="openPage(2)">
                <i class="fa-solid fa-puzzle-piece"></i>
                <div>One Word</div>
            </div>

            <div class="tab t4" onclick="openPage(3)">
                <i class="fa-solid fa-pen-to-square"></i>
                <div>Fill The Blanks</div>
            </div>

        </div>

        <div class="main">
            <iframe id="frame" src="./exercises/mcq.html"></iframe>
        </div>

    </div>

    <div class="offcanvas" id="menu" onclick="toggleMenu()">
        <div class="panel" onclick="event.stopPropagation()">

            <div class="tab t1 active" onclick="mobileOpen(0)">
                <i class="fa-solid fa-check-double"></i>
                <div>Choose Correct</div>
            </div>

            <div class="tab t2" onclick="mobileOpen(1)">
                <i class="fa-solid fa-puzzle-piece"></i>
                <div>True / False</div>
            </div>

            <div class="tab t3" onclick="mobileOpen(2)">
                <i class="fa-solid fa-puzzle-piece"></i>
                <div>One Word</div>
            </div>

            <div class="tab t4" onclick="mobileOpen(3)">
                <i class="fa-solid fa-pen-to-square"></i>
                <div>Fill The Blanks</div>
            </div>

        </div>
    </div>

    <script>

        const tabs = document.querySelectorAll(".sidebar .tab");
        const mobileTabs = document.querySelectorAll(".panel .tab");
        const frame = document.getElementById("frame");

        const pages = [
            "./exercises/mcq.html",
            "./exercises/true_false.html",
            "./exercises/one_word.html",
            "./exercises/FTB.html"
        ];

        function openPage(i) {
            tabs.forEach(t => t.classList.remove("active"));
            mobileTabs.forEach(t => t.classList.remove("active"));
            tabs[i].classList.add("active");
            mobileTabs[i].classList.add("active");
            frame.src = pages[i];
        }

        function toggleMenu() {
            if (window.innerWidth > 1065) return;
            document.getElementById("menu").classList.toggle("show");
        }

        function mobileOpen(i) {
            openPage(i);
            toggleMenu();
        }

    </script>




</body>
</html>
