<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Livvic", sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: url("assets/images/bg.png");
            background-size: 100% 100%;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(255, 193, 227, 0.082);
        }

        .topbar {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
            margin: 0 20px;
        }

        .nav-group {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            width: 100%;
            max-width: 1150px;
            padding: 12px 14px;
            border-radius: 20px;
        }

        .nav-slider {
            position: absolute;
            bottom: 0;
            /* left: 0; */
            height: 4px;
            border-radius: 10px;
            transition: all .4s ease;
        }

        .island-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 18px 10px;
            font-size: 20px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: .3s;
            opacity: 0.5;
        }

        .island-btn:nth-child(2) {
            color: #b91c1c;
            background: #ffe4e6;
        }

        .island-btn:nth-child(3) {
            color: #1d4ed8;
            background: #e0f2fe;
        }

        .island-btn:nth-child(4) {
            color: #047857;
            background: #dcfce7;
        }

        .island-btn:nth-child(5) {
            color: #92400e;
            background: #fef3c7;
        }

        .island-btn.active {
            opacity: 1;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, .2);
        }

        .island-btn:nth-child(2).active {
            color: #0c0c0c;
            background: #ffc9cd;
        }

        .island-btn:nth-child(3).active {
            color: #0c0c0c;
            background: #bae2ff;
        }

        .island-btn:nth-child(4).active {
            color: #0c0c0c;
            background: #a4ffc4;
        }

        .island-btn:nth-child(5).active {
            color: #0c0c0c;
            background: #ffd791;
        }

        .nav-group:has(.island-btn:nth-child(2).active) .nav-slider {
            background: #ffbdc2;
        }

        .nav-group:has(.island-btn:nth-child(3).active) .nav-slider {
            background: #9ed0f5;
        }

        .nav-group:has(.island-btn:nth-child(4).active) .nav-slider {
            background: #88e9aa;
        }

        .nav-group:has(.island-btn:nth-child(5).active) .nav-slider {
            background: #f0c171;
        }

        .island-btn:hover {
            opacity: .9;
            transform: translateY(-2px);
        }

        .main {
            flex: 1;
            padding: 10px 5px 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
        }

        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:1065px) {

            .topbar {
                display: none;
            }

            .menu-btn {
                display: block;
                position: fixed;
                top: 15px;
                right: 15px;
                font-size: 22px;
                background: #6366f1;
                color: white;
                border: none;
                border-radius: 8px;
                padding: 6px 12px;
                cursor: pointer;
                z-index: 5000;
            }

            .offcanvas {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, .6);
                display: none;
                z-index: 4000;
            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: 280px;
                height: 100%;

                background: #ffffff;

                padding-top: 60px;

                display: flex;
                flex-direction: column;
                gap: 18px;

                transform: translateX(100%);
                transition: transform 0.35s ease;
            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
                padding-inline: 20px;
                padding-top: 70px;
            }

            .offcanvas-panel .island-btn {
                flex: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 18px 10px;
                font-size: 20px;
                font-weight: 500;
                border-radius: 12px;
                cursor: pointer;
                transition: 0.3s;
                opacity: 0.5;
            }

            .offcanvas-panel .island-btn:nth-child(1) {
                color: #b91c1c;
                background: #ffe4e6;
            }

            .offcanvas-panel .island-btn:nth-child(2) {
                color: #1d4ed8;
                background: #e0f2fe;
            }

            .offcanvas-panel .island-btn:nth-child(3) {
                color: #047857;
                background: #dcfce7;
            }

            .offcanvas-panel .island-btn:nth-child(4) {
                color: #92400e;
                background: #fef3c7;
            }

            .offcanvas-panel .island-btn.active {
                opacity: 1;
                color: #0c0c0c;
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(0, 0, 0, .2);
            }

            .offcanvas-panel .island-btn:nth-child(1).active {
                background: #ffc9cd;
            }

            .offcanvas-panel .island-btn:nth-child(2).active {
                background: #bae2ff;
            }

            .offcanvas-panel .island-btn:nth-child(3).active {
                background: #a4ffc4;
            }

            .offcanvas-panel .island-btn:nth-child(4).active {
                background: #ffd791;
            }

            .offcanvas-panel .island-btn:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }
        }

        @media(max-width:480px) {
            .offcanvas-panel {
                width: 85%;
                padding: 20px;
                gap: 16px;
            }

            .offcanvas-panel .island-btn {
                font-size: 14px;
                padding: 30px 12px;
            }
        }

        @media (min-width: 900px) and (max-height: 800px) {
            .app {
                transform: scaleY(0.95);
                transform-origin: top center;
                height: calc(100vh / 0.95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {
            .app {
                transform: scaleY(0.9);
                transform-origin: top center;
                height: calc(100vh / 0.9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {
            .app {
                transform: scaleY(0.85);
                transform-origin: top center;
                height: calc(100vh / 0.85);
            }
        }

        @media (min-width: 900px) and (max-height: 500px) {
            .app {
                transform: scaleY(0.8);
                transform-origin: top center;
                height: calc(100vh / 0.8);
            }
        }

        @media screen and (min-width: 1025px) and (max-width: 1440px) {
            .nav-group {
                max-width: 1200px;
            }

            .island-btn {
                font-size: 17px;
                padding: 16px 20px;
            }

            .topbar {
                height: 90px;
            }
        }

        @media screen and (min-width: 1441px) and (max-width: 1920px) {
            .nav-group {
                max-width: 1600px;
                gap: 30px;
                padding: 14px;
            }

            .topbar {
                height: 100px;
            }

            .island-btn {
                font-size: clamp(17px, 1.1vw, 20px);
                padding: 18px 24px;
            }

            .main {
                padding: 20px 20px 0;
            }
        }

        @media screen and (min-width: 1921px) {
            .nav-group {
                max-width: 1900px;
                gap: 40px;
                padding: 18px;
            }

            .topbar {
                height: 120px;
            }

            .island-btn {
                font-size: clamp(20px, 1.2vw, 26px);
                padding: 22px 28px;
            }

            .main {
                padding: 30px 40px 0;
            }

            iframe {
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>
<button class="menu-btn" onclick="toggleMenu()">☰</button>

    <div class="app">

        <div class="topbar">
            <div class="nav-group">

                <div class="nav-slider" id="navSlider"></div>

                <div class="island-btn active" onclick="openIsland(0)">
                    <i class="fa-solid fa-circle-check"></i> Correct Options
                </div>

                <div class="island-btn" onclick="openIsland(1)">
                    <i class="fa-solid fa-check-double"></i> True / False
                </div>

                <div class="island-btn" onclick="openIsland(2)">
                    <i class="fa-solid fa-font"></i> One Word
                </div>

                <div class="island-btn" onclick="openIsland(3)">
                    <i class="fa-solid fa-pen"></i> Fill The Blanks
                </div>

            </div>
        </div>

        <div class="main">
            <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>
        </div>

    </div>

    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">
        <div class="offcanvas-panel" onclick="event.stopPropagation()">

            <div class="island-btn active" onclick="mobileOpen(0)">Correct Options</div>
            <div class="island-btn" onclick="mobileOpen(1)">True / False</div>
            <div class="island-btn" onclick="mobileOpen(2)">One Word</div>
            <div class="island-btn" onclick="mobileOpen(3)">Fill The Blanks</div>

        </div>
    </div>

    <script>
        const sidebarButtons = document.querySelectorAll(".topbar .island-btn");
        const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");
        const slider = document.getElementById("navSlider");
        const frame = document.getElementById("contentFrame");

        const pages = [
            "./exercises/mcq.html",
            "./exercises/true_false.html",
            "./exercises/one_word.html",
            "./exercises/FTB.html",
        ];

        function moveSlider(el) {

            const parentRect = el.parentElement.getBoundingClientRect();
            const rect = el.getBoundingClientRect();

            slider.style.width = rect.width + "px";
            slider.style.left = (rect.left - parentRect.left) + "px";
        }

        function openIsland(index) {
            sidebarButtons.forEach(btn => btn.classList.remove("active"));
            sidebarButtons[index].classList.add("active");

            mobileButtons.forEach(btn => btn.classList.remove("active"));
            mobileButtons[index].classList.add("active");

            moveSlider(sidebarButtons[index]);
            frame.src = pages[index];
        }

        function toggleMenu() {
            if (window.innerWidth > 1065) return;
            document.getElementById("offcanvas").classList.toggle("show");
        }

        function mobileOpen(i) {
            openIsland(i);
            toggleMenu();
        }

        window.onload = () => moveSlider(sidebarButtons[0]);

        window.onresize = () => {
            const activeBtn = document.querySelector(".topbar .island-btn.active");
            moveSlider(activeBtn);
        };
    </script>



</body>
</html>
