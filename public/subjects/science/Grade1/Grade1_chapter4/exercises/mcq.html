<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/CSS/mcq.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</head>

<body>
  <div class="app">
    <div class="template">
      <div id="imgLoader" class="img-loader"></div>

      <div class="title" id="titleText"></div>
      <div class="animal-wrap">
        <img id="animalImg" class="animal-img" />
      </div>
      <div class="options" id="optionsBox"></div>

      <nav class="quiz-nav">
        <button class="prev" id="prevBtn">❮ Prev</button>
        <button class="next" id="nextBtn">Next ❯</button>
      </nav>
    </div>
  </div>

  <div id="answerPopup" class="kid-popup">
    <div class="kid-card">
      <div class="kid-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <div id="finalPopup">
    <div class="final-kid-box">
      <h2>🎉 Congratulations!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div>
      <button class="playAgain-btn" onclick="location.reload()">
        Play Again
      </button>
    </div>
  </div>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
  <script src="../assets/JavaScript/mcq.js"></script>

</body>
</html>
