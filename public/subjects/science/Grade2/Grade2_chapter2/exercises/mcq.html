<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Livvic", sans-serif;
        }

        body {
            margin: 0;
            font-family: 'Livvic', sans-serif;
            min-height: 100vh;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            /* padding: 20px; */
        }

        /* MAIN CARD */
        .quiz {
            position: relative;
            width: 1000px;
            max-width: 95vw;
            border-radius: 40px;
            /* padding: 25px 30px 35px; */
            text-align: center;
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        /* HEADER hidden as original */
        .header {
            display: none;
        }

        /* PROGRESS DOTS */
        .progress {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            display: none;
        }

        .progress div {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            background: #e0e0e0;
            color: #aaa;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* ---------- NEW VERTICAL LAYOUT ---------- */
        /* Question text area (TOP) */
        .question-text-area {
            margin: 5px 0 15px 0;
            text-align: center;
        }

        .question-text {
            font-size: 30px;
            font-weight: 400;
            color: #2f4f4f;
            line-height: 1.3;
            /* background: linear-gradient(135deg, #fef9e6, #fff6e0); */
            display: inline-block;
            padding: 12px 28px;
            border-radius: 60px;
            /* box-shadow: 0 8px 18px rgba(0,0,0,0.05); */
            letter-spacing: -0.2px;
        }

        /* CENTER IMAGE BOX */
        .image-center {
            /* background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%); */
            border-radius: 35px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.12);
            border: 3px solid #ffb4d6;
            width: 200px;
            height: 200px;
            margin: 10px auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .image-center:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.18);
        }

        .question-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* OPTIONS ROW — 4 options in one horizontal row */
        .options-row {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin: 20px 0 20px 0;
        }

        /* Option button styles (identical styling but horizontal) */
        .opt-btn {
            background: linear-gradient(135deg, #f4f8fc 0%, #e8f0f5 100%);
            padding: 16px 12px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            width: 180px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        .opt-btn:hover:not(.disabled) {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 18px 30px rgba(0, 0, 0, 0.15);
            background: linear-gradient(135deg, #ffffff 0%, #f0f8ff 100%);
        }

        .opt-img {
            width: 85px;
            height: 70px;
            object-fit: contain;
        }

        .opt-text {
            font-weight: 400;
            color: #1e2e3e;
            font-size: 18px;
            letter-spacing: 0.3px;
        }

        .opt-btn.correct {
            border: 3px solid #4CAF50;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            box-shadow: 0 0 18px rgba(76, 175, 80, 0.4);
        }

        .opt-btn.disabled {
            opacity: 0.65;
            pointer-events: none;
        }

        /* NAVIGATION BUTTONS */
       .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0px;
    gap: 20px;
    flex-shrink: 0;
}

.nav-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 180px;
    height: 60px;
    padding: 0 25px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    font-size: 17px;
    color: #fff;
    transition: all 0.3s ease;
}

.nav-btn.prev {
    background: linear-gradient(135deg, #ff8fb1, #ff5c8a);
}

.nav-btn.next {
    background: linear-gradient(135deg, #576A8F, #3b4a66);
}

.nav-btn .circle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-btn i {
    font-size: 16px;
}

.nav-btn .text {
    letter-spacing: 1px;
    font-size: 16px;
}

        .nav-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.2);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* =====================================
           SAME MCQ STYLE POPUP FOR ALL FILES (Identical)
        ===================================== */
        .popup,
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* background-color: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px); */
        }

        .popup-content,
        .finalpopup-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(240,255,240,0.98) 100%);
            width: 90%;
            max-width: 380px;
            padding: 28px;
            border-radius: 28px;
            text-align: center;
            animation: popIn .4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            /* backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0,0,0,.18); */
        }

        .popup-icon {
            font-size: 5em;
            margin-bottom: 12px;
            animation: iconBounce .8s ease;
        }

        .popup-content h3,
        .final-heading {
            font-size: 2em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2f4f4f;
        }

        .popup-content p,
        .popup-final-content {
            font-size: 1.2em;
            font-weight: 500;
            line-height: 1.6;
            color: #4b5563;
        }

        .popup.correct .popup-content {
            background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(240,255,240,0.98) 100%);
        }
        .popup.correct h3 { color:#22543d; }
        .popup.correct p { color:#276749; }

        .popup.wrong .popup-content {
            background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(255,240,240,0.98) 100%);
        }
        .popup.wrong h3 { color:#742a2a; }
        .popup.wrong p { color:#9b2c2c; }

        #stars, .stars {
            font-size: 40px;
            margin-top: 12px;
        }

        .playAgain-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: .3s ease;
            margin-top: 18px;
            font-weight: 600;
        }
        .playAgain-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(76,175,80,.3);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes iconBounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* RESPONSIVE for tablet & mobile */
        @media (max-width: 900px) {
            .options-row { gap: 15px; }
            .opt-btn { width: 160px; padding: 12px 8px; }
            .opt-img { width: 70px; height: 60px; }
            .opt-text { font-size: 15px; }
            .question-text { font-size: 28px; padding: 8px 20px; }
            .image-center { width: 260px; height: 260px; }
            .nav-btn { width: 160px; height: 55px; gap: 8px; }
            .nav-btn .text { font-size: 15px; }
        }

        @media (max-width: 768px) {
            .options-row { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 12px; }
            .opt-btn { width: 140px; flex-direction: column; gap: 8px; padding: 12px 6px; }
            .opt-img { width: 55px; height: 48px; }
            .opt-text { font-size: 13px; }
            .question-text { font-size: 24px; }
            .image-center { width: 220px; height: 220px; padding: 12px; }
            .nav { gap: 20px; margin-top: 10px; }
            .nav-btn { width: 130px; height: 50px; }
            .nav-btn .circle { width: 30px; height: 30px; }
        }

        @media (max-width: 550px) {
            .opt-btn { width: 125px; }
            .opt-img { width: 45px; height: 40px; }
            .opt-text { font-size: 12px; }
            .question-text { font-size: 20px; }
        }

        @media (min-width: 1280px) {
            .quiz { width: 1100px; }
            .opt-btn { width: 210px; padding: 18px 12px; }
            .opt-img { width: 100px; height: 85px; }
            .opt-text { font-size: 21px; }
            .question-text { font-size: 44px; }
            .image-center { width: 360px; height: 360px; }
            .nav-btn { width: 220px; height: 70px; }
        }
    </style>
</head>
<body>

<div class="quiz">
    <div class="progress" id="progress"></div>

    <!-- NEW VERTICAL LAYOUT: QUESTION TEXT ON TOP -->
    <div class="question-text-area">
        <div class="question-text" id="questionText"></div>
    </div>

    <!-- IMAGE CENTER (BELOW QUESTION) -->
    <div class="image-center">
        <img id="questionImg" class="question-img" alt="Question Image">
    </div>

    <!-- 4 OPTIONS IN ONE ROW -->
    <div class="options-row" id="optionsContainer"></div>

    <!-- PREV / NEXT BUTTONS -->
    <div class="nav">
        <button class="nav-btn prev" id="prev" disabled>
            <span class="circle"><i class="fa-solid fa-chevron-left"></i></span>
            <span class="text">PREV</span>
        </button>
        <button class="nav-btn next" id="next" disabled>
            <span class="text">NEXT</span>
            <span class="circle"><i class="fa-solid fa-chevron-right"></i></span>
        </button>
    </div>
</div>

<!-- ANSWER POPUP (Correct / Wrong) IDENTICAL -->
<div id="answerPopup" class="popup">
    <div class="popup-content">
        <div class="popup-icon" id="popupIcon"></div>
        <h3 id="popupTitle"></h3>
        <p id="popupMsg"></p>
    </div>
</div>

<!-- FINAL SCORE POPUP -->
<div id="finalPopup">
    <div class="finalpopup-box">
        <h2 class="final-heading">🎉 Congratulations!</h2>
        <p id="finalScore"></p>
        <div id="stars"></div><br>
        <button onclick="restart()" class="playAgain-btn">Play Again</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
<audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
    // ---------- SAME QUIZ DATA ----------
    const quizData = [
        {
            image: "../assets/images/mcq-1.png",
            q: "Q1. Our tongue helps us ___ the food.",
            options: [
                { text: "Hear", img: "../assets/images/hear.png" },
                { text: "See", img: "../assets/images/see.png" },
                { text: "Taste", img: "../assets/images/taste.png" },
                { text: "Feel", img: "../assets/images/feel.png" }
            ],
            correct: 2,
        },
        {
            image: "../assets/images/boy.png",
            q: "Q2. Our whole body is covered with the ____.",
            options: [
                { text: "Arms", img: "../assets/images/arms.png" },
                { text: "Legs", img: "../assets/images/legs.png" },
                { text: "Muscles", img: "../assets/images/muscles.png" },
                { text: "Skin", img: "../assets/images/Skin1.png" }
            ],
            correct: 3,
        },
        {
            image: "../assets/images/head.png",
            q: "Q3. The ____ is located inside our head.",
            options: [
                { text: "Heart", img: "../assets/images/heart.png" },
                { text: "Brain", img: "../assets/images/brain.png" },
                { text: "Lungs", img: "../assets/images/lungs.png" },
                { text: "Stomach", img: "../assets/images/stomach.png" }
            ],
            correct: 1,
        },
        {
            image: "../assets/images/mcq-4.png",
            q: "Q4. We have a pair of ___.",
            options: [
                { text: "Lungs", img: "../assets/images/lungs.png" },
                { text: "Heart", img: "../assets/images/heart.png" },
                { text: "Brain", img: "../assets/images/brain.png" },
                { text: "Stomach", img: "../assets/images/stomach.png" },
            ],
            correct: 0
        },
        {
            image: "../assets/images/mcq-5.png",
            q: "Q5. The ___ pumps blood to all the parts of the body.",
            options: [
                { text: "Brain", img: "../assets/images/brain.png" },
                { text: "Heart", img: "../assets/images/heart.png" },
                { text: "Lungs", img: "../assets/images/lungs.png" },
                { text: "Stomach", img: "../assets/images/stomach.png" }
            ],
            correct: 1
        }
    ];

    let index = 0, score = 0;
    let answers = Array(quizData.length).fill(null);

    const qText = document.getElementById("questionText");
    const qImg = document.getElementById("questionImg");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const progressDiv = document.getElementById("progress");
    const optionsContainer = document.getElementById("optionsContainer");

    const correctAudio = document.getElementById("correctSound");
    const wrongAudio = document.getElementById("wrongSound");

    // Speech function
    function speak(t) {
        speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(t);
        msg.lang = "en-UK";
        msg.volume = 0.25;
        msg.rate = 1;
        msg.pitch = 1;
        speechSynthesis.speak(msg);
    }

    // Same popup as original
    function showPopup(isCorrect) {
        const popup = document.getElementById("answerPopup");
        const icon = document.getElementById("popupIcon");
        const title = document.getElementById("popupTitle");
        const msg = document.getElementById("popupMsg");

        popup.style.display = "flex";
        if (isCorrect) {
            icon.textContent = "🎉";
            title.textContent = "Correct!";
            msg.textContent = "Well done! 🎯";
            popup.classList.add("correct");
            popup.classList.remove("wrong");
        } else {
            icon.textContent = "😔";
            title.textContent = "Wrong!";
            msg.textContent = "Try again! 💪";
            popup.classList.add("wrong");
            popup.classList.remove("correct");
        }
        setTimeout(() => {
            popup.style.display = "none";
        }, 1200);
    }

    function showFinal() {
        const finalPopup = document.getElementById("finalPopup");
        finalPopup.style.display = "flex";
        document.getElementById("finalScore").textContent = `Score: ${score}/${quizData.length}`;
        const starsHtml = "⭐".repeat(score) + "☆".repeat(quizData.length - score);
        document.getElementById("stars").innerHTML = starsHtml;
        fireConfettif();
    }

    function renderProgress() {
        progressDiv.innerHTML = "";
        quizData.forEach((_, i) => {
            const d = document.createElement("div");
            d.textContent = answers[i] !== null ? "✓" : i + 1;
            d.style.background = answers[i] !== null ? "#4CAF50" : "#e0e0e0";
            d.style.color = answers[i] !== null ? "#fff" : "#555";
            progressDiv.appendChild(d);
        });
    }

    // Create an option button exactly matching original style
    function createOptionButton(opt, idx, correctIdx, isAnswered) {
        const div = document.createElement("div");
        div.className = "opt-btn";
        div.innerHTML = `
            <img src="${opt.img}" class="opt-img" alt="${opt.text}" onerror="this.src='https://placehold.co/90x70?text=Img'">
            <span class="opt-text">${opt.text}</span>
        `;
        if (isAnswered) {
            if (idx === correctIdx) {
                div.classList.add("correct");
            }
            div.classList.add("disabled");
        }
        div.onclick = () => selectAnswer(div, idx);
        return div;
    }

    function loadQuestion() {
        const q = quizData[index];
        qText.textContent = q.q;
        qImg.src = q.image;
        qImg.alt = "question visual";
        qImg.style.display = "block";
        prevBtn.disabled = (index === 0);
        
        const options = q.options;
        const correctIdx = q.correct;
        const isAnswered = answers[index] !== null;
        
        // Clear previous options
        optionsContainer.innerHTML = "";
        
        // Render 4 options in a row (left to right order)
        options.forEach((opt, optIndex) => {
            const btn = createOptionButton(opt, optIndex, correctIdx, isAnswered);
            optionsContainer.appendChild(btn);
        });
        
        // If already answered, disable next and enable, but next becomes enabled always after selection
        if (isAnswered) {
            nextBtn.disabled = false;
        } else {
            nextBtn.disabled = true;
        }
        
        renderProgress();
    }

    function selectAnswer(el, idx) {
        const currentQ = quizData[index];
        const correct = currentQ.correct;
        
        if (answers[index] !== null) return; // already answered
        
        if (idx !== correct) {
            // Wrong answer: no score increment, just show wrong popup
            el.classList.add("disabled");
            if (wrongAudio) wrongAudio.play();
            speak("Wrong");
            showPopup(false);
            // prevent further clicks but do not mark answer as selected for progression
            // Actually we need to block re-selection but not set answers[index] to keep same behaviour? Original logic: wrong answer doesn't record answer and doesn't allow next? In original code: wrong answer just disables but doesn't set answers array. However we want user to try correct one only? But original spec: "if wrong then only show popup, but they can select correct again"? But typical quiz: must select correct. Original Logic: if idx !== correct, they just disable that button and show wrong, but doesn't record or enable next. That means user must click correct option eventually. We'll replicate that exactly: wrong selection just disables that specific button, no progress, user must choose correct answer.
            return;
        }
        
        // CORRECT ANSWER
        answers[index] = idx;
        score++;
        // highlight correct button and disable all
        const allBtns = document.querySelectorAll(".opt-btn");
        allBtns.forEach((btn, i) => {
            if (i === idx) {
                btn.classList.add("correct");
            }
            btn.classList.add("disabled");
        });
        if (correctAudio) correctAudio.play();
        speak("Correct");
        showPopup(true);
        fireConfetti();
        
        nextBtn.disabled = false;
        renderProgress();
        
        // if last question, show final after a second
        if (index === quizData.length - 1) {
            setTimeout(showFinal, 1000);
        }
    }

    // Navigation
    prevBtn.onclick = () => {
        if (index > 0) {
            index--;
            loadQuestion();
        }
    };
    
    nextBtn.onclick = () => {
        if (index < quizData.length - 1) {
            index++;
            loadQuestion();
        } else {
            // if on last and next clicked, maybe show final if all answered? But we already call final after last correct selection.
            if (answers[index] !== null && index === quizData.length-1) {
                showFinal();
            }
        }
    };
    
    function restart() {
        index = 0;
        score = 0;
        answers.fill(null);
        document.getElementById("finalPopup").style.display = "none";
        loadQuestion();
    }
    
    // function fireConfettif() {
    //     confetti({
    //         particleCount: 180,
    //         spread: 140,
    //         origin: { y: 0.6 },
    //         startVelocity: 18,
    //         colors: ['#4CAF50', '#FFC107', '#FF6B6B', '#4A90E2']
    //     });
    // }
    
    // function fireConfetti() {
    //     confetti({
    //         particleCount: 70,
    //         spread: 90,
    //         origin: { y: 0.6 },
    //         startVelocity: 12
    //     });
    // }
    function fireConfettif() {
  confetti({
    particleCount: 100,
    spread: 140,
    origin: { y: 0.6 }
  });
}

function fireConfetti() {
  confetti({
    particleCount: 40,
    spread: 100,
    origin: { y: 0.6 }
  });
}
    // initial load
    loadQuestion();
</script>

</body>
</html>
