<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Livvic" !important;
            padding: 0;
            margin: 0;
        }

        body {
            min-height: 100vh;
            /* background: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%); */
            display: flex;
            justify-content: center;
            align-items: center;
            /* padding: 30px; */
            position: relative;
        }

        /* Decorative circles */
        /* body::before {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255,200,150,0.2), transparent 70%);
            top: -100px;
            right: -80px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        } */

        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(150,200,210,0.15), transparent 70%);
            bottom: -120px;
            left: -100px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* HEADER */
        .header {
            display: none !important;
        }

        /* MAIN WRAPPER */
        .main {
            position: relative;
            width: 850px;
            max-width: 95%;
            z-index: 10;
        }

        /* CARD */
        .card {
            /* background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 56px;
            padding: 35px 30px 45px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.6); */
            transition: all 0.3s ease;
        }

        /* QUESTION */
        .question {
            text-align: start;
            font-size: 30px;
            font-weight: 400;
            margin-bottom: 20px;
            color: #1a3c4a;
            /* background: linear-gradient(135deg, #fff8e7, #fff2df); */
            display: inline-block;
            width: auto;
            padding: 14px 32px;
            border-radius: 60px;
            margin-top: 0;
            margin-left: 100px;
            margin-right: auto;
            
            /* box-shadow: 0 6px 14px rgba(0,0,0,0.05); */
        }

        /* IMAGE */
        .image-box {
            display: flex;
            justify-content: center;
            margin: 25px 0 30px;
        }

        .image-box img {
            height: 180px !important;
            width: 260px !important;
            object-fit: contain;
            background: #fff8f0;
            border-radius: 40px;
            padding: 15px;
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s;
        }

        .image-box img:hover {
            transform: scale(1.02);
        }

        /* SIMPLE INPUT BOX */
        .letters {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0 25px;
        }

        .simple-input {
            width: 380px;
            max-width: 85%;
            height: 70px;
            border-radius: 50px;
            border: 3px solid #e2e8f0;
            text-align: center;
            font-size: 24px;
            font-weight: 500;
            padding: 0 25px;
            background: white;
            transition: all 0.3s ease;
            color: #1e293b;
        }

        .simple-input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16,185,129,0.15);
            transform: scale(1.01);
        }

        .simple-input.correct {
            border-color: #22c55e;
            background: #f0fdf4;
            color: #166534;
        }

        .simple-input:disabled {
            background: #f0fdf4;
            cursor: default;
            opacity: 0.9;
        }

        /* BUTTON ROW */
        .action-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
.nav {
    display: flex;
    justify-content: space-around;
    margin-top: 10px;
    margin-bottom: 5px;
    flex-shrink: 0;
}

button {
    padding: 12px 30px !important;
    border: none;
    border-radius:25px;
    font-size: 20px !important;
    color: white;
    cursor: pointer;
    outline: 3px solid white;
    transition: 0.2s;
    font-size: 20px;
}

.prev {
    background: #546B41;
}

.next {
    background: #434E78;
}

        .submit {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .home {
            display: none;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 22px -8px rgba(0, 0, 0, 0.2);
        }

        /* POPUP */
        .popup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            /* background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px); */
        }

        .popup-card {
            width: 320px;
            padding: 38px 28px;
            border-radius: 40px;
            text-align: center;
            color: white;
            position: relative;
            animation: popScale 0.4s ease;
        }

        .popup.correct .popup-card {
            background: linear-gradient(145deg, #2b7a5c, #1f5e46);
        }

        .popup.wrong .popup-card {
            background: linear-gradient(145deg, #c7452c, #ac3721);
        }

        .popup-bubble {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            position: absolute;
            top: -40px;
            right: -15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 44px;
            background: white;
            color: #333;
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
        }

        .popup-card h2 {
            margin-top: 15px;
            font-size: 28px;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .popup-card p {
            font-size: 16px;
            margin-top: 8px;
            opacity: 0.95;
        }

        .popup-stars {
            font-size: 28px;
            margin-top: 15px;
            animation: popStar 0.6s ease;
        }

        @keyframes popScale {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes popStar {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* FINAL POPUP */
        #finalPopup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px); */
        }

        .finalpopup-box {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 48px;
            padding: 35px 25px;
            text-align: center;
            animation: popupScale 0.4s ease;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
        }

        .medals span {
            font-size: 32px;
            margin: 0 5px;
            display: inline-block;
            animation: bounce 0.6s infinite alternate;
        }

        .final-heading {
            color: #e67e22;
            margin: 15px 0 8px;
            font-size: 28px;
            font-weight: 800;
        }

        .final-sub {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 15px;
        }

        #finalScore {
            font-weight: 700;
            margin-top: 12px;
            font-size: 20px;
            color: #1e3a5f;
        }

        #stars {
            font-size: 28px;
            margin: 15px 0;
        }

        .final-buttons {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            justify-content: center;
        }

        .playAgain-btn {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .playAgain-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        @keyframes popupScale {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }
            .card {
                padding: 25px 20px;
                border-radius: 40px;
            }
            .question {
                font-size: 22px;
                padding: 10px 20px;
            }
            .simple-input {
                width: 280px;
                height: 55px;
                font-size: 20px;
            }
            .image-box img {
                width: 200px !important;
                height: 150px !important;
            }
            .action-row {
                gap: 12px;
            }
            button {
                padding: 10px 20px;
                font-size: 15px !important;
            }
        }

        @media (min-width: 1280px) {
            .main {
                width: 1000px;
            }
            .card {
                padding: 45px 40px;
            }
            .question {
                font-size: 42px;
                padding: 18px 42px;
            }
            .simple-input {
                width: 450px;
                height: 80px;
                font-size: 28px;
                border-radius: 60px;
            }
            .image-box img {
                width: 320px !important;
                height: 220px !important;
            }
            button {
                padding: 16px 38px;
                font-size: 20px !important;
            }
            .popup-card {
                width: 400px;
                padding: 48px 34px;
            }
            .popup-bubble {
                width: 100px;
                height: 100px;
                top: -48px;
                font-size: 52px;
            }
        }
    </style>
</head>

<body>

    <div class="main">
        <div class="header">
            <span>Fill & Blanks</span>
            <div class="progress" id="progress"></div>
        </div>
        <button class="home" onclick="location.href='../index.html'">?? Home</button>

        <div class="q-indicator" id="indicator"></div>

        <div class="card">
            <div class="question" id="question"></div>

            <div class="image-box">
                <img id="image" alt="Question image">
            </div>

            <div class="letters" id="letters"></div>

            <div class="action-row nav">
                <button class="prev" id="prevBtn" disabled>? PREV</button>
                <button class="submit" id="checkBtn" disabled>? SUBMIT</button>
                <button class="next" id="nextBtn" disabled>NEXT ?</button>
            </div>
        </div>
    </div>

    <!-- ANSWER POPUP -->
    <div id="answerPopup" class="popup">
        <div class="popup-card">
            <div class="popup-bubble" id="popupIcon"></div>
            <h2 id="popupTitle"></h2>
            <p id="popupMsg"></p>
            <div id="popupStars" class="popup-stars"></div>
        </div>
    </div>

    <!-- FINAL SCORE POPUP -->
    <div id="finalPopup">
        <div class="finalpopup-box">
            <div class="medals">
                <span>??</span>
                <span>??</span>
                <span>??</span>
            </div>
            <h2 class="final-heading">?? Congratulations! ??</h2>
            <p class="final-sub">You completed the quiz successfully!</p>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <div class="final-buttons">
                <button onclick="restart()" class="playAgain-btn">?? PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
<script>
    // Prevent drag and drop anywhere on page
    ["dragenter", "dragover", "dragleave", "drop"].forEach(eventName => {
        document.addEventListener(eventName, function (e) {
            e.preventDefault();
            e.stopPropagation();
        }, false);
    });

    // Prevent image/file paste also
    document.addEventListener("paste", function (e) {
        const items = (e.clipboardData || window.clipboardData).items;

        for (let item of items) {
            if (item.type.indexOf("image") !== -1) {
                e.preventDefault();
                return false;
            }
        }
    });
</script>
   <script>
    const questions = [
        { q: "Q1. Living things need ___ to breathe.", a: "air", a_mobile: "air", img: "../assets/images/air.png" },
        { q: "Q2. Living things ____ hot and cold according to the seasons.", a: "feel", a_mobile: "feel", img: "../assets/images/feel.png" },
        { q: "Q3. Human beings and most of the animals give birth to _____.", a: "babies", a_mobile: "babies", img: "../assets/images/fib-3.png" },
        { q: "Q4. Non-living things do not have _____.", a: "life", a_mobile: "life", img: "../assets/images/chair.png" },
        { q: "Q5. Man-made things are made in _____.", a: "factories", a_mobile: "factories", img: "../assets/images/fib-5.png" }
    ];

    let index = 0;
    let score = 0;
    let answered = Array(questions.length).fill(false);
    let finalPopupShown = false;

    const qEl = document.getElementById("question");
    const img = document.getElementById("image");
    const letters = document.getElementById("letters");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const checkBtn = document.getElementById("checkBtn");
    const correctAudio = document.getElementById("correctSound");
    const wrongAudio = document.getElementById("wrongSound");

    function isMobile() {
        return window.innerWidth <= 768;
    }

    function speak(t) {
        speechSynthesis.cancel();

        const msg = new SpeechSynthesisUtterance(t);

        msg.lang = "en-UK";
        msg.volume = 0.25;
        msg.rate = 1;
        msg.pitch = 1;

        speechSynthesis.speak(msg);
    }

    function fireSmallConfetti() {
        confetti({
            particleCount: 45,
            spread: 65,
            origin: { y: 0.7 },
            scalar: 0.8
        });
    }

    function fireBigConfetti() {

        const duration = 2000;
        const end = Date.now() + duration;

        (function frame() {

            confetti({
                particleCount: 6,
                angle: 60,
                spread: 70,
                origin: { x: 0 }
            });

            confetti({
                particleCount: 6,
                angle: 120,
                spread: 70,
                origin: { x: 1 }
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }

        })();
    }

    function showPopup(isCorrect) {

        const popup = document.getElementById("answerPopup");
        const icon = document.getElementById("popupIcon");
        const title = document.getElementById("popupTitle");
        const msg = document.getElementById("popupMsg");
        const stars = document.getElementById("popupStars");

        popup.style.display = "flex";

        if (isCorrect) {

            popup.className = "popup correct";

            icon.textContent = "?";
            title.textContent = "CORRECT!";
            msg.textContent = "Awesome! Keep going ??";

            stars.textContent = "? ? ?";
            stars.style.display = "block";

        } else {

            popup.className = "popup wrong";

            icon.textContent = "?";
            title.textContent = "OOPS!";
            msg.textContent = "Try again next time ??";

            stars.style.display = "none";
        }

        setTimeout(() => {
            popup.style.display = "none";
        }, 1200);
    }

    function load() {

        const q = questions[index];

        qEl.textContent = q.q;
        img.src = q.img;

        letters.innerHTML = "";

        const correctAnswer =
            isMobile()
                ? (q.a_mobile || q.a)
                : q.a;

        const inputBox = document.createElement("input");

        inputBox.type = "text";
        inputBox.className = "simple-input";
        inputBox.placeholder = "Type your answer here...";
        inputBox.autocomplete = "off";

        // ? typing first letter capital
        inputBox.addEventListener("input", function () {

            this.value =
                this.value
                    .split(" ")
                    .map(word =>
                        word.charAt(0).toUpperCase() +
                        word.slice(1).toLowerCase()
                    )
                    .join(" ");

            if (!answered[index]) {
                checkBtn.disabled =
                    (this.value.trim() === "");
            }
        });

        // ? already answered
        if (answered[index]) {

            inputBox.value =
                correctAnswer
                    .split(" ")
                    .map(word =>
                        word.charAt(0).toUpperCase() +
                        word.slice(1).toLowerCase()
                    )
                    .join(" ");

            inputBox.classList.add("correct");
            inputBox.disabled = true;

            checkBtn.disabled = true;
            checkBtn.textContent = "? DONE";

            nextBtn.disabled = false;

        } else {

            inputBox.value = "";
            inputBox.disabled = false;

            checkBtn.disabled = true;
            checkBtn.textContent = "? SUBMIT";

            nextBtn.disabled = true;
        }

        letters.appendChild(inputBox);

        prevBtn.disabled = (index === 0);

        if (!answered[index] && !inputBox.disabled) {
            setTimeout(() => inputBox.focus(), 50);
        }
    }

    // ================= CHECK ANSWER =================

    checkBtn.onclick = () => {

        if (answered[index]) return;

        const inputBox =
            letters.querySelector(".simple-input");

        const user =
            inputBox.value.trim().toLowerCase();

        const correctAnswer =
            (
                isMobile()
                    ? (questions[index].a_mobile || questions[index].a)
                    : questions[index].a
            ).toLowerCase();

        // ? CORRECT
        if (user === correctAnswer) {

            answered[index] = true;

            score++;

            // ? Hold answer with first letter capital
            inputBox.value =
                correctAnswer
                    .split(" ")
                    .map(word =>
                        word.charAt(0).toUpperCase() +
                        word.slice(1).toLowerCase()
                    )
                    .join(" ");

            inputBox.classList.add("correct");

            inputBox.disabled = true;

            checkBtn.disabled = true;

            nextBtn.disabled = false;

            speak("Correct");

            fireSmallConfetti();

            showPopup(true);

            if (correctAudio) {
                correctAudio.play();
            }

            // ? Final popup
            if (
                index === questions.length - 1 &&
                !finalPopupShown
            ) {

                finalPopupShown = true;

                setTimeout(() => {

                    prevBtn.disabled = true;
                    nextBtn.disabled = true;

                    showFinal();

                }, 800);
            }

        } else {

            // ? Wrong answer
            inputBox.value = "";

            inputBox.classList.remove("correct");

            checkBtn.disabled = true;

            speak("Wrong");

            showPopup(false);

            if (wrongAudio) {
                wrongAudio.play();
            }

            inputBox.focus();
        }
    };

    // ================= NAVIGATION =================

    prevBtn.onclick = () => {

        if (index > 0) {

            index--;

            load();
        }
    };

    nextBtn.onclick = () => {

        if (index < questions.length - 1) {

            index++;

            load();
        }
    };

    // ================= FINAL =================

    function showFinal() {

        const finalPopup =
            document.getElementById("finalPopup");

        finalPopup.style.display = "flex";

        document.getElementById("finalScore").textContent =
            `?? SCORE: ${score} / ${questions.length} ??`;

        document.getElementById("stars").innerHTML =
            "?".repeat(score) +
            "?".repeat(questions.length - score);

        fireBigConfetti();
    }

    // ================= RESTART =================

    function restart() {

        index = 0;

        score = 0;

        answered.fill(false);

        finalPopupShown = false;

        document.getElementById("finalPopup").style.display = "none";

        load();
    }

    // ================= START =================

    load();

</script>

</body>
</html>
