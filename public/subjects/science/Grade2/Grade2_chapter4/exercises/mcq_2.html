<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../assets/css/mcq_2.css">
</head>

<body>

    <div class="quiz">

        <!-- <div class="quiz-type">🧠 MCQ Quiz</div> -->

        <!-- QUESTION TEXT -->
        <div class="question-box" id="question"></div>

        <!-- IMAGE + OPTIONS -->
        <div class="card">
            <div class="image-box">
                <img id="questionImg">
            </div>

            <div class="options-box" id="options"></div>
        </div>

       <div class="nav">
            <button class="prev" id="prevBtn" disabled>← Prev</button>
            <button class="next" id="nextBtn" disabled>Next →</button>
        </div>
    </div>

    <!-- CORRECT / WRONG POPUP -->
 <div id="answerPopup" class="popup">
  <div class="popup-card">

    <!-- TOP ICON -->
    <div class="popup-bubble" id="popupIcon"></div>

    <!-- TEXT -->
    <h2 id="popupTitle"></h2>
    <p id="popupMsg"></p>

    <!-- ⭐ STARS (only for correct) -->
    <div id="popupStars" class="popup-stars"></div>

  </div>
</div>

    <!-- FINAL POPUP -->
    <!-- <div id="finalPopup">
        <div class=" finalpopup-box">
            <h2 class="final-heading">🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div><br> <button onclick="location.reload()" class="playAgain-btn"> Play Again </button>
        </div>
    </div> -->
    <div id="finalPopup">
  <div class="finalpopup-box">
    
    <div class="medals">
      <span>🏅</span>
      <span>🥇</span>
      <span>🏅</span>
    </div>

    <h2 class="final-heading">Congratulations!</h2>
    <p class="final-sub">You completed the quiz successfully!</p>

    <p id="finalScore"></p>
    <div id="stars"></div>

    <div class="final-buttons">
      <button onclick="restart()" class="playAgain-btn">Play Again</button>
<!-- Updated Button -->
<button onclick="nextSection()" class="next-section-btn">Next Section</button>    </div>

  </div>
</div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
    <script src="../assets/JavaScript/mcq_2.js"></script>

</body>
</html>
