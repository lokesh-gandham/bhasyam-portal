<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Livvic", sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: url("assets/images/bg.png");
            background-size: 100% 100%;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
            margin: 0 20px;
        }

        /* NAV CONTAINER (modern glass bar) */
        .nav-group {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            width: 100%;
            max-width: 1150px;
            border-radius: 30px;
            padding: 12px 14px;
            
            /* background: #ACCFA3; */

            /* border: 2.5px solid transparent; */
            /* transition: border 0.35s ease; */

            /* box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8); */
        }

        .nav-group:has(.island-btn:nth-child(2).active) {
            border-color: #f0dc82;
        }

        .nav-group:has(.island-btn:nth-child(3).active) {
            border-color: #f0dc82;
        }

        .nav-group:has(.island-btn:nth-child(4).active) {
            border-color: #f0dc82;
        }

        .nav-group:has(.island-btn:nth-child(5).active) {
            border-color: #f0dc82;
        }

        /* SLIDER GLOW */
        .nav-slider {
            position: absolute;
            top: 8px;
            left: 10px;
            height: calc(100% - 16px);
            border-radius: 20px;
            transition: transform .4s ease, width .3s ease;
            z-index: 1;
            filter: blur(10px);
            opacity: 0.6;
        }

        /* BUTTON STYLE (completely new) */
        .island-btn {
            flex: 1;
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 18px 10px;
            font-size: 16px;
            font-weight: 600;

            border-radius: 15px;
            /* pill shape */

            cursor: pointer;

            background: rgba(255, 255, 255, 0.8);
            background: rgba(214, 211, 211, 0.8);

            color: #444;

            z-index: 2;

            transition: all .3s ease;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.05);
        }

        /* HOVER */
        .island-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        /* ACTIVE BUTTON */
        .island-btn.active {
            color: #222;
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        /* 🌈 PASTEL GRADIENT THEMES */
        .island-btn:nth-child(2).active {
            background: #ffd1dc;
        }

        .island-btn:nth-child(3).active {
            background: #d0ebff;
        }

        .island-btn:nth-child(4).active {
            background: #fff3bf;
        }

        .island-btn:nth-child(5).active {
            background: #BFA28C;
        }

        /* SLIDER COLORS */
        .island-btn:nth-child(2).active~.nav-slider {
            background: #ffb3c6;
        }

        .island-btn:nth-child(3).active~.nav-slider {
            background: #74c0fc;
        }

        .island-btn:nth-child(4).active~.nav-slider {
            background: #69db7c;
        }

        .island-btn:nth-child(5).active~.nav-slider {
            background: #ffd43b;
        }

        .main {
            flex: 1;
            padding: 10px 5px 0px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:1065px) {

            .topbar {
                display: none;
            }

            .menu-btn {
                display: block;
                position: fixed;
                top: 15px;
                right: 15px;
                font-size: 24px;
                background: #99AD7A;
                color: white;
                border: none;
                border-radius: 8px;
                padding: 6px 12px;
                cursor: pointer;
                z-index: 5000;
            }

            .offcanvas {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, .45);
                display: none;
                z-index: 4000;
            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: 280px;
                height: 100%;
                background: white;
                padding: 0px;
                padding-top: 50px;
                display: flex;
                flex-direction: column;
                gap: 22px;
                transform: translateX(100%);
                transition: .35s;
                overflow-y: auto;
            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
                padding-inline: 20px;
            }

            .offcanvas-panel .island-btn {
                flex: none;
                font-size: 15px;
                border-radius: 999px;
                opacity: .7;
                background: #f8f9fa;
            }

            .offcanvas-panel .island-btn.active {
                opacity: 1;
                box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
            }

            /* pastel mobile */
            .offcanvas-panel .island-btn:nth-child(1).active {
                background: #ffd0dc;
            }

            .offcanvas-panel .island-btn:nth-child(2).active {
                background: #d8efff;
            }

            .offcanvas-panel .island-btn:nth-child(3).active {
                background: #ebfbee;
            }

            .offcanvas-panel .island-btn:nth-child(4).active {
                background: #ffee96;
            }
        }

        @media(max-width:480px) {

            .offcanvas-panel {
                width: 85%;
                padding: 62px;
                gap: 16px;
            }

            .offcanvas-panel .island-btn {
                font-size: 14px;
                padding: 30px 12px;
            }

        }

        @media (min-width: 900px) and (max-height: 800px) {
            .app {
                transform: scaleY(0.95);
                transform-origin: top center;
                height: calc(100vh / 0.95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {
            .app {
                transform: scaleY(0.9);
                transform-origin: top center;
                height: calc(100vh / 0.9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {
            .app {
                transform: scaleY(0.85);
                transform-origin: top center;
                height: calc(100vh / 0.85);
            }
        }

        @media (min-width: 900px) and (max-height: 500px) {
            .app {
                transform: scaleY(0.8);
                transform-origin: top center;
                height: calc(100vh / 0.8);
            }
        }

        /* ============================= */
        /* Desktop / Monitor (1025–1440) */
        /* ============================= */
        @media screen and (min-width: 1025px) and (max-width: 1440px) {

            .nav-group {
                max-width: 1200px;
            }

            .island-btn {
                font-size: clamp(15px, 1vw, 17px);
                padding: 16px 20px;
            }

            .topbar {
            
                height: 90px;
            
                 
            }
        }

        /* ============================= */
        /* Large Monitors (1441–1920) */
        /* ============================= */
        @media screen and (min-width: 1441px) and (max-width: 1920px) {

            .nav-group {
                max-width: 1600px;
                gap: 30px;
                padding: 14px;
            }

            .topbar {
                height: 100px;
            }

            .island-btn {
                font-size: clamp(17px, 1.1vw, 20px);
                padding: 18px 24px;
                border-radius: 16px;
            }

            .main {
                padding: 20px 20px 0;
            }
        }

        /* ============================= */
        /* Extra Large Screens / 4K */
        /* ============================= */
        @media screen and (min-width: 1921px) {

            .nav-group {
                max-width: 1900px;
                gap: 40px;
                padding: 18px;
            }

            .topbar {
                height: 120px;
            }

            .island-btn {
                font-size: clamp(20px, 1.2vw, 26px);
                padding: 22px 28px;
                border-radius: 18px;
            }

            .main {
                padding: 30px 40px 0;
            }

            iframe {
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>
<button class="menu-btn" onclick="toggleMenu()">☰</button>

    <div class="app">

        <div class="topbar">

            <div class="nav-group">

                <div class="nav-slider" id="navSlider"></div>

                <div class="island-btn active" onclick="openIsland(0)">
                    <i class="fa-solid fa-circle-check"></i>
                    Correct Options
                </div>

                <div class="island-btn" onclick="openIsland(1)">
                    <i class="fa-solid fa-check-double"></i>
                    True / False
                </div>

                <div class="island-btn" onclick="openIsland(2)">
                    <i class="fa-solid fa-font"></i>
                    One Example
                </div>

                <div class="island-btn" onclick="openIsland(3)">
                    <i class="fa-solid fa-pen"></i>
                    Fill The Blanks
                </div>
            </div>

        </div>

        <div class="main">
            <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>
        </div>

    </div>

    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

        <div class="offcanvas-panel" onclick="event.stopPropagation()">

            <div class="island-btn active" onclick="mobileOpen(0)">
                <i class="fa-solid fa-circle-check"></i>
                Correct Options
            </div>

            <div class="island-btn" onclick="mobileOpen(1)">
                <i class="fa-solid fa-check-double"></i>
                True / False
            </div>

            <div class="island-btn" onclick="mobileOpen(2)">
                <i class="fa-solid fa-font"></i>
                One Word
            </div>

             <div class="island-btn" onclick="mobileOpen(3)">
                <i class="fa-solid fa-pen"></i>
                Fill The Blanks
            </div>
        </div>

    </div>

    <script>

        const sidebarButtons = document.querySelectorAll(".topbar .island-btn");
        const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");

        const slider = document.getElementById("navSlider");

        const frame = document.getElementById("contentFrame");

        const pages = [
            "./exercises/mcq.html",
            "./exercises/true_false.html",
            "./exercises/one_example.html",
            "./exercises/fillblanks.html",
        ];

        function moveSlider(el) {
            slider.style.width = el.offsetWidth + "px";
            slider.style.transform = `translateX(${el.offsetLeft}px)`;
        }

        function openIsland(index) {

            sidebarButtons.forEach(btn => btn.classList.remove("active"));
            sidebarButtons[index].classList.add("active");

            mobileButtons.forEach(btn => btn.classList.remove("active"));
            mobileButtons[index].classList.add("active");

            moveSlider(sidebarButtons[index]);

            frame.src = pages[index];
        }

        function toggleMenu() {

            if (window.innerWidth > 1065) return;

            document.getElementById("offcanvas").classList.toggle("show");
        }

        function mobileOpen(i) {

            openIsland(i);
            toggleMenu();
        }

        window.onload = () => {
            moveSlider(sidebarButtons[0]);
        };

    </script>




</body>
</html>
