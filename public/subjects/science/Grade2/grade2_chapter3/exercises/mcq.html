<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/mcq.css">
</head>

<body>
    <div class="app">
        <div class="template">

            <!-- <div class="quiz-type">🧠 MCQ's</div>
            <button class="home" onclick="location.href='../index.html'">🏠 Home</button> -->

            <!-- PROGRESS -->
            <!-- <div class="parts-progress" id="partsProgress"></div> -->

            <!-- QUESTION -->
            <div class="title" id="titleText"></div>

            <!-- IMAGE -->
            <div class="image-holder">
                <img id="animalImg" />
            </div>

            <!-- OPTIONS -->
            <div class="options" id="optionsBox"></div>

            <!-- NAV -->
            <!-- <div class="nav">
                <button class="prev" id="prevBtn" disabled>← Prev</button>
                <button class="next" id="nextBtn" disabled>Next →</button>
            </div> -->
                <div class="nav">
  <button class="nav-btn prev" id="prev" disabled>
    <span class="circle"><i class="fa-solid fa-chevron-left"></i></span>
    <span class="text">PREV</span>
  </button>

  <button class="nav-btn next" id="next" disabled>
    <span class="text">NEXT</span>
    <span class="circle"><i class="fa-solid fa-chevron-right"></i></span>
  </button>
</div>

        </div>
    </div>

    <!-- CORRECT / WRONG POPUP -->
    <div id="answerPopup" class="popup">
        <div class="popup-content">
            <div class="popup-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <!-- FINAL POPUP -->
    <div id="finalPopup">
        <div class=" finalpopup-box">
            <h2 class="final-heading">🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div><br> <button onclick="location.reload()" class="playAgain-btn"> Play Again </button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
    <script src="../assets/js/mcq.js"></script>

</body>
</html>
