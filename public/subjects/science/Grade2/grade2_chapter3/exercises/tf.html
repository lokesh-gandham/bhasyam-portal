<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
  <meta charset="UTF-8">
  <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/tf.css">

</head>

<body>

  <div class="quiz-card">
    <!-- <div class="quiz-type">🧠 True / False</div>
    <div class="home" onclick="window.location.assign('../index.html')">🏠 Home</div> -->

    <!-- ✅ PROGRESS ABOVE QUESTION ✅ -->
    <!-- <div class="parts-progress" id="partsProgress"></div> -->

    <div class="question" id="question"></div>
    <img id="questionImg" class="question-img" />


    <div class="tf-buttons">
      <button class="true" id="trueBtn">TRUE</button>
      <button class="false" id="falseBtn">FALSE</button>
    </div>

<div class="nav">
  <button class="nav-btn prev" id="prevBtn" disabled>
    <span class="circle">
      <i class="fa-solid fa-angle-left"></i>
    </span>
    <span class="text">PREV</span>
  </button>

  <button class="nav-btn next" id="nextBtn" disabled>
    <span class="text">NEXT</span>
    <span class="circle">
      <i class="fa-solid fa-angle-right"></i>
    </span>
  </button>
</div>

  </div>

  <!-- CORRECT / WRONG POPUP -->
  <div id="answerPopup" class="popup">
    <div class="popup-content">
      <div class="popup-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <!-- FINAL POPUP -->
  <div id="finalPopup">
    <div class=" finalpopup-box">
      <h2 class="final-heading">🎉 Congratulations!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div><br> <button onclick="location.reload()" class="playAgain-btn"> Play Again </button>
    </div>
  </div>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
  <script src="../assets/js/tf.js"></script>

</body>
</html>
