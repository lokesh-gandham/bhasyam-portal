<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
   <link rel="stylesheet" href="../assets/css/FITB.css">
</head>

<body>
    <div class="quiz-container">
        <div class="question-section">
            <div id="questionTitle" class="question-title"></div>
            <img id="questionImage" />
        </div>

        <div class="answer-wrapper">
    <div id="answerSlots" class="answer-slots"></div>

    <button id="backspaceBtn" class="backspace-btn">
        <i class="fa-solid fa-delete-left"></i>
    </button>
</div>
        <div id="letterContainer" class="letter-container"></div>

        <div class="quiz-navigation">
            <button id="previousButton"><i class="fa-solid fa-angles-left"></i> Prev</button>
            <button id="nextButton">Next <i class="fa-solid fa-angles-right"></i></button>
        </div>
    </div>

    <!-- POPUP STRUCTURE -->
    <div id="answerPopup" class="popup">
        <div class="popup-content">
            <div class="popup-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <!-- FINAL POPUP -->
    <div id="finalPopup" class="final">
        <h2>🎉 Congratulations!</h2>
        <h3 id="finalScore"></h3>
        <div>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
        </div>
        <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
   
    <script src="../assets/js/FITB.js"></script>

</body>
</html>
