<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/auth-guard.js"></script>
<meta charset="UTF-8">
<title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/matching.css">

</head>

<body>

<div class="container">

<div class="matching">

<!-- LEFT SIDE (WITH IMAGES) -->

<div class="left" id="left">

<div class="box c" data-match="1">
<img src="../assets/images/water.png" alt="water">
<span>Water</span>
<span class="dot"></span>
</div>

<div class="box c" data-match="2">
<img src="../assets/images/vitamins.png" alt="vitamins">
<span>Vitamins and minerals</span>
<span class="dot"></span>
</div>

<div class="box c" data-match="3">
<img src="../assets/images/protein.png" alt="proteins">
<span>Proteins</span>
<span class="dot"></span>
</div>

<div class="box c" data-match="4">
<img src="../assets/images/fats.png" alt="fats">
<span>Fats</span>
<span class="dot"></span>
</div>

<div class="box c" data-match="5">
<img src="../assets/images/fiber.png" alt="roughage">
<span>Roughage</span>
<span class="dot"></span>
</div>

</div>

<!-- RIGHT SIDE (TEXT ONLY) -->
<div class="right" id="right">

<div class="box c1" data-match="4">
<span class="dot"></span>
Keep our body warm during winter.
</div>

<div class="box c2" data-match="1">
<span class="dot"></span>
Transports substances through our body.
</div>

<div class="box c3" data-match="2">
<span class="dot"></span>
Help to make our teeth and bones strong.
</div>

<div class="box c4" data-match="5">
<span class="dot"></span>
Keeps the digestive system clean.
</div>

<div class="box c5" data-match="3">
<span class="dot"></span>
Help in body-building.
</div>

</div>

</div>

<svg id="lines"></svg>

</div>



<!-- FINAL POPUP -->

<div id="final" class="final">

<h2>🎉 Congratulations!</h2>

<h3 id="score"></h3>

<div>
<span class="star">★</span>
<span class="star">★</span>
<span class="star">★</span>
<span class="star">★</span>
<span class="star">★</span>
</div>

<button class="playBtn" onclick="playAgain()">Play Again</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="../assets/js/matching.js"></script>

</body>
</html>
