<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/auth-guard.js"></script>
<meta charset="UTF-8">
<title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<link rel="stylesheet" href="../assets/css/oneExample.css">
</head>

<body>

<div class="quiz">

<div class="question" id="question"></div>

<div class="imgbox">
<img style="display: none;" id="questionImage">
</div>

<div class="options" id="options"></div>

<div class="nav">
<button class="prev" id="prev"><i class="fa-solid fa-angles-left"></i> Prev</button>
<button class="next" id="next">Next <i class="fa-solid fa-angles-right"></i></button>
</div>

</div>

<!-- POPUP -->

<div id="answerPopup" class="popup">
<div class="popup-content">
<div class="popup-icon" id="popupIcon"></div>
<h3 id="popupTitle"></h3>
<p id="popupMsg"></p>
</div>
</div>

<!-- FINAL -->

<div id="final" class="final">

<h2>🎉 Congratulations!</h2>
<h3 id="score"></h3>

<div>
<span class="star">★</span>
<span class="star">★</span>
<span class="star">★</span>
<span class="star">★</span>
<span class="star">★</span>
</div>

<button class="playBtn" onclick="playAgain()">Play Again</button>

</div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="../assets/js/oneExample.js"></script>



</body>
</html>
