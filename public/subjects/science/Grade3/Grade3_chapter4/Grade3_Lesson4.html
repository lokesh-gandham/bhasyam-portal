<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', 'Comic Neue', 'Livvic', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            /* background: linear-gradient(145deg, #b8e1fc 0%, #f9c9e2 100%); */
            background: url("assets/images/bg14.png");
            background-size: 100% 100%;
            position: relative;
        }
        
        /* Cute playful background elements */
        /* body::before {
            content: "🌸 ⭐ 🧸 🎈";
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 40px;
            opacity: 0.2;
            pointer-events: none;
            white-space: pre;
        }
        
        body::after {
            content: "🐶 🐱 🐼 🐸";
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 48px;
            opacity: 0.2;
            pointer-events: none;
        } */

        .app {
            /* background: rgba(255, 250, 225, 0.75);*/
            backdrop-filter: blur(px); 
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        /* ========== KIDS FRIENDLY TOPBAR ========== */
        .topbar {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 95px;
            /* margin: 15px 15px 5px 15px; */
            position: relative;
            z-index: 100;
        }

        /* Bouncy, colorful nav container */
        .nav-group {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            max-width: 1300px;
            border-radius: 80px;
            padding: 8px 12px;
            /* background: rgba(253, 253, 251, 0.9); */
            /* box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2), inset 0 2px 4px rgba(255,255,200,0.8); */
            /* border: 3px solid #fff9c4; */
            transition: all 0.2s ease;
        }

        /* Playful slider that looks like a candy bar */
        .nav-slider {
            position: absolute;
            top: 6px;
            left: 0px;
            height: calc(100% - 12px);
            border-radius: 70px;
            transition: transform 0.45s cubic-bezier(0.34, 1.2, 0.64, 1), width 0.4s ease;
            background: radial-gradient(circle at 30% 20%, #ffeaa7, #ffd966);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2), inset 0 2px 4px rgba(255,255,200,0.9);
            z-index: 1;
            border: 2px solid #ffb347;
        }

        /* BIG, chubby, happy buttons */
        .island-btn {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 60px;
            white-space: nowrap;
            z-index: 2;
            transition: all 0.25s ease;
            background: #b9b9b9;
           color: #2f4f4f;
            border: 2px solid #c8c8c8;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 0 #ababab;
            transform: translateY(-2px);
        }

        .island-btn i {
            font-size: 1.3em;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
        }

        .island-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 #e0b07f;
            background: #fff7e8;
        }

        .island-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #e0b07f;
        }

        /* Each button gets a unique ice-cream pastel active color */
        .island-btn:nth-child(2).active {
            background: #ffb7b2;
            border-color: #ff8a7a;
            color: #4a1e1a;
            box-shadow: 0 6px 0 #c96f5e;
        }
        .island-btn:nth-child(3).active {
            background: #a7e0ff;
            border-color: #6fc4ff;
            color: #1e4e6e;
            box-shadow: 0 6px 0 #4f9fd4;
        }
        .island-btn:nth-child(4).active {
            background: #ffe5a3;
            border-color: #fcd36a;
            color: #7b5200;
            box-shadow: 0 6px 0 #d4a832;
        }
        .island-btn:nth-child(5).active {
            background: #c5d9ff;
            border-color: #9bb9ff;
            color: #2f3b6b;
            box-shadow: 0 6px 0 #7289da;
        }
        .island-btn:nth-child(6).active {
            background: #e2ccff;
            border-color: #cdacff;
            color: #4b2f6e;
            box-shadow: 0 6px 0 #a47cd6;
        }

        .main {
            flex: 1;
            /* padding: 8px 12px 12px; */
            display: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* border-radius: 48px; */
            /* box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2), inset 0 0 0 3px white;
            background: #fffef7; */
            

        }

        /* ---------- KIDS MOBILE MENU (cute offcanvas) ---------- */
        .menu-btn {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ffaa55;
            border: none;
            font-size: 32px;
            padding: 12px 20px;
            border-radius: 60px;
            color: white;
            box-shadow: 0 8px 0 #b4621a;
            cursor: pointer;
            z-index: 5000;
            transition: 0.07s linear;
            font-weight: bold;
        }
        .menu-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b4621a;
        }

        .offcanvas {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(6px);
            display: none;
            z-index: 4000;
        }
        .offcanvas.show {
            display: block;
        }
        .offcanvas-panel {
            position: absolute;
            right: 0;
            top: 0;
            width: 280px;
            height: 100%;
            background: #fff6e8;
            padding: 70px 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transform: translateX(100%);
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            overflow-y: auto;
            box-shadow: -5px 0 25px rgba(0,0,0,0.25);
            border-left: 8px solid #ffbc6e;
        }
        .offcanvas.show .offcanvas-panel {
            transform: translateX(0);
        }
        .offcanvas-panel .island-btn {
            flex: none;
            padding: 16px 20px;
            font-size: 18px;
            border-radius: 50px;
            background: #ffefcf;
            justify-content: flex-start;
            gap: 15px;
            border: 2px solid #ffcf8a;
            transform: none;
            box-shadow: 0 5px 0 #d49b4a;
        }
        .offcanvas-panel .island-btn.active {
            background: #ffd966;
            border-color: #ffaa33;
            color: #543a1a;
            box-shadow: 0 5px 0 #b46f2a;
        }
        
        @media (max-width: 1000px) {
            .topbar {
                display: none;
            }
            .menu-btn {
                display: block;
            }
            .offcanvas-panel {
                width: 280px;
            }
        }
        @media (max-width: 550px) {
            .offcanvas-panel {
                width: 75%;
            }
            .offcanvas-panel .island-btn {
                font-size: 16px;
                padding: 14px 18px;
            }
            .menu-btn {
                font-size: 28px;
                padding: 10px 18px;
                top: 15px;
                right: 15px;
            }
        }

        /* Responsive scaling (keep original logic) */
        @media (min-width: 900px) and (max-height: 800px) {
            .app { transform: scaleY(0.95); transform-origin: top center; height: calc(100vh / 0.95); }
        }
        @media (min-width: 900px) and (max-height: 700px) {
            .app { transform: scaleY(0.9); transform-origin: top center; height: calc(100vh / 0.9); }
        }
        @media (min-width: 900px) and (max-height: 600px) {
            .app { transform: scaleY(0.85); transform-origin: top center; height: calc(100vh / 0.85); }
        }
        @media (min-width: 900px) and (max-height: 500px) {
            .app { transform: scaleY(0.8); transform-origin: top center; height: calc(100vh / 0.8); }
        }

        /* Desktop extra large friendliness */
        @media screen and (min-width: 1025px) and (max-width: 1440px) {
            .nav-group { max-width: 1150px; gap: 10px; }
            .island-btn { font-size: 17px; padding: 15px 20px; gap: 8px; }
            .topbar { height: 85px; }
        }
        @media screen and (min-width: 1441px) and (max-width: 1920px) {
            .nav-group { max-width: 1450px; gap: 18px; padding: 12px 20px; }
            .island-btn { font-size: 18px; padding: 16px 24px; gap: 14px; }
            .topbar { height: 105px; }
        }
        @media screen and (min-width: 1921px) {
            .nav-group { max-width: 1750px; gap: 28px; padding: 18px 28px; }
            .island-btn { font-size: 22px; padding: 20px 32px; gap: 18px; }
            .topbar { height: 125px; }
            .main { padding: 20px 30px 0; }
        }
        
        /* extra little bounce animation for nav-group */
        @keyframes wiggle {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(1deg); }
            75% { transform: rotate(-0.5deg); }
            100% { transform: rotate(0deg); }
        }
        .nav-group:hover {
            animation: wiggle 0.3s ease;
        }
    </style>
</head>
<body>
<button class="menu-btn" onclick="toggleMenu()">📚 ☰</button>

    <div class="app">
        <div class="topbar">
            <div class="nav-group">
                <div class="nav-slider" id="navSlider"></div>
                <div class="island-btn active" onclick="openIsland(0)">
                    <i class="fa-regular fa-circle-check"></i>
                    Correct Options
                </div>
                <div class="island-btn" onclick="openIsland(1)">
                    <i class="fa-regular fa-check-circle"></i>
                   True / False
                </div>
                <div class="island-btn" onclick="openIsland(2)">
                    <i class="fa-regular fa-star"></i>
                     Two Examples
                </div>
                <div class="island-btn" onclick="openIsland(3)">
                    <i class="fa-solid fa-pencil"></i>
                     Fill Blanks
                </div>
                
                <div class="island-btn" onclick="openIsland(4)">
                    <i class="fa-solid fa-puzzle-piece"></i>
                     Matching
                </div>
                
            </div>
        </div>

        <div class="main">
            <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>
        </div>
    </div>

    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">
        <div class="offcanvas-panel" onclick="event.stopPropagation()">
            <div class="island-btn active" onclick="mobileOpen(0)">
                <i class="fa-regular fa-circle-check"></i>  Correct Options
            </div>
             <div class="island-btn" onclick="mobileOpen(1)">
                <i class="fa-regular fa-check-circle"></i>  True / False
            </div>
             <div class="island-btn" onclick="mobileOpen(2)">
                <i class="fa-regular fa-star"></i>  Two Examples
            </div>
            <div class="island-btn" onclick="mobileOpen(3)">
                <i class="fa-solid fa-pencil"></i>  Fill The Blanks
            </div>
           
            <div class="island-btn" onclick="mobileOpen(4)">
                <i class="fa-solid fa-puzzle-piece"></i>  Matching
            </div>
           
            
        </div>
    </div>

    <script>
        const sidebarButtons = document.querySelectorAll(".topbar .island-btn");
        const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");
        const slider = document.getElementById("navSlider");
        const frame = document.getElementById("contentFrame");

        const pages = [
            "./exercises/mcq.html",
             "./exercises/true_false.html",
            "./exercises/one_example.html",
            "./exercises/FTB.html",
             "./exercises/matching.html",
        ];

        function moveSlider(el) {
            if (!el) return;
            const container = el.parentElement;
            const containerRect = container.getBoundingClientRect();
            const btnRect = el.getBoundingClientRect();
            let relativeLeft = btnRect.left - containerRect.left;
            // Clamp to prevent negative tiny offset
            relativeLeft = Math.max(2, relativeLeft);
            slider.style.width = el.offsetWidth + "px";
            slider.style.transform = `translateX(${relativeLeft}px)`;
        }

        function openIsland(index) {
            // update active styles
            sidebarButtons.forEach(btn => btn.classList.remove("active"));
            if (sidebarButtons[index]) sidebarButtons[index].classList.add("active");
            
            mobileButtons.forEach(btn => btn.classList.remove("active"));
            if (mobileButtons[index]) mobileButtons[index].classList.add("active");
            
            const activeBtn = sidebarButtons[index];
            if (activeBtn) {
                moveSlider(activeBtn);
            }
            
            if (pages[index]) {
                frame.src = pages[index];
            }
        }

        function toggleMenu() {
            if (window.innerWidth > 1000) return; // matches mobile break
            const offcanvas = document.getElementById("offcanvas");
            offcanvas.classList.toggle("show");
        }

        function mobileOpen(i) {
            openIsland(i);
            toggleMenu();
        }

        // initial load
        window.onload = () => {
            document.querySelectorAll(".main").forEach(m => m.style.display = "flex");
            // make sure slider starts properly
            if (sidebarButtons.length && sidebarButtons[0]) {
                moveSlider(sidebarButtons[0]);
            }
            frame.src = pages[0];
        };

        // re-calc on resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const activeIndex = Array.from(sidebarButtons).findIndex(btn => btn.classList.contains('active'));
                if (activeIndex !== -1 && sidebarButtons[activeIndex]) {
                    moveSlider(sidebarButtons[activeIndex]);
                } else if (sidebarButtons[0]) {
                    moveSlider(sidebarButtons[0]);
                }
            }, 120);
        });
        
        // optional: observe nav-group changes
        if (window.ResizeObserver) {
            const observer = new ResizeObserver(() => {
                const activeIndex = Array.from(sidebarButtons).findIndex(btn => btn.classList.contains('active'));
                if (activeIndex !== -1 && sidebarButtons[activeIndex]) {
                    moveSlider(sidebarButtons[activeIndex]);
                }
            });
            const navGroup = document.querySelector('.nav-group');
            if (navGroup) observer.observe(navGroup);
        }
        
        // when iframe loads, ensure slider stability
        frame.addEventListener('load', () => {
            setTimeout(() => {
                const activeIndex = Array.from(sidebarButtons).findIndex(btn => btn.classList.contains('active'));
                if (activeIndex !== -1 && sidebarButtons[activeIndex]) {
                    moveSlider(sidebarButtons[activeIndex]);
                }
            }, 60);
        });
    </script>



</body>
</html>
