<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Livvic';
    }

    body {
      height: 100vh;
      display: flex;
      background: url("./images/bg1.jpg");
      background-size: 100% 100%;
      overflow: hidden;
    }

    /* ================= */
    /* SIDEBAR */
    /* ================= */

    .sidebar {
      width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 25px;
    }

    /* ================= */
    /* 🎮 CONTROLLER */
    /* ================= */

    .controller {
      width: 200px;
      height: 90px;
      position: relative;
      cursor: pointer;
      transition: .3s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 600;
      overflow: hidden;

      /* FUTURISTIC CAPSULE DESIGN */
      background:
        linear-gradient(145deg, #d9dce2, #bcc2cb);

      color: #5d6470;

      border-radius: 34px 14px 34px 14px;

      border: 2px solid rgba(255, 255, 255, 0.5);

      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.55),
        inset 0 -3px 6px rgba(0, 0, 0, 0.08),
        0 10px 18px rgba(0, 0, 0, 0.14);
    }

    /* INNER RAIL EFFECT */
    .controller::before {
      content: "";
      position: absolute;

      left: 10px;
      top: 10px;
      bottom: 10px;
      width: 12px;

      border-radius: 20px;

      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.45),
          rgba(255, 255, 255, 0.08));

      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    /* STATUS NODE */
    .controller::after {
      content: "";
      position: absolute;

      right: 14px;
      width: 16px;
      height: 16px;

      border-radius: 50%;

      background: #8d96a3;

      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.45),
        0 0 0 5px rgba(255, 255, 255, 0.12);
    }

    /* HIDE OLD ELEMENTS */
    .controller .stick {
      opacity: 0;
      pointer-events: none;
    }

    .controller .btns {
      opacity: 0;
      pointer-events: none;
    }

    .controller span {
      z-index: 2;
      display: block;
      padding: 0 10px;
      letter-spacing: 0.3px;

      /* RESPONSIVE FONT */
      font-size: 17px;

      line-height: 1.2;
      white-space: nowrap;
    }

    /* ACTIVE STATE */

    .controller.active {
      background:
         linear-gradient(145deg, #83c8d4, #83c8d4);

      color: rgb(12, 12, 12);

      border: 2px solid rgba(255, 255, 255, 0.78);

      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.089),
        inset 0 -4px 8px rgba(0, 0, 0, 0.096),
        0 14px 24px rgba(37, 235, 136, 0.123);
    }

    .controller.active::before {
      background:
        linear-gradient(180deg,
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0.12));
    }

    .controller.active::after {
      background: #ffffff;

      box-shadow:
        0 0 0 5px rgba(255, 255, 255, 0.16),
        0 0 16px rgba(255, 255, 255, 0.65);
    }

    .controller:hover {
      transform: translateY(-2px);
    }

    /* ================= */
    /* CONTENT */
    /* ================= */

    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .screen-main {
      width: 100%;
      max-width: 1100px;
      height: 100%;
      border-radius: 25px;
      overflow: hidden;

    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ================= */
    /* MOBILE */
    /* ================= */

    .menu-toggle {
      display: none;
    }



    @media (max-width:1024px) {

      /* SIDEBAR → RIGHT SIDE */
      .sidebar {
        position: fixed;
        right: -260px;
        left: auto;
        top: 0;
        height: 100%;
        width: 260px;
        background: white;
        transition: .3s;
        z-index: 999;
      }

      /* OPEN FROM RIGHT */
      .sidebar.open {
        right: 0;
      }

      .controller span {
        font-size: 15px;
      }

      /* MENU BUTTON RIGHT SIDE */
      .menu-toggle {
        display: block;
        position: fixed;
        top: 10px;
        right: 15px;
        left: auto;
        font-size: 26px;
        background: white;
        border: none;
        padding: 6px 12px;
        border-radius: 8px;
        z-index: 1000;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      /* OPTIONAL: ADD OVERLAY EFFECT */
      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
        opacity: 0;
        pointer-events: none;
        transition: .3s;
      }

      /* SHOW OVERLAY WHEN OPEN */
      .sidebar.open~.content::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        z-index: 500;
      }

    }

    /* ============================= */
    /* 🖥 Large Monitors (1441px - 1920px) */
    /* ============================= */

    @media screen and (min-width: 1441px) and (max-width: 1600px) {
      .screen-main {
        max-width: 1350px;
        height: 820px;
      }

      .sidebar {
        width: 260px;
        gap: 20px;
      }

      .controller {
        width: 220px;
        height: 105px;
        font-size: 20px;
      }

    }

    /* ================= 1601px — 1750px ================= */

    @media screen and (min-width: 1601px) and (max-width: 1750px) {
      .screen-main {
        max-width: 1450px;
        height: 860px;
      }

      .sidebar {
        width: 300px;
        gap: 24px;
      }

      .controller {
        width: 240px;
        height: 112px;
      }

      .controller span{
        font-size: 22px;
      }

    }

    /* ================= 1751px — 1920px ================= */

    @media screen and (min-width: 1751px) and (max-width: 1920px) {

      .screen-main {
        max-width: 1500px;
        height: 900px;
      }

      .sidebar {
        width: 310px;
        gap: 20px;
      }

      .controller {
        width: 270px;
        height: 120px;
      }

      .controller span{
        font-size: 22px;
      }

    }

    /* ============================= */
    /* 🧠 4K Screens (1921px+) */
    /* ============================= */
    @media screen and (min-width: 1921px) {

      .screen-main {
        max-width: 1800px;
        height: 1000px;
      }

      .sidebar {
        width: 330px;
        gap: 35px;
      }

      .controller {
        width: 290px;
        height: 130px;
      }

      .controller span{
        font-size: 24px;
      }

    }
  </style>
</head>

<body>
<button class="menu-toggle" id="toggle">☰</button>

  <!-- SIDEBAR -->
  <div class="sidebar" id="menu">

    <div class="controller active" data-file="./exercise/mcq.html">
      <div class="stick"></div>
      <div class="btns">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <span>Choose Option</span>
    </div>


    <div class="controller" data-file="./exercise/truefalse.html">
      <div class="stick"></div>
      <div class="btns">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <span>True / False</span>
    </div>


    <div class="controller" data-file="./exercise/oneword.html">
      <div class="stick"></div>
      <div class="btns">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <span>One Word</span>
    </div>


    <div class="controller" data-file="./exercise/fillintheblanks.html">
      <div class="stick"></div>
      <div class="btns">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <span>Fill The Blanks</span>
    </div>

    <div class="controller" data-file="./exercise/matching.html">
      <div class="stick"></div>
      <div class="btns">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <span>Matching</span>
    </div>

  </div>

  <!-- CONTENT -->
  <div class="content">
    <div class="screen-main">
      <iframe id="frame" src="./exercise/mcq.html"></iframe>
    </div>
  </div>

  <script>

    const btns = document.querySelectorAll(".controller");
    const frame = document.getElementById("frame");
    const menu = document.getElementById("menu");
    const toggle = document.getElementById("toggle");

    btns.forEach(btn => {
      btn.onclick = () => {
        btns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        frame.src = btn.dataset.file;
        menu.classList.remove("open");
      };
    });

    toggle.onclick = () => {
      menu.classList.toggle("open");
    };

  </script>




</body>
</html>
