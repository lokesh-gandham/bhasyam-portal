<!DOCTYPE html>

<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
  <meta charset="UTF-8">
  <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Livvic';
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .quiz-box {
      width: 1100px;
      /* padding: 40px; */
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -80px;
    }

    .question {
      max-width: 900px;
      width: 100%;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: center;
   text-align: left;
      padding: 0 20px;

      font-size: 30px;
      color: #136113;

      height: 80px;
      /* 🔥 FIXED HEIGHT */
      line-height: 1.3;

      overflow: hidden;
    }

    .image-box img {
      width: 350px;
      height: 200px;
      object-fit: contain;
    }

    .letter-container {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    /* 🎨 PLAYFUL CIRCLE LETTER BOXES */
    .letter {
      width: 65px;
      height: 65px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 26px;
      font-weight: 800;

      color: #444;

      /* 🌈 pastel gradient base */
      background: #f1edc1;
      border: 2px solid #136113;

      /* ✨ soft 3D effect */
      box-shadow:
        0 6px 15px rgba(0, 0, 0, 0.123),
        inset 0 4px 8px rgba(255, 255, 255, .7),
        inset 0 -6px 10px rgba(0, 0, 0, .08);

      transition: .25s;
    }

    /* ✨ HOVER EFFECT */
    .letter:hover {
      transform: scale(1.1) rotate(-3deg);
    }

    /* 🎯 ACTIVE (typing position) */
    .letter.active {
      outline: 4px solid #4cc9f0;
      transform: scale(1.15);
    }

    /* ✅ CORRECT */
    .letter.correct {
      background: #b9fbc0;
      border: 2px solid #70d688;
      color: #14532d;
    }

    /* ❌ WRONG */
    .letter.wrong {
      background: #ffcdcd;
      border: 2px solid rgb(253, 166, 166);
      color: #d35f5f;
      animation: shake .3s;
    }

    /* ❌ SHAKE */
    @keyframes shake {
      0% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-5px)
      }

      50% {
        transform: translateX(5px)
      }

      75% {
        transform: translateX(-5px)
      }

      100% {
        transform: translateX(0)
      }
    }

    .buttons {
      position: absolute;
      top: 85%;
      /* 🔥 vertical middle */
      left: 0;
      width: 100%;
      transform: translateY(-50%);
      pointer-events: none;
      /* allow only buttons clickable */
    }

    .prev {
      position: absolute;
      left: 10px;
      /* 🔥 left side */
      pointer-events: auto;
    }

    .next {
      position: absolute;
      right: 10px;
      /* 🔥 right side */
      pointer-events: auto;
    }

    button {
      padding: 10px 28px;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      color: #333;
    }

    .prev {
      background: #95d5b2;
    }

    .next {
      background: #ffb4a2;
    }

    /* ✨ HOVER */
    button:hover {
      transform: scale(1.08);
      filter: brightness(1.05);
    }

    /* CLICK */
    button:active {
      transform: scale(0.95);
    }


    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }


    /* 🔥 MCQ POPUP */
    .popup-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .popup-box {
      width: 320px;
      padding: 30px;
      border-radius: 30px;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      animation: popScale .4s ease;
    }

    .popup-correct {
      background: linear-gradient(135deg, #ffffff, #ffffff);
      border: 3px solid #5ed164;
      color: #14532d;
    }

    .popup-wrong {
      background: linear-gradient(135deg, #ffffff, #ffffff);
      border: 3px solid #ffa1a1;
      color: #7f1d1d;
      animation: shake 0.4s, popScale 0.4s;
    }

    .popup-final {
      background: linear-gradient(135deg, #ffefb0, #ffefb0);
      border: 3px solid #ffbe0b;
      color: #7a5c00;
    }

    .play-btn {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #02be8c;
      color: white;
      cursor: pointer;
    }

    /* ========================= */
    /* 📱 MOBILE */
    /* ========================= */
    @media (max-width:600px) {

      body {
        padding: 10px;
        align-items: center;
        overflow: auto;
      }

      .quiz-box {
        width: 100%;
        padding: 15px;
      }

      /* question */
      .question {
        font-size: 18px;
        text-align: center;
      }

      /* image */
      .image-box img {
        width: 100px;
        height: 100px;
      }

      /* letters */
      .letter-container {
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .letter {
        width: 45px;
        height: 45px;
        font-size: 18px;
      }

      /* 🔥 BUTTONS */
      button {
        font-size: 14px;
        padding: 8px 18px;
      }

      .nav-buttons {
        gap: 15px;
        padding: 10px;
      }
    }

    @media (max-width:600px) {

      .buttons {
        position: static;
        /* 🔥 reset */
        transform: none;
        /* 🔥 remove translate */

        display: flex;
        justify-content: center;
        /* center bottom */
        gap: 15px;
        padding: 15px 10px;
        margin-top: 20px;
      }

      .prev,
      .next {
        position: static;
        /* 🔥 reset side positioning */
      }

    }

    /* ========================= */
    /* 💻 Desktop / Monitor */
    /* ========================= */
    @media screen and (min-width: 1225px) and (max-width: 1440px) {

      /* MAIN BOX */
      .quiz-box {
        width: 100%;
        max-width: 1400px;
        padding: 40px;
      }

      /* QUESTION */
      .question {
        font-size: 30px;
        text-align: left;
        height: 100px;
        line-height: 1.2;
      }

      /* IMAGE */
      .image-box img {
        width: 350px;
        height: 300px;
        object-fit: contain;
      }

      /* LETTER CONTAINER */
      .letter-container {
        max-width: 1100px;
        gap: 14px;
        margin-top: 25px;
      }

      /* 🎯 LETTER BOX */
      .letter {

        width: 90px;
        height: 90px;
        font-size: 32px;
        border-radius: 50%;

        box-shadow:
          0 10px 20px rgba(0, 0, 0, .2),
          inset 0 4px 8px rgba(255, 255, 255, .7);
      }

      /* ACTIVE */
      .letter.active {
        transform: scale(1.15);
      }

      /* BUTTON */
      button {
        font-size: 22px;
        padding: 18px 36px;
        border-radius: 40px;
        min-width: 140px;
      }

      .popup-box {
        width: 340px;
        font-size: 26px;
        padding: 35px;
      }

      .play-btn {
        font-size: 18px;
        padding: 12px 25px;
      }

      .prev {
        position: absolute;
        left: 0px;
        /* 🔥 left side */
        pointer-events: auto;
      }

      .next {
        position: absolute;
        right: 0px;
        /* 🔥 right side */
        pointer-events: auto;
      }

    }

    /* ========================= */
    /* 🖥 Large Monitors */
    /* ========================= */
    @media screen and (min-width: 1441px) and (max-width: 1920px) {

      .quiz-box {
        max-width: 1400px;
      }

      .question {
        font-size: 40px;
      }

      .image-box img {
        width: 420px;
      }

      .letter {
        width: 70px;
        height: 70px;
        font-size: 28px;
      }

    }

    /* ============================= */
    /* 🖥 MONITOR POPUP BIGGER */
    /* ============================= */

    @media (min-width:1225px) and (max-width:1440px) {

      /* 🔥 NORMAL POPUP */

      .popup-box {

        width: 420px;

        padding: 50px 40px;

        border-radius: 38px;

        font-size: 38px;

      }

      /* 🔥 FINAL POPUP */

      .popup-final {

        width: 520px;

        padding: 60px 45px;

        font-size: 40px;

      }

      /* 🔥 PLAY AGAIN BUTTON */

      .play-btn {

        font-size: 24px;

        padding: 16px 32px;

        border-radius: 35px;

        margin-top: 25px;

      }

    }

    /* ========================= */
    /* 🖥 Extra Large Screens */
    /* ========================= */
    @media screen and (min-width: 1921px) {

      .quiz-box {
        max-width: 1700px;
      }

      .question {
        font-size: 42px;
      }

      .image-box img {
        width: 500px;
      }

      .letter {
        width: 80px;
        height: 80px;
        font-size: 32px;
      }

      button {
        font-size: 22px;
        padding: 14px 30px;
      }

    }

    /* ================================= */
    /* 🖥 LARGE MONITOR POPUP FIX */
    /* ================================= */

    @media screen and (min-width:1441px) {

      .popup-box {

        width: 460px !important;

        padding: 55px 45px !important;

        border-radius: 40px;

        font-size: 40px !important;

      }

      .popup-final {

        width: 560px !important;

        padding: 65px 50px !important;

        font-size: 42px !important;

      }

      .play-btn {

        font-size: 24px !important;

        padding: 16px 34px !important;

        border-radius: 40px;

        margin-top: 25px;

      }

    }



    .letter.cursor {
  position: relative;
}

.letter.cursor::after {
  content: "";
  position: absolute;
  width: 3px;
  height: 28px;
  background: #333;
  animation: blink 0.8s infinite;
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}
  </style>

</head>

<body tabindex="0">

  <div class="quiz-box">

    <div class="question" id="question"></div>

    <div class="image-box">
      <img id="questionImage">
    </div>

    <div class="letter-container" id="letters"></div>

    <div class="buttons">
      <button class="prev" onclick="prevQ()">← Prev</button>
      <button class="next" id="nextBtn" onclick="nextQ()" disabled>Next →</button>
    </div>

  </div>

  <script>

    const questions = [
      { q: "Q1. The tubes in which blood flows across our body.", a: "blood vessels", img: "../images/word1.png" },
      { q: "Q2. The organ that pumps blood throughout our life.", a: "heart", img: "../images/arteries.png" },
      { q: "Q3. The upper two chambers of the heart.", a: "auricles", img: "../images/word3.png" },
      { q: "Q4. The main organ of the circulatory system.", a: "heart", img: "../images/blood-circulation.png" },
      { q: "Q5. The two branches that the windpipe divides into.", a: "bronchi", img: "../images/w5.png" }
    ];

    let current = 0;
    let answers = new Array(questions.length).fill(null);
    let score = 0;
    let input = "";
    let locked = false;

    const qEl = document.getElementById("question");
    const imgEl = document.getElementById("questionImage");
    const letters = document.getElementById("letters");
    const prevBtn = document.querySelector(".prev");
    const nextBtn = document.querySelector(".next");

    function speak(text) {
      let msg = new SpeechSynthesisUtterance(text);
      speechSynthesis.speak(msg);
    }
    /* 🎉 POPUP */
    function showPopup(text, type) {

      let overlay = document.createElement("div");
      overlay.className = "popup-overlay";

      let box = document.createElement("div");
      box.className = "popup-box " + (type === "correct" ? "popup-correct" : "popup-wrong");
      box.innerHTML = text;

      overlay.appendChild(box);
      document.body.appendChild(overlay);

      setTimeout(() => overlay.remove(), 1200);
    }

    /* 🏁 FINAL */
    function showFinal() {

      let overlay = document.createElement("div");
      overlay.className = "popup-overlay";

      let box = document.createElement("div");
      box.className = "popup-box popup-final";

      box.innerHTML = `
          🎉 Score: ${score}/${questions.length}<br>
          <button class="play-btn" onclick="location.reload()">Play Again</button>
          `;

      overlay.appendChild(box);
      document.body.appendChild(overlay);
      confetti({ particleCount: 120, spread: 90, origin: { y: 0.6 } });
    }

    /* LOAD */
    function loadQ() {

      let q = questions[current];
      prevBtn.disabled = current === 0;

      qEl.innerText = q.q;
      imgEl.src = q.img;

      letters.innerHTML = "";
      input = "";
      locked = false;

      let answer = q.a.replace(" ", "");

      /* restore */
      if (answers[current]) {
        input = answers[current];
        locked = true;
        nextBtn.disabled = false;
      }

      for (let i = 0; i < answer.length; i++) {
        let div = document.createElement("div");
        div.className = "letter";
        div.textContent = (input[i] || "").toUpperCase();

        if (locked) div.classList.add("correct");

        letters.appendChild(div);
      }

      if (!locked) nextBtn.disabled = true;
      if (current === questions.length - 1 && answers[current] === questions[current].correct) {
        nextBtn.disabled = true;
      }

      const allBoxes = document.querySelectorAll(".letter");

if (!locked && allBoxes.length) {
  allBoxes[0].classList.add("cursor");
}

setTimeout(() => {
  document.body.focus();
}, 100);
    }

    document.body.setAttribute("tabindex", "0");
document.body.focus();

window.addEventListener("click", () => {
  document.body.focus();
});
    /* TYPE */
    document.addEventListener("keydown", (e) => {

      if (locked) return;

      let answer = questions[current].a.replace(" ", "").toUpperCase();
      let boxes = document.querySelectorAll(".letter");

      if (e.key === "Backspace") {
        input = input.slice(0, -1);
      }
      else if (/^[a-zA-Z]$/.test(e.key) && input.length < answer.length) {
        input += e.key.toUpperCase();
      }

      boxes.forEach((b, i) => b.textContent = (input[i] || "").toUpperCase());
      boxes.forEach(b => b.classList.remove("cursor"));

if (input.length < boxes.length) {
  boxes[input.length].classList.add("cursor");
}

      /* CHECK */
      if (input.length === answer.length) {

        if (input === answer) {

          boxes.forEach(b => b.classList.add("correct"));

          answers[current] = input;
          score++;
          locked = true;

          confetti();
          showPopup("🎉 Correct!", "correct");
          speak("Correct");

          nextBtn.disabled = false;

          if (current === questions.length - 1) {
            setTimeout(showFinal, 1200);
          }

        } else {

          boxes.forEach(b => b.classList.add("wrong"));

          showPopup("❌ Try again!", "wrong");
          speak("Try again");

          setTimeout(() => {
            input = "";
            boxes.forEach(b => {
              b.textContent = "";
              b.classList.remove("wrong");
            });
          }, 800);
        }
      }

    });

    /* NAV SAME AS MCQ */
    function nextQ() {
      if (!answers[current]) return;

      if (current < questions.length - 1) {
        current++;
        loadQ();
      }
    }

    function prevQ() {
      if (current > 0) {
        current--;
        loadQ();
      }
    }

    loadQ();

  </script>


</body>
</html>
