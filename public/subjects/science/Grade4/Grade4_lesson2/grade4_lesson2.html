<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
             /* background: linear-gradient(#f1edc1, #f1edc1); */
             background-color: white;
            /* background: url("./images/bg.png");
            background-size: 4px 4px; */
            overflow: hidden;
        }

        /* ================= */
        /* CONTENT */
        /* ================= */

        .content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    /* padding: 10px 20px 20px; */
    background: #f3fffe27;
}

        .screen {
            width: 100%;
            max-width: 1400px;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ================= */
        /* 🎮 ARCADE CONTROL BAR */
        /* ================= */

   .bottom-bar {
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    padding: 15px;
    background: #f3fffe27;

    position: sticky;
    top: 0;
    z-index: 100;

    backdrop-filter: blur(8px);
}
        /* 🎮 BUTTON */

        .tile {

            width: 180px;
            height: 60px;

            border-radius: 18px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            color:#3f5f5f;

            font-weight: 500;
            font-size: 18px;

            position: relative;

            transition: .25s;

            background: #ffdcb7;

            border: 3px solid #ffa24b;

            box-shadow:
                0 6px 0 #dda271,
                0 10px 15px rgba(0, 0, 0, 0.12);
            
            filter: grayscale(90%);
        }

        /* ICON */

        .tile .icon {

            font-size: 22px;

            margin-bottom: 3px;
        }

        /* HOVER */

        .tile:hover {

            transform:
                translateY(-2px) scale(1.01);
        }

        /* CLICK */

        .tile:active {

            transform: translateY(4px);

            box-shadow:
                0 2px 0 #fefdfc;
        }

        /* ✅ ACTIVE QUIZ */

        .tile.active {

             background: linear-gradient(#f1edc1, #f1edc1);

            color: #136113 !important;
            filter: grayscale(0%);
            border: 4px solid #f1edc1;
         
            /* outline: 4px solid #ffffff; */
 
               box-shadow:
                0 10px 0 #d5d09b,
                0 10px 15px rgba(0, 0, 0, 0.12); 
        }

        /* ================= */
        /* 📱 MOBILE */
        /* ================= */

        @media(max-width:700px) {

            .tile {
                width: 85px;
                height: 60px;
                font-size: 12px;
            }

            .bottom-bar {
                gap: 10px;
            }
        }

        /* ================= */
        /* 🔥 OFFCANVAS ADD */
        /* ================= */

        .menu-toggle {
            display: none;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            top: 0;
            right: -260px;
            width: 260px;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: .3s;
            z-index: 999;
        }

        .sidebar.open {
            right: 0;
        }

        /* MENU ITEMS */
        .controller {
            width: 200px;
            padding: 12px;
            border-radius: 12px;
            background: #f1f1f1;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
        }

        .controller:hover {
            background: #ddd;
        }

        /* 📱 MOBILE + TABLET */
        @media (max-width:1024px) {

            .menu-toggle {
                display: block;
                position: fixed;
                top: 10px;
                right: 15px;
                font-size: 26px;
                background: white;
                border: none;
                padding: 6px 12px;
                border-radius: 8px;
                z-index: 1000;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            }

        }

        /* 📱 MOBILE + TABLET */
        @media (max-width:1024px) {

            /* ❌ HIDE BOTTOM BAR */
            .bottom-bar {
                display: none;
            }

            /* OPTIONAL: FULL HEIGHT CONTENT */
            .content {
                padding: 10px;
            }

        }

        /* =========================
   🎨 PASTEL THEME (MOBILE + TABLET)
========================= */
        @media (max-width:1024px) {


            /* 🟦 MENU BUTTON */
            .menu-toggle {
                background: #ffffff;
                color: #333;
            }

            /* 🎯 SIDEBAR BACKGROUND */
            .sidebar {
                background: linear-gradient(180deg, #f1f0ff, #e0f7fa);
            }

            /* 🎮 MENU ITEMS (PASTEL VARIANTS) */
            .controller:nth-child(1) {
                background: #ffd6e0;
            }

            .controller:nth-child(2) {
                background: #fff1b6;
            }

            .controller:nth-child(3) {
                background: #d0f4de;
            }

            .controller:nth-child(4) {
                background: #cde7ff;
            }

            .controller:nth-child(5) {
                background: #e0c3fc;
            }

            /* ✨ HOVER SOFT */
            .controller:hover {
                transform: scale(1.05);
                box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            }

            /* 📱 OPTIONAL: iframe area softer */
            .screen {
                background: transparent;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            }

        }

        /* ============================= */
        /* 🔥 BASE (Laptop Design Reference) */
        /* ============================= */

        .screen {
            width: 100%;
            max-width: 1100px;
            /* laptop reference */
            margin: auto;
        }

        /* ============================= */
        /* 🖥 Desktop (1025px – 1440px) */
        /* ============================= */
        @media (min-width:1025px) and (max-width:1440px) {

            .screen {
                max-width: 1200px;
            }

            .tile {
                width: 190px;
                height: 65px;
                font-size: 18px;
            }
        }

        /* ============================= */
        /* 🖥 Large Monitor (1441px – 1920px) */
        /* ============================= */
        @media (min-width:1441px) and (max-width:1920px) {

            .screen {
                max-width: 1400px;
                /* expand layout */
            }

            .bottom-bar {
                gap: 50px;
            }

            .tile {
                width: 250px;
                height: 80px;
                font-size: 22px;
            }
        }

        /* ============================= */
        /* 🖥 4K / Extra Large */
        /* ============================= */
        @media (min-width:1921px) {

            .screen {
                max-width: 1600px;
            }

            .bottom-bar {
                gap: 50px;
            }

            .tile {
                width: 260px;
                height: 85px;
                font-size: 22px;
                border-radius: 18px;
            }

            .tile .icon {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
<!-- 🔥 MENU BUTTON -->
    <button class="menu-toggle" id="toggle">☰</button>

    <!-- 🔥 SIDEBAR -->
    <div class="sidebar" id="menu">

        <div class="controller" data-file="./exercise/mcq.html">📝 Correct Option</div>
        <div class="controller" data-file="./exercise/truefalse.html">✔ True/False</div>
        <div class="controller" data-file="./exercise/oneword.html">🔤 One Word</div>
        <div class="controller" data-file="./exercise/fillintheblanks.html">✏ Fill In Blanks</div>
        <div class="controller" data-file="./exercise/matching.html">🔗 Matching</div>

    </div>

    <!-- CONTENT -->
  <!-- 🎮 TOP BAR -->
<div class="bottom-bar">

    <div class="tile active" data-file="./exercise/mcq.html">
        <div class="icon">📝</div>
        Correct Option
    </div>

    <div class="tile" data-file="./exercise/truefalse.html">
        <div class="icon">✔</div>
        True/False
    </div>

    <div class="tile" data-file="./exercise/oneword.html">
        <div class="icon">🔤</div>
        One Word
    </div>

    <div class="tile" data-file="./exercise/fillintheblanks.html">
        <div class="icon">✏</div>
        Fill In Blanks
    </div>

    <div class="tile" data-file="./exercise/matching.html">
        <div class="icon">🔗</div>
        Matching
    </div>

</div>

<!-- CONTENT -->
<div class="content">
    <div class="screen">
        <iframe id="frame" src="./exercise/mcq.html"></iframe>
    </div>
</div>

    <script>

        const items = document.querySelectorAll(".tile");
        const frame = document.getElementById("frame");

        /* BOTTOM BAR */
        items.forEach(item => {
            item.onclick = () => {
                items.forEach(i => i.classList.remove("active"));
                item.classList.add("active");
                frame.src = item.dataset.file;
            };
        });

        /* 🔥 OFFCANVAS JS */
        const menu = document.getElementById("menu");
        const toggle = document.getElementById("toggle");

        toggle.onclick = () => {
            menu.classList.toggle("open");
        };

        document.querySelectorAll(".controller").forEach(btn => {
            btn.onclick = () => {
                frame.src = btn.dataset.file;
                menu.classList.remove("open");
            };
        });

    </script>




</body>
</html>
