<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      font-family: 'Livvic';
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Livvic';
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding: 20px;
      /* 🔥 NO SCROLL */

    }

    .quiz-box {
      width: 100%;
      max-width: 1400px;
      text-align: center;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      /* height:60%; 🔥 force fit */
    }

    /* QUESTION */
    .question {
      font-size: clamp(20px, 2.5vw + 1vh, 30px);
      color: #2f4f4f;
      line-height: 1.3;
      margin-top: -50px;
    }

    .question-img {
      width: clamp(200px, 35vw, 500px);
      height: clamp(160px, 28vw, 380px);
      object-fit: contain;
      margin: 20px auto;
      margin-top: -10px;
    }

    .options {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: -20px;
    }


    .option {
      width: 200px;
      height: 150px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      transition: .3s;
      font-weight: 600;

      position: relative;

      /* 🌸 soft pastel colors */
      /* background:linear-gradient(135deg,#b7b6b6,#bcbaba); */
      background: linear-gradient(135deg, #cecccc, #cfcfcf);

      border-radius: 25px;

      /* box-shadow:
  inset -6px -8px 12px rgba(0,0,0,.1),
  inset 6px 8px 12px rgba(255,255,255,.7),
  0 8px 18px rgba(0,0,0,.15); */

      animation: floatBalloon 3s ease-in-out infinite alternate;
    }

    /* 🎨 pastel variations */
    /* .option:nth-child(2){
  background:linear-gradient(135deg,#d0f4ff,#cdb4db);
}

.option:nth-child(3){
  background:linear-gradient(135deg,#fff1c1,#ffd6a5);
}

.option:nth-child(4){
  background:linear-gradient(135deg,#d8f3dc,#b7e4c7);
} */

    /* 🎈 string */
    /* .option::after{
  content:"";
  position:absolute;
  bottom:-18px;
  left:50%;
  transform:translateX(-50%);
  width:3px;
  height:18px;
  background:#888;
} */

    /* hover */
    .option:hover {
      transform: scale(1.08);
    }

    /* image */
    .option img {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    /* text */
    .option p {
      /* margin-top: 5px; */
      font-size: 20px;
      font-weight: 400;
      color: #2f4f4f;
      background-color: #f6fff4;
      padding: 10px;
      border-radius: 20px;
      width: 140px;
    }

    /* ✅ correct */
    .correct {
      /* background: linear-gradient(135deg, #757e74, #b2f2bb); */
      box-shadow: 0 0 0 4px #69db7c, 0 12px 25px rgba(0, 0, 0, .2);
    }

    /* ❌ wrong */
    .wrong {
      animation: shake .3s;
    }

    @keyframes shake {
      0% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-5px)
      }

      50% {
        transform: translateX(5px)
      }

      75% {
        transform: translateX(-5px)
      }

      100% {
        transform: translateX(0)
      }
    }

    .nav {
      margin-top: clamp(10px, 2vh, 25px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
    }

    /* REMOVE flex:1 */
    button {
      border: none;
      padding: clamp(10px, 1.2vw, 14px) clamp(20px, 3vw, 32px);
      font-size: clamp(15px, 1.4vw + 0.6vh, 20px);
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all .3s ease;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
      min-width: clamp(100px, 14vw, 150px);
    }

    /* keep spacing like old */
    .prev {
      align-self: flex-start;
    }

    .next {
      align-self: flex-end;
    }

    /* PREV */
    .prev {
      background: linear-gradient(45deg, #ff7a7a, #ffb199);
      color: white;
    }

    .prev:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
    }

    /* NEXT */
    .next {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: white;
    }

    .next:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
    }

    /* DISABLED */
    button:disabled {
      background: #dcdcdc;
      color: #888;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* POPUP */
    .kid-popup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }

    .kid-card {
      background: #fff;
      width: clamp(260px, 50vw, 320px);
      padding: clamp(15px, 2vw, 25px);
      border-radius: 30px;
      text-align: center;
    }

    .kid-icon {
      font-size: clamp(3em, 6vw, 4.5em);
      margin-bottom: 10px;
    }

    .kid-card h3 {
      font-size: clamp(1.4em, 2.5vw, 2em);
      margin-bottom: 8px;
    }

    .kid-card p {
      font-size: clamp(1em, 1.5vw, 1.2em);
    }

    .kid-correct .kid-card {
      background: #ffffff;
      border: 6px solid #38d9a9;
    }

    .kid-wrong .kid-card {
      background: #ffffff;
      border: 6px solid #ffa8a8;
    }

    /* FINAL POPUP */
    #finalPopup {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 4000;
    }

    .final-kid-box {
      background: linear-gradient(135deg, #fff7d6, #e6fff5);
      padding: clamp(20px, 3vw, 35px);
      border-radius: 35px;
      text-align: center;
      width: clamp(280px, 60vw, 420px);
    }

    .final-kid-box h2 {
      font-size: clamp(1.6em, 3vw, 2.2em);
      color: #2f9e44;
      margin-bottom: 10px;
    }

    .final-kid-box p {
      font-size: clamp(1.1em, 2vw, 1.3em);
      font-weight: 600;
    }

    #stars {
      font-size: clamp(1.5em, 3vw, 2.3em);
      margin: 12px 0;
    }

    .playAgain-btn {
      background: #ffac30;
      color: #fff;
      border: none;
      padding: clamp(10px, 1.5vw, 14px) clamp(20px, 3vw, 34px);
      border-radius: 30px;
      font-size: clamp(1em, 1.5vw, 1.1em);
      cursor: pointer;
      margin-top: 12px;
    }

    /* POP ANIMATION */
    @keyframes pop {
      0% {
        transform: translate(-50%, -50%) scale(.4)
      }

      70% {
        transform: translate(-50%, -50%) scale(1.1)
      }

      100% {
        transform: translate(-50%, -50%) scale(1)
      }
    }


    @media screen and (max-width:800px) {

      body {
        height: auto;
        padding: 10px;
        align-items: flex-start;
        /* 🔥 FIX */
        overflow: hidden;
        /* 🔥 FIX (important) */
      }

      /* container */
      .quiz-box {
        height: auto;
        gap: 20px;
      }

      /* question */
      .question {
        font-size: 26px;
        margin-top: 0;
        text-align: center;
        margin-top: 60px;
      }

      /* image */
      .question-img {
        width: 200px;
        height: 120px;
        display: block;
        margin: auto;
      }

      /* ✅ MOBILE GRID (2x2 PERFECT) */
      .options {
        display: grid;
        /* 🔥 CHANGE */
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        width: 100%;
        justify-items: center;
      }

      /* option */
      .option {
        width: 130px;
        height: 130px;
      }

      /* image inside option */
      .option img {
        width: 55px;
        height: 55px;
      }

      /* text */
      .option p {
        font-size: 13px;
        text-align: center;
      }

      /* nav */
      .nav {
        margin-top: 20px;
      }

      /* buttons */
      button {
        padding: 12px 24px;
        font-size: 16px;
      }

      /* popup */
      .kid-card {
        width: 200px;
        padding: 14px;
        border-radius: 18px;
      }

      .kid-icon {
        font-size: 2.2em;
      }

      .kid-card h3 {
        font-size: 1.1em;
      }

      .kid-card p {
        font-size: 0.85em;
      }

      /* final popup */
      .final-kid-box {
        width: 220px;
        padding: 16px;
      }

      .final-kid-box h2 {
        font-size: 1.2em;
      }

      .final-kid-box p {
        font-size: 0.95em;
      }

      #stars {
        font-size: 1.3em;
      }

      .playAgain-btn {
        padding: 8px 14px;
        font-size: 0.85em;
      }

    }

    @media screen and (max-width:600px) {

      body {
        height: auto;
        padding: 10px;
        align-items: flex-start;
        overflow: hidden;
      }

      /* container */
      .quiz-box {
        height: auto;
        gap: 20px;
      }

      /* question */
      .question {
        font-size: 20px;
        margin-top: 0;
      }

      /* image */
      .question-img {
        width: 180px;
        height: 100px;
      }

      /* 🔥 GRID FIX */
      .options {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        /* ✅ 2x2 */
        gap: 25px;
        width: 100%;
        justify-items: center;
        margin-top: -20px;

      }

      /* option box */
      .option {
        width: 80px;
        height: 80px;

      }

      /* option image */
      .option img {
        width: 40px;
        height: 40px;
      }

      /* text */
      .option p {
        font-size: 10px;
      }

      /* nav buttons */
      .nav {
        margin-top: 20px;
      }

      button {
        padding: 10px 18px;
        font-size: 16px;
      }

      .kid-card {
        width: 180px;
        /* smaller width */
        padding: 15px;
        /* less padding */
        border-radius: 20px;
      }

      /* icon smaller */
      .kid-icon {
        font-size: 2.5em;
        margin-bottom: 6px;
      }

      /* title */
      .kid-card h3 {
        font-size: 1.2em;
        margin-bottom: 4px;
      }

      /* message */
      .kid-card p {
        font-size: 0.9em;
      }

      /* final popup */
      .final-kid-box {
        width: 200px;
        padding: 18px;
        border-radius: 25px;
      }

      /* final text */
      .final-kid-box h2 {
        font-size: 1.4em;
      }

      .final-kid-box p {
        font-size: 1em;
      }

      /* stars */
      #stars {
        font-size: 1.4em;
      }

      /* play again */
      .playAgain-btn {
        padding: 8px 16px;
        font-size: 0.9em;
      }

    }

    @media screen and (min-width: 1200px) and (max-width: 1440px) {

      .quiz-box {
        max-width: 1300px;
        height: 85%;
      }

      .question {
        font-size: 40px;
      }

      .question-img {
        width: 400px;
        height: 300px;
      }

      .option {
        width: 280px;
        height: 210px;
      }

      .option img {
        width: 140px;
        height: 140px;
      }

      .option p {
        font-size: 24px;
        width: 160px;
      }

      button {
        padding: 18px 36px;
        font-size: 25px;
      }

    }

    /* ========================= */
    /* 🖥 Large Monitors */
    /* ========================= */
    @media screen and (min-width: 1441px) and (max-width: 1920px) {

      .quiz-box {
        max-width: 1600px;
        height: 70%;
      }

      .question {
        font-size: 42px;
      }

      .question-img {
        width: 360px;
        height: 260px;
      }

      .options {
        gap: 30px;
      }

      .option {
        width: 230px;
        height: 200px;
      }

      .option img {
        width: 120px;
        height: 120px;
      }

      .option p {
        font-size: 22px;
      }

      button {
        padding: 16px 40px;
        font-size: 22px;
      }

    }

    /* ========================= */
    /* 🖥 4K / Extra Large */
    /* ========================= */
    @media screen and (min-width: 1921px) {

      .quiz-box {
        max-width: 2000px;
        height: 75%;
      }

      .question {
        font-size: 52px;
      }

      .question-img {
        width: 420px;
        height: 300px;
      }

      .options {
        gap: 40px;
      }

      .option {
        width: 260px;
        height: 240px;
      }

      .option img {
        width: 150px;
        height: 150px;
      }

      .option p {
        font-size: 26px;
      }

      button {
        padding: 20px 55px;
        font-size: 26px;
      }

    }
  </style>
</head>

<body>

  <div class="quiz-box">

    <div class="question" id="question"></div>

    <img id="questionImg" class="question-img">

    <div class="options" id="options"></div>

    <div class="nav">
      <button class="prev" id="prevBtn" onclick="prevQ()" disabled>← Prev</button>
      <button class="next" id="nextBtn" onclick="nextQ()" disabled>Next →</button>
    </div>

  </div>

  <div id="answerPopup" class="kid-popup">
    <div class="kid-card">
      <div class="kid-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <div id="finalPopup">
    <div class="final-kid-box">
      <h2>🎉 Congratulations!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div>
      <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <script>
    const quiz = [

      {
        q: "Q1. ______ is not caused due to deficiency of minerals.",
        img: "../images/mcq1.png",
        options: [
          { img: "../images/Anaemia.png", text: "Anaemia" },
          { img: "../images/osteoporosis.png", text: "Osteoporosis" },
          { img: "../images/scurvy.png", text: "Scurvy" },
          { img: "../images/goitre.png", text: "Goitre" }
        ],
        correct: 2
      },

      {
        q: "Q2. ______ uses dry heat of coal placed underneath.",
        img: "../images/mcq2.png",
        options: [
          { img: "../images/boiling1.png", text: "Boiling" },
          { img: "../images/roasting.png", text: "Roasting" },
          { img: "../images/steaming.png", text: "Steaming" },
          { img: "../images/grilling.png", text: "Grilling" }
        ],
        correct: 3
      },

      {
        q: "Q3. ______ is not a method of food preservation.",
        img: "../images/mcq3.png",
        options: [
          { img: "../images/stewing.png", text: "Stewing" },
          { img: "../images/canning.png", text: "Canning" },
          { img: "../images/freezing.png", text: "Freezing" },
          { img: "../images/pickling.png", text: "Pickling" }
        ],
        correct: 0
      },

      {
        q: "Q4. ______ help to build tissues.",
        img: "../images/mcq4.png",
        options: [
          { img: "../images/Fat.png", text: "Fats" },
          { img: "../images/protein.png", text: "Proteins" },
          { img: "../images/vitamins.png", text: "Vitamins" },
          { img: "../images/minerals.png", text: "Minerals" }
        ],
        correct: 1
      },

      {
        q: "Q5. ______ is a long, slow cooking method.",
        img: "../images/mcq5.png",
        options: [
          { img: "../images/stewing.png", text: "Stewing" },
          { img: "../images/boiling1.png", text: "Boiling" },
          { img: "../images/roasting.png", text: "Roasting" },
          { img: "../images/Frying.png", text: "Frying" }
        ],
        correct: 0
      }

    ];

    let current = 0
    let score = 0
    let answered = false
    let userAnswers = new Array(quiz.length).fill(null);

    function correctConfetti() {
      confetti({
        particleCount: 40,
        spread: 70,
        origin: { y: 0.6 }
      })
    }

    // function speakText(text){

    // const speech = new SpeechSynthesisUtterance(text);

    // speech.lang = "en-GB";   // UK English
    // speech.volume = 0.25;
    // speech.rate = 1;
    // speech.pitch = 1;

    // speechSynthesis.speak(speech);

    // }

    function speakText(text) {
      let msg = new SpeechSynthesisUtterance(text);
      speechSynthesis.speak(msg);
    }

    function showPopup(isCorrect) {

      const popup = document.getElementById("answerPopup")
      const icon = document.getElementById("popupIcon")
      const title = document.getElementById("popupTitle")
      const msg = document.getElementById("popupMsg")

      popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong")
      popup.style.display = "flex"

      if (isCorrect) {

        icon.textContent = "🎉😊"
        title.textContent = "Great Job!"
        msg.textContent = "You got it right!"

      } else {

        icon.textContent = "😭"
        title.textContent = "Oops!"
        msg.textContent = "Try again!"

      }

      setTimeout(() => popup.style.display = "none", 1400)

    }

    function loadQuestion() {

      document.getElementById("nextBtn").disabled = true
      document.getElementById("prevBtn").disabled = current === 0
      answered = false

      document.getElementById("question").innerText = quiz[current].q

      /* LOAD QUESTION IMAGE */

      document.getElementById("questionImg").src = quiz[current].img

      const optionsDiv = document.getElementById("options")
      optionsDiv.innerHTML = ""

      quiz[current].options.forEach((opt, i) => {

        const card = document.createElement("div")
        card.classList.add("option")

        card.innerHTML = `
<img src="${opt.img}">
<p>${opt.text}</p>
`

        /* Restore previous answer highlight */

        if (userAnswers[current] === i) {
          card.classList.add("correct")
          answered = true
          document.getElementById("nextBtn").disabled = false
        }

        card.onclick = () => {

          if (answered) return

          if (i === quiz[current].correct) {

            answered = true
            card.classList.add("correct")

            score++
            userAnswers[current] = i;

            correctConfetti()

            showPopup(true)
            speakText("Correct")

            if (current === quiz.length - 1) {
              setTimeout(showResult, 1200)
            } else {
              document.getElementById("nextBtn").disabled = false
            }

          } else {
            showPopup(false)

            speakText("wrong")

          }

        }

        optionsDiv.appendChild(card)

      })

    }

    function nextQ() {

      if (!answered) return

      if (current < quiz.length - 1) {
        current++
        loadQuestion()
      } else {
        showResult()
      }

    }

    function prevQ() {
      if (current > 0) {
        current--
        loadQuestion()
      }
    }
    function finalConfetti() {

      confetti({
        particleCount: 120,
        spread: 120,
        origin: { y: 0.6 }
      });

      setTimeout(() => {
        confetti({
          particleCount: 80,
          spread: 100,
          origin: { y: 0.6 }
        });
      }, 300);

    }
    function showResult() {

      const popup = document.getElementById("finalPopup")

      document.getElementById("finalScore").textContent =
        "Your Score: " + score + " / " + quiz.length

      document.getElementById("stars").textContent = "⭐".repeat(score)

      popup.style.display = "flex"

      finalConfetti()

    }

    loadQuestion()

  </script>


</body>
</html>
