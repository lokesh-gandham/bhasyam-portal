<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* RESET */
    * {
      font-family: 'Livvic';
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Livvic';
      overflow: hidden;
    }

    .template {
      width: 100%;
      max-width: 1400px;
      height: 80%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* CONTENT */
    .quiz-content {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      /* gap: 30px; */
      padding-top: 40px;
      margin-top: -20px;
    }

    /* QUESTION */
    .title {
      font-size: clamp(20px, 2.5vw + 1vh, 30px);
      color: #2f4f4f;
      line-height: 1.3;
      text-align: left;
      max-width: 1200px;
      margin-top: -20px;
     
    }

    /* OPTIONS */
    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 60px;
      justify-items: center;
    }

    /* OPTION */
    .option {
      text-align: center;
      cursor: pointer;
      transition: .3s;
      margin-top: 40px;
    }

    .option img {
      width: 200px;
      height: 200px;
      object-fit: contain;
    }

    /* LABEL */
    .label {

      margin-top: 14px;

      padding: 14px 30px;

      font-size: 20px;
      font-weight: 500;

      color: #245c43;

      border-radius: 50px;

      background: #f6fff4;


      /* box-shadow:
        0 8px 18px rgba(202, 255, 191, .45); */

      transition: .3s;
    }

    /* 🌟 GLOW SELECT */
    .option.selected.correct {
      transform: scale(1.05);
      /* box-shadow:
        0 0 0 8px rgba(255, 255, 255, 0.9),
        0 0 25px #69db7c,
        0 0 40px #69db7c; */
        background-color: #ffe9e9;
      border-radius: 20px;
      padding: 10px;
    }

    /* NAV */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 98%;

    }

    button {
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    .prev {
      background: linear-gradient(45deg, #ff7a7a, #ffb199);
      color: white;
    }

    .next {
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: white;
    }

    button:disabled {
      background: #dcdcdc;
      color: #888;
      cursor: not-allowed;
    }

    /* POPUP */
    .kid-popup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }

    .kid-card {
      background: #fff;
      width: clamp(280px, 50vw, 360px);

      padding: clamp(15px, 2vw, 25px);
      border-radius: 30px;
      text-align: center;
    }

    .kid-icon {
      font-size: clamp(3em, 6vw, 4.5em);
      margin-bottom: 10px;
    }

    .kid-card h3 {
      font-size: clamp(1.4em, 2.5vw, 2em);
      margin-bottom: 8px;
    }

    .kid-card p {
      font-size: clamp(1em, 1.5vw, 1.2em);
    }

    .kid-correct .kid-card {
      background: #ffffff;
      border: 6px solid #38d9a9;
    }

    .kid-wrong .kid-card {
      background: #ffffff;
      border: 6px solid #ffa8a8;
    }

    /* FINAL POPUP */
    #finalPopup {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 4000;
    }

    .final-kid-box {
      background: linear-gradient(135deg, #fff7d6, #e6fff5);
      padding: clamp(20px, 3vw, 35px);
      border-radius: 35px;
      text-align: center;
      width: clamp(280px, 60vw, 420px);
    }

    .final-kid-box h2 {
      font-size: clamp(1.6em, 3vw, 2.2em);
      color: #2f9e44;
      margin-bottom: 10px;
    }

    .final-kid-box p {
      font-size: clamp(1.1em, 2vw, 1.3em);
      font-weight: 600;
    }

    #stars {
      font-size: clamp(1.5em, 3vw, 2.3em);
      margin: 12px 0;
    }

    .playAgain-btn {
      background: #ffac30;
      color: #fff;
      border: none;
      padding: clamp(10px, 1.5vw, 14px) clamp(20px, 3vw, 34px);
      border-radius: 30px;
      font-size: clamp(1em, 1.5vw, 1.1em);
      cursor: pointer;
      margin-top: 12px;
    }

    /* POP ANIMATION */
    @keyframes pop {
      0% {
        transform: translate(-50%, -50%) scale(.4)
      }

      70% {
        transform: translate(-50%, -50%) scale(1.1)
      }

      100% {
        transform: translate(-50%, -50%) scale(1)
      }
    }

    /* ========================= */
    /* 📱 TABLET / 800px FIX */
    /* ========================= */
    @media screen and (min-width:601px) and (max-width:800px) {

      body {
        height: auto;
        padding: 15px;
        align-items: flex-start;
        overflow: auto;
      }

      /* container */
      .template {
        height: auto;
        gap: 25px;
      }

      /* question */
      .title {
        font-size: 26px;
        margin-top: 0;
        max-width: 90%;
        margin-top: 50px;
      }

      /* options */
      .options {
        grid-template-columns: repeat(2, 1fr);
        /* keep 2x2 */
        gap: 25px;
        margin-top: 80px;
      }

      /* option */
      .option {
        margin-top: 10px;
      }

      .option img {
        width: 150px;
        height: 150px;
      }

      /* label */
      .label {
        font-size: 16px;
        padding: 10px 20px;
      }

      /* nav buttons */
      .nav {
        width: 100%;
        padding: 0 10px;
        margin-top: 70px;
      }

      button {
        padding: 12px 24px;
        font-size: 16px;
      }

      /* popup size */
      .kid-card {
        width: 240px;
      }

      .final-kid-box {
        width: 260px;
      }

    }

    @media screen and (max-width:600px) {

      body {
        height: auto;
        padding: 10px;
        align-items: flex-start;
        overflow: auto;
      }

      /* container */
      .template {
        height: auto;
        gap: 20px;
      }

      /* question */
      .title {
        font-size: 20px;
        margin-top: 0;
      }

      /* options → 2x2 grid */
      .options {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      /* option */
      .option img {
        width: 120px;
        height: 120px;
      }

      .label {
        font-size: 14px;
        padding: 8px 14px;
      }

      /* nav */
      .nav {
        margin-top: 10px;
        padding: 0 10px;
      }

      button {
        padding: 10px 18px;
        font-size: 14px;
      }

      .kid-card {
        width: 180px;
        /* smaller width */
        padding: 15px;
        /* less padding */
        border-radius: 20px;
      }

      /* icon smaller */
      .kid-icon {
        font-size: 2.5em;
        margin-bottom: 6px;
      }

      /* title */
      .kid-card h3 {
        font-size: 1.2em;
        margin-bottom: 4px;
      }

      /* message */
      .kid-card p {
        font-size: 0.9em;
      }

      /* final popup */
      .final-kid-box {
        width: 200px;
        padding: 18px;
        border-radius: 25px;
      }

      /* final text */
      .final-kid-box h2 {
        font-size: 1.4em;
      }

      .final-kid-box p {
        font-size: 1em;
      }

      /* stars */
      #stars {
        font-size: 1.4em;
      }

      /* play again */
      .playAgain-btn {
        padding: 8px 16px;
        font-size: 0.9em;
      }


    }


    /* ========================= */
    /* 💻 Desktop / Monitor */
    /* ========================= */
    @media screen and (min-width:1225px) and (max-width:1440px) {
  body{
    margin-top: 4%;
  }
      .template {
        max-width: 1300px;
        height: 90%;
        /* margin-top: 50px; */
      }

      .title {
        font-size: 40px;
    
      }

      .options {
        gap: 55px;
        margin-top: 30px;
      }

      .option img {
        width: 250px;
        height: 220px;
      }

      .label {
        font-size: 25px;
      }

      button {
        padding: 18px 36px;
        font-size: 25px;
        margin-top: -350px;
      }

    }

    /* ========================= */
    /* 🖥 Large Monitors */
    /* ========================= */
    @media screen and (min-width:1441px) and (max-width:1920px) {

      .template {
        max-width: 1600px;
        height: 75%;
      }

      .title {
        font-size: 36px;
      }

      .options {
        gap: 45px;
      }

      .option img {
        width: 220px;
        height: 220px;
      }

      .label {
        font-size: 22px;
        padding: 16px 34px;
      }

      button {
        padding: 16px 45px;
        font-size: 20px;
      }

    }

    /* ========================= */
    /* 🖥 4K Screens */
    /* ========================= */
    @media screen and (min-width:1921px) {

      .template {
        max-width: 2000px;
        height: 80%;
      }

      .title {
        font-size: 48px;
      }

      .options {
        gap: 60px;
      }

      .option img {
        width: 260px;
        height: 260px;
      }

      .label {
        font-size: 26px;
        padding: 18px 40px;
      }

      button {
        padding: 20px 55px;
        font-size: 24px;
      }

    }
  </style>
</head>

<body>

  <div class="template">

    <div class="quiz-content">
      <div class="title" id="titleText"></div>
      <div class="options" id="optionsBox"></div>
    </div>

    <div class="nav">
      <button class="prev" id="prevBtn" onclick="prevQ()" disabled>← Prev</button>
      <button class="next" id="nextBtn" onclick="nextQ()" disabled>Next →</button>
    </div>

  </div>

  <div id="answerPopup" class="kid-popup">
    <div class="kid-card">
      <div class="kid-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <div id="finalPopup">
    <div class="final-kid-box">
      <h2>🎉 Congratulations!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div>
      <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>
  <script>
    const quizData = [

      {
        title: "Q1. A disease caused by the deficiency of vitamins",
        options: [

          { text: "Anaemia", img: "../images/Anaemia1.png" },
          { text: "Night blindness", img: "../images/NightBlindness.png" },
        ],
        answer: "Night blindness"
      },

      {
        title: "Q2. A disease caused by the deficiency of minerals",
        options: [
          { text: "Anaemia", img: "../images/Anaemia1.png" },
          { text: "Obesity", img: "../images/Obesity.png" },
        ],
        answer: "Anaemia"
      },

      {
        title: "Q3. A lifestyle disease",
        options: [
          { text: "Night blindness", img: "../images/NightBlindness.png" },
          { text: "Obesity", img: "../images/Obesity.png" },

        ],
        answer: "Obesity"
      },

      {
        title: "Q4. A method of cooking food without water",
        options: [
          { text: "Roasting", img: "../images/Roasting2.png" },
          { text: "Boiling", img: "../images/boiling2.png" },
        ],
        answer: "Roasting"
      },
      {
        title: "Q5. A disease caused by the deficiency of carbohydrates and proteins",
        options: [
          {
            text: "Kwashiorkor, Marasmus",
            img: "../images/Kwashiorkor.png"
          },
          {
            text: "Obesity",
            img: "../images/Obesity.png"
          },
        ],
        answer: "Kwashiorkor, Marasmus"
      }

    ];
    let current = 0;
    let score = 0;
    let answered = false;
    let userAnswers = new Array(quizData.length).fill(null);

    /* 🎉 CONFETTI */
    function correctConfetti() {
      confetti({
        particleCount: 40,
        spread: 70,
        origin: { y: 0.6 }
      })
    }

    /* 🔊 SPEECH */
    // function speakText(text){
    //   const speech=new SpeechSynthesisUtterance(text);
    //   speech.lang="en-GB";
    //   speech.volume=0.25;
    //   speech.rate=1;
    //   speech.pitch=1;
    //   speechSynthesis.speak(speech);
    // }

    function speakText(text) {
      let msg = new SpeechSynthesisUtterance(text);
      speechSynthesis.speak(msg);
    }

    /* 🎉 POPUP (EXACT MCQ COPY) */
    function showPopup(isCorrect) {

      const popup = document.getElementById("answerPopup")
      const icon = document.getElementById("popupIcon")
      const title = document.getElementById("popupTitle")
      const msg = document.getElementById("popupMsg")

      popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong")
      popup.style.display = "flex"

      if (isCorrect) {

        icon.textContent = "🎉😊"
        title.textContent = "Great Job!"
        msg.textContent = "You got it right!"

      } else {

        icon.textContent = "😭"
        title.textContent = "Oops!"
        msg.textContent = "Try again!"

      }

      setTimeout(() => popup.style.display = "none", 1400)
    }

    /* LOAD QUESTION */
    function loadQuestion() {

      answered = false
      nextBtn.disabled = true
      prevBtn.disabled = current === 0

      const q = quizData[current]
      titleText.textContent = q.title
      optionsBox.innerHTML = ""

      q.options.forEach((opt, i) => {

        const div = document.createElement("div")
        div.className = "option"

        div.innerHTML = `
<img src="${opt.img}">
<div class="label">${opt.text}</div>
`

        /* RESTORE */
        if (userAnswers[current] === i) {
          answered = true
          div.classList.add("selected", "correct")

          setTimeout(() => {
            document.querySelectorAll(".option").forEach(o => {
              o.style.pointerEvents = "none"
              o.style.opacity = o === div ? "1" : "0.5"
            })
          }, 0)

          nextBtn.disabled = false
        }

        div.onclick = () => {

          if (answered) return

          if (opt.text === q.answer) {

            answered = true
            userAnswers[current] = i
            score++

            div.classList.add("selected", "correct")

            document.querySelectorAll(".option").forEach(o => {
              o.style.pointerEvents = "none"
              o.style.opacity = o === div ? "1" : "0.5"
            })

            correctConfetti()
            showPopup(true)
            speakText("Correct")

            nextBtn.disabled = false

            if (current === quizData.length - 1) {
              setTimeout(showResult, 1200)
            }

          } else {
            showPopup(false)
            speakText("Wrong")
          }

        }

        optionsBox.appendChild(div)

      })

    }

    /* NEXT */
    function nextQ() {
      if (!answered) return

      if (current < quizData.length - 1) {
        current++
        loadQuestion()
      } else {
        showResult()
      }
    }

    /* PREV */
    function prevQ() {
      if (current > 0) {
        current--
        loadQuestion()
      }
    }

    /* 🎉 FINAL (EXACT MCQ STYLE) */
    function finalConfetti() {

      confetti({
        particleCount: 120,
        spread: 120,
        origin: { y: 0.6 }
      });

      setTimeout(() => {
        confetti({
          particleCount: 80,
          spread: 100,
          origin: { y: 0.6 }
        });
      }, 300);

    }

    function showResult() {

      const popup = document.getElementById("finalPopup")

      document.getElementById("finalScore").textContent =
        "Your Score: " + score + " / " + quizData.length

      document.getElementById("stars").textContent = "⭐".repeat(score)

      popup.style.display = "flex"

      finalConfetti()

    }

    loadQuestion()

  </script>


</body>
</html>
