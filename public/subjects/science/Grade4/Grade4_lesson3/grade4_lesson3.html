<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            overflow: hidden;

            /* background: */
            /* linear-gradient(135deg,#eef7ff,#f7fbff,#ffffff); */
            /* background-image: url("./images/bg2.png");
            background-size: 4px 4px; */

            background: linear-gradient(135deg, #cecccc, #cfcfcf);
        }

        /* ========================= */
        /* 🌟 MODERN SIDEBAR */
        /* ========================= */

        .sidebar {
            width: 280px;
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* padding:30px 20px; */
            gap: 18px;

            /* background:
linear-gradient(180deg,#ffffff,#f3f8ff); */
            /* 
box-shadow:
8px 0 25px rgba(0,0,0,.08); */

            position: relative;
            z-index: 100;
        
        }

        /* LOGO */

        .logo {
            width: 100%;
            padding: 15px 10px 35px;

            text-align: center;

            display: none;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;

            background: linear-gradient(45deg, #4f46e5, #06b6d4);
            /* -webkit-background-clip: text; */
            /* -webkit-text-fill-color: transparent; */
        }

        .logo p {
            font-size: 14px;
            color: #777;
            margin-top: 5px;
        }

        /* ========================= */
        /* MENU BUTTONS */
        /* ========================= */

        .quiz-btn {
            width: 100%;
            height: 70px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            gap: 18px;

            padding: 0 22px;

            cursor: pointer;

            font-size: 18px;
            font-weight: 500;
            color: #374151;

            background-color: #aeaeae;

            transition: .3s;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, .06);

            position: relative;

            overflow: hidden;
        }

        /* ICON */

        .icon {
            width: 46px;
            height: 46px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
            color: white;

            flex-shrink: 0;
        }

        /* DIFFERENT ICON COLORS */

        /* .choose .icon {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }

        .true .icon {
            background: linear-gradient(135deg, #10b981, #34d399);
        }

        .example .icon {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
        }

        .fill .icon {
            background: linear-gradient(135deg, #06b6d4, #38bdf8);
        }

        .match .icon {
            background: linear-gradient(135deg, #ec4899, #f472b6);
        } */

        /* HOVER */

        .quiz-btn:hover {
            transform: translateX(6px);
            box-shadow:
                0 12px 24px rgba(0, 0, 0, .12);
        }

        /* ACTIVE */

        .quiz-btn.active {
            background: linear-gradient(135deg, #f6fff4
, #f6fff4);

            color: #2f4f4f;

            transform: scale(1.02);
        }

        .quiz-btn.active .icon {
            background: rgba(255, 255, 255, .2);
        }

        /* ========================= */
        /* CONTENT */
        /* ========================= */

        .content {
            flex: 1;

            /* display:flex; */
            /* align-items:center; */
            /* justify-content:center; */

            padding: 25px;
        }

        /* SCREEN */

        .screen {
            width: 100%;
            height: 100vh;

            max-width: 1350px;

            border-radius: 28px;

            overflow: hidden;

            /* background:white; */
            /* 
box-shadow:
0 15px 35px rgba(0,0,0,.12); */
        }

        /* IFRAME */

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ========================= */
        /* MOBILE */
        /* ========================= */

        .menu-toggle {
            display: none;
        }

        /* ========================= */
        /* 📱 MOBILE */
        /* ========================= */

        @media(max-width:700px) {

            body {
                flex-direction: column;
            }

            /* SIDEBAR */

            .sidebar {
                position: fixed;

                left: -280px;
                top: 0;

                transition: .35s;

                height: 100vh;

                z-index: 999;
            }

            /* OPEN */

            .sidebar.open {
                left: 0;
            }

            /* MENU BUTTON */

            .menu-toggle {
                display: block;

                position: fixed;

                top: 12px;
                left: 12px;

                z-index: 1000;

                border: none;

                background: white;

                padding: 10px 14px;

                font-size: 26px;

                border-radius: 12px;

                box-shadow:
                    0 6px 16px rgba(0, 0, 0, .15);
            }

            /* CONTENT */

            .content {
                width: 100%;
                padding: 10px;
            }

            /* SCREEN */

            .screen {
                height: 84vh;
                border-radius: 20px;
            }

            /* BUTTONS */

            .quiz-btn {
                height: 65px;
                font-size: 16px;
            }

            .logo h1 {
                font-size: 24px;
            }

        }

        /* ========================= */
        /* LARGE SCREEN */
        /* ========================= */

        @media(min-width:1600px) {

            .sidebar {
                width: 320px;
            }

            .quiz-btn {
                height: 78px;
                font-size: 20px;
            }

            .logo h1 {
                font-size: 34px;
            }

        }
    </style>
</head>

<body>
<!-- ☰ MOBILE BUTTON -->

    <button class="menu-toggle" id="menuToggle">
        ☰
    </button>

    <!-- 🌟 SIDEBAR -->

    <div class="sidebar" id="menu">

        <!-- LOGO -->

        <div class="logo">
            <h1>Grade 4</h1>
            <p>Interactive Learning</p>
        </div>

        <!-- BUTTONS -->

        <div class="quiz-btn choose active" data-file="./exercise/mcq.html">

            <div class="icon">📘</div>

            <span>Choose Option</span>

        </div>

        <div class="quiz-btn true" data-file="./exercise/truefalse.html">

            <div class="icon">✅</div>

            <span>True / False</span>

        </div>

        <div class="quiz-btn example" data-file="./exercise/oneexample.html">

            <div class="icon">💡</div>

            <span>One Example</span>

        </div>

        <div class="quiz-btn fill" data-file="./exercise/fillintheblanks.html">

            <div class="icon">✏️</div>

            <span>Fill The Blanks</span>

        </div>

        <div class="quiz-btn match" data-file="./exercise/matching.html">

            <div class="icon">🧩</div>

            <span>Matching</span>

        </div>

    </div>

    <!-- 📚 CONTENT -->

    <div class="content">

        <div class="screen">

            <iframe id="frame" src="./exercise/mcq.html">
            </iframe>

        </div>

    </div>

    <script>

        const buttons =
            document.querySelectorAll(".quiz-btn");

        const frame =
            document.getElementById("frame");

        const menu =
            document.getElementById("menu");

        const toggle =
            document.getElementById("menuToggle");

        /* BUTTON CLICK */

        buttons.forEach(btn => {

            btn.onclick = () => {

                buttons.forEach(b =>
                    b.classList.remove("active")
                );

                btn.classList.add("active");

                frame.src = btn.dataset.file;

                /* CLOSE MOBILE MENU */

                menu.classList.remove("open");

            };

        });

        /* MOBILE MENU */

        toggle.onclick = () => {

            menu.classList.toggle("open");

        };

    </script>




</body>
</html>
