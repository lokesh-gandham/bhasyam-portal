<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- 🎉 CONFETTI -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Livvic';
    }

    body {
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: 100%;
      max-width: 1100px;
      height: 95vh;
      display: flex;
      justify-content: space-between;
      padding: 15px;
    }


    .img-circle {

      width: 65px;
      height: 65px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      /* ✅ PASTEL TEAL */

      background: #bce0ed;

      border: 1px solid #4ecdc4;

      box-shadow:
        0 6px 15px rgba(78, 205, 196, .25),
        inset 0 0 10px rgba(255, 255, 255, .35);

      animation:
        floatCircle 3s ease-in-out infinite alternate;
    }

    /* IMAGE INSIDE */
    .img-circle img {
      width: 90%;
      height: 90%;
      object-fit: contain;
    }


    .column {
      width: 45%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    /* CARD */
    /* CARD */

    /* CARD */
    /* CARD */
    /* CARD */

    .card {

      height: 85px;

      padding: 14px;

      display: flex;
      align-items: center;

      gap: 12px;

      border-radius: 28px;

      cursor: pointer;

      border: 3px solid transparent;

      box-shadow:
        0 10px 22px rgba(0, 0, 0, .10);

      transition: .35s;

      position: relative;

      overflow: visible;
    }

    /* 🌈 DIFFERENT COLORS */

    .column .card:nth-child(1) {

         border: 2px solid #52ad7d;
    background: linear-gradient(145deg, #f2fff7, #edfff5);
    }

    .column .card:nth-child(2) {

     border: 2px solid #52ad7d;
    background: linear-gradient(145deg, #f2fff7, #edfff5);
    }

    .column .card:nth-child(3) {

      border: 2px solid #52ad7d;
    background: linear-gradient(145deg, #f2fff7, #edfff5);
    }

    .column .card:nth-child(4) {

     border: 2px solid #52ad7d;
    background: linear-gradient(145deg, #f2fff7, #edfff5);
    }

    /* 🌸 FLOWER */
    .flower {
      position: absolute;

      /* 👇 move outside */
      top: -18px;
      left: -18px;

      font-size: 28px;

      transform: scale(0);
      opacity: 0;

      transition: .4s ease;

      z-index: 10;
      /* stay above */
    }

    .bloom {
      transform: scale(1.2);
      opacity: 1;
    }

    /* DOT */
    .dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }

    /* TEXT */
    .text {
      flex: 1;
      font-size: 20px;
      font-weight: 500;
    }

    /* ACTIVE */
    .active {
      box-shadow: 0 0 0 2px #22c55e, 0 0 25px #22c55e;
    }

    /* WRONG */
    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-6px);
      }

      75% {
        transform: translateX(6px);
      }
    }

    .wrong {
      animation: shake .3s;
    }

    /* MATCHED */
    /* MATCHED */
    /* MATCHED */

    .cartoon {

      background: #c3fae8 !important;

      border: 3px solid #38d9a9 !important;
    }

    /* ACTIVE */

    .active {

      transform: scale(1.03);

      outline: 4px solid white;

      box-shadow:
        0 0 0 4px #4ecdc4,
        0 0 25px rgba(78, 205, 196, .45);
    }

    @keyframes popupBounce {
      0% {
        transform: scale(0.5)
      }

      70% {
        transform: scale(1.1)
      }

      100% {
        transform: scale(1)
      }
    }

    /* 🎉 FINAL POPUP */
    /* 🎉 FINAL POPUP FIX */
    #finalPopup {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(2px);
      z-index: 2000;
    }

    /* 🎊 FINAL CARD (PLAYFUL) */
    .final-kid-box {
      width: 400px;
      /* 🔥 slightly bigger */
      padding: 35px 30px;
      /* 🔥 more space */

      transform: scale(1.05);
      /* 🔥 visual boost */
      border-radius: 35px;
      text-align: center;

      background: linear-gradient(135deg, #ffe0f0, #d0f4ff);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, .3),
        inset 0 0 20px rgba(255, 255, 255, .5);

      animation: popupBounce .5s ease;
    }

    /* 🎉 BIG EMOJI */
    .final-kid-box::before {
      content: "🏆";
      font-size: 70px;
      display: block;
      margin-bottom: 10px;
    }

    /* TEXT */
    .final-kid-box h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .final-kid-box p {
      font-size: 20px;
      font-weight: 600;
    }

    /* PLAY AGAIN BUTTON (EXACT SAME) */
    .final-kid-box button {
      margin-top: 15px;
      background: linear-gradient(135deg, #ffd166, #ff9f1c);
      color: #333;
      font-weight: 700;

      border: none;
      padding: 14px 28px;
      font-size: 18px;
      border-radius: 50px;
      cursor: pointer;

      box-shadow:
        inset -5px -6px 10px rgba(0, 0, 0, .1),
        inset 5px 6px 10px rgba(255, 255, 255, .7),
        0 8px 18px rgba(0, 0, 0, .2);

      transition: .3s;
    }

    .final-kid-box button:hover {
      transform: translateY(-4px) scale(1.05);
    }

    .final-kid-box button:active {
      transform: scale(0.95);
    }

    #lineLayer path {
      stroke: #00c853;
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;

      filter: drop-shadow(0 0 3px rgba(0, 200, 83, .25));
    }

    @media screen and (max-width:768px) {

      .game {
        flex-direction: column;
        /* 🔥 stack vertically */
        height: 100%;
        gap: 15px;
        padding: 10px;
      }

      .column {
        width: 100%;
        gap: 12px;
      }

      /* cards smaller */
      /* cards same height */

      .card {

        height: 55px;
        /* FIXED SAME HEIGHT */

        padding: 10px;

        border-radius: 20px;

        display: flex;
        align-items: center;

        overflow: hidden;

      }

      /* image circle smaller */
      .img-circle {
        width: 40px;
        height: 40px;
      }

      .text {

        font-size: 13px;

        line-height: 1.2;

        display: -webkit-box;

        -webkit-box-orient: vertical;

        overflow: hidden;

      }

      /* flower adjust */
      .flower {
        font-size: 22px;
        top: -12px;
        left: -12px;
      }

      /* popup responsive */
      .final-kid-box {
        width: 90%;
        padding: 25px;
      }

    }

    @media screen and (min-width:1025px) and (max-width:1440px) {

      .game {
        max-width: 1100px;

      }

      .card {
        height: 85px;
      }

      .text {
        font-size: 20px;
      }

    }

    @media screen and (min-width:1441px) and (max-width:1920px) {

      .game {
        max-width: 1300px;
      }

      .card {
        height: 150px;
        padding: 25px;
      }

      .img-circle {
        width: 80px;
        height: 80px;
      }

      .flower {
        font-size: 30px;
        top: -12px;
        left: -12px;
      }

      .text {
        font-size: 32px;
      }

      .final-kid-box {
        width: 90%;
        padding: 25px;
      }

      /* 🎉 ANSWER POPUP BIGGER */
      .kid-card {
        width: 420px;
        /* bigger */
        padding: 55px 40px;
        /* more height */

        transform: scale(1.05);
        /* slight zoom */

        border-radius: 40px;
      }

      /* 🎈 EMOJI SIZE */
      .kid-card::before {
        font-size: 80px;
      }

      /* TEXT */
      .kid-card h3 {
        font-size: 30px;
      }

      .kid-card p {
        font-size: 22px;
      }

      /* 🎊 FINAL POPUP BIGGER */
      .final-kid-box {
        width: 460px;
        /* bigger than default */
        padding: 60px 45px;

        transform: scale(1.08);
        /* visual boost */

        border-radius: 40px;
      }

      /* 🏆 ICON */
      .final-kid-box::before {
        font-size: 90px;
      }

      /* TEXT */
      .final-kid-box h2 {
        font-size: 32px;
      }

      .final-kid-box p {
        font-size: 24px;
      }

      /* BUTTON */
      .final-kid-box button {
        font-size: 22px;
        padding: 18px 32px;
      }
    }

    @media screen and (min-width:1921px) {

      .game {
        max-width: 1500px;
      }

      .card {
        height: 120px;
        padding: 22px;
      }

      .img-circle {
        width: 90px;
        height: 90px;
      }

      .text {
        font-size: 26px;
      }
    }

    /* ========================================
🖥️ MONITOR POPUP RESPONSIVE
======================================== */


    /* ================= 1350px — 1500px ================= */

    @media screen and (min-width:1350px) and (max-width:1500px) {

      .popup-card,
      .kid-card {
        width: 380px;
        padding: 32px 26px;
        border-radius: 38px;
      }

      .popup-bubble,
      .kid-icon {
        width: 85px;
        height: 85px;
        font-size: 42px;
      }

      .popup-card h2,
      .kid-card h3 {
        font-size: 30px;
      }

      .popup-card p,
      .kid-card p {
        font-size: 18px;
      }

      .popup-stars {
        font-size: 32px;
      }

      .finalpopup-box,
      .final-kid-box {
        width: 520px;
        max-width: 520px;
        padding: 38px;
        border-radius: 40px;
      }

      .final-heading,
      .final-kid-box h2 {
        font-size: 34px;
      }

      .final-sub,
      .final-kid-box p {
        font-size: 18px;
      }

      #stars {
        font-size: 38px;
      }

      .playAgain-btn,
      .next-section-btn {
        font-size: 17px;
        padding: 14px 24px;
        border-radius: 18px;
      }
    }



    /* ================= 1501px — 1700px ================= */

    @media screen and (min-width:1501px) and (max-width:1700px) {

      .popup-card,
      .kid-card {
        width: 430px;
        padding: 38px 30px;
        border-radius: 44px;
      }

      .popup-bubble,
      .kid-icon {
        width: 100px;
        height: 100px;
        font-size: 48px;
      }

      .popup-card h2,
      .kid-card h3 {
        font-size: 36px;
      }

      .popup-card p,
      .kid-card p {
        font-size: 20px;
      }

      .popup-stars {
        font-size: 40px;
      }

      .finalpopup-box,
      .final-kid-box {
        width: 620px;
        max-width: 620px;
        padding: 48px;
        border-radius: 50px;
      }

      .final-heading,
      .final-kid-box h2 {
        font-size: 42px;
      }

      .final-sub,
      .final-kid-box p {
        font-size: 22px;
      }

      #stars {
        font-size: 44px;
      }

      .playAgain-btn,
      .next-section-btn {
        font-size: 19px;
        padding: 16px 28px;
        border-radius: 20px;
      }
    }



    /* ================= 1701px — 1920px ================= */

    @media screen and (min-width:1701px) and (max-width:1920px) {

      .popup-card,
      .kid-card {
        width: 500px;
        padding: 45px 35px;
        border-radius: 55px;
      }

      .popup-bubble,
      .kid-icon {
        width: 115px;
        height: 115px;
        font-size: 56px;
      }

      .popup-card h2,
      .kid-card h3 {
        font-size: 42px;
      }

      .popup-card p,
      .kid-card p {
        font-size: 24px;
      }

      .popup-stars {
        font-size: 48px;
      }

      .finalpopup-box,
      .final-kid-box {
        width: 760px;
        max-width: 760px;
        padding: 60px;
        border-radius: 65px;
      }

      .final-heading,
      .final-kid-box h2 {
        font-size: 52px;
      }

      .final-sub,
      .final-kid-box p {
        font-size: 26px;
      }

      #stars {
        font-size: 52px;
      }

      .playAgain-btn,
      .next-section-btn {
        font-size: 22px;
        padding: 18px 32px;
        border-radius: 24px;
      }
    }
  </style>
</head>

<body>

  <svg id="lineLayer" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;">
  </svg>

  <div class="game">
    <div class="column" id="left"></div>
    <div class="column" id="right"></div>
  </div>

  <!-- 🎉 FINAL -->
  <div id="finalPopup">
    <div class="final-kid-box">
      <h2>🎉 Congratulations!</h2>
      <p id="finalScore"></p>
      <button onclick="location.reload()">Play Again</button>
    </div>
  </div>
  <script>

    function speak(text) {
      let msg = new SpeechSynthesisUtterance(text);
      speechSynthesis.speak(msg);
    }

    /* 🎉 CONFETTI */
    function blast() {
      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    const colors = ["#ef4444", "#22c55e", "#3b82f6", "#f59e0b"];

    /* ✅ DEFINE DATA FIRST */
    const leftData = [
      { text: "Fog and mist", match: "c", img: "../images/fog_mist.png" },
      { text: "Snow", match: "d", img: "../images/snow.png" },
      { text: "Nitrogen", match: "a", img: "../images/Nitrogen.png" },
      { text: "Oxygen", match: "b", img: "../images/oxygen.png" },
    ];

    const rightData = [
      { text: "a) It constitutes 78% of air by volume.", match: "a" },
      { text: "b) All plants and animals need it to breathe.", match: "b" },
      { text: "c) Thick clouds of tiny drops of water form this.", match: "c" },
      { text: "d) Water vapour condenses to form ice crystals to form this.", match: "d" },
    ];

    /* ✅ NOW USE IT */
    let score = 0;
    const total = leftData.length;

    let selected = null;

    const left = document.getElementById("left");
    const right = document.getElementById("right");

    /* LEFT */
    leftData.forEach((item, i) => {
      const div = document.createElement("div");
      div.className = "card";
      div.dataset.match = item.match;

      div.innerHTML = `
    <div class="flower">🌸</div>
  
  <div class="img-circle">
  <img src="${item.img}">
</div>
    <div class="text">${item.text}</div>
  `;

      div.onclick = () => {
        document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
        div.classList.add("active");
        selected = div;
      };

      left.appendChild(div);
    });

    /* RIGHT */
    rightData.forEach((item, i) => {
      const div = document.createElement("div");
      div.className = "card";
      div.dataset.match = item.match;

      div.innerHTML = `
   
    <div class="text">${item.text}</div>
  `;

      div.onclick = () => {
        if (!selected) return;

        if (selected.dataset.match === div.dataset.match) {

          speak("Correct!");
          blast();
          score++;

          drawMatchLine(selected, div);

          selected.classList.add("cartoon");
          div.classList.add("cartoon");

          selected.style.pointerEvents = "none";
          div.style.pointerEvents = "none";

          selected.classList.remove("active");

          selected = null;

          if (score === total) {
            setTimeout(showFinal, 800);
          }

        } else {

          speak("Try again!");

          div.classList.add("wrong");
          setTimeout(() => div.classList.remove("wrong"), 300);
        }
      };

      right.appendChild(div);
    });

    function drawMatchLine(leftEl, rightEl) {

      const svg = document.getElementById("lineLayer");

      const leftRect = leftEl.getBoundingClientRect();
      const rightRect = rightEl.getBoundingClientRect();

      /* start INSIDE border */
      const x1 = leftRect.right - 2;
      const y1 = leftRect.top + leftRect.height / 2;

      /* end INSIDE border */
      const x2 = rightRect.left + 2;
      const y2 = rightRect.top + rightRect.height / 2;

      const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

      const curve = 60;

      const d = `
    M ${x1} ${y1}
    C ${x1 + curve} ${y1},
      ${x2 - curve} ${y2},
      ${x2} ${y2}
  `;

      path.setAttribute("d", d);

      svg.appendChild(path);
    }

    function showFinal() {
      document.getElementById("finalPopup").style.display = "flex";

      document.getElementById("finalScore").innerText =
        "Your Score: " + score + " / " + total;


      blast();
    }

  </script>

</body>
</html>
