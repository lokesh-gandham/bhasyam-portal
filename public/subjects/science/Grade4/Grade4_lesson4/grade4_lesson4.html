<!DOCTYPE html>

<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Livvic';
    }

    /* ================= */
    /* BACKGROUND */
    /* ================= */

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #dff6ff, #f0e9f1, #fff4d6);
      background: url("./images/bg.jpg");
      background-size: 100% 100%;
    }

    /* ================= */
    /* MAIN */
    /* ================= */

    .container {
      width: 100vw;
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      background: #ffffff62;
    }

    /* ================= */
    /* MENU */
    /* ================= */

    .menu {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    /* ================= */
    /* 🌈 RIBBON BUTTONS */
    /* ================= */

    /* ================= */
    /* LUXURY OVAL CAPSULE */
    /* ================= */

    .btn {
      position: relative;

      padding: 14px 30px;
      font-size: 17px;
      font-weight: 600;

      color: #6b7280;

      cursor: pointer;
      transition: .35s ease;

      border: 2px solid #d9dde3;

      border-radius: 999px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;

      background:
        linear-gradient(145deg,
          #f6f7f9,
          #e9edf1);

      box-shadow:
        0 12px 24px rgba(15, 23, 42, .08),
        0 6px 12px rgba(15, 23, 42, .06),
        inset 0 1px 0 rgba(255, 255, 255, .95);

      overflow: hidden;
    }

    /* Elegant Gloss Layer */

    .btn::before {
      content: "";

      position: absolute;

      top: 0;
      left: 8%;

      width: 84%;
      height: 48%;

      border-radius: 999px;

      background:
        linear-gradient(to bottom,
          rgba(255, 255, 255, .75),
          rgba(255, 255, 255, 0));

      pointer-events: none;
    }

    /* Hover */

    .btn:hover {
      transform: translateY(-3px);

      box-shadow:
        0 18px 30px rgba(15, 23, 42, .12),
        0 8px 16px rgba(15, 23, 42, .08),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    /* ACTIVE */

    .btn.active {

      color: #ffffff;

      transform: scale(1.06);

      border: 2px solid #52ad7d;

      background:
        linear-gradient(145deg,
          #98d6b0,
          #81cca3);

      box-shadow:
        0 18px 35px rgba(79, 127, 101, .35),
        0 8px 18px rgba(0, 0, 0, .15),
        inset 0 1px 0 rgba(255, 255, 255, .25);
    }

    .btn.active::before {
      background:
        linear-gradient(to bottom,
          rgba(255, 255, 255, .28),
          rgba(255, 255, 255, 0));
    }

    /* ICON */

    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 30px;
      height: 30px;

      margin-right: 10px;

      border-radius: 50%;

      font-size: 18px;

      background:
        linear-gradient(145deg,
          #d8dde3,
          #f6f8fa);

      color: #6b7280;

      box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, .9),
        0 5px 10px rgba(0, 0, 0, .08);

      animation: iconFloat 2.5s ease-in-out infinite alternate;
    }

    /* All Disabled Icons Same */

    .btn:nth-child(1) .icon,
    .btn:nth-child(2) .icon,
    .btn:nth-child(3) .icon,
    .btn:nth-child(4) .icon,
    .btn:nth-child(5) .icon {
      background:
        linear-gradient(145deg,
          #d8dde3,
          #f6f8fa);
    }

    /* Active Icon */

    .btn.active .icon {

      background:
        rgba(255, 255, 255, .18);

      color: #ffffff;

      box-shadow:
        inset 0 1px 3px rgba(255, 255, 255, .20),
        0 5px 12px rgba(0, 0, 0, .18);
    }

    /* Floating Effect */

    @keyframes iconFloat {

      from {
        transform: translateY(0px);
      }

      to {
        transform: translateY(-3px);
      }
    }


    .screen {
      flex: 1;
      border-radius: 25px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ================= */
    /* 🍔 MENU TOGGLE */
    /* ================= */

    .menu-toggle {
      display: none;
      position: fixed;
      top: 15px;
      right: 15px;
      font-size: 26px;
      background: #55f113;
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 5px 15px rgba(0, 0, 0, .2);
    }

    /* ================= */
    /* 📱 MOBILE + TABLET */
    /* ================= */

    @media(max-width:1100px) {

      body {
        padding: 10px;
        align-items: flex-start;
        overflow: auto;
      }

      /* show toggle */
      .menu-toggle {
        display: block;
      }

      /* sidebar menu */
      .menu {
        position: fixed;
        top: 0;
        right: -260px;
        height: 100vh;
        width: 220px;

        background: linear-gradient(135deg, #dff6ff, #f0e9f1, #fff4d6);

        flex-direction: column;
        align-items: center;
        padding-top: 80px;
        gap: 20px;

        transition: .3s ease;
        z-index: 999;
      }

      /* open */
      .menu.open {
        right: 0;
      }

      /* buttons */
      .btn {
        width: 200px;
        text-align: center;
        font-size: 14px;
        padding: 12px 20px;
      }

      /* container */
      .container {
        width: 100% !important;
        height: 100vh;
      }

      /* prevent scroll */
      body.menu-open {
        overflow: hidden;
      }

    }

    @media screen and (min-width: 1225px) and (max-width: 1440px) {

      .container {
        width: 100% !important;
        height: 100vh;
      }

    }

    @media screen and (min-width: 1600px) and (max-width: 1920px) {



      .container {
        width: 100% !important;
        height: 100vh;
      }

      .btn {
        font-size: 22px;
        padding: 18px 30px;
      }

      .icon {
        width: 40px;
        height: 40px;
        font-size: 22px;
      }

    }

    @media screen and (min-width: 1921px) {

      .container {
        width: 100% !important;
        height: 100vh;
      }

      .btn {
        font-size: 24px;
        padding: 20px 60px;
      }

      .icon {
        height: 42px;
        font-size: 22px;
      }

    }
  </style>
</head>

<body>
<!-- 🍔 TOGGLE -->

  <button class="menu-toggle" id="menuToggle">☰</button>

  <div class="container">

    <!-- MENU -->

    <div class="menu">
      <div class="btn active" data-src="./exercise/mcq.html">
        <span class="icon">📝</span>
        <span>Choose Option</span>
      </div>

      <div class="btn" data-src="./exercise/truefalse.html">
        <span class="icon">✔</span>
        <span>True / False</span>
      </div>

      <div class="btn" data-src="./exercise/oneexample.html">
        <span class="icon">💡</span>
        <span>One Example</span>
      </div>

      <div class="btn" data-src="./exercise/fillintheblanks.html">
        <span class="icon">✏</span>
        <span>Fill Blanks</span>
      </div>

      <div class="btn" data-src="./exercise/matching.html">
        <span class="icon">🔗</span>
        <span>Matching</span>
      </div>

    </div>

    <!-- SCREEN -->

    <div class="screen">
      <iframe id="frame" src="./exercise/mcq.html"></iframe>
    </div>

  </div>

  <script>

    const btns = document.querySelectorAll(".btn");
    const frame = document.getElementById("frame");

    /* button click */
    btns.forEach(btn => {
      btn.onclick = () => {
        btns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        frame.src = btn.dataset.src;

        /* close menu on mobile */
        if (window.innerWidth <= 1100) {
          menu.classList.remove("open");
          document.body.classList.remove("menu-open");
        }
      };
    });

    /* toggle menu */
    const toggle = document.getElementById("menuToggle");
    const menu = document.querySelector(".menu");

    toggle.onclick = () => {
      menu.classList.toggle("open");
      document.body.classList.toggle("menu-open");
    };

  </script>




</body>
</html>
