<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
  <meta charset="UTF-8">
  <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      /* background: linear-gradient(135deg, #f4fcff, #d6f0ff, #f0fbff); */
      background-image: url("./assets/images/bgg.png");
      background-size: 4px 4px;
       /* background: linear-gradient(145deg, #fef9e6 0%, #fff4e0 100%); */
     

    }

    /* ================= TOGGLE BUTTON ================= */

    .menu-toggle {
      display: none;
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1001;
      background: #1F3C5B;
      color: white;
      border: none;
      font-size: 22px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      width: 300px;
      /* background:#b4f0d6; */
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 25px 20px;
      transition: 0.35s ease;
      z-index: 1000;
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
      font-size: clamp(18pt, 4vw, 30pt);
      color: #1F3C5B;
      font-weight: 600;
      display: none;
    }

    .sidebar ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ================= ✏️ PENCIL BUTTON ================= */
    /* ================= CLEAN NAV BUTTON ================= */
    /* ================= UNIQUE SOFT SHAPE NAV ================= */
    .sidebar ul li a {
      display: flex;
      align-items: center;
      gap: 16px;

      height: 70px;
      padding: 0 28px;

      font-size: 22px;
      font-weight: 500;
      color: #000000;
      text-decoration: none;
      border-radius: 50px;
      /* clip-path: polygon(0% 0%,
          85% 0%,
          97% 50%,
          85% 100%,
          0% 100%); */

      /* ✨ SOFT GRADIENT */
      /* background: linear-gradient(145deg, #ffe6c7, #ffb76b); */
      background: #d89172b9;
      /* 🌟 GLOW + DEPTH */
      box-shadow:
        inset 0 4px 10px rgba(255, 255, 255, 0.7),
        inset 0 -4px 10px rgba(0, 0, 0, 0.08),
        0 0px 0px rgba(0, 0, 0, 0.15);

      transition: all 0.25s ease;
    }

    /* hover = straighten + lift */

    .sidebar ul li a.active {
      background: linear-gradient(145deg, #ffffff, #ffffff);
      color: #C0582B;

      /* box-shadow: 0 10px 20px rgba(0,0,0,0.2); */
    }




    .sidebar ul li a {
      -webkit-tap-highlight-color: transparent;
      /* 🔥 removes mobile blue flash */
      outline: none;
      /* remove focus outline */
    }

    .sidebar ul li a:active {
      outline: none;
    }

    .sidebar ul li a:focus {
      outline: none;
    }


    /* ================= CONTENT ================= */

    .content {
      flex: 1;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ================= TABLET ================= */

    @media (max-width:1024px) {

      .sidebar {
        width: 240px;
      }

      .sidebar ul li a {
        font-size: 14pt;
      }

    }

    /* ================= MOBILE ================= */

    @media (max-width:1100px) {

      .menu-toggle {
        display: block;
      }

      /* sidebar hidden */
      .sidebar {
        position: fixed;
        top: 0;
        left: -100%;
        /* hide fully */
        width: 100%;
        /* ✅ FULL SCREEN */
        height: 100%;
        box-shadow: 4px 0 20px rgba(0, 0, 0, .2);
        /* background:#b4f0d6; */
        /* background-color: lightblue; */
        background-color: #EEF4FF;
        background-image: radial-gradient(#D6E2FF 2px, transparent 1px);



      }



      /* open state */
      .sidebar.open {
        left: 0;
      }

      body {
        flex-direction: column;
      }

      .brand {
        margin-top: 40px;
      }

      /* remove pencil tip on mobile */
      .sidebar ul li a::before,
      .sidebar ul li a::after {
        display: none;
      }

    }

    /* ===================================== */
    /* ===== 1280px PURE SIZE UPGRADE ===== */
    /* ===================================== */

    @media (min-width: 1380px) {

      /* SIDEBAR */
      .sidebar {
        width: 360px;
        padding: 40px 30px;

      }

      /* BRAND TITLE */
      .brand {
        font-size: 36px;
        margin-bottom: 40px;
      }

      /* NAV LINKS */
      .sidebar ul {
        gap: 26px;
      }

      .sidebar ul li a {
        padding: 22px 28px;
        font-size: 28px;
        gap: 18px;

        height: 90px !important;
        /* fixed height */
        padding: 0 22px;
        /* remove vertical padding */
        display: flex;
        align-items: center;
      }


      /* ICON (EMOJI) */
      .sidebar ul li a .sticker {
        font-size: 28px;
      }

      /* HOVER (keep same feel, just slightly stronger) */
      .sidebar ul li a:hover {
        transform: rotate(0deg) translateX(10px) scale(1.05);
      }



      /* MENU BUTTON */
      .menu-toggle {
        font-size: 28px;
        padding: 10px 16px;

      }

    }
  </style>
</head>

<body>
<button class="menu-toggle">☰</button>

  <nav class="sidebar">
    <div class="brand">Body Quiz</div>

    <ul>
      <li><a href="exercises/mcq.html" target="quiz-frame"><span class="sticker">🎯</span>Correct Option</a></li>
      <li><a href="exercises/true_false.html" target="quiz-frame"><span class="sticker">✔️</span>True or False</a></li>
      <li>
        <a href="exercises/one_word.html" target="quiz-frame">
          <span class="sticker">🔤</span>
          One Word
        </a>
      </li>
      <li><a href="exercises/fillblanks.html" target="quiz-frame"><span class="sticker">✏️</span>Fill The Blanks</a>
      </li>
      <li><a href="exercises/matching.html" target="quiz-frame"><span class="sticker">🔗</span>Matching</a></li>

    </ul>
  </nav>

  <main class="content">
    <iframe name="quiz-frame" src="exercises/mcq.html"></iframe>
  </main>

  <script>

    const toggleBtn = document.querySelector('.menu-toggle');
    const sidebar = document.querySelector('.sidebar');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    /* active button logic */
    const links = document.querySelectorAll('.sidebar a');

    links[0].classList.add('active');

    links.forEach(link => {
      link.addEventListener('click', e => {
        links.forEach(l => l.classList.remove('active'));
        e.currentTarget.classList.add('active');

        /* auto close on mobile */
        if (window.innerWidth <= 1100) {
          sidebar.classList.remove('open');
        }
      });
    });

  </script>




</body>
</html>
