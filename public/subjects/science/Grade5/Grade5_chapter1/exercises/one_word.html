<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/auth-guard.js"></script>
<meta charset="UTF-8">
<title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../assets/CSS/one_word.css">
</head>

<body>

<div class="quiz">
 <!-- HEADER -->
    <div class="quiz-header">
        <div class="quiz-title">
            🌱 Plant World Quiz
            <div class="quiz-subtitle">
                Let's explore the world of plants!
            </div>
        </div>

        <div class="score-box" id="scoreBox">
            Score: 0
        </div>
    </div>

  <!-- QUESTION -->
  <div class="question" id="question"></div>
   <img
    id="questionImg"
    src=""
    alt="Question image"
    style="
      width:300px;
      height:200px;
      object-fit:contain;
      margin:2px auto;
      display:block;
      /* background-color: yellow; */
    padding: 0 !important;
    "
  />
 
<div class="answer-input-wrap">
  <input type="text" id="answerInput" placeholder="Type answer..." />
  <button id="submitBtn" class="submitBtnn">Submit</button>
</div>
<input type="text" id="answerInput" autocomplete="off" style="display: none !important;">
<button
id="submitBtn"
style="
  padding:14px 40px;
  font-size:22px;
  border-radius:999px;
  border:none;
  background:#22c55e;
  color:white;
  cursor:pointer;
   display: none;
  "
  class="submitBtnn"
>
Submit
</button>


   


  <!-- NAV -->
   <nav class="nav">

<button class="prev" id="prev">
← Prev

</button>

<button class="next" id="next">
 Next →
</button>

</nav>

</div>
<!-- CORRECT / WRONG POPUP -->
    <div id="answerPopup" class="popup">
        <div class="popup-content">
            <div class="popup-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>
 
    <!-- FINAL POPUP -->
    <div id="finalPopup"> <div class=" finalpopup-box">
        <h2 class="final-heading">🎉 Congratulations!</h2>
        <p id="finalScore"></p>
        <div id="stars"></div><br> <button onclick="location.reload()" class="playAgain-btn"> Play Again </button>
    </div>
    </div>
 
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script src="../assets/JavaScript/one_word.js"></script>

</body>
</html>
