<button class="index-btn" data-file="exercises/matching.html">
     <span class="nav-text">
  <i class="fa-solid fa-link"></i>
  Matching
</span>
    </button>
  </div>

  <div class="content">
    <iframe id="quizFrame"></iframe>
  </div>

  <script>
    const iframe = document.getElementById("quizFrame");
    const buttons = document.querySelectorAll(".index-btn");

    iframe.src = buttons[0].dataset.file;

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        iframe.src = btn.dataset.file;
      });
    });

    const toggle = document.getElementById("menuToggle");
    const menu = document.querySelector(".top-index");

    toggle.addEventListener("click", () => {
      menu.classList.toggle("active");
    });

    /* Close menu when clicking a button */
    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        menu.classList.remove("active");
      });
    });
  </script>
