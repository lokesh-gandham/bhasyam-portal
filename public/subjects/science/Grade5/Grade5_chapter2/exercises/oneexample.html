<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
  <meta charset="UTF-8">
  <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/CSS/oneexample.css">
</head>

<body>

  <div class="quiz">
    <div class="home" onclick="location.href='../index.html'">🏠 Home</div>
    <div class="quiz-title" style=" display: none !important;">Fill & Blanks </div>

    <!-- <div class="header">
    <div id="qCount">Question 1 of 5</div>
  </div> -->

    <div class="question" id="qText"></div>

    <div class="illustration">
      <img id="qImg">
    </div>

    <div class="input-box">
      <input id="answerInput" placeholder="Type answer here ....">
      <input id="answerInput2" placeholder="Type second answer" style="display:none;">
    </div>

    <div class="buttons">
      <button class="prev" id="prevBtn">⟵ Prev</button>
      <button class="check" id="checkBtn" disabled> Submit</button>
      <button class="next" id="nextBtn">Next ⟶</button>
    </div>

  </div>

  <!-- POPUP -->
  <div id="popup" class="popup">
    <div id="popupBox" class="popup-box"></div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="../assets/JavaScript/oneexample.js"></script>

</body>
</html>
