<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
      /* background: linear-gradient(135deg, #e7eaf3, #e6edf5); */
      background: url("./images/bg.png");
      background-repeat: no-repeat;
      background-size: cover;
      overflow: hidden;

    }

    /* SIDEBAR (Desktop visible) */

    .sidebar {
      width: 100%;
      height: 110px;

      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 20px;

      padding: 10px 20px;

      position: fixed;
      top: 0;
      left: 0;

      z-index: 1000;
      margin-top: -1% !important;
    }

    /* MENU BUTTON */

    .menu-btn {
      width: 190px;
      height: 60px !important;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1px !important;
      font-size: 16px;
      font-weight: 500;
      color: white;
      border-radius: 40px 12px 40px 12px;
      outline-offset: -3px;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
    }

    .menu-btn.active {
      /* outline: 3px solid white; */
      outline-offset: -3px;

      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.3),
        0 10px 20px rgba(255, 255, 255, 0.3);
    }

    .icon-box {
      width: 36px;
      height: 36px;

      border-radius: 50%;
      /* background: rgba(255,255,255,0.25); */

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 26px;
      color: white;
    }

    .menu-btn:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
    }

    /* COLORS */
    /* 1?? CHOOSE */
    .color1 {
      background: linear-gradient(135deg, #FF9A9E, #ffbaa7);
    }

    /* 2?? FILL / COMPLETE */
    .color2 {
      background: linear-gradient(135deg, #88dbe0, #98c3ff);
    }

    /* 3?? MATCHING */
    .color3 {
      background: linear-gradient(135deg, #FFD194, #FFB347);
    }

    /* 4?? TRUE / FALSE */
    .color4 {
      background: linear-gradient(135deg, #cba1ff, #B39DDB);
    }

    /* 5?? ONE EXAMPLE */
    .color6 {
      background: linear-gradient(135deg, #6efcb2, #7ED957);
    }


    /* ?? Default = disabled look */
    .menu-btn {
      filter: grayscale(100%) brightness(1);
      opacity: 0.6;
      transition: 0.3s;
    }

    /* ?? Active = original color */
    .menu-btn.active {
      filter: none;
      opacity: 1;
    }

    /* CONTENT */

    .content {
      flex: 1;
      position: relative;
      margin-top: 50px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* TOGGLE BUTTON (hidden by default) */

    .toggle-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: white;
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 1000;
    }

    @media (max-width:780px) {

      .sidebar {
        background: radial-gradient(circle at 20% 30%, #f6dada 0%, transparent 40%),
          radial-gradient(circle at 80% 20%, #d6e6f7 0%, transparent 40%),
          radial-gradient(circle at 60% 80%, #e6d9f7 0%, transparent 40%),
          linear-gradient(135deg, #f3f4f7, #e6edf5);
      }

      .menu-btn {
        border-radius: 40px 12px 40px 12px !important;
      }

    }

    /* MOBILE STYLES */
    @media (max-width:1100px) {

      /* body background fix */

      body {
        height: 100vh;
        display: flex;
        font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        overflow: hidden;
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url("./images/G2_C3_MBG.png") center center no-repeat;
        background-size: cover;
        z-index: -1;
      }

      /* sidebar mobile */

      .sidebar {
        position: fixed;
        top: 0;
        left: -100%;
        /* ?? hide full screen */
        width: 100%;
        height: 100vh;

        display: flex;
        flex-direction: column;
        /* ? vertical layout */
        justify-content: center;
        /* ?? CENTER CONTENT */
        align-items: center;
        /* ?? CENTER VERTICALLY */

        padding: 25px 15px;
        gap: 15px;

        background-color: #F2F7FF;
        transition: 0.3s ease;

        z-index: 999;
      }

      /* open sidebar */

      .sidebar.active {
        left: 0;
      }

      /* menu buttons */

      .menu-btn {
        width: 50%;
        height: 65px;

        justify-content: flex-start;
        /* ?? align left */

        font-size: 16px;
        padding: 0 15px;

        border-radius: 40px 12px 40px 12px;
      }

      /* icons */

      .icon-box {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }

      /* toggle button */

      .toggle-btn {
        display: block;
        background: #8b97ff;
        color: white;
        width: 42px;
        height: 42px;
        border-radius: 12px;
      }

      /* content area */

      .content {
        width: 100%;
        height: 100vh;
      }

      /* iframe */

      iframe {
        width: 100%;
        height: 100%;
        border: none !important;
      }

      /* spacing between menu items */

      .sidebar .menu-btn {
        margin-bottom: 12px;
      }

    }

    @media (min-width: 1680px) {

      /* ? BODY ALIGNMENT */


      .sidebar {
        width: 100%;
        /* ? FIX */
        padding: 20px 30px;
        /* reduced */
        gap: 30px;
        flex-wrap: wrap;
        /* ? IMPORTANT */
        /* background-color: yellow; */
        margin-top: -7px !important;
      }

      .menu-btn {
        width: 260px !important;
        /* ? ADD */
        height: 80px !important;
        /* reduced */
        font-size: 23px;
        border-radius: 60px 12px 60px 12px;
        gap: 12px;
      }

      .icon-box {
        width: 50px;
        height: 50px;
        font-size: 22px;
      }

      .menu-btn:hover {
        transform: translateY(-4px);
        /* ? FIX (vertical instead of side) */
      }
    }
  </style>
</head>

<body>
<button class="toggle-btn" id="toggleBtn">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="sidebar" id="sidebar">

    <div class="menu-btn color1 active" onclick="loadPage(this,'./exercises/mcq.html')">
      <div class="icon-box">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      Choose Correct
    </div>



    <div class="menu-btn color4" onclick="loadPage(this,'./exercises/true_false.html')">
      <div class="icon-box">
        <i class="fa-solid fa-scale-balanced"></i>
      </div>
      True / False
    </div>



    <div class="menu-btn color6" onclick="loadPage(this,'./exercises/one_example.html')">
      <div class="icon-box">
        <i class="fa-solid fa-chalkboard-user"></i>
      </div>
      Two Example
    </div>

    <div class="menu-btn color2" onclick="loadPage(this,'./exercises/fillblanks.html')">
      <div class="icon-box">
        <i class="fa-solid fa-keyboard"></i>
      </div>
      Fill in Blanks
    </div>

    <div class="menu-btn color3" onclick="loadPage(this,'./exercises/matching.html')">
      <div class="icon-box">
        <i class="fa-solid fa-link"></i>
      </div>
      Matching
    </div>

  </div>

  <div class="content">

    <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>

  </div>

  <script>

    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("toggleBtn");

    /* mobile sidebar toggle */

    toggleBtn.onclick = () => {
      sidebar.classList.toggle("active");
    };

    function loadPage(btn, url) {

      document.querySelectorAll('.menu-btn')
        .forEach(b => b.classList.remove('active'));

      btn.classList.add('active');

      document.getElementById('contentFrame').src = url;

      /* close sidebar after click on mobile */

      if (window.innerWidth <= 1100) {
        sidebar.classList.remove("active");
      }

    }

  </script>




</body>
</html>
