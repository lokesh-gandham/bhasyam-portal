<!DOCTYPE html>
<html lang="en">

<head>
  <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/CSS/fillblanks.css">
</head>

<body>
   <div class="main">

    <!-- HEADER -->
    <div class="quiz-header">
        <div class="quiz-title">
            🌱 Plant World Quiz
            <div class="quiz-subtitle">
                Let's explore the world of plants!
            </div>
        </div>

        <div class="score-box" id="scoreBox">
            Score: 0
        </div>
    </div>

    <!-- CONTENT -->
    <div class="question" id="qText"></div>
        <div class="left">
            <img id="qImg" src="" alt="">
        </div>
      <div class="input-box">
  <input id="answerInput" type="text" placeholder="✏️ Type answer ..">
  <button id="submitBtn">Submit </button>
</div>
    


      <nav class="quiz-nav">

<button class="prev" id="prevBtn">
❮ Prev
</button>

<button class="next" id="nextBtn">
 Next ❯
</button>

</nav>

 <!-- ANSWER POPUP -->
<div id="answerPopup" class="popup">
  <div class="popup-content">
    <div id="popupIcon" class="popup-icon"></div>
    <div id="popupTitle" class="popup-title"></div>
    <div id="popupMsg" class="popup-msg"></div>
  </div>
</div>

<!-- FINAL POPUP -->
<div id="finalPopup" class="popup">
  <div class="popup-content">
    <h2>🎉 Congratulations!</h2>
    <div id="finalScore" style="color: #000000; font-weight: 500;"></div>
    <div id="stars"></div>
     <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script src="../assets/JavaScript/fillblanks.js"></script>

</body>
</html>
