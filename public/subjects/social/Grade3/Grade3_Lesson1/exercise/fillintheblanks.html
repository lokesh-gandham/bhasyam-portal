<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Word Quiz</title>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        }

        body {

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        /* MAIN */
        .quiz-box {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* QUESTION */
        .question {
            max-width: 1200px;
            width: 100%;
            margin-top: -40px;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 20px;

            font-size: 30px;


            color: #2f4f4f;

            text-align: left;

            /* ✅ FIXED HEIGHT */
            height: 80px;

            overflow: hidden;
        }

        /* QUESTION IMAGE */
        /* 🌟 PLAYFUL IMAGE BOX */
        .question-img {

            width: 80%;

            max-width: 420px;

            height: 200px;

            object-fit: contain;

            margin-top: 10px;

            margin-bottom: 25px;

            padding: 18px;

            background: #f8f3e7;

            border: 5px solid white;

            border-radius: 40px;

            box-shadow:
                0 10px 0 #e9dfc7,
                0 18px 28px rgba(0, 0, 0, 0.12);

            position: relative;

            transition: 0.3s;

        }


        /* 🌈 OUTER GLOW */
        .question-img::before {
            content: "";
        }

        /* MOBILE */
        @media(max-width:768px) {

            .question-img {

                max-width: 260px;

                height: 170px;

                padding: 12px;

                border-radius: 28px;

            }

        }

        /* MONITOR */
        @media screen and (min-width:1101px) and (max-width:1200px) {

            .question-img {

                max-width: 500px;

                height: 280px;

                padding: 24px;

                border-radius: 50px;

            }

        }

        /* LARGE MONITOR */
        @media screen and (min-width:1601px) {

            .question-img {

                max-width: 760px;

                height: 380px;

                padding: 28px;

                border-radius: 60px;

            }

        }

        /* ANSWER AREA */
        .letter-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        /* 🌈 NEW COLORFUL CIRCLE BOX */
        .letter-box {
            width: 80px;
            height: 80px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
            font-weight: 500;

            color: #2f4f4f;

            background:
                radial-gradient(circle at top,
                    #fff8cc,
                    #ffd166,
                    #ffb703);

            border: 2px solid white;

            box-shadow:
                0 8px 0 #fb8500,
                0 12px 18px rgba(0, 0, 0, 0.15);

            transition: 0.25s;

            position: relative;

            overflow: hidden;
        }



        /* CORRECT */
        .correct {
            background:
                radial-gradient(circle at top,
                    #d8f3dc,
                    #a0ebad) !important;

            color: #2f4f4f;

            box-shadow:
                0 8px 0 #38b000,
                0 0 18px #38b000;
        }

        /* WRONG */
        .wrong {
            background:
                radial-gradient(circle at top,
                    #ffccd5,
                    #ff6b6b) !important;

            color: white;

            box-shadow:
                0 0 18px #ff4d4d;
        }

        /* NAV BUTTONS LIKE MCQ */
        /* NAV */
        .nav {
            position: absolute;
            top: 58%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* PREV */
        .prev {
            position: absolute;
            left: 10px;
            pointer-events: auto;
            background: #7bcb9f;
        }

        /* NEXT */
        .next {
            position: absolute;
            right: 10px;
            pointer-events: auto;
            background: #f28f76;
        }

        /* BUTTON */
        button {

            min-width: 130px;
            height: 50px;


            border: none;
            border-radius: 40px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;

            pointer-events: auto;
            color: #ffffff;

        }

        /* HOVER */
        button:hover:not(:disabled) {
            transform: scale(1.08);
        }

        /* DISABLED */
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        /* DISABLED BUTTONS */


        /* POPUP */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%) scale(0.5);

            width: 350px;
            max-width: 90%;

            padding: 35px 25px;

            border-radius: 40px;

            display: none;

            z-index: 9999;

            text-align: center;

            animation: popupAnim 0.35s forwards;

            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }

        /* POPUP ANIMATION */
        @keyframes popupAnim {
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* CORRECT POPUP */
        .correct-popup {
            background: #dff4ef;
            border: 5px solid #35d0a5;
        }

        /* WRONG POPUP */
        .wrong-popup {
            background: #ffe3e3;
            border: 5px solid #ff6b6b;
        }

        /* FINAL */
        .final-popup {
            background:
                linear-gradient(135deg,
                    #fff1b6,
                    #ffe066);

            border: 5px solid #ffbe0b;
        }

        /* EMOJI */
        .popup-emoji {
            font-size: 75px;
            margin-bottom: 15px;
        }

        /* TITLE */
        .popup-title {
            font-size: 42px;
            margin-bottom: 10px;
        }

        /* TEXT */
        .popup-sub {
            font-size: 24px;
        }

        .play-btn {
            margin: 25px auto 0;

            width: 240px;
            height: 64px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            border: none;
            border-radius: 40px;

            background: linear-gradient(135deg, #06d6a0, #1b9aaa);

            color: #fff;
            font-size: 20px;
            font-weight: 600;

            white-space: nowrap;
            cursor: pointer;
        }



        /* Blinking cursor */
        .letter-box.active::after {
            content: "";
            width: 2px;
            height: 34px;
            background: #1d3557;
            border-radius: 2px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            animation: blinkCursor .8s infinite;
        }

        @keyframes blinkCursor {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }

        /* Hide cursor once a letter is entered */
        .letter-box.active:not(:empty)::after {
            display: none;
        }

        /* MOBILE */
        @media(max-width:768px) {

            body {
                overflow: auto;
            }

            .question {
                font-size: 22px;
                height: auto;
                text-align: left;
                justify-content: center;
            }

            .question-img {
                max-width: 280px;
                height: 170px;
            }

            .letter-box {
                width: 52px;
                height: 52px;
                font-size: 20px;
            }

            .nav {
                position: static;

                display: flex;
                justify-content: center;
                gap: 20px;

                margin-top: 25px;
            }

            .prev,
            .next {
                position: static;
            }

            button {
                font-size: 18px;
                padding: 10px 18px;
            }

            .popup {

                width: 220px;

                padding: 18px 14px;

                border-radius: 22px;

            }

            .popup-emoji {

                font-size: 42px;

                margin-bottom: 8px;

            }

            .popup-title {

                font-size: 24px;

                margin-bottom: 4px;

            }

            .popup-sub {

                font-size: 14px;

            }

            .final-popup {

                padding: 25px 18px;

            }

            .play-btn {

                font-size: 14px;

                padding: 10px 18px;

                margin-top: 15px;

            }

        }

        /* ================= MONITOR RESPONSIVE ================= */

        @media screen and (min-width:1441px) and (max-width:1600px) {

            .quiz-box {

                max-width: 1700px;

            }

            /* QUESTION */
            .question {

            /* IMAGE */

            }

            /* LETTER AREA */
            .letter-container {

            /* LETTER BOX */

            /* BUTTON */

            }

            /* POPUP */
            .popup {

            /* POPUP EMOJI */
            .popup-emoji {

            }

            /* POPUP TITLE */
            .popup-title {

                font-size: 52px;

            }

            /* POPUP SUBTITLE */
            .popup-sub {

            }

            /* FINAL POPUP */
            .final-popup {

            }

            /* PLAY BUTTON */
            .play-btn {

                border-radius: 42px;

            }

        }

        /* ================= LARGE MONITOR RESPONSIVE ================= */

        @media screen and (min-width:1601px) {

            .quiz-box {

                max-width: 2300px;

            }

            /* QUESTION */
            .question {

                max-width: 1900px;

            }


            .question-img {

            }

            /* POPUP */

            /* POPUP EMOJI */

            }

            /* POPUP TITLE */

            /* POPUP SUBTITLE */

            }

            /* FINAL POPUP */

                padding: 80px 60px;

            }

            .play-btn {
                margin: 25px auto 0;

                width: 260px;
                height: 74px;

                display: flex;

                gap: 10px;

                color: #fff;
                font-size: 25px;
                font-weight: 600;

                white-space: nowrap;
                cursor: pointer;
            }

        }

        /* ================= LARGE MONITOR RESPONSIVE ================= */

        @media screen and (min-width:1601px) and (max-width:1900px) {

            .quiz-box {

                width: 100%;
                max-width: 1800px;

                padding: 20px;

                display: flex;

            /* QUESTION */

            /* IMAGE */
            .question-img {

            /* NAV */

            }

            /* BUTTON */
            button {

        }

        @media screen and (min-width:1921px) {

            /* QUESTION */
            .question {

                font-size: 40px;

                max-width: 1500px;

    </style>

<body>

    <div class="quiz-box">

        <!-- QUESTION -->
        <div class="question" id="question"></div>

        <!-- IMAGE -->
        <img id="img" class="question-img">

        <!-- LETTER BOXES -->
        <div id="letterBoxes" class="letter-container"></div>

        <!-- NAV -->
        <div class="nav">

            <button class="prev" id="prev" onclick="prevQ()">
                ← Prev
            </button>

            <button class="next" id="next" onclick="nextQ()" disabled>
                Next →
            </button>

        </div>

    </div>

    <!-- POPUP -->
    <div class="popup" id="popup"></div>

    <!-- FINAL -->
    <div class="popup final-popup" id="finalPopup">

        <div id="finalText"></div>

        <button class="play-btn" onclick="restartQuiz()">
            🔄 Play Again
        </button>

    </div>

    <script>
        /* QUESTIONS */

        const quiz = [

            {
                q: "Q1. _____ are large natural objects that revolve around the Sun.",

                img: "../images/ftb11.png",

                a: ["planets"]
            },

            {
                q: "Q2. _____ is the smallest and the nearest planet to the Sun.",

                img: "../images/ftb2.png",

                a: ["mercury"]
            },

            {
                q: "Q3. The _____ is the only planet that supports life.",

                img: "../images/ftb3.png",

                a: ["earth"]
            },

            {
                q: "Q4. The Earth also has _____ which is necessary for living things to survive.",

                img: "../images/ftb4.png",

                a: ["oxygen"]
            },

            {
                q: "Q5. There are many bright rings around the _____ planet.",

                img: "../images/ftb5.png",

                a: ["saturn"]
            }

        ];
        /* VARIABLES */

        let current = 0;

        let score = 0;

        let userAnswers = new Array(quiz.length).fill(null);

        let answered = false;
        let quizEnded = false;
        let userInput = "";

        /* UK SPEECH */
        function speakText(text) {

            window.speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-UK";

            speech.rate = 1;

            speech.pitch = 1;

            speech.volume = 0.25;

            speechSynthesis.speak(speech);

        }
        /* POPUP */

        function showPopup(correct) {

            let popup = document.getElementById("popup");

            popup.className = "popup";

            if (correct) {

                popup.classList.add("correct-popup");

                popup.innerHTML = `

<div class="popup-emoji">
🥳
</div>

<div class="popup-title">
Good
</div>

<div class="popup-sub">
Correct choice.
</div>

`;

            } else {

                popup.classList.add("wrong-popup");

                popup.innerHTML = `

<div class="popup-emoji">
😭
</div>

<div class="popup-title">
Oops
</div>

<div class="popup-sub">
Try again.
</div>

`;

            }

            popup.style.display = "block";

            setTimeout(() => {
                popup.style.display = "none";
            }, 1300);

        }

        /* LOAD */

        function loadQ() {

            question.innerText = quiz[current].q;

            img.src = quiz[current].img;
            if (current === 0) {

                prev.style.pointerEvents = "none";

            } else {

                prev.style.pointerEvents = "auto";

            } letterBoxes.innerHTML = "";

            const answer = quiz[current].a[0];

            /* RESTORE */
            if (userAnswers[current]) {

                userInput = userAnswers[current];

                answered = true;

                next.disabled = false;

            } else {

                userInput = "";

                answered = false;

                next.disabled = true;

            }

            /* CREATE BOXES */
            for (let i = 0; i < answer.length; i++) {

                let box = document.createElement("div");

                box.className = "letter-box";

                letterBoxes.appendChild(box);

            }

            /* RESTORE */
            const boxes = document.querySelectorAll(".letter-box");

            document.body.focus();
            window.focus();
            if (!answered && boxes.length > 0) {
                boxes[0].classList.add("active");
            }
            // Mobile Backspace
            boxes.forEach((box, index) => {

                box.addEventListener("click", () => {

                    if (answered) return;

                    // Remove only if this box has a letter
                    if (index < userInput.length) {

                        userInput = userInput.slice(0, index);

                        boxes.forEach((b, i) => {
                            b.textContent = userInput[i]
                                ? userInput[i].toUpperCase()
                                : "";
                        });

                        next.disabled = true;
                    }

                });

            });

            if (userAnswers[current]) {

                boxes.forEach((b, i) => {

                    b.textContent = userInput[i]
                        ? userInput[i].toUpperCase()
                        : "";

                    b.classList.add("correct");

                });

            }

        }

        /* KEYBOARD */

        document.addEventListener("keydown", (e) => {

            if (answered) return;

            const answer = quiz[current].a[0];

            const boxes = document.querySelectorAll(".letter-box");

            /* BACKSPACE */
            if (e.key === "Backspace") {

                userInput = userInput.slice(0, -1);

            }

            /* LETTERS */
            else if (
                (
                    /^[a-zA-Z]$/.test(e.key)
                    ||
                    e.key === "/"
                )
                &&
                userInput.length < answer.length
            ) {

                userInput += e.key.toLowerCase();

            }

            /* UPDATE */
            boxes.forEach((b, i) => {

                b.textContent = userInput[i]
                    ? userInput[i].toUpperCase()
                    : "";

                b.classList.toggle(
                    "active",
                    i === Math.min(userInput.length, answer.length - 1)
                );

            });

            /* CHECK */
            if (userInput.length === answer.length) {

                checkAnswer();

            }

        });

        /* CHECK */

        function checkAnswer() {

            const boxes = document.querySelectorAll(".letter-box");

            let user = userInput.toLowerCase().trim();

            /* MULTIPLE ANSWERS */
            let correct = quiz[current].a.some(
                ans => ans === user
            );

            if (correct) {

                answered = true;

                score++;

                userAnswers[current] = userInput;

                boxes.forEach(b => b.classList.add("correct"));

                showPopup(true);

                speakText("Correct");

                confetti({
                    particleCount: 120,
                    spread: 100,
                    origin: { y: 0.6 }
                });

                next.disabled = false;

                /* FINAL */
                if (current === quiz.length - 1) {

                    setTimeout(showResult, 1200);

                }

            } else {

                boxes.forEach(b => b.classList.add("wrong"));

                showPopup(false);

                speakText("Try again");

                setTimeout(() => {

                    userInput = "";

                    boxes.forEach((b, index) => {

                        b.textContent = "";
                        b.classList.remove("wrong");
                        b.classList.remove("active");

                        // Put cursor back in the first circle
                        if (index === 0) {
                            b.classList.add("active");
                        }

                    });

                }, 800);

            }
        }



        /* NEXT */
        function nextQ() {

            if (quizEnded) return;

            if (!answered) return;

            if (current < quiz.length - 1) {

                current++;

                loadQ();

            }

        }

        /* PREV */
        function prevQ() {

            if (quizEnded) return;

            if (current > 0) {

                current--;

                loadQ();

            }

        }

        /* FINAL */
        function showResult() {

            quizEnded = true;

            // Disable Previous button
            prev.disabled = true;
            prev.style.pointerEvents = "none";
            prev.style.cursor = "not-allowed";
            prev.style.opacity = "0.5";

            // Disable Next button
            next.disabled = true;
            next.style.pointerEvents = "none";
            next.style.cursor = "not-allowed";
            next.style.opacity = "0.5";

            document.getElementById("finalText").innerHTML = `
        <div style="font-size:80px;">🏆</div>

        <div style="font-size:40px; margin-top:10px;">
            Awesome!
        </div>

        <div style="font-size:30px; margin-top:15px;">
            Score: ${score}/${quiz.length}
        </div>
    `;

            document.getElementById("finalPopup").style.display = "block";

            confetti({
                particleCount: 150,
                spread: 120,
                origin: { y: 0.6 }
            });

        }

        /* RESTART */

        function restartQuiz() {

            location.reload();

        }


        /* START */
        /* START */
        loadQ();

        // Automatically focus the page so typing works immediately
        window.focus();

        setTimeout(() => {
            window.focus();
            document.body.focus();
        }, 50);

    </script>

    <script id="codex-viewport-fit">
        (function () {
            if (window.__codexViewportFit) return;
            window.__codexViewportFit = true;

            const hasIframe = Boolean(document.querySelector("iframe"));
            const selectors = [
                ".main",
                ".main-container",
                ".quiz",
                ".quiz-container",
                ".quiz-box",
                ".container",
                ".stage",
                ".screen",
                ".game",
                ".template",
                ".quiz-card",
                ".app"
            ];
            const minScale = 0.62;
            let rafId = 0;

            function setViewportRules() {
                document.documentElement.style.width = "100%";
                document.documentElement.style.height = "100%";
                document.documentElement.style.overflow = "hidden";
                document.body.style.width = "100%";
                document.body.style.height = "100svh";
                document.body.style.minHeight = "100svh";
                document.body.style.overflow = "hidden";
            }

            function getStage() {
                for (const selector of selectors) {
                    const stage = document.querySelector(selector);
                    if (stage) return stage;
                }
                return null;
            }

            function fitToViewport() {
                setViewportRules();
                if (hasIframe) return;

                const stage = getStage();
                if (!stage) return;

                stage.style.transform = "scale(1)";
                stage.style.transformOrigin = "center center";

                const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                const rect = stage.getBoundingClientRect();
                const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                const scale = Math.max(
                    minScale,
                    Math.min(
                        1,
                        (viewportWidth - breathingRoom * 2) / contentWidth,
                        (viewportHeight - breathingRoom * 2) / contentHeight
                    )
                );

                stage.style.transform = `scale(${scale})`;
            }

            function requestFit() {
                cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(fitToViewport);
            }

            window.addEventListener("load", requestFit);
            window.addEventListener("resize", requestFit);
            window.addEventListener("orientationchange", requestFit);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(requestFit).catch(function () { });
            }

            document.querySelectorAll("img").forEach(function (img) {
                img.addEventListener("load", requestFit, { once: false });
            });

            if ("ResizeObserver" in window) {
                const observer = new ResizeObserver(requestFit);
                const observeStage = function () {
                    const stage = getStage();
                    if (stage) observer.observe(stage);
                };
                observeStage();
                window.addEventListener("load", observeStage);
            }

            if (document.body) {
                new MutationObserver(requestFit).observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }

            requestFit();
        })();
    </script>
