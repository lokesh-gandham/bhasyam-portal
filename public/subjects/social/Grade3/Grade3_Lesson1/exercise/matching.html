/* LEFT & RIGHT - SAME STYLE */

.item.active{

    /* 🌈 MATCH CHIP */
    .match-chip{

    width:430px;
    min-height:90px;

    padding:0 28px;

    border-radius:34px;

    background:
    linear-gradient(
    135deg,
    #cdb4db,

    #ffafcc

    position:relative;

    display:flex;
    align-items:center;

    font-size:24px;

    animation:pop .3s ease;

    overflow:hidden;
    }

    /* SAME TEXT START */
    /* SAME TEXT START */
    .chip-content{

    width:100%;

    display:grid;

    /* LESS GAP */
    grid-template-columns:
    120px 28px 1fr;

    align-items:center;

    }

    /* RIGHT TEXT */

    max-width:80%;

    text-align:center;

    animation:popupAnim 0.35s forwards;

    box-shadow:0 12px 35px rgba(0,0,0,0.15);

    <div class="container">

    <div class="game">

<svg id="lineLayer"></svg>

    <!-- CENTER -->

    <div id="finalPopup" class="popup final-popup">

    <div class="popup-emoji">
    🏆
    </div>

    <div class="popup-title">
    Awesome!
    </div>

    🔄 Play Again

    <script>

    /* 🔊 UK SPEECH */
    function speakText(text){

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang="en-UK";

speech.rate=1;

speech.pitch=1;

speech.volume=0.25;

speechSynthesis.speak(speech);

}

    /* QUESTIONS */

    const leftData=[

    {
    text:"Stars",
    match:"twinkle",
    img:"../images/starsimg.png"
    },

    {
    text:"Pole Star",
    match:"brightest",
    img:"../images/polestar.png"
    },

    {
    text:"The Sun",
    match:"light",
    img:"../images/sunimg.png"
    },

    {
    text:"Planets",
    match:"eight",
    img:"../images/planets.png"
    },

    {
    text:"The Earth",
    match:"third",
    img:"../images/earthimg.png"
    }

    ];

    const rightData=[

    {
    text:"Brightest Star",
    match:"brightest"
    },

    {
    text:"Twinkle at night",
    match:"twinkle"
    },

    {
    text:"The third planet",
    match:"third"
    },

    {
    text:"Light and heat",
    match:"light"
    },

    {
    text:"Eight",
    match:"eight"
    }

    ];
const lineColors=[

"#ff6b6b",
"#4ecdc4",
"#ffd166",
"#9b5de5",
"#06d6a0",
"#f15bb5"

];
    let selected=null;

    let score=0;

    const left=document.getElementById("left");

    const right=document.getElementById("right");

const svg=
document.getElementById("lineLayer");

function drawLine(leftEl, rightEl) {

    const game = document.querySelector(".game");
    const svg = document.getElementById("lineLayer");

    // SVG size
    svg.setAttribute("width", game.offsetWidth);
    svg.setAttribute("height", game.offsetHeight);
    svg.setAttribute("viewBox", `0 0 ${game.offsetWidth} ${game.offsetHeight}`);

    const gameRect = game.getBoundingClientRect();
    const scaleX = gameRect.width / game.offsetWidth;
    const scaleY = gameRect.height / game.offsetHeight;

    const leftRect = leftEl.getBoundingClientRect();
    const rightRect = rightEl.getBoundingClientRect();

    const x1 = (leftRect.right - gameRect.left) / scaleX;
    const y1 = (leftRect.top + leftRect.height / 2 - gameRect.top) / scaleY;

    const x2 = (rightRect.left - gameRect.left) / scaleX;
    const y2 = (rightRect.top + rightRect.height / 2 - gameRect.top) / scaleY;

    const curve = Math.min(120, Math.abs(x2 - x1) / 2);

    const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
    );

    path.setAttribute(
        "d",
        `M ${x1} ${y1}
         C ${x1 + curve} ${y1},
           ${x2 - curve} ${y2},
           ${x2} ${y2}`
    );

    path.setAttribute("class", "match-line");
    path.setAttribute("stroke", lineColors[score % lineColors.length]);

    svg.appendChild(path);
}


    /* 🎉 CONFETTI */
    function finalConfetti(){

    confetti({
    particleCount:150,
    spread:120,
    origin:{y:0.6}
    });

    }

    /* FINAL RESULT */
    function showResult(){

    document.getElementById("finalScore").innerHTML=

    `
    Score: ${score}/${leftData.length}
    `;

    document.getElementById("finalPopup").style.display="block";

    finalConfetti();


    }

    /* LEFT SIDE */
    leftData.forEach(item=>{

    const div=document.createElement("div");

    div.className="item";

    div.dataset.match=item.match;

    div.innerHTML=`

    <div class="item-content">

    <img src="${item.img}" class="left-img">

    <span class="left-text">
    ${item.text}
    </span>

    </div>

    `;

    div.onclick=()=>{

    if(div.classList.contains("matched")) return;

    document.querySelectorAll(".item").forEach(
    i=>i.classList.remove("active")
    );

    div.classList.add("active");

    selected=div;

    };

    left.appendChild(div);

    });

    /* RIGHT SIDE */
    rightData.forEach(item=>{

    const div=document.createElement("div");

    div.className="item";

    div.dataset.match=item.match;

    div.innerHTML=`

    <div class="item-content">

    <span>
    ${item.text}
    </span>

    </div>

    `;

    div.onclick=()=>{

    if(!selected) return;

    /* ✅ CORRECT */
    if(selected.dataset.match===div.dataset.match){
drawLine(
selected,
div
);

    selected.classList.add("matched");

    div.classList.add("matched");

    selected.classList.remove("active");

    confetti({
    particleCount:60,
    spread:70
    });

    speakText("Correct");

    score++;

    if(score===leftData.length){

    setTimeout(showResult,800);

    }

    selected=null;

    }else{

    /* ❌ WRONG */
    div.style.background="#fecaca";

    speakText("Try Again");

    setTimeout(()=>{

    div.style.background="";

    },300);

    }

    };

    right.appendChild(div);

    });

    </script>

    <script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
