            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        /* MAIN */
        .main-container {
            width: 100%;
            max-width: 1400px;

            border-radius: 25px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .question {
            max-width: 1200px;
            width: 100%;
            margin-top: -20px;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 20px;

            font-size: 30px;
            line-height: 1.5;

            color: #2f4f4f;

            text-align: left;

            /* ✅ FIXED HEIGHT */
            height: 80px;

            overflow: hidden;
        }

        /* QUESTION IMAGE */
        /* QUESTION IMAGE */
        .question-img {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;

            margin-bottom: 30px;
            overflow: hidden;
        }

        /* IMAGE FIT */
        .question-img img {
            width: 100%;
            max-width: 520px;

            height: 210px;

            object-fit: contain;

            display: block;
        }

        /* MOBILE */
        @media(max-width:768px) {

            .question-img img {
                max-width: 320px;
                height: 170px;
            }

        }



        /* OPTIONS */
        .options {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: -40px;
        }

        /* OPTION BOX */
        .option {
            width: 230px;
            height: 190px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            padding: 15px;
            border: 3px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        /* DIFFERENT PASTEL COLORS */
        .option:nth-child(1) {
            background: #ffd6e0;
        }

        .option:nth-child(2) {
            background: #d8f3dc;
        }

        .option:nth-child(3) {
            background: #fff1b6;
        }

        /* OPTION IMAGE */
        .opt-img {
            width: 150px;
            height: 180px;
            object-fit: contain;

        }

        /* OPTION TEXT */
        .opt-text {
            font-size: 22px;
            color: #2f4f4f;
            text-align: center;
            margin-top: -30px;
        }

        /* CORRECT */
        .correct {
            background: #b9fbc0 !important;
            border: 3px solid #38b000;
        }

        /* WRONG */
        .wrong {
            background: #ffadad !important;
            border: 3px solid #d00000;
        }

        /* NAV BUTTONS */
        .nav-buttons {
            position: absolute;
            top: 58%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            pointer-events: none;
            min-width: 100px;
            height: 50px;


        }

        /* PREV */
        .prev {
            position: absolute;
            left: 10px;
            pointer-events: auto;
            background: #7bcb9f;


        }

        /* NEXT */
        .next {
            position: absolute;
            right: 10px;
            pointer-events: auto;
            background: #f28f76;


        }

        /* BUTTON */
        button {
            min-width: 130px;
            height: 50px;

            border: none;
            border-radius: 40px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            color: #ffffff;
        }

        /* HOVER */
        button:hover:not(:disabled) {
            transform: scale(1.08);
        }

        /* DISABLED */
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        /* MOBILE */
        @media(max-width:768px) {

            .nav-buttons {
                position: static;
                transform: none;
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 25px;
                pointer-events: auto;
            }

            .prev,
            .next {
                position: static;
            }

            button {
                font-size: 15px;
                padding: 10px 18px;
            }

        }

        /* POPUP */
        /* BIG POPUP */
        /* POPUP */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            width: 350px;
            max-width: 80%;
            padding: 35px 25px;

    <style id="codex-responsive-shell">

        /* =========================

        ========================= */
        function speak(text) {

            window.speechSynthesis.cancel();

            const speech = new SpeechSynthesisUtterance(text);

            speech.lang = "en-UK";
            speech.rate = 1;
            speech.pitch = 1;
            speech.volume = 0.25;

            // Optional: Use a UK voice if available
            const voices = speechSynthesis.getVoices();
            const ukVoice = voices.find(v => v.lang === "en-UK");
            if (ukVoice) speech.voice = ukVoice;

            speechSynthesis.speak(speech);
        }
        /* =========================
           LOAD QUESTION
        ========================= */

        function loadQuestion() {

            let q = questions[current];

            document.getElementById("question").innerText = q.q;

            document.getElementById("qImage").src = q.qImg;

            let options = document.querySelectorAll(".option");

            options.forEach((btn, i) => {
                // Disable previously selected wrong options
                if (wrongAnswers[current].includes(i)) {
                    btn.style.pointerEvents = "none";
                    btn.style.opacity = "0.5";
                } else {
                    btn.style.pointerEvents = "auto";
                    btn.style.opacity = "1";
                }
                btn.querySelector(".opt-text").innerText = q.options[i];

                btn.querySelector(".opt-img").src = q.imgOptions[i];

                btn.classList.remove("correct", "wrong");

                btn.style.pointerEvents = "auto";

            });

            /* RESTORE ANSWER */
            if (answers[current] !== null) {

                let selected = answers[current];

                options[selected].classList.add(
                    selected === q.correct ? "correct" : "wrong"
                );

                if (selected === q.correct) {

                    options.forEach(btn => {
                        btn.style.pointerEvents = "none";
                    });

                    nextBtn.disabled = false;

                } else {

                    nextBtn.disabled = true;

                }

            } else {

                nextBtn.disabled = true;

            }

        }

        /* =========================
           SELECT OPTION
        ========================= */

        function selectOption(i) {

            let q = questions[current];

            let options = document.querySelectorAll(".option");

            /* STOP MULTIPLE CLICK */
            if (answers[current] === q.correct) return;

            answers[current] = i;

            /* CORRECT ANSWER */
            if (i === q.correct) {

                options[i].classList.add("correct");

                /* CONFETTI */
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                /* UK SPEECH */
                speak("Correct");

                /* POPUP */
                showPopup(true);

                score++;

                options.forEach(btn => {
                    btn.style.pointerEvents = "none";
                });

                nextBtn.disabled = false;

                /* FINAL */
                if (current === questions.length - 1) {

                    setTimeout(() => {
                        showFinal();
                    }, 1200);

                }

            }

            /* WRONG ANSWER */
            /* WRONG ANSWER */
            else {

                options[i].classList.add("wrong");

                // Save wrong option
                if (!wrongAnswers[current].includes(i)) {
                    wrongAnswers[current].push(i);
                }

                speak("Try again");
                showPopup(false);

                answers[current] = null;
                nextBtn.disabled = true;

                setTimeout(() => {
                    options[i].classList.remove("wrong");
                    options[i].style.pointerEvents = "none"; // disable this wrong option
                    options[i].style.opacity = "0.5";
                }, 700);
            }
        }
        function showPopup(isCorrect) {

            let popup = document.getElementById("popup");

            popup.className = "popup";

            if (isCorrect) {

                popup.classList.add("correct-popup");

                popup.innerHTML = `
            <div class="popup-emoji">👍</div>
            <div class="popup-title">Good</div>
            <div class="popup-sub">Correct choice.</div>
        `;

            } else {

                popup.classList.add("wrong-popup");

                popup.innerHTML = `
            <div class="popup-emoji">😕</div>
            <div class="popup-title">Oops</div>
            <div class="popup-sub">Try again.</div>
        `;
            }

            popup.style.display = "block";

            setTimeout(() => {
                popup.style.display = "none";
            }, 1400);
        }

        /* =========================
           NEXT QUESTION
        ========================= */
        function nextQuestion() {

            if (quizEnded) return;

            if (current < questions.length - 1) {

                current++;

                loadQuestion();

            }

        }

        /* =========================
           PREVIOUS QUESTION
        ========================= */
        function prevQuestion() {

            if (quizEnded) return;

            if (current > 0) {

                current--;

                loadQuestion();

            }

        }

        /* =========================
           FINAL POPUP
        ========================= */
        function showFinal() {

            quizEnded = true;

            // Disable Prev button
            const prevBtn = document.querySelector(".prev");
            prevBtn.disabled = true;
            prevBtn.style.pointerEvents = "none";
            prevBtn.style.cursor = "not-allowed";
            prevBtn.style.opacity = "0.5";

            // Disable Next button
            const nextBtn = document.querySelector(".next");
            nextBtn.disabled = true;
            nextBtn.style.pointerEvents = "none";
            nextBtn.style.cursor = "not-allowed";
            nextBtn.style.opacity = "0.5";

            document.getElementById("finalText").innerHTML = `
        <div style="font-size:80px;">🏆</div>

        <div style="font-size:40px; margin-top:10px;">
            Awesome!
        </div>

        <div style="font-size:32px; margin-top:15px;">
            Score: ${score}/${questions.length}
        </div>
    `;

            document.getElementById("finalPopup").style.display = "block";

            confetti({
                particleCount: 220,
                spread: 120
            });
        }

        /* =========================
           RESTART QUIZ
        ========================= */
        function restartQuiz() {

            // Reset quiz variables
            current = 0;
            score = 0;
            quizEnded = false;

            answers = new Array(questions.length).fill(null);

            // Hide final popup
            document.getElementById("finalPopup").style.display = "none";

            // Enable Prev button
            const prevBtn = document.querySelector(".prev");
            prevBtn.disabled = false;
            prevBtn.style.pointerEvents = "auto";
            prevBtn.style.cursor = "pointer";
            prevBtn.style.opacity = "1";

            // Enable Next button
            const nextBtn = document.querySelector(".next");
            nextBtn.disabled = true;
            nextBtn.style.pointerEvents = "auto";
            nextBtn.style.cursor = "pointer";
            nextBtn.style.opacity = "1";

            // Stop any speech
            window.speechSynthesis.cancel();
            wrongAnswers = questions.map(() => []);
            // Reload first question
            loadQuestion();
        }

        /* =========================
           START QUIZ
        ========================= */

        window.speechSynthesis.onvoiceschanged = () => {

            loadQuestion();

        };
    </script>

    <script id="codex-viewport-fit">
        (function () {
            if (window.__codexViewportFit) return;
            window.__codexViewportFit = true;

            const hasIframe = Boolean(document.querySelector("iframe"));
            const selectors = [
                ".main",
                ".main-container",
                ".quiz",
                ".quiz-container",
                ".quiz-box",
                ".container",
                ".stage",
                ".screen",
                ".game",
                ".template",
                ".quiz-card",
                ".app"
            ];
            const minScale = 0.62;
            let rafId = 0;

            function setViewportRules() {
                document.documentElement.style.width = "100%";
                document.documentElement.style.height = "100%";
                document.documentElement.style.overflow = "hidden";
                document.body.style.width = "100%";
                document.body.style.height = "100svh";
                document.body.style.minHeight = "100svh";
                document.body.style.overflow = "hidden";
            }

            function getStage() {
                for (const selector of selectors) {
                    const stage = document.querySelector(selector);
                    if (stage) return stage;
                }
                return null;
            }

            function fitToViewport() {
                setViewportRules();
                if (hasIframe) return;

                const stage = getStage();
                if (!stage) return;

                stage.style.transform = "scale(1)";
                stage.style.transformOrigin = "center center";

                const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                const rect = stage.getBoundingClientRect();
                const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                const scale = Math.max(
                    minScale,
                    Math.min(
                        1,
                        (viewportWidth - breathingRoom * 2) / contentWidth,
                        (viewportHeight - breathingRoom * 2) / contentHeight
                    )
                );

                stage.style.transform = `scale(${scale})`;
            }

            function requestFit() {
                cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(fitToViewport);
            }

            window.addEventListener("load", requestFit);
            window.addEventListener("resize", requestFit);
            window.addEventListener("orientationchange", requestFit);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(requestFit).catch(function () { });
            }

            document.querySelectorAll("img").forEach(function (img) {
                img.addEventListener("load", requestFit, { once: false });
            });

            if ("ResizeObserver" in window) {
                const observer = new ResizeObserver(requestFit);
                const observeStage = function () {
                    const stage = getStage();
                    if (stage) observer.observe(stage);
                };
                observeStage();
                window.addEventListener("load", observeStage);
            }

            if (document.body) {
                new MutationObserver(requestFit).observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }

            requestFit();
        })();
    </script>
