<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fill in the Blanks</title>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Livvic', sans-serif;
            font-weight: normal;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;

        }

        .main {
            width: 100%;
            max-width: 1200px;
        }

        /* QUESTION */
        .question {
            max-width: 1200px;
            width: 100%;
            margin-top: -20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            padding: 0 20px;

            font-size: 30px;
            line-height: 1.5;

            color: #2f4f4f;

            text-align: center;

            /* ✅ FIXED HEIGHT */
            height: 80px;

            overflow: hidden;
        }

        /* IMAGE */
        /* 🌟 QUESTION IMAGE */
        .image-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            position: relative;
        }

        /* ✨ IMAGE DESIGN */
        .image-box img {

            width: 220px;
            height: 220px;

            object-fit: contain;

            position: relative;
            z-index: 2;

            animation: floatImage 2.5s ease-in-out infinite;
        }


        /* ANSWER AREA */
        /* 🌈 ANSWER AREA */
        .answer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 30px;
        }

        /* 🍭 PLAYFUL ANSWER BOX */
        .answer-box {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            width: 400px;
            max-width: 95%;

            padding: 12px;

            border-radius: 26px;

            background:
                linear-gradient(135deg,
                    #fff0f6,
                    #e0f7ff);

            border: 4px solid white;

            box-shadow:
                0 8px 0 #ffd6e7,
                0 14px 22px rgba(0, 0, 0, 0.12);

            overflow: hidden;

            transition: 0.3s;
        }

        /* ✨ CIRCLES */
        .answer-box::before {
            content: "";

            position: absolute;
            top: -20px;
            right: -20px;

            width: 70px;
            height: 70px;

            background: rgba(255, 255, 255, 0.35);

            border-radius: 50%;
        }

        .answer-box::after {
            content: "";

            position: absolute;
            bottom: -15px;
            left: -15px;

            width: 50px;
            height: 50px;

            background: rgba(255, 255, 255, 0.25);

            border-radius: 50%;
        }


        /* ✏ INPUT */
        .answer-box input {
            flex: 1;

            height: 54px;

            border: none;
            outline: none;

            border-radius: 18px;

            background: white;

            padding: 0 15px;

            font-size: 21px;

            text-align: center;

            color: #2f4f4f;

            border: 3px dashed #bde0fe;
         font-weight: 500;
            z-index: 3;
        }

        /* PLACEHOLDER */
        .answer-box input::placeholder {
            color: #999;
        }

        /* 🚀 BUTTON */
        .answer-box button {
            height: 54px;

            padding: 0 20px;

            border: none;

            border-radius: 18px;

            background:
                linear-gradient(135deg,
                    #ff9f1c,
                    #ffbf69);

            color: white;

            font-size: 15px;

            cursor: pointer;

            transition: 0.3s;

            z-index: 2;

            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.12);
        }

        /* BUTTON HOVER */
        .answer-box button:hover {
            transform: scale(1.06);
        }

        /* DISABLED */
        .answer-box button:disabled {
            background: #d9d9d9;
            color: #777;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ✅ CORRECT */
        .correct {
            background: #d8f3dc !important;
            border: 3px solid #38b000 !important;
            color: #1b4332 !important;
        }

        /* 📱 MOBILE */
        @media(max-width:768px) {

            }

        .correct {

        }

            width: 100%;

            pointer-events: none;
        }

        /* PREV */
        .prev {

        }

        /* NEXT */

<body>

    <div class="main">

        <!-- QUESTION -->
        <div class="question" id="question"></div>

        <!-- IMAGE -->
        <div class="image-box">
            <img id="image" draggable="false">
        </div>

        <!-- ANSWERS -->
        <div class="answer-container" id="letters"></div>

        <!-- NAV -->
        <div class="nav">
            <button class="nav-btn prev" id="prevBtn">← Prev</button>
            <button class="nav-btn next" id="nextBtn">Next →</button>
        </div>

        <!-- POPUP -->
        <div class="popup" id="popup"></div>

        <!-- FINAL -->
        <div class="popup final-popup" id="finalPopup">

            <div id="finalText"></div>

            <button class="play-btn" onclick="restartQuiz()">
                🔄 Play Again
            </button>

        </div>

        <script>

            /* =========================
               QUESTIONS
            ========================= */
            /* =========================
               QUESTIONS
            ========================= */

            const questions = [

                {
                    q: "Q1. They move around the Sun in their orbits.",

                    a: ["Planets"],

                    img: "../images/ow11.png"
                },

                {
                    q: "Q2. It is the first artificial satellite of India.",

                    a: ["Aryabhata"],

                    img: "../images/ow22.png"
                },

                {
                    q: "Q3. It has faint rings and moons around it.",

                    a: ["Uranus", "Neptune"],

                    img: "../images/ow3.png"
                },

                {
                    q: "Q4. It is the fastest spinning planet in our solar system.",

                    a: ["Jupiter"],

                    img: "../images/ow44.png"
                },

                {
                    q: "Q5. This theory explains the origin of the Universe.",

                    a: ["Big Bang Theory"],

                    img: "../images/ow55.png"
                }

            ];
            /* =========================
               VARIABLES
            ========================= */

            let index = 0;

            let score = 0;

            let answered = questions.map(q => new Array(q.a.length).fill(false));
            let quizEnded = false;
            /* =========================
               ELEMENTS
            ========================= */

            const qEl = document.getElementById("question");

            const img = document.getElementById("image");

            const letters = document.getElementById("letters");

            const nextBtn = document.getElementById("nextBtn");

            const prevBtn = document.getElementById("prevBtn");

            /* =========================
               UK SPEECH
            ========================= */
            function speak(text) {

                window.speechSynthesis.cancel();

                const speech =
                    new SpeechSynthesisUtterance(text);

                speech.lang = "en-UK";

                speech.rate = 1;

                speech.pitch = 1;

                speech.volume = 0.25;

                speechSynthesis.speak(speech);

            }

            /* =========================
               NORMALIZE
            ========================= */

            function normalize(text) {

                return text
                    .toLowerCase()
                    .trim()
                    .replace(/\s+/g, " ");

            }

            function toSentenceCase(text) {
                text = text.toLowerCase();
                return text.charAt(0).toUpperCase() + text.slice(1);
            }

            /* =========================
               LOAD QUESTION
            ========================= */

            function load() {

                let q = questions[index];

                qEl.textContent = q.q;

                img.src = q.img;

                letters.innerHTML = "";

                for (let i = 0; i < q.a.length; i++) {

                    let box = document.createElement("div");

                    box.className = "answer-box";

                    let input = document.createElement("input");

                    let btn = document.createElement("button");

                    btn.textContent = "Submit";

                    btn.disabled = true;

                    /* ENABLE BUTTON */
                    input.addEventListener("input", () => {

                        const pos = input.selectionStart;

                        input.value = toSentenceCase(input.value);

                        input.setSelectionRange(pos, pos);

                        btn.disabled = input.value.trim() === "";

                    });

                    /* CHECK ANSWER */
                    btn.onclick = () => {

                        let user = normalize(input.value);

                        // Find an answer that matches and hasn't already been used
                        let matchIndex = q.a.findIndex((ans, idx) =>
                            normalize(ans) === user && !answered[index][idx]
                        );

                        if (matchIndex !== -1) {

                            answered[index][matchIndex] = true;

                            input.readOnly = true;
                            input.value = q.a[matchIndex];   // Show correct capitalization
                            input.classList.add("correct");
                            btn.disabled = true;

                            confetti({
                                particleCount: 100,
                                spread: 70,
                                origin: { y: 0.6 }
                            });

                            speak("Correct");
                            showPopup(true);

                            let allDone = answered[index].every(v => v);

                            if (allDone) {
                                score++;
                                nextBtn.disabled = false;

                                if (index === questions.length - 1) {
                                    setTimeout(showFinal, 1400);
                                }
                            }

                        } else {

                            speak("Try again");
                            showPopup(false);

                            input.value = "";
                            btn.disabled = true;
                        }
                    };

                    box.appendChild(input);

                    box.appendChild(btn);

                    letters.appendChild(box);

                }

                /* RESTORE */
                let inputs = letters.querySelectorAll("input");

                let buttons = letters.querySelectorAll("button");

                inputs.forEach((inp, i) => {

                    if (answered[index][i]) {

                        inp.value = questions[index].a[i];

                        inp.readOnly = true;

                        inp.classList.add("correct");

                        buttons[i].disabled = true;

                    }

                });

                /* NEXT ENABLE */
                nextBtn.disabled = !answered[index].every(v => v === true);

            }

            /* =========================
               POPUP
            ========================= */

            function showPopup(isCorrect) {

                let popup = document.getElementById("popup");

                popup.className = "popup";

                if (isCorrect) {

                    popup.classList.add("correct-popup");

                    popup.innerHTML = `

<div class="popup-emoji">
👍
</div>

<div class="popup-title">
Good
</div>

<div class="popup-sub">
Correct choice.
</div>

`;

                } else {

                    popup.classList.add("wrong-popup");

                    popup.innerHTML = `

<div class="popup-emoji">
😕
</div>

<div class="popup-title">
Oops
</div>

<div class="popup-sub">
Try again.
</div>

`;

                }

                popup.style.display = "block";

                setTimeout(() => {
                    popup.style.display = "none";
                }, 1400);

            }

            /* =========================
               FINAL POPUP
            ========================= */
            function showFinal() {

                quizEnded = true;

                // Disable Previous button
                prevBtn.disabled = true;
                prevBtn.style.pointerEvents = "none";
                prevBtn.style.cursor = "not-allowed";
                prevBtn.style.opacity = "0.5";

                // Disable Next button
                nextBtn.disabled = true;
                nextBtn.style.pointerEvents = "none";
                nextBtn.style.cursor = "not-allowed";
                nextBtn.style.opacity = "0.5";

                document.getElementById("finalText").innerHTML = `

        <div style="font-size:80px;">🏆</div>

        <div style="font-size:40px; margin-top:10px;">
            Awesome!
        </div>

        <div style="font-size:30px; margin-top:15px;">
            Score: ${score}/${questions.length}
        </div>

    `;

                document.getElementById("finalPopup").style.display = "block";

                confetti({
                    particleCount: 150,
                    spread: 120,
                    origin: { y: 0.6 }
                });
            }
            /* =========================
               NAVIGATION
            ========================= */
            nextBtn.onclick = () => {

                if (quizEnded) return;

                if (index < questions.length - 1) {

                    index++;

                    load();

                }

            };
            prevBtn.onclick = () => {

                if (quizEnded) return;

                if (index > 0) {

                    index--;

                    load();

                }

            };

            /* =========================
               RESTART
            ========================= */
            function restartQuiz() {

                // Reset variables
                index = 0;
                score = 0;
                quizEnded = false;

                answered = questions.map(
                    q => new Array(q.a.length).fill(false)
                );

                // Hide popup
                document.getElementById("finalPopup").style.display = "none";

                // Enable navigation buttons again
                prevBtn.disabled = false;
                prevBtn.style.pointerEvents = "auto";
                prevBtn.style.cursor = "pointer";
                prevBtn.style.opacity = "1";

                nextBtn.disabled = true;
                nextBtn.style.pointerEvents = "auto";
                nextBtn.style.cursor = "pointer";
                nextBtn.style.opacity = "1";

                load();
            }

            /* =========================
               START
            ========================= */

            window.speechSynthesis.onvoiceschanged = () => {

                load();

            };

        </script>

        <script id="codex-viewport-fit">
            (function () {
                if (window.__codexViewportFit) return;
                window.__codexViewportFit = true;

                const hasIframe = Boolean(document.querySelector("iframe"));
                const selectors = [
                    ".main",
                    ".main-container",
                    ".quiz",
                    ".quiz-container",
                    ".quiz-box",
                    ".container",
                    ".stage",
                    ".screen",
                    ".game",
                    ".template",
                    ".quiz-card",
                    ".app"
                ];
                const minScale = 0.62;
                let rafId = 0;

                function setViewportRules() {
                    document.documentElement.style.width = "100%";
                    document.documentElement.style.height = "100%";
                    document.documentElement.style.overflow = "hidden";
                    document.body.style.width = "100%";
                    document.body.style.height = "100svh";
                    document.body.style.minHeight = "100svh";
                    document.body.style.overflow = "hidden";
                }

                function getStage() {
                    for (const selector of selectors) {
                        const stage = document.querySelector(selector);
                        if (stage) return stage;
                    }
                    return null;
                }

                function fitToViewport() {
                    setViewportRules();
                    if (hasIframe) return;

                    const stage = getStage();
                    if (!stage) return;

                    stage.style.transform = "scale(1)";
                    stage.style.transformOrigin = "center center";

                    const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                    const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                    const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                    const rect = stage.getBoundingClientRect();
                    const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                    const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                    const scale = Math.max(
                        minScale,
                        Math.min(
                            1,
                            (viewportWidth - breathingRoom * 2) / contentWidth,
                            (viewportHeight - breathingRoom * 2) / contentHeight
                        )
                    );

                    stage.style.transform = `scale(${scale})`;
                }

                function requestFit() {
                    cancelAnimationFrame(rafId);
                    rafId = requestAnimationFrame(fitToViewport);
                }

                window.addEventListener("load", requestFit);
                window.addEventListener("resize", requestFit);
                window.addEventListener("orientationchange", requestFit);

                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(requestFit).catch(function () { });
                }

                document.querySelectorAll("img").forEach(function (img) {
                    img.addEventListener("load", requestFit, { once: false });
                });

                if ("ResizeObserver" in window) {
                    const observer = new ResizeObserver(requestFit);
                    const observeStage = function () {
                        const stage = getStage();
                        if (stage) observer.observe(stage);
                    };
                    observeStage();
                    window.addEventListener("load", observeStage);
                }

                if (document.body) {
                    new MutationObserver(requestFit).observe(document.body, {
                        childList: true,
                        subtree: true,
                        characterData: true
                    });
                }

                requestFit();
            })();
        </script>
