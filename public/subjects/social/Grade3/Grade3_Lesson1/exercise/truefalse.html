<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>True False Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Livvic',sans-serif;
font-weight:normal;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:10px;
overflow:hidden;

}

/* MAIN */
.quiz-container{
width:100%;
max-width:1400px;
display:flex;
flex-direction:column;
align-items:center;
}
/* QUESTION */
.question{
max-width:1200px;
width:100%;
margin-top: -20px;
display:flex;
align-items:center;
justify-content:center;

padding:0 20px;

font-size:30px;
line-height:1.2;

color:#2f4f4f;

text-align:left;

/* ✅ FIXED HEIGHT */
height:80px;

overflow:hidden;
}

/* IMAGE */
.image{
display:flex;
justify-content:center;
width:100%;
margin-bottom:20px;
}

.image img{
width:100%;
max-width:400px;
height:200px;
object-fit:contain;
}

/* OPTIONS */
.options{
display:flex;
justify-content:center;
gap:45px;
flex-wrap:wrap;
width:100%;
}

/* PLAYFUL CARD */
.card{
position:relative;

width:180px;
height:150px;

border-radius:35px;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

cursor:pointer;

transition:0.3s;

overflow:hidden;

border:5px solid white;

box-shadow:
0 10px 22px rgba(0,0,0,0.12);
}

/* TRUE */
/* 🌟 TRUE CARD */
/* ✅ TRUE CARD */
.true-card{

background:#52b788;

box-shadow:
0 10px 0 #40916c,
0 18px 25px rgba(0,0,0,0.15);

}

/* ✅ FALSE CARD */
.false-card{

background:#ff8fa3;

box-shadow:
0 10px 0 #e85d75,
0 18px 25px rgba(0,0,0,0.15);

}

/* TEXT */
.true-card,
.false-card{
color:white;
font-weight:700;
}
/* TEXT */
.true-card .label,
.false-card .label{
color:white;
text-shadow:0 2px 4px rgba(0,0,0,0.15);
}

/* ICON */
.true-card .icon,
.false-card .icon{
filter:drop-shadow(0 3px 5px rgba(0,0,0,0.2));
}

/* ICON */
.icon{
font-size:65px;
margin-bottom:12px;
}

/* TEXT */
.label{
font-size:34px;
color:#2f4f4f;
}

/* CORRECT */
.correct-answer{
border:3px solid #38b000;
box-shadow:
0 0 30px #38b000;
}

/* WRONG */
.wrong-answer{
border:3px solid #d00000;
box-shadow:
0 0 25px #ff4d4d;
}

/* NAV */
.nav-buttons{
position:absolute;
top:58%;
left:0;
width:100%;
transform:translateY(-50%);
pointer-events:none;
}

/* PREV */
.prev{
position:absolute;
left:10px;
pointer-events:auto;
background:#7bcb9f;
}

/* NEXT */
.next{
position:absolute;
right:10px;
pointer-events:auto;
background:#f28f76;
}

/* BUTTON */
button{

    width:130px;
    height:50px;


border:none;
border-radius:40px;
font-size:20px;
cursor:pointer;
transition:0.3s;
color: #ffffff;
}

button:hover:not(:disabled){
transform:scale(1.08);
}

button:disabled{
background:#cccccc;
cursor:not-allowed;
}

/* POPUP */
.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0.5);
width:350px;
max-width:85%;
padding:35px 25px;
border-radius:40px;
display:none;
z-index:9999;
text-align:center;
animation:popupAnim 0.35s forwards;
box-shadow:0 12px 35px rgba(0,0,0,0.15);
}

/* ANIMATION */
@keyframes popupAnim{
to{
transform:translate(-50%,-50%) scale(1);
}
}

/* CORRECT POPUP */
.correct-popup{
background:#dff4ef;
border:4px solid #35d0a5;
}

/* WRONG POPUP */
.wrong-popup{
background:#ffe3e3;
border:4px solid #ff6b6b;
}

/* FINAL POPUP */
.final-popup{
background:linear-gradient(135deg,#fff1b6,#ffe066);
border:4px solid #ffbe0b;
box-shadow:0 0 40px #ffbe0b;

}

/* POPUP EMOJI */
.popup-emoji{
font-size:75px;
margin-bottom:15px;
}

/* TITLE */
.popup-title{
font-size:42px;
margin-bottom:10px;
}

/* SUBTITLE */
.popup-sub{
font-size:24px;
}
.play-btn{
    margin:25px auto 0;

    width:240px;
    height:64px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;

    border:none;
    border-radius:40px;

    background:linear-gradient(135deg,#06d6a0,#1b9aaa);

    color:#fff;
    font-size:20px;
    font-weight:600;

    white-space:nowrap;
    cursor:pointer;
}
/* MOBILE */
@media(max-width:768px){

body{
overflow:auto;
}

.question{
font-size:22px;
text-align:left;
}

.image img{
max-width:320px;
height:180px;
}

.options{
gap:20px;
}

.card{
width:140px;
height:140px;
border-radius:25px;
}

.icon{
font-size:45px;
}

.label{
font-size:24px;
}

.nav-buttons{
position:static;
transform:none;
display:flex;
justify-content:center;
gap:20px;
margin-top:25px;
pointer-events:auto;
}

.prev,
.next{
position:static;
}

button{
font-size:18px;
padding:10px 18px;
}

.popup{

width:220px;

padding:18px 14px;

border-radius:22px;

}

.popup-emoji{

font-size:42px;

margin-bottom:8px;

}

.popup-title{

font-size:24px;

margin-bottom:4px;

}

.popup-sub{

font-size:14px;

}

.final-popup{

padding:25px 18px;

}

.play-btn{

font-size:14px;

padding:10px 18px;

margin-top:15px;

}

}
/* ================= MONITOR ================= */

@media screen and (min-width:1101px) and (max-width:1200px){

.quiz-container{

max-width:1600px;

padding:20px;

}

/* QUESTION */
.question{

font-size:38px;

max-width:1300px;

height:110px;

line-height:1.5;

}

/* IMAGE */
.image img{

max-width:650px;

height:320px;

}

/* OPTIONS */
.options{

gap:55px;

margin-top:10px;

}

/* CARD */
.card{

width:240px;

height:210px;

border-radius:40px;

}

/* ICON */
.icon{

font-size:90px;

margin-bottom:16px;

}

/* LABEL */
.label{

font-size:42px;

}

/* NAV BUTTON */
button{

font-size:24px;

padding:16px 34px;

}


}

/* ================= LARGE MONITOR ================= */

@media screen and (min-width:1600px){

.quiz-container{

max-width:2200px;

padding:30px;

}

/* QUESTION */

max-width:1800px;

height:90px;

line-height:1.3;

}

/* IMAGE */

}

/* OPTIONS */

gap:80px;


}

/* CARD */

}

/* ICON */

}

/* LABEL */

}

/* NAV BUTTON */
button{

 width: 200px;
 height: 80px;


}

/* POPUP */
.popup{

padding:55px 40px;

border-radius:50px;

}

/* POPUP EMOJI */
.popup-emoji{

margin-bottom:20px;

}

/* POPUP TITLE */
.popup-title{

}

/* POPUP SUBTITLE */
.popup-sub{

}

/* FINAL POPUP */
.final-popup{

padding:80px 60px;

}
.play-btn{
    margin:25px auto 0;

    width:260px;
    height:74px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;

    border:none;
    border-radius:40px;

    background:linear-gradient(135deg,#06d6a0,#1b9aaa);

    color:#fff;
    font-size:25px;

    white-space:nowrap;
    cursor:pointer;
}

}

@media screen and (min-width:1921px){
   
/* QUESTION */
.question{

font-size:40px;

max-width:1500px;

height:110px;

}

/* BUTTON */
button{

min-width:250px;
height:85px;

}
}

</style>
<style id="codex-responsive-shell">

    width: 100%;
    height: 100%;
    overflow: hidden;

    max-width: 100%;
    overflow: hidden;

svg,
canvas,
video {

    }

<body>

<div class="quiz-container">

<!-- QUESTION -->
<div class="question" id="question"></div>

<!-- IMAGE -->
<div class="image">
<img id="img">
</div>

<!-- OPTIONS -->
<div class="options">

<div class="card true-card" onclick="selectAnswer('T')">

<div class="icon">
🌟
</div>

<div class="label">
TRUE
</div>

</div>

<div class="card false-card" onclick="selectAnswer('F')">

<div class="icon">
☁️
</div>

<div class="label">
FALSE
</div>

</div>

</div>

<!-- NAV -->
<div class="nav-buttons">

<button class="prev" onclick="prevQuestion()">
← Prev
</button>

<button class="next" id="nextBtn" onclick="nextQuestion()" disabled>
Next →
</button>

</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup"></div>

<!-- FINAL -->
<div class="popup final-popup" id="finalPopup">

<div id="finalText"></div>

<button class="play-btn" onclick="restartQuiz()">
🔄 Play Again
</button>

</div>

<script>

/* =========================
   UK SPEECH
========================= */
function speak(text){

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang="en-UK";

speech.rate=1;

speech.pitch=1;

speech.volume=0.25;

speechSynthesis.speak(speech);

}

/* =========================
   QUESTIONS
========================= */
let questions=[

{
q:"Q1. Uranus is the sixth planet from the Sun.",

img:"../images/tf1.png",

correct:"F"
},

{
q:"Q2. There are two types of satellites.",

img:"../images/tf2.png",

correct:"T"
},

{
q:"Q3. The Moon is the only natural satellite of the Earth.",

img:"../images/tf33.png",

correct:"T"
},

{
q:"Q4. Natural satellites are objects made and launched by man from the Earth to the space.",

img:"../images/tf4.png",

correct:"F"
},

{
q:"Q5. The stars are huge heavenly bodies that are smaller than the Earth.",

img:"../images/tf5.png",

correct:"F"
}

];
/* =========================
   VARIABLES
========================= */

let current=0;

let score=0;

let answers=new Array(questions.length).fill(null);
let quizEnded = false;
const nextBtn=document.getElementById("nextBtn");

/* =========================
   LOAD QUESTION
========================= */

function loadQ(){

let q=questions[current];

document.getElementById("question").innerText=q.q;

document.getElementById("img").src=q.img;

let cards=document.querySelectorAll(".card");

cards.forEach(card=>{

card.classList.remove(
"correct-answer",
"wrong-answer"
);

card.style.pointerEvents="auto";

});

/* RESTORE */
if(answers[current]!==null){

cards.forEach(card=>{

if(card.onclick.toString().includes(answers[current])){

card.classList.add("correct-answer");

}

});

cards.forEach(card=>{
card.style.pointerEvents="none";
});

nextBtn.disabled=false;

}else{

nextBtn.disabled=true;

}

}

/* =========================
   POPUP
========================= */

function showPopup(isCorrect){

let popup=document.getElementById("popup");

popup.className="popup";

if(isCorrect){

popup.classList.add("correct-popup");

popup.innerHTML=`

<div class="popup-emoji">
👍
</div>

<div class="popup-title">
Good
</div>

<div class="popup-sub">
Correct choice.
</div>

`;

}else{

popup.classList.add("wrong-popup");

popup.innerHTML=`

<div class="popup-emoji">
😕
</div>

<div class="popup-title">
Oops
</div>

<div class="popup-sub">
Try again.
</div>

`;

}

popup.style.display="block";

setTimeout(()=>{
popup.style.display="none";
},1400);

}

/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(choice){

if(answers[current]!==null) return;

let correct=questions[current].correct;

let cards=document.querySelectorAll(".card");

/* CORRECT */
if(choice===correct){

confetti({
particleCount:120,
spread:80,
origin:{y:0.6}
});

answers[current]=choice;

score++;

cards.forEach(card=>{

if(card.onclick.toString().includes(choice)){

card.classList.add("correct-answer");

}

});

cards.forEach(card=>{
card.style.pointerEvents="none";
});

showPopup(true);

speak("Correct");

nextBtn.disabled=false;

/* FINAL */
if(current===questions.length-1){

setTimeout(()=>{
showFinal();
},1200);

}

}

/* WRONG */
else{

cards.forEach(card=>{

if(card.onclick.toString().includes(choice)){

card.classList.add("wrong-answer");

}

});

showPopup(false);

speak("Try again");

nextBtn.disabled=true;

}

}

/* =========================
   NEXT
========================= */
function nextQuestion(){

    if(quizEnded) return;

    if(current < questions.length-1){

        current++;

        loadQ();

    }

}

/* =========================
   PREV
========================= */
function prevQuestion(){

    if(quizEnded) return;

    if(current > 0){

        current--;

        loadQ();

    }

}

/* =========================
   FINAL
========================= */
function showFinal(){

    quizEnded = true;

    // Disable Previous button
    const prevBtn = document.querySelector(".prev");
    prevBtn.disabled = true;
    prevBtn.style.pointerEvents = "none";
    prevBtn.style.cursor = "not-allowed";
    prevBtn.style.opacity = "0.5";

    // Disable Next button
    const nextBtn = document.querySelector(".next");
    nextBtn.disabled = true;
    nextBtn.style.pointerEvents = "none";
    nextBtn.style.cursor = "not-allowed";
    nextBtn.style.opacity = "0.5";

    document.getElementById("finalText").innerHTML = `
        <div style="font-size:80px;">🏆</div>

        <div style="font-size:40px; margin-top:10px;">
            Awesome!
        </div>

        <div style="font-size:30px; margin-top:15px;">
            Score: ${score}/${questions.length}
        </div>
    `;

    document.getElementById("finalPopup").style.display = "block";

    confetti({
        particleCount:150,
        spread:120,
        origin:{y:0.6}
    });
}

/* =========================
   RESTART
========================= */
function restartQuiz(){

    // Reset variables
    current = 0;
    score = 0;
    quizEnded = false;
    answers = new Array(questions.length).fill(null);

    // Hide popup
    document.getElementById("finalPopup").style.display = "none";

    // Enable Previous button
    const prevBtn = document.querySelector(".prev");
    prevBtn.disabled = true;
    prevBtn.style.pointerEvents = "auto";
    prevBtn.style.cursor = "pointer";
    prevBtn.style.opacity = "1";

    // Enable Next button
    const nextBtn = document.querySelector(".next");
    nextBtn.disabled = true;
    nextBtn.style.pointerEvents = "auto";
    nextBtn.style.cursor = "pointer";
    nextBtn.style.opacity = "1";

    speechSynthesis.cancel();

    loadQ();
}

/* =========================
   START
========================= */

window.speechSynthesis.onvoiceschanged=()=>{

loadQ();

};

</script>

<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
</body>
