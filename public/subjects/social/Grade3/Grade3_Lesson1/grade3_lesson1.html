<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Assessments</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Livvic';
}

/* ================= BODY ================= */

body{

height:100vh;

background:
linear-gradient(135deg,#f8eedc,#e7f4ff);

display:flex;
flex-direction:column;

overflow:hidden;
}

/* ================= FRAME ================= */

.frame{

flex:1;

display:flex;
flex-direction:column;

width:100%;
max-width:1400px;

margin:auto;

position:relative;
}

/* ================= MENU BUTTON ================= */

.menu-btn{

display:none;

position:absolute;

top:12px;
right:18px;

width:52px;
height:52px;

border:none;

border-radius:18px;

cursor:pointer;

font-size:24px;

color:white;

z-index:1000;

background:
linear-gradient(
135deg,
#7b2cbf,
#5a189a
);

box-shadow:
0 8px 18px rgba(90,24,154,.35);

transition:.3s;
}

.menu-btn:hover{

transform:
scale(1.08)
rotate(5deg);
}

/* ================= NAVBAR ================= */

.top-nav{

display:flex;
justify-content:center;

gap:20px;

flex-wrap:wrap;

padding:14px 0;
}
.nav-btn{

position:relative;

padding:18px 30px;

display:flex;
align-items:center;
gap:20px;

font-size:20px;
font-weight:600;

cursor:pointer;

border-radius:22px;

background:#EEF4F1;          /* Single disabled/default color */

border:3px solid #C8D8CF;

color:#2F4F4F;

box-shadow:
0 6px 15px rgba(0,0,0,.08);

transition:.3s;

}

/* SHINE EFFECT */
.nav-btn.active{

background:#DDEEFF;          /* Active color */

border:3px solid #7EAEDB;

color:#23425E;

transform:
translateY(-3px)
scale(1.03);

box-shadow:
0 10px 20px rgba(126,174,219,.25);

}
/* ================= BUTTON COLORS ================= */


/* ================= ICON ================= */
.icon{

width:34px;
height:34px;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;

background:#FFFFFF;

color:#5A6E7F;

font-size:15px;

box-shadow:0 3px 8px rgba(0,0,0,.08);

}
/* ACTIVE ICON */
.nav-btn.active .icon{

background:#FFFFFF;

color:#2E6FA8;

transform:scale(1.08);

box-shadow:0 0 8px rgba(126,174,219,.25);

}

.nav-btn.active::after{

content:"";

position:absolute;

inset:0;

border-radius:22px;

padding:2px;

background:
linear-gradient(
135deg,
rgba(255,255,255,.9),
rgba(255,255,255,.2)
);

-webkit-mask-composite:xor;

mask-composite:exclude;

pointer-events:none;

}

/* ================= CONTENT ================= */

.content{

flex:1;

display:flex;

border-radius:28px;

overflow:hidden;

}

/* ================= IFRAME ================= */

iframe{

flex:1;

width:100%;
height:100%;

border:none;

}

/* ================= TABLET + MOBILE ================= */

@media(max-width:1100px){

.menu-btn{
display:block;
}

/* MENU */

.top-nav{

display:none;

flex-direction:column;

position:absolute;

top:75px;
right:15px;

background:
rgba(255,255,255,.96);

backdrop-filter:blur(12px);

padding:16px;

border-radius:24px;

box-shadow:
0 15px 35px rgba(0,0,0,.22);

gap:14px;

z-index:999;
}

.top-nav.show{
display:flex;
}

/* BUTTON */

.nav-btn{

width:240px;

justify-content:flex-start;

font-size:20px;

padding:13px 22px;
}

}

/* ================= MOBILE ================= */

@media(max-width:768px){

body{
background:
linear-gradient(135deg,#f8eedc,#e7f4ff);
}

/* MENU */

.top-nav{

top:70px;
right:10px;
}

/* BUTTON */

.nav-btn{

width:220px;

font-size:15px;

padding:12px 20px;
}

/* ICON */

.icon{

width:28px;
height:28px;

font-size:13px;
}

.content{

border-radius:20px;
}

}

/* ================= LARGE SCREEN ================= */

@media screen and (min-width:1225px) and (max-width:1640px){

.frame{
max-width:1350px;
}

.top-nav{
gap:15px;
}

.nav-btn{
font-size:20px;
padding:15px 28px;
}

.icon{
width:35px;
height:35px;
font-size:20px;
}

}

/* ================= EXTRA LARGE ================= */

@media screen and (min-width:1641px){

.frame{
max-width:1500px;
}

.top-nav{
gap:26px;
}

.nav-btn{
font-size:20px;
padding:16px 32px;
}

.icon{
width:36px;
height:36px;
font-size:17px;
}

}
/* ================= LARGE MONITOR ================= */

@media screen and (min-width:1600px){

body{
padding:20px;
}

.frame{

max-width:1700px;

height:100vh;

}

/* NAVBAR */

.top-nav{

gap:28px;

padding:22px 0;

}

/* BUTTON */

.nav-btn{

font-size:25px;

padding:20px 38px;

border-radius:26px;

gap:22px;

}

/* ICON */

.icon{

width:50px;
height:50px;

font-size:25px;

}

/* CONTENT */

.content{

border-radius:34px;

}

}

/* ================= EXTRA LARGE MONITOR ================= */

@media screen and (min-width:2200px){

body{
padding:30px;
}

.frame{

max-width:2100px;

height:96vh;

}

/* NAVBAR */

.top-nav{

gap:40px;

padding:28px 0;

}

/* BUTTON */

.nav-btn{

font-size:28px;

padding:24px 46px;

border-radius:30px;

gap:26px;

}

/* ICON */

.icon{

width:52px;
height:52px;

font-size:22px;

}

/* CONTENT */

.content{

border-radius:40px;

}

/* MENU BUTTON */

.menu-btn{

width:70px;
height:70px;

font-size:30px;

border-radius:24px;

}

}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.25);
  display:none;
  z-index:998;
}

.overlay.show{
  display:block;
}
@media(min-width:1101px){

  .overlay{
    display:none !important;
  }

}
</style>
<style id="codex-responsive-shell">
html {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    max-width: 100%;
    overflow: hidden;
}

img,
svg,
canvas,
video {
    max-width: 100%;
}

iframe {
    display: block;
    max-width: 100%;
}

body:has(iframe) {
    width: 100%;
    height: 100svh;
    min-height: 100svh;
    overflow: hidden;
}

body:has(iframe) .app,
body:has(iframe) .frame,
body:has(iframe) .board {
    max-width: 100%;
    max-height: 100svh;
    min-height: 0;
}

body:has(iframe) .app {
    height: 100svh;
}

body:has(iframe) .board {
    width: min(1250px, calc(100vw - 16px));
    height: min(570px, calc(100svh - 16px));
}

body:has(iframe) .content,
body:has(iframe) .main,
body:has(iframe) .screen,
body:has(iframe) .iframe-wrapper {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

body:has(iframe) iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

@media (min-width: 1025px) {
    body:has(iframe) .sidebar {
        width: clamp(190px, 17vw, 300px);
        min-width: 0;
        min-height: 0;
    }

    body:has(iframe) .topbar,
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .nav-group {
        flex-shrink: 0;
    }

    body:has(iframe) .nav-container,
    body:has(iframe) .nav-wrapper,
    body:has(iframe) .sidebar-scroll,
    body:has(iframe) .menu {
        max-height: 100svh;
        overflow: hidden;
    }

    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(10px, 2.8vw, 44px);
        padding: clamp(6px, 1.4dvh, 14px) clamp(8px, 1.4vw, 20px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        min-height: 0;
        max-width: 100%;
    }
}

@media (min-width: 1025px) and (max-height: 760px) {
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(8px, 2vw, 24px);
        padding-block: clamp(4px, 1dvh, 10px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        padding: clamp(8px, 1.4dvh, 14px) clamp(10px, 1.4vw, 22px);
        font-size: clamp(15px, 1.2vw, 20px);
    }

    body:has(iframe) .puzzle {
        width: clamp(150px, 14vw, 210px);
        height: clamp(54px, 8dvh, 70px);
    }

    body:has(iframe) .sidebar {
        width: clamp(190px, 16vw, 240px);
    }
}
</style>
</head>

<body>

<div class="frame">

<!-- MENU BUTTON -->

<button class="menu-btn"
onclick="toggleMenu()">
☰
</button>

<!-- NAVBAR -->

<div class="top-nav"
id="navbar">

<!-- CHOOSE OPTION -->

<button class="nav-btn mcq active"
onclick="openPage('./exercise/mcq.html',this)">

<span class="icon">
<i class="fa-solid fa-file-circle-check"></i>
</span>

Choose option

</button>


<button class="nav-btn fill"
onclick="openPage('./exercise/fillintheblanks.html',this)">

<span class="icon">
<i class="fa-solid fa-pencil"></i>
</span>

Fill In The Blanks

</button>
<!-- FILL BLANKS ACTIVE -->

<button class="nav-btn word"
onclick="openPage('./exercise/truefalse.html',this)">

<span class="icon">
<i class="fa-solid fa-clone"></i>
</span>


True/False

</button>


<button class="nav-btn true"
onclick="openPage('./exercise/oneword.html',this)">

<span class="icon">
<i class="fa-solid fa-image"></i>
</span>

One Word

</button>

<!-- MATCHING -->

<button class="nav-btn match"
onclick="openPage('./exercise/matching.html',this)">

<span class="icon">
<i class="fa-solid fa-link"></i>
</span>

Matching

</button>

<!-- ONE WORD -->



</button>

</div>

<!-- CONTENT -->

<div class="content">

<iframe
id="viewer"
src="./exercise/mcq.html">
</iframe>

</div>

</div>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<script>

/* ================= OPEN PAGE ================= */

function openPage(page,btn){

document
.getElementById("viewer")
.src = page;

/* REMOVE ACTIVE */

document
.querySelectorAll(".nav-btn")
.forEach(b=>{

b.classList.remove("active");

});

/* ADD ACTIVE */

btn.classList.add("active");

/* CLOSE MOBILE MENU */
document
.getElementById("navbar")
.classList.remove("show");
}
function closeMenu(){

  document.getElementById("navbar")
    .classList.remove("show");

  document.getElementById("overlay")
    .classList.remove("show");

}
/* ================= TOGGLE MENU ================= */
function toggleMenu(){

  const menu = document.getElementById("navbar");
  const overlay = document.getElementById("overlay");

  menu.classList.toggle("show");
  overlay.classList.toggle("show");

}
</script>

<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
</body>
</html>
