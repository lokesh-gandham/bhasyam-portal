<!DOCTYPE html>
<html lang="en">

<head>
    <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Assessments</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            padding-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MAIN */
        .main {

            width: 100%;
            max-width: 1300px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 10px;

            padding: 20px;
        }

        /* QUESTION */
        .question-text {
            max-width: 1200px;
            width: fit-content;
            margin-inline: auto;

            font-size: 30px;
            line-height: 1.3;

            text-align: left;

            display: block;

            height: auto;
            min-height: 80px;

            overflow: visible;

            margin-top: 5px;
            padding: 0 20px;

            color: #2f4f4f;
        }

        .word-gap {
            width: 20px;
            /* Increase or decrease this value */
            flex-shrink: 0;
        }

        /* IMAGE */
        .image img {

            width: 280px;
            height: 160px;

            object-fit: contain;

            margin-top: -20px;

            animation: floatImage 2.5s ease-in-out infinite;
        }


        /* SLOT CONTAINER */
        .slot-container {

            position: relative;

            display: flex;
            justify-content: center;

            gap: 12px;

            padding: 16px 20px;

            border-radius: 30px;

            overflow: hidden;

            background:
                linear-gradient(135deg,
                    #d0ebff,
                    #caf0f8);


        }

        /* PROGRESS */
        .progress-fill {

            position: absolute;

            top: 0;
            left: 0;

            height: 100%;
            width: 0%;

            /* ✅ LIGHT UNIQUE COLOR */
            background:
                linear-gradient(135deg,
                    #cdb4db,
                    #bde0fe,
                    #a2d2ff);

            transition: .3s;

            border-radius: 30px;

            z-index: 0;
        }

        /* SLOT */
        .slot {

            width: 50px;
            height: 50px;

            border-radius: 18px;

            border: 3px dashed #74c0fc;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 26px;
            font-weight: 700;

            position: relative;

            z-index: 2;

        }

        /* CORRECT */
        .slot.correct {

            background: #caffbf;

            border: 3px solid #00c853;
        }

        /* WRONG */
        .slot.wrong {

            background: #ffccd5;

            border: 3px solid #d90429;
        }

        /* LETTERS */
        .pool {

            display: flex;
            flex-wrap: wrap;
            justify-content: center;

            gap: 14px;

            max-width: 1200px;
            margin-top: 10px;
        }

        /* LETTER */
        /* LETTER */
        .letter {

            width: 55px;
            height: 55px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
            font-weight: 600;

            cursor: pointer;

            transition: .25s;

            /* ✅ NEW UNIQUE ONE COLOR */
            background:
                linear-gradient(135deg,
                    #c39af5,
                    #a063d6);

            color: white;

            border: 3px solid #ffffff;

            /* ✅ NEW SHADOW */
            box-shadow:
                0 6px 0 #8b4dc9;
            margin-top: -10px;
        }

        /* USED */
        .letter.used {

            opacity: .3;

            pointer-events: none;
        }

        /* HOVER */
        .letter:hover {

            transform:
                translateY(-5px) scale(1.05);
        }

        /* NAVIGATION */
        .nav-wrapper {

            position: absolute;

            bottom: 0px;
            left: 0;

            width: 100%;

            padding: 0 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            z-index: 100;
        }

        /* NAV BUTTON */
        .nav-btn {


            min-width: 130px;
            height: 50px;

            border: none;

            border-radius: 50px;

            font-size: 20px;

            cursor: pointer;

            color: #fff;

            transition: .25s;
        }

        /* PREV */
        .prev-btn {

            background:
                linear-gradient(135deg,
                    #43aa8b,
                    #90d7b8);

        }

        /* NEXT */
        .next-btn {

            background:
                linear-gradient(135deg,
                    #ff7b7b,
                    #ffb4a2);

        }

        /* DISABLED */
        .nav-btn:disabled {

            background: #cccccc;

            cursor: not-allowed;
        }

        /* POPUP */
        .popup {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%) scale(0.5);

            width: 380px;

            padding: 30px 20px;

            border-radius: 45px;

            display: none;

            z-index: 9999;

            text-align: center;

            animation: popupAnim 0.35s forwards;

            border: 4px solid white;
        }

        /* CORRECT */
        .correct-popup {

            background:
                linear-gradient(135deg,
                    #caffbf,
                    #a0f4c3);
        }

        /* WRONG */
        .wrong-popup {

            background:
                linear-gradient(135deg,
                    #ffcad4,
                    #ffafcc);
        }

        /* FINAL */
        .final-popup {

            background:
                linear-gradient(135deg,
                    #fff1b6,
                    #ffe066);
        }

        /* POPUP ANIMATION */
        @keyframes popupAnim {

            to {
                transform:
                    translate(-50%, -50%) scale(1);
            }

        }

        /* EMOJI */
        .popup-emoji {

            font-size: 85px;

            margin-bottom: 18px;
        }

        /* TITLE */
        .popup-title {

            font-size: 42px;

            margin-bottom: 12px;

            color: #222;
        }

        /* SUB */
        .popup-sub {

            font-size: 26px;

            color: #333;
        }

        /* PLAY AGAIN */
        .play-btn {

            margin-top: 28px;

            padding: 15px 28px;

            border: none;

            border-radius: 40px;

            font-size: 20px;

            cursor: pointer;

            background:
                linear-gradient(135deg,
                    #06d6a0,
                    #1b9aaa);

            color: white;
        }

        /* MOBILE */
        /* ================= MOBILE ================= */

        @media screen and (max-width:768px) {

            body {

                overflow: hidden;


                padding: 16px 0;

            }

            /* MAIN */
            .main {

                max-width: 100%;

                gap: 10px;

            }

            /* MOBILE QUESTION AREA */
            .question-area {

                min-height: 100vh;

            /* MOBILE QUESTION */

            /* IMAGE */

            /* SLOT CONTAINER */

            /* SLOT */

            /* BUTTON */

            /* POPUP */

        /* ================= SMALL MOBILE ================= */

        @media screen and (max-width:390px) {

            /* QUESTION */

            /* SLOT CONTAINER */

            /* LETTER POOL */

            /* LETTER */

            /* NAVIGATION */

            /* BUTTON */

            }

            /* POPUP */

            }

            /* EMOJI */

            }

        }

        /* ================= TABLET ================= */

        @media screen and (min-width:769px) and (max-width:800px) {

            /* MAIN */
            .main {

                max-width: 100%;

                padding: 24px 20px 90px;

                gap: 20px;

            }

            /* QUESTION */
            .question-text {

                font-size: 25px;

                line-height: 1.5;

                height: auto;

                margin-top: -30px;

            }

            /* IMAGE */

            }

            /* SLOT CONTAINER */

            /* LETTER POOL */

            }

            /* LETTER */

            }

            /* NAVIGATION */
            .nav-wrapper {

                padding: 0 20px;

                bottom: 10px;

            }

            /* BUTTON */

            }

            /* POPUP */

                width: 320px;

                padding: 28px 22px;

            }

            /* EMOJI */

            }

            /* TITLE */

                font-size: 38px;

            }

            /* SUBTITLE */

        @media screen and (min-width:900px) and (max-width:1000px) {
            body {
                align-items: flex-start;
            }

            }
        }

        @media screen and (min-width:1001px) {

            }
        }




        /* ================= LARGE MONITOR ================= */

        @media screen and (min-width:1441px) and (max-width:1600px) {
            /* MAIN */
            .main {

                max-width: 2200px;

                padding: 45px;

            /* QUESTION */
            .question-text {

                max-width: 1900px;

            }

            /* IMAGE */

            }

            /* SLOT CONTAINER */

            }

            /* LETTER */

            }

            /* NAVIGATION */

            }

            /* BUTTON */

            /* POPUP */

        /* ================= EXTRA LARGE / 4K ================= */

        @media screen and (min-width:1921px) {

            /* MAIN */

            /* QUESTION */
            .question-text {

<body>

    <div class="main">

        <!-- QUESTION -->
        <div class="question-text" id="questionText"></div>

        <!-- IMAGE -->
        <div class="image">
            <img id="questionImage">
        </div>

        <!-- SLOTS -->
        <div class="slot-container" id="slots">

            <div class="progress-fill" id="progressFill"></div>

        </div>

        <!-- LETTERS -->
        <div class="pool" id="pool"></div>

        <!-- NAV -->
        <div class="nav-wrapper">

            <button class="nav-btn prev-btn" id="prevBtn" disabled onclick="prevQ()">
                ← Prev
            </button>

            <button class="nav-btn next-btn" id="nextBtn" disabled onclick="nextQ()">
                Next →
            </button>

        </div>

    </div>

    <!-- CORRECT -->
    <div id="correctPopup" class="popup correct-popup">

        <div class="popup-emoji">
            😊
        </div>

        <div class="popup-title">
            Great!
        </div>

        <div class="popup-sub">
            Correct Answer
        </div>

    </div>

    <!-- WRONG -->
    <div id="wrongPopup" class="popup wrong-popup">

        <div class="popup-emoji">
            😢
        </div>

        <div class="popup-title">
            Oops!
        </div>

        <div class="popup-sub">
            Wrong Answer
        </div>

    </div>

    <!-- FINAL -->
    <div id="finalPopup" class="popup final-popup">

        <div class="popup-emoji">
            🏆
        </div>

        <div class="popup-title">
            Awesome!
        </div>

        <div class="popup-sub" id="finalText">
        </div>

        <button class="play-btn" onclick="restartQuiz()">
            🔄 Play Again
        </button>

    </div>

    <script>

        /* QUESTIONS */
        const questions = [

            {
                q: "Q1. A map is the representation of the Earth on a _____ surface.",
                a: "flat",
                img: "../images/ftb11.png"
            },

            {
                q: "Q2. Sub-directions are also called _____ directions.",
                a: "intermediate",
                img: "../images/ftb2.png"
            },

            {
                q: "Q3. A compass is an instrument used to locate the _____.",
                a: "directions",
                img: "../images/ftb33.png"
            },

            {
                q: "Q4. _____ Ocean is the second largest ocean in the world.",
                a: "Atlantic",
                img: "../images/ftb4.png"
            },

            {
                q: "Q5. The water bodies on the Earth cover _____ of the Earth’s surface.",
                a: "three-fourth",
                img: "../images/ftb5.png"
            }

        ];

        let index = 0;
        let score = 0;

        let userAnswers =
            new Array(questions.length)
                .fill(null);

        let filledSlots = [];
        let quizEnded = false;
        /* ELEMENTS */
        const questionText =
            document.getElementById("questionText");

        const questionImage =
            document.getElementById("questionImage");

        const slots =
            document.getElementById("slots");

        const pool =
            document.getElementById("pool");

        const nextBtn =
            document.getElementById("nextBtn");

        const prevBtn =
            document.getElementById("prevBtn");

        /* SPEECH */
        function speak(text) {

            window.speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-UK";

            speech.rate = 1;

            speech.pitch = 1;

            speech.volume = 0.25;

            speechSynthesis.speak(speech);

        }

        /* PROGRESS */
        function updateProgress() {

            let slotArr =
                [...document.querySelectorAll(".slot")];

            let filled =
                slotArr.filter(
                    s => s.textContent !== ""
                ).length;

            let percent =
                (filled / slotArr.length) * 100;

            document.getElementById(
                "progressFill"
            ).style.width =
                percent + "%";

        }

        /* LOAD */
        function renderQuestion() {

            let q =
                questions[index];
            questionText.innerHTML = q.q.replaceAll(
                "_____",
                `<span
                style="
                display:inline-block;
                width:80px;
                border-bottom:2px dashed #333;
                position:relative;
                top:5px;
                margin:0 6px;
                "></span>`
            );
            questionImage.src =
                q.img;

            slots.innerHTML =
                '<div class="progress-fill" id="progressFill"></div>';

            pool.innerHTML = "";

            filledSlots = [];

            const answer = q.a.toUpperCase().replace(/-/g, "");
            const parts = q.a.toUpperCase().split("-");

            if (parts.length > 1) {

                // First word
                for (let i = 0; i < parts[0].length; i++) {
                    slots.innerHTML += `<div class="slot"></div>`;
                }

                // Space between words
                slots.innerHTML += `<div class="word-gap"></div>`;

                // Second word
                for (let i = 0; i < parts[1].length; i++) {
                    slots.innerHTML += `<div class="slot"></div>`;
                }

            } else {

                for (let i = 0; i < answer.length; i++) {
                    slots.innerHTML += `<div class="slot"></div>`;
                }

            }

            /* PREV */
            prevBtn.disabled =
                index === 0;

            /* RESTORE */
            if (userAnswers[index]) {

                let slotArr =
                    [...document.querySelectorAll(".slot")];
                userAnswers[index]
                    .word
                    .toUpperCase()
                    .split("")
                    .forEach((l, i) => {

                        slotArr[i].textContent = l;

                        slotArr[i].classList.add("correct");

                    });

                nextBtn.disabled = false;

            } else {

                nextBtn.disabled = true;

                let letters =
                    answer
                        .split("")
                        .sort(() => Math.random() - 0.5);

                letters.forEach(letter => {

                    pool.innerHTML +=

                        `
<div class="letter"
onclick="selectLetter(this)">
${letter}
</div>
`;

                });

            }

            updateProgress();

        }

        /* START */
        renderQuestion();

        /* SELECT LETTER */
        function selectLetter(el) {

            if (el.classList.contains("used"))
                return;

            let slotArr =
                [...document.querySelectorAll(".slot")];

            let empty = slotArr.find(
                s => s.textContent === "" && !s.classList.contains("hyphen-slot")
            );

            if (!empty)
                return;

            empty.textContent = el.textContent;

            filledSlots.push({
                slot: empty,
                letter: el
            });

            el.classList.add("used");

            // Mobile Backspace
            empty.onclick = function () {

                if (userAnswers[index]) return;

                this.textContent = "";

                this.classList.remove("correct", "wrong");

                let item = filledSlots.find(
                    x => x.slot === this
                );

                if (item) {

                    item.letter.classList.remove("used");

                    filledSlots =
                        filledSlots.filter(
                            x => x.slot !== this
                        );

                }

                updateProgress();

            };

            updateProgress();

            checkAnswer();

        }
        document.addEventListener(
            "keydown",
            function (e) {

                if (e.key !== "Backspace")
                    return;

                if (userAnswers[index])
                    return;

                if (filledSlots.length === 0)
                    return;

                let last =
                    filledSlots.pop();

                last.slot.textContent = "";

                last.slot.classList.remove(
                    "wrong",
                    "correct"
                );

                last.letter.classList.remove(
                    "used"
                );

                updateProgress();

            });

        /* POPUP */
        function showPopup(id) {

            const popup =
                document.getElementById(id);

            popup.style.display = "block";

            setTimeout(() => {

                popup.style.display = "none";

            }, 1200);

        }

        /* CHECK */
        function checkAnswer() {

            let slotArr =
                [...document.querySelectorAll(".slot")];
            let enteredWord =
                slotArr
                    .map(s => s.textContent)
                    .join("")
                    .replace(/[\s-]/g, "");

            let word =
                enteredWord.toLowerCase();

            let correct =
                questions[index]
                    .a
                    .toLowerCase()
                    .replace(/-/g, "");

            /* AUTO CHECK */
            if (word.length < correct.length)
                return;

            /* CORRECT */
            if (word === correct) {

                slotArr.forEach(s => {

                    s.classList.remove("wrong");

                    s.classList.add("correct");

                });
                userAnswers[index] = {
                    word: enteredWord.toUpperCase()
                };

                score++;

                showPopup("correctPopup");

                speak("Correct");
                /* CONFETTI */
                /* CONFETTI */
                const confettiCanvas =
                    document.createElement("canvas");

                confettiCanvas.style.position = "fixed";

                confettiCanvas.style.top = "0";

                confettiCanvas.style.left = "0";

                confettiCanvas.style.width = "100%";

                confettiCanvas.style.height = "100%";

                confettiCanvas.style.pointerEvents = "none";

                confettiCanvas.style.zIndex = "999";

                document.body.appendChild(
                    confettiCanvas
                );

                const myConfetti =
                    confetti.create(
                        confettiCanvas,
                        {
                            resize: true,
                            useWorker: true
                        }
                    );

                myConfetti({

                    particleCount: 140,
                    spread: 90,
                    origin: { y: 0.6 }

                });

                /* REMOVE */
                setTimeout(() => {

                    myConfetti.reset();

                    confettiCanvas.remove();

                }, 700);
                nextBtn.disabled = false;

                /* LAST QUESTION */
                if (index === questions.length - 1) {

                    setTimeout(showFinal, 1200);

                }

            }

            /* WRONG */
            else {

                slotArr.forEach(s => {

                    s.classList.add("wrong");

                });

                showPopup("wrongPopup");

                speak("Try Again");

                setTimeout(() => {

                    slotArr.forEach(s => {

                        if (!s.classList.contains("hyphen-slot")) {
                            s.textContent = "";
                        }

                        s.classList.remove("wrong", "correct");

                    });

                    document
                        .querySelectorAll(".letter")
                        .forEach(l =>
                            l.classList.remove("used")
                        );

                    filledSlots = [];

                    updateProgress();

                }, 900);

            }

        }

        /* NEXT */
        function nextQ() {

            if (quizEnded) return;

            if (userAnswers[index] === null)
                return;

            if (index < questions.length - 1) {

                index++;

                renderQuestion();

            }

        }

        /* PREV */
        function prevQ() {

            if (quizEnded) return;

            if (index > 0) {

                index--;

                renderQuestion();

            }

        }
        /* FINAL */
        function showFinal() {

            quizEnded = true;

            // Disable Previous button
            prevBtn.disabled = true;
            prevBtn.style.pointerEvents = "none";
            prevBtn.style.cursor = "not-allowed";
            prevBtn.style.opacity = "0.5";

            // Disable Next button
            nextBtn.disabled = true;
            nextBtn.style.pointerEvents = "none";
            nextBtn.style.cursor = "not-allowed";
            nextBtn.style.opacity = "0.5";

            document.getElementById("finalPopup").style.display = "block";

            document.getElementById("finalText").innerHTML =
                `Score : ${score}/${questions.length}`;

            confetti({
                particleCount: 220,
                spread: 120
            });
        }

        function restartQuiz() {

            // Reset variables
            index = 0;
            score = 0;
            quizEnded = false;

            userAnswers = new Array(questions.length).fill(null);
            filledSlots = [];

            // Hide popup
            document.getElementById("finalPopup").style.display = "none";

            // Enable buttons again
            prevBtn.disabled = true;
            prevBtn.style.pointerEvents = "auto";
            prevBtn.style.opacity = "1";

            nextBtn.disabled = true;
            nextBtn.style.pointerEvents = "auto";
            nextBtn.style.opacity = "1";

            speechSynthesis.cancel();

            renderQuestion();
        }

    </script>

</body>

</html>
