<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Assessments</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
}

body{



height:100vh;

overflow:hidden;

display:flex;
justify-content:center;
align-items:center;
}

/* MAIN */
.container{

width:100%;
height:100vh;

padding:15px;

display:flex;
justify-content:center;
align-items:center;
}

/* GAME */
.game{

width:100%;
max-width:1450px;
height:100%;

display:flex;
justify-content:space-between;
align-items:center;

gap:200px;

position:relative;

padding:10px 20px;
}

/* SVG */
svg{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

pointer-events:none;

z-index:1;
}

/* COLUMN */
.column{

width:40%;

display:flex;
flex-direction:column;

gap:14px;

z-index:2;
}

/* CARD */
.card{

min-height:82px;

border-radius:24px;

padding:10px 16px;

display:flex;
align-items:center;
justify-content:space-between;

cursor:pointer;

transition:.25s;

position:relative;

border:3px solid #ffffff;
}
.left .card,
.right .card{

background:#f1f2f3;          /* Soft neutral pastel */

border:3px solid #a7b8ca;    /* Elegant border */

color:#2F4F4F;

box-shadow:
0 8px 18px rgba(0,0,0,.08);

}
.card.active{

background:#E8F1FF;

border:3px solid #5B8DEF;

transform:scale(1.03);

box-shadow:
0 0 0 4px rgba(91,141,239,.18);

}
.card.matched{

background:#EEF8F1;

border:3px solid #69B77A;

opacity:.9;

pointer-events:none;

}
/* TEXT */
.text{

font-size:22px;

color:#2f4f4f;

line-height:1.3;
}

/* RIGHT IMAGE */
.right-image{

width:58px;
height:58px;

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;




overflow:hidden;

margin-left:12px;
}

/* IMAGE */
.right-image img{

width:70px;
height:70px;

object-fit:contain;
}
.dot{

width:16px;
height:16px;

border-radius:50%;

background:#5B8DEF;

box-shadow:0 0 8px rgba(91,141,239,.35);

}
/* WRONG */
@keyframes shake{

0%,100%{
transform:translateX(0);
}

25%{
transform:translateX(-5px);
}

75%{
transform:translateX(5px);
}

}

.wrong{

animation:shake .3s;
}

/* DASH */
@keyframes dashMove{

to{
stroke-dashoffset:-20;
}

}

/* POPUP */
.popup{

position:fixed;

inset:0;

display:flex;
justify-content:center;
align-items:center;


z-index:999;
}

/* HIDE */
.hidden{
display:none;
}

/* BOX */
.popup-box{

width:380px;

padding:30px 20px;

border-radius:45px;

text-align:center;

background:
linear-gradient(
135deg,
#fff1b6,
#ffe066
);

border:4px solid white;

animation:popupBounce .35s forwards;
}

/* POPUP */
@keyframes popupBounce{

0%{
transform:scale(.5);
opacity:0;
}

70%{
transform:scale(1.05);
}

100%{
transform:scale(1);
opacity:1;
}

}

/* EMOJI */
.popup-emoji{
font-size:85px;
margin-bottom:18px;
}

/* TITLE */
.popup-title{

font-size:42px;

margin-bottom:12px;

color:#222;
}

/* SCORE */
.popup-score{

font-size:26px;

color:#333;

margin-bottom:20px;
}

/* BUTTON */
.play-btn{

padding:16px 32px;

border:none;

border-radius:20px;

font-size:22px;

cursor:pointer;

color:white;

background:
linear-gradient(
135deg,
#06d6a0,
#1b9aaa
);

transition:.25s;
}

.play-btn:hover{

transform:scale(1.05);
}
/* ================= MOBILE ================= */
/* ================= MOBILE ================= */

@media screen and (max-width:768px){

body{

overflow:hidden;

align-items:center;

padding:10px 0;

}

/* MAIN */
.container{

height:auto;

padding:10px;

}

/* GAME */
.game{

flex-direction:row;

justify-content:space-between;

align-items:flex-start;

gap:30px;

padding:10px 0 30px;

max-width:100%;

height:auto;

}

/* COLUMN */
.column{

width:48%;

gap:10px;

}

/* CARD */
.card{

min-height:68px;

padding:8px 10px;

border-radius:18px;

}

/* TEXT */
.text{

font-size:15px;

line-height:1.25;

}

/* IMAGE */
.right-image{

width:45px;

height:45px;

margin-left:6px;

}

.right-image img{

width:50px;

height:50px;

}

/* DOT */
.dot{
display: none;

}

/* SVG */
svg{

height:100%;

}

/* POPUP */
.popup-box{

width:220px;

padding:18px 14px;

border-radius:24px;

}

/* EMOJI */
.popup-emoji{

font-size:48px;

margin-bottom:8px;

}

/* TITLE */
.popup-title{

font-size:24px;

margin-bottom:4px;

}

/* SCORE */
.popup-score{

font-size:15px;

margin-bottom:14px;

}

/* BUTTON */
.play-btn{

font-size:14px;

padding:10px 18px;

border-radius:18px;

}

}


/* ================= TABLET ================= */

@media screen and (min-width:769px) and (max-width:800px){

.container{

padding:16px;

}

/* GAME */
.game{

flex-direction:row;

justify-content:space-between;

align-items:flex-start;

gap:100px;

padding:20px 10px;

max-width:100%;

height:auto;

}

/* COLUMN */
.column{

width:48%;

gap:14px;

}

/* CARD */
.card{

min-height:70px;

padding:12px 14px;

border-radius:24px;

}

/* TEXT */
.text{

font-size:18px;

line-height:1.35;

}

/* IMAGE */
.right-image{

width:42px;

height:42px;

margin-left:10px;

}

.right-image img{

width:32px;

height:32px;

}

/* DOT */
.dot{

width:13px;

height:13px;

}

/* SVG */
svg{

height:100%;

}

/* POPUP */
.popup-box{

width:320px;

padding:28px 22px;

border-radius:34px;

}

/* EMOJI */
.popup-emoji{

font-size:68px;

}

.popup-title{

font-size:38px;

}

.popup-score{

font-size:22px;

}

.play-btn{

font-size:20px;

padding:14px 26px;

}

}
/* ================= LARGE MONITORS ================= */

@media screen and (min-width:1441px) and (max-width:1920px){

/* MAIN */
.container{

padding:40px;

}

/* GAME */
.game{

max-width:2100px;

gap:180px;

padding:30px 40px;

}

/* COLUMN */
.column{

gap:15px;

}

/* CARD */
.card{

min-height:115px;

padding:14px 24px;

border-radius:46px;

}

/* TEXT */
.text{

font-size:30px;

line-height:1.5;

}

/* IMAGE */
.right-image{

width:82px;

height:82px;

margin-left:22px;

}

.right-image img{

width:90px;

height:90px;

}

/* DOT */
.dot{

width:20px;

height:20px;

}

/* SVG LINE */
svg line{

stroke-width:8;

}

/* POPUP */
.popup-box{

width:500px;

padding:50px 40px;

border-radius:65px;
}

/* EMOJI */
.popup-emoji{

font-size:140px;

margin-bottom:28px;


}

/* TITLE */
.popup-title{

font-size:80px;

}

/* SCORE */
.popup-score{

font-size:40px;

margin-bottom:30px;

}

/* BUTTON */
.play-btn{

font-size:32px;

padding:24px 50px;

border-radius:60px;

}

}

/* ================= EXTRA LARGE / 4K ================= */

@media screen and (min-width:1921px){

/* MAIN */
.container{

padding:60px;

}

/* GAME */
.game{

max-width:2800px;

gap:260px;

padding:40px 60px;

}

/* COLUMN */
.column{

gap:30px;

}

/* CARD */
.card{

min-height:170px;

padding:20px 30px;

border-radius:60px;

}

/* TEXT */
.text{

font-size:54px;

line-height:1.5;

}

/* IMAGE */
.right-image{

width:130px;

height:130px;

margin-left:30px;

}

.right-image img{

width:86px;

height:86px;

}

/* DOT */
.dot{

width:26px;

height:26px;

}

/* SVG LINE */
svg line{

stroke-width:10;

}

/* POPUP */
.popup-box{

width:780px;

padding:90px 65px;

border-radius:80px;

}

/* EMOJI */
.popup-emoji{

font-size:190px;

margin-bottom:35px;

}

/* TITLE */
.popup-title{

font-size:110px;

}

/* SCORE */
.popup-score{

font-size:60px;

margin-bottom:36px;

}

/* BUTTON */
.play-btn{

font-size:46px;

padding:30px 60px;

border-radius:70px;

}

}

</style>
</head>

<body>

<div class="container">

<div class="game" id="game">

<svg id="svg"></svg>

<!-- LEFT -->
<div class="column left" id="left"></div>

<!-- RIGHT -->
<div class="column right" id="right"></div>

</div>

</div>

<!-- POPUP -->
<div id="popup" class="popup hidden">

<div class="popup-box">

<div class="popup-emoji">
🏆
</div>

<div class="popup-title">
Awesome!
</div>

<div class="popup-score" id="score">
</div>

<button class="play-btn"
onclick="restartGame()">

🔄 Play Again

</button>

</div>

</div>

<script>

/* LEFT */
const leftData=[

{
text:"1. Shape of the Earth",
match:"c"
},

{
text:"2. Cardinal direction",
match:"a"
},

{
text:"3. Continent",
match:"b"
},

{
text:"4. Sub-direction",
match:"e"
},

{
text:"5. Ocean",
match:"d"
}

];

/* RIGHT */
const rightData=[

{
text:"East",
match:"a",
img:"../images/eastimg.png"
},

{
text:"Asia",
match:"b",
img:"../images/asia.png"
},

{
text:"Geoid",
match:"c",
img:"../images/geoid.png"
},

{
text:"Indian Ocean",
match:"d",
img:"../images/indian.png"
},

{
text:"North-east",
match:"e",
img:"../images/northeast.png"
}

];

const left=
document.getElementById("left");

const right=
document.getElementById("right");

const svg=
document.getElementById("svg");

let selected=null;

let score=0;

/* SPEAK */
 function speak(text){

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang="en-UK";

speech.rate=1;

speech.pitch=1;

speech.volume=0.25;

speechSynthesis.speak(speech);

}
/* LEFT */
leftData.forEach(item=>{

const div=
document.createElement("div");

div.className="card";

div.dataset.match=item.match;

div.innerHTML=

`
<div class="text">
${item.text}
</div>

<div class="dot"></div>
`;

div.onclick=()=>{

if(div.classList.contains("matched"))
return;

document
.querySelectorAll(".card")
.forEach(c=>{

c.classList.remove("active");

});

div.classList.add("active");

selected=div;

};

left.appendChild(div);

});

/* RIGHT */
rightData.forEach(item=>{

const div=
document.createElement("div");

div.className="card";

div.dataset.match=item.match;

div.innerHTML=

`
<div class="dot"></div>

<div class="text">
${item.text}
</div>

<div class="right-image">
<img src="${item.img}">
</div>
`;

div.onclick=()=>{

if(!selected)
return;

/* CORRECT */
if(
selected.dataset.match===
div.dataset.match
){
/* MOBILE + TABLET */
if(window.innerWidth<=768){

/* REMOVE DRAW LINE */

/* LEFT MATCH */
selected.classList.add("matched");

/* RIGHT MATCH */
div.classList.add("matched");

/* COPY LEFT COLOR TO RIGHT */
div.style.background=
getComputedStyle(selected)
.background;

/* BORDER */
div.style.border=
"3px solid #06d6a0";

selected.style.border=
"3px solid #06d6a0";

/* DISABLE */
selected.style.pointerEvents=
"none";

div.style.pointerEvents=
"none";

}

/* DESKTOP */
else{

const line=
drawLine(selected,div);

line.setAttribute(
"stroke",
"#06d6a0"
);

selected.classList.add("matched");

div.classList.add("matched");

}

/* CONFETTI */
confetti.reset();

confetti({

particleCount:70,
spread:80,
origin:{y:0.6}

});

setTimeout(()=>{

confetti.reset();

},500);

speak("Correct");

score++;
if(score === leftData.length){

    setTimeout(() => {

        document
            .getElementById("popup")
            .classList
            .remove("hidden");

        document
            .getElementById("score")
            .innerHTML =
            `Score : ${score}/${leftData.length}`;

        // 🎉 Big final confetti
        confetti.reset();

        confetti({
            particleCount: 300,
            spread: 180,
            startVelocity: 60,
            ticks: 300,
            origin: { y: 0.6 }
        });

    }, 600);

}

}

/* WRONG */
else{

div.classList.add("wrong");

speak("Try Again");

setTimeout(()=>{

div.classList.remove("wrong");

},300);

}

selected.classList.remove("active");

selected=null;

};

right.appendChild(div);

});

/* DRAW LINE */
function drawLine(el1,el2){

const dot1=
el1.querySelector(".dot");

const dot2=
el2.querySelector(".dot");

const rect1=
dot1.getBoundingClientRect();

const rect2=
dot2.getBoundingClientRect();

const parent=
document
.getElementById("game")
.getBoundingClientRect();

const x1=
rect1.left+
rect1.width/2-
parent.left;

const y1=
rect1.top+
rect1.height/2-
parent.top;

const x2=
rect2.left+
rect2.width/2-
parent.left;

const y2=
rect2.top+
rect2.height/2-
parent.top;

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",x1);

line.setAttribute("y1",y1);

line.setAttribute("x2",x2);

line.setAttribute("y2",y2);

line.setAttribute(
"stroke-width",
"5"
);

line.setAttribute(
"stroke-linecap",
"round"
);

line.setAttribute(
"stroke-dasharray",
"10,8"
);

line.style.animation=
"dashMove 1s linear infinite";

svg.appendChild(line);

return line;

}

/* RESTART */
function restartGame(){

location.reload();

}

</script>

</body>
</html>
