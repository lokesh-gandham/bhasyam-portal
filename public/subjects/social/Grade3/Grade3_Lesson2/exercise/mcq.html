<!DOCTYPE html>
<html lang="en">

<head>
    <script src="/auth-guard.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Digital Assessments</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        }

        body {

            overflow: hidden;
        }

        /* MAIN */
        .quiz-container {
            width: 100%;
            height: 100vh;

            padding: 25px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* QUESTION */
        .question {
            max-width: 1200px;
            width: 100%;
            margin-top: -80px;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 20px;

            font-size: 30px;
            line-height: 1.1;

            color: #2f4f4f;

            text-align: left;

            /* ✅ FIXED HEIGHT */
            height: 100px;

            overflow: hidden;
        }

        /* CONTENT */
        .quiz-content {

            width: 100%;
            max-width: 1200px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 45px;
            margin-top: 40px;
        }

        /* LEFT IMAGE */
        .question-image {

            width: 320px;
            height: 320px;

            border-radius: 45px;

            background:
                linear-gradient(135deg,
                    #f4efdb,
                    #f5f1f5);

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            overflow: hidden;

            border: 2px solid white;
        }


        .question-image img {

            width: 100%;
            height: 100%;

            object-fit: contain;

        }


        /* OPTIONS */
        .options {

            display: flex;
            flex-direction: column;
            gap: 10px;

            width: 380px;
        }

        /* OPTION BOX */
        .option {

            height: 95px;

            border-radius: 35px;

            display: flex;
            align-items: center;

            padding: 0 24px;

            cursor: pointer;

            transition: 0.25s;

            position: relative;

            overflow: hidden;

            border: 3px solid white;
        }

        /* UNIQUE COLORS */
        .option:nth-child(1) {
            background:
                linear-gradient(135deg,
                    #ffc8dd,
                    #ffafcc);
        }

        .option:nth-child(2) {
            background:
                linear-gradient(135deg,
                    #caffbf,
                    #a0f4c3);
        }

        .option:nth-child(3) {
            background:
                linear-gradient(135deg,
                    #fff1b6,
                    #ffe066);
        }

        /* SHINE */
        .option::before {
            content: "";

            position: absolute;

            top: 0;
            left: -40px;

            width: 70px;
            height: 150%;

            background:
                rgba(255, 255, 255, 0.3);

            transform: rotate(20deg);
        }

        /* OPTION IMAGE */
        .option img {

            width: 80px;
            height: 80px;

            object-fit: contain;

            padding: 8px;

            border-radius: 50%;

            background: white;

            margin-right: 22px;

            border: 4px solid white;
        }

        /* OPTION TEXT */
        .option span {

            font-size: 25px;

            color: #2f4f4f;
        }

        /* NAVIGATION WRAPPER */
        .nav-wrapper {

            position: absolute;

            bottom: 10px;
            left: 0;

            width: 100%;

            padding: 0 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            z-index: 100;
        }

        /* NAV BUTTON */
        .nav-btn {

            min-width: 130px;
            height: 50px;
            border: none;

            border-radius: 50px;

            font-size: 20px;

            cursor: pointer;

            color: #fff;

            transition: .25s;
        }

        /* PREV */
        .prev-btn {

            background:
                linear-gradient(135deg,
                    #43aa8b,
                    #90d7b8);

        }

        /* NEXT */
        .next-btn {

            background:
                linear-gradient(135deg,
                    #ff7b7b,
                    #ffb4a2);

        }

        /* DISABLED */
        .nav-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        /* POPUP */


        .popup {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%) scale(0.5);

            width: 380px;

            padding: 30px 20px;

            border-radius: 45px;

            display: none;

            z-index: 9999;

            text-align: center;

            animation: popupAnim 0.35s forwards;

            border: 4px solid white;
        }

        /* CORRECT */
        .correct-popup {

            background:
                linear-gradient(135deg,
                    #caffbf,
                    #a0f4c3);
        }

        /* WRONG */
        .wrong-popup {

            background:
                linear-gradient(135deg,
                    #ffcad4,
                    #ffafcc);
        }

        /* FINAL */
        .final-popup {

            background:
                linear-gradient(135deg,
                    #fff1b6,
                    #ffe066);
        }

        /* POPUP ANIM */
        @keyframes popupAnim {

            to {
                transform:
                    translate(-50%, -50%) scale(1);
            }

        }

        /* EMOJI */
        .popup-emoji {
            font-size: 85px;
            margin-bottom: 18px;
        }

        /* TITLE */
        .popup-title {

            font-size: 42px;

            margin-bottom: 12px;

            color: #222;
        }

        /* SUB */
        .popup-sub {

            font-size: 26px;

            color: #333;
        }

        /* PLAY AGAIN */
        .play-btn {

            margin-top: 28px;

            padding: 15px 28px;

            border: none;

            border-radius: 40px;

            font-size: 20px;

            cursor: pointer;

            background:
                linear-gradient(135deg,
                    #06d6a0,
                    #1b9aaa);

            color: white;
        }

        /* ================= MOBILE ================= */

        @media screen and (max-width:768px) {

            body {
                overflow: hidden;
            }

            /* MAIN */
            .quiz-container {

                min-height: 100vh;

                display: flex;

                flex-direction: column;

                justify-content: center;

                align-items: center;

            }

            /* QUESTION */

                font-size: 22px;

                line-height: 1.5;

                height: auto;

            }

            /* CONTENT */

            }

            /* IMAGE */
            .question-image {

            }

            /* OPTIONS */
            .options {

                width: 100%;

            }

            /* OPTION */
            .option {

                height: 82px;

                padding: 0 14px;

            }

            /* OPTION IMAGE */
            .option img {

                margin-right: 14px;

            }

            /* OPTION TEXT */

            }

            /* NAVIGATION */
            .nav-wrapper {

                margin-top: 24px;

                padding: 0;

            }

            /* BUTTON */
            .nav-btn {

                font-size: 18px;

            }

            /* POPUP */
            .popup {

                width: 220px;

                padding: 18px 14px;

                border-radius: 24px;

            }

            /* EMOJI */
            .popup-emoji {

                font-size: 48px;

                margin-bottom: 8px;

            }

            /* TITLE */
            .popup-title {

                font-size: 24px;

                margin-bottom: 4px;

            }

            /* SUBTITLE */
            .popup-sub {

                font-size: 15px;

            }

            /* PLAY BUTTON */
            .play-btn {

                padding: 10px 18px;

                margin-top: 16px;

            }

        }

        /* ================= TABLET ================= */

        @media screen and (min-width:769px) and (max-width:800px) {

            .quiz-container {

                padding: 24px;

            }

            /* QUESTION */
            .question {

                font-size: 25px;

                height: auto;

                line-height: 1.4;

                margin-top: -30px;

            }

            /* CONTENT */
            .quiz-content {

                gap: 30px;

                margin-top: 20px;

            }

            /* IMAGE */
            .question-image {

                width: 250px;

                height: 250px;


            }

            /* OPTIONS */
            .options {

                width: 420px;

                gap: 18px;

            }

            /* OPTION */
            .option {

                height: 75px;

            }

            /* OPTION IMAGE */
            .option img {

                width: 60px;

                height: 60px;

            }

            /* OPTION TEXT */
            .option span {

                font-size: 24px;

            }

            /* BUTTON */
            .nav-btn {

                font-size: 20px;

                padding: 12px 22px;

            }

            /* POPUP */
            .popup {

                width: 320px;

                padding: 28px 22px;

                border-radius: 34px;

            }

            .popup-emoji {

                font-size: 68px;

            }

            .popup-title {

                font-size: 38px;

            }

            .popup-sub {

                font-size: 22px;

            }

        }

        @media screen and (min-width:900px) and (max-width:1000px) {
            .question {
                font-size: 30px;
            }
        }

        @media screen and (min-width:1001px){
            .question {
                font-size: 40px;
            }
        }


        /* ================= LARGE MONITORS ================= */

        @media screen and (min-width:1441px) and (max-width:1920px) {

            /* MAIN */
            .quiz-container {
                padding: 45px;

            }

            /* QUESTION */
            .question {

                max-width: 1800px;

                font-size: 40px ;

                height: 160px;

                line-height: 1.2;

                margin-top: -120px;

            }

            /* CONTENT */
            .quiz-content {

                max-width: 1800px;

                gap: 90px;

                margin-top: 10px;

            }

            /* IMAGE */
            .question-image {

                width: 400px;

                height: 400px;

                border-radius: 70px;

            }

            /* OPTIONS */
            .options {

                width: 650px;

                gap: 15px;

            }

            /* OPTION */
            .option {

                height: 125px;

                padding: 0 34px;

                border-radius: 52px;

            }

            /* OPTION IMAGE */
            .option img {

                width: 105px;

                height: 105px;

                margin-right: 28px;

            }

            /* OPTION TEXT */
            .option span {

                font-size: 32px;

            }

            /* NAVIGATION */
            .nav-wrapper {

                padding: 0 65px;

                bottom: 2px;

            }

            /* BUTTON */
            .nav-btn {

                font-size: 30px;


                min-width: 180px;
                height: 70px;

            }

            /* POPUP */
            .popup {

                width: 500px;

                padding: 50px 40px;

                border-radius: 65px;

            }

            /* EMOJI */
            .popup-emoji {

                font-size: 140px;

                margin-bottom: 28px;

            }

            /* TITLE */
            .popup-title {

                font-size: 80px;

            }

            /* SUBTITLE */
            .popup-sub {

                font-size: 40px;

            }

            /* PLAY BUTTON */
            .play-btn {

                font-size: 32px;

                padding: 24px 50px;

                border-radius: 60px;

            }

        }

        /* ================= EXTRA LARGE / 4K ================= */

        @media screen and (min-width:1921px) {

            /* MAIN */
            .quiz-container {

                padding: 70px;

            }

            /* QUESTION */
            .question {

                max-width: 2400px;

                font-size: 40px;

                height: 200px;

                line-height: 1.4;

                margin-top: -150px;

            }

            /* CONTENT */
            .quiz-content {

                max-width: 2400px;

                gap: 130px;

                margin-top: -50px;

            }

            /* IMAGE */
            .question-image {

                width: 700px;

                height: 700px;

                border-radius: 90px;

            }

            /* OPTIONS */
            .options {

                width: 850px;

                gap: 32px;

            }

            /* OPTION */
            .option {

                height: 190px;

                padding: 0 42px;

                border-radius: 70px;

            }

            /* OPTION IMAGE */
            .option img {

                width: 145px;

                height: 145px;

                margin-right: 34px;

            }

            /* OPTION TEXT */
            .option span {

                font-size: 54px;

            }

            /* NAVIGATION */
            .nav-wrapper {

                padding: 0 90px;

                bottom: 10px;

            }

            /* BUTTON */
            .nav-btn {

                font-size: 30px;


                min-width: 180px;

            }

            /* POPUP */
            .popup {

                width: 780px;

                padding: 90px 65px;

                border-radius: 80px;

            }

            /* EMOJI */
            .popup-emoji {

                font-size: 190px;

                margin-bottom: 35px;

            }

            /* TITLE */
            .popup-title {

                font-size: 110px;

            }

            /* SUBTITLE */
            .popup-sub {

                font-size: 60px;

            }

            /* PLAY BUTTON */
            .play-btn {

                font-size: 46px;

                padding: 30px 60px;

                border-radius: 70px;

            }

        }

        /* ================= SMALL MOBILE ================= */

        @media screen and (max-width:400px) {

            /* MAIN */
            .quiz-container {

                padding: 1px 10px 80px;

            }

            /* QUESTION */
            .question {

                font-size: 22px;

                line-height: 1.2;

                padding: 0 4px;

                margin-top: 0;

            }

            /* CONTENT */
            .quiz-content {

                gap: 16px;

            }

            /* IMAGE */
            .question-image {

                height: 130px;

            }

            /* OPTIONS */

            }

            /* OPTION */
            .option {

                height: 62px;

            }

            /* OPTION IMAGE */

                padding: 4px;

            /* OPTION TEXT */

            /* NAVIGATION */

    </style>
</head>

<body>

    <div class="quiz-container">

        <!-- QUESTION -->
        <div class="question" id="question">
        </div>

        <!-- CONTENT -->
        <div class="quiz-content">

            <!-- LEFT IMAGE -->
            <div class="question-image">

                <img id="questionImg" src="">

            </div>

            <!-- OPTIONS -->
            <div class="options" id="options">
            </div>

        </div>
        <div class="nav-wrapper">

            <button class="nav-btn prev-btn">
                ← Prev
            </button>

            <button class="nav-btn next-btn">
                Next →
            </button>

        </div>

    </div>

    <!-- CORRECT -->
    <div id="correctPopup" class="popup correct-popup">

        <div class="popup-emoji">
            😊
        </div>

        <div class="popup-title">
            Great!
        </div>

        <div class="popup-sub">
            Correct Answer
        </div>

    </div>

    <!-- WRONG -->
    <div id="wrongPopup" class="popup wrong-popup">

        <div class="popup-emoji">
            😢
        </div>

        <div class="popup-title">
            Oops!
        </div>

        <div class="popup-sub">
            Wrong Answer
        </div>

    </div>

    <!-- FINAL -->
    <div id="finalPopup" class="popup final-popup">

        <div class="popup-emoji">
            🏆
        </div>

        <div class="popup-title">
            Awesome!
        </div>

        <div class="popup-sub" id="finalScore">
        </div>

        <button class="play-btn" onclick="location.reload()">
            🔄 Play Again
        </button>

    </div>
    <script>

        /* 🔊 UK SPEECH */
        function speakText(text) {

            window.speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-UK";

            speech.rate = 1;

            speech.pitch = 1;

            speech.volume = 0.25;

            speechSynthesis.speak(speech);

        }
        /* QUESTIONS */

        const quizData = [

            {
                question:
                    "Q1. The movement of the Earth around itself is called ________.",

                image:
                    "../images/earth.png",

                correct:
                    "Rotation",

                options: [

                    {
                        text: "Axis",
                        img: "../images/axis.png"
                    },

                    {
                        text: "Rotation",
                        img: "../images/rotation.png"
                    },

                    {
                        text: "Revolution",
                        img: "../images/revolution.png"
                    }

                ]

            },

            {
                question:
                    "Q2. There are ________ continents in the world.",

                image:
                    "../images/mcq2.png",

                correct:
                    "Seven",

                options: [

                    {
                        text: "Seven",
                        img: "../images/seven.png"
                    },

                    {
                        text: "Nine",
                        img: "../images/nine.png"
                    },

                    {
                        text: "Six",
                        img: "../images/six.png"
                    }

                ]

            },

            {
                question:
                    "Q3. The Earth while spinning around its axis goes around the Sun on a fixed path called ________.",

                image:
                    "../images/mcq33.png",

                correct:
                    "Orbit",

                options: [

                    {
                        text: "Rotation",
                        img: "../images/rotation.png"
                    },

                    {
                        text: "Orbit",
                        img: "../images/orbit.png"
                    },

                    {
                        text: "Revolution",
                        img: "../images/revolution.png"
                    }

                ]

            },

            {
                question:
                    "Q4. The largest and the deepest ocean is the ________.",

                image:
                    "../images/mcq44.png",

                correct:
                    "Pacific ocean",

                options: [

                    {
                        text: "Indian ocean",
                        img: "../images/indian.png"
                    },

                    {
                        text: "Arctic ocean",
                        img: "../images/arctic.png"
                    },

                    {
                        text: "Pacific ocean",
                        img: "../images/pacific.png"
                    }

                ]

            },

            {
                question:
                    "Q5. There are ________ main cardinal directions.",

                image:
                    "../images/mcq55.png",

                correct:
                    "Four",

                options: [

                    {
                        text: "Four",
                        img: "../images/four.png"
                    },

                    {
                        text: "Six",
                        img: "../images/six.png"
                    },

                    {
                        text: "Five",
                        img: "../images/five.png"
                    }

                ]

            }

        ];

        /* VARIABLES */

        let currentQuestion = 0;

        let score = 0;
        let quizEnded = false;
        /* HOLD ANSWERS */
        let userAnswers =
            new Array(quizData.length).fill(null);

        /* ELEMENTS */

        const question =
            document.getElementById("question");

        const questionImg =
            document.getElementById("questionImg");

        const optionsDiv =
            document.getElementById("options");

        const nextBtn =
            document.querySelector(".next-btn");

        const prevBtn =
            document.querySelector(".prev-btn");

        /* LOAD QUESTION */

        function loadQuestion() {

            const q =
                quizData[currentQuestion];

            question.innerHTML =
                q.question;

            questionImg.src =
                q.image;

            optionsDiv.innerHTML = "";

            /* PREV BUTTON */
            prevBtn.disabled =
                currentQuestion === 0;

            /* NEXT BUTTON */
            nextBtn.disabled =
                userAnswers[currentQuestion] === null;

            q.options.forEach(option => {

                const btn =
                    document.createElement("div");

                btn.className = "option";

                btn.innerHTML = `

<img src="${option.img}">

<span>
${option.text}
</span>

`;

                /* HOLD ANSWER */
                if (
                    userAnswers[currentQuestion] === option.text
                ) {

                    btn.style.outline =
                        "2px solid #2f9e44";

                    btn.style.transform =
                        "scale(1.03)";

                    btn.style.pointerEvents =
                        "none";

                }

                /* DISABLE ALL */
                if (
                    userAnswers[currentQuestion] !== null
                ) {

                    btn.style.pointerEvents =
                        "none";

                }

                /* CLICK */
                btn.onclick = () => {

                    checkAnswer(
                        option.text,
                        btn
                    );

                };

                optionsDiv.appendChild(btn);

            });

        }

        /* START */
        loadQuestion();

        /* POPUP */

        function showPopup(id) {

            const popup =
                document.getElementById(id);

            popup.style.display = "block";

            setTimeout(() => {

                popup.style.display = "none";

            }, 1200);

        }
        /* RESET CONFETTI */
        function resetConfetti() {

            confetti.reset();

        }
        /* CHECK ANSWER */

        function checkAnswer(answer, btn) {

            /* ALREADY ANSWERED */
            if (
                userAnswers[currentQuestion] !== null
            ) {
                return;
            }

            const correct =
                quizData[currentQuestion].correct;

            /* CORRECT */
            if (answer === correct) {

                score++;

                userAnswers[currentQuestion] =
                    answer;

                /* HIGHLIGHT */
                btn.style.outline =
                    "2px solid #2f9e44";

                btn.style.transform =
                    "scale(1.03)";

                /* DISABLE OPTIONS */
                document
                    .querySelectorAll(".option")
                    .forEach(option => {

                        option.style.pointerEvents =
                            "none";

                    });

                /* ENABLE NEXT */
                nextBtn.disabled = false;

                /* POPUP */
                showPopup("correctPopup");

                speakText("Correct");
                /* RESET OLD CONFETTI */
                resetConfetti();

                /* NEW CONFETTI */
                confetti({

                    particleCount: 90,

                    spread: 70,

                    origin: {
                        y: 0.6
                    }

                });

                /* LAST QUESTION */
                if (
                    currentQuestion ===
                    quizData.length - 1
                ) {

                    setTimeout(() => {

                        showFinal();

                    }, 1200);

                }

            }

            /* WRONG */
            else {

                showPopup("wrongPopup");

                speakText("Try Again");

                /* WRONG EFFECT */
                btn.style.animation =
                    "shake .3s";

                setTimeout(() => {

                    btn.style.animation = "";

                }, 300);

            }

        }

        /* NEXT BUTTON */
        nextBtn.onclick = () => {

            if (quizEnded) return;

            if (userAnswers[currentQuestion] === null) return;

            resetConfetti();

            currentQuestion++;

            if (currentQuestion >= quizData.length) {
                showFinal();
                return;
            }

            loadQuestion();
        };

        prevBtn.onclick = () => {

            if (quizEnded) return;

            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        };
        function showFinal() {

            quizEnded = true;

            // Disable Prev button
            prevBtn.disabled = true;
            prevBtn.style.pointerEvents = "none";
            prevBtn.style.cursor = "not-allowed";
            prevBtn.style.opacity = "0.5";

            // Disable Next button
            nextBtn.disabled = true;
            nextBtn.style.pointerEvents = "none";
            nextBtn.style.cursor = "not-allowed";
            nextBtn.style.opacity = "0.5";

            // Disable all options
            document.querySelectorAll(".option").forEach(option => {
                option.style.pointerEvents = "none";
            });

            document.getElementById("finalPopup").style.display = "block";

            document.getElementById("finalScore").innerHTML =
                `Score : ${score}/${quizData.length}`;

            confetti({
                particleCount: 220,
                spread: 120
            });
        }
    </script>
</body>

</html>
