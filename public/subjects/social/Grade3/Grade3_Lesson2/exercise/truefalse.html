<!DOCTYPE html>
<html lang="en">

<head>
    <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Assessments</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* MAIN */
        .quiz-container {

            width: 100%;
            height: 100%;

            padding: 25px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* QUESTION */
        .question {

            width: 100%;
            max-width: 1200px;

            font-size: 30px;

            line-height: 1.4;

            color: #2f4f4f;

            text-align: left;

            height: 90px;

            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -50px;
        }

        /* CONTENT */
        .quiz-content {

            width: 100%;
            max-width: 1200px;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 55px;

            margin-top: 20px;
        }

        /* IMAGE */
        .question-image {

            width: 340px;
            height: 300px;

            border-radius: 45px;

            background:
                linear-gradient(135deg,
                    #fff0f3,
                    #edf6f9);

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            border: 3px solid white;

            position: relative;
        }

        /* FLOAT CIRCLE */
        .question-image::before {

            content: "";

            position: absolute;

            width: 120px;
            height: 120px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.35);

            top: 15px;
            left: 15px;
        }

        /* IMAGE */
        .question-image img {

            width: 100%;
            height: 100%;

            object-fit: contain;

            z-index: 2;
        }

        /* OPTIONS */
        .options {

            display: flex;
            flex-direction: column;

            gap: 28px;

            width: 430px;
        }

        /* PLAYFUL BUTTON */
        .option {

            height: 120px;

            border-radius: 40px;

            display: flex;
            align-items: center;

            padding: 0 24px;

            cursor: pointer;

            transition: .25s;

            position: relative;

            overflow: hidden;

            border: 5px solid white;

            color: #2f4f4f;
        }



        /* TRUE */
        .true-btn {

            background:
                linear-gradient(135deg,
                    #caffbf,
                    #a0f4c3);

        }

        /* FALSE */
        .false-btn {

            background:
                linear-gradient(135deg,
                    #ffc8dd,
                    #ffafcc);

        }

        /* HOVER */
        .option:hover {

            transform:
                translateY(-4px) scale(1.03);

        }

        /* ICON CIRCLE */
        .option-icon {

            width: 74px;
            height: 74px;

            border-radius: 50%;

            background: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 34px;

            margin-right: 20px;

            z-index: 2;

            border: 4px solid rgba(255, 255, 255, 0.9);
        }

        /* TEXT */
        .option-text {

            font-size: 34px;

            z-index: 2;
        }

        /* CORRECT */
        .correct {

            outline: 2px solid #2f9e44;

            transform: scale(1.03);
        }

        /* WRONG */
        .wrong {

            animation: shake .3s;
        }

        /* SHAKE */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }

        }

        /* NAV */
        .nav-wrapper {

            position: absolute;

            bottom: 15px;
            left: 0;

            width: 100%;

            padding: 0 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* NAV BTN */
        .nav-btn {


            min-width: 130px;
            height: 50px;

            border: none;

            border-radius: 50px;

            font-size: 20px;

            cursor: pointer;

            color: white;

            transition: .25s;
        }

        /* PREV */
        .prev-btn {

            background:
                linear-gradient(135deg,
                    #43aa8b,
                    #90d7b8);
        }

        /* NEXT */
        .next-btn {

            background:
                linear-gradient(135deg,
                    #ff7b7b,
                    #ffb4a2);
        }

        /* DISABLED */
        .nav-btn:disabled {

            background: #cccccc;

            cursor: not-allowed;
        }

        /* POPUP */
        .popup {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%) scale(0.5);

            width: 380px;

            padding: 30px 20px;

            border-radius: 45px;

            display: none;

            z-index: 9999;

            text-align: center;

            animation: popupAnim .35s forwards;

            border: 4px solid white;
        }

        /* CORRECT */
        .correct-popup {

            background:
                linear-gradient(135deg,
                    #caffbf,
                    #a0f4c3);
        }

        /* WRONG */
        .wrong-popup {

            background:
                linear-gradient(135deg,
                    #ffcad4,
                    #ffafcc);
        }

        /* FINAL */
        .final-popup {

            background:
                linear-gradient(135deg,
                    #fff1b6,
                    #ffe066);
        }

        /* POPUP */
        @keyframes popupAnim {

            to {
                transform:
                    translate(-50%, -50%) scale(1);
            }

        }

        /* EMOJI */
        .popup-emoji {

            font-size: 85px;

            margin-bottom: 18px;
        }

        /* TITLE */
        .popup-title {

            font-size: 42px;

            margin-bottom: 12px;

            color: #222;
        }

        /* SUB */
        .popup-sub {

            font-size: 26px;

            color: #333;
        }

        /* PLAY */
        .play-btn {

            margin-top: 28px;

            padding: 15px 28px;

            border: none;

            border-radius: 40px;

            font-size: 20px;

            cursor: pointer;

            background:
                linear-gradient(135deg,
                    #06d6a0,
                    #1b9aaa);

            color: white;
        }

        /* ================= MOBILE ================= */

        @media screen and (max-width:768px) {

            body {
                overflow: hidden;
            }

            /* MAIN */
            .quiz-container {

                min-height: 100vh;

                display: flex;

                flex-direction: column;

                justify-content: center;

                align-items: center;

            }

            /* QUESTION */
            .question {

                font-size: 22px;

                line-height: 1.5;

                height: auto;

                margin-top: 0;

                padding: 0 10px;

                text-align: left;

            }

            /* CONTENT */
            .quiz-content {

                flex-direction: column;

                gap: 22px;

                margin-top: 20px;

            }

            /* IMAGE */
            .question-image {

                width: 220px;

                height: 220px;

                border-radius: 30px;

            }

            /* OPTIONS */
            .options {

                width: 100%;

                gap: 16px;

            }

            /* OPTION */
            .option {

                height: 82px;

                padding: 0 14px;

                border-radius: 28px;

            }

            /* ICON */
            .option-icon {

                width: 55px;

                height: 55px;

                font-size: 24px;

                margin-right: 14px;

            }

            /* TEXT */
            .option-text {

                font-size: 22px;

            }

            /* NAVIGATION */
            .nav-wrapper {

                position: static;

                margin-top: 24px;

                padding: 0;

            }

            /* BUTTON */
            .nav-btn {

                font-size: 18px;

                padding: 10px 18px;

            }

            /* POPUP */
            .popup {

                width: 220px;

                padding: 18px 14px;

                border-radius: 24px;

            }

            /* EMOJI */
            .popup-emoji {

                font-size: 48px;

                margin-bottom: 8px;

            }

            /* TITLE */
            .popup-title {

                font-size: 24px;

                margin-bottom: 4px;

            }

            /* SUBTITLE */
            .popup-sub {

                font-size: 15px;

            }

            /* PLAY BUTTON */
            .play-btn {

                font-size: 14px;

                padding: 10px 18px;

                margin-top: 16px;

            }

        }

        /* ================= SMALL MOBILE ================= */

        @media screen and (max-width:390px) {

            /* MAIN */
            .quiz-container {

                padding: 12px 10px 80px;

            }

            /* QUESTION */
            .question {

                font-size: 22px;

                line-height: 1.45;

                padding: 0 4px;

                margin-top: 0;

                height: auto;

            }

            /* CONTENT */
            .quiz-content {

                gap: 16px;

                margin-top: 14px;

            }

            /* IMAGE */
            .question-image {

                width: 170px;

                height: 170px;

                border-radius: 22px;

            }

            /* FLOAT CIRCLE */
            .question-image::before {

                width: 70px;

                height: 70px;

                top: 10px;
                left: 10px;

            }

            /* OPTIONS */
            .options {

                gap: 10px;

                width: 100%;

            }

            /* OPTION */
            .option {

                height: 64px;

                padding: 0 10px;

                border-radius: 22px;

                border-width: 3px;

            }

            /* ICON */
            .option-icon {

                width: 42px;

                height: 42px;

                font-size: 18px;

                margin-right: 10px;

                border-width: 2px;

            }

            /* TEXT */
            .option-text {

                font-size: 16px;

            }

            /* NAVIGATION */
            .nav-wrapper {

                margin-top: 18px;

            }

            /* BUTTON */
            .nav-btn {

                font-size: 18px;

                padding: 10px 18px;

            }

            /* POPUP */
            .popup {

                width: 190px;

                padding: 14px 10px;

                border-radius: 20px;

            }

            /* EMOJI */
            .popup-emoji {

                font-size: 40px;

                margin-bottom: 6px;

            }

            /* TITLE */
            .popup-title {

                font-size: 20px;

                margin-bottom: 2px;

            }

            /* SUBTITLE */
            .popup-sub {

                font-size: 13px;

            }

            /* PLAY BUTTON */
            .play-btn {

                font-size: 12px;

                padding: 8px 14px;

                margin-top: 12px;

                border-radius: 16px;

            }

        }

        /* ================= TABLET ================= */

        @media screen and (min-width:769px) and (max-width:800px) {

            .quiz-container {

                padding: 24px;

            }

            /* QUESTION */
            .question {

                font-size: 28px;

                height: auto;

                line-height: 1.4;

                margin-top: -20px;

            }

            /* CONTENT */
            .quiz-content {

                gap: 30px;

                margin-top: 20px;

            }

            /* IMAGE */
            .question-image {

                width: 280px;

                height: 280px;

            }

            /* OPTIONS */
            .options {

                width: 420px;

                gap: 20px;

            }

            /* OPTION */
            .option {

                height: 95px;

            }

            /* ICON */
            .option-icon {

                width: 65px;

                height: 65px;

                font-size: 28px;

            }

            /* TEXT */
            .option-text {

                font-size: 28px;

            }

            /* BUTTON */
            .nav-btn {

                font-size: 20px;

                padding: 14px 24px;

            }

            /* POPUP */
            .popup {

                width: 320px;

                padding: 28px 22px;

                border-radius: 34px;

            }

            .popup-emoji {

                font-size: 68px;

            }

            .popup-title {

                font-size: 38px;

            }

            .popup-sub {

                font-size: 22px;

            }

        }


        @media screen and (min-width:900px) and (max-width:1000px) {
            .question {
                font-size: 30px;
            }
        }

        @media screen and (min-width:1001px) {
            .question {
                font-size: 40px;
            }
        }



        /* ================= LARGE MONITORS ================= */

        @media screen and (min-width:1441px) and (max-width:1920px) {

            /* MAIN */
            .quiz-container {

                padding: 45px;

            }

            /* QUESTION */
            .question {

                max-width: 1800px;

                font-size: 40px;

                height: 160px;

                line-height: 1.4;

                margin-top: -100px;

            }

            /* CONTENT */
            .quiz-content {

                max-width: 1800px;

                gap: 60px;

                margin-top: 20px;

            }

            /* IMAGE */
            .question-image {

                width: 400px;

                height: 400px;

                border-radius: 70px;

            }

            /* OPTIONS */
            .options {

                width: 650px;

                gap: 28px;

            }

            /* OPTION */
            .option {

                height: 140px;

                padding: 0 34px;

                border-radius: 52px;

            }

            /* ICON */
            .option-icon {

                width: 100px;

                height: 100px;

                font-size: 42px;

                margin-right: 28px;

            }

            /* TEXT */
            .option-text {

                font-size: 42px;

            }

            /* NAVIGATION */
            .nav-wrapper {

                padding: 0 65px;

                bottom: 2px;

            }

            /* BUTTON */
            .nav-btn {

                font-size: 30px;


                min-width: 180px;
                height: 70px;

            }

            /* POPUP */
            .popup {

                width: 500px;

                padding: 50px 40px;

                border-radius: 65px;

            }

            /* EMOJI */
            .popup-emoji {

                font-size: 140px;

                margin-bottom: 28px;

            }

            /* TITLE */
            .popup-title {

                font-size: 80px;

            }

            /* SUBTITLE */
            .popup-sub {

                font-size: 40px;

            }

            /* PLAY BUTTON */
            .play-btn {

                font-size: 32px;

                padding: 24px 50px;

                border-radius: 60px;

            }

        }

        /* ================= EXTRA LARGE / 4K ================= */

        @media screen and (min-width:1921px) {

            /* MAIN */
            .quiz-container {

                padding: 70px;

            }

            /* QUESTION */
            .question {

                max-width: 2400px;

                font-size: 60px;

                height: 200px;

                line-height: 1.4;

                margin-top: -150px;

            }

            /* CONTENT */
            .quiz-content {

                max-width: 2400px;

                gap: 130px;

                margin-top: -30px;

            }

            /* IMAGE */
            .question-image {

                width: 700px;

                height: 700px;

                border-radius: 90px;

            }

            /* OPTIONS */
            .options {

                width: 850px;

                gap: 34px;

            }

            /* OPTION */
            .option {

                height: 190px;

                padding: 0 42px;

                border-radius: 70px;

            }

            /* ICON */
            .option-icon {

                width: 140px;

                height: 140px;

                font-size: 58px;

                margin-right: 34px;

            }

            /* TEXT */
            .option-text {

                font-size: 56px;

            }

            /* NAVIGATION */
            .nav-wrapper {

                padding: 0 90px;

                bottom: 40px;

            }

            /* BUTTON */
            .nav-btn {

                font-size: 30px;


                min-width: 180px;
                height: 70px;
            }

            /* POPUP */
            .popup {

                width: 780px;

                padding: 90px 65px;

                border-radius: 80px;

            }

            /* EMOJI */
            .popup-emoji {

                font-size: 190px;

                margin-bottom: 35px;

            }

            /* TITLE */

                font-size: 110px;

            }

            /* SUBTITLE */

                font-size: 60px;

            }

            /* PLAY BUTTON */
            .play-btn {

                font-size: 46px;

                padding: 30px 60px;

                border-radius: 70px;

            }

        }
    </style>
</head>

<body>

    <div class="quiz-container">

        <!-- QUESTION -->
        <div class="question" id="question"></div>

        <!-- CONTENT -->
        <div class="quiz-content">

            <!-- IMAGE -->
            <div class="question-image">

                <img id="questionImg" src="">

            </div>

            <!-- OPTIONS -->
            <div class="options">

                <!-- TRUE -->
                <div class="option true-btn" id="trueBtn" onclick="checkAnswer('True',this)">

                    <div class="option-icon">
                        🌟
                    </div>

                    <div class="option-text">
                        TRUE
                    </div>

                </div>

                <!-- FALSE -->
                <div class="option false-btn" id="falseBtn" onclick="checkAnswer('False',this)">

                    <div class="option-icon">
                        💫
                    </div>

                    <div class="option-text">
                        FALSE
                    </div>

                </div>

            </div>

        </div>

        <!-- NAV -->
        <div class="nav-wrapper">

            <button class="nav-btn prev-btn" id="prevBtn">

                ← Prev

            </button>

            <button class="nav-btn next-btn" id="nextBtn" disabled>

                Next →

            </button>

        </div>

    </div>

    <!-- CORRECT -->
    <div id="correctPopup" class="popup correct-popup">

        <div class="popup-emoji">
            😊
        </div>

        <div class="popup-title">
            Great!
        </div>

        <div class="popup-sub">
            Correct Answer
        </div>

    </div>

    <!-- WRONG -->
    <div id="wrongPopup" class="popup wrong-popup">

        <div class="popup-emoji">
            😢
        </div>

        <div class="popup-title">
            Oops!
        </div>

        <div class="popup-sub">
            Wrong Answer
        </div>

    </div>

    <!-- FINAL -->
    <div id="finalPopup" class="popup final-popup">

        <div class="popup-emoji">
            🏆
        </div>

        <div class="popup-title">
            Awesome!
        </div>

        <div class="popup-sub" id="finalScore">
        </div>

        <button class="play-btn" onclick="location.reload()">

            🔄 Play Again

        </button>

    </div>

    <script>

        function speakText(text) {

            window.speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-UK";

            speech.rate = 1;

            speech.pitch = 1;

            speech.volume = 0.25;

            speechSynthesis.speak(speech);

        }

        /* QUESTIONS */
        const quizData = [

            {
                question:
                    "Q1. The Earth rotates from west to east.",

                image:
                    "../images/tf1.png",

                correct: "True"
            },

            {
                question:
                    "Q2. There are eight sub-directions.",

                image:
                    "../images/tf2.png",

                correct: "False"
            },

            {
                question:
                    "Q3. Antarctica is the coldest continent.",

                image:
                    "../images/tf3.png",

                correct: "True"
            },

            {
                question:
                    "Q4. Asia is the largest continent.",

                image:
                    "../images/tf4.png",

                correct: "True"
            },

            {
                question:
                    "Q5. Antarctic Ocean is also known as Atlantic Ocean.",

                image:
                    "../images/tf5.png",

                correct: "False"
            }

        ];

        /* VARIABLES */
        let currentQuestion = 0;

        let score = 0;

        let userAnswers =
            new Array(quizData.length)
                .fill(null);
        let quizEnded = false;
        /* ELEMENTS */
        const question =
            document.getElementById("question");

        const questionImg =
            document.getElementById("questionImg");

        const nextBtn =
            document.getElementById("nextBtn");

        const prevBtn =
            document.getElementById("prevBtn");

        /* LOAD */
        /* LOAD */
        function loadQuestion() {

            const q =
                quizData[currentQuestion];

            question.innerHTML =
                q.question;

            questionImg.src =
                q.image;

            /* BUTTONS */
            prevBtn.disabled =
                currentQuestion === 0;

            nextBtn.disabled =
                userAnswers[currentQuestion] === null;

            /* RESET */
            document
                .querySelectorAll(".option")
                .forEach(btn => {

                    btn.classList.remove(
                        "correct"
                    );

                    btn.style.pointerEvents =
                        "auto";

                    btn.style.opacity = "1";

                });

            /* HOLD ANSWER */
            if (
                userAnswers[currentQuestion]
            ) {

                document
                    .querySelectorAll(".option")
                    .forEach(btn => {

                        const btnText =
                            btn.innerText
                                .trim()
                                .toLowerCase();

                        const savedAnswer =
                            userAnswers[currentQuestion]
                                .toLowerCase();

                        /* HIGHLIGHT SAVED */
                        if (
                            btnText.includes(savedAnswer)
                        ) {

                            btn.classList.add(
                                "correct"
                            );

                        }

                        /* DISABLE BOTH */
                        btn.style.pointerEvents =
                            "none";

                        btn.style.cursor =
                            "default";

                        btn.style.opacity = ".75";

                    });

                nextBtn.disabled = false;

            }

        }

        /* START */
        loadQuestion();

        /* POPUP */
        function showPopup(id) {

            const popup =
                document.getElementById(id);

            popup.style.display =
                "block";

            setTimeout(() => {

                popup.style.display =
                    "none";

            }, 1200);

        }

        /* CHECK */
        function checkAnswer(answer, btn) {

            if (
                userAnswers[currentQuestion]
            ) {
                return;
            }

            const correct =
                quizData[currentQuestion]
                    .correct;

            /* CORRECT */
            if (answer === correct) {

                score++;

                userAnswers[currentQuestion] =
                    answer;

                btn.classList.add(
                    "correct"
                );

                document
                    .querySelectorAll(".option")
                    .forEach(option => {

                        option.style.pointerEvents =
                            "none";

                    });

                nextBtn.disabled = false;

                showPopup(
                    "correctPopup"
                );

                speakText(
                    "Correct"
                );

                confetti.reset();

                confetti({

                    particleCount: 90,

                    spread: 70,

                    origin: { y: 0.6 }

                });

                /* LAST */
                if (
                    currentQuestion ===
                    quizData.length - 1
                ) {

                    setTimeout(() => {

                        showFinal();

                    }, 1200);

                }

            }

            /* WRONG */
            else {

                showPopup(
                    "wrongPopup"
                );

                speakText(
                    "Try again"
                );

                btn.classList.add(
                    "wrong"
                );

                setTimeout(() => {

                    btn.classList.remove(
                        "wrong"
                    );

                }, 300);

            }

        }

        /* NEXT */
        nextBtn.onclick = () => {

            if (quizEnded) return;

            if (userAnswers[currentQuestion] === null) {
                return;
            }

            confetti.reset();

            currentQuestion++;

            if (currentQuestion >= quizData.length) {
                showFinal();
                return;
            }

            loadQuestion();

        };

        /* PREV */
        prevBtn.onclick = () => {

            if (quizEnded) return;

            if (currentQuestion > 0) {

                currentQuestion--;

                loadQuestion();

            }

        };

        /* FINAL */
        function showFinal() {

            quizEnded = true;

            // Disable Previous button
            prevBtn.disabled = true;
            prevBtn.style.pointerEvents = "none";
            prevBtn.style.cursor = "not-allowed";
            prevBtn.style.opacity = "0.5";

            // Disable Next button
            nextBtn.disabled = true;
            nextBtn.style.pointerEvents = "none";
            nextBtn.style.cursor = "not-allowed";
            nextBtn.style.opacity = "0.5";

            // Disable True/False buttons
            document.querySelectorAll(".option").forEach(btn => {
                btn.style.pointerEvents = "none";
            });

            document.getElementById("finalPopup").style.display = "block";

            document.getElementById("finalScore").innerHTML =
                `Score : ${score}/${quizData.length}`;

            confetti({
                particleCount: 220,
                spread: 120
            });
        }
    </script>

</body>

</html>
