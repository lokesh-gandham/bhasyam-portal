<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kids Fill Blanks</title>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        }

        body {

            width: 100%;
            height: 100vh;

            overflow: hidden;


        }

        /* MAIN */
        .quiz-container {

            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 15px 18px;

        }

        /* BOX */
        .quiz-box {

            width: 100%;
            max-width: 1200px;

            height: 95vh;

            border-radius: 40px;

            padding: 20px 30px;

            position: relative;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 25px;

        }

        /* QUESTION */
        .question {

            width: 100%;

            height: 90px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: left;

            font-size: 30px;

            line-height: 1.3;

            color: #2f4f4f;

            padding: 0 20px;

        }

        /* IMAGE */
        .image-wrap {

            width: 100%;

            display: flex;
            justify-content: center;

        }

        /* IMAGE BOX */
        .image-frame {

            width: 320px;
            height: 220px;

            border-radius: 35px;

            background:
                linear-gradient(135deg,
                    #fff0f6,
                    #edf7ff);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 18px;

            overflow: hidden;

        }

        /* IMAGE */
        .image-frame img {

            width: 100%;
            height: 100%;

            object-fit: contain;

        }

        /* ANSWER AREA */
        .answer-area {

            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

        }

        /* INPUT GROUP */
        .input-group {

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 18px;

            flex-wrap: wrap;

        }

        /* DOUBLE GROUP */
        .double-group {

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 18px;

            flex-wrap: wrap;

        }

        /* INPUT */
        .answer-input {

            width: 250px;
            height: 60px;

            border: none;
            outline: none;

            padding: 0 24px;

            font-size: 24px;

            color: #2f4f4f;

            border-radius: 28px;

            background:
                linear-gradient(145deg,
                    #ffffff,
                    #f2fbff);

            border: 5px solid #cde7ff;

            box-shadow:

                0 14px 25px rgba(140, 190, 255, .18),

                inset 0 4px 8px rgba(255, 255, 255, .95),

                inset 0 -4px 8px rgba(180, 220, 255, .25);

            transition: .3s;

        }

        /* PLACEHOLDER */
        .answer-input::placeholder {

            color: #8da9a9;

            font-size: 20px;

        }

        /* FOCUS */
        .answer-input:focus {

            transform:
                translateY(-4px) scale(1.02);

            border-color: #ff9ec7;

            box-shadow:

                0 18px 30px rgba(255, 105, 180, .22),

                0 0 0 8px rgba(255, 182, 193, .18);

        }

        /* CORRECT */
        .answer-input.correct {

            background:
                linear-gradient(145deg,
                    #d8f3dc,
                    #b7efc5);

            border-color: #52b788;

        }

        /* WRONG */
        .answer-input.wrong {

            background:
                linear-gradient(145deg,
                    #ffd6e0,
                    #ffc2d1);

            border-color: #ff5d8f;

        }

        /* BUTTON */
        .check-btn {

            height: 50px;
            padding: 0 34px;

            border: none;
            outline: none;

            cursor: pointer;

            font-size: 20px;
            font-weight: 500;

            color: white;

            border-radius: 22px;

            background: #52b788;

            box-shadow:
                0 10px 20px rgba(82, 183, 136, .35);

            transition: .3s;

        }

        /* HOVER */
        .check-btn:hover {

            background: #40916c;

            transform:
                translateY(-3px) scale(1.04);

        }

        /* DISABLED */
        .check-btn:disabled {

            background: #95d5b2;

            opacity: .7;

            cursor: not-allowed;

            box-shadow: none;

        }

        /* NAV */
        .nav {

            width: 100%;

            display: flex;
            justify-content: space-around;
            align-items: center;

            gap: 30px;

            margin-top: 10px;

        }

        /* NAV BUTTON */
        .nav-btn {

            width: 130px;
            height: 50px;

            border: none;

            font-size: 20px;

            cursor: pointer;

            color: white;

            transition: .25s;

        }

        /* PREV */
        .prev-btn {

            background:
                linear-gradient(135deg,
                    #52b788,
                    #74c69d);

            border-radius:
                32px 14px 32px 14px;

        }

        /* NEXT */
        .next-btn {

            background:
                linear-gradient(135deg,
                    #c77dff,
                    #b5179e);

            border-radius:
                14px 32px 14px 32px;

        }

        /* DISABLE */
        .next-btn:disabled {

            opacity: .45;

            cursor: not-allowed;

        }

        /* HOVER */
        .nav-btn:hover {

            transform: scale(1.05);

        }

        /* POPUP */
        .popup {

            position: fixed;

            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;


            z-index: 999;

        }

        /* HIDE */
        .hidden {
            display: none;
        }

        /* POPUP BOX */
        .popup-box {

            width: 330px;

            padding: 28px 20px;

            border-radius: 36px;

            text-align: center;

            animation: pop .35s;

        }

        /* CORRECT */
        .correct-popup .popup-box {

            background:
                linear-gradient(135deg,
                    #c8f7dc,
                    #b5ead7);

            border: 6px solid #57cc99;

        }

        /* WRONG */
        .wrong-popup .popup-box {

            background:
                linear-gradient(135deg,
                    #ffd6e0,
                    #ffc2d1);

            border: 6px solid #ff5d8f;

        }

        /* FINAL */
        .final-popup .popup-box {

            background:
                linear-gradient(135deg,
                    #d9f0ff,
                    #cdb4ff);

            border: 6px solid #9b5de5;

        }

        /* POP */
        @keyframes pop {

            0% {
                transform: scale(.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        }

        /* EMOJI */
        .popup-emoji {

            font-size: 85px;

            margin-bottom: 8px;

        }

        /* TITLE */
        .popup-title {

            font-size: 40px;

            color: #2f4f4f;

        }

        /* SCORE */
        .popup-score {

            font-size: 24px;

            margin-top: 10px;

            color: #2f4f4f;

        }

        /* PLAY AGAIN */
        .play-btn {

            margin-top: 18px;

            border: none;

            padding: 13px 28px;

            font-size: 22px;

            border-radius: 18px;

            cursor: pointer;

            background: #9b5de5;

            color: white;

        }

        /* 🚫 DISABLE IMAGE DRAG */

        .image-frame img {

            -webkit-user-drag: none;

            user-select: none;

            pointer-events: none;

        }


        /* ================= MONITOR ================= */

        @media screen and (min-width:1225px) and (max-width:1440px) {

            /* MAIN */
            .quiz-box {

                max-width: 1500px;

                height: 96vh;

                padding: 28px 40px;

                gap: 34px;

                border-radius: 50px;

            }

            /* QUESTION */
            .question {

                height: 120px;

                font-size: 40px;

                line-height: 1.4;

                padding: 0 40px;

            }

            /* IMAGE */
            .image-frame {

                width: 440px;
                height: 280px;

                border-radius: 46px;

                padding: 24px;

            }

            /* INPUT GROUP */
            .input-group,
            .double-group {

                gap: 24px;

            }

            /* INPUT */
            .answer-input {

                width: 320px;
                height: 86px;

                font-size: 32px;

                padding: 0 30px;

                border-radius: 34px;

                border-width: 6px;

            }

            /* PLACEHOLDER */
            .answer-input::placeholder {

                font-size: 28px;

            }

            /* BUTTON */
            .check-btn {

                height: 78px;

                padding: 0 40px;

                font-size: 30px;

                border-radius: 34px;

            }

            /* NAV */
            .nav {

                margin-top: 20px;

                gap: 40px;

            }

            /* NAV BUTTON */
            .nav-btn {

                width: 190px;
                height: 64px;

                font-size: 30px;

            }

            /* POPUP */
            .popup-box {

                width: 450px;

                padding: 36px 28px;

                border-radius: 44px;

            }

            /* EMOJI */
            .popup-emoji {

                font-size: 120px;

            }

            /* TITLE */
            .popup-title {

                font-size: 52px;

            }

            /* SCORE */
            .popup-score {

                font-size: 32px;

            }

            /* PLAY */
            .play-btn {

                font-size: 28px;

                padding: 16px 32px;

                border-radius: 22px;

            }

        }

        /* ================= LARGE MONITOR ================= */

        @media screen and (min-width:1441px) and (max-width:1920px) {

            /* MAIN */
            .quiz-box {

                max-width: 1900px;

                height: 97vh;

                padding: 45px 60px;

                gap: 46px;

                border-radius: 65px;

            }

            /* QUESTION */
            .question {

                height: 120px;

                font-size: 40px;

                line-height: 1.45;

                padding: 0 60px;

            }

            /* IMAGE */
            .image-frame {

                width: 440px;
                height: 280px;

                border-radius: 46px;

                padding: 24px;

            }

            /* INPUT GROUP */
            .input-group,
            .double-group {

                gap: 34px;

            }

            /* INPUT */
            .answer-input {

                width: 330px;
                height: 86px;

                font-size: 28px;

                padding: 0 30px;

                border-radius: 34px;

                border-width: 6px;

            }

            /* PLACEHOLDER */
            .answer-input::placeholder {

                font-size: 32px;

            }

            /* BUTTON */
            .check-btn {

                height: 78px;

                padding: 0 40px;

                font-size: 30px;

                border-radius: 34px;

            }

            /* NAV */
            .nav {

                margin-top: 20px;

                gap: 60px;

            }

            /* NAV BUTTON */
            .nav-btn {
                width: 190px;
                height: 64px;

                font-size: 30px;

            }

            /* POPUP */
            .popup-box {

                width: 450px;

                padding: 36px 28px;

                border-radius: 44px;

            }

            /* EMOJI */
            .popup-emoji {

                font-size: 120px;

            }

            /* TITLE */
            .popup-title {

                font-size: 52px;

            }

            /* SCORE */
            .popup-score {

                font-size: 32px;

            }

            /* PLAY */
            .play-btn {

                font-size: 28px;

                padding: 16px 32px;

                border-radius: 22px;

            }
        }
    </style>

    <style id="codex-responsive-shell">

            body:has(iframe) .nav-btn,
            body:has(iframe) .puzzle,
            body:has(iframe) .island-btn,

            body:has(iframe) .puzzle {

            }

            body:has(iframe) .sidebar {

            }
        }
    </style>
</head>

<body>

    <div class="quiz-container">

        <div class="quiz-box">

            <!-- QUESTION -->
            <div class="question" id="question">
            </div>

            <!-- IMAGE -->
            <div class="image-wrap">

                <div class="image-frame">
                    <img id="questionImage" draggable="false">

                </div>

            </div>

            <!-- ANSWER -->
            <div class="answer-area">

                <div id="answerBox">
                </div>

            </div>

            <!-- NAV -->
            <div class="nav">

                <button class="nav-btn prev-btn" id="prevBtn">

                    ⬅ Prev

                </button>

                <button class="nav-btn next-btn" id="nextBtn" disabled>

                    Next ➡

                </button>

            </div>

        </div>

    </div>

    <!-- CORRECT -->
    <div class="popup correct-popup hidden" id="correctPopup">

        <div class="popup-box">

            <div class="popup-emoji">
                🎉
            </div>

            <div class="popup-title">
                Correct!
            </div>

        </div>

    </div>

    <!-- WRONG -->
    <div class="popup wrong-popup hidden" id="wrongPopup">

        <div class="popup-box">

            <div class="popup-emoji">
                😢
            </div>

            <div class="popup-title">
                Oops!
            </div>

        </div>

    </div>

    <!-- FINAL -->
    <div class="popup final-popup hidden" id="finalPopup">

        <div class="popup-box">

            <div class="popup-emoji">
                🏆
            </div>

            <div class="popup-title">
                Awesome!
            </div>

            <div class="popup-score" id="scoreText">
            </div>

            <button class="play-btn" onclick="location.reload()">

                🎊 Play Again

            </button>

        </div>

    </div>

    <script>

        /* SPEECH */
        function speakText(text) {

            window.speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-UK";

            speech.rate = 1;

            speech.pitch = 1;

            speech.volume = 0.25;

            speechSynthesis.speak(speech);

        }

        /* QUESTIONS */
        const quizData = [

            {
                question: "_____ is the official language of China.",
                answers: ["CHINESE"],
                image: "../images/ftb1.png"
            },

            {
                question: "The Maldives is a group of beautiful _____ in the Indian Ocean.",
                answers: ["ISLANDS"],
                image: "../images/ftb22.png"
            },

            {
                question: "_____ is known as the ‘Golden Land’.",
                answers: ["MYANMAR"],
                image: "../images/ftb3.png"
            },

            {
                question: "Nepal lies between _____ and _____ in south Asia.",
                answers: ["CHINA", "INDIA"],
                double: true,
                image: "../images/ftb44.png"
            },

            {
                question: "People of different states speak different _____.",
                answers: ["LANGUAGES"],
                image: "../images/ftb55.png"
            }

        ];

        const question =
            document.getElementById("question");

        const image =
            document.getElementById("questionImage");

        const answerBox =
            document.getElementById("answerBox");

        const nextBtn =
            document.getElementById("nextBtn");

        const prevBtn =
            document.getElementById("prevBtn");

        let current = 0;

        let score = 0;

        let userAnswers =
            new Array(quizData.length)
                .fill(null);

        /* POPUP */
        function showPopup(id) {

            const popup =
                document.getElementById(id);

            popup.classList.remove("hidden");

            setTimeout(() => {

                popup.classList.add("hidden");

            }, 1000);

        }

        function toSentenceCase(text) {
            text = text.trim().toLowerCase();
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        /* LOAD */
        function loadQuestion() {

            nextBtn.disabled = true;

            const q = quizData[current];

            question.innerHTML =
                `Q${current + 1}. ${q.question}`;

            image.src = q.image;

            prevBtn.disabled =
                current === 0;

            const saved =
                userAnswers[current];

            /* DOUBLE */
            if (q.double) {

                answerBox.innerHTML = `

<div class="double-group">

<input
type="text"
id="input1"
class="answer-input"
placeholder="Type your answer"
>

<button
id="btn1"
class="check-btn">

Check

</button>

<input
type="text"
id="input2"
class="answer-input"
placeholder="Type your answer"
>

<button
id="btn2"
class="check-btn">

Check

</button>

</div>

`;

                const input1 =
                    document.getElementById("input1");

                const input2 =
                    document.getElementById("input2");

                const btn1 =
                    document.getElementById("btn1");

                const btn2 =
                    document.getElementById("btn2");

                btn1.disabled = true;
                btn2.disabled = true;

                input1.addEventListener("input", () => {

                    const pos = input1.selectionStart;

                    input1.value = toSentenceCase(input1.value);

                    input1.setSelectionRange(pos, pos);

                    btn1.disabled = input1.value.trim() === "";

                });

                input2.addEventListener("input", () => {

                    const pos = input2.selectionStart;

                    input2.value = toSentenceCase(input2.value);

                    input2.setSelectionRange(pos, pos);

                    btn2.disabled = input2.value.trim() === "";

                });

                /* HOLD */
                if (saved) {
                    input1.value = saved[0];
                    input2.value = saved[1];

                    input1.disabled = true;
                    input2.disabled = true;

                    btn1.disabled = true;
                    btn2.disabled = true;

                    input1.classList.add("correct");
                    input2.classList.add("correct");

                    nextBtn.disabled = false;

                }
                btn1.onclick = () => {

                    const value = input1.value.trim().toUpperCase();

                    if (value === "") return;

                    if (value === "CHINA") {

                        input1.value = toSentenceCase(value);
                        input1.classList.add("correct");
                        input1.disabled = true;
                        btn1.disabled = true;

                        showPopup("correctPopup");
                        speakText("Correct");

                        confetti({
                            particleCount: 90,
                            spread: 80
                        });

                        if (input1.disabled && input2.disabled) {
                            userAnswers[current] = [
                                toSentenceCase(input1.value),
                                toSentenceCase(input2.value)
                            ];
                            nextBtn.disabled = false;
                            score++;
                        }

                    } else {

                        input1.classList.add("wrong");
                        showPopup("wrongPopup");
                        speakText("Try again");

                        setTimeout(() => {
                            input1.classList.remove("wrong");
                            input1.value = "";
                        }, 500);
                    }
                };
                btn2.onclick = () => {

                    const value = input2.value.trim().toUpperCase();

                    if (value === "") return;

                    if (value === "INDIA") {

                        input2.value = toSentenceCase(value);
                        input2.classList.add("correct");
                        input2.disabled = true;
                        btn2.disabled = true;

                        showPopup("correctPopup");
                        speakText("Correct");

                        confetti({
                            particleCount: 90,
                            spread: 80
                        });

                        if (input1.disabled && input2.disabled) {
                            userAnswers[current] = [input1.value, input2.value];
                            nextBtn.disabled = false;
                            score++;
                        }

                    } else {

                        input2.classList.add("wrong");
                        showPopup("wrongPopup");
                        speakText("Try again");

                        setTimeout(() => {
                            input2.classList.remove("wrong");
                            input2.value = "";
                        }, 500);
                    }
                };
            }

            /* SINGLE */
            else {

                answerBox.innerHTML = `

<div class="input-group">

<input
type="text"
id="answerInput"
class="answer-input"
placeholder="Type your answer"
>

<button
id="checkBtn"
class="check-btn">

Check

</button>

</div>

`;

                const input =
                    document.getElementById("answerInput");

                const btn =
                    document.getElementById("checkBtn");

                btn.disabled = true;

                input.addEventListener("input", () => {

                    const pos = input.selectionStart;

                    input.value = toSentenceCase(input.value);

                    input.setSelectionRange(pos, pos);

                    btn.disabled = input.value.trim() === "";

                });

                /* HOLD */
                if (saved) {
                    input.value = saved;
                    input.disabled = true;

                    btn.disabled = true;

                    input.classList.add("correct");

                    nextBtn.disabled = false;

                }

                /* CHECK */
                btn.onclick = () => {

                    const value =
                        input.value.trim().toUpperCase();

                    /* Empty box */
                    if (value === "") return;

                    if (q.answers.includes(value)) {
                        input.value = toSentenceCase(value);


                        input.classList.add("correct");

                        input.disabled = true;

                        btn.disabled = true;

                        nextBtn.disabled = false;

                        userAnswers[current] = toSentenceCase(value);

                        score++;

                        showPopup("correctPopup");

                        speakText("Correct");

                        confetti({

                            particleCount: 90,
                            spread: 80

                        });

                        if (current === quizData.length - 1) {

                            setTimeout(() => {

                                document
                                    .getElementById("finalPopup")
                                    .classList.remove("hidden");

                                document
                                    .getElementById("scoreText")
                                    .innerHTML =

                                    `Score : ${score}/${quizData.length}`;

                                confetti({

                                    particleCount: 250,
                                    spread: 120

                                });

                            }, 1200);

                        }

                    }
                    else {

                        input.classList.add("wrong");

                        showPopup("wrongPopup");

                        speakText("Try again");

                        setTimeout(() => {

                            input.classList.remove("wrong");

                            input.value = "";

                        }, 500);

                    }

                };

            }

        }

        /* NEXT */
        nextBtn.onclick = () => {

            if (current <
                quizData.length - 1) {

                current++;

                loadQuestion();

            }

        };

        /* PREV */
        prevBtn.onclick = () => {

            if (current > 0) {

                current--;

                loadQuestion();

            }

        };

        /* START */
        loadQuestion();

    </script>

    <script id="codex-viewport-fit">
        (function () {
            if (window.__codexViewportFit) return;
            window.__codexViewportFit = true;

            const hasIframe = Boolean(document.querySelector("iframe"));
            const selectors = [
                ".main",
                ".main-container",
                ".quiz",
                ".quiz-container",
                ".quiz-box",
                ".container",
                ".stage",
                ".screen",
                ".game",
                ".template",
                ".quiz-card",
                ".app"
            ];
            const minScale = 0.62;
            let rafId = 0;

            function setViewportRules() {
                document.documentElement.style.width = "100%";
                document.documentElement.style.height = "100%";
                document.documentElement.style.overflow = "hidden";
                document.body.style.width = "100%";
                document.body.style.height = "100svh";
                document.body.style.minHeight = "100svh";
                document.body.style.overflow = "hidden";
            }

            function getStage() {
                for (const selector of selectors) {
                    const stage = document.querySelector(selector);
                    if (stage) return stage;
                }
                return null;
            }

            function fitToViewport() {
                setViewportRules();
                if (hasIframe) return;

                const stage = getStage();
                if (!stage) return;

                stage.style.transform = "scale(1)";
                stage.style.transformOrigin = "center center";

                const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                const rect = stage.getBoundingClientRect();
                const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                const scale = Math.max(
                    minScale,
                    Math.min(
                        1,
                        (viewportWidth - breathingRoom * 2) / contentWidth,
                        (viewportHeight - breathingRoom * 2) / contentHeight
                    )
                );

                stage.style.transform = `scale(${scale})`;
            }

            function requestFit() {
                cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(fitToViewport);
            }

            window.addEventListener("load", requestFit);
            window.addEventListener("resize", requestFit);
            window.addEventListener("orientationchange", requestFit);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(requestFit).catch(function () { });
            }

            document.querySelectorAll("img").forEach(function (img) {
                img.addEventListener("load", requestFit, { once: false });
            });

            if ("ResizeObserver" in window) {
                const observer = new ResizeObserver(requestFit);
                const observeStage = function () {
                    const stage = getStage();
                    if (stage) observer.observe(stage);
                };
                observeStage();
                window.addEventListener("load", observeStage);
            }

            if (document.body) {
                new MutationObserver(requestFit).observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }

            requestFit();
        })();
    </script>
