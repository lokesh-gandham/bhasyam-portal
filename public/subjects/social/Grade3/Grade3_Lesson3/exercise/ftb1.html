<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fill in the Blanks Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* MAIN */
.main{
width:100%;
  max-width:1200px;
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
}
.question-text{
margin-bottom:5px;   /* small gap */
text-align:center;

font-size:clamp(22px,3vw,34px);
color:#2f4f4f;
line-height:1.3;

/* ❌ REMOVE THESE */
min-height:auto;
display:block;
}

/* IMAGE */
.image img{
width:300px;
height:150px;
object-fit:contain;
margin-top: -10px;
}
.slot-container{
position:relative;
display:flex;

/* 🔥 KEY FIX */
flex-wrap: nowrap;   /* NO wrapping */

gap:10px;
padding:15px 20px;
border-radius:25px;

justify-content:center;
overflow:hidden;

background:#d0ebff;
}
.progress-fill{
position:absolute;
top:0;
left:0;
height:100%;
width:0%;

background:linear-gradient(135deg,#ff9a9e,#fbc2eb,#f6d365);

transition:width 0.3s ease;
z-index:0;
border-radius:25px;
}

/* SLOT */
.slot{
width:55px;
height:65px;
border-radius:16px;
border:3px dashed #74c0fc;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
font-weight:600;
box-shadow:0 6px 0 #cde7ff;
position:relative;
z-index:1;
}

.slot.correct{
background:#caffbf;
border:3px solid #00c853;
}

.slot.wrong{
background:#ffadad;
border:3px solid #d00000;
}

/* LETTER */
.pool{
display:flex;
flex-wrap:wrap;
gap:12px;
justify-content:center;
}

.letter{
width:55px;
height:55px;
border-radius:16px;
background:linear-gradient(#fff3b0,#ffe066);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:600;
cursor:pointer;
box-shadow:0 6px 0 #ffbe0b;
}

.letter.used{
opacity:0.3;
pointer-events:none;
}

/* NAV */
.nav-buttons{
display:flex;
gap:15px;
margin-top: 5px;
}

button{
padding:12px 25px;   /* 🔥 bigger */
    font-size:18px;      /* 🔥 bigger text */
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-weight:600;
}

.prev{background:#4cc9f0;color:white;}
.next{background:#ffbe0b;}
.next:disabled{background:#ccc;}

/* POPUP */
.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0.5);
padding:40px;
border-radius:30px;
display:none;
animation:pop 0.4s forwards;
z-index:100;
}

@keyframes pop{
to{ transform:translate(-50%,-50%) scale(1); }
}

.correct-popup{background:#b9fbc0;}
.wrong-popup{background:#ffadad;}

.final-popup{
background:#fff3b0;
border:3px solid #ffbe0b;
box-shadow:0 0 30px #ffbe0b;
padding:50px;
font-size:26px;
}

/* BUTTON SAME */
.play-again{
margin-top:20px;
display:block;
margin-left:auto;
margin-right:auto;

padding:14px 30px;
border:none;
border-radius:30px;
background:linear-gradient(135deg,#06d6a0,#1b9aaa);
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

.play-again:hover{
transform:scale(1.1);
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}
#finalText{
font-weight:600;
}

#finalText{font-weight:600;}


/* =========================
   📱 MOBILE (0–600px)
========================= */
@media (max-width:600px){

body{
    align-items:center;
    padding:10px;
}

/* MAIN FIX */
.main{
    width:100%;
}

/* QUESTION */
.question-text{
    font-size:20px;
    padding:0 10px;
}

/* IMAGE SMALL */
.image img{
    width:100%;
    max-width:180px;
    height:auto;
}

/* 🔥 SLOTS WRAP (IMPORTANT) */
.slot-container{
    flex-wrap:wrap;
    gap:8px;
    padding:10px;
}

/* SLOT SMALL */
.slot{
    width:40px;
    height:50px;
    font-size:20px;
}

/* LETTER SMALL */
.letter{
    width:40px;
    height:45px;
    font-size:18px;
}

/* NAV SMALL */
.nav-buttons{
    gap:10px;
}

button{
    padding:10px 16px;
    font-size:15px;
}
.popup{
    width:50%;
    max-width:260px;
    padding:18px;
    border-radius:20px;
}

/* TEXT SIZE SMALL */
.popup h4{
    font-size:20px !important;
}

/* FINAL POPUP */
.final-popup{
    width:85%;
    max-width:280px;
    padding:20px;
    font-size:18px;
}

/* PLAY AGAIN BUTTON */
.play-again{
    padding:10px 18px;
    font-size:14px;
}
}


/* =========================
   📲 TABLET (601px–900px)
========================= */
@media (min-width:601px) and (max-width:900px){

.main{
    width:100%;
}

/* IMAGE MEDIUM */
.image img{
    width:250px;
    height: 150px;
}

/* 🔥 ALLOW WRAP */
.slot-container{
    flex-wrap:wrap;
}

/* SLOT MEDIUM */
.slot{
    width:45px;
    height:55px;
    font-size:22px;
}

.letter{
    width:45px;
    height:50px;
    font-size:20px;
}

/* BUTTON FIX */
button{
    padding:12px 22px;
    font-size:16px;
}
}

/* ============================= */
/* 💻 Desktop (1025px - 1440px) */
/* ============================= */
@media screen and (min-width:1025px) and (max-width:1440px){

  .main{
    max-width:1200px;
  }

  .question-text{
    font-size:32px;
  }

}


/* ============================= */
/* 🖥 Large Monitor (1441px - 1920px) */
/* ============================= */
@media screen and (min-width:1441px) and (max-width:1920px){

  .main{
    max-width:1500px;   /* 🔥 bigger */
  }

  .question-text{
    font-size:45px;
    max-width:1300px;
  }

  .image img{
    width:380px;
    height:auto;
  }

  .slot{
    width:70px;
    height:80px;
    font-size:32px;
  }

  .letter{
    width:70px;
    height:70px;
    font-size:28px;
  }

  button{
    font-size:22px;
    padding:20px 36px;
  }

}


/* ============================= */
/* 🧠 4K Screens (1921px+) */
/* ============================= */
@media screen and (min-width:1921px){

  .main{
    max-width:1800px;   /* 🔥 very large */
  }

  .question-text{
    font-size:48px;
    max-width:1500px;
  }

  .image img{
    width:450px;
  }

  .slot{
    width:85px;
    height:95px;
    font-size:40px;
  }

  .letter{
    width:85px;
    height:85px;
    font-size:34px;
  }

  button{
    font-size:26px;
    padding:24px 44px;
  }

}
</style>
<style id="codex-responsive-shell">
html {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    max-width: 100%;
    overflow: hidden;
}

img,
svg,
canvas,
video {
    max-width: 100%;
}

iframe {
    display: block;
    max-width: 100%;
}

body:has(iframe) {
    width: 100%;
    height: 100svh;
    min-height: 100svh;
    overflow: hidden;
}

body:has(iframe) .app,
body:has(iframe) .frame,
body:has(iframe) .board {
    max-width: 100%;
    max-height: 100svh;
    min-height: 0;
}

body:has(iframe) .app {
    height: 100svh;
}

body:has(iframe) .board {
    width: min(1250px, calc(100vw - 16px));
    height: min(570px, calc(100svh - 16px));
}

body:has(iframe) .content,
body:has(iframe) .main,
body:has(iframe) .screen,
body:has(iframe) .iframe-wrapper {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

body:has(iframe) iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

@media (min-width: 1025px) {
    body:has(iframe) .sidebar {
        width: clamp(190px, 17vw, 300px);
        min-width: 0;
        min-height: 0;
    }

    body:has(iframe) .topbar,
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .nav-group {
        flex-shrink: 0;
    }

    body:has(iframe) .nav-container,
    body:has(iframe) .nav-wrapper,
    body:has(iframe) .sidebar-scroll,
    body:has(iframe) .menu {
        max-height: 100svh;
        overflow: hidden;
    }

    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(10px, 2.8vw, 44px);
        padding: clamp(6px, 1.4dvh, 14px) clamp(8px, 1.4vw, 20px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        min-height: 0;
        max-width: 100%;
    }
}

@media (min-width: 1025px) and (max-height: 760px) {
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(8px, 2vw, 24px);
        padding-block: clamp(4px, 1dvh, 10px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        padding: clamp(8px, 1.4dvh, 14px) clamp(10px, 1.4vw, 22px);
        font-size: clamp(15px, 1.2vw, 20px);
    }

    body:has(iframe) .puzzle {
        width: clamp(150px, 14vw, 210px);
        height: clamp(54px, 8dvh, 70px);
    }

    body:has(iframe) .sidebar {
        width: clamp(190px, 16vw, 240px);
    }
}
</style>
</head>

<body>

<div class="main">

<div class="question-text" id="questionText"></div>

<div class="image">
<img id="questionImage">
</div>
<div class="slot-container" id="slots">
  <div class="progress-fill" id="progressFill"></div>
</div>
<div class="pool" id="pool"></div>

<div class="nav-buttons">
<button class="prev" onclick="prevQ()">← Prev</button>
<button class="next" id="nextBtn" onclick="nextQ()" disabled>Next →</button>
</div>

</div>

<div class="popup" id="popup"></div>

<div class="popup final-popup" id="finalPopup">
<h2 id="finalText"></h2>
<button class="play-again" onclick="restartQuiz()">🔄 Play Again</button>
</div>

<script>

/* QUESTIONS */
const questions=[
{
q:"Q1. The ___ are sharp and pointed teeth which help in tearing food.",
a:"canines",
img:"../images/ftb1.png"
},
{
q:"Q2. The ___ have a flat surface and ridges on top. These help to crush food.",
a:"premolars",
img:"../images/ftb2.png"
},
{
q:"Q3. The ___ is the innermost part of the tooth and it lies below the dentine.",
a:"pulp",
img:"../images/ftb3.png"
},
{
q:"Q4. The germs cause the tooth to ___.",
a:"decay",
img:"../images/ftb4.png"
},
{
q:"Q5. The swallowed food from the mouth enters a hollow, tube-like organ called the ___.",
a:"foodpipe",
img:"../images/ftb5.png"
}
];

let index=0,score=0;
let userAnswers=new Array(questions.length).fill(null);

/* 🔥 NEW: TRACK FILLED SLOTS */
let filledSlots = [];

/* SPEECH */
function speak(text){
let msg=new SpeechSynthesisUtterance(text);
let voices=speechSynthesis.getVoices();
let uk=voices.find(v=>v.lang==="en-GB");
if(uk) msg.voice=uk;
speechSynthesis.cancel();
speechSynthesis.speak(msg);
}
speechSynthesis.onvoiceschanged=()=>{};

/* 🔥 UPDATE PROGRESS */
function updateProgress(){
let slots=[...document.querySelectorAll(".slot")];
let filled=slots.filter(s=>s.textContent!=="").length;
let percent=(filled/slots.length)*100;
document.getElementById("progressFill").style.width=percent+"%";
}

/* LOAD */
function renderQuestion(){

let q=questions[index];
questionImage.src=q.img;
questionText.innerHTML = q.q.replace(
  "_____",
  "<span style='border-bottom:2px dashed #333; padding:0 25px;'> </span>"
);

let answer=q.a.toUpperCase();

/* 🔥 RESET TRACK */
filledSlots = [];

slots.innerHTML = '<div class="progress-fill" id="progressFill"></div>';
pool.innerHTML="";

/* slots */
for(let i=0;i<answer.length;i++){
slots.innerHTML+=`<div class="slot"></div>`;
}

/* restore */
if(userAnswers[index]){

let saved=userAnswers[index];
let slotEls=[...document.querySelectorAll(".slot")];

saved.word.split("").forEach((ch,i)=>{
slotEls[i].textContent=ch;
slotEls[i].classList.add("correct");
});

nextBtn.disabled=false;

}else{

let letters=answer.split("").sort(()=>Math.random()-0.5);

letters.forEach(l=>{
pool.innerHTML+=`<div class="letter" onclick="selectLetter(this)">${l}</div>`;
});

nextBtn.disabled=true;
}

updateProgress();
}

/* CLICK LETTER */
function selectLetter(el){

if(el.classList.contains("used")) return;

let slotsArr=[...document.querySelectorAll(".slot")];
let empty=slotsArr.find(s=>s.textContent==="");

if(!empty) return;

/* fill */
empty.textContent=el.textContent;

/* 🔥 TRACK */
filledSlots.push({
slot: empty,
letter: el
});

/* mark used */
el.classList.add("used");

updateProgress();
checkAnswer();
}

/* 🔥 BACKSPACE LOGIC */
document.addEventListener("keydown", function(e){

if(e.key !== "Backspace") return;

if(filledSlots.length === 0) return;

let last = filledSlots.pop();

/* clear slot */
last.slot.textContent="";
last.slot.classList.remove("correct","wrong");

/* restore letter */
last.letter.classList.remove("used");

updateProgress();
});

/* CHECK */
function checkAnswer(){

let slotsArr=[...document.querySelectorAll(".slot")];
let word=slotsArr.map(s=>s.textContent).join("").toLowerCase();
let correct=questions[index].a.toLowerCase();

if(word.length!==correct.length) return;

if(word===correct){

slotsArr.forEach(s=>s.classList.add("correct"));

userAnswers[index]={word:word};

score++;
confetti();
showPopup("🎉 Correct!");
speak("Correct");

nextBtn.disabled=false;

if(index===questions.length-1){
setTimeout(showFinal,1000);
}

}else{

slotsArr.forEach(s=>s.classList.add("wrong"));
showPopup("❌ Try again!");
speak("Try again");

setTimeout(()=>{
slotsArr.forEach(s=>{
s.textContent="";
s.classList.remove("wrong");
});
document.querySelectorAll(".letter").forEach(l=>l.classList.remove("used"));

/* 🔥 RESET TRACK */
filledSlots = [];

updateProgress();

},800);
}
}

/* POPUP */
function showPopup(text){
popup.innerHTML=`<h4 style="font-size:34px;font-weight:600;">${text}</h4>`;
popup.className="popup "+(text.includes("Correct")?"correct-popup":"wrong-popup");
popup.style.display="block";
setTimeout(()=>popup.style.display="none",2000);
}

/* NAV */
function nextQ(){
if(index<questions.length-1){
index++;
renderQuestion();
}else showFinal();
}

function prevQ(){
if(index>0){
index--;
renderQuestion();
}
}

/* FINAL */
function showFinal(){
document.getElementById("finalText").innerHTML=
`<span style="font-weight:600">🏆 Score: ${score}/${questions.length}</span>`;

document.getElementById("finalPopup").style.display="block";
}

/* RESET */
function restartQuiz(){
index=0;
score=0;
userAnswers.fill(null);
finalPopup.style.display="none";
renderQuestion();
}

/* INIT */
renderQuestion();

</script>

<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
</body>
</html>
