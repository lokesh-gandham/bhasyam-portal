<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
}

body{

width:100%;
height:100vh;

overflow:hidden;


}

/* MAIN */
.game{

width:100%;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

}

/* BOX */
.quiz-box{

width:100%;
max-width:1350px;

height:95vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

}

/* AREA */
.match-area{

width:100%;

display:flex;
justify-content:center;
align-items:center;

gap:120px;

}

/* COLUMN */
.column{

width:35%;

display:flex;
flex-direction:column;

gap:22px;

}

/* CARD */
.card{

height:80px;

padding:14px 18px;

border-radius:30px;

display:flex;
align-items:center;

gap:18px;

cursor:pointer;

position:relative;

transition:.25s;

user-select:none;
background:#F5EEFF;

    border:2px solid #D7C4F8;

    box-shadow:
        0 6px 14px rgba(143,114,196,.12);


}


/* IMAGE */
.img-circle{

width:75px;
height:75px;

border-radius:50%;


display:flex;
justify-content:center;
align-items:center;

flex-shrink:0;

}

/* IMAGE */
.img-circle img{

width:95%;
height:95%;

object-fit:contain;

}

/* TEXT */
.text{

flex:1;

font-size:20px;

color:#2f4f4f;

line-height:1.3;

}

/* ACTIVE */
.active{

transform:scale(1.04);

outline:3px solid white;

box-shadow:
0 0 20px rgba(78,205,196,.5);

}

/* CORRECT */
.correct{

pointer-events:none;

background:
linear-gradient(
135deg,
#c3fae8,
#b6e7d8
);

border-color:#77d1cb;

}

/* BADGE */
.match-badge{

position:absolute;

top:-12px;
right:-12px;

width:35px;
height:35px;

border-radius:50%;

background:
linear-gradient(
135deg,
#4facfe,
#00f2fe
);

display:flex;
justify-content:center;
align-items:center;

font-size:20px;

color:white;

font-weight:600;

box-shadow:
0 8px 18px rgba(255,159,28,.4);

animation:popBadge .3s;

}

/* BADGE */
@keyframes popBadge{

0%{
transform:scale(0);
}

100%{
transform:scale(1);
}

}

/* WRONG */
@keyframes shake{

0%{transform:translateX(0);}
25%{transform:translateX(-7px);}
50%{transform:translateX(7px);}
75%{transform:translateX(-7px);}
100%{transform:translateX(0);}

}

.wrong{

animation:shake .35s;

}

/* FINAL */
.final-box{

position:fixed;

inset:0;

display:flex;
justify-content:center;
align-items:center;



z-index:999;

}

/* HIDE */
.hidden{
display:none;
}

/* FINAL CARD */
.final-card{

width:380px;

padding:28px 20px;

border-radius:40px;

text-align:center;

background:
linear-gradient(
135deg,
#d9f0ff,
#cdb4ff
);

border:6px solid #9b5de5;

animation:pop .35s;

}

/* POP */
@keyframes pop{

0%{
transform:scale(.5);
opacity:0;
}

100%{
transform:scale(1);
opacity:1;
}

}

/* EMOJI */
.final-emoji{

font-size:85px;

margin-bottom:12px;

}

/* TITLE */
.final-title{

font-size:40px;

color:#2f4f4f;

margin-bottom:10px;

}

/* SCORE */
.final-score{

font-size:24px;

color:#2f4f4f;

}

/* BUTTON */
.play-btn{

margin-top:18px;

border:none;

padding:13px 28px;

font-size:22px;

border-radius:18px;

cursor:pointer;

background:#9b5de5;

color:white;


}

<style id="codex-responsive-shell">
html {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    max-width: 100%;
    overflow: hidden;
}

img,
svg,
canvas,
video {
    max-width: 100%;
}

iframe {
    display: block;
    max-width: 100%;
}

body:has(iframe) {
    width: 100%;
    height: 100svh;
    min-height: 100svh;
    overflow: hidden;
}

body:has(iframe) .app,
body:has(iframe) .frame,
body:has(iframe) .board {
    max-width: 100%;
    max-height: 100svh;
    min-height: 0;
}

body:has(iframe) .app {
    height: 100svh;
}

body:has(iframe) .board {
    width: min(1250px, calc(100vw - 16px));
    height: min(570px, calc(100svh - 16px));
}

body:has(iframe) .content,
body:has(iframe) .main,
body:has(iframe) .screen,
body:has(iframe) .iframe-wrapper {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

body:has(iframe) iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

@media (min-width: 1025px) {
    body:has(iframe) .sidebar {
        width: clamp(190px, 17vw, 300px);
        min-width: 0;
        min-height: 0;
    }

    body:has(iframe) .topbar,
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .nav-group {
        flex-shrink: 0;
    }

    body:has(iframe) .nav-container,
    body:has(iframe) .nav-wrapper,
    body:has(iframe) .sidebar-scroll,
    body:has(iframe) .menu {
        max-height: 100svh;
        overflow: hidden;
    }

    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(10px, 2.8vw, 44px);
        padding: clamp(6px, 1.4dvh, 14px) clamp(8px, 1.4vw, 20px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        min-height: 0;
        max-width: 100%;
    }
}

@media (min-width: 1025px) and (max-height: 760px) {
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,

<body>

<div class="game">

<div class="quiz-box">

<div class="match-area">

<!-- LEFT -->
<div class="column left"
id="leftColumn">
</div>

<!-- RIGHT -->
<div class="column right"
id="rightColumn">
</div>

</div>

</div>

</div>

<!-- FINAL -->
<div class="final-box hidden"
id="finalPopup">

<div class="final-card">

<div class="final-emoji">
🏆
</div>

<div class="final-title">
Amazing!
</div>

<div class="final-score"
id="finalScore">
</div>

<button
class="play-btn"
onclick="location.reload()">

🎊 Play Again

</button>

</div>

</div>

<script>

/* SPEECH */
 function speakText(text){

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang="en-UK";

speech.rate=1;

speech.pitch=1;

speech.volume=0.25;

speechSynthesis.speak(speech);

}

/* DATA */
const leftData=[

{
id:"b",
text:"Assam",
img:"../images/assam.png"
},

{
id:"a",
text:"Haryana",
img:"../images/haryana.png"
},

{
id:"d",
text:"Nagaland",
img:"../images/nagaland.png"
},

{
id:"e",
text:"Rajasthan",
img:"../images/rajasthan.png"
},

{
id:"c",
text:"West bengal",
img:"../images/westbengal.png"
}

];

const rightData=[

{
id:"a",
text:"Chandigarh"
},

{
id:"b",
text:"Dispur"
},

{
id:"c",
text:"Kolkata"
},

{
id:"d",
text:"Kohima"
},

{
id:"e",
text:"Jaipur"
}

];

/* ELEMENTS */
const leftColumn=
document.getElementById("leftColumn");

const rightColumn=
document.getElementById("rightColumn");

/* VARIABLES */
let selected=null;

let score=0;

let matchCount=0;

/* LEFT */
leftData.forEach((item)=>{

const card=
document.createElement("div");

card.className="card";

card.dataset.match=item.id;

card.innerHTML=`

<div class="img-circle">

<img src="${item.img}">

</div>

<div class="text">
${item.text}
</div>

`;

card.onclick=()=>{

if(card.classList.contains("correct"))
return;

document
.querySelectorAll(".left .card")
.forEach(c=>
c.classList.remove(
"active"
)
);

card.classList.add(
"active"
);

selected=card;

};

leftColumn.appendChild(card);

});

/* RIGHT */
rightData.forEach((item)=>{

const card=
document.createElement("div");

card.className="card";

card.dataset.match=item.id;

card.innerHTML=`

<div class="text">
${item.text}
</div>

`;

card.onclick=()=>{

if(!selected)
return;

if(card.classList.contains("correct"))
return;

/* CORRECT */
if(
selected.dataset.match===
card.dataset.match
){

matchCount++;

selected.classList.add(
"correct"
);

card.classList.add(
"correct"
);

selected.classList.remove(
"active"
);

/* LEFT BADGE */
const leftBadge=
document.createElement("div");

leftBadge.className=
"match-badge";

leftBadge.innerHTML=
matchCount;

selected.appendChild(
leftBadge
);

/* RIGHT BADGE */
const rightBadge=
document.createElement("div");

rightBadge.className=
"match-badge";

rightBadge.innerHTML=
matchCount;

card.appendChild(
rightBadge
);

score++;

speakText(
"Correct"
);

confetti({

particleCount:80,
spread:70

});

/* FINAL */
if(score===5){

setTimeout(()=>{

document
.getElementById("finalPopup")
.classList.remove(
"hidden"
);

document
.getElementById("finalScore")
.innerHTML=

`Score : ${score}/5`;

confetti({

particleCount:250,
spread:120

});

},1000);

}

}

/* WRONG */
else{

card.classList.add(
"wrong"
);

selected.classList.add(
"wrong"
);

setTimeout(()=>{

card.classList.remove(
"wrong"
);

selected.classList.remove(
"wrong"
);

},350);

speakText(
"Try again"
);

}

};

rightColumn.appendChild(card);

});

</script>

<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
