<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kids MCQ Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;700&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Livvic';
}

body{

width:100%;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:10px;

overflow:hidden;
}
.quiz-container{

width:min(1150px,100%);

height:min(95vh,900px);

display:flex;
flex-direction:column;

justify-content:center;

align-items:center;

gap:20px;

padding:18px;

border-radius:40px;

overflow:hidden;

margin:auto;

}
/* QUESTION */
.question{

width:100%;

min-height:90px;
max-height:90px;

display:flex;
justify-content:center;
align-items:center;

text-align:left;

font-size:30px;

line-height:1.3;

color:#2f4f4f;

flex-shrink:0;

overflow:hidden;

padding:0 20px;

}

/* IMAGE */
.image-box{

width:100%;

display:flex;
justify-content:center;
align-items:center;

flex-shrink:0;

}

/* IMAGE FRAME */
.image-frame{

width:100%;
max-width:400px;

height:200px;

background:
linear-gradient(
135deg,
#fff0f6,
#edf7ff
);

border-radius:28px;

padding:15px;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

}

/* IMAGE */
.image-frame img{

width:100%;
height:100%;

object-fit:contain;

}

/* OPTIONS */
.options{

width:100%;

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:12px;

align-items:center;

}

/* OPTION */
.option{

width:100%;

height:95px;

border-radius:22px;

padding:10px 12px;

display:flex;
align-items:center;

gap:10px;

cursor:pointer;

position:relative;

overflow:hidden;

transition:.25s;

}

/* COLORS */
.option:nth-child(1){

background:#ffd8e8;
}

.option:nth-child(2){

background:#d8f8e1;
}

.option:nth-child(3){

background:#dbeafe;
}


.option:nth-child(1)::before{
background:#ff4f87;
}

.option:nth-child(2)::before{
background:#20bf55;
}

.option:nth-child(3)::before{
background:#3a86ff;
}
/* ICON */
.option-icon{

width:80px;
height:80px;

/* CIRCLE */
border-radius:50%;

/* PASTEL BG */


display:flex;
justify-content:center;
align-items:center;


flex-shrink:0;

position:relative;

z-index:2;

/* SOFT BORDER */


}
/* IMAGE */
.option-icon img{

width:100%;
height:100%;

object-fit:contain;

}

/* TEXT */
.option-text{

font-size:20px;

color:#2f4f4f;

position:relative;

z-index:2;

}

/* HOVER */
.option:hover{

transform:translateY(-3px);

}

/* CORRECT */
.option.correct{

outline:4px solid #06d6a0;

pointer-events:none;

}

/* WRONG */
.option.wrong{

background:#ffd6d6;

}

/* NAV */
.nav{

width:100%;

display:flex;
justify-content:space-around;
align-items:center;

gap:20px;

margin-top:10px;

flex-shrink:0;

}

/* BUTTON */
.nav-btn{

width:130px;
height:50px;

border:none;

font-size:20px;

cursor:pointer;

color:white;

transition:.25s;

}

/* PREV */
.prev-btn{

background:
linear-gradient(
135deg,
#52b788,
#74c69d
);

border-radius:
32px 14px 32px 14px;

}

/* NEXT */
.next-btn{

background:
linear-gradient(
135deg,
#c77dff,
#b5179e
);

border-radius:
14px 32px 14px 32px;

}

/* DISABLE */
.next-btn:disabled{

opacity:.45;

cursor:not-allowed;

}

/* HOVER */
.nav-btn:hover{

transform:scale(1.05);

}

/* POPUP */
.popup{

position:fixed;

inset:0;

display:flex;
justify-content:center;
align-items:center;



z-index:999;

}

/* HIDE */
.hidden{
display:none;
}

/* POPUP BOX */
.popup-box{

width:330px;

padding:28px 20px;

border-radius:36px;

text-align:center;

position:relative;

overflow:hidden;

animation:pop .35s;

}

/* CORRECT */
.correct-popup .popup-box{

background:
linear-gradient(
135deg,
#c8f7dc,
#b5ead7
);

border:6px solid #57cc99;

}

/* WRONG */
.wrong-popup .popup-box{

background:
linear-gradient(
135deg,
#ffd6e0,
#ffc2d1
);

border:6px solid #ff5d8f;

}

/* FINAL */
.final-popup .popup-box{

background:
linear-gradient(
135deg,
#d9f0ff,
#cdb4ff
);

border:6px solid #9b5de5;

}

/* POP */
@keyframes pop{

0%{
transform:scale(.5);
opacity:0;
}

100%{
transform:scale(1);
opacity:1;
}

}

/* EMOJI */
.popup-emoji{

font-size:85px;

margin-bottom:8px;

}

/* TITLE */
.popup-title{

font-size:40px;

color:#2f4f4f;

}

/* SCORE */
.popup-score{

font-size:24px;

margin-top:10px;

color:#2f4f4f;

}

/* PLAY */
.play-btn{

margin-top:18px;

border:none;

padding:13px 28px;

font-size:22px;

border-radius:18px;

cursor:pointer;

background:#9b5de5;

color:white;

}

/* ================= MONITOR ================= */

@media screen and (min-width:1225px) and (max-width:1440px){

/* MAIN */
.quiz-container{

width:min(1500px,100%);

height:min(96vh,980px);

gap:26px;

padding:28px;

border-radius:50px;

}

/* QUESTION */
.question{

min-height:120px;
max-height:120px;

font-size:40px;

line-height:1.2;

padding:0 30px;
margin-top: -40px;
}

/* IMAGE FRAME */
.image-frame{

max-width:500px;

height:240px;

border-radius:38px;

padding:10px;


}

/* OPTIONS */
.options{

gap:22px;

}

/* OPTION */
.option{

height:125px;

border-radius:30px;

padding:14px 16px;

gap:14px;

}

/* SIDE */
.option::before{

width:12px;

}

/* ICON */
.option-icon{

width:110px;
height:110px;


}

/* TEXT */
.option-text{

font-size:32px;

line-height:1.3;

}

/* NAV */
.nav{

margin-top:16px;

}

/* BUTTON */
.nav-btn{

width:190px;
height:64px;

font-size:30px;

}

/* POPUP */
.popup-box{

width:450px;

padding:36px 28px;

border-radius:44px;

}

/* EMOJI */
.popup-emoji{

font-size:120px;

}

/* TITLE */
.popup-title{

font-size:52px;

}

/* SCORE */
.popup-score{

font-size:32px;

}

/* PLAY */
.play-btn{

font-size:28px;

padding:16px 32px;

border-radius:22px;

}

}

/* ================= LARGE MONITOR ================= */

@media screen and (min-width:1441px) and (max-width:1920px){

/* MAIN */
.quiz-container{

width:min(1900px,100%);

height:min(97vh,1250px);

gap:34px;

padding:40px;

border-radius:60px;

}

/* QUESTION */
.question{

min-height:120px;
max-height:120px;

font-size:40px;

line-height:1.45;

padding:0 50px;

}

/* IMAGE FRAME */
.image-frame{

max-width:500px;

height:280px;

border-radius:50px;

padding:28px;

}

/* OPTIONS */
.options{

gap:30px;

}

/* OPTION */
.option{

height:140px;

border-radius:42px;

padding:20px 24px;

gap:20px;

}

/* SIDE */
.option::before{

width:16px;

}

/* ICON */
.option-icon{

width:110px;
height:110px;

border-radius:34px;

padding:16px;

border-width:5px;

}

/* TEXT */
.option-text{

font-size:35px;

line-height:1.35;

}

/* NAV */
.nav{

margin-top:24px;

}

/* BUTTON */
.nav-btn{

width:240px;
height:82px;

font-size:40px;

}

/* POPUP */
.popup-box{

width:450px;

padding:36px 28px;

border-radius:44px;

}

/* EMOJI */
.popup-emoji{

font-size:120px;

}

/* TITLE */
.popup-title{

font-size:52px;

}

/* SCORE */
.popup-score{

font-size:32px;

}

/* PLAY */
.play-btn{

font-size:28px;

padding:16px 32px;

border-radius:22px;

}

}

</style>

<style id="codex-responsive-shell">
html {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    max-width: 100%;
    overflow: hidden;
}

img,
svg,
canvas,
video {
    max-width: 100%;
}

iframe {
    display: block;
    max-width: 100%;
}

body:has(iframe) {
    width: 100%;
    height: 100svh;
    min-height: 100svh;
    overflow: hidden;
}

body:has(iframe) .app,
body:has(iframe) .frame,
body:has(iframe) .board {
    max-width: 100%;
    max-height: 100svh;
    min-height: 0;
}

body:has(iframe) .app {
    height: 100svh;
}

body:has(iframe) .board {
    width: min(1250px, calc(100vw - 16px));
    height: min(570px, calc(100svh - 16px));
}

body:has(iframe) .content,
body:has(iframe) .main,
body:has(iframe) .screen,
body:has(iframe) .iframe-wrapper {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

body:has(iframe) iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

@media (min-width: 1025px) {
    body:has(iframe) .sidebar {
        width: clamp(190px, 17vw, 300px);
        min-width: 0;
        min-height: 0;
    }

    body:has(iframe) .topbar,
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .nav-group {
        flex-shrink: 0;
    }

    body:has(iframe) .nav-container,
    body:has(iframe) .nav-wrapper,
    body:has(iframe) .sidebar-scroll,
    body:has(iframe) .menu {
        max-height: 100svh;
        overflow: hidden;
    }

    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(10px, 2.8vw, 44px);
        padding: clamp(6px, 1.4dvh, 14px) clamp(8px, 1.4vw, 20px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        min-height: 0;
        max-width: 100%;
    }
}

@media (min-width: 1025px) and (max-height: 760px) {
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(8px, 2vw, 24px);
        padding-block: clamp(4px, 1dvh, 10px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        padding: clamp(8px, 1.4dvh, 14px) clamp(10px, 1.4vw, 22px);
        font-size: clamp(15px, 1.2vw, 20px);
    }

    body:has(iframe) .puzzle {
        width: clamp(150px, 14vw, 210px);
        height: clamp(54px, 8dvh, 70px);
    }

    body:has(iframe) .sidebar {
        width: clamp(190px, 16vw, 240px);
    }
}
</style>
</head>

<body>

<div class="quiz-container">

<!-- QUESTION -->
<div class="question"
id="question">
</div>

<!-- IMAGE -->
<div class="image-box">

<div class="image-frame">

<img id="questionImage"
src="">

</div>

</div>

<!-- OPTIONS -->
<div class="options"
id="options">
</div>

<!-- NAV -->
<div class="nav">

<button class="nav-btn prev-btn"
id="prevBtn">

⬅ Prev

</button>

<button class="nav-btn next-btn"
id="nextBtn"
disabled>

Next ➡

</button>

</div>

</div>

<!-- CORRECT -->
<div class="popup correct-popup hidden"
id="correctPopup">

<div class="popup-box">

<div class="popup-emoji">
🎉
</div>

<div class="popup-title">
Correct!
</div>

</div>

</div>

<!-- WRONG -->
<div class="popup wrong-popup hidden"
id="wrongPopup">

<div class="popup-box">

<div class="popup-emoji">
😢
</div>

<div class="popup-title">
Oops!
</div>

</div>

</div>

<!-- FINAL -->
<div class="popup final-popup hidden"
id="finalPopup">

<div class="popup-box">

<div class="popup-emoji">
🏆
</div>

<div class="popup-title">
Awesome!
</div>

<div class="popup-score"
id="scoreText">
</div>

<button class="play-btn"
onclick="location.reload()">

🎊 Play Again

</button>

</div>

</div>

<script>

/* SPEECH */
 function speakText(text){

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang="en-UK";

speech.rate=1;

speech.pitch=1;

speech.volume=0.25;

speechSynthesis.speak(speech);

}
/* QUESTIONS */
const quizData=[

{
question:
"India is located in the _____ part of Asia.",

options:[

{
text:"Northern",
img:"../images/north.png"
},

{
text:"Southern",
img:"../images/south.png"
},

{
text:"Eastern",
img:"../images/eastimg.png"
}

],

correct:1,

image:"../images/mcq1.png"
},

{
question:
"There are _____ states and _____ union territories in India.",

options:[

{
text:"28 and 8",
img:"../images/india28.png"
},

{
text:"25 and 8",
img:"../images/india25.png"
},

{
text:"27 and 9",
img:"../images/india27.png"
}

],

correct:0,

image:"../images/mcq2.png"
},

{
question:
"The capital of Telangana is _____.",

options:[

{
text:"Patna",
img:"../images/patna.png"
},

{
text:"Chennai",
img:"../images/chennai.png"
},

{
text:"Hyderabad",
img:"../images/hyderabad.png"
}

],

correct:2,

image:"../images/mcq3.png"
},

{
question:
"_____ is the major religion practised in India, followed by Islam and Christianity.",

options:[

{
text:"Buddhism",
img:"../images/buddhism.png"
},

{
text:"Hinduism",
img:"../images/hinduism.png"
},

{
text:"Sikhism",
img:"../images/sikhism.png"
}

],

correct:1,

image:"../images/mcq4.png"
},

{
question:
"Dhaka is the capital of _____.",

options:[

{
text:"Bangladesh",
img:"../images/bangladesh.png"
},

{
text:"Pakistan",
img:"../images/pakistan.png"
},

{
text:"Afghanistan",
img:"../images/afghanistan.png"
}

],

correct:0,

image:"../images/mcq55.png"
}

];

/* ELEMENTS */
const question=
document.getElementById("question");

const image=
document.getElementById("questionImage");

const options=
document.getElementById("options");

const nextBtn=
document.getElementById("nextBtn");

const prevBtn=
document.getElementById("prevBtn");

/* VARIABLES */
let current=0;

let score=0;

let userAnswers=
new Array(quizData.length)
.fill(null);

/* POPUP */
function showPopup(id){

const popup=
document.getElementById(id);

popup.classList.remove(
"hidden"
);

setTimeout(()=>{

popup.classList.add(
"hidden"
);

},1000);

}

/* LOAD */
function loadQuestion(){

const q=
quizData[current];

question.innerHTML=
`Q${current+1}. ${q.question}`;

image.src=q.image;

options.innerHTML="";

prevBtn.disabled=
current===0;

nextBtn.disabled=
userAnswers[current]===null;

/* OPTIONS */
q.options.forEach((opt,index)=>{

const div=
document.createElement("div");

div.className="option";

if(
userAnswers[current]===
index
){

div.classList.add(
"correct"
);

}

div.innerHTML=

`
<div class="option-icon">
<img src="${opt.img}">
</div>

<div class="option-text">
${opt.text}
</div>
`;

if(userAnswers[current]!==null){

div.style.pointerEvents=
"none";

div.style.opacity=".85";

}

div.onclick=
()=>checkAnswer(div,index);

options.appendChild(div);

});

}

/* CHECK */
function checkAnswer(div,index){

if(userAnswers[current]!==null)
return;

const q=
quizData[current];

/* CORRECT */
if(index===q.correct){

div.classList.add(
"correct"
);

userAnswers[current]=
index;

score++;

nextBtn.disabled=false;

showPopup(
"correctPopup"
);

speakText(
"Correct"
);

confetti({

particleCount:90,
spread:80,
origin:{y:0.6}

});

/* DISABLE */
document
.querySelectorAll(".option")
.forEach(o=>{

o.style.pointerEvents=
"none";

});

/* FINAL */
if(current===quizData.length-1){

setTimeout(()=>{

document
.getElementById("finalPopup")
.classList.remove(
"hidden"
);

document
.getElementById("scoreText")
.innerHTML=

`Score : ${score}/${quizData.length}`;

confetti({

particleCount:250,
spread:120

});

},1200);

}

}

/* WRONG */
else{

div.classList.add(
"wrong"
);

showPopup(
"wrongPopup"
);

speakText(
"Try again"
);

setTimeout(()=>{

div.classList.remove(
"wrong"
);

},400);

}

}

/* NEXT */
nextBtn.onclick=()=>{

if(current===quizData.length-1)
return;

current++;

loadQuestion();

};

/* PREV */
prevBtn.onclick=()=>{

if(current>0){

current--;

loadQuestion();

}

};

/* START */
loadQuestion();

</script>

<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
</body>
