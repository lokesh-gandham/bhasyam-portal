<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kids One Word Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;700&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
}

body{

width:100%;
height:100vh;

overflow:hidden;


}

/* MAIN */
.quiz-container{

width:100%;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

}

/* QUIZ BOX */
.quiz-box{

width:100%;
max-width:1200px;

height:95vh;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

gap:28px;

padding:20px;

overflow:hidden;

}

/* QUESTION */
.question{

width:100%;

min-height:90px;

display:flex;
justify-content:center;
align-items:center;

text-align:left;

font-size:30px;

line-height:1.3;

color:#2f4f4f;

padding:0 15px;

flex-shrink:0;

}

/* IMAGE */
.image-box{

width:100%;

display:flex;
justify-content:center;
align-items:center;

flex-shrink:0;

}

/* IMAGE FRAME */
.image-frame{

width:260px;
height:190px;

border-radius:35px;

background:
linear-gradient(
135deg,
#fadfea,
#d8ebfb
);

display:flex;
justify-content:center;
align-items:center;

padding:14px;

overflow:hidden;

position:relative;

}

/* BUBBLE */
.image-frame::before{

content:"";

position:absolute;

width:120px;
height:120px;

border-radius:50%;

background:
rgba(255,255,255,.25);

top:-20px;
right:-20px;

}
.image-frame img{

width:100%;
height:100%;

object-fit:contain;

position:relative;

z-index:2;

/* 🚫 DISABLE DRAG */

-webkit-user-drag:none;

user-select:none;

pointer-events:none;

}

/* ANSWER */
.answer-box{

width:100%;

display:flex;
justify-content:center;
align-items:center;

gap:10px;

flex-wrap:wrap;

flex-shrink:0;

}
.letter{

width:65px;
height:65px;

border:none;

border-radius:24px;

background:#FFFFFF;

font-size:30px;
font-weight: 500;
text-align:center;

color:#2F4F4F;

outline:none;

transition:.25s;

cursor:pointer;

border:3px solid #4CAF50;     /* Single Green Border */

box-shadow:0 8px 0 #A5D6A7;   /* Single Green Shadow */

}

@keyframes activePulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
}
/* COLORS */


/* DISABLE */
.letter:disabled{

opacity:1;

background:
linear-gradient(
135deg,
#ffffff,
#f8fff9
);

color:#2f4f4f;

cursor:pointer;

}

/* NAV */
.nav{

width:100%;

display:flex;
justify-content:space-around;
align-items:center;

gap:30px;

margin-top:10px;

flex-shrink:0;

}

/* BUTTON */
.nav-btn{

width:130px;
height:50px;


border:none;

font-size:20px;

cursor:pointer;

color:white;

transition:.25s;

}

/* PREV */
.prev-btn{

background:
linear-gradient(
135deg,
#52b788,
#74c69d
);

border-radius:
32px 14px 32px 14px;

}

/* NEXT */
.next-btn{

background:
linear-gradient(
135deg,
#c77dff,
#b5179e
);

border-radius:
14px 32px 14px 32px;

}

/* DISABLE */
.next-btn:disabled{

opacity:.45;

cursor:not-allowed;

}

/* HOVER */
.nav-btn:hover{

transform:scale(1.05);

}

/* POPUP */
.popup{

position:fixed;

inset:0;

display:flex;
justify-content:center;
align-items:center;


z-index:999;

}

/* HIDE */
.hidden{
display:none;
}

/* POPUP BOX */
.popup-box{

width:330px;

padding:28px 20px;

border-radius:36px;

text-align:center;

animation:pop .35s;

}

/* CORRECT */
.correct-popup .popup-box{

background:
linear-gradient(
135deg,
#c8f7dc,
#b5ead7
);

border:6px solid #57cc99;

}

/* WRONG */
.wrong-popup .popup-box{

background:
linear-gradient(
135deg,
#ffd6e0,
#ffc2d1
);

border:6px solid #ff5d8f;

}

/* FINAL */
.final-popup .popup-box{

background:
linear-gradient(
135deg,
#d9f0ff,
#cdb4ff
);

border:6px solid #9b5de5;

}

/* POP */
@keyframes pop{

0%{
transform:scale(.5);
opacity:0;
}

100%{
transform:scale(1);
opacity:1;
}

}

/* EMOJI */
.popup-emoji{

font-size:85px;

margin-bottom:8px;

}

/* TITLE */
.popup-title{

font-size:40px;

color:#2f4f4f;

}

/* SCORE */
.popup-score{

font-size:24px;

margin-top:10px;

color:#2f4f4f;

}

/* PLAY */
.play-btn{

margin-top:18px;

border:none;

padding:13px 28px;

font-size:22px;

border-radius:18px;

cursor:pointer;

background:#9b5de5;

color:white;

}

/* ================= MONITOR ================= */

@media screen and (min-width:1225px) and (max-width:1440px){

/* MAIN */
.quiz-box{

max-width:1500px;

height:96vh;

padding:30px 40px;

gap:38px;

}

/* QUESTION */
.question{

min-height:100px;

font-size:40px;

line-height:1.2;

padding:0 40px;


}

/* IMAGE */
.image-frame{

width:400px;
height:220px;

border-radius:46px;

padding:20px;
margin-top: -20px;
}

/* BUBBLE */
.image-frame::before{

width:160px;
height:160px;

}

/* ANSWER */
.answer-box{

gap:14px;


}

/* LETTER */
.letter{

width:86px;
height:86px;

font-size:42px;

border-radius:28px;

border-width:6px;

box-shadow:
0 10px 0 #d9f1ff;

}

/* NAV */
.nav{

gap:50px;

margin-top:18px;

}

/* BUTTON */
.nav-btn{

width:190px;
height:64px;

font-size:30px;

}

/* POPUP */
.popup-box{

width:450px;

padding:36px 28px;

border-radius:44px;

}

/* EMOJI */
.popup-emoji{

font-size:120px;

}

/* TITLE */
.popup-title{

font-size:52px;

}

/* SCORE */
.popup-score{

font-size:32px;

}

/* PLAY */
.play-btn{

font-size:28px;

padding:16px 32px;

border-radius:22px;

}

}

/* ================= LARGE MONITOR ================= */

@media screen and (min-width:1441px) and (max-width:1920px){

/* MAIN */
.quiz-box{

max-width:1900px;

height:97vh;

padding:45px 60px;

gap:50px;

}

/* QUESTION */
.question{

min-height:160px;

font-size:40px;

line-height:1.45;

padding:0 70px;

}

/* IMAGE */
.image-frame{

width:500px;
height:270px;

border-radius:60px;

padding:28px;

}

/* BUBBLE */
.image-frame::before{

width:230px;
height:230px;

top:-40px;
right:-40px;

}

/* ANSWER */
.answer-box{

gap:22px;

margin-top:18px;

}

/* LETTER */
.letter{

width:100px;
height:100px;

font-size:35px;

border-radius:30px;

border-width:8px;

box-shadow:
0 14px 0 #d9f1ff;

}

/* NAV */
.nav{

gap:70px;

margin-top:28px;

}

/* BUTTON */
.nav-btn{

width:190px;
height:64px;

font-size:30px;

}

/* POPUP */
.popup-box{

width:450px;

padding:36px 28px;

border-radius:44px;

}

/* EMOJI */
.popup-emoji{

font-size:120px;

}

/* TITLE */
.popup-title{

font-size:52px;

}

/* SCORE */
.popup-score{

font-size:32px;

}

/* PLAY */
.play-btn{

font-size:28px;

padding:16px 32px;

border-radius:22px;

}
}

</style>

<style id="codex-responsive-shell">
html {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    max-width: 100%;
    overflow: hidden;
}

img,
svg,
canvas,
video {
    max-width: 100%;
}

iframe {
    display: block;
    max-width: 100%;
}

body:has(iframe) {
    width: 100%;
    height: 100svh;
    min-height: 100svh;
    overflow: hidden;
}

body:has(iframe) .app,
body:has(iframe) .frame,
body:has(iframe) .board {
    max-width: 100%;
    max-height: 100svh;
    min-height: 0;
}

body:has(iframe) .app {
    height: 100svh;
}

body:has(iframe) .board {
    width: min(1250px, calc(100vw - 16px));
    height: min(570px, calc(100svh - 16px));
}

body:has(iframe) .content,
body:has(iframe) .main,
body:has(iframe) .screen,
body:has(iframe) .iframe-wrapper {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

body:has(iframe) iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

@media (min-width: 1025px) {
    body:has(iframe) .sidebar {
        width: clamp(190px, 17vw, 300px);
        min-width: 0;
        min-height: 0;
    }

    body:has(iframe) .topbar,
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .nav-group {
        flex-shrink: 0;
    }

    body:has(iframe) .nav-container,
    body:has(iframe) .nav-wrapper,
    body:has(iframe) .sidebar-scroll,
    body:has(iframe) .menu {
        max-height: 100svh;
        overflow: hidden;
    }

    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(10px, 2.8vw, 44px);
        padding: clamp(6px, 1.4dvh, 14px) clamp(8px, 1.4vw, 20px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        min-height: 0;
        max-width: 100%;
    }
}

@media (min-width: 1025px) and (max-height: 760px) {
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(8px, 2vw, 24px);
        padding-block: clamp(4px, 1dvh, 10px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        padding: clamp(8px, 1.4dvh, 14px) clamp(10px, 1.4vw, 22px);
        font-size: clamp(15px, 1.2vw, 20px);
    }

    body:has(iframe) .puzzle {
        width: clamp(150px, 14vw, 210px);
        height: clamp(54px, 8dvh, 70px);
    }

    body:has(iframe) .sidebar {
        width: clamp(190px, 16vw, 240px);
    }
}
</style>

<body>

<div class="quiz-container">

<div class="quiz-box">

<!-- QUESTION -->
<div class="question"
id="question">
</div>

<!-- IMAGE -->
<div class="image-box">

<div class="image-frame">
<img id="questionImage"
src="../images/ow1.png"
draggable="false">

</div>

</div>

<!-- ANSWER -->
<div class="answer-box"
id="answerBox">
</div>

<!-- NAV -->
<div class="nav">

<button class="nav-btn prev-btn"
id="prevBtn">

⬅ Prev

</button>

<button class="nav-btn next-btn"
id="nextBtn"
disabled>

Next ➡

</button>

</div>

</div>

</div>

<!-- CORRECT -->
<div class="popup correct-popup hidden"
id="correctPopup">

<div class="popup-box">

<div class="popup-emoji">
🎉
</div>

<div class="popup-title">
Correct!
</div>

</div>

</div>

<!-- WRONG -->
<div class="popup wrong-popup hidden"
id="wrongPopup">

<div class="popup-box">

<div class="popup-emoji">
😢
</div>

<div class="popup-title">
Oops!
</div>

</div>

</div>

<!-- FINAL -->
<div class="popup final-popup hidden"
id="finalPopup">

<div class="popup-box">

<div class="popup-emoji">
🏆
</div>

<div class="popup-title">
Awesome!
</div>

<div class="popup-score"
id="scoreText">
</div>

<button class="play-btn"
onclick="location.reload()">

🎊 Play Again

</button>

</div>

</div>

<script>

/* SPEECH */
 function speakText(text){

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang="en-UK";

speech.rate=1;

speech.pitch=1;

speech.volume=0.25;

speechSynthesis.speak(speech);

}
/* QUESTIONS */
const quizData=[

{
question:
"This is a land of mountains covered with snow.",

answer:"NEPAL",

image:"../images/ow1.png"
},

{
question:
"Thimphu is the capital of this country.",

answer:"BHUTAN",

image:"../images/ow22.png"
},

{
question:
"Urdu is the main language spoken here.",

answer:"PAKISTAN",

image:"../images/monument.png"
},

{
question:
"Tourism is the largest industry in these islands.",

answer:"MALDIVES",

image:"../images/ow44.png"
},

{
question:
"It is a large country with the world’s largest population next to India.",

answer:"CHINA",

image:"../images/ow55.png"
}

];

/* ELEMENTS */
const question=
document.getElementById("question");

const image=
document.getElementById("questionImage");

const answerBox=
document.getElementById("answerBox");

const nextBtn=
document.getElementById("nextBtn");

const prevBtn=
document.getElementById("prevBtn");

/* VARIABLES */
let current=0;

let score=0;

let userAnswers=
new Array(quizData.length)
.fill("");

/* POPUP */
function showPopup(id){

const popup=
document.getElementById(id);

popup.classList.remove(
"hidden"
);

setTimeout(()=>{

popup.classList.add(
"hidden"
);

},1000);

}

/* LOAD QUESTION */
function loadQuestion(){

const q=
quizData[current];

question.innerHTML=
`Q${current+1}. ${q.question}`;

image.src=q.image;

answerBox.innerHTML="";

prevBtn.disabled=
current===0;

nextBtn.disabled=
userAnswers[current]==="";

/* LETTERS */
for(let i=0;i<q.answer.length;i++){

const input=
document.createElement("input");

input.className=
"letter";

input.maxLength=1;

input.dataset.index=i;

/* HOLD ANSWER */
if(userAnswers[current]){

input.value=
userAnswers[current][i] || "";

input.disabled=true;

}

/* INPUT */
input.addEventListener(
"input",
()=>{

input.value=
input.value.toUpperCase();

const letters=
document.querySelectorAll(".letter");

/* NEXT */
if(
input.value &&
i<letters.length-1
){
letters.forEach(l => l.classList.remove("active"));

letters[i+1].focus();
letters[i+1].classList.add("active");
}

/* CHECK */
checkAnswer();

});
/* DESKTOP BACKSPACE */
input.addEventListener("keydown",(e)=>{

    const letters =
    document.querySelectorAll(".letter");

    if(e.key === "Backspace"){

        if(input.value !== ""){

            input.value = "";

            e.preventDefault();

            return;
        }

        if(i > 0){

            letters[i-1].value = "";

            letters[i-1].focus();

            e.preventDefault();
        }
    }

});


/* MOBILE TAP TO DELETE */
input.addEventListener("touchstart",(e)=>{

    e.preventDefault();

    if(input.disabled) return;

    input.value = "";

    input.focus();

});

input.addEventListener("click",()=>{

    if(input.disabled) return;

    input.value = "";

    input.focus();

});

answerBox.appendChild(input);

}
const first = document.querySelector(".letter");

if(first && !userAnswers[current]){

    setTimeout(()=>{
        first.focus();
        first.classList.add("active");
    },100);
}

}

/* CHECK ANSWER */
function checkAnswer(){

const q=
quizData[current];

const letters=
document.querySelectorAll(".letter");

let word="";

/* WORD */
letters.forEach(l=>{

word+=l.value;

});

/* CORRECT */
if(word===q.answer){

userAnswers[current]=word;

score++;

nextBtn.disabled=false;

/* DISABLE */
letters.forEach(l=>{

l.disabled=true;

});

/* POPUP */
showPopup(
"correctPopup"
);

speakText(
"Correct"
);

/* CONFETTI */
confetti({

particleCount:90,
spread:80,
origin:{y:0.6}

});

/* FINAL */
if(current===quizData.length-1){

setTimeout(()=>{

document
.getElementById("finalPopup")
.classList.remove(
"hidden"
);

document
.getElementById("scoreText")
.innerHTML=

`Score : ${score}/${quizData.length}`;

confetti({

particleCount:250,
spread:120

});

},1200);

}

}

/* WRONG */
/* WRONG */
else if(word.length === q.answer.length){

    showPopup("wrongPopup");

    speakText("Try again");

    setTimeout(() => {

        letters.forEach(l => {
            l.value = "";
            l.classList.remove("active");
        });

        letters[0].focus();
        letters[0].classList.add("active");

    }, 1000);   // same time as popup disappears

}

}

/* NEXT */
nextBtn.onclick=()=>{

if(current===quizData.length-1)
return;

current++;

loadQuestion();

};

/* PREV */
prevBtn.onclick=()=>{

if(current>0){

current--;

loadQuestion();

}

};

/* START */
loadQuestion();

</script>

<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
