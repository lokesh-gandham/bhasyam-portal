<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
}

body{

width:100%;
height:100vh;

overflow:hidden;


}

/* MAIN */
.quiz-container{

width:100%;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

}

/* QUIZ BOX */
.quiz-box{

width:100%;
max-width:1200px;

height:95vh;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

gap:30px;

padding:20px;

overflow:hidden;

}

/* QUESTION */
.question{

width:100%;

height:90px;

display:flex;
justify-content:center;
align-items:center;

text-align:left;

font-size:30px;

line-height:1.2;

color:#2f4f4f;

flex-shrink:0;

}

/* IMAGE */
.image-wrap{

width:100%;

display:flex;
justify-content:center;
align-items:center;

flex-shrink:0;

}

/* IMAGE BOX */
.image-frame{

width:280px;
height:180px;

border-radius:35px;

background:
linear-gradient(
135deg,
#ffe5ec,
#dff3ff
);

display:flex;
justify-content:center;
align-items:center;

padding:10px;

overflow:hidden;
margin-top: -30px;

}

/* IMAGE */
.image-frame img{

width:100%;
height:100%;

object-fit:contain;

}

/* OPTION AREA */
.option-wrap{

width:100%;

display:flex;
justify-content:center;
align-items:center;

gap:20px;

flex-wrap:wrap;

flex-shrink:0;

}

/* BUTTON */
.tf-btn{

width:180px;
height:120px;

border:none;

background:none;

cursor:pointer;

position:relative;

transition:.3s;

}

/* TABLET */
.tf-inner{

width:100%;
height:100%;

border-radius:28px;

padding:6px;

position:relative;

overflow:hidden;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

gap:10px;

}

/* SCREEN */
.screen{

width:100%;
height:100%;

border-radius:20px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

position:relative;

overflow:hidden;

}

/* TRUE */
.true-btn .tf-inner{

background:
linear-gradient(
145deg,
#86efac,
#4ade80
);

}

/* TRUE SCREEN */
.true-btn .screen{

background:
linear-gradient(
145deg,
#d8ffe7,
#b7f7d4
);

}

/* FALSE */
.false-btn .tf-inner{

background:
linear-gradient(
145deg,
#ff8fab,
#ff4d6d
);

}

/* FALSE SCREEN */
.false-btn .screen{

background:
linear-gradient(
145deg,
#ffe1e8,
#ffd1dc
);

}



/* ICON */
.tf-icon{

font-size:30px;

margin-bottom:6px;

z-index:2;

}

/* TEXT */
.tf-text{

font-size:30px;

color:#2f4f4f;

font-weight:500;

letter-spacing:1px;

z-index:2;

}


/* HOVER */
.tf-btn:hover{

transform:
translateY(-8px)
rotate(-1deg)
scale(1.04);

}

/* ACTIVE */
.tf-btn:active{

transform:scale(.95);

}
/* CORRECT - Highlight the whole button */
.tf-btn.correct{
    border:4px solid #20c933;
    border-radius:34px;
    box-shadow:
        0 0 0 5px rgba(32,201,51,.25),
        0 0 20px rgba(32,201,51,.45);
}

/* WRONG */
.tf-btn.wrong{

animation:shake .35s;

}

/* SHAKE */
@keyframes shake{

0%{transform:translateX(0);}
25%{transform:translateX(-7px);}
50%{transform:translateX(7px);}
75%{transform:translateX(-7px);}
100%{transform:translateX(0);}

}

/* NAV */
.nav{

width:100%;

display:flex;
justify-content:space-around;
align-items:center;

gap:30px;

margin-top:10px;

flex-shrink:0;

}

/* NAV BUTTON */
.nav-btn{

width:130px;
height:50px;


border:none;

font-size:20px;

cursor:pointer;

color:white;

transition:.25s;

}

/* PREV */
.prev-btn{

background:
linear-gradient(
135deg,
#52b788,
#74c69d
);

border-radius:
40px 14px 40px 14px;

}

/* NEXT */
.next-btn{

background:
linear-gradient(
135deg,
#c77dff,
#b5179e
);

border-radius:
14px 40px 14px 40px;

}

/* DISABLED */
.next-btn:disabled{

opacity:.45;

cursor:not-allowed;

}

/* HOVER */
.nav-btn:hover{

transform:scale(1.05);

}

/* POPUP */
.popup{

position:fixed;

inset:0;

display:flex;
justify-content:center;
align-items:center;

z-index:999;

}

/* HIDE */
.hidden{
display:none;
}

/* POPUP BOX */
.popup-box{

width:340px;

padding:30px 20px;

border-radius:38px;

text-align:center;

animation:pop .35s;

}

/* CORRECT */
.correct-popup .popup-box{

background:
linear-gradient(
135deg,
#c8f7dc,
#b5ead7
);

border:6px solid #57cc99;

}

/* WRONG */
.wrong-popup .popup-box{

background:
linear-gradient(
135deg,
#ffd6e0,
#ffc2d1
);

border:6px solid #ff5d8f;

}

/* FINAL */
.final-popup .popup-box{

background:
linear-gradient(
135deg,
#d9f0ff,
#cdb4ff
);

border:6px solid #9b5de5;

}

/* POP */
@keyframes pop{

0%{
transform:scale(.5);
opacity:0;
}

100%{
transform:scale(1);
opacity:1;
}

}

/* EMOJI */
.popup-emoji{

font-size:82px;

margin-bottom:12px;

}

/* TITLE */
.popup-title{

font-size:40px;

color:#2f4f4f;

}

/* SCORE */
.popup-score{

font-size:25px;

margin-top:10px;

}

/* PLAY */
.play-btn{

border:none;

<script>

/* SPEECH */
 function speakText(text){

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang="en-UK";

speech.rate=1;

speech.pitch=1;

speech.volume=0.25;

speechSynthesis.speak(speech);

}

/* QUESTIONS */
const quizData=[

{
question:
"Four water bodies surround the Indian peninsula.",

answer:"FALSE",

image:"../images/tf1.png"
},

{
question:
"The Arabian Sea is in the west of India.",

answer:"TRUE",

image:"../images/tf2.png"
},

{
question:
"On the south, India is bounded by the Indian Ocean.",

answer:"TRUE",

image:"../images/tf3.png"
},

{
question:
"Mumbai is the capital of Gujarat.",

answer:"FALSE",

image:"../images/tf4.png"
},

{
question:
"India is known for its rich heritage and diverse culture.",

answer:"TRUE",

image:"../images/tf5.png"
}

];

/* ELEMENTS */
const question=
document.getElementById("question");

const image=
document.getElementById("questionImage");

const trueBtn=
document.getElementById("trueBtn");

const falseBtn=
document.getElementById("falseBtn");

const nextBtn=
document.getElementById("nextBtn");

const prevBtn=
document.getElementById("prevBtn");

/* VARIABLES */
let current=0;

let score=0;

/* HOLD ANSWERS */
let answered=
new Array(quizData.length)
.fill(null);

/* POPUP */
function showPopup(id){

const popup=
document.getElementById(id);

popup.classList.remove(
"hidden"
);

setTimeout(()=>{

popup.classList.add(
"hidden"
);

},1000);

}

/* LOAD QUESTION */
function loadQuestion(){

const q=
quizData[current];

question.innerHTML=
`Q${current+1}. ${q.question}`;

image.src=q.image;

/* RESET */
trueBtn.classList.remove(
"correct",
"wrong"
);

falseBtn.classList.remove(
"correct",
"wrong"
);

/* HOLD ANSWER */
if(answered[current]){

nextBtn.disabled=false;

trueBtn.disabled=true;
falseBtn.disabled=true;

if(answered[current]==="TRUE"){

trueBtn.classList.add(
"correct"
);

}
else{

falseBtn.classList.add(
"correct"
);

}

}
else{

nextBtn.disabled=true;

trueBtn.disabled=false;
falseBtn.disabled=false;

}

prevBtn.disabled=
current===0;

}

/* CHECK */
function checkAnswer(choice){

const q=
quizData[current];

if(choice===q.answer){

answered[current]=choice;

score++;

nextBtn.disabled=false;

trueBtn.disabled=true;
falseBtn.disabled=true;

if(choice==="TRUE"){

trueBtn.classList.add(
"correct"
);

}
else{

falseBtn.classList.add(
"correct"
);

}

showPopup(
"correctPopup"
);

speakText(
"Correct"
);

confetti({

particleCount:100,
spread:80

});

/* FINAL */
if(current===quizData.length-1){

setTimeout(()=>{

document
.getElementById("finalPopup")
.classList.remove(
"hidden"
);

document
.getElementById("scoreText")
.innerHTML=

`Score : ${score}/${quizData.length}`;

confetti({

particleCount:250,
spread:120

});

},1200);

}

}
else{

if(choice==="TRUE"){

trueBtn.classList.add(
"wrong"
);

}
else{

falseBtn.classList.add(
"wrong"
);

}

showPopup(
"wrongPopup"
);

speakText(
"Try again"
);

}

}

/* BUTTONS */
trueBtn.onclick=()=>{

checkAnswer("TRUE");

};

falseBtn.onclick=()=>{

checkAnswer("FALSE");

};

/* NEXT */
nextBtn.onclick=()=>{

if(current<
quizData.length-1){

current++;

loadQuestion();

}

};

/* PREV */
prevBtn.onclick=()=>{

if(current>0){

current--;

loadQuestion();

}

};

/* START */
loadQuestion();

</script>

<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
</body>
</html>
