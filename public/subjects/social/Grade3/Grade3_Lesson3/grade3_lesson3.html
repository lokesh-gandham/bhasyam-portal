<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Assessments</title>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Livvic";
        }

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        /* ================= BODY ================= */
        body {

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(135deg,
                    #fff8f0,
                    #eefcff,
                    #f6fff2);

            overflow: hidden;

        }

        /* ================= SIDEBAR ================= */
        /* SIDEBAR */
        .top-index {

            width: 280px;
            height: 95vh;

            padding: 22px 18px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 25px;

            overflow-y: auto;

            position: fixed;

            left: 20px;
            top: 50%;

            transform: translateY(-50%);

            z-index: 999;

            margin-top: 0;

        }

        /* ================= BUTTON ================= */

        .index-btn {

            width: 100%;

            border: none;

            background: none;

            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;

            transition: .35s;
        }

        /* ================= NAV BUTTON ================= */
        .nav-text {

            width: 100%;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            padding: 12px 22px;
            gap: 14px;

            border-radius: 28px;

            font-size: 18px;
            font-weight: 600;

            background: #E8F5E9;
            /* Single button color */
            color: #1B5E20;

            border: 2px solid #C8E6C9;

            box-shadow:
                0 8px 16px rgba(0, 0, 0, .08);

            transition: .3s;

        }

        /* ================= ICON ================= */

        .icon {

            width: 28px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 24px;

            flex-shrink: 0;
        }

        /* ================= LABEL ================= */

        .label {

            flex: 1;
        }

        .index-btn:hover .nav-text::before {

            left: 110%;
        }

        /* ================= ACTIVE ================= */
        .index-btn.active .nav-text {
            background: linear-gradient(135deg, #d9edda, #bae4bc);
            border-color: #70a773;

            box-shadow:
                0 14px 30px rgba(46, 125, 50, .25),
                inset 0 1px 0 rgba(255, 255, 255, .8);

        }




        /* ================= CONTENT ================= */
        /* CONTENT */
        .content {

            flex: 1;

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 270px;

            padding: 20px;

        }

        /* ================= IFRAME ================= */
        /* IFRAME */
        iframe {

            width: 100%;
            height: 100vh;

            border: none;

            border-radius: 35px;


        }

        /* ================= SCROLLBAR ================= */

        .top-index::-webkit-scrollbar {

            width: 8px;
        }

        .top-index::-webkit-scrollbar-thumb {

            background: #63e6be;

            border-radius: 20px;
        }

        /* ================= MOBILE BUTTON ================= */

        .mobile-toggle {

            display: none;
        }


        /* ================= MONITOR ================= */

        @media screen and (min-width:1101px) and (max-width:1240px) {

            /* SIDEBAR */
            .top-index {

                width: 300px;

                padding: 24px 20px;

                gap: 28px;

                right: 24px;

            }

            /* CONTENT */
            .content {
                margin-left: 320px;
                margin-right: 0;
                padding: 24px;

            }

            /* BUTTON */
            .nav-text {

                height: 78px;

                padding: 14px 24px;

                border-radius: 32px;

                font-size: 24px;

                gap: 16px;

            }

            /* ICON */
            .icon {

                width: 34px;

                font-size: 28px;

            }

            /* IFRAME */
            iframe {

                border-radius: 42px;

            }

        }

        /* ================= LARGE MONITOR ================= */

        @media screen and (min-width:1441px) and (max-width:1920px) {

            /* SIDEBAR */
            .top-index {

                width: 400px;

                padding: 30px 26px;

                gap: 34px;

                right: 30px;

            }

            .content {
                margin-left: 410px;
                margin-right: 0;
                padding: 30px;
            }


            /* BUTTON */
            .nav-text {

                height: 100px;

                padding: 18px 30px;

                border-radius: 38px;

                font-size: 25px;

                gap: 20px;

                border-width: 3px;

            }

            /* ICON */
            .icon {

                width: 42px;

                font-size: 36px;

            }


            /* IFRAME */
            iframe {

                border-radius: 55px;

            }

        }

        /* ================= EXTRA LARGE / 4K ================= */

        @media screen and (min-width:1921px) {

            /* BODY */
            body {

                overflow: hidden;

            }

            /* SIDEBAR */
            .top-index {

                width: 550px;

                padding: 40px 34px;

                gap: 42px;

                right: 40px;

            }

            .content {
                margin-left: 560px;
                margin-right: 0;
                padding: 40px;
            }

            /* BUTTON */
            .nav-text {

                height: 135px;

                padding: 24px 40px;

                border-radius: 50px;

                font-size: 42px;

                gap: 28px;

                border-width: 4px;

            }

            /* ICON */
            .icon {

                width: 60px;

                font-size: 52px;

            }

            /* IFRAME */
            iframe {

                border-radius: 70px;

            }

            /* SCROLLBAR */
            .top-index::-webkit-scrollbar {

                width: 12px;

            }

        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .25);
            display: none;
            z-index: 998;
        }

        .overlay.show {
            display: block;
        }

        @media(min-width:1101px) {

            .overlay {
                display: none !important;
            }

        }
    </style>

    <style id="codex-responsive-shell">
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            max-width: 100%;
            overflow: hidden;
        }

        img,
        svg,
        canvas,
        video {
            max-width: 100%;
        }

        iframe {
            display: block;
            max-width: 100%;
        }

        body:has(iframe) {
            width: 100%;
            height: 100svh;
            min-height: 100svh;
            overflow: hidden;
        }

        body:has(iframe) .app,
        body:has(iframe) .frame,
        body:has(iframe) .board {
            max-width: 100%;
            max-height: 100svh;
            min-height: 0;
        }

        body:has(iframe) .app {
            height: 100svh;
        }

        body:has(iframe) .board {
            width: min(1250px, calc(100vw - 16px));
            height: min(570px, calc(100svh - 16px));
        }

        body:has(iframe) .content,
        body:has(iframe) .main,
        body:has(iframe) .screen,
        body:has(iframe) .iframe-wrapper {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        body:has(iframe) iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (min-width: 1025px) {
            body:has(iframe) .sidebar {
                width: clamp(190px, 17vw, 300px);
                min-width: 0;
                min-height: 0;
            }

            body:has(iframe) .topbar,
            body:has(iframe) .top-nav,
            body:has(iframe) .top-index,
            body:has(iframe) .bottom-bar,
            body:has(iframe) .nav-group {
                flex-shrink: 0;
            }

            body:has(iframe) .nav-container,
            body:has(iframe) .nav-wrapper,
            body:has(iframe) .sidebar-scroll,
            body:has(iframe) .menu {
                max-height: 100svh;
                overflow: hidden;
            }

            body:has(iframe) .top-nav,
            body:has(iframe) .top-index,
            body:has(iframe) .bottom-bar,
            body:has(iframe) .topbar,
            body:has(iframe) .nav-group {
                gap: clamp(10px, 2.8vw, 44px);
                padding: clamp(6px, 1.4dvh, 14px) clamp(8px, 1.4vw, 20px);
            }

            body:has(iframe) .nav-btn,
            body:has(iframe) .puzzle,
            body:has(iframe) .island-btn,
            body:has(iframe) .btn {
                min-height: 0;
                max-width: 100%;
            }
        }

        @media (min-width: 1025px) and (max-height: 760px) {

            body:has(iframe) .top-nav,
            body:has(iframe) .top-index,
            body:has(iframe) .bottom-bar,
            body:has(iframe) .topbar,
            body:has(iframe) .nav-group {
                gap: clamp(8px, 2vw, 24px);
                padding-block: clamp(4px, 1dvh, 10px);
            }

            body:has(iframe) .nav-btn,
            body:has(iframe) .puzzle,
            body:has(iframe) .island-btn,
            body:has(iframe) .btn {
                padding: clamp(8px, 1.4dvh, 14px) clamp(10px, 1.4vw, 22px);
                font-size: clamp(15px, 1.2vw, 20px);
            }

            body:has(iframe) .puzzle {
                width: clamp(150px, 14vw, 210px);
                height: clamp(54px, 8dvh, 70px);
            }

            body:has(iframe) .sidebar {
                width: clamp(190px, 16vw, 240px);
            }
        }
    </style>
</head>

<body>

    <!-- MOBILE TOGGLE -->

    <button class="mobile-toggle" id="menuToggle">

        ☰

    </button>

    <!-- ================= SIDEBAR ================= -->

    <div class="top-index">

        <!-- BUTTON 1 -->

        <button class="index-btn active" data-file="./exercise/mcq.html">

            <span class="nav-text">

                <span class="icon">🚀</span>

                <span class="label">
                    Choose Option
                </span>

            </span>

        </button>

        <!-- BUTTON 2 -->

        <button class="index-btn" data-file="./exercise/fillintheblanks.html">

            <span class="nav-text">

                <span class="icon">🔗</span>

                <span class="label">
                    Fill In The Blanks
                </span>

            </span>

        </button>

        <!-- BUTTON 3 -->

        <button class="index-btn" data-file="./exercise/truefalse.html">

            <span class="nav-text">

                <span class="icon">📚</span>

                <span class="label">
                    True/False
                </span>

            </span>

        </button>

        <!-- BUTTON 4 -->

        <button class="index-btn" data-file="./exercise/oneword.html">

            <span class="nav-text">

                <span class="icon">🔤</span>

                <span class="label">
                    One word
                </span>

            </span>

        </button>

        <!-- BUTTON 5 -->

        <button class="index-btn" data-file="./exercise/matching.html">

            <span class="nav-text">

                <span class="icon">🧩</span>

                <span class="label">
                    Matching
                </span>

            </span>

        </button>

        <!-- BUTTON 6 -->

        </button>

    </div>

    <!-- ================= CONTENT ================= -->

    <div class="content">

        <iframe id="quizFrame"></iframe>

    </div>
    <div class="overlay" id="overlay"></div>
    <script>

        /* ================= ELEMENTS ================= */
        const overlay =
            document.getElementById(
                "overlay"
            );
        const iframe =
            document.getElementById(
                "quizFrame"
            );

        const buttons =
            document.querySelectorAll(
                ".index-btn"
            );

        const toggle =
            document.getElementById(
                "menuToggle"
            );

        const menu =
            document.querySelector(
                ".top-index"
            );

        /* ================= DEFAULT PAGE ================= */

        iframe.src =
            buttons[0].dataset.file;

        /* ================= BUTTON CLICK ================= */

        buttons.forEach(btn => {

            btn.addEventListener(
                "click",
                () => {

                    /* REMOVE ACTIVE */

                    buttons.forEach(b => {

                        b.classList.remove(
                            "active"
                        );

                    });

                    /* ACTIVE BUTTON */

                    btn.classList.add(
                        "active"
                    );

                    /* CHANGE PAGE */

                    iframe.src =
                        btn.dataset.file;

                    /* CLOSE MOBILE */
                    menu.classList.remove(
                        "active"
                    );

                    overlay.classList.remove(
                        "show"
                    );

                });

        });

        /* ================= TOGGLE ================= */
        toggle.addEventListener(
            "click",
            () => {

                menu.classList.toggle(
                    "active"
                );

                overlay.classList.toggle(
                    "show"
                );

            });
        overlay.addEventListener(
            "click",
            () => {

                menu.classList.remove(
                    "active"
                );

                overlay.classList.remove(
                    "show"
                );

            });

    </script>

    <script id="codex-viewport-fit">
        (function () {
            if (window.__codexViewportFit) return;
            window.__codexViewportFit = true;

            const hasIframe = Boolean(document.querySelector("iframe"));
            const selectors = [
                ".main",
                ".main-container",
                ".quiz",
                ".quiz-container",
                ".quiz-box",
                ".container",
                ".stage",
                ".screen",
                ".game",
                ".template",
                ".quiz-card",
                ".app"
            ];
            const minScale = 0.62;
            let rafId = 0;

            function setViewportRules() {
                document.documentElement.style.width = "100%";
                document.documentElement.style.height = "100%";
                document.documentElement.style.overflow = "hidden";
                document.body.style.width = "100%";
                document.body.style.height = "100svh";
                document.body.style.minHeight = "100svh";
                document.body.style.overflow = "hidden";
            }

            function getStage() {
                for (const selector of selectors) {
                    const stage = document.querySelector(selector);
                    if (stage) return stage;
                }
                return null;
            }

            function fitToViewport() {
                setViewportRules();
                if (hasIframe) return;

                const stage = getStage();
                if (!stage) return;

                stage.style.transform = "scale(1)";
                stage.style.transformOrigin = "center center";

                const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                const rect = stage.getBoundingClientRect();
                const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                const scale = Math.max(
                    minScale,
                    Math.min(
                        1,
                        (viewportWidth - breathingRoom * 2) / contentWidth,
                        (viewportHeight - breathingRoom * 2) / contentHeight
                    )
                );

                stage.style.transform = `scale(${scale})`;
            }

            function requestFit() {
                cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(fitToViewport);
            }

            window.addEventListener("load", requestFit);
            window.addEventListener("resize", requestFit);
            window.addEventListener("orientationchange", requestFit);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(requestFit).catch(function () { });
            }

            document.querySelectorAll("img").forEach(function (img) {
                img.addEventListener("load", requestFit, { once: false });
            });

            if ("ResizeObserver" in window) {
                const observer = new ResizeObserver(requestFit);
                const observeStage = function () {
                    const stage = getStage();
                    if (stage) observer.observe(stage);
                };
                observeStage();
                window.addEventListener("load", observeStage);
            }

            if (document.body) {
                new MutationObserver(requestFit).observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }

            requestFit();
        })();
    </script>
</body>

</html>
