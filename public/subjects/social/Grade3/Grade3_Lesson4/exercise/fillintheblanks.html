<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Livvic';
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;


overflow:hidden;

}

/* MAIN */
.main{

width:100%;
max-width:1200px;

display:flex;
flex-direction:column;
align-items:center;

gap:10px;

padding:10px;

}
/* QUESTION */
.question-text{


width:100%;

min-height:80px;
height:auto;

display:flex;
justify-content:center;
align-items:center;

text-align:left;

font-size:30px;

color:#2f4f4f;

line-height:1.3;

padding:0 10px;

flex-shrink:0;

}

/* IMAGE */
.image img{

width:300px;
height:150px;

object-fit:contain;

}

/* SLOT CONTAINER */
.slot-container{

position:relative;

display:flex;

flex-wrap:nowrap;

gap:10px;

padding:15px 20px;

border-radius:25px;

justify-content:center;

overflow:hidden;

background:#d0ebff;

}

/* PROGRESS */
.progress-fill{

position:absolute;

top:0;
left:0;

height:100%;
width:0%;

background:
linear-gradient(
135deg,
#ff9a9e,
#fbc2eb,
#f6d365
);

transition:width .3s ease;

z-index:0;

border-radius:25px;

}

/* SLOT */
.slot{

width:55px;
height:65px;

border-radius:16px;

border:3px dashed #74c0fc;

background:#fff;

display:flex;
align-items:center;
justify-content:center;

font-size:26px;
font-weight:600;

box-shadow:0 6px 0 #cde7ff;

position:relative;

z-index:1;

}

/* CORRECT */
.slot.correct{

background:#caffbf;

border:3px solid #00c853;

}

/* WRONG */
.slot.wrong{

background:#ffadad;

border:3px solid #d00000;

}

/* LETTER */
.pool{

display:flex;
flex-wrap:wrap;

gap:12px;

justify-content:center;

}

.letter{

width:55px;
height:55px;

border-radius:16px;

background:
linear-gradient(
135deg,
#fff3b0,
#ffe066
);

display:flex;
align-items:center;
justify-content:center;

font-size:22px;
font-weight:600;

cursor:pointer;

box-shadow:0 6px 0 #ffbe0b;

transition:.2s;

}

/* HOVER */
.letter:hover{

transform:
translateY(-4px)
scale(1.06);

}

/* USED */
.letter.used{

opacity:.3;

pointer-events:none;

}

/* NAV */
.nav-buttons{

width:100%;

display:flex;
justify-content:space-between;
align-items:center;

gap:20px;
margin-top:12px;

}

/* BUTTON */
button{

width:125px;
height:50px;


padding:0 28px;

border:none;

border-radius:22px;

cursor:pointer;

font-size:20px;


color:white;

transition:.25s;

position:relative;

overflow:hidden;

}

/* SHINE */
button::before{

content:"";

position:absolute;

top:0;
left:-120%;

width:80%;
height:100%;

background:
rgba(255,255,255,.25);

transform:skewX(-25deg);

transition:.5s;

}

/* HOVER */
button:hover::before{

left:130%;

}

button:hover{

transform:
translateY(-5px)
scale(1.04);

}

/* PREV */
.prev{

background:
linear-gradient(
135deg,
#00b894,
#55efc4
);


}

/* NEXT */
.next{

background:
linear-gradient(
135deg,
#6c5ce7,
#a29bfe
);


}

/* DISABLED */
.next:disabled{

background:
linear-gradient(
135deg,
#d3d3d3,
#bdbdbd
);

box-shadow:none;

cursor:not-allowed;

transform:none;

}

/* ========================= */
/* POPUP OVERLAY */
/* ========================= */

.popup-overlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

display:none;

justify-content:center;
align-items:center;

z-index:9999;

}

/* SHOW */
.popup-overlay.show{

display:flex;

}

/* POPUP BOX */
.popup-box{

width:360px;

padding:38px 28px;

border-radius:40px;

position:relative;

overflow:hidden;

text-align:center;

animation:popupShow .45s ease;

}

/* CORRECT */
.correct-popup{

background:
linear-gradient(
135deg,
#b8f2e6,
#aed9ff,
#d0bfff
);

border:6px solid #57cc99;

box-shadow:
0 0 40px rgba(87,204,153,.35);

}

/* WRONG */
.wrong-popup{

background:
linear-gradient(
135deg,
#ffd6e0,
#ffc2d1,
#ffd6a5
);

border:6px solid #ff4d6d;

box-shadow:
0 0 40px rgba(255,77,109,.3);

}

/* FINAL */
.final-popup{

    background:
    linear-gradient(
    135deg,
    #FFF8B5,
    #FFE6A7,
    #FFD6A5
    );

    border:6px solid #FFB703;

    box-shadow:
    0 0 45px rgba(255,183,3,.35);

}
/* BG CIRCLE */
.popup-bg-circle{

position:absolute;

width:120px;
height:120px;

border-radius:50%;

background:
rgba(255,255,255,.18);

top:-35px;
right:-25px;

}

/* SECOND */
.popup-bg-circle.two{

width:80px;
height:80px;

left:-20px;
bottom:-20px;

top:auto;
right:auto;

}

/* EMOJI */
.popup-emoji{

font-size:90px;

margin-bottom:12px;

position:relative;

z-index:2;

animation:bounce 1s infinite;

}

/* TITLE */
.popup-title{

font-size:38px;

font-weight:500;

color:#2f4f4f;

margin-bottom:10px;

position:relative;

z-index:2;

}

/* STARS */
.popup-stars{

font-size:24px;

position:relative;

z-index:2;

animation:stars 2s infinite;

}

/* BUTTON */
.play-again{
    width:200px;
    height:70px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;

    margin:30px auto 0;

    border:none;
    border-radius:26px;

    background:linear-gradient(135deg,#4ADE80,#22C55E);

box-shadow:
0 10px 25px rgba(34,197,94,.35),
0 5px 0 #16A34A;

    color:#fff;
    font-size:20px;
    font-weight:600;

    cursor:pointer;


    transition:.3s;
}

.play-again:hover{
    transform:translateY(-4px) scale(1.05);
}

/* HOVER */
.play-again:hover{

transform:
translateY(-4px)
scale(1.05);

}

/* POPUP SHOW */
@keyframes popupShow{

0%{

opacity:0;

transform:
scale(.6)
rotate(-6deg);

}

100%{

opacity:1;

transform:
scale(1)
rotate(0);

}

}

/* BOUNCE */
@keyframes bounce{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

}

/* STARS */
@keyframes stars{

0%{
transform:translateX(-5px);
}

50%{
transform:translateX(5px);
}

100%{
transform:translateX(-5px);
}

<style id="codex-responsive-shell">
html {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    max-width: 100%;
    overflow: hidden;
}

img,
svg,
canvas,
video {
    max-width: 100%;
}

iframe {
    display: block;
    max-width: 100%;
}

body:has(iframe) {
    width: 100%;
    height: 100svh;
    min-height: 100svh;
    overflow: hidden;
}

body:has(iframe) .app,
body:has(iframe) .frame,
body:has(iframe) .board {
    max-width: 100%;
    max-height: 100svh;
    min-height: 0;
}

body:has(iframe) .app {
    height: 100svh;
}

body:has(iframe) .board {
    width: min(1250px, calc(100vw - 16px));
    height: min(570px, calc(100svh - 16px));
}

body:has(iframe) .content,
body:has(iframe) .main,
body:has(iframe) .screen,
body:has(iframe) .iframe-wrapper {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

body:has(iframe) iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

@media (min-width: 1025px) {
    body:has(iframe) .sidebar {
        width: clamp(190px, 17vw, 300px);
        min-width: 0;
        min-height: 0;
    }

    body:has(iframe) .topbar,
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .nav-group {
        flex-shrink: 0;
    }

    body:has(iframe) .nav-container,
    body:has(iframe) .nav-wrapper,
    body:has(iframe) .sidebar-scroll,
    body:has(iframe) .menu {
        max-height: 100svh;
        overflow: hidden;
    }

    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(10px, 2.8vw, 44px);
        padding: clamp(6px, 1.4dvh, 14px) clamp(8px, 1.4vw, 20px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        min-height: 0;
        max-width: 100%;
    }
}

@media (min-width: 1025px) and (max-height: 760px) {
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(8px, 2vw, 24px);
        padding-block: clamp(4px, 1dvh, 10px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        padding: clamp(8px, 1.4dvh, 14px) clamp(10px, 1.4vw, 22px);
        font-size: clamp(15px, 1.2vw, 20px);
    }

    body:has(iframe) .puzzle {
        width: clamp(150px, 14vw, 210px);
        height: clamp(54px, 8dvh, 70px);
    }

    body:has(iframe) .sidebar {
        width: clamp(190px, 16vw, 240px);
    }
}

</button>

</div>

</div>

<script>

/* QUESTIONS */
const questions=[

{
q:"Q1. A _____ is a dry land with very less water and vegetation.",
a:"desert",
img:"../images/ftb11.png"
},

{
q:"Q2. The people in deserts use camel for _____.",
a:"transportation",
img:"../images/ftb22.png"
},

{
q:"Q3. The areas where the land touches the sea water are the _____ plains.",
a:"coastal",
img:"../images/ftb3.png"
},

{
q:"Q4. An _____ is a naturally formed piece of land surrounded by water on all sides.",
a:"island",
img:"../images/ftb4.png"
},

{
q:"Q5. _____ are mostly formed by flowing water, rivers or glaciers.",
a:"valleys",
img:"../images/ftb55.png"
}

];

let index=0;
let score=0;

let userAnswers=
new Array(questions.length)
.fill(null);

let filledSlots=[];

/* SPEECH */
 function speak(text){

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang="en-UK";

speech.rate=1;

speech.pitch=1;

speech.volume=0.25;

speechSynthesis.speak(speech);

}

/* PROGRESS */
function updateProgress(){

let slots=
[...document.querySelectorAll(".slot")];

let filled=
slots.filter(s=>s.textContent!=="").length;

let percent=
(filled/slots.length)*100;

document
.getElementById("progressFill")
.style.width=percent+"%";

}

/* LOAD */
function renderQuestion(){

let q=questions[index];

questionImage.src=q.img;

questionText.innerHTML=
q.q.replace(
"_______",
"<span style='border-bottom:2px dashed #333;padding:0 25px;'> </span>"
);

let answer=
q.a.toUpperCase();

filledSlots=[];

slots.innerHTML=
'<div class="progress-fill" id="progressFill"></div>';

pool.innerHTML="";

/* SLOT */
for(let i=0;i<answer.length;i++){

slots.innerHTML+=
`<div class="slot"></div>`;

}

/* RESTORE */
if(userAnswers[index]){

let saved=
userAnswers[index];

let slotEls=
[...document.querySelectorAll(".slot")];
saved.word
.toUpperCase()
.split("")
.forEach((ch,i)=>{

    slotEls[i].textContent = ch;

    slotEls[i].classList.add("correct");

});

nextBtn.disabled=false;

}
else{

let letters=
answer
.split("")
.sort(()=>Math.random()-.5);

letters.forEach(l=>{

pool.innerHTML+=
`<div class="letter"
onclick="selectLetter(this)">${l}</div>`;

});

nextBtn.disabled=true;

}

updateProgress();

}function selectLetter(el){

    if(el.classList.contains("used")) return;

    let slotsArr = [...document.querySelectorAll(".slot")];

    let empty = slotsArr.find(s => s.textContent === "");

    if(!empty) return;

    empty.textContent = el.textContent;

    filledSlots.push({
        slot: empty,
        letter: el
    });

    el.classList.add("used");

    /* MOBILE BACKSPACE */
    empty.onclick = function(){

        // Don't allow editing after correct answer
        if(userAnswers[index]) return;

        if(this.textContent === "") return;

        let item = filledSlots.find(x => x.slot === this);

        if(item){

            item.letter.classList.remove("used");

            filledSlots = filledSlots.filter(x => x.slot !== this);

        }

        this.textContent = "";
        this.classList.remove("correct","wrong");

        updateProgress();

    };

    updateProgress();

    checkAnswer();

}
/* BACKSPACE */
document.addEventListener(
"keydown",
function(e){

if(e.key!=="Backspace")
return;

if(filledSlots.length===0)
return;

let last=
filledSlots.pop();

last.slot.textContent="";

last.slot.classList.remove(
"correct",
"wrong"
);

last.letter.classList.remove(
"used"
);

updateProgress();

});

/* CHECK */
function checkAnswer(){

let slotsArr=
[...document.querySelectorAll(".slot")];
let enteredWord =
slotsArr
.map(s=>s.textContent)
.join("");

let word =
enteredWord.toLowerCase();

let correct =
questions[index]
.a
.toLowerCase();

if(word.length!==correct.length)
return;

/* CORRECT */
if(word===correct){

slotsArr.forEach(s=>
s.classList.add("correct")
);
userAnswers[index]={
    word:enteredWord.toUpperCase()
};
score++;

confetti({

particleCount:120,
spread:90

});

showPopup("correct");

speak("Correct");

nextBtn.disabled=false;

if(index===questions.length-1){

setTimeout(showFinal,1200);

}

}

/* WRONG */
else{

slotsArr.forEach(s=>
s.classList.add("wrong")
);

showPopup("wrong");

speak("Try Again");

setTimeout(()=>{

slotsArr.forEach(s=>{

s.textContent="";

s.classList.remove("wrong");

});

document
.querySelectorAll(".letter")
.forEach(l=>
l.classList.remove("used")
);

filledSlots=[];

updateProgress();

},800);

}

}

/* POPUP */
function showPopup(type){

const overlay=
document.getElementById(
"popupOverlay"
);

const popupBox=
document.getElementById(
"popupBox"
);

const popupTitle=
document.getElementById(
"popupTitle"
);

const popupEmoji=
document.getElementById(
"popupEmoji"
);

/* RESET */
popupBox.className=
"popup-box";

/* CORRECT */
if(type==="correct"){

popupBox.classList.add(
"correct-popup"
);

popupTitle.innerHTML=
"Correct!";

popupEmoji.innerHTML=
"🎉";

}

/* WRONG */
else{

popupBox.classList.add(
"wrong-popup"
);

popupTitle.innerHTML=
"Try Again!";

popupEmoji.innerHTML=
"😢";

}

/* SHOW */
overlay.classList.add(
"show"
);

/* HIDE */
setTimeout(()=>{

overlay.classList.remove(
"show"
);

},1400);

}

/* NEXT */
function nextQ(){

if(index<questions.length-1){

index++;

renderQuestion();

}
else{

showFinal();

}

}

/* PREV */
function prevQ(){

if(index>0){

index--;

renderQuestion();

}

}

/* FINAL */
function showFinal(){

document
.getElementById("finalText")
.innerHTML=

` Score : ${score}/${questions.length}`;

document
.getElementById("finalPopup")
.classList.add(
"show"
);

confetti({

particleCount:250,
spread:120

});

}

/* RESET */
function restartQuiz(){

index=0;

score=0;

userAnswers.fill(null);

document
.getElementById("finalPopup")
.classList.remove(
"show"
);

renderQuestion();

}

/* INIT */
renderQuestion();

</script>
<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
</body>
