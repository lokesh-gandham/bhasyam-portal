<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Matching Game</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

padding:10px;


}

/* ===================== */
/* MAIN */
/* ===================== */

.main{

width:100%;
max-width:900px;

display:flex;
flex-direction:column;
justify-content:flex-start;
align-items:center;

padding:1px;

position:relative;

}

/* ===================== */
/* MATCH AREA */
/* ===================== */

.match-wrapper{

width:100%;

display:grid;

grid-template-columns:
1fr 1fr;

column-gap:140px;

justify-content:center;
align-items:start;

position:relative;

max-width:900px;

margin:auto;

}

/* SVG */

#lineSvg{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

pointer-events:none;

overflow:visible;

z-index:1;

}

/* ===================== */
/* CURVED DASHED LINE */
/* ===================== */

.match-line{

fill:none;

stroke:#b388eb;

stroke-width:4;

stroke-dasharray:10 10;

stroke-linecap:round;

filter:
drop-shadow(0 0 5px rgba(179,136,235,.45));

animation:dashMove 1s linear infinite;

}

@keyframes dashMove{

to{
stroke-dashoffset:-40;
}

}

/* ===================== */
/* COLUMNS */
/* ===================== */

.column{

display:flex;
flex-direction:column;

gap:10px;

z-index:2;

width:100%;

}

/* ===================== */
/* MATCH BOX */
/* ===================== */
.match-item{

width:100%;
height:80px;

display:flex;
align-items:center;

gap:15px;
padding:18px 24px;

border-radius:24px;

background:#dbeade;      /* Single pastel green */

border:3px solid #a8d1b0; /* Slightly darker border */

color:#2F4F4F;

box-shadow:0 8px 18px rgba(0,0,0,.05);

transition:.25s;

cursor:pointer;

}


.match-item:hover{

transform:
translateY(-3px);

background:#fff1f1;

}
.match-item.active{

background:#EEF6FF;

border:3px solid #8FBCEB;

transform:scale(1.02);

box-shadow:0 0 0 4px rgba(143,188,235,.18);

}

/* CORRECT */
.match-item.correct{

border:3px solid #57cc99 !important;

background:#edfdf2 !important;

pointer-events:none;

}
/* WRONG */
.match-item.wrong{

border:3px solid #ff4d6d !important;

background:#ffe5ea !important;

animation:shake .35s;

}

@keyframes shake{

0%{
transform:translateX(0);
}

25%{
transform:translateX(-4px);
}

50%{
transform:translateX(4px);
}

75%{
transform:translateX(-4px);
}

100%{
transform:translateX(0);
}

}

/* ===================== */
/* IMAGE */
/* ===================== */

.icon-box{

width:74px;
height:74px;

border-radius:20px;


display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

flex-shrink:0;


}

.icon-box img{

width:90%;
height:90%;

object-fit:contain;

}

/* ===================== */
/* TEXT */
/* ===================== */

.item-text{

font-size:22px;

font-weight:400;

color:#2f4f4f;

line-height:1.2;

}

.left .match-item{
    justify-content: center;
}

.left .item-text{
    width:100%;
}
/* ===================== */
/* POPUP */
/* ===================== */

.popup-overlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

display:none;

justify-content:center;
align-items:center;


z-index:9999;

}

.popup-overlay.show{

display:flex;

}

.popup-box{

width:350px;

padding:35px 25px;

border-radius:38px;

text-align:center;

animation:popupShow .45s ease;

}

.correct-popup{

background:
linear-gradient(
135deg,
#b8f2e6,
#aed9ff,
#d0bfff
);

border:6px solid #57cc99;

}

.wrong-popup{

background:
linear-gradient(
135deg,
#ffd6e0,
#ffc2d1,
#ffd6a5
);

border:6px solid #ff4d6d;

}

.final-popup{
background:
    linear-gradient(
    135deg,
    #FFF8B5,
    #FFE6A7,
    #FFD6A5
    );

    border:6px solid #FFB703;

    box-shadow:
    0 0 45px rgba(255,183,3,.35);
}

.popup-emoji{

font-size:85px;

margin-bottom:10px;

animation:bounce 1s infinite;

}

.popup-title{

font-size:36px;
font-weight: 500;
color:#2f4f4f;

}

.play-again{

margin-top:20px;

padding:14px 28px;

border:none;

border-radius:24px;

    
   background:linear-gradient(135deg,#4ADE80,#22C55E);

box-shadow:
0 10px 25px rgba(34,197,94,.35),
0 5px 0 #16A34A;

color:white;

font-size:20px;

cursor:pointer;

}

@keyframes popupShow{

0%{

opacity:0;

transform:
scale(.6)
rotate(-5deg);

}

100%{

opacity:1;

transform:
scale(1)
rotate(0);

}

}

@keyframes bounce{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

}

<body>

<div class="main">

<div class="match-wrapper">

<svg id="lineSvg"></svg>

<!-- LEFT -->

<div class="column left"
id="leftColumn">
</div>

<!-- RIGHT -->

<div class="column right"
id="rightColumn">
</div>

</div>

<!-- NAV -->

</div>

<!-- POPUP -->

<!-- FINAL POPUP -->

<div class="popup-overlay"
id="finalPopup">

<div class="popup-box final-popup">

<div class="popup-emoji">

🏆

</div>
<h2 class="popup-title score-title">

 Score : 5/5

</h2>

<button class="play-again"
onclick="restartQuiz()">

 Play Again

</button>

</div>

</div>

<script>
const leftData=[

{
text:"Shimla",
img:"../images/shimla.png",
match:"c"
},

{
text:"Himadri range",
img:"../images/himalaya.png",
match:"a"
},

{
text:"Ship of the desert",
img:"../images/camel.png",
match:"b"
},

{
text:"Largest hot desert",
img:"../images/desertimage.png",
match:"e"
},

{
text:"Deccan plateau",
img:"../images/plateau.png",
match:"d"
}

];

const rightData=[

{
id:"a",
text:"Greater himalayas"
},

{
id:"b",
text:"Camel"
},

{
id:"c",
text:"Hill station"
},

{
id:"d",
text:"Peninsular plateau"
},

{
id:"e",
text:"Sahara desert"
}

];

const leftColumn=
document.getElementById("leftColumn");

const rightColumn=
document.getElementById("rightColumn");

const svg=
document.getElementById("lineSvg");

let selected=null;

let matched=0;

/* SPEAK */
 function speak(text){

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang="en-UK";

speech.rate=1;

speech.pitch=1;

speech.volume=0.25;

speechSynthesis.speak(speech);

}

/* CREATE LEFT */
/* CREATE LEFT */

leftData.forEach(item => {

    let div = document.createElement("div");

    div.className = "match-item";

    div.dataset.match = item.match;

    div.innerHTML = `
        <div class="item-text">
            ${item.text}
        </div>
    `;

    div.onclick = () => selectLeft(div);

    leftColumn.appendChild(div);

});



/* CREATE RIGHT */
rightData.forEach(item => {

    let div = document.createElement("div");

    div.className = "match-item";

    div.dataset.id = item.id;

    // Find the matching left item to get its image
    const leftItem = leftData.find(l => l.match === item.id);

    div.innerHTML = `
        <div class="icon-box">
            <img src="${leftItem.img}">
        </div>

        <div class="item-text">
            ${item.text}
        </div>
    `;

    div.onclick = () => selectRight(div);

    rightColumn.appendChild(div);

});
/* SELECT LEFT */

function selectLeft(el){

if(el.classList.contains("correct"))
return;

document
.querySelectorAll(".left .match-item")
.forEach(i=>
i.classList.remove("active")
);

selected=el;

el.classList.add(
"active"
);

}
function selectRight(rightEl){

if(!selected)
return;

let correct=
selected.dataset.match===
rightEl.dataset.id;

/* CORRECT */

if(correct){

selected.classList.remove(
"active"
);

selected.classList.add(
"correct"
);

rightEl.classList.add(
"correct"
);


/* MOBILE COLOR MATCH */

const leftItems=
document.querySelectorAll(
".left .match-item"
);

leftItems.forEach((item,index)=>{

if(item===selected){

rightEl.classList.add(
`color${index+1}`
);

}

});

/* DRAW LINE ONLY DESKTOP */

if(window.innerWidth>768){

drawCurve(
selected,
rightEl
);

}

matched++;

speak("Correct");

confetti({

particleCount:80,
spread:80

});

/* FINAL POPUP */

if(matched===5){

setTimeout(()=>{

document
.getElementById("finalPopup")
.classList.add("show");

},1000);

}

}

/* WRONG */
else{

    rightEl.classList.add("wrong");

    // Remove left selection immediately
    selected.classList.remove("active");

    speak("Try again");

    setTimeout(()=>{

        rightEl.classList.remove("wrong");

    },700);

    selected = null;

}

}
/* DRAW CURVE */

function drawCurve(left,right){

let svgRect=
svg.getBoundingClientRect();

let leftRect=
left.getBoundingClientRect();

let rightRect=
right.getBoundingClientRect();

let x1=
leftRect.right-svgRect.left;

let y1=
leftRect.top+
leftRect.height/2-
svgRect.top;

let x2=
rightRect.left-svgRect.left;

let y2=
rightRect.top+
rightRect.height/2-
svgRect.top;

let curve=
document.createElementNS(
"http://www.w3.org/2000/svg",
"path"
);

let dx=(x2-x1)/2;

let d=`

M ${x1} ${y1}

C ${x1+dx} ${y1},
${x2-dx} ${y2},
${x2} ${y2}

`;

curve.setAttribute("d",d);

curve.setAttribute(
"class",
"match-line"
);

svg.appendChild(curve);

}

/* POPUP */
function showPopup(type){

popupBox.className=
"popup-box";

if(type==="correct"){

popupBox.classList.add(
"correct-popup"
);

popupTitle.innerHTML=
"Correct!";

popupEmoji.innerHTML=
"🎉";

}
else{

popupBox.classList.add(
"wrong-popup"
);

popupTitle.innerHTML=
"Try Again!";

popupEmoji.innerHTML=
"😢";

}

popupOverlay.classList.add(
"show"
);

setTimeout(()=>{

popupOverlay.classList.remove(
"show"
);

},1300);

}

/* RESTART */

function restartQuiz(){

location.reload();

}

</script>

(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
