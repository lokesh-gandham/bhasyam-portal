<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:1px;

overflow:hidden;

}

/* ========================= */
/* MAIN */
/* ========================= */

.main{

width:100%;
max-width:1350px;

display:flex;
flex-direction:column;
justify-content:flex-start;
align-items:center;

padding:10px;

gap:10px;

border-radius:38px;

}

/* ========================= */
/* QUESTION */
/* ========================= */

.question{

width:100%;

min-height:80px;

display:flex;
justify-content:center;
align-items:center;

text-align:left;

padding:0 20px;

font-size:30px;

line-height:1.3;

color:#2f4f4f;

flex-shrink:0;
}

/* ========================= */
/* QUIZ AREA */
/* ========================= */

.quiz-area{

width:100%;

display:flex;
justify-content:center;
align-items:center;

gap:60px;

flex-wrap:wrap;

}

/* ========================= */
/* IMAGE */
/* ========================= */

.image-box{

width:300px;
height:280px;

border-radius:38px;

background:
linear-gradient(
135deg,
#ffe5ec,
#d6f0ff
);

display:flex;
justify-content:center;
align-items:center;

position:relative;

overflow:hidden;

flex-shrink:0;

}

.image-box::before{

content:"";

position:absolute;

width:110px;
height:110px;

border-radius:50%;

background:
rgba(255,255,255,.22);

top:-25px;
right:-25px;

}

.image-box img{

width:90%;

object-fit:contain;

position:relative;

z-index:2;

}
/* ========================= */
/* OPTIONS */
/* ========================= */

.options{

display:flex;
flex-direction:column;

gap:14px;

width:360px;

max-width:100%;

}

/* ========================= */
/* OPTION */
/* ========================= */

.option{

width:100%;

min-height:72px;

display:flex;
align-items:center;

gap:14px;

padding:10px 14px;

cursor:pointer;

position:relative;

transition:.28s;

overflow:hidden;

border-radius:22px;

border:none;

}

/* LAYER EFFECT */

.option::before{

content:"";

position:absolute;

left:8px;
right:8px;
bottom:-6px;

height:100%;

border-radius:22px;

z-index:-1;

opacity:.8;

}

/* OPTION 1 */

.option:nth-child(1){

background:
linear-gradient(
135deg,
#ffb3c6,
#ffdce5
);

}

.option:nth-child(1)::before{

background:#ff8fab;

}

/* OPTION 2 */

.option:nth-child(2){

background:
linear-gradient(
135deg,
#caffbf,
#ecfccb
);

}

.option:nth-child(2)::before{

background:#52b788;

}

/* OPTION 3 */

.option:nth-child(3){

background:
linear-gradient(
135deg,
#bde0fe,
#e0f4ff
);

}

.option:nth-child(3)::before{

background:#4dabf7;

}

/* HOVER */

.option:hover{

transform:
translateY(-4px)
scale(1.03);

}

/* CORRECT */

.option.correct{

outline:2px solid #00c853;

}

/* WRONG */

.option.wrong{

outline:4px solid #ff4d6d;

animation:shake .35s;

}

/* DISABLE */

.option.disabled{

pointer-events:none;

}
/* ========================= */
/* OPTION ICON */
/* ========================= */

.option-icon{

width:58px;
height:58px;

border-radius:20px;


display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

flex-shrink:0;

position:relative;


}


/* IMAGE */

.option-icon img{

width:100%;
height:100%;

object-fit:contain;

position:relative;

z-index:2;

}

/* ========================= */
/* TEXT */
/* ========================= */

.option-text{

font-size:24px;

font-weight:500;

color:#2f4f4f;

}

/* ========================= */
/* SHAKE */
/* ========================= */

@keyframes shake{

0%{
transform:translateX(0);
}

25%{
transform:translateX(-5px);
}

50%{
transform:translateX(5px);
}

75%{
transform:translateX(-5px);
}

100%{
transform:translateX(0);
}

}
/* ========================= */
/* NAV */
/* ========================= */

.nav-buttons{

width:100%;

display:flex;
justify-content:space-between;
align-items:center;

gap:20px;

}

/* ========================= */
/* BUTTON */
/* ========================= */

button{

width:125px;
height:50px;


border:none;

border-radius:24px;

font-size:20px;

color:white;

cursor:pointer;

transition:.25s;

}

/* PREV */

.prev{

background:
linear-gradient(
135deg,
#00b894,
#55efc4
);

}

/* NEXT */

.next{

background:
linear-gradient(
135deg,
#c77dff,
#9d4edd
);

}

/* HOVER */

button:hover{

transform:
translateY(-4px)
scale(1.03);

}

/* DISABLED */

.next:disabled{

background:
linear-gradient(
135deg,
#d3d3d3,
#bdbdbd
);

cursor:not-allowed;

transform:none;

}

/* ========================= */
/* POPUP */
/* ========================= */

.popup-overlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

display:none;

justify-content:center;
align-items:center;


z-index:9999;

}

/* SHOW */

.popup-overlay.show{

display:flex;

}

/* POPUP BOX */

.popup-box{

width:360px;

padding:38px 28px;

border-radius:40px;

position:relative;

overflow:hidden;

text-align:center;

animation:popupShow .45s ease;

}

/* CORRECT */

.correct-popup{

background:
linear-gradient(
135deg,
#b8f2e6,
#aed9ff,
#d0bfff
);

border:6px solid #57cc99;

box-shadow:
0 0 40px rgba(87,204,153,.35);

}

/* WRONG */

.wrong-popup{

background:
linear-gradient(
135deg,
#ffd6e0,
#ffc2d1,
#ffd6a5
);

border:6px solid #ff4d6d;

box-shadow:
0 0 40px rgba(255,77,109,.3);

}

/* FINAL */
.final-popup{

    background:
    linear-gradient(
    135deg,
    #FFF8B5,
    #FFE6A7,
    #FFD6A5
    );

    border:6px solid #FFB703;

    box-shadow:
    0 0 45px rgba(255,183,3,.35);

}
/* EMOJI */

.popup-emoji{

font-size:90px;

margin-bottom:12px;

animation:bounce 1s infinite;

}

/* TITLE */

.popup-title{

font-size:32px;

font-weight:500;

color:#2f4f4f;

margin-bottom:10px;

}

/* BUTTON */
.play-again{
    width:200px;
    height:70px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;

    margin:30px auto 0;

    border:none;
    border-radius:26px;

   background:linear-gradient(135deg,#4ADE80,#22C55E);

box-shadow:
0 10px 25px rgba(34,197,94,.35),
0 5px 0 #16A34A;
    color:#fff;
    font-size:25px;
    font-weight:600;

    cursor:pointer;


    transition:.3s;
}

.play-again:hover{
    transform:translateY(-4px) scale(1.05);
}

/* ANIMATION */

@keyframes popupShow{

0%{

opacity:0;

transform:
scale(.6)
rotate(-6deg);

}

100%{

opacity:1;

transform:
scale(1)
rotate(0);

}

}

@keyframes bounce{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

}

<style id="codex-responsive-shell">
html {

    height: 100%;

}

/* SPEAK */
 function speak(text){

speech.pitch=1;

function renderQuestion(){

q.options.forEach(opt=>{

document.createElement("div");

"disabled"

opt.text===
userAnswers[index]

"selected"

opt.text===
q.correct

"correct"
);

}

}

/* HTML */

<img src="${opt.icon}">

</div>

<div class="option-text">
${opt.text}
</div>
`;

/* CLICK */

div.onclick=()=>selectOption(
div,
opt.text
);

options.appendChild(div);

});

/* NEXT */

nextBtn.disabled=
!userAnswers[index];

}

<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
