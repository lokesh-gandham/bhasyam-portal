<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Word Quiz</title>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 10px;

            overflow: hidden;


        }

        /* ====================== */
        /* MAIN */
        /* ====================== */

        .main {

            width: 100%;
            max-width: 1350px;

            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;

            padding: 10px;

        }

        /* ====================== */
        /* QUESTION */
        /* ====================== */

        .question {

            width: 100%;

            min-height: 110px;
            height: auto;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: left;

            font-size: 30px;

            line-height: 1.3;

            color: #2f4f4f;

            padding: 0 20px;
        }

        /* ====================== */
        /* IMAGE */
        /* ====================== */

        .image-box {

            width: 300px;
            height: 280px;

            border-radius: 35px;


            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            overflow: hidden;

        }


        .image-box img {

            width: 80%;

            object-fit: contain;

            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            z-index: 2;

        }

        /* Larger image for specific questions – grows without shifting the layout */
        .image-box {
            overflow: visible;
        }

        .image-box.big img {
            width: 120%;
            max-width: none;
        }

        /* ====================== */
        /* ANSWER AREA */
        /* ====================== */

        .answer-area {


            display: flex;
            justify-content: center;
            align-items: center;

            gap: 14px;

            flex-wrap: wrap;

            padding: 0 20px;

        }

        /* ====================== */
        /* ANSWER BOX */
        /* ====================== */

        .char-box {

            width: 62px;
            height: 72px;

            border: none;

            outline: none;

            border-radius: 22px;

            text-align: center;

            font-size: 25px;

            font-weight: 600;

            color: #2f4f4f;
            background: #fefffe;
            border: 2px solid gray;
            box-shadow:
                0 8px 18px rgba(0, 0, 0, .14),
                inset 0 2px 6px rgba(255, 255, 255, .8);

            transition: .22s;

            position: relative;

        }

        /* SHINE */

        .char-box::placeholder {

            color: #2f4f4f;

            opacity: .5;

        }

        /* FOCUS */

        .char-box:focus {


            box-shadow:
                0 0 20px rgba(155, 93, 229, .45);
            background: #b7efc5;

        }

        /* CORRECT */
        .char-box.correct {

            background: #80ED99;

            border: 3px solid #2d6a4f;

            color: #1b4332;

            box-shadow: 0 0 18px rgba(87, 204, 153, .45);

        }

        .word-gap {
            width: 30px;
            /* Increase if you want a larger gap */
            height: 1px;
            flex-shrink: 0;
        }

        /* ====================== */
        /* NAV */
        /* ====================== */

        .nav-buttons {

            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;


            gap: 20px;
            margin-top: 10px;

        }

        /* BUTTON */

        button {

            width: 125px;
            height: 50px;


            border: none;

            border-radius: 24px;

            font-size: 20px;

            color: white;

            cursor: pointer;

            transition: .25s;

        }

        /* PREV */

        .prev {

            background:
                linear-gradient(135deg,
                    #00b894,
                    #55efc4);

        }

        /* NEXT */

        .next {

            background:
                linear-gradient(135deg,
                    #c77dff,
                    #9d4edd);

        }

        /* HOVER */

        button:hover {

            transform:
                translateY(-4px) scale(1.03);

        }

        /* DISABLED */

        .next:disabled {

            background:
                linear-gradient(135deg,
                    #d3d3d3,
                    #bdbdbd);

            cursor: not-allowed;

            transform: none;

        }

        /* ====================== */
        /* POPUP */
        /* ====================== */

        .popup-overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: none;

            justify-content: center;
            align-items: center;


            z-index: 9999;

        }

        .popup-overlay.show {

            display: flex;

        }

        .popup-box {

            width: 360px;

            padding: 38px 28px;

            border-radius: 40px;

            text-align: center;

            animation: popupShow .45s ease;

        }

        /* CORRECT */

        .correct-popup {

            background:
                linear-gradient(135deg,
                    #b8f2e6,
                    #aed9ff,
                    #d0bfff);

            border: 6px solid #57cc99;

        }

        /* WRONG */

        .wrong-popup {

            background:
                linear-gradient(135deg,
                    #ffd6e0,
                    #ffc2d1,
                    #ffd6a5);

            border: 6px solid #ff4d6d;

        }

        /* FINAL */

        .final-popup {
            background:
                linear-gradient(135deg,
                    #FFF8B5,
                    #FFE6A7,
                    #FFD6A5);

            border: 6px solid #FFB703;

            box-shadow:
                0 0 45px rgba(255, 183, 3, .35);

        }

        /* EMOJI */

        .popup-emoji {

            font-size: 90px;

            margin-bottom: 12px;

            animation: bounce 1s infinite;

        }

        /* TITLE */

        .popup-title {

            font-size: 32px;

            font-weight: 500;

            color: #2f4f4f;

            margin-bottom: 10px;

        }

        /* PLAY AGAIN */

        /* BUTTON */
        .play-again {
            width: 200px;
            height: 70px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;

            margin: 30px auto 0;

            border: none;
            border-radius: 26px;


            background: linear-gradient(135deg, #4ADE80, #22C55E);

            box-shadow:
                0 10px 25px rgba(34, 197, 94, .35),
                0 5px 0 #16A34A;

            color: #fff;
            font-size: 20px;
            font-weight: 600;

            cursor: pointer;


            transition: .3s;
        }

        .play-again:hover {
            transform: translateY(-4px) scale(1.05);
        }


        /* ====================== */
        /* ANIMATION */
        /* ====================== */

        @keyframes popupShow {

            0% {

                opacity: 0;

                transform:
                    scale(.6) rotate(-6deg);

            }

            100% {

                opacity: 1;

                transform:
                    scale(1) rotate(0);

            }

        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

        }

    <style id="codex-responsive-shell">
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            max-width: 100%;
            overflow: hidden;
        }

        img,
        svg,
        canvas,
        video {
            max-width: 100%;
        }

        iframe {
            display: block;
            max-width: 100%;
        }

        body:has(iframe) {
            width: 100%;
            height: 100svh;
            min-height: 100svh;
            overflow: hidden;
        }

        body:has(iframe) .app,
        body:has(iframe) .frame,
        body:has(iframe) .board {
            max-width: 100%;
            max-height: 100svh;
            min-height: 0;
        }

        body:has(iframe) .app {
            height: 100svh;
        }

        body:has(iframe) .board {
            width: min(1250px, calc(100vw - 16px));
            height: min(570px, calc(100svh - 16px));
        }

        body:has(iframe) .content,
        body:has(iframe) .main,
        body:has(iframe) .screen,
        body:has(iframe) .iframe-wrapper {
            min-width: 0;

            overflow: hidden;
        }

        body:has(iframe) iframe {
            width: 100%;

            border: 0;
        }

            body:has(iframe) .nav-container,

    <script>

        const questions = [

            {
                q: "Q1. This range is also called the middle Himalayas.",
                a: "HIMACHAL",
                img: "../images/ow1.png"
            },

            {
                q: "Q2. They form a huge wall along the northern border of India.",
                a: "HIMALAYAS",
                img: "../images/ow22.png"
            },

            {
                q: "Q3. They have sloping sides and are of various shapes and sizes.",
                a: "HILLS",
                img: "../images/ow33.png"
            },

            {
                q: "Q4. They are also known as tablelands.",
                a: "PLATEAUS",
                img: "../images/ow44.png"
            },

            {
                q: "Q5. They have mild summers and extremely cold winters.",
                a: "COLD DESERTS",
                img: "../images/coldesert.png",
                bigImg: true
            }

        ];

        let index = 0;

        let score = 0;

        let answered =
            new Array(questions.length)
                .fill(false);

        /* SPEAK */
        function speak(text) {

            window.speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-UK";

            speech.rate = 1;

            speech.pitch = 1;

            speech.volume = 0.25;

            speechSynthesis.speak(speech);

        }

        /* RENDER */

        function renderQuestion() {

            let q =
                questions[index];

            questionText.innerHTML = q.q;

            questionImage.src = q.img;

            questionImage.parentElement.classList.toggle("big", !!q.bigImg);

            answerArea.innerHTML = "";

            nextBtn.disabled = true;

            prevBtn.disabled =
                (index === 0);

            /* CREATE BOX */

            const parts = q.a.split(" ");

            parts.forEach((word, wordIndex) => {

                for (let i = 0; i < word.length; i++) {

                    let input = document.createElement("input");

                    input.maxLength = 1;
                    input.className = "char-box";

                    answerArea.appendChild(input);

                    /* TYPE */
                    input.oninput = () => {

                        input.value = input.value
                            .toUpperCase()
                            .replace(/[^A-Z]/g, "");

                        if (input.value) {

                            let next = input.nextElementSibling;

                            while (next && next.classList.contains("word-gap")) {
                                next = next.nextElementSibling;
                            }

                            if (next)
                                next.focus();
                            else
                                checkAnswer();
                        }
                    };

                    /* BACKSPACE */
                    input.onkeydown = (e) => {

                        if (e.key === "Backspace") {

                            if (input.value !== "") {
                                input.value = "";
                                e.preventDefault();
                                return;
                            }

                            let prev = input.previousElementSibling;

                            while (prev && prev.classList.contains("word-gap")) {
                                prev = prev.previousElementSibling;
                            }

                            if (prev) {
                                prev.value = "";
                                prev.focus();
                            }

                            e.preventDefault();
                        }
                    };
                }

                // Add a gap after each word except the last
                if (wordIndex < parts.length - 1) {

                    const gap = document.createElement("div");
                    gap.className = "word-gap";
                    answerArea.appendChild(gap);

                }

            });

            /* HOLD ANSWER */

            if (answered[index]) {

                let boxes =
                    document
                        .querySelectorAll(".char-box");

                boxes.forEach((b, i) => {

                    b.value = q.a[i];

                    b.disabled = true;

                    b.classList.add(
                        "correct"
                    );

                });

                nextBtn.disabled = false;

            }
            // Auto focus first box
            if (!answered[index]) {
                requestAnimationFrame(() => {
                    const firstBox = document.querySelector(".char-box");
                    if (firstBox) {
                        firstBox.focus();
                        firstBox.setSelectionRange(0, 0);
                    }
                });
            }
        }

        /* CHECK */

        function checkAnswer() {

            if (answered[index])
                return;

            let typed = "";

            document
                .querySelectorAll(".char-box")
                .forEach(b => {

                    typed += b.value;

                });

            typed = typed.replace(/\s/g, "");

            let q =
                questions[index];

            /* CORRECT */

           if (typed === q.a.replace(/\s/g, "")) {

                answered[index] = true;

                score++;

                document
                    .querySelectorAll(".char-box")
                    .forEach(b => {

                        b.classList.add(
                            "correct"
                        );

                        b.disabled = true;

                    });

                showPopup("correct");

                speak("Correct");

                confetti({

                    particleCount: 120,
                    spread: 90

                });

                if (index === questions.length - 1) {

                    setTimeout(() => {

                        showFinal();

                    }, 1400);

                }
                else {

                    nextBtn.disabled = false;

                }

            }

            /* WRONG */

            else {

                showPopup("wrong");

                speak("Try Again");

                document
                    .querySelectorAll(".char-box")
                    .forEach(b => {

                        b.value = "";

                    });

                document
                    .querySelector(".char-box")
                    .focus();

            }

        }

        /* POPUP */

        function showPopup(type) {

            popupBox.className =
                "popup-box";

            if (type === "correct") {

                popupBox.classList.add(
                    "correct-popup"
                );

                popupTitle.innerHTML =
                    "Correct!";

                popupEmoji.innerHTML =
                    "🎉";

            }
            else {

                popupBox.classList.add(
                    "wrong-popup"
                );

                popupTitle.innerHTML =
                    "Try Again!";

                popupEmoji.innerHTML =
                    "😢";

            }

            popupOverlay.classList.add(
                "show"
            );

            setTimeout(() => {

                popupOverlay.classList.remove(
                    "show"
                );

            }, 1400);

        }

        /* NEXT */

        nextBtn.onclick = () => {

            if (index < questions.length - 1) {

                index++;

                renderQuestion();

            }

        };

        /* PREV */

        prevBtn.onclick = () => {

            if (index > 0) {

                index--;

                renderQuestion();

            }

        };

        /* FINAL */

        function showFinal() {

            finalText.innerHTML =

                `Score : ${score}/${questions.length}`;

            finalPopup.classList.add(
                "show"
            );

            confetti({

                particleCount: 250,
                spread: 120

            });

        }

        /* RESTART */

        function restartQuiz() {

            index = 0;

            score = 0;

            answered.fill(false);

            finalPopup.classList.remove(
                "show"
            );

            renderQuestion();

        }

        /* START */

        renderQuestion();
        document.getElementById("questionImage").ondragstart = function () {
            return false;
        };
    </script>
    <script id="codex-viewport-fit">
        (function () {
            if (window.__codexViewportFit) return;
            window.__codexViewportFit = true;

            const hasIframe = Boolean(document.querySelector("iframe"));
            const selectors = [
                ".main",
                ".main-container",
                ".quiz",
                ".quiz-container",
                ".quiz-box",
                ".container",
                ".stage",
                ".screen",
                ".game",
                ".template",
                ".quiz-card",
                ".app"
            ];
            const minScale = 0.62;
            let rafId = 0;

            function setViewportRules() {
                document.documentElement.style.width = "100%";
                document.documentElement.style.height = "100%";
                document.documentElement.style.overflow = "hidden";
                document.body.style.width = "100%";
                document.body.style.height = "100svh";
                document.body.style.minHeight = "100svh";
                document.body.style.overflow = "hidden";
            }

            function getStage() {
                for (const selector of selectors) {
                    const stage = document.querySelector(selector);
                    if (stage) return stage;
                }
                return null;
            }

            function fitToViewport() {
                setViewportRules();
                if (hasIframe) return;

                const stage = getStage();
                if (!stage) return;

                stage.style.transform = "scale(1)";
                stage.style.transformOrigin = "center center";

                const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                const rect = stage.getBoundingClientRect();
                const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                const scale = Math.max(
                    minScale,
                    Math.min(
                        1,
                        (viewportWidth - breathingRoom * 2) / contentWidth,
                        (viewportHeight - breathingRoom * 2) / contentHeight
                    )
                );

                stage.style.transform = `scale(${scale})`;
            }

            function requestFit() {
                cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(fitToViewport);
            }

            window.addEventListener("load", requestFit);
            window.addEventListener("resize", requestFit);
            window.addEventListener("orientationchange", requestFit);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(requestFit).catch(function () { });
            }

            document.querySelectorAll("img").forEach(function (img) {
                img.addEventListener("load", requestFit, { once: false });
            });

            if ("ResizeObserver" in window) {
                const observer = new ResizeObserver(requestFit);
                const observeStage = function () {
                    const stage = getStage();
                    if (stage) observer.observe(stage);
                };
                observeStage();
                window.addEventListener("load", observeStage);
            }

            if (document.body) {
                new MutationObserver(requestFit).observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }

            requestFit();
        })();
    </script>
