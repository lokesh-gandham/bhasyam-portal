<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Livvic';
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:1px;

overflow:hidden;

}

/* ========================= */
/* MAIN */
/* ========================= */

.main{

width:100%;
max-width:1350px;

display:flex;
flex-direction:column;
justify-content:flex-start;
align-items:center;

padding:10px;

gap:10px;

border-radius:38px;

}

/* ========================= */
/* QUESTION */
/* ========================= */

.question{

width:100%;

min-height:90px;
height:auto;

display:flex;
justify-content:center;
align-items:center;

text-align:left;

padding:0 20px;

font-size:30px;

line-height:1.3;

color:#2f4f4f;

flex-shrink:0;

}

/* ========================= */
/* QUIZ AREA */
/* ========================= */

.quiz-area{

width:100%;

display:flex;
justify-content:center;
align-items:center;

gap:90px;

flex-wrap:wrap;

}

/* ========================= */
/* IMAGE */
/* ========================= */

.image-box{

width:300px;
height:280px;

border-radius:50%;


display:flex;
justify-content:center;
align-items:center;

position:relative;

overflow:hidden;

flex-shrink:0;

}

.image-box img{

width:95%;

object-fit:contain;

position:relative;

z-index:2;

}

/* ========================= */
/* TRUE FALSE */
/* ========================= */

.options{

display:flex;
flex-direction:column;

gap:26px;

}

/* ========================= */
/* BUTTON */
/* ========================= */

.choice{

width:200px;
height:90px;

border-radius:28px;

display:flex;
justify-content:center;
align-items:center;

gap:14px;

cursor:pointer;

position:relative;

transition:.28s;

overflow:hidden;

}


/* TRUE */

.true{

background:
linear-gradient(
135deg,
#b7efc5,
#52b788
);

}

/* FALSE */

.false{

background:
linear-gradient(
135deg,
#ffc2d1,
#ff5d8f
);

}

/* ICON */

.tf-icon{

width:42px;
height:42px;

border-radius:14px;

background:white;

display:flex;
justify-content:center;
align-items:center;

font-size:24px;

font-weight:700;

color:#2f4f4f;

}

/* TEXT */

.tf-text{

font-size:28px;

font-weight:700;

color:white;

}

/* HOVER */

.choice:hover{

transform:
translateY(-4px)
scale(1.04);

}

/* CORRECT */

.choice.correct{

outline:4px solid #00c853;

}

/* WRONG */

.choice.wrong{

outline:4px solid #ff4d6d;

animation:shake .35s;

}

/* DISABLE */

.choice.disabled{

pointer-events:none;

}

/* SHAKE */

@keyframes shake{

0%{
transform:translateX(0);
}

25%{
transform:translateX(-5px);
}

50%{
transform:translateX(5px);
}

75%{
transform:translateX(-5px);
}

100%{
transform:translateX(0);
}

}

/* ========================= */
/* NAV */
/* ========================= */

.nav-buttons{

width:100%;

display:flex;
justify-content:space-between;
align-items:center;

gap:20px;


}

/* BUTTON */

button{

width:125px;
height:50px;



border:none;

border-radius:24px;

font-size:20px;

color:white;

cursor:pointer;

transition:.25s;

}

/* PREV */

.prev{

background:
linear-gradient(
135deg,
#00b894,
#55efc4
);

}

/* NEXT */

.next{

background:
linear-gradient(
135deg,
#c77dff,
#9d4edd
);

}

/* HOVER */

button:hover{

transform:
translateY(-4px)
scale(1.03);

}

/* DISABLED */

.next:disabled{

background:
linear-gradient(
135deg,
#d3d3d3,
#bdbdbd
);

cursor:not-allowed;

transform:none;

}

/* ========================= */
/* POPUP */
/* ========================= */

.popup-overlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

display:none;

justify-content:center;
align-items:center;

z-index:9999;

}

.popup-overlay.show{

display:flex;

}

.popup-box{

width:360px;

padding:38px 28px;

border-radius:40px;

position:relative;

overflow:hidden;

text-align:center;

animation:popupShow .45s ease;

}

/* CORRECT */

.correct-popup{

background:
linear-gradient(
135deg,
#b8f2e6,
#aed9ff,
#d0bfff
);

border:6px solid #57cc99;

}

/* WRONG */

linear-gradient(
135deg,
#ffd6e0,
#ffc2d1,
#ffd6a5

}

    #FFF8B5,

    0 0 45px rgba(255,183,3,.35);

/* EMOJI */

}

/* TITLE */

font-weight:500;

margin-bottom:10px;

}

/* PLAY AGAIN */

/* BUTTON */
.play-again{
    width:200px;
    height:70px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;

    margin:30px auto 0;

   background:linear-gradient(135deg,#4ADE80,#22C55E);

box-shadow:
0 10px 25px rgba(34,197,94,.35),
0 5px 0 #16A34A;
    color:#fff;

}

/* POPUP */

@keyframes popupShow{

0%{

opacity:0;

transform:
scale(.6)
rotate(-6deg);

}

100%{

opacity:1;

transform:
scale(1)
rotate(0);

}

}

<script>

const questions=[

{
q:"Q1. The soil near a valley is usually fertile.",
img:"../images/tf1.png",
correct:"T"
},

{
q:"Q2. The Lakshadweep Islands lie on the eastern side of India.",
img:"../images/tf22.png",
correct:"F"
},

{
q:"Q3. Coconut trees are grown more in the coastal plains.",
img:"../images/tf3.png",
correct:"T"
},

{
q:"Q4. Life is very easy in a desert.",
img:"../images/tf4.png",
correct:"F"
},

{
q:"Q5. The Himalayan Mountain Ranges in the northern part of India consist of three ranges.",
img:"../images/tf5.png",
correct:"T"
}

];

let index=0;

let score=0;

let userAnswers=
new Array(questions.length)
.fill(null);

/* SPEAK */
 function speak(text){

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang="en-UK";

speech.rate=1;

speech.pitch=1;

speech.volume=0.25;

speechSynthesis.speak(speech);

}

/* RENDER */

function renderQuestion(){

let q=questions[index];

questionText.innerHTML=q.q;

questionImage.src=q.img;

/* RESET */

trueBtn.classList.remove(
"correct",
"wrong",
"disabled"
);

falseBtn.classList.remove(
"correct",
"wrong",
"disabled"
);

/* HOLD ANSWER */

if(userAnswers[index]){

if(userAnswers[index]==="T"){

trueBtn.classList.add(
"correct"
);

}
else{

falseBtn.classList.add(
"correct"
);

}

trueBtn.classList.add(
"disabled"
);

falseBtn.classList.add(
"disabled"
);

nextBtn.disabled=false;

}
else{

nextBtn.disabled=true;

}

}

/* SELECT */

trueBtn.onclick=()=>select("T");
falseBtn.onclick=()=>select("F");

function select(choice){

if(userAnswers[index])
return;

let q=
questions[index];

/* CORRECT */

if(choice===q.correct){

userAnswers[index]=choice;

score++;

if(choice==="T"){

trueBtn.classList.add(
"correct"
);

}
else{

falseBtn.classList.add(
"correct"
);

}

trueBtn.classList.add(
"disabled"
);

falseBtn.classList.add(
"disabled"
);

showPopup("correct");

speak("Correct");

confetti({

particleCount:120,
spread:90

});

/* LAST QUESTION */

if(index===questions.length-1){

setTimeout(()=>{

showFinal();

},1400);

}
else{

nextBtn.disabled=false;

}

}

/* WRONG */

else{

if(choice==="T"){

trueBtn.classList.add(
"wrong"
);

}
else{

falseBtn.classList.add(
"wrong"
);

}

showPopup("wrong");

speak("Try Again");

setTimeout(()=>{

trueBtn.classList.remove(
"wrong"
);

falseBtn.classList.remove(
"wrong"
);

},700);

}

}

/* POPUP */

function showPopup(type){

popupBox.className=
"popup-box";

/* CORRECT */

if(type==="correct"){

popupBox.classList.add(
"correct-popup"
);

popupTitle.innerHTML=
"Correct!";

popupEmoji.innerHTML=
"🎉";

}

/* WRONG */

else{

popupBox.classList.add(
"wrong-popup"
);

popupTitle.innerHTML=
"Try Again!";

popupEmoji.innerHTML=
"😢";

}

/* SHOW */

popupOverlay.classList.add(
"show"
);

/* HIDE */

setTimeout(()=>{

popupOverlay.classList.remove(
"show"
);

},1400);

}

/* NEXT */

function nextQ(){

if(index<questions.length-1){

index++;

renderQuestion();

}

}

/* PREV */

function prevQ(){

if(index>0){

index--;

renderQuestion();

}

}

/* FINAL */

function showFinal(){

finalText.innerHTML=

`Score : ${score}/${questions.length}`;

finalPopup.classList.add(
"show"
);

confetti({

particleCount:250,
spread:120

});

}

/* RESTART */

function restartQuiz(){

index=0;

score=0;

userAnswers.fill(null);

finalPopup.classList.remove(
"show"
);

renderQuestion();

}

/* START */

renderQuestion();

</script>
<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
