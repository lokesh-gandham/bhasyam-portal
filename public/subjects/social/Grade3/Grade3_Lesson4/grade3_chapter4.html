<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Assessments</title>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;

            /* Soft pastel background */
            background: #F7F8F2;
            overflow: hidden;
        }

        /* ================= */
        /* CONTENT */
        /* ================= */
        .content {

            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 0 20px 20px;

        }

        /* SCREEN */
        .screen {

            width: 100%;
            max-width: 1600px;

            height: 100%;

            border-radius: 30px;

            overflow: hidden;


        }

        /* IFRAME */
        iframe {

            width: 100%;
            height: 100%;

            border: none;

        }

        /* ================= */
        /* 🧩 BOTTOM BAR */
        /* ================= */
        .bottom-bar {

            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 40px;

            padding: 20px;

            flex-shrink: 0;

        }

        /* ================= */
        /* 🧩 PUZZLE */
        /* ================= */
        /* ================= */
        /* 🧩 ALL BUTTONS SAME COLOR */
        /* ================= */
        .puzzle {

            width: 180px;
            height: 65px;

            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-weight: 600;
            font-size: 18px;

            color: #7A7A7A;
            /* Soft gray text */

            border-radius: 22px;

            border: 3px solid #D8DEE9;

            background: #F3F5F7;
            /* Light gray */

            opacity: .75;
            /* Looks inactive */

            transition: .3s;

            box-shadow:
                0 6px 15px rgba(0, 0, 0, .08);

        }

        /* COLORS */

        /* ICON */
        .puzzle .icon {

            font-size: 22px;

            margin-bottom: 2px;

        }

        .puzzle.active {

            background: linear-gradient(135deg,
                    #CDEFFF,
                    #D9D6FF);

            border: 3px solid #7B2CBF;

            color: #334155;

            opacity: 1;

            transform: scale(1.05);

            box-shadow:
                0 10px 24px rgba(123, 44, 191, .25);

        }

        .puzzle:hover {

            opacity: 1;

            background: #EEF7FF;

            border-color: #7B2CBF;

            color: #334155;

            transform: translateY(-4px);

        }

        /* ================= */
        /* MENU BUTTON */
        /* ================= */

        .menu-btn {

            display: none;

            position: fixed;

            top: 16px;
            right: 16px;

            width: 45px;
            height: 45px;

            border: none;

            border-radius: 18px;

            background:
                linear-gradient(135deg,
                    #7b2cbf,
                    #9d4edd);

            color: white;

            font-size: 22px;

            cursor: pointer;

            z-index: 2000;

            box-shadow:
                0 10px 20px rgba(0, 0, 0, .2);

        }

        /* ================= */
        /* OVERLAY */
        /* ================= */

        .overlay {

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, .25);

            opacity: 0;

            pointer-events: none;

            transition: .3s;

            z-index: 1200;

        }

        .overlay.show {

            opacity: 1;

            pointer-events: auto;

        }

        /* ================= */
        /* OFFCANVAS */
        /* ================= */

        .mobile-menu {

            position: fixed;

            top: 0;
            right: -280px;

            width: 260px;
            height: 100vh;

            background: white;

            padding: 90px 18px 20px;

            display: flex;
            flex-direction: column;

            gap: 18px;

            transition: .35s;

            z-index: 1500;

            overflow: auto;

        }

        /* OPEN */
        .mobile-menu.open {

            right: 0;

        }

        /* MOBILE PUZZLE */
        .mobile-puzzle {

            width: 100%;
            height: 72px;

            border-radius: 24px;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            font-size: 18px;

            font-weight: 600;

            color: white;

            cursor: pointer;

            position: relative;

        }

        /* COLORS */

        .mobile-puzzle:nth-child(1) {

            background:
                linear-gradient(135deg,
                    #ff6b6b,
                    #ff8e8e);

        }

        .mobile-puzzle:nth-child(2) {

            background:
                linear-gradient(135deg,
                    #feca57,
                    #ffd978);

        }

        .mobile-puzzle:nth-child(3) {

            background:
                linear-gradient(135deg,
                    #48dbfb,
                    #74e8ff);

        }

        .mobile-puzzle:nth-child(4) {

            background:
                linear-gradient(135deg,
                    #1dd1a1,
                    #55efc4);

        }

        .mobile-puzzle:nth-child(5) {

            background:
                linear-gradient(135deg,
                    #a29bfe,
                    #c8b6ff);

        }

        /* ACTIVE */
        .mobile-puzzle.active {

            outline: 4px solid #7b2cbf;

        }

        /* ================= */
        /* MOBILE */
        /* ================= */

        @media(max-width:1024px) {

            body {
                overflow: hidden;
            }

            /* HIDE DESKTOP BAR */
            .bottom-bar {
                display: none;
            }

            /* SHOW MENU BUTTON */
            .menu-btn {
                display: block;
            }

            /* CONTENT */
            .content {

                padding: 14px;

            }

            /* SCREEN */
            .screen {

                border-radius: 24px;

            }

        }

        /* ================= */
        /* SMALL MOBILE */
        /* ================= */

        @media(max-width:480px) {

            .menu-btn {

                width: 52px;
                height: 52px;

                font-size: 24px;

                top: 12px;
                right: 12px;

            }

            /* MENU */
            .mobile-menu {

                width: 230px;

                padding: 80px 14px 20px;

            }

            /* MOBILE BUTTON */
            .mobile-puzzle {

                height: 64px;

                font-size: 15px;

                border-radius: 20px;

            }

            /* ICON */
            .mobile-puzzle .icon {

                font-size: 20px;

            }

        }

        /* ================= */
        /* MONITOR */
        /* ================= */

        @media screen and (min-width:1025px) and (max-width:1200px) {

            .content {

                padding: 24px;

            }

            .screen {

                max-width: 1500px;

                border-radius: 36px;

            }

            .bottom-bar {

                height: 90px;

                gap: 55px;

            }

            /* BUTTON */
            .puzzle {

                width: 170px;
                height: 75px;

                font-size: 20px;

                border-radius: 24px;

            }

            /* ICON */
            .puzzle .icon {

                font-size: 18px;

            }

        }

        /* ================= */
        /* LARGE MONITOR */
        /* ================= */

        @media screen and (min-width:1201px) and (max-width:1440px) {

            .content {

                padding: 28px;

            }

            .screen {

                max-width: 1700px;

                border-radius: 40px;

            }

            /* BAR */
            .bottom-bar {

                height: 100px;

                gap: 60px;

            }

            /* BUTTON */
            .puzzle {

                width: 220px;
                height: 80px;

                font-size: 22px;

                border-radius: 26px;

            }

            /* ICON */
            .puzzle .icon {

                font-size: 24px;

                margin-bottom: 3px;

            }

        }

        /* ================= */
        /* LARGE MONITOR */
        /* ================= */

        @media screen and (min-width:1441px) and (max-width:1920px) {

            .content {

                padding: 30px;

            }

            .screen {

                max-width: 1850px;

                border-radius: 44px;

            }

            /* BAR */
            .bottom-bar {

                height: 120px;

                gap: 70px;

            }

            /* BUTTON */
            .puzzle {

                width: 270px;
                height: 90px;

                font-size: 26px;

                border-radius: 30px;

            }

            /* ICON */
            .puzzle .icon {

                font-size: 32px;

                margin-bottom: 4px;

            }

            /* bumps */
            .puzzle::before,
            .puzzle::after {

                width: 30px;
                height: 30px;

            }

            .puzzle::before {

                top: -20px;

            }

            .puzzle::after {

                right: -20px;

            }

        }

        /* ================= */
        /* EXTRA LARGE */
        /* ================= */

        @media screen and (min-width:1921px) {

            .content {

                padding: 40px;

            }

            .screen {

                max-width: 2500px;

                border-radius: 60px;

            }

            /* BAR */
            .bottom-bar {

                height: 170px;

                gap: 100px;

            }

            /* BUTTON */
            .puzzle {

                width: 320px;
                height: 135px;

                font-size: 38px;

                border-radius: 42px;

            }

            /* ICON */
            .puzzle .icon {

                font-size: 46px;

                margin-bottom: 6px;

            }

            /* bumps */
            .puzzle::before,
            .puzzle::after {

                width: 55px;
                height: 55px;

            }

            .puzzle::before {

                top: -28px;

            }

            .puzzle::after {

                right: -28px;

            }

        }

        /* ================= */
        /* LAPTOP FIT */
        /* ================= */

        @media screen and (min-width:1025px) {

            body {
                height: 100dvh;
            }

            .content {
                min-height: 0;
                padding:
                    0 clamp(10px, 1.5vw, 24px) clamp(8px, 1.5dvh, 20px);
            }

            .screen {
                min-height: 0;
                height: 100%;
            }

            .bottom-bar {
                height: clamp(78px, 13dvh, 104px);
                gap: clamp(18px, 4vw, 58px);
                padding:
                    clamp(8px, 1.8dvh, 16px) clamp(10px, 1.5vw, 20px);
            }

            .puzzle {
                width: clamp(170px, 15vw, 220px);
                height: clamp(58px, 9dvh, 78px);
                font-size: clamp(18px, 1.5vw, 24px);
                border-radius: clamp(20px, 2vw, 26px);
            }

            .puzzle .icon {
                font-size: clamp(20px, 2vw, 28px);
                margin-bottom: 2px;
            }

        }

        @media screen and (min-width:1025px) and (max-height:760px) {

            .bottom-bar {
                height: 86px;
                padding: 6px 12px;
            }

            .puzzle {
                height: 58px;
                font-size: 18px;
            }

            .puzzle .icon {
                font-size: 20px;
                margin-bottom: 0;
            }

            .content {
                padding-bottom: 6px;
            }

        }
    </style>
    <style id="codex-responsive-shell">
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            max-width: 100%;
            overflow: hidden;
        }

        img,
        svg,
        canvas,
        video {
            max-width: 100%;
        }

        iframe {
            display: block;
            max-width: 100%;
        }

        body:has(iframe) {
            width: 100%;
            height: 100svh;
            min-height: 100svh;
            overflow: hidden;
        }

        body:has(iframe) .app,
        body:has(iframe) .frame,
        body:has(iframe) .board {
            max-width: 100%;
            max-height: 100svh;
            min-height: 0;
        }

        body:has(iframe) .app {
            height: 100svh;
        }

        body:has(iframe) .board {
            width: min(1250px, calc(100vw - 16px));
            height: min(570px, calc(100svh - 16px));
        }

        body:has(iframe) .content,
        body:has(iframe) .main,
        body:has(iframe) .screen,
        body:has(iframe) .iframe-wrapper {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        body:has(iframe) iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (min-width: 1025px) {
            body:has(iframe) .sidebar {
                width: clamp(190px, 17vw, 300px);
                min-width: 0;
                min-height: 0;
            }

            body:has(iframe) .topbar,
            body:has(iframe) .top-nav,
            body:has(iframe) .top-index,
            body:has(iframe) .bottom-bar,
            body:has(iframe) .nav-group {
                flex-shrink: 0;
            }

            body:has(iframe) .nav-container,
            body:has(iframe) .nav-wrapper,
            body:has(iframe) .sidebar-scroll,
            body:has(iframe) .menu {
                max-height: 100svh;
                overflow: hidden;
            }

            body:has(iframe) .top-nav,
            body:has(iframe) .top-index,
            body:has(iframe) .bottom-bar,
            body:has(iframe) .topbar,
            body:has(iframe) .nav-group {
                gap: clamp(10px, 2.8vw, 44px);
                padding: clamp(6px, 1.4dvh, 14px) clamp(8px, 1.4vw, 20px);
            }

            body:has(iframe) .nav-btn,
            body:has(iframe) .puzzle,
            body:has(iframe) .island-btn,
            body:has(iframe) .btn {
                min-height: 0;
                max-width: 100%;
            }
        }

        @media (min-width: 1025px) and (max-height: 760px) {

            body:has(iframe) .top-nav,
            body:has(iframe) .top-index,
            body:has(iframe) .bottom-bar,
            body:has(iframe) .topbar,
            body:has(iframe) .nav-group {
                gap: clamp(8px, 2vw, 24px);
                padding-block: clamp(4px, 1dvh, 10px);
            }

            body:has(iframe) .nav-btn,
            body:has(iframe) .puzzle,
            body:has(iframe) .island-btn,
            body:has(iframe) .btn {
                padding: clamp(8px, 1.4dvh, 14px) clamp(10px, 1.4vw, 22px);
                font-size: clamp(15px, 1.2vw, 20px);
            }

            body:has(iframe) .puzzle {
                width: clamp(150px, 14vw, 210px);
                height: clamp(54px, 8dvh, 70px);
            }

            body:has(iframe) .sidebar {
                width: clamp(190px, 16vw, 240px);
            }
        }
    </style>
</head>

<body>

    <!-- MENU BUTTON -->
    <button class="menu-btn" id="menuBtn">
        ☰
    </button>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay"></div>

    <!-- MOBILE MENU -->
    <div class="mobile-menu" id="mobileMenu">

        <div class="mobile-puzzle active" data-file="./exercise/mcq.html">
            <div class="icon">🎯</div>
            Choose Option
        </div>

        <div class="mobile-puzzle" data-file="./exercise/fillintheblanks.html">
            <div class="icon">✍️</div>
            Fill In The Blanks
        </div>

        <div class="mobile-puzzle" data-file="./exercise/truefalse.html">
            <div class="icon">✅</div>
            True / False
        </div>

        <div class="mobile-puzzle" data-file="./exercise/oneword.html">
            <div class="icon">🔤</div>
            One Word
        </div>

        <div class="mobile-puzzle" data-file="./exercise/matching.html">
            <div class="icon">🧩</div>
            Matching
        </div>

    </div>

    <!-- ========================= -->
    <!-- DESKTOP NAVIGATION (TOP) -->
    <!-- ========================= -->

    <div class="bottom-bar">

        <div class="puzzle active" data-file="./exercise/mcq.html">
            <div class="icon">🎯</div>
            Choose Option
        </div>

        <div class="puzzle" data-file="./exercise/fillintheblanks.html">
            <div class="icon">✍️</div>
            Fill In The Blanks
        </div>

        <div class="puzzle" data-file="./exercise/truefalse.html">
            <div class="icon">✅</div>
            True / False
        </div>

        <div class="puzzle" data-file="./exercise/oneword.html">
            <div class="icon">🔤</div>
            One Word
        </div>

        <div class="puzzle" data-file="./exercise/matching.html">
            <div class="icon">🧩</div>
            Matching
        </div>

    </div>

    <!-- ========================= -->
    <!-- QUIZ CONTENT -->
    <!-- ========================= -->

    <div class="content">

        <div class="screen">

            <iframe id="frame" src="./exercise/mcq.html">
            </iframe>

        </div>

    </div>

    <script>

        /* IFRAME */
        const frame = document.getElementById("frame");

        /* DESKTOP */
        const desktopItems = document.querySelectorAll(".puzzle");

        /* MOBILE */
        const mobileItems = document.querySelectorAll(".mobile-puzzle");

        /* MENU */
        const menuBtn = document.getElementById("menuBtn");
        const mobileMenu = document.getElementById("mobileMenu");
        const overlay = document.getElementById("overlay");

        /* CHANGE PAGE */
        function changePage(file, index) {

            frame.src = file;

            desktopItems.forEach(i => i.classList.remove("active"));
            desktopItems[index].classList.add("active");

            mobileItems.forEach(i => i.classList.remove("active"));
            mobileItems[index].classList.add("active");

            mobileMenu.classList.remove("open");
            overlay.classList.remove("show");

        }

        /* DESKTOP CLICK */
        desktopItems.forEach((item, index) => {

            item.onclick = () => {

                changePage(item.dataset.file, index);

            };

        });

        /* MOBILE CLICK */
        mobileItems.forEach((item, index) => {

            item.onclick = () => {

                changePage(item.dataset.file, index);

            };

        });

        /* MENU */
        menuBtn.onclick = () => {

            mobileMenu.classList.toggle("open");
            overlay.classList.toggle("show");

        };

        overlay.onclick = () => {

            mobileMenu.classList.remove("open");
            overlay.classList.remove("show");

        };

    </script>

    <script id="codex-viewport-fit">
        (function () {
            if (window.__codexViewportFit) return;
            window.__codexViewportFit = true;

            const hasIframe = Boolean(document.querySelector("iframe"));
            const selectors = [
                ".main",
                ".main-container",
                ".quiz",
                ".quiz-container",
                ".quiz-box",
                ".container",
                ".stage",
                ".screen",
                ".game",
                ".template",
                ".quiz-card",
                ".app"
            ];
            const minScale = 0.62;
            let rafId = 0;

            function setViewportRules() {
                document.documentElement.style.width = "100%";
                document.documentElement.style.height = "100%";
                document.documentElement.style.overflow = "hidden";
                document.body.style.width = "100%";
                document.body.style.height = "100svh";
                document.body.style.minHeight = "100svh";
                document.body.style.overflow = "hidden";
            }

            function getStage() {
                for (const selector of selectors) {
                    const stage = document.querySelector(selector);
                    if (stage) return stage;
                }
                return null;
            }

            function fitToViewport() {
                setViewportRules();
                if (hasIframe) return;

                const stage = getStage();
                if (!stage) return;

                stage.style.transform = "scale(1)";
                stage.style.transformOrigin = "center center";

                const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                const rect = stage.getBoundingClientRect();
                const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                const scale = Math.max(
                    minScale,
                    Math.min(
                        1,
                        (viewportWidth - breathingRoom * 2) / contentWidth,
                        (viewportHeight - breathingRoom * 2) / contentHeight
                    )
                );

                stage.style.transform = `scale(${scale})`;
            }

            function requestFit() {
                cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(fitToViewport);
            }

            window.addEventListener("load", requestFit);
            window.addEventListener("resize", requestFit);
            window.addEventListener("orientationchange", requestFit);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(requestFit).catch(function () { });
            }

            document.querySelectorAll("img").forEach(function (img) {
                img.addEventListener("load", requestFit, { once: false });
            });

            if ("ResizeObserver" in window) {
                const observer = new ResizeObserver(requestFit);
                const observeStage = function () {
                    const stage = getStage();
                    if (stage) observer.observe(stage);
                };
                observeStage();
                window.addEventListener("load", observeStage);
            }

            if (document.body) {
                new MutationObserver(requestFit).observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }

            requestFit();
        })();
    </script>
</body>

</html>
