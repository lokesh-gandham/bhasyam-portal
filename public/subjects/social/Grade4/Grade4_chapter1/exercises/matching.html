<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matching Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    /* background: linear-gradient(145deg, #d4ecf5 0%, #b8dcee 100%); */
    overflow: hidden;
}

/* MAIN CONTAINER */
.container {
    position: relative;
    width: 100%;
    max-width: 1200px;
    height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* MATCHING LAYOUT */
.matching {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 100px;
    width: 100%;
}

/* LEFT & RIGHT COLUMNS */
.left,
.right {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: auto;
}

/* BOX STYLE */
.box {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 22px;
    font-weight: 500;
    color: #273d3d;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
    cursor: pointer;
    gap: 12px;
    background: #ffffff;
    transition: all 0.2s ease;
    position: relative;
    min-height: 70px;
     width: 370px;
        margin: auto;
}

.box.matched {

    pointer-events: none;

    cursor: default;

    opacity: .85;
}

.box:hover:not(.matched) {
    transform: translateY(-2px);
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
}

/* LEFT BOX */
.left .box {
    justify-content: flex-start;
    padding-right: 50px;
}

/* LEFT IMAGE */
.left img {
    width: 50px;
    height: 50px;
    object-fit: contain;
    border-radius: 12px;
    flex-shrink: 0;
}

/* LEFT DOT (BLANK CIRCLE) */
.left .dot {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #999;
}

/* RIGHT BOX STYLES */
.right .box {
    justify-content: flex-start;
    gap: 15px;
}

.right .box img {
    width: 45px;
    height: 45px;
    object-fit: contain;
    border-radius: 10px;
}

/* SELECTED STATE */
.selected {
    outline: 3px solid #b1e2fd;
    background: #d4f0ff;
}

/* MATCHED STATE */
.matched {
    background: #d4f0ff;
    cursor: default;
    opacity: 0.85;
    transform: none;
}

.matched:hover {
    transform: none;
}

/* SVG LINES */
svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
}

/* RIGHT COLORS (alternating backgrounds) */
.right .box:nth-child(1) {
    background: #ebe8ff;
}

.right .box:nth-child(2) {
    background: #e8f0ff;
}

.right .box:nth-child(3) {
    background: #e6f7ec;
}

.right .box:nth-child(4) {
    background: #fff0e6;
}

.right .box:nth-child(5) {
    background: #ffe6f0;
}

/* MATCH NUMBER BADGE (if needed) */
.match-number {
    background: #2c5e6e;
    color: #fff;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    margin-left: auto;
    flex-shrink: 0;
}

/* FINAL POPUP */
/* FINAL SCORE */
#finalPopup{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:4000;
  
}

.final-kid-box{
    background:linear-gradient(135deg,#fff7d6,#e6fff5);
    padding:30px 35px;
    border-radius:35px;
    text-align:center;
    width:450px;
    animation:finalBounce .8s ease;

}

.final-kid-box h2{
    font-size:2.2em;
    color:#2f9e44;
    margin-bottom:10px;
    font-weight:600;
}

.final-kid-box p{
    font-size:1.3em;
    font-weight:600;
}

#stars{
    font-size:2.3em;
    margin:12px 0;
}

.playAgain-btn{
    background:#ffac30;
    color:#fff;
    border:none;
    padding:14px 34px;
    border-radius:30px;
    font-size:1.1em;
    cursor:pointer;
    margin-top:12px;
    box-shadow:0 6px 0 #d4871f;
}

.playAgain-btn:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #d4871f;
}

@keyframes finalBounce{
    0%{
        transform:scale(.3);
        opacity:0;
    }
    60%{
        transform:scale(1.15);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

<body>

<div class="container">

<div class="matching">

<!-- LEFT SIDE (WITH IMAGES) -->

<div class="left" id="left">

<div class="box c" data-match="1">
    <img src="../assets/images/oneEx5.png" alt="Longitudes">
    <span>Longitudes</span>
    <span class="dot"></span>
</div>

<div class="box c" data-match="2">
    <img src="../assets/images/latitudes.png" alt="Latitudes">
    <span>Latitudes</span>
    <span class="dot"></span>
</div>

<div class="box c" data-match="3">
    <img src="../assets/images/atlas.png" alt="Atlas">
    <span>Atlas</span>
    <span class="dot"></span>
</div>

<div class="box c" data-match="4">
    <img src="../assets/images/summer-solstice.png" alt="Summer Solstice">
    <span>Summer Solstice</span>
    <span class="dot"></span>
</div>

<div class="box c" data-match="5">
    <img src="../assets/images/winter-solstice.png" alt="Winter Solstice">
    <span>Winter Solstice</span>
    <span class="dot"></span>
</div>

</div>

<!-- RIGHT SIDE (TEXT ONLY) -->
<div class="right" id="right">

<div class="box c1" data-match="3">
    <span class="dot"></span>
    a. Book of maps
</div>

<div class="box c2" data-match="1">
    <span class="dot"></span>
    b. Imaginary vertical lines
</div>

<div class="box c3" data-match="4">
    <span class="dot"></span>
    c. Occurs on June 21
</div>

<div class="box c4" data-match="5">
    <span class="dot"></span>
    d. Occurs on December 22
</div>

<div class="box c5" data-match="2">
    <span class="dot"></span>
    e. Imaginary horizontal lines
</div>
</div>

</div>

<svg id="lines"></svg>

</div>



<!-- FINAL POPUP -->

<div id="finalPopup">
    <div class="final-kid-box">
        <h2>🎉 Congratulations!</h2>
        <p id="finalScore"></p>
        <div id="stars"></div>
        <button class="playAgain-btn" onclick="location.reload()">Play Again</button>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
    
let selected=null
let score=0
let matchNumber = 1;
const left=document.querySelectorAll("#left .box")
const right=document.querySelectorAll("#right .box")
const svg=document.getElementById("lines")



function speak(t) {
  speechSynthesis.cancel();
 
  const msg = new SpeechSynthesisUtterance(t);  
 
  msg.lang = "en-UK";  
  msg.volume = 0.25;    
  msg.rate = 1;
  msg.pitch = 1;
 
  speechSynthesis.speak(msg);  
}

function launchConfetti(){

confetti({
particleCount:120,
spread:70,
origin:{ y:0.6 }
});

}

left.forEach(l=>{

l.onclick=()=>{

if(l.classList.contains("matched")) return

left.forEach(i=>i.classList.remove("selected"))
l.classList.add("selected")

selected=l

}

})


right.forEach(r=>{

r.onclick=()=>{

if(!selected) return

if(r.dataset.match===selected.dataset.match){

launchConfetti();
speak("Correct")

const num = selected.dataset.match

addNumber(selected, num)
addNumber(r, num)

selected.classList.add("matched")
r.classList.add("matched")

/* DRAW LINE ONLY DESKTOP */
if(window.innerWidth > 900){
drawLine(selected, r)
}

score++;

if(score===5){
    setTimeout(showFinal,1000);
}
}else{


speak("Try again")

}

selected.classList.remove("selected")
selected=null

}

})


function addNumber(el, num){
    const badge = document.createElement("span")
    badge.innerText = num
    badge.classList.add("match-number")
    el.appendChild(badge)
}

function drawLine(a,b){

const rectA=a.querySelector(".dot").getBoundingClientRect()
const rectB=b.querySelector(".dot").getBoundingClientRect()

const svgRect=svg.getBoundingClientRect()

const x1=rectA.left-svgRect.left
const y1=rectA.top-svgRect.top+7

const x2=rectB.left-svgRect.left
const y2=rectB.top-svgRect.top+7

const path=document.createElementNS("http://www.w3.org/2000/svg","path")

const curve=`M${x1},${y1} C${x1+150},${y1} ${x2-150},${y2} ${x2},${y2}`

path.setAttribute("d",curve)
path.setAttribute("stroke","#5dd532")
path.setAttribute("stroke-width","3")
path.setAttribute("fill","none")

svg.appendChild(path)

}


function showFinal(){

    document.getElementById("finalScore").textContent =
        `Your Score: ${score} / 5`;

    document.getElementById("stars").textContent =
        "⭐".repeat(score);

    document.getElementById("finalPopup").style.display = "flex";

    launchConfetti();

    // setTimeout(()=>{
    //     speak(`You scored ${score} out of 5`);
    // },500);
}

function playAgain(){
location.reload()
}

</script>
