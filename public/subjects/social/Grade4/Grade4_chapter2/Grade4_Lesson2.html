<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Digital Assessments</title>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
       *,
*::before,
*::after{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body,
button,
input,
textarea,
select,
div,
span,
p,
h1,
h2,
h3,
h4,
h5,
h6,
a{
    font-family:'Livvic'!important;
}

        body {
            height: 100vh;
            overflow: hidden;
              font-family: "Livvic";
              background: #f4f0fa;
                 /* background-image: radial-gradient(circle at 20% 30%, rgba(200, 180, 235, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(160, 210, 200, 0.12) 0%, transparent 60%); */
        }

        .app {
            display: flex;
            height: 100vh;
            gap: 0;
            padding-left: 20px;
            /* background: #f0f4fa; */
        }

        /* ========= SIDEBAR – CLEAN, MODERN ========= */
        .sidebar {
            width: 250px;
            padding: 0 14px 0 0;
            display: flex;
            align-items: center;
        }

        .nav-wrapper {
            width: 100%;
            height: fit-content;
            max-height: 92vh;
            overflow-y: auto;
            padding: 4px;
        }

        /* header */
        .nav-header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e4eaf1;
        }

        .nav-header .emoji-big {
            font-size: 40px;
            display: block;
            margin-bottom: 4px;
        }

        .nav-header h2 {
            font-size: 18px;
            font-weight: 500;
            color: #1a2a3a;
            letter-spacing: -0.5px;
        }

        .nav-header h2 span {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-header p {
            font-size: 0.7rem;
            color: #8a9aa8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        /* ----- nav buttons – RECTANGULAR WITH SHADOW ----- */
        .nav-btn {
            width: 100%;
            background: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 20px 12px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
            
            text-align: left;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 2px solid transparent;
        }

        .nav-btn .icon-wrap {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            transition: 0.3s;
            background: #f0f4fa;
        }

        .nav-btn .btn-label {
            flex: 1;
        }

        .nav-btn .btn-label .title {
            font-size: 18px;
            font-weight: 500;
            color: #47494c;
            letter-spacing: -0.2px;
            transition: color 0.3s;
        }

        .nav-btn .btn-label .sub {
            font-size: 0.65rem;
            font-weight: 600;
            color: #9aaab8;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* hover effect */
        .nav-btn:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        /* active state */
        .nav-btn.active {
            border-color: #6c5ce7;
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.12);
            background: #f8f7ff;
        }

        .nav-btn.active .btn-label .title {
            color: #4b4c4d;
        }

        /* per-type colors */
        .nav-btn[data-type="0"] .icon-wrap { color: #4a90d9; background: #e8f0fe; }
        .nav-btn[data-type="0"].active { border-color: #4a90d9; }
        .nav-btn[data-type="0"].active .icon-wrap { background: #4a90d9; color: #ffffff; }

        .nav-btn[data-type="1"] .icon-wrap { color: #38b28c; background: #e6f5ef; }
        .nav-btn[data-type="1"].active { border-color: #38b28c; }
        .nav-btn[data-type="1"].active .icon-wrap { background: #38b28c; color: #ffffff; }

        .nav-btn[data-type="2"] .icon-wrap { color: #e8923a; background: #fef0e0; }
        .nav-btn[data-type="2"].active { border-color: #e8923a; }
        .nav-btn[data-type="2"].active .icon-wrap { background: #e8923a; color: #ffffff; }

        .nav-btn[data-type="3"] .icon-wrap { color: #8b7ad9; background: #f0edff; }
        .nav-btn[data-type="3"].active { border-color: #8b7ad9; }
        .nav-btn[data-type="3"].active .icon-wrap { background: #8b7ad9; color: #ffffff; }

            .nav-btn[data-type="4"] .icon-wrap { color: #66b6d2; background: #f0edff; }
        .nav-btn[data-type="4"].active { border-color: #66b6d2; }
        .nav-btn[data-type="4"].active .icon-wrap { background: #66b6d2; color: #ffffff; }

        /* click feedback */
        .nav-btn:active {
            transform: scale(0.96);
        }

        /* ========= MAIN CONTENT ========= */
        .main {
            flex: 1;
            padding: 0 0 0 4px;
            display: flex;
            align-items: center;
        }

        .iframe-wrapper {
            width: 100%;
            height: 100%;
         
            overflow: hidden;
           
            transition: 0.2s;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
          
        }

        /* ========= MOBILE DRAWER ========= */
        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border: none;
            font-size: 22px;
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.3);
            z-index: 5000;
            cursor: pointer;
            transition: 0.2s;
        }
        .mobile-toggle:active { transform: scale(0.88); }

        .drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(4px);
            z-index: 4000;
        }
        .drawer-panel {
            position: absolute;
            right: 0;
            top: 0;
            width: 270px;
            height: 100%;
            background: #ffffff;
            padding: 70px 20px 30px;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.06);
            border-radius: 28px 0 0 28px;
        }
        .drawer-overlay.show { display: block; }
        .drawer-overlay.show .drawer-panel { transform: translateX(0); }
        .drawer-panel .nav-btn { margin-bottom: 8px; }

        @media (max-width: 1065px) {
            .app { padding: 14px; }
            .sidebar { display: none; }
            .mobile-toggle { display: flex; align-items: center; justify-content: center; }
            .main { padding: 0; }
            .iframe-wrapper { border-radius: 24px; }
        }


          @media screen and (min-width: 1025px) and (max-width: 1440px) {
        .nav-btn .btn-title{
          font-size: 18px;
        }
        }

        @media screen and (min-width: 1441px) and (max-width: 1920px) {
           .sidebar {
      width: 280px;
      padding: 0 12px 0 0;
      display: flex;
      align-items: center;
    }
           .nav-btn .btn-label .title{
          font-size: 22px;
        }
        }
        /* scroll styling */
        .nav-wrapper::-webkit-scrollbar { width: 3px; }
        .nav-wrapper::-webkit-scrollbar-track { background: transparent; }
        .nav-wrapper::-webkit-scrollbar-thumb { background: #d0d8e0; border-radius: 10px; }

        /* footer */
        .footer-text {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px solid #e8edf3;
            font-size: 0.65rem;
            color: #b0bcc8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer-text i {
            color: #6c5ce7;
            margin: 0 4px;
        }
    </style>
</head>
<body>

    <button class="mobile-toggle" onclick="toggleDrawer()">
        <i class="fas fa-bars"></i>
    </button>

    <div class="app">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="nav-wrapper">
               

                <!-- MCQ - Blue -->
                <button class="nav-btn active" data-type="0" onclick="openActivity(0)">
                    <span class="icon-wrap"><i class="fas fa-check-circle"></i></span>
                    <span class="btn-label">
                        <span class="title">Multiple Choice</span>
                       
                    </span>
                </button>

                <!-- Fill Blanks - Purple -->
                <button class="nav-btn" data-type="4" onclick="openActivity(1)">
                    <span class="icon-wrap"><i class="fas fa-pencil-alt"></i></span>
                    <span class="btn-label">
                        <span class="title">Fill In The Blanks</span>
                       
                    </span>
                </button>
                <!-- True / False - Green -->
                <button class="nav-btn" data-type="1" onclick="openActivity(2)">
                    <span class="icon-wrap"><i class="fas fa-thumbs-up"></i></span>
                    <span class="btn-label">
                        <span class="title">True / False</span>
                       
                    </span>
                </button>


                <button class="nav-btn" data-type="2" onclick="openActivity(3)">
                    <span class="icon-wrap"><i class="fas fa-font"></i></span>
                    <span class="btn-label">
                        <span class="title">One Word</span>
                       
                    </span>
                </button>
                <!-- Matching - Orange -->
                <button class="nav-btn" data-type="3" onclick="openActivity(4)">
                    <span class="icon-wrap"><i class="fas fa-link"></i></span>
                    <span class="btn-label">
                        <span class="title">Matching</span>
                       
                    </span>
                </button>


             
            </div>
        </div>

        <!-- MAIN -->
        <div class="main">
            <div class="iframe-wrapper">
                <iframe id="contentFrame" src="./exercises/mcq.html" title="quiz content"></iframe>
            </div>
        </div>
    </div>

    <!-- MOBILE DRAWER -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()">
        <div class="drawer-panel" onclick="event.stopPropagation()">
            <button class="nav-btn active" data-type="0" onclick="mobileOpen(0)">
                <span class="icon-wrap"><i class="fas fa-check-circle"></i></span>
                <span class="btn-label"><span class="title">Multiple Choice</span><span class="sub">pick the right answer</span></span>
            </button>
            <button class="nav-btn" data-type="4" onclick="mobileOpen(1)">
                <span class="icon-wrap"><i class="fas fa-pencil-alt"></i></span>
                <span class="btn-label"><span class="title">Fill In The Blanks</span><span class="sub">complete the word</span></span>
            </button>
            <button class="nav-btn" data-type="1" onclick="mobileOpen(2)">
                <span class="icon-wrap"><i class="fas fa-thumbs-up"></i></span>
                <span class="btn-label"><span class="title">True / False</span><span class="sub">yes or no?</span></span>
            </button>
             <button class="nav-btn" data-type="2" onclick="mobileOpen(3)">
                <span class="icon-wrap"><i class="fas fa-font"></i></span>
                <span class="btn-label"><span class="title">One Word</span><span class="sub">yes or no?</span></span>
            </button>
            <button class="nav-btn" data-type="3" onclick="mobileOpen(4)">
                <span class="icon-wrap"><i class="fas fa-link"></i></span>
                <span class="btn-label"><span class="title">Matching</span><span class="sub">find the pairs</span></span>
            </button>
        </div>
    </div>

    <script>
        (function() {
            const frame = document.getElementById('contentFrame');
            const sidebarBtns = document.querySelectorAll('.sidebar .nav-btn');
            const drawerBtns = document.querySelectorAll('.drawer-overlay .nav-btn');

            const pages = [
                './exercises/mcq.html',
                './exercises/ftb.html',
                './exercises/truefalse.html',
                './exercises/oneword.html',
                './exercises/matching.html',
            ];

            window.openActivity = function(index) {
                if (index < 0 || index >= pages.length) return;

                sidebarBtns.forEach((btn, i) => btn.classList.toggle('active', i === index));
                drawerBtns.forEach((btn, i) => btn.classList.toggle('active', i === index));

                if (frame && pages[index]) {
                    frame.src = pages[index];
                    frame.onload = () => { frame.style.opacity = '1'; };
                }
            };

            window.toggleDrawer = function() {
                const overlay = document.getElementById('drawerOverlay');
                if (overlay) overlay.classList.toggle('show');
            };

            window.mobileOpen = function(index) {
                openActivity(index);
                toggleDrawer();
            };

            window.addEventListener('resize', () => {
                const overlay = document.getElementById('drawerOverlay');
                if (window.innerWidth > 1065 && overlay && overlay.classList.contains('show')) {
                    overlay.classList.remove('show');
                }
            });

            window.addEventListener('load', () => {
                document.body.style.overflow = 'hidden';
                const currentSrc = frame.src;
                let activeIndex = 0;
                for (let i = 0; i < pages.length; i++) {
                    if (currentSrc.includes(pages[i]) || currentSrc.endsWith(pages[i].replace('./', ''))) {
                        activeIndex = i;
                        break;
                    }
                }
                sidebarBtns.forEach((btn, i) => btn.classList.toggle('active', i === activeIndex));
                drawerBtns.forEach((btn, i) => btn.classList.toggle('active', i === activeIndex));
                if (activeIndex !== 0) frame.src = pages[activeIndex];
                console.log('🧩 Kids Quiz ready!');
            });
        })();
    </script>
</body>
</html>
