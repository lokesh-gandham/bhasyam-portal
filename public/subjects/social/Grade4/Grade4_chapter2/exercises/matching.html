<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matching Game · Kids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', system-ui, sans-serif;
            font-weight: 400;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .stage {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* GAME CONTAINER */
        .game-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 140px;
            margin: 20px 0;
        }

        /* SVG CANVAS FOR DRAWING LINES */
        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* COLUMNS */
        .column {
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 2;
            width: 360px;
        }

        /* ===== UNIFIED DESIGN – same colors both sides ===== */
        .item {
            width: 100%;
            height: 85px;
            padding: 12px 24px;
            border-radius: 18px 8px 18px 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: 500;
            color: #1f1a3a;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
            position: relative;
            background: #ffffff;
            border: 2.5px solid #d5c8ec;
            box-shadow: 0 4px 0 #b8a8d4, 0 4px 16px rgba(0, 0, 0, 0.04);
            letter-spacing: 0.2px;
        }

        /* Both sides use the same playful gradient & colors */
        .left .item,
        .right .item {
            background: linear-gradient(145deg, #fcfaff, #f6f0ff);
            border-color: #d5c8ec;
            box-shadow: 0 4px 0 #b8a8d4, 0 4px 16px rgba(0, 0, 0, 0.04);
        }

        /* Left side: image + text (no number), Right side: number + text */
        .left .item {
            justify-content: flex-start;
            gap: 12px;
        }

        .right .item {
            justify-content: flex-start;
            gap: 12px;
            padding-left: 20px;
        }

        /* Item image - only on left side */
        .item-img {
            width: 80px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 10px;
            /* background: rgba(255, 255, 255, 0.6); */
        }

        .item-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        /* Hide image container on right side */
        .right .item-img {
            display: none;
        }

        /* Number badge - only on right side (left side has no number) */
        .item-number {
            width: 34px;
            height: 34px;
            border-radius: 12px 4px 12px 4px;
            background: #b09ad4;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            flex-shrink: 0;
            transition: all 0.2s ease;
            box-shadow: 0 3px 0 #8a76af;
        }

        /* Hide number on left side */
        .left .item-number {
            display: none;
        }

        /* Number on right side appears before text */
        .right .item-number {
            margin-right: 14px;
        }

        .item .item-text {
            flex: 1;
            text-align: left;
        }

        .right .item .item-text {
            text-align: left;
        }

        /* Interactive States – unified */
        .item:hover:not(.matched) {
            transform: translateY(-3px) scale(1.01);
            border-color: #bca8dd;
            box-shadow: 0 6px 0 #a894c4, 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .item.active {
            transform: scale(1.02) translateY(-2px);
            background: #f3ecff;
            border-color: #aa92d0;
            box-shadow: 0 0 0 4px rgba(170, 146, 208, 0.2), 0 6px 0 #947bb8, 0 8px 24px rgba(0, 0, 0, 0.05);
        }

        /* matched state – cheerful green, unified */
        .item.matched {
            opacity: 1;
            cursor: default;
            background: #edf8ed !important;
            border-color: #8cc9a0 !important;
            color: #1e5a2b;
            font-weight: 500;
            transform: none !important;
            box-shadow: 0 3px 0 #6daf82, 0 4px 16px rgba(0, 0, 0, 0.03) !important;
            border-radius: 16px 6px 16px 6px;
        }

        .item.matched .item-number {
            background: #7fc99a;
            box-shadow: 0 3px 0 #5b9f74;
        }

        .item.matched .item-number i {
            font-size: 13px;
        }

        /* Wrong Answer – unified */
        .item.wrong {
            background: #fff3f3 !important;
            border-color: #f5a0a0 !important;
            color: #b33a3a !important;
            animation: shake 0.35s ease-in-out;
            box-shadow: 0 0 0 4px rgba(220, 80, 80, 0.08), 0 3px 0 #cc7a7a !important;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        /* ===== FINAL POPUP - STYLED LIKE QUIZ ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        #finalPopup.show {
            display: flex;
        }

        .final-kid-box {
            background: linear-gradient(135deg, #fff7d6, #e6fff5);
            padding: 30px 35px;
            border-radius: 35px;
            text-align: center;
            width: 450px;
            animation: finalBounce 0.8s ease;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
        }

        .final-kid-box h2 {
            font-size: 2.2em;
            font-family: "Livvic";
            color: #2f9e44;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-family: "Livvic";
            font-weight: 600;
        }

        #stars {
            font-size: 2.3em;
            margin: 12px 0;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 400;
            cursor: pointer;
            margin-top: 12px;
            transition: transform 0.15s;
            box-shadow: 0 6px 0 #d4871f;
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #d4871f;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width:900px) {
            body {
                align-items: center;
                padding: 20px;
                overflow: auto;
            }

            .stage {
                width: 100%;
                max-width: 100%;
                padding: 20px;
                gap: 20px;
            }

            .game-container {
                gap: 80px;
                margin: 16px 0;
            }

            .column {
                width: 300px;
                gap: 14px;
            }

            .item {
                height: 76px;
                padding: 10px 18px;
                font-size: 17px;
                border-radius: 16px 6px 16px 6px;
            }

            .item-img {
                width: 34px;
                height: 34px;
            }

            .item-number {
                width: 30px;
                height: 30px;
                font-size: 14px;
                border-radius: 10px 3px 10px 3px;
            }

            .final-kid-box {
                width: 90%;
                max-width: 340px;
                padding: 22px;
            }

            .final-kid-box h2 {
                font-size: 1.8em;
            }

            .final-kid-box p {
                font-size: 1.1em;
            }

            #stars {
                font-size: 1.8em;
            }
        }

        @media (max-width:768px) {
            body {
                padding: 20px 0 10px;
                align-items: flex-start;
            }

            .stage {
                padding: 16px;
                gap: 16px;
            }

            .game-container {
                gap: 36px;
            }

            .column {
                width: 48%;
                gap: 12px;
            }

            .item {
                height: 80px;
                font-size: 15px;
                padding: 8px 12px;
                border-radius: 14px 4px 14px 4px;
            }

            .item-img {
                width: 30px;
                height: 30px;
            }

            .item-number {
                width: 26px;
                height: 26px;
                font-size: 13px;
                border-radius: 8px 3px 8px 3px;
            }

            #line-canvas {
                display: none;
            }

            .final-kid-box {
                width: 90%;
                max-width: 340px;
                padding: 22px;
            }

            .final-kid-box h2 {
                font-size: 1.8em;
            }
        }

        @media (max-width:480px) {
            body {
                padding: 40px 0 10px;
                align-items: flex-start;
            }

            .stage {
                padding: 12px;
                gap: 14px;
            }

            .game-container {
                gap: 14px;
            }

            .column {
                width: 48%;
                gap: 10px;
            }

            .item {
                height: 88px;
                padding: 6px 10px;
                font-size: 12px;
                flex-direction: row;
                justify-content: flex-start;
                text-align: left;
                gap: 6px;
                border-radius: 14px 4px 14px 4px;
            }

            .left .item {
                justify-content: flex-start;
            }

            .right .item {
                justify-content: flex-start;
                padding-left: 10px;
            }

            .item-img {
                width: 26px;
                height: 26px;
            }

            .item-number {
                width: 22px;
                height: 22px;
                font-size: 11px;
                border-radius: 7px 2px 7px 2px;
            }

            .item .item-text {
                font-size: 11px;
            }

            #line-canvas {
                display: none;
            }

            .final-kid-box {
                width: 90%;
                max-width: 300px;
                padding: 20px;
            }

            .final-kid-box h2 {
                font-size: 1.5em;
            }

            .final-kid-box p {
                font-size: 1em;
            }

            #stars {
                font-size: 1.6em;
            }

            .playAgain-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }

        @media screen and (min-width:1025px) and (max-width:1440px) {
            .stage {
                max-width: 1100px;
            }

            .game-container {
                gap: 140px;
            }

            .column {
                width: 360px;
            }

            .item {
                height: 85px;
                font-size: 20px;
                padding: 12px 24px;
            }

            .item-img {
                width: 50px;
                height: 50px;
            }

            .item-number {
                width: 34px;
                height: 34px;
                font-size: 15px;
            }

           .final-kid-box {
                width: 520px;
                padding: 40px;
            }
            .final-kid-box h2 {
                font-size: 2.8em;
            }
            .final-kid-box p {
                font-size: 1.5em;
            }
            #stars {
                font-size: 2.8em;
            }
            .playAgain-btn {
                padding: 16px 40px;
                font-size: 1.2em;
            }
        }

        @media screen and (min-width:1441px) and (max-width:1920px) {
            .stage {
                max-width: 1200px;
            }

            .game-container {
                gap: 160px;
            }

            .column {
                width: 390px;
            }

            .item {
                height: 92px;
                font-size: 22px;
                padding: 14px 28px;
            }

            .item-img {
                width: 90px;
                height: 80px;
            }

            .item-number {
                width: 38px;
                height: 38px;
                font-size: 17px;
            }
            
            .right .item-number {
            margin-right: 24px;
        }

            .final-kid-box {
                width: 580px;
                padding: 45px;
            }

            .final-kid-box h2 {
                font-size: 3em;
            }

            .final-kid-box p {
                font-size: 1.6em;
            }

            #stars {
                font-size: 3em;
            }
        }

        @media screen and (min-width:1921px) {
            .stage {
                max-width: 1300px;
            }

            .game-container {
                gap: 180px;
            }

            .column {
                width: 420px;
            }

            .item {
                height: 100px;
                font-size: 24px;
                padding: 16px 32px;
            }

            .item-img {
                width: 48px;
                height: 48px;
            }

            .item-number {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }

            .final-kid-box {
                width: 650px;
                padding: 55px;
            }

            .final-kid-box h2 {
                font-size: 3.4em;
            }

            .final-kid-box p {
                font-size: 1.8em;
            }

            #stars {
                font-size: 3.4em;
            }
        }
    </style>
</head>

<body>
    <main class="stage">
        <div class="game-container">
            <svg id="line-canvas"></svg>
            <div class="column left" id="leftColumn"></div>
            <div class="column right" id="rightColumn"></div>
        </div>
    </main>

    <!-- FINAL POPUP - STYLED LIKE QUIZ -->
    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        const leftData = [
            { id: "1", text: "Ladakh", match: "leh", img: "../assets/images/ladakh.png" },
            { id: "2", text: "Uttarakhand", match: "dehradun", img: "../assets/images/uttarakhand.png" },
            { id: "3", text: "Sikkim", match: "gangtok", img: "../assets/images/sikkim.png" },
            { id: "4", text: "West Bengal", match: "kolkata", img: "../assets/images/westbengal.png" },
            { id: "5", text: "Himachal Pradesh", match: "shimla", img: "../assets/images/himachal1.png" }
        ];

        const rightData = [
            { match: "shimla", text: "Shimla" },
            { match: "leh", text: "Leh" },
            { match: "kolkata", text: "Kolkata" },
            { match: "dehradun", text: "Dehradun" },
            { match: "gangtok", text: "Gangtok" }
        ];

        let selectedLeft = null;
        let matchesFound = 0;
        let connections = [];

        const leftCol = document.getElementById("leftColumn");
        const rightCol = document.getElementById("rightColumn");
        const svg = document.getElementById("line-canvas");
        const finalPopup = document.getElementById("finalPopup");
        const finalScore = document.getElementById("finalScore");
        const stars = document.getElementById("stars");
        const playAgainBtn = document.getElementById("playAgainBtn");

        let speechSynth = window.speechSynthesis;

        function speakText(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-UK";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 80, spread: 100, origin: { y: 0.6 } });
        }

        function init() {
            leftCol.innerHTML = "";
            rightCol.innerHTML = "";
            svg.innerHTML = "";
            connections = [];
            selectedLeft = null;
            matchesFound = 0;
            finalPopup.classList.remove('show');

            leftData.forEach((item) => {
                const div = document.createElement("div");
                div.className = "item";
                div.dataset.match = item.match;
                div.innerHTML = `
                    <div class="item-img"><img src="${item.img}" alt="${item.text}" onerror="this.style.display='none'"></div>
                    <span class="item-text">${item.text}</span>
                `;
                div.onclick = () => {
                    if (div.classList.contains("matched")) return;
                    document.querySelectorAll(".left .item").forEach((i) => i.classList.remove("active"));
                    div.classList.add("active");
                    selectedLeft = div;
                };
                leftCol.appendChild(div);
            });

            rightData.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "item";
                div.dataset.id = item.match;
                div.innerHTML = `
                    <div class="item-number">${index + 1}</div>
                    <span class="item-text">${item.text}</span>
                `;
                div.onclick = () => {
                    if (!selectedLeft || div.classList.contains("matched")) return;
                    if (selectedLeft.dataset.match === div.dataset.id) {
                        handleMatch(selectedLeft, div);
                    } else {
                        handleWrong(div);
                    }
                };
                rightCol.appendChild(div);
            });
        }

        function handleMatch(leftEl, rightEl) {
            matchesFound++;
            leftEl.classList.add("matched");
            rightEl.classList.add("matched");
            leftEl.classList.remove("active");
            const rightNum = rightEl.querySelector(".item-number");
            if (rightNum) rightNum.innerHTML = '<i class="fa-solid fa-check"></i>';
            drawCurve(leftEl, rightEl);
            connections.push({ from: leftEl, to: rightEl });
            selectedLeft = null;
            speakText('Correct');
            smallConfetti();
            if (matchesFound === leftData.length) {
                setTimeout(showFinalPopup, 800);
            }
        }

        function handleWrong(rightEl) {
            speakText('Try again');
            rightEl.classList.add("wrong");
            setTimeout(() => rightEl.classList.remove("wrong"), 600);
        }

        function drawCurve(el1, el2) {
            if (window.getComputedStyle(svg).display === "none") return;
            const rect1 = el1.getBoundingClientRect();
            const rect2 = el2.getBoundingClientRect();
            const containerRect = svg.getBoundingClientRect();
            const x1 = rect1.right - containerRect.left;
            const y1 = rect1.top + rect1.height / 2 - containerRect.top;
            const x2 = rect2.left - containerRect.left;
            const y2 = rect2.top + rect2.height / 2 - containerRect.top;
            const cx = (x1 + x2) / 2;
            const pathData = `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`;
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathData);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "#8ec9a0");
            path.setAttribute("stroke-width", "3.5");
            path.setAttribute("stroke-dasharray", "6 5");
            path.setAttribute("opacity", "0.8");
            svg.appendChild(path);
        }

        function showFinalPopup() {
            finalScore.textContent = `Your Score: ${matchesFound} / ${leftData.length}`;
            stars.textContent = '⭐'.repeat(matchesFound);
            finalPopup.classList.add('show');
            bigConfetti();
        }

        playAgainBtn.addEventListener('click', () => {
            finalPopup.classList.remove('show');
            init();
        });

        window.addEventListener("resize", () => {
            svg.innerHTML = "";
            connections.forEach((c) => drawCurve(c.from, c.to));
        });

        init();
    </script>
</body>

</html>
