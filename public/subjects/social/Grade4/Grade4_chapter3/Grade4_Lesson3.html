<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assessments</title>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Livvic", sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            /* Clean, inviting sky-soft backdrop */
            background: #f4f9fc;
            background-size: 100% 100%;
        }

        .app {
            height: 100vh;
            display: flex;
            background: rgba(255, 255, 255, 0.2);
        }

        .sidebar {
            width: 300px;
            padding: 25px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0px;
        }

        /* TOTAL REINVENTION: Asymmetric cloud-bubble options with subtle organic borders */
        /* Kept clean of any cards, lines, or dot indicators to preserve raw visual crispness */
        .island-btn {
            display: flex;
            align-items: center;
            height: 75px;
            gap: 15px;
            padding: 16px 20px;
            border-radius: 30px 10px 30px 10px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            background: #ffffff;
            color: #64748b;
            border: 3px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(100, 116, 139, 0.03);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Playful Ring Indicator Around Kept Icons */
        .option-num {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 700;
            color: white;
            font-size: 16px;
            background: #cbd5e1;
            transition: all 0.3s ease;
        }

        .island-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 20px rgba(100, 116, 139, 0.06);
        }

        /* ACTIVE OPTION BOX: Smooth rotation twist with dynamic children theme integration */
        .island-btn.active {
            color: #0f172a;
            border-radius: 10px 30px 10px 30px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.06);
            font-weight: 500;
        }

        /* ACTIVE STATE TICK SYSTEM */
        .island-btn.active .option-num {
            background: #ffffff !important;
            box-shadow: inset 4px 4px 4px rgba(0, 0, 0, 0.144), inset -2px -2px 4px rgba(0, 0, 0, 0.144);
        }

        .island-btn.active .option-num::after {
            content: "✔";
        }

        .island-btn.active .option-num span {
            display: none;
        }

        /* CHERISHED INDIVIDUAL VIBRANT THEMES FOR EACH ACTIVE OPTION */
        .o1.active {
            background: #fde9ee;
            border-color: #eca2cc;
            color: #db2777;
        }

        .o1.active .option-num {
            color: #db2777;
        }

        .o2.active {
            background: #eaf3ff;
            border-color: #b8d5fa;
            color: #2563eb;
        }

        .o2.active .option-num {
            color: #2563eb;
        }

        .o3.active {
            background: #effff4;
            border-color: #a2dfb7;
            color: #16a34a;
        }

        .o3.active .option-num {
            color: #16a34a;
        }

        .o6.active {
            background: #f7efff;
            border-color: #ba9add;
            color: #7c3aed;
        }

        .o6.active .option-num {
            color: #7c3aed;
        }

        .o4.active {
            background: #fffae8;
            border-color: #fae283;
            color: #d97706;
        }

        .o4.active .option-num {
            color: #d97706;
        }

        .main {
            flex: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* MOBILE GRAPHICS PRESERVATION */
        .menu-btn {
            display: none;
        }

        .offcanvas {
            display: none;
        }

        @media(max-width:1065px) {
            .app {
                flex-direction: column;
            }

            .sidebar {
                display: none;
            }

            iframe {
                border-radius: 0px;
            }

            .menu-btn {
                display: block;
                position: fixed;
                top: 8px;
                right: 15px;
                font-size: 26px;
                background: #3b82f6;
                color: white;
                border: none;
                border-radius: 12px;
                padding: 6px 12px;
                cursor: pointer;
                z-index: 5000;
                box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            }

            .offcanvas {
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.15);
                backdrop-filter: blur(2px);
                display: none;
                z-index: 4000;
            }

            .offcanvas.show {
                display: block;
            }

            .offcanvas-panel {
                position: absolute;
                right: 0;
                top: 0;
                width: 300px;
                height: 100%;
                background: #fdfdfd;
                padding: 0px;
                padding-top: 0px;
                transform: translateX(100%);
                transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
                overflow-y: hidden;
            }

            .offcanvas.show .offcanvas-panel {
                transform: translateX(0);
                padding: 20px;
            }

            .offcanvas-panel .island-btn {
                margin-bottom: 12px;
            }
        }

        @media (min-width: 900px) and (max-height: 800px) {
            .app {
                transform: scaleY(0.95);
                transform-origin: top center;
                height: calc(100vh / 0.95);
            }
        }

        @media (min-width: 900px) and (max-height: 700px) {
            .app {
                transform: scaleY(0.9);
                transform-origin: top center;
                height: calc(100vh / 0.9);
            }
        }

        @media (min-width: 900px) and (max-height: 600px) {
            .app {
                transform: scaleY(0.85);
                transform-origin: top center;
                height: calc(100vh / 0.85);
            }
        }

        @media (min-width: 900px) and (max-height: 500px) {
            .app {
                transform: scaleY(0.8);
                transform-origin: top center;
                height: calc(100vh / 0.8);
            }
        }

        @media screen and (min-width: 1025px) and (max-width: 1440px) {
            .sidebar {
                width: 320px;
                padding: 26px 22px;
                gap: 24px;
            }

            .island-btn {
                height: 85px;
                font-size: 18px;
                padding: 18px 22px;
            }

            .option-num {
                width: 46px;
                height: 46px;
                font-size: 17px;
            }
        }

        @media screen and (min-width: 1441px) and (max-width: 1920px) {
            .sidebar {
                width: 370px;
                padding: 30px 26px;
                gap: 28px;
            }

            .island-btn {
                height: 90px;
                font-size: 21px;
                padding: 20px;
                border-radius: 30px 12px 30px 12px;
            }

            .island-btn.active {
                border-radius: 12px 30px 12px 30px;
            }

            .option-left {
                gap: 18px;
            }

            .option-num {
                width: 52px;
                height: 52px;
                font-size: 19px;
            }
        }

        @media screen and (min-width: 1921px) {
            .sidebar {
                width: 440px;
                padding: 36px 30px;
                gap: 36px;
            }

            .island-btn {
                font-size: 22px;
                height: 105px;
                padding: 24px 30px;
                border-radius: 36px 14px 36px 14px;
            }

            .island-btn.active {
                border-radius: 14px 36px 14px 36px;
            }

            .option-left {
                gap: 22px;
            }

            .option-num {
                width: 62px;
                height: 62px;
                font-size: 22px;
            }

            iframe {
                border-radius: 36px 0 0 36px;
            }
        }
    </style>
</head>

<body>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="app">
        <div class="sidebar">
            <div class="island-btn o1 active" onclick="openIsland(0)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-check-double"></i></span></div>
                    <div>Correct Options</div>
                </div>
            </div>
            <div class="island-btn o2" onclick="openIsland(1)">
                <div class="option-left">
                    <div class="option-num"><span> <i class="fa-solid fa-pen-to-square"></i></span></div>
                    <div>Fill In The Blanks</div>
                </div>
            </div>
            <div class="island-btn o3" onclick="openIsland(2)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-scale-balanced"></i></span></div>
                    <div>True / False</div>
                </div>
            </div>
            <div class="island-btn o6" onclick="openIsland(3)">
                <div class="option-left">
                    <div class="option-num"><span> <i class="fa-solid fa-spell-check"></i></span></div>
                    <div>One Word</div>
                </div>
            </div>
            <div class="island-btn o4" onclick="openIsland(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-link"></i></span></div>
                    <div>Matching</div>
                </div>
            </div>
        </div>
        <div class="main"> <iframe id="contentFrame" src="./exercises/mcq.html"></iframe> </div>
    </div>
    <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">
        <div class="offcanvas-panel" onclick="event.stopPropagation()">
            <div class="island-btn o1 active" onclick="mobileOpen(0)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-circle-check"></i></span></div>
                    <div>Correct Options</div>
                </div>
            </div>
            <div class="island-btn o2" onclick="mobileOpen(1)">
                <div class="option-left">
                    <div class="option-num"><span> <i class="fa-solid fa-pen-to-square"></i></span></div>
                    <div>Fill In The Blanks</div>
                </div>
            </div>
            <div class="island-btn o3" onclick="mobileOpen(2)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-scale-balanced"></i></span></div>
                    <div>True / False</div>
                </div>
            </div>
            <div class="island-btn o5" onclick="mobileOpen(3)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-font"></i></span></div>
                    <div>One Word</div>
                </div>
            </div>
            <div class="island-btn o4" onclick="mobileOpen(4)">
                <div class="option-left">
                    <div class="option-num"><span><i class="fa-solid fa-link"></i></span></div>
                    <div>Matching</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const sidebarButtons = document.querySelectorAll(".sidebar .island-btn"); const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");
        const frame = document.getElementById("contentFrame");
        const pages = [
            "./exercises/mcq.html", "./exercises/Ftb.html", "./exercises/true_false.html", "./exercises/one_word.html", "./exercises/matching.html",
        ];
        function openIsland(index) {
            sidebarButtons.forEach(btn => btn.classList.remove("active")); sidebarButtons[index].classList.add("active");
            mobileButtons.forEach(btn => btn.classList.remove("active")); mobileButtons[index].classList.add("active");
            frame.src = pages[index];
        }
        function toggleMenu() {
            if (window.innerWidth > 1065) return; document.getElementById("offcanvas").classList.toggle("show");
        }
        function mobileOpen(i) {
            openIsland(i); toggleMenu();
        }
    </script>
</body>

</html>
