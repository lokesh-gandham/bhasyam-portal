<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fill in the Blanks - Kids Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Livvic', system-ui, sans-serif;
      font-weight: 400;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .stage {
      width: 100%;
      max-width: 1100px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .question {
      font-size: 30px;
      font-weight: 400;
      color: #2f4f4f;
      line-height: 1.4;
      letter-spacing: -0.3px;
      text-align: left;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Image Container - Fixed Size */
    .photo-wrap {
      width: 100%;
      width: 280px;
      height: 200px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      object-fit: contain;
    }

    .photo {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 20px;
      display: block;
    }

    /* Unique Premium Input Container */
    .input-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .answer-input {
      width: 100%;
      max-width: 350px;
      height: 70px;
      padding: 0 24px;
      font-size: 24px;
      font-weight: 400;
      text-align: center;
      border: 3px solid #02b8a8;
      border-radius: 18px;
      outline: none;
      background: #f1ffff;
      color: #2d2a4a;
      box-shadow: 0 6px 12px rgba(2, 184, 168, 0.05);
      transition: all 0.2s ease;
      text-transform: capitalize;
    }

    .answer-input:focus:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px -8px rgba(2, 184, 168, 0.35);
      background: #ffffff;
    }

    .answer-input.correct {
      background: linear-gradient(135deg, #f0ffeb, #e5ffea);
      border-color: #4caf50;
      color: #2e7d32;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
    }

    .answer-input.wrong {
      background: linear-gradient(135deg, #ffd6d6, #ffb3b3);
      border-color: #e53935;
      color: #b71c1c;
      animation: shake 0.3s;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-4px);
      }

      75% {
        transform: translateX(4px);
      }
    }

    .answer-input:disabled {
      cursor: not-allowed;
    }

    /* Submit Button Style matching Option Mechanics */
    .submit-btn {
      padding: 13px 35px;
      font-size: 18px;
      font-weight: 500;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #02b8a8 0%, #01978a 100%);
      transition: all 0.2s ease;
      /* box-shadow: 0 4px 14px rgba(2, 184, 168, 0.3); */
    }

    .submit-btn:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(2, 184, 168, 0.45);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== NAV BUTTONS GLASS SHINE EFFECT ===== */
    .btn {
      width: 130px;
      height: 55px;
      padding: 13px 28px;
      font-size: 18px;
      font-weight: 500;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
    }

    /* Glass layer streak */
    .btn:not(:disabled)::before {
      content: "";
      position: absolute;
      top: 0;
      left: -150%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.4) 50%,
          rgba(255, 255, 255, 0) 100%);
      transform: skewX(-25deg);
      animation: glassShine 3.5s infinite ease-in-out;
    }

    @keyframes glassShine {
      0% {
        left: -150%;
      }

      30% {
        left: 150%;
      }

      100% {
        left: 150%;
      }
    }

    .btn:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.3);
    }

    .btn:not(:disabled):active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .prev-btn {
      background: linear-gradient(135deg, #ffc371 0%, #ffb347 100%);
    }

    .next-btn {
      background: linear-gradient(135deg, #5ba3ff 0%, #4a90e2 100%);
    }

    .nav-row {
      display: flex;
      gap: 50px;
      justify-content: space-around;
      align-items: center;
      margin-top: 10px;
    }

    /* ============================================
       POPUP STYLE — EXACTLY COPIED FROM MCQ QUIZ
    ============================================ */
    .kid-popup {
      position: fixed;
      inset: 0;
      /* background: rgba(255, 255, 255, 0.4); */
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }

    .kid-card {
      background: #ffffff;
      width: 320px;
      padding: 25px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 15px 0 #ffd966, 0 25px 40px rgba(0, 0, 0, 0.2);
      animation: kidPop 0.6s ease;
    }

    .kid-icon {
      font-size: 4.5em;
      margin-bottom: 10px;
      animation: emojiBounce 0.9s infinite alternate;
    }

    .kid-card h3 {
      font-size: 2em;
      font-family: "Livvic";
      margin-bottom: 8px;
    }

    .kid-card p {
      font-size: 1.2em;
      font-family: "Livvic";
    }

    /* Correct */
    .kid-correct .kid-card {
      background: #e6fffa;
      border: 6px solid #38d9a9;
    }

    .kid-correct h3 {
      color: #2f9e44;
      font-weight: 600;
    }

    .kid-correct p {
      color: #1c7c54;
    }

    /* Wrong */
    .kid-wrong .kid-card {
      background: #fff5f5;
      border: 6px solid #ffa8a8;
    }

    .kid-wrong h3 {
      color: #e03131;
      font-weight: 600;
    }

    .kid-wrong p {
      color: #c92a2a;
    }

    /* Animations */
    @keyframes kidPop {
      0% {
        transform: scale(0.3) rotate(-10deg);
        opacity: 0;
      }

      60% {
        transform: scale(1.1) rotate(5deg);
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    @keyframes emojiBounce {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-15px);
      }
    }

    /* ===== FINAL POPUP (also copied) ===== */
    #finalPopup {
      position: fixed;
      inset: 0;
      /* background: rgba(255, 255, 255, 0.4); */
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 4000;
    }

    .final-kid-box {
      background: linear-gradient(135deg, #fff7d6, #e6fff5);
      padding: 30px 35px;
      border-radius: 35px;
      text-align: center;
      width: 450px;
      animation: finalBounce 0.8s ease;
      box-shadow: 0 20px 0 #ffd43b, 0 30px 50px rgba(0, 0, 0, 0.2);
    }

    .final-kid-box h2 {
      font-size: 2.2em;
      font-family: "Livvic";
      color: #2f9e44;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .final-kid-box p {
      font-size: 1.3em;
      font-family: "Livvic";
      font-weight: 600;
    }

    #stars {
      font-size: 2.3em;
      margin: 12px 0;
    }

    /* Play Again Button */
    .playAgain-btn {
      background: #ffac30;
      color: white;
      border: none;
      padding: 14px 34px;
      border-radius: 30px;
      font-size: 1.1em;
      font-weight: 400;
      cursor: pointer;
      margin-top: 12px;
    }

    .playAgain-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #1c7ed6;
    }

    /* Animation */
    @keyframes finalBounce {
      0% {
        transform: scale(0.3);
        opacity: 0;
      }

      60% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* -------- MEDIA QUERIES (copied from MCQ) -------- */
    @media (max-width:900px) {
      body {
        align-items: center;
        padding: 20px;
        overflow: auto;
      }

      .stage {
        width: 100%;
        padding: 25px;
        gap: 20px;
      }

      .question {
        font-size: 30px;
        min-height: 80px;
        text-align: center;
      }

      .photo-wrap {
        width: 240px;
        height: 180px;
      }

      .input-container {
        max-width: 500px;
      }

      .answer-input {
        max-width: 350px;
        height: 65px;
        font-size: 22px;
      }

      .submit-btn {
        width: 170px;
        height: 50px;
        font-size: 18px;
      }

      .btn {
        width: 140px;
        height: 50px;
        font-size: 18px;
      }

      .nav-row {
        gap: 40px;
      }

      .kid-card {
        width: 300px;
      }

      .final-kid-box {
        width: 90%;
        max-width: 340px;
        padding: 22px;
      }

      .final-kid-box h2 {
        font-size: 1.8em;
      }

      .final-kid-box p {
        font-size: 1.1em;
      }

      #stars {
        font-size: 1.8em;
      }
    }

    @media (max-width:768px) {
      body {
        padding: 30px 0 10px;
        align-items: center;
      }

      .stage {
        padding: 20px;
        gap: 18px;
      }

      .question {
        font-size: 30px;
        min-height: 80px;
      }

      .photo-wrap {
        width: 220px;
        height: 170px;
      }

      .input-container {
        max-width: 420px;
      }

      .answer-input {
        max-width: 320px;
        height: 60px;
        font-size: 20px;
      }

      .submit-btn {
        width: 160px;
        height: 48px;
        font-size: 18px;
      }

      .btn {
        width: 130px;
        height: 48px;
        font-size: 18px;
      }

      .nav-row {
        gap: 30px;
      }

      .kid-card {
        width: 280px;
        padding: 20px;
      }

      .final-kid-box {
        width: 90%;
        max-width: 320px;
        padding: 22px;
      }
    }

    @media (max-width:480px) {
      body {
        padding: 50px 0 10px;
        align-items: flex-start;
      }

      .stage {
        padding: 20px;
        gap: 16px;
      }

      .question {
        font-size: 22px;
        min-height: 80px;
        text-align: center;
      }

      .photo-wrap {
        width: 200px;
        height: 120px;
      }

      .input-container {
        max-width: 320px;
      }

      .answer-input {
        max-width: 260px;
        height: 55px;
        font-size: 18px;
        padding: 0 18px;
      }

      .submit-btn {
        width: 140px;
        height: 45px;
        font-size: 16px;
      }

      .btn {
        width: 120px;
        height: 45px;
        font-size: 18px;
      }

      .nav-row {
        gap: 20px;
      }

      .kid-card {
        width: 260px;
        padding: 15px;
      }

      .kid-icon {
        font-size: 3em;
      }

      .kid-card h3 {
        font-size: 1.5em;
      }

      .final-kid-box {
        width: 90%;
        max-width: 300px;
        padding: 20px;
      }

      .final-kid-box h2 {
        font-size: 1.5em;
      }

      .final-kid-box p {
        font-size: 1em;
      }

      #stars {
        font-size: 1.6em;
      }

      .playAgain-btn {
        padding: 10px 20px;
        font-size: 0.9em;
      }
    }

    @media screen and (min-width:1025px) and (max-width:1440px) {
      .stage {
        max-width: 1100px;
      }

      .question {
        font-size: 30px;
        min-height: 80px;
      }

      .photo-wrap {
        width: 280px;
        height: 180px;
      }

      .input-container {
        max-width: 520px;
      }

      .answer-input {
        max-width: 500px;
        height: 70px;
        font-size: 24px;
      }

      .submit-btn {
        width: 180px;
        height: 55px;
        font-size: 18px;
      }

      .nav-row {
        gap: 50px;
        justify-content: space-around;
        align-items: center;
      }

      .btn {
        width: 150px;
        height: 55px;
        font-size: 20px;
      }
    }

    @media screen and (min-width:1441px) and (max-width:1920px) {
      .stage {
        max-width: 1400px;
      }

      .question {
        font-size: 40px;
        min-height: 90px;
      }

      .photo-wrap {
        width: 300px;
        height: 200px;
      }

      .input-container {
        max-width: 600px;
      }

      .answer-input {
        max-width: 550px;
        height: 75px;
        font-size: 28px;
      }

      .submit-btn {
        width: 200px;
        height: 58px;
        font-size: 22px;
      }

      .nav-row {
        gap: 100px;
        justify-content: space-around;
        align-items: center;
      }

      .btn {
        width: 160px;
        height: 58px;
        font-size: 22px;
      }
    }

    @media screen and (min-width:1921px) {
      .stage {
        max-width: 1500px;
      }

      .question {
        font-size: 40px;
        min-height: 90px;
      }

      .photo-wrap {
        width: 340px;
        height: 230px;
      }

      .input-container {
        max-width: 650px;
      }

      .answer-input {
        max-width: 460px;
        height: 80px;
        font-size: 30px;
      }

      .submit-btn {
        width: 220px;
        height: 60px;
        font-size: 24px;
      }

      .btn {
        width: 170px;
        height: 60px;
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="stage">
    <div class="question-wrap">
      <h1 class="question" id="question"></h1>
    </div>

    <div class="photo-wrap">
      <img class="photo" id="qImage" alt="question image" />
    </div>

    <div class="input-container">
      <input type="text" class="answer-input" id="answerInput" placeholder="Type answer here..." autocomplete="off" />
      <button class="submit-btn" id="submitBtn">Submit</button>
    </div>

    <div class="nav-row">
      <button class="btn prev-btn" id="prevBtn" disabled><i class="fa-solid fa-angles-left"></i> Prev</button>
      <button class="btn next-btn" id="nextBtn" disabled>Next <i class="fa-solid fa-angles-right"></i></button>
    </div>
  </main>

  <!-- ===== POPUP ELEMENTS (EXACT COPY FROM MCQ) ===== -->
  <div id="answerPopup" class="kid-popup">
    <div class="kid-card">
      <div class="kid-icon" id="popupIcon"></div>
      <h3 id="popupTitle"></h3>
      <p id="popupMsg"></p>
    </div>
  </div>

  <div id="finalPopup">
    <div class="final-kid-box">
      <h2>🎉 Congratulations!</h2>
      <p id="finalScore"></p>
      <div id="stars"></div>
      <button class="playAgain-btn" onclick="location.reload()">
        Play Again
      </button>
    </div>
  </div>

  <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
  <audio id="wrongSound"
    src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

  <script>
    const questions = [
      { q: "Q1. Lucknow is the capital of ______.", img: "../assets/images/lucknow.png", a: "Uttar Pradesh" },
      { q: "Q2. The river Ganga divides into two branches in ______.", img: "../assets/images/ganga.png", a: "West Bengal" },
      { q: "Q3. The places where the rivers Ganga, Yamuna and Saraswati meet is called the ______.", img: "../assets/images/triveni-sangam.png", a: "Triveni Sangam" },
      { q: "Q4. The Brahmaputra flows through ______ where it is known as Yarlung Tsangpo.", img: "../assets/images/brahmaputra.png", a: "Tibet" },
      { q: "Q5. Haryana is well known for its ______ wealth.", img: "../assets/images/kurukshetraa.png", a: "cattle" }
    ];

    const answers = new Array(questions.length).fill(null);
    let current = 0;

    const qEl = document.getElementById('question');
    const imgEl = document.getElementById('qImage');
    const inputEl = document.getElementById('answerInput');

    inputEl.addEventListener("drop", (e) => e.preventDefault());
    inputEl.addEventListener("dragover", (e) => e.preventDefault());
    const submitBtn = document.getElementById('submitBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // ===== POPUP ELEMENTS (copied from MCQ) =====
    const popup = document.getElementById('answerPopup');
    const icon = document.getElementById('popupIcon');
    const title = document.getElementById('popupTitle');
    const msg = document.getElementById('popupMsg');
    const finalPopup = document.getElementById('finalPopup');

    function speakText(t) {
      speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(t);
      msg.lang = "en-UK";
      msg.volume = 0.25;
      msg.rate = 1;
      msg.pitch = 1;
      speechSynthesis.speak(msg);
    }

    function smallConfetti() {
      confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
    }

    function bigConfetti() {
      confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } });
    }

    function formatAnswer(text) {
      text = text.trim().toLowerCase();
      return text.charAt(0).toUpperCase() + text.slice(1);
    }

    inputEl.addEventListener("input", function () {
      const start = this.selectionStart;

      let text = this.value.toLowerCase();

      if (text.length > 0) {
        text = text.charAt(0).toUpperCase() + text.slice(1);
      }

      this.value = text;

      this.setSelectionRange(start, start);
    });

    // ===== RENDER =====
    function render() {
      const q = questions[current];
      qEl.textContent = q.q;
      imgEl.src = q.img;

      const solvedValue = answers[current];
      const solved = solvedValue !== null;

      inputEl.value = solved ? solvedValue : '';
      inputEl.disabled = solved;
      submitBtn.disabled = solved || inputEl.value.trim() === '';

      inputEl.className = 'answer-input';
      if (solved) {
        inputEl.classList.add('correct');
      }

      prevBtn.disabled = current === 0;
      nextBtn.disabled = !solved || current === questions.length - 1;
    }

    inputEl.addEventListener('input', () => {
      if (answers[current] === null) {
        submitBtn.disabled = inputEl.value.trim() === '';
      }
    });

    // ===== SHOW POPUP (copied from MCQ) =====
    function showPopup(isCorrect) {
      popup.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
      popup.style.display = 'flex';

      if (isCorrect) {
        icon.textContent = '🎉😊';
        title.textContent = 'Great Job!';
        msg.textContent = 'You got it right!';
      } else {
        icon.textContent = '🥲💭';
        title.textContent = 'Oops!';
        msg.textContent = 'Try again, you can do it!';
      }

      setTimeout(() => {
        popup.style.display = 'none';
      }, 1400);
    }

    function showFinal() {
      document.getElementById('finalScore').textContent =
        `Your Score: ${questions.length} / ${questions.length}`;
      document.getElementById('stars').textContent = '⭐'.repeat(questions.length);
      finalPopup.style.display = 'flex';
      bigConfetti();
    }

    // ===== HANDLE SUBMIT =====
    function handleCheck() {
      if (answers[current] !== null) return;

      const userAns = inputEl.value.trim().toLowerCase();
      if (!userAns) return;

      const correctAns = questions[current].a.toLowerCase();

      if (userAns === correctAns) {
        const formattedAnswer = formatAnswer(inputEl.value);
        answers[current] = formattedAnswer;
        inputEl.value = formattedAnswer;
        inputEl.classList.add('correct');
        inputEl.disabled = true;
        submitBtn.disabled = true;

        speakText('Correct');
        smallConfetti();
        showPopup(true);
        if (current < questions.length - 1) nextBtn.disabled = false;

        if (answers.every(a => a !== null)) setTimeout(showFinal, 1600);
      } else {
        speakText('Wrong');
        showPopup(false);
        inputEl.classList.add('wrong');
        inputEl.value = "";
        submitBtn.disabled = true;
        setTimeout(() => {
          inputEl.classList.remove('wrong');
          if (answers[current] === null) submitBtn.disabled = false;
        }, 700);
      }
    }

    submitBtn.addEventListener('click', handleCheck);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleCheck();
    });

    // ===== NAVIGATION =====
    prevBtn.addEventListener('click', () => {
      if (current > 0) {
        current--;
        render();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (current < questions.length - 1 && answers[current] !== null) {
        current++;
        render();
      }
    });

    // ===== RESET (for Play Again) =====
    document.querySelector('.playAgain-btn').addEventListener('click', () => {
      for (let i = 0; i < answers.length; i++) answers[i] = null;
      current = 0;
      finalPopup.style.display = 'none';
      render();
    });

    // ===== INIT =====
    render();
  </script>
</body>

</html>
