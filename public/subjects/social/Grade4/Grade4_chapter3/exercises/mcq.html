<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCQ Quiz - Kids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Livvic', system-ui, sans-serif;
            font-weight: 400;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .stage {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .question {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: 400;
            color: #2f4f4f;
            line-height: 1.4;
            letter-spacing: -0.3px;
            text-align: left;
        }

        /* Image Container - Fixed Size */
        .photo-wrap {
            width: 100%;
            width: 250px;
            height: 200px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            object-fit: contain;
        }

        .photo {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 20px;
            display: block;
        }

        /* Options Grid */
        .options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .options {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        .option {
            padding: 3px 5px;
            border: 3px solid #02b8a8;
            border-radius: 18px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
            background: #f1ffff;
            position: relative;
            min-height: 120px;
            justify-content: flex-start;
            font-weight: 400;
            padding-inline: 10px;
        }

        .option:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px -8px rgba(107, 78, 255, 0.35);
        }

        .option-img-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
        }

        .option-text {
            font-size: 20px;
            font-weight: 500;
            color: #2d2a4a;
            text-align: center;
            line-height: 1.2;
        }

        .option.correct {
            background: linear-gradient(135deg, #d8f5d033, #b7ecc11f);
            border-color: #4caf50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .option.correct .option-text {
            color: #2e7d32;
            font-weight: 500;
        }

        .option.correct::after {
            content: "✓";
            position: absolute;
            top: 8px;
            right: 8px;
            background: #4caf50;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
        }

        .option.wrong {
            background: #ffebeb;
            border-color: #ff7c7a;
            animation: shake 0.3s;
        }

        .option.wrong .option-text {
            color: #b71c1c;
        }

        .option.wrong::after {
            content: "✕";
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ffefef;
            color: #bb0101;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(229, 57, 53, 0.3);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        .option:disabled {
            cursor: not-allowed;
        }

        .option.locked-dim {
            opacity: 0.5;
        }

        /* ===== NAV BUTTONS GLASS SHINE EFFECT ===== */
        .btn {
            width: 130px;
            height: 55px;
            padding: 13px 28px;
            font-size: 18px;
            font-weight: 500;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            color: #fff;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .btn:not(:disabled)::before {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.4) 50%,
                    rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            animation: glassShine 3.5s infinite ease-in-out;
        }

        @keyframes glassShine {
            0% {
                left: -150%;
            }

            30% {
                left: 150%;
            }

            100% {
                left: 150%;
            }
        }

        .btn:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.3);
        }

        .btn:not(:disabled):active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .prev-btn {
            background: linear-gradient(135deg, #ffc371 0%, #ffb347 100%);
        }

        .next-btn {
            background: linear-gradient(135deg, #5ba3ff 0%, #4a90e2 100%);
        }

        .nav-row {
            display: flex;
            gap: 50px;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        /* ============================================
           POPUP STYLE — EXACTLY COPIED FROM MCQ QUIZ
        ============================================ */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .kid-card {
            background: #ffffff;
            width: 320px;
            padding: 25px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 0 #ffd966, 0 25px 40px rgba(0, 0, 0, 0.2);
            animation: kidPop 0.6s ease;
        }

        .kid-icon {
            font-size: 4.5em;
            margin-bottom: 10px;
            animation: emojiBounce 0.9s infinite alternate;
        }

        .kid-card h3 {
            font-size: 2em;
            font-family: "Livvic";
            margin-bottom: 8px;
        }

        .kid-card p {
            font-size: 1.2em;
            font-family: "Livvic";
        }

        .kid-correct .kid-card {
            background: #e6fffa;
            border: 6px solid #38d9a9;
        }

        .kid-correct h3 {
            color: #2f9e44;
            font-weight: 600;
        }

        .kid-correct p {
            color: #1c7c54;
        }

        .kid-wrong .kid-card {
            background: #fff5f5;
            border: 6px solid #ffa8a8;
        }

        .kid-wrong h3 {
            color: #e03131;
            font-weight: 600;
        }

        .kid-wrong p {
            color: #c92a2a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-10deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.1) rotate(5deg);
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }

        /* ===== FINAL POPUP (also copied) ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .final-kid-box {
            background: linear-gradient(135deg, #fff7d6, #e6fff5);
            padding: 30px 35px;
            border-radius: 35px;
            text-align: center;
            width: 450px;
            animation: finalBounce 0.8s ease;
            box-shadow: 0 20px 0 #ffd43b, 0 30px 50px rgba(0, 0, 0, 0.2);
        }

        .final-kid-box h2 {
            font-size: 2.2em;
            font-family: "Livvic";
            color: #2f9e44;
            margin-bottom: 10px;
              font-weight: 600;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-family: "Livvic";
            font-weight: 600;
        }

        #stars {
            font-size: 2.3em;
            margin: 12px 0;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 400;
            cursor: pointer;
            margin-top: 12px;
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #1c7ed6;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* -------- MEDIA QUERIES (copied from MCQ) -------- */
        @media (max-width:900px) {
            body {
                align-items: center;
                padding: 20px;
                overflow: auto;
            }

            .stage {
                width: 100%;
                max-width: 100%;
                padding: 25px;
                gap: 18px;
            }

            .question {
                font-size: 30px;
                font-weight: 400;
                min-height: 80px;
                display: flex;
                align-items: center;
            }

            .photo-wrap {
                width: 240px;
                height: 180px;
            }

            .options {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }

            .option {
                min-height: 110px;
                padding: 12px;
                gap: 12px;
            }

            .option-img-wrapper {
                width: 80px;
                height: 70px;
            }

            .option-text {
                font-size: 18px;
                font-weight: 500;
            }

            .btn {
                width: 140px;
                height: 50px;
                font-size: 18px;
            }

            .kid-card {
                width: 300px;
            }

            .final-kid-box {
                width: 90%;
                max-width: 340px;
                padding: 22px;
            }

            .final-kid-box h2 {
                font-size: 1.8em;
            }

            .final-kid-box p {
                font-size: 1.1em;
            }

            #stars {
                font-size: 1.8em;
            }
        }

        @media (max-width:768px) {
            body {
                padding: 30px 0 10px;
                align-items: center;
            }

            .stage {
                padding: 20px;
            }

            .question {
                font-size: 30px;
                font-weight: 400;
                min-height: 80px;
            }

            .photo-wrap {
                width: 220px;
                height: 170px;
            }

            .options {
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }

            .option {
                min-height: 100px;
                padding: 10px;
                gap: 10px;
                flex-direction: column;
            }

            .option-img-wrapper {
                width: 70px;
                height: 60px;
            }

            .option-text {
                font-size: 16px;
                font-weight: 500;
            }

            .btn {
                width: 130px;
                height: 48px;
                font-size: 18px;
            }

            .kid-card {
                width: 280px;
                padding: 20px;
            }

            .final-kid-box {
                width: 90%;
                max-width: 320px;
                padding: 22px;
            }
        }

        @media (max-width:480px) {
            body {
                padding: 50px 0 10px;
                align-items: flex-start;
            }

            .stage {
                padding: 20px;
                gap: 15px;
            }

            .question {
                font-size: 22px;
                font-weight: 400;
                min-height: 80px;
                display: flex;
                align-items: center;
            }

            .photo-wrap {
                width: 200px;
                height: 120px;
            }

            .options {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .option {
                min-height: 120px;
                padding: 12px;
                gap: 10px;
                flex-direction: column;
            }

            .option-img-wrapper {
                width: 65px;
                height: 50px;
            }

            .option-text {
                font-size: 16px;
                font-weight: 500;
            }

            .btn {
                width: 120px;
                height: 45px;
                font-size: 18px;
            }

            .kid-card {
                width: 260px;
                padding: 15px;
            }

            .kid-icon {
                font-size: 3em;
            }

            .kid-card h3 {
                font-size: 1.5em;
            }

            .final-kid-box {
                width: 90%;
                max-width: 300px;
                padding: 20px;
            }

            .final-kid-box h2 {
                font-size: 1.5em;
            }

            .final-kid-box p {
                font-size: 1em;
            }

            #stars {
                font-size: 1.6em;
            }

            .playAgain-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }

        @media screen and (min-width:1025px) and (max-width:1440px) {
            .stage {
                max-width: 1100px;
                gap: 30px;
                padding-inline: 40px;
            }

            .question {
                font-size: 30px;
                font-weight: 400;
                min-height: 80px;
            }

            .photo-wrap {
                width: 260px;
                height: 180px;
            }

            .options {
                gap: 22px;
            }

            .option {
                min-height: 130px;
                padding: 16px;
            }

            .option-img-wrapper {
                width: 110px;
                height: 80px;
            }

            .option-text {
                font-size: 22px;
                font-weight: 500;
            }

            .btn {
                width: 150px;
                height: 55px;
                font-size: 20px;
            }
        }

        @media screen and (min-width:1441px) and (max-width:1920px) {
            .stage {
                max-width: 1400px;
                gap: 35px;
                padding-inline: 40px;
            }

            .question {
                font-size: 40px;
                font-weight: 400;
                min-height: 90px;
            }

            .photo-wrap {
                width: 300px;
                height: 200px;
            }

            .options {
                gap: 26px;
            }

            .option {
                min-height: 145px;
                padding: 18px;
            }

            .option-img-wrapper {
                width: 120px;
                height: 90px;
            }

            .option-text {
                font-size: 24px;
                font-weight: 500;
            }

            .btn {
                width: 160px;
                height: 60px;
                font-size: 22px;
            }
        }

        @media screen and (min-width:1921px) {
            .stage {
                max-width: 1500px;
                gap: 40px;
                padding-inline: 50px;
            }

            .question {
                font-size: 40px;
                font-weight: 400;
                min-height: 90px;
            }

            .photo-wrap {
                width: 340px;
                height: 230px;
            }

            .options {
                gap: 30px;
            }

            .option {
                min-height: 160px;
                padding: 20px;
            }

            .option-img-wrapper {
                width: 130px;
                height: 100px;
            }

            .option-text {
                font-size: 26px;
                font-weight: 500;
            }

            .btn {
                width: 170px;
                height: 70px;
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="stage">
        <div class="question-wrap">
            <h1 class="question" id="question"></h1>
        </div>

        <div class="photo-wrap">
            <img class="photo" id="qImage" alt="question image" />
        </div>

        <div class="options" id="options"></div>

        <div class="nav-row">
            <button class="btn prev-btn" id="prevBtn" disabled><i class="fa-solid fa-angles-left"></i> Prev</button>
            <button class="btn next-btn" id="nextBtn" disabled>Next <i class="fa-solid fa-angles-right"></i></button>
        </div>
    </main>

    <!-- ===== POPUP ELEMENTS (EXACT COPY FROM MCQ) ===== -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">
                Play Again
            </button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        const questions = [{
            q: "Q1. The Himalayan Rivers originate from the Himalayas and form ______ major river systems.",
            img: "../assets/images/mcq1.png",
            options: [
                { text: "Two", img: "../assets/images/two.png" },
                { text: "One", img: "../assets/images/one.png" },
                { text: "Three", img: "../assets/images/three.png" },
            ],
            a: 2,
        }, {
            q: "Q2. The ______ glacier feeds the Ganga River.",
            img: "../assets/images/mcq2.png",
            options: [
                { text: "Gangotri", img: "../assets/images/ganga.png" },
                { text: "Bay of Bengal", img: "../assets/images/bay-of-bengal.png" },
                { text: "Brahmaputra", img: "../assets/images/brahmaputra.png" },
            ],
            a: 0,
        }, {
            q: "Q3. Both roadways and ______ are the most widely used mode of public transportation.",
            img: "../assets/images/mcq3.png",
            options: [
                { text: "Airways", img: "../assets/images/airways.png" },
                { text: "Railways", img: "../assets/images/railways.png" },
                { text: "Waterways", img: "../assets/images/waterways.png" },
            ],
            a: 1,
        }, {
            q: "Q4. ______ is the main occupation of the people living in villages.",
            img: "../assets/images/mcq4.png",
            options: [
                { text: "Fishing", img: "../assets/images/fishing.png" },
                { text: "Animal husbandry", img: "../assets/images/animal-husbandry.png" },
                { text: "Agriculture", img: "../assets/images/agriculture.png" },
            ],
            a: 2,
        }, {
            q: "Q5. The famous Golden Temple is located in ______.",
            img: "../assets/images/mcq5.png",
            options: [
                { text: "Amritsar", img: "../assets/images/amritsar2.png" },
                { text: "Ludhiana", img: "../assets/images/ludhaina2.png" },
                { text: "Chandigarh", img: "../assets/images/chandigarh2.png" },
            ],
            a: 0,
        },];

        const answers = new Array(questions.length).fill(null);
        let current = 0;

        const qEl = document.getElementById('question');
        const imgEl = document.getElementById('qImage');
        const optionsEl = document.getElementById('options');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // ===== POPUP ELEMENTS (copied from MCQ) =====
        const popup = document.getElementById('answerPopup');
        const icon = document.getElementById('popupIcon');
        const title = document.getElementById('popupTitle');
        const msg = document.getElementById('popupMsg');
        const finalPopup = document.getElementById('finalPopup');

        function speakText(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-UK";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } });
        }

        // ===== SHOW POPUP (copied from MCQ) =====
        function showPopup(isCorrect) {
            popup.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
            popup.style.display = 'flex';

            if (isCorrect) {
                icon.textContent = '🎉😊';
                title.textContent = 'Great Job!';
                msg.textContent = 'You got it right!';
            } else {
                icon.textContent = '🥲💭';
                title.textContent = 'Oops!';
                msg.textContent = 'Try again, you can do it!';
            }

            setTimeout(() => {
                popup.style.display = 'none';
            }, 1400);
        }

        function showFinal() {
            document.getElementById('finalScore').textContent =
                `Your Score: ${questions.length} / ${questions.length}`;
            document.getElementById('stars').textContent = '⭐'.repeat(questions.length);
            finalPopup.style.display = 'flex';
            bigConfetti();
        }

        // ===== RENDER FUNCTION =====
        function render() {
            const q = questions[current];
            qEl.textContent = q.q;
            imgEl.src = q.img;

            const solvedIdx = answers[current];
            const solved = solvedIdx !== null;

            optionsEl.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerHTML = `
          <div class="option-img-wrapper">
            <img src="${opt.img}" alt="${opt.text}" class="option-img" />
          </div>
          <div class="option-text">${opt.text}</div>
        `;
                if (solved) {
                    btn.disabled = true;
                    if (i === solvedIdx) btn.classList.add('correct');
                    else btn.classList.add('locked-dim');
                }
                btn.addEventListener('click', () => handlePick(i, btn));
                optionsEl.appendChild(btn);
            });

            prevBtn.disabled = current === 0;
            nextBtn.disabled = !solved || current === questions.length - 1;
        }

        // ===== HANDLE PICK =====
        function handlePick(i, btn) {
            if (answers[current] !== null) return;
            const correct = questions[current].a;
            if (i === correct) {
                answers[current] = i;
                btn.classList.add('correct');
                [...optionsEl.children].forEach((c, idx) => {
                    c.disabled = true;
                    if (idx !== i) c.classList.add('locked-dim');
                });

                speakText('Correct');
                smallConfetti();
                showPopup(true);
                if (current < questions.length - 1) nextBtn.disabled = false;
                if (answers.every(a => a !== null)) setTimeout(showFinal, 1600);
            } else {
                speakText('Wrong');
                showPopup(false);
                btn.classList.add('wrong');
                setTimeout(() => btn.classList.remove('wrong'), 700);
            }
        }

        // ===== NAVIGATION =====
        prevBtn.addEventListener('click', () => {
            if (current > 0) {
                current--;
                render();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (current < questions.length - 1 && answers[current] !== null) {
                current++;
                render();
            }
        });

        // ===== RESET (for Play Again) =====
        document.querySelector('.playAgain-btn').addEventListener('click', () => {
            for (let i = 0; i < answers.length; i++) answers[i] = null;
            current = 0;
            finalPopup.style.display = 'none';
            render();
        });

        // ===== INIT =====
        render();
    </script>
</body>

</html>
