<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fill The Blanks Quiz</title>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Livvic", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-container {
            width: 750px;
        }

        .quiz-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .question-area {
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .question-area h2 {
            font-size: 30px;
            font-weight: 400;
            color: #2f4f4f;
            text-align: left;
        }

        .image-area {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .image-area img {
            width: 340px;
            height: 200px;
            object-fit: contain;
            border-radius: 20px;
            filter: grayscale(0%) brightness(1);
            transition: .4s;
            padding: 10px;
        }

        .image-area img.reveal {
            filter: none;
            transform: scale(1.05);
        }

        .input-area {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            width: 90%;
        }

        /* ===== REFRESHED INPUT BOX WITH ACTIVE STATE ===== */
        .input-box {
            flex: 1;
            min-width: 160px;
            height: 70px;
            max-width: 80%;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 20px;
            border: 3px solid #6bc6f5;
            background: #f8fcff;
            box-shadow: 0 4px 12px rgba(0, 20, 40, 0.06), inset 0 2px 4px rgba(255, 255, 255, 0.9);
            transition: all 0.25s ease;
        }

        .input-box:focus-within {
            border-color: #5bc4f8;
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(107, 198, 245, 0.25), 0 0 0 4px rgba(107, 198, 245, 0.08);
            transform: translateY(-2px);
        }

        .input-area .input-box:only-child {
            max-width: 400px;
        }

        .input-box.correct {
            border-color: #2b9e5e;
            background: #e5ffef;
            box-shadow: 0 4px 14px rgba(43, 158, 94, 0.2);
        }

        .input-box.correct:focus-within {
            border-color: #2b9e5e;
            box-shadow: 0 4px 20px rgba(43, 158, 94, 0.3), 0 0 0 4px rgba(43, 158, 94, 0.1);
        }

        .input-box.correct input {
            text-transform: capitalize;
            font-weight: 500;
        }

        .input-box input {
            flex: 1;
            height: 40px;
            font-size: 20px;
            font-weight: 500;
            border: none;
            outline: none;
            background: transparent;
            color: #1e3b4a;
            transition: 0.2s;
        }

        .input-box input::placeholder {
            color: #2f4f4f;
            font-weight: 500;
        }

        .input-box input:focus::placeholder {
            color: #d0dce6;
        }

        /* ===== REFRESHED TICK BUTTON ===== */
        .input-box button {
            width: 120px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            font-size: 20px;
            font-weight: 500;
            border: none;
            background: linear-gradient(145deg, #56c7f0, #3a9fd4);
            color: #fff;
            cursor: pointer;
            line-height: normal;
            padding-bottom: 5px;
            transition: all 0.12s ease;
        }

        .input-box button:hover:not(:disabled) {
            transform: translateY(-2px);
            /* box-shadow: 0 6px 0 #2a7aa8, 0 10px 24px rgba(58, 159, 212, 0.45); */
            background: linear-gradient(145deg, #63d0f5, #42a8db);
        }

        .input-box button:active:not(:disabled) {
            transform: translateY(4px);
            /* box-shadow: 0 2px 0 #2a7aa8; */
        }

        .input-box button:disabled {
            background: #c5d9e8;
            /* box-shadow: 0 4px 0 #8aa3b7; */
            color: #eaf1f8;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== NAV BUTTONS – SAME STYLE AS REFERENCE ===== */
        .nav-buttons {
            width: 100%;
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 150px;
        }

        .nav-buttons button {
            width: 150px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            border-radius: 18px;
            border: none;
            font-size: 20px;
            font-weight: 500;
            color: #fff;
            cursor: pointer;
            transition: .25s;
        }

        #prevBtn {
            background: linear-gradient(135deg, #67b8ff, #74b2ff);
        }

        #nextBtn {
            background: linear-gradient(135deg, #ffd86f, #ffb300);
        }

        .nav-buttons button:hover {
            transform: translateY(-3px);
            filter: brightness(1.05);
        }

        .nav-buttons button:active {
            transform: scale(.96);
        }

        .nav-buttons button:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ============================================
           POPUP STYLE — EXACTLY COPIED FROM MCQ QUIZ
        ============================================ */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .kid-card {
            background: #ffffff;
            width: 320px;
            padding: 25px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 0 #ffd966, 0 25px 40px rgba(0, 0, 0, 0.2);
            animation: kidPop 0.6s ease;
        }

        .kid-icon {
            font-size: 4.5em;
            margin-bottom: 10px;
            animation: emojiBounce 0.9s infinite alternate;
        }

        .kid-card h3 {
            font-size: 2em;
            font-family: "Livvic";
            margin-bottom: 8px;
        }

        .kid-card p {
            font-size: 1.2em;
            font-family: "Livvic";
        }

        .kid-correct .kid-card {
            background: #e6fffa;
            border: 6px solid #38d9a9;
        }

        .kid-correct h3 {
            color: #2f9e44;
            font-weight: 600;
        }

        .kid-correct p {
            color: #1c7c54;
        }

        .kid-wrong .kid-card {
            background: #fff5f5;
            border: 6px solid #ffa8a8;
        }

        .kid-wrong h3 {
            color: #e03131;
            font-weight: 600;
        }

        .kid-wrong p {
            color: #c92a2a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-10deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.1) rotate(5deg);
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }

        /* ===== FINAL POPUP (also copied) ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .final-kid-box {
            background: linear-gradient(135deg, #fff7d6, #e6fff5);
            padding: 30px 35px;
            border-radius: 35px;
            text-align: center;
            width: 450px;
            animation: finalBounce 0.8s ease;
            box-shadow: 0 20px 0 #ffd43b, 0 30px 50px rgba(0, 0, 0, 0.2);
        }

        .final-kid-box h2 {
            font-size: 2.2em;
            font-family: "Livvic";
            color: #2f9e44;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-family: "Livvic";
            font-weight: 600;
        }

        #stars {
            font-size: 2.3em;
            margin: 12px 0;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 400;
            cursor: pointer;
            margin-top: 12px;
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #1c7ed6;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* -------- MEDIA QUERIES (copied from MCQ) -------- */
        @media (max-width:900px) {
            body {
                padding: 20px;
                overflow: auto;
            }

            .main-container {
                width: 100%;
                max-width: 700px;
            }

            .image-area img {
                width: 280px;
                height: 180px;
            }

            .input-box {
                height: 60px;
            }

            .input-box input {
                font-size: 18px;
            }

            .input-box button {
                height: 40px;
                width: 100px;
                font-size: 22px;
            }

            .nav-buttons {
                gap: 80px;
            }

            .nav-buttons button {
                width: 130px;
                height: 50px;
                font-size: 18px;
            }

            .kid-card {
                width: 300px;
            }

            .final-kid-box {
                width: 90%;
                max-width: 340px;
                padding: 22px;
            }

            .final-kid-box h2 {
                font-size: 1.8em;
            }

            .final-kid-box p {
                font-size: 1.1em;
            }

            #stars {
                font-size: 1.8em;
            }
        }

        @media (max-width:768px) {
            .quiz-container {
                margin-top: 40px;
            }

            .image-area img {
                width: 230px;
                height: 160px;
            }

            .input-area {
                width: 100%;
                gap: 10px;
            }

            .input-box {
                height: 55px;
            }

            .input-box input {
                font-size: 17px;
            }

            .input-box button {
                height: 40px;
                width: 100px;
                font-size: 20px;
            }

            .nav-buttons {
                margin-top: 20px;
                gap: 40px;
            }

            .nav-buttons button {
                width: 120px;
                height: 45px;
                font-size: 16px;
            }

            .kid-card {
                width: 280px;
                padding: 20px;
            }

            .final-kid-box {
                width: 90%;
                max-width: 320px;
                padding: 22px;
            }
        }

        @media (max-width:480px) {
            body {
                padding: 40px 10px;
                align-items: flex-start;
            }

            .question-area h2 {
                font-size: 22px;
            }

            .image-area img {
                width: 190px;
                height: 140px;
            }

            .input-area {
                flex-direction: column;
            }

            .input-box {
                width: 100%;
            }

            .input-box input {
                font-size: 16px;
            }

            .input-box button {
                font-size: 16px;
                height: 35px;
                width: 100px;
            }

            .nav-buttons {
                gap: 20px;
                justify-content: space-between;
            }

            .nav-buttons button {
                width: 110px;
                height: 42px;
                font-size: 15px;
                padding: 0 8px;
            }

            .kid-card {
                width: 260px;
                padding: 15px;
            }

            .kid-icon {
                font-size: 3em;
            }

            .kid-card h3 {
                font-size: 1.5em;
            }

            .final-kid-box {
                width: 90%;
                max-width: 300px;
                padding: 20px;
            }

            .final-kid-box h2 {
                font-size: 1.5em;
            }

            .final-kid-box p {
                font-size: 1em;
            }

            #stars {
                font-size: 1.6em;
            }

            .playAgain-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }

        @media screen and (min-width:1025px) and (max-width:1440px) {
            .main-container {
                width: 850px;
            }

            .image-area img {
                width: 380px;
                height: 220px;
            }

            .input-box {
                height: 75px;
            }

            .input-area .input-box:only-child {
                max-width: 400px;
            }

            .input-box input {
                font-size: 24px;
            }

            .input-box button {
                height: 55px;
                width: 120px;
                font-size: 24px;
            }

            .nav-buttons {
                gap: 180px;
            }

            .nav-buttons button {
                width: 150px;
                height: 55px;
                font-size: 20px;
            }
        }

        @media screen and (min-width:1441px) and (max-width:1920px) {
            .main-container {
                width: 1450px;
            }

            .question-area h2 {
                font-size: 40px;
            }

            .image-area img {
                width: 420px;
                height: 250px;
            }

            .input-area {
                width: 65%;
            }

            .input-area .input-box:only-child {
                max-width: 400px;
            }

            .input-box {
                height: 80px;
            }

            .input-box input {
                font-size: 24px;
            }

            .input-box button {
                font-size: 26px;
                height: 60px;
                width: 120px;
            }

            .nav-buttons {
                gap: 200px;
            }

            .nav-buttons button {
                width: 160px;
                height: 60px;
                font-size: 22px;
            }
        }

        @media screen and (min-width:1921px) {
            .main-container {
                width: 1500px;
            }

            .question-area h2 {
                font-size: 40px;
            }

            .image-area img {
                width: 460px;
                height: 280px;
            }

            .input-box {
                height: 90px;
            }

            .input-area {
                width: 65%;
            }


            .input-area .input-box:only-child {
                max-width: 500px;
            }

            .input-box input {
                font-size: 26px;
            }

            .input-box button {
                font-size: 30px;
                height: 70px;
                width: 130px;
            }

            .nav-buttons {
                gap: 240px;
            }

            .nav-buttons button {
                width: 170px;
                height: 65px;
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="main-container">

        <div class="quiz-container">

            <div class="question-area">
                <h2 id="questionText"></h2>
            </div>

            <div class="image-area">
                <img id="questionImage">
            </div>

            <div class="input-area" id="inputsContainer"></div>

            <div class="nav-buttons">
                <button id="prevBtn"><i class="fa-solid fa-angles-left"></i> Prev</button>
                <button id="nextBtn">Next <i class="fa-solid fa-angles-right"></i></button>
            </div>

        </div>
    </div>

    <!-- ===== POPUP ELEMENTS (EXACT COPY FROM MCQ) ===== -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">
                Play Again
            </button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "Q1. The ______ Plateau is a flat, high-up area of land.",
                a: ["Deccan"],
                img: "../assets/images/ftb1.png",
            },
            {
                q: "Q2. Karnataka is located in the ______ part of the Indian peninsula.",
                a: ["Southern"],
                img: "../assets/images/ftb22.png",
            },
            {
                q: "Q3. Bhopal is the capital of ______.",
                a: ["Madhya Pradesh"],
                img: "../assets/images/ftb3.png",
            },
            {
                q: "Q4. The major languages spoken in Telangana are ______ and ______.",
                a: ["Telugu", "Urdu"],
                img: "../assets/images/ftb4.png",
            },
            {
                q: "Q5. Andhra Pradesh is the largest producer of ______.",
                a: ["tobacco"],
                img: "../assets/images/ftb5.png",
            },
        ];

        let index = 0;
        let score = 0;

        const questionText = document.getElementById("questionText");
        const image = document.getElementById("questionImage");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const inputsRow = document.getElementById("inputsContainer");

        // ===== POPUP ELEMENTS (copied from MCQ) =====
        const popup = document.getElementById('answerPopup');
        const icon = document.getElementById('popupIcon');
        const title = document.getElementById('popupTitle');
        const msg = document.getElementById('popupMsg');
        const finalPopup = document.getElementById('finalPopup');

        const userAnswers = questions.map((q) => ({
            used: [],
            boxes: q.a.map(() => ({
                value: "",
                correct: false,
                buttonRemoved: false
            })),
        }));

        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-UK";
            msg.volume = 0.25;
            speechSynthesis.speak(msg);
        }

        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } });
        }

        // ===== SHOW POPUP (copied from MCQ) =====
        function showPopup(isCorrect) {
            popup.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
            popup.style.display = 'flex';

            if (isCorrect) {
                icon.textContent = '🎉😊';
                title.textContent = 'Great Job!';
                msg.textContent = 'You got it right!';
            } else {
                icon.textContent = '🥲💭';
                title.textContent = 'Oops!';
                msg.textContent = 'Try again, you can do it!';
            }

            setTimeout(() => {
                popup.style.display = 'none';
            }, 1400);
        }

        function showFinal() {
            document.getElementById('finalScore').textContent =
                `Your Score: ${score} / ${questions.length}`;
            document.getElementById('stars').textContent = '⭐'.repeat(score);
            finalPopup.style.display = 'flex';
            bigConfetti();
        }


        function toSentenceCase(text) {
            text = text.toLowerCase();
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        function loadQuestion() {
            const q = questions[index];

            questionText.innerText = q.q;
            image.src = q.img;

            image.classList.toggle(
                "reveal",
                userAnswers[index].boxes.every((b) => b.correct),
            );

            prevBtn.disabled = index === 0;

            inputsRow.innerHTML = "";

            q.a.forEach((_, i) => {
                const box = document.createElement("div");
                box.className = "input-box";

                const input = document.createElement("input");
                input.type = "text";
                input.placeholder = "Type here...";
                input.value = userAnswers[index].boxes[i].value;
                input.addEventListener("drop", (e) => e.preventDefault());
                input.addEventListener("dragover", (e) => e.preventDefault());

                const btn = document.createElement("button");
                btn.textContent = "Check";
                btn.disabled = input.value.trim() === "";

                input.addEventListener("input", () => {
                    const pos = input.selectionStart;

                    input.value = toSentenceCase(input.value);

                    input.setSelectionRange(pos, pos);

                    btn.disabled = input.value.trim() === "";
                });

                const boxState = userAnswers[index].boxes[i];

                if (boxState.correct) {
                    box.classList.add("correct");
                    input.disabled = true;
                }

                btn.onclick = () => checkAnswer(input, btn, box, i);

                box.appendChild(input);

                if (!boxState.buttonRemoved) {
                    box.appendChild(btn);
                }
                inputsRow.appendChild(box);
            });

            checkAllAnswered();
        }

        function checkAnswer(input, btn, box, i) {
            const value = input.value.trim().toLowerCase();
            const answers = questions[index].a.map(a => a.toLowerCase());
            const state = userAnswers[index];

            let isCorrect = false;

            isCorrect = answers.includes(value);

            if (isCorrect && (index === 0 || !state.used.includes(value))) {
                box.classList.add("correct");

                input.disabled = true;
                btn.remove();

                state.used.push(value);
                state.boxes[i] = {
                    value: toSentenceCase(input.value),
                    correct: true,
                    buttonRemoved: true
                };

                btn.remove();

                speak("Correct");
                smallConfetti();
                showPopup(true);
            } else {
                input.value = "";
                btn.disabled = true;

                speak("Wrong");
                showPopup(false);
            }

            checkAllAnswered();
        }

        function checkAllAnswered() {
            const done = userAnswers[index].boxes.every((b) => b.correct);
            nextBtn.disabled = !done;

            if (done && !userAnswers[index].scored) {
                score++;
                userAnswers[index].scored = true;
                image.classList.add("reveal");

                if (index === questions.length - 1) {
                    setTimeout(showFinal, 1600);
                }
            }
        }

        nextBtn.onclick = () => {
            if (index < questions.length - 1) {
                index++;
                loadQuestion();
            }
        };

        prevBtn.onclick = () => {
            if (index > 0) {
                index--;
                loadQuestion();
            }
        };

        // ===== RESET (for Play Again) =====
        document.querySelector('.playAgain-btn').addEventListener('click', () => {
            location.reload();
        });

        loadQuestion();
    </script>
</body>

</html>
