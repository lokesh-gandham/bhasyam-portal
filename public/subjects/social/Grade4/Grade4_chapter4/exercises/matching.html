<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Game · Image + Text</title>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Livvic", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MAIN */

        .main {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER */

        h1 {
            font-size: 28px;
            color: #2f4f4f;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 35px;
        }

        /* GAME AREA */

        .game-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 120px;
        }

        /* SVG */

        #line-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* COLUMNS */

        .column {
            display: flex;
            flex-direction: column;
            gap: 22px;
            z-index: 2;
            border-radius: 16px;
        }

        /* CARD STYLE - left column (text only) */

        .item {
            width: 340px;
            height: 80px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 14px 20px;
            cursor: pointer;
            font-size: 22px;
            color: #2f4f4f;
            text-align: left;
            background: linear-gradient(145deg, #ffffff, #edf4fe);
            border: 3px solid #b0cce8;
            box-shadow: 0 4px 16px rgba(44, 74, 107, 0.08),
                0 2px 8px rgba(44, 74, 107, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            transition: .25s;
        }

        /* RIGHT COLUMN — image + text layout */
        .item-right {
            width: 340px;
            height: 80px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 16px 8px 10px;
            cursor: pointer;
            font-size: 22px;
            color: #2f4f4f;
            text-align: left;
            background: linear-gradient(145deg, #ffffff, #edf4fe);
            border: 3px solid #b0cce8;
            box-shadow: 0 4px 16px rgba(44, 74, 107, 0.08),
                0 2px 8px rgba(44, 74, 107, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            transition: .25s;
        }

        .item-right img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            display: block;
        }

        .item-right .right-text {
            flex: 1;
            font-weight: 500;
            font-size: 20px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item:hover:not(.matched),
        .item-right:hover:not(.matched) {
            transform: translateY(-3px);
        }

        .item.active,
        .item-right.active {
            background: #fff6f0;
            border: 3px solid #ffaa5b;
        }

        .item.matched,
        .item-right.matched {
            opacity: 1;
            cursor: default;
            background: rgb(218, 255, 218);
            border: 2px solid rgb(95, 158, 95);
        }

        .item.error,
        .item-right.error {
            border-color: #ef4444;
            background: #ffe7e7;
        }

        /* ===== FINAL POPUP (copied from MCQ) ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .final-kid-box {
            background: linear-gradient(135deg, #fff7d6, #e6fff5);
            padding: 30px 35px;
            border-radius: 35px;
            text-align: center;
            width: 450px;
            animation: finalBounce 0.8s ease;
            box-shadow: 0 20px 0 #ffd43b, 0 30px 50px rgba(0, 0, 0, 0.2);
        }

        .final-kid-box h2 {
            font-size: 2.2em;
            font-family: "Livvic";
            color: #2f9e44;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-family: "Livvic";
            font-weight: 600;
        }

        #stars {
            font-size: 2.3em;
            margin: 12px 0;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 400;
            cursor: pointer;
            margin-top: 12px;
            transition: .2s;
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #1c7ed6;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* -------- RESPONSIVE (copied from MCQ) -------- */
        @media (max-width: 900px) {
            body {
                padding: 14px;
                overflow-y: auto;
                align-items: center;
                justify-content: flex-start;
            }

            .main {
                max-width: 900px;
                margin-top: 80px;
            }

            h1 {
                font-size: 26px;
            }

            .subtitle {
                font-size: 0.9rem;
            }

            .game-container {
                gap: 100px;
                width: 95%;
            }

            .column {
                width: 42%;
            }

            .item,
            .item-right {
                height: 70px;
                font-size: 19px;
                padding: 14px 16px;
                width: 100%;
            }

            .item-right img {
                width: 48px;
                height: 48px;
            }

            .item-right .right-text {
                font-size: 17px;
            }

            .kid-card {
                width: 300px;
            }

            .final-kid-box {
                width: 90%;
                max-width: 340px;
                padding: 22px;
            }

            .final-kid-box h2 {
                font-size: 1.8em;
            }

            .final-kid-box p {
                font-size: 1.1em;
            }

            #stars {
                font-size: 1.8em;
            }
        }

        @media (max-width: 768px) {
            .main {
                max-width: 720px;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                font-size: 0.8rem;
            }

            .game-container {
                gap: 30px;
                width: 100%;
            }

            .column {
                width: 47%;
                gap: 14px;
            }

            .item,
            .item-right {
                height: 80px;
                border-radius: 15px;
                font-size: 18px;
                padding: 12px 14px;
                width: 100%;
            }

            .item-right img {
                width: 44px;
                height: 44px;
            }

            .item-right .right-text {
                font-size: 16px;
            }

            #line-canvas {
                display: none;
            }

            .kid-card {
                width: 280px;
                padding: 20px;
            }

            .final-kid-box {
                width: 90%;
                max-width: 320px;
                padding: 22px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 50px 10px 0px;
                overflow-y: auto;
                align-items: flex-start;
            }

            .main {
                margin-top: 60px;
            }

            h1 {
                font-size: 20px;
            }

            .subtitle {
                font-size: 0.75rem;
                margin-bottom: 25px;
            }

            .game-container {
                gap: 20px;
            }

            .column {
                width: 48%;
                gap: 12px;
            }

            .item,
            .item-right {
                height: 65px;
                font-size: 14px;
                padding: 10px 12px;
                border-radius: 12px;
            }

            .item-right img {
                width: 38px;
                height: 38px;
                border-radius: 8px;
            }

            .item-right .right-text {
                font-size: 13px;
                white-space: normal;
            }

            #line-canvas {
                display: none;
            }

            .kid-card {
                width: 260px;
                padding: 15px;
            }

            .kid-icon {
                font-size: 3em;
            }

            .kid-card h3 {
                font-size: 1.5em;
            }

            .final-kid-box {
                width: 90%;
                max-width: 300px;
                padding: 20px;
            }

            .final-kid-box h2 {
                font-size: 1.5em;
            }

            .final-kid-box p {
                font-size: 1em;
            }

            #stars {
                font-size: 1.6em;
            }

            .playAgain-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }

        /* ========================================
   💻 Desktop / Monitor (1025px – 1440px)
======================================== */
        @media screen and (min-width: 1025px) and (max-width: 1440px) {
            .main {
                max-width: 1000px;
            }

            h1 {
                font-size: 30px;
            }

            .subtitle {
                font-size: 15px;
            }

            .game-container {
                gap: 140px;
            }

            .item,
            .item-right {
                width: 400px;
                height: 85px;
                font-size: 24px;
                padding: 8px 16px 8px 25px;
            }

            .item-right img {
                width: 80px;
                height: 65px;
            }

            .item-right .right-text {
                font-size: 22px;
            }
        }

        /* ========================================
   🖥️ Large Monitors (1441px – 1920px)
======================================== */
        @media screen and (min-width: 1441px) and (max-width: 1920px) {
            .main {
                max-width: 1100px;
            }

            h1 {
                font-size: 34px;
            }

            .subtitle {
                font-size: 16px;
            }

            .game-container {
                gap: 180px;
            }

            .item,
            .item-right {
                width: 480px;
                height: 105px;
                font-size: 26px;
                padding: 8px 16px 8px 30px;
            }

            .item-right img {
                width: 85px;
                height: 70px;
            }

            .item-right .right-text {
                font-size: 24px;
            }
        }

        /* ========================================
   📺 Extra Large Screens / 4K (1921px+)
======================================== */
        @media screen and (min-width: 1921px) {
            .main {
                max-width: 1200px;
            }

            h1 {
                font-size: 38px;
            }

            .subtitle {
                font-size: 18px;
            }

            .game-container {
                gap: 250px;
            }

            .item,
            .item-right {
                width: 530px;
                height: 120px;
                font-size: 28px;
                padding: 8px 16px 8px 25px;
            }

            .item-right img {
                width: 85px;
                height: 70px;
            }

            .item-right .right-text {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="main">
        <div class="game-container">

            <svg id="line-canvas"></svg>

            <div class="column left" id="leftColumn"></div>
            <div class="column right" id="rightColumn"></div>

        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">
                Play Again
            </button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        // -------- DATA (with image paths) --------
        const leftData = [
            { id: "1", text: "Sahyadri", match: "e" },
            { id: "2", text: "Anaimalai Hills", match: "d" },
            { id: "3", text: "Nilgiri Hills", match: "b" },
            { id: "4", text: "Aravalli and Vindhya Ranges", match: "c" },
            { id: "5", text: "Peninsular Plateau", match: "a" },
        ];

        // Right side: image + text (labels without a/b/c...)
        const rightData = [
            { match: "a", text: "Southern Plateau", img: "../assets/images/mt1.png" },
            { match: "b", text: "Karnataka", img: "../assets/images/mt2.png" },
            { match: "c", text: "Malwa Plateau", img: "../assets/images/mt3.png" },
            { match: "d", text: "Kerala", img: "../assets/images/mt4.png" },
            { match: "e", text: "Maharashtra", img: "../assets/images/mt5.png" },
        ];

        let selectedLeft = null;
        let matchesFound = 0;
        let score = 0;
        let connections = [];

        const leftCol = document.getElementById("leftColumn");
        const rightCol = document.getElementById("rightColumn");
        const svg = document.getElementById("line-canvas");

        // ===== POPUP ELEMENTS (copied from MCQ) =====
        const popup = document.getElementById('answerPopup');
        const icon = document.getElementById('popupIcon');
        const title = document.getElementById('popupTitle');
        const msg = document.getElementById('popupMsg');
        const finalPopup = document.getElementById('finalPopup');

        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-UK";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } });
        }

        // -------- INIT --------
        function init() {
            leftCol.innerHTML = "";
            rightCol.innerHTML = "";

            // LEFT column (text only)
            leftData.forEach((item) => {
                const div = document.createElement("div");
                div.className = "item";
                div.dataset.match = item.match;
                div.textContent = item.text;

                div.onclick = () => {
                    if (div.classList.contains("matched")) return;
                    document.querySelectorAll(".left .item").forEach((i) => i.classList.remove("active"));
                    div.classList.add("active");
                    selectedLeft = div;
                };

                leftCol.appendChild(div);
            });

            // RIGHT column (image + text) — no letters
            rightData.forEach((item) => {
                const div = document.createElement("div");
                div.className = "item-right";
                div.dataset.id = item.match;

                // image + text wrapper
                const img = document.createElement("img");
                img.src = item.img;
                img.alt = item.text;
                img.loading = "lazy";

                const textSpan = document.createElement("span");
                textSpan.className = "right-text";
                textSpan.textContent = item.text;

                div.appendChild(img);
                div.appendChild(textSpan);

                div.onclick = () => {
                    if (!selectedLeft || div.classList.contains("matched")) return;

                    if (selectedLeft.dataset.match === div.dataset.id) {
                        handleMatch(selectedLeft, div);
                    } else {
                        speak("Wrong");
                        div.classList.add("error");
                        setTimeout(() => div.classList.remove("error"), 400);
                    }
                };

                rightCol.appendChild(div);
            });
        }

        // -------- MATCH LOGIC --------
        function handleMatch(leftEl, rightEl) {
            score++;

            leftEl.classList.add("matched");
            rightEl.classList.add("matched");
            leftEl.classList.remove("active");

            drawCurve(leftEl, rightEl);

            connections.push({ from: leftEl, to: rightEl });

            selectedLeft = null;
            matchesFound++;
            speak("Correct");
            smallConfetti();

            if (matchesFound === leftData.length) {
                setTimeout(showFinal, 700);
            }
        }

        // -------- DRAW CURVE (SVG) --------
function drawCurve(leftEl, rightEl) {

    const container = document.querySelector(".game-container");
    const containerRect = container.getBoundingClientRect();

    // Make SVG match the container
    svg.setAttribute("width", containerRect.width);
    svg.setAttribute("height", containerRect.height);
    svg.setAttribute("viewBox", `0 0 ${containerRect.width} ${containerRect.height}`);

    const leftRect = leftEl.getBoundingClientRect();
    const rightRect = rightEl.getBoundingClientRect();

    // Start point
    const x1 = leftRect.right - containerRect.left;
    const y1 = leftRect.top - containerRect.top + leftRect.height / 2;

    // End point
    const x2 = rightRect.left - containerRect.left;
    const y2 = rightRect.top - containerRect.top + rightRect.height / 2;

    // Curve control points
    const curve = Math.min(150, (x2 - x1) / 2);

    const path = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
    );

    path.setAttribute(
        "d",
        `M ${x1} ${y1}
         C ${x1 + curve} ${y1},
           ${x2 - curve} ${y2},
           ${x2} ${y2}`
    );

    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#22c55e");
    path.setAttribute("stroke-width", "4");

    // Beautiful dotted line
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-dasharray", "8 10");

    svg.appendChild(path);
}
        // -------- FINAL POPUP (copied from MCQ) --------
        function showFinal() {
            document.getElementById('finalScore').textContent =
                `Your Score: ${score} / ${leftData.length}`;
            document.getElementById('stars').textContent = '⭐'.repeat(score);
            finalPopup.style.display = 'flex';
            bigConfetti();

            // also trigger final confetti rain
            let end = Date.now() + (1.5 * 1000);
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // -------- RESIZE redraw --------
       window.addEventListener("resize", () => {

    svg.innerHTML = "";

    requestAnimationFrame(() => {

        connections.forEach(connection => {
            drawCurve(connection.from, connection.to);
        });

    });

});

        init();
    </script>
    <script id="codex-viewport-fit">
        (function() {
            if (window.__codexViewportFit) return;
            window.__codexViewportFit = true;

            const hasIframe = Boolean(document.querySelector("iframe"));
            const selectors = [
                ".main",
                ".main-container",
                ".quiz",
                ".quiz-container",
                ".quiz-box",
                ".container",
                ".stage",
                ".screen",
                ".game",
                ".template",
                ".quiz-card",
                ".app"
            ];
            const minScale = 0.62;
            let rafId = 0;

            function setViewportRules() {
                document.documentElement.style.width = "100%";
                document.documentElement.style.height = "100%";
                document.documentElement.style.overflow = "hidden";
                document.body.style.width = "100%";
                document.body.style.height = "100svh";
                document.body.style.minHeight = "100svh";
                document.body.style.overflow = "hidden";
            }

            function getStage() {
                for (const selector of selectors) {
                    const stage = document.querySelector(selector);
                    if (stage) return stage;
                }
                return null;
            }

            function fitToViewport() {
                setViewportRules();
                if (hasIframe) return;

                const stage = getStage();
                if (!stage) return;

                stage.style.transform = "scale(1)";
                stage.style.transformOrigin = "center center";

                const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                const rect = stage.getBoundingClientRect();
                const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                const scale = Math.max(
                    minScale,
                    Math.min(
                        1,
                        (viewportWidth - breathingRoom * 2) / contentWidth,
                        (viewportHeight - breathingRoom * 2) / contentHeight
                    )
                );

                stage.style.transform = `scale(${scale})`;
            }

            function requestFit() {
                cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(fitToViewport);
            }

            window.addEventListener("load", requestFit);
            window.addEventListener("resize", requestFit);
            window.addEventListener("orientationchange", requestFit);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(requestFit).catch(function() {});
            }

            document.querySelectorAll("img").forEach(function(img) {
                img.addEventListener("load", requestFit, { once: false });
            });

            if ("ResizeObserver" in window) {
                const observer = new ResizeObserver(requestFit);
                const observeStage = function() {
                    const stage = getStage();
                    if (stage) observer.observe(stage);
                };
                observeStage();
                window.addEventListener("load", observeStage);
            }

            if (document.body) {
                new MutationObserver(requestFit).observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }

            requestFit();
        })();
    </script>
</body>

</html>
