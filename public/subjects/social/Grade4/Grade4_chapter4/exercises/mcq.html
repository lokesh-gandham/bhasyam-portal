<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MCQ Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Livvic", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .quiz {
            width: 95%;
            max-width: 1100px;
            border-radius: 40px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quiz-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #question {
            margin-top: 5px;
            font-size: 30px;
            font-weight: 400;
            color: #2f4f4f;
            line-height: 1.3;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: left;
        }

        .question-image {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .question-image img {
            width: 300px;
            height: 250px;
            object-fit: contain;
            padding: 14px;
            transition: .3s ease;
            /* animation: zoomPulse 2s ease-in-out infinite; */
        }

        @keyframes zoomPulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .options {
            width: 80%;
            margin-inline: auto;
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            gap: 18px;
            align-items: stretch;
        }

        .option {
            display: flex;
            align-items: center;
            flex-direction: row;
            justify-content: flex-start;
            gap: 16px;
            padding: 12px 22px;
            border-radius: 24px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            overflow: hidden;

            color: #2f4f4f;

            background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
            border: 3px solid #d8e9ff;

            transition: all .25s ease;
        }

        .option:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 7px 0 #8fc3ff, 0 18px 32px rgba(82, 136, 255, .28), inset 0 2px 0 rgba(255, 255, 255, 1);
            border-color: #7bbcff;
        }

        .option.o1,
        .option.o2,
        .option.o3 {
            background: linear-gradient(135deg, #ffffff, #ffffff);
            border-color: #9EDCFF;
            box-shadow: 0 5px 0 #9EDCFF;
        }

        .option::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, .7),
                    transparent);
            transition: .5s;
        }

        .option:hover::before {
            left: 100%;
        }

        .option-img {
            width: 85px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .option.correct {
            background: linear-gradient(135deg, #f0fff5, #F2FFF7);
            border: 3px solid #36C96B;
            box-shadow: 0 6px 0 #36C96B;
            transform: translateY(-4px);
        }

        .option.wrong {
            background: linear-gradient(135deg, #FFE2E2, #FFF5F5);
            border: 3px solid #FF8F8F;
            box-shadow: 0 6px 0 #FF8F8F, 0 14px 24px rgba(255, 110, 110, .25);
            animation: softBlink .6s ease;
        }

        @keyframes softBlink {

            0%,
            100% {
                background: #ffe7e7;
                border-color: #ff9d9d;
                box-shadow: 0 8px 20px rgba(255, 120, 120, .25);
            }
        }

        .option.disabled {
            opacity: .55;
            pointer-events: none;
            filter: grayscale(.15);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 150px;
            /* margin-top: 20px; */
        }

        .controls button {
            width: 150px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            border-radius: 18px;
            border: none;
            font-size: 20px;
            font-weight: 500;
            color: #fff;
            cursor: pointer;
            transition: .25s;
        }

        .prev {
            background: linear-gradient(135deg, #67b8ff, #74b2ff);
        }

        .next {
            background: linear-gradient(135deg, #ffd86f, #ffb300);
        }

        .controls button:hover {
            transform: translateY(-3px);
            filter: brightness(1.05);
        }

        .controls button:active {
            transform: scale(.96);
        }

        .controls button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* ============================================
           POPUP STYLE — EXACTLY COPIED FROM MCQ QUIZ
        ============================================ */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .kid-card {
            background: #ffffff;
            width: 320px;
            padding: 25px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 0 #ffd966, 0 25px 40px rgba(0, 0, 0, 0.2);
            animation: kidPop 0.6s ease;
        }

        .kid-icon {
            font-size: 4.5em;
            margin-bottom: 10px;
            animation: emojiBounce 0.9s infinite alternate;
        }

        .kid-card h3 {
            font-size: 2em;
            font-family: "Livvic";
            margin-bottom: 8px;
        }

        .kid-card p {
            font-size: 1.2em;
            font-family: "Livvic";
        }

        .kid-correct .kid-card {
            background: #e6fffa;
            border: 6px solid #38d9a9;
        }

        .kid-correct h3 {
            color: #2f9e44;
            font-weight: 600;
        }

        .kid-correct p {
            color: #1c7c54;
        }

        .kid-wrong .kid-card {
            background: #fff5f5;
            border: 6px solid #ffa8a8;
        }

        .kid-wrong h3 {
            color: #e03131;
            font-weight: 600;
        }

        .kid-wrong p {
            color: #c92a2a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-10deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.1) rotate(5deg);
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }

        /* ===== FINAL POPUP (also copied) ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .final-kid-box {
            background: linear-gradient(135deg, #fff7d6, #e6fff5);
            padding: 30px 35px;
            border-radius: 35px;
            text-align: center;
            width: 450px;
            animation: finalBounce 0.8s ease;
            box-shadow: 0 20px 0 #ffd43b, 0 30px 50px rgba(0, 0, 0, 0.2);
        }

        .final-kid-box h2 {
            font-size: 2.2em;
            font-family: "Livvic";
            color: #2f9e44;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-family: "Livvic";
            font-weight: 600;
        }

        #stars {
            font-size: 2.3em;
            margin: 12px 0;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 400;
            cursor: pointer;
            margin-top: 12px;
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #1c7ed6;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* -------- MEDIA QUERIES (copied from MCQ) -------- */
        @media (max-width:900px) {
            body {
                align-items: center;
                padding: 20px;
                overflow: auto;
            }

            .quiz {
                width: 100%;
                padding: 25px;
            }

            .quiz-layout {
                grid-template-columns: 1fr;
            }

            #question {
                font-size: 30px;
            }

            .question-image img {
                width: 240px;
                height: 210px;
            }

            .options {
                grid-template-rows: 1fr;
                gap: 16px;
            }

            .option {
                font-size: 18px;
                padding: 12px;
            }

            .option-img {
                width: 90px;
                height: 70px;
            }

            .controls {
                margin-top: 25px;
            }

            .controls button {
                width: 130px;
                height: 50px;
                font-size: 18px;
            }

            .kid-card {
                width: 300px;
            }

            .final-kid-box {
                width: 90%;
                max-width: 340px;
                padding: 22px;
            }

            .final-kid-box h2 {
                font-size: 1.8em;
            }

            .final-kid-box p {
                font-size: 1.1em;
            }

            #stars {
                font-size: 1.8em;
            }
        }

        @media (max-width:768px) {
            body {
                padding: 30px 0px 10px;
                align-items: flex-start;
                overflow: auto;
            }

            .quiz {
                padding: 20px;
            }

            .quiz-layout {
                grid-template-columns: 1fr;
            }

            .question-image img {
                width: 200px;
                height: 170px;
            }

            .options {
                width: 80%;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .options .option:nth-child(3) {
                grid-column: 1 / span 2;
                justify-self: center;
            }

            .option {
                font-size: 16px;
                padding: 10px;
                justify-content: center;
            }

            .option-img {
                width: 75px;
                height: 60px;
            }

            .controls button {
                width: 120px;
                height: 45px;
                font-size: 16px;
            }

            .kid-card {
                width: 280px;
                padding: 20px;
            }

            .final-kid-box {
                width: 90%;
                max-width: 320px;
                padding: 22px;
            }
        }

        @media (max-width:480px) {
            body {
                padding: 40px 0px 10px;
            }

            .quiz {
                padding: 0px 10px;
            }

            #question {
                font-size: 22px;
            }

            .question-image img {
                width: 160px;
                height: 130px;
            }

            .quiz-layout {
                grid-template-columns: 1fr;
            }

            .options {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .options .option:nth-child(3) {
                grid-column: 1 / span 2;
                justify-self: center;
            }

            .option {
                font-size: 15px;
                padding: 12px;
            }

            .option-img {
                width: 65px;
                height: 50px;
            }

            .controls {
                gap: 0;
                width: 100%;
                margin-inline: auto;
                justify-content: space-between;
                margin-top: 0px;
            }

            .controls button {
                font-size: 15px;
                width: 110px;
                height: 42px;
            }

            .kid-card {
                width: 260px;
                padding: 15px;
            }

            .kid-icon {
                font-size: 3em;
            }

            .kid-card h3 {
                font-size: 1.5em;
            }

            .final-kid-box {
                width: 90%;
                max-width: 300px;
                padding: 20px;
            }

            .final-kid-box h2 {
                font-size: 1.5em;
            }

            .final-kid-box p {
                font-size: 1em;
            }

            #stars {
                font-size: 1.6em;
            }

            .playAgain-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }

        @media screen and (min-width:1024px) and (max-width:1440px) {
            .quiz {
                max-width: 1200px;
            }

            #question {
                font-size: 30px;
            }

            .question-image img {
                width: 340px;
                height: 300px;
            }

            .option {
                font-size: 22px;
                padding: 12px 24px;
            }

            .option-img {
                width: 100px;
                height: 70px;
            }

            .controls {
                gap: 180px;
            }

            .controls button {
                width: 150px;
                height: 55px;
                font-size: 20px;
            }
        }

        @media screen and (min-width:1441px) and (max-width:1920px) {
            .quiz {
                max-width: 1450px;
            }

            #question {
                font-size: 40px;
                min-height: 140px;
            }

            .question-image img {
                width: 380px;
                height: 330px;
            }

            .option {
                font-size: 24px;
                padding: 20px 26px;
            }

            .option-img {
                width: 110px;
                height: 100px;
            }

            .controls {
                gap: 200px;
            }

            .controls button {
                width: 160px;
                height: 60px;
                font-size: 22px;
            }
        }

        @media screen and (min-width:1921px) {
            .quiz {
                max-width: 1500px;
            }

            #question {
                font-size: 40px;
            }

            .question-image img {
                width: 420px;
                height: 360px;
            }

            .option {
                font-size: 26px;
                padding: 22px 28px;
            }

            .option-img {
                width: 120px;
                height: 110px;
            }

            .controls {
                gap: 240px;
            }

            .controls button {
                font-size: 24px;
                width: 170px;
                height: 65px;
            }
        }
    </style>
</head>

<body>

    <div class="quiz">

        <div class="quiz-layout">

            <div class="header">
                <h2 id="question"></h2>
                <div class="question-image">
                    <img id="questionImg">
                </div>
            </div>

            <div class="options" id="options"></div>

        </div>

        <div class="controls">
            <button class="prev" id="prevBtn"><i class="fa-solid fa-angles-left"></i> Prev</button>
            <button class="next" id="nextBtn">Next <i class="fa-solid fa-angles-right"></i></button>
        </div>

    </div>

    <!-- ===== POPUP ELEMENTS (EXACT COPY FROM MCQ) ===== -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">
                Play Again
            </button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        const quizData = [{
            q: "Q1. The Deccan Plateau is surrounded by hill ranges on ______ sides.",
            img: "../assets/images/mcq1.png",
            options: [
                "../assets/images/two.png|Two",
                "../assets/images/three.png|Three",
                "../assets/images/one.png|One",
            ],
            a: 1,
        }, {
            q: "Q2. The hottest months in the Thar Desert are ______ and ______.",
            img: "../assets/images/mcq2.png",
            options: [
                "../assets/images/june-july.png|June and July",
                "../assets/images/dec-jan.png|December and January",
                "../assets/images/march-april.png|March and April",
            ],
            a: 0,
        }, {
            q: "Q3. The capital of Rajasthan is ______.",
            img: "../assets/images/mcq3.png",
            options: [
                "../assets/images/jaisalmer.png|Jaisalmer",
                "../assets/images/jodhpur.png|Jodhpur",
                "../assets/images/jaipur.png|Jaipur",
            ],
            a: 2,
        }, {
            q: "Q4. The land in the Thar Desert is covered with ______ and ______.",
            img: "../assets/images/mcq4.png",
            options: [
                "../assets/images/rocks-sand.png|Rocks and Sand",
                "../assets/images/sand-water.png|Sand and Water",
                "../assets/images/sand-stones.png|Sand and Stones",
            ],
            a: 0,
        }, {
            q: "Q5. Many villages and small towns in the Thar Desert are usually located near an ______.",
            img: "../assets/images/mcq5.png",
            options: [
                "../assets/images/oasis.png|Oasis",
                "../assets/images/pond.png|Ponds",
                "../assets/images/river.png|Rivers",
            ],
            a: 0,
        },];

        let current = 0;
        let score = 0;
        let answered = Array(quizData.length).fill(null);

        const qEl = document.getElementById("question");
        const imgEl = document.getElementById("questionImg");
        const optEl = document.getElementById("options");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        // ===== POPUP ELEMENTS (copied from MCQ) =====
        const popup = document.getElementById('answerPopup');
        const icon = document.getElementById('popupIcon');
        const title = document.getElementById('popupTitle');
        const msg = document.getElementById('popupMsg');
        const finalPopup = document.getElementById('finalPopup');

        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-UK";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } });
        }

        // ===== SHOW POPUP (copied from MCQ) =====
        function showPopup(isCorrect) {
            popup.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
            popup.style.display = 'flex';

            if (isCorrect) {
                icon.textContent = '🎉😊';
                title.textContent = 'Great Job!';
                msg.textContent = 'You got it right!';
            } else {
                icon.textContent = '🥲💭';
                title.textContent = 'Oops!';
                msg.textContent = 'Try again, you can do it!';
            }

            setTimeout(() => {
                popup.style.display = 'none';
            }, 1400);
        }

        function showFinal() {
            document.getElementById('finalScore').textContent =
                `Your Score: ${score} / ${quizData.length}`;
            document.getElementById('stars').textContent = '⭐'.repeat(score);
            finalPopup.style.display = 'flex';
            bigConfetti();
        }

        function loadQuestion() {
            const q = quizData[current];
            qEl.textContent = q.q;
            imgEl.src = q.img;
            optEl.innerHTML = "";
            nextBtn.disabled = answered[current] === null;

            q.options.forEach((t, i) => {
                const d = document.createElement("div");
                d.className = "option o" + ((i % 3) + 1);

                const img = t.split("|")[0];
                const text = t.split("|")[1];

                d.innerHTML = `<div class="option-img"><img src="${img}"></div>${text}`;

                if (answered[current] !== null) {
                    if (i === q.a) d.classList.add("correct");
                    else d.classList.add("disabled");
                }

                d.onclick = () => {
                    if (answered[current] !== null) return;

                    if (i === q.a) {
                        answered[current] = i;
                        score++;

                        d.classList.add("correct");
                        [...optEl.children].forEach((o) => {
                            if (o !== d) o.classList.add("disabled");
                        });

                        speak("Correct");
                        smallConfetti();
                        showPopup(true);
                        nextBtn.disabled = false;

                        if (answered.every((a) => a !== null)) setTimeout(showFinal, 1600);
                    } else {
                        speak("Wrong");
                        showPopup(false);
                        d.classList.add("wrong");
                        setTimeout(() => {
                            d.classList.remove("wrong");
                        }, 700);
                    }
                };

                optEl.appendChild(d);
            });

            prevBtn.disabled = current === 0;
        }

        prevBtn.onclick = () => {
            current--;
            loadQuestion();
        };

        nextBtn.onclick = () => {
            current++;
            loadQuestion();
        };

        // ===== RESET (for Play Again) =====
        document.querySelector('.playAgain-btn').addEventListener('click', () => {
            location.reload();
        });

        loadQuestion();
    </script>
</body>

</html>
