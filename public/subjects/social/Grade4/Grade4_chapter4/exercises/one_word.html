<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Plant Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .quiz-container {
            width: 900px;
            padding: 0px 25px 20px;
            border-radius: 30px;
            text-align: center;
        }

        .question-section {
            margin: 0px 0px;
        }

        .question-title {
            font-size: 30px;
            color: #2f4f4f;
            font-weight: 400;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            text-align: start;
        }

        #questionImage {
            width: 280px;
            height: 120px;
            object-fit: contain;
            margin-block: 20px
        }

        .answer-slots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 0;
        }

        /* ===== REFRESHED ANSWER SLOT - LIGHT PASTEL ===== */
        .answer-slot {
            width: 50px;
            height: 50px;
            background: #f5f0ff;
            border: 3px solid #d4c4f0;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 600;
            color: #4a3a6a;
            transition: all 0.25s ease;
        }

        .answer-slot.correct {
            background: #e8f5e9;
            border: 3px solid #66bb6a;
            color: #2e7d32;
        }

        .answer-gap {
            width: 15px;
        }

        .letter-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }

        /* ===== REFRESHED LETTER TILE - LIGHT PASTEL ===== */
        .letter-tile {
            width: 50px;
            height: 50px;
            border-radius: 20%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.25s ease;
            background: linear-gradient(145deg, #a8d8ea, #7ec8e3);
            border: 2px solid #6ab8d4;
        }

        .letter-tile:hover:not(.used) {
            transform: scale(1.08) translateY(-2px);
            background: linear-gradient(145deg, #b8e2f0, #8ad0e8);
        }

        .letter-tile:active:not(.used) {
            transform: scale(0.95);
        }

        .letter-tile.used {
            opacity: 0.3;
            pointer-events: none;
            transform: scale(0.92);
        }

        /* ===== REFRESHED SUBMIT BUTTON - NEW COLOR, NO SHADOW ===== */
        #submitButton {
            margin-top: 15px;
            border-radius: 30px;
            background: linear-gradient(145deg, #81c784, #4caf50);
            border: none;
            padding: 13px 40px;
            border-radius: 25px;
            color: white;
            font-size: 18px;
            font-weight: 400;
            cursor: pointer;
            border: 3px solid #fff;
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
        }

        #submitButton:hover:not(:disabled) {
            transform: translateY(-2px);
            background: linear-gradient(145deg, #8fd492, #55b859);
        }

        #submitButton:active:not(:disabled) {
            transform: translateY(2px);
        }

        #submitButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== NAV BUTTONS – SAME STYLE AS REFERENCE ===== */
        .quiz-navigation {
            width: 100%;
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 150px;
        }

        .quiz-navigation button {
            width: 150px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            border-radius: 18px;
            border: none;
            font-size: 20px;
            font-weight: 500;
            color: #fff;
            cursor: pointer;
            transition: .25s;
        }

        #previousButton {
            background: linear-gradient(135deg, #67b8ff, #74b2ff);
        }

        #nextButton {
            background: linear-gradient(135deg, #ffd86f, #ffb300);
        }

        .quiz-navigation button:hover {
            transform: translateY(-3px);
            filter: brightness(1.05);
        }

        .quiz-navigation button:active {
            transform: scale(.96);
        }

        .quiz-navigation button:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ============================================
           POPUP STYLE — EXACTLY COPIED FROM MCQ QUIZ
        ============================================ */
        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .kid-card {
            background: #ffffff;
            width: 320px;
            padding: 25px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 0 #ffd966, 0 25px 40px rgba(0, 0, 0, 0.2);
            animation: kidPop 0.6s ease;
        }

        .kid-icon {
            font-size: 4.5em;
            margin-bottom: 10px;
            animation: emojiBounce 0.9s infinite alternate;
        }

        .kid-card h3 {
            font-size: 2em;
            font-family: "Livvic";
            margin-bottom: 8px;
        }

        .kid-card p {
            font-size: 1.2em;
            font-family: "Livvic";
        }

        .kid-correct .kid-card {
            background: #e6fffa;
            border: 6px solid #38d9a9;
        }

        .kid-correct h3 {
            color: #2f9e44;
            font-weight: 600;
        }

        .kid-correct p {
            color: #1c7c54;
        }

        .kid-wrong .kid-card {
            background: #fff5f5;
            border: 6px solid #ffa8a8;
        }

        .kid-wrong h3 {
            color: #e03131;
            font-weight: 600;
        }

        .kid-wrong p {
            color: #c92a2a;
        }

        @keyframes kidPop {
            0% {
                transform: scale(0.3) rotate(-10deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.1) rotate(5deg);
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }

        /* ===== FINAL POPUP (also copied) ===== */
        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .final-kid-box {
            background: linear-gradient(135deg, #fff7d6, #e6fff5);
            padding: 30px 35px;
            border-radius: 35px;
            text-align: center;
            width: 450px;
            animation: finalBounce 0.8s ease;
            box-shadow: 0 20px 0 #ffd43b, 0 30px 50px rgba(0, 0, 0, 0.2);
        }

        .final-kid-box h2 {
            font-size: 2.2em;
            font-family: "Livvic";
            color: #2f9e44;
            margin-bottom: 10px;
             font-weight: 600;
        }

        .final-kid-box p {
            font-size: 1.3em;
            font-family: "Livvic";
            font-weight: 600;
        }

        #stars {
            font-size: 2.3em;
            margin: 12px 0;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 400;
            cursor: pointer;
            margin-top: 12px;
        }

        .playAgain-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #1c7ed6;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* -------- MEDIA QUERIES (copied from MCQ) -------- */
        @media (max-width:900px) {
            body {
                align-items: center;
                padding: 20px;
                overflow: auto;
            }
            .quiz-container {
                width: 100%;
                max-width: 900px;
                padding: 25px;
            }
            #questionImage {
                width: 200px;
                height: 150px;
            }
            .answer-slots {
                gap: 10px;
            }
            .answer-slot {
                width: 55px;
                height: 55px;
                font-size: 24px;
            }
            .letter-tile {
                width: 70px;
                height: 50px;
                font-size: 20px;
            }
            .quiz-navigation {
                gap: 80px;
            }
            .quiz-navigation button {
                width: 130px;
                height: 50px;
                font-size: 18px;
            }
            .kid-card {
                width: 300px;
            }
            .final-kid-box {
                width: 90%;
                max-width: 340px;
                padding: 22px;
            }
            .final-kid-box h2 {
                font-size: 1.8em;
            }
            .final-kid-box p {
                font-size: 1.1em;
            }
            #stars {
                font-size: 1.8em;
            }
        }

        @media (max-width:768px) {
            .quiz-container {
                padding: 20px;
            }
            #questionImage {
                width: 180px;
                height: 140px;
            }
            .answer-slots {
                gap: 8px;
            }
            .answer-slot {
                width: 50px;
                height: 50px;
                font-size: 22px;
            }
            .letter-container {
                gap: 10px;
            }
            .letter-tile {
                width: 65px;
                height: 48px;
                font-size: 18px;
            }
            .quiz-navigation {
                gap: 40px;
            }
            .quiz-navigation button {
                width: 120px;
                height: 45px;
                font-size: 16px;
            }
            .kid-card {
                width: 280px;
                padding: 20px;
            }
            .final-kid-box {
                width: 90%;
                max-width: 320px;
                padding: 22px;
            }
        }

        @media (max-width:480px) {
            body {
                padding: 25px 0 10px;
                align-items: flex-start;
                margin-top: 20px;
            }
            .quiz-container {
                padding: 20px 5px;
            }
            .question-title {
                font-size: 22px;
                margin-bottom: 10px;
            }
            #questionImage {
                width: 150px;
                height: 100px;
            }
            .answer-gap {
                width: 10px;
            }
            .answer-slots {
                flex-wrap: wrap;
                gap: 5px;
            }
            .answer-slot {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .letter-container {
                gap: 5px;
            }
            .letter-tile {
                width: 50px;
                height: 35px;
                font-size: 17px;
            }
            #submitButton {
                padding: 8px 25px;
                font-size: 16px;
            }
            .quiz-navigation {
                gap: 20px;
                justify-content: space-between;
                margin-top: 10px;
            }
            .quiz-navigation button {
                width: 110px;
                height: 42px;
                font-size: 15px;
                padding: 0 8px;
            }
            .kid-card {
                width: 260px;
                padding: 15px;
            }
            .kid-icon {
                font-size: 3em;
            }
            .kid-card h3 {
                font-size: 1.5em;
            }
            .final-kid-box {
                width: 90%;
                max-width: 300px;
                padding: 20px;
            }
            .final-kid-box h2 {
                font-size: 1.5em;
            }
            .final-kid-box p {
                font-size: 1em;
            }
            #stars {
                font-size: 1.6em;
            }
            .playAgain-btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }

        @media screen and (min-width:1025px) and (max-width:1440px) {
            .quiz-navigation {
                gap: 180px;
            }
            .quiz-navigation button {
                width: 150px;
                height: 55px;
                font-size: 20px;
            }
        }

        @media screen and (min-width:1441px) and (max-width:1540px) {
            .quiz-container {
                width: 1450px;
            }
            .question-title {
                font-size: 40px;
            }
            #questionImage {
                width: 260px;
                height: 200px;
            }
            .answer-slot {
                width: 55px;
                height: 55px;
                font-size: 28px;
            }
            .letter-tile {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            #submitButton {
                font-size: 20px;
                padding: 14px 42px;
            }
            .quiz-navigation {
                gap: 180px;
            }
            .quiz-navigation button {
                width: 150px;
                height: 55px;
                font-size: 20px;
            }
        }

        @media screen and (min-width:1541px) and (max-width:1920px) {
            .quiz-container {
                width: 1450px;
            }
            .question-title {
                font-size: 40px;
            }
            #questionImage {
                width: 300px;
                height: 200px;
            }
            .answer-slot {
                width: 70px;
                height: 70px;
                font-size: 30px;
            }
            .letter-tile {
                width: 90px;
                height: 65px;
                font-size: 26px;
            }
            #submitButton {
                font-size: 22px;
                padding: 16px 46px;
            }
            .quiz-navigation {
                gap: 200px;
            }
            .quiz-navigation button {
                width: 160px;
                height: 60px;
                font-size: 22px;
            }
        }

        @media screen and (min-width:1921px) {
            .quiz-container {
                width: 1500px;
            }
            .question-title {
                font-size: 40px;
            }
            #questionImage {
                width: 340px;
                height: 230px;
            }
            .answer-slot {
                width: 75px;
                height: 75px;
                font-size: 32px;
            }
            .letter-tile {
                width: 100px;
                height: 70px;
                font-size: 28px;
            }
            #submitButton {
                font-size: 24px;
                padding: 18px 50px;
            }
            .quiz-navigation {
                gap: 240px;
            }
            .quiz-navigation button {
                width: 170px;
                height: 65px;
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="quiz-container">

        <div class="question-section">
            <div id="questionTitle" class="question-title"></div>
            <img id="questionImage" />
        </div>

        <div id="answerSlots" class="answer-slots"></div>

        <div id="letterContainer" class="letter-container"></div>

        <button id="submitButton">Submit</button>

        <div class="quiz-navigation">
            <button id="previousButton"><i class="fa-solid fa-angles-left"></i> Prev</button>
            <button id="nextButton">Next <i class="fa-solid fa-angles-right"></i></button>
        </div>

    </div>

    <!-- ===== POPUP ELEMENTS (EXACT COPY FROM MCQ) ===== -->
    <div id="answerPopup" class="kid-popup">
        <div class="kid-card">
            <div class="kid-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <div id="finalPopup">
        <div class="final-kid-box">
            <h2>🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div>
            <button class="playAgain-btn" onclick="location.reload()">
                Play Again
            </button>
        </div>
    </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>
    <audio id="wrongSound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        const quizData = [
            {
                q: "Q1. It is the capital of Andhra Pradesh.",
                a: "AMARAVATI",
                img: "../assets/images/ow1.png",
            },

            {
                q: "Q2. This state was formed in 2014.",
                a: "TELANGANA",
                img: "../assets/images/ow2.png",
            },

            {
                q: "Q3. This state is very rich in minerals.",
                a: "CHHATTISGARH",
                img: "../assets/images/ow3.png",
            },

            {
                q: "Q4. This city is an important business and trade centre.",
                a: "MUMBAI",
                img: "../assets/images/ow4.png",
            },

            {
                q: "Q5. This city is also known as 'Garden City'.",
                a: "BENGALURU",
                img: "../assets/images/ow5.png",
            },
        ];

        let currentQuestionIndex = 0;
        let quizScore = 0;

        const answeredQuestions = Array(quizData.length).fill(false);
        const storedAnswers = Array(quizData.length).fill("");

        const questionTitle = document.getElementById("questionTitle");
        const questionImage = document.getElementById("questionImage");

        const nextButton = document.getElementById("nextButton");
        const previousButton = document.getElementById("previousButton");
        const submitButton = document.getElementById("submitButton");

        const answerSlotsContainer = document.getElementById("answerSlots");
        const letterContainer = document.getElementById("letterContainer");

        // ===== POPUP ELEMENTS (copied from MCQ) =====
        const popup = document.getElementById('answerPopup');
        const icon = document.getElementById('popupIcon');
        const title = document.getElementById('popupTitle');
        const msg = document.getElementById('popupMsg');
        const finalPopup = document.getElementById('finalPopup');

        let correctAnswer = "";
        let letterTiles = [];

        function speak(t) {
            speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(t);
            msg.lang = "en-UK";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;
            speechSynthesis.speak(msg);
        }

        function smallConfetti() {
            confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
        }

        function bigConfetti() {
            confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } });
        }

        // ===== SHOW POPUP (copied from MCQ) =====
        function showPopup(isCorrect) {
            popup.className = 'kid-popup ' + (isCorrect ? 'kid-correct' : 'kid-wrong');
            popup.style.display = 'flex';

            if (isCorrect) {
                icon.textContent = '🎉😊';
                title.textContent = 'Great Job!';
                msg.textContent = 'You got it right!';
            } else {
                icon.textContent = '🥲💭';
                title.textContent = 'Oops!';
                msg.textContent = 'Try again, you can do it!';
            }

            setTimeout(() => {
                popup.style.display = 'none';
            }, 1400);
        }

        function showFinal() {
            document.getElementById('finalScore').textContent =
                `Your Score: ${quizScore} / ${quizData.length}`;
            document.getElementById('stars').textContent = '⭐'.repeat(quizScore);
            finalPopup.style.display = 'flex';
            bigConfetti();
        }

        function shuffleLetters(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function createAnswerSlots(word) {
            answerSlotsContainer.innerHTML = "";

            for (let i = 0; i < word.length; i++) {
                if (word[i] === " ") {
                    const gap = document.createElement("div");
                    gap.className = "answer-gap";
                    answerSlotsContainer.appendChild(gap);
                } else {
                    const slot = document.createElement("div");
                    slot.className = "answer-slot";
                    slot.dataset.index = i;
                    slot.onclick = () => removeLetterFromSlot(slot);
                    answerSlotsContainer.appendChild(slot);
                }
            }
        }

        function removeLetterFromSlot(slot) {
            if (slot.classList.contains("locked")) return;
            const letter = slot.textContent;
            if (!letter) return;
            slot.textContent = "";
            const tile = letterTiles.find(
                (t) => t.textContent === letter && t.classList.contains("used"),
            );

            if (tile) {
                tile.classList.remove("used");
                tile.onclick = () => insertLetterIntoSlot(tile, letter);
            }

            submitButton.disabled = true;
        }

        function generateLetterTiles(answer) {
            letterContainer.innerHTML = "";
            letterTiles = [];

            let letters = answer.replace(/\s/g, "").split("");
            shuffleLetters(letters);

            letters.forEach((letter) => {
                const tile = document.createElement("div");

                tile.className = "letter-tile";
                tile.textContent = letter;

                tile.onclick = () => insertLetterIntoSlot(tile, letter);

                letterContainer.appendChild(tile);
                letterTiles.push(tile);
            });
        }

        function insertLetterIntoSlot(tile, letter) {
            const slots = document.querySelectorAll(".answer-slot");

            const empty = [...slots].find((s) => !s.textContent);

            if (!empty) return;

            empty.textContent = letter;

            tile.classList.add("used");
            tile.onclick = null;

            validateSlotCompletion();
        }

        function validateSlotCompletion() {
            const slots = document.querySelectorAll(".answer-slot");

            let word = [...slots].map((s) => s.textContent).join("");

            if (word.length === correctAnswer.replace(/\s/g, "").length) {
                submitButton.disabled = false;
            }
        }

        function removeLastFilledSlot() {
            if (answeredQuestions[currentQuestionIndex]) {
                return;
            }
            const slots = document.querySelectorAll(".answer-slot");

            const filled = [...slots].filter((s) => s.textContent);

            if (filled.length === 0) return;

            const last = filled[filled.length - 1];

            const letter = last.textContent;

            last.textContent = "";

            const tile = letterTiles.find(
                (t) => t.textContent === letter && t.classList.contains("used"),
            );

            if (tile) {
                tile.classList.remove("used");
                tile.onclick = () => insertLetterIntoSlot(tile, letter);
            }

            submitButton.disabled = true;
        }

        function renderQuestion() {
            const question = quizData[currentQuestionIndex];

            questionTitle.textContent = question.q;
            questionImage.src = question.img;

            correctAnswer = question.a.toUpperCase();

            createAnswerSlots(correctAnswer);

            if (answeredQuestions[currentQuestionIndex]) {
                const slots = document.querySelectorAll(".answer-slot");
                const saved = storedAnswers[currentQuestionIndex].split("");

                saved.forEach((letter, i) => {
                    slots[i].textContent = letter;
                    slots[i].classList.add("locked");
                    slots[i].classList.add("correct");
                    slots[i].onclick = null;
                });
                generateLetterTiles(correctAnswer);

                letterTiles.forEach((tile) => {
                    tile.classList.add("used");
                    tile.onclick = null;
                });

                submitButton.disabled = true;
                nextButton.disabled = false;
            } else {
                generateLetterTiles(correctAnswer);
                submitButton.disabled = true;
                nextButton.disabled = true;
            }

            previousButton.disabled = currentQuestionIndex === 0;
        }

        submitButton.onclick = () => {
            const slots = document.querySelectorAll(".answer-slot");

            let guess = [...slots].map((s) => s.textContent).join("");

            if (guess === correctAnswer.replace(/\s/g, "")) {
                quizScore++;

                showPopup(true);
                smallConfetti();
                speak("Correct");

                answeredQuestions[currentQuestionIndex] = true;
                storedAnswers[currentQuestionIndex] = guess;

                slots.forEach((s) => {
                    s.classList.add("locked");
                    s.classList.add("correct");
                    s.onclick = null;
                });

                submitButton.disabled = true;
                nextButton.disabled = false;

                if (currentQuestionIndex === quizData.length - 1) {
                    setTimeout(showFinal, 1600);
                }
            } else {
                showPopup(false);
                speak("Wrong");

                setTimeout(() => {
                    slots.forEach((s) => (s.textContent = ""));
                    letterTiles.forEach((tile) => {
                        tile.classList.remove("used");
                        tile.onclick = () => insertLetterIntoSlot(tile, tile.textContent);
                    });
                    submitButton.disabled = true;
                }, 800);
            }
        };

        nextButton.onclick = () => {
            currentQuestionIndex++;
            renderQuestion();
        };

        previousButton.onclick = () => {
            currentQuestionIndex--;
            renderQuestion();
        };

        document.addEventListener("keydown", (e) => {
            if (answeredQuestions[currentQuestionIndex]) {
                return;
            }

            if (e.key === "Backspace" || e.key === "Delete") {
                removeLastFilledSlot();
            }
        });

        // ===== RESET (for Play Again) =====
        document.querySelector('.playAgain-btn').addEventListener('click', () => {
            location.reload();
        });

        renderQuestion();
    </script>
</body>

</html>
