<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wise Wings</title>
  <link rel="icon" type="image/svg+xml" href="/iconsa1.png">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Livvic", sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: url("./assets/images/bg.jpg");
      background-size: 100% 100%;
    }

    .app {
      background: #ffffffab;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* topbar – glass container */
    .topbar {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80px;
      margin: 0 20px;
    }

    .nav-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      max-width: 1150px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 80px;
      border: 1px solid rgba(255, 255, 255, 0.25);

      box-shadow:
        0 4px 10px rgba(255, 255, 255, 0.25) inset,
        0 -2px 6px rgba(255, 255, 255, 0.12) inset,
        0 10px 20px rgba(0, 0, 0, 0.08),
        0 20px 40px rgba(0, 0, 0, 0.12);
    }

    /* each button – minimal, transparent */
    .island-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 60px;
      white-space: nowrap;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: rgba(30, 41, 59, 0.6);
      background: transparent;
      border: 1px solid transparent;
      letter-spacing: 0.3px;
    }

    .island-btn i {
      font-size: 1.1em;
      transition: 0.3s;
    }

    .island-btn:hover {
      color: #1e293b;
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    /* active – subtle glow + raised */
    .island-btn.active {
      color: #0f172a;
      background: rgba(255, 255, 255, 0.7);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(255, 255, 255, 0.5);
      transform: translateY(-2px) scale(1.02);
      font-weight: 500;
    }

    /* per‑button active tint (very soft) */
    .island-btn:nth-child(1).active {
      background: rgba(254, 249, 195, 0.85);
      border-color: #facc15;
    }

    .island-btn:nth-child(2).active {
      background: rgba(187, 247, 208, 0.85);
      border-color: #4ade80;
    }

    .island-btn:nth-child(3).active {
      background: rgba(191, 219, 254, 0.85);
      border-color: #60a5fa;
    }

    .island-btn:nth-child(4).active {
      background: rgba(254, 202, 202, 0.85);
      border-color: #f87171;
    }

    .island-btn:nth-child(5).active {
      background: rgba(233, 213, 255, 0.85);
      border-color: #a78bfa;
    }

    .island-btn.active i {
      transform: scale(1.1);
    }

    .main {
      flex: 1;
      padding: 10px 5px 0px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* mobile menu */
    .menu-btn {
      display: none;
    }

    .offcanvas {
      display: none;
    }

    @media(max-width:1065px) {
      .topbar {
        display: none;
      }

      .menu-btn {
        display: block;
        position: fixed;
        top: 15px;
        right: 15px;
        font-size: 24px;
        background: rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(8px);
        color: #1e293b;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 12px;
        padding: 8px 14px;
        cursor: pointer;
        z-index: 5000;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      }

      .offcanvas {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.2);
        display: none;
        z-index: 4000;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }

      .offcanvas.show {
        display: block;
      }

      .offcanvas-panel {
        position: absolute;
        right: 0;
        top: 0;
        width: 290px;
        height: 100%;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 60px 20px 30px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        transform: translateX(100%);
        transition: .4s cubic-bezier(0.34, 1.56, 0.64, 1);
        overflow-y: auto;
        border-left: 1px solid rgba(255, 255, 255, 0.3);
      }

      .offcanvas.show .offcanvas-panel {
        transform: translateX(0);
      }

      .offcanvas-panel .island-btn {
        flex: none;
        font-size: 16px;
        padding: 16px 20px;
        border-radius: 60px;
        background: transparent;
        border: 1px solid transparent;
        color: rgba(30, 41, 59, 0.6);
        justify-content: flex-start;
      }

      .offcanvas-panel .island-btn:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      .offcanvas-panel .island-btn.active {
        background: rgba(255, 255, 255, 0.7);
        border-color: rgba(255, 255, 255, 0.5);
        color: #0f172a;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      }

      .offcanvas-panel .island-btn:nth-child(1).active {
        background: rgba(254, 249, 195, 0.8);
        border-color: #facc15;
      }

      .offcanvas-panel .island-btn:nth-child(2).active {
        background: rgba(187, 247, 208, 0.8);
        border-color: #4ade80;
      }

      .offcanvas-panel .island-btn:nth-child(3).active {
        background: rgba(191, 219, 254, 0.8);
        border-color: #60a5fa;
      }

      .offcanvas-panel .island-btn:nth-child(4).active {
        background: rgba(254, 202, 202, 0.8);
        border-color: #f87171;
      }

      .offcanvas-panel .island-btn:nth-child(5).active {
        background: rgba(233, 213, 255, 0.8);
        border-color: #a78bfa;
      }
    }

    @media(max-width:480px) {
      .offcanvas-panel {
        width: 85%;
        padding: 50px 16px 20px;
        gap: 12px;
      }

      .offcanvas-panel .island-btn {
        font-size: 15px;
        padding: 14px 16px;
      }
    }

    /* scale adjustments (unchanged) */
    @media (min-width: 900px) and (max-height: 800px) {
      .app {
        transform: scaleY(0.95);
        transform-origin: top center;
        height: calc(100vh / 0.95);
      }
    }

    @media (min-width: 900px) and (max-height: 700px) {
      .app {
        transform: scaleY(0.9);
        transform-origin: top center;
        height: calc(100vh / 0.9);
      }
    }

    @media (min-width: 900px) and (max-height: 600px) {
      .app {
        transform: scaleY(0.85);
        transform-origin: top center;
        height: calc(100vh / 0.85);
      }
    }

    @media (min-width: 900px) and (max-height: 500px) {
      .app {
        transform: scaleY(0.8);
        transform-origin: top center;
        height: calc(100vh / 0.8);
      }
    }

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .nav-group {
        max-width: 1200px;
        gap: 16px;
      }

      .island-btn {
        font-size: clamp(16px, 0.9vw, 18px);
        padding: 14px 18px;
      }

      .topbar {
        height: 90px;
      }
    }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .nav-group {
        max-width: 1400px;
        gap: 24px;
        padding: 10px 16px;
      }

      .topbar {
        height: 100px;
      }

      .island-btn {
        font-size: clamp(17px, 1vw, 20px);
        padding: 16px 22px;
        border-radius: 80px;
      }

      .main {
        padding: 20px 20px 0;
      }
    }

    @media screen and (min-width: 1921px) {
      .nav-group {
        max-width: 1700px;
        gap: 32px;
        padding: 12px 20px;
      }

      .topbar {
        height: 120px;
      }

      .island-btn {
        font-size: clamp(20px, 1.1vw, 26px);
        padding: 20px 28px;
        border-radius: 100px;
      }

      .main {
        padding: 30px 40px 0;
      }

      iframe {
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>

  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <div class="app">
    <div class="topbar">
      <div class="nav-group">
        <div class="island-btn active" onclick="openIsland(0)">
          <i class="fa-solid fa-circle-check"></i> Correct Options
        </div>
        <div class="island-btn" onclick="openIsland(1)">
          <i class="fa-solid fa-pen"></i> Fill in the Blanks
        </div>
        <div class="island-btn" onclick="openIsland(2)">
          <i class="fa-solid fa-check-double"></i> True / False
        </div>
        <div class="island-btn" onclick="openIsland(3)">
          <i class="fa-solid fa-font"></i> One Word
        </div>
        <div class="island-btn" onclick="openIsland(4)">
          <i class="fa-solid fa-link"></i> Matching
        </div>
      </div>
    </div>

    <div class="main">
      <iframe id="contentFrame" src="./exercises/mcq.html"></iframe>
    </div>
  </div>

  <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">
    <div class="offcanvas-panel" onclick="event.stopPropagation()">
      <div class="island-btn active" onclick="mobileOpen(0)">
        <i class="fa-solid fa-circle-check"></i> Correct Options
      </div>
      <div class="island-btn" onclick="mobileOpen(1)">
        <i class="fa-solid fa-pen"></i> Fill in the Blanks
      </div>
      <div class="island-btn" onclick="mobileOpen(2)">
        <i class="fa-solid fa-check-double"></i> True / False
      </div>
      <div class="island-btn" onclick="mobileOpen(3)">
        <i class="fa-solid fa-font"></i> One Word
      </div>
      <div class="island-btn" onclick="mobileOpen(4)">
        <i class="fa-solid fa-link"></i> Matching
      </div>
    </div>
  </div>

  <script>
    const sidebarButtons = document.querySelectorAll(".topbar .island-btn");
    const mobileButtons = document.querySelectorAll(".offcanvas .island-btn");
    const frame = document.getElementById("contentFrame");

    const pages = [
      "./exercises/mcq.html",
      "./exercises/FTB.html",
      "./exercises/true_false.html",
      "./exercises/one_word.html",
      "./exercises/matching.html"
    ];

    function openIsland(index) {
      if (index >= sidebarButtons.length) return;
      sidebarButtons.forEach(btn => btn.classList.remove("active"));
      sidebarButtons[index].classList.add("active");
      mobileButtons.forEach(btn => btn.classList.remove("active"));
      mobileButtons[index].classList.add("active");
      if (index < pages.length) frame.src = pages[index];
    }

    function toggleMenu() {
      if (window.innerWidth > 1065) return;
      document.getElementById("offcanvas").classList.toggle("show");
    }

    function mobileOpen(i) {
      openIsland(i);
      toggleMenu();
    }

    window.onload = () => {
      const hasActive = document.querySelector(".topbar .island-btn.active");
      if (!hasActive && sidebarButtons.length) {
        sidebarButtons[0].classList.add("active");
        mobileButtons[0].classList.add("active");
      }
    };
  </script>
</body>

</html>
