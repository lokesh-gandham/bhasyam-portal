    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        }

        body {

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        /* MAIN */
        .quiz-box {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /*=====================================
        QUESTION ROW
======================================*/
        .question-wrapper {

            width: 100%;
            max-width: 1400px;

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: left;
        }

        /*=====================================
      QUESTION BADGE
======================================*/


        .question {

            flex: 1;
            
            height: 80px;

            margin: 0;

            padding: 0;

            display: flex;

            align-items: center;
            justify-content: center;
            font-size: 30px;

            text-align: left;

            color: #2f4f4f;

            line-height: 1.3;

        }

        /*=====================================
      IMAGE CARD
======================================*/

        .image-card {

            width: 100%;

            max-width: 500px;

            padding: 16px;

            border-radius: 42px;

            margin-top: 20px;
        }

        .question-img {

            width: 100%;

            height: 190px;

            object-fit: contain;

            object-position: center;

            border-radius: 32px;



        }


        /*=====================================
        ANSWER PANEL
======================================*/
        .answer-panel {

            position: relative;

            width: 100%;

            max-width: 400px;

            height: 70px;

            margin: 35px auto;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 18px;

            border-radius: 40px;

            background:
                linear-gradient(180deg, #ffffff, #fcf8ff);

            border: 4px dashed #9b6cff;

            box-shadow:

                0 20px 40px rgba(125, 92, 255, .18),

                0 8px 18px rgba(255, 255, 255, .9) inset,

                0 0 35px rgba(169, 120, 255, .15);

            overflow: hidden;

            transition: .35s;


        }

        .answer-panel::before {

            content: "";

            position: absolute;

            inset: 8px;

            border-radius: 30px;

            border: 2px solid rgba(255, 255, 255, .7);

            pointer-events: none;

        }

        .answer-panel.correct::after {
            display: none;
        }

        .answer-panel.correct::before {
            display: none;
            /* Optional: also removes the inner white border */
        }

        /* MOBILE */


        /* MONITOR */
        @media screen and (min-width:1101px) and (max-width:1200px) {

            .question-img {

                max-width: 500px;

                height: 280px;

                padding: 24px;

                border-radius: 50px;

            }

        }

        /* LARGE MONITOR */
        @media screen and (min-width:1601px) {

            .question-img {

                max-width: 760px;

                height: 380px;

                padding: 28px;

                border-radius: 60px;

            }

        }

        /* ANSWER AREA */
        .letter-container {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 16px;

            flex-wrap: wrap;

            z-index: 2;

        }

        .letter-box {

            width: 65px;

            height: 65px;

            border-radius: 18px;

            background: #F4F8FF;

            border: 2px solid #C7D8FF;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 34px;

            font-weight: 700;

            color: #3E3E3E;

            transition: .3s;

            box-shadow:

                0 6px 15px rgba(0, 0, 0, .08);

        }

        .letter-box.active {

            border-color: #7B4DFF;

            transform: translateY(-4px);

            box-shadow:

                0 10px 22px rgba(123, 77, 255, .35);

        }


        .correct {

            background:

                linear-gradient(135deg,
                    #6DDB8F,
                    #45C46A) !important;

            color: #fff;

            border-color: #3BAE5D;

        }

        .wrong {

            background:

                linear-gradient(135deg,
                    #FF9AA5,
                    #FF5E74) !important;

            color: #fff;

            border-color: #F1465C;

        }

        /* NAV BUTTONS LIKE MCQ */
        /* NAV */
        /* =========================
   CONTROLS (Same as MCQ)
========================= */

        .nav {
            display: flex;
            justify-content: center;
            gap: clamp(140px, 35vw, 700px);
            margin-top: 20px;
        }

        .nav button {
            width: 130px;

            height: 54px;
            border: none;
            border-radius: 18px;

            font-size: 18px;
            font-weight: 400;

            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            cursor: pointer;
            position: relative;
            overflow: hidden;

            transition: .3s;
        }

        /* Shine */

        .nav button::before {

            content: "";

            position: absolute;

            top: -30px;
            left: -70px;

            width: 50px;
            height: 140px;

            background: rgba(255, 255, 255, .35);

            transform: rotate(25deg);

            transition: .5s;
        }

        .nav button:hover::before {
            left: 140%;
        }

        /* Hover */

        .nav button:hover:not(:disabled) {

            transform:
                translateY(-5px) scale(1.05);
        }

        /* Previous */

        .prev {

            background:
                linear-gradient(135deg,
                    #74c0fc,
                    #4dabf7,
                    #3b82f6);

            box-shadow:
                0 10px 18px rgba(59, 130, 246, .35);
        }

        /* Next */

        .next {

            background:
                linear-gradient(135deg,
                    #f9a8d4,
                    #c77dff,
                    #9d4edd);

            box-shadow:
                0 10px 18px rgba(157, 78, 221, .35);
        }

        .prev:active {
            transform: translateY(4px);
        }

        .next:active {
            transform: translateY(4px);
        }

        .nav button:active {
            transform: scale(.92);
        }

        .nav button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* DISABLED BUTTONS */

        /*=====================================
          ANSWER POPUP
======================================*/

        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .kid-card {

            background: #ffffff;

            width: 340px;
            max-width: 90%;

            padding: 30px 25px;

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 15px 0 #ffd966,
                0 25px 40px rgba(0, 0, 0, .20);

            animation: kidPop .6s ease;
        }

        .kid-icon {

            font-size: 75px;

            margin-bottom: 12px;

            animation: emojiBounce .9s infinite alternate;
        }

        .kid-card h3 {

            font-size: 36px;

            margin-bottom: 8px;

            font-weight: normal;
        }

        .kid-card p {

            font-size: 22px;

            font-weight: normal;

        }

        .kid-correct .kid-card {

            background: #e6fffa;

            border: 6px solid #38d9a9;
        }

        .kid-wrong .kid-card {

            background: #fff5f5;

            border: 6px solid #ffa8a8;
        }

        /*=====================================
          FINAL POPUP
======================================*/
  #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .final-kid-box {
            background: linear-gradient(135deg,
                    #fff7d6,
                    #e6fff5);

            padding: 30px 35px;

            border-radius: 35px;

            text-align: center;

            width: 450px;

            animation: finalBounce .8s ease;

            box-shadow:
                0 20px 0 #ffd43b,
                0 30px 50px rgba(0, 0, 0, .2);
        }

        .final-kid-box h2 {
            font-size: 2.2em;
            color: #2f9e44;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .final-kid-box p {
            font-size: 1.3em;

        }

        #stars {
            font-size: 2.3em;
            margin: 12px 0;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 400;
            cursor: pointer;
            margin-top: 12px;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /*=====================================
          ANIMATIONS
======================================*/

        @keyframes kidPop {

            0% {
                transform: scale(.3) rotate(-10deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.1) rotate(5deg);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }

        @keyframes finalBounce {

            0% {
                transform: scale(.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }


        .answer-input {

            width: 100%;

            height: 100%;

            background: transparent;

            border: none;

            outline: none;

            padding: 0 35px;

            font-size: 22px;
            font-weight: 500;

            color: #2f4f4f;

            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;

            letter-spacing: .5px;

        }

        /*=====================================
        SUBMIT BUTTON
======================================*/

        .submit-row {

            width: 100%;

            display: flex;

            justify-content: center;



        }

        .submit-btn {

            display: flex;
            justify-content: center;
            align-items: center;

            width: 200px;
            height: 55px;

            border: none;
            border-radius: 45px;

            font-size: 22px;
            font-weight: 600;

            color: #ffffff;

            cursor: not-allowed;

            background: linear-gradient(135deg, #d8d8d8, #bfbfbf);

            box-shadow: none;

            transition: .35s ease;

            opacity: .8;
            margin-top: -20px;
        }

        /* Shine */
        /* Enabled */
        .submit-btn:not(:disabled) {

            background: linear-gradient(135deg, #9878f0, #7153e8);

            cursor: pointer;

            opacity: 1;

            box-shadow:
                0 12px 30px rgba(123, 77, 255, .35),
                inset 0 2px 6px rgba(255, 255, 255, .25);
        }

        .submit-btn:not(:disabled):hover {

            transform: translateY(-3px);

            box-shadow:
                0 16px 35px rgba(123, 77, 255, .45);
        }

        /* Disabled */
        .submit-btn:disabled {

            background: linear-gradient(135deg, #d8d8d8, #bfbfbf);

            color: #7d7d7d;

            cursor: not-allowed;

            opacity: .8;

            box-shadow: none;

            transform: none;
        }

        /* Hover */

        /* Click */

        .submit-btn:active {

            transform: scale(.96);

        }

    <style id="codex-responsive-shell">
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            max-width: 100%;
            overflow: hidden;
        }

        img,
        svg,
        canvas,
        video {
            max-width: 100%;
        }

        iframe {
            display: block;
            max-width: 100%;
        }

        body:has(iframe) {
            width: 100%;
            height: 100svh;
            min-height: 100svh;
            overflow: hidden;
        }

        body:has(iframe) .app,
        body:has(iframe) .frame,
        body:has(iframe) .board {
            max-width: 100%;
            max-height: 100svh;
            min-height: 0;
        }

        body:has(iframe) .app {
            height: 100svh;
        }

        body:has(iframe) .board {
            width: min(1250px, calc(100vw - 16px));
            height: min(570px, calc(100svh - 16px));
        }

        body:has(iframe) .content,
        body:has(iframe) .main,
        body:has(iframe) .screen,
        body:has(iframe) .iframe-wrapper {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        body:has(iframe) iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (min-width: 1025px) {
            body:has(iframe) .sidebar {
                width: clamp(190px, 17vw, 300px);
                min-width: 0;
                min-height: 0;
            }

            body:has(iframe) .topbar,
            body:has(iframe) .top-nav,
            body:has(iframe) .top-index,
            body:has(iframe) .bottom-bar,
            body:has(iframe) .nav-group {
                flex-shrink: 0;
            }

            body:has(iframe) .nav-container,
            body:has(iframe) .nav-wrapper,
            body:has(iframe) .sidebar-scroll,
            body:has(iframe) .menu {
                max-height: 100svh;

            }

            body:has(iframe) .top-nav,
            body:has(iframe) .top-index,
            body:has(iframe) .bottom-bar,
            body:has(iframe) .topbar,
            body:has(iframe) .nav-group {
                gap: clamp(10px, 2.8vw, 44px);
                padding: clamp(6px, 1.4dvh, 14px) clamp(8px, 1.4vw, 20px);
            }

            body:has(iframe) .nav-btn,
            body:has(iframe) .puzzle,
            body:has(iframe) .island-btn,
            body:has(iframe) .btn {
                min-height: 0;
                max-width: 100%;
            }
        }

        @media (min-width: 1025px) and (max-height: 760px) {

            body:has(iframe) .top-nav,
            body:has(iframe) .top-index,
            body:has(iframe) .bottom-bar,
            body:has(iframe) .topbar,
            body:has(iframe) .nav-group {
                gap: clamp(8px, 2vw, 24px);
                padding-block: clamp(4px, 1dvh, 10px);
            }

            body:has(iframe) .nav-btn,
            body:has(iframe) .puzzle,
            body:has(iframe) .island-btn,
            body:has(iframe) .btn {
                padding: clamp(8px, 1.4dvh, 14px) clamp(10px, 1.4vw, 22px);
                font-size: clamp(15px, 1.2vw, 20px);
            }

            body:has(iframe) .puzzle {
                width: clamp(150px, 14vw, 210px);
                height: clamp(54px, 8dvh, 70px);
            }

            body:has(iframe) .sidebar {
                width: clamp(190px, 16vw, 240px);
            }
        }

<body>
    <div class="quiz-box">

        <!-- =========================
            QUESTION SECTION
    ========================== -->

        <div class="question-wrapper">


            <!-- Question Text -->
            <div class="question" id="question"></div>

        </div>


        <!-- =========================
            IMAGE CARD
    ========================== -->

        <div class="image-card">

            <img id="img" class="question-img">

        </div>


        <!-- =========================
            ANSWER PANEL
    ========================== -->
        <div class="answer-panel">

            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer here"
                autocomplete="off">

        </div>

        <!-- =========================
            BUTTONS
    ========================== -->

        <div class="submit-row">

            <!-- Keep your existing submit button -->
            <button id="submitBtn" class="submit-btn" onclick="checkAnswer()">
                Submit
            </button>
        </div>


        <!-- Keep Navigation Exactly Same -->
        <div class="nav">

            <button class="prev" id="prev" onclick="prevQ()">
                <i class="fa-solid fa-circle-arrow-left"></i>
                Prev
            </button>

            <button class="next" id="next" onclick="nextQ()" disabled>
                Next
                <i class="fa-solid fa-circle-arrow-right"></i>
            </button>

        </div>

        <!-- Popup -->
        <div id="answerPopup" class="kid-popup">
            <div class="kid-card">
                <div class="kid-icon" id="popupIcon"></div>
                <h3 id="popupTitle"></h3>
                <p id="popupMsg"></p>
            </div>
        </div>

        <div id="finalPopup">
            <div class="final-kid-box">
                <h2>Congratulations!</h2>
                <p id="finalScore"></p>
                <div id="stars"></div>

                <button class="playAgain-btn" onclick="restartQuiz()">
                    Play Again
                </button>
            </div>
        </div>
        <script>
            const quiz = [
                {
                    q: "Q1. Areas located at high altitudes experience _____ climate.",
                    img: "../images/ftb11.png",
                    a: ["cold"]
                },
                {
                    q: "Q2. The land breeze flows at _____ time.",
                    img: "../images/ftb2.png",
                    a: ["night"]
                },
                {
                    q: "Q3. The amount of moisture content present in the air is known as _____.",
                    img: "../images/ftb3.png",
                    a: ["humidity"]
                },
                {
                    q: "Q4. The Torrid Zone is also known as _____.",
                    img: "../images/ftb4.png",
                    a: ["tropics"]
                },
                {
                    q: "Q5. The _____ of a place is measured related to its distance from the sea.",
                    img: "../images/ftb5.png",
                    a: ["humidity"]
                }
            ];
            /* VARIABLES */

            let current = 0;

            let score = 0;

            let userAnswers = new Array(quiz.length).fill(null);

            let answered = false;
            let quizEnded = false;
            let userInput = "";
            const input = document.getElementById("answerInput");
            input.addEventListener("drop", (e) => e.preventDefault());
input.addEventListener("dragover", (e) => e.preventDefault());
            const question = document.getElementById("question");
            const img = document.getElementById("img");
            const prev = document.getElementById("prev");
            const next = document.getElementById("next");

            const submitBtn = document.getElementById("submitBtn");

           input.addEventListener("input", () => {
    if (input.value.length > 0) {
        const pos = input.selectionStart;
        input.value =
            input.value.charAt(0).toUpperCase() +
            input.value.slice(1).toLowerCase();
        input.setSelectionRange(pos, pos);
    }

    submitBtn.disabled = input.value.trim() === "";
});
            /* UK SPEECH */

            function speakText(text) {

                window.speechSynthesis.cancel();

                const speech =
                    new SpeechSynthesisUtterance(text);

                speech.lang = "en-UK";

                speech.rate = 1;

                speech.pitch = 1;

                speech.volume = 0.25;

                speechSynthesis.speak(speech);

            }
            /* POPUP */
            function showPopup(correct) {

                const popup = document.getElementById("answerPopup");
                const icon = document.getElementById("popupIcon");
                const title = document.getElementById("popupTitle");
                const msg = document.getElementById("popupMsg");

                popup.style.display = "flex";

                if (correct) {

                    popup.className = "kid-popup kid-correct";

                    icon.innerHTML = "👍";
                    title.innerHTML = "Good!";
                    msg.innerHTML = "Correct choice.";

                }
                else {

                    popup.className = "kid-popup kid-wrong";

                    icon.innerHTML = "👎";
                    title.innerHTML = "Oops!";
                    msg.innerHTML = "Pick again.";

                }

                setTimeout(() => {

                    popup.style.display = "none";

                }, 1200);

            }/* =========================
   LOAD QUESTION
========================= */
            /* =========================
               LOAD QUESTION
            ========================= */

            function loadQ() {
                const submitBtn = document.getElementById("submitBtn");

                submitBtn.disabled = true;
                // Current Question
                const q = quiz[current];

                // Safety check
                if (!q) {
                    console.error("Question not found:", current);
                    return;
                }

                // Reset answer state
                answered = false;
                question.textContent = q.q;
                // Question Image
                img.src = q.img;
                img.alt = q.q;

                // If image fails to load
                img.onerror = function () {

                    console.error("Image not found :", q.img);

                    this.src = "";

                };

                // Reset Input
                input.disabled = false;
                input.value = "";
                input.focus();

                // Remove previous styles
                input.style.border = "";
                input.style.background = "";

                document
                    .querySelector(".answer-panel")
                    .classList.remove("correct", "wrong");

                // Restore answer if already answered
                if (userAnswers[current]) {

                   input.value =
    userAnswers[current].charAt(0).toUpperCase() +
    userAnswers[current].slice(1).toLowerCase();

                    input.disabled = true;
                    submitBtn.disabled = true;

                    answered = true;

                    next.disabled = false;

                    document
                        .querySelector(".answer-panel")
                        .classList.add("correct");

                } else {

                    next.disabled = true;

                }

                // Previous Button

                if (current === 0) {

                    prev.disabled = true;

                    prev.style.opacity = "0.5";

                    prev.style.pointerEvents = "none";

                } else {

                    prev.disabled = false;

                    prev.style.opacity = "1";

                    prev.style.pointerEvents = "auto";

                }

            }
            /* KEYBOARD */
            input.addEventListener("keydown", function (e) {

                if (e.key === "Enter") {

                    checkAnswer();

                }

            });
            /* CHECK */
            /* =========================
               CHECK ANSWER
            ========================= */

            function checkAnswer() {

                // Don't check if already answered
                if (answered) return;

                // Get user answer
                // User input
                let originalInput = input.value.trim();

                // For answer checking
                let user = originalInput.toLowerCase();

                // Empty answer
                if (user === "") {

                    input.focus();

                    return;

                }

                // Correct Answer
                let correctAnswer = quiz[current].a;

                // Check Answer
                if (correctAnswer.includes(user)) {

                    answered = true;

                    score++;

                  userAnswers[current] =
    originalInput.trim().charAt(0).toUpperCase() +
    originalInput.trim().slice(1).toLowerCase();

                    // Show formatted answer
                    input.value = userAnswers[current];

                    // Green Style


                    // Disable typing
                    input.disabled = true;

                    // Enable Next Button
                    next.disabled = false;

                    // Popup
                    showPopup(true);

                    // Voice
                    speakText("Correct");

                    // Confetti
                    confetti({

                        particleCount: 150,

                        spread: 90,

                        origin: { y: 0.6 }

                    });

                    // Last Question
                    if (current === quiz.length - 1) {

                        setTimeout(showResult, 1200);

                    }

                }

                // Wrong Answer
                else {

                    input.style.border = "3px solid #ff4d4d";

                    input.style.background = "#ffe9e9";

                    showPopup(false);

                    speakText("Try again");
                    setTimeout(() => {

                        input.value = "";
                        submitBtn.disabled = true;

                        input.style.border = "";
                        input.style.background = "";
                        input.focus();

                    }, 800);

                }

            }
            function nextQ() {

                if (quizEnded) return;

                if (!answered) return;

                if (current < quiz.length - 1) {

                    current++;

                    loadQ();

                }

            }

            /* PREV */
            function prevQ() {

                if (quizEnded) return;

                if (current > 0) {

                    current--;

                    loadQ();

                }

            }
            function showResult() {

                const popup = document.getElementById("finalPopup");

                document.getElementById("finalScore").textContent =
                    `Your Score: ${score} / ${quiz.length}`;

                document.getElementById("stars").textContent =
                    "⭐".repeat(score);

                popup.style.display = "flex";

                bigConfetti();

            }
            /* RESTART */
            function restartQuiz() {

                location.reload();

            }

            /* START */

            loadQ();

        </script>

        <script id="codex-viewport-fit">
            (function () {
                if (window.__codexViewportFit) return;
                window.__codexViewportFit = true;

                const hasIframe = Boolean(document.querySelector("iframe"));
                const selectors = [
                    ".main",
                    ".main-container",
                    ".quiz",
                    ".quiz-container",
                    ".quiz-box",
                    ".container",
                    ".stage",
                    ".screen",
                    ".game",
                    ".template",
                    ".quiz-card",
                    ".app"
                ];
                const minScale = 0.62;
                let rafId = 0;

                function setViewportRules() {
                    document.documentElement.style.width = "100%";
                    document.documentElement.style.height = "100%";
                    document.documentElement.style.overflow = "hidden";
                    document.body.style.width = "100%";
                    document.body.style.height = "100svh";
                    document.body.style.minHeight = "100svh";
                    document.body.style.overflow = "hidden";
                }

                function getStage() {
                    for (const selector of selectors) {
                        const stage = document.querySelector(selector);
                        if (stage) return stage;
                    }
                    return null;
                }

                function fitToViewport() {
                    setViewportRules();
                    if (hasIframe) return;

                    const stage = getStage();
                    if (!stage) return;

                    stage.style.transform = "scale(1)";
                    stage.style.transformOrigin = "center center";

                    const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                    const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                    const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                    const rect = stage.getBoundingClientRect();
                    const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                    const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                    const scale = Math.max(
                        minScale,
                        Math.min(
                            1,
                            (viewportWidth - breathingRoom * 2) / contentWidth,
                            (viewportHeight - breathingRoom * 2) / contentHeight
                        )
                    );

                    stage.style.transform = `scale(${scale})`;
                }

                function requestFit() {
                    cancelAnimationFrame(rafId);
                    rafId = requestAnimationFrame(fitToViewport);
                }

                window.addEventListener("load", requestFit);
                window.addEventListener("resize", requestFit);
                window.addEventListener("orientationchange", requestFit);

                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(requestFit).catch(function () { });
                }

                document.querySelectorAll("img").forEach(function (img) {
                    img.addEventListener("load", requestFit, { once: false });
                });

                if ("ResizeObserver" in window) {
                    const observer = new ResizeObserver(requestFit);
                    const observeStage = function () {
                        const stage = getStage();
                        if (stage) observer.observe(stage);
                    };
                    observeStage();
                    window.addEventListener("load", observeStage);
                }

                if (document.body) {
                    new MutationObserver(requestFit).observe(document.body, {
                        childList: true,
                        subtree: true,
                        characterData: true
                    });
                }

                requestFit();
            })();
        </script>
