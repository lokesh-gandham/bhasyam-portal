    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        }

        body {

            width: 100%;
            height: 100vh;

            overflow: hidden;


        }

        /* MAIN */
        .game {

            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

        }

        /* BOX */
        .quiz-box {

            width: 100%;
            max-width: 1350px;

            height: 95vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

        }

        /* AREA */
        .match-area {

            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 120px;

        }

        /* COLUMN */
        .column {

            width: 35%;

            display: flex;
            flex-direction: column;

            gap: 22px;

        }

        /* CARD */
        .card {

            height: 95px;

            padding: 14px 18px;

            border-radius: 20px;

            display: flex;
            align-items: center;

            gap: 18px;

            cursor: pointer;

            position: relative;

            transition: .25s;

            user-select: none;

        }

        /*==============================
      PASTEL CARD DESIGN
==============================*/

        .card {

            background: #E8F4F8;

            border: 4px solid #A9D6E5;

            box-shadow:
                0 10px 20px rgba(169, 214, 229, .25);

            transition: .3s;

        }

        .active {

            transform: scale(1.05);

            background: #D6F0FF;

            border-color: #4DABF7;

            box-shadow:
                0 0 20px rgba(77, 171, 247, .35);

        }

        .img-circle {

            width: 75px;
            height: 75px;

            border-radius: 50%;


            display: flex;
            justify-content: center;
            align-items: center;

            flex-shrink: 0;

        }

        /* IMAGE */
        .img-circle img {

            width: 95%;
            height: 95%;

            object-fit: contain;

        }

        /* TEXT */
        .text {

            flex: 1;

            font-size: 22px;

            color: #202b2b;

            line-height: 1.3;

        }

        .active {

            transform: scale(1.05);

            background: #D6F0FF;

            border-color: #4DABF7;

            box-shadow:
                0 0 20px rgba(77, 171, 247, .35);

        }

        .correct {

            pointer-events: none;

            background: #D9F7E8;

            border-color: #52B788;

            color: #1B4332;

            box-shadow:
                0 0 18px rgba(82, 183, 136, .35);

        }

        .wrong {

            animation: shake .35s;

            border-color: #FF6B6B;

        }

        /* BADGE */
        .match-badge {

            position: absolute;

            top: -12px;
            right: -12px;

            width: 35px;
            height: 35px;

            border-radius: 50%;

            background:
                linear-gradient(135deg,
                    #4facfe,
                    #00f2fe);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;

            color: white;

            font-weight: 600;

            box-shadow:
                0 8px 18px rgba(255, 159, 28, .4);

            animation: popBadge .3s;

        }

        /* BADGE */
        @keyframes popBadge {

            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }

        }

        /* WRONG */
        @keyframes shake {

            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-7px);
            }

            50% {
                transform: translateX(7px);
            }

            75% {
                transform: translateX(-7px);
            }

            100% {
                transform: translateX(0);
            }

        }

        .wrong {

            animation: shake .35s;

        }

       #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .final-kid-box {
            background: linear-gradient(135deg,
                    #fff7d6,
                    #e6fff5);

            padding: 30px 35px;

            border-radius: 35px;

            text-align: center;

            width: 450px;

            animation: finalBounce .8s ease;

            box-shadow:
                0 20px 0 #ffd43b,
                0 30px 50px rgba(0, 0, 0, .2);
        }

        .final-kid-box h2 {
            font-size: 2.2em;
            color: #2f9e44;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .final-kid-box p {
            font-size: 1.3em;

        }

        #stars {
            font-size: 2.3em;
            margin: 12px 0;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 400;
            cursor: pointer;
            margin-top: 12px;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

<body>

    <div class="game">

        <div class="quiz-box">

            <div class="match-area">

                <!-- LEFT -->
                <div class="column left" id="leftColumn">
                </div>

                <!-- RIGHT -->
                <div class="column right" id="rightColumn">
                </div>

            </div>

        </div>

    </div>

    <!-- FINAL -->
    <div id="finalPopup">
        <div class="final-kid-box">

            <h2>Congratulations!</h2>

            <p id="finalScore"></p>

            <div id="stars"></div>

            <button class="playAgain-btn" onclick="location.reload()">
                Play Again
            </button>

        </div>
    </div>

    <script>

        /* SPEECH */
        function speakText(text) {

            window.speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-UK";

            speech.rate = 1;

            speech.pitch = 1;

            speech.volume = 0.25;

            speechSynthesis.speak(speech);

        }

        /* DATA */
        const leftData = [

            {
                id: "b",
                text: "Climate",
                img: "../images/climate.png"
            },

            {
                id: "c",
                text: "Humidity",
                img: "../images/humidity.png"
            },

            {
                id: "d",
                text: "Weather",
                img: "../images/weather.png"
            },

            {
                id: "e",
                text: "Torrid Zone",
                img: "../images/torrid.png"
            },

            {
                id: "a",
                text: "Frigid Zone",
                img: "../images/frigid.png"
            }

        ];
        const rightData = [

            {
                id: "a",
                text: "Cold zone"
            },

            {
                id: "b",
                text: "Remains the same year after year"
            },

            {
                id: "c",
                text: "Amount of moisture present in the air"
            },

            {
                id: "d",
                text: "Changes every day or may change in hours"
            },

            {
                id: "e",
                text: "Tropics"
            }

        ];

        /* ELEMENTS */
        const leftColumn =
            document.getElementById("leftColumn");

        const rightColumn =
            document.getElementById("rightColumn");

        /* VARIABLES */
        let selected = null;

        let score = 0;

        let matchCount = 0;

        /* LEFT */
        leftData.forEach((item) => {

            const card =
                document.createElement("div");

            card.className = "card";

            card.dataset.match = item.id;

            card.innerHTML = `

<div class="img-circle">

<img src="${item.img}">

</div>

<div class="text">
${item.text}
</div>

`;

            card.onclick = () => {

                if (card.classList.contains("correct"))
                    return;

                document
                    .querySelectorAll(".left .card")
                    .forEach(c =>
                        c.classList.remove(
                            "active"
                        )
                    );

                card.classList.add(
                    "active"
                );

                selected = card;

            };

            leftColumn.appendChild(card);

        });

        /* RIGHT */
        rightData.forEach((item) => {

            const card =
                document.createElement("div");

            card.className = "card";

            card.dataset.match = item.id;

            card.innerHTML = `

<div class="text">
${item.text}
</div>

`;

            card.onclick = () => {

                if (!selected)
                    return;

                if (card.classList.contains("correct"))
                    return;

                /* CORRECT */
                if (
                    selected.dataset.match ===
                    card.dataset.match
                ) {

                    matchCount++;

                    selected.classList.add(
                        "correct"
                    );

                    card.classList.add(
                        "correct"
                    );

                    selected.classList.remove(
                        "active"
                    );

                    /* LEFT BADGE */
                    const leftBadge =
                        document.createElement("div");

                    leftBadge.className =
                        "match-badge";

                    leftBadge.innerHTML =
                        matchCount;

                    selected.appendChild(
                        leftBadge
                    );

                    /* RIGHT BADGE */
                    const rightBadge =
                        document.createElement("div");

                    rightBadge.className =
                        "match-badge";

                    rightBadge.innerHTML =
                        matchCount;

                    card.appendChild(
                        rightBadge
                    );

                    score++;

                    speakText(
                        "Correct"
                    );

                    confetti({

                        particleCount: 80,
                        spread: 70

                    });

                    /* FINAL */
                    if (score === 5) {

                        setTimeout(() => {
                            const popup = document.getElementById("finalPopup");
                            document.getElementById("finalScore").innerHTML =
                                `Your Score: ${score} / ${leftData.length}`;

                            document.getElementById("stars").innerHTML =
                                "⭐".repeat(score);

                            popup.style.display = "flex";

                            confetti({
                                particleCount: 250,
                                spread: 120,
                                origin: { y: .6 }
                            });
                            confetti({

                                particleCount: 250,
                                spread: 120

                            });

                        }, 1000);

                    }

                }

                /* WRONG */
                else {

                    card.classList.add(
                        "wrong"
                    );

                    selected.classList.add(
                        "wrong"
                    );

                    setTimeout(() => {

                        card.classList.remove(
                            "wrong"
                        );

                        selected.classList.remove(
                            "wrong"
                        );

                    }, 350);

                    speakText(
                        "Try again"
                    );

                }

            };

            rightColumn.appendChild(card);

        });

    </script>

    <script id="codex-viewport-fit">
        (function () {
            if (window.__codexViewportFit) return;
            window.__codexViewportFit = true;

            const hasIframe = Boolean(document.querySelector("iframe"));
            const selectors = [
                ".main",
                ".main-container",
                ".quiz",
                ".quiz-container",
                ".quiz-box",
                ".container",
                ".stage",
                ".screen",
                ".game",
                ".template",
                ".quiz-card",
                ".app"
            ];
            const minScale = 0.62;
            let rafId = 0;

            function setViewportRules() {
                document.documentElement.style.width = "100%";
                document.documentElement.style.height = "100%";
                document.documentElement.style.overflow = "hidden";
                document.body.style.width = "100%";
                document.body.style.height = "100svh";
                document.body.style.minHeight = "100svh";
                document.body.style.overflow = "hidden";
            }

            function getStage() {
                for (const selector of selectors) {
                    const stage = document.querySelector(selector);
                    if (stage) return stage;
                }
                return null;
            }

            function fitToViewport() {
                setViewportRules();
                if (hasIframe) return;

                const stage = getStage();
                if (!stage) return;

                stage.style.transform = "scale(1)";
                stage.style.transformOrigin = "center center";

                const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                const rect = stage.getBoundingClientRect();
                const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                const scale = Math.max(
                    minScale,
                    Math.min(
                        1,
                        (viewportWidth - breathingRoom * 2) / contentWidth,
                        (viewportHeight - breathingRoom * 2) / contentHeight
                    )
                );

                stage.style.transform = `scale(${scale})`;
            }

            function requestFit() {
                cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(fitToViewport);
            }

            window.addEventListener("load", requestFit);
            window.addEventListener("resize", requestFit);
            window.addEventListener("orientationchange", requestFit);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(requestFit).catch(function () { });
            }

            document.querySelectorAll("img").forEach(function (img) {
                img.addEventListener("load", requestFit, { once: false });
            });

            if ("ResizeObserver" in window) {
                const observer = new ResizeObserver(requestFit);
                const observeStage = function () {
                    const stage = getStage();
                    if (stage) observer.observe(stage);
                };
                observeStage();
                window.addEventListener("load", observeStage);
            }

            if (document.body) {
                new MutationObserver(requestFit).observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }

            requestFit();
        })();
    </script>
