<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MCQ Quiz</title>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Livvic";
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            padding: 20px;

        }

        .quiz {

            width: min(900px, 100%);

            min-height: auto;

            margin: auto;

            display: flex;

            flex-direction: column;

            justify-content: center;
            margin-top: -20px;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: 20px;
        }

        .quiz {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        .quiz-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 20px;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #question {

            font-size: 30px;
            font-weight: 400;
            color: #2f4f4f;
            line-height: 1.3;
            min-height: clamp(60px, 10vh, 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: left;
        }

        .question-image {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -10px;
        }

        .question-image img {
            width: 400px;
            height: 210px;
            object-fit: contain;
            padding: 5px;
            border-radius: 28px;
            background: transparent;

        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(8px, 2vw, 14px);
        }

        .option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(4px, 1vw, 10px);
            cursor: pointer;
        }

        .option-img {
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-img img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        .option-text {

            width: clamp(140px, 16vw, 180px);
            height: clamp(48px, 6vw, 60px);

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            padding: clamp(6px, 1vw, 10px) clamp(10px, 1.5vw, 14px);

            border-radius: 18px;

            font-size: 20px;
            font-weight: 500;

            color: #2f4f4f;

            background:
                linear-gradient(135deg,
                    #ffffff,
                    #f7f0ff);

            border: 2px solid rgba(255, 255, 255, .9);

            box-shadow:
                0 10px 20px rgba(0, 0, 0, .08),
                inset 0 2px 5px rgba(255, 255, 255, .8);

            transition: .3s;

            text-transform: capitalize;

            position: relative;

            overflow: hidden;
        }

        /* floating pastel glow */



        .option.correct .option-text {

            background:
                linear-gradient(135deg,
                    #d8f3dc,
                    #b7efc5,
                    #95d5b2);

            color: #1b4332;

            border: 2px solid #ffffff;

            box-shadow:
                0 0 18px rgba(76, 201, 140, .45),
                0 10px 18px rgba(0, 0, 0, .08);

        }

        .option.wrong .option-text {

            background:
                linear-gradient(135deg,
                    #ffd6d6,
                    #ffccd5);

            color: #7f1d1d;

            box-shadow:
                0 0 15px rgba(255, 107, 107, .35);

        }

        .option.disabled {
            opacity: .5;
            pointer-events: none;
        }

        @keyframes blinkWrong {
            0% {
                background: #ffe5e5;
            }

            50% {
                background: #fff;
            }

            100% {
                background: #ffe5e5;
            }
        }

        /* CONTROLS */

        .controls {
            display: flex;
            justify-content: center;
            gap: clamp(140px, 35vw, 700px);
            margin-top: 20px;
            margin-bottom: clamp(10px, 3vh, 40px);
        }

        .controls button {
            width: 130px;

            height: 54px;

            border: none;

            border-radius: 18px;

            font-size: 18px;
            font-weight: 400;

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            transition: .3s;
        }

        /* glow shine */

        .controls button::before {

            content: "";

            position: absolute;

            top: -30px;
            left: -70px;

            width: 50px;
            height: 140px;

            background:
                rgba(255, 255, 255, .35);

            transform: rotate(25deg);

            transition: .5s;
        }

        .controls button:hover::before {
            left: 140%;
        }

        /* hover */

        .controls button:hover {

            transform:
                translateY(-5px) scale(1.05);

        }

        /* PREV */
        .prev {

            background:
                linear-gradient(135deg,
                    #74c0fc,
                    #6cb4f0,
                    #4f8df0);

            box-shadow:
                0 10px 18px rgba(59, 130, 246, .35);

        }

        /* NEXT */
        .next {

            background:
                linear-gradient(135deg,
                    #f9a8d4,
                    #c18ee7,
                    #a371cd);

            box-shadow:
                0 10px 18px rgba(157, 78, 221, .35);

        }

        .prev:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #66a0bf;
        }

        .next:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d9c178;
        }

        .controls button:active {

            transform:
                scale(.92);

        }

        .controls button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* POPUPS */

        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .kid-card {
            background: #ffffff;
            width: 320px;
            padding: 25px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 0 #ffd966,
                0 25px 40px rgba(0, 0, 0, 0.2);
            animation: kidPop 0.6s ease;
        }

        .kid-icon {
            font-size: 4.5em;
            margin-bottom: 10px;
            animation: emojiBounce 0.9s infinite alternate;
        }

        .kid-card h3 {
            font-size: 2em;
            margin-bottom: 8px;
            font-weight: normal;
        }

        .kid-card p {
            font-size: 1.2em;
            font-weight: normal;
        }

        .kid-correct .kid-card {
            background: #e6fffa;
            border: 6px solid #38d9a9;
        }

        .kid-wrong .kid-card {
            background: #fff5f5;
            border: 6px solid #ffa8a8;
        }

        @keyframes kidPop {
            0% {
                transform: scale(.3) rotate(-10deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.1) rotate(5deg);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }

        #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .final-kid-box {
            background: linear-gradient(135deg,
                    #fff7d6,
                    #e6fff5);

            padding: 30px 35px;

            border-radius: 35px;

            text-align: center;

            width: 450px;

            animation: finalBounce .8s ease;

            box-shadow:
                0 20px 0 #ffd43b,
                0 30px 50px rgba(0, 0, 0, .2);
        }

        .final-kid-box h2 {
            font-size: 2.2em;
            color: #2f9e44;
            margin-bottom: 10px;
            /* font-weight: 600; */
        }

        .final-kid-box p {
            font-size: 1.3em;

        }

        #stars {
            font-size: 2.3em;
            margin: 12px 0;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 400;
            cursor: pointer;
            margin-top: 12px;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* MOBILE */

        @media (max-width:700px) {

            body {
                overflow: hidden !important;
            }

            .quiz {
                transform: scale(1);
                margin-top: 0;
            }

            .quiz-layout {
                grid-template-columns: 1fr;
            }

            body {
                align-items: center;
                padding: 20px;
            }

            .controls {
                gap: clamp(40px, 15vw, 120px);
                margin-bottom: 300px !important;
            }
        }

        /*======================================================
            STORY BOOK OPTION DESIGN
======================================================*/
        .options {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 140px;
            margin-top: 20px;
            flex-wrap: nowrap;
            /* Keep all books in one row */
        }

        /* Each option */

        .option {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            perspective: 1800px;
        }

        /* Storybook wrapper */

        .storybook {
            width: 150px;
            height: 165px;
            position: relative;
        }

        /* Main Book */

        .book {

            width: 100%;
            height: 100%;

            position: relative;

            transform-style: preserve-3d;

            transition: 1s ease;

        }

        /*==========================
      FRONT COVER
==========================*/

        .book-cover {

            position: absolute;

            inset: 0;

            border-radius: 18px;

            transform-origin: left center;

            transform-style: preserve-3d;

            transition: 1s ease;

            z-index: 20;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: space-between;

            padding: 18px;

            color: white;

            box-shadow:
                0 18px 30px rgba(0, 0, 0, .25);

        }

        /* Different colors */
        /* Pastel Blue */
        .option:nth-child(1) .book-cover {
           background: linear-gradient(135deg, #ffe9ca, #ffe6c2);
            color: #524021;
        }

        /* Pastel Peach */
        .option:nth-child(2) .book-cover {
            background: linear-gradient(135deg, #fce6d5, #FFD8C2);
            color: #8C4A2F;
        }

        /* Pastel Mint */
        .option:nth-child(3) .book-cover {
            background: linear-gradient(135deg, #EAFBF2, #CFF4DF);
            color: #2F6F4E;
        }

        /* Pastel Lavender (only if you use 4 options) */
        .option:nth-child(4) .book-cover {
            background: linear-gradient(135deg, #F3ECFF, #DDD2FF);
            color: #5B4B8A;
        }

        .option:hover .book-cover::before {

            left: 140%;

        }

        /*==========================*/

        .cover-top {

            font-size: 20px;

        }

        .book-cover {
            box-shadow:
                0 8px 18px rgba(0, 0, 0, .12);
        }

        .option:hover .book-cover {
            box-shadow:
                0 12px 22px rgba(0, 0, 0, .18);
        }

        .cover-image {

            width: 140px;
            height: 100px;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .cover-image img {

            width: 100%;
            height: 100%;
            object-fit: contain;

            filter: drop-shadow(0 5px 8px rgba(0, 0, 0, .2));

        }

        .cover-title {

            font-size: 20px;

            font-weight: 500;

            text-align: center;

            line-height: 18px;

        }

        .cover-bottom {

            font-size: 9px;

            letter-spacing: 1px;
            opacity: .9;

        }

        /*==========================
      INSIDE PAGE
==========================*/

        .book-page {

            position: absolute;

            inset: 0;

            background: #fffdf5;

            border-radius: 18px;

            display: flex;

            overflow: hidden;

            box-shadow:
                0 15px 25px rgba(0, 0, 0, .18);

        }

        .page-left,
        .page-right {

            width: 50%;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 12px;

        }

        .page-left {

            background: #fffaf0;

            border-right: 2px dashed #ddd;

        }

        .page-left img {
            width: 80px;

            height: 80px;


            object-fit: contain;

        }

        .page-right {

            background: white;

        }

        .page-right h3 {

            font-size: 18px;

            margin-bottom: 8px;
            color: #2f4f4f;



        }

        .correct-msg {

            font-size: 18px;

            font-weight: bold;

            color: #28a745;

            margin-bottom: 12px;

        }

        .stars {

            font-size: 15px;

        }

        /*==========================
      OPEN BOOK
==========================*/

        .book.open .book-cover {

            transform:

                rotateY(-165deg);

            box-shadow:
                -10px 10px 25px rgba(0, 0, 0, .25);

        }


        .option:hover .book-cover {

            box-shadow:

                0 28px 45px rgba(0, 0, 0, .35);

        }

        /*==========================
        CORRECT
==========================*/

        .option.correct .book-page {

            background:

                linear-gradient(135deg,
                    #6c9f70,
                    #D8FFD8);

            border: 4px solid #4CAF50;

        }

        /*==========================
         WRONG
==========================*/

        @keyframes shakeBook {

            0% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-10px);
            }

            40% {
                transform: translateX(10px);
            }

            60% {
                transform: translateX(-10px);
            }

            80% {
                transform: translateX(10px);
            }

            100% {
                transform: translateX(0);
            }

        }

        .book.shake {

            animation: shakeBook .55s;

        }

        /*==========================
       DISABLED
==========================*/

        .option.disabled {

            opacity: .45;

            pointer-events: none;

        }

        /*==========================
      BOOK THICKNESS
==========================*/

        .book-cover::after {

            content: "";

            position: absolute;

            right: -8px;

            top: 10px;

            width: 10px;

            height: 90%;

            border-radius: 0 10px 10px 0;

            background:

                linear-gradient(to right,
                    rgba(255, 255, 255, .5),
                    rgba(0, 0, 0, .25));

        }

        .book-page {

            position: absolute;
            inset: 0;

            background: #fffdf5;

            border-radius: 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow:
                0 15px 25px rgba(0, 0, 0, .18);

            overflow: hidden;
        }

        /* Small highlight border for correct option */

        .option.correct .book {

            border: 3px solid #8FD694;
            /* pastel green */

            border-radius: 22px;

            filter: drop-shadow(0 0 10px rgba(143, 214, 148, .45));

            box-shadow:
                0 0 0 3px rgba(143, 214, 148, .20);
        }

        .correct-msg {
            font-size: 18px;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 12px;
        }

        .stars {
            font-size: 15px;
        }

        .page-right {

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 12px;

            text-align: center;

            background: #fff;

            padding: 15px;

        }

        .inside-img {

            width: 80px;
            height: 80px;

            object-fit: contain;

            margin-bottom: 8px;

        }

        .inside-title {

            font-size: 22px;
            font-weight: 500;

            color: #2f4f4f;

        }

        /*====================================================
                MOBILE (MAX-WIDTH:600PX)
====================================================*/

        @media screen and (max-width:600px) {

            body {

                overflow: hidden !important;

                align-items: center;

                padding: 8px;
                margin-top: 50px;

            }

            .quiz {

                width: 100%;

                max-width: 100%;

                padding: 10px;

                gap: 12px;

                margin-top: 0;

            }

            #question {

                font-size: 22px;

                line-height: 1.35;

                min-height: auto;

                text-align: left;

            }

            .question-image {

                margin-top: 0;

            }

            .question-image img {

                width: 220px;

                height: 140px;

            }

            .options {

                gap: 18px;

                flex-wrap: nowrap;

                justify-content: center;

            }

            .storybook {

                width: 88px;

                height: 118px;

            }

            .cover-image {

                width: 72px;

                height: 56px;

            }

            .cover-title {

                font-size: 13px;

                line-height: 15px;

            }

            .inside-img {

                width: 50px;

                height: 50px;

            }

            .inside-title {

                font-size: 13px;

            }

            .book-cover {

                padding: 10px;

                border-radius: 14px;

            }

            .book-page {

                border-radius: 14px;

            }

            .controls {

                gap: 50px;

                margin-top: 15px;

                margin-bottom: 10px;

            }

            .controls button {

                width: 110px;

                height: 46px;

                font-size: 15px;

                border-radius: 14px;

            }

            .kid-card {

                width: 260px;

                padding: 20px;

            }

            .kid-icon {

                font-size: 55px;

            }

            .kid-card h3 {

                font-size: 28px;

            }

            .kid-card p {

                font-size: 18px;

            }

            .final-kid-box {

                width: 290px;

                padding: 22px;

                border-radius: 24px;

            }

            .final-kid-box h2 {

                font-size: 28px;

            }

            .final-kid-box p {

                font-size: 18px;

            }

            #stars {

                font-size: 28px;

            }

            .playAgain-btn {

                font-size: 16px;

                padding: 12px 22px;

            }

        }

         @media screen and (min-width:900px) and (max-width:1075px) {
           #question {
            font-size: 30px;
           }
         }

        /*=========================================
          LAPTOP (1366px - 1599px)
=========================================*/

        @media (min-width:1366px) {

            .quiz {

                width: min(1300px, 90vw);

            }

            #question {

                font-size: 40px;

            }

            .question-image img {

                width: 540px;

                height: 320px;

            }

            .options {

                gap: 220px;

            }

            .storybook {

                width: 165px;

                height: 215px;

            }

            .cover-image {

                width: 145px;

                height: 120px;

            }

            .cover-title {

                font-size: 24px;

            }

            .inside-img {

                width: 100px;

                height: 100px;

            }

            .inside-title {

                font-size: 26px;

            }

            .controls {

                gap: 420px;

            }

            .controls button {

                width: 165px;

                height: 62px;

                font-size: 22px;

            }

            .kid-card {

                width: 380px;

            }

            .final-kid-box {

                width: 520px;

            }

        }

        /*=========================================
          LARGE MONITOR
=========================================*/

        @media (min-width:1600px) {

            .quiz {

                width: min(1300px, 90vw);

            }

            #question {

                font-size: 40px;

            }

            .question-image img {

                width: 540px;

                height: 320px;

            }

            .options {

                gap: 220px;

            }

            .storybook {

                width: 165px;

                height: 215px;

            }

            .cover-image {

                width: 145px;

                height: 120px;

            }

            .cover-title {

                font-size: 24px;

            }

            .inside-img {

                width: 100px;

                height: 100px;

            }

            .inside-title {

                font-size: 26px;

            }

            .controls {

                gap: 420px;

            }

            .controls button {

                width: 165px;

                height: 62px;

                font-size: 22px;

            }

            .kid-card {

                width: 380px;

            }

            .final-kid-box {

                width: 520px;

            }

        }

        .book.open .book-cover {
            transform: rotateY(-180deg);
            opacity: 0;
        }

        /* ==========================================
   LARGE MONITOR POPUPS ONLY
   ========================================== */
        @media screen and (min-width:1600px) {

            /* Correct / Wrong Popup */
            .kid-card {
                width: 460px;
                padding: 38px;
                border-radius: 34px;
            }

            .kid-icon {
                font-size: 100px;
                margin-bottom: 16px;
            }

            .kid-card h3 {
                font-size: 46px;
            }

            .kid-card p {
                font-size: 28px;
            }

            /* Final Popup */
            .final-kid-box {
                width: 620px;
                padding: 45px;
                border-radius: 40px;
            }

            .final-kid-box h2 {
                font-size: 52px;
            }

            .final-kid-box p {
                font-size: 30px;
            }

            #stars {
                font-size: 52px;
                margin: 18px 0;
            }

            .playAgain-btn {
                width: 240px;
                height: 68px;
                font-size: 26px;
                border-radius: 34px;
            }

        }
    </style>

    <style id="codex-responsive-shell">
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            max-width: 100%;
            overflow: hidden;
        }

        img,
        svg,
        canvas,
        video {
            max-width: 100%;
        }

        iframe {
            display: block;
            max-width: 100%;
        }

        body:has(iframe) {
            width: 100%;
            height: 100svh;
            min-height: 100svh;
            overflow: hidden;
        }

        body:has(iframe) .app,
        body:has(iframe) .frame,
        body:has(iframe) .board {
            max-width: 100%;
            max-height: 100svh;
            min-height: 0;
        }

        body:has(iframe) .app {
            height: 100svh;
        }

        body:has(iframe) .board {
            width: min(1250px, calc(100vw - 16px));
            height: min(570px, calc(100svh - 16px));
        }

<body>

    <div class="quiz">

        <div class="quiz-layout">

            <div class="header">

                <h2 id="question"></h2>

                <div class="question-image">

                    <img id="questionImg">

                </div>

            </div>

            <div class="options" id="options"></div>

        </div>

        <div class="controls">

            <button class="prev" id="prevBtn">

                <i class="fa-solid fa-circle-arrow-left"></i>

                Prev

            </button>

            <button class="next" id="nextBtn">

                Next

                <i class="fa-solid fa-circle-arrow-right"></i>

            </button>

        </div>

    </div>

    <!-- POPUP -->

    <div id="answerPopup" class="kid-popup">

        <div class="kid-card">

            <div class="kid-icon" id="popupIcon"></div>

            <h3 id="popupTitle"></h3>

            <p id="popupMsg"></p>

        </div>

    </div>

    <!-- FINAL -->

    <div id="finalPopup">

        <div class="final-kid-box">

            <h2>Congratulations!</h2>

            <p id="finalScore"></p>

            <div id="stars"></div>

            <button class="playAgain-btn" onclick="location.reload()">

                Play Again

            </button>

        </div>

    </div>

    <!-- AUDIO -->

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>

    <audio id="wrongSound"
        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
        const quizData = [

            {
                q: "Q1. The higher we go, the ________ we feel.",
                img: "../images/mcq1.png",
                options: [
                    "../images/cooler.png|Cooler",
                    "../images/hotter.png|Hotter",
                    "../images/warmer.png|Warmer"
                ],
                a: 0
            },

            {
                q: "Q2. Light and cold winds are called ________.",
                img: "../images/mcq2.png",
                options: [
                    "../images/Stormak.png|Storm",
                    "../images/Breezeak.png|Breeze",
                    "../images/loo.png|Loo"
                ],
                a: 1
            },

            {
                q: "Q3. The Earth has been divided into ________ major climatic zones.",
                img: "../images/mcq3.png",
                options: [
                    "../images/second.png|Two",
                    "../images/first.png|One",
                    "../images/third.png|Three"
                ],
                a: 2
            },

            {
                q: "Q4. The region closest to the equator falls under ________ Zone.",
                img: "../images/mcq4.png",
                options: [
                    "../images/torrid.png|Torrid",
                    "../images/temperate.png|Temperate",
                    "../images/frigid.png|Frigid"
                ],
                a: 0
            },

            {
                q: "Q5. The ________ Zone is the farthest from the equator and it receives slanting sunrays.",
                img: "../images/mcq5.png",
                options: [
                    "../images/temperate.png|Temperate",
                    "../images/torrid.png|Torrid",
                    "../images/frigid.png|Frigid"
                ],
                a: 2
            }

        ];
        let current = 0;
        let score = 0;
        let answered = Array(quizData.length).fill(null);

        const qEl = document.getElementById("question");
        const imgEl = document.getElementById("questionImg");
        const optEl = document.getElementById("options");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        function speak(t) {

            speechSynthesis.cancel();

            const msg =
                new SpeechSynthesisUtterance(t);

            msg.lang = "en-UK";
            msg.volume = 0.25;
            msg.rate = 1;
            msg.pitch = 1;

            speechSynthesis.speak(msg);
        }

        function smallConfetti() {

            confetti({
                particleCount: 40,
                spread: 70,
                origin: { y: 0.7 }
            });

        }

        function bigConfetti() {

            const duration = 100;
            const end = Date.now() + duration;

            (function frame() {

                confetti({
                    particleCount: 7,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });

                confetti({
                    particleCount: 7,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end)
                    requestAnimationFrame(frame);

            })();
        }

        function loadQuestion() {

            const q = quizData[current];

            qEl.textContent = q.q;

            imgEl.src = q.img;

            optEl.innerHTML = "";

            nextBtn.disabled =
                answered[current] === null;

            q.options.forEach((t, i) => {

                const d =
                    document.createElement("div");

                d.className = "option";

                const img = t.split("|")[0];
                const text = t.split("|")[1];
                d.innerHTML = `

<div class="storybook">

    <!-- Book Cover -->
    <div class="book">

        <!-- Front Cover -->
        <div class="book-cover">


            <div class="cover-image">
                <img src="${img}" alt="">
            </div>

            <div class="cover-title">
                ${text}
            </div>

            <div class="cover-bottom">
               
            </div>

        </div>

        <!-- Inside Book -->
   <div class="book-page">

    <div class="page-right">

        <img src="${img}" class="inside-img" alt="">

        <div class="inside-title">
            ${text}
        </div>

    </div>

</div>

    </div>

</div>

`;

                if (answered[current] !== null) {

                    if (i === q.a)
                        d.classList.add("correct");

                    else
                        d.classList.add("disabled");

                }

                d.onclick = () => {

                    if (answered[current] !== null) return;

                    const book = d.querySelector(".book");

                    /* ==========================
                            CORRECT ANSWER
                    ========================== */

                    if (i === q.a) {

                        answered[current] = i;

                        score++;

                        d.classList.add("correct");

                        // Open Story Book
                        book.classList.add("open");

                        // Disable other books
                        [...optEl.children].forEach(option => {

                            if (option !== d) {

                                option.classList.add("disabled");

                            }

                        });

                        speak("Correct");

                        smallConfetti();

                        showPopup(true);

                        nextBtn.disabled = false;

                        if (answered.every(a => a !== null)) {

                            setTimeout(showFinal, 1800);

                        }

                    }

                    /* ==========================
                            WRONG ANSWER
                    ========================== */

                    else {

                        book.classList.add("shake");

                        showPopup(false);

                        speak("Try Again");

                        document.getElementById("wrongSound").play();

                        setTimeout(() => {

                            book.classList.remove("shake");

                        }, 600);

                    }

                };

                optEl.appendChild(d);

            });

            prevBtn.disabled = current === 0;

        }

        prevBtn.onclick = () => {

            current--;

            loadQuestion();

        };

        nextBtn.onclick = () => {

            current++;

            loadQuestion();

        };

        function showPopup(isCorrect) {

            const popup =
                document.getElementById("answerPopup");

            const icon =
                document.getElementById("popupIcon");

            const title =
                document.getElementById("popupTitle");

            const msg =
                document.getElementById("popupMsg");

            popup.className =
                "kid-popup " +
                (isCorrect ? "kid-correct" : "kid-wrong");

            popup.style.display = "flex";

            if (isCorrect) {

                icon.textContent = "👍";

                title.textContent = "Good";

                msg.textContent = "Correct choice.";

            } else {

                icon.textContent = "👎";

                title.textContent = "Retry";

                msg.textContent = "Pick again.";

            }

            setTimeout(() => {

                popup.style.display = "none";

            }, 1400);

        }

        function showFinal() {

            const popup =
                document.getElementById("finalPopup");

            document.getElementById("finalScore")
                .textContent =

                `Your Score: ${score} / ${quizData.length}`;

            document.getElementById("stars")
                .textContent = "⭐".repeat(score);

            popup.style.display = "flex";

            bigConfetti();

        }
        function sparkle(book) {

            const star = document.createElement("div");

            star.className = "magic-stars";

            star.innerHTML = "✨⭐✨";

            book.appendChild(star);

            setTimeout(() => {

                star.remove();

            }, 1200);

        }
        loadQuestion();

    </script>

    <script id="codex-viewport-fit">
        (function () {
            if (window.__codexViewportFit) return;
            window.__codexViewportFit = true;

            const hasIframe = Boolean(document.querySelector("iframe"));
            const selectors = [
                ".main",
                ".main-container",
                ".quiz",
                ".quiz-container",
                ".quiz-box",
                ".container",
                ".stage",
                ".screen",
                ".game",
                ".template",
                ".quiz-card",
                ".app"
            ];
            const minScale = 0.62;
            let rafId = 0;

            function setViewportRules() {
                document.documentElement.style.width = "100%";
                document.documentElement.style.height = "100%";
                document.documentElement.style.overflow = "hidden";
                document.body.style.width = "100%";
                document.body.style.height = "100svh";
                document.body.style.minHeight = "100svh";
                document.body.style.overflow = "hidden";
            }

            function getStage() {
                for (const selector of selectors) {
                    const stage = document.querySelector(selector);
                    if (stage) return stage;
                }
                return null;
            }

            function fitToViewport() {
                setViewportRules();
                if (hasIframe) return;

                const stage = getStage();
                if (!stage) return;

                stage.style.transform = "scale(1)";
                stage.style.transformOrigin = "center center";

                const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                const rect = stage.getBoundingClientRect();
                const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                const scale = Math.max(
                    minScale,
                    Math.min(
                        1,
                        (viewportWidth - breathingRoom * 2) / contentWidth,
                        (viewportHeight - breathingRoom * 2) / contentHeight
                    )
                );

                stage.style.transform = `scale(${scale})`;
            }

            function requestFit() {
                cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(fitToViewport);
            }

            window.addEventListener("load", requestFit);
            window.addEventListener("resize", requestFit);
            window.addEventListener("orientationchange", requestFit);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(requestFit).catch(function () { });
            }

            document.querySelectorAll("img").forEach(function (img) {
                img.addEventListener("load", requestFit, { once: false });
            });

            if ("ResizeObserver" in window) {
                const observer = new ResizeObserver(requestFit);
                const observeStage = function () {
                    const stage = getStage();
                    if (stage) observer.observe(stage);
                };
                observeStage();
                window.addEventListener("load", observeStage);
            }

            if (document.body) {
                new MutationObserver(requestFit).observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }

            requestFit();
        })();
    </script>
</body>
