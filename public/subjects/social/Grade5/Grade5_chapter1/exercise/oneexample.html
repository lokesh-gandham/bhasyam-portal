    <style>
        * {
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
            font-weight: normal;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;

        }

        .main {
            width: 100%;
            max-width: 1200px;
        }

        /* QUESTION */
        .question {
            max-width: 1200px;
            width: 100%;
            margin-top: -20px;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 20px;

            font-size: 30px;
            line-height: 1.5;

            color: #2f4f4f;

            text-align: left;

            /* ✅ FIXED HEIGHT */
            /* height: 80px; */

            overflow: hidden;
        }

        /* IMAGE */
        /* 🌟 QUESTION IMAGE */
        .image-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            position: relative;
        }

        /* ✨ IMAGE DESIGN */
        .image-box img {

            width: 220px;
            height: 220px;

            object-fit: contain;

            position: relative;
            z-index: 2;

            animation: floatImage 2.5s ease-in-out infinite;
        }


        /* ANSWER AREA */
        /* 🌈 ANSWER AREA */
        .answer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 30px;
        }

        .answer-box {

            position: relative;

            display: flex;
            align-items: center;
            gap: 14px;

            width: 480px;
            max-width: 95%;

            padding: 12px;

            border-radius: 30px;

            background: linear-gradient(135deg,
                    #eef9ff,
                    #dff6ff);

            border: 4px solid #ffffff;

            box-shadow:
                0 10px 0 #bde0fe,
                0 18px 28px rgba(0, 0, 0, .12);

            transition: .35s;
        }

        .answer-box:hover {

            transform: translateY(-3px);

            box-shadow:
                0 12px 0 #bde0fe,
                0 24px 35px rgba(0, 0, 0, .15);

        }

        .answer-box input {

            flex: 1;

            height: 60px;

            border: none;
            outline: none;

            border-radius: 18px;

            background: #ffffff;

            border: 3px solid #cde9ff;

            padding: 0 18px;

            font-size: 22px;

            color: #24445c;
            font-weight: 500;
            transition: .3s;
            text-transform: capitalize;
        }

        .answer-box input:focus {

            border-color: #6c63ff;

            box-shadow: 0 0 0 6px rgba(108, 99, 255, .15);

        }

        .answer-box input::placeholder {

            color: #9aa8b7;

        }

        /* 🚀 BUTTON */
        .answer-box button {

            width: 135px;

            height: 60px;

            border: none;

            border-radius: 18px;

            background: linear-gradient(135deg,
                    #d7d7d7,
                    #bfbfbf);

            color: #ffffff;

            font-size: 18px;

            font-weight: 500;

            cursor: not-allowed;

            transition: .35s;

            box-shadow: none;
        }


        /* DISABLED */
        .answer-box button:disabled {
            background: #d9d9d9;
            color: #777;
            cursor: not-allowed;
            box-shadow: none;
        }

        .answer-box button:not(:disabled) {

            cursor: pointer;

            background: #009688;

            color: #fff;

            box-shadow:
                0 10px 20px rgba(0, 150, 136, .35);

        }

        .answer-box button:not(:disabled):hover {

            transform: translateY(-4px) scale(1.05);

            box-shadow:
                0 14px 24px rgba(95, 39, 255, .45);

        }

        .answer-box button:disabled {

            background: linear-gradient(135deg,
                    #d9d9d9,
                    #c5c5c5);

            color: #888;

            opacity: 1;

            cursor: not-allowed;

            box-shadow: none;

        }

        .answer-box input.correct {

            background: #e8fff1;

            border: 3px solid #34c759;

            color: #18794e;

            font-weight: 500;

        }

        /* ✅ CORRECT */
        .correct {
            background: #d8f3dc !important;
            border: 3px solid #38b000 !important;
            color: #1b4332 !important;
        }

        /* 📱 MOBILE */
        @media(max-width:768px) {

            .answer-box {
                width: 100%;
                padding: 10px;
                border-radius: 22px;
            }

            .answer-box input {
                height: 48px;
                font-size: 17px;
            }

            .answer-box button {
                height: 48px;
                padding: 0 14px;
                font-size: 14px;
            }

        }

        /* CORRECT INPUT */
        .correct {

            color: #2d6a4f;
        }

        /*==========================
      NAV BUTTONS
==========================*/

        .controls {

            display: flex;

            justify-content: center;

            gap: 220px;

            margin-top: 40px;

        }

        .controls button {

            width: 130px;

            height: 54px;

            border: none;

            border-radius: 18px;

            color: #fff;

            font-size: 18px;

            font-weight: 400;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            transition: .3s;

        }

        .controls button::before {

            content: "";

            position: absolute;

            top: -30px;

            left: -70px;

            width: 50px;

            height: 140px;

            background: rgba(255, 255, 255, .35);

            transform: rotate(25deg);

            transition: .5s;

        }

        .controls button:hover::before {

            left: 140%;

        }

        .controls button:hover:not(:disabled) {

            transform: translateY(-5px) scale(1.05);

        }

        .prev {

            background: linear-gradient(135deg,
                    #74c0fc,
                    #4dabf7,
                    #3b82f6);

            box-shadow: 0 10px 18px rgba(59, 130, 246, .35);

        }

        .next {

            background: linear-gradient(135deg,
                    #f9a8d4,
                    #c77dff,
                    #9d4edd);

            box-shadow: 0 10px 18px rgba(157, 78, 221, .35);

        }

        .controls button:active {

            transform: scale(.92);

        }

        .controls button:disabled {

            opacity: .4;

            cursor: not-allowed;

        }

        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .kid-card {
            background: #ffffff;
            width: 320px;
            padding: 25px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 0 #ffd966,
                0 25px 40px rgba(0, 0, 0, 0.2);
            animation: kidPop 0.6s ease;
        }

        .kid-icon {
            font-size: 4.5em;
            margin-bottom: 10px;
            animation: emojiBounce 0.9s infinite alternate;
        }

        .kid-card h3 {
            font-size: 2em;
            margin-bottom: 8px;
        }

        .kid-card p {
            font-size: 1.2em;
        }

        .kid-correct .kid-card {
            background: #e6fffa;
            border: 6px solid #38d9a9;
        }

        .kid-wrong .kid-card {
            background: #fff5f5;
            border: 6px solid #ffa8a8;
        }

        @keyframes kidPop {
            0% {
                transform: scale(.3) rotate(-10deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.1) rotate(5deg);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }
  #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;

            z-index: 4000;

        @keyframes finalBounce {

            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);

        .image-box img {

            -webkit-user-drag: none;

            user-select: none;

            pointer-events: none;

        }

        @media screen and (min-width:900px) and (max-width:1075px) {

    <script>

        /* =========================
           QUESTIONS

        /* =========================

        const questions = [

            {
                q: "Q1. This zone is also known as the cold zone.",
                a: ["Frigid Zone"],
                img: "../images/ow1.png"
            },

            {
                q: "Q2. This zone lies between the equator and the Tropic of Cancer.",
                a: ["North Torrid Zone"],
                img: "../images/ow2.png"
            },

            {
                q: "Q3. This zone has a moderate climate.",
                a: ["Temperate Zone"],
                img: "../images/ow3.png"
            },

            {
                q: "Q4. It has wet and dry season but does not experience all four seasons.",
                a: ["Torrid Zone"],
                img: "../images/ow4.png"
            },

            {
                q: "Q5. It is the mix of events that happen every day in our atmosphere at a particular place and time.",
                a: ["Weather"],
                img: "../images/ow5.png"
            }

        ];
        /* =========================
           VARIABLES
        ========================= */

        let index = 0;

        let score = 0;

        let answered = questions.map(q => new Array(q.a.length).fill(false));
        let quizEnded = false;
        /* =========================
           ELEMENTS
        ========================= */

        const qEl = document.getElementById("question");

        const img = document.getElementById("image");

        const letters = document.getElementById("letters");

        const nextBtn = document.getElementById("nextBtn");

        const prevBtn = document.getElementById("prevBtn");

        /* =========================
           UK SPEECH
        ========================= */
        function speak(text) {

            window.speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-UK";

            speech.rate = 1;

            speech.pitch = 1;

            speech.volume = 0.25;

            speechSynthesis.speak(speech);

        }

        /* =========================
           NORMALIZE
        ========================= */

        function normalize(text) {

            return text
                .toLowerCase()
                .trim()
                .replace(/\s+/g, " ");

        }

        /* =========================
           LOAD QUESTION
        ========================= */

        function load() {

            let q = questions[index];

            qEl.textContent = q.q;

            img.src = q.img;

            letters.innerHTML = "";

            for (let i = 0; i < q.a.length; i++) {

                let box = document.createElement("div");

                box.className = "answer-box";

                let input = document.createElement("input");

                let btn = document.createElement("button");

                btn.textContent = "Submit";

                btn.disabled = true;

                /* ENABLE BUTTON */
              input.addEventListener("input", () => {
    let value = input.value;

    if (value.length > 0) {
        value = value.charAt(0).toUpperCase() + value.slice(1).toLowerCase();

        if (input.value !== value) {
            const pos = input.selectionStart;
            input.value = value;
            input.setSelectionRange(pos, pos);
        }
    }

    btn.disabled = input.value.trim() === "";
});

                /* CHECK ANSWER */
                btn.onclick = () => {

                    let user = normalize(input.value);

                    let correct = normalize(q.a[i]);

                    if (user === correct) {

                        answered[index][i] = true;

                        input.readOnly = true;

                        input.classList.add("correct");

                        btn.disabled = true;

                        /* CONFETTI */
                        confetti({
                            particleCount: 100,
                            spread: 70,
                            origin: { y: 0.6 }
                        });

                        /* SPEECH */
                        speak("Correct");

                        /* POPUP */
                        showPopup(true);

                        /* CHECK ALL ANSWERED */
                        let allDone = answered[index].every(v => v === true);

                        if (allDone) {

                            score++;

                            nextBtn.disabled = false;

                            /* FINAL */
                            if (index === questions.length - 1) {

                                setTimeout(() => {
                                    showFinal();
                                }, 1400);

                            }

                        }

                    } else {

                        /* SPEECH */
                        speak("Try again");

                        /* POPUP */
                        showPopup(false);

                        input.value = "";

                        btn.disabled = true;

                    }

                };

                box.appendChild(input);

                box.appendChild(btn);

                letters.appendChild(box);

            }

            /* RESTORE */
            let inputs = letters.querySelectorAll("input");

            let buttons = letters.querySelectorAll("button");

            inputs.forEach((inp, i) => {

                if (answered[index][i]) {

                    inp.value = questions[index].a[i]
    .charAt(0).toUpperCase() +
    questions[index].a[i].slice(1).toLowerCase();

                    inp.readOnly = true;

                    inp.classList.add("correct");

                    buttons[i].disabled = true;

                }

            });
            /* NAV BUTTON STATE */
            prevBtn.disabled = (index === 0);
            nextBtn.disabled = !answered[index].every(v => v === true);

        }

        /* =========================
           POPUP
        ========================= */
        function showPopup(isCorrect) {

            const popup = document.getElementById("answerPopup");
            const icon = document.getElementById("popupIcon");
            const title = document.getElementById("popupTitle");
            const msg = document.getElementById("popupMsg");

            popup.className =
                "kid-popup " +
                (isCorrect ? "kid-correct" : "kid-wrong");

            popup.style.display = "flex";

            if (isCorrect) {

                icon.innerHTML = "👍";

                title.innerHTML = "Good";

                msg.innerHTML = "Correct choice.";

            }
            else {

                icon.innerHTML = "👎";

                title.innerHTML = "Retry";

                msg.innerHTML = "Pick again.";

            }

            setTimeout(() => {

                popup.style.display = "none";

            }, 1400);

        }

        /* =========================
           FINAL POPUP
        ========================= */
        function showFinal() {

            prevBtn.disabled = true;
            nextBtn.disabled = true;

            document.getElementById("finalScore").innerHTML =
                `Your Score: <b>${score}</b> / <b>${questions.length}</b>`;

            let stars = "";

            if (score === questions.length) {

                stars = "⭐⭐⭐⭐⭐";

            }
            else if (score >= 4) {

                stars = "⭐⭐⭐⭐";

            }
            else if (score >= 3) {

                stars = "⭐⭐⭐";

            }
            else if (score >= 2) {

                stars = "⭐⭐";

            }
            else {

                stars = "⭐";

            }

            document.getElementById("stars").innerHTML = stars;

            document.getElementById("finalPopup").style.display = "flex";

            bigConfetti();

        }
        /* =========================
           NAVIGATION
        ========================= */
        nextBtn.onclick = () => {

            if (quizEnded) return;

            if (index < questions.length - 1) {

                index++;

                load();

            }

        };
        prevBtn.onclick = () => {

            if (quizEnded) return;

            if (index > 0) {

                index--;

                load();

            }

        };

        /* =========================
           RESTART
        ========================= */

        function restartQuiz() {

            index = 0;

            score = 0;

            answered = questions.map(
                q => new Array(q.a.length).fill(false)
            );

            document.getElementById("finalPopup").style.display = "none";

            load();

        }

        /* =========================
           START
        ========================= */

        window.speechSynthesis.onvoiceschanged = () => {

            load();

        };

    </script>

    <script id="codex-viewport-fit">
        (function () {
            if (window.__codexViewportFit) return;
            window.__codexViewportFit = true;

            const hasIframe = Boolean(document.querySelector("iframe"));
            const selectors = [
                ".main",
                ".main-container",
                ".quiz",
                ".quiz-container",
                ".quiz-box",
                ".container",
                ".stage",
                ".screen",
                ".game",
                ".template",
                ".quiz-card",
                ".app"
            ];
            const minScale = 0.62;
            let rafId = 0;

            function setViewportRules() {
                document.documentElement.style.width = "100%";
                document.documentElement.style.height = "100%";
                document.documentElement.style.overflow = "hidden";
                document.body.style.width = "100%";
                document.body.style.height = "100svh";
                document.body.style.minHeight = "100svh";
                document.body.style.overflow = "hidden";
            }

            function getStage() {
                for (const selector of selectors) {
                    const stage = document.querySelector(selector);
                    if (stage) return stage;
                }
                return null;
            }

            function fitToViewport() {
                setViewportRules();
                if (hasIframe) return;

                const stage = getStage();
                if (!stage) return;

                stage.style.transform = "scale(1)";
                stage.style.transformOrigin = "center center";

                const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                const rect = stage.getBoundingClientRect();
                const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                const scale = Math.max(
                    minScale,
                    Math.min(
                        1,
                        (viewportWidth - breathingRoom * 2) / contentWidth,
                        (viewportHeight - breathingRoom * 2) / contentHeight
                    )
                );

                stage.style.transform = `scale(${scale})`;
            }

            function requestFit() {
                cancelAnimationFrame(rafId);
                rafId = requestAnimationFrame(fitToViewport);
            }

            window.addEventListener("load", requestFit);
            window.addEventListener("resize", requestFit);
            window.addEventListener("orientationchange", requestFit);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(requestFit).catch(function () { });
            }

            document.querySelectorAll("img").forEach(function (img) {
                img.addEventListener("load", requestFit, { once: false });
            });

            if ("ResizeObserver" in window) {
                const observer = new ResizeObserver(requestFit);
                const observeStage = function () {
                    const stage = getStage();
                    if (stage) observer.observe(stage);
                };
                observeStage();
                window.addEventListener("load", observeStage);
            }

            if (document.body) {
                new MutationObserver(requestFit).observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }

            requestFit();
        })();
    </script>
