    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
            font-weight: normal;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;

        }

        /* MAIN */
        .quiz-container {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* QUESTION */
        .question {
            max-width: 1200px;
            width: 100%;
            margin-top: -20px;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 20px;

            font-size: 30px;
            line-height: 1.5;

            color: #2f4f4f;

            text-align: left;

            /* ✅ FIXED HEIGHT */


            overflow: hidden;
        }

        /* IMAGE */
        .image {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .image img {
            width: 100%;
            max-width: 400px;
            height: 200px;
            object-fit: contain;
        }

        /* OPTIONS */
        .options {
            display: flex;
            justify-content: center;
            gap: 45px;
            flex-wrap: wrap;
            width: 100%;
        }

        /* PLAYFUL CARD */
        .card {
            position: relative;

            width: 180px;
            height: 150px;

            border-radius: 35px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: 0.3s;

            overflow: hidden;

            border: 5px solid white;

            box-shadow:
                0 10px 22px rgba(0, 0, 0, 0.12);
        }

        /* TRUE */
        /* 🌟 TRUE CARD */
        /* ✅ TRUE CARD */
        .true-card {

            background: #52b788;

            box-shadow:
                0 10px 0 #40916c,
                0 18px 25px rgba(0, 0, 0, 0.15);

        }

        /* ✅ FALSE CARD */
        .false-card {

            background: #ff8fa3;

            box-shadow:
                0 10px 0 #e85d75,
                0 18px 25px rgba(0, 0, 0, 0.15);

        }

        /* TEXT */
        .true-card,
        .false-card {
            color: white;
            font-weight: 700;
        }

        /* TEXT */
        .true-card .label,
        .false-card .label {
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        /* ICON */
        .true-card .icon,
        .false-card .icon {
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.2));
        }

        /* ICON */
        .icon {
            font-size: 65px;
            margin-bottom: 12px;
        }

        /* TEXT */
        .label {
            font-size: 34px;
            color: #2f4f4f;
        }

        /* CORRECT */
        .correct-answer {
            border: 3px solid #38b000;
            box-shadow:
                0 0 30px #38b000;
        }

        /* WRONG */
        .wrong-answer {
            border: 3px solid #d00000;
            box-shadow:
                0 0 25px #ff4d4d;
        }

        /* NAV */
        /*==========================
      NAV BUTTONS
==========================*/

        .nav-buttons {

            display: flex;

            justify-content: center;

            gap: 220px;

            margin-top: 35px;
        }

        .nav-buttons button {

            width: 130px;

            height: 54px;

            border: none;

            border-radius: 18px;

            color: #fff;

            font-size: 18px;

            font-weight: 400;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            cursor: pointer;

            transition: .3s;
        }

        .nav-buttons button:hover:not(:disabled) {

            transform: translateY(-4px) scale(1.05);
        }

        .prev {

            background: linear-gradient(135deg,
                    #74c0fc,
                    #4dabf7,
                    #3b82f6);

            box-shadow: 0 10px 18px rgba(59, 130, 246, .35);
        }

        .next {

            background: linear-gradient(135deg,
                    #f9a8d4,
                    #c77dff,
                    #9d4edd);

            box-shadow: 0 10px 18px rgba(157, 78, 221, .35);
        }

        .nav-buttons button:disabled {

            opacity: .4;

            cursor: not-allowed;
        }

        /* POPUP */

        .kid-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .kid-card {
            background: #ffffff;
            width: 320px;
            padding: 25px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 0 #ffd966,
                0 25px 40px rgba(0, 0, 0, 0.2);
            animation: kidPop 0.6s ease;
        }

        .kid-icon {
            font-size: 4.5em;
            margin-bottom: 10px;
            animation: emojiBounce 0.9s infinite alternate;
        }

        .kid-card h3 {
            font-size: 2em;
            margin-bottom: 8px;

        }

        .kid-card p {
            font-size: 1.2em;

        }

        .kid-correct .kid-card {
            background: #e6fffa;
            border: 6px solid #38d9a9;
        }

        .kid-wrong .kid-card {
            background: #fff5f5;
            border: 6px solid #ffa8a8;
        }

        @keyframes kidPop {
            0% {
                transform: scale(.3) rotate(-10deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.1) rotate(5deg);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes emojiBounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-15px);
            }
        }

      #finalPopup {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .final-kid-box {
            background: linear-gradient(135deg,
                    #fff7d6,
                    #e6fff5);

            padding: 30px 35px;

            border-radius: 35px;

            text-align: center;

            width: 450px;

            animation: finalBounce .8s ease;

            box-shadow:
                0 20px 0 #ffd43b,
                0 30px 50px rgba(0, 0, 0, .2);
        }

        .final-kid-box h2 {
            font-size: 2.2em;
            color: #2f9e44;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .final-kid-box p {
            font-size: 1.3em;

        }

        #stars {
            font-size: 2.3em;
            margin: 12px 0;
        }

        .playAgain-btn {
            background: #ffac30;
            color: white;
            border: none;
            padding: 14px 34px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 400;
            cursor: pointer;
            margin-top: 12px;
        }

        @keyframes finalBounce {
            0% {
                transform: scale(.3);
                opacity: 0;
            }

            60% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }


        /*=============================
      TRUE FALSE BUTTONS
==============================*/

        .options {

            display: flex;

            justify-content: center;

            gap: 45px;

            margin-top: 30px;

            flex-wrap: wrap;

        }

        .tf-card {

            position: relative;

            width: 280px;

            height: 80px;

            background: #fff;

            border-radius: 28px;

            display: flex;

            align-items: center;

            padding: 0 25px;

            cursor: pointer;

            transition: .35s;

            overflow: hidden;

            box-shadow:
                0 12px 25px rgba(125, 92, 255, .12),
                0 5px 12px rgba(0, 0, 0, .08);

        }

        .tf-card:hover {

            transform: translateY(-8px);

        }

        /*=====================
TRUE
======================*/

        .true-card {

            border: 2px solid #8BE36B;

        }

        /*=====================
FALSE
======================*/

        .false-card {

            border: 2px solid #FF97B2;

        }

        /*=====================
HEXAGON
======================*/

        .hex {

            width: 60px;

            height: 60px;

            clip-path: polygon(25% 6%,
                    75% 6%,
                    100% 50%,
                    75% 94%,
                    25% 94%,
                    0 50%);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 45px;

            color: white;

            font-weight: bold;

            flex-shrink: 0;

            box-shadow: 0 12px 20px rgba(0, 0, 0, .15);

        }

        .trueHex {

            background: linear-gradient(180deg, #97F56C, #57D931);

        }

        .falseHex {

            background: linear-gradient(180deg, #FF7299, #FF3D74);

        }

        /*=====================
TEXT
======================*/

        .tfText {

            margin-left: 35px;

            font-size: 35px;

            font-weight: 500;

            color: #2f4f4f;

        }

        /*=====================
DECORATION
======================*/

        .bubble {

            position: absolute;

            border-radius: 50%;

            opacity: .45;

        }

        .true-card .bubble {

            background: #7DE15A;

        }

        .false-card .bubble {

            background: #FF8EAF;

        }

        .b1 {

            width: 18px;

            height: 18px;

            right: 25px;

            bottom: 35px;

        }

        .b2 {

            width: 10px;

            height: 10px;

            right: 55px;

            bottom: 18px;

        }

        .b3 {

            width: 26px;

            height: 26px;

            right: -6px;

            bottom: -6px;

        }

        /*=====================
CORRECT
======================*/

        .correct-answer {

            border: 4px solid #2ECC71 !important;

            box-shadow:

                0 0 30px rgba(46, 204, 113, .55);

        }

        /*=====================
WRONG
======================*/

        .wrong-answer {

            border: 4px solid #FF4B6E !important;

            box-shadow:

                0 0 30px rgba(255, 75, 110, .45);

        }

        /* Selected Correct */
        .correct-answer {
            border: 4px solid #2ECC71 !important;
            box-shadow: 0 0 25px rgba(46, 204, 113, .6);
            transform: scale(1.03);
        }

        /* Disabled cards */
        .tf-card.disabled {
            pointer-events: none;
            opacity: .45;
            filter: grayscale(100%);
            cursor: not-allowed;
        }

        /* Keep the selected correct card bright */
        .tf-card.correct-answer {
            opacity: 1 !important;
            filter: none !important;
        }

    <style id="codex-responsive-shell">

            width: 100%;

            display: block;

            height: 100svh;
            min-height: 100svh;
            overflow: hidden;
        }

        body:has(iframe) .app,
        body:has(iframe) .frame,
        body:has(iframe) .board {
            max-width: 100%;
            max-height: 100svh;
            min-height: 0;
        }

        body:has(iframe) .app {
            height: 100svh;
        }

        body:has(iframe) .board {
            width: min(1250px, calc(100vw - 16px));
            height: min(570px, calc(100svh - 16px));
        }

        body:has(iframe) .content,
        body:has(iframe) .main,
        body:has(iframe) .screen,
        body:has(iframe) .iframe-wrapper {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        body:has(iframe) iframe {

            border: 0;
        }

            body:has(iframe) .nav-btn,

        }

        @media (min-width: 1025px) and (max-height: 760px) {

            }

            body:has(iframe) .nav-btn,
            body:has(iframe) .puzzle,
            body:has(iframe) .island-btn,
            body:has(iframe) .btn {
                padding: clamp(8px, 1.4dvh, 14px) clamp(10px, 1.4vw, 22px);

            }

            body:has(iframe) .sidebar {
                width: clamp(190px, 16vw, 240px);
            }
        }

        height: 68px;
        font-size: 26px;
        border-radius: 34px;
    }
}
    </style>
</head>

<body>

    <div class="quiz-container">

        <!-- QUESTION -->
        <div class="question" id="question"></div>

        <!-- IMAGE -->
        <div class="image">
            <img id="img">
        </div>
        <div class="options">

            <div class="tf-card true-card" onclick="selectAnswer('T')">

                <div class="hex trueHex">
                    ✔
                </div>

                <div class="tfText">
                    True
                </div>

                <span class="bubble b1"></span>
                <span class="bubble b2"></span>
                <span class="bubble b3"></span>

            </div>


            <div class="tf-card false-card" onclick="selectAnswer('F')">

                <div class="hex falseHex">
                    ✖
                </div>

                <div class="tfText">
                    False
                </div>

                <span class="bubble b1"></span>
                <span class="bubble b2"></span>
                <span class="bubble b3"></span>

            </div>

        </div>
        <div class="nav-buttons">

            <button class="prev" id="prevBtn" onclick="prevQuestion()">
                <i class="fa-solid fa-circle-arrow-left"></i>
                Prev
            </button>

            <button class="next" id="nextBtn" onclick="nextQuestion()" disabled>
                Next
                <i class="fa-solid fa-circle-arrow-right"></i>
            </button>

        </div>
        <!-- Answer Popup -->
        <div id="answerPopup" class="kid-popup">

            <div class="kid-card">

                <div class="kid-icon" id="popupIcon"></div>

                <h3 id="popupTitle"></h3>

                <p id="popupMsg"></p>

            </div>

        </div>

        <!-- Final Popup -->

        <div id="finalPopup">

            <div class="final-kid-box">

                <h2>Congratulations!</h2>

                <p id="finalScore"></p>

                <div id="stars"></div>

                <button class="playAgain-btn" onclick="restartQuiz()">

                    Play Again

                </button>

            </div>

        </div>

        <script>

            /* =========================
               UK SPEECH
            ========================= */
            function speak(text) {

                window.speechSynthesis.cancel();

                const speech =
                    new SpeechSynthesisUtterance(text);

                speech.lang = "en-UK";

                speech.rate = 1;

                speech.pitch = 1;

                speech.volume = 0.25;

                speechSynthesis.speak(speech);

            }

            /* =========================
               QUESTIONS
            ========================= */
            let questions = [

                {
                    q: "Q1. The weather or climate of a place depends on the basis of the temperature there.",
                    img: "../images/tf1.png",
                    correct: "T"
                },

                {
                    q: "Q2. Areas located at high altitudes experience hot climate.",
                    img: "../images/tf2.png",
                    correct: "F"
                },

                {
                    q: "Q3. The flow of air from the sea to the land is known as sea breeze.",
                    img: "../images/tf3.png",
                    correct: "T"
                },

                {
                    q: "Q4. The region closest to the equator falls under the Torrid Zone.",
                    img: "../images/tf4.png",
                    correct: "T"
                },

                {
                    q: "Q5. The Temperate Zone has a very cold climate.",
                    img: "../images/tf5.png",
                    correct: "F"
                }

            ];
            /* =========================
               VARIABLES
            ========================= */

            let current = 0;

            let score = 0;

            let answers = new Array(questions.length).fill(null);
            let quizEnded = false;
            const nextBtn = document.getElementById("nextBtn");

            /* =========================
               LOAD QUESTION
            ========================= */

            function loadQ() {
                const prevBtn = document.getElementById("prevBtn");
                let q = questions[current];
                prevBtn.disabled = (current === 0);
                nextBtn.disabled = (answers[current] === null);
                document.getElementById("question").innerText = q.q;

                document.getElementById("img").src = q.img;
                let cards = document.querySelectorAll(".tf-card");

                cards.forEach(card => {
                    card.classList.remove(
                        "correct-answer",
                        "wrong-answer",
                        "disabled"
                    );
                    card.style.pointerEvents = "auto";
                });

                cards.forEach(card => {

                    card.classList.remove(
                        "correct-answer",
                        "wrong-answer"
                    );

                    card.style.pointerEvents = "auto";

                });

                /* RESTORE */
                if (answers[current] !== null) {

                    cards.forEach(card => {

                        if (card.onclick.toString().includes(answers[current])) {

                            card.classList.add("correct-answer");

                        }

                    });

                    cards.forEach(card => {
                        card.style.pointerEvents = "none";
                    });

                    nextBtn.disabled = false;

                } else {

                    nextBtn.disabled = true;

                }

            }

            /* =========================
               POPUP
            ========================= */
            function showPopup(correct) {

                const popup = document.getElementById("answerPopup");

                const icon = document.getElementById("popupIcon");

                const title = document.getElementById("popupTitle");

                const msg = document.getElementById("popupMsg");

                popup.className = "kid-popup " + (correct ? "kid-correct" : "kid-wrong");

                popup.style.display = "flex";

                if (correct) {

                    icon.innerHTML = "👍";

                    title.innerHTML = "Good";

                    msg.innerHTML = "Correct choice.";

                }

                else {

                    icon.innerHTML = "👎";

                    title.innerHTML = "Retry";

                    msg.innerHTML = "Pick again.";

                }

                setTimeout(() => {

                    popup.style.display = "none";

                }, 1400);

            }
            /* =========================
               SELECT ANSWER
            ========================= */

            function selectAnswer(choice) {

                if (answers[current] !== null) return;

                let correct = questions[current].correct;
                let cards = document.querySelectorAll(".tf-card");

                /* CORRECT */
                if (choice === correct) {

                    confetti({
                        particleCount: 120,
                        spread: 80,
                        origin: { y: 0.6 }
                    });

                    answers[current] = choice;

                    score++;

                    cards.forEach(card => {

                        if (card.onclick.toString().includes(choice)) {

                            card.classList.add("correct-answer");

                        }

                    });
                    cards.forEach(card => {
                        card.classList.add("disabled");
                    });

                    cards.forEach(card => {
                        if (card.onclick.toString().includes(choice)) {
                            card.classList.remove("disabled");
                            card.classList.add("correct-answer");
                        }
                    });

                    showPopup(true);

                    speak("Correct");

                    nextBtn.disabled = false;

                    /* FINAL */
                    if (current === questions.length - 1) {

                        setTimeout(() => {
                            showFinal();
                        }, 1200);

                    }

                }

                /* WRONG */
                else {

                    cards.forEach(card => {

                        if (card.onclick.toString().includes(choice)) {

                            card.classList.add("wrong-answer");

                        }

                    });

                    showPopup(false);

                    speak("Try again");

                    nextBtn.disabled = true;

                }

            }

            /* =========================
               NEXT
            ========================= */
            function nextQuestion() {

                if (quizEnded) return;

                if (current < questions.length - 1) {

                    current++;

                    loadQ();

                }

            }

            /* =========================
               PREV
            ========================= */
            function prevQuestion() {

                if (quizEnded) return;

                if (current > 0) {

                    current--;

                    loadQ();

                }

            }

            /* =========================
               FINAL
            ========================= */
            function showFinal() {

                quizEnded = true;

                document.querySelector(".prev").disabled = true;

                document.querySelector(".next").disabled = true;

                document.getElementById("finalScore").innerHTML =
                    `Your Score: ${score} / ${questions.length}`;

                document.getElementById("stars").innerHTML =
                    "⭐".repeat(score);

                document.getElementById("finalPopup").style.display = "flex";

                bigConfetti();

            }

            /* =========================
               RESTART
            ========================= */
            function restartQuiz() {

                current = 0;
                score = 0;
                quizEnded = false;

                answers = new Array(questions.length).fill(null);

                document.getElementById("finalPopup").style.display = "none";

                document.querySelector(".prev").disabled = false;
                document.querySelector(".next").disabled = true;

                loadQ();
            }
            function bigConfetti() {

                const duration = 100;

                const end = Date.now() + duration;

                (function frame() {

                    confetti({
                        particleCount: 7,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 }
                    });

                    confetti({
                        particleCount: 7,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 }
                    });

                    if (Date.now() < end)
                        requestAnimationFrame(frame);

                })();

            }
            /* =========================
               START
            ========================= */

            window.speechSynthesis.onvoiceschanged = () => {

                loadQ();

            };

        </script>

        <script id="codex-viewport-fit">
            (function () {
                if (window.__codexViewportFit) return;
                window.__codexViewportFit = true;

                const hasIframe = Boolean(document.querySelector("iframe"));
                const selectors = [
                    ".main",
                    ".main-container",
                    ".quiz",
                    ".quiz-container",
                    ".quiz-box",
                    ".container",
                    ".stage",
                    ".screen",
                    ".game",
                    ".template",
                    ".quiz-card",
                    ".app"
                ];
                const minScale = 0.62;
                let rafId = 0;

                function setViewportRules() {
                    document.documentElement.style.width = "100%";
                    document.documentElement.style.height = "100%";
                    document.documentElement.style.overflow = "hidden";
                    document.body.style.width = "100%";
                    document.body.style.height = "100svh";
                    document.body.style.minHeight = "100svh";
                    document.body.style.overflow = "hidden";
                }

                function getStage() {
                    for (const selector of selectors) {
                        const stage = document.querySelector(selector);
                        if (stage) return stage;
                    }
                    return null;
                }

                function fitToViewport() {
                    setViewportRules();
                    if (hasIframe) return;

                    const stage = getStage();
                    if (!stage) return;

                    stage.style.transform = "scale(1)";
                    stage.style.transformOrigin = "center center";

                    const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
                    const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
                    const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
                    const rect = stage.getBoundingClientRect();
                    const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
                    const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
                    const scale = Math.max(
                        minScale,
                        Math.min(
                            1,
                            (viewportWidth - breathingRoom * 2) / contentWidth,
                            (viewportHeight - breathingRoom * 2) / contentHeight
                        )
                    );

                    stage.style.transform = `scale(${scale})`;
                }

                function requestFit() {
                    cancelAnimationFrame(rafId);
                    rafId = requestAnimationFrame(fitToViewport);
                }

                window.addEventListener("load", requestFit);
                window.addEventListener("resize", requestFit);
                window.addEventListener("orientationchange", requestFit);

                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(requestFit).catch(function () { });
                }

                document.querySelectorAll("img").forEach(function (img) {
                    img.addEventListener("load", requestFit, { once: false });
                });

                if ("ResizeObserver" in window) {
                    const observer = new ResizeObserver(requestFit);
                    const observeStage = function () {
                        const stage = getStage();
                        if (stage) observer.observe(stage);
                    };
                    observeStage();
                    window.addEventListener("load", observeStage);
                }

                if (document.body) {
                    new MutationObserver(requestFit).observe(document.body, {
                        childList: true,
                        subtree: true,
                        characterData: true
                    });
                }

                requestFit();
            })();
        </script>
</body>

</html>
