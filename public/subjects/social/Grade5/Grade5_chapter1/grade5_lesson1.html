<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Digital Assessments</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Livvic", sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;

      background-size: cover;
      background-position: center;
    }

    /* =========================
       APP
    ========================== */

    .app {
      display: flex;
      height: 100vh;
      gap: 0;
      padding-left: 20px;
    }

    /* =========================
       SIDEBAR
    ========================== */

    .sidebar {
      width: 250px;
      padding: 0 12px 0 0;
      display: flex;
      align-items: center;

    }

    .nav-container {
      width: 100%;
      height: fit-content;
      max-height: 92vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 12px 0;
    }

    /* =========================
       NAV CARD
    ========================== */

    .island-btn {
      position: relative;

      display: flex;
      align-items: center;
      gap: 18px;

      padding: 18px;

      border-radius: 16px;

      cursor: pointer;

      overflow: hidden;

      background: rgba(219, 218, 218, 0.95);

      border: 2px solid transparent;

      transition: 0.35s ease;

    }

    /* =========================
       ICON
    ========================== */
    .island-icon {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: #fff3e7;
      flex-shrink: 0;
      transition: .35s ease;
    }

    .island-icon i {
      font-size: 25px;
      color: #2f4f4f;
    }

    /* =========================
       TEXT
    ========================== */

    .btn-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .btn-title {
      font-size: 1.08rem;
      font-weight: 600;
      color: #222;
      line-height: 1.3;
    }

    .btn-desc {
      font-size: 0.76rem;
      color: #666;
      margin-top: 4px;
      font-weight: 500;
    }

    /* =========================
       HOVER
    ========================== */

    .island-btn:hover img {
      transform: rotate(-3deg) scale(1.08);
    }

    /* =========================
   ACTIVE (Same for all)
========================== */

    .island-btn.active {
      background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
      border-color: #2E7D32;

    }

    .island-btn.active .island-icon {
      background: linear-gradient(135deg, #66BB6A, #2E7D32);
    }

    .island-btn.active .island-icon i {
      color: #fff;
    }

    .island-btn.active .btn-title {
      color: #1B5E20;
    }

    .island-btn.active .btn-desc {
      color: #2E7D32;
    }

    /* =========================
       SPARKLES
    ========================== */


    .sparkles span:nth-child(1) {
      top: 15%;
      left: 8%;
      animation-delay: 0s;
    }

    .sparkles span:nth-child(2) {
      top: 20%;
      right: 10%;
      animation-delay: 0.8s;
    }

    .sparkles span:nth-child(3) {
      bottom: 18%;
      left: 15%;
      animation-delay: 1.6s;
    }

    @keyframes sparkle {

      0%,
      100% {
        opacity: 0;
        transform: scale(0.6);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    /* =========================
       MAIN
    ========================== */

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      min-width: 0;
      min-height: 0;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      border-radius: 32px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* =========================
       MOBILE MENU BUTTON
    ========================== */

    .menu-btn {
      display: none;
    }

    .offcanvas {
      display: none;
    }

    /* scroll styling */
    .nav-container::-webkit-scrollbar {
      width: 4px;
    }

    .nav-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .nav-container::-webkit-scrollbar-thumb {
      background: #d4dcd4;
      border-radius: 10px;
    }

    /* =========================
       LARGE SCREEN (1066px+)
    ========================== */
    @media (min-width:1066px) {

      body,
      .app {
        height: 100dvh;
      }

      .app {
        min-height: 0;
        padding-left: clamp(10px, 1.4vw, 20px);
      }

      .main {
        min-width: 0;
        min-height: 0;
      }

      .iframe-wrapper {
        min-height: 0;
      }

      .nav-container {
        max-height: 100dvh;
        overflow: hidden;
      }

      .island-btn {
        margin-bottom: clamp(8px, 1.6dvh, 14px);
        padding: clamp(12px, 2dvh, 18px) clamp(14px, 1.4vw, 18px);
      }

      .island-icon {
        width: clamp(44px, 5.5dvh, 50px);
        height: clamp(44px, 5.5dvh, 50px);
        font-size: clamp(20px, 2.8dvh, 25px);
      }

      .btn-title {
        font-size: clamp(0.95rem, 1.1vw, 1.08rem);
      }
    }


    /* =========================
       MOBILE (MAX-WIDTH:1065px)
    ========================== */
    @media(max-width:1065px) {

      .sidebar {
        display: none;
      }

      .menu-btn {
        display: block;
        position: fixed;
        top: 16px;
        right: 16px;
        width: 55px;
        height: 55px;
        border: none;
        border-radius: 50%;
        background: #ff9f43;
        color: white;
        font-size: 30px;
        cursor: pointer;
        z-index: 5000;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.25);
      }

      .offcanvas {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        z-index: 4000;
        backdrop-filter: blur(4px);
      }

      .offcanvas.show {
        display: block;
      }

      .offcanvas-panel {
        position: absolute;
        top: 0;
        right: 0;
        width: 320px;
        height: 100%;
        background: #fff8f0;
        padding: 80px 20px 20px;
        overflow-y: auto;
        transform: translateX(100%);
        transition: 0.3s ease;
        border-radius: 28px 0 0 28px;
      }

      .offcanvas.show .offcanvas-panel {
        transform: translateX(0);
      }

      .offcanvas-panel .island-btn {
        margin-bottom: 18px;
      }

    }

    /* =========================
       SMALL PHONE (MAX-WIDTH:600PX)
    ========================== */
    @media screen and (max-width:600px) {

      body {
        overflow: hidden;
      }

      .menu-btn {
        width: 48px;
        height: 48px;
        top: 12px;
        right: 12px;
        font-size: 24px;
      }

      .offcanvas-panel {
        width: 270px;
        padding: 70px 15px 20px;
        border-radius: 20px 0 0 20px;
      }

      .offcanvas-panel .island-btn {
        padding: 14px;
        gap: 12px;
        margin-bottom: 14px;
        border-radius: 14px;
      }

      .island-icon {
        width: 52px;
        height: 52px;
        border-radius: 16px;
      }

      .island-icon i {
        font-size: 22px;
      }

      .btn-title {
        font-size: 16px;
      }

      .btn-desc {
        font-size: 12px;
        margin-top: 2px;
      }

      .main {
        width: 100%;
        height: 100vh;
      }

      iframe {
        width: 100%;
        height: 100%;
      }

    }

    /* ===== NEW MEDIA QUERIES (from second code) ===== */
    @media (min-width: 900px) and (max-height: 800px) {
      .app {
        transform: scaleY(0.95);
        transform-origin: top center;
        height: calc(100vh / 0.95);
      }
    }

    @media (min-width: 900px) and (max-height: 700px) {
      .app {
        transform: scaleY(0.9);
        transform-origin: top center;
        height: calc(100vh / 0.9);
      }
    }

    @media (min-width: 900px) and (max-height: 600px) {
      .app {
        transform: scaleY(0.85);
        transform-origin: top center;
        height: calc(100vh / 0.85);
      }
    }

    @media (min-width: 900px) and (max-height: 500px) {
      .app {
        transform: scaleY(0.8);
        transform-origin: top center;
        height: calc(100vh / 0.8);
      }
    }

    @media screen and (min-width: 1025px) and (max-width: 1440px) {
      .sidebar {
        width: 280px;
        padding: 0 12px 0 0;
      }
      .island-btn {
        padding: 18px 18px;
        gap: 18px;
      }
      .island-icon {
        width: 50px;
        height: 50px;
      }
      .btn-title {
        font-size: 1.08rem;
      }
    }

    @media screen and (min-width: 1441px) and (max-width: 1920px) {
      .app {
        padding-left: 30px;
      }
      .sidebar {
        width: 370px;
        padding: 0 18px 0 0;
      }
      .island-btn {
        padding: 20px 16px;
        border-radius: 20px;
        gap: 22px;
      }
      .island-icon {
        width: 60px;
        height: 60px;
        border-radius: 26px;
      }
      .island-icon i {
        font-size: 30px;
      }
      .btn-title {
        font-size: 1.25rem;
      }
      .btn-desc {
        font-size: 0.85rem;
      }
    }

    @media screen and (min-width: 1921px) {
      .app {
        padding-left: 40px;
      }
      .sidebar {
        width: 440px;
        padding: 0 24px 0 0;
      }
      .nav-container {
        gap: 22px;
        padding: 20px 0;
      }
      .island-btn {
        padding: 24px 32px;
        border-radius: 24px;
        gap: 28px;
      }
      .island-icon {
        width: 75px;
        height: 75px;
        border-radius: 32px;
      }
      .island-icon i {
        font-size: 38px;
      }
      .btn-title {
        font-size: 1.6rem;
      }
      .btn-desc {
        font-size: 1rem;
      }
      .iframe-wrapper {
        border-radius: 38px;
      }
    }

  </style>

</head>

<body>

  <!-- =========================
       MOBILE BUTTON
  ========================== -->

  <button class="menu-btn" onclick="toggleMenu()">
    ☰
  </button>

  <div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <div class="sidebar">
      <div class="nav-container">

        <!-- BOX 1 -->

        <div class="island-btn active" onclick="openIsland(0)">

          <div class="sparkles">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="island-icon">
            <i class="fas fa-list-check"></i>
          </div>

          <div class="btn-text">
            <span class="btn-title">Correct Options</span>
          </div>

        </div>

        <!-- BOX 2 -->

        <div class="island-btn" onclick="openIsland(1)">

          <div class="sparkles">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="island-icon">
            <i class="fas fa-pencil"></i>
          </div>

          <div class="btn-text">
            <span class="btn-title">Fill In The Blanks</span>
          </div>

        </div>

        <!-- BOX 3 -->

        <div class="island-btn" onclick="openIsland(2)">

          <div class="sparkles">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="island-icon">
            <i class="fas fa-circle-check"></i>
          </div>

          <div class="btn-text">
            <span class="btn-title">True / False</span>
          </div>

        </div>

        <!-- BOX 4 -->

        <div class="island-btn" onclick="openIsland(3)">

          <div class="sparkles">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="island-icon">
            <i class="fas fa-font"></i>
          </div>

          <div class="btn-text">
            <span class="btn-title">One Word</span>
          </div>

        </div>

        <!-- BOX 5 -->

        <div class="island-btn" onclick="openIsland(4)">

          <div class="sparkles">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="island-icon">
            <i class="fas fa-arrows-left-right-to-line"></i>
          </div>

          <div class="btn-text">
            <span class="btn-title">Matching</span>
          </div>
        </div>

      </div>
    </div>

    <!-- =========================
         MAIN
    ========================== -->

    <div class="main">
      <div class="iframe-wrapper">
        <iframe id="contentFrame" src="./exercise/mcq.html">
        </iframe>
      </div>
    </div>

  </div>

  <!-- =========================
       MOBILE MENU
  ========================== -->

  <div class="offcanvas" id="offcanvas" onclick="toggleMenu()">

    <div class="offcanvas-panel" onclick="event.stopPropagation()">

      <div class="island-btn active" onclick="mobileOpen(0)">

        <div class="island-icon">
          <i class="fas fa-list-check"></i>
        </div>
        <div class="btn-text">
          <span class="btn-title">Correct Options</span>
          <span class="btn-desc">MCQ Questions</span>
        </div>
      </div>

      <div class="island-btn" onclick="mobileOpen(1)">
        <div class="island-icon">
          <i class="fas fa-pencil"></i>
        </div>
        <div class="btn-text">
          <span class="btn-title">Fill In The Blanks</span>
          <span class="btn-desc">Complete sentence</span>
        </div>
      </div>

      <div class="island-btn" onclick="mobileOpen(2)">
        <div class="island-icon">
          <i class="fas fa-circle-check"></i>
        </div>
        <div class="btn-text">
          <span class="btn-title">True / False</span>
          <span class="btn-desc">Select answer</span>
        </div>
      </div>

      <div class="island-btn" onclick="mobileOpen(3)">
        <div class="island-icon">
          <i class="fas fa-arrows-left-right-to-line"></i>
        </div>

        <div class="btn-text">
          <span class="btn-title">One Word</span>
          <span class="btn-desc">Answer shortly</span>
        </div>
      </div>


      <div class="island-btn" onclick="mobileOpen(4)">
        <div class="island-icon">
          <i class="fas fa-font"></i>
        </div>
        <div class="btn-text">
          <span class="btn-title">Matching</span>
          <span class="btn-desc">Match correctly</span>
        </div>
      </div>
    </div>

  </div>

  <script>

    const buttons =
      document.querySelectorAll(".sidebar .island-btn");

    const mobileButtons =
      document.querySelectorAll(".offcanvas .island-btn");

    const frame =
      document.getElementById("contentFrame");

    const pages = [
      "./exercise/mcq.html",
      "./exercise/fillintheblanks.html",
      "./exercise/truefalse.html",
      "./exercise/oneexample.html",
      "./exercise/matching.html"

    ];

    function openIsland(index) {

      buttons.forEach(btn =>
        btn.classList.remove("active")
      );

      mobileButtons.forEach(btn =>
        btn.classList.remove("active")
      );

      buttons[index].classList.add("active");
      mobileButtons[index].classList.add("active");

      frame.src = pages[index];
    }

    function toggleMenu() {

      document
        .getElementById("offcanvas")
        .classList.toggle("show");
    }

    function mobileOpen(index) {

      openIsland(index);

      toggleMenu();
    }

  </script>

  <script id="codex-viewport-fit">
    (function () {
      if (window.__codexViewportFit) return;
      window.__codexViewportFit = true;

      const hasIframe = Boolean(document.querySelector("iframe"));
      const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
      ];
      const minScale = 0.62;
      let rafId = 0;

      function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
      }

      function getStage() {
        for (const selector of selectors) {
          const stage = document.querySelector(selector);
          if (stage) return stage;
        }
        return null;
      }

      function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
          minScale,
          Math.min(
            1,
            (viewportWidth - breathingRoom * 2) / contentWidth,
            (viewportHeight - breathingRoom * 2) / contentHeight
          )
        );

        stage.style.transform = `scale(${scale})`;
      }

      function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
      }

      window.addEventListener("load", requestFit);
      window.addEventListener("resize", requestFit);
      window.addEventListener("orientationchange", requestFit);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () { });
      }

      document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
      });

      if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
          const stage = getStage();
          if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
      }

      if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true
        });
      }

      requestFit();
    })();
  </script>
</body>

</html>
