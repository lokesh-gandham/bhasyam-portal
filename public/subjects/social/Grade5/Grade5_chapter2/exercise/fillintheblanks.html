    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.quiz-container {
    width: 1300px;
    padding: 0px 25px 20px;
    border-radius: 30px;
    text-align: center;
}

.question-section {
    margin: 0px 0px;
}

.question-title {
    font-size: 30px;
    color: #2f4f4f;
    font-weight: 400;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    text-align: start;
}

#questionImage {
    width: 230px;
    height: 150px;
    object-fit: contain;
    margin-top: 50px;
}

.answer-slots {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 0;
    margin-top: 20px;
}

.answer-slot {
    width: 50px;
    height: 50px;
    background:#FFFFFF;
    border:3px solid #D6C2F3;
    color:#2f4f4f;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 600;
    
}

.answer-slot.correct {
    background: #e6f8ec;
    border: 3px solid #4caf50;
    color: #2e7d32;
}

.answer-gap {
    width: 15px;
}

.letter-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 10px;
}
.letter-tile{
    width:55px;
    height:55px;
    border-radius:18px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#CDB4F6;          /* Pastel Lavender */
    color:#4A3B66;

    font-size:22px;
    font-weight:700;

    cursor:pointer;
    transition:.2s;

    border:3px solid #FFFFFF;
    box-shadow:0 5px 0 #B39DDB;
}

.letter-tile:hover{
    transform:scale(1.08);
    background:#D8C4FA;
}

.letter-tile:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #B39DDB;
}

.letter-tile.used{
    opacity:.35;
    pointer-events:none;
}


#submitButton {
    margin-top: 15px;
    border-radius: 30px;
    background: linear-gradient(rgb(235, 164, 164), #ff9e9e);
    border: none;
    padding: 13px 40px;
    border-radius: 25px;
    color: white;
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    box-shadow: 0 4px 0 #d38c98;
    border: 3px solid #fff;
    cursor: pointer;
}

#submitButton:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#submitButton:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #d37a44;
}
.nav-buttons{
    margin-top:50px;
    display:flex;
    justify-content:space-between;
}

#prevBtn,
#nextBtn{
    width:150px;
    height:58px;
    border:none;
    border-radius:25px;
    border:3px solid #fff;
    color:#fff;
    font-size:18px;
    font-weight:400;
    font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
    cursor:pointer;
    transition:.15s ease;
}

#prevBtn{
    background:linear-gradient(#86cfe5,#66b6d2);
    box-shadow:0 4px 0 #3e9dbb;
}

#nextBtn{
    background:linear-gradient(#ffc37a,#f7a24f);
    box-shadow:0 4px 0 #e08634;
}

#prevBtn:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 #3e9dbb;
}

#nextBtn:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 #e08634;
}

#prevBtn:disabled,
#nextBtn:disabled{
    opacity:.5;
    cursor:not-allowed;
}
/* POPUP */

.kid-popup {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 3000;
}

.kid-card {
    background: #fff;
    width: 320px;
    padding: 25px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 0 #ffd966, 0 25px 40px rgba(0, 0, 0, 0.2);
    animation: kidPop 0.6s ease;
}

.kid-icon {
    font-size: 4.5em;
    margin-bottom: 10px;
    animation: emojiBounce .9s infinite alternate;
}

.kid-card h3 {
    font-size: 2em;
    margin-bottom: 8px;
}

.kid-card p {
    font-size: 1.2em;
}

.kid-correct .kid-card {
    background: #e6fffa;
    border: 6px solid #38d9a9;
}

.kid-wrong .kid-card {
    background: #fff5f5;
    border: 6px solid #ffa8a8;
}

@keyframes kidPop {
    0% {
        transform: scale(.3) rotate(-10deg);
        opacity: 0
    }

    60% {
        transform: scale(1.1) rotate(5deg)
    }

    100% {
        transform: scale(1) rotate(0);
        opacity: 1
    }
}

@keyframes emojiBounce {
    from {
        transform: translateY(0)
    }

    to {
        transform: translateY(-15px)
    }
}

/* FINAL POPUP */

#finalPopup {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 4000;
}

.final-kid-box {
    background: linear-gradient(135deg, #fff7d6, #e6fff5);
    padding: 30px 35px;
    border-radius: 35px;
    text-align: center;
    width: 450px;
    animation: finalBounce .8s ease;
    box-shadow: 0 20px 0 #ffd43b, 0 30px 50px rgba(0, 0, 0, 0.2);
}

.final-kid-box h2 {
    font-size: 2.2em;
    color: #2f9e44;
    margin-bottom: 10px;
}

.final-kid-box p {
    font-size: 1.3em;
    font-weight: 600;
}

#stars {
    font-size: 2.3em;
    margin: 12px 0;
}

.playAgain-btn {
    background: #ffac30;
    color: white;
    border: none;
    padding: 14px 34px;
    border-radius: 30px;
    font-size: 1.1em;
    cursor: pointer;
    margin-top: 12px;
}

@keyframes finalBounce {
    0% {
        transform: scale(.3);
        opacity: 0
    }

    60% {
        transform: scale(1.15)
    }

    100% {
        transform: scale(1);
        opacity: 1
    }
}

        </div>

    <audio id="correctSound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3"></audio>

        src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

    <script>
       const quizData = [
  {
    q: "Q1. The tribal people of the equatorial region have adapted themselves to ______ life.",
    a: "FOREST",
    img: "../images/forestbackground.png"
  },

  {
    q: "Q2. The equatorial region comprises a multitude of ______ trees.",
    a: "EVERGREEN",
    img: "../images/ftb2.png"
  },

  {
    q: "Q3. The Sun's rays fall ______ throughout the year on the equatorial region.",
    a: "PERPENDICULAR",
    img: "../images/ftb3.png"
  },

  {
    q: "Q4. The tropical region that lies very close to the equator is referred to as the ______ region.",
    a: "EQUATORIAL",
    img: "../images/ftb4.png"
  },

  {
    q: "Q5. The Pygmies are ______ and skilled hunters.",
    a: "NOMADS",
    img: "../images/ftb5.png"
  }
];

let currentQuestionIndex = 0;
let quizScore = 0;

const answeredQuestions = Array(quizData.length).fill(false);
const storedAnswers = Array(quizData.length).fill("");

const questionTitle = document.getElementById("questionTitle");
const questionImage = document.getElementById("questionImage");
const nextButton = document.getElementById("nextBtn");
const previousButton = document.getElementById("prevBtn");
const submitButton = document.getElementById("submitButton");

const answerSlotsContainer = document.getElementById("answerSlots");
const letterContainer = document.getElementById("letterContainer");

let correctAnswer = "";
let letterTiles = [];

function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-UK";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

function smallConfetti() {
  confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
}

function bigConfetti() {
  confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } });
}

function shuffleLetters(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function createAnswerSlots(word) {
  answerSlotsContainer.innerHTML = "";

  for (let i = 0; i < word.length; i++) {
    if (word[i] === " ") {
      // create gap
      const gap = document.createElement("div");
      gap.className = "answer-gap";
      answerSlotsContainer.appendChild(gap);
    } else {
      const slot = document.createElement("div");
      slot.className = "answer-slot";
      slot.dataset.index = i;
      slot.onclick = () => removeLetterFromSlot(slot);
      answerSlotsContainer.appendChild(slot);
    }
  }
}

function removeLetterFromSlot(slot) {
  if (slot.classList.contains("locked")) return;
  const letter = slot.textContent;
  if (!letter) return;
  slot.textContent = "";
  const tile = letterTiles.find(
    (t) => t.textContent === letter && t.classList.contains("used"),
  );

  if (tile) {
    tile.classList.remove("used");
    tile.onclick = () => insertLetterIntoSlot(tile, letter);
  }

  submitButton.disabled = true;
}

function generateLetterTiles(answer) {
  letterContainer.innerHTML = "";
  letterTiles = [];

  let letters = answer.replace(/\s/g, "").split(""); // remove spaces
  shuffleLetters(letters);

  letters.forEach((letter) => {
    const tile = document.createElement("div");

    tile.className = "letter-tile";
    tile.textContent = letter;

    tile.onclick = () => insertLetterIntoSlot(tile, letter);

    letterContainer.appendChild(tile);
    letterTiles.push(tile);
  });
}

function insertLetterIntoSlot(tile, letter) {
  const slots = document.querySelectorAll(".answer-slot");

  const empty = [...slots].find((s) => !s.textContent);

  if (!empty) return;

  empty.textContent = letter;

  tile.classList.add("used");
  tile.onclick = null;

  validateSlotCompletion();
}

function validateSlotCompletion() {
  const slots = document.querySelectorAll(".answer-slot");

  let word = [...slots].map((s) => s.textContent).join("");

  if (word.length === correctAnswer.replace(/\s/g, "").length) {
    submitButton.disabled = false;
  }
}

function removeLastFilledSlot() {
  if (answeredQuestions[currentQuestionIndex]) {
    return;
  }
  const slots = document.querySelectorAll(".answer-slot");

  const filled = [...slots].filter((s) => s.textContent);

  if (filled.length === 0) return;

  const last = filled[filled.length - 1];

  const letter = last.textContent;

  last.textContent = "";

  const tile = letterTiles.find(
    (t) => t.textContent === letter && t.classList.contains("used"),
  );

  if (tile) {
    tile.classList.remove("used");
    tile.onclick = () => insertLetterIntoSlot(tile, letter);
  }

  submitButton.disabled = true;
}

function showPopup(isCorrect) {
  const popup = document.getElementById("answerPopup");
  const icon = document.getElementById("popupIcon");
  const title = document.getElementById("popupTitle");
  const msg = document.getElementById("popupMsg");

  popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
  popup.style.display = "flex";

  if (isCorrect) {
    icon.textContent = "🎉😊";
    title.textContent = "Great Job!";
    msg.textContent = "You got it right!";
  } else {
    icon.textContent = "🥲💭";
    title.textContent = "Oops!";
    msg.textContent = "Try again, you can do it!";
  }

  setTimeout(() => {
    popup.style.display = "none";
  }, 1400);
}

function showFinal() {
  const popup = document.getElementById("finalPopup");
  document.getElementById("finalScore").textContent =
    `Your Score: ${quizScore} / ${quizData.length}`;
  document.getElementById("stars").textContent = "⭐".repeat(quizScore);
  popup.style.display = "flex";
  bigConfetti();
}

function renderQuestion() {
  const question = quizData[currentQuestionIndex];

  questionTitle.textContent = question.q;
  questionImage.src = question.img;

  correctAnswer = question.a.toUpperCase();

  createAnswerSlots(correctAnswer);

  if (answeredQuestions[currentQuestionIndex]) {
    const slots = document.querySelectorAll(".answer-slot");
    const saved = storedAnswers[currentQuestionIndex].split("");

    saved.forEach((letter, i) => {
      slots[i].textContent = letter;
      slots[i].classList.add("locked");
      slots[i].classList.add("correct"); // restore green color
      slots[i].onclick = null; // prevent removing letters
    });
    generateLetterTiles(correctAnswer);

    letterTiles.forEach((tile) => {
      tile.classList.add("used");
      tile.onclick = null;
    });

    submitButton.disabled = true;
    nextButton.disabled = false;
  } else {
    generateLetterTiles(correctAnswer);
    submitButton.disabled = true;
    nextButton.disabled = true;
  }

  previousButton.disabled = currentQuestionIndex === 0;
}

submitButton.onclick = () => {
  const slots = document.querySelectorAll(".answer-slot");

  let guess = [...slots].map((s) => s.textContent).join("");

  if (guess === correctAnswer.replace(/\s/g, "")) {
    quizScore++;

    showPopup(true);
    smallConfetti();
    speak("Correct");

    answeredQuestions[currentQuestionIndex] = true;
    storedAnswers[currentQuestionIndex] = guess;

    slots.forEach((s) => {
      s.classList.add("locked");
      s.classList.add("correct");
      s.onclick = null; // prevents removing letters
    });

    submitButton.disabled = true;
    nextButton.disabled = false;

    if (currentQuestionIndex === quizData.length - 1) {
      setTimeout(showFinal, 1600);
    }
  } else {
    showPopup(false);
    speak("Try again");

    setTimeout(() => {
      slots.forEach((s) => (s.textContent = ""));
      letterTiles.forEach((tile) => {
        tile.classList.remove("used");
        tile.onclick = () => insertLetterIntoSlot(tile, tile.textContent);
      });
      submitButton.disabled = true;
    }, 800);
  }
};

nextButton.onclick = () => {
  currentQuestionIndex++;
  renderQuestion();
};

previousButton.onclick = () => {
  currentQuestionIndex--;
  renderQuestion();
};

document.addEventListener("keydown", (e) => {
  if (answeredQuestions[currentQuestionIndex]) {
    return;
  }

  if (e.key === "Backspace" || e.key === "Delete") {
    removeLastFilledSlot();
  }
});

renderQuestion();

    </script>
<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
