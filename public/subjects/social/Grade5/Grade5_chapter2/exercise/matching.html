<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Center Match Game</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  /* background:linear-gradient(135deg,#ffe4f1,#e0fbff); */
  overflow:hidden;
}

.container{
  width:100%;
  max-width:1000px;
  height:95vh;
  display:flex;
  flex-direction:column;
}

h2{
  text-align:center;
  margin-bottom:10px;
}

/* GAME */
.game{
  flex:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

/* COLUMNS */
.column{
  width:30%;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* CENTER */
.center{
  width:40%;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* ITEMS */
.item{
  padding:12px;
  border-radius:15px;
  background:white;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:60px;
  transition:.3s;
}

.left .item{
  background:#ffe4f1;
  justify-content:flex-start;
  padding-left:15px;
  font-size: 20px;
}

.right .item{
  background:#e0fbff;
   width:300px;
  height:80px;
  font-size: 20px;
}

.item.active{
  border:2px solid #ff6fb5;
}

.item.matched{
  opacity:0.4;
  pointer-events:none;
}

/* LEFT CONTENT ALIGN FIX */
.left-content{
  display:flex;
  align-items:center;
  gap:12px;
}

.img-box{
  width:60px;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.img-box img{
  width:60px;
  height:60px;
  object-fit:contain;
}

/* SLOT */
.slot{
  background:#f8fafc;
  border:2px dashed #94a3b8;
  border-radius:15px;
  height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  gap:8px;
}

.slot.filled{
  border-style:solid;
  border-color:#22c55e;
  background:#ecfdf5;
}

/* SLOT IMAGE */
.slot img{
  width:30px;
  height:30px;
}
#finalPopup{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:4000;
}

.final-kid-box{

    background:linear-gradient(135deg,#fff7d6,#e6fff5);

    padding:30px 35px;

    border-radius:35px;

    text-align:center;

    width:450px;

    animation:finalBounce .8s ease;

    box-shadow:
        0 20px 0 #ffd43b,
        0 30px 50px rgba(0,0,0,.20);

}

.final-kid-box h2{

    font-size:2.2em;

    color:#2f9e44;

    margin-bottom:10px;

}

.final-kid-box p{

    font-size:1.3em;

    font-weight:600;

}

#stars{

    font-size:2.3em;

    margin:12px 0;

}

.playAgain-btn{

    background:#ffac30;

    color:#fff;

    border:none;

    padding:14px 34px;

    border-radius:30px;

    font-size:1.1em;

    cursor:pointer;

    margin-top:12px;

}

.playAgain-btn:active{

    transform:translateY(6px);

}

@keyframes finalBounce{

    0%{
        transform:scale(.3);
        opacity:0;
    }

    60%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

/* MOBILE */
@media(max-width:600px){
  .container{height:100vh;}

  .item{
    font-size:12px;
    padding:8px;
  }

  .img-box{
    width:35px;
    height:35px;
  }

  .img-box img{
    width:28px;
    height:28px;
  }
}

.left .item{

background:#f7f3ed;

border:3px solid #E6C98D;

color:#2F4F4F;

box-shadow:
0 6px 14px rgba(0,0,0,.08);

    justify-content:flex-start;
    padding-left:18px;

    font-size:20px;
    color:#2f4f4f;

}
.right .item{

    width:300px;
    height:90px;

background:#f7f3ed;

border:3px solid #E6C98D;

color:#2F4F4F;

box-shadow:
0 6px 14px rgba(0,0,0,.08);

    justify-content:flex-start;
    padding-left:18px;

    font-size:20px;
    color:#2f4f4f;
}
.item:hover{

    transform:translateY(-5px) scale(1.02);

    filter:brightness(1.03);

}

.item.active{

    border:4px solid #FF9F43;

    box-shadow:
        0 0 0 5px rgba(255,159,67,.18),
        0 10px 25px rgba(255,159,67,.25);

}
.item.matched{

    opacity:.55;

    background:linear-gradient(180deg,#EAFBEF,#D3F8DF);

    border:3px solid #69D08A;

    pointer-events:none;

}
.slot{

    height:80px;

    background:linear-gradient(180deg,#FFFDF6,#FFF6D9);

    border:3px dashed #F3C96A;

    border-radius:22px;

    font-size:19px;

    color:#775500;

    box-shadow:
        0 5px 16px rgba(243,201,106,.18);

}
.slot.filled{

    background:linear-gradient(180deg,#E8FFF2,#D6FAE6);

    border:3px solid #58C97B;

    color:#1D6E3C;

    box-shadow:
        0 6px 18px rgba(88,201,123,.25);

}




/* ========================================
   🖥️ Large Monitor (1441px – 1920px)
======================================== */
@media screen and (min-width:1441px) and (max-width:1920px){

    .container{
        max-width:1450px;
        height:96vh;
    }

    .game{
        gap:45px;
    }

    .column{
        gap:30px;
    }

    .left .item,
    .right .item{
        width:370px;
        height:100px;
        font-size:26px;
    }

    .img-box{
        width:80px;
        height:80px;
    }

    .img-box img{
        width:70px;
        height:70px;
    }

    .center{
        gap:20px;
    }

    .slot{
        height:100px;
        font-size:24px;
    }

    .slot img{
        width:45px;
        height:45px;
    }

    .final-kid-box{
        width:560px;
        padding:40px;
    }

    .final-kid-box h2{
        font-size:2.8rem;
    }

    .final-kid-box p{
        font-size:1.7rem;
    }

    #stars{
        font-size:3rem;
    }

    .playAgain-btn{
        font-size:22px;
        padding:16px 42px;
    }

}


/* ========================================
   📺 4K / Ultra Wide (1921px+)
======================================== */
@media screen and (min-width:1921px){

    .container{
        max-width:1700px;
        height:96vh;
    }

    .game{
        gap:60px;
    }

    .column{
        gap:35px;
    }

    .left .item,
    .right .item{
        width:430px;
        height:115px;
        font-size:30px;
    }

    .img-box{
        width:95px;
        height:95px;
    }

    .img-box img{
        width:82px;
        height:82px;
    }

    .center{
        gap:25px;
    }

    .slot{
        height:115px;
        font-size:28px;
    }

    .slot img{
        width:52px;
        height:52px;
    }

    .final-kid-box{
        width:650px;
        padding:45px;
    }

    .final-kid-box h2{
        font-size:3.2rem;
    }

    .final-kid-box p{
        font-size:2rem;
    }

    #stars{
        font-size:3.5rem;
    }

    .playAgain-btn{
        font-size:24px;
        padding:18px 46px;
    }

}
</style>
<style id="codex-responsive-shell">
html {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    max-width: 100%;
    overflow: hidden;
}

img,
svg,
canvas,
video {
    max-width: 100%;
}

iframe {
    display: block;
    max-width: 100%;
}

body:has(iframe) {
    width: 100%;
    height: 100svh;
    min-height: 100svh;
    overflow: hidden;
}

body:has(iframe) .app,
body:has(iframe) .frame,
body:has(iframe) .board {
    max-width: 100%;
    max-height: 100svh;
    min-height: 0;
}

body:has(iframe) .app {
    height: 100svh;
}

body:has(iframe) .board {
    width: min(1250px, calc(100vw - 16px));
    height: min(570px, calc(100svh - 16px));
}

body:has(iframe) .content,
body:has(iframe) .main,
body:has(iframe) .screen,
body:has(iframe) .iframe-wrapper {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

body:has(iframe) iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

@media (min-width: 1025px) {
    body:has(iframe) .sidebar {
        width: clamp(190px, 17vw, 300px);
        min-width: 0;
        min-height: 0;
    }

    body:has(iframe) .topbar,
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .nav-group {
        flex-shrink: 0;
    }

    body:has(iframe) .nav-container,
    body:has(iframe) .nav-wrapper,
    body:has(iframe) .sidebar-scroll,
    body:has(iframe) .menu {
        max-height: 100svh;
        overflow: hidden;
    }

    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(10px, 2.8vw, 44px);
        padding: clamp(6px, 1.4dvh, 14px) clamp(8px, 1.4vw, 20px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        min-height: 0;
        max-width: 100%;
    }
}

@media (min-width: 1025px) and (max-height: 760px) {
    body:has(iframe) .top-nav,
    body:has(iframe) .top-index,
    body:has(iframe) .bottom-bar,
    body:has(iframe) .topbar,
    body:has(iframe) .nav-group {
        gap: clamp(8px, 2vw, 24px);
        padding-block: clamp(4px, 1dvh, 10px);
    }

    body:has(iframe) .nav-btn,
    body:has(iframe) .puzzle,
    body:has(iframe) .island-btn,
    body:has(iframe) .btn {
        padding: clamp(8px, 1.4dvh, 14px) clamp(10px, 1.4vw, 22px);
        font-size: clamp(15px, 1.2vw, 20px);
    }

    body:has(iframe) .puzzle {
        width: clamp(150px, 14vw, 210px);
        height: clamp(54px, 8dvh, 70px);
    }

    body:has(iframe) .sidebar {
        width: clamp(190px, 16vw, 240px);
    }
}
</style>
</head>

<body>

<div class="container">



<div class="game">

<div class="column left" id="left"></div>
<div class="center" id="center"></div>
<div class="column right" id="right"></div>

</div>
</div>
<div id="finalPopup">
    <div class="final-kid-box">
        <h2>🎉 Congratulations!</h2>

        <p id="finalScore"></p>

        <div id="stars"></div>

        <button class="playAgain-btn" onclick="location.reload()">
            Play Again
        </button>
    </div>
</div>
<script>

function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-UK";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}


window.speechSynthesis.onvoiceschanged = () => {};
const leftData = [
  {
    text: "Milpa",
    match: "e",
    img: "../images/milpa.png"
  },
  {
    text: "Huli",
    match: "c",
    img: "../images/huli.png"
  },
  {
    text: "Sarawak",
    match: "d",
    img: "../images/sarawak.png"
  },
  {
    text: "Amazon lowlands",
    match: "b",
    img: "../images/amazon_lowlands.png"
  },
  {
    text: "Congo basin",
    match: "a",
    img: "../images/congo_basin.png"
  }
];
const rightData = [
  {
    text: "Africa",
    match: "a"
  },
  {
    text: "South America",
    match: "b"
  },
  {
    text: "Tribe",
    match: "c"
  },
  {
    text: "Dense forest",
    match: "d"
  },
  {
    text: "Agricultural method",
    match: "e"
  }
];

let selected=null;
let score=0;

/* CENTER SLOTS */
const center=document.getElementById("center");
leftData.forEach(()=>{
  const slot=document.createElement("div");
  slot.className="slot";
  slot.innerText="Match here";
  center.appendChild(slot);
});

/* LEFT */
const left=document.getElementById("left");
leftData.forEach(item=>{
  const div=document.createElement("div");
  div.className="item";
  div.dataset.match=item.match;

  div.innerHTML=`
    <div class="left-content">
      <div class="img-box">
        <img src="${item.img}">
      </div>
      <span>${item.text}</span>
    </div>
  `;

  div.onclick=()=>{
    if(div.classList.contains("matched")) return;

    document.querySelectorAll(".left .item").forEach(i=>i.classList.remove("active"));
    div.classList.add("active");
    selected=div;
  };

  left.appendChild(div);
});

/* RIGHT */
const right=document.getElementById("right");
rightData.forEach(item=>{
  const div=document.createElement("div");
  div.className="item";
  div.dataset.match=item.match;
  div.innerText=item.text;

  div.onclick=()=>{

    if(!selected){
      speak("Select from left side first");
      return;
    }

    if(div.classList.contains("matched")) return;

    if(selected.dataset.match===div.dataset.match){

      speak("Correct");

      const slots=document.querySelectorAll(".slot");
      const emptySlot=[...slots].find(s=>!s.classList.contains("filled"));

      if(!emptySlot) return;

      emptySlot.innerHTML = `
        <img src="${selected.querySelector('img').src}">
        <span>${selected.innerText} ➜ ${div.innerText}</span>
      `;

      emptySlot.classList.add("filled");

      selected.classList.add("matched");
      div.classList.add("matched");

      selected.classList.remove("active");

      confetti({particleCount:60,spread:70});

      score++;
if(score===leftData.length){

    setTimeout(showFinal,1500);

}   

      selected=null;

    }else{

      speak("Try again");

      div.style.background="#fecaca";
      setTimeout(()=>div.style.background="",300);
    }
  };

  right.appendChild(div);
});
function showFinal(){

    const popup=document.getElementById("finalPopup");

    document.getElementById("finalScore").textContent=
        `Your Score: ${score} / ${leftData.length}`;

    document.getElementById("stars").textContent=
        "⭐".repeat(score);

    popup.style.display="flex";

    confetti({
        particleCount:250,
        spread:120,
        origin:{y:.6}
    });

}

</script>

<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
</body>
</html>
