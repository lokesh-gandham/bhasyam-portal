<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCQ Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Livvic',sans-serif;
font-weight:normal;
}

body{

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:10px;
overflow:hidden;
}

/* MAIN */
.main-container{
width:100%;
max-width:1400px;

border-radius:25px;
padding:20px;
display:flex;
flex-direction:column;
align-items:center;
margin-top: -40px;
}
.question{
    width:100%;
    max-width:1200px;
    min-height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 20px;
    margin:0;
    font-size:30px;
    line-height:1.2;
    color:#2f4f4f;
    text-align:left;
}
.question-img{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:25px 0;
}

.question-img img{
    width:80%;
    max-width:430px;
    height:140px;
    object-fit:contain;
}



.options{
    width:100%;
    display:flex;
    justify-content:center;
    gap:45px;
    flex-wrap:wrap;
    margin:10px 0 30px;
}

/* OPTION BOX */
.option{
width:230px;
height:190px;
border-radius:30px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
transition:0.3s;
padding:15px;
border:3px solid white;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}


/* OPTION IMAGE */
.opt-img{
width:150px;
height:180px;
object-fit:contain;

}

/* OPTION TEXT */
.opt-text{
font-size:20px;
color:#2f4f4f;
text-align:center;
margin-top: -30px;
}

/* CORRECT */
.correct{
background:#b9fbc0 !important;
border:3px solid #38b000;
}
.nav-buttons{
    width:100%;
    max-width:1200px;   /* Same width as the question */
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:-70px;    /* Same as Fill in the Blanks */
    padding:0;
}
.prev,
.next{
    width:150px;
    height:58px;              /* Same fixed height */
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0;                /* Remove vertical padding */
    border-radius:25px;
    border:3px solid #fff;
    color:#fff;
    font-size:18px;
    font-weight:400;
    line-height:1;
    box-sizing:border-box;
}
.prev{
    background:linear-gradient(#86cfe5,#66b6d2);
    box-shadow:0 4px 0 #3e9dbb;
}

.next{
    background:linear-gradient(#ffc37a,#f7a24f);
    box-shadow:0 4px 0 #e08634;
}

.prev:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 #3e9dbb;
}

.next:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 #e08634;
}

.prev:disabled,
.next:disabled{
    opacity:.5;
    cursor:not-allowed;
}

#prevBtn:disabled,
#nextBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* MOBILE */
@media(max-width:768px){

.nav-buttons{
position:static;
transform:none;
display:flex;
justify-content:center;
gap:20px;
margin-top:25px;
pointer-events:auto;
}

.prev,
.next{
position:static;
}

button{
font-size:15px;
padding:10px 18px;
}

}
/*=========================================
        KID POPUP (Correct / Wrong)
=========================================*/

.kid-popup{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:3000;
}

.kid-card{
    background:#ffffff;
    width:320px;
    padding:25px;
    border-radius:30px;
    text-align:center;

    box-shadow:
        0 15px 0 #ffd966,
        0 25px 40px rgba(0,0,0,.2);

    animation:kidPop .6s ease;
}

.kid-icon{
    font-size:4.5em;
    margin-bottom:10px;
    animation:emojiBounce .9s infinite alternate;
}

.kid-card h3{
    font-size:2em;
    font-family:"Livvic";
    margin-bottom:8px;
    font-weight:600;
}

.kid-card p{
    font-size:1.2em;
    font-family:"Livvic";
}


/*=========================================
            CORRECT POPUP
=========================================*/

.kid-correct .kid-card{
    background:#e6fffa;
    border:6px solid #38d9a9;
}

.kid-correct h3{
    color:#2f9e44;
}

.kid-correct p{
    color:#1c7c54;
}


/*=========================================
            WRONG POPUP
=========================================*/

.kid-wrong .kid-card{
    background:#fff5f5;
    border:6px solid #ffa8a8;
}

.kid-wrong h3{
    color:#e03131;
}

.kid-wrong p{
    color:#c92a2a;
}


/*=========================================
            POPUP ANIMATION
=========================================*/

@keyframes kidPop{

    0%{
        transform:scale(.3) rotate(-10deg);
        opacity:0;
    }

    60%{
        transform:scale(1.1) rotate(5deg);
    }

    100%{
        transform:scale(1) rotate(0);
        opacity:1;
    }

}

@keyframes emojiBounce{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-15px);
    }

}


/*=========================================
            FINAL POPUP
=========================================*/

#finalPopup{

    position:fixed;
    inset:0;

    display:none;
    justify-content:center;
    align-items:center;

    z-index:4000;

}

.final-kid-box{

    background:linear-gradient(135deg,#fff7d6,#e6fff5);

    width:450px;

    padding:30px 35px;

    border-radius:35px;

    text-align:center;

    box-shadow:
        0 20px 0 #ffd43b,
        0 30px 50px rgba(0,0,0,.2);

    animation:finalBounce .8s ease;

}

.final-kid-box h2{

    font-size:2.2em;
    color:#2f9e44;
    font-family:"Livvic";

    margin-bottom:10px;

}

.final-kid-box p{

    font-size:1.3em;
    font-weight:600;
    font-family:"Livvic";

}

#stars{

    font-size:2.3em;
    margin:12px 0;

}


/*=========================================
          PLAY AGAIN BUTTON
=========================================*/

.playAgain-btn{

    background:#ffac30;
    color:#fff;

    border:none;

    padding:14px 34px;

    border-radius:30px;

    font-size:1.1em;
    font-family:"Livvic";

    cursor:pointer;

    margin-top:12px;

}

.playAgain-btn:active{

    transform:translateY(6px);
    box-shadow:0 2px 0 #1c7ed6;

}


/*=========================================
          FINAL ANIMATION
=========================================*/

@keyframes finalBounce{

    0%{
        transform:scale(.3);
        opacity:0;
    }

    60%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}


/*=========================================
            TABLETS
=========================================*/

@media(max-width:900px){

    .kid-card{
        width:90%;
        max-width:320px;
    }

    .final-kid-box{
        width:90%;
        max-width:360px;
    }

}


/*=========================================
            MOBILE
=========================================*/

@media(max-width:768px){

    .kid-card{

        width:90%;
        max-width:300px;

        padding:20px;

    }

    .kid-icon{
        font-size:3.2em;
    }

    .kid-card h3{
        font-size:1.6em;
    }

    .kid-card p{
        font-size:1em;
    }

    .final-kid-box{

        width:90%;
        max-width:300px;

        padding:20px;

    }

    .final-kid-box h2{
        font-size:1.6em;
    }

    .final-kid-box p{
        font-size:1.05em;
    }

    #stars{
        font-size:1.8em;
    }

    .playAgain-btn{

        font-size:1em;

        padding:10px 24px;

    }

}


/*=========================================
        SMALL MOBILE
=========================================*/

@media(max-width:480px){

    .kid-card{

        width:260px;
        padding:15px;

    }

    .kid-icon{
        font-size:3em;
    }

    .kid-card h3{
        font-size:1.5em;
    }

    .final-kid-box h2{
        font-size:1.4em;
    }

    #stars{
        font-size:1.5em;
    }

}

.correctBottle .cap{
    animation:capOpen .6s forwards;
}

.correctBottle .water{
    animation:waterSplash .8s forwards;
}

.correctBottle{
    animation:glow 1s infinite alternate;
}
/*====================================================
            MAGIC WATER BOTTLE
====================================================*/

.options{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;

}

/* Bottle Container */

.option.bottle{

position:relative;
width:220px;

    height:280px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;


border:none;

box-shadow:none;

padding:0;

}




/*==============================
        BOTTLE BODY
==============================*/

.bottle-body{

position:relative;

width:200px;

height:170px;

border-radius:28px 28px 38px 38px;

overflow:hidden;

background:

linear-gradient(
180deg,
rgba(255,255,255,.95),
rgba(215,245,255,.88)
);

border:3px solid rgba(255,255,255,.9);

box-shadow:

inset 0 0 18px rgba(255,255,255,.8),

0 12px 30px rgba(0,0,0,.15);

display:flex;

justify-content:center;

align-items:center;

}


.opt-img{

position:relative;

width:160px;

height:150px;

object-fit:contain;

z-index:10;

margin-bottom:25px;

transition:.4s;

}

/*==============================
         TEXT
==============================*/
.opt-text{

margin-top:15px;

font-size:20px;

font-weight:600;

color:#2f4f4f;

text-align:center;

position:relative;

z-index:100;

}
/*==============================
        BUBBLES
==============================*/


/*==============================
        SPLASH
==============================*/

.splash{

position:absolute;

left:50%;

top:-10px;

transform:translateX(-50%);

display:flex;

gap:6px;

opacity:0;

z-index:30;

}

.splash span{

width:8px;

height:25px;

border-radius:20px;

background:#53d8ff;

}


.correctBottle .water{

animation:waterRise .8s forwards;

}

.correctBottle .splash{

animation:splashShow .8s forwards;

}

.correctBottle .opt-img{

animation:imageJump .7s;

}

/*====================================================
            WRONG
====================================================*/

.wrong .bottle-body{


border-color:#ff6b6b;

}
.correctBottle .bottle-body{
    border:3px solid #2ECC71 !important;
    box-shadow:
        0 0 0 4px rgba(46,204,113,.15),
        0 0 18px rgba(46,204,113,.45),
        inset 0 0 18px rgba(255,255,255,.8),
        0 12px 30px rgba(0,0,0,.15);

    background:linear-gradient(
        180deg,
        #ffffff,
        #e9fff1
    );
}
/*====================================================
          ANIMATIONS
====================================================*/



/* =========================================
   🖥️ Large Monitor (1441px - 1920px)
========================================= */
@media screen and (min-width:1541px) and (max-width:1920px){

    .main-container{

    .question{

    }

    .option.bottle{

    }

    .bottle-body{
        width:235px;

    }

    .opt-img{

    }

    .opt-text{

    }

    .nav-buttons{

    }

    .prev,

}


/* =========================================

@media screen and (min-width:1921px){

</style>

</head>

        </div>

    <!-- Bottle 3 -->
    <div class="option bottle" onclick="selectOption(2)">

        <div class="bottle-cap"></div>

        <div class="bottle-neck"></div>

        <div class="bottle-body">

            <div class="glass-shine"></div>

            <div class="water">

                <div class="wave wave1"></div>

            🔄 Play Again
        </button>

<script>
/* =========================
   QUESTIONS
========================= */
let questions = [

{
    q:"Q1. The climate of the equatorial region is hot and ______.",
    qImg:"../images/mcq1.png",
    options:[
        "Cold",
        "Humid",
        "Warm"
    ],
    imgOptions:[
        "../images/cold.png",
        "../images/humidity.png",
        "../images/warm.png"
    ],
    correct:1
},

{
    q:"Q2. The Democratic Republic of Congo is the ______ largest country in Africa.",
    qImg:"../images/mcq2.png",
    options:[
        "Second",
        "First",
        "Third"
    ],
    imgOptions:[
        "../images/second.png",
        "../images/first.png",
        "../images/third.png"
    ],
    correct:0
},

{
    q:"Q3. Shifting cultivation is practised by clearing the ______.",
    qImg:"../images/mcq3.png",
    options:[
        "Rivers",
        "Lakes",
        "Forests"
    ],
    imgOptions:[
        "../images/river.png",
        "../images/lakes.png",
        "../images/forests.png"
    ],
    correct:2
},

{
    q:"Q4. Female members in the equatorial regions are involved in the farms while the male members opt for gathering and ______.",
    qImg:"../images/mcq4.png",
    options:[
        "Hunting",
        "Fishing",
        "Producing"
    ],
    imgOptions:[
        "../images/hunting.png",
        "../images/fishing.png",
        "../images/producing.png"
    ],
    correct:0
},

{
    q:"Q5. ______ and ______ are the staple food of the people of the equatorial region.",
    qImg:"../images/mcq5.png",
    options:[
        "Tea and Coffee",
        "Cassava and Banana",
        "None"
    ],
    imgOptions:[
        "../images/tea_coffee.png",
        "../images/cassava_banana.png",
        "../images/none.png"
    ],
    correct:1
}

];

/* =========================
   VARIABLES
========================= */
const prevBtn = document.querySelector(".prev");
let current=0;

let score=0;
let quizEnded = false;
let answers=new Array(questions.length).fill(null);

const nextBtn=document.getElementById("nextBtn");

/* =========================
   UK TEXT SPEECH
========================= */
function speakText(text){

window.speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang="en-UK";

speech.rate=1;

speech.pitch=1;

speech.volume=0.25;

speechSynthesis.speak(speech);

}
/* =========================
   LOAD QUESTION
========================= */
function loadQuestion(){

    let q = questions[current];
prevBtn.disabled = (current === 0);
    document.getElementById("question").innerText = q.q;
    document.getElementById("qImage").src = q.qImg;

    let options = document.querySelectorAll(".option");

    options.forEach((btn,i)=>{

        btn.querySelector(".opt-text").innerText = q.options[i];
        btn.querySelector(".opt-img").src = q.imgOptions[i];

        /* RESET */

        btn.classList.remove(
            "correct",
            "wrong",
            "correctBottle"
        );

        btn.style.pointerEvents="auto";

        /* RESET CAP */

        btn.querySelector(".bottle-cap").style.transform="";

        /* RESET WATER */

        btn.querySelector(".water").style.height="45%";

        /* RESET SPLASH */

        btn.querySelector(".splash").style.opacity="0";

    });

    if(answers[current]!==null){

        let selected = answers[current];

        if(selected===q.correct){

            options[selected].classList.add("correctBottle");

            options.forEach(btn=>{
                btn.style.pointerEvents="none";
            });

            nextBtn.disabled=false;

        }else{

            options[selected].classList.add("wrong");

            nextBtn.disabled=true;

        }

    }else{

        nextBtn.disabled=true;

    }

}
/* =========================
   SELECT OPTION
========================= */

function selectOption(i){

let q=questions[current];

let options=document.querySelectorAll(".option");

/* STOP MULTIPLE CLICK */
if(answers[current]===q.correct) return;

answers[current]=i;
if (i === q.correct) {

    options[i].classList.add("correctBottle");

    let bottle = options[i];

    bottle.querySelector(".bottle-cap").style.animation =
        "capOpen .6s forwards";

    bottle.querySelector(".water").style.animation =
        "waterRise .7s forwards";

    bottle.querySelector(".splash").style.animation =
        "splashShow .8s forwards";

    confetti({
        particleCount: 40,
        spread: 70,
        origin: { y: 0.7 }
    });

    showPopup(true);
speakText("Correct");
    score++;

    options.forEach(btn => {
        btn.style.pointerEvents = "none";
    });

    nextBtn.disabled = false;

    if (current === questions.length - 1) {

        setTimeout(showFinal, 1600);

    }

}
else {

    options[i].classList.remove("correctBottle");
    options[i].classList.add("wrong");

    showPopup(false);
speakText("Try again");
    setTimeout(() => {

        options[i].classList.remove("wrong");

    }, 600);

    answers[current] = null;

    nextBtn.disabled = true;

}

}
/*=========================================
        POPUP (Correct / Wrong)
=========================================*/

function showPopup(isCorrect) {

    const popup = document.getElementById("answerPopup");
    const icon = document.getElementById("popupIcon");
    const title = document.getElementById("popupTitle");
    const msg = document.getElementById("popupMsg");

    popup.className = "kid-popup " +
        (isCorrect ? "kid-correct" : "kid-wrong");

    popup.style.display = "flex";

    if (isCorrect) {

        icon.textContent = "🎉😊";
        title.textContent = "Great Job!";
        msg.textContent = "You got it right!";

    } else {

        icon.textContent = "🥲💭";
        title.textContent = "Oops!";
        msg.textContent = "Try again, you can do it!";

    }

    setTimeout(() => {

        popup.style.display = "none";

    }, 1400);

}




/*=========================================
        PLAY AGAIN
=========================================*/

function restartQuiz() {

    location.reload();

}

/* =========================
   NEXT QUESTION
========================= */
function nextQuestion(){

    if(quizEnded) return;

    if(current < questions.length-1){
document.querySelectorAll(".option").forEach(bottle=>{

    bottle.classList.remove(
        "correctBottle",
        "wrong"
    );

    bottle.querySelector(".bottle-cap").style.animation="";

    bottle.querySelector(".water").style.animation="";

    bottle.querySelector(".splash").style.animation="";

});
        current++;

        loadQuestion();

    }

}

/* =========================
   PREVIOUS QUESTION
========================= */
function prevQuestion(){

    if(quizEnded) return;

    if(current > 0){
document.querySelectorAll(".option").forEach(bottle=>{

    bottle.classList.remove(
        "correctBottle",
        "wrong"
    );

    bottle.querySelector(".bottle-cap").style.animation="";

    bottle.querySelector(".water").style.animation="";

    bottle.querySelector(".splash").style.animation="";

});
        current--;

        loadQuestion();

    }

}

/*=========================================
        FINAL POPUP
=========================================*/

function showFinal() {

    quizEnded = true;

    prevBtn.disabled = true;
    nextBtn.disabled = true;

    document.getElementById("finalScore").textContent =
        `Your Score: ${score} / ${questions.length}`;

    document.getElementById("stars").textContent =
        "⭐".repeat(score);

    document.getElementById("finalPopup").style.display = "flex";

    confetti({
        particleCount: 60,
        spread: 90,
        origin: { y: 0.7 }
    });

}
/* =========================
   RESTART QUIZ
========================= */
function restartQuiz(){

    current = 0;
    score = 0;
    quizEnded = false;

    answers = new Array(questions.length).fill(null);

    document.getElementById("finalPopup").style.display = "none";

    const prevBtn = document.querySelector(".prev");
    const nextBtn = document.querySelector(".next");

    prevBtn.disabled = false;
    nextBtn.disabled = true;

    prevBtn.style.pointerEvents = "auto";
    nextBtn.style.pointerEvents = "auto";

    prevBtn.style.cursor = "pointer";
    nextBtn.style.cursor = "pointer";

    prevBtn.style.opacity = "1";
    nextBtn.style.opacity = "1";

    loadQuestion();
}
/* =========================
   START QUIZ
========================= */

window.speechSynthesis.onvoiceschanged=()=>{

loadQuestion();

};
</script>
