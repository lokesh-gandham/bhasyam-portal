body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
}

.main-container {
    width: 750px;
    text-align: center;
}

.heading {
    height: 60px;
    width: 100%;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    margin-bottom: 15px;
}

.heading h3 {
    display: inline-block;
    background: linear-gradient(#f7b486, #ef9b63);
    color: white;
    padding: 12px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    box-shadow:
        inset 0 0 0 3px #f7b88e,
        0 2px 10px rgba(0, 0, 0, 0.08);
}

.question h2 {
    font-size: 30px;
    font-weight: 400;
    color: #2f4f4f;
    margin: 10px 0;
    height: 90px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: left;
}

.question p {
    color: #666;
    margin-bottom: 15px;
}

.answer-section {
    display: flex;
    flex-direction: row-reverse;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.left-section {
    text-align: left;
    margin-left: 20px;
}

#hintText {
    font-size: 16px;
    color: #2f4f4f;
    /* margin-left: 5px; */
    text-align: center;
    margin-bottom: 10px;
}

input {
    width: 360px;
    height: 60px;
    padding: 0 15px;
    border-radius: 10px;
    border: 2px solid #49c3f0;
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 15px;
}

#submitBtn {
    display: block;
    margin-inline: auto;
    background:linear-gradient(#6edc8a,#42b96c);
    border: none;
    padding: 10px 45px;
    border-radius: 25px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    background:linear-gradient(#6edc8a,#42b96c);
    border:3px solid #ffffff;
    color:#fff;
    box-shadow:0 4px 0 #2f8f50;
}

#submitBtn:disabled {
      background:linear-gradient(#cfd8dc,#b0bec5);
    box-shadow:0 4px 0 #90a4ae;
    cursor:not-allowed;
    opacity:.8;
}

#submitBtn:active {
    transform:translateY(2px);
    box-shadow:0 2px 0 #2f8f50;
}

input:focus {
    outline: none;
    border: 2px solid #f09861;
    box-shadow: 0 0 6px rgba(240, 152, 97, 0.6);
}

.input-correct {

    font-weight: 500;
    border: 2px solid #4CAF50 !important;
    background: #e8f5e9 !important;
}

.input-wrong {
    animation: wrongBlink .4s ease 2;
}

@keyframes wrongBlink {

    0%,
    100% {
        border-color: rgb(247, 121, 121);
        background: #ffeaea;
    }
}

.right-section img {
    width: 280px;
    height: 280px;
    object-fit: contain;
    margin-right: 25px;
}

/* Wide/short image – show it larger without the tall empty box */
.right-section img[src*="congo1"] {
    width: 520px;
    height: auto;
    max-height: none;
    image-rendering: -webkit-optimize-contrast;
}

.nav-buttons {
    margin-top: 50px;
    display: flex;
    justify-content: space-between;
}

#prevBtn {
    background: linear-gradient(#86cfe5, #66b6d2);
    border: none;
    
     width:150px;
    height:58px;       
    border-radius: 25px;
    color: white;
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    box-shadow: 0 4px 0 #3e9dbb;
    border: 3px solid #fff;
    padding-inline: 0px !important;
}

#nextBtn {
    background: linear-gradient(#ffc37a, #f7a24f);
    border: none;
    
    width: 150px;
     height:58px;       
    border-radius: 25px;
    color: white;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 4px 0 #e08634;
    border: 3px solid #fff;
}

#prevBtn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #3e9dbb;
}

#nextBtn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #e08634;
}

#prevBtn:disabled,
#nextBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.kid-popup {
    position: fixed;
    inset: 0;
    /* background: rgba(255, 255, 255, 0.4); */
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 3000;
}

.kid-card {
    background: #ffffff;
    width: 320px;
    padding: 25px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 0 #ffd966, 0 25px 40px rgba(0, 0, 0, 0.2);
    animation: kidPop 0.6s ease;
}

.kid-icon {
    font-size: 4.5em;
    margin-bottom: 10px;
    animation: emojiBounce 0.9s infinite alternate;
}

.kid-card h3 {
    font-size: 2em;
    font-family: "Livvic";
    margin-bottom: 8px;
}

.kid-card p {
    font-size: 1.2em;
    font-family: "Livvic";
}

/* Correct */
.kid-correct .kid-card {
    background: #e6fffa;
    border: 6px solid #38d9a9;
}

.kid-correct h3 {
    color: #2f9e44;
}

.kid-correct p {
    color: #1c7c54;
}

/* Wrong */
.kid-wrong .kid-card {
    background: #fff5f5;
    border: 6px solid #ffa8a8;
}

.kid-wrong h3 {
    color: #e03131;
}

.kid-wrong p {
    color: #c92a2a;
}

/* Animations */
@keyframes kidPop {
    0% {
        transform: scale(0.3) rotate(-10deg);
        opacity: 0;
    }

    60% {
        transform: scale(1.1) rotate(5deg);
    }

    100% {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

@keyframes emojiBounce {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-15px);
    }
}

#finalPopup {
    position: fixed;
    inset: 0;
    /* background: rgba(255, 255, 255, 0.4); */
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 4000;
}

.final-kid-box {
    background: linear-gradient(135deg, #fff7d6, #e6fff5);
    padding: 30px 35px;
    border-radius: 35px;
    text-align: center;
    width: 450px;
    animation: finalBounce 0.8s ease;
    box-shadow: 0 20px 0 #ffd43b, 0 30px 50px rgba(0, 0, 0, 0.2);
}

.final-kid-box h2 {
    font-size: 2.2em;
    font-family: "Livvic";
    color: #2f9e44;
    margin-bottom: 10px;
}

.final-kid-box p {
    font-size: 1.3em;
    font-family: "Livvic";
    font-weight: 600;
}

#stars {
    font-size: 2.3em;
    margin: 12px 0;
}

/* Play Again Button */
.playAgain-btn {
    background: #ffac30;
    color: white;
    border: none;
    padding: 14px 34px;
    border-radius: 30px;
    font-size: 1.1em;
    font-weight: 400;
    cursor: pointer;
    margin-top: 12px;
}

.playAgain-btn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #1c7ed6;
}

/* Animation */
@keyframes finalBounce {
    0% {
        transform: scale(0.3);
        opacity: 0;
    }

    60% {
        transform: scale(1.15);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

  {
    question: "Q5. It is known for its natural beauty all over the world.",
    answer: "The Equatorial Region",
    image: "../images/equatorialregion-removebg-preview.png"
  }
];
let currentQuestion = 0;
let score = 0;

const answers = new Array(questions.length).fill(null);

const questionText = document.getElementById("questionText");

const image = document.getElementById("questionImage");
const input = document.getElementById("answerInput");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const submitBtn = document.getElementById("submitBtn");
function formatAnswer(text) {
    text = text.trim();
    if (!text) return "";

    const words = text.toLowerCase().split(" ");

    words[0] = words[0].charAt(0).toUpperCase() + words[0].slice(1);

    return words.join(" ");
}
function loadQuestion() {
  const q = questions[currentQuestion];
  questionText.innerText = q.question;
  
  image.src = q.image;
input.value = answers[currentQuestion] || "";

  

  input.disabled = answers[currentQuestion] !== null;

  submitBtn.disabled = answers[currentQuestion] !== null || !input.value.trim();

  input.classList.remove("input-wrong", "input-correct");

  if (answers[currentQuestion] !== null) {
    input.classList.add("input-correct");
  }

  prevBtn.disabled = currentQuestion === 0;
  nextBtn.disabled = answers[currentQuestion] === null;
}
input.addEventListener("input", () => {
    if (answers[currentQuestion] !== null) return;

    const pos = input.selectionStart;

    // Capitalise the first letter of each word, keep the rest exactly as typed
    const result = input.value.replace(
        /(^|\s)(\p{L})/gu,
        (m, sep, ch) => sep + ch.toUpperCase()
    );

    input.value = result;
    input.setSelectionRange(pos, pos);

    submitBtn.disabled = !input.value.trim();
});



input.addEventListener("dragover", (e) => {
  e.preventDefault();
});

input.addEventListener("drop", (e) => {
  e.preventDefault();
});

function speak(t) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = "en-UK";
  msg.volume = 0.25;
  msg.rate = 1;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

function smallConfetti() {
  confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
}

function bigConfetti() {
  confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } });
}

submitBtn.onclick = function () {
  const normalize = (text) =>
    text.toLowerCase().trim().replace(/-/g, " ").replace(/\s+/g, " ");

  const userAnswer = normalize(input.value);
  const correctAnswer = normalize(questions[currentQuestion].answer);

  if (userAnswer === correctAnswer) {
   answers[currentQuestion] = input.value.trim();

    score++;

    input.classList.remove("input-wrong");
    input.classList.add("input-correct");

    speak("Correct");
    showPopup(true);
    smallConfetti();

    loadQuestion();

    if (answers.every((a) => a !== null)) {
      setTimeout(showFinal, 1600);
    }
  } else {
    input.classList.remove("input-correct");
    input.classList.add("input-wrong");

    showPopup(false);
    speak("Try again");

    setTimeout(() => {
      input.classList.remove("input-wrong");
    }, 600);

    input.value = "";
    submitBtn.disabled = true;
  }
};

nextBtn.onclick = function () {
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion();
  }
};

prevBtn.onclick = function () {
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion();
  }
};

function showPopup(isCorrect) {
  const popup = document.getElementById("answerPopup");
  const icon = document.getElementById("popupIcon");
  const title = document.getElementById("popupTitle");
  const msg = document.getElementById("popupMsg");

  popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
  popup.style.display = "flex";

  if (isCorrect) {
    icon.textContent = "🎉😊";
    title.textContent = "Great Job!";
    msg.textContent = "You got it right!";
  } else {
    icon.textContent = "🥲💭";
    title.textContent = "Oops!";
    msg.textContent = "Try again, you can do it!";
  }

  setTimeout(() => {
    popup.style.display = "none";
  }, 1400);
}

function showFinal() {
  const popup = document.getElementById("finalPopup");

  document.getElementById("finalScore").textContent =
    `Your Score: ${score} / ${questions.length}`;

  document.getElementById("stars").textContent = "⭐".repeat(score);

  popup.style.display = "flex";
  bigConfetti();
}

function restartQuiz() {
  location.reload();
}

loadQuestion();

    </script>

<script id="codex-viewport-fit">
(function () {
    if (window.__codexViewportFit) return;
    window.__codexViewportFit = true;

    const hasIframe = Boolean(document.querySelector("iframe"));
    const selectors = [
        ".main",
        ".main-container",
        ".quiz",
        ".quiz-container",
        ".quiz-box",
        ".container",
        ".stage",
        ".screen",
        ".game",
        ".template",
        ".quiz-card",
        ".app"
    ];
    const minScale = 0.62;
    let rafId = 0;

    function setViewportRules() {
        document.documentElement.style.width = "100%";
        document.documentElement.style.height = "100%";
        document.documentElement.style.overflow = "hidden";
        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;
        }
        return null;
    }

    function fitToViewport() {
        setViewportRules();
        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
