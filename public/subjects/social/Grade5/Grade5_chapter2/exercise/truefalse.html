<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>True / False Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Livvic', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* MAIN CONTAINER */

.quiz-container {
    width: 1300px;
    border-radius: 30px;
    padding: 35px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
}

/* QUESTION */

.question-box {
    width: 100%;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: start;
    font-size: 30px;
    color: #2f4f4f;
    font-weight: 500;
}

/* IMAGE */

.question-image {
    display: flex;
    justify-content: center;
    width: 100%;
}

.question-image img {
    width: 300px;
    height: 230px;
    object-fit: contain;/
}

.answers {
    width: 50%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.answer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    height: 80px;
    border-radius: 50px;
    font-size: 26px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    color: white;
    position: relative;
    box-shadow:
        0 8px 0 rgba(0, 0, 0, .15),
        inset 0 0 0 3px rgba(255, 255, 255, .35);

    transition: .25s;
}
.answer.true{
    background:linear-gradient(180deg,#CDEBFF,#8FD3FF);
    color:#1F4E79;

    border:4px solid #FFFFFF;

    box-shadow:
        0 7px 0 #5FB4E6,
        inset 0 0 0 3px rgba(255,255,255,.55);
}

.answer.false{
    background:linear-gradient(180deg,#E6D7FF,#C9A7FF);
    color:#4A2F74;

    border:4px solid #FFFFFF;

    box-shadow:
        0 7px 0 #A882E3,
        inset 0 0 0 3px rgba(255,255,255,.55);
}

.answer.correct {
    background: linear-gradient(180deg, #7ee7c3, #34c38f);
    box-shadow:
        0 8px 0 #2aa876,
        inset 0 0 0 3px rgba(255, 255, 255, .6);
    opacity: 1 !important;
}

.answer.wrong {
    background: linear-gradient(180deg, #ffb3b3, #ff6b6b);
    box-shadow:
        0 8px 0 #e05252,
        inset 0 0 0 3px rgba(255, 255, 255, .6);
    opacity: .55;
}

/* ICON CIRCLE */

.icon-circle {
    
    width:50px;
    height:50px;

    border-radius:50%;

    background:rgba(255,255,255,.55);

    color:#ffffff;

    box-shadow:
        inset 0 2px 5px rgba(0,0,0,.08),
        0 0 0 3px rgba(255,255,255,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    
    font-size: 33px;
    font-weight: 900;
    
}

/* HOVER */
.answer:hover:not(:disabled){

    transform:translateY(-5px) scale(1.03);

    filter:brightness(1.05);

}
.answer:active{

    transform:translateY(4px);

}
.answer.correct{
    background:linear-gradient(#7ee7c3,#34c38f);
}

.answer.wrong{
    background:linear-gradient(#ffb3b3,#ff6b6b);
}

.answer:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* NAV */

.nav {
    width: 100%;
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

.nav button {
    font-weight: 400;
    font-size: 18px;
    width: 150px;
    height: 58px;
    border: none;
   
    border-radius: 25px;
    color: white;
    cursor: pointer;
    border: 3px solid #fff;
}

.prev {
    background: linear-gradient(#86cfe5, #66b6d2);
    box-shadow: 0 4px 0 #3e9dbb;
}

.next {
    background: linear-gradient(#ffc37a, #f7a24f);
    box-shadow: 0 4px 0 #e08634;
}

.prev:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #3e9dbb;
}

.next:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #e08634;
}

.nav button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.kid-popup {
    position: fixed;
    inset: 0;
    /* background: rgba(255, 255, 255, 0.4); */
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 3000;
}

.kid-card {
    background: #ffffff;
    width: 320px;
    padding: 25px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 0 #ffd966, 0 25px 40px rgba(0, 0, 0, 0.2);
    animation: kidPop 0.6s ease;
}

.kid-icon {
    font-size: 4.5em;
    margin-bottom: 10px;
    animation: emojiBounce 0.9s infinite alternate;
}

.kid-card h3 {
    font-size: 2em;
    font-family: "Livvic";
    margin-bottom: 8px;
}

.kid-card p {
    font-size: 1.2em;
    font-family: "Livvic";
}

/* Correct */
.kid-correct .kid-card {
    background: #e6fffa;
    border: 6px solid #38d9a9;
}

.kid-correct h3 {
    color: #2f9e44;
}

.kid-correct p {
    color: #1c7c54;
}

/* Wrong */
.kid-wrong .kid-card {
    background: #fff5f5;
    border: 6px solid #ffa8a8;
}

.kid-wrong h3 {
    color: #e03131;
}

.kid-wrong p {
    color: #c92a2a;
}

/* Animations */
@keyframes kidPop {
    0% {
        transform: scale(0.3) rotate(-10deg);
        opacity: 0;
    }

    60% {
        transform: scale(1.1) rotate(5deg);
    }

    100% {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

@keyframes emojiBounce {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-15px);
    }
}

#finalPopup {
    position: fixed;
    inset: 0;
    /* background: rgba(255, 255, 255, 0.4); */
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 4000;
}

.final-kid-box {
    background: linear-gradient(135deg, #fff7d6, #e6fff5);
    padding: 30px 35px;
    border-radius: 35px;
    text-align: center;
    width: 450px;
    animation: finalBounce 0.8s ease;
    box-shadow: 0 20px 0 #ffd43b, 0 30px 50px rgba(0, 0, 0, 0.2);
}

.final-kid-box h2 {
    font-size: 2.2em;
    font-family: "Livvic";
    color: #2f9e44;
    margin-bottom: 10px;
}

.final-kid-box p {
    font-size: 1.3em;
    font-family: "Livvic";
    font-weight: 600;
}

#stars {
    font-size: 2.3em;
    margin: 12px 0;
}

/* Play Again Button */
.playAgain-btn {
    background: #ffac30;
    color: white;
    border: none;
    padding: 14px 34px;
    border-radius: 30px;
    font-size: 1.1em;
    font-weight: 400;
    cursor: pointer;
    margin-top: 12px;
}

.playAgain-btn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #1c7ed6;
}

/* Animation */
@keyframes finalBounce {
    0% {
        transform: scale(0.3);
        opacity: 0;
    }

    60% {
        transform: scale(1.15);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* RESPONSIVE */

@media(max-width:768px) {

    body {
        overflow: auto;
    }

    .answers {
        grid-template-columns: 1fr;
    }

    .answer {
        height: 80px;
        font-size: 24px;
    }

    .question-image img {
        width: 230px;
        height: 180px;
    }

}

/* FINAL POPUP RESPONSIVE */

@media (max-width:768px) {

    .final-kid-box {
        width: 380px;
        padding: 26px 28px;
        border-radius: 28px;
    }

    .final-kid-box h2 {
        font-size: 1.9em;
    }

    .final-kid-box p {
        font-size: 1.1em;
    }

    #stars {
        font-size: 2em;
    }

    .playAgain-btn {
        padding: 12px 28px;
        font-size: 1em;
    }

}

@media (max-width:480px) {

    body {
        align-items: flex-start;
        padding-top: 65px;
    }

    .question-box {
        font-size: 22px;
    }

    .quiz-container {
        padding: 25px 10px 0px;
    }

    .question-image img {
        width: 200px;
        height: 120px;
        object-fit: contain;/
    }

    .answer {
        font-size: 20px;
    }

    .nav button{
        font-size: 18px;
        padding: 8px 20px;
        width: 120px;
    }

    .kid-card {
        width: 260px;
        padding: 15px;
    }

    .kid-icon {
        font-size: 3em;
    }

    .kid-card h3 {
        font-size: 1.5em;
    }

    .final-kid-box {
        width: 90%;
        max-width: 320px;
        padding: 22px 18px;

    }

    .final-kid-box h2 {
        font-size: 1.6em;
    }

    .final-kid-box p {

    }

    #stars {

    }

<body>

    <div class="quiz-container">
        <div class="question-box" id="question"></div>

        <div class="question-image">
            <img id="questionImg">
        </div>

        <div class="answers">
            <button class="answer true" id="trueBtn">
                <span class="icon-circle" id="trueIcon"></span>
                TRUE
            </button>

            <button class="answer false" id="falseBtn">

            </button>

    <script>
     const questions = [
  {
    q: "Q1. The Congo basin has valuable minerals like tin, copper and diamonds.",
    a: true,
    img: "../images/tf1.png"
  },

  {
    q: "Q2. The tall trees of the equatorial forest form a canopy of leaves at the top.",
    a: true,
    img: "../images/tf2.png"
  },

  {
    q: "Q3. The equatorial region is known for its fertile soil and unfavourable climatic conditions.",
    a: false,
    img: "../images/tf3.png"
  },

  {
    q: "Q4. Due to deforestation, the natural habitat of the animals and birds is being preserved.",
    a: false,
    img: "../images/tf4.png"
  },

  {
    q: "Q5. Heavy rainfall leads to flooding, which destroys people's lives and property.",
    a: true,
    img: "../images/tf5.png"
  }
];

let index = 0;
let score = 0;

const answers = Array(questions.length).fill(null);

const qEl = document.getElementById("question");
const imgEl = document.getElementById("questionImg");

const trueBtn = document.getElementById("trueBtn");
const falseBtn = document.getElementById("falseBtn");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const trueIcon = document.getElementById("trueIcon");
const falseIcon = document.getElementById("falseIcon");

/* RENDER */

function render() {
  qEl.textContent = questions[index].q;
  imgEl.src = questions[index].img;

  trueIcon.innerHTML = "";
  falseIcon.innerHTML = "";

  trueBtn.disabled = false;
  falseBtn.disabled = false;

  trueBtn.classList.remove("correct", "wrong");
  falseBtn.classList.remove("correct", "wrong");

  if (answers[index] !== null) {
    nextBtn.disabled = false;

    if (answers[index] === true) {
      trueIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
      falseIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';

      trueBtn.classList.add("correct");
      falseBtn.classList.add("wrong");
    } else {
      falseIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
      trueIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';

      falseBtn.classList.add("correct");
      trueBtn.classList.add("wrong");
    }

    /* LOCK BUTTONS */
    trueBtn.disabled = true;
    falseBtn.disabled = true;
  } else {
    nextBtn.disabled = true;
  }

  prevBtn.disabled = index === 0;
}

/* SPEECH */

function speak(t) {
  speechSynthesis.cancel();

  const msg = new SpeechSynthesisUtterance(t);

  msg.lang = "en-UK";
  msg.volume = 0.25;

  speechSynthesis.speak(msg);
}

function smallConfetti() {
  confetti({ particleCount: 40, spread: 70, origin: { y: 0.7 } });
}

function bigConfetti() {
  confetti({ particleCount: 60, spread: 90, origin: { y: 0.7 } });
}

/* ANSWER */

function answer(val) {
  if (answers[index] !== null) return;

  if (questions[index].a === val) {
    answers[index] = val;
    score++;

    speak("Correct");
    smallConfetti();
    showPopup(true);

    if (val) {
      trueIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
      falseIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';

      trueBtn.classList.add("correct");
      falseBtn.classList.add("wrong");
    } else {
      falseIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
      trueIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';

      falseBtn.classList.add("correct");
      trueBtn.classList.add("wrong");
    }

    /* LOCK BUTTONS */
    trueBtn.disabled = true;
    falseBtn.disabled = true;

    nextBtn.disabled = false;

    if (index === questions.length - 1) setTimeout(showFinal, 1600);
  } else {
    speak("Try again");
    showPopup(false);
  }
}

trueBtn.onclick = () => answer(true);
falseBtn.onclick = () => answer(false);

/* NAV */

prevBtn.onclick = () => {
  if (index > 0) {
    index--;
    render();
  }
};

nextBtn.onclick = () => {
  if (index < questions.length - 1) {
    index++;
    render();
  }
};

/* POPUP */

function showPopup(isCorrect) {
  const popup = document.getElementById("answerPopup");
  const icon = document.getElementById("popupIcon");
  const title = document.getElementById("popupTitle");
  const msg = document.getElementById("popupMsg");

  popup.className = "kid-popup " + (isCorrect ? "kid-correct" : "kid-wrong");
  popup.style.display = "flex";

  if (isCorrect) {
    icon.textContent = "🎉😊";
    title.textContent = "Great Job!";
    msg.textContent = "You got it right!";
  } else {
    icon.textContent = "🥲💭";
    title.textContent = "Oops!";
    msg.textContent = "Try again, you can do it!";
  }

  setTimeout(() => {
    popup.style.display = "none";
  }, 1400);
}

function showFinal() {
  const popup = document.getElementById("finalPopup");

  document.getElementById("finalScore").textContent =
    `Your Score: ${score} / ${questions.length}`;

  document.getElementById("stars").textContent = "⭐".repeat(score);

  popup.style.display = "flex";
  bigConfetti();
}

render();

    </script>

(function () {

    function setViewportRules() {

        document.body.style.width = "100%";
        document.body.style.height = "100svh";
        document.body.style.minHeight = "100svh";
        document.body.style.overflow = "hidden";
    }

    function getStage() {
        for (const selector of selectors) {
            const stage = document.querySelector(selector);
            if (stage) return stage;

    function fitToViewport() {

        if (hasIframe) return;

        const stage = getStage();
        if (!stage) return;

        stage.style.transform = "scale(1)";
        stage.style.transformOrigin = "center center";

        const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
        const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
        const breathingRoom = Math.max(6, Math.min(18, viewportWidth * 0.012));
        const rect = stage.getBoundingClientRect();
        const contentWidth = Math.max(rect.width, stage.scrollWidth, 1);
        const contentHeight = Math.max(rect.height, stage.scrollHeight, 1);
        const scale = Math.max(
            minScale,
            Math.min(
                1,
                (viewportWidth - breathingRoom * 2) / contentWidth,
                (viewportHeight - breathingRoom * 2) / contentHeight
            )
        );

        stage.style.transform = `scale(${scale})`;
    }

    function requestFit() {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitToViewport);
    }

    window.addEventListener("load", requestFit);
    window.addEventListener("resize", requestFit);
    window.addEventListener("orientationchange", requestFit);

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestFit).catch(function () {});
    }

    document.querySelectorAll("img").forEach(function (img) {
        img.addEventListener("load", requestFit, { once: false });
    });

    if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(requestFit);
        const observeStage = function () {
            const stage = getStage();
            if (stage) observer.observe(stage);
        };
        observeStage();
        window.addEventListener("load", observeStage);
    }

    if (document.body) {
        new MutationObserver(requestFit).observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestFit();
})();
</script>
</body>
